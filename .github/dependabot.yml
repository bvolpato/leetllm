version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: UTC
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    # The iOS image target scanner relies on ts.ScriptTarget, which TypeScript 7 removes.
    ignore:
      - dependency-name: typescript
        versions: ["7.x"]
    groups:
      web-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /videos
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: UTC
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      video-dependencies:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: UTC
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    # Node.js 23 and 25 are end-of-life; leave other major image updates enabled.
    ignore:
      - dependency-name: node
        versions: ["~> 23", "~> 25"]
    groups:
      docker-images:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:45"
      timezone: UTC
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
