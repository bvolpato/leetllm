name: Bug Report
description: Report a bug in the web app, coding practice runner, book pipeline, or iOS app.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a bug! For security issues, please use GitHub Security Advisories instead.
  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      options:
        - Web app / UI
        - Coding practice runner
        - Lesson / Quiz rendering
        - Book PDF build
        - Video / Illustration pipeline
        - iOS / Mac Catalyst app
        - Deployment / Infrastructure
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Go to '...'
        2. Click '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment / URL / Logs
      placeholder: Browser, OS, Node/pnpm version, URL, or exact error output.
