name: Curriculum & Content Improvement
description: Report a technical inaccuracy, broken math/code example, unclear explanation, or missing topic.
title: "[Content]: "
labels: ["content"]
body:
  - type: input
    id: path
    attributes:
      label: Lesson / Blog / Practice URL or Slug
      placeholder: https://leetllm.com/learn/transformer-architecture-end-to-end
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Issue Type
      options:
        - Technical or mathematical inaccuracy
        - Broken runnable code or output mismatch
        - Quiz question or distractor issue
        - Illustration / diagram clarity or theme issue
        - Missing citation or outdated source
        - New topic suggestion
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details & Primary Sources
      description: Describe the issue and include paper/doc links or corrected derivations where applicable.
    validations:
      required: true
