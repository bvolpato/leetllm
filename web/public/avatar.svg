<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="100%" stop-color="#8a2be2" />
    </linearGradient>
  </defs>

  <g filter="url(#glow)">
    <!-- Inner network -->
    <path d="M 256 120 L 160 210 L 200 340 L 312 340 L 352 210 Z" fill="none" stroke="url(#neonGradient)" stroke-width="10" stroke-linejoin="round" />
    <path d="M 256 120 L 256 256 L 200 340" fill="none" stroke="url(#neonGradient)" stroke-width="10" />
    <path d="M 160 210 L 256 256 L 352 210" fill="none" stroke="url(#neonGradient)" stroke-width="10" />
    <path d="M 256 256 L 312 340" fill="none" stroke="url(#neonGradient)" stroke-width="10" />
    
    <!-- Outer brain/tech shape -->
    <path d="M 256 40 L 80 145 L 80 365 L 256 470 L 432 365 L 432 145 Z" fill="none" stroke="url(#neonGradient)" stroke-width="14" stroke-linejoin="round" />
    
    <!-- Connections to outer -->
    <path d="M 256 40 L 256 120" fill="none" stroke="url(#neonGradient)" stroke-width="10" />
    <path d="M 80 145 L 160 210" fill="none" stroke="url(#neonGradient)" stroke-width="10" />
    <path d="M 432 145 L 352 210" fill="none" stroke="url(#neonGradient)" stroke-width="10" />
    <path d="M 80 365 L 200 340" fill="none" stroke="url(#neonGradient)" stroke-width="10" />
    <path d="M 432 365 L 312 340" fill="none" stroke="url(#neonGradient)" stroke-width="10" />
    
    <!-- Nodes -->
    <circle cx="256" cy="120" r="20" fill="#ffffff" />
    <circle cx="160" cy="210" r="20" fill="#ffffff" />
    <circle cx="200" cy="340" r="20" fill="#ffffff" />
    <circle cx="312" cy="340" r="20" fill="#ffffff" />
    <circle cx="352" cy="210" r="20" fill="#ffffff" />
    <circle cx="256" cy="256" r="28" fill="#ffffff" />
    
    <circle cx="256" cy="40" r="16" fill="url(#neonGradient)" />
    <circle cx="80" cy="145" r="16" fill="url(#neonGradient)" />
    <circle cx="432" cy="145" r="16" fill="url(#neonGradient)" />
    <circle cx="80" cy="365" r="16" fill="url(#neonGradient)" />
    <circle cx="432" cy="365" r="16" fill="url(#neonGradient)" />
    <circle cx="256" cy="470" r="16" fill="url(#neonGradient)" />
  </g>
</svg>
