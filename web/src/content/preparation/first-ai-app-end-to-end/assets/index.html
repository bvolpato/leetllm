<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support Triage Classifier &amp; Stream Lab</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 16px/1.5 system-ui, sans-serif; max-width: 44rem; margin: 2.5rem auto; padding: 1rem; }
  label, textarea, button, .row { display: block; margin: 0.75rem 0; }
  textarea, button { font: inherit; }
  textarea { width: 100%; min-height: 6rem; padding: 0.6rem; box-sizing: border-box; }
  button { padding: 0.5rem 1rem; cursor: pointer; }
  .card { border: 1px solid #8884; border-radius: 8px; padding: 1rem; margin-top: 1rem; }
  .bars { margin-top: 0.75rem; }
  .bar-row { display: flex; align-items: center; gap: 0.6rem; margin: 0.35rem 0; font-family: monospace; font-size: 14px; }
  .bar-track { flex: 1; height: 10px; background: #8883; border-radius: 5px; overflow: hidden; }
  .bar-fill { height: 100%; background: #3b82f6; }
  pre { white-space: pre-wrap; margin: 0.5rem 0 0; font-family: monospace; }
</style>
<h1>AI Support Ticket Triage</h1>
<p>Runs a local TF-IDF and logistic regression model behind FastAPI, streams SSE updates, and records traces in SQLite.</p>
<form id="triage-form">
  <label for="ticket">Incident or support message (12-1000 chars)</label>
  <textarea id="ticket" minlength="12" maxlength="1000" required>GPU VRAM exhausted allocating KV cache blocks for 32k context.</textarea>
  <label class="row"><input id="escalate" type="checkbox" checked> Allow fallback routing when confidence &lt; 0.55</label>
  <button id="submit" type="submit">Classify &amp; Stream</button>
</form>
<div class="card">
  <div id="status" role="status" aria-live="polite">Ready.</div>
  <pre id="stream-tokens"></pre>
  <div id="probs" class="bars"></div>
  <p id="trace-line"></p>
  <button id="reload-trace" type="button" hidden>Verify Saved Trace in SQLite</button>
</div>
<script>
  const form = document.querySelector('#triage-form');
  const button = document.querySelector('#submit');
  const statusEl = document.querySelector('#status');
  const tokensEl = document.querySelector('#stream-tokens');
  const probsEl = document.querySelector('#probs');
  const traceEl = document.querySelector('#trace-line');
  const reloadBtn = document.querySelector('#reload-trace');
  let activeTraceId = null;

  function renderProbabilities(probs) {
    probsEl.replaceChildren();
    for (const [label, prob] of Object.entries(probs).sort((a, b) => b[1] - a[1])) {
      const row = document.createElement('div');
      row.className = 'bar-row';
      const nameSpan = document.createElement('span');
      nameSpan.style.width = '8rem';
      nameSpan.textContent = label;
      const track = document.createElement('div');
      track.className = 'bar-track';
      const fill = document.createElement('div');
      fill.className = 'bar-fill';
      fill.style.width = `${Math.round(Number(prob) * 100)}%`;
      track.appendChild(fill);
      const valSpan = document.createElement('span');
      valSpan.textContent = `${(Number(prob) * 100).toFixed(1)}%`;
      row.append(nameSpan, track, valSpan);
      probsEl.appendChild(row);
    }
  }

  reloadBtn.addEventListener('click', async () => {
    if (!activeTraceId) return;
    const res = await fetch(`/v1/traces/${encodeURIComponent(activeTraceId)}`);
    if (!res.ok) {
      traceEl.textContent = `Trace ${activeTraceId}: lookup returned HTTP ${res.status}.`;
      return;
    }
    const row = await res.json();
    traceEl.textContent = `SQLite record: status=${row.status}, route=${row.route}, category=${row.category}, latency=${row.latency_ms}ms.`;
  });

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    if (button.disabled) return;
    button.disabled = true;
    reloadBtn.hidden = true;
    activeTraceId = null;
    tokensEl.textContent = '';
    probsEl.replaceChildren();
    traceEl.textContent = '';
    statusEl.textContent = 'Running local classifier and opening stream...';

    try {
      const response = await fetch('/v1/triage/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          ticket_text: document.querySelector('#ticket').value,
          escalate_if_uncertain: document.querySelector('#escalate').checked,
        }),
      });
      if (!response.ok || !response.body) {
        const err = await response.json().catch(() => ({}));
        statusEl.textContent = `Request stopped (HTTP ${response.status}, ${err.error_code ?? 'error'}).`;
        return;
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let sawTerminal = false;

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const frames = buffer.split('\n\n');
        buffer = frames.pop() ?? '';

        for (const frame of frames) {
          let evtName = 'message';
          let dataLine = '';
          for (const line of frame.split('\n')) {
            if (line.startsWith('event: ')) evtName = line.slice(7).trim();
            if (line.startsWith('data: ')) dataLine += line.slice(6);
          }
          if (!dataLine) continue;
          const payload = JSON.parse(dataLine);

          if (evtName === 'local_signal') {
            activeTraceId = payload.trace_id;
            renderProbabilities(payload.probabilities ?? {});
            reloadBtn.hidden = false;
          } else if (evtName === 'token') {
            tokensEl.textContent += payload.text ?? '';
          } else if (evtName === 'done') {
            sawTerminal = true;
            statusEl.textContent = `Completed: ${payload.category} (${payload.route}, ${(payload.confidence * 100).toFixed(1)}%).`;
            traceEl.textContent = `Trace committed: ${payload.trace_id}`;
          } else if (evtName === 'error') {
            sawTerminal = true;
            statusEl.textContent = `Failed (${payload.error_code}). Trace: ${payload.trace_id}`;
          }
        }
      }

      if (!sawTerminal) {
        statusEl.textContent = 'Stream disconnected before terminal confirmation; check saved trace status.';
      }
    } catch {
      statusEl.textContent = 'Connection lost before stream completion; saved server state may still have finished.';
    } finally {
      button.disabled = false;
    }
  });
</script>
</html>
