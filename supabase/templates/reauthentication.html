<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verification code</title>
</head>

<body
    style="margin: 0; padding: 0; background-color: #131320; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
        style="background-color: #131320; padding: 40px 0;">
        <tr>
            <td align="center">
                <table role="presentation" width="560" cellpadding="0" cellspacing="0"
                    style="max-width: 560px; width: 100%;">

                    <!-- Logo -->
                    <tr>
                        <td align="center" style="padding: 0 0 32px;">
                            <a href="https://leetllm.com" style="text-decoration: none;">
                                <img src="{{LOGO_DATA_URI}}" alt="LeetLLM" width="40" height="40"
                                    style="display: inline-block; vertical-align: middle; border: 0; margin-right: 10px;" />
                                <span
                                    style="font-size: 22px; font-weight: 700; color: #f5f5f5; letter-spacing: -0.3px; vertical-align: middle;">LeetLLM</span>
                            </a>
                        </td>
                    </tr>

                    <!-- Card -->
                    <tr>
                        <td
                            style="background-color: #1e1e35; border-radius: 12px; border: 1px solid rgba(255,255,255,0.06); padding: 48px 40px;">

                            <h1
                                style="margin: 0 0 8px; font-size: 24px; font-weight: 700; color: #f5f5f5; text-align: center;">
                                Verification code
                            </h1>
                            <p
                                style="margin: 0 0 32px; font-size: 15px; color: #9a9ab0; text-align: center; line-height: 1.6;">
                                Enter this code to verify your identity:
                            </p>

                            <!-- OTP Code -->
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                                <tr>
                                    <td align="center" style="padding: 0 0 32px;">
                                        <div
                                            style="display: inline-block; padding: 16px 48px; background-color: #252545; border: 1px solid rgba(124,107,255,0.2); border-radius: 10px;">
                                            <span
                                                style="font-size: 32px; font-weight: 700; color: #7c6bff; letter-spacing: 8px; font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;">
                                                {{ .Token }}
                                            </span>
                                        </div>
                                    </td>
                                </tr>
                            </table>

                            <hr style="border: none; border-top: 1px solid rgba(255,255,255,0.06); margin: 0 0 24px;" />

                            <p
                                style="margin: 0; font-size: 12px; color: #4a4a5e; text-align: center; line-height: 1.6;">
                                🔒 This code is valid for a limited time. If you didn't request this, you can safely
                                ignore this email.
                            </p>

                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td align="center" style="padding: 32px 0 0;">
                            <p style="margin: 0; font-size: 12px; color: #4a4a5e; line-height: 1.6;">
                                © {{ .SiteURL }} &bull; You received this to verify your identity on LeetLLM.
                            </p>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>
</body>

</html>
