version: 1
lesson: boosted-trees
promise: Fit a tree correction, select an alert policy on April, and use jobs at the cutoff to decide whether serving preserves that policy.
framing: []
objectives:
  - id: fit
    can: Fit a correction to delay residuals, compute regularized split gain from gradients and curvatures, and trace two jobs through a shared leaf. Distinguish engine growth and sampling rules.
    scenes:
      - residual
      - classification
      - curvature-split
      - histogram-scan
      - earned-split-transfer
      - engine-growth
      - sampling-categorical
  - id: freeze
    can: Fit on eligible rows, select the round count and exact cutoff on April, and identify jobs whose alerts change when someone copies the rounded cutoff.
    scenes:
      - opening
      - clock
      - eligible-signals
      - rounds
      - selection-contract
      - threshold
      - threshold-boundary
  - id: evaluate
    can: Compare expected costs at a known risk, check a score group against observed outcomes, price changed alerts, and diagnose a slice failure using its support and recall.
    scenes:
      - baseline
      - cost-policy
      - threshold-boundary
      - earned-split-transfer
      - holdout
      - release
      - slice-boundaries
  - id: operate
    can: Calculate local attribution in its stated units, distinguish tree work from request latency, test actions above and at the cutoff, and identify the model digest and capacity evidence a release still needs.
    scenes:
      - attribution-game
      - serving-work
      - receipt-state
