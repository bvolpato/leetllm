      - permission-models
  - heading: The missing permission check in similarity search
    status: taught
    scenes:
      - external-join
      - copy-leak
  - heading: Four ways to gate retrieval
    status: taught
    scenes:
      - permission-models
      - external-join
      - runtime-rls
  - heading: "Where to enforce the gate: trusted filtering vs app-side filtering"
    status: taught
    scenes:
