      - snapshot-clock
  - heading: Isolating customers in shared infrastructure
    status: taught
    scenes:
      - tenant-and-scope
      - tenant-layouts
  - heading: Authorizing graph and report artifacts
    status: taught
    scenes:
      - report-provenance
      - fresh-release
  - heading: "Retrieval control plane: rewrites and external fetch"
    status: taught
    scenes:
      - rewrite-scope
      - external-fetch
  - heading: Agents, output checks, and audit trails
    status: taught
    scenes:
      - verified-token
      - task-hmac
      - draft-reauthorize
      - output-checks
      - audit-receipt
  - heading: Cryptographically verified principals and scoped agent tokens
    status: taught
    scenes:
      - verified-token
      - directory-identity
      - task-hmac
  - heading: When humans should approve retrieval
    status: taught
    scenes:
      - jit-approval
  - heading: Output sanitization
    status: taught
    note: The article's local output checks accept a factual claim with a valid source ID even when its
      meaning is wrong. The final scene tests two fixed replies against one example source sentence.
    scenes:
      - draft-reauthorize
      - output-checks
      - destination-policy
      - fresh-release
  - heading: "Three threat vectors: injection, poisoning, and inversion"
    status: taught
    note: The false desk hours and requested calendar edit illustrate poisoning and indirect injection.
    scenes:
      - threat-surfaces
      - embedding-risk
  - heading: Multi-layer defense-in-depth
    status: taught
    scenes:
      - threat-surfaces
      - draft-reauthorize
      - destination-policy
      - regression-matrix
  - heading: Failures that leak the signing-key runbook
    status: taught
    scenes:
      - grant-paths
      - snapshot-clock
      - regression-matrix
