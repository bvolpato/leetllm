      - copy-leak
  - heading: Metadata-filter implementation
    status: taught
    scenes:
      - typed-policy
      - grant-paths
  - heading: Filtered ANN semantics are backend-specific
    status: taught
    note: The article supplies the 10% match rate and forty candidates. The two scans, fifty-candidate cap
      and three-visit path are worked examples with supplied IDs.
    scenes:
      - ann-backends
      - recall-tradeoff
  - heading: Application-side post-filter implementation (unsafe boundary)
    status: taught
    scenes:
