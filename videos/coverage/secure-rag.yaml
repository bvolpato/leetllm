version: 1
lesson: secure-rag
promise: Decide which passage, report or buffered answer a reader may receive. Trace its complete sources
  through current grants, distinguish a search miss from a denial, and check a replacement against its
  cited passage before sending it.
framing: []
objectives:
  - id: subject-intro
    can: Predict which passage enters the prompt when a verified group changes and both match scores stay fixed.
    scenes:
      - subject-intro
      - transfer
  - id: permission-models
    can: Trace the grant that permits this reader
    scenes:
      - permission-models
  - id: resolve-principal
    can: Resolve tenant and membership from a verified principal
    scenes:
      - resolve-principal
  - id: external-join
    can: Join candidate IDs before exporting text
    scenes:
      - external-join
  - id: filter-before-rank
    can: Authorize candidate identities before exporting their protected text
    scenes:
      - filter-before-rank
  - id: copy-leak
    can: Identify the unauthorized reranker input when two runs return the same permitted passage.
    scenes:
      - copy-leak
  - id: typed-policy
    can: Evaluate the complete local predicate
    scenes:
      - typed-policy
  - id: grant-paths
    can: Remove every grant that still authorizes the row
    scenes:
      - grant-paths
  - id: metadata-receipt
    can: Keep source identity attached to each child
    scenes:
      - metadata-receipt
  - id: runtime-rls
    can: Test the role that actually runs the query
    scenes:
      - runtime-rls
  - id: recall-tradeoff
    can: Find the records returned at scan limits of five, six and seven and measure recall against the exact authorized pair.
    scenes:
      - recall-tradeoff
  - id: ann-backends
    can: Calculate the expected number of matches and distinguish it from the eligible count in one search.
    scenes:
      - ann-backends
  - id: keep-grants-current
    can: Advance all copied chunk permissions in source-version order
    scenes:
      - keep-grants-current
  - id: sync-two-chunks
    can: Identify both stale chunks after a missed revocation and explain why an older replay cannot restore them.
    scenes:
      - sync-two-chunks
  - id: snapshot-clock
    can: Check both exact version and authoritative age
    scenes:
      - snapshot-clock
  - id: tenant-and-scope
    can: Bind a search to its authenticated tenant and document scope
    scenes:
      - tenant-and-scope
  - id: tenant-layouts
    can: Route to the tenant and then check the document
    scenes:
      - tenant-layouts
  - id: report-provenance
    can: Decide which report may enter the map step after a source loses its grant at the same content revision.
    scenes:
      - report-provenance
      - fresh-release
  - id: rewrite-scope
    can: Change the query while retaining its authority
    scenes:
      - rewrite-scope
  - id: external-fetch
    can: Keep external fallback inside the network policy
    scenes:
      - external-fetch
  - id: verified-token
    can: Validate the credential intended for this API
    scenes:
      - verified-token
  - id: directory-identity
    can: Resolve omitted groups without granting them
    scenes:
      - directory-identity
  - id: task-hmac
    can: Bind and consume one retrieval capability
    scenes:
      - task-hmac
  - id: jit-approval
    can: Activate only the grant the task requires
    scenes:
      - jit-approval
  - id: draft-reauthorize
    can: Recheck the complete context before sending
    scenes:
      - draft-reauthorize
  - id: output-checks
    can: Separate privacy, clearance and source support
    scenes:
      - output-checks
  - id: destination-policy
    can: Authorize the recipient and the protected effect
    scenes:
      - destination-policy
  - id: read-vs-action
    can: Separate permission to read from authority to act
    scenes:
      - read-vs-action
  - id: audit-receipt
    can: Record the decision without copying the corpus
    scenes:
      - audit-receipt
  - id: threat-surfaces
    can: Distinguish a false source fact, an instruction in retrieved text and permission to change the calendar.
    scenes:
      - threat-surfaces
  - id: embedding-risk
    can: Treat representations as potentially sensitive
    scenes:
      - embedding-risk
  - id: regression-matrix
    can: Inspect every route a copy can take
    scenes:
      - regression-matrix
  - id: transfer
    can: Explain a missing passage from its read receipt and identify the separate permission needed for a deployment.
    scenes:
      - transfer
  - id: fresh-release
    can: Hold stale or revoked copies, rebuild from current sources and verify an exact quoted reply for its intended reader.
    scenes:
      - fresh-release
sections:
  - heading: Why RAG has a back door
    status: taught
    scenes:
      - subject-intro
      - copy-leak
  - heading: A concrete permission model
    status: taught
    note: The opening uses the supplied 0.94 runbook and 0.71 checklist scores from the four-document figure.
