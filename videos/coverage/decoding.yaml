version: 1
lesson: decoding
promise: Compute and audit autoregressive search and sampling, including completed scores, length
  normalization, temperature, adaptive support, history penalties, constraints, termination and effective
  runtime contracts; choose a policy from controlled task evidence.
framing: []
objectives:
  - id: intro
    can: Choose the more likely first word and set up the products for two competing endings
    scenes:
      - intro
  - id: tree
    can: Compute products and track the changed conditional branch
    scenes:
      - tree
  - id: greedy
    can: Apply deterministic tie breaking to the supplied local argmax
    scenes:
      - greedy
  - id: beam
    can: Expand and rank multiple retained prefixes
    scenes:
      - beam
  - id: status-model
    can: Compute the status-path probabilities and separate likelihood from factual evidence
    scenes:
      - status-model
  - id: pruned-prefix
    can: Compare the best reachable child with a pruned path and explain when two children per parent suffice for width two
    scenes:
      - pruned-prefix
  - id: completed-score
    can: Include EOS in completed likelihood and apply the stated truncated-candidate contract
    scenes:
      - completed-score
  - id: length-objective
    can: Calculate a GNMT normalized score using the declared length convention
    scenes:
      - length-objective
  - id: normalized-stop
    can: Check an early-stop bound against its actual normalized objective
    scenes:
      - normalized-stop
  - id: search-quality
    can: Compare model-score search, held-out task quality and actual serving work
    scenes:
      - search-quality
  - id: temperature
    can: Locate the same supplied draw before and after temperature moves the interval boundaries
    scenes:
      - temperature
  - id: temperature-odds
    can: Compute temperature odds and explain finite eligible-set limits
    scenes:
      - temperature-odds
  - id: temperature-tail
    can: Transform individual probabilities and compute their grouped mass afterward
    scenes:
      - temperature-tail
  - id: stable-eligibility
    can: Apply stable softmax and reject invalid or empty eligible inputs
    scenes:
      - stable-eligibility
  - id: top-k
    can: Retain and normalize an exact-count support
    scenes:
      - top-k
  - id: tie-contract
    can: Distinguish exact-k tie breaking from kth-score threshold retention
    scenes:
      - tie-contract
  - id: nucleus
    can: Include the crossing token in a cumulative support
    scenes:
      - nucleus
  - id: adaptive-support
    can: Compute exact-k, inclusive top-p and min-p supports for different shapes
    scenes:
      - adaptive-support
  - id: minp-relative
    can: Derive the relative cutoff and compare before-temperature and after-temperature support
    scenes:
      - minp-relative
  - id: minp-evidence
    can: Assess a sampler comparison using task scope and matched tuning budgets
    scenes:
      - minp-evidence
  - id: sign-aware
    can: Compute sign-aware repetition adjustments once per distinct history token
    scenes:
      - sign-aware
  - id: centering-order
    can: Diagnose why centering before a sign-aware penalty changes selection
    scenes:
      - centering-order
  - id: count-penalties
    can: Calculate additive frequency and presence adjustments from token counts
    scenes:
      - count-penalties
  - id: ordered-filters
    can: Identify the crossing token for each filter order using the mass that enters the cumulative test
    scenes:
      - ordered-filters
  - id: grammar-first
    can: Trace an empty intersection to the filter that discarded the legal token and distinguish an empty grammar
    scenes:
      - grammar-first
  - id: actual-sampler
    can: Trace the article's penalized logits to a greedy output and locate the seeded draw on the retained distribution
    scenes:
      - actual-sampler
  - id: draw
    can: Locate categorical draws and compare empirical frequencies
    scenes:
      - draw
  - id: stop-contract
    can: Distinguish ending-token, length and stop-string termination with returned-text policy
    scenes:
      - stop-contract
  - id: replay-contract
    can: Diagnose replay differences without equating a seed with identical model computation
    scenes:
      - replay-contract
  - id: hosted-contract
    can: Verify the effective hosted API contract before interpreting a parameter sweep
    scenes:
      - hosted-contract
  - id: evaluation-protocol
    can: Count correct drafts and prompts with a correct draft, and identify the work a selector adds
    scenes:
      - evaluation-protocol
  - id: transfer
    can: Predict when an extra beam slot changes the returned text and which word enters a larger nucleus
    scenes:
      - transfer
      - evaluation-protocol
  - id: fresh-policy
    can: Recompute the nucleus after a hard mask and choose the reportable status from a rollout record
    scenes:
      - fresh-policy
