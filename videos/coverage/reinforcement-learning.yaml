version: 1
lesson: reinforcement-learning
edition: full-directors
narration: videos/full-directors/lessons/reinforcement-learning/narration.json
promise: Formulate a cliff gridworld, calculate and learn useful action values, improve a stochastic policy, and explain how rewards and experience change its route.
objectives:
  - id: connect-choices-to-return
    can: Compute a discounted return and specify the states, actions, transitions, rewards, and discount of a sequential problem.
    scenes: [c01, c02, c03]
  - id: plan-with-a-model
    can: Work backward with Bellman backups, explain value and policy iteration, and compare routes under stochastic transitions.
    scenes: [c04, c05, c06]
  - id: learn-from-transitions
    can: Calculate Q-learning and SARSA targets and distinguish a terminal landing from a collector truncation.
    scenes: [c07, c08]
  - id: shape-useful-experience
    can: Calculate epsilon-greedy action probabilities and diagnose a reward bonus that makes looping more valuable than finishing.
    scenes: [c09]
  - id: improve-action-probabilities
    can: Explain the REINFORCE update, baseline cancellation, and the transfer from rover moves to token actions and group-relative rewards.
    scenes: [c10, c11]
  - id: evaluate-and-transfer
    can: Calculate trajectory importance weights, identify missing action support, and predict how a changed reward or discount alters a route.
    scenes: [c12, c13]
