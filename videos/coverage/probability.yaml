version: 1
lesson: probability
promise: Decide whether a signup review team can handle a detector's flags, explain the risk on a flagged signup, and apply the same conditional reasoning to model scores and token probabilities.
framing:
  - intro
objectives:
  - id: conditional
    can: Count both flag sources, reverse the condition, and explain how a changed prior or a copied flag affects queue risk.
    scenes:
      - population
      - indicator
      - filter
      - conditional
      - bayes
      - prior-shift
      - independence
      - copied-evidence
      - new-batch
  - id: model
    can: Choose a distribution for the outcome, compare candidate rates, check predicted risks against labels, and distinguish an empty event from a mass that rounded to zero.
    scenes:
      - likelihood
      - posterior-contract
      - calibration-check
      - distribution-choice
  - id: tokens
    can: Normalize logits, distinguish decoding rules and calculate stable token likelihood, loss and perplexity.
    scenes:
      - token-chain
      - softmax-sampling
      - log-loss
  - id: decision
    can: Choose a threshold against a fixed number of review slots, count the misses, and recalculate the workload when the clean flag rate changes.
    scenes:
      - decisions
      - payoff
      - new-batch
  - id: sampling
    can: Use sample size and case pairing to judge whether an observed gap in pass rates is large enough to act on.
    scenes:
      - sampling-error
      - rate-gap
