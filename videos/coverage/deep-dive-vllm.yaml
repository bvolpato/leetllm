version: 1
lesson: deep-dive-vllm
promise: Decide how much of a prompt can join an active decode, then use a request trace to find
  where its reader waited and check the admission decision against the available inputs and KV blocks.
objectives:
  - id: intro
    can: Size a prompt slice when one decode is reserved and the prompt has one or two free KV blocks
    scenes:
      - intro
  - id: entry-contract
    can: Distinguish entrypoint convenience from model and version compatibility
    scenes:
      - entry-contract
  - id: fragmentation
    can: Identify internal and external fragmentation from the actual allocation geometry
    scenes:
      - fragmentation
  - id: blocks
    can: Resolve a logical position through its block-table entry and offset
    scenes:
      - blocks
  - id: historical-evidence
    can: State what a historical benchmark establishes and what a current comparison must measure
    scenes:
      - historical-evidence
  - id: process-owners
    can: Calculate the documented online topology and locate the owner of a delay
    scenes:
      - process-owners
  - id: prefix
    can: Compute how a matching full block changes sharing and remaining work
    scenes:
      - prefix
  - id: prefix-limit
    can: Calculate a full-attention APC hit including complete-prompt recomputation
    scenes:
      - prefix-limit
  - id: hash-context
    can: Decide whether a changed adapter path appears in the cache identity for each source revision
    scenes:
      - hash-context
  - id: pool-structures
    can: Trace a cache-hit touch and distinguish live, cached and free state
    scenes:
      - pool-structures
  - id: budget
    can: Separate computed input positions from emitted output tokens in a mixed step
    scenes:
      - budget
  - id: chunk-clock
    can: Predict which reader gets a token sooner when the cap changes on a supplied step clock
    scenes:
      - chunk-clock
  - id: running-preemption
    can: Distinguish active admission, recompute preemption and configured offload
    scenes:
      - running-preemption
  - id: lifetime
    can: Choose the slot a new writer can take by tracing the retiring request's live references
    scenes:
      - lifetime
  - id: queue-order
    can: Derive free-queue ordering from reference and cache state
    scenes:
      - queue-order
  - id: admission
    can: Check whether a proposed slice fits both the remaining token budget and its available KV cells
    scenes:
      - admission
      - fresh-admission
  - id: runner-contract
    can: Identify which state belongs in a scheduler-to-runner handoff
    scenes:
      - runner-contract
  - id: parallel-costs
    can: Compare the resource and communication consequences of the parallel axes
    scenes:
      - parallel-costs
  - id: runner-versions
    can: Separate runner naming, functional platform support and model-specific cache behavior
    scenes:
      - runner-versions
  - id: goodput
    can: Compare passing completions per full measurement window
    scenes:
      - goodput
  - id: goodput-denominator
    can: Calculate a service rate without dropping errors or unfinished requests
    scenes:
      - goodput-denominator
  - id: event-metrics
    can: Distinguish event latency, request mean TPOT and per-request tail ITL
    scenes:
      - event-metrics
  - id: route-security
    can: Find route and network bypasses in an API-key-only deployment
    scenes:
      - route-security
  - id: media-limits
    can: Apply media capabilities and resource limits at the stage they constrain
    scenes:
      - media-limits
  - id: tenant-cache
    can: Explain what an enforced cache namespace changes and what access checks still require
    scenes:
      - tenant-cache
  - id: synthesis
    can: Locate the largest interval and use admission records to explain a specific refusal
    scenes:
      - synthesis
  - id: source-diagnosis
    can: Choose the next observation from the measured delay and ownership boundary
    scenes:
      - source-diagnosis
  - id: project-identity
    can: Identify the project’s source and contribution boundaries
    scenes:
      - project-identity
  - id: fresh-admission
    can: Compare full-prompt proposals under two requested adapters and choose the next observation from an independent first-token trace
    scenes:
      - fresh-admission
