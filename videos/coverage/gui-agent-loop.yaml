  - id: choose-session
    can: Choose a sufficient control surface and admit a restricted session for the read-only inspection.
    scenes:
      - subject-intro
      - session-admission
      - adapter-runtime
  - id: ground-current-target
    can: Convert a point in a padded crop to viewport CSS pixels and resolve a unique actionable tab in the current observation.
    scenes:
      - observe-propose-act
      - observation-representations
      - grounding-coordinates
      - observation-freshness
      - choose-and-measure
  - id: verify-effect
    can: Distinguish a held proposal, a dispatched input and a verified outcome. Use a receipt or a record comparison to decide whether to stop.
    scenes:
      - observation-freshness
      - verify-after-action
      - policy-and-approval
      - choose-and-measure
  - id: enforce-and-evaluate
    can: Apply host policy to each proposed effect and count grounded clicks, completed tasks, forbidden attempts and executed violations separately.
    scenes:
      - adapter-runtime
      - untrusted-observation
      - evaluation-contract
