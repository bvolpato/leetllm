version: 1
lesson: fsdp-zero
promise: Choose a sharding layout to test by counting state on one rank, tracing the live buffers and collectives, and checking throughput and the first update after a restore.
framing: []
objectives:
  - id: intro
    can: Decide whether one rank can load a weight replica, then calculate its share after sharding.
    scenes:
      - intro
  - id: ledger
    can: Compute the replicated toy ledger
    scenes:
      - ledger
  - id: real-ledger
    can: Price the five buffers in the 70B recipe and use the spacing near a weight to predict whether an update survives storage.
    scenes:
      - real-ledger
  - id: weighted-ddp
    can: Recover a pooled-token gradient from unequal local counts
    scenes:
      - weighted-ddp
  - id: zero1
    can: Trace optimizer ownership through stage one
    scenes:
      - zero1
  - id: zero2
    can: Compute stored gradient ownership and reduction output
    scenes:
      - zero2
  - id: zero3
    can: Trace parameter gather and release
    scenes:
      - zero3
  - id: collective-cost
    can: Sum a gradient coordinate, locate its owner and count the ring bytes needed to reconstruct the result on every rank.
    scenes:
      - collective-cost
  - id: lifecycle
    can: Trace full-shard parameter and activation lifetimes
    scenes:
      - lifecycle
  - id: dtype-lifecycle
    can: Price the full local gradient, follow its reduction to a shard and identify when storage can be cleared.
    scenes:
      - dtype-lifecycle
  - id: fsdp2-contract
    can: Design bottom-up sharding and correct optimizer ownership
    scenes:
      - fsdp2-contract
  - id: tradeoff
    can: Compare persistent state and exposed gather time
    scenes:
      - tradeoff
  - id: granularity
    can: Choose a gather boundary and use its launch time to calculate the wait and the weights live together.
    scenes:
      - granularity
  - id: topology-links
    can: Convert network units on matched boundaries
    scenes:
      - topology-links
  - id: hybrid
    can: Use repeated shard IDs to identify the sharing group and price one rank in a hybrid mesh.
    scenes:
      - hybrid
  - id: checkpoint
    can: Diagnose a resume that matches loss but changes the next update
    scenes:
      - checkpoint
  - id: offload
    can: Calculate a transfer lower bound and check runtime composition
    scenes:
      - offload
  - id: mesh
    can: Compute world size and independent sequence batch
    scenes:
      - mesh
  - id: tensor-parallel
    can: Compute partial matrix outputs and their sum
    scenes:
      - tensor-parallel
  - id: pipeline
    can: Calculate activation retention and the idle-time denominator
    scenes:
      - pipeline
  - id: context-parallel
    can: Merge supplied attention blocks with online softmax
    scenes:
      - context-parallel
  - id: profile-contract
    can: Locate the first failed allocation or mismatched collective, then design a memory and timing comparison on the intended workload.
    scenes:
      - profile-contract
  - id: choose
    can: Identify the allocation that pushes a longer sequence over capacity after activation checkpointing.
    scenes:
      - choose
  - id: sizing-transfer
    can: Choose a candidate rank count or ZeRO stage using a per-card capacity limit and a stated joint peak, then specify the measurements needed for a trial.
    scenes:
      - sizing-transfer
