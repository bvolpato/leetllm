version: 1
lesson: training-backpropagation-gradient-descent
promise: Decide which weights should move after a latency miss, use the saved input and ReLU gates to
  compute the update, and verify the result on a fresh forward pass. Diagnose training failures
  and choose a checkpoint using held-out losses.
framing: []
objectives:
  - id: opening
    can: Use the gap between the predicted and measured decode time to choose the direction of correction.
    scenes:
      - opening
  - id: forward
    can: Compute prediction, residual and half-squared loss.
    scenes:
      - forward
  - id: sensitivity
    can: Multiply local sensitivities into parameter gradients.
    scenes:
      - sensitivity
  - id: reverse-mode
    can: Trace shared local rules in reverse topological order.
    scenes:
      - reverse-mode
  - id: one-update
    can: Separate the weight and bias contributions to the new prediction and check the resulting loss.
    scenes:
      - one-update
  - id: gradient-check
    can: Compare analytical derivatives with centered finite differences.
    scenes:
      - gradient-check
  - id: autograd-buffer
    can: Distinguish shared-path sums from accumulation across calls.
    scenes:
      - autograd-buffer
  - id: local-rules
    can: Route dense, ReLU and max-pool gradients through saved forward state.
    scenes:
      - local-rules
  - id: nonlinear-request
    can: Compute forward, backward and an atomic update through a ReLU network.
    scenes:
      - nonlinear-request
  - id: training-loop
    can: Predict how an unused parameter with momentum behaves when its gradient is None or zero, and
      restore both training mode and graph recording after validation.
    scenes:
      - training-loop
  - id: batches
    can: Repair an equal average of unequal chunks and choose the denominator for a masked token mean.
    scenes:
      - batches
  - id: learning-rate
    can: Compute residual stability and separate parameter direction from input sign.
    scenes:
      - learning-rate
  - id: deep-gradients
    can: Trace repeated contraction and expansion and distinguish norm clipping from coordinate clipping
      on the same finite gradient.
    scenes:
      - deep-gradients
  - id: initialization
    can: Derive fan-in scale and distinguish ReLU second moment from variance.
    scenes:
      - initialization
  - id: diagnosis
    can: Locate a failed training transition before changing model capacity.
    scenes:
      - diagnosis
  - id: validation
    can: Choose the saved minimum when a small improvement uses up patience and protect the final test set.
    scenes:
      - validation
  - id: network-transfer
    can: Predict a changed-input nonlinear update using saved path identities.
    scenes:
      - network-transfer
  - id: next-loss
    can: Use a cross-entropy gradient to choose which class logit to raise.
    scenes:
      - next-loss
  - id: signed-request
    can: Identify the active hidden unit after an input changes sign, choose its weight update and
      verify that the new forward pass reduces the miss.
    scenes:
      - nonlinear-request
      - network-transfer
      - signed-request
