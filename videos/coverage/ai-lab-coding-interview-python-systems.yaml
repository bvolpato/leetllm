version: 1
lesson: ai-lab-coding-interview-python-systems
promise: Preserve the explicit state transition as Python systems requirements add URL identity,
  workers, time, graph dependencies, rate admission, idempotency, lock cleanup, parser framing and
  runtime ownership.
objectives:
  - id: opening
    can: Trace how adding a worker changes duplicate claims
    scenes:
      - opening
  - id: contract-loop
    can: Isolate a broken state transition and preserve its regression while extending the contract
    scenes:
      - contract-loop
  - id: state-objects
    can: Assign queue, priority, counts, recency, time and synchronization to appropriate objects
    scenes:
      - state-objects
  - id: frontier
    can: Compute normalized FIFO crawl order
    scenes:
      - frontier
  - id: url-policy
    can: Normalize URL identity and distinguish same origin from destination authorization
    scenes:
      - url-policy
  - id: claim
    can: Place one atomic claim before the slow fetch
    scenes:
      - claim
  - id: claim-failure
    can: Separate duplicate claims, retry state, ordering, quota and cooperative stop
    scenes:
      - claim-failure
  - id: expiry
    can: Evaluate exact TTL equality with injected time
    scenes:
      - expiry
  - id: ttl-reads
    can: Apply one read instant, reserved missing values and consistent deadline replacement
    scenes:
      - ttl-reads
  - id: cas-boundary
    can: Design expiry cleanup, comparison and replacement as one atomic transition
    scenes:
      - cas-boundary
  - id: scheduler
    can: Distinguish retrying, completed, failed and blocked tasks
    scenes:
      - scheduler
  - id: graph-validation
    can: Reject complete-graph failures before effects and apply actual priority tie-breaking
    scenes:
      - graph-validation
  - id: scheduler-workers
    can: Describe a synchronized work claim and completion-publication handoff
    scenes:
      - scheduler-workers
  - id: limiter
    can: Compute refill, admission and denial without spending twice
    scenes:
      - limiter
  - id: bucket-contract
    can: Calculate refill and wait while preserving per-key and idle-cleanup contracts
    scenes:
      - bucket-contract
  - id: ledger
    can: Return the original idempotent result while preserving later balance changes
    scenes:
      - ledger
  - id: ledger-lifetime
    can: Separate cached success, retryable rejection, transaction durability and global key ownership
    scenes:
      - ledger-lifetime
  - id: lock-order
    can: Combine global lock order, duplicate removal and partial-acquisition cleanup
    scenes:
      - lock-order
  - id: parser-state
    can: Trace header and continuation ownership and define a chunk-safe extension
    scenes:
      - parser-state
  - id: concurrency
    can: Choose an execution model from waiting, computation and state ownership
    scenes:
      - concurrency
  - id: worker-runtime
    can: Distinguish optional free threading, isolated serialization and event-loop yielding
    scenes:
      - worker-runtime
  - id: fresh-worker-plan
    can: Calculate a new mixed workload while preserving the single CPU lane
    scenes:
      - fresh-worker-plan
sections:
  - heading: Keep one invariant visible
    status: taught
    scenes:
      - contract-loop
