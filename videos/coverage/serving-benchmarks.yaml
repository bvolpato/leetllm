version: 1
lesson: serving-benchmarks
promise: Decide which offered rate a benchmark supports by checking the arrival schedule, the client’s ordered events, every request outcome, and the stability and uncertainty rules.
framing: []
objectives:
  - id: load
    can: Freeze the workload, choose the arrival clock for a capacity test, and detect when a client cap or a late send changes the offered load.
    scenes:
      - intro
      - workload-freeze
      - arrival-schedule
      - generator-clock
      - rate-and-concurrency
      - arrival-families
      - run-window
  - id: events
    can: Identify which client events support token and chunk timing, including the one-token case.
    scenes:
      - stream-timing
      - single-token
      - chunk-boundaries
      - adapter-contract
  - id: read-deadlines-by-token
    can: Match each observed token to its own playback deadline, identify the first miss and its duration, and explain how earlier arrivals can cover a long gap.
    scenes:
      - stream-timing
      - playback-deadlines
  - id: account
    can: Retain failures through drain, calculate attainment and useful completions per second, and interpret the scorer’s exit code.
    scenes:
      - request-denominator
      - scorer-contract
      - scorer-repair
      - goodput-capacity
      - wrap
      - fresh-receipt
  - id: capacity
    can: Choose the highest tested rate that meets the lag, backlog and attainment rules, then use its uncertainty and quality evidence to justify a conditional replica budget.
    scenes:
      - capacity-sweep
      - replica-budget
      - percentile-populations
      - uncertainty-and-quality
      - confidence-selection
      - quality-provenance
      - fresh-receipt
