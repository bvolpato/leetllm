version: 1
lesson: context-engineering
promise: Build the next incident request from checked records, then decide whether its evidence, budget and trusted receipt support the next task.
framing: []
objectives:
  - id: intro
    can: Match the request and observation time before replacing a causal guess with a scoped negative finding.
    scenes:
      - intro
  - id: capacity-and-evidence
    can: Test position sensitivity with a fixed question and score a two-source question separately.
    scenes:
      - capacity-and-evidence
  - id: failure-interventions
    can: Different symptoms require different edits to the same packet
    scenes:
      - failure-interventions
  - id: write
    can: Store a finding, then reload what is useful
    scenes:
      - write
  - id: verified-note-state
    can: A stored note carries scope and a verifier result
    scenes:
      - verified-note-state
  - id: select
    can: Expose the tools for the current phase
    scenes:
      - select
  - id: phase-intersection
    can: Construct the complete article tool intersection
    scenes:
      - phase-intersection
  - id: prefix-order
    can: Move the changing header behind the reusable prefix
    scenes:
      - prefix-order
  - id: cache-cost-scope
    can: Caching changes repeated work while the same input still occupies capacity
    scenes:
      - cache-cost-scope
  - id: compress
    can: Remove bulk while retaining checked state
    scenes:
      - compress
  - id: prune-cutoff
    can: Replace only old output whose finding is already preserved
    scenes:
      - prune-cutoff
  - id: summary-authority
    can: Compression must preserve uncertainty and pending external state
    scenes:
      - summary-authority
  - id: isolate
    can: Keep a worker's search history outside the lead request and admit a finding only after checking its source.
    scenes:
      - isolate
  - id: strict-handoff
    can: Check the incoming UTF-8 byte count, field contract and authorized source IDs, then compare a claimed status with the cited trace.
    scenes:
      - strict-handoff
  - id: assigned-ledger
    can: Reconstruct all retained allocation terms
    scenes:
      - assigned-ledger
  - id: required-packer
    can: Place protected evidence before optional material
    scenes:
      - required-packer
  - id: packer-limits
    can: A greedy local fit can lose a useful evidence bundle
    scenes:
      - packer-limits
  - id: thrash-budget
    can: Count context work against completed task steps
    scenes:
      - thrash-budget
  - id: skills-disclosure
    can: Load metadata, one procedure and only the needed resource
    scenes:
      - skills-disclosure
  - id: skill-routing-and-safety
    can: Test activation, artifact production and authority separately
    scenes:
      - skill-routing-and-safety
  - id: resume
    can: Bind a resume receipt to its actual inputs
    scenes:
      - resume
  - id: resume-artifacts
    can: Reconstruct five durable objects before choosing work
    scenes:
      - resume-artifacts
  - id: receipt-validation
    can: Validate the entire graph and exact receipt contract
    scenes:
      - receipt-validation
  - id: recovery-and-evaluator
    can: A restart must preserve execution uncertainty and independent checks
    scenes:
      - recovery-and-evaluator
  - id: evaluate
    can: Protect the cases that the average can hide
    scenes:
      - evaluate
  - id: complete-release-gate
    can: Apply all four release conditions to paired outcomes and rerun the decision after repairing the protected case.
    scenes:
      - complete-release-gate
  - id: synthesis
    can: Diagnose a failed archive lookup and recover the source ID that the next request needs.
    scenes:
      - synthesis
  - id: earned-context
    can: Pack required evidence, recheck a changed trace and recover the approval policy before starting the next investigation task.
    scenes:
      - earned-context
