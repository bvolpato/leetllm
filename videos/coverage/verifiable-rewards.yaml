version: 1
lesson: verifiable-rewards
promise: Decide which rollout scores to train on, then trace how changing the checker changes the probability of sampling the same answer again.
framing: []
objectives:
  - id: intro
    can: Predict what a first-box checker pays when a response revises its answer.
    scenes:
      - intro
  - id: alignment-space
    can: Choose the signal separately from the learning loop
    scenes:
      - alignment-space
  - id: contract
    can: Define the verifier's contract
    scenes:
      - contract
  - id: measurement-status
    can: Keep a broken measurement out of the reward vector
    scenes:
      - measurement-status
  - id: check
    can: Verify the reference capacity and distinguish an exact final-field match from checked reasoning.
    scenes:
      - check
  - id: outcome-process
    can: A correct last value does not validate its argument
    scenes:
      - outcome-process
  - id: numeric-parser
    can: Extract one bounded field before comparing exact values
    scenes:
      - numeric-parser
  - id: trusted-execution
    can: Grade actual behavior outside the candidate process
    scenes:
      - trusted-execution
  - id: hidden-cases
    can: Expose the memorized lookup by changing the inputs
    scenes:
      - hidden-cases
  - id: instruction-contract
    can: Count the whole response under the declared constraint
    scenes:
      - instruction-contract
  - id: formal-sql
    can: Own the theorem and preserve query multiplicity
    scenes:
      - formal-sql
  - id: group
    can: Sample answers for the same prompt
    scenes:
      - group
  - id: critic-return
    can: An expectation can differ from one observed continuation
    scenes:
      - critic-return
  - id: grpo
    can: Read each response's signed distance from its group mean and handle zero spread.
    scenes:
      - grpo
  - id: population-group
    can: Construct the mean and population spread from all eight outcomes
    scenes:
      - population-group
  - id: token-surrogate
    can: Choose the smaller signed token product and carry it into the correct response mean.
    scenes:
      - token-surrogate
  - id: kl-value-gradient
    can: Change one logit and explain which derivative a fixed-token KL calculation omits.
    scenes:
      - kl-value-gradient
  - id: sampling-budget
    can: Calculate whether another group is likely to be informative
    scenes:
      - sampling-budget
  - id: trainer-contract
    can: Changing the denominator changes what a token contributes
    scenes:
      - trainer-contract
  - id: update
    can: Follow the probability of sampling either passing response through a normalized four-category update.
    scenes:
      - update
  - id: categorical-step
    can: A zero scalar loss can still move the eight logits
    scenes:
      - categorical-step
  - id: r1-zero-and-metrics
    can: Keep each reported aggregation and report edition attached
    scenes:
      - r1-zero-and-metrics
  - id: r1-pipeline
    can: Follow the actual base checkpoint and supervision through all four stages
    scenes:
      - r1-pipeline
  - id: reported-patterns
    can: An authored backtrack is observable text rather than a tree search
    scenes:
      - reported-patterns
  - id: spurious-rewards
    can: Keep a surprising ablation bounded to its models and setup
    scenes:
      - spurious-rewards
  - id: failure
    can: Find what the checker leaves unmeasured
    scenes:
      - failure
  - id: parser-pressure
    can: Replay both box rules on unchanged submissions and identify which stored scores need to be recomputed.
    scenes:
      - parser-pressure
  - id: reward-priority
    can: Score a wrong boxed answer, a correct plain answer, and a correct boxed answer under both format rules.
    scenes:
      - reward-priority
  - id: evaluate
    can: Test whether the same model answer survives removing one worker or one slot from each worker.
    scenes:
      - evaluate
  - id: capability-gates
    can: The same candidate can improve reasoning and fail release
    scenes:
      - capability-gates
  - id: lab-exactness
    can: Preserve a tiny decimal difference instead of rounding it away
    scenes:
      - lab-exactness
  - id: teacher-transfer
    can: Teacher traces and rewards enter different optimization steps
    scenes:
      - teacher-transfer
  - id: fresh-batch-repair
    can: Retain a measured timeout, quarantine a host loss, and recompute the three remaining advantages after a parser change.
    scenes:
      - fresh-batch-repair
  - id: fresh-step-payoff
    can: Compare two updates from the same uniform policy and explain why the two-box response moves in opposite directions.
    scenes:
      - fresh-step-payoff
