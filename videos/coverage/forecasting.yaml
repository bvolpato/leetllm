version: 1
lesson: forecasting
promise: Use information available at issuance to forecast a cluster's workload, test the forecast and its interval on later days, and decide when a miss calls for a review or an urgent page.
objectives:
  - id: intro
    can: Compare Friday's observed count with its previously issued forecast and frozen review band.
    scenes:
      - intro
  - id: clock-contract
    can: Identify the latest usable count at the forecast origin when a daily report arrives late.
    scenes:
      - clock-contract
  - id: additive-decomposition
    can: Use a level, weekday offset and supplied launch contribution to calculate Friday's predicted volume and remaining error.
    scenes:
      - additive-decomposition
  - id: proportional-seasonality
    can: A changing level changes the choice of seasonal model
    scenes:
      - proportional-seasonality
  - id: seasonal-baseline
    can: Compare tomorrow with the matching day last week
    scenes:
      - seasonal-baseline
  - id: fixed-origin
    can: Test which source rows a seven-row lookup may read at a fixed origin and extend the forecast by repeating the last observed week.
    scenes:
      - fixed-origin
  - id: time-order
    can: Evaluate only after the forecast origin
    scenes:
      - time-order
  - id: sarimax-contract
    can: Difference the regression error that the model defines
    scenes:
      - sarimax-contract
  - id: origin-features
    can: Build every feature from its availability time
    scenes:
      - origin-features
  - id: multi-horizon
    can: Advance a prediction without advancing knowledge
    scenes:
      - multi-horizon
  - id: patch-count
    can: Compute the Transformer sequence before claiming savings
    scenes:
      - patch-count
  - id: foundation-generations
    can: Name the architecture and the dated generation
    scenes:
      - foundation-generations
  - id: errors-and-residuals
    can: Measure the size and direction of misses
    scenes:
      - errors-and-residuals
  - id: quantile-target
    can: Score the same ten-job miss in either direction using the target quantile.
    scenes:
      - quantile-target
  - id: discrete-quantile
    can: Explain why shifting a forecast from ten to a hundred jobs transfers loss between outcomes and why the inverse-CDF P90 selects ten.
    scenes:
      - discrete-quantile
  - id: interval-calibration
    can: Set an error band using earlier forecasts
    scenes:
      - interval-calibration
  - id: normal-error-scale
    can: Estimate the error scale rather than the workload swing
    scenes:
      - normal-error-scale
  - id: finite-conformal
    can: Select the split-conformal rank and decide whether fourteen or nineteen calibration scores can supply a finite 95% half-width.
    scenes:
      - finite-conformal
  - id: online-calibration
    can: Wait for the outcome before changing the next interval
    scenes:
      - online-calibration
  - id: alert-receipt
    can: Reconstruct Friday's source, policy cutoff, origin and observation, then route the same planned launch with and without evidence of urgent capacity impact.
    scenes:
      - alert-receipt
  - id: review-volume
    can: A crossing, state transition and delivery are different events
    scenes:
      - review-volume
  - id: alert-state
    can: Run the two-breach and two-clean policy and carry the alert state across a missing observation.
    scenes:
      - alert-state
  - id: state-trace
    can: Identify the breach that interrupts a clean run and determine when the eight-check stream clears.
    scenes:
      - state-trace
  - id: joint-detector
    can: Project the same pair and expose the blind spot
    scenes:
      - joint-detector
  - id: alert-usefulness
    can: Measure alert usefulness after outcomes arrive
    scenes:
      - alert-usefulness
  - id: telemetry-identity
    can: Repair the input before relearning the spike
    scenes:
      - telemetry-identity
  - id: fixture-gates
    can: A complete record still has a limited claim
    scenes:
      - fixture-gates
  - id: later-policy-check
    can: Identify the additional review caused by a narrower inclusive band and decide what evidence would justify that review.
    scenes:
      - later-policy-check
  - id: wrap
    can: Recover the one-day forecast, later-week coverage, launch slice and pending action from Friday's record.
    scenes:
      - wrap
  - id: fresh-state
    can: Predict when a fresh five-minute stream opens and clears a review, and identify what would establish notification delivery.
    scenes:
      - fresh-state
