version: 1
lesson: persistent-memory
promise: Decide which billing records belong in a returning developer’s prompt and what evidence permits a crashed workflow to resume.
framing:
  - subject-intro
  - return-session
objectives:
  - id: rebuild-a-prompt
    can: Rebuild a call from a retained event, a current scoped preference and a bounded message window.
    scenes:
      - subject-intro
      - context-and-memory
      - sliding-window
      - return-session
  - id: select-a-replay
    can: Exclude private and obsolete records, then explain how age can reverse the order of two eligible wording matches.
    scenes:
      - scope-and-provenance
      - retrieval-ranking
      - tenant-boundary
  - id: keep-source-lineage
    can: Decide which memory writes to admit and which derived records can still be read after compression, correction, deletion or loss of access.
    scenes:
      - paging-and-admission
      - supersession-and-revocation
      - compression-lineage
      - return-session
  - id: reconcile-a-merge
    can: Use the pending key, a destination receipt and current authorization to choose a recovery step after a lost reply.
    scenes:
      - memory-and-execution-state
      - return-session
