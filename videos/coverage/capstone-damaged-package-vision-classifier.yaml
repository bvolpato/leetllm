version: 1
lesson: capstone-damaged-package-vision-classifier
promise: Build and audit a quality-first parcel-photo review policy, compute its image-statistic and
  head-learning mechanisms, select a development operating point and join dated physical-case outcomes without
  confusing synthetic contract checks with measured model evidence.
framing: []
objectives:
  - id: intro
    can: Choose between the dark 0.94 carton and the torn 0.83 mailer using their quality readings and the review cutoff
    scenes:
      - intro
  - id: evidence-contract
    can: Distinguish a routing prototype from model and claim evidence
    scenes:
      - evidence-contract
  - id: labels
    can: Define the observable external-damage label and preserve unknown states
    scenes:
      - labels
  - id: groups
    can: Keep alternate parcel views in one evaluation group
    scenes:
      - groups
  - id: manifest-identity
    can: Count cases within each split, quarantine a parcel photographed on both sides of day 10, and exclude its day-14 label
    scenes:
      - manifest-identity
  - id: typed-inputs
    can: Reject malformed records while keeping human labels outside routing
    scenes:
      - typed-inputs
  - id: quality
    can: Identify an unsafe priority route when only the reported brightness changes, and distinguish it from a missing parcel
    scenes:
      - quality
  - id: focus-stencil
    can: Slide a four-neighbor Laplacian across an edge and compute the population variance of the nine interior responses
    scenes:
      - focus-stencil
  - id: contrast-intervention
    can: Predict how contrast scales variance without moving the edge
    scenes:
      - contrast-intervention
  - id: exposure-detail
    can: Compute retained detail and separate image intensity from calibrated illumination
    scenes:
      - exposure-detail
  - id: ordered-router
    can: Route a numeric sample at the three equality boundaries and reject a Boolean damage score before routing
    scenes:
      - ordered-router
  - id: threshold
    can: Separate a quality-accepted queue action from a damage confirmation
    scenes:
      - threshold
  - id: development-threshold
    can: Choose among three validation thresholds by counting recovered damaged cases and occupied review slots
    scenes:
      - development-threshold
  - id: preprocess
    can: Locate the torn corner in the source image and determine whether the 224-pixel crop retains it
    scenes:
      - preprocess
  - id: transform-bundle
    can: Bind transformed pixels and weights to the evaluated model policy
    scenes:
      - transform-bundle
  - id: representation-choice
    can: Compare frozen and fine-tuned representations under the same case evidence
    scenes:
      - representation-choice
  - id: head-forward
    can: Compute a supplied feature-to-logit-to-loss prediction
    scenes:
      - head-forward
  - id: head-update
    can: Use each feature and the bias multiplier to predict the signed parameter update, then recompute the logit on the same input
    scenes:
      - head-update
  - id: masked-categories
    can: Select the two assessed defect labels for mean loss and exclude the unassessed entry from the gradient
    scenes:
      - masked-categories
  - id: calibration-quality
    can: Separate probability calibration from threshold and quality-stage evaluation
    scenes:
      - calibration-quality
  - id: bundle-replay
    can: Compare an edited trace with the saved inputs and threshold that produced the original R-408 route
    scenes:
      - bundle-replay
  - id: outcomes
    can: Count one physical parcel per mature specialist judgment
    scenes:
      - outcomes
  - id: outcome-clock
    can: Select a matching dated outcome without rewriting the original route
    scenes:
      - outcome-clock
  - id: case-reducer
    can: Reduce photo actions once and compute conditional case-level error counts
    scenes:
      - case-reducer
  - id: missing-evidence
    can: Diagnose an apparent gain caused by an unavailable missed-case label
    scenes:
      - missing-evidence
  - id: source-slices
    can: Identify the warehouse miss and distinguish zero recall from undefined precision using the two case records
    scenes:
      - source-slices
  - id: receipt-boundary
    can: Require model and recovery evidence beyond synthetic contract checks
    scenes:
      - receipt-boundary
  - id: monitoring-response
    can: Match immediate quality and delayed outcome evidence to the next action
    scenes:
      - monitoring-response
  - id: synthesis
    can: Join R-408's dated damage confirmation to the retained normal route and identify the missed parcel
    scenes:
      - synthesis
  - id: fresh-parcel
    can: Route the two R-520 photos, reduce them to one action, and recompute observed recall when the fifth label becomes available
    scenes:
      - fresh-parcel
