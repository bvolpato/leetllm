version: 1
lesson: production-retrieval
promise: Trace one policy question through current authorized source bytes, a pinned retrieval
  bundle, complete context, supported decisions and a measured release contract.
objectives:
  - id: authority
    can: Apply caller, validity and deletion predicates before payloads cross the trusted search
      boundary
    scenes:
      - versioned-evidence
      - validity-invariants
      - authorized-retrieval
      - filtering-contract
      - revocation-and-cache
  - id: lineage
    can: Resolve a child to its checked parent under one pinned bundle and measure complete context
    scenes:
      - pinned-bundle
      - child-to-parent
      - context-budget
  - id: support
    can: Separate citation identity, claim support, numerical denial and missing-evidence abstention
    scenes:
      - subject-intro
      - answer-from-evidence
      - prompt-contract
      - recorded-model-failure
      - evidence-is-data
  - id: lifecycle
    can: Invalidate drafts and cache entries under changed grants, deletion or answer-critical values
    scenes:
      - revocation-and-cache
      - cache-identity
      - fresh-evidence
  - id: diagnosis
    can: Distinguish ANN, candidate and context recall from generated-claim faithfulness
    scenes:
      - lexical-counterexample
      - trace-and-diagnose
      - recall-contracts
  - id: release
    can: Compute serial latency milestones and enforce every declared fixture gate without overclaiming
      production readiness
    scenes:
      - three-paths
      - serial-latency
      - release-gates
      - tails-and-gates
