version: 1
lesson: voice-agents
promise: Design a voice hotline that answers promptly, stops when Alex interrupts, and resumes using
  the words the player confirmed and the actions the incident service recorded.
objectives:
  - id: clock-contract
    can: Compute both first-playback delays and locate the first confirmed status word on the call clock
    scenes:
      - clock-contract
      - overlap-timeline
      - speak-in-chunks
      - transfer
  - id: vad-worksheet
    can: Count retained pre-roll and threshold-rounded silence frames
    scenes:
      - vad-worksheet
  - id: partial-transcripts
    can: Reject untyped commit flags and withhold irreversible work on interim text
    scenes:
      - partial-transcripts
  - id: operation-ledger
    can: Separate authorized service acceptance from spoken acknowledgement and human receipt
    scenes:
      - operation-ledger
      - fresh-interruption
  - id: alignment-ledger
    can: Choose the last complete text chunk at a playback receipt and reject a late receipt for a different reply
    scenes:
      - barge-in
      - alignment-ledger
      - fresh-interruption
  - id: pcm-contract
    can: Compute PCM duration and bytes from actual sample rate and channels
    scenes:
      - pcm-contract
  - id: deadline-transport
    can: Diagnose packet deadline and ordered-delivery tradeoffs on a negotiated transport
    scenes:
      - transport-and-buffer
      - deadline-transport
  - id: prefix-reuse
    can: Identify when stable text lacks an eligible cached endpoint
    scenes:
      - prefix-reuse
  - id: cache-economics
    can: Compute disjoint read/write/ordinary input cost
    scenes:
      - cache-economics
  - id: media-affinity
    can: Preserve media-state affinity and specify recovery after worker loss
    scenes:
      - media-affinity
  - id: release-metrics
    can: Evaluate all-call attainment without hiding silent failures
    scenes:
      - release-metrics
