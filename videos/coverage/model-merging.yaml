version: 1
lesson: model-merging
promise: Decide whether one merged checkpoint can take over from Code, Math, and Chat by testing intermediate weights and checking every required task against its specialist.
framing: []
objectives:
  - id: match-coordinates
    can: Check learned roles, token meanings, and both vocabulary-indexed matrices before averaging matching addresses.
    scenes: [alignment, recipe-contract]
  - id: screen-path
    can: Use loss and task measurements at the proposed mixing ratio to decide which checkpoints to test further.
    scenes: [average, path, slerp]
  - id: construct-update
    can: Calculate a scaled change from the base, including the base correction or paired adapter products the construction requires.
    scenes: [task-arithmetic, base-coefficient, adapter-products, earned-transfer]
  - id: combine-deltas
    can: Compute a TIES mean from aligned survivors and distinguish DARE's expected signed change from a single masked draw.
    scenes: [ties, drop-rescale]
  - id: test-saved-model
    can: Test a selected recipe on fresh cases, trace a splice failure, and identify where a precision cast erased a change.
    scenes: [recipe-contract, precision-diagnosis]
  - id: release-call
    can: Compare each held-out task with its absolute floor and its permitted regression before moving traffic.
    scenes: [intro, evaluate, earned-transfer]
