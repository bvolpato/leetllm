version: 1
lesson: capstone-document-qa-product
promise: Decide whether a caller can receive a cited passage, trace a refusal to the source or
  review that caused it, and apply the same evidence checks to a bounded research report.
framing:
  - intro
objectives:
  - id: lookup
    can: Trace one policy through its registry entry, caller access and lexical score, then decide
      whether the review covers that exact question and passage.
    scenes:
      - admission
      - strict-corpus
      - access
      - retrieval
      - retrieval-upgrade
      - support
      - responses
      - fresh-qa
  - id: review
    can: Replay a useful answer and two distinct refusals, detect a missing or duplicated fixture,
      and explain why rebuilding with edited source bytes can make the useful-answer test fail.
    scenes:
      - typed-http
      - synthesis
      - claim-scope
      - replay-rows
      - fresh-qa
  - id: research
    can: Enforce a research budget before dispatch, fence a stale checkpoint writer, and compare a
      report claim with its source even when its declared judgment passes the consistency check.
    scenes:
      - research
      - research-request
      - research-checkpoint
      - research-claims
      - research-lifecycle-api
