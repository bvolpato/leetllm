version: 1
lesson: gpu-profiling-correctness-benchmarking
promise: Decide which speedup a GPU patch can claim by following the completed work, checking the last writer and reproducing a matched timing round from its original files.
framing:
  - intro
objectives:
  - id: completion
    can: Locate launch return, event completion and request completion on a trace, then calculate the time a faster kernel saves the user.
    scenes:
      - intro
      - event-contract
      - system-payoff
      - receipt
  - id: correctness
    can: Diagnose hidden logical tail writes and apply reference, tolerance and checker scopes.
    scenes:
      - tail
      - reference-cases
      - tolerance
      - sanitizer-scopes
      - lab-execution
      - fresh-artifact
  - id: mechanism
    can: Match each timed launch to its buffer slot, size a rotating pool and use matching traffic counters to test a roofline hypothesis.
    scenes:
      - warmup
      - cache-allocation
      - traffic
      - roofline
      - roofline-diagnosis
      - replay-contract
  - id: evidence
    can: Preserve a slow sample and a reversal across rounds, then check whether the timing file still matches the receipt even if its values look identical.
    scenes:
      - sample-contract
      - paired
      - receipt-parser
      - receipt
      - fresh-artifact
