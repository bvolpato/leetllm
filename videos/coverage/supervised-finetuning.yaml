version: 1
lesson: supervised-finetuning
promise: Decide whether a packed demonstration teaches the approved response and where to stop, then test that behavior on a new incident.
framing: []
objectives:
  - id: target
    can: Follow the incident from the chat template to individual loss terms and repair a wrong target even when the active count is correct.
    scenes: [intro, template, shift, mask, loss, template-and-collation, active-target-guards, transfer, fresh-boundary-repair]
  - id: packing
    can: Distinguish a cross-incident attention read from a cross-incident shifted label and test each at a packed join.
    scenes: [packing, packing-implementation, fresh-boundary-repair]
  - id: experiment
    can: Choose demonstrations and independent groups, control which weights move, and compare recipes at matched target exposure.
    scenes: [policy-run-contract, row-group-split, prompt-metric, objective-surface, batching, global-target-budget, recipe-controlled]
  - id: continuation
    can: Predict the next update with saved or reset optimizer state and verify a restore against uninterrupted execution.
    scenes: [resume-update, resume-data-artifacts]
  - id: selection
    can: Check training memory, choose a checkpoint under a declared format floor, and grade a freely generated held-out reply.
    scenes: [smallest-runtime, evaluate, checkpoint-selection, fresh-boundary-repair]
