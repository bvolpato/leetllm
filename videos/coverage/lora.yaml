version: 1
lesson: lora
promise: Trace a ticket through a frozen layer and its adapter. Use the gradients, parameter counts, peak memory and serving requirements to choose a configuration. Decide which candidate meets both the new policy and routine-review requirements.
framing: []
objectives:
  - id: policy-task
    can: Use a retrieved rotation rule to identify which reply should change and which reply the adapter must preserve.
    scenes:
      - policy-task
      - fresh-policy
  - id: shared-base
    can: Show where a ticket's selected adapter contributes to the output of a frozen layer.
    scenes:
      - intro
      - thin-forward
  - id: linear-layer
    can: A matrix mixes input directions
    scenes:
      - linear-layer
  - id: dense-update
    can: Keep the base, learn a correction
    scenes:
      - dense-update
  - id: intrinsic-rank
    can: One free scalar can still change every direction
    scenes:
      - intrinsic-rank
  - id: rank-one
    can: One direction, many possible corrections
    scenes:
      - rank-one
  - id: rank-two
    can: Two directions open a plane
    scenes:
      - rank-two
  - id: factorization
    can: Build the update from thin factors
    scenes:
      - factorization
  - id: thin-forward
    can: Calculate the scaled correction on two inputs and identify the input whose coordinates cancel in A.
    scenes:
      - thin-forward
  - id: parameter-count
    can: A narrow passage changes the budget
    scenes:
      - parameter-count
  - id: initialization
    can: Predict which factor receives the first nonzero loss gradient, then trace how a step on B opens the path back to A.
    scenes:
      - initialization
  - id: gradient-contract
    can: Derive which factor moves first
    scenes:
      - gradient-contract
  - id: strength
    can: Capacity and strength are separate choices
    scenes:
      - strength
  - id: rank-scaling
    can: The multiplier changes with the chosen rank
    scenes:
      - rank-scaling
  - id: target-modules
    can: Choose where the new capacity enters
    scenes:
      - target-modules
  - id: target-budget
    can: Spend capacity where the block transforms information
    scenes:
      - target-budget
  - id: prompt-prefix
    can: Locate the learned state before naming the method
    scenes:
      - prompt-prefix
  - id: rectangular-contract
    can: Verify dimensions and work before using the layer
    scenes:
      - rectangular-contract
  - id: tiny-peft
    can: Turn the wrapper into an executed contract
    scenes:
      - tiny-peft
  - id: lexical-contract
    can: New token IDs need learned rows
    scenes:
      - lexical-contract
  - id: memory
    can: Recalculate the peak at a longer sequence length and decide whether halving adapter state would bring it under the device limit.
    scenes:
      - memory
  - id: state-budget
    can: A small adapter leaves the base and runtime bill
    scenes:
      - state-budget
  - id: frozen-backward
    can: Frozen weights still carry an upstream derivative
    scenes:
      - frozen-backward
  - id: nf4-codec
    can: Choose the nearest NF4 code on either side of zero and recover the weight by restoring the block scale.
    scenes:
      - nf4-codec
  - id: nested-paging
    can: Account for scales and move the right memory pages
    scenes:
      - nested-paging
  - id: precision-contract
    can: Inspect four precision choices and actual temporaries
    scenes:
      - precision-contract
  - id: sharded-training
    can: The frozen base still has a gathering peak
    scenes:
      - sharded-training
  - id: merge
    can: Fold the correction into the base
    scenes:
      - merge
  - id: export-contract
    can: Save the adapter before unloading its path
    scenes:
      - export-contract
  - id: dora-forward
    can: Give each output row its own magnitude
    scenes:
      - dora-forward
  - id: dora-backward
    can: Predict the forward result of stretching a directional row and use that same stretch to distinguish the full and detached-norm derivatives.
    scenes:
      - dora-backward
  - id: serving-contract
    can: One shared base can serve different corrections
    scenes:
      - serving-contract
  - id: evaluate
    can: Let the task decide the useful rank
    scenes:
      - evaluate
  - id: diagnose-policy
    can: Let the failure choose the next comparison
    scenes:
      - diagnose-policy
  - id: fresh-policy
    can: Trace a supplied score across zero and choose between equally accurate candidates by locating the corrected ticket on the two held-out sets.
    scenes:
      - fresh-policy
