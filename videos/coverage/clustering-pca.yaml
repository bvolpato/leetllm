version: 1
lesson: clustering-pca
promise: Use the original nearest message as a reference, then decide whether a missed neighbor needs a wider
  candidate search or a coordinate that PCA discarded.
framing: []
objectives:
  - id: distance-and-clustering
    can: Compute coordinate distances, assign points and minimize within-group squared error by moving a nonempty
      mean.
    scenes:
      - intro
      - neighbors
      - algorithm-contract
      - kmeans
  - id: initialization-and-score
    can: Diagnose empty or poor initialization, compute squared-distance sampling and compare complete silhouette
      and inertia records.
    scenes:
      - initialization
      - seeding-mass
      - choose-k
      - silhouette-ledger
      - objective-ties
      - fresh-seed-repair
  - id: pca-reconstruction
    can: Center the cloud, recover sample variances from its singular values, and use the retained and discarded
      squared scores to explain reconstruction error and a change in query distance.
    scenes:
      - pca
      - solver-contract
      - compression
      - variance-ledger
      - takeaway
  - id: representation-contract
    can: Apply a permitted fitted transform and distinguish Euclidean, cosine and spherical-center geometry.
    scenes:
      - scale
      - scale-boundary
      - metric-choice
      - spherical-centers
      - centered-cosine
  - id: search-and-audit
    can: Count center and document comparisons, use flat search to diagnose an excluded neighbor or a changed
      distance, choose the corresponding repair, and check relevance on reviewed query-document pairs.
    scenes:
      - intro
      - compression
      - ivf
      - ivf-work
      - takeaway
      - audit-labels
