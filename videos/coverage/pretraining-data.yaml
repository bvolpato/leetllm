version: 1
lesson: pretraining-data
promise: Trace a program from its source into training, then use its token exposure and held-out results to decide whether to release a change to the corpus.
objectives:
  - id: budget
    can: Compute a presentation target and the fraction of surviving tokens that each gate removes
    scenes:
      - inventory-plan
      - inventory
  - id: source
    can: Choose an extraction and filter recipe that preserves the source structure needed for the task
    scenes:
      - intro
      - extract
      - archives
      - filter
      - prose-gates
      - score-contracts
      - corpus-evidence
  - id: dedup
    can: Calculate candidate probability and exact shingle overlap, then identify which shingles a component loses when it keeps one representative
    scenes:
      - dedup
      - minhash-work
      - lsh-chain
      - inventory
  - id: schedule
    can: Set source draw probabilities for a desired token share and trace repeated blocks to their source positions
    scenes:
      - mixture
      - exposure-schedule
      - transfer
  - id: policy
    can: Distinguish contamination candidates and contextual privacy decisions from guarantees
    scenes:
      - decontamination
      - privacy
  - id: tokenizer
    can: Replay ordered BPE merges and compute vocabulary storage costs
    scenes:
      - tokenizer-choice
      - bpe-work
  - id: packing
    can: Compute slot utilization and enforce independent attention plus one label shift
    scenes:
      - packing-work
      - boundaries
      - label-layout
  - id: restart
    can: Restore consumed work at a completed checkpoint while checking exact artifact identity
    scenes:
      - lineage
      - restart-consistency
  - id: evaluate
    can: Decide whether a corpus change meets a held-out domain floor and choose one source change to test next
    scenes:
      - intro
      - anneal-synthetic
      - transfer
      - fresh-corpus
