version: 1
lesson: kv-cache
promise: Use the stored pairs, valid length, and owners of a block to decide where the next token can write, then size and schedule the cache when many requests share a GPU.
framing: [ hook, close ]
objectives:
  - id: why-cache
    can: Distinguish a sampled token from a cached position. Count positions that need new K/V projections separately from positions the current query attends to.
    scenes: [ hook, waste, reads ]
  - id: two-phases
    can: Tell prefill from decode, say what each phase usually stresses, and read time to first token and inter token latency separately.
    scenes: [ phases, batching ]
  - id: size-it
    can: Calculate the cache bytes per token and the total for a conversation from layers, key value heads, head width, and precision.
    scenes: [ size ]
  - id: name-the-waste
    can: Identify internal fragmentation, reservation waste, and external fragmentation in a reservation scheme.
    scenes: [ reserve ]
  - id: follow-the-table
    can: Follow a token position through a block table to its physical block and slot, and say when a new block is taken.
    scenes: [ paged, your-turn ]
  - id: kernel-reads
    can: Compare a paged read with a contiguous reference, use the valid length to diagnose an overread, and explain when a contiguous virtual address range can serve an existing kernel.
    scenes: [ kernel ]
  - id: count-blocks
    can: Count occupied blocks as requests finish and join, and say when a freed block is safe to reuse.
    scenes: [ lifetime, batching, your-turn, close ]
  - id: share-safely
    can: Use a block's owners and valid slots to choose an in-place append, a private copy, or a fresh block. Count the physical blocks saved by sharing a compatible prefix.
    scenes: [ share, prefix, close ]
  - id: run-out
    can: Compare both legs of a swap with the time to rebuild the evicted positions at a given replay rate.
    scenes: [ preempt, recovery-cost ]
  - id: pick-the-lever
    can: Choose between packing, scheduling, and storing fewer bytes per token for a given memory or latency problem.
    scenes: [ batching, shrink, your-turn ]
