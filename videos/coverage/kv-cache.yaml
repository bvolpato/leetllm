removed:
  - point: Definitions of query, key, and value, and how softmax weights blend the values.
    reason: The attention lesson derives queries, keys, values, and softmax. The opening follows one query through its three key scores and the resulting weighted mix.
  - point: The analogy of the query as a question and the keys as addresses.
    reason: It belongs to the attention lesson, and this lesson does not build on it.
  - point: The narrated preview that a small mapping table will support more flexible requests.
    reason: The paged scene teaches the table itself. The fork shows why changing one entry protects a branch.
  - point: The note that the drawing shows one attention layer while the model repeats through its stack.
    reason: The opening identifies the pairs as one head's data. The size scene scales that payload across heads and layers.
  - point: The conclusion's trace of A and B sharing block seven, with A appending today and then releasing block two.
    reason: The close follows a fresh fork through blocks zero, one, and two. The viewer identifies the private block a new request can reuse.
  - point: The statement that vLLM caches full blocks and may recompute a final prompt region, as a claim about that engine.
    reason: It depends on the version, so the page keeps it. The prefix scene teaches full block sharing and that the last token is still computed.
