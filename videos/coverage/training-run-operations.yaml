version: 1
lesson: training-run-operations
promise: Choose which checkpoint and data position to load after a failure, then rehearse the next update on the replacement workers.
objectives:
  - id: restart-packet
    can: Identify which fields each restart restores and use the consumed cursor to predict where the sampler reads next.
    scenes:
      - intro
  - id: first-read
    can: Choose which of eight accumulation rounds to replay when the weights and the live data cursor stop at different boundaries.
    scenes:
      - first-read
      - cursor-and-window
      - fresh-restore
  - id: moments
    can: Trace a full restore and a reset-moment branch against the same uninterrupted updates.
    scenes:
      - moments
  - id: adam-first-step
    can: Calculate a fresh adaptive-step bound and distinguish complete continuation from initialization or
      export.
    scenes:
      - adam-first-step
  - id: checkpoint-ownership
    can: Diagnose tensor aliasing and publish only a fully completed, validated checkpoint packet.
    scenes:
      - checkpoint-ownership
  - id: durable
    can: Decide which pointer a loader follows when the fourth shard fails, and when a complete save can replace it.
    scenes:
      - durable
  - id: cursor-and-window
    can: Reconstruct the consumed data boundary and identify complete in-flight numerical state.
    scenes:
      - cursor-and-window
  - id: deadline
    can: Calculate whether the entire warning path fits before attempting a boundary save.
    scenes:
      - deadline
  - id: interval-and-reliability
    can: Calculate checkpoint overhead and qualify independent-device failure-rate estimates.
    scenes:
      - interval-and-reliability
  - id: reshard
    can: Preserve logical tensor coordinates and rehearse a supported destination restore.
    scenes:
      - reshard
  - id: storage-topology-contract
    can: Calculate state-storage floors and distinguish logical slicing from reader allocation and compatibility.
    scenes:
      - storage-topology-contract
  - id: replicas
    can: Count sequences as each GPU pair finishes a round and predict the batch after changing both the replica count and accumulation length.
    scenes:
      - replicas
  - id: batch-and-schedule
    can: Compute mesh batch size and intentionally remap schedule or conditional Adam coefficients.
    scenes:
      - batch-and-schedule
  - id: tokens
    can: Construct the global supervised-token objective under ordinary DDP averaging.
    scenes:
      - tokens
  - id: overflow
    can: Keep consumed data and successful-update schedule counters distinct across skipped steps.
    scenes:
      - overflow
  - id: diagnosis-and-rollback
    can: Diagnose an observed failure, reject nonfinite recovery state and choose a bounded evidence-based rewind.
    scenes:
      - diagnosis-and-rollback
  - id: adaptation-and-memory
    can: Separate adaptation choices and reject impossible base-memory plans without claiming complete fit.
    scenes:
      - adaptation-and-memory
  - id: fresh-restore
    can: Choose a recovery boundary under a new deadline, find a tensor coordinate on the destination mesh and detect a cursor error from the next sample IDs.
    scenes:
      - fresh-restore
sections:
  - heading: Weights are only one part of a continuation
    status: taught
    scenes:
      - intro
      - adam-first-step
    note: Both packets load the weights from update 1840. In this replayable order, the cursor starts over at zero or resumes after 117,760 consumed examples.
  - heading: What lost optimizer moments break
    status: taught
    scenes:
      - moments
      - adam-first-step
  - heading: Reliability and the two checkpoint completion points
    status: taught
