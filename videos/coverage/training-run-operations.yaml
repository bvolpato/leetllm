      - first-read
      - checkpoint-ownership
      - durable
      - cursor-and-window
      - fresh-restore
    note: The five unfinished rounds come from the article’s update-1840 example. The final drill uses a separate deterministic sample order.
  - heading: Treat preemption as a deadline and trigger saves explicitly
    status: taught
    scenes:
      - cursor-and-window
      - deadline
  - heading: Budget the entire remaining path
    status: taught
    scenes:
      - deadline
      - interval-and-reliability
