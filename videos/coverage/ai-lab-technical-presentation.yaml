version: 1
lesson: ai-lab-technical-presentation
promise: Answer an interviewer's follow-up with the change you owned, a trace or comparison that shows its effect, and the evidence you still need before recommending wider use.
objectives:
  - id: opening
    can: Replace a causal onboarding claim with the elapsed-time difference the two records support.
    scenes:
      - opening
  - id: format-contract
    can: Use a matched negative result in a research talk and check permission before sharing a private artifact.
    scenes:
      - format-contract
  - id: argument
    can: Write the argument before choosing the slides
    scenes:
      - argument
  - id: evidence-inventory
    can: Give every argument sentence an inspectable artifact
    scenes:
      - evidence-inventory
  - id: path
    can: Trace one request and one failure
    scenes:
      - path
  - id: failure-invariant
    can: Use the full cursor history to distinguish a nonadjacent repeat from a terminal response and report the correct status.
    scenes:
      - failure-invariant
  - id: tradeoff
    can: Defend a choice with a reversal signal
    scenes:
      - tradeoff
  - id: source-wait
    can: Calculate the cost of a remote hop with a fixed source wait and show when a worker limit can relieve contention.
    scenes:
      - source-wait
  - id: paired-evidence
    can: Trace a lost runbook across the top-five cutoff and use the paired query counts to defend a fixed-set gain.
    scenes:
      - paired-evidence
  - id: paired-contract
    can: Define the retrieval outcome before interpreting the gain
    scenes:
      - paired-contract
  - id: typed-comparison
    can: Match actual query identities before computing the paired counts
    scenes:
      - typed-comparison
  - id: time-budget
    can: Spend the fifteen minutes on the question
    scenes:
      - time-budget
  - id: interrupted-rehearsal
    can: Spend the remaining time after a real interruption
    scenes:
      - interrupted-rehearsal
  - id: measurement-limits
    can: Keep operational metrics inside their scope
    scenes:
      - measurement-limits
  - id: metric-claims
    can: Separate a lower count, a relative change and a capacity claim
    scenes:
      - metric-claims
  - id: migration-stages
    can: Keep replay, shadow and candidate-served traffic distinct
    scenes:
      - migration-stages
  - id: recovery-boundary
    can: Trace the next response after a rollback and identify which earlier shadow effects still need recovery.
    scenes:
      - recovery-boundary
  - id: qa-claim-repair
    can: Answer from an observed trace before naming a cause
    scenes:
      - qa-claim-repair
  - id: role-bridge
    can: Connect the real boundary to the target AI task
    scenes:
      - role-bridge
  - id: rehearsal-diagnosis
    can: Repair the missing evidence instead of adding slide polish
    scenes:
      - rehearsal-diagnosis
  - id: next-experiment
    can: Design a path-only replay of the same lost query and distinguish its pending result from the original comparison.
    scenes:
      - next-experiment
  - id: fresh-evidence
    can: Update the paired counts after a two-query repair and use separate service measurements to answer a promotion question.
    scenes:
      - fresh-evidence
