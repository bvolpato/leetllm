version: 1
lesson: inference-batch-capacity
promise: Decide which patch requests a replica can admit and which batch sizes meet the modeled
  token interval when a serving policy or cache format changes.
objectives:
  - id: capacity
    can: Size one history from its checkpoint, count whole independent histories in a fixed pool,
      and decide whether the pool can cover a new request through its page-rounded output reserve.
    scenes:
      - intro
      - one-token
      - architecture-residency
      - partition
      - decimal-budget
      - growth
      - pages
      - live-page-ownership
  - id: read-rate
    can: Time the shared weight read and the current histories, select the largest listed batch
      within the memory and time limits, and price its modeled output over a billed hour.
    scenes:
      - phase-roofline
      - continuous-schedule
      - bandwidth
      - operating-point
      - measurement
      - fresh-resource
  - id: sharing
    can: Trace exact prefix identity, reference counts and copy-on-write before private writes
    scenes:
      - prefix-sharing
  - id: phases
    can: Allocate a mixed token budget and compare avoided interference with complete non-overlapped KV
      handoff cost
    scenes:
      - prompt-chunks
      - phase-handoff
  - id: speculation
    can: Apply acceptance and residual correction, then compute expected output divided by full
      draft/verification cost
    scenes:
      - speculative-contract
      - speculative-rate
  - id: precision
    can: Recompute separate weight/cache streams and identify context, backend, quality and
      communication constraints
    scenes:
      - weight-compression
      - cache-precision
      - request-shards
      - fresh-resource
