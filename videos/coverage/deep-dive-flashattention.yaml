version: 1
lesson: deep-dive-flashattention
promise: Decide whether an attention path mixes the intended values and fits its score-memory
  allowance, then verify its gradients, caller contract and completed device time.
objectives:
  - id: intro
    can: Count the comparisons completed as successive query and key tiles reuse the same score slots
    scenes:
      - intro
  - id: project-identity
    can: Identify the actual installed generation and its source/runtime evidence
    scenes:
      - project-identity
  - id: workspace-accounting
    can: Calculate score and row-state payloads under the declared IO model
    scenes:
      - workspace-accounting
  - id: tiles
    can: Identify which scores can be overwritten and which sums the next tile still needs
    scenes:
      - tiles
  - id: online
    can: Rescale and merge both retained softmax accumulators
    scenes:
      - online
  - id: recurrence-domain
    can: Detect an unscaled numerator from the geometry of the input values and handle an empty row
    scenes:
      - recurrence-domain
  - id: layout-heads
    can: Translate axes and compute consecutive grouped-head ownership
    scenes:
      - layout-heads
  - id: mask
    can: Locate both tail queries on the key positions and calculate their means under either causal corner
    scenes:
      - mask
  - id: window-empty
    can: Compute a local allow-set and empty reversed-length rows
    scenes:
      - window-empty
  - id: packed
    can: Predict which value enters a packed query's mean when the middle offset moves
    scenes:
      - packed
  - id: packed-page-contract
    can: Check cumulative lengths and use a request's block-table entry to locate its physical page
    scenes:
      - packed-page-contract
  - id: page-padding
    can: Diagnose NaN contamination in loaded final-page padding
    scenes:
      - page-padding
  - id: backward
    can: Rebuild a probability tile from saved row state
    scenes:
      - backward
  - id: gradient-rule
    can: Derive input-gradient contributions from the reconstructed probabilities
    scenes:
      - gradient-rule
  - id: gradient-worked
    can: Check actual signed gradients and CPU evidence limits
    scenes:
      - gradient-worked
  - id: return-dependencies
    can: Adapt public returns and distinguish optional state and dependency fallbacks
    scenes:
      - return-dependencies
  - id: generation-schedules
    can: Trace hardware work partitioning without changing legal keys
    scenes:
      - generation-schedules
  - id: published-evidence
    can: Evaluate a published benchmark against its exact premises and discrepancy
    scenes:
      - published-evidence
  - id: sdpa-dispatch
    can: Select a valid backend and control explicit dropout
    scenes:
      - sdpa-dispatch
  - id: padding-polarity
    can: Recompute the consequence of translating a boolean mask
    scenes:
      - padding-polarity
  - id: contracts
    can: Validate independent layout, mask, return and memory gates
    scenes:
      - contracts
  - id: mixed-shape-cache
    can: Diagnose compilation-key collisions using mixed warmup orders
    scenes:
      - mixed-shape-cache
  - id: synthesis
    can: Separate reference agreement from submission and completed work
    scenes:
      - synthesis
  - id: measurement-profile
    can: Construct representative timing and resource evidence
    scenes:
      - measurement-profile
  - id: fresh-dispatch
    can: Predict empty and nonempty row outputs and choose a fallback batch size within a score-buffer allowance
    scenes:
      - fresh-dispatch
