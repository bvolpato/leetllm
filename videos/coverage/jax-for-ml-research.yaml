version: 1
lesson: jax-for-ml-research
promise: Decide whether a padded JAX training step preserves the experiment by comparing its loss, gradients, and returned state with the unpadded call.
objectives:
  - id: numerical
    can: Compute the loss and gradient on real rows, compare the padded reduction, and decide whether an empty batch should advance momentum.
    scenes:
      - intro
      - regression-oracle
      - gradient
      - transform-order
      - state
      - state-replay
      - regularizer
      - masked-padding
      - last-batch
  - id: state
    can: Match parameter paths and shapes, keep the returned array, and trace matching dropout bits back to their keys.
    scenes:
      - tree
      - dynamic-static
      - values
      - indexing-bounds
      - keys
      - key-replay
      - key-ownership
  - id: staging
    can: Diagnose extra compilation, a captured global, and a failure in traced control flow by changing one input at a time.
    scenes:
      - jit
      - compile-stages
      - captured-global
      - weak-typing
      - masked-padding
      - tracer-branch
      - inactive-log
      - loop-contract
      - fresh-boundary
  - id: execution
    can: Distinguish example axes from physical shards and measure cold and warm calls through result completion.
    scenes:
      - device-layout
      - timing
      - measurement-contract
  - id: research
    can: Use a retained input and its expected results to locate a failing transformation and justify a narrow change to the research code.
    scenes:
      - program-contract
      - evidence-preservation
      - fresh-boundary
      - last-batch
