version: 1
lesson: capstone-delivery-eta-prediction
promise: Replay a delivery receipt from the original promise and the evidence available at scoring time. Explain its ETA and warning, then decide whether the frozen policy earned release.
framing: []
objectives:
  - id: time-safe-estimate
    can: Select the latest scan the service could read, compute an arrival from eligible trips, and determine the warning proposal under a named policy.
    scenes:
      - intro
      - prediction-contract
      - clocks
      - history
      - arrival-targets
      - conformal-calibration
      - freshness
      - synthesis
  - id: frozen-evaluation
    can: Exclude late labels at fitting, freeze the threshold on validation, and trace the fitted policy's test cost to the shipments that incurred it.
    scenes:
      - cost
      - cost-threshold
      - selection
      - temporal-fit
      - fitted-predictions
      - artifact-replay
  - id: serving-evidence
    can: Distinguish serving checks from mature outcome measurements, identify which worker served a request, and replay an action after a policy change.
    scenes:
      - monitor
      - serving-recovery
      - synthesis
