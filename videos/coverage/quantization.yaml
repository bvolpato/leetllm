version: 1
lesson: quantization
promise: Decide whether a four-bit file can serve a workload by tracing its rounding error, counting its loaded bytes and testing the reloaded file on the tasks it must complete.
objectives:
  - id: calibration-output
    can: Compute the two output shortfalls after rounding one weight, choose a shared correction and test both code pairs on inputs that isolate each channel.
    scenes:
      - curvature
      - gptq
      - held-out
      - factor-order
  - id: budget-inventory
    can: Compute code bytes, scale overhead and a unit-consistent complete weight estimate.
    scenes:
      - payload
      - budget-inventory
  - id: affine-range
    can: Encode and decode real values with either unsigned or signed affine zero codes.
    scenes:
      - affine-range
  - id: codec-contract
    can: Recover the original signed code count and reject an invalid packed reconstruction contract.
    scenes:
      - codec-contract
  - id: group-sum
    can: Keep each group scale attached to its partial dot product.
    scenes:
      - group-sum
  - id: factor-order
    can: Choose the inverse of the still-free Hessian block and retain sequential update dependencies.
    scenes:
      - factor-order
  - id: gptq-layout
    can: Distinguish uncentered activation energy from variance and verify packed-format compatibility.
    scenes:
      - gptq-layout
  - id: awq-search
    can: Compare complete calibration output errors across scaling candidates and check separate inputs.
    scenes:
      - awq-search
  - id: precision-sweep
    can: Calculate held-out layer MSE and distinguish simulated grids from real packed kernels.
    scenes:
      - precision-sweep
  - id: kernel-path
    can: Count compact reads and reconstructed-matrix writes/reads for a declared execution path.
    scenes:
      - kernel-path
  - id: roofline
    can: Calculate nominal rate ceilings while retaining their simplifying assumptions.
    scenes:
      - roofline
  - id: precision-roles
    can: Select weight, activation and cache precision as separately supported decisions.
    scenes:
      - precision-roles
  - id: pool-subtraction
    can: Compute the integer user limit from the leftover pool and unchanged per-user state.
    scenes:
      - pool-subtraction
  - id: container-layout
    can: Distinguish mapping, resident page reads, device transfers and first-request completion.
    scenes:
      - container-layout
  - id: q4k-unpack
    can: Count Q4_K metadata bytes and reconstruct a value from its actual coefficient owners.
    scenes:
      - q4k-unpack
  - id: offload-count
    can: Apply an output-inclusive trailing placement contract and a separate reserve budget.
    scenes:
      - offload-count
  - id: artifact-lineage
    can: Trace a saved candidate back to retained source revisions and evaluate after reload.
    scenes:
      - artifact-lineage
  - id: paired-evaluation
    can: Check the returned destination against the request and compare correct routes across every request sent to each file.
    scenes:
      - paired-evaluation
  - id: diagnose
    can: Choose a controlled next observation for structured-output, decode and prefill symptoms.
    scenes:
      - diagnose
  - id: fresh-quantization
    can: Compute both allocation totals, test a smaller cache, then decide whether either file meets the original workload and task requirements.
    scenes:
      - paired-evaluation
      - fresh-quantization
