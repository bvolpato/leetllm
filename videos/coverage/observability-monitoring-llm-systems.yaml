version: 1
lesson: observability-monitoring-llm-systems
promise: Decide which delivered answer should page the on-call engineer, trace it to the observed escape,
  and test whether a candidate contains the failure while still answering a clean case.
objectives:
  - id: delivery
    can: Compare the delivered claim with its evidence and select the request that triggers the page
    scenes:
      - opening
      - event-contract
      - join
  - id: denominators
    can: Compute reviewed risk, conditional answer risk, coverage and attainable unsafe-delivery bounds
    scenes:
      - review-asof
      - denominators
      - unknown-bounds
  - id: latency
    can: Compute valid later-token throughput and nearest-rank percentiles from a declared population
    scenes:
      - stream-contract
      - percentile-contract
  - id: tracing
    can: Use a trace to locate the first defective draft and the later escape, and preserve the caller across services
    scenes:
      - trace
      - wire-context
  - id: attributes
    can: Join required operation fields to approved versioned product decisions
    scenes:
      - attribute-contract
  - id: cost
    can: Compute disjoint usage cost while rejecting impossible accounting
    scenes:
      - cost
      - usage-contract
  - id: privacy
    can: Identify the trusted-metadata boundary and minimize exported content
    scenes:
      - privacy
      - metadata-boundary
  - id: alerts
    can: Keep a confirmed safety page while reporting broken measurements and missing request events
    scenes:
      - alert-validity
  - id: sampling
    can: Distinguish retained frequencies from weighted population estimates and their limits
    scenes:
      - sampling
      - tail-timing
      - sample-weights
  - id: budgets
    can: Compute repeated-history work and enforce independent repeat, time and spend admission
    scenes:
      - budget
      - history-growth
      - tool-contract
      - fresh-window
  - id: recovery
    can: Use a violating request and an answerable control to reject a blanket withholding rule and decide when to run the holdout
    scenes:
      - incident-replay
      - candidate-gate
