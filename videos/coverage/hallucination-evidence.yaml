version: 1
lesson: hallucination-evidence
promise: Decide which parts of an incident update a reader can receive, and justify the decision with the cited record and the actual response.
framing: []
objectives:
  - id: claims
    can: Trace a proposed time or status to a field in the admitted version and distinguish a missing detail from a contradiction.
    scenes:
      - subject-intro
      - atomic-claims
      - verdicts
      - support-versus-truth
      - evidence-version
      - strict-claim-contract
  - id: signals
    can: Calculate token and meaning entropy, apply a strict disagreement cutoff to a supported draft, and normalize DoLa and context-aware decoding weights.
    scenes:
      - token-confidence
      - meaning-entropy
      - consistency-signal
      - consistency-methods
      - contrastive-decoding
  - id: policy
    can: Shorten or withhold a draft, count the actual answers served, and decide what evidence is still needed for release.
    scenes:
      - safe-rendering
      - guessing-incentives
      - measured-abstention
      - score-the-gate
      - payload-and-release
  - id: replay
    can: Find the first failed check and use a new runbook version to rebuild an update from its two verified fields.
    scenes:
      - verification-plans
      - trace-and-measure
      - fresh-record-repair
