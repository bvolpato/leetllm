version: 1
lesson: design-agent-sandbox-platform
promise: Decide when a restored job can start and when its slot can go to the next tenant by tracing which generation owns its pages, files, control session and open handles.
framing: []
objectives:
  - id: intro
    can: Identify the host reader that still has access to a stopped guest’s scratch.
    scenes:
      - intro
  - id: request-limits
    can: Bind one generation to its resources
    scenes:
      - request-limits
  - id: boundary
    can: A guest kernel changes the trust boundary
    scenes:
      - boundary
  - id: kvm-descriptors
    can: Follow the descriptor and return value
    scenes:
      - kvm-descriptors
  - id: jailer-surfaces
    can: Reduce host authority around the VMM
    scenes:
      - jailer-surfaces
  - id: clean-template
    can: Seal memory, machine state and matching disks
    scenes:
      - clean-template
  - id: cow
    can: Follow each guest’s read pointer after one guest writes to a shared page.
    scenes:
      - cow
  - id: article-page-run
    can: Count a second writer’s private page and predict what happens when the first writer overwrites its own copy.
    scenes:
      - article-page-run
  - id: fault-handler
    can: A missing page must be supplied before progress
    scenes:
      - fault-handler
  - id: clock-refresh
    can: Refresh wall time and application deadlines separately
    scenes:
      - clock-refresh
  - id: rng-window
    can: Kernel reseeding leaves separate copied state
    scenes:
      - rng-window
  - id: namespace-identity
    can: Separate a local name from global routing
    scenes:
      - namespace-identity
  - id: freshness
    can: Identify a passing application check from the wrong generation and decide which observation the supervisor still needs.
    scenes:
      - freshness
  - id: filesystem
    can: Trace a read to the immutable image, then to a private copy after the guest edits the same name.
    scenes:
      - filesystem
  - id: overlay-whiteout
    can: Predict which names a fresh guest sees after disposal removes a whiteout and a private output file.
    scenes:
      - overlay-whiteout
  - id: network
    can: Check the destination at the trusted egress boundary
    scenes:
      - network
  - id: egress-addresses
    can: Authorize the operation and the actual connection
    scenes:
      - egress-addresses
  - id: vsock-wire
    can: Establish the control stream before carrying commands
    scenes:
      - vsock-wire
  - id: bounded-ack
    can: Apply one deadline to the acknowledgement, stop reading at newline and decide whether the assigned port is in range.
    scenes:
      - bounded-ack
  - id: capacity
    can: Dirty memory and synchronized bursts bound the pool
    scenes:
      - capacity
  - id: group-budget
    can: Spend one shared CPU allowance across threads
    scenes:
      - group-budget
  - id: readonly-data
    can: Read shared data while accounting for its working set
    scenes:
      - readonly-data
  - id: state-machine
    can: Use the Python clone’s state and generation to explain a failed disposal and a rejected retirement notice.
    scenes:
      - state-machine
  - id: retirement
    can: Explain why an exporter can still hold a scratch backing after the guest has stopped.
    scenes:
      - retirement
  - id: reference-retirement
    can: Wait for the last resource reference
    scenes:
      - reference-retirement
  - id: reconciliation-table
    can: Choose recovery from the observed failure
    scenes:
      - reconciliation-table
  - id: endpoint-clock
    can: Measure through the first user instruction
    scenes:
      - endpoint-clock
  - id: fresh-generation
    can: Identify the first time the whole slot can be reclaimed when a scratch reader and a duplicate VM handle close at different times.
    scenes:
      - fresh-generation
  - id: capacity-arithmetic
    can: Compute raw memory slots and distinguish mean CPU demand from a synchronized admission queue
    scenes:
      - capacity-arithmetic
