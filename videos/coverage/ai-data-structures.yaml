version: 1
lesson: ai-data-structures
promise: Choose which support notes to send a caller. Trace their IDs from the indexing queue to
  the ranked reply, and decide when a saved pair is still valid.
objectives:
  - id: identity
    can: Follow a note through a list resize, count the references copied, resolve a hash collision
      by comparing the original keys, and count a repeated word once per note.
    scenes:
      - opening
      - list
      - representation
      - amortized-ledger
      - scan
      - scan-index
      - hash-collision
      - membership
  - id: retrieval
    can: Count posting visits and score entries, keep the strongest eligible notes in a bounded
      heap, and break tied scores by ID.
    scenes:
      - scores
      - code-contract
      - heap
      - heap-order
      - operation-ledger
      - eligibility
      - answer
      - fresh-permission
  - id: work
    can: Count the shifts when draining a list, compare them with a deque, and track job ownership when
      put_nowait() raises Full or a second worker calls get_nowait() on an empty queue and catches Empty.
    scenes:
      - amortized-ledger
      - queue
      - workers
      - queue-policy
  - id: paths
    can: Traverse a topic subtree, a cyclic graph, and a prefix trie. Count the edges followed and
      the completions returned, then use the index to find which completions occur in the notes.
    scenes:
      - tree
      - graph
      - trie
      - graph-cost
  - id: reuse
    can: Update every changed posting for an edited note, publish a matching snapshot, and store the
      ranking under the caller's permission scope. Protect a saved pair from mutation, rerank for a
      wider scope, evict the least recently used entry, and identify which state must survive a restart.
    scenes:
      - cache-ownership
      - cache-freshness
      - cache-recency
      - eligibility
      - fresh-permission
      - invariant-checks
