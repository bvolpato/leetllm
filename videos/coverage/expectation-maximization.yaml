version: 1
lesson: expectation-maximization
promise: Decide how much a request counts toward each latency component, use those shares to refit a mixture, and check which improvements the fit guarantees.
objectives:
  - id: generative-model
    can: Use input frequency and a conditional hit rate to compute a joint frequency, and identify the trace evidence needed to name a physical cause.
    scenes:
      - generative-boundary
      - mixture
      - model-checks
      - earned-transfer
  - id: inference
    can: Normalize the prior-weighted densities into membership shares, predict which component wins when only the priors change or the distances tie, and recover the shares from finite log scores after underflow.
    scenes:
      - responsibility
      - nearest-limit
      - stable-responsibilities
      - earned-transfer
  - id: bound-ascent
    can: Construct the Jensen bound, measure its posterior KL gap, and tell which of the mean, memberships, bound, and likelihood changes in each step.
    scenes:
      - jensen-construction
      - touching-bound
      - likelihood
  - id: fit-and-check
    can: Compute weighted means and variances, apply a fixed variance floor, and compare symmetric and separated fits on held-out requests.
    scenes:
      - e-step
      - m-step
      - stable-responsibilities
      - variance-constraint
      - initialization
      - model-checks
      - takeaway
  - id: variational-learning
    can: Trace a reconstruction gradient through an encoder sample and distinguish the prior KL penalty from the posterior KL gap.
    scenes:
      - vae
      - reparameterized-encoder
