version: 1
lesson: recursive-context
promise: Use the condition and expiry in an external manual to decide which runs qualify, then choose a route that preserves the required facts within its cost and latency limits.
framing:
  - subject-intro
objectives:
  - id: source-and-state
    can: Retrieve the condition and expiry with their page pointers, apply them to a proposed run, and distinguish the host accepting a candidate from the cited page supporting its date.
    scenes:
      - external-source
      - inspect-source
      - completion
      - environment-contract
      - runtime-stop
      - source-lineage
      - fresh-exception
  - id: bounded-work
    can: Calculate binary-tree and pair counts, complete-history size, request allowances and
      concurrency waves while enforcing shared admission.
    scenes:
      - split-merge
      - baseline-contract
      - history-cap
      - shared-budget
      - request-waves
      - executor-boundary
      - complexity-and-choice
  - id: evaluate-and-repair
    can: Score exact recall before and after repairing a date, distinguish an out-of-scope citation from a conflict, and choose the cheapest eligible route or hold deployment.
    scenes:
      - split-merge
      - baseline-contract
      - source-lineage
      - historical-evidence
      - complexity-and-choice
      - fresh-exception
