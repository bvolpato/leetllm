version: 1
lesson: deep-dive-mlflow
promise: Decide whether a worker served the evaluated release by checking the required case scores and comparing its request with the configuration that earned them.
objectives:
  - id: versioned-execution
    can: Choose a replay that changes only the prompt and identify which worker loaded the evaluated configuration from the retained bytes and its request trace.
    scenes:
      - intro
      - evidence-controls
      - lineage
      - model-package
      - metadata-mutability
      - config-mutation
      - cache-clock
      - alias
      - fresh-config
      - synthesis
  - id: computed-request-evidence
    can: Measure elapsed time outside child spans, locate a missing source in a packed input, and decide which required citation check to run from the case IDs and scores.
    scenes:
      - trace
      - trace-overlap
      - trace-links
      - context-chain
      - citation-computation
      - evaluation
      - evaluation-result
      - dataset-mutation
      - automatic-evidence
      - sdk-evidence
  - id: operational-boundaries
    can: Trace actual storage, authorization, privacy and gateway boundaries, and conserve trace identities
      through a bounded exporter.
    scenes:
      - stores
      - store-route
      - gateway-contract
      - export-queue
      - privacy-gate
      - storage-lifecycle
      - auth-boundary
      - fresh-telemetry
  - id: versioned-source-scope
    can: Use the pinned SDK, source and project evidence at their actual executed and read scopes.
    scenes:
      - project-source
      - source-route
      - sdk-evidence
