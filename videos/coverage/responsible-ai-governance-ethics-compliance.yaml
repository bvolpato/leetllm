    status: taught
    scenes:
      - oversight
      - appeal-replay
      - earned-transfer
  - heading: Gate releases on an evidence package
    status: taught
    note: Changing only the policy in the article's six-field manifest leaves all eight C17 reviews signed for G7. The G8 release needs a matching review for each artifact. C29 keeps its manifest. Its two receipts cover 10% of traffic, and its 15% request requires fresh release, security and exception approvals.
    scenes:
      - package
      - earned-transfer
