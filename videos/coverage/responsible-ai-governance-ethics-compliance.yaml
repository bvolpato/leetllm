version: 1
lesson: responsible-ai-governance-ethics-compliance
promise: Decide whether a proposed rollout can proceed, show the owner which evidence supports the decision, and give them a way to challenge it.
framing: []
objectives:
  - id: route-the-workflow
    can: Use the intended decision, affected people, actor and review date to route a workflow for engineering and legal review.
    scenes:
      - intro
      - workflow
      - legal-scope
      - prohibited-practices
      - high-risk-branches
      - gpai-layer
      - dated-obligations
  - id: test-the-control
    can: Assign a risk owner, distinguish the two failure rates, and identify which eligible requests to replay when an average improves.
    scenes:
      - ownership
      - evaluation-integrity
      - results
      - slices
  - id: replay-a-challenge
    can: Reconstruct a hold with the original proposal, receipts, policy and observed effect, then record an independent appeal.
    scenes:
      - intro
      - audit
      - replay-privacy
      - oversight
      - appeal-replay
  - id: decide-the-rollout
    can: Check which deployment reviews match the current manifest and which reviewer receipts cover the requested traffic share.
    scenes:
      - intro
      - oversight
      - package
      - earned-transfer
