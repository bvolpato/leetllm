  - heading: A trace with real numbers
    status: taught
    scenes: [ hook, score, softmax, mix, matrix, your-turn, close ]
    note: The opening highlights sing as the reader reaches it. The two contributions to its first coordinate, about 0.84 from Birds and 0.58 from sing, stay visible while the viewer adds them. The caption gives their sum when the narrator reaches it. In score, the query [0.5, 1] stays fixed. After seeing the Birds score of 0.60, viewers get two seconds to work out the sing score using its key [0.3, 0.9]. Viewers can multiply the new reader state [1, 3] by the same query matrix to get [2.5, 3.5]. In your-turn, two bars measure sing's lead over Birds in raw dot products. The lead grows from 1.05 − 0.60 = 0.45 to 3.90 − 2.70 = 1.20. In each output stack, Birds supplies about 30% of its value coordinate and sing supplies about 70% of its own. Viewers have two seconds to add 0.60 + 0.70 and 0.30 + 1.40 before the answer caption gives the two totals. The final read changes only the second coordinate of the Birds value.
