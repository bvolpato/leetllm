removed:
  - point: The earlier film's line "That's most of what a transformer is."
    reason: Overclaim. A transformer block also has an output projection, normalization, and a feed-forward network. The close now says that attention is one part of a block.
  - point: The earlier film's line "The word now knows who's singing."
    reason: Overclaim for invented numbers. The script now says that the numbers are invented and the mechanism is real.
  - point: The earlier film's close, which called the key and value cache the next story.
    reason: The article's next lesson is vision transformers, so the handoff now goes there. The cache moved into the decode scene.
  - point: The old script's spoken row-by-column multiplication for each of the query, key, and value projections.
    reason: The arithmetic stays visible on screen, and speaking three identical walks repeats the same operation. The script still names the projections and gives the token states.
  - point: The old script's width-four variance example, where four product terms give variance four.
    reason: It repeats the argument. The general rule and the width sixty-four case teach the same step.
  - point: The term "convex hull" from the old script.
    reason: The idea stays in plain words, as a point on the line between the two values, with the same limits.
  - point: The old script's three-token multi-head example, with head queries of one, one and one point two, point six.
    reason: It needed a new setup. The two-head example continues the running example, so the viewer can compare it with the numbers already worked.
  - point: The old script's output-matrix arithmetic, with signed products entering an accumulator and bars growing from a residual state.
    reason: The join, the output matrix, and the residual addition stay in the script. The coordinate-level arithmetic adds no new idea.
  - point: The old script's repeated remark that runtime depends on kernel reuse, on the cache and grouped-query lines.
    reason: One statement in the FlashAttention scene now says that the time saved depends on the hardware and the workload, and the decode scene says that bandwidth can become the limit. The kernel detail stays on the page.
