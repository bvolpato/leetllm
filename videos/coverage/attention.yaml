version: 1
lesson: attention
promise: Explain how scaled dot-product attention lets each token blend content from the positions it may read, work it by hand, and say what makes it fail or get expensive at real sizes.
framing: []
objectives:
  - id: read-paper-mechanism
    can: Map the paper’s equation and figure to score, scale, mask, shares, value mixing and separate per-head projections.
    scenes: [ paper-reference ]
  - id: route-then-mix
    can: Identify where queries, keys and values come from. Use a source's share and value together to decide how much it contributes to one output coordinate.
    scenes: [ hook, vectors, score, mix, heads, close ]
  - id: work-by-hand
    can: Calculate one query's dot product with two different keys, scale the scores, apply softmax, and mix the values by hand.
    scenes: [ score, softmax, mix, your-turn, close ]
  - id: matrix-and-shapes
    can: Write the matrix formula and state the shape and softmax axis at each step.
    scenes: [ matrix, paper-reference ]
  - id: masks
    can: Build a causal mask, add a padding mask, and handle a row with no key to read.
    scenes: [ mask, decode ]
  - id: why-scale
    can: Derive why scores spread like the square root of the width, and explain what that does to softmax and its gradients.
    scenes: [ why-scale ]
  - id: three-types
    can: Choose among bidirectional, causal, and cross attention from where Q, K, and V come from.
    scenes: [ types ]
  - id: heads
    can: Follow one query-key pair through different head layouts. Count its products and stored scores, then explain how head outputs join and project.
    scenes: [ heads, paper-reference ]
  - id: gradients
    can: Predict how the same increase in one logit moves the output with distinct or identical values, and identify the gradient path when only one source is allowed.
    scenes: [ learn ]
  - id: costs
    can: Estimate quadratic score memory and explain how it differs from decode-time cache traffic.
    scenes: [ cost, decode ]
  - id: cache-sharing
    can: Explain what multi-query and grouped-query attention shrink, what they leave alone, and what they require.
    scenes: [ decode ]
  - id: numerics
    can: Explain the max shift, and tell softmax overflow from a score that overflowed earlier.
    scenes: [ stable ]
  - id: flashattention
    can: Trace online softmax across tiles, and say which bottleneck FlashAttention targets.
    scenes: [ flash ]
  - id: diagnose
    can: Map a symptom to the step of attention that causes it.
    scenes: [ mistakes ]
sections:
  - heading: Three views of one token
    status: taught
    scenes: [ hook, vectors, close ]
    note: The opening labels each word by its distance back from sing. The count starts at zero under the verb and reaches four under its subject, Birds.
  - heading: The core formula
    status: taught
