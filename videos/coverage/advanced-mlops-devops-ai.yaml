version: 1
lesson: advanced-mlops-devops-ai
promise: Decide which complete release should serve the next request, then verify the decision in a request trace after reconciliation.
objectives:
  - id: complete-release
    can: Resolve the manifest and feature values for one request and verify which worker served it after a sync.
    scenes:
      - intro
      - release-boundary
      - gitops-contract
      - release-fingerprint
      - exact-candidate
      - registry-cache
      - trace-tuple
      - worker-recovery
      - reconcile
  - id: computed-temporal-parity
    can: Replay both transforms on the same vector and select a feature that was fresh and available for the request's entity.
    scenes:
      - intro
      - vectors
      - robust-normalization
      - time
      - join-algorithm
      - feature-interface
      - fresh-request
      - reconcile
  - id: release-economics
    can: Find the minimum token reduction that satisfies an inclusive cap and distinguish a paired shadow comparison from user preference.
    scenes:
      - budget
      - golden-contract
      - shadow
      - shadow-pairs
      - sticky-ramp
      - fresh-recovery
  - id: validated-control
    can: Check a measurement's release, window, count and age, then decide when a rollback fires and whether the command still applies.
    scenes:
      - controller
      - typed-telemetry
      - rule-matrix
      - sustained-windows
      - analysis-boundary
  - id: atomic-local-recovery
    can: Predict the committed routing pointer and audit record after a stale command or an audit failure.
    scenes:
      - controller
      - local-lifecycle
      - atomic-publication
sections:
  - heading: What DeployBuddy adds on top of model versioning
    status: taught
    note: The article supplies the one-day us-west miss. The two-weight scorer and calendar entries are separate worked examples.
    scenes:
      - intro
      - release-boundary
  - heading: GitOps for LLM systems
    status: taught
    scenes:
      - gitops-contract
      - release-fingerprint
      - exact-candidate
      - registry-cache
      - reconcile
      - worker-recovery
  - heading: Feature stores for embeddings and LLM features
    status: taught
    scenes:
      - intro
      - vectors
      - robust-normalization
      - time
      - join-algorithm
      - feature-interface
      - fresh-request
      - reconcile
  - heading: Eval-gated prompt and model promotion
    status: taught
    note: The article supplies the 620-token baseline, the 790-token candidate and the three shadow pairs. The 714- and 713-token receipts vary only token use to test the inclusive limit.
    scenes:
      - exact-candidate
      - registry-cache
      - budget
      - golden-contract
      - shadow
      - shadow-pairs
      - sticky-ramp
      - fresh-recovery
  - heading: Automated rollback on evaluation regression
    status: taught
    scenes:
      - controller
      - typed-telemetry
      - rule-matrix
      - sustained-windows
      - analysis-boundary
  - heading: Look up the served tuple from a trace
    status: taught
    note: The release names and feature transforms come from the request lookup. The two sync branches extend mastery question 10. The 13-hour estimate, 12-hour outcome and two-hour tolerance are illustrative.
    scenes:
      - trace-tuple
      - worker-recovery
      - reconcile
  - heading: Run a release lifecycle locally
    status: taught
    scenes:
      - local-lifecycle
      - atomic-publication
      - controller
