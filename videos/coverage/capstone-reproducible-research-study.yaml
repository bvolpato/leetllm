version: 1
lesson: capstone-reproducible-research-study
promise: Decide what a corridor study supports by checking the learner updates, reconstructing the figure from all planned seed pairs, and testing the early and final intervals against the declared rules.
framing: []
objectives:
  - id: intro
    can: Score a paired training episode and explain why a single win leaves the early-learning claim open
    scenes:
      - intro
      - question
  - id: paper-triage
    can: Classify source support, study adaptations and unresolved assumptions
    scenes:
      - paper-triage
  - id: question
    can: Define a falsifiable paired-seed research contract
    scenes:
      - question
  - id: locked-contract
    can: Apply each inclusive or strict research decision predicate
    scenes:
      - locked-contract
  - id: plan-history
    can: Separate observed worked data, amended evidence and untouched confirmation
    scenes:
      - plan-history
  - id: public-boundary
    can: Bound public data, compute, actions and release authority
    scenes:
      - public-boundary
  - id: environment-runtime
    can: Reconstruct the exact corridor state, action, slip, reward and episode rule
    scenes:
      - environment-runtime
  - id: shaping
    can: Compute a transition’s training-only potential addition
    scenes:
      - shaping
  - id: telescoping
    can: Cancel interior terms and retain the final potential remainder
    scenes:
      - telescoping
  - id: time-limit
    can: Choose the correct target under terminal and truncated collection
    scenes:
      - time-limit
  - id: update
    can: Update the starting state and intended action after a slip
    scenes:
      - update
  - id: actual-update
    can: Compute the actual study update and distinguish its step size
    scenes:
      - actual-update
  - id: indexed-tapes
    can: Index random inputs without shifting later episode coordinates
    scenes:
      - indexed-tapes
  - id: controls
    can: Expose an incorrect action update with a slip and check exact zero-potential equality after repairing it
    scenes:
      - controls
  - id: covariance
    can: Calculate the effect of covariance on paired mean variance
    scenes:
      - covariance
  - id: pilot-evaluation
    can: Freeze learned tables before separate original-reward evaluation
    scenes:
      - pilot-evaluation
  - id: ablation-matrix
    can: Assign one changed factor and a declared evidence role to each comparison
    scenes:
      - ablation-matrix
  - id: experiment-ledger
    can: Retain all planned rows and linked mechanical attempts
    scenes:
      - experiment-ledger
  - id: seeds
    can: Trace a gain and a regression to their paired goal counts and retain every seed in the mean
    scenes:
      - question
      - seeds
      - synthesis
  - id: uncertainty
    can: Calculate a resampled mean when the draw selects the same seed pair twice
    scenes:
      - uncertainty
  - id: reported-bootstrap
    can: Reconstruct the actual reported bootstrap distribution and linear quantiles
    scenes:
      - reported-bootstrap
  - id: point-versus-bound
    can: Separate a point-estimate rule from a stronger confidence-bound claim
    scenes:
      - point-versus-bound
  - id: competence
    can: Compare absolute final performance beside relative equivalence
    scenes:
      - competence
  - id: frozen-policy
    can: Explain a weak policy using the retained action table
    scenes:
      - frozen-policy
  - id: resource-axis
    can: Keep episode, transition and time budgets distinct
    scenes:
      - resource-axis
  - id: data-provenance
    can: Reconstruct generated inputs and preserve external-dataset origin
    scenes:
      - data-provenance
  - id: artifact-layers
    can: Bind source, configuration, runtime and outputs to retained references
    scenes:
      - artifact-layers
  - id: hash-counterexample
    can: Distinguish byte consistency from execution and producer identity
    scenes:
      - hash-counterexample
  - id: exporter-chain
    can: Derive the figure and report from the executed row table
    scenes:
      - exporter-chain
  - id: negative-report
    can: Choose a remedy that matches the actual failed evidence layer
    scenes:
      - negative-report
  - id: limitations-next
    can: Translate unsupported extensions into discriminating next studies
    scenes:
      - limitations-next
  - id: review-milestones
    can: Exercise the required evidence before advancing each stage
    scenes:
      - review-milestones
  - id: talk-defense
    can: Allocate a timed evidence presentation and defend it with artifact links
    scenes:
      - talk-defense
  - id: outsider-terms
    can: Classify actual repeatability, reproducibility and replication evidence
    scenes:
      - outsider-terms
  - id: synthesis
    can: Audit a draft figure against the retained seed table and hand over the inputs for a repeat run
    scenes:
      - synthesis
  - id: fresh-interpretation
    can: Repair an overstated report and reconsider the combined claim when only the final lower endpoint changes
    scenes:
      - fresh-interpretation
