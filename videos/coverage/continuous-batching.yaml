removed:
  - point: The Python simulator validates positive integer limits, rejects Boolean capacities, requires unique request IDs, and retains mutable request objects.
    reason: The article demonstrates these API checks in code. The film uses the same two-page example to show the admission limit and the reservation that forces preemption.
