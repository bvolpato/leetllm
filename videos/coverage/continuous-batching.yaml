version: 1
lesson: continuous-batching
promise: Construct one per-request scheduling trace under seat, work and physical-state limits, preserve
  accepted output through pause/resume, and choose an evidence-backed SLO operating point.
framing:
  - intro
objectives:
  - id: schedule
    can: Count useful decode steps in a fixed or refilled batch and identify the first boundary when a waiting request can run.
    scenes:
      - iterations
      - static
      - refill
      - scheduler
  - id: budgets
    can: Count all scheduled input positions, check seat and page limits, and order page reuse after prior reads, writes and transfers. Restore saved state before decode.
    scenes:
      - prefill
      - memory
      - physical-pages
      - projected-growth
      - speculative-work
      - transfer
      - fresh-admission
  - id: fairness
    can: Compare arrival order with a fit scan, identify who keeps waiting, and resume a paused stream without duplicating output.
    scenes:
      - queue-policies
      - fitting-and-fairness
      - recompute-history
      - fresh-admission
  - id: service
    can: Check each stream against its latency limits, count all offered requests, and select the highest tested passing load on comparable traffic.
    scenes:
      - latency
      - slo-completions
      - load-operating-point
      - state-handoff
      - overload-and-health
  - id: handoff
    can: Identify the prompt state and sampled token the decoder needs, then compare first-token delay and the next gap on the client clock.
    scenes:
      - state-handoff
