      - canary-stream
  - heading: Probe the boundaries
    status: taught
    scenes:
      - fallback-policy
      - fresh-boundary
  - heading: Secret disclosure
    status: article-only
    reason: exercise
    note: Independent learner practice remains on the page. The complete prerequisite mechanism and controlled
      failures are taught in canary-stream, sensitive-formats and fresh-boundary.
  - heading: PII minimization
    status: article-only
    reason: exercise
    note: The page provides the independent scanner exercise. The incident note and the limits of its two contact recognizers appear in minimize-data and sensitive-formats.
  - heading: What to check before moving on
    status: taught
    scenes:
      - fresh-boundary
      - fallback-policy
