  - heading: NLI-based verification
    status: taught
    scenes:
      - evidence-verdict
      - fresh-boundary
  - heading: Retrieval-augmented verification
    status: taught
    scenes:
      - retrieval-proof
  - heading: Version policy separately from model releases
    status: taught
    scenes:
      - policy-snapshot
      - policy-live-authority
  - heading: Configurable rules engine
    status: taught
    scenes:
      - policy-snapshot
      - policy-reload
  - heading: Dynamic loading
    status: taught
    scenes:
      - policy-reload
      - policy-snapshot
  - heading: Safety has a latency cost
    status: taught
    scenes:
      - order-and-latency
