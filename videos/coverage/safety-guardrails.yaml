      - governance-logs
  - heading: Structured safety logs
    status: taught
    note: The logging fixture stores a host trace, the redaction outcome and the policy version. The separate R51 and R52 example shows why hashing identical questions would link two traces.
    scenes:
      - governance-logs
      - decision-records
  - heading: Key metrics to track
    status: taught
    note: The labeled safe and harmful populations supply the error-rate denominators. Pooling the 100 safe blocks with 90 harmful blocks gives the review queue its own denominator of 190.
    scenes:
      - measure-errors
      - prevalence-shift
  - heading: Compliance and audit requirements
    status: taught
    scenes:
      - governance-logs
  - heading: Failure patterns worth testing
    status: taught
    scenes:
