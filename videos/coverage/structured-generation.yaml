version: 1
lesson: structured-generation
promise: Decide whether a completed CI reply can update a dashboard. Trace the token that wrote the status,
  check the value against the run, and use the caller's scope to decide whether to read the snapshot.
objectives:
  - id: grammar
    can: Compute the next-token probabilities from the surviving weights and reject a whole token that overshoots a legal record.
    scenes:
      - prefix-language
      - logit-mask
      - conditional-mask
      - value-branch
      - whole-token
      - token-index
  - id: stack
    can: Trace unresolved nesting, discard a failed trial, and distinguish a legal prefix from a completed response.
    scenes:
      - recursive-stack
      - complete-record
      - fresh-nesting
  - id: backend
    can: Distinguish compiled grammar reuse from model prefix reuse, calculate the sampling critical path, and identify which schema rules reach the backend.
    scenes:
      - prefix-jump
      - mask-schedule
      - backend-contracts
      - wire-contract
      - quality-measure
  - id: application
    can: Validate completed bytes and required nullable fields, then check the run, citation, graph identities, schema version and tool envelope.
    scenes:
      - subject-intro
      - interface-contract
      - parser-bytes
      - nullable-field
      - semantic-gates
      - ci-snapshot
      - evidence-action
      - flat-tree
      - tool-protocol
      - sdk-envelope
      - schema-version
      - digest-identities
  - id: consequence
    can: Check that a retry fits the remaining time and cost. Distinguish a permitted snapshot read from an authorized change.
    scenes:
      - bounded-recovery
      - host-approval
      - transfer
      - fresh-incident
