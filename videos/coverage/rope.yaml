version: 1
lesson: rope
promise: Trace where position enters attention, calculate how a change in position affects a score, and decide whether a cached key can reproduce the full pass.
objectives:
  - id: order-and-visibility
    can: Derive a row-permuted attention output and distinguish parallel execution from causal visibility.
    scenes:
      - intro
      - permutation
      - mask-and-prefill
  - id: absolute-position
    can: Construct paired absolute waves, expand their score terms and budget learned or concatenated position
      designs.
    scenes:
      - insertion
      - absolute-waves
      - absolute-mixture
      - finite-table
  - id: rotary-geometry
    can: Read a signed key projection, account for query length, and sum the pair contributions before scaling by the full head width.
    scenes:
      - rotation
      - matrix
      - dot-product
      - shared-shift
      - frequencies
      - full-head-contract
      - pair-sum
      - pairing-contract
      - routing
      - evaluation
  - id: spatial-and-bias
    can: Compute an axial spatial score and an ALiBi penalty while preserving the future mask.
    scenes:
      - axial-coordinates
      - phase-wrap
      - alibi
      - alibi-spectrum
      - far-content
  - id: long-context-schedules
    can: Compare PI, NTK-aware and YaRN frequency and amplitude changes, then test retrieval at different distances within a prompt-plus-generation budget.
    scenes:
      - interpolation
      - position-precision
      - ntk-schedule
      - yarn-bands
      - yarn-temperature
      - checkpoint-contract
  - id: cache-contract
    can: Choose whether to copy or rebuild a rotated key, apply a chunk mask in physical slot order, and check the outputs against a full pass with the same frequency schedule.
    scenes:
      - cached-layer
      - cached-chunk
      - changing-schedule
      - evaluation
      - fresh-position-contract
