      - n: 9
        status: taught
        answer: Accepted [.50,.20,.10]; rejection .20; correction [0,.50,.50].
        reasoning: Accepted proposal mass min(p,q)=[.50,.20,.10], sum .80. Positive residual [0,.10,.10] normalizes to
          [0,.50,.50] and restores p.
        support:
          - scene: speculative-balance
            beat: 0
            quote: Exact speculative sampling aims to accelerate a specified target policy while preserving its output
              distribution in ideal arithmetic. At one position, draw from the actual draft distribution q.
              Accept a proposed token with the smaller of one and its target probability p divided by its
              draft probability q. Accepted proposal mass at that token is the smaller of p and q. A draft
              cannot propose a token to which its own distribution gives zero mass.
          - scene: speculative-balance
            beat: 1
            quote: "The article supplies target probabilities point six, point three and point one, and draft
              probabilities point eight, point one and point one. Accepted mass is point six, point one and
              point one, totaling point eight. Rejection probability is point two. Take the positive part of
              target minus draft and normalize it: all the residual mass belongs to the second token, revoke.
              Adding that correction restores the target row exactly."
          - scene: speculative-balance
            beat: 2
            quote: Redrawing from the unadjusted target on rejection instead produces point seven two, point one six and
              point one two, which is biased. If target and draft agree, rejection mass is zero and no
              residual draw is needed. The target row must include its intended temperature, filters and
              masks, and q must be the actual proposal law. Equal distributions do not imply identical seeded
              text or verified factuality.
