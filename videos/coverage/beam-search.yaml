version: 1
lesson: beam-search
promise: Compute a complete next-token and sequence policy from scores, preserve search and byte ownership,
  distinguish syntax and evaluator scores from task evidence, and reconstruct exact speculative correction
  before repairing a new supplied guide answer.
framing: []
objectives:
  - id: policy-premise
    can: Construct different next-token choices from one score row
    scenes:
      - policy-premise
  - id: search-space
    can: Count continuations and explain why distinct histories prevent a small fixed-state shortcut
    scenes:
      - search-space
  - id: logit-shift
    can: Normalize a shifted logit row without changing its probabilities
    scenes:
      - logit-shift
  - id: logit-boundaries
    can: Diagnose overflow, masked rows and underflowed log probabilities
    scenes:
      - logit-boundaries
  - id: greedy-loop
    can: Append the selected token and distinguish period, EOS and KV reuse
    scenes:
      - greedy-loop
  - id: opening
    can: Demonstrate how a locally best first word can lose the best sentence
    scenes:
      - opening
  - id: probabilities
    can: Multiply conditional edge probabilities along a retained path
    scenes:
      - probabilities
  - id: first-beam
    can: Expand and prune a bounded frontier by cumulative log score
    scenes:
      - first-beam
  - id: search-lattice
    can: Trace inherited scores through the surviving search lattice
    scenes:
      - search-lattice
  - id: stopping
    can: Separate completed EOS paths from the unfinished frontier
    scenes:
      - stopping
  - id: length-score
    can: Compare completed paths using a stated length objective
    scenes:
      - length-score
  - id: width
    can: Predict which candidate survives after changing beam width
    scenes:
      - width
  - id: wider-counterexample
    can: Construct a search tree where a wider frontier loses the final winner
    scenes:
      - wider-counterexample
  - id: length-conventions
    can: Compute raw, per-token and GNMT scores with explicit EOS counting
    scenes:
      - length-conventions
  - id: penalty-sign
    can: Apply the sign-aware repetition penalty once per distinct seen token
    scenes:
      - penalty-sign
  - id: temperature-scale
    can: Compute temperature changes and explain ties, masks and entropy limits
    scenes:
      - temperature-scale
  - id: stream-replay
    can: Distinguish RNG replay from cross-runtime or autoregressive-text identity
    scenes:
      - stream-replay
  - id: filter-k
    can: Compute a rank cutoff and renormalize its retained mass
    scenes:
      - filter-k
  - id: filter-p
    can: Include the cumulative-mass crossing candidate and compare flat support
    scenes:
      - filter-p
  - id: filter-min-p
    can: Compute an inclusive relative cutoff using the current maximum
    scenes:
      - filter-min-p
  - id: filter-boundaries
    can: Resolve ties, zero mass and exact boundary conventions explicitly
    scenes:
      - filter-boundaries
  - id: filter-order
    can: Demonstrate how processor order changes retained candidates
    scenes:
      - filter-order
  - id: grammar-bytes
    can: Advance grammar state through each candidate token’s bytes
    scenes:
      - grammar-bytes
  - id: local-conditioning
    can: Compare local grammar masking with global valid-string conditioning
    scenes:
      - local-conditioning
  - id: best-of-n
    can: Select complete candidates using a stated outcome evaluator
    scenes:
      - best-of-n
  - id: process-evidence
    can: Compare outcome and process evaluation without treating scores as truth
    scenes:
      - process-evidence
  - id: thought-search
    can: Trace frontier and visit bookkeeping through thought search
    scenes:
      - thought-search
  - id: speculative-balance
    can: Account for accepted and residual speculative probability mass
    scenes:
      - speculative-balance
  - id: speculative-block
    can: Keep accepted prefixes and discard the rejected speculative suffix
    scenes:
      - speculative-block
  - id: audit-receipt
    can: Evaluate requested complete answers with the correct denominator
    scenes:
      - audit-receipt
  - id: synthesis
    can: Recompute the changed-edge Mia search result
    scenes:
      - synthesis
  - id: fresh-policy
    can: Predict and repair a fresh guide answer using an explicit allowed set
    scenes:
      - fresh-policy
