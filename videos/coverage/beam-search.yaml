          - scene: filter-min-p
            beat: 1
            quote: The flat maximum point two eight instead sets cutoff point zero two eight, admitting every candidate.
              At a threshold equal to a candidate’s probability, our inclusive rule retains it. Higher
              temperature changes these probabilities, and at an arbitrarily high temperature a fixed base
              below one eventually admits every finite-logit candidate. Evaluate the resulting output policy;
              this cutoff supplies no universal quality guarantee.
