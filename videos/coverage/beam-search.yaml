    questions:
      - n: 1
        status: taught
        answer: Shift [0,0,−2,−∞]; limit [0.5,0.5,0,0]; greedy index 0.
        reasoning: Subtracting a common maximum preserves the row. Two tied maxima split the positive-temperature
          limit; first-index argmax is a separate deterministic policy.
        support:
          - scene: logit-shift
            beat: 1
            quote: Subtract the largest score from every entry, then exponentiate. The shifted scores are zero, negative
              point five, negative two and negative four. Dividing each resulting weight by their sum gives
              probabilities about point five six eight, point three four five, point zero seven seven and
              point zero one zero. The common factor introduced by the shift cancels between numerator and
              denominator.
          - scene: temperature-scale
            beat: 2
            quote: "Inspect a different row: two, two, zero and a masked negative infinity. As positive temperature
              approaches zero, the two equal maxima each retain half the limiting mass. First-index greedy
              would pick only the first. As temperature grows without bound, the three finite candidates
              approach one third each while the masked token remains excluded. A runtime’s zero-temperature
              API convention is separate from substituting zero into this formula."
      - n: 2
        status: taught
        answer: Greedy A-child .052; width 2 B-child .0775; width 3 C-child .17.
        reasoning: The actual article beam helper independently yields .052, .0775 and .17 for widths one, two and
          three on the supplied fresh tree.
        support:
          - scene: first-beam
            beat: 1
            quote: Notice what the width controls. It is the number of partial sentences carried between steps. The model
              still scores possible next tokens, and the search still compares cumulative path scores before
              deciding which prefixes remain active.
          - scene: wider-counterexample
            beat: 0
            quote: A larger beam is not a general guarantee of a larger final score. Build a separate fixed-three-token
              tree with first probabilities A point five, B point three and C point two. A’s next choices have
              probabilities point eight, point one eight and point zero two. B splits equally over ten
              children, while C splits equally over two. Keep these conditional rows identical in both runs.
          - scene: wider-counterexample
            beat: 1
            quote: Width two first keeps A and B, then retains A-one at joint point four and A-two at point zero nine.
              Width three also keeps C, whose two children each reach point one. Its second frontier therefore
              becomes A-one, C-one and C-two, displacing A-two. The larger frontier contains two paths the
              narrower search never expanded, so its retained set is not simply the smaller frontier plus one.
      - n: 3
        status: taught
        answer: Raw short; per-token long; GNMT short.
        reasoning: Raw short −1.2 beats −2. Mean scores −.6 and −.4 prefer long. GNMT −36/35 and −1.2 prefer short.
        support:
          - scene: length-score
            beat: 1
            quote: Divide each completed log score by its generated-token count, including EOS. This changes the objective
              from total sequence probability to average log probability per token. For the width-three
              candidates here, that normalization reverses their order.
          - scene: length-conventions
            beat: 1
            quote: The article compares completed log scores negative one at length two and negative one point six at
              length five, counting EOS. Division by length gives negative point five and negative point three
              two, favoring the long candidate. GNMT instead divides by the quantity five plus length, over
              six, raised to alpha. At alpha one, its scores are about negative point eight five seven and
              negative point nine six zero, favoring the short candidate. State the formula and stopping
              contract before tuning either objective.
      - n: 4
        status: taught
        answer: A=1.2, B=−1.2, C=1.8, Z=0; choose C.
        reasoning: Actual helper returns [1.2,−1.2,1.8,0] and chooses unseen C. Duplicate B applies the distinct-token
          transform once.
        support:
          - scene: penalty-sign
            beat: 1
            quote: In the article’s separate penalty row, create has score three, deploy two point eight and revoke two
              point five. Create was already emitted. Divide its positive score by theta one point two to
              obtain two point five; deploy now wins at two point eight. For a seen negative score, multiply
              by theta instead. Negative one becomes negative one point two. Dividing that negative score
              would move it upward, the opposite effect.
          - scene: penalty-sign
            beat: 2
            quote: Zero stays zero. The lab applies this operation once to each distinct seen token, so repeating an entry
              in the prefix does not apply it again. Lowering a logit does not ban its token, and another
              treated token can lose even more mass during renormalization. Necessary repeated identifiers can
              also be suppressed. A penalty knows token identity, not whether the word is required by the
              evidence.
      - n: 5
        status: taught
        answer: Top-k AB; top-p ABC; min-p AB.
        reasoning: Rank keeps AB. Cumulative .72 misses .80, so top-p keeps ABC. Relative cutoff .24 keeps AB
          including equality.
        support:
          - scene: filter-k
            beat: 0
            quote: For the filter worksheet, take the supplied probabilities point five six eight, point three four five,
              point zero seven seven and point zero one zero as the exact input numbers. Top-k with k two
              keeps create and revoke. Their retained mass is point nine one three. Divide each retained
              probability by that mass to get about point six two two and point three seven eight.
          - scene: filter-p
            beat: 0
            quote: "Nucleus, or top-p, takes the smallest ranked prefix whose cumulative mass reaches the chosen
              threshold. With p point nine zero, the peaked worksheet needs create and revoke: together they
              supply point nine one three. Include the token that crosses the threshold, then renormalize the
              selected candidates. An individual token’s own probability is not compared with point nine
