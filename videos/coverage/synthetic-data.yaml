version: 1
lesson: synthetic-data
promise: Decide which generated search-client examples belong in a training shard, then use an
  independent comparison to decide whether the trained assistant meets its release rules.
framing: []
objectives:
  - id: construct
    can: Generate a task for a missing behavior, follow its request trace, screen its wording
      against held-out tasks and recheck novelty when a proposed reference fails a later gate.
    scenes:
      - intro
      - seed
      - generate
      - task-growth
      - evolution
      - verifier
      - execution-boundaries
      - overlap
      - diversity
      - judge
      - evaluate
      - admission-economics
  - id: release
    can: Construct policy-correct preference records, trace framework dependencies and verify approved
      dataset bytes.
    scenes:
      - safe-preferences
      - framework-preview
      - shard-identity
  - id: measure
    can: Compute finite-sample tail loss, distinguish retained rows from training exposure, account
      for generation costs and apply each release threshold to its own held-out cases.
    scenes:
      - recursive-tail
      - accumulation-weight
      - downstream-trial
      - fresh-admission
