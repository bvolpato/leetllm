version: 1
lesson: ab-testing
promise: Decide whether to ship a query rewrite by tracing incidents from random assignment to mature
  outcomes and comparing resolution lift and grounding uncertainty with the rules set before enrollment.
framing: []
objectives:
  - id: causal
    can: Specify one policy contrast, a stable randomized unit and an estimand with explicit interference limits.
    scenes:
      - intro
      - randomize
      - unit-and-interference
  - id: events
    can: Score usability and grounding separately for one answer, keep timeouts in their assigned arm,
      and count each mature incident once.
    scenes:
      - intro
      - metric
      - event-maturity
      - independent-units
  - id: estimate
    can: Compute lift and independent-arm uncertainty, plan detection power and distinguish it from the full
      launch decision.
    scenes:
      - lift
      - power
      - power-and-decision
  - id: monitor
    can: Check allocation, replay a false alarm under two stopping rules, compare a final statistic with
      the boundary for each design, and track a known-null mixture test.
    scenes:
      - srm
      - peeking
      - alpha-spending
      - mixture-evidence
  - id: design
    can: Calculate a pre-treatment adjustment, update a delayed incident-level bandit and derive when paired
      prompts reduce variance.
    scenes:
      - cuped-adjustment
      - bandit-routing
      - paired-prompts
  - id: decide
    can: Check the evaluator receipt, reproduce the launch decision, and use the same grounding limit
      to explain why two reports with favorable resolution lift receive different decisions.
    scenes:
      - evaluation-stack
      - guardrails
      - decision
      - takeaway
      - fresh-grounding
