version: 1
lesson: experiment-tracking-mlflow-wandb
promise: Trace a routing change to the case it helped or hurt, verify that the saved report and loaded settings match the evaluation, and decide which candidate earns fresh testing.
objectives:
  - id: record-contract
    can: Distinguish run parameters, metric histories, artifacts and searchable tags
    scenes:
      - record-contract
  - id: input-lineage
    can: Predict which edits change the five-field suite fingerprint and identify which inputs need a separate archive
    scenes:
      - fingerprint
      - input-lineage
  - id: tradeoff
    can: Follow the first repair from two matches in two cases to three in four and identify the case behind each kind of error
    scenes:
      - opening
      - paired
      - tradeoff
  - id: frozen-comparison
    can: Reject comparisons that change the cases, evaluator or represented inputs
    scenes:
      - comparability
  - id: version-config
    can: Compare retained prompt text with mutable effective model configuration
    scenes:
      - version-config
  - id: alias-workers
    can: Verify loaded worker identities after alias or configuration changes
    scenes:
      - alias-workers
  - id: sdk-readback
    can: Distinguish actual local recording from hosted synchronization evidence
    scenes:
      - sdk-readback
  - id: weave-call-tree
    can: Map one case to a call tree and asynchronous scorer contract
    scenes:
      - weave-call-tree
  - id: token-cost
    can: Reprice the same request after a cache miss and distinguish first visible output from full generation time
    scenes:
      - token-cost
  - id: receipt-validation
    can: Detect a missing case behind a perfect logged score and test the repaired report with the same verifier
    scenes:
      - lineage
      - receipt-validation
  - id: independent-evaluation
    can: Identify which cases became development evidence after the rollback failure guided the revision
    scenes:
      - feedback
      - handoff
  - id: review-boundary
    can: Apply canary abort precedence without promoting production
    scenes:
      - review-boundary
  - id: compiled-contract
    can: Preserve optimizer and split lineage for a compiled candidate
    scenes:
      - compiled-contract
  - id: fresh-contract
    can: Request the specific missing result, verify the effective worker setting and apply a selection rule if multiple records qualify
    scenes:
      - handoff
      - fresh-contract
