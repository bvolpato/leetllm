version: 1
lesson: semantic-cache
promise: Decide whether a stored answer covers the current request, then use reviewed pairs, generation costs and tail latency to decide whether to enable reuse for that question class.
framing: []
objectives:
  - id: intro
    can: Identify the fact two differently worded requests need and the evidence a live request needs
    scenes:
      - intro
  - id: request-contract
    can: Identify the exact answer dependency before reuse
    scenes:
      - request-contract
  - id: exact-bytes
    can: Build the response key from unchanged text and full scope
    scenes:
      - exact-bytes
  - id: current-authorization
    can: Check the current caller on both cache paths
    scenes:
      - current-authorization
  - id: geometry
    can: Calculate cosine similarity and distance from the same nonzero vectors
    scenes:
      - geometry
  - id: numeric-geometry
    can: Calculate each question's cosine from its first coordinate and length against a horizontal unit vector, and rescale large vectors safely
    scenes:
      - numeric-geometry
  - id: retrieval-scope
    can: Restrict candidate retrieval before inspecting a result
    scenes:
      - retrieval-scope
  - id: route-order
    can: Identify the first failed check and tell whether the request ever reached candidate scoring
    scenes:
      - route-order
  - id: index-contract
    can: Version retrieval geometry separately from answer content
    scenes:
      - index-contract
  - id: threshold
    can: Calculate precision and recall from the pairs proposed at an inclusive similarity cutoff
    scenes:
      - threshold
  - id: shadow-population
    can: Trace individual requests through eligibility, proposal and review to choose each denominator
    scenes:
      - shadow-population
  - id: unseparable-exception
    can: Use the order of reviewed pairs to decide whether to tune the cutoff or narrow the reusable class
    scenes:
      - unseparable-exception
  - id: evidence
    can: Distinguish observed precision from independent-case uncertainty
    scenes:
      - evidence
  - id: heldout-report
    can: Construct the precision bound from independent reviewed cases
    scenes:
      - heldout-report
  - id: gates
    can: Apply scope and exclusive-expiration gates to a stored answer
    scenes:
      - gates
  - id: distributed-cutover
    can: Change reader eligibility before deleting stored bytes
    scenes:
      - distributed-cutover
  - id: admission
    can: Predict what happens to approval when answer text, expiration or registry membership changes
    scenes:
      - admission
  - id: quarantine-write
    can: Keep new answers outside the servable index until approval
    scenes:
      - quarantine-write
  - id: economics
    can: Compute complete-population cost and mixed latency
    scenes:
      - economics
  - id: break-even
    can: Price lookup on every eligible exact miss and derive the safe-hit fraction that pays for it
    scenes:
      - break-even
  - id: large-window-tail
    can: Sort the complete latency mixture before choosing p95
    scenes:
      - large-window-tail
  - id: promotion-evidence
    can: Compare reports against scope, review coverage, Wilson precision, age, daily savings and p95 gates
    scenes:
      - promotion-evidence
  - id: decision-trace
    can: Record which boundary the request actually reached
    scenes:
      - decision-trace
  - id: cache-tiers
    can: Follow exact and semantic answers into the same fresh path
    scenes:
      - cache-tiers
  - id: diagnostic-repair
    can: Choose the repair from the failed decision state
    scenes:
      - diagnostic-repair
  - id: synthesis
    can: Count generation calls and semantic scores across exact hits, denied callers and live reads with a shared prefix
    scenes:
      - synthesis
  - id: fresh-population
    can: Reprice a ten-request window after one release changes and choose a source for a new two-part question
    scenes:
      - fresh-population
sections:
  - heading: An answer is reusable only inside its contract
    status: taught
    scenes:
      - intro
      - request-contract
      - exact-bytes
      - current-authorization
      - index-contract
      - fresh-population
  - heading: Similarity retrieves a candidate, not a truth
    status: taught
    scenes:
      - geometry
      - numeric-geometry
      - retrieval-scope
      - unseparable-exception
      - fresh-population
  - heading: Eligibility rules run before the score threshold
    status: taught
    scenes:
      - route-order
      - current-authorization
      - retrieval-scope
  - heading: Make changed dependencies ineligible before relying on eviction
    status: taught
    scenes:
      - gates
      - distributed-cutover
      - fresh-population
  - heading: Choose a threshold in shadow mode
    status: taught
    scenes:
      - threshold
      - shadow-population
      - evidence
      - heldout-report
      - unseparable-exception
  - heading: A safe cache still has to pay for itself
    status: taught
    scenes:
      - economics
      - break-even
      - large-window-tail
      - fresh-population
  - heading: Authorize writes before they become reusable
    status: taught
    scenes:
      - admission
      - quarantine-write
  - heading: Promote only the narrow policy you tested
    status: taught
    scenes:
      - promotion-evidence
      - heldout-report
  - heading: Record why each request hit or bypassed
    status: taught
    scenes:
      - decision-trace
      - diagnostic-repair
  - heading: Tiered caching hierarchy and provider prompt caching
    status: taught
    scenes:
      - synthesis
      - cache-tiers
      - fresh-population
