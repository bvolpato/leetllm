version: 1
lesson: tokenization
promise: Trace how BPE, WordPiece, and SentencePiece's Unigram cut text, then use the resulting IDs to decide whether a replacement tokenizer lets a checkpoint read and write the intended pieces.
framing: []
objectives:
  - id: choose-granularity
    can: Compare words, characters, and subwords by coverage, sequence length, and attention cost.
    scenes: [ cut ]
  - id: trace-bpe
    can: Train BPE merges by hand, replay them on a new word, and predict the effect of reversing two rules that compete for the same letter.
    scenes: [ merges, unseen, your-turn ]
  - id: limit-merges
    can: Explain why pre-tokenization spans exist, and why token counts do not add across chunks.
    scenes: [ boundaries ]
  - id: byte-coverage
    can: Say what byte-level coverage solves, what it costs, and why a token can split a character.
    scenes: [ bytes ]
  - id: wordpiece
    can: Compare association scoring with raw counts, and trace greedy longest match into its dead end.
    scenes: [ wordpiece-score, wordpiece-match, your-turn ]
  - id: sentencepiece
    can: Explain the space marker and raw-sentence training, and what the marker cannot recover.
    scenes: [ sentencepiece ]
  - id: unigram
    can: Find the best complete cut with Viterbi, compare the probability lost when a pruned piece breaks a path, and explain training with sampled cuts.
    scenes: [ unigram-path, unigram-prune, regularization, your-turn ]
  - id: normalization
    can: Tell NFC from NFKC, and explain how normalization can erase information before any cut.
    scenes: [ normalization ]
  - id: row-contract
    can: Find the first mismatched input row, predict the piece that an untied output head will emit, and identify what a pure ID renumbering must move.
    scenes: [ hook, lookup, close ]
  - id: price-vocabulary
    can: Calculate the memory cost of a vocabulary, and say what evidence would justify paying it.
    scenes: [ economics ]
  - id: production-failures
    can: Recognize language inflation, numeric cuts, code fragmentation, glitch tokens, and overflow from the full request.
    scenes: [ inflation, numbers, code-whitespace, glitch, request ]
