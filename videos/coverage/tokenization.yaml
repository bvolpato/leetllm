removed:
  - point: The running example of plays, with the question of how many positions five letters take, and its corpus of play, plays, and plot.
    reason: Replaced by the rain, rainy, and rail corpus, which teaches the same training and replay and matches the article and the film's computed numbers. The prediction moved to the wordpiece-match, unigram-path, and your-turn scenes.
  - point: The cat and slept example of a replaced vocabulary file, and the two-row demonstration of swapping input and output rows together.
    reason: Replaced by the same point on the falls and soft IDs from the running sentence. The rule that input and output rows must move together stays in the lookup scene.
  - point: The dictionary example of playing, played, and playful collapsing into one unknown token, and playing needing seven character positions.
    reason: Replaced by a typo or new product name, and the seventeen character positions of the running sentence.
  - point: The comparison of Children happily played outdoors at 32, 7, and 4 positions, with score grids of 1,024 and 49 cells.
    reason: Repeats the same quadratic point that the running sentence teaches at 17, 4, and 3 positions, with 289 and 16 comparisons.
  - point: The pre-tokenizer example separating play from outside at a space.
    reason: Replaced by the article's example of failed with a period and failed with an exclamation mark, which also shows why the rule exists.
  - point: The WordPiece trap built from play, pla, and continuation ying, and the Playing with an exclamation mark cleanup example.
    reason: Replaced by the article's rainb, rain, and continuation bow trap, which uses the same corpus theme. The cleanup steps are still named in the wordpiece-match scene.
  - point: The good morning marker example, including why a marker appears before the first word.
    reason: Replaced by rain falls, and the dummy prefix is still taught. The sentencepiece scene says by default one more marker goes at the start.
  - point: The Unigram pruning example of removing ous at zero loss and house at about three nats, and the lattice for longest.
    reason: The marker rain lattice shows why a piece can leave the best score unchanged but still contribute to the word's probability. Removing the whole piece lowers the best score twentyfold.
  - point: The playground piece as an example of a word that saves one position.
    reason: Replaced by a published measurement that shows the trade at real scale.
  - point: The remark that the classroom trainer omits end-of-word markers.
    reason: The original word-based BPE uses them, but a viewer does not need them to understand merging, and the article keeps the detail.
  - point: The unseen word plums, including the point that repeating it in a prompt would not create a new merge.
    reason: Replaced by rainly, a made-up word spelled from the corpus's own letters, because rainbow's B, O, and W are not in that corpus. The unseen scene still teaches that encoding replays a frozen list and invents nothing.
  - point: The closing cards repeated the three segmentation algorithms and the four input IDs.
    reason: The your-turn scene tests all three algorithms on new inputs. The close now tests the other direction of the same ID mapping by following a winning output row through the decoder.
