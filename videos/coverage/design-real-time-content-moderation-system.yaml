version: 1
lesson: design-real-time-content-moderation-system
promise: Decide when a post may go public, when review must continue, and how to correct what a member sees. Size the moderation path for the surface deadline and keep each action bound to its evidence and revision.
objectives:
  - id: evaluate-evidence
    can: Test a policy exception, retain every triggered category, and combine scores from assessed inputs. Distinguish untrusted content, valid model output, and the authority to publish.
    scenes:
      - intro
      - categories
      - judge-contract
      - modality-contract
      - video-evidence
      - fusion-boundary
      - policy-release
      - provider-migration
      - synthesis
      - fresh-moderation
  - id: size-and-bound
    can: Size each stage and its reviewers from incoming work, predict which requests leave at a timer tick, and calculate backlog recovery. Choose the surface’s approved timeout action under overload.
    scenes:
      - surfaces
      - review-intake
      - cascade
      - capacity-ledger
      - batching
      - batch-work
      - batch-edge
      - overload
      - rates
  - id: bind-and-correct
    can: Bind the decision to its revision, policy, and approved regional scope. Reject a stale approval, commit a current decision once, and trace a still-hidden post from its appeal correction to a cached block.
    scenes:
      - regional-authority
      - evidence-scope
      - revisions
      - decision-cache
      - commit-binding
      - appeal-labels
      - synthesis
      - fresh-moderation
