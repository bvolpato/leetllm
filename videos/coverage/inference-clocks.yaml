version: 1
lesson: inference-clocks
promise: Use a request's token times and reserved pages to decide whether to investigate its first wait, its streaming gaps, its delivery path or its admission budget.
framing:
  - intro
objectives:
  - id: locate-the-wait
    can: Compare requests with the same finish, measure their first waits and later gaps, and use matched token identities to locate a client pause.
    scenes:
      - intro
      - first-clock
      - cadence
      - delivery
      - synthesis
      - earned-transfer
  - id: price-the-next-position
    can: Track which tokens have entered the cache, derive bytes per position from stored heads and attention layers, and decide whether a page-rounded reservation fits.
    scenes:
      - prefill
      - decode
      - cache-payload
      - page-admission
      - quantize-capacity
      - earned-transfer
  - id: test-a-serving-change
    can: Choose a hardware, scheduling or precision experiment and compare correctness and latency across the complete offered workload.
    scenes:
      - roofline
      - hardware-ceilings
      - chunk-and-handoff
      - quantize-capacity
      - earned-transfer
