version: 1
lesson: gradients-backprop
promise: Decide whether to keep a latency predictor’s update by tracing the gradient, checking its size,
  and measuring the new prediction on the request that supplied it.
objectives:
  - id: local-slope
    can: Derive the local loss slope, check it using the stored losses and weight spacing, and measure the loss after a finite step.
    scenes:
      - subject-intro
      - why-train
      - probe-neighbor
      - derivative-limit
      - update-step
      - step-size-limits
      - stable-scale
      - gradient-check
      - check-backward-rule
  - id: reverse-trace
    can: Trace the loss signal through a linear branch or a ReLU, multiply the local derivatives, and add the contributions that reach a shared weight.
    scenes:
      - forward-graph
      - chain-rule
      - path-accumulation
      - relu-gate
      - relu-corner
      - reverse-mode
      - nonlinear-forward
      - nonlinear-update
      - deep-products
      - fresh-nonlinear
  - id: check-cost
    can: Count the extra forward runs for a one-sided check and explain how one reverse pass supplies all six derivatives in the worked example.
    scenes:
      - reverse-mode
  - id: objective-storage
    can: Compute a batch gradient from the chosen reduction or seed, and track which forward values and leaf gradients a backward call uses.
    scenes:
      - path-accumulation
      - batch-conditioning
      - vector-seed
      - pytorch-loop
      - saved-output
      - expanded-storage
  - id: transfer
    can: Use the new input and saved activation to decide which gradient entries change, then compare the fresh and copied steps on the same request.
    scenes:
      - subject-intro
      - why-train
      - parameters-shape-loss
      - gradient-vector
      - gradient-geometry
      - nonlinear-forward
      - nonlinear-update
      - keep-the-model-honest
      - fresh-nonlinear
