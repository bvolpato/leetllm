      - metric-evaluation
  - heading: Approximate search is a recall decision
    status: taught
    scenes:
      - dense-scan
      - ivf-probes
      - hnsw-layers
      - pq-code
      - index-composition
  - heading: Watch an IVF probe miss the nearest passage
    note: Both query positions use the article’s three passage positions, Euclidean distances and two fixed centers. The flat reference scans all three original coordinates.
    status: taught
    scenes:
      - ivf-probes
      - fresh-probe
  - heading: A version filter changes the search problem
    status: taught
    scenes:
      - filter-scope
  - heading: Put an exact-search gate around ANN settings
    note: The film compares a hypothetical return of d1 with the article’s exact cosine winner and relevance judgments. The separate four-query comparison uses the article’s supplied ID arrays.
    status: taught
    scenes:
      - ann-comparison
