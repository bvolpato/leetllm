version: 1
lesson: retrieval-indexing
promise: Follow a useful passage through word search, vector search, fusion and reranking. Locate the first stage that drops it and choose a change to test against exact search, relevance judgments and measured cost.
objectives:
  - id: lexical
    can: Build posting lists, preserve exact identifiers, and use BM25 and bounded selection to explain which word matches survive.
    scenes:
      - opening
      - postings
      - query
      - bm25
      - ranking
      - top-k
      - storage
      - analyzer-contract
      - bm25-controls
  - id: geometry
    can: Use vector direction and length to predict cosine and raw dot-product rankings under the embedding contract.
    scenes:
      - dense-encoding
      - similarity-contract
  - id: shortlist
    can: Add reciprocal-rank votes and locate a missing passage by comparing the fused IDs with the pairs that reached the reranker.
    scenes:
      - fusion-ranks
      - fusion-scale
      - joint-reranker
      - retrieval-review
  - id: evaluation
    can: Calculate hit rate, macro recall, reciprocal rank and graded ranking quality from the same judged queries at stated cutoffs.
    scenes:
      - evaluation
      - metric-evaluation
      - retrieval-review
  - id: approximation
    can: Predict which passages each probe or graph frontier can reach, count routing and scoring separately, and explain how PQ can change a distance.
    scenes:
      - dense-scan
      - ivf-probes
      - hnsw-layers
      - pq-code
      - index-composition
      - fresh-probe
  - id: scope
    can: Compare approximate and exact IDs within the same eligible set, then compare the returned evidence with human judgments.
    scenes:
      - filter-scope
      - ann-comparison
      - fresh-probe
