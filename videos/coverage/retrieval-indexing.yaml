  - heading: Fuse independent retrieval lanes
    note: The two-slot and three-slot comparisons reuse the article’s lane ranks and fusion constant of 60. The score ruler separately adds a fourth candidate to the same raw scores.
    status: taught
    scenes:
      - fusion-ranks
      - fusion-scale
  - heading: Reranking spends compute on the shortlist
    note: The article supplies the three hypothetical scores. The joint-input example counts its special tokens and shows which words remain after truncation.
    status: taught
