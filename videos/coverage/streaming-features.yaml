version: 1
lesson: streaming-features
promise: Rebuild the row a scheduler could read for a particular request, then use its source coverage and a paired replay to decide whether to score or investigate.
objectives:
  - id: replay-information
    can: Select a readable heartbeat using the worker and publication times. Compute its age at the request and identify which request would receive a later backlog update from a shared snapshot.
    scenes:
      - intro
      - availability-clock
      - event-arrival-clocks
      - per-row-joins
      - join-contract
      - batch-online
      - fresh-request
  - id: protect-transitions
    can: Apply the source revision, quarantine conflicting phases at the same ordering key, and predict which ledger and backlog values survive a crash and retry.
    scenes:
      - revision-ordering
      - quarantine-state
      - idempotent-updates
      - atomic-crash
      - source-progress
  - id: separate-window-clocks
    can: Determine window membership and the minimum active watermark. Compare the watermark with the window end and the record time, then replace the current total while retaining the count captured by an earlier request.
    scenes:
      - watermarks
      - window-geometry
      - watermark-inputs
      - window-publication
  - id: evaluate-serving-parity
    can: Choose a scoring mode from exact source lag when the heartbeat age and last write stay fixed. Compare captured and replayed fields by request, type and tolerance, and test a suspected cached age at two request times.
    scenes:
      - freshness-policy
      - freshness-boundary
      - parity-reconciliation
      - parity-contract
      - diagnostic-evidence
      - wrap
      - fresh-request
