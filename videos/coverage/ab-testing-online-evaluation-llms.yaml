version: 1
lesson: ab-testing-online-evaluation-llms
promise: Decide whether a prompt change earns release by following assigned users through a planned experiment, estimating the benefit, and checking each safety, time, and cost limit.
framing: []
objectives:
  - id: intro
    can: Compare resolution rates among assigned users and identify the missing evidence for a response-time decision
    scenes:
      - intro
  - id: point-estimate
    can: Compute the absolute and relative resolution gains and measure how far each change exceeds its own limit
    scenes:
      - point-estimate
  - id: measurement-contract
    can: Choose the evaluator that measures the declared property
    scenes:
      - measurement-contract
  - id: treatment-identity
    can: Pin the treatment bundle and define the outcome estimand
    scenes:
      - treatment-identity
  - id: screen
    can: Separate an offline screen from evidence of live user benefit
    scenes:
      - screen
  - id: rubric-evidence
    can: Compute paired rubric averages and half-credit ties on their actual case denominator
    scenes:
      - rubric-evidence
  - id: token-clock
    can: Distinguish output-token clocks from endpoint event and chunk timings
    scenes:
      - token-clock
  - id: feedback-join
    can: Join mature delayed outcomes and deduplicate retries under immutable conversation identity
    scenes:
      - feedback-join
  - id: power
    can: Choose the detectable effect before budgeting traffic
    scenes:
      - power
  - id: power-construction
    can: Calculate a binary experiment's traffic budget and predict how it changes when the target lift halves
    scenes:
      - power-construction
  - id: assignment
    can: Keep repeated turns and failed fallbacks in their original assignment
    scenes:
      - assignment
  - id: units-and-spillover
    can: Match assignment, analysis weighting and interference boundaries
    scenes:
      - units-and-spillover
  - id: router-ramp
    can: Trace persisted assignments through a later enrollment-ramp change
    scenes:
      - router-ramp
  - id: shadow-resource
    can: Distinguish offline, shadow, canary and exposed comparisons and isolate shadow effects
    scenes:
      - shadow-resource
  - id: team-draft
    can: Build a deduplicated ranking and credit only owned nonshared clicks
    scenes:
      - team-draft
  - id: metric-family
    can: Apply Bonferroni and BH to the same named metric family
    scenes:
      - metric-family
  - id: looks
    can: Spend a fixed error budget across four scheduled looks and decide whether to stop as each p-value arrives
    scenes:
      - looks
  - id: valid-looking
    can: Apply the registered divisor at an interim look and explain how changing it can reverse the stopping decision
    scenes:
      - valid-looking
  - id: ratio
    can: Check the assigned-unit split before interpreting the effect
    scenes:
      - ratio
  - id: srm-residual
    can: Compute expected counts, residual contributions and the two-arm diagnostic tail
    scenes:
      - srm-residual
  - id: uncertainty
    can: Interpret the interval of the actual seeded cohort
    scenes:
      - uncertainty
  - id: interval-construction
    can: Build an interval from the two assigned-user counts and identify the false precision that comes from substituting log-row counts
    scenes:
      - interval-construction
  - id: window-controller
    can: Trace breach streaks and unavailable-data recommendations separately by metric
    scenes:
      - window-controller
  - id: ship
    can: Apply all required outcome and guardrail conditions
    scenes:
      - ship
  - id: safety-geometry
    can: Compare a safety interval with its harm margin and separate absolute service limits
    scenes:
      - safety-geometry
  - id: zero-incidents
    can: Invert the zero-failure probability under declared detection and independence assumptions
    scenes:
      - zero-incidents
  - id: posterior-routing
    can: Update only an observed selected-arm reward and route by sampled posterior values
    scenes:
      - posterior-routing
  - id: mix-reweight
    can: Diagnose a mixture reversal while retaining within-cohort rates
    scenes:
      - mix-reweight
  - id: judge-data
    can: Keep candidate instructions in trace-linked untrusted payload data
    scenes:
      - judge-data
  - id: calibration-audit
    can: Compute held-out agreement and keep a local threshold within its evidence
    scenes:
      - calibration-audit
  - id: inline-asynchronous
    can: Separate pre-release buffering from asynchronous trace-linked judging
    scenes:
      - inline-asynchronous
  - id: release-contract
    can: Bind readout to mature assigned outcomes and the immutable planned decision rule
    scenes:
      - release-contract
  - id: fresh-release
    can: Identify which release condition fails when both prompts are slow and when a new resolution interval includes zero
    scenes:
      - fresh-release
