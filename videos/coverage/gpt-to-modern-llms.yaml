version: 1
lesson: gpt-to-modern-llms
promise: Follow two predictions into a complete label, verify that label, and choose a model that fits the measured workload.
framing: []
objectives:
  - id: opening
    can: Test the whole generated reply against the allowed labels, then compare it with the reference.
    scenes:
      - opening
  - id: task-interfaces
    can: Identify the visible prefix and shifted target in a causal mask.
    scenes:
      - task-interfaces
  - id: context-transform
    can: Compute a weighted value sum from supplied attention shares.
    scenes:
      - context-transform
  - id: token-path
    can: Compute logits and normalized probabilities and select the next token.
    scenes:
      - token-path
  - id: prompting-and-training
    can: Distinguish prompt demonstrations from gradient updates.
    scenes:
      - prompting-and-training
  - id: prefill-decode
    can: Identify the selected token still missing from the cache and predict the next token with the same output weights.
    scenes:
      - prefill-decode
  - id: assistant-training
    can: Distinguish pretraining, task adaptation, in-context examples and preference post-training.
    scenes:
      - assistant-training
  - id: training-budget
    can: Compare a fixed dense training budget with the cost of doubling both parameters and tokens.
    scenes:
      - training-budget
  - id: kv-memory
    can: Count distinct stored KV heads, calculate raw bytes, and explain why sharing leaves room for distinct query outputs.
    scenes:
      - kv-memory
  - id: modern-norm
    can: Compute RMSNorm and distinguish it from centered LayerNorm.
    scenes:
      - modern-norm
  - id: modern-gate
    can: Compute a scalar SiLU gate and match the bias-free feed-forward weight budget.
    scenes:
      - modern-gate
  - id: modern-positions
    can: Predict how the RoPE score changes when both positions shift together or only the key moves.
    scenes:
      - modern-positions
  - id: sparse-experts
    can: Choose two experts from router scores and size a fully resident checkpoint from its total weights.
    scenes:
      - sparse-experts
  - id: reasoning-context
    can: Distinguish missing evidence from a position effect and interpret supported-answer counts on matched prompts.
    scenes:
      - reasoning-context
  - id: workload-choice
    can: Apply the deadline and memory limit independently, then compare verified success among eligible runs.
    scenes:
      - workload-choice
