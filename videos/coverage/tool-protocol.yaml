version: 1
lesson: tool-protocol
promise: Decide which release status a host can report and whether it can send a proposed
  traffic change under MCP 2026-07-28.
objectives:
  - id: accept-observation
    can: Compare the request and reply IDs, release, source and observation time before
      reporting a canary reading. Explain what an older reading still establishes.
    scenes:
      - subject-intro
      - validate-results
      - result-contract
      - fresh-tool
  - id: trace-protocol
    can: Compute reusable integration counts and correlate typed requests, capabilities and layered
      results without granting ambient authority.
    scenes:
      - subject-intro
      - reuse-arithmetic
      - host-client-server
      - request-correlation
      - discover-and-negotiate
      - validate-results
      - result-contract
  - id: continue-operation
    can: Select a tool, resource or prompt, bound the local process and choose the protocol
      era. On a paused operation, compare the retry with the saved caller and target, then
      check current permission.
    scenes:
      - tools-resources-prompts
      - bounded-stdio
      - transport-and-pause
      - mrtr-state
      - era-fallback
  - id: protect-http
    can: Match mirrored headers to body operations and independently validate Origin, OAuth
      issuer/resource audience and per-release authority.
    scenes:
      - http-binding
      - http-identity
  - id: audit-trajectory
    can: Scope catalog reuse to the caller and grade a write from its dispatch history.
      Distinguish a pre-dispatch hold, a server denial and a missing reply.
    scenes:
      - catalog-and-trust
      - scoped-cache
      - fresh-tool
