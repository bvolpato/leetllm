version: 1
lesson: prefix-reuse
promise: Find the longest compatible, available prefix a request may read. Count the remaining prefill and use that count to decide whether the request fits its budget.
objectives:
  - id: derive-reuse
    can: Locate the first changed token, round down to a complete shared block and decide whether the guide suffix and question fit the fresh-input allowance.
    scenes:
      - intro
      - causal-keys
      - radix-split
      - block-boundaries
      - prompt-order
      - rendered-identity
      - fresh-budget
  - id: verify-entry
    can: Check both the selected endpoint and the owner of a completed entry before counting a read.
    scenes:
      - intro
      - publication
      - hosted-boundaries
      - lookup-window
      - isolation
      - isolation-probes
  - id: price-and-route
    can: Normalize actual usage buckets, compute full and partial write economics, and choose a route
      using the complete first-token path.
    scenes:
      - usage-buckets
      - write-economics
      - partial-writes
      - worker-locality
      - latency-path
      - savings
  - id: diagnose-capacity
    can: Distinguish token yield, physical ownership, availability and answer correctness under
      one-variable changes.
    scenes:
      - pool
      - pool-headroom
      - telemetry-slices
      - savings
      - diagnose-replay
      - fresh-budget
