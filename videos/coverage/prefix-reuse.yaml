reviews:
  closed_book:
    script: 31609df21a6fe62d
    taught: 10
    partial: 0
    absent: 0
    reviewer: Independent Aurora review of the revised narration
    evidence: >
      The spoken rules yield 4224 reused and 76 fresh tokens for the 32-token block question.
      The marker must reach 1536 tokens. The 20-position lookback finds 12, then 40 after adding the marker.
      Three priced requests cost 11550 units. Worker B reaches its first token at 550 ms and finishes at 1250 ms.
      Both usage fixtures report 25% reads. The pool has 88 referenced blocks and 32 available.
      Switching adapters invalidates the stored guide. A later timestamp permits guide reuse.
      The policy replay repairs stale rendered input first and isolates answer caching when cold input is current.
      The final request needs 720 fresh tokens and exceeds its limit of 700.
  fact_check:
    script: 31609df21a6fe62d
    open_findings: 0
    reviewer: Independent Aurora review of the revised block example and article
    evidence: >
      In the literal token rows, the first nine tokens match. Tokens 10 through 12 differ.
      Two four-token blocks match, so token nine needs fresh computation. Replacing token three
      leaves only two matching positions and zero reusable blocks. The native sampleModel
      returned these values for both states. Recalculation with the film arithmetic also
      confirmed the block rounding, inclusive lookback, partial-write charge, free-first
      allocation, and fresh-token budget in the article quiz.
