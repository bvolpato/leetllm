version: 1
lesson: vector-search
promise: Trace a missing rollback passage to the step that excluded it and choose a search budget that meets both recall and latency limits.
framing:
  - subject-intro
objectives:
  - id: recover-neighbors
    can: Score an exact pair, identify a missed passage in a graph walk or a posting list, and count recovered IDs.
    scenes: [exact-baseline, greedy-hops, hierarchy-beam, centroid-partitions, probe-boundary, recall-ledger]
  - id: budget-index
    can: Distinguish graph construction from query exploration and estimate the raw bytes, list scores and code bytes each index needs.
    scenes: [hierarchy-beam, insert-graph, scale-budget, pq-encode]
  - id: diagnose-shortlist
    can: Follow two code bytes through their distance tables and decide when reranking or expanding the candidate set can restore a neighbor.
    scenes: [pq-encode, adc-lookup, probe-boundary, transfer]
  - id: audit-eligibility
    can: Recompute eligible winners after a filter, deletion or metric migration, and identify when a shard merge is partial.
    scenes: [transfer, filtered-distributed, metric-replay]
  - id: select-setting
    can: Compare search settings on a fixed query set and apply both a neighbor recall floor and a workload latency ceiling.
    scenes: [recall-ledger, scale-budget, earned-transfer]
