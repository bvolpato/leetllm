version: 1
lesson: softmax
promise: Teach the full competing-score to stable-loss andgradient construction,then apply
  complete target,sequence,mask,reduction andlarge-vocabulary contracts in one movie.
objectives:
  - id: competing-shares
    can: Construct normalized shares from score gaps and preserve them through common shifts
      using bounded exponentials.
    scenes:
      - intro
      - scores
      - exponentials
      - mass
  - id: loss-stability
    can: Compute stable target losses without taking log of an underflowed probability,and
      diagnose nonfinite or empty candidate rows.
    scenes:
      - loss
      - temperature-limits
  - id: derive-gradient
    can: Construct self/cross softmax derivatives and carry the negative-log slope into the
      exact zero-sum p-minus-target correction.
    scenes:
      - gradient-chain
      - gradient
      - update
  - id: target-uncertainty
    can: Distinguish entropy,cross-entropy andKL including zero support,and construct the
      finite-gap smoothed-target optimum.
    scenes:
      - entropy-reference
      - smoothing-equilibrium
  - id: loss-choice
    can: Compare computed CE/Brier local gradients and repair an extra softmax in the PyTorch
      loss input.
    scenes:
      - squared-vs-ce
      - loss-input-contract
  - id: temperature
    can: Separate temperature,calibration,sampling andlearning,including ties,stable order
      anddistillation gradient scale.
    scenes:
      - temperature
      - temperature-limits
  - id: sequence-contract
    can: Align next-token targets once,choose class axes,mask positions rather than
      classes,andretain the exact reduction denominator.
    scenes:
      - transfer
      - teacher-forcing
      - token-reduction
      - class-not-position
      - weighted-reduction
      - earned-transfer
  - id: vocabulary-memory
    can: Calculate logit-intermediate bytes andexplain projection-tiled log-sum-exp without
      inventing aGPU benchmark.
    scenes:
      - vocabulary-tiles
