version: 1
lesson: sparse-autoencoders
promise: Decide whether removing a candidate direction explains the score difference between two requests, and identify the controls a real feature claim needs.
framing:
  - intro
  - feature-audit
objectives:
  - id: reconstruct
    can: Decompose a mixed coordinate, bound interference, and distinguish detector weights from decoder columns.
    scenes: [intro, packing-bound, dictionary]
  - id: compare-codes
    can: Use reconstruction cost, magnitude, and support to predict which coefficients survive a training rule.
    scenes: [objective, shrinkage, selection, gated-learning]
  - id: test-directions
    can: Compute an edit at the matching hook, preserve its residual, and compare the predicted change with a control.
    scenes: [ablation, steering, clamp-and-gradient, hook-and-circuit, feature-audit]
  - id: evaluate-recovery
    can: Compare downstream loss and held-out reconstruction with support, semantic recall, and direction alignment at initialization and after training.
    scenes: [coverage, training-evidence, feature-audit]
