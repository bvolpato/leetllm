version: 1
lesson: gpu-runtime-execution-lab
promise: Trace a GPU sum back to its request, decide when the CPU can read it, and use completed timings to decide whether to replay the graph.
objectives:
  - id: value-order
    can: Compute one input's contribution, locate the first safe CPU read, and find the reader that can start too early when the copy wait is removed.
    scenes:
      - intro
      - pipeline-values
      - schedule
      - completion-scope
      - default-streams
      - events
      - event-generations
      - overlap-slots
      - allocator-lifetime
  - id: measure-reuse
    can: Convert overlapping receipt intervals to means, check completed wall time, and distinguish the run that recovers setup from the first run that saves time.
    scenes:
      - interval-math
      - bench-preflight
      - graphs
      - capture-lifecycle
      - amortization-rule
      - real-lab-walk
      - measured-receipt
  - id: captured-contract
    can: Follow a captured pointer through rebinding and an ordered copy, choose a compatible bucket, and check both its masked sum and its cache writes. Use the graph update result to decide which executable a later launch can use.
    scenes:
      - capture-frontier
      - pointers
      - graph-updates
      - padding
      - compatible-dispatch
      - fresh-four-slot
  - id: queue-diagnosis
    can: Follow a waiting request into a slot after its last reader finishes. Trace a stalled worker or a wrong result to the next diagnostic check.
    scenes:
      - workers
      - persistent-publication
      - resource-cycle
      - diagnose-trace
      - fresh-four-slot
