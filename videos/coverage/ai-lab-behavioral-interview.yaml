version: 1
lesson: ai-lab-behavioral-interview
promise: Use a release record to explain what you recommended, who owned the repair and approval, and which
  claims the measurements support when an interviewer challenges your answer.
framing: []
objectives:
  - id: opening
    can: Identify the fictional access failure and the zero-traffic decision
    scenes:
      - opening
  - id: values-evidence
    can: Attach a stated value to an owned artifact and observable consequence
    scenes:
      - practice
      - mission-evidence
  - id: evidence
    can: Explain how one candidate request out of twenty can be every request from one tenant, and why Friday’s
      two targeted failures have no production denominator
    scenes:
      - evidence
  - id: sequence
    can: Separate reproduction, recommendation, authorization repair and approval owners
    scenes:
      - tradeoff
      - practice
  - id: timeline
    can: Keep case and build identity through a controlled owner sequence
    scenes:
      - opening
      - tradeoff
      - canary
  - id: tradeoff
    can: Defend the hold on B17, name the evidence on B18 that changes the recommendation, and distinguish
      eligibility from Priya’s approval
    scenes:
      - tradeoff
  - id: executable-gate
    can: Apply exact keys, literal Boolean results, complete window and strict finite latency predicates
    scenes:
      - executable-gate
  - id: canary
    can: Bound a reported p95 and compute a separately labeled nearest-rank illustration
    scenes:
      - canary
  - id: reflection
    can: Limit the outcome and reflection to the observation that supports them
    scenes:
      - practice
      - rehearsal-repair
  - id: star-followups
    can: Answer skeptical follow-ups with an artifact, owner, cost or explicit unknown
    scenes:
      - tradeoff
      - practice
      - published-guidance
      - rehearsal-repair
  - id: story-bank
    can: Select a real packet whose decisions actually fit a given prompt
    scenes:
      - story-bank
  - id: published-guidance
    can: Use inspected dated employer guidance without inventing a private scoring rubric
    scenes:
      - published-guidance
  - id: unresolved-disagreement
    can: Describe unresolved decisions, legitimate authority and permitted experiment exposure
    scenes:
      - unresolved-disagreement
  - id: negative-evidence
    can: Keep two failed boundary cases in the hundred-case development record and use untouched cases to assess
      the repair
    scenes:
      - negative-evidence
  - id: dual-use
    can: Connect benefit, misuse path, exposed group and inspected preventive control
    scenes:
      - dual-use
  - id: weakness-evidence
    can: Trace a late draft to rework, count later pre-coding reviews, and identify the missing dates needed for
      a delivery claim
    scenes:
      - weakness-evidence
  - id: mission-evidence
    can: Connect an actual mechanism to motivation and a bounded learning question
    scenes:
      - mission-evidence
  - id: ai-use-policy
    can: Separate permitted rehearsal, sanitized evidence and each live format’s explicit policy
    scenes:
      - ai-use-policy
  - id: practice
    can: Assemble a complete evidence-based answer using the original fictional receipts
    scenes:
      - practice
  - id: rehearsal-repair
    can: Remove unsupported ownership, threshold-as-baseline and recurrence claims before compression
    scenes:
      - rehearsal-repair
  - id: diagnose-story
    can: Repair the missing evidence field instead of merely polishing its wording
    scenes:
      - story-bank
      - rehearsal-repair
  - id: fresh-decision
    can: Recommend withdrawal at 500 ms and owner review at 480 ms while naming the service repair and approval
      owners accurately
    scenes:
      - fresh-decision
