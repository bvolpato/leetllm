version: 1
lesson: deep-dive-pytorch
promise: Trace a tensor from shared storage through dispatch, autograd, attention, compilation and
  distributed placement, then diagnose and reproduce the state required for a correct next training
  update.
objectives:
  - id: intro
    can: Use successive storage addresses to predict whether a one-dimensional view is possible
    scenes:
      - intro
  - id: strides
    can: Calculate the byte offset of an alias write and predict which read changes after a reshape
    scenes:
      - strides
  - id: tensor-contract
    can: Distinguish ordinary storage metadata, views and consumer copies
    scenes:
      - tensor-contract
  - id: dispatch-layers
    can: Trace an operator schema through backend and transformation modes
    scenes:
      - dispatch-layers
  - id: tape-lifecycle
    can: Construct the actual reverse path and detect saved-intermediate mutation
    scenes:
      - tape-lifecycle
  - id: autograd
    can: Repair a stale saved version using independent storage
    scenes:
      - autograd
  - id: attention
    can: Place a cached query at its actual position and check its output against the permitted values
    scenes:
      - attention
  - id: attention-selector
    can: Estimate dense score storage in bytes and distinguish that cost from dot product work
    scenes:
      - attention-selector
  - id: mask-modes
    can: Use a distinctive padding value to test a boolean mask conversion with dropout off
    scenes:
      - mask-modes
  - id: compile
    can: Evaluate each guard and reuse the correct specialization
    scenes:
      - compile
  - id: compiler-regions
    can: Distinguish graph breaks, guard failure and optimized code generation
    scenes:
      - compiler-regions
  - id: autocast-boundary
    can: Match compiled backward assumptions to its actual precision context
    scenes:
      - autocast-boundary
  - id: placement
    can: Add matching coordinates and send each sum to the ranks that need it
    scenes:
      - placement
  - id: process-groups
    can: Diagnose rank-order and collective-contract divergence
    scenes:
      - process-groups
  - id: mesh-shapes
    can: Calculate a local shard on one named mesh axis
    scenes:
      - mesh-shapes
  - id: tensor-split
    can: Derive Linear stored-weight sharding and operator ownership
    scenes:
      - tensor-split
  - id: pipeline-schedule
    can: Trace stage dependencies and exposed fill/drain slots
    scenes:
      - pipeline-schedule
  - id: pipeline-scaling
    can: Recover the full-batch gradient with exactly one scale division
    scenes:
      - pipeline-scaling
  - id: residency
    can: Trace parameter gathers and configured release/retention
    scenes:
      - residency
  - id: fsdp-hooks
    can: Use the entry path and policy that execute the required hooks
    scenes:
      - fsdp-hooks
  - id: live-peak
    can: Compare simultaneous allocations with a rank budget and predict the effect of delaying prefetch
    scenes:
      - live-peak
  - id: recovery
    can: Use the first moment to explain why a weights-only restore can reverse the next Adam step
    scenes:
      - recovery
  - id: dcp-load
    can: Construct canonical destination state and state the actual CPU proof scope
    scenes:
      - dcp-load
  - id: elastic-identity
    can: Restore saved progress into a new group without old-rank assumptions
    scenes:
      - elastic-identity
  - id: optimizer-counter
    can: Correct Adam's first two running averages and isolate a scheduler error on the next weight update
    scenes:
      - optimizer-counter
  - id: owners-debug
    can: Locate the responsible tensor, compiler, distributed or serving owner
    scenes:
      - owners-debug
  - id: project-source
    can: Separate pinned source, executed wheel, documentation and asset authority
    scenes:
      - project-source
  - id: fresh-counter
    can: Test a counter-only restore by replaying a zero gradient from the same saved weight and moments
    scenes:
      - fresh-counter
