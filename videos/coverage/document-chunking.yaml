version: 1
lesson: document-chunking
promise: Choose which runbook passage to send for a question, show that it supports the answer after packing, and decide when to abstain.
objectives:
  - id: preserve-evidence
    can: Find the condition, action, deadline and required identifier in the returned text and detect a reversed instruction even when all required phrases match.
    scenes:
      - subject-intro
      - answerable-units
      - evaluate-and-release
      - earned-transfer
  - id: count-budgets
    can: Compute stride and repeated word occurrences, check which facts fit inside a window, repair a short tail under a hard cap, and measure the full indexed input with the embedding tokenizer.
    scenes:
      - fixed-windows
      - overlap-limit
      - tail-balancing
      - token-offsets
  - id: preserve-structure
    can: Keep headings and table headers with their evidence and use the original source span for quotations.
    scenes:
      - structure-and-tables
      - token-offsets
  - id: evaluate-context
    can: Trace whole hits through packing in rank order, check the returned spans against the labeled source version, and compare answer quality, duplicates, index size and latency at the same generator-token budget.
    scenes:
      - labeled-retrieval
      - evaluation-limits
      - earned-transfer
  - id: checked-parent
    can: Count a current, permitted parent once and abstain when its complete text exceeds the remaining allowance and no other sufficient evidence is available.
    scenes:
      - parent-child-context
      - checked-parent
      - earned-transfer
  - id: semantic-late
    can: Compute cosine at a proposed boundary, handle a zero vector, and distinguish pooling shared token states from averaging independent vectors or using late interaction.
    scenes:
      - semantic-and-late
      - semantic-cosine
      - late-boundaries
  - id: manifest
    can: Explain what the prior review decision and checksum establish, and check source version, trust and access before returning context.
    scenes:
      - manifest-release
