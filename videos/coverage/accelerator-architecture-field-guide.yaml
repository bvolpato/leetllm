version: 1
lesson: accelerator-architecture-field-guide
promise: Predict which part of the assistant's wait a hardware change can shorten, then use
  request-level evidence to decide which candidate meets its deadlines and what its useful output costs.
objectives:
  - id: projection
    can: Predict which finish moves when only compute doubles, using the same weight matrix in
      prefill and decode and the larger of the arithmetic and transfer times.
    scenes:
      - intro
      - projection-contract
      - reuse
      - roofline-numbers
  - id: memory
    can: Calculate sequential transfer time when weights move to the host, trace a spill to the
      buffer it reaches, and check peak allocations against a per-device limit.
    scenes:
      - memory-owners
      - offload
      - nki-lifetimes
      - mps-boundary
      - programming-depth
  - id: execution
    can: Follow activations and partial sums through a matrix array, distinguish useful rows from
      chip utilization, and repair a reduction that drops half of a physical wave.
    scenes:
      - systolic-dataflow
      - tile-density
      - lanes
      - target-build
  - id: port
    can: Diagnose binary, shape, grid-order and backend support failures before tuning a correct mapping
    scenes:
      - cuda-compatibility
      - pallas-contract
      - tile-order
      - programming-depth
  - id: topology
    can: Compute logical payload, ring-send bytes and exposed startup while preserving physical rank
      placement
    scenes:
      - topology
      - collective-bytes
      - target-build
  - id: decision
    can: Test numerical tolerance and fit, intersect first-token and later-token limits by request
      ID, and calculate useful tokens per second and per dollar for an eligible candidate.
    scenes:
      - programming-depth
      - gates
      - goodput-contract
      - fresh-hardware
