version: 1
lesson: hypothesis-testing
promise: Decide whether to switch coding assistants by comparing paired lift with a predeclared minimum, and judge what a larger attempt budget buys.
framing: []
objectives:
  - id: paired
    can: Match outcomes by task, keep ties in the lift denominator and count the disagreements that enter a directional sign test.
    scenes:
      - intro
      - paired-design
      - protocol-identity
      - forty-tasks
      - null-model
      - null-contract
  - id: inference
    can: Compute a null tail, explain how power and search affect the test, and use whole paired tasks to estimate uncertainty in the lift.
    scenes:
      - p-value
      - errors-and-power
      - search
      - variance-construction
      - paired-uncertainty
      - interval-contract
  - id: passk
    can: Count distinct candidate subsets, explain why replacing failed draws changes the estimate, and average and resample scores by task.
    scenes:
      - pass-at-k
      - passk-target
      - estimator-bias
      - macro-construction
      - protocol-repair
  - id: decision
    can: Compare the lower endpoint with the original minimum useful lift, challenge unmatched attempt budgets, and identify the selector, isolation and cost checks a release needs.
    scenes:
      - protocol-identity
      - useful-lift
      - protocol-repair
      - report-contract
      - holdout
sections:
  - heading: Start with paired pass or fail outcomes
    status: taught
    scenes:
      - intro
      - paired-design
      - protocol-identity
      - forty-tasks
    note: The permission pair contributes +1 when A fails and B passes. The other five tasks each contribute zero. All six count toward the observed lift of +1/6.
  - heading: How surprising is one B win?
    status: taught
    scenes:
      - null-model
      - p-value
      - null-contract
    note: The six-task close-up supplies one discordant permission result. The forty-task run supplies eight B wins among thirteen disagreements.
  - heading: Type I errors, Type II errors, and statistical power
    status: taught
    scenes:
      - errors-and-power
      - null-contract
  - heading: Looking for a winner changes the test
    status: taught
    scenes:
      - search
      - protocol-identity
  - heading: When pairing reduces variance
    status: taught
    scenes:
      - variance-construction
  - heading: An interval for B minus A
    status: taught
    scenes:
      - paired-uncertainty
      - interval-contract
      - useful-lift
      - holdout
    note: The forty-task interval comes from the article's paired fixture. The independent four-hundred-task holdout is an illustrative film fixture that uses the same two-point minimum.
  - heading: pass@k measures attempts
    status: taught
    scenes:
      - pass-at-k
      - passk-target
  - heading: Derive the HumanEval estimator by hand
    status: taught
    scenes:
      - pass-at-k
      - passk-target
      - estimator-bias
  - heading: How the naive plug-in underestimates pass@k
    status: taught
    scenes:
      - estimator-bias
    note: Two of ten candidates pass. The film counts the fifty-six all-failing five-position subsets and follows the changing failure fraction after each draw.
  - heading: Average pass@k across tasks
    status: taught
    scenes:
      - macro-construction
  - heading: Changed protocols create fake wins
    status: taught
    scenes:
      - protocol-repair
  - heading: Build an evaluation report
    status: taught
    scenes:
      - report-contract
      - holdout
  - heading: "Practice: review a benchmark claim"
    status: taught
    scenes:
      - report-contract
    note: The 58% and 64% claim uses unequal attempt budgets. The report requests matched runs, a paired lift interval, and generation and verification costs.
