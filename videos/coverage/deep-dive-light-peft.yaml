version: 1
lesson: deep-dive-light-peft
promise: Decide whether a Light-PEFT cut is ready to use by tracing the saved scores into tensor slices,
  checking the resulting product and scale, and testing cost, cache compatibility and held-out quality.
framing: []
objectives:
  - id: opening
    can: Predict which per-token multiplication count changes when an adapter loses a rank or a query loses a head
    scenes:
      - opening
  - id: parallel-product
    can: Compute the frozen and trainable paths from the same input
    scenes:
      - parallel-product
  - id: execution-gradient
    can: Keep the dependency path while removing update state
    scenes:
      - execution-gradient
  - id: cost
    can: Count the projection-only base and adapter work
    scenes:
      - cost
  - id: quantized-versus-sliced
    can: Change storage bits separately from tensor dimensions
    scenes:
      - quantized-versus-sliced
  - id: source-boundary
    can: Keep paper, pinned implementation and reuse terms separate
    scenes:
      - source-boundary
  - id: receipt-identity
    can: Bind the saved score record to the model that will consume it
    scenes:
      - receipt-identity
  - id: handoff
    can: Follow estimate records into pruning and continuation
    scenes:
      - handoff
  - id: mask-gradient
    can: Learn a gate before deleting its coordinate
    scenes:
      - mask-gradient
  - id: heads
    can: Retain original head identities through a quantile and four synchronized slices
    scenes:
      - heads
  - id: signed-gates
    can: Predict which original head leaves under signed and magnitude ranking when one gate changes sign
    scenes:
      - signed-gates
  - id: ffn
    can: Trace a global FFN cut into both projections and repair the unmatched column in a token calculation
    scenes:
      - ffn
  - id: global-versus-local
    can: Choose the population before computing its quantile
    scenes:
      - global-versus-local
  - id: threshold-boundaries
    can: Resolve equality before predicting survivor count
    scenes:
      - threshold-boundaries
  - id: module-ratio
    can: Measure what a module adds to its baseline output
    scenes:
      - module-ratio
  - id: history-sanitization
    can: Keep the sample window and invalid history visible
    scenes:
      - history-sanitization
  - id: adapter
    can: Select modules and preserve paired adapter ranks
    scenes:
      - adapter
  - id: rank-derivative
    can: Compute the paper and trainer rank scores from the same signed weight-gradient products
    scenes:
      - rank-derivative
  - id: paired-product
    can: Use a full-width masked reference to distinguish matching and mismatched B columns with identical shapes
    scenes:
      - paired-product
  - id: preserved-scale
    can: Detect a changed scale by checking both output components after reloading a partial rank slice
    scenes:
      - preserved-scale
  - id: physical-handoff
    can: Slice the base and adapter feature axes before restoring ranks
    scenes:
      - physical-handoff
  - id: continuation-reset
    can: Continue on a new model without inventing an optimizer resume
    scenes:
      - continuation-reset
  - id: artifact-diagnosis
    can: Find the first violated handoff instead of changing the ratio
    scenes:
      - artifact-diagnosis
  - id: complete-stopwatch
    can: Include the estimate before claiming a faster run
    scenes:
      - complete-stopwatch
  - id: evidence
    can: Separate published training, memory and inference protocols
    scenes:
      - evidence
  - id: paper-tradeoff
    can: Choose the fastest reported training row that meets a stated four-task accuracy floor
    scenes:
      - paper-tradeoff
  - id: paper-memory
    can: Keep the ten-batch result inside its measurement window
    scenes:
      - paper-memory
  - id: paper-inference
    can: Keep foundation width and module count on separate axes
    scenes:
      - paper-inference
  - id: random-control
    can: Keep a proposed control separate from an executable branch
    scenes:
      - random-control
  - id: deployment
    can: Bind selected-coordinate identities to cache and task revision
    scenes:
      - deployment
  - id: same-width-output
    can: Identify the middle slot responsible for different outputs from two equal-width models
    scenes:
      - same-width-output
  - id: shared-fleet
    can: Select which artifacts may share one base
    scenes:
      - shared-fleet
  - id: shift-gate
    can: Compare the held-out shifted pass rate with its release requirement after pruning
    scenes:
      - shift-gate
  - id: runtime-layout
    can: Prove the receiving layout and numerical policy
    scenes:
      - runtime-layout
  - id: fresh-pruning
    can: Predict both sums for a new token, reject a cache collision and decide whether the rebuilt model meets its release requirement
    scenes:
      - fresh-pruning
