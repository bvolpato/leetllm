version: 1
lesson: embedding-projection
promise: Decide whether a shorter policy index deserves a held-out retrieval test, and trace a wrong
  clause back to a lost coordinate or a mismatched query transform.
framing: []
objectives:
  - id: geometry
    can: Restore a dropped coordinate to check a suspicious map neighbor, count raw bytes, and
      trace a change in judged recall to specific retrieved chunks.
    scenes:
      - opening
      - budget
      - projection
      - policy-baseline
      - geometry-budget
      - verify
      - recall-sweep
  - id: fit
    can: Fit and reuse a PCA transform and diagnose a ranking reversal by replaying the query
      on the saved basis.
    scenes:
      - methods
      - pca-fit
      - pca-query
      - recall-sweep
      - fresh-projection
  - id: neighborhoods
    can: Calculate a t-SNE pair probability across all ordered pairs, combine UMAP memberships,
      and check a map's neighbors against the original vectors.
    scenes:
      - verify
      - tsne
      - tsne-contract
      - umap
      - umap-contract
  - id: serve
    can: Compare fixed random projections, calibrated codes and supported prefixes against a byte
      limit and a recall floor, and decide what to do when the only eligible recall report is invalid.
    scenes:
      - random-projection
      - scalar-binary
      - product-quantization
      - native-prefix
      - serving
      - release-experiment
sections:
  - heading: Measure the storage and retrieval budget
    status: taught
    scenes:
      - budget
      - geometry-budget
  - heading: Build a retrieval baseline
    status: taught
    scenes:
      - policy-baseline
  - heading: "PCA: learn a shorter linear coordinate system"
    status: taught
    scenes:
      - methods
      - pca-fit
      - pca-query
      - fresh-projection
  - heading: Sweep dimensions against neighbor recall
    status: taught
    note: The six-dimensional replay uses pca-recall-sweep.py with seed 21. Only the document
      noise changes, from 0.11 to 0.20. Query and chunk IDs are zero-based.
    scenes:
      - recall-sweep
  - heading: A two-dimensional map is an investigation tool
    status: taught
    scenes:
      - opening
      - projection
      - tsne
      - umap
  - heading: Check the neighbors behind a picture
    status: taught
    scenes:
      - verify
      - recall-sweep
  - heading: "t-SNE: match neighbor probabilities"
    status: taught
    note: The three-point triangle applies the article's Cauchy kernel to six ordered pairs.
      Its coordinates illustrate one map move.
    scenes:
      - tsne
      - tsne-contract
  - heading: "UMAP: optimize a weighted neighbor graph"
    status: taught
    scenes:
      - umap
      - umap-contract
  - heading: "Random projection: a no-fit serving baseline"
    status: taught
    scenes:
