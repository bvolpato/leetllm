version: 1
lesson: deep-dive-tinker
promise: Decide whether a sampled clamp answer is usable for a hosted LoRA update by checking its behavior, its token evidence, and the policy that produced it.
objectives:
  - id: diagnose-clamp
    can: Use an out-of-range input to expose a bad clamp body and compare trainer and sampler receipts to identify which policy was graded
    scenes:
      - opening
      - group-credit
      - snapshots
  - id: capability-receipt
    can: Admit hosted capabilities separately from local source availability
    scenes:
      - capability-receipt
  - id: primitive-receipts
    can: Associate each primitive receipt with its actual state transition
    scenes:
      - primitive-receipts
  - id: async-contract
    can: Await each async method at the correct completion layer
    scenes:
      - async-contract
  - id: chunk-order
    can: Compute chunk sizes and preserve sequence ownership
    scenes:
      - chunk-order
  - id: sft
    can: Derive shifted target-role weights including the first answer
    scenes:
      - sft
  - id: datum-validation
    can: Withhold a datum when its action pairs disagree with the sampler even if all field lengths match
    scenes:
      - trajectory-datum
      - datum-validation
  - id: group-credit
    can: Compute within-prompt centered reward credit
    scenes:
      - group-credit
  - id: uniform-groups
    can: Separate uniform reward signal from filtering and auxiliary loss
    scenes:
      - uniform-groups
  - id: trajectory-branch
    can: Split trajectories at an actual nonprefix observation
    scenes:
      - trajectory-branch
  - id: loss-boundary
    can: Remove stray prompt credit before submitting the reward loss and derive backend weights from a pair of custom logprob slopes
    scenes:
      - loss-boundary
  - id: lora-geometry
    can: Trace a single output coordinate through the frozen and low-rank paths and calculate how rank changes trainable parameter count
    scenes:
      - lora-geometry
  - id: lora-evidence
    can: Compare rank and target-module evidence under controlled conditions
    scenes:
      - lora-evidence
  - id: queue-recovery
    can: Bound policy lag and reconcile outstanding requests and effects
    scenes:
      - queue-recovery
  - id: artifact-contract
    can: Choose continuation, sampling and export artifacts by contract
    scenes:
      - artifact-contract
  - id: data-terms
    can: Check hosted data and model terms separately from source licenses
    scenes:
      - data-terms
  - id: source-responsibility
    can: Trace a request through pinned client and recipe responsibilities
    scenes:
      - source-responsibility
  - id: local-evidence
    can: State exactly what local execution establishes
    scenes:
      - local-evidence
  - id: transport-comparison
    can: Distinguish hosted algorithm control from expert transport
    scenes:
      - transport-comparison
  - id: fresh-run
    can: Derive shifted response weights and apply the lag budget separately to an existing sample and one drawn from a newly selected path
    scenes:
      - fresh-run
