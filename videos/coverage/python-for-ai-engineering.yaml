version: 1
lesson: python-for-ai-engineering
promise: Trace a Python evaluation from the raw request to the printed score. Use the row identities and
  exact counts to decide whether a prediction changed, a request disappeared, or loading stopped.
objectives:
  - id: opening
    can: Predict request 102’s Boolean from its two saved strings and check which perfect run evaluated it.
    scenes:
      - opening
      - row-values
      - exact-metric
  - id: environment
    can: Run the scorer in its project environment and identify the raw label spelling in the working
      copy of the Docker fixture.
    scenes:
      - environment
  - id: runtime-contract
    can: Distinguish interpreter range, version pin, lock and installed environment
    scenes:
      - runtime-contract
  - id: row-values
    can: Normalize immutable strings and compare the same row
    scenes:
      - row-values
  - id: value-types
    can: Identify value types and reject unapproved coercion
    scenes:
      - value-types
  - id: batch
    can: Carry one Boolean per request into exact counts
    scenes:
      - batch
  - id: copies
    can: Start with the normalized labels and trace which list and row each copy shares.
    scenes:
      - copies
  - id: nested-ownership
    can: Trace nested mutable values through a row copy
    scenes:
      - nested-ownership
  - id: functions
    can: Bind actual arguments and distinguish hints from runtime checks
    scenes:
      - functions
  - id: program-entry
    can: Distinguish an import from direct execution and select the input from the optional second argv entry.
    scenes:
      - program-entry
  - id: jsonl-boundary
    can: Apply the string and whitespace checks and trace a valid mismatch, a saved number and malformed JSON
      to the last operation each reaches.
    scenes:
      - jsonl-boundary
  - id: decoder-policy
    can: Predict normalized matches when a label key repeats or all keys are unique. Trace which value
      the default decoder keeps, where the strict hook stops, and which extra fields the scorer ignores.
    scenes:
      - decoder-policy
  - id: iterator-lifetime
    can: Find the first invalid record by physical line, identify the exception and predict whether main
      receives any rows to score.
    scenes:
      - iterator-lifetime
  - id: errors-and-coverage
    can: Distinguish a field error from unequal normalized labels and check coverage for a quarantined subset.
    scenes:
      - errors-and-coverage
  - id: confidence-contract
    can: Distinguish NaN from infinity in the decoded values, apply the type and range checks, and
      recognize two decimal inputs that round to the same accepted float.
    scenes:
      - confidence-contract
  - id: numeric-floor
    can: Derive exact count comparisons under positive-total preconditions
    scenes:
      - numeric-floor
  - id: pytest-contract
    can: Check the exception class and match the physical line number in its message, including the
      boundary between the number and the colon.
    scenes:
      - pytest-contract
  - id: exact-metric
    can: Use an exact-count assertion on the scored file to detect a changed denominator, then use the
      input diff to identify the missing request.
    scenes:
      - exact-metric
  - id: locked-replay
    can: Explain why an undeclared helper imports before exact sync and fails to import after it.
    scenes:
      - locked-replay
  - id: fresh-input-receipt
    can: Use the producer’s saved label to repair the invalid field, predict the receipt from the five
      comparisons, distinguish an input error from a printed score below the floor, and trace each
      mismatch to its request.
    scenes:
      - fresh-input-receipt
