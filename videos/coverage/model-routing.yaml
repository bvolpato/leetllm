version: 1
lesson: model-routing
promise: Decide whether the access desk can dispatch a fallback, account for each generation attempt, and hand back the result of a prior grant.
framing: []
objectives:
  - id: intro
    can: Compare the desk’s required form and review workflow with what a backup can supply. Trace an eligible call from the gateway to the adapter.
    scenes:
      - intro
  - id: contract
    can: Keep the review threshold, privacy classification, and cited answer requirements together when client hints change.
    scenes:
      - contract
  - id: filter
    can: Use the field checks and lane capacities to identify the surviving routes as input grows from 24,000 to 70,000 tokens.
    scenes:
      - filter
  - id: rank
    can: Choose a compatible lane by cost or expected answer time when the local latency estimate changes.
    scenes:
      - rank
  - id: deadline
    can: Compare a proposed fallback with the time and reservation left after a billed timeout. Count only dispatched calls.
    scenes:
      - deadline
      - transfer
  - id: publication
    can: Stop transparent retry after visible output and validate evidence
    scenes:
      - publication
  - id: breaker
    can: Limit recovery probing without relaxing the contract
    scenes:
      - breaker
  - id: synthesis
    can: Add both attempt charges to the request and use the verified grant receipt to retry only the explanation.
    scenes:
      - synthesis
  - id: transfer
    can: Decide whether D can run when its expected finish moves from 2,499 ms to the 2,500 ms deadline.
    scenes:
      - transfer
