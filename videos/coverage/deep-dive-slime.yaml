version: 1
lesson: deep-dive-slime
promise: Decide whether Megatron can take its next step by checking who produced each target, which policy
  served it, and which batches the saved optimizer state includes.
objectives:
  - id: provenance-credit
    can: Catch a tool token selected by a valid-length mask, compute the selected-token mean, and preserve
      one execution’s contribution when its segments cross microbatches.
    scenes:
      - intro
      - incident-receipt
      - ledger
      - sample-checks
      - native-append
      - identity-groups
      - segments
      - step-denominator
  - id: placement-timing
    can: Trace which devices and futures can overlap, predict queue length when an in-flight group finishes,
      and identify which completed groups reach the trainer.
    scenes:
      - placement
      - bundle-map
      - router-session
      - round-boundaries
      - async-future
      - queue
      - queue-handoff
  - id: weight-visibility
    can: Choose a carrier for the allocated devices, decide whether a particular host may apply a patch, and
      verify which version its engine serves.
    scenes:
      - sync
      - sync-dispatch
      - broadcast-lifecycle
      - disk-retention
      - delta
      - delta-record
  - id: durable-recovery
    can: Diagnose the first failed handoff, select trusted replay data, and determine whether a restored trainer
      can continue by comparing its weight and optimizer velocity with the uninterrupted run.
    scenes:
      - incident-receipt
      - agent-hook
      - application-experiment
      - failure-diagnosis
      - recovery
      - retained-serving
      - debug-replay
      - project-scope
      - source-route
      - fresh-replay
