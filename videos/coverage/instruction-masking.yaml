removed:
  - point: The exact text and offsets of the behavior experiment's constructed input.
    reason: The quoted-marker tokenizer case teaches the same ownership check. The separate model study retains its conditions, sample size, counts, and limits.
  - point: A universal instruction to shift labels before applying the role mask.
    reason: Replaced by explicit predictor/target coordinates and exactly-once shifting; common model loss paths
      need unshifted labels. All original first-token/end-marker teaching remains.
