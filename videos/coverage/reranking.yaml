version: 1
lesson: reranking
promise: Follow a passage from search into the answer and identify the first step that needs a repair.
objectives:
  - id: construct-score
    can: Compute a scalar logit and a preference loss. Compare the binary and full-vocabulary shares for the same token. Find the best document token for each query token and sum those maxima for MaxSim. Identify the inputs each checkpoint needs.
    scenes:
      - joint-input
      - scalar-score
      - ranking-losses
      - token-score-contracts
      - list-input-contract
      - late-maxsim
  - id: preserve-evidence
    can: Track a permitted source revision through scoring and packing. Compare the words each reader received before attributing a wrong answer to the model.
    scenes:
      - subject-intro
      - candidate-ceiling
      - policy-snapshot
      - phrase-scorer
      - reorder-evidence
      - scored-span
      - scored-token-ledger
      - cache-input-identity
      - trace-and-reject
      - learned-policy-check
  - id: evaluate-release
    can: Distinguish a missing candidate, a low rank, an incomplete packed context and a claim that contradicts the source. Use candidate recall, ranking metrics and the serving budget to choose a repair.
    scenes:
      - calibration-gates
      - metrics-construction
      - budget-prediction
      - serving-batches
      - learned-policy-check
      - transfer
      - fresh-release
  - id: apply-the-rule
    can: Decide separately whether a rule belongs in context and whether its conditions support the requested action.
    scenes:
      - phrase-scorer
      - learned-policy-check
      - transfer
      - fresh-release
