version: 1
lesson: benchmark-audits
promise: Recover the complete experiment behind a benchmark score, compute and diagnose its
  measurements, and apply a reproducible release decision under an honest
  task,scorer,exposure,uncertainty and product contract.
framing:
  - intro
objectives:
  - id: gold
    can: Validate unique case IDs and supported gold requirements, then diagnose a
      context-versus-response failure.
    scenes:
      - gold-contract
      - checker
      - rag-stage
  - id: metrics
    can: Calculate ranked context precision,reference recall and claim faithfulness without confusing
      support with completeness.
    scenes:
      - rag-metrics
  - id: public
    can: Choose a matched task,split,parser,harness,version and attempt budget; interpret audited
      subsets and preference ratings with their actual denominators.
    scenes:
      - knowledge-contract
      - math-frontier
      - code-contract
      - benchmark-audit
      - preference-ratings
  - id: samples
    can: Compute subset availability per problem and separate its assumptions,budget and actual selected
      outcome.
    scenes:
      - candidates
      - sample-estimator
  - id: judges
    can: Normalize swapped-order verdicts to answer identity and retain independent correctness and
      exposure checks.
    scenes:
      - judge-controls
      - exposure
      - exposure-screen
  - id: uncertainty
    can: Construct Wilson intervals and exact paired discordance probabilities under explicit sampling
      assumptions.
    scenes:
      - uncertainty
      - wilson-construction
      - paired-diagnosis
  - id: release
    can: Validate finite typed evidence and enforce every critical/operational gate while preserving
      reproducible failures.
    scenes:
      - slices
      - gates
      - finite-report
      - reproducible-package
      - fresh-report
