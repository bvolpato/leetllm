version: 1
lesson: optimizers
promise: Predict a parameter update from its gradient and history, then choose a measurement that can explain how the run produced it.
objectives:
  - id: construct-history
    can: Predict which errors cross zero and which way a weight moves when SGD, momentum, RMSProp or Adam receives a slope that changes sign.
    scenes:
      - intro
      - first-step
      - stability
      - momentum
      - momentum-conventions
      - rmsprop
      - adam-buffers
      - adam-step
      - adam-history
      - objective-scale
  - id: complete-step
    can: Reconstruct an update from item counts, clipping, moments and prior-weight decay. Identify where two loss reductions can differ even when they produce the same saved weight.
    scenes:
      - schedule
      - decay
      - zero-data-decay
      - accumulation
      - clipping
      - torch-loop
      - transfer
      - fresh-recipe
  - id: evaluate-recipe
    can: Restore a training run, estimate its moment storage and choose between measured recipes at a stated update budget and validation metric.
    scenes:
      - comparison
      - checkpoint-history
      - optimizer-memory
      - evidence-budget
      - diagnostic-trace
sections:
  - heading: A 100-to-1 valley
    status: taught
    scenes:
