      - adam-history
  - heading: AdamW separates data gradients from weight shrinkage
    status: taught
    scenes:
      - decay
      - zero-data-decay
      - fresh-recipe
  - heading: Schedules change pace across the run
    note: The first scheduled update changes the two stored moments for a while both parameters stay at one. The next four rates move the parameters toward zero.
    status: taught
    scenes:
      - schedule
      - torch-loop
  - heading: Accumulate the objective you intended
    note: The closing replay pairs each set of microbatch shares with its gradient before clipping. The same clipped input and final weight can come from either reduction.
    status: taught
    scenes:
      - accumulation
      - fresh-recipe
  - heading: Gradient clipping bounds the input to the optimizer
    note: The five-item example applies the article's global norm rule to each candidate scalar gradient. Both magnitudes exceed three, so both paths feed the same gradient to cold-start AdamW.
    status: taught
    scenes:
      - clipping
      - torch-loop
      - fresh-recipe
  - heading: "Build it: optimize the valley with AdamW"
    status: taught
    scenes:
      - comparison
      - evidence-budget
  - heading: Use PyTorch after understanding the state
    status: taught
    scenes:
      - torch-loop
      - checkpoint-history
  - heading: Resume the history, not just the weights
    status: taught
    scenes:
      - checkpoint-history
  - heading: Optimizer state is also a memory budget
    status: taught
    scenes:
      - optimizer-memory
  - heading: Read optimizer failures from traces
    note: The diagnostic scene uses the forty-update SGD and AdamW trials from this section's held-out selection checkpoint after the separate warmup comparison.
    status: taught
    scenes:
      - diagnostic-trace
  - heading: Worked checks
    status: article-only
    reason: exercise
    note: Worked practice follows the fully taught mechanisms and has supplied solutions.
