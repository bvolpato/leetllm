version: 1
lesson: validation
promise: Decide whether a score supports a claim about new requests or sources by reconstructing what the system could read, fit, and choose before the test.
framing: []
objectives:
  - id: intro
    can: Reconstruct the router's opening snapshot from field availability times
    scenes:
      - intro
  - id: target-leak
    can: Identify the false alarm and missed review exposed by removing the audit label from the predictor
    scenes:
      - target-leak
  - id: risk
    can: Calculate empirical risk, population risk, and their gap
    scenes:
      - risk
  - id: roles
    can: Track a candidate through fitting, selection, and reporting
    scenes:
      - roles
  - id: folds
    can: Distinguish fresh fold fits and dependent score variation
    scenes:
      - folds
  - id: fold-calculation
    can: Predict a held-out row and distinguish mean fold F1 from F1 computed on pooled counts
    scenes:
      - fold-calculation
  - id: users
    can: Separate known-user recognition from new-user performance
    scenes:
      - users
  - id: pipeline
    can: Compute a learned centering origin and its information boundary
    scenes:
      - pipeline
  - id: feature-selection
    can: Recompute the selector's class means under two fit boundaries and identify which held-out predictions change
    scenes:
      - feature-selection
  - id: time
    can: Advance a development fit through time while preserving a separate selection month, a reporting month, and a cutoff for training labels
    scenes:
      - time
  - id: as-of-history
    can: Build a strict as-of count and classify prior-user activity
    scenes:
      - as-of-history
  - id: nested-selection
    can: Separate inner selection from outer procedure evaluation
    scenes:
      - nested-selection
  - id: selection
    can: Calculate and freeze a validation-selected threshold
    scenes:
      - selection
  - id: selective-labels
    can: Bound recall from the observed queue and update the count of known misses after auditing an automatic request
    scenes:
      - selective-labels
  - id: documents
    can: Count shared manuals before and after moving their passages together
    scenes:
      - documents
  - id: benchmark-screen
    can: Run a five-word overlap screen on a copy and a paraphrase and decide what provenance to inspect
    scenes:
      - benchmark-screen
  - id: counterfactual
    can: Diagnose unsupported action-policy outcomes
    scenes:
      - counterfactual
  - id: source-transfer
    can: Use each question's parent source and exposure history to choose which correct answer belongs in a new-source report
    scenes:
      - source-transfer
