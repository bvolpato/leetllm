version: 1
lesson: multimodal-fusion
promise: Choose a multimodal route that fits the full request, then use the cited plot, legend and
  event times to decide which claims the copilot can return.
objectives:
  - id: representation
    can: Compute patch counts and connector outputs, trace a weighted visual read, and check which
      chart details the decoder can recover.
    scenes:
      - opening
      - patches
      - decoded-budget
      - encoder-directions
      - connector
      - multi-block-interface
      - routes
      - score-work
      - attention
      - zero-insertion
      - closing
  - id: training
    can: Trace caption-loss gradients through frozen components and compare training and post-training
      interventions
    scenes:
      - training-stages
      - joint-and-posttraining
  - id: serving
    can: Compute full context and logical KV reservations, select bounded crops and audio groups, and
      identify exactly which cached stages can be skipped
    scenes:
      - budget
      - adaptive-crops
      - audio-clock
      - cache-lifetime
      - cache-bytes
      - fresh-incident
  - id: evidence
    can: Match a trace to its own legend, preserve source and clock mappings, and use inclusive
      time bounds to decide whether an authorized region supports a chronology claim.
    scenes:
      - opening
      - connector
      - case-contract
      - adaptive-crops
      - evidence-time
      - artifact-lineage
      - safety-boundary
      - closing
      - fresh-incident
  - id: operations
    can: Choose modality-specific retry and partial behavior and diagnose failed release metrics under a
      staged rollout
    scenes:
      - ready-recovery
      - diagnosis-release
      - route-choice
      - fresh-incident
