version: 1
lesson: grouped-query-attention
promise: Trace a query to its stored history and decide which request fits after accounting for the copies on each rank.
framing:
  - opening
objectives:
  - id: shared-readers
    can: Route a query to its history, compute its weights and price one more cached position.
    scenes:
      - opening
      - attention
      - map
      - architectures
      - tensors
      - budget
  - id: serving-budget
    can: Distinguish ideal read time, temporary allocations and retained bytes, then test a request against each rank's allowance.
    scenes:
      - roofline
      - large-budget
      - model-config
      - physical-heads
      - tradeoff
      - kernel-route
      - synthesis
      - earned-transfer
  - id: learned-representations
    can: Check how pooling changes an output and which part of an MLA query can be reused across cached positions.
    scenes:
      - pooling-failure
      - latent-store
      - latent-score
      - position-split
  - id: cache-correctness
    can: Trace an append and use absolute query positions to check single-token and chunked attention against full-prefix execution.
    scenes:
      - cache-step
      - causal-repair
      - synthesis
