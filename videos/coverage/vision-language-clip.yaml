version: 1
lesson: vision-language-clip
promise: Use CLIP to find a rack photo, test its class label against a score and a margin, and choose the
  evidence and serving path a reviewer needs to verify the inspection.
objectives:
  - id: clip
    can: Explain a ranking reversal after normalization, compute both directional losses, and predict how
      a gradient update or a change of prompts affects the comparison.
    scenes:
      - opening
      - towers
      - cosine
      - matrix
      - objective
      - training-step
      - zero-shot
      - retrieval
      - boundaries
  - id: training
    can: Compare pairwise sigmoid and softmax losses and diagnose data, preprocessing and multimodal training
      contracts.
    scenes:
      - data-and-implementation
      - siglip-pairs
      - visual-features
      - projector-training
  - id: connectors
    can: Trace a patch value through a learned query slot, compare visual connectors, and budget a prefix
      that preserves the required text and regions.
    scenes:
      - query-bottleneck
      - cross-attention-bank
      - grounded-detail
      - prefix-budget
      - adaptive-reduction
  - id: service
    can: Apply the score and margin rule, request the printed tag or vent box from the selected photo, and
      evaluate each route against its own release bar in a scoped, versioned service.
    scenes:
      - zero-shot
      - boundaries
      - inspection-brief
      - index-service
      - route-evaluation
      - inspection-transfer
