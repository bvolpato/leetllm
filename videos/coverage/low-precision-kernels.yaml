version: 1
lesson: low-precision-kernels
promise: Decide whether a low-precision conversion preserved the activation a consumer needs by tracing its code and scale, checking the reconstructed operand with a selector, and comparing the result with the appropriate kernel reference.
objectives:
  - id: intro
    can: Calculate which finite operand reaches the multiplier when a new peak exceeds the old scale's range
    scenes:
      - intro
      - stale-scale
  - id: format-budget
    can: Compare exponent range, fraction spacing and stored payload among supported formats
    scenes:
      - format-budget
  - id: number-grid
    can: Construct neighboring values and resolve nearest-even midpoint choices
    scenes:
      - number-grid
  - id: subnormal-grid
    can: Calculate subnormal rounding and distinguish an instruction’s flushing mode
    scenes:
      - subnormal-grid
  - id: overflow-mode
    can: Separate raw magnitude, rounded overflow and declared saturation behavior
    scenes:
      - overflow-mode
  - id: rounding-probability
    can: Locate one update on two precision grids and calculate the probability that a stochastic write selects its upper neighbor
    scenes:
      - rounding-probability
  - id: stale-scale
    can: Compute stale and current reconstruction scales in both directions
    scenes:
      - stale-scale
  - id: scale-conventions
    can: Identify reciprocal scale formulas and handle a zero-only group
    scenes:
      - scale-conventions
  - id: scale-timeline
    can: Trace current and delayed maximum dependencies without inventing durations
    scenes:
      - scale-timeline
  - id: online-quantization
    can: Separate a reported online recipe from proposed cast-transfer fusion
    scenes:
      - online-quantization
  - id: local-scales
    can: Compare actual tiny and spike values under tensor and local scales
    scenes:
      - local-scales
  - id: cpu-contract
    can: Identify the actual cast and reconstructed-CPU-matmul evidence limits
    scenes:
      - cpu-contract
  - id: projection
    can: Find the two opposite product errors in a repeating row and select one position to measure its reconstruction error
    scenes:
      - projection
  - id: block-scales
    can: Apply each contraction block’s scale before summing
    scenes:
      - block-scales
  - id: accumulation
    can: Distinguish input rounding from running-sum and internal arithmetic loss
    scenes:
      - accumulation
  - id: traffic
    can: Count the packed operand and avoided wide-buffer transfers
    scenes:
      - traffic
  - id: scale-bytes
    can: Calculate E8M0 values, metadata overhead and padded-block payloads
    scenes:
      - scale-bytes
  - id: subeight-formats
    can: Distinguish MX and NVFP4 element and scale contracts
    scenes:
      - subeight-formats
  - id: orientation
    can: Derive a changed contraction orientation from the wider source matrix
    scenes:
      - orientation
  - id: contract
    can: Transcode the same value across OCP and FNUZ byte conventions
    scenes:
      - contract
  - id: abi-dispatch
    can: State the encoding, shape, layout, device and arithmetic contract before dispatch
    scenes:
      - abi-dispatch
  - id: reference-ladder
    can: Locate input versus kernel discrepancies using both references
    scenes:
      - reference-ladder
  - id: fresh-group
    can: Predict a one-position dot product when a spike joins its block and repeat the same check after separating the groups
    scenes:
      - fresh-group
