version: 1
lesson: vectors
promise: Trace scalar/vector coordinates through shared linear maps and owned batches;
  compute and diagnose matrix shapes,broadcasts,pairwise scores,normalization and masked
  summaries without mixing their axes.
framing:
  - intro
objectives:
  - id: coordinate-meaning
    can: Distinguish feature,parameter and gradient positions and compute their update or
      dot product.
    scenes:
      - coordinates
      - latency-gradient
      - latency-dot
  - id: shared-map
    can: Build a shared map from scaled input directions and preserve each request/token
      owner.
    scenes:
      - directions
      - mixture
      - dot
      - composition
      - rows
      - tensor
      - local-edit
      - request-batch
      - many-outputs
  - id: shape-and-index
    can: Check feature agreement,rank and indexing,including when equal sizes conceal an
      axis mistake.
    scenes:
      - tensor
      - shape-guard
      - input-guards
      - batched-transpose
  - id: broadcast-and-linear
    can: Attach biases to features and recognize the transposed storage of a library layer.
    scenes:
      - broadcasting
      - linear-api
  - id: pairwise
    can: Construct raw and cosine token-score grids with correct norms and batched
      transpose.
    scenes:
      - pairwise-scores
      - normalized-scores
      - batched-transpose
  - id: pool-and-transfer
    can: Pool only real tokens,recognize lost order and predict an unfamiliar local edit.
    scenes:
      - pooling
      - padding-mask
      - fresh-case
