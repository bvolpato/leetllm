version: 1
lesson: deep-dive-transformers
promise: Trace a checkpoint from its saved weights to a reply, identify the first changed input or decoding setting, and decide whether a stopped request can reuse its cache.
objectives:
  - id: intro
    can: Locate the first missing role marker before comparing first-step scores at fixed weights
    scenes:
      - intro
  - id: four-contracts
    can: Diagnose a parse, shape or semantic contract failure
    scenes:
      - four-contracts
  - id: identity
    can: Resolve snapshot identities while sharing unchanged blobs
    scenes:
      - identity
  - id: lifecycle
    can: Distinguish config, initialization, tying, restoration and saved artifacts
    scenes:
      - lifecycle
  - id: load-safety
    can: Apply separate dtype, tensor-format and remote-code decisions
    scenes:
      - load-safety
  - id: offload-execution
    can: Calculate the simultaneous execution-device live set
    scenes:
      - offload-execution
  - id: auto
    can: Follow metadata dispatch and reject an incompatible family
    scenes:
      - auto
  - id: auto-extension
    can: Distinguish the small lookup from the actual pinned loader
    scenes:
      - auto-extension
  - id: chat
    can: Find the first differing ID and repair either a missing assistant prefix or a duplicate opening marker
    scenes:
      - intro
      - chat
  - id: tokenizer-fields
    can: Inspect vocabulary, truncation, masks and span ownership
    scenes:
      - tokenizer-fields
  - id: processors
    can: Diagnose a changed modality tensor before model execution
    scenes:
      - processors
  - id: padding
    can: Repair last-position reads without erasing real EOS supervision
    scenes:
      - padding
  - id: loss
    can: Recompute shifted masked loss while retaining attention context
    scenes:
      - loss
  - id: output-contract
    can: Select named logits despite optional returned loss
    scenes:
      - output-contract
  - id: real-cpu
    can: Identify which logit loses its target, then verify loss, storage, causality and greedy choices on fixed CPU inputs
    scenes:
      - real-cpu
  - id: cache
    can: Count live and allocated cache payload separately
    scenes:
      - cache
  - id: hybrid-budget
    can: Sum layer-specific retained lengths and active batch factors
    scenes:
      - hybrid-budget
  - id: cache-identity
    can: Compare prefix IDs and full-forward logits after a same-length edit, and copy a compatible cache before independent appends
    scenes:
      - cache-identity
      - fresh-resume
  - id: generation
    can: Trace selection and cache writes as separate events
    scenes:
      - generation
  - id: decoding-policy
    can: Resolve sampling, beams, transforms and returned prefix
    scenes:
      - decoding-policy
  - id: serving-boundary
    can: Locate request admission and allocation outside a plain pipeline
    scenes:
      - serving-boundary
  - id: drift-tests
    can: Choose between repairing input rendering and restoring the approved selection policy
    scenes:
      - drift-tests
  - id: project-source
    can: Locate a versioned source owner and license boundary
    scenes:
      - project-source
  - id: release-receipt
    can: Reproduce a model run and judge numerical agreement, task quality and unmeasured latency separately
    scenes:
      - release-receipt
  - id: fresh-resume
    can: Forward a pending word once or rebuild after a same-length edit to the cached prompt
    scenes:
      - fresh-resume
