version: 1
lesson: ai-lab-system-design-interview
promise: Use a request receipt to explain which constraint stopped a caller, then decide what new evidence would change admission, document access, or release.
objectives:
  - id: opening
    can: Decide whether five blocks of queued work fit the caller’s wait budget and name the cause on the receipt
    scenes:
      - opening
  - id: requirements-control
    can: Translate changed requirements into policy and request-path boundaries
    scenes:
      - requirements-control
  - id: contract
    can: Trace authentication, authorization, quota and admission owners
    scenes:
      - contract
  - id: api-receipt
    can: Bind API outcomes and approved fallback to one authorized support receipt
    scenes:
      - api-receipt
  - id: memory
    can: Compare fixed weight bytes with architecture-dependent cache bytes
    scenes:
      - memory
  - id: cache-bytes
    can: Compute per-token and unequal-history KV payloads in named units
    scenes:
      - cache-bytes
  - id: memory-realization
    can: Identify allocation conditions and overhead excluded from a payload estimate
    scenes:
      - memory-realization
  - id: demand
    can: Compute an aggregate planning rate and unused-capacity fraction
    scenes:
      - demand
  - id: demand-sensitivity
    can: Recompute demand after answer length changes and specify measurement evidence
    scenes:
      - demand-sensitivity
  - id: quota-reservation
    can: Reserve atomically and reconcile confirmed usage once per request ID
    scenes:
      - quota-reservation
  - id: phase-latency
    can: Use four client timestamps to measure the first token, the longest gap, and the average of three gaps
    scenes:
      - phase-latency
  - id: batch-and-pages
    can: Distinguish scheduling changes from physical KV allocation and ownership
    scenes:
      - batch-and-pages
  - id: phase-placement
    can: Trace chunking, phase transfer and draft verification costs
    scenes:
      - phase-placement
  - id: cache-compatibility
    can: Check numeric cache identity separately from current private-data grants
    scenes:
      - cache-compatibility
  - id: parallel-placement
    can: Map logical model shards to physical communication costs
    scenes:
      - parallel-placement
  - id: admission
    can: Stop R-104’s wait at the worker handoff and account for the slot and both KV blocks through completion
    scenes:
      - admission
  - id: concurrent-claim
    can: Resolve two passing capacity checks against one free slot and sixteen cache blocks
    scenes:
      - concurrent-claim
  - id: permissions
    can: Use current grants and tombstones to choose the only document ID that may cross to the external reranker
    scenes:
      - permissions
  - id: acl-freshness
    can: Separate snapshot age, authoritative revocation and document eligibility
    scenes:
      - acl-freshness
  - id: agent-state
    can: Reconcile a missing commit reply on its original attempt and distinguish cancel intent from confirmed exit
    scenes:
      - agent-state
  - id: task-claims
    can: Apply legal transitions with expected-state claims and terminal attempt identity
    scenes:
      - task-claims
  - id: retry-and-cancel
    can: Select recovery by receiver enforcement and reconcile late writes after cancel intent
    scenes:
      - retry-and-cancel
  - id: release-gate
    can: Use independent 100-item samples to identify which quality check fails and how far it misses
    scenes:
      - release-gate
  - id: typed-release
    can: Hold a changed policy echo and distinguish a missing leak count, Boolean False, and measured integer zero
    scenes:
      - typed-release
  - id: canary-controller
    can: Compute ordered expansion, hold and rollback decisions from validated measurements
    scenes:
      - canary-controller
  - id: decision-rehearsal
    can: Trace how a tighter limit for route B changes queue placement and record the reason in an interview rehearsal
    scenes:
      - decision-rehearsal
  - id: fresh-boundary
    can: Decide R-205’s capacity, snapshot freshness, and canary eligibility, then check the finance grant after the snapshot refreshes
    scenes:
      - fresh-boundary
