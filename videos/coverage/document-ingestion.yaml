version: 1
lesson: document-ingestion
promise: Trace a deadline from the answer back to its source and decide whether the current reader can rely on the complete rule.
framing: []
objectives:
  - id: diagnose-the-first-loss
    can: Compare the original page, the stored extract and the returned passage to locate the first missing or crossed rule.
    scenes:
      - subject-intro
      - table-structure
      - evidence-gate
  - id: extract-faithfully
    can: Choose and test format-specific adapters while preserving numbers, table relationships, inline
      boundaries, repeated headings and exact code slices.
    scenes:
      - parser-fork
      - pdf-layout
      - ocr-review
      - table-structure
      - html-boundaries
      - markdown-slices
  - id: publish-evidence
    can: Repair a citation that opens the wrong revision and check which reader can retrieve the same verified words after an access change.
    scenes:
      - provenance-record
      - chunk-locators
      - version-publication
      - evidence-gate
      - fresh-case
  - id: visual-and-security
    can: Score two page images, identify the patches behind each score, estimate vector storage and distinguish retrieval evidence from parser and tool permissions.
    scenes:
      - visual-retrieval
      - parser-boundary
      - html-boundaries
