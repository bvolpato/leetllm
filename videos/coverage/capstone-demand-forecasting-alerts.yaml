version: 1
lesson: capstone-demand-forecasting-alerts
promise: Use a Sunday forecast to decide when to review staffing, then use verified counts to judge that warning, the forecast error and the case for replacing the model.
objectives:
  - id: contract
    can: Choose a measurable demand target, trace the inputs for a future day and select a one-day booking under stated shortage and spare-capacity costs.
    scenes:
      - target
      - cost-quantile
      - forecast-contract
  - id: fit
    can: Select the final counts and announced plans available at issue, find a seasonal baseline and calculate a calendar forecast from its active features.
    scenes:
      - origins
      - baseline
      - fit-construction
      - issued
  - id: evidence
    can: Preserve an issued forecast when a plan changes, verify the ledger against a protected digest and test the fit on both sides of the availability cutoff.
    scenes:
      - issued
      - ledger-contract
      - failure-construction
  - id: evaluate
    can: Use the issued schedule to assess a capacity warning, then use mature labels to calculate error, peak penalties, tolerance, precision and recall.
    scenes:
      - intro
      - metrics
      - evaluation-contract
      - signals
      - earned-forecast-transfer
  - id: operate
    can: Apply each local acceptance threshold, identify evidence needed for a pilot and decide when an apparent failure warrants investigating the feed or refitting.
    scenes:
      - synthesis
      - receipt-contract
      - monitoring-contract
sections:
  - heading: Choose the series, horizon, and cost structure
    status: taught
    note: The booking worksheet uses the three demand levels and unit costs in choose_capacity.py. The forecast ruler uses the separate FC-A schedule.
    scenes:
      - intro
      - target
      - cost-quantile
      - forecast-contract
  - heading: Build reproducible walk-forward data boundaries
    status: taught
    note: The two Sunday cutoffs use the final flags and availability times in daily_counts.csv. The February 7 count clears the audit on February 9.
    scenes:
      - origins
      - baseline
      - failure-construction
  - heading: Fit and freeze forecasts before outcomes arrive
    status: taught
    note: The February 4 replay switches off the campaign indicator with the February 1 weights fixed. Only the original 145.017 enters the issued ledger.
    scenes:
      - fit-construction
      - issued
      - ledger-contract
  - heading: Evaluate forecasts and operational alerts separately
    status: taught
    note: The weekly scores and four dated signal cases use forecast_lab.py and the article fixture. The final three-day worksheet uses separate supplied counts.
    scenes:
      - metrics
      - evaluation-contract
      - signals
      - earned-forecast-transfer
  - heading: Inspect the comparison before planning a rollout
    status: taught
    scenes:
      - synthesis
      - receipt-contract
  - heading: Establish retraining triggers and data drift monitoring
    status: taught
    scenes:
      - monitoring-contract
  - heading: Verify contract boundaries with deliberate failures
    status: taught
    note: The first rerun changes the same fifteen unavailable counts as failure_checks. Its positive control resets the data and changes only the eligible January 30 count.
    scenes:
      - failure-construction
      - ledger-contract
  - heading: Check your diagnosis
    status: taught
    scenes:
      - baseline
      - intro
      - synthesis
