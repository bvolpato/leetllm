version: 1
lesson: language-modeling
promise: Follow a token from its prefix through prediction, scoring and generation. Decide which row to score,
  which token to feed back and why a run stopped.
objectives:
  - id: counts-and-sharing
    can: Estimate complete count rows and explain learned shared-feature training and its conditional entropy
      floor.
    scenes:
      - counts
      - full-vocabulary
      - sparse-history
      - context
      - neural-forward
      - neural-gradient
      - conditional-floor
  - id: objective-and-loss
    can: Score the observed path under its causal prefixes. Align labels once, count supervised targets and
      choose a common unit when tokenization changes.
    scenes:
      - tokens
      - sequence
      - teacher-forcing
      - objective-boundary
      - shift-contract
      - loss
      - pooled-evaluation
      - fresh-budgeted-rollout
  - id: generation
    can: Read the conditional row for a chosen prefix, apply temperature and filtering, and compare the
      probabilities of two-token paths before choosing a decoding rule.
    scenes:
      - intro
      - temperature-filter
      - generation
      - greedy-branch
      - transfer
      - fresh-budgeted-rollout
  - id: serving
    can: Identify the consumed prefix and stop reason from a run, check cache parity and calculate the work
      and storage implied by head, page and context policies.
    scenes:
      - cache-lifecycle
      - cached-parity
      - work-and-bandwidth
      - cache-budget
      - architecture-memory
      - context-policy
      - fresh-budgeted-rollout
  - id: evidence
    can: Check a policy answer against the retrieved version and test a code completion against execution on
      changed inputs and operations.
    scenes:
      - evidence-failure
