version: 1
lesson: linear-regression
promise: Fit a line to five request timings, test the bend suggested by its residuals, and use held-out errors and the measured length range to decide when to trust a forecast.
framing: []
objectives:
  - id: intro
    can: Use the changes between adjacent timings to forecast the next increment and distinguish that forecast from a measurement
    scenes:
      - intro
  - id: line
    can: Compute a linear prediction with units
    scenes:
      - line
  - id: residuals
    can: Diagnose a residual pattern
    scenes:
      - residuals
  - id: loss
    can: Calculate MSE and compare a mean baseline
    scenes:
      - loss
  - id: fit
    can: Trace a gradient update
    scenes:
      - fit
  - id: solve
    can: Verify least-squares projection and rank
    scenes:
      - solve
  - id: complexity
    can: Calculate how a squared-input feature moves the sixth forecast and predict the effect of shrinking its weight
    scenes:
      - complexity
  - id: solver-scale
    can: Estimate dense solver work and storage and interpret the rank and predictions of two least-squares fits
    scenes:
      - solver-scale
  - id: step-bound
    can: Use the curvature in each direction to tell whether a step contracts or amplifies the error
    scenes:
      - step-bound
  - id: penalty-contract
    can: Predict what happens to the mean forecast when Ridge charges the intercept and explain how Lasso can set a slope to zero
    scenes:
      - penalty-contract
  - id: statistical-contract
    can: State the inference, shape and deployment contract
    scenes:
      - statistical-contract
  - id: generalize
    can: Compare frozen forecasts on two new requests using signed residuals and mean squared error, then locate a request outside the tested range
    scenes:
      - generalize
