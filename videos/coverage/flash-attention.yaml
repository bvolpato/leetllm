version: 1
lesson: flash-attention
promise: Decide whether a tiled row preserves the dense blend by checking the weight carried from each tile and the keys its query can read. Use that row to explain backward recomputation, storage, IO, kernel scheduling and the measurements needed to compare backends.
framing: []
objectives:
  - id: intro
    can: Predict how many slots a full causal score array allocates when both token axes double.
    scenes:
      - intro
  - id: request-lifetime
    can: Trace which keys the word test can read and what changes when the next query arrives.
    scenes:
      - request-lifetime
  - id: operator
    can: Pair each score with its value, reconstruct the dense blend and bound it by the input values.
    scenes:
      - operator
  - id: memory
    can: Follow the scores and probabilities in both directions and count completed full-matrix transfers.
    scenes:
      - memory
  - id: memory-ledger
    can: Count allocation, logical transfers and retained rows separately
    scenes:
      - memory-ledger
  - id: local-budgets
    can: Fit logical tiles into distinct local resource budgets
    scenes:
      - local-budgets
  - id: roofline-bound
    can: Derive a bandwidth roof before interpreting utilization
    scenes:
      - roofline-bound
  - id: tiles
    can: Stream keys and values past a resident query tile
    scenes:
      - tiles
  - id: online
    can: Discard a tile after recording its reference, total weight and weighted value sum.
    scenes:
      - online
  - id: rescale
    can: Convert both saved totals to a new score reference and add the incoming key on that scale.
    scenes:
      - rescale
  - id: generalized-merge
    can: Diagnose a denominator-only rescale and an equal average of tile outputs, then reconstruct the merge from each tile's share.
    scenes:
      - generalized-merge
  - id: empty-and-overflow
    can: Handle an empty causal row and a finite-input overflow separately
    scenes:
      - empty-and-overflow
  - id: cpu-correctness
    can: Verify the recurrence on unequal lengths before requesting a GPU backend
    scenes:
      - cpu-correctness
  - id: backward
    can: Reconstruct probabilities when gradients need them
    scenes:
      - backward
  - id: backward-algebra
    can: Predict a score derivative's sign from the value and the blend, then derive the score and value gradients.
    scenes:
      - backward-algebra
  - id: backward-state
    can: Compare one saved probability matrix with one saved LSE vector
    scenes:
      - backward-state
  - id: complexity-ledger
    can: Scale mathematical work, auxiliary state and IO on separate axes
    scenes:
      - complexity-ledger
  - id: causal
    can: Mask the pairs that the objective forbids
    scenes:
      - causal
  - id: absolute-tile-ranges
    can: Classify causal work by positions before counting tiles
    scenes:
      - absolute-tile-ranges
  - id: loop-order
    can: Change the loop nest without changing the row
    scenes:
      - loop-order
  - id: warp-ownership
    can: Keep independent output rows with the warps that own them
    scenes:
      - warp-ownership
  - id: async-pipeline
    can: Protect a two-slot buffer while copy and compute overlap
    scenes:
      - async-pipeline
  - id: blackwell-reference
    can: Keep a common reference while reducing exponential overhead
    scenes:
      - blackwell-reference
  - id: benchmark-scopes
    can: Keep kernel throughput and full-workload time attached to their baselines
    scenes:
      - benchmark-scopes
  - id: prefill-decode
    can: Count query rows before choosing an inference kernel
    scenes:
      - prefill-decode
  - id: paged-contract
    can: Follow logical cache positions through a block table
    scenes:
      - paged-contract
  - id: alignment-failure
    can: Recover the four equal weights for a query at position three and explain why an upper-left mask returns only the first value.
    scenes:
      - alignment-failure
  - id: backend-policy
    can: Separate eligibility, completed dispatch and measured benefit
    scenes:
      - backend-policy
  - id: transfer
    can: Predict which part of the state changes when the last value changes and all scores stay fixed.
    scenes:
      - transfer
  - id: fresh-cache-repair
    can: Repair upper-left and open masks, then predict which valid key drops out when the query moves back one position.
    scenes:
      - fresh-cache-repair
