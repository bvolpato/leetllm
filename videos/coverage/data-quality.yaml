version: 1
lesson: data-quality
promise: Trace a support ticket from its raw message to a held-out prediction and decide whether the candidate can measure escalation on new conversations.
objectives:
  - id: contract
    can: Apply the row contract, identify a batch shift and check which labels still need review.
    scenes:
      - intake
      - contract-semantics
      - candidate-builder
      - fresh-candidate
  - id: identity
    can: Trace a changed prediction back to a training copy, compute normalized keys and choose the group and time boundary for the evaluation.
    scenes:
      - intro
      - normalization
      - unicode-recipe
      - duplicates
      - candidate-builder
      - split
      - group-leakage
  - id: approximation
    can: Construct a MinHash signature, identify complete bands, calculate candidate probability and check which pairs match inside a cluster.
    scenes:
      - similarity
      - minhash-rankings
      - lsh-bands
      - cluster-chain
  - id: review
    can: Identify the passage or test case a gate examined and decide which contamination, privacy or quality questions still need review.
    scenes:
      - contamination
      - contamination-audit
      - privacy
      - privacy-spans
      - corpus-selection
      - perplexity
      - synthetic-gates
  - id: release
    can: Reconcile kept and rejected rows, locate a changed file or reason count and check the held-out label counts before comparing models.
    scenes:
      - release
      - candidate-builder
      - candidate-contract
      - coverage-audit
      - version-trust
      - fresh-candidate
