version: 1
lesson: decision-models-jev-kev
promise: Use the log to identify a supported investigation, trace how a model scores it, and decide whether a validated ticket meets the application's measured routing policy.
framing: []
objectives:
  - id: decision-contract
    can: Distinguish a caller's allowed causes, a reviewer's label, a model's proposal and the host's permission to act.
    scenes: [intro, softmax, release]
  - id: option-update
    can: Normalize supplied option scores, subtract the labeled-option gradient and identify the winner after one update.
    scenes: [softmax, update, options]
  - id: source-of-score
    can: Compute a pointer score, predict the effect of positive temperature, and distinguish the three public readouts from Jev's disclosed interface.
    scenes: [pointer, temperature, training-contract]
  - id: perturb-contract
    can: Track the correct description through an option permutation and compare the original question's scores after changing a neighboring question.
    scenes: [options]
  - id: held-out-route
    can: Separate incident groups, freeze the calibration and cutoff, convert the inclusive gate for the offered answer count, and measure errors among the admitted tickets.
    scenes: [training-contract, risk, release]
