version: 1
lesson: distillation
promise: Decide what a student can learn from a teacher at a particular prefix and which student meets every independent release requirement.
framing:
  - intro
objectives:
  - id: signal
    can: Use a probability gap to predict a student update, remap a target by token meaning, and select the valid next-token positions and denominator.
    scenes:
      - intro
      - distribution
      - temperature
      - objective
      - learning
      - temperature-gradient
      - alignment-mask
  - id: family
    can: Check a projection on two tokens, choose among constrained students under each KL direction, and weight sequence losses by the left model's prefix probabilities.
    scenes:
      - feature-projection
      - reverse-capacity
      - sequence-kl
  - id: data
    can: Choose an available teacher signal, identify probability mass lost in a cache, and filter generated targets while keeping seed families together.
    scenes:
      - sequences
      - prefixes
      - signal-and-trainer
      - dataset-gates
      - recipe-evidence
  - id: release
    can: Predict a fresh logit update and decide which candidate clears accuracy, policy error, latency and monthly cost, including a result exactly at its limit.
    scenes:
      - capacity
      - transfer
      - fresh-distillation
sections:
  - heading: Why soft labels teach more than hard labels
    status: taught
    scenes:
      - distribution
      - temperature
      - temperature-gradient
      - recipe-evidence
  - heading: "Matching the teacher's probabilities: logit distillation"
    status: taught
    scenes:
      - distribution
      - objective
      - learning
      - alignment-mask
  - heading: Mathematical derivation of the T² gradient scaling factor
    status: taught
    note: The same two logits per model give different finite-temperature gradients at 1 and 4. The row at 40 tests the centered-logit limit.
    scenes:
      - temperature-gradient
  - heading: "When you only have text: response distillation"
    status: taught
    scenes:
      - sequences
      - signal-and-trainer
      - dataset-gates
      - recipe-evidence
  - heading: "Aligning internal layers: feature distillation"
    status: taught
    note: The film updates the projection rows with the student features held at [1, 2], then recomputes each output against its fixed teacher tick. A second token tests the fitted rows with features [2, 1].
    scenes:
      - feature-projection
  - heading: Forward versus reverse KL
    status: taught
    note: The two-token strips use the four joint paths from the article's sequence KL calculation. Each strip represents probability mass.
    scenes:
      - reverse-capacity
      - sequence-kl
  - heading: Off-policy versus on-policy distillation
    status: taught
    scenes:
