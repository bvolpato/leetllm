version: 1
lesson: bayes
promise: Decide whether to increase traffic by measuring the posterior probability that the agent clears a predeclared success-rate cutoff on its intended tasks.
framing: []
objectives:
  - id: update
    can: Distinguish prior, likelihood and posterior and update beta parameters once
      per task.
    scenes:
      - prior
      - likelihood
      - update
      - last-task
  - id: predict
    can: Forecast one or two passes and combine different orders of future outcomes into a count probability.
    scenes:
      - predictive
      - threshold
  - id: decide
    can: Use the area above the rate cutoff to decide whether a final pass or failure clears the evidence requirement.
    scenes:
      - intro
      - threshold
      - evidence
      - last-task
  - id: check-assumptions
    can: Test how the release decision depends on the prior, the deployment mix and forecasts checked against fresh outcomes.
    scenes:
      - sensitivity
      - population
      - calibration
