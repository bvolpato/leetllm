version: 1
lesson: gemm
promise: Trace a shared operand to the output that needs it. At a matrix edge, decide which inputs a thread must load and which store it can skip. Check the result before making a GPU performance claim.
framing: []
objectives:
  - id: product
    can: Pair a signed A row with a B column and keep each output sum through a short final panel.
    scenes:
      - intro
      - dot
      - naive
      - tile
      - accumulate
      - transfer
  - id: memory
    can: Compute requested addresses, bank mappings and register-tile operand-demand ratios.
    scenes:
      - addresses
      - banks
      - register-blocking
  - id: ownership
    can: Trace a thread with an invalid output to a valid A or B load. Protect the panel until its last consumer finishes.
    scenes:
      - intro
      - edge-ownership
      - hierarchy
      - async-ownership
      - transfer
  - id: numerics
    can: Find the useful corner inside an aligned warp fragment. Distinguish accumulator rounding from input conversion by comparing the kernel output with references computed from rounded and original inputs.
    scenes:
      - tensorcores
      - precision-contract
  - id: performance
    can: Decide whether an operand count belongs on an HBM roofline and identify the measurement a speed claim needs.
    scenes:
      - shape
      - roofline-check
