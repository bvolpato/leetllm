version: 1
lesson: cuda-execution
promise: Follow a ticket from Python to a completed CUDA mean. Decide when its value is safe to read and which elapsed time belongs in the caller's log.
objectives:
  - id: execution
    can: Map valid inputs to threads and warps, guard the tail, and order shared writes before a block reads its sum.
    scenes:
      - intro
      - mapping
      - warps
      - barrier
      - transfer
      - fresh-runtime
  - id: placement
    can: Locate a failure in driver access, the PyTorch build, or tensor placement during a training step.
    scenes:
      - residence
      - stack-contract
      - ticket-step
      - full-step-contract
  - id: memory
    can: Budget live tensors by dtype, identify when Adam allocates a parameter's moments, test whether a weight update survives storage, and explain which memory a smaller batch frees.
    scenes:
      - budget
      - storage-scope
      - activation-budget
      - precision-slots
      - large-model-budget
      - precision-controls
      - allocator-ledger
  - id: accumulation
    can: Divide each microbatch's summed loss by the full batch's ticket count, valid token count, or total target weight. Skip the update when that denominator is zero.
    scenes:
      - ticket-step
      - large-model-budget
  - id: movement
    can: Count global segments from byte addresses and shared banks from word addresses and the tile's starting bank. Identify conflicts and trace each copied buffer to its consumer.
    scenes:
      - coalescing
      - banks
      - storage-scope
      - copy-dependencies
      - profile-choice
  - id: measurement
    can: Choose the timer endpoints for a stream or a caller, calculate the wait left when Python requests a scalar, and verify a layout change against the reference output and whole-step time.
    scenes:
      - clocks
      - fresh-runtime
      - synthesis
      - occupancy-resources
      - profile-choice
      - full-step-contract
