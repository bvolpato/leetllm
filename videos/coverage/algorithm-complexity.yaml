version: 1
lesson: algorithm-complexity
promise: Count the growing work and memory of scans, exact and prefix lookup, vector
  scoring, selection, pairs and attention, then choose a measured retrieval shortcut
  without losing authority or required evidence.
framing: []
objectives:
  - id: opening
    can: Count actual candidate inspections before claiming a match.
    scenes:
      - opening
  - id: scan
    can: Separate candidate count from row-length work.
    scenes:
      - scan
  - id: ordered-search
    can: Trace midpoint comparisons and array insertion shifts.
    scenes:
      - ordered-search
  - id: hash-lookup
    can: Compute a hash bucket and distinguish collisions from normal lookup.
    scenes:
      - hash-lookup
  - id: radix-prefix
    can: Walk a shared prefix and account for returned matches.
    scenes:
      - radix-prefix
  - id: amortized-append
    can: Count copies and writes across an array growth history.
    scenes:
      - amortized-append
  - id: vector-score
    can: Count coordinate products before scaling n and d.
    scenes:
      - vector-score
  - id: top-k
    can: Maintain a bounded min-heap and separate selection from scoring.
    scenes:
      - top-k
  - id: unique-pairs
    can: Construct unordered pairs and distinguish exact equality from semantic comparison.
    scenes:
      - unique-pairs
  - id: attention
    can: Count dense prefill positions and consumed-input decode reads.
    scenes:
      - attention
  - id: cache-volume
    can: Compute raw key/value storage and grouped query sharing.
    scenes:
      - cache-volume
  - id: queue-measurement
    can: Separate batch formation, executor queueing and execution time.
    scenes:
      - queue-measurement
  - id: work-budget
    can: Choose a workload that fits a score-work cap.
    scenes:
      - work-budget
  - id: shortlist-payoff
    can: Repair a shortlist that loses required evidence.
    scenes:
      - shortlist-payoff
