version: 1
lesson: deep-dive-deepgemm
promise: Follow a token through DeepGEMM's layouts, scaled arithmetic, and expert pipeline, then use its returned output and complete-layer time to decide whether to keep a kernel change.
objectives:
  - id: computed-matrix-contract
    can: Compute NT shapes, operation counts, scale-weighted partial sums, and the packed row offset and reserved capacity of each expert.
    scenes:
      - dot
      - gemm-contract
      - reuse-budget
      - scales
      - precision-contracts
      - intro
      - packing
      - routed-denominators
      - grouped-modes
      - fresh-contract
  - id: versioned-layout-and-indexer
    can: Trace actual descriptor addresses, scale lifetimes, JIT signatures and compressed or sparse score
      positions across the dated API migration.
    scenes:
      - movement
      - stage-lifetime
      - jit-contract
      - deepjit-migration
      - indexer
      - indexer-contract
      - sparse-position-map
  - id: complete-expert-pipeline
    can: Trace dispatch, both projections, SwiGLU and weighted combine under the selected slot, symmetric-memory, locality and epilogue contracts.
    scenes:
      - overlap
      - moe-graph
      - ring-ownership
      - locality-epilogue
  - id: choose-packed-run
    can: Locate a routed row after alignment, verify the return by source token, and use complete-layer time to choose between correct paths.
    scenes: [intro, packing, moe-graph, profile-the-layer, fresh-contract]
  - id: bounded-performance-diagnosis
    can: Separate project, model and serving ownership, interpret historical work-rate receipts, test
      complete-layer timing and determinism, and diagnose the first failing contract.
    scenes:
      - project-boundary
      - benchmark-receipt
      - profile-the-layer
      - determinism
      - bringup-triage
      - fresh-contract
