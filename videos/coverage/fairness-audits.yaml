version: 1
lesson: fairness-audits
promise: Decide whether a change to a service router passes a paired fairness audit and identify the production evidence needed for release.
framing:
  - subject-intro
objectives:
  - id: verify-pairs
    can: Verify equivalent claims against the receipt and manifest, then distinguish changes in access from harm in a generated reply.
    scenes:
      - harms-and-outcomes
      - matched-pairs
      - pair-flips
  - id: calculate-rates
    can: Track ready and unclear claims through the router, calculate the two rate gaps, and apply absolute service and safety limits.
    scenes:
      - confusion-matrices
      - criterion-choice
  - id: interpret-scores
    can: Use the denominator to explain precision, conditional score means and calibration across groups.
    scenes:
      - metric-tradeoffs
      - score-calibration
  - id: assess-support
    can: Identify missing slice support, choose the paired sampling unit, and compare a signed gap interval with a practical tolerance.
    scenes:
      - score-calibration
      - uncertainty-and-slices
      - uncertainty-gate
  - id: release-decision
    can: Test a proposed rubric change, block offsetting pair flips, and distinguish fixture results from release evidence.
    scenes:
      - interventions
      - benchmark-scope
      - release-gate
