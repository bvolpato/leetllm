version: 1
lesson: conformal
promise: Use held-out errors to build a prediction set, check whether a new outcome falls inside, and choose the right denominator for a deadline or routing decision.
framing:
  - intro
objectives:
  - id: outcome-1
    can: Keep model selection separate from calibration and turn each held-out forecast and observation into an absolute error.
    scenes: &a1
      - split
      - scores
      - shift
  - id: outcome-2
    can: Count the future position, select the observed order statistic and detect a percentile call that selects a different error.
    scenes: &a2
      - quantile
      - index-contract
      - interval
  - id: outcome-3
    can: Hold out distinct scores in turn to explain the marginal guarantee and use a tied boundary to explain conservative coverage.
    scenes: &a3
      - exchangeability
      - ties-bound
  - id: outcome-4
    can: Count covered outcomes on their own intervals, including endpoints, and distinguish that sample fraction from marginal coverage.
    scenes: &a4
      - coverage
      - normalized-score
  - id: outcome-5
    can: Return class IDs under the individual, direct cumulative and conservative crossing rules, including an exact equality and tied probabilities.
    scenes: &a5
      - classifier-score
      - aps-inversion
      - aps-crossing
  - id: outcome-6
    can: Reweight subgroup coverage and choose a separately calibrated scale rule when error sizes vary by input.
    scenes: &a6
      - subgroup-mix
      - normalized-score
      - shift
  - id: outcome-7
    can: Check the corrected threshold for wrong answers per arrival and compute the error rate among the answers sent.
    scenes: &a7
      - crc-loss
      - crc-threshold
      - selected-error
  - id: outcome-8
    can: Record interval width, inclusion and deadline misses separately, and predict which entry changes after a one-score recalibration.
    scenes: &a8
      - intro
      - interval
      - coverage
      - transfer
      - fresh-deadline
