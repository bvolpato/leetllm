version: 1
lesson: learning-theory
promise: Decide whether a support router clears a population-error gate given the tickets that selected it, the cases that tested it, and the error allowance the design supports.
framing: []
objectives:
  - id: justify-risk
    can: Distinguish a measured sample loss from population risk and choose the fixed or simultaneous radius for a release decision.
    scenes: [intro, population-risk, one-predictor, pay-for-search, holdout, takeaway]
  - id: compare-capacity
    can: Bound the excess risk of a sample winner and distinguish shattering, a growth ceiling, and an average best fit to noise.
    scenes: [excess-risk, vc-shattering, growth-function, noise-correlation]
  - id: interpret-interpolation
    can: Explain why an exact training fit leaves the optimizer's choice and the prediction risk on new inputs open.
    scenes: [interpolation-risk, optimizer-geometry]
  - id: design-sample
    can: Choose a sufficient count for a stated precision and audit the sampling unit, population, and separation from selection.
    scenes: [sample-plan, holdout, limits, takeaway]
