version: 1
lesson: local-llm-placement
promise: Decide how many incident logs a local worker can admit, trace a failed allocation to the bytes that caused it, and check whether the model can safely answer the admitted requests.
objectives:
  - id: hardware-contract
    can: Distinguish advertised capacity/bandwidth from measured model evidence
    scenes:
      - hardware-contract
  - id: bandwidth-batch
    can: Compute theoretical channel and batched weight-stream bounds
    scenes:
      - bandwidth-batch
  - id: pools
    can: Check host, device and shared pools independently
    scenes:
      - pools
  - id: weight-payload
    can: Count ideal codes and additional loaded artifact components
    scenes:
      - weight-payload
  - id: cache-formula
    can: Compute separate key/value bytes with actual layer dimensions
    scenes:
      - cache-formula
  - id: workspace-contract
    can: Identify the live allocations when a prefill buffer fails and isolate chunk size in a replay.
    scenes:
      - workspace-contract
      - synthesis
  - id: retention
    can: Compare capped and full-length buffers under the same sliding mask and put their byte counts on the device budget.
    scenes:
      - retention
      - worksheet-evidence
  - id: placement
    can: Trace one activation across the CPU and GPU boundary while each block's weights stay on its executing device.
    scenes:
      - placement
  - id: flag-semantics
    can: Count the versioned output slot before choosing a layer flag
    scenes:
      - flag-semantics
  - id: allocation-evidence
    can: Discriminate allocation failure, offload, migration and rereads
    scenes:
      - allocation-evidence
  - id: transfer-comparison
    can: Compute serial byte-stream times under explicit bandwidth inputs
    scenes:
      - transfer-comparison
  - id: runner-contract
    can: Distinguish model formats, configuration and execution capabilities
    scenes:
      - runner-contract
  - id: serving-comparison
    can: Compare replicas and parallel serving against separate SLOs
    scenes:
      - serving-comparison
  - id: network-controls
    can: Diagnose caller authorization and complete outbound-path failures
    scenes:
      - network-controls
  - id: inventory-evidence
    can: Retain immutable identities and separate inventory from readiness
    scenes:
      - inventory-evidence
  - id: timing-contract
    can: Validate counts and compute rates with the correct denominators
    scenes:
      - timing-contract
  - id: quality
    can: Apply a protected per-case release policy despite aggregate gains
    scenes:
      - quality
  - id: fresh-admission
    can: Count shared weights and workspace once, add each log's cache, and decide how many logs fit. Use the protected rollback check and the local fallback policy to decide who can answer them.
    scenes:
      - intro
      - quality
      - fresh-admission
