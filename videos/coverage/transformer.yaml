version: 1
lesson: transformer
promise: Follow a prompt through a causal decoder and use its full-prefix read and vocabulary scores
  to decide whether a cached query used the right history.
objectives:
  - id: state
    can: Construct positioned rows and preserve each token’s feature identity through residual updates
    scenes:
      - intro
      - embedding
      - position-designs
      - normalization
      - residual
      - norm-contracts
  - id: read
    can: Compute scaled masked attention, explain head shapes and distinguish a mixture of value features
      from the probability of a vocabulary token
    scenes:
      - mask
      - matching-scale
      - attention
      - parallel-heads
      - fresh-decoder
  - id: local
    can: Locate the bend introduced by an activation, fit a gated FFN to a fixed weight budget and distinguish normalization orders
    scenes:
      - feed-forward
      - ffn-variants
      - norm-contracts
  - id: causal
    can: Align shifted targets, test for leakage through the block and check a cached query against its absolute position and full-prefix read
    scenes:
      - causality
      - causal-training
      - api-alignment
      - failure-contract
      - fresh-decoder
  - id: output
    can: Project every position to vocabulary scores, apply temperature correctly and preserve tokenizer/table
      identity in the next step
    scenes:
      - logits
      - feedback
      - vocabulary-contract
      - fresh-decoder
      - executable-contracts
  - id: scope
    can: Select encoder/decoder visibility and read actual checkpoint dimensions without treating tiny execution
      checks as learned quality
    scenes:
      - architecture-visibility
      - real-scale
      - executable-contracts
