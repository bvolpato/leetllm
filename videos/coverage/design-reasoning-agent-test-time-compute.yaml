version: 1
lesson: design-reasoning-agent-test-time-compute
promise: Decide which reasoning call to fund and which completed advisory to return when the deadline arrives.
objectives:
  - id: xml-contract
    can: Validate the response fields and match a fresh metrics receipt to the current rollout before applying policy.
    scenes:
      - intro
      - xml-contract
      - evidence
      - synthesis
  - id: api-controls
    can: Distinguish model reasoning settings from external hard budgets
    scenes:
      - api-controls
  - id: coverage-operation
    can: Compute independent candidate coverage without promising returned accuracy
    scenes:
      - coverage-operation
  - id: voting-baseline
    can: Compare voting, token beams and explicit thought alternatives
    scenes:
      - voting-baseline
  - id: tree-contract
    can: Preserve completed plans separately from unfinished frontiers
    scenes:
      - tree-contract
  - id: puct-allocation
    can: Update visit counts and the mean outcome, then choose which feasible branch gets the next rollout.
    scenes:
      - puct-allocation
  - id: verifier-evidence
    can: Find the first failed step and count the generator calls saved by checking before continuation.
    scenes:
      - process
      - verifier-evidence
  - id: answer-bias
    can: Measure evaluator false acceptance independently of solver accuracy
    scenes:
      - answer-bias
  - id: trained-policy
    can: Separate training improvement from request-time controls
    scenes:
      - trained-policy
  - id: router-evaluation
    can: Apply routing, escalation and plateau rules under evidence gates
    scenes:
      - router-evaluation
  - id: reservation-reconcile
    can: Fit a new call into free capacity and reconcile duplicate, conflicting, oversized and missing usage receipts.
    scenes:
      - budget
      - reservation-reconcile
      - fresh-deadline
  - id: incomplete-advisory
    can: Withhold incomplete candidates despite nonempty text
    scenes:
      - incomplete-advisory
  - id: kv-byte-model
    can: Derive binary KV capacity from dimensions and live slots
    scenes:
      - kv-byte-model
  - id: prefix-lease
    can: Preserve reference and reader lifetimes during shared-prefix reuse
    scenes:
      - prefix-lease
  - id: eviction-architecture
    can: Separate lossy eviction from a purpose-built recurrent architecture
    scenes:
      - eviction-architecture
  - id: safe-progress
    can: Project trusted progress and measure three different latency boundaries
    scenes:
      - safe-progress
  - id: evaluation-release
    can: Compare controllers on held-out incidents at total cost
    scenes:
      - evaluation-release
  - id: fresh-deadline
    can: At the deadline, return a completed eligible answer or abstain when its evidence expires, while retaining reservations for outstanding calls.
    scenes:
      - fresh-deadline
      - synthesis
  - id: path-eligibility
    can: Trace both hops of a proposed repair and exclude a blocked path before comparing scores.
    scenes:
      - candidates
      - voting-baseline
      - tree
