version: 1
lesson: reward-modeling
promise: Fit a scalar scorer from preference pairs and decide whether to use its rankings by testing what it learned about approval, length and reviewer choices on fresh examples.
framing:
  - introduction
objectives:
  - id: likelihood-isnt-preference
    can: Compute complete supplied sequence probabilities and distinguish likelihood from a preferred answer.
    scenes:
      - likelihood-isnt-preference
  - id: human-comparisons
    can: Compare two independent ballots, preserve the split vote and apply the approval rubric to a strict label.
    scenes:
      - introduction
      - human-comparisons
  - id: policy-and-judge
    can: Trace a completed answer into the same scalar scorer.
    scenes:
      - policy-and-judge
  - id: pair-contract
    can: Inspect shared context and exact scored token identities.
    scenes:
      - pair-contract
  - id: format-length-boundary
    can: Diagnose input identity, tokenization and pair length filtering before fitting.
    scenes:
      - format-length-boundary
  - id: prompt-groups
    can: Construct all pair edges and repair prompt leakage across splits.
    scenes:
      - prompt-groups
  - id: group-weight-soft-target
    can: Compute prompt-group weighting, a full-ranking probability and soft-vote optimum.
    scenes:
      - group-weight-soft-target
  - id: transformer-score-head
    can: Construct a scalar score from final causal hidden coordinates.
    scenes:
      - transformer-score-head
  - id: padding-and-artifact
    can: Select the final unmasked vector and identify the saved trainable head.
    scenes:
      - padding-and-artifact
  - id: margin-to-probability
    can: Compute a Bradley-Terry forecast from positive strengths and score difference.
    scenes:
      - margin-to-probability
  - id: pairwise-likelihood
    can: Compute stable loss for correct and confidently wrong margins.
    scenes:
      - pairwise-likelihood
  - id: stable-loss-and-margins
    can: Evaluate an extreme stable loss and solve a margin-shifted target probability.
    scenes:
      - stable-loss-and-margins
  - id: score-gradients
    can: Differentiate score loss and trace an actual shared-parameter update.
    scenes:
      - score-gradients
  - id: fit-the-head
    can: Change one training pair, trace the two fitted weights and predict which head will reward a longer violation on the same three held-out pairs.
    scenes:
      - fit-the-head
  - id: offset-and-scale
    can: Predict offset invariance and scale sensitivity on one number line.
    scenes:
      - offset-and-scale
  - id: centering-and-kl
    can: Compute pair-midpoint centering and the equivalent reward/KL scaling.
    scenes:
      - centering-and-kl
  - id: shortcuts-and-calibration
    can: Account for the cost of a confident miss by comparing per-vote squared errors and their means at the same ranking accuracy.
    scenes:
      - shortcuts-and-calibration
  - id: length-margin-counterexample
    can: Derive a failed length correction and design controlled presentation tests.
    scenes:
      - length-margin-counterexample
  - id: fresh-policy-evaluation
    can: Compare stored and fresh-output evaluation and identify overoptimization.
    scenes:
      - fresh-policy-evaluation
  - id: ensemble-disagreement
    can: Compute a sample-deviation aggregate and expose shared semantic error.
    scenes:
      - ensemble-disagreement
  - id: benchmarks-and-fresh-gates
    can: Interpret the benchmark outcome space and apply a declared fresh-output screen.
    scenes:
      - benchmarks-and-fresh-gates
  - id: signal-spectrum
    can: Select and bound terminal, process, generative and executable supervision.
    scenes:
      - signal-spectrum
  - id: trainer-artifact-and-diagnosis
    can: Replay a saved scorer and diagnose drift with the correct metric.
    scenes:
      - trainer-artifact-and-diagnosis
  - id: fresh-scorer-screen
    can: Decide whether a trial meets its agreement floor and verify a citation against the complete contents of its stated edition.
    scenes:
      - fresh-scorer-screen
  - id: rlhf-and-dpo
    can: Choose between a reusable scorer and offline DPO. Rescale equal feature weights to explain why the longer violation still wins, then decide whether to continue the trial by checking approval at each grant.
    scenes:
      - rlhf-and-dpo
