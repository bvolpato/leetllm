version: 1
lesson: active-labeling
promise: Choose which cases deserve the next review, then decide whether their feedback can enter training and which
  test can still measure the trained model on unseen families.
framing:
  - subject-intro
objectives:
  - id: trace-to-signal
    can: Route a reserved incident to both permitted destinations, redact a separate eligible source, and derive the
      preference signal from a replayable judgment.
    scenes:
      - subject-intro
      - record-types
      - redact-and-provenance
      - write-rubric
      - preference-loss
  - id: agreement-and-selection
    can: Turn independent ballots into chance-adjusted agreement, fill a limited review queue by recomputing weighted
      scores, and distinguish covering radius from learning gain and prevalence.
    scenes:
      - reviewer-agreement
      - agreement-models
      - uncertainty-selection
      - diversity-selection
      - selection-score
      - selector-trial
  - id: independent-release
    can: Check judge identities, source families and completed snapshot-bound audits, then trace a checkpoint to the
      rows it consumed to decide which test remains independent.
    scenes:
      - evaluation-boundary
      - lineage-audit
      - dataset-release
      - fresh-release
sections:
  - heading: Separate records by the job they do
    status: taught
    scenes:
      - record-types
      - preference-loss
      - subject-intro
  - heading: Redact before selection or review
    status: taught
    scenes:
      - redact-and-provenance
  - heading: Write the rubric before collecting preferences
    status: taught
    scenes:
      - write-rubric
  - heading: Store enough provenance to replay the judgment
    status: taught
    scenes:
      - redact-and-provenance
      - write-rubric
  - heading: Measure agreement, then repair disagreement
    status: taught
    note: Two illustrative ballots complete the article's 120-case table. The fresh table tests the same calculation on 80 cases.
    scenes:
      - reviewer-agreement
      - agreement-models
      - fresh-release
  - heading: Select cases that might teach something new
    status: taught
    note: The six-record pool uses the article's coordinates and uncertainties. A separate three-record ruler tests the weighted rule against covering radius.
    scenes:
      - uncertainty-selection
      - diversity-selection
      - selection-score
  - heading: Test selection without contaminating evaluation
    status: taught
    scenes:
      - evaluation-boundary
      - lineage-audit
      - selector-trial
      - fresh-release
  - heading: Measure label efficiency, not label volume
    status: taught
    scenes:
      - selector-trial
  - heading: Treat model judges as assistants, not ground truth
    status: taught
    scenes:
      - evaluation-boundary
  - heading: Promote a versioned feedback dataset
    status: taught
    scenes:
      - dataset-release
  - heading: Gate the full data release
    status: taught
    note: Removing both known derivatives changes the training snapshot. A checkpoint trained before removal keeps its original exposure.
    scenes:
      - dataset-release
      - fresh-release
  - heading: Try the review boundaries
    status: taught
    scenes:
      - fresh-release
      - evaluation-boundary
      - selector-trial
      - dataset-release
