version: 1
lesson: llm-judge
promise: Decide when a judge has earned a preference between two replies, which cases count toward
  agreement, and what evidence a reviewer still needs before acting on the result.
objectives:
  - id: define-measurement
    can: Choose exact checks and rubric formats, scope research evidence and calculate pairwise call
      budgets.
    scenes:
      - subject-intro
      - separate-checks
      - evaluation-formats
      - rubric
      - reader-model-check
  - id: parse-and-reconcile
    can: Reject duplicate verdicts before decoding loses them, check a parsed reason against the actual
      reply and follow each slot to its reply before recording a preference, tie, conflict or review request.
    scenes:
      - strict-receipt
      - order-swap
      - swap-contract
      - fresh-decision
  - id: measure-errors
    can: Design matched probes, compare two independent human ballots before adjudication, and compute
      agreement from paired cases, chance agreement from crossed labels and coverage from all attempts.
    scenes:
      - blind-and-probe
      - controlled-probes
      - human-reference
      - agreement
      - prevalence-trap
      - coverage
  - id: use-with-bounds
    can: Check the proposed next action against the current service record, bound false acceptance on
      independent known-bad cases and compare frozen judge configurations on one held-out labeled set.
    scenes:
      - state-history
      - zero-error-bound
      - transfer
      - fresh-decision
