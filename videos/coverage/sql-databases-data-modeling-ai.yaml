version: 1
lesson: sql-databases-data-modeling-ai
promise: Decide which return deadline Bob can support from the saved policy, then trace the answer to its
  edition, paragraph and permission row.
objectives:
  - id: model-and-query
    can: Trace a chunk to its required parent, predict how constraints handle NULL, and bind a substring
      search that matches literal punctuation across ASCII letter case.
    scenes:
      - relations
      - schema-contract
      - query
      - literal-substring
      - query-null
      - join
  - id: owned-versioned-evidence
    can: Decide which paragraphs a reader may retrieve at an edition boundary, test row security with the
      application role, and predict what inserting one more permission row changes for a verified workspace.
    scenes:
      - validity
      - version-guard
      - authorization
      - role-boundary
      - closing
      - fresh-request
  - id: atomic-durable-work
    can: Recover committed rows, delete dependents in order, tell which edition each reader sees at commit,
      and distinguish a replay of a completed write from a new publication or an uncertain remote result.
    scenes:
      - durability
      - delete-order
      - transaction-context
      - publication
      - publish-boundary
      - snapshots
      - retries
      - idempotency-boundary
      - closing
  - id: plans-and-summaries
    can: Trace which paragraph WHERE removes before counting and which source group HAVING excludes afterward.
      Count children for an empty parent and distinguish a query plan from measured latency.
    scenes:
      - counts
      - aggregate-order
      - indexes
      - plan-contract
  - id: vector-and-eval-lineage
    can: Compute cosine distance and similarity, measure filtered recall against exact neighbors, and check a
      saved score against the embedding and relevance versions available to that run or report.
    scenes:
      - semantic
      - vector-contract
      - lineage-version
