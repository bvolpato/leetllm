version: 1
lesson: ai-coding-workflow-with-agents
promise: Decide whether to return a billing patch for integration review by replaying its provider event,
  counting the stored invoices and matching the result to the candidate under review.
framing:
  - intro
objectives:
  - id: contract
    can: Trace a provider retry to the storage write, scope the patch and restrict what the test process can reach.
    scenes:
      - worker-interface
      - contract
      - runner-policy
      - scope
  - id: verify
    can: Compare returned IDs and stored rows, predict the effect of competing writes and distinguish a failed
      repair from a setup error or skipped replay.
    scenes:
      - intro
      - replay
      - race
      - loop
      - verifier-traps
      - receipts
      - receipt-contract
      - fresh-handoff
  - id: handoff
    can: Match the actual tested snapshot, verifier and execution record to the current candidate, then
      hand the scoped result to the integration owner.
    scenes:
      - snapshot-contract
      - roles-and-failures
      - benchmark-context
      - handoff
      - fresh-handoff
