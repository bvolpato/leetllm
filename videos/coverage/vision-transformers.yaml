version: 1
lesson: vision-transformers
promise: Trace a change in the incident screenshot from pixels to language inputs and decide what evidence would verify its request ID.
framing: []
objectives:
  - id: exact-reading
    can: Compare the processed identifier with a native crop, check a proposed reading against its label, and locate the first stage that erases a known difference.
    scenes:
      - intro
      - processor-evidence
      - projection-rank
      - candidate-ranking
      - fresh-detail-boundary
  - id: representation
    can: Rebuild an image from patch rows, compare convolution and projection values under two channel orders, and predict which pixel changes a matrix retains.
    scenes:
      - processor-evidence
      - patches
      - convolution-equivalence
      - projection
      - projection-rank
  - id: encoder
    can: Compute position and residual updates, follow a later patch into an attention output, and predict how masks and grid size affect that computation.
    scenes:
      - positions
      - resolution-grid
      - rotary-grid
      - attention
      - preln-block
      - budget
      - padding-readout
  - id: supervision
    can: Compare CLIP and SigLIP losses, recompute a candidate’s score after a duplicate is added, and explain what teacher features, Gram targets, and registers contribute.
    scenes:
      - alignment
      - candidate-ranking
      - siglip-pairs
      - variable-resolution
      - dense-feature-learning
      - inductive-bias
  - id: handoff
    can: Count encoder and bridge outputs separately, compute raw decoder KV storage with text fixed, and decide which cache an input change invalidates.
    scenes:
      - bridge-families
      - prefix-kv-budget
      - bridge
      - fresh-detail-boundary
