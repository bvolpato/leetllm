version: 1
lesson: hybrid-search
promise: Trace a required passage from each permitted search through fusion to the prompt, and choose the first limit or ranking decision that needs to change.
framing: []
objectives:
  - id: lexical
    can: Explain why the code retrieves Luna’s key rule and the paraphrase misses it, diagnose a split identifier, and compute a BM25 or learned sparse contribution.
    scenes:
      - subject-intro
      - eligible-corpus
      - lexical-lane
      - bm25-open
      - sparse-expansion
  - id: dense
    can: Calculate the paraphrase’s cosine with each policy axis and distinguish an encoder mismatch from a missed neighbor in a fixed index.
    scenes:
      - dense-lane
      - embedding-contract
      - ivf-border
      - hnsw-walk
  - id: selection
    can: Add rank contributions by passage ID, apply the tie-break, and decide whether to deepen a lane, retain more fused candidates, or change final selection.
    scenes:
      - rank-fusion
      - weighted-fusion
      - consensus-trap
      - mmr-choice
      - new-query
      - policy-transfer
  - id: release
    can: Read a request trace, distinguish a completed empty lane from a timeout, and check passage coverage and elapsed wall time under a fixed grant.
    scenes:
      - latency-contract
      - eligible-corpus
      - new-query
      - policy-transfer
