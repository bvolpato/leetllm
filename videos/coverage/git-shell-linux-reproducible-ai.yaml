version: 1
lesson: git-shell-linux-reproducible-ai
promise: Reconstruct a committed AI evaluation in a clean clone, trace exact Git contents and shell
  statuses, and diagnose environment, input, process and host boundaries.
framing:
  - opening
objectives:
  - id: snapshot
    can: Check the clone's current directory, index and committed tree. Trace the request the
      working-tree hook missed, predict the gate, and read the checking subshell's saved status.
    scenes:
      - opening
      - find-file
      - git-states
      - ignore-contract
      - local-hook
      - commit-boundary
      - history
      - clean-clone
      - fresh-handoff
  - id: records
    can: Distinguish a final line feed from a blank record in strict JSON Lines. Count newlines,
      valid records and normalized matches separately, then apply the integer gate.
    scenes:
      - score
      - input-contract
      - shell-inspection
      - fresh-handoff
  - id: shell
    can: Resolve paths, check permissions and propagate helper and pipeline failures. Run a logged
      check across an SSH disconnect and use a bounded poll before collecting a child's exit status.
    scenes:
      - navigation-contract
      - shell-inspection
      - helper-contract
      - pipeline
      - strict-shell
      - remote-jobs
      - shutdown
  - id: environment
    can: Rebuild a declared Python environment, keep the tracked secret template blank, check
      required model objects and GPU visibility, and state the tested host boundary.
    scenes:
      - environment
      - environment-contract
      - device-contract
      - lfs-contract
      - clean-clone
      - fresh-handoff
