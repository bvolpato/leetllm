version: 1
lesson: agent-evaluation
promise: Decide whether a reservation succeeded, diagnose a duplicate after a lost reply, and use
  repeated trials and independent evidence to make a release decision.
objectives:
  - id: effects
    can: Bind a permitted action and independent outcome read to the same resource, operation and
      current version.
    scenes:
      - subject-intro
      - episode-contract
      - action-trace
      - hard-gates
      - recovery
      - trace-contract
      - process-contract
      - fresh-library
  - id: distinguish-retry-effects
    can: Predict how replaying a supported operation key affects the account, count all write
      dispatches, and trace a duplicate hold to the write that created it.
    scenes:
      - recovery
      - fresh-library
  - id: measure
    can: Compute grouped repeated-success estimators, incurred cost per successful run and an
      uncertainty gate under stated assumptions.
    scenes:
      - repeatability
      - economics
      - metric-estimators
      - uncertainty
  - id: release
    can: Audit a judge, harness and public benchmark scope, then reject invalid or insufficient
      candidate release evidence.
    scenes:
      - transfer
      - judge-calibration
      - benchmark-surfaces
      - harness-integrity
      - release-report
      - repair-evidence
      - fresh-library
