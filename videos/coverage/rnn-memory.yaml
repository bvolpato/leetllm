version: 1
lesson: rnn-memory
promise: Decide which recurrent state a classifier should read by tracing what each event stores, what training can change, and where each history ends.
framing:
  - intro
objectives:
  - id: recurrent-computation
    can: Predict how event order changes a shared recurrence, build a two-coordinate state, and use its logits to select an action.
    scenes:
      - recurrence
      - shared
      - event-order
      - vector-build
      - action-head
  - id: temporal-credit
    can: Trace a final-state derivative to an early event and distinguish graph detachment from gradient clipping.
    scenes:
      - actual-credit
      - gradients
      - matrix-bound
      - truncation
  - id: gated-memory
    can: Compute stored and exposed LSTM coordinates, blend a GRU candidate, and select a matrix that tests reset placement.
    scenes:
      - lstm
      - learned-lstm
      - retention
      - gru
      - learned-gru
      - parameter-geometry
  - id: sequence-boundaries
    can: Use valid lengths to distinguish a real zero observation from filler, verify the final state against the unpadded prefix, and initialize the next incident.
    scenes:
      - padding
      - batch-boundaries
      - earned-transfer
  - id: encoder-interface
    can: Identify a collision in a finite context and compare a recurrent relay with a direct causal attention read.
    scenes:
      - compression-attention
