version: 1
lesson: estimation
promise: Estimate a queue rate, construct and interpret uncertainty, and distinguish missing labels,
  sampling design, bias, priors and calibration before deciding capacity.
framing: []
objectives:
  - id: intro
    can: Fix the sample size and staffing rule before seeing labels, then distinguish the first sample estimate from the unknown weekly share.
    scenes:
      - intro
  - id: sampling
    can: Distinguish sampling variation from a changed population
    scenes:
      - sampling
  - id: score-interval
    can: Invert a score test to form a Wilson interval
    scenes:
      - score-interval
  - id: accumulating-evidence
    can: Predict how the Wilson interval changes when more reviews give the same sample fraction.
    scenes:
      - accumulating-evidence
  - id: boundary
    can: Substitute ten and then twenty independent labels in the zero-success Wilson bound and distinguish that interval from coverage in fresh samples of one hundred.
    scenes:
      - boundary
  - id: sample-design
    can: Combine known lane rates with traffic shares and choose representative samples within lanes when the rates need measuring.
    scenes:
      - sample-design
  - id: resampling
    can: Draw bootstrap samples without claiming new evidence
    scenes:
      - resampling
  - id: prior-and-calibration
    can: Calculate the posterior mode under a binomial model and compare a fixed forecast with the outcome rate in a separate random held-out audit.
    scenes:
      - prior-and-calibration
  - id: target-and-missing
    can: Choose the denominator for resolved cases, bound the full tray's share, and calculate observed reviewer agreement from paired labels before adjudication.
    scenes:
      - target-and-missing
  - id: cluster-evidence
    can: Predict which bootstrap spread preserves dependence among signups from the same campaign.
    scenes:
      - cluster-evidence
  - id: bias-and-prior
    can: Distinguish the bias across repeated routine-only samples from a single sample's error, and distinguish posterior mean from mode.
    scenes:
      - bias-and-prior
  - id: missing-label-transfer
    can: Compute missing-label bounds for a new sample
    scenes:
      - missing-label-transfer
  - id: report
    can: Apply the prespecified Wilson upper-bound rule once, then compare the staffing decision with the actual workload.
    scenes:
      - intro
      - report
