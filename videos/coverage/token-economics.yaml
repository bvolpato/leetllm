version: 1
lesson: token-economics
promise: Use attempt receipts and a dated rate card to decide which support and evaluation work fits the budget and meets the answer requirements.
objectives:
  - id: accounting
    can: Split a provider receipt into billable categories and price each category under the applicable context tier.
    scenes:
      - receipt-anatomy
      - usage-contract
      - one-answer
      - hidden-output
      - context-tier
      - prefix-reuse
      - cache-write
      - cache-policy
  - id: work
    can: Trace a stored answer, a prefix read and an agent's repeated history into daily generation spend, and account separately for avoided calls.
    scenes:
      - intro
      - accounting-physics
      - two-reuse-paths
      - daily-replay
      - history-loop
      - nightly-receipt
  - id: operations
    can: Choose an eligible Batch workload, recover unfinished requests and verify the historical rates used to price them.
    scenes:
      - batch-deadline
      - batch-recovery
      - trace-integrity
  - id: decision
    can: Compare cost per accepted task, check quality evidence and decide whether a shared balance can cover a cold generation call.
    scenes:
      - output-and-retries
      - budget-quality-gate
      - quality-evidence
      - cold-reservation
      - atomic-settlement
      - wrap
      - fresh-economics
  - id: forecast
    can: Calculate how many evaluation nights can lose their prefix reads before the monthly generation forecast exceeds its budget.
    scenes:
      - intro
      - nightly-receipt
      - budget-quality-gate
      - twelfth-night
