version: 1
lesson: mixed-precision
promise: Locate where a training value changes during rounding, choose a precision policy for that operation, and select the fastest comparable run that meets both quality thresholds.
objectives:
  - id: stored-weight
    can: Predict a rounded update from the two neighbors of a weight and decide where to keep optimizer state.
    scenes:
      - intro
      - grid
      - formats
      - update
  - id: scaled-step
    can: Distinguish forward overflow from backward underflow, choose when to scale, and apply the finite check and clipping in the original gradient units.
    scenes:
      - range-check
      - underflow
      - controller
      - ordering
      - transfer
  - id: precision-recipe
    can: Count the bytes that change and trace how reduction precision, rollout logits, and FP8 scale selection affect results.
    scenes:
      - memory
      - communication
      - policy-mismatch
      - fp8-contract
  - id: controlled-comparison
    can: Check a kernel's partial sums, hold the workload fixed, and rank only runs that meet both quality minimums.
    scenes:
      - earned-transfer
