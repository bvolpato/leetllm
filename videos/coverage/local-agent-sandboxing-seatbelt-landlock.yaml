version: 1
lesson: local-agent-sandboxing-seatbelt-landlock
promise: Decide whether to authorize a local worker by following its requested file to the resource it reaches, identifying who can use saved configuration later, and matching each enforcement claim to an observed operation.
framing: []
objectives:
  - id: rights
    can: Decide whether a launcher covers the required operations, threads and inherited handles. Narrow a write grant without disabling the intended task.
    scenes: [landlock, rights-contract, layer-grants, mount-view, dependency-setup]
  - id: resources
    can: Resolve a directory or link before applying the parent step, and identify the process that would execute a saved task after worker exit.
    scenes: [intro, paths, path-helper-boundary, hooks, delayed-config, platform-profile, fresh-boundary]
  - id: platform
    can: Trace a request through the applicable Linux or Mac controls, authorize a broker request and reply, and say exactly what two observed append results establish.
    scenes: [syscalls, mount-view, seatbelt, platform-profile, broker, broker-reply, verify]
