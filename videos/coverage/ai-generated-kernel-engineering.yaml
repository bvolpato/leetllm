version: 1
lesson: ai-generated-kernel-engineering
promise: Decide whether to run a generated RMSNorm kernel, use the reference for a valid call, or hold a release by checking the row the caller owns and the evidence for the loaded build.
objectives:
  - id: contract
    can: Route a valid view by its width, layout and gradient requirements, and distinguish fallback from a public input error
    scenes:
      - intro
      - dispatch
      - hidden
      - domain-contract
      - library-boundary
      - fresh-promotion
  - id: correctness
    can: Trace a row through storage offsets, a shared RMS scale and separate weights, then check values, tolerances, padding, overflow, ownership and scale relations
    scenes:
      - intro
      - tail
      - hidden
      - epsilon
      - ownership-audit
      - tolerance-policy
      - overflow-oracle
      - fresh-promotion
  - id: execution
    can: Count requested sectors from lane addresses and check shared-memory ordering, resource limits, registration and sanitizer coverage separately
    scenes:
      - address-order
      - library-boundary
      - build-resources
      - safety-tools
  - id: performance
    can: Compare sequential wrapper and kernel costs on a common clock and distinguish logical rates, physical traffic and instruction-appropriate ceilings
    scenes:
      - address-order
      - traffic
      - timing-clocks
      - roofline-model
  - id: evaluation
    can: Use public feedback without consuming acceptance data and interpret benchmark or mutation scores inside
      their methods
    scenes:
      - hidden
      - public-refinement
      - benchmark-boundaries
      - checker-mutations
  - id: promotion
    can: Budget shadow work, trace a changed canary response, recover an in-flight request and verify that the signed release record covers the tested artifact and dispatch
    scenes:
      - promotion
      - shadow-budget
      - canary-evidence
      - receipt-binding
      - fresh-promotion
