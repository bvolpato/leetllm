version: 1
lesson: neural-networks
promise: Build a two-unit lamp circuit, trace a timeout loss back to individual weights,
  and choose a measurement that distinguishes two networks that fit the same examples.
framing: []
objectives:
  - id: compose
    can: Show why one affine cut fails on the four switch settings, construct a working
      pair of ReLU hinges, and choose an interior measurement that separates two fits.
    scenes:
      - puzzle
      - collapse
      - affine-identity
      - hinges
      - approximation
      - approximation-conditions
      - payoff
  - id: trace
    can: Calculate signed neuron contributions, test a weight layout against one request,
      and count the parameters shared by a batch.
    scenes:
      - scorer
      - forward
      - parameters
      - parameter-scale
      - batch
      - transpose
  - id: differentiate
    can: Use the loss slope, saved gate inputs, feature signs, and loss reduction to
      predict an SGD update and check the resulting loss.
    scenes:
      - bounded
      - smooth
      - activation-products
      - residual
      - output-denominator
      - backward
      - saved-values
      - corner-check
      - update
      - earned-gradient-transfer
  - id: evaluate
    can: Repair scaling and overflow failures, predict which routes change at a new
      threshold, and compare scores with observed timeout frequencies.
    scenes:
      - units
      - stable
      - checked-risk-report
