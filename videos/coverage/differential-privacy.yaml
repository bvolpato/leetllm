version: 1
lesson: differential-privacy
promise: Decide whether a support copilot's clipping rule and checkpoint selection meet a customer-level privacy promise and a stated release cap.
framing:
  - intro
objectives:
  - id: bound-one-customer
    can: Remove all of one customer's tickets, check the change in the sum, and repair a per-ticket clip before applying a fixed public divisor.
    scenes: [intro, adjacency, user-aggregate]
  - id: compare-output-events
    can: Check a probability against both directions of the DP inequality and distinguish a membership or extraction test from a distribution guarantee.
    scenes: [definition, attack-evidence, private-mechanisms]
  - id: calibrate-an-update
    can: Clip a gradient, choose sensitivity for removal or replacement, and match Gaussian noise and the accountant to the actual sampling process.
    scenes: [clip, noise, compose, audit]
  - id: interpret-utility
    can: Interpret a clipped fraction, update alignment, and a coordinate-space RMS ratio, then identify what private adapter training protects.
    scenes: [utility, coordinate-noise]
  - id: decide-a-release
    can: Compose conditional Gaussian charges at a common order, compare the converted bound with a cap, and identify which checkpoint or serving inputs reopen private data.
    scenes: [audit, accountant-calculation, earned-transfer]
