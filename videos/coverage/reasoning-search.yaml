version: 1
lesson: reasoning-search
promise: Decide whether to accept a proposed answer, keep searching, or fetch a missing fact. Check the evidence and the cost of the next step.
framing: []
objectives:
  - id: records
    can: Compare a release record with its source, score its fields and action separately, and request a missing observation.
    scenes:
      - policy-decision-record
      - reasoning-artifacts
      - typed-observation-handoff
  - id: vote
    can: Count all five sampled attempts, apply a support threshold, and measure how much extra generation changes accuracy.
    scenes:
      - canonical-answer-vote
      - sampling-cost-ledger
      - votes-and-checks
  - id: search
    can: Replay an arithmetic proposal, account for each input occurrence, and distinguish a pruned branch from an exhausted search.
    scenes:
      - linear-state
      - branch-state
      - arithmetic-controller-contract
      - frontier-control
      - heuristic-pruning
      - budget-and-claims
      - fresh-duplicate-puzzle
  - id: compute
    can: Select a reasoning strategy that meets both service limits, or return no strategy if the eligible region is empty.
    scenes:
      - scratchpad-compute
      - prompt-comparison
      - dependency-and-graph
      - native-reasoning-training
      - verifier-boundaries
      - quality-and-latency-gate
      - choose-the-controller
