version: 1
lesson: gpu-primitives
promise: Choose the GPU primitive that returns the requested output, trace its partial results, and check the arithmetic and synchronization it requires.
objectives:
  - id: ownership
    can: Trace a value from its source lane to its consumer and identify when a shuffle, a block barrier or a later kernel can complete the handoff.
    scenes:
      - pairwise-reduction
      - warp-communication
      - full-warp-contract
      - block-barrier
      - grid-reduction
      - hazard-proof
  - id: prefix
    can: Read both edges of a signed play, join block-local prefixes at the correct score and use ordered prefixes to assign write destinations. Compute segmented sums and the source of a winning value.
    scenes:
      - subject-intro
      - inclusive-scan
      - prefix-contract
      - blelloch
      - scan-work
      - block-offsets
      - lookback
      - selection-contracts
      - transfer
      - fresh-odd-row
  - id: scale-and-evidence
    can: Rescale both the softmax denominator and the weighted output, compare each prefix with a serial reference and distinguish accuracy, repeatability and measured performance.
    scenes:
      - floating-point-order
      - partial-range
      - online-softmax
      - normalizer-output
      - attention-state
      - library-baseline
      - benchmark-evidence
      - transfer
