version: 1
lesson: prompt-optimization
promise: Decide whether to run a prompt search and whether to release its frozen prompt on the intended model, using separate request and forbidden-serve limits.
framing:
  - subject-intro
  - release-decision
objectives:
  - id: program
    can: Score a proposed route and record against a reviewed policy case and identify which teacher steps enter the prompt.
    scenes:
      - program-parts
      - metric
      - local-contract
      - bootstrap
      - optimizer-families
      - release-decision
  - id: search
    can: Choose what to search, group paraphrases by policy, freeze a development winner and interpret its results on fresh cases.
    scenes:
      - data-splits
      - search
      - sealed-test
      - search-configuration
  - id: deliver
    can: Count requests and token overhead, revise a plan to fit its cap, and decide whether results for the bound prompt and model meet the release rule.
    scenes:
      - search-budget
      - engine-requests
      - artifact
      - artifact-safety
      - fresh-budget
      - release-decision
