version: 1
lesson: agent-recovery
promise: Resolve failures by their boundary while preserving authorized operation identity, bounded work and evidence-supported claims.
framing:
  - subject-intro
objectives:
  - id: identity
    can: Distinguish a new proposal, a repeat transport attempt, a committed queue record and observed completion.
    scenes:
      - action-boundary
      - operation-identity
      - commit-boundary
      - replay-contract
      - workflow-world
      - resume-with-evidence
  - id: budget
    can: Compute bounded retry waits, repeated-call progress and cumulative request reservations.
    scenes:
      - retry-clock
      - progress-budget
      - spend-budget
  - id: health
    can: Trace probe slots and generation checks under cancellation and stale completions.
    scenes:
      - circuit-breaker
      - breaker-contract
  - id: claim
    can: Select an admissible fallback or compensation and report its actual recovery outcome.
    scenes:
      - fallback-evidence
      - compensation
      - recovery-transfer
