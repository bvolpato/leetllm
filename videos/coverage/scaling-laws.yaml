version: 1
lesson: scaling-laws
promise: Choose a parameter and token allocation at fixed training compute, check whether the data exists, and decide what evidence would justify the run.
objectives:
  - id: account
    can: Calculate dense training, recomputation and inference work. Distinguish token presentations from distinct data, stored weights and hardware cost.
    scenes:
      - intro
      - budget
      - counting-contract
      - controlled-runs
  - id: allocate
    can: Compare two allocations on the same compute curve, change one fitted coefficient, and use the proportional gain from each resource to predict which split wins.
    scenes:
      - loss
      - tradeoff
      - optimum
      - general-allocation
      - growth
      - historical-frontiers
      - fresh-allocation
  - id: evidence
    can: Use matched proxy runs to fit a surface. Apply a predeclared loss tolerance to an intermediate run and decide whether it advances to throughput and task checks.
    scenes:
      - study-discrepancy
      - frontier-evidence
      - fitting
      - fitted-surface
      - floor-ambiguity
      - mid-scale-gate
      - transfer
  - id: constraints
    can: Check width transfer and architecture-specific costs, then apply the data and model limits to decide how much training compute can be used.
    scenes:
      - width-transfer
      - data-cap
      - data-inventory
      - architecture-aware
      - fresh-allocation
  - id: lifetime
    can: Compare matched-quality candidates below and above their lifetime break-even demand. Count the per-query work for extra generated candidates.
    scenes:
      - lifetime
      - lifetime-equation
      - test-time-budget
      - capability-metrics
