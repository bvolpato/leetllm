version: 1
lesson: prompt-injection
promise: Use a report to answer the reader, decide whether trusted state permits a proposed release, verify the outcome, and measure unsafe effects alongside useful work.
objectives:
  - id: subject-intro
    can: Decide whether the service may apply a proposed traffic change when the report recommends a release and the approval store has no matching grant
    scenes:
      - subject-intro
      - host-policy
  - id: entry-and-objective
    can: Classify the same report passage as direct or indirect from its entry route and identify the requested effect
    scenes:
      - entry-and-objective
  - id: separate-harms
    can: Close each path to a protected effect
    scenes:
      - separate-harms
  - id: trust-labels
    can: Mark where evidence came from
    scenes:
      - trust-labels
  - id: wrapper-characters
    can: Change markup characters without changing authority
    scenes:
      - wrapper-characters
  - id: prompt-vs-capability
    can: Separate a proposed action from the host permission that can execute it
    scenes:
      - prompt-vs-capability
  - id: reader-quarantine
    can: Predict which suite ID the no-tool reader can extract and identify who supplies its source ID
    scenes:
      - reader-quarantine
  - id: typed-evidence
    can: Reject a whole reader record with extra fields and attach host provenance to the accepted record
    scenes:
      - typed-evidence
  - id: schema-falsehood
    can: Reject a schema-valid record whose evidence conflicts with the expected source
    scenes:
      - schema-falsehood
  - id: selector-feedback
    can: Trace whether later tool results can change a committed action selection
    scenes:
      - selector-feedback
  - id: strict-proposal
    can: Validate decoded fields before checking permission
    scenes:
      - strict-proposal
  - id: host-policy
    can: Distinguish a permitted dispatch from a commit by matching the receipt to the operation, candidate, traffic, and new revision
    scenes:
      - host-policy
  - id: approval-bindings
    can: Identify the first failed check when a target is outside policy or differs from an otherwise valid approval
    scenes:
      - approval-bindings
  - id: reserve-and-reconcile
    can: Explain how an empty inbox can accompany either zero or one remote release and use the reserved operation to reconcile a retry
    scenes:
      - reserve-and-reconcile
  - id: protected-sinks
    can: Protect disclosure and state changes
    scenes:
      - protected-sinks
  - id: outbound-contract
    can: Authorize the complete outgoing resource
    scenes:
      - outbound-contract
  - id: canary-buffer
    can: Inspect a complete payload before releasing its bytes
    scenes:
      - canary-buffer
  - id: layered-signals
    can: Deny an unapproved write after a clean detector result and preserve authorized analysis of flagged material
    scenes:
      - layered-signals
  - id: detector-scope
    can: Choose authorization checks independently of the classifier’s narrower label
    scenes:
      - detector-scope
  - id: attack-evaluation
    can: Measure protected effects
    scenes:
      - attack-evaluation
  - id: effect-denominators
    can: Count a trace with two forbidden effects once and use the separate benign-request denominator for false rejection
    scenes:
      - effect-denominators
  - id: uncertainty-gate
    can: Locate the sample size in the zero-count Wilson formula and compare its upper endpoint with the release threshold
    scenes:
      - uncertainty-gate
  - id: support-and-utility
    can: Determine which minimum count or rate vetoes each report even when every report has zero observed unsafe traces
    scenes:
      - support-and-utility
  - id: cache-principal
    can: Construct the private cache key from the authenticated access context
    scenes:
      - cache-principal
  - id: poisoned-memory
    can: Carry provenance through a later turn
    scenes:
      - poisoned-memory
  - id: review-and-retention
    can: Protect the reviewer and the incident record
    scenes:
      - review-and-retention
  - id: transfer
    can: Let evidence inform the model safely
    scenes:
      - transfer
  - id: fresh-authority
    can: Predict local writes for a different operation, a matching one, and its replay, then identify the summary the caller can still receive
    scenes:
      - fresh-authority
sections:
  - heading: Trace the attack path
    status: taught
    scenes:
      - entry-and-objective
      - separate-harms
  - heading: Use prompt structure as a cue. Enforce permission in code
    status: taught
    scenes:
      - trust-labels
      - wrapper-characters
      - prompt-vs-capability
  - heading: Quarantine raw content before tools
    status: taught
    note: The suite extractor follows the reference edition. The three-field crossing uses the reader edition’s quarantined-evidence.py example and its host-supplied report-C17-R42 source.
    scenes:
      - reader-quarantine
      - typed-evidence
      - schema-falsehood
      - selector-feedback
  - heading: Make model output a typed proposal
    status: taught
    scenes:
      - strict-proposal
      - prompt-vs-capability
  - heading: Put authorization outside the model
    status: taught
    note: The article's single-threaded mock uses APR-9 and a 10% target. The film uses a separate 25% release trace to check a receipt and two hypothetical delivery histories to explain recovery.
    scenes:
      - host-policy
      - approval-bindings
      - reserve-and-reconcile
      - fresh-authority
  - heading: Block disclosure and exfiltration paths
    status: taught
    scenes:
      - protected-sinks
      - outbound-contract
      - canary-buffer
  - heading: Use detection as a signal
    status: taught
    scenes:
      - layered-signals
      - detector-scope
  - heading: Measure policy effects and inspect refusal quality
    status: taught
    note: The two-trace exercise illustrates the numerator. The larger rates and Wilson intervals use the reader edition’s supplied counts. The thresholds and five label counts come from the reference edition.
    scenes:
      - attack-evaluation
      - effect-denominators
      - uncertainty-gate
      - support-and-utility
  - heading: "Continuity failure: caches and shared sessions"
    status: taught
    scenes:
      - cache-principal
      - poisoned-memory
      - fresh-authority
  - heading: Review the live boundary
    status: taught
    scenes:
      - review-and-retention
      - fresh-authority
  - heading: What should survive a successful injection?
    status: taught
    note: The film applies the article’s one-use approval rule to a fresh C26 staging request. The same read permission supports a useful answer when the operation check denies the write.
    scenes:
      - transfer
      - fresh-authority
quiz:
