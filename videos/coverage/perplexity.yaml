version: 1
lesson: perplexity
promise: Decide which model spent less surprise on the same held-out text. Use the scored targets, context and units to justify the comparison, and use task checks to judge the returned answer.
framing:
  - covered-word
objectives:
  - id: observed-loss
    can: Trace the observed token’s probability into its loss, then calculate mean NLL and the equivalent choice count.
    scenes:
      - intro
      - surprise
      - mean
      - loss-scale
      - fresh-case
  - id: numeric-objective
    can: Diagnose numerical failure, masked conditioning and missing target-likelihood access.
    scenes:
      - stable
      - objective-boundary
      - report
  - id: bookkeeping
    can: Count valid targets after shifting, combine loss totals across windows, and choose a common byte denominator when tokenizers differ.
    scenes:
      - aggregation
      - fresh-case
      - tokenizers
      - normalization
      - windows
      - shift-count
  - id: evidence
    can: Reject changed protocols or leaked evidence and apply independent task requirements.
    scenes:
      - protocol
      - contamination
      - behavior
      - report
      - export-job
