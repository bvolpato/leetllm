version: 1
lesson: deep-dive-skyrl
promise: Decide when a waiting prompt can start sampling by following a SQL repair from its action tokens through queue admission, sampler synchronization and training recovery.
objectives:
  - id: intro
    can: Repair a query from its database observation and identify the four sampled token positions in the normalized response.
    scenes:
      - intro
  - id: version-contract
    can: Distinguish a pinned CPU contract check from installed training and transport evidence.
    scenes:
      - version-contract
  - id: project-lineage
    can: Relate the project lineage to interface responsibilities and separate source licensing from external
      assets.
    scenes:
      - project-lineage
  - id: seams-record
    can: Use a customer exactly on the threshold to distinguish successful execution from a correct result and locate that check at the environment boundary.
    scenes:
      - seams-record
  - id: generator-runtime
    can: Repair reordered or incomplete generator returns without separating aligned fields.
    scenes:
      - generator-runtime
  - id: masks
    can: Compute the change caused by perturbing an action score versus an observation score.
    scenes:
      - masks
  - id: token-boundary
    can: Select the four action scores in a new six-position response before checking finiteness or calculating mean loss.
    scenes:
      - token-boundary
  - id: reward-endpoints
    can: Predict reward placement under truncation, appended EOS and the custom-template branch.
    scenes:
      - reward-endpoints
  - id: trainer-pass
    can: Reconstruct the regular trainer order and locate a missing field before its consumer.
    scenes:
      - trainer-pass
  - id: group
    can: Predict mean-centered reward signals and the equal-reward limit.
    scenes:
      - group
  - id: policy-ratio
    can: Calculate a signed clipped surrogate and distinguish it from a hard parameter constraint.
    scenes:
      - policy-ratio
  - id: reward-normalization
    can: Compute centered rewards and identify what an equal-reward group does and does not imply.
    scenes:
      - reward-normalization
  - id: schedules
    can: Locate synchronization and overlap in supplied generation/training schedules.
    scenes:
      - schedules
  - id: schedule-comparison
    can: Compare the barriers and provenance obligations of synchronous, pipelined and fully asynchronous
      schedules.
    scenes:
      - schedule-comparison
  - id: admission-math
    can: Derive aggregate outstanding work and admission capacity from cumulative counters.
    scenes:
      - admission-math
  - id: capacity
    can: Follow group L through four updates and decide whether its scheduling lag forces the trainer to drop it.
    scenes:
      - capacity
  - id: probability-provenance
    can: Find the denominator for a retained action when another runtime replays that action at the same nominal weights.
    scenes:
      - probability-provenance
  - id: filter
    can: Reclassify filtered work without leaking producer capacity.
    scenes:
      - filter
  - id: zero-variance-policy
    can: Apply live-mask reward filtering and conserve submitted, accepted, filtered and running counts.
    scenes:
      - zero-variance-policy
  - id: epoch-exhaustion
    can: Predict sample-full-batch exhaustion and the trained/filtered resume accounting.
    scenes:
      - epoch-exhaustion
  - id: config-contract
    can: Diagnose pinned fully asynchronous configuration failures before changing trainer code.
    scenes:
      - config-contract
  - id: routing-session
    can: Trace session-sticky generation separately from all-replica control operations.
    scenes:
      - routing-session
  - id: transfer-stages
    can: Distinguish transfer initialization, chunk delivery, completion and fleet acceptance.
    scenes:
      - transfer-stages
  - id: replicas
    can: Identify the missing sampler evidence that keeps the resume gate closed.
    scenes:
      - replicas
  - id: cache-recompute
    can: Predict what cache clearing and cache salts can change in an in-flight trajectory.
    scenes:
      - cache-recompute
  - id: tinker-futures
    can: Trace accumulated gradients, optimizer completion and the explicit sampler synchronization boundary.
    scenes:
      - tinker-futures
  - id: loss-conversion
    can: Inspect backend field conversion and reject a malformed critic batch without inferring recipe parity.
    scenes:
      - loss-conversion
  - id: research-snapshot
    can: Interpret the reported dispatcher and learning results under their actual experimental conditions.
    scenes:
      - research-snapshot
  - id: source-diagnosis
    can: Choose a bounded diagnostic intervention from a supplied reward, alignment, capacity or synchronization
      failure.
    scenes:
      - source-diagnosis
  - id: operator-gates
    can: Build a run-admission packet and identify the missing evidence that should stop the run.
    scenes:
      - operator-gates
  - id: synthesis
    can: Separate a sampler export from a full training-resume packet.
    scenes:
      - synthesis
  - id: checkpoint-state
    can: Compute a full-state resume and distinguish missing momentum from a wrong next batch.
    scenes:
      - checkpoint-state
  - id: earned-handoff
    can: Calculate whether a new group fits, identify the sampler receipt that keeps it waiting, and account for the slot and worker it takes on dispatch.
    scenes:
      - earned-handoff
