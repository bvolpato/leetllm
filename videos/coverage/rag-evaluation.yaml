version: 1
lesson: rag-evaluation
promise: Use the recorded passages to decide whether to fix retrieval, selection, a claim, its citation, or a missing requirement. Test the repaired answer against the release suite.
framing: []
objectives:
  - id: subject-intro
    can: Use the library notice to correct the promised receipt day while keeping the supported return instruction
    scenes:
      - subject-intro
  - id: evidence-path
    can: Count required notices in search results and in the prompt, then count useful notices among all selected notices
    scenes:
      - evidence-path
  - id: atomic-claims
    can: Preserve conditions when extracting atomic claims
    scenes:
      - atomic-claims
  - id: support-graph
    can: Distinguish entailment, contradiction and unestablished claims
    scenes:
      - support-graph
  - id: citation-binding
    can: Follow a closure claim’s footnote, repair the attachment, and identify which of the three claim checks changes
    scenes:
      - citation-binding
  - id: omitted-point
    can: Compute supported completeness with a distinct denominator
    scenes:
      - omitted-point
  - id: aggregation
    can: Compare claim and answer aggregation units
    scenes:
      - aggregation
  - id: transfer
    can: Locate the first missing receipt notice and explain how the same refusal changes when the notice reaches the prompt
    scenes:
      - transfer
  - id: policy-replay
    can: Replay a versioned deployment rule with its real conditions
    scenes:
      - policy-replay
  - id: trace-integrity
    can: Reject forbidden or altered evidence receipts
    scenes:
      - trace-integrity
  - id: rank-admission
    can: Compute recall and precision at distinct boundaries
    scenes:
      - rank-admission
  - id: policy-ledger
    can: Trace repeated approval claims to one requirement and repair the missing rollback instruction
    scenes:
      - policy-ledger
  - id: review-boundary
    can: Refer unfamiliar wording for review and read the first failed check in the Python evaluator’s output
    scenes:
      - review-boundary
  - id: abstention-matrix
    can: Distinguish bounded abstention from evidence failure
    scenes:
      - abstention-matrix
  - id: regression-diagnosis
    can: Validate controlled negative cases without inventing production evidence
    scenes:
      - regression-diagnosis
  - id: slice-release
    can: Apply required-slice count rules with their limits
    scenes:
      - slice-release
  - id: judge-calibration
    can: Compare a judge’s verdicts with held-out human labels and distinguish a false acceptance, false rejection, and missing verdict
    scenes:
      - judge-calibration
  - id: release-transfer
    can: Identify what the July revision leaves uncovered and decide separately whether Maya’s answer passes and whether the build can ship
    scenes:
      - release-transfer
