version: 1
lesson: context-packing
promise: Choose which evidence can answer a rollback question within its token budget, calculate what the model must retain and read, and test whether it can use the evidence at deployment lengths.
framing: []
objectives:
  - id: request-evidence
    can: Reserve the reply, keep complete exchanges, check the approver against the cited decision, and replace the note with a sourced reason when the question changes.
    scenes:
      - intro
      - budget
      - complete-turns
      - overflow
      - compaction
      - synthesis
      - your-turn
  - id: evidence-population
    can: Choose a full packet, a verified retrieved excerpt, or an exact aggregate according to which sources the answer requires.
    scenes: [placement, exact-counts, evidence-route]
  - id: derive-costs
    can: Derive full versus local attention work and raw cache bytes across heads, mixed layers, precision
      and concurrent sequences.
    scenes:
      - cost-length
      - cache-shape
      - mixed-layers
      - local-visibility
      - cache-execution
      - distributed-context
  - id: extend-and-evaluate
    can: Compute an interpolated coordinate, diagnose inconsistent cached rotations, and reject an aggregate
      that hides a failed context slice.
    scenes:
      - position-dials
      - basis-consistency
      - placement
      - release-slices
