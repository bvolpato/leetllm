version: 1
lesson: embeddings
promise: Diagnose why two support tickets retrieve the same guide by tracing the stored row,
  the visible context and the query and document vectors used for ranking.
objectives:
  - id: lookup
    can: Predict whether two messages can receive different rankings when both send only the
      same token's lookup row to a fixed index
    scenes:
      - intro
      - lookup
      - table-contract
      - article-context
  - id: counts
    can: Compute PPMI and interpret a fitted truncated SVD under explicit toy limitations
    scenes:
      - count-ppmi
      - factorization
      - neighbors
  - id: objectives
    can: Build predictive pairs, add the signed output-row contributions to a center gradient
      and compute a weighted GloVe residual
    scenes:
      - predictive-window
      - negative-step
      - shifted-pmi
      - glove-fit
  - id: subword
    can: Compose unknown spelling components with the exact occurrence and averaging contract
    scenes:
      - subword-components
  - id: context
    can: Calculate an occurrence or layer mix and choose a position that can read the clue needed
      to distinguish two messages
    scenes:
      - context
      - article-context
      - elmo-layers
      - visibility-test
      - contrast
      - transfer
  - id: geometry
    can: Distinguish dot product from cosine when a vector changes length, compute a masked mean
      and diagnose zero-length or common-direction cosine failures
    scenes:
      - geometry
      - pooling
      - limits
      - anisotropy-check
  - id: compatibility
    can: Compare two guide scores for each ticket before and after an index migration, identify
      a correct result obtained with mismatched encoders and choose a compatible pair to test
    scenes:
      - space-contract
      - fresh-representation
