version: 1
lesson: gpu-failure-operations
promise: Use a GPU incident receipt to choose the smallest repair that protects other work, then decide when
  the router may send traffic back.
framing: []
objectives:
  - id: memory
    can: Reconcile live, reserved, outside and free memory. Compare a captured request with individual blocks and
      with the live workload under the device capacity limit.
    scenes:
      - memory-contract
      - fragments
      - ownership
      - analyzer-construction
      - event-construction
      - earned-gpu-transfer
  - id: history
    can: Bind evidence to a process and a time window, account for overwritten events, and finish bounded capture
      before required containment.
    scenes:
      - receipt-contract
      - history-construction
  - id: fault
    can: Use the earliest fault, exact CUDA result and independent device findings to choose a process or platform
      investigation.
    scenes:
      - fault-construction
      - async-construction
      - analyzer-construction
      - mixed-construction
      - earned-gpu-transfer
  - id: operations
    can: Keep existing work with its owner, distinguish device health from eviction, and preserve a quarantine
      record across new observations.
    scenes:
      - intro
      - contain
      - containment-contract
      - automation-contract
  - id: return-to-service
    can: Test the failed allocation and peer path, interpret diagnostic coverage, and release a small traffic
      share only after fresh gates and owner approval.
    scenes:
      - diagnostics
      - diagnostic-plan
      - soak
      - canary-construction
      - readmit
