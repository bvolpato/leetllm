version: 1
lesson: state-space-models
promise: Use an exact field lookup and a cache budget to choose a model to benchmark, then trace the state updates and buffers behind that decision.
framing:
  - intro
objectives:
  - id: read-history
    can: Construct two files that leave the same scalar state, score the returned retry limits, and distinguish a reachable position from a correct answer.
    scenes:
      - intro
      - collision
      - release-gate
  - id: ssm-mechanisms
    can: Compute the carry, write and readout separately, then use fixed lag weights, ordered affine prefixes or chunk boundaries to recover the outputs.
    scenes:
      - recurrence
      - kernel
      - delta
      - selection
      - scan
      - held-input
      - structured-block
      - prefix-construction
      - ssd-and-refinement
  - id: resume-stream
    can: Identify the first incorrect suffix write and choose the complete checkpoint from which a request can resume.
    scenes:
      - checkpoint
      - complete-buffers
  - id: choose-candidate
    can: Compare prefill and decode costs, count the hybrid cache, and specify the exact retrieval and serving measurements a candidate must pass.
    scenes:
      - earned-transfer
      - release-gate
