version: 1
lesson: capstone-product-ranking-recommendation
promise: Build one complete ranking experiment that preserves hard eligibility,computes
  fixed-universe metrics and actual pairwise training,keeps temporal availability and feedback
  assumptions explicit,and binds proposed response and later outcomes to a bounded experiment
  receipt.
objectives:
  - id: select-and-order
    can: Enforce current eligibility,compute retrieval and ordering metrics,and construct a scoped
      relevance/diversity or seller constraint.
    scenes:
      - intro
      - funnel-contract
      - eligibility
      - slate-recheck
      - ordering
      - metric-contracts
      - recall
      - offline-gates
      - probability-value
      - fresh-ranking
  - id: fit-with-time
    can: Derive the signed pairwise gradient and actual nine-pair update,then select the real synthetic
      fit using grouped time and label-availability windows.
    scenes:
      - pairwise
      - pairwise-objective
      - training-matrix
      - time
      - temporal-protocol
      - trained-model
  - id: preserve-feedback
    can: Separate assignment,selection and examination probabilities;earn propensity weighting;retain
      response/event identity and interpret guards within the collected evidence.
    scenes:
      - exposure
      - click-model
      - propensity-contract
      - synthesis
      - response-lineage
      - outcome-join
      - experiment-contract
      - online-guardrails
      - receipt-boundary
