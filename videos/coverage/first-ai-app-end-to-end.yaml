version: 1
lesson: first-ai-app-end-to-end
promise: Follow Luna's click through the local app and decide what the page can report from the response it actually receives.
framing:
  - opening
objectives:
  - id: complete-app
    can: Run the loopback app and follow an account from the form through the HTTP route to its committed SQLite row.
    scenes:
      - assemble-app
      - input-contract
      - trace-lifecycle
      - http-durability
      - browser-outcome
  - id: check-candidate
    can: Use P-7, the server-owned age and stale flag, and the exact evidence list to check a provider's candidate.
    scenes:
      - input-contract
      - policy-check
      - evaluation
      - earned-transfer
  - id: diagnose-attempt
    can: Use a second connection and a provider call count to distinguish a rejected insert, a rejected update and a recorded provider failure.
    scenes:
      - trace-lifecycle
      - http-durability
      - failure-boundaries
      - failure-contract
  - id: interpret-receipt
    can: Choose a browser message after a checked decision, a storage error or a lost reply and explain what submitting again would do.
    scenes:
      - opening
      - browser-outcome
      - failure-boundaries
      - browser-authority
      - earned-transfer
  - id: test-before-deployment
    can: Choose a test for application behavior, hosted-provider quality, network deadlines or storage recovery.
    scenes:
      - failure-contract
      - evaluation
sections:
  - heading: Run the smallest complete app
    status: taught
    scenes:
      - assemble-app
      - http-durability
  - heading: Validate input before uncertain work
    status: taught
    scenes:
      - input-contract
      - evaluation
  - heading: A well-shaped answer can still be wrong
    status: taught
    scenes:
      - policy-check
      - earned-transfer
  - heading: Commit a trace before calling the provider
    status: taught
    scenes:
      - trace-lifecycle
      - http-durability
  - heading: Test the actual HTTP path
    status: taught
    note: The observing provider in test-real-route.py reads during the call. The two databases in test-storage-failures.py reject different writes for the same POST.
    scenes:
      - http-durability
      - failure-boundaries
      - evaluation
  - heading: Record failure codes and protect raw error text
    status: taught
    scenes:
      - failure-boundaries
      - failure-contract
  - heading: Trusted facts ground the decision
    status: taught
    note: The transfer case holds the dictionary candidate fixed and applies verify_p7 to two stale records on either side of the inclusive threshold.
    scenes:
      - policy-check
      - browser-authority
      - earned-transfer
  - heading: Show the outcome without performing an action
    status: taught
    scenes:
      - browser-outcome
      - browser-authority
      - earned-transfer
  - heading: Separate health from decision quality
    status: taught
    scenes:
      - evaluation
  - heading: Know what remains before deployment
    status: taught
    scenes:
      - assemble-app
      - browser-authority
      - evaluation
  - heading: Check your understanding
    status: taught
    scenes:
      - earned-transfer
