version: 1
lesson: deep-dive-ray
promise: Decide which work to run again after a Ray failure by tracing the result handle to its owner, checking which process answered, and looking up the original batch receipt.
objectives:
  - id: intro
    can: Predict the replacement ledger's count while the driver still owns the three finished results
    scenes:
      - intro
  - id: primitive-contract
    can: Identify task invocation, immutable result, reference and mutable actor state
    scenes:
      - primitive-contract
  - id: dependencies
    can: Use call durations to distinguish total worker time from the time until the last result arrives
    scenes:
      - intro
      - dependencies
  - id: argument-inspection
    can: Predict top-level resolution and nested-handle contents for a changed argument structure
    scenes:
      - argument-inspection
  - id: local-lab
    can: Separate actual local checks from unexecuted distributed failure claims
    scenes:
      - local-lab
  - id: scheduler-owners
    can: Trace execution, actor placement and logical resource admission separately
    scenes:
      - scheduler-owners
  - id: actor-resource
    can: Compute remaining task capacity from explicit lifetime actor reservations
    scenes:
      - actor-resource
  - id: references
    can: Separate object-owner metadata from stored payload copies
    scenes:
      - references
  - id: lost-result
    can: Choose between fetching a surviving copy, replaying its task, and submitting new work when the original owner is gone
    scenes:
      - lost-result
  - id: memory-lifetime
    can: Account separately for a shared array pinned by a view, unrelated heap data, and an object eligible for disk spill
    scenes:
      - memory-lifetime
  - id: placement
    can: Predict which GPUs a placement group reserves when its four workers must share one node
    scenes:
      - placement
  - id: bundle-membership
    can: Apply bundle membership, four strategies and partial-failure scope
    scenes:
      - bundle-membership
  - id: window
    can: Decide when a fourth document can enter a three-slot window by counting submitted results the sink has yet to consume
    scenes:
      - window
  - id: granularity-pressure
    can: Bound unconsumed work and distinguish count, byte and task-granularity costs
    scenes:
      - granularity-pressure
  - id: restart
    can: Reject a stale poll by PID and distinguish a fresh constructor count from a restored count
    scenes:
      - restart
  - id: durable-restore
    can: Return the original batch receipt after another caller has advanced the durable count
    scenes:
      - durable-restore
  - id: retry
    can: Compare committed count changes for a blind retry and a retry with an atomic batch receipt
    scenes:
      - retry
  - id: retry-controls
    can: Calculate attempt bounds and separate method replay from process restart
    scenes:
      - retry-controls
  - id: library-owners
    can: Assign Data, Train, Tune, RLlib and Serve responsibilities without expanding their guarantees
    scenes:
      - library-owners
  - id: synthesis
    can: Tell when a routed request is still waiting for an engine cache slot and identify who admits it
    scenes:
      - synthesis
  - id: engine-boundary
    can: Compute standard TP×PP placement and distinguish replica route from engine admission
    scenes:
      - engine-boundary
  - id: gcs-recovery
    can: Separate recoverable GCS metadata from actor process and durable application state
    scenes:
      - gcs-recovery
  - id: failure-evidence
    can: Design distinct evidence for worker, owner, node and control-plane failures
    scenes:
      - failure-evidence
  - id: source-history
    can: Locate the relevant pinned source and distinguish project governance, history and licenses
    scenes:
      - source-history
  - id: fresh-owner
    can: Choose a new task submission for a dead owner's handle and reuse the stored reply for an already counted batch
    scenes:
      - fresh-owner
