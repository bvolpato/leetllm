version: 1
lesson: test-time-compute
promise: Decide which draft the evidence supports, when another attempt earns its cost, and which branch
  caches can be released within a serving budget.
framing: []
objectives:
  - id: intro
    can: Check a first draft against the room it describes and identify the omitted chairs
    scenes:
      - intro
  - id: train-time-axis
    can: Calculate the rough dense training budget and separate stored from active parameters
    scenes:
      - train-time-axis
  - id: provider-usage
    can: Read inclusive or separate token counts and bill each generated token once
    scenes:
      - provider-usage
  - id: effort-cutoff
    can: Trace an output cutoff, completion state and correctness check separately
    scenes:
      - effort-cutoff
  - id: opaque-continuation
    can: Retain the structured continuation state required by the chosen provider contract
    scenes:
      - opaque-continuation
  - id: candidates
    can: Apply a vote and an exact check to the same drafts and handle a set with no matching answer
    scenes:
      - candidates
      - selector
  - id: coverage
    can: Calculate how often a pool contains a correct answer and how much of that share survives selection
    scenes:
      - coverage
  - id: per-prompt-distribution
    can: Average per-prompt coverage and diagnose changed distributions
    scenes:
      - per-prompt-distribution
  - id: policy-training
    can: Evaluate a training objective under the actual sampling and selection policy
    scenes:
      - policy-training
  - id: selector
    can: Diagnose a score increase that loses selected correctness
    scenes:
      - selector
  - id: process-targets
    can: Compute local validity, any-success and fraction-success labels without conflating them
    scenes:
      - process-targets
  - id: revision
    can: Charge the revision that reveals a plateau and return the earlier draft that passed the room check
    scenes:
      - revision
  - id: search-completion
    can: Keep active prefixes separate from completed answers at budget exhaustion
    scenes:
      - search-completion
  - id: search-bound
    can: Apply the same next step under minimum and latest-step scoring to decide when search can stop
    scenes:
      - search-bound
  - id: pruning
    can: Count generated steps and scoring calls under reliable or false pruning
    scenes:
      - pruning
  - id: r1-zero
    can: Trace the base-to-RL recipe and its actual rule-based reward scope
    scenes:
      - r1-zero
  - id: r1-pipeline
    can: Separate the R1 data-producing checkpoint from the second-SFT weight start
    scenes:
      - r1-pipeline
  - id: budget
    can: Choose the most accurate tested budget and repeat the choice when only the latency limit changes
    scenes:
      - budget
  - id: scaling-evidence
    can: Interpret empirical scaling studies within their interventions and compute denominator
    scenes:
      - scaling-evidence
  - id: router-feasible
    can: Filter by independent quality and service gates before minimizing tested cost
    scenes:
      - router-feasible
  - id: memory
    can: Count one shared prompt and separately retained continuations
    scenes:
      - memory
  - id: memory-geometries
    can: Convert full-attention KV geometry and retained owners into raw byte payload
    scenes:
      - memory-geometries
  - id: hidden-ttft
    can: Calculate the first-visible-token delay and distinguish goodput from offered load
    scenes:
      - hidden-ttft
  - id: work-ledger
    can: Conserve paid generation and scoring work when retained caches are released
    scenes:
      - work-ledger
  - id: distill-benchmark
    can: Read historical distilled-model results under their sampling protocol
    scenes:
      - distill-benchmark
  - id: distill-boundary
    can: Distinguish accepted trace information from verification and search capabilities
    scenes:
      - distill-boundary
  - id: fresh-branch-repair
    can: Check the original position count and find the smallest number of private caches to release while keeping the checked answer and all spent work
    scenes:
      - fresh-branch-repair
