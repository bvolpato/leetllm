    can: Find source responsibilities for a concrete operation
    scenes:
      - source-tour
  - id: objective-11
    can: Choose a measurement from the system traffic shape
    scenes:
      - system-shapes
      - receipt
  - id: objective-12
    can: Convert benchmark units and separate correctness from tail timing
    scenes:
      - receipt
      - benchmark-contract
  - id: objective-13
    can: Compute the actual in-place shard offset
    scenes:
      - inplace-offset
  - id: objective-14
    can: Find the first differing rank receipt or readiness failure
    scenes:
      - agreement
      - diagnostic-evidence
      - synthesis
  - id: objective-15
    can: Apply versioned MIG and encryption boundaries
    scenes:
      - platform-scope
  - id: objective-16
    can: Bind source/license/contribution claims to their exact evidence
    scenes:
      - project-evidence
  - id: objective-17
    can: Identify the first premature input read and place the shard reader at the recorded write completion in a repaired replay
    scenes:
      - fresh-first-event
