      - spill-workload
  - heading: Keep an artifact manifest
    status: taught
    scenes:
      - identity
      - manifest-contract
  - heading: JIT is part of request latency
    status: taught
    scenes:
      - loader
      - request-clock
    note: The example holds application cache publication at 2 ms in both paths. Its two bars
      isolate the 60 ms PTX compilation phase on a common clock.
  - heading: Eight ranks, two different cache questions
    status: taught
    scenes:
      - publication
      - cache-cooperation
    note: A reader compares the SHA-256 digest of the candidate kernel bytes with the digest in
      its metadata. Replacing the kernel while keeping the previous metadata breaks the match.
  - heading: Same kernel, different unit of thought
    status: taught
    scenes:
