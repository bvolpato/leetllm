version: 1
lesson: gpu-compilers-kernel-languages
promise: Use the last successful step of a vector addition to choose what to inspect when an image
  fails to load, a first request is slow, or a kernel accesses the wrong output slot.
objectives:
  - id: trace-artifacts
    can: Trace a value from source into a target cubin, distinguish a failed image selection from a
      bad store, and choose the next artifact or test for each failure.
    scenes:
      - intro
      - artifacts
      - host-device-package
      - captured-native
      - actual-loader-cases
      - triton-lowering
      - first-failing-boundary
  - id: derive-resources
    can: Round register demand per warp, fit whole blocks into the SM, and distinguish that capacity
      from spill requests and measured execution time.
    scenes:
      - register-lifetimes
      - registers
      - spill-workload
  - id: separate-first-use
    can: Identify which work a native image removes from a cold request and set a separate timer
      around the warmed specialization.
    scenes:
      - loader
      - actual-loader-cases
      - request-clock
  - id: preserve-contract
    can: Predict cache reuse when an included header changes and check that published bytes and
      metadata belong to the same build.
    scenes:
      - identity
      - manifest-contract
      - publication
      - cache-cooperation
  - id: check-output-addresses
    can: Choose a kernel language that exposes the required ownership, enumerate the addresses its
      guard admits, and test the rebuilt kernel on a partial block.
    scenes:
      - ownership
      - triton-lowering
      - ownership-boundaries
      - control-surfaces
      - first-failing-boundary
sections:
  - heading: One addition, several representations
    status: taught
    scenes:
      - intro
      - artifacts
      - host-device-package
      - captured-native
  - heading: "`nvcc` packages host code with architecture-specific device images"
