  - heading: Register pressure, occupancy cliffs, and spilling
    status: taught
    scenes:
      - register-lifetimes
      - registers
    note: In the stated model, 33 registers per thread open a fifth allocation unit. A seventh block
      exceeds the register budget. At 40 registers per thread the same six blocks still fit.
  - heading: Spills change the memory workload
    status: taught
    scenes:
      - spill-workload
  - heading: Parsing `ptxas -v` reports
    status: taught
    scenes:
