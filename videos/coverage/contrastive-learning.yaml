version: 1
lesson: contrastive-learning
promise: Derive the actual contrastive comparison,trace pooling and shared gradients,audit positives
  and mined competitors,and deploy a format-bound,measured retrieval pipeline with explicit
  late-interaction,prefix and shortlist contracts.
objectives:
  - id: derive-comparison
    can: Compute masked pooled vectors,normalized similarities,stable InfoNCE/triplet losses and their
      score-gradient consequences.
    scenes:
      - order-collision
      - pooling-tensor
      - scores
      - objective
      - loss-numerics
      - triplet-margin
      - temperature-gradient
      - geometry
  - id: audit-supervision
    can: Distinguish NLI/dropout relations,negative pools and multi-positive aggregations,then repair a
      verified false-negative or bad teacher target.
    scenes:
      - alignment-uniformity
      - pair-supervision
      - dropout-views
      - negatives
      - batch-identity
      - false-negatives
      - multiple-positives
      - mining-loop
      - teacher-margin
  - id: serve-and-evaluate
    can: Compute late-interaction scores and raw storage,validate formatting and shortening
      contracts,and decide retrieval release from fixed recall,ranking and latency gates.
    scenes:
      - architectures
      - maxsim-readout
      - task-format
      - prefix-failure
      - nested-loss
      - retrieval
      - shortlist-budget
      - evaluation-scope
      - release-metrics
      - transfer
      - fresh-embedding
