version: 1
lesson: training-loop
promise: Follow two tickets through backward and an SGD step. Use the stored gradient and the change in route scores to decide where to repair an update. Check the training objective, validation choice, and saved state before trusting a longer run.
framing: []
objectives:
  - id: step
    can: Check the input and target contract, derive one weight gradient, and use a held-out ticket to tell how clearing the buffer changes an SGD step.
    scenes:
      - intro
      - tensors
      - loss-contract
      - scores
      - phases
      - none-and-momentum
      - accumulation
      - transfer
      - fresh-stale-gradient
  - id: measurement
    can: Weight each microbatch by its effective denominator, judge a fit against the model's attainable loss, and choose a checkpoint on held-out data.
    scenes:
      - microbatch-denominators
      - batching
      - fit-batch
      - layer-modes
      - validation
      - bigram-state
      - bigram-floor
      - bigram-selection
  - id: state
    can: Copy the chosen weights, verify a restored optimizer against the next uninterrupted update, and distinguish atomic checkpoint visibility from durability.
    scenes:
      - validation
      - resumption-state
      - atomic-checkpoint
      - run-receipt
  - id: execution
    can: Find the first nonfinite value, check loss and gradient separately, and apply clipping in unscaled units. Identify which inference and compilation checks a run exercised.
    scenes:
      - numerical-triage
      - global-clipping
      - inference-feature-boundary
      - amp-policy
      - scale-and-step
      - compile-contract
  - id: reader-bigram
    can: Derive the bigram update from its target, compute the uniform loss and attainable floor, and use mean validation loss per character pair to choose between saved tables.
    scenes:
      - bigram-state
      - bigram-floor
      - bigram-selection
      - run-receipt
