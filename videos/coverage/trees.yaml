version: 1
lesson: trees
promise: Trace a review score through a tree, a forest and a boosting update, then use the costs and queue load on later requests to choose a routing cutoff.
framing: []
objectives:
  - id: intro
    can: Move a single ambiguity cut to catch R3 and identify the routine requests that enter the queue with it.
    scenes:
      - intro
  - id: geometry-limits
    can: Predict how axis-aligned cuts and monotonic transforms route new points.
    scenes:
      - geometry-limits
  - id: impurity
    can: Compute leaf impurity from label proportions.
    scenes:
      - impurity
  - id: criteria-compare
    can: Compare Gini, entropy and regression variance reductions.
    scenes:
      - criteria-compare
  - id: search
    can: Select a feature threshold using weighted child impurity.
    scenes:
      - search
  - id: depth
    can: Diagnose why perfect training fit can fail on new rows.
    scenes:
      - depth
  - id: forest
    can: Use each tree's bootstrap membership to compute both the full forest score and the out-of-bag score for R3.
    scenes:
      - forest
  - id: boosting
    can: Average residuals in a leaf, scale its correction and compute the residual that the next tree must fit.
    scenes:
      - boosting
  - id: classification
    can: Divide a leaf's residual sum by its curvature sum, scale the logit update and locate its probability relative to the review cutoff.
    scenes:
      - classification
  - id: evaluate
    can: Trace two policies' validation bills back to individual requests, compare queue loads and measure the cost change from permuting one feature.
    scenes:
      - evaluate
  - id: importance-explanation
    can: Reconstruct a local score while separating attribution from correctness.
    scenes:
      - importance-explanation
  - id: missing-contract
    can: Specify missing-value semantics and distinguish bias from fitting error.
    scenes:
      - missing-contract
  - id: transfer
    can: Reprice the same validation errors, choose between two cutoffs and route a fresh request that lands exactly on the frozen feature cut.
    scenes:
      - transfer
