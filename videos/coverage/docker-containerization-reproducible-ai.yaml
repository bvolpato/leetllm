version: 1
lesson: docker-containerization-reproducible-ai
promise: When two runs of the same scorer disagree, trace each run to the file it read and decide
  whether to repair the host input, rebuild the image, or test the deployment artifact.
objectives:
  - id: place-inputs
    can: Decide which inputs to copy, install, or mount. Check a runtime dependency by retrying its
      import. Use the builder's cache and Dockerfile order to explain when a source edit can reuse
      an installation. Identify the step that needs a credential and when it can read it.
    scenes:
      - runtime-contract
      - context
      - stages
      - stage-inheritance
      - dependency-artifacts
      - cache
      - failure-map
      - secrets
      - credential-exposure
  - id: prove-runtime
    can: Identify the Engine's kernel, read the process UID and GID, and trace the scorer's file
      lookup through a bind mount. Repair a host input and rerun the same image.
    scenes:
      - opening
      - runtime-contract
      - platform-identity
      - runtime
      - permission-boundary
      - mounts
      - mount-diagnostics
      - storage
      - gpu
      - gpu-contracts
      - fresh-container
  - id: compare-reports
    can: Apply the integer threshold, compare a report with its fixed reference, and inspect a
      differing fixture row before choosing which copy to repair.
    scenes:
      - evaluation
      - identity
      - fresh-container
  - id: verify-release
    can: Keep both reports with their read paths and the tested image ID. Identify the bytes a run
      parsed and verify the application image to promote on the deployment platform.
    scenes:
      - platform-identity
      - compose-gates
      - identity
      - ci-rebuild
      - failure-map
