version: 1
lesson: constitutional-ai
promise: Decide which parts of a mixed request an assistant can answer, trace that decision into
  training data, and audit the result using independent labels, case counts and actual reads.
framing: []
objectives:
  - id: intro
    can: Use the public runbook and the trusted incident grant to answer a mixed request.
    scenes:
      - intro
  - id: principle
    can: Write and version a rule that distinguishes public, private and mixed requests.
    scenes:
      - principle
  - id: critique
    can: Separate the flawed draft, critique and revised supervised target.
    scenes:
      - critique
  - id: sft
    can: Identify the target after a fixed answer prefix and calculate its loss from its probability.
    scenes:
      - sft
  - id: rlaif
    can: Audit fresh comparisons by stable response identity.
    scenes:
      - rlaif
  - id: order-normalization
    can: Average two ballots for the same answer after the judge sees the candidates in opposite orders.
    scenes:
      - order-normalization
  - id: reward
    can: Compute a soft-preference margin update.
    scenes:
      - reward
  - id: policy-rl
    can: Decide which policy scores higher when the weight on reference-policy drift changes.
    scenes:
      - policy-rl
  - id: method-context
    can: Compare summarization win rates before and after length adjustment and identify what still needs a security test.
    scenes:
      - method-context
  - id: attack-search
    can: Read a candidate score sheet, distinguish a surrogate loss from a confirmed violation, and account for rejected batches.
    scenes:
      - attack-search
  - id: attack-lineage
    can: Repair a split that places descendants of the same seed in training and an unseen-seed test.
    scenes:
      - attack-lineage
  - id: red-team
    can: Assign permitted and denied cases to their respective false-refusal and disclosure denominators.
    scenes:
      - red-team
  - id: audit-accounting
    can: Report helpfulness, false refusals, attack success by family, and bounds for missing judgments.
    scenes:
      - audit-accounting
  - id: judge-audit
    can: Use the human verdict on each case to find wrong flags, missed violations and abstentions.
    scenes:
      - judge-audit
  - id: attack-budget
    can: Compute task success under independent attempts and under repeated identical outcomes.
    scenes:
      - attack-budget
  - id: multi-turn
    can: Distinguish a user quotation from an assistant disclosure in a retained transcript.
    scenes:
      - multi-turn
  - id: defense-effects
    can: Distinguish a prohibited proposal, an executed read and a delivered disclosure.
    scenes:
      - defense-effects
  - id: evaluate
    can: Reassess a mixed reply for a new destination, bound unresolved cases, and check a repair against the read trace.
    scenes:
      - evaluate
