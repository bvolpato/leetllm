version: 1
lesson: prompt-engineering-fundamentals
promise: Decide whether Luna can hand a paging recommendation to an engineer. Write a prompt with
  an unambiguous clock origin, compare the returned fields with the applicable rule, and test each
  revision on paired incidents.
objectives:
  - id: prediction
    can: Compute a conditional sequence probability and distinguish context changes from parameter
      updates
    scenes:
      - conditional-context
      - reasoning-work
  - id: context
    can: Put instructions and evidence in their proper message roles and specify whether a field
      measures time from P1 declaration or time remaining
    scenes:
      - policy-baseline
      - role-serialization
      - prompt-assembly
      - demonstration-boundaries
      - prompt-revision
  - id: validation
    can: Calculate legal token probabilities, distinguish a parse or type check from a policy check,
      and recompute all four fields when the applicable rule changes or goes missing
    scenes:
      - opening
      - complete-response
      - grammar-mask
      - strict-validator
      - fresh-boundary
  - id: authority
    can: Detect a decision based on an archived note and explain how an authorized consumer
      prevents a duplicate page after the incident state changes
    scenes:
      - input-boundary
      - execution-boundary
  - id: evaluation
    can: Count plurality agreement, identify paired fixed and regressed cases, and separate development
      from untouched evaluation
    scenes:
      - agreement-check
      - regression-evaluation
      - paired-fields
      - guarded-recommendation
sections:
  - heading: In-context learning steers the context at inference
    status: taught
    scenes:
      - conditional-context
      - policy-baseline
      - reasoning-work
  - heading: Keep instructions and incident details in their roles
    status: taught
    scenes:
      - prompt-assembly
      - role-serialization
      - input-boundary
  - heading: Output contracts and deterministic fallbacks
    status: taught
    scenes:
      - policy-baseline
      - prompt-assembly
      - prompt-revision
      - complete-response
      - strict-validator
      - fresh-boundary
  - heading: Choose examples that teach the right boundary
    status: taught
    scenes:
      - prompt-assembly
      - demonstration-boundaries
  - heading: More reasoning text can still be wrong
    status: taught
    scenes:
      - reasoning-work
      - agreement-check
  - heading: Constrain the format, then check the facts
    status: taught
    scenes:
      - opening
      - complete-response
      - grammar-mask
      - strict-validator
  - heading: "Prompt injection: keep hostile text from taking control"
    status: taught
    scenes:
      - input-boundary
      - execution-boundary
  - heading: Test prompt changes against the same cases
    status: taught
    scenes:
      - regression-evaluation
      - paired-fields
      - demonstration-boundaries
      - guarded-recommendation
