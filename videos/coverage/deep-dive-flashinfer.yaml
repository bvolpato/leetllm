version: 1
lesson: deep-dive-flashinfer
promise: Follow a packed query to the keys it may read, merge the workers' answers with their correct weights,
  and decide whether the next call may reuse a plan or a cache page. Check the selected backend before using
  that result in a serving benchmark.
objectives:
  - id: intro
    can: Identify the owner of a zero-based row as the scheduler packs queries
    scenes:
      - intro
  - id: project-lineage
    can: Identify the owner and version of a claimed capability
    scenes:
      - project-lineage
  - id: pointers
    can: Use separate prefix sums to slice packed query rows and entries in the ordered page list
    scenes:
      - intro
      - pointers
  - id: layout-payload
    can: Derive payload axes and separate them from page indirection
    scenes:
      - layout-payload
  - id: pages
    can: Map a logical token through ordered physical pages
    scenes:
      - pages
  - id: page-permutation
    can: Diagnose an in-bounds mapping that retrieves the wrong token
    scenes:
      - page-permutation
  - id: causal
    can: Determine the last readable key for each new query after the entire chunk has been appended
    scenes:
      - causal
  - id: causal-rule
    can: Compute a bottom-right causal row for a changed request
    scenes:
      - causal-rule
  - id: merge
    can: Explain why changing one score can change the merge shares while the partition and key count stay fixed
    scenes:
      - merge
  - id: merge-recurrence
    can: Recover the output and parent log mass from the two worker records using a common shift
    scenes:
      - merge-recurrence
  - id: merge-units
    can: Convert natural-log statistics exactly once
    scenes:
      - merge-units
  - id: merge-domain
    can: Separate the CPU reference domain from a GPU operator contract
    scenes:
      - merge-domain
  - id: merge-partition
    can: Expose overlap and compare split attention with a direct reference
    scenes:
      - merge-partition
  - id: planning
    can: Locate the first key beyond a stale plan and refresh the dependent metadata through the wrapper
    scenes:
      - planning
      - fresh-tail
  - id: wrapper-call
    can: Match shapes, index types and head grouping to the pinned wrapper
    scenes:
      - wrapper-call
  - id: offset-migration
    can: Calculate each tensor’s element offset and identify which output row a copied query offset would overwrite
    scenes:
      - offset-migration
  - id: graph-contract
    can: Choose metadata refresh or a new prepared wrapper from its declared contract
    scenes:
      - graph-contract
  - id: synthesis
    can: Separate a work-cost model from reader-completion ticks
    scenes:
      - synthesis
  - id: split-schedule
    can: Calculate the critical path under limited worker capacity
    scenes:
      - split-schedule
  - id: backend-support
    can: Distinguish backend support, JIT availability and serving integration
    scenes:
      - backend-support
  - id: startup-logging
    can: Separate cold compilation and logging effects from warmed execution
    scenes:
      - startup-logging
  - id: integration-lease
    can: Predict which value a pending load returns when the same slot changes owners before or after the read
    scenes:
      - integration-lease
  - id: correctness-matrix
    can: Design output and state checks with explicit limits
    scenes:
      - correctness-matrix
  - id: profile-boundary
    can: Calculate whole-call savings and choose a profiler boundary
    scenes:
      - profile-boundary
  - id: paper-evidence
    can: Interpret a historical latency result without converting its metric
    scenes:
      - paper-evidence
  - id: source-route
    can: Locate the wrapper, scheduled work and merge ownership in source
    scenes:
      - source-route
  - id: feature-limits
    can: Assess the benefits and costs of the library boundary
    scenes:
      - feature-limits
  - id: fresh-tail
    can: Work out the new length, move the plan boundary, and identify the first safe handoff after cancellation
    scenes:
      - fresh-tail
