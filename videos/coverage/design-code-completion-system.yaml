version: 1
lesson: design-code-completion-system
promise: Trace one proposed code edit through exact scope and position conversion, authorized FIM context,
  snapshot/cancellation/insertion gates, compatible serving work, complete latency and useful-edit
  measurements, and tenant-scoped privacy; compute changed-input repair and capacity examples.
framing: []
objectives:
  - id: intro
    can: Spot a duplicated receiver by comparing the proposed insertion with what the developer already typed
    scenes:
      - intro
  - id: lanes
    can: Choose local member lookup at the dot or permitted infill between the assignment and its return
    scenes:
      - lanes
  - id: route-policy
    can: Apply semantic availability and actual upload permission
    scenes:
      - route-policy
  - id: scope-recovery
    can: Keep a preceding header separate from enclosing scope
    scenes:
      - scope-recovery
  - id: position-units
    can: Convert the caret before constructing the suffix
    scenes:
      - position-units
  - id: fim
    can: Reorder persistent prefix and suffix before predicting the middle
    scenes:
      - fim
  - id: fim-training
    can: Train the middle after its two preserved boundaries
    scenes:
      - fim-training
  - id: infill-boundaries
    can: Insert only the generated middle into the same hole
    scenes:
      - infill-boundaries
  - id: context
    can: Preserve suffix and framing within the complete input budget
    scenes:
      - context
  - id: context-ranking
    can: Compute symbol overlap after filtering allowed files
    scenes:
      - context-ranking
  - id: freshness
    can: Drop a late reply while preserving a newer ghost at its captured range
    scenes:
      - freshness
  - id: debounce-history
    can: Predict the send log and visible ghost after a cancelled timer, late reply, caret move or policy change
    scenes:
      - debounce-history
  - id: acceptance-race
    can: Predict the edit Tab applies after a policy change and rebase only the remainder after matching typing
    scenes:
      - acceptance-race
  - id: timing
    can: Compute full edit-to-paint allocation including debounce
    scenes:
      - timing
  - id: trace-quantiles
    can: Compute the percentile from complete request rows
    scenes:
      - trace-quantiles
  - id: request-population
    can: Keep the first token inside the edit-to-paint path
    scenes:
      - request-population
  - id: cache
    can: Distinguish reused prefill from new output decode
    scenes:
      - cache
  - id: cache-key
    can: Compare exact computation compatibility under authenticated scope
    scenes:
      - cache-key
  - id: cache-order
    can: Change one early token and follow dependent cached states
    scenes:
      - cache-order
  - id: speculative-path
    can: Count emitted tokens, compute a proposed token's acceptance probability and normalize the positive shortfalls for its replacement
    scenes:
      - speculative-path
  - id: speculation-gate
    can: Keep the accepted-length and latency conditions together
    scenes:
      - speculation-gate
  - id: quantized-serving
    can: Separate compressed weight bytes from a measured useful edit
    scenes:
      - quantized-serving
  - id: value
    can: Count distinct accepted IDs and retained original characters
    scenes:
      - value
  - id: metric-denominators
    can: Count distinct suggestions and retained original text separately
    scenes:
      - metric-denominators
  - id: evaluation-release
    can: Freeze an edit point before comparing model and product value
    scenes:
      - evaluation-release
  - id: fleet-work
    can: Subtract pre-admission cancellation before counting uncached input
    scenes:
      - fleet-work
  - id: cohort-work
    can: Compute how swapping the hit and miss lengths changes prefill work at a fixed request hit rate
    scenes:
      - cohort-work
  - id: affinity-wait
    can: Find the extra warm wait that ties the cold route and select the earlier eligible worker
    scenes:
      - affinity-wait
  - id: batch-cost
    can: Measure shared-GPU scheduling under short-lived editor traffic
    scenes:
      - batch-cost
  - id: upload-boundary
    can: Remove recognized secrets before crossing the client boundary
    scenes:
      - upload-boundary
  - id: private-deployment
    can: Keep identity and retention controls inside a private route
    scenes:
      - private-deployment
  - id: public-matches
    can: Review code provenance and understanding before accepting
    scenes:
      - public-matches
  - id: diagnostic-repair
    can: Change the state or stage that explains the visible failure
    scenes:
      - diagnostic-repair
  - id: synthesis
    can: Follow a painted span through Tab and undo and distinguish an accepted suggestion from retained characters
    scenes:
      - synthesis
  - id: fresh-cursor
    can: Compare the two request epochs after a caret round trip and identify the reply Tab may insert
    scenes:
      - fresh-cursor
