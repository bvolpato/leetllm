version: 1
lesson: calling-llm-apis-production
promise: Decide whether the server can return an eligibility result, spend time on another attempt,
  or confirm a rotation job from the receipts it has.
objectives:
  - id: opening
    can: Explain how a lost reply and a still-running provider can give the caller the same timeout
    scenes:
      - opening
      - fresh-request
  - id: secret-probe
    can: Distinguish a startup presence check from delivery of a public setting and from permission to spend through a route
    scenes:
      - secret-probe
  - id: contract-boundary
    can: Trace authenticated intent and validated response across the server
    scenes:
      - contract-boundary
  - id: domain-wire
    can: Map a validated domain task to the actual provider schema
    scenes:
      - domain-wire
  - id: candidate-validation
    can: Compare the same candidate fields against trusted age and policy
    scenes:
      - candidate-validation
  - id: parser-layers
    can: Reject ambiguous JSON and apply both directions of eligibility
    scenes:
      - parser-layers
  - id: failure-receipt
    can: Trace failure telemetry and unknown usage without inventing a decision
    scenes:
      - failure-receipt
  - id: timeout-contract
    can: Apply separate read, first-text and total timeout milestones
    scenes:
      - timeout-contract
  - id: timeout-retry
    can: Account for attempts and waits on one task clock
    scenes:
      - timeout-retry
  - id: admission-limits
    can: Classify normalized failure causes before retry admission
    scenes:
      - admission-limits
  - id: jitter-geometry
    can: Place two retries on an elapsed-time axis and compute how the next draw depends on the delay rule
    scenes:
      - jitter-geometry
  - id: deadline-floor
    can: Decide whether the same retry reservation fits after the first attempt takes longer
    scenes:
      - deadline-floor
      - fresh-request
  - id: circuit-breaker
    can: Route a request using dependency health and approved recovery
    scenes:
      - circuit-breaker
  - id: breaker-clock
    can: Route a second arrival while the first holds the only recovery permit and handle an unapproved fallback
    scenes:
      - breaker-clock
  - id: idempotency
    can: Recover one authorized action without duplicating its intent
    scenes:
      - idempotency
  - id: write-uncertainty
    can: Use the original action key to establish whether a job exists after its reply is lost
    scenes:
      - write-uncertainty
      - fresh-request
  - id: format-contract
    can: Distinguish strict schema, JSON syntax and trusted policy checks
    scenes:
      - format-contract
  - id: sdk-wire
    can: Identify what the actual mock and retention flags establish
    scenes:
      - sdk-wire
  - id: streaming
    can: Distinguish visible progress from validated completion
    scenes:
      - streaming
  - id: stream-events
    can: Trace byte framing, typed events and received-delta timing
    scenes:
      - stream-events
  - id: stream-failures
    can: Use the terminal event to distinguish two streams with identical text and retain the exact draft after a drop
    scenes:
      - stream-failures
  - id: cost-privacy
    can: Compute a request and monthly cost while excluding raw secrets
    scenes:
      - cost-privacy
  - id: usage-subsets
    can: Price disjoint token categories and explain why more cache hits change cost at fixed input and output totals
    scenes:
      - usage-subsets
  - id: telemetry-scope
    can: Construct scoped operational evidence without copying private content
    scenes:
      - telemetry-scope
  - id: execution-shapes
    can: Join offline outcomes by identity and select an appropriate work shape
    scenes:
      - execution-shapes
  - id: fresh-request
    can: Reject a plausible answer with the wrong threshold, budget a retry, and resolve an uncertain write by reading its status
    scenes:
      - fresh-request
