version: 1
lesson: causality
promise: Decide whether a release report warrants changing ticket routing. Reconstruct who entered each rate,
  estimate resolution for the deployment queue, and identify the evidence needed for a causal decision.
objectives:
  - id: population
    can: Use the same within-risk rates to explain the observed reversal and predict resolutions per hundred in the deployment queue
    scenes:
      - intro
      - policy-definition
      - simpson
      - standardize
      - standardize-uncertainty
      - estimands
      - release-receipt
  - id: graph
    can: Trace chain, fork and collider paths and justify a sufficient backdoor adjustment set
    scenes:
      - graph
      - graph-junctions
      - backdoor-set
      - intervene
      - selection
      - fresh-audit
  - id: counterfactual
    can: Bound hidden response-type pairings and distinguish a replay estimand from an original individual outcome
    scenes:
      - potential
      - harm-bounds
      - replay-state
  - id: weights
    can: Distinguish actual tickets, total weight, and effective sample size. Diagnose missing support and explain how clipping can reverse the comparison by changing the risk mix.
    scenes:
      - overlap
      - weighted-tickets
      - weight-choices
      - support-sampling
  - id: instrument
    can: Compute a Wald complier effect and diagnose exclusion or weak-first-stage failure
    scenes:
      - instrument
      - wald-late
      - weak-instrument
  - id: policy
    can: Trace one failed ticket into a weighted residual, compute a one-step policy value, and identify the additional assumptions for sequential, click and deployment claims
    scenes:
      - policy-value
      - dr-correction
      - dr-assumptions
      - sequential-policy
      - click-exposure
      - release-receipt
  - id: audit
    can: Predict the sign of an audit difference under two selection rules, then use the original ticket IDs to test a rollback request
    scenes:
      - selection
      - fresh-audit
