version: 1
lesson: agent-architectures
promise: Choose who decides the next lookup, identify which results a plan can reuse after a change, and check whether the evidence supports an answer. Compare routing, reflection and sandboxed search under the same permissions and budget.
objectives:
  - id: subject-intro
    can: Trace a route to its actual destination before using it for a different museum
    scenes:
      - subject-intro
  - id: control-contract
    can: Identify who chose the hours lookup and who had permission to send it
    scenes:
      - control-contract
  - id: state-record
    can: Distinguish the requested finish time from the closing time on the returned hours receipt
    scenes:
      - state-record
  - id: react-loop
    can: Predict the next lookup when the same hours request returns a different observation
    scenes:
      - react-loop
  - id: react-research
    can: Keep historical comparisons attached to their controls
    scenes:
      - react-research
  - id: ci-policy
    can: Distinguish a successful tool read from the failed build it reports
    scenes:
      - ci-policy
  - id: completion-evidence
    can: Check each release claim against the reads the host completed and count its decision turns
    scenes:
      - completion-evidence
  - id: workflow-choice
    can: Compare a coded fallback with a model-chosen follow-up on the same closure notice
    scenes:
      - workflow-choice
  - id: context-triangle
    can: Sum the repeated copies of each observation across later requests
    scenes:
      - context-triangle
  - id: cache-and-context
    can: Separate submitted input counts from reusable prefix work and charges
    scenes:
      - cache-and-context
  - id: tainted-interface
    can: Apply host authorization after validating a proposed tool request
    scenes:
      - tainted-interface
  - id: self-consistency
    can: Vote on proposals before any real effect
    scenes:
      - self-consistency
  - id: reflexion-feedback
    can: Repair feedback before adding another reflection
    scenes:
      - reflexion-feedback
  - id: reflexion-evidence
    can: Compare generated self-tests with the experiment’s held-out correctness result
    scenes:
      - reflexion-evidence
  - id: explicit-plan
    can: Reject a completed journey to the wrong museum and identify the missing result
    scenes:
      - explicit-plan
  - id: plan-runtime
    can: Compute ready steps from a validated graph and actual result states
    scenes:
      - plan-runtime
  - id: critical-path
    can: Locate the read that holds up a join and compute the elapsed time with one or three workers
    scenes:
      - critical-path
  - id: replan
    can: Keep a museum’s current hours, replace a cancelled journey and recompute the visit
    scenes:
      - replan
  - id: receipt-expiry
    can: Identify the read ready to rerun at its exclusive expiry and the decision that must wait for it
    scenes:
      - receipt-expiry
  - id: consumed-versions
    can: Invalidate descendants when a consumed input version is replaced
    scenes:
      - consumed-versions
  - id: router-dispatch
    can: Classify once when the categories are already known
    scenes:
      - router-dispatch
  - id: search-tree
    can: Keep alternatives within a real branch-state contract
    scenes:
      - search-tree
  - id: uct-construction
    can: Use each branch’s visit count and return sum to predict how the exploration bonus changes the choice of simulation
    scenes:
      - uct-construction
  - id: return-backup
    can: Back up a simulated return to the selected child and root, then compute the child’s new mean
    scenes:
      - return-backup
  - id: strict-tool-contract
    can: Validate request shape and access before accepting the returned observation
    scenes:
      - strict-tool-contract
  - id: lost-reply
    can: Reconcile a lost reply using the service’s stable operation identity
    scenes:
      - lost-reply
  - id: bounded-context
    can: Stop loops and select the evidence each call needs
    scenes:
      - bounded-context
  - id: budget-reservation
    can: Reserve capacity before another dispatch
    scenes:
      - budget-reservation
  - id: cycle-and-progress
    can: Compare the five cursor readings around four repeated calls and distinguish a stalled pair from one that made progress
    scenes:
      - cycle-and-progress
  - id: incident-recovery
    can: Match the recovered state to the affected incident
    scenes:
      - incident-recovery
  - id: durable-session
    can: Select stored state into the next policy’s context without inventing authority
    scenes:
      - durable-session
  - id: architecture-evaluation
    can: Compare two policies on the same allowed reads and turn budget, separating completed reads, rejected requests and supported answers
    scenes:
      - architecture-evaluation
  - id: transfer
    can: Use the hours and transit receipts to compute the finish and the time left before the deadline
    scenes:
      - transfer
  - id: fresh-itinerary
    can: Decide whether to recommend a later bus under the original visit length and under a visitor-approved shorter stay
    scenes:
      - fresh-itinerary
