version: 1
lesson: layer-normalization
promise: Trace a token through normalization and residual addition to diagnose a changed head input in a checkpoint port.
framing: []
objectives:
  - id: intro
    can: Calculate the fraction of an aligned residual sum supplied by one write.
    scenes: [intro, depth-diagnosis]
  - id: center
    can: Predict the centered features when a common offset moves every input.
    scenes: [center, normalization-transfer]
  - id: scale
    can: Compute the population variance, epsilon-adjusted divisor and standardized output of a token.
    scenes: [scale, normalization-transfer]
  - id: affine
    can: Trace a learned gain or shift to the feature and output statistics it changes.
    scenes: [affine]
  - id: axes
    can: Use a later-token edit to distinguish feature-only normalization from a reduction that includes time.
    scenes: [axes]
  - id: placement
    can: Trace both residual layouts for two blocks and identify which vector reaches the head.
    scenes: [placement, normalization-transfer]
  - id: gradients
    can: Locate the skip contribution in each block Jacobian and explain a cancellation in one direction.
    scenes: [placement, gradients]
  - id: rms
    can: Calculate an RMSNorm output and distinguish a change in kernel time from a change in full-step time.
    scenes: [rms, normalization-transfer]
  - id: precision
    can: Locate overflow or input rounding and choose the inputs for a wide reference calculation.
    scenes: [precision]
  - id: norm-backward
    can: Calculate an input gradient within one token and accumulate shared parameter gradients across tokens.
    scenes: [norm-backward]
  - id: depth-diagnosis
    can: Choose a warmup experiment or a held-out block ablation from the observed gradients or relative writes.
    scenes: [depth-diagnosis]
  - id: deepnorm
    can: Place alpha in the DeepNorm forward pass and beta in the selected weight initializations.
    scenes: [deepnorm]
  - id: qk-peri
    can: Distinguish normalizing a branch write from normalizing queries and keys, and compute a bounded score.
    scenes: [qk-peri]
  - id: normalization-transfer
    can: Restore a missing final LayerNorm and check the head logit on two inputs with a common offset.
    scenes: [normalization-transfer]
