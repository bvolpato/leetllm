version: 1
lesson: model-versioning-continuous-deployment
promise: Use the identity of the release that actually served a request to reproduce an approval
  failure, decide whether its canary can keep serving, and verify when a returning conversation
  can resume on stable.
objectives:
  - id: identify-and-test
    can: Verify the loaded bytes after a Git revert, replay the same request with matching tool results,
      and check whether the offline evaluation applies to that exact release.
    scenes:
      - opening
      - identity
      - bundle-contract
      - provider-contract
      - registry
      - gate-arithmetic
      - trace-replay
      - offline
      - report-integrity
  - id: control-exposure
    can: Enforce both shadow permissions, count missing comparisons, distinguish conversation and
      request exposure, and choose whether to widen, hold or stop a canary from its own reviews.
    scenes:
      - shadow
      - shadow-evidence
      - sticky
      - assignment-share
      - window-policy
      - live
      - zero-risk
      - fresh-release
  - id: recover-and-reconstruct
    can: Choose which alias to restore, check capacity and saved state against the stable worker,
      and trace one resumed request back to the release that served it.
    scenes:
      - recovery
      - capacity
      - audit-lineage
      - stack-contract
      - fresh-release
