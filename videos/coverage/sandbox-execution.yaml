version: 1
lesson: sandbox-execution
promise: Decide whether a generated parser earned a passing receipt and whether its worker slot is ready for the next job. Use the evidence required for each decision.
framing:
  - subject-intro
objectives:
  - id: repair-from-evidence
    can: Use a bounded exception to locate the mistaken XML lookup and predict the ordered rows for a fresh report.
    scenes: [subject-intro, evidence-loop, feedback-contract, earned-parser-case]
  - id: verify-the-receipt
    can: Compare the returned rows with protected expectations and decide whether a passing receipt applies after an image change.
    scenes: [separated-authority, earned-parser-case]
  - id: trace-the-grant
    can: Trace a file read to the configured grant, keep credentials out of offline jobs and distinguish CPU bandwidth from the wall deadline.
    scenes: [execution-boundaries, controls-by-failure, prepared-dependencies]
  - id: predict-guest-behavior
    can: Distinguish an integer result, a refused memory growth, a guest trap and a host-side rejection under the stated Wasm limits.
    scenes: [wasm-boundary, actual-wasm-host, wasm-failure-matrix]
  - id: count-successful-pairs
    can: Calculate the chance of at least one functional pass among two different candidate indices and identify which runtime properties still need probes.
    scenes: [evaluate-two-axes, earned-parser-case]
  - id: admit-the-next-worker
    can: Use termination and reset records to decide whether to reuse a slot. Target delayed cleanup by immutable worker ID and guard the slot update by generation.
    scenes: [teardown-lifecycle, earned-parser-case]
sections:
  - heading: Make the next attempt depend on evidence
    status: taught
    scenes:
      - evidence-loop
      - feedback-contract
      - earned-parser-case
    note: The command returns a missing-status KeyError on the original lookup. The repaired parser retains two distinct identities on the first fixture and one on the fresh fixture.
  - heading: Keep the worker away from the authority to grade it
    status: taught
    scenes:
      - separated-authority
    note: An empty list and the repaired rows meet the same protected expectation. The tested manifest stays fixed when the submitted image changes from I7 to I8.
  - heading: Four execution boundaries to compare
    status: taught
    scenes:
      - execution-boundaries
    note: Four schematic configurations grant a read of report.xml. Replacing the requested name with notes.txt tests the same grant on an unassigned file. The article covers startup milestones and platform defaults.
  - heading: Multi-layer containment and resource controls
    status: taught
    scenes:
      - controls-by-failure
      - prepared-dependencies
  - heading: Offline execution can still leak secrets
    status: taught
    scenes:
      - controls-by-failure
      - prepared-dependencies
    note: A synthetic token crosses the worker output channel while the network is closed. The builder compares two schema-file digests with the same trusted pin.
  - heading: CPU bandwidth, deadlines, and complete teardown
    status: taught
    scenes:
      - controls-by-failure
      - teardown-lifecycle
      - earned-parser-case
    note: The delayed generation-seven record arrives after generation eight starts. The final case leaves one old scratch file after every job process has exited.
  - heading: Bound guest execution with WebAssembly
    status: taught
    scenes:
      - wasm-boundary
      - actual-wasm-host
      - wasm-failure-matrix
  - heading: Test failure boundaries alongside successful paths
    status: taught
    scenes:
      - wasm-failure-matrix
    note: The same four-byte load fits at 65532 and crosses the final byte at 65534. A separate page-growth request returns minus one at the one-page limit.
  - heading: Measuring correctness and containment separately
    status: taught
    scenes:
      - evaluate-two-axes
      - earned-parser-case
  - heading: Bounded patches from verifiable execution
    status: taught
    scenes:
      - earned-parser-case
      - separated-authority
