version: 1
lesson: capstone-evaluation-dashboard
promise: Follow a dashboard decision back to the exact output that warrants collecting evidence, holding a candidate, or expanding offline evaluation.
framing: []
objectives:
  - id: replay-grade
    can: Validate typed outputs and reconstruct each grade from retained expected and actual evidence.
    scenes:
      - rows
      - typed-contract
  - id: comparison
    can: Locate a missing or duplicated fixture ID, check the frozen comparison and distinguish a recomputable grade from evidence that a run occurred.
    scenes:
      - inventory
      - receipt-provenance
      - regression-package
      - fresh-attack
  - id: decision
    can: Identify the required behavior that blocks a candidate and recover the failed row after a filter hides every result.
    scenes:
      - intro
      - gates
      - filters
      - empty-view
      - fresh-attack
  - id: sampling
    can: Score a resample that repeats a failed fixture, match shuffled rows by ID and compute the paired change using the same draws.
    scenes:
      - bootstrap
      - paired
  - id: oracle
    can: Calculate a candidate-pool availability estimator and distinguish it from the delivered selector outcome.
    scenes:
      - passk-selector
  - id: judge
    can: Map swapped slot verdicts back to answer identities and preserve the unresolved order check.
    scenes:
      - judge-order
  - id: coverage
    can: Turn a coverage gap into a reviewed work item and apply the full-set gate when the fifth fixture arrives.
    scenes:
      - synthesis
      - coverage-owners
      - fresh-attack
  - id: handoff
    can: Compute escalation recall, reject a zero positive denominator and package the same tested policy for
      inspection.
    scenes:
      - classifier-handoff
      - regression-package
