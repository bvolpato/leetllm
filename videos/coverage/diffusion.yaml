version: 1
lesson: diffusion
promise: Check a sampler against a known noisy pixel, explain how a learned prediction and a prompt
  change the update, and decide what work and release checks an image job needs.
objectives:
  - id: product-lanes
    can: Compute lane-specific offered work and headroom estimates
    scenes:
      - product-lanes
  - id: forward
    can: Save a forward exposure and use its marked pixel as an independent return value for a sampler
    scenes:
      - intro
      - forward
      - samplers
  - id: coefficients
    can: Compute signal and noise amplitudes and signed contributions
    scenes:
      - coefficients
  - id: forward-schedule
    can: Multiply stepwise retained fractions and interpret SNR
    scenes:
      - forward-schedule
  - id: training
    can: Construct the known-noise regression target and error
    scenes:
      - training
  - id: reverse-posterior
    can: Combine the two conditional densities and explain why the spread between their means contributes to the reverse variance
    scenes:
      - reverse-posterior
  - id: training-targets
    can: Use a known clean pixel to diagnose a sampler that reads a velocity prediction as noise
    scenes:
      - training-targets
  - id: reverse
    can: Identify mean, fresh noise and next state in a reverse step
    scenes:
      - reverse
  - id: reverse-trace
    can: Replay the actual scalar recurrence and consumed RNG state
    scenes:
      - reverse-trace
  - id: score
    can: Reconstruct a score from posterior-weighted components
    scenes:
      - score
  - id: transport
    can: Follow probability-flow transport in the declared variance direction
    scenes:
      - transport
  - id: samplers
    can: Recover the clean estimate and restore the carried noise direction at a selected level
    scenes:
      - samplers
      - recap
  - id: ddim-contract
    can: Predict both landings when the fresh draw changes sign and identify what eta changes
    scenes:
      - ddim-contract
  - id: architectures
    can: Trace U-Net and diffusion-transformer backbone computation
    scenes:
      - architectures
  - id: time-conditioning
    can: Calculate one timestep-conditioned feature modulation
    scenes:
      - time-conditioning
  - id: flow-paths
    can: Apply a straight-pair flow target with the correct time direction
    scenes:
      - flow-paths
  - id: conditioning
    can: Explain how changing a spatial query changes text influence
    scenes:
      - conditioning
  - id: cross-read
    can: Calculate normalized attention shares and weighted values
    scenes:
      - cross-read
  - id: guidance
    can: Construct guidance as a base plus a scaled difference
    scenes:
      - guidance
  - id: cfg-training
    can: Trace conditional dropout and vector extrapolation
    scenes:
      - cfg-training
  - id: cfg-api
    can: Distinguish mathematical guidance from API branch behavior
    scenes:
      - cfg-api
  - id: latent
    can: Trace encoded latent training and random-latent generation
    scenes:
      - latent
  - id: latent-contract
    can: Count scalar compression and diagnose reconstruction loss
    scenes:
      - latent-contract
  - id: text-canvas
    can: Separate provisional text revisions from committed text
    scenes:
      - text-canvas
  - id: gemma-system
    can: Trace cached-prefix and canvas lifetimes with stopping predicates
    scenes:
      - gemma-system
  - id: controls-fast
    can: Choose a compatible spatial control or acceleration mechanism
    scenes:
      - controls-fast
  - id: compute
    can: Count predictions across sampling levels and distinguish a change in guidance scale from a change in branch count
    scenes:
      - compute
  - id: reproducibility
    can: Restore a complete generation recipe and resume state
    scenes:
      - reproducibility
  - id: publication
    can: Fence obsolete attempts and bind final derivative evidence
    scenes:
      - publication
  - id: release-evidence
    can: Apply strict record gates and separate operational evidence
    scenes:
      - release-evidence
  - id: fresh-release
    can: Count predictions for one job and use the current attempt and final file digest to decide when a resized image can be released
    scenes:
      - fresh-release
