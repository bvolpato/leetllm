version: 1
lesson: query-expansion
promise: Choose the smallest search repair that recovers the sources a question needs, then test whether the answer and the route meet their evidence, access and latency requirements.
framing: []
objectives:
  - id: subject-intro
    can: Predict which page a search of the last turn alone will retrieve.
    scenes:
      - subject-intro
  - id: rewrite-for-context
    can: Use the earlier turn to repair a search and compare matches on the same pages.
    scenes:
      - rewrite-for-context
  - id: vocabulary-expansion
    can: Retain the original query and admit distinct vocabulary variants within a search budget.
    scenes:
      - vocabulary-expansion
  - id: merge-ranked-lists
    can: Use one-based positions to explain why a page found twice outranks a single first-place result.
    scenes:
      - merge-ranked-lists
  - id: inspect-recall
    can: Distinguish a top-three hit from finding both pages a two-part answer requires.
    scenes:
      - inspect-recall
  - id: decomposition-topology
    can: Separate independent fact lookups from searches that need an identity returned by an earlier lookup.
    scenes:
      - decomposition-topology
  - id: preserve-trust-boundaries
    can: Apply the caller’s scope before passing matched text to the answer model.
    scenes:
      - preserve-trust-boundaries
  - id: step-back
    can: Join a request trace to the policy for its endpoint, tier, client and time window.
    scenes:
      - step-back
  - id: hyde-vectors
    can: Average paired proxy coordinates and identify the vector that enters corpus search.
    scenes:
      - hyde-vectors
  - id: hyde-drift
    can: Trace a change in the proxy text to a displaced required page with the corpus and result limit fixed.
    scenes:
      - hyde-drift
  - id: self-rag-tokens
    can: Distinguish a retrieved passage, a generated claim and the trained generator’s judgments.
    scenes:
      - self-rag-tokens
  - id: self-rag-branches
    can: Normalize support within its token family, compare weighted continuations and check the winning claim against its source.
    scenes:
      - self-rag-branches
  - id: crag-routing
    can: Route on the best document score and apply a separate permission check to any external lookup.
    scenes:
      - crag-routing
  - id: knowledge-refinement
    can: Recompose relevant strips in source order and trace each claim back to its original strip.
    scenes:
      - knowledge-refinement
  - id: correction-boundaries
    can: Keep private queries inside the approved boundary and distinguish cached rewrites by history and effective scope.
    scenes:
      - correction-boundaries
  - id: latency-waterfall
    can: Calculate a serial request total, the nearest-rank p95 of request totals and a joint deadline under independence.
    scenes:
      - latency-waterfall
  - id: route-release
    can: Select or block a route using both supported accuracy and end-to-end latency on the same questions.
    scenes:
      - route-release
  - id: exactness-and-budget
    can: Distinguish retrieval calls, returned entries and distinct pages, then cite the incident named in the original conversation.
    scenes:
      - exactness-and-budget
