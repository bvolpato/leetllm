version: 1
lesson: tensor-shapes
promise: Preserve axis meanings and value owners through indexing, broadcasting, reductions, memory
  views, attention multiplication and head splitting, and reject inputs that violate the contract.
framing:
  - intro
objectives:
  - id: trace-owned-values
    can: Choose between two head layouts with the same shape by checking one output pair against
      its original word and feature positions. Use the token-axis stride to find the same feature
      in the next word. Choose test values that expose a misplaced pair.
    scenes:
      - intro
      - index
      - reshape-transpose
      - heads
  - id: compute-and-debug
    can: Predict which axis receives a broadcast and which one a reduction removes. Place each
      dot product in the query row and key column of the score grid for its sentence.
    scenes:
      - shape
      - broadcast
      - reduce
      - attention
      - takeaway
  - id: compare-mean-dtypes
    can: When an exact sum falls halfway between two float32 values, use the default ties-to-even
      rule to choose the stored value. With the same inputs, predict the sum after cancellation
      and the dtype and rounded value of the returned mean for each calculation.
    scenes:
      - precision
  - id: enforce-contracts
    can: Predict which array changes after a write to a basic slice, a retrieved selection or the
      source. Check input rank, feature width and dtype at the model boundary.
    scenes:
      - shape
      - views
      - contracts
