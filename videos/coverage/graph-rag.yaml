version: 1
lesson: graph-rag
promise: Choose evidence for a lookup, an investigation, a theme summary, or a frequency count, then check what the current sources let the reader claim.
framing: []
objectives:
  - id: graph-evidence
    can: Resolve a typed identity, follow a directed link to its source, and judge which claims the source supports.
    scenes: [subject-intro, triples, extraction-contract, resolve-identity, walk-evidence, unsupported-edge, incident-comparison]
  - id: report-coverage
    can: Score a proposed partition, explain what a parent gate can hide, and trace a report answer or a follow-up to its sources.
    scenes: [community-construction, community-overview, dynamic-selection, drift-followups]
  - id: route-and-budget
    can: Pack evidence by score under a token limit and compare eligible routes by supported accuracy, latency, and refresh-plus-query cost.
    scenes: [local-context-budget, index-strategies, workload-cost]
  - id: current-evidence
    can: Admit a report for the current reader, block old descendants after a correction, and count distinct reviewed IDs for a frequency claim.
    scenes: [community-overview, incident-comparison, counts-and-access, transfer]
