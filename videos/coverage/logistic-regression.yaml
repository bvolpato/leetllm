version: 1
lesson: logistic-regression
promise: Fit and audit the access-review classifier, compare it with multiclass and kernel models, and choose
  the least expensive tested cut that fits the available review slots.
objectives:
  - id: fit
    can: Compute binary likelihood, stable loss, row/batch gradients and the geometry of a threshold
    scenes:
      - evidence-score
      - sigmoid
      - boundary-geometry
      - log-loss
      - bernoulli-likelihood
      - loss-curvature
      - gradient
      - batch-gradient
      - data-contract
      - learning
      - separation
      - boundary
  - id: policy
    can: Route a scored request, use its later label to price the action, and compare observed or expected
      bills for the cuts a desk can staff before testing the chosen policy on fresh requests
    scenes:
      - intro
      - confusion
      - denominators
      - harmonic-mean
      - capacity
      - calibrated-cost
      - fresh-operating-point
      - decision
  - id: ranking
    can: Calculate AUC and AP with ties and diagnose prevalence or negative-sampling changes
    scenes:
      - ranking
      - rescaling
      - rare-event-population
      - ap-and-ties
  - id: calibration
    can: Compute ECE/Brier and distinguish calibrator fitting, ranking invariance and verification
    scenes:
      - calibration
      - calibration-error
      - calibration-maps
  - id: extensions
    can: Compute stable multiclass residuals, signed margin losses and one-observation GP uncertainty
    scenes:
      - multiclass-heads
      - stable-softmax
      - margin-objective
      - kernel-uncertainty
      - implementation-parity
