version: 1
lesson: gpu-kernel-performance-engineering-lab
promise: Decide whether to keep a CUDA transpose change by checking the copied bits, tracing the
  addresses of one warp, and comparing repeated timings on the same GPU.
objectives:
  - id: exact
    can: Expose a skipped store that passes with reused output, and verify the repair against a
      freshly poisoned destination.
    scenes:
      - intro
      - bit-contract
      - target-build
  - id: timing
    can: Identify launch timing boundaries, normalize logical bytes and preserve raw repeated samples
    scenes:
      - timing-window
      - logical-rate
      - synthesis
  - id: memory
    can: Compute full, misaligned and masked sector coverage from actual lane addresses
    scenes:
      - sectors
      - edge-sectors
  - id: ownership
    can: Trace a value through the producing and consuming warps of an edge tile
    scenes:
      - tiles
      - edge-ownership
      - fresh-trial
  - id: banks
    can: Route the same scalar column read at strides 32, 33 and 34, count distinct words per
      bank, and calculate the extra shared storage.
    scenes:
      - banks
      - stride-transfer
  - id: resources
    can: Separate unroll hypotheses and declared resource capacity from actual target performance
    scenes:
      - unroll-issue
      - resource-budget
  - id: repair
    can: Trace a stale register back to its early shared read and check the barrier repair against
      the recorded sanitizer results.
    scenes:
      - barrier
      - race-recovery
  - id: primitive
    can: Compute reduction summaries and stable compaction offsets from a mismatch vector
    scenes:
      - primitives
  - id: evidence
    can: Compare the five paired timing rounds, distinguish a bank-mapping result from a measured
      speed benefit, and design a control that separates padding from block geometry.
    scenes:
      - profile-boundary
      - synthesis
      - fresh-trial
