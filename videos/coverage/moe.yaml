version: 1
lesson: moe
promise: Reconstruct sparse expert routing and its gradients, audit balancing and capacity policies, preserve
  the weighted function through dispatch and combine, and evaluate the complete memory and serving cost of an
  MoE.
framing: []
objectives:
  - id: capacity-question
    can: Trace two different tokens through the same eight stored experts and count the expert calls for each token
    scenes:
      - capacity-question
  - id: shared-and-routed
    can: Open up the feed-forward layer
    scenes:
      - shared-and-routed
  - id: router-scores
    can: Let the hidden state choose a path
    scenes:
      - router-scores
  - id: top-two
    can: Keep two paths and rescale their weights
    scenes:
      - top-two
  - id: weighted-output
    can: Build the output as a weighted vector sum
    scenes:
      - weighted-output
  - id: routing-rules
    can: Identify which expert-selection and output-weighting contract a model uses
    scenes:
      - routing-rules
  - id: router-contract
    can: Make the routing rule executable
    scenes:
      - router-contract
  - id: gate-gradient
    can: Derive the local task-gradient difference between retained and normalized top-one gates
    scenes:
      - gate-gradient
  - id: batch-dispatch
    can: Group the work, preserve the token
    scenes:
      - batch-dispatch
  - id: pack-permutation
    can: Find a token's two gated assignments after five tickets have been sorted into three expert groups
    scenes:
      - pack-permutation
  - id: scatter-combine
    can: Add two signed returns at the original token address and identify the result of overwriting it or omitting its gates
    scenes:
      - scatter-combine
  - id: expert-choice
    can: Select the two highest scores in each expert row and count the selected returns in each token column
    scenes:
      - expert-choice
  - id: prefix-consistency
    can: Let a future token challenge the same prefix
    scenes:
      - prefix-consistency
  - id: training-skew
    can: Trace how assignment skew can feed back through expert and router updates across batches
    scenes:
      - training-skew
  - id: balance-pressure
    can: Give the router a balancing signal
    scenes:
      - balance-pressure
  - id: balance-value
    can: Compute the balancing pressure
    scenes:
      - balance-value
  - id: balance-counterexample
    can: Calculate a feasible balance score below one and identify its unused expert
    scenes:
      - balance-counterexample
  - id: z-partition
    can: Change logit scale without changing routing
    scenes:
      - z-partition
  - id: capacity-limit
    can: Locate a token's surviving return, compute its routed sum with the retained gate, and count overflow assignments across the batch
    scenes:
      - capacity-limit
  - id: capacity-arithmetic
    can: Count assignments before choosing an overflow policy
    scenes:
      - capacity-arithmetic
  - id: dropless-work
    can: Compare the same token's returned vector under dropping, dropless execution and rerouting to a different expert
    scenes:
      - dropless-work
  - id: parameter-memory
    can: Count the stored pool and the active path
    scenes:
      - parameter-memory
  - id: residency-budget
    can: Place the complete pool in the memory budget
    scenes:
      - residency-budget
  - id: expert-arithmetic
    can: Count the matrices inside each expert
    scenes:
      - expert-arithmetic
  - id: family-architecture
    can: Read the dense and shared paths too
    scenes:
      - family-architecture
  - id: selection-bias
    can: Choose with bias, weight with original affinity
    scenes:
      - selection-bias
  - id: checkpoint-contract
    can: Inspect the checkpoint routing contract
    scenes:
      - checkpoint-contract
  - id: hybrid-mixer
    can: Keep token mixing and expert selection independent
    scenes:
      - hybrid-mixer
  - id: expert-parallelism
    can: Follow a token across the interconnect
    scenes:
      - expert-parallelism
  - id: wire-protocol
    can: Hold the routes fixed and change the messages
    scenes:
      - wire-protocol
  - id: parallel-layout
    can: Separate expert identity from matrix placement
    scenes:
      - parallel-layout
  - id: prefetch-dependency
    can: Distinguish moving weights from moving tokens
    scenes:
      - prefetch-dependency
  - id: evaluate-path
    can: Compare four dependent decode steps with four prefill positions and explain why the same expert row count can produce different call shapes
    scenes:
      - evaluate-path
  - id: serving-gate
    can: Apply simultaneous quality, throughput and p95 requirements and revise a decision when only the latency budget changes
    scenes:
      - serving-gate
  - id: diagnose-routing
    can: Find the failing mechanism before changing the router
    scenes:
      - diagnose-routing
  - id: fresh-route
    can: Use queue loads to predict which route survives and compute how a larger buffer changes the same token's output
    scenes:
      - fresh-route
