version: 1
lesson: llm-lifecycle-training-to-deployment
promise: Follow a checkpoint from training through evaluation, compression and
  serving, then use a request trace to choose and test a policy repair.
framing:
  - opening
objectives:
  - id: learn
    can: Compute frequency-weighted merges, target loss and dense allocation,
      distinguishing training from recurring inference.
    scenes:
      - curated-data
      - pretraining
      - compute-budget
  - id: adapt
    can: Diagnose target masks, preference training and verifier scope without
      confusing runtime compute with weight updates.
    scenes:
      - post-training
      - assistant-loss-contract
      - preference-and-reward
  - id: evaluate
    can: Compare both judge ballots, grade pinned cases, and decide whether a
      report applies after a serving revision changes. State what a data overlap
      audit actually searched.
    scenes:
      - benchmark-evidence
      - judge-calibration
      - evaluation
      - release-report-binding
  - id: serve
    can: Compute weight/cache/rounding and block/scheduling effects while enforcing
      authorized routing.
    scenes:
      - compression
      - quantization-operation
      - serving
      - serving-measurements
      - speculative-prefix
      - authorized-routing
  - id: repair
    can: Replay a saved request to distinguish an outdated checker from a reused
      reply. Verify the repair at the cutoff and when only the stale flag changes.
    scenes:
      - opening
      - failure-investigation
      - diagnose
      - fresh-policy-cache
