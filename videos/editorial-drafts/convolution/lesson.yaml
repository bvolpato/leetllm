scenes:
  - id: intro
    title: Can one small rule follow a moving edge?
    visual: A large pixel image offers three actual neighboring patches. Their response cards stay unknown while
      the learner predicts which patch has no edge.
    beats:
      - say: When a visible object moves across an image, its pattern often appears at different pixel coordinates. How could one tiny detector
          recognize the same edge in a different place? Start with this five-by-five image.
        visual_cues:
          - id: opening-image
            phrase: When a visible object moves across an image
            targets:
              - edge-input
            color: blue
        hold: 0.5
      - say: These three windows overlap. Follow the dark and bright columns into each window.
          Predict which window should give our edge detector a zero response. We will build the rule and
          return to your prediction.
        visual_cues:
          - id: opening-choice
            phrase: Predict which window
            targets:
              - edge-choice
            color: yellow
        hold: 1.3
  - id: pixels
    title: Brightness and arrangement tell different stories
    visual: Individual brightness cells assemble into the image. Then a uniform two-thirds patch and an edge patch
      retain the same total brightness while displaying different spatial arrangements.
    beats:
      - say: Each square stores a brightness value. Zero is dark; one is bright. The row and column tell us where that
          measurement belongs. A small window keeps neighboring pixels together.
        visual_cues:
          - id: pixel-arrivals
            phrase: Each square stores a brightness value
            targets:
              - pixel-grid
            color: blue
        hold: 0.5
      - say: Compare these two patches. Both contain the same total brightness. One is uniform, while the other has a
          boundary. Our detector needs a comparison across space to tell those arrangements apart.
        visual_cues:
          - id: equal-brightness
            phrase: Both contain the same total brightness
            targets:
              - brightness-pair
            color: cyan
        hold: 0.5
  - id: kernel
    title: Build a comparison between the two sides
    visual: Signed kernel columns appear at their spoken clauses. The same uniform and edge patches supply
      negative-left and positive-right column totals before their sums resolve.
    beats:
      - say: A filter, or kernel, is a small table of weights. Subtract the left column. Ignore the center column. Add
          the right column. These hand-chosen weights, with zero bias, measure whether the patch becomes brighter toward the right.
        visual_cues:
          - id: kernel-left
            phrase: Subtract the left column
            targets:
              - edge-kernel
            color: red
          - id: kernel-center
            phrase: Ignore the center column
            targets:
              - edge-kernel
            color: blue
          - id: kernel-right
            phrase: Add the right column
            targets:
              - edge-kernel
            color: cyan
        hold: 0.5
      - say: Apply it to the uniform patch. The left side contributes minus two, and the right contributes plus two.
          Add them and the response is zero. Equal brightness on both sides cancels.
        visual_cues:
          - id: uniform-columns
            phrase: The left side contributes minus two, and the right contributes plus two
            targets:
              - kernel-comparison
            color: cyan
          - id: uniform-result
            phrase: the response is zero.
            targets:
              - kernel-comparison
            color: green
            linger: 0.5
        hold: 0.5
      - say: Now use the edge patch with the same total brightness. Its dark left side contributes zero. Its bright
          right side contributes three. The response is three. Backpropagation computes gradients for the filter weights, and an optimizer uses those gradients to update them. This signed rule makes our example inspectable.
        visual_cues:
          - id: edge-columns
            phrase: Its dark left side contributes zero. Its bright right side contributes three
            targets:
              - kernel-comparison
            color: green
          - id: edge-result
            phrase: The response is three.
            targets:
              - kernel-comparison
            color: green
            linger: 0.5
        hold: 0.5
  - id: patch
    title: Follow one response into its map cell
    visual: Nine matched pixel-weight pairs build their products and running subtotal. The completed scalar
      travels into its exact output cell. A fully bright third patch withholds its response for the next
      prediction.
    beats:
      - say: Place the filter over the first window. Multiply each pixel by its matching weight, then add the
          products. Follow the highlighted pairs into the running sum. All nine terms belong to this one
          output position.
        visual_cues:
          - id: patch-accumulate
            phrase: Multiply each pixel by its matching weight, then add the products. Follow the highlighted pairs into
              the running sum
            targets:
              - patch-products
            color: green
        hold: 0.7
        motion_check:
          region:
            - 900
            - 380
            - 850
            - 650
          minimumChangedFraction: 0.002
      - say: The total is three. Carry that result into the first cell of the feature map. Its position records which
          image window produced it. The kernel stays the same when we move to another window.
        visual_cues:
          - id: patch-deposit
            phrase: Carry that result into the first cell
            targets:
              - patch-sum
            color: green
        hold: 0.5
      - say: Look at the third window, filled entirely with bright pixels. Predict its response using the signed
          weights. Keep the value in mind while the next sweep fills the map.
        visual_cues:
          - id: uniform-question
            phrase: Predict its response
            targets:
              - sliding-window
            color: yellow
        hold: 1.3
  - id: slide
    title: Reuse the same weights at every position
    visual: The fully bright patch earns zero, then one persistent small kernel accompanies a nine-position scan.
      Each computed scalar is deposited into its corresponding output cell.
    beats:
      - say: "The bright window gives zero: its two sides cancel. Now the window steps right, then down, and every
          response lands in the matching position. Watch the same nine weights remain beside the image
          throughout the sweep."
        visual_cues:
          - id: bright-window-result
            phrase: The bright window gives zero
            targets:
              - constructed-feature-map
            color: green
          - id: sliding-sweep
            phrase: the window steps right, then down, and every response lands in the matching position
            targets:
              - sliding-window
            color: green
        hold: 0.8
        motion_check:
          region:
            - 230
            - 330
            - 1500
            - 570
          minimumChangedFraction: 0.002
      - say: Moving one pixel at a time, with weights on adjacent pixels and no added border, only three starting rows and three starting columns fit. They produce a three-by-three feature map. Local
          connectivity limits each measurement to its patch; weight sharing lets one learned rule serve every
          valid location.
        visual_cues:
          - id: map-complete
            phrase: three-by-three feature map
            targets:
              - constructed-feature-map
            color: green
        hold: 0.5
  - id: article-crop
    title: A second explicit fixture turns a crop into four responses
    beats:
      - say: Keep the binary edge example intact. Now open the article’s separate four-by-four grayscale crop, with
          its bright central mark. Its horizontal ridge kernel has top and bottom rows minus zero point six,
          and a middle row one point one. These are supplied weights with zero bias, not a trained crack
          detector. Four minus three plus one gives two starting rows and two starting columns.
        hold: 0.6
        visual_cues:
          - id: article-crop-b1
            phrase: Keep the binary edge example intact.
            targets:
              - article-crop-construction
            color: cyan
            linger: 0.5
          - id: crop-weights
            phrase: Its horizontal ridge kernel has top and bottom rows minus zero point six, and a middle row one point
              one.
            targets:
              - article-crop-construction
            color: cyan
            linger: 0.5
      - say: Build its upper-left response from the same nine aligned owners. The row contributions are minus zero
          point one one four, plus two point one one two, and minus one point one four six. Add them to obtain
          zero point eight five two. For any fixed placement, changing one weight changes the response by its
          aligned pixel multiplied by the weight change, with every other term held fixed.
        hold: 0.6
        visual_cues:
          - id: article-crop-b2
            phrase: Build its upper-left response from the same nine aligned owners.
            targets:
              - article-crop-construction
            color: cyan
            linger: 0.5
          - id: crop-top
            phrase: minus zero point one one four
            targets:
              - article-crop-construction
            color: cyan
            linger: 0.5
          - id: crop-middle
            phrase: plus two point one one two
            targets:
              - article-crop-construction
            color: cyan
            linger: 0.5
          - id: crop-bottom
            phrase: minus one point one four six
            targets:
              - article-crop-construction
            color: cyan
            linger: 0.5
          - id: crop-sum
            phrase: Add them to obtain zero point eight five two.
            targets:
              - article-crop-construction
            color: cyan
            linger: 0.5
      - say: "Reuse that kernel over all four placements. The map is zero point eight five two, zero point seven eight
          nine, zero point eight one seven and zero point eight seven four. The bottom-right placement wins.
          PyTorch uses cross-correlation: stored weights are not flipped. Mathematical convolution flips both
          spatial axes. This symmetric ridge kernel happens to agree either way; an imported asymmetric kernel
          needs its intended orientation. Freely learned filters can absorb that flip into their coefficients,
          so the two conventions have the same representational capacity."
        hold: 0.8
        visual_cues:
          - id: article-crop-b3
            phrase: Reuse that kernel over all four placements.
            targets:
              - article-crop-construction
            color: cyan
            linger: 0.5
          - id: crop-map
            phrase: The map is zero point eight five two, zero point seven eight nine, zero point eight one seven and zero
              point eight seven four.
            targets:
              - article-crop-construction
            color: cyan
            linger: 0.5
          - id: crop-orientation
            phrase: stored weights are not flipped.
            targets:
              - article-crop-construction
            color: cyan
            linger: 0.5
    visual: A second explicit fixture turns a crop into four responses.
  - id: sharing-budget
    title: Keep output geometry fixed while untying the weights
    beats:
      - say: "A two-hundred-twenty-four square RGB image has one hundred fifty thousand five hundred twenty-eight
          input values. A dense layer with two hundred fifty-six outputs needs thirty-eight million five
          hundred thirty-five thousand four hundred twenty-four parameters, including biases. Our sixteen
          three-by-three RGB filters need four hundred thirty-two weights and sixteen biases: four hundred
          forty-eight parameters."
        hold: 0.6
        visual_cues:
          - id: sharing-budget-b1
            phrase: A two-hundred-twenty-four square RGB image has one hundred fifty thousand five hundred twenty-eight
              input values.
            targets:
              - sharing-budget-construction
            color: cyan
            linger: 0.5
          - id: dense-budget
            phrase: thirty-eight million five hundred thirty-five thousand four hundred twenty-four parameters
            targets:
              - sharing-budget-construction
            color: cyan
            linger: 0.5
          - id: conv-budget
            phrase: four hundred forty-eight parameters.
            targets:
              - sharing-budget-construction
            color: cyan
            linger: 0.5
      - say: "Those two layers have different outputs: two hundred fifty-six global dense values versus sixteen
          two-hundred-twenty-two square maps. To isolate sharing, keep the convolution’s local output geometry
          fixed and give every position a private filter bank. Forty-nine thousand two hundred eighty-four
          banks times four hundred forty-eight parameters gives twenty-two million seventy-nine thousand two
          hundred thirty-two. Tie all those banks back to one shared owner, and the count returns to four
          hundred forty-eight."
        hold: 0.6
        visual_cues:
          - id: sharing-budget-b2
            phrase: "Those two layers have different outputs: two hundred fifty-six global dense values versus sixteen
              two-hundred-twenty-two square maps."
            targets:
              - sharing-budget-construction
            color: cyan
            linger: 0.5
          - id: private-banks
            phrase: Forty-nine thousand two hundred eighty-four banks times four hundred forty-eight parameters gives
              twenty-two million seventy-nine thousand two hundred thirty-two.
            targets:
              - sharing-budget-construction
            color: cyan
            linger: 0.5
          - id: retie-banks
            phrase: Tie all those banks back to one shared owner
            targets:
              - sharing-budget-construction
            color: cyan
            linger: 0.5
          - id: retie-count
            phrase: and the count returns to four hundred forty-eight.
            targets:
              - sharing-budget-construction
            color: cyan
            linger: 0.5
      - say: Local connectivity chooses which neighboring inputs each output reads. Sharing chooses whether different
          output positions own separate parameters. Flattening itself can preserve all pixels and their
          recoverable order; the dense wiring does not enforce a reusable local detector. These parameter
          counts do not compare equal outputs or establish a speed ratio.
        hold: 0.8
        visual_cues:
          - id: sharing-budget-b3
            phrase: Local connectivity chooses which neighboring inputs each output reads.
            targets:
              - sharing-budget-construction
            color: cyan
            linger: 0.5
    visual: Keep output geometry fixed while untying the weights.
  - id: translation
    title: Move the evidence, then combine it
    visual: A faint old map retains the previous location while the input boundary and recomputed responses shift.
      A max accumulator then combines the actual cells into an unchanged scalar for this example.
    beats:
      - say: Move the boundary one pixel right. The same local comparisons now respond one column farther right. The
          old map stays faintly visible so you can follow the displacement. This corresponding movement is
          translation equivariance.
        visual_cues:
          - id: translated-edge
            phrase: Move the boundary one pixel right
            targets:
              - translated-input
            color: blue
        hold: 0.6
        motion_check:
          region:
            - 230
            - 330
            - 1500
            - 570
          minimumChangedFraction: 0.002
      - say: A global maximum keeps the largest response. Scan the actual cells into this accumulator. Both versions
          produce three here, even though their response locations differ. On a finite image, the border and
          sampling pattern still affect which comparisons exist.
        visual_cues:
          - id: max-aggregate
            phrase: Scan the actual cells into this accumulator
            targets:
              - translated-response
            color: green
        hold: 0.5
  - id: stride-padding
    title: Choose the positions the filter can visit
    visual: A stride-two scan visits four real starts. A zero border then creates a seven-by-seven input; a
      boundary patch builds a response of two. The selected marker visits additional padded positions while
      their matching map cells fill.
    beats:
      - say: Stride sets the distance between starts. Move two cells at a time. This image now permits four windows,
          giving a two-by-two output. We still use the same kernel at each selected position.
        visual_cues:
          - id: stride-scan
            phrase: Move two cells at a time
            targets:
              - stride-source-grid
            color: yellow
        hold: 0.5
      - say: Return to stride one. Add one row and column of zeros around each side. At this upper boundary, the new zeros enter the patch.
          Two bright pixels contribute plus two on the positive side, and the negative side contributes zero, so this response becomes two. The border has
          changed the calculation.
        visual_cues:
          - id: padding-build
            phrase: Add one row and column of zeros
            targets:
              - stride-source-grid
            color: cyan
          - id: boundary-calculate
            phrase: Two bright pixels contribute plus two on the positive side
            targets:
              - boundary-products
            color: yellow
        hold: 0.5
      - say: Follow the selected window around several more boundary positions, then fill the remaining map. The
          output-size rule counts these complete placements. With unit dilation, insert the image size,
          padding, kernel size and stride into the displayed formula.
        visual_cues:
          - id: padded-sweep
            phrase: Follow the selected window around several more boundary positions, then fill the remaining map
            targets:
              - stride-response-grid
            color: green
          - id: shape-rule
            phrase: output-size rule
            targets:
              - output-size-rule
            color: cyan
        hold: 0.7
        motion_check:
          region:
            - 130
            - 330
            - 1600
            - 560
          minimumChangedFraction: 0.002
  - id: shape-dilation
    title: Count starts using the complete kernel footprint
    beats:
      - say: Stride changes the gap between starts. Dilation changes the gap between weights inside one placement. A
          three-by-three kernel at dilation two still has nine weights, but spans five-by-five positions. Its
          effective span is dilation multiplied by the quantity kernel size minus one, then plus one.
        hold: 0.6
        visual_cues:
          - id: shape-dilation-b1
            phrase: Stride changes the gap between starts.
            targets:
              - shape-dilation-construction
            color: cyan
            linger: 0.5
          - id: dilate-weights
            phrase: A three-by-three kernel at dilation two still has nine weights, but spans five-by-five positions.
            targets:
              - shape-dilation-construction
            color: cyan
            linger: 0.5
      - say: For each spatial axis, add padding on both sides, subtract that effective span, divide by stride, round
          down, then add one. For equal padding on both sides, the numerator is input size plus twice the per-side padding minus dilation multiplied by the quantity kernel size minus one, minus one. For unequal sides, replace twice padding with the sum of the two padding amounts. Divide the whole numerator by stride
          before taking the floor. Incomplete windows do not create outputs. Twenty-eight positions with a
          three-wide dilation-two kernel and no padding give twenty-four outputs.
        hold: 0.6
        visual_cues:
          - id: shape-dilation-b2
            phrase: For each spatial axis, add padding on both sides, subtract that effective span, divide by stride,
              round down, then add one.
            targets:
              - shape-dilation-construction
            color: cyan
            linger: 0.5
          - id: dilated-starts
            phrase: Twenty-eight positions with a three-wide dilation-two kernel and no padding give twenty-four outputs.
            targets:
              - shape-dilation-construction
            color: cyan
            linger: 0.5
      - say: At stride one, same-size padding adds a total of dilation multiplied by the quantity kernel size minus
          one extra positions, split across the two sides. An odd total requires unequal sides. PyTorch same
          padding supports stride one. For valid padding there are no synthetic positions. Shape checks
          require positive kernel, stride and dilation, nonnegative padding, and a footprint that fits the
          padded input.
        hold: 0.8
        visual_cues:
          - id: shape-dilation-b3
            phrase: At stride one, same-size padding adds a total of dilation multiplied by the quantity kernel size minus
              one extra positions, split across the two sides.
            targets:
              - shape-dilation-construction
            color: cyan
            linger: 0.5
          - id: same-padding
            phrase: An odd total requires unequal sides.
            targets:
              - shape-dilation-construction
            color: cyan
            linger: 0.5
    visual: Count starts using the complete kernel footprint.
  - id: channels
    title: Several input channels contribute to one output
    visual: Two input-channel patches each pair with a distinct kernel. Their actual products give three and
      three, which accumulate into six. A second filter negates the first channel kernel and yields minus
      three plus three equals zero.
    beats:
      - say: A color image has several input channels. Our small example uses two. One output filter has a kernel for
          each channel. Compute each patch sum, then add the contributions. Here, three plus three gives one
          output value of six. We use zero bias.
        visual_cues:
          - id: channel-first
            phrase: Compute each patch sum
            targets:
              - channel-first
            color: blue
          - id: channel-second
            phrase: then add the contributions
            targets:
              - channel-second
            color: cyan
          - id: channel-sum
            phrase: three plus three gives one output value of six
            targets:
              - channel-sum-rule
            color: green
        hold: 0.5
      - say: A second output filter gets its own weights. Negate the first channel kernel and retain the second. The
          channel contributions become minus three and plus three, so this filter gives zero at the same
          position. Multiple filters create multiple output maps.
        visual_cues:
          - id: second-filter
            phrase: Negate the first channel kernel and retain the second
            targets:
              - channel-first
            color: pink
          - id: second-channel-sum
            phrase: this filter gives zero
            targets:
              - channel-sum-rule
            color: green
        hold: 0.5
  - id: grouped-connectivity
    title: One output sums only its declared input-channel group
    beats:
      - say: "With groups one, each output filter sees all input channels. Its stored shape is output channels by
          input channels by kernel height by kernel width. Add one bias per output filter. A batch keeps its
          own axis: batch, input channels, height, width becomes batch, output channels, output height, output
          width. This describes axis order, not a required physical memory layout."
        hold: 0.6
        visual_cues:
          - id: grouped-connectivity-b1
            phrase: With groups one, each output filter sees all input channels.
            targets:
              - grouped-connectivity-construction
            color: cyan
            linger: 0.5
      - say: Groups divides the input and output channels into separate connected sets. Each filter sees input
          channels divided by groups, and both channel counts must divide evenly by the group count. With four
          inputs, six outputs, two groups and three-by-three weights, each output reads two channels. Six
          times two times nine, plus six biases, gives one hundred fourteen parameters. Disconnecting the
          other group is a real change in the function.
        hold: 0.6
        visual_cues:
          - id: grouped-connectivity-b2
            phrase: Groups divides the input and output channels into separate connected sets.
            targets:
              - grouped-connectivity-construction
            color: cyan
            linger: 0.5
          - id: disconnect-groups
            phrase: Each filter sees input channels divided by groups
            targets:
              - grouped-connectivity-construction
            color: cyan
            linger: 0.5
          - id: group-count
            phrase: Six times two times nine, plus six biases, gives one hundred fourteen parameters.
            targets:
              - grouped-connectivity-construction
            color: cyan
            linger: 0.5
      - say: In general the parameter count is output channels multiplied by input channels divided by groups,
          multiplied by kernel height and width, then plus output biases when enabled. Spatial size, stride
          and dilation change placements, not the number of stored coefficients in this layer. Multiple
          outputs mean separate filter stacks; summing their channels does not replace the output-channel
          axis.
        hold: 0.8
        visual_cues:
          - id: grouped-connectivity-b3
            phrase: In general the parameter count is output channels multiplied by input channels divided by groups,
              multiplied by kernel height and width, then plus output biases when enabled.
            targets:
              - grouped-connectivity-construction
            color: cyan
            linger: 0.5
          - id: parameter-owners
            phrase: Spatial size, stride and dilation change placements, not the number of stored coefficients in this
              layer.
            targets:
              - grouped-connectivity-construction
            color: cyan
            linger: 0.5
    visual: One output sums only its declared input-channel group.
  - id: field-jump
    title: Build a later footprint from its earlier owners
    beats:
      - say: A later activation reads earlier activations, so track their original pixel owners. Start with field one
          and jump one. Field is the side length of the theoretical input footprint. Jump is the spacing
          between neighboring activation centers in input pixels. Add dilation times the quantity kernel size
          minus one, multiplied by the old jump, to the field. Multiply that old jump by stride for the new
          jump.
        hold: 0.6
        visual_cues:
          - id: field-jump-b1
            phrase: A later activation reads earlier activations, so track their original pixel owners.
            targets:
              - field-jump-construction
            color: cyan
            linger: 0.5
      - say: The article’s two three-by-three stride-one convolutions grow the field from one to three to five. A
          two-by-two stride-two pool grows it to six and doubles the jump to two. The next three-by-three
          convolution adds four input pixels, reaching field ten with jump two. Its spatial map sides are two
          hundred twenty-two, two hundred twenty, one hundred ten and one hundred eight, all using valid
          placements.
        hold: 0.6
        visual_cues:
          - id: field-jump-b2
            phrase: The article’s two three-by-three stride-one convolutions grow the field from one to three to five.
            targets:
              - field-jump-construction
            color: cyan
            linger: 0.5
          - id: field-convs
            phrase: grow the field from one to three to five.
            targets:
              - field-jump-construction
            color: cyan
            linger: 0.5
          - id: field-pool
            phrase: A two-by-two stride-two pool grows it to six and doubles the jump to two.
            targets:
              - field-jump-construction
            color: cyan
            linger: 0.5
          - id: field-last
            phrase: reaching field ten with jump two.
            targets:
              - field-jump-construction
            color: cyan
            linger: 0.5
          - id: field-three
            phrase: one to three
            targets:
              - field-jump-construction
            color: green
            linger: 0.5
          - id: field-five
            phrase: to five.
            targets:
              - field-jump-construction
            color: green
            linger: 0.5
