scenes:
  - id: intro
    title: How can random noise become a picture?
    visual: A small table silhouette dissolves through seeded Gaussian corruption, then freezes beside a
      cloud of particles. Three density islands emerge as those particles follow a computed score
      field. Introduce the image mechanism and the exact two-dimensional teaching simulation
      separately.
    beats:
      - say: Ask a computer for a wooden table in soft light. Its first canvas looks like static. A
          diffusion model turns that randomness into structure through repeated learned predictions.
          How can it know which way to move?
        hold: 0.6
        visual_cues:
          - id: intro-beat-1-focus-1
            phrase: A diffusion model turns that randomness into structure through repeated learned predictions
            targets:
              - intro-intro-tile
            color: cyan
            linger: 0.65
          - id: df-intro-0
            phrase: Ask a computer for a wooden table in soft light. Its first canvas looks like static. A
              diffusion model turns that randomness into structure through repeated learned
              predictions. How can it know which way to move?
            targets:
              - df-intro-operation
            linger: 0.35
      - say: We'll start from one brightness value, then watch a probability distribution take shape.
          Our particle simulation numerically integrates a probability-flow equation with an
          analytic toy score, making the movement behind image generation visible.
        hold: 0.6
        visual_cues:
          - id: intro-beat-2-focus-1
            phrase: Our particle simulation numerically integrates a probability-flow equation with an
              analytic toy score
            targets:
              - intro-distribution
            color: cyan
            linger: 0.65
          - id: intro-beat-2-focus-2
            phrase: We'll start from one brightness value, then watch a probability distribution take shape
            targets:
