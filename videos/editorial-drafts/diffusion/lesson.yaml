  - id: reverse-posterior
    title: Unknown clean data adds uncertainty to the reverse step
    visual: Two equally likely clean endpoints−1/+1 retain distinct conditional posterior bells
      at−.471/+ .471 withvariance1/3. Their mixture is built by adding equal weights; the total
      variance becomes5/9 while the mean is0. The individual bells persist under the combined
      density so one Gaussian cannot silently substitute for the mixture.
    beats:
      - say: Knowing a noisy observation alone leaves many possible clean causes. DDPM can calculate a
          Gaussian posterior when both the noisy observation and clean training value are supplied.
          At generation time the clean value is unknown, so the reverse distribution averages over
          those possibilities. A learned Gaussian transition approximates that generally more
          complicated marginal.
        hold: 0.7
        visual_cues:
          - id: df-reverse-posterior-0
            phrase: Knowing a noisy observation alone leaves many possible clean causes. DDPM can calculate a
              Gaussian posterior when both the noisy observation and clean training value are
              supplied. At generation time the clean value is unknown, so the reverse distribution
              averages over those possibilities. A learned Gaussian transition approximates that
              generally more complicated marginal.
            targets:
              - df-reverse-posterior-operation
            linger: 0.35
      - say: Use two equally likely clean values, negative one and positive one. Supply previous alpha bar
          one half, current beta one half and observed value zero. Current alpha bar is one quarter.
          The two conditional posterior means are negative and positive square root two divided by
          three; each conditional variance is one third. Symmetry gives both possibilities equal
          weight.
        hold: 0.7
        visual_cues:
          - id: df-reverse-posterior-1
            phrase: Use two equally likely clean values, negative one and positive one. Supply previous alpha
              bar one half, current beta one half and observed value zero. Current alpha bar is one
              quarter. The two conditional posterior means are negative and positive square root two
              divided by three; each conditional variance is one third. Symmetry gives both
              possibilities equal weight.
            targets:
              - df-reverse-posterior-operation
            linger: 0.35
          - id: df-posterior-components
            phrase: each conditional variance is one third
            targets:
              - df-reverse-posterior-result
            linger: 0.35
      - say: The mixture mean is zero. Total variance is the average within-component variance plus the
          variance of the component means. Here one third plus two ninths gives five ninths, about
          point five five six. Choosing either component would erase uncertainty about which clean
          value occurred. Real image distributions make that averaging difficult; the two-component
          calculation makes the missing information visible.
        hold: 0.7
        visual_cues:
          - id: df-reverse-posterior-2
            phrase: The mixture mean is zero. Total variance is the average within-component variance plus the
              variance of the component means. Here one third plus two ninths gives five ninths,
              about point five five six. Choosing either component would erase uncertainty about
              which clean value occurred. Real image distributions make that averaging difficult;
