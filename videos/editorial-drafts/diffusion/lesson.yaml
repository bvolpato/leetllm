    title: Count predictions before sizing the two routes
    visual: The same admitted job keeps tenant, request hash, variant seed and route. Preview20×4×6 and
      quality2×4×50×2 construct separate offered-work counters480/800, followed by a
      supplied120prediction/s capacity with75% planning ceiling. A bounded preview queue retains a
      reserved worker while the quality queue waits; first released variant includes output checks.
    beats:
      - say: Our proposed product creates synthetic design backgrounds and previews. A job request
          supplies prompt, negative prompt, dimensions, variant count, route, seed and an
          idempotency key. It returns a job identity and accepted versions. Status and asset reads
          require tenant authorization. Our proposed preview target is a first released asset below
          two seconds at the ninety-fifth percentile, including queue and checks. The quality-job
          target is complete, review, or failed within thirty seconds, with a separate human-review
          deadline. Both targets require end-to-end validation.
