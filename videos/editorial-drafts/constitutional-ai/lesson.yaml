    visual: Three successive user/assistant pairs remain in one transcript. The first two replies are background;
      the third synthetic assistant disclosure ends the run. A user-quoted marker is then compared separately.
    beats:
      - say: "A multi-turn runner sends accumulated history to the target and judges each new assistant turn. Our
          fixed fixture first discusses unsafe requests, then asks for public policy, then requests a synthetic
          disclosure. The target’s third reply contains the fixture disclosure marker. Stop on that confirmed
          violation: turn three, with six stored messages. Do not restart each turn as an isolated request.
