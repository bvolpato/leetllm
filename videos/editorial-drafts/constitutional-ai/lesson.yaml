  - id: defense-effects
    title: Enforce the boundary before data or effects escape
    visual: The same private record remains behind IAM, while public runbook bytes pass. A tool
      proposal, denied execution and delivered answer have separate result bins; output bytes wait
      in a checked buffer.
    beats:
      - say: Training cannot replace application authorization. Authenticate the caller, authorize the
          particular record and action, and check the destination before retrieval or side effects.
          Retrieved emails and documents remain untrusted instruction sources. A hazard classifier
          such as Llama Guard classifies its taxonomy; it does not issue incident-record
          entitlements. An allowed record can still have an unauthorized recipient. Input checks,
          aligned behavior, output checks and restricted telemetry provide complementary coverage.
        hold: 0.8
        visual_cues:
          - id: defense-effects-1
            phrase: check the destination before retrieval
            targets:
              - effect-boundary
          - id: effect-check
            phrase: authorize the particular record and action
            targets:
              - effect-boundary
          - id: effect-destination
            phrase: check the destination before retrieval
            targets:
              - effect-boundary
      - say: Check output before releasing the relevant bytes. A late streaming detection cannot retract a
          secret already delivered, and incremental checks need cross-chunk context. Anthropic’s
          January nine, twenty twenty-six classifier report describes a cheap activation probe
          escalating suspicious conversations to a stronger classifier. This is an inference
          safeguard distinct from policy training; reported robustness belongs to its tested setup.
          If our model proposes the denied read, record a model behavior issue, the blocked
          application action and no delivered disclosure as separate outcomes.
        hold: 0.8
        visual_cues:
          - id: defense-effects-2
            phrase: as separate outcomes
            targets:
              - separate-effects
          - id: output-buffer
            phrase: Check output before releasing the relevant bytes
            targets:
              - separate-effects
          - id: effect-proposal
            phrase: If our model proposes the denied read
            targets:
              - separate-effects
