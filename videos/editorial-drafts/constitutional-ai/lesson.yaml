  - id: attack-budget
    title: An attempt budget changes the question
    visual: The same toy ten-percent attempt success probability feeds two explicit dependence models.
      Ten independent trials contrast with ten identical deterministic outcomes.
    beats:
      - say: Task-level success after a search budget differs from success per query. For a mathematical
          illustration only, suppose independent attempts each succeed with probability point one.
          The chance of at least one success in k attempts is one minus point nine to the kth power.
          One attempt gives ten percent; two give nineteen percent; ten give about sixty-five point
          one percent.
        hold: 0.8
        visual_cues:
          - id: attack-budget-1
            phrase: ten give about sixty-five point one percent
            targets:
              - independent-budget
          - id: budget-one
            phrase: One attempt gives ten percent
            targets:
              - independent-budget
          - id: budget-two
            phrase: two give nineteen percent
            targets:
              - independent-budget
      - say: Now repeat the same deterministic outcome on every attempt for a task. Across tasks the success
          rate stays ten percent, despite ten repeats. An adaptive attacker follows another process
          because later probes depend on earlier responses. Report tasks, attempts used, turn
          budgets, stopping rules and adaptation. Compare candidates under matched budgets instead
          of converting a measured query rate with an independence assumption.
        hold: 0.8
        visual_cues:
          - id: attack-budget-2
            phrase: success rate stays ten percent
            targets:
              - dependent-budget
