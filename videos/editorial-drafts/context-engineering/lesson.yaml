  - id: recovery-and-evaluator
    title: A restart must preserve execution uncertainty and independent checks
    visual: Keep the generator’s cause proposal separate from the evaluator’s criteria. Apply duplicate operation
      keys and stale fencing tokens at the protected resource, then preserve an unresolved response state
      instead of marking success.
    beats:
      - say: For a cause-analysis task, agree that claims cite checked evidence and address alternatives, the
          disproven lock claim is absent, and rollback remains a proposal. A separate evaluator checks those
          criteria. Deterministic validation can enforce structure and forbidden actions, while semantic
          review examines support. An independent model can also be wrong; a citation alone does not establish
          causality.
        hold: 0.7
        visual_cues:
          - id: ce-recovery-and-evaluator-1
            phrase: For a cause-analysis task, agree that claims cite checked evidence and address alternatives, the
              disproven lock claim is absent, and rollback remains a proposal
            targets:
              - ce-recovery-and-evaluator-mechanism
            color: cyan
            linger: 0.4
      - say: Prevent duplicate effects with an operation key enforced at the tool boundary. Use a fencing token
          checked by the protected resource to reject a generation older than the newest it has observed.
          That comparison alone cannot detect lease expiry before a newer generation arrives. To stop writes
          immediately after expiry, the resource must also enforce current lease authority or invalidate the
          accepted generation at that boundary. A lease timestamp written only in a prompt cannot stop
          another process. Keep unknown outcomes explicit until the external system confirms their state.
        hold: 0.7
        visual_cues:
          - id: ce-recovery-and-evaluator-2
            phrase: Prevent duplicate effects with an operation key enforced at the tool boundary
            targets:
              - ce-recovery-and-evaluator-mechanism
            color: cyan
            linger: 0.4
          - id: ce-fenced-resource
            phrase: a fencing token checked by the protected resource
            targets:
              - ce-recovery-and-evaluator-mechanism
            color: cyan
            linger: 0.4
      - say: Restrict who can issue receipts and change task status. Append-only storage can retain history but still
          allow a forged new entry if writers are untrusted. Recheck live state when freshness matters. A
          resumable summary is useful orientation; trustworthy continuation requires the actual state,
          evidence and resource-bound execution rules.
        hold: 0.7
        visual_cues:
          - id: ce-recovery-and-evaluator-3
            phrase: Restrict who can issue receipts and change task status
            targets:
              - ce-recovery-and-evaluator-mechanism
            color: green
            linger: 0.4
