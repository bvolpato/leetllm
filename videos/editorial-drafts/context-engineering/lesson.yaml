  - id: summary-authority
    title: Compression must preserve uncertainty and pending external state
    visual: Retain a scoped negative finding while a source-derived malicious instruction remains tagged as data.
      Move an uncertain external operation into a typed execution record rather than a summary sentence.
    beats:
      - say: A useful summary records observations, hypotheses, rejected possibilities, source identities, unresolved
          questions and next checks. Authentication suspected is different from authentication confirmed as
          the cause. Keep negative findings with their time window. Token-level compression such as LLMLingua
          uses a smaller model and a budget controller, but its historical results do not guarantee
          preservation on this investigation.
        hold: 0.7
        visual_cues:
          - id: ce-summary-authority-1
            phrase: A useful summary records observations, hypotheses, rejected possibilities, source identities,
              unresolved questions and next checks
            targets:
              - ce-summary-authority-mechanism
            color: cyan
            linger: 0.4
      - say: Summarization can carry an injected instruction into later memory. Label the summary as source-derived
          history, preserve its provenance, and keep policy authority separate. A generated field named
          verified has meaning only through the host check that set it. Neither a summary nor a retrieved
          procedure can grant new tool permissions.
        hold: 0.7
        visual_cues:
          - id: ce-summary-authority-2
            phrase: Summarization can carry an injected instruction into later memory
            targets:
              - ce-summary-authority-mechanism
            color: cyan
            linger: 0.4
      - say: "Keep pending external operations in execution state: exact payload, operation key, last confirmed result
          and remaining uncertainty. A lost response after rollback requested does not prove whether the write
          committed. Look up or reconcile the operation through its authorized boundary before deciding to
          retry. A prose recap cannot supply idempotency or settle an unknown outcome."
        hold: 0.7
        visual_cues:
