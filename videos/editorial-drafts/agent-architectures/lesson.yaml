  - id: tainted-interface
    title: A schema-valid request still meets host policy
    visual: A hostile CI sentence retains the evidence stripe. Host-owned tool-kind and grant records route a read
      or hold an exact patch change; a model-supplied high_risk field is rejected as extra metadata.
    beats:
      - say: CI logs and file contents are untrusted evidence. Preserve their origin and trust on derived summaries.
          An unflagged result does not become authority. Classify reads and writes in a host-owned tool
          registry, not a high-risk flag supplied by the model. A plan item saying open patch still needs
          independent authorization.
        hold: 0.7
        visual_cues:
          - id: aa-tainted-interface-0
