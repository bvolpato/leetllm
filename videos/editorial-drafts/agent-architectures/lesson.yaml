scenes:
  - id: subject-intro
    title: Let a new fact change the route
    visual: An afternoon museum plan meets a closed-gallery observation and branches toward another venue before
      forming a recommendation.
    beats:
      - say: You ask for a museum visit that finishes by five this afternoon. The Art Museum’s gallery is closed
          for repairs. Other galleries may still be open. In this example, the assistant chooses another
          venue, checks its hours and finds a journey that leaves enough time inside.
        hold: 0.65
        visual_cues:
          - id: subject-intro-b1-1
            phrase: closed for repairs
            targets:
              - closure-notice
            linger: 0.45
          - id: intro-deadline
            phrase: finishes by five this afternoon
            targets:
              - visit-task
            color: cyan
            linger: 0.4
      - say: We will follow that visit from the first lookup to a concrete recommendation. One-step feedback changes
          the next action as results arrive. An explicit plan keeps the dependencies visible, so a cancelled
          train refreshes the journey while valid museum hours stay useful.
        hold: 0.9
        visual_cues:
          - id: subject-intro-b2-1
            phrase: next action
            targets:
              - alternative-venue
            linger: 0.45
  - id: control-contract
    title: Separate the policy, state and executor
    visual: The persistent museum task and receipts remain on a state board. One next-move token belongs either to
      coded branching or a model, while a host-owned dispatch boundary stays separate.
    beats:
      - say: An agent architecture allocates decisions. State records what is known; a policy proposes a next move;
          the runtime validates and dispatches it; the returned observation updates state. A written plan and
          long-term memory are optional. A model produces tokens, while application code performs any
          requested external effect.
        hold: 0.7
        visual_cues:
          - id: aa-control-contract-0
            phrase: An agent architecture allocates decisions. State records what is known; a policy proposes a next move;
              the runtime validates and dispatches it; the returned observation updates state. A written plan
              and long-term memory are optional. A model produces tokens, while application code performs any
              requested external effect.
            targets:
              - aa-control-contract-mechanism
            color: cyan
            linger: 0.4
          - id: control-propose
            phrase: a policy proposes a next move
            targets:
              - aa-control-contract-mechanism
            color: cyan
            linger: 0.4
          - id: control-dispatch
            phrase: runtime validates and dispatches it
            targets:
              - aa-control-contract-mechanism
            color: cyan
            linger: 0.4
          - id: control-update
            phrase: returned observation updates state
            targets:
              - aa-control-contract-mechanism
            color: cyan
            linger: 0.4
      - say: A workflow can branch, retry and loop under rules written in code. Anthropic’s December
          twenty-twenty-four definitions call a system an agent when a model dynamically directs its process
          and tool use. Keep the simplest control rules that solve the task. Extra model calls can add cost
          and latency; compare complete systems on the same tasks.
        hold: 0.7
        visual_cues:
          - id: aa-control-contract-1
            phrase: A workflow can branch, retry and loop under rules written in code. Anthropic’s December
              twenty-twenty-four definitions call a system an agent when a model dynamically directs its
              process and tool use. Keep the simplest control rules that solve the task. Extra model calls can
              add cost and latency; compare complete systems on the same tasks.
            targets:
              - aa-control-contract-mechanism
            color: cyan
            linger: 0.4
      - say: The museum visit is our running illustrated task. The article also executes local release-investigation
          fixtures for R eighteen forty-two. We will label those separate fixtures as we open their control
          mechanisms. Their policies and tools are scripted; none of these runs measures a real model’s
          planning quality or performs a deployment.
        hold: 0.7
        visual_cues:
          - id: aa-control-contract-2
            phrase: The museum visit is our running illustrated task. The article also executes local
              release-investigation fixtures for R eighteen forty-two. We will label those separate fixtures
