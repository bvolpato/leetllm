  - id: state-record
    title: Separate a task from evidence about the world
    visual: A task card remains stable while venue-bound hours and transit observations enter a growing state
      ledger.
    beats:
      - say: "The task is stable: recommend an afternoon visit and finish it by five. Finishing exactly at five
          meets that deadline. Our observations are changing. Each returned record names the venue and visit
          date, so the assistant can connect a statement about opening hours to the place it is considering."
        hold: 0.65
        visual_cues:
          - id: state-record-b1-1
            phrase: task is stable
            targets:
              - stable-task
            linger: 0.45
      - say: A request to inspect the hours has yet to establish anything about the museum. The completed
          response enters the ledger with its call identity, venue and visit day. That distinction gives the
          next decision something checkable to use. The visit day identifies when the visit applies. A
          retrieval timestamp would record when the lookup ran. Production freshness checks need a defined
          validity policy, using appropriate retrieval times, source observation times, expiry information
          or version checks.
        hold: 0.65
        visual_cues:
          - id: state-record-b2-1
            phrase: completed response
            targets:
              - observation-ledger
            linger: 0.45
          - id: receipt-call
            phrase: call identity, venue and visit day
            targets:
              - observation-ledger
            color: cyan
            linger: 0.4
      - say: For this fixture, the source observations describe today’s visit. A later decision can keep an hours
          receipt that still applies and replace a travel receipt whose train has been cancelled.
        hold: 0.9
        visual_cues:
          - id: state-record-b3-1
            phrase: hours receipt
            targets:
              - observation-ledger
            linger: 0.45
  - id: react-loop
    title: Choose, act, observe, then choose again
    visual: A four-node feedback loop moves a request through a runtime gate, an external lookup, and a linked
      observation.
    beats:
      - say: Follow request hours seventeen for the Art Museum. The host admits the lookup, and the hours service
          returns a closure notice. Watch that labeled observation travel back into the agent’s state. It
          changes the useful next action.
        hold: 0.65
        motion_check:
          region:
            - 130
            - 300
            - 1660
            - 620
          minimumChangedFraction: 0.002
        visual_cues:
          - id: react-loop-b1-1
            phrase: request hours seventeen
            targets:
              - hours-request
            linger: 0.45
          - id: react-loop-b1-2
            phrase: observation travel back
            targets:
              - identified-packet
            linger: 0.45
      - say: "The agent now chooses to inspect the History Museum. This is the feedback idea used by ReAct: an action
          produces an observation, and that observation informs the next choice. We can inspect those requests
          and completed results through the observable interface."
        hold: 0.9
        visual_cues:
          - id: react-loop-b2-1
            phrase: observation, and
            targets:
              - observation-ledger
            linger: 0.45
  - id: react-research
    title: Keep historical comparisons attached to their controls
    visual: The actual ALFWorld best/average prompt categories build separate bars; an Act control keeps
      observation receipts while its explicit thought slots are absent.
    beats:
      - say: The ReAct paper interleaves Thought, Action and Observation. Its reasoning text can be sparse. The host
          can expose validated requests, results and bounded decision notes without requiring a private
          reasoning trace. A fluent rationale is not evidence that a tool actually ran or that the rationale
          faithfully reports internal computation.
        hold: 0.7
        visual_cues:
          - id: aa-react-research-0
            phrase: The ReAct paper interleaves Thought, Action and Observation. Its reasoning text can be sparse. The
              host can expose validated requests, results and bounded decision notes without requiring a
              private reasoning trace. A fluent rationale is not evidence that a tool actually ran or that the
              rationale faithfully reports internal computation.
            targets:
              - aa-react-research-mechanism
            color: cyan
            linger: 0.4
      - say: In the paper’s ALFWorld experiments, the best of six ReAct prompts reached seventy-one percent success
          and their average was fifty-seven. The Act control, with reasoning steps removed but observations
