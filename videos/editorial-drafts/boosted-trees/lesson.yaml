    title: Construct local credit in its stated output units
    visual: Two feature tokens enter both coalition orders; their marginal increments are averaged and recombined with the base, then the same raw-logit sum passes through a sigmoid.
    beats:
      - say: Global gain, split count and impurity decrease summarize different properties and can favor features with many split candidates or redistribute credit among correlated inputs. They do not give the signed contribution to this particular job. Define a local explanation game with a background population, a missing-feature convention and a chosen model output before computing Shapley credit.
