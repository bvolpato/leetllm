            color: blue
            linger: 0.4
          - id: shap-first-order
            phrase: In order A then B
            targets:
              - attribution-game-model
            color: yellow
            linger: 0.35
          - id: shap-second-order
            phrase: In order B then A
            targets:
              - attribution-game-model
            color: yellow
            linger: 0.35
          - id: shap-average
            phrase: Average A's two and four to get three
            targets:
              - attribution-game-model
            color: yellow
            linger: 0.35
