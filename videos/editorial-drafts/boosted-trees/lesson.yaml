scenes:
  - id: opening
    title: A score becomes an operational decision
    visual: A job card moves from its known signals to a risk score, then a threshold directs an alert to an operator.
    beats:
      - say: At nine in the morning, a training job enters a busy cluster. The scheduler sees its heartbeat, input size, backlog, and priority. It must decide whether to step in before the deadline, while the final outcome will arrive hours later.
        hold: 0.55
        visual_cues:
          - id: opening-beat-1-focus-1
            phrase: The scheduler sees its heartbeat
            targets:
              - opening-object-heartbeat-backlog-priority-1
            color: blue
            linger: 0.6
          - id: opening-beat-1-focus-2
            phrase: At nine in the morning
            targets:
              - opening-object-heartbeat-backlog-priority-1
            color: blue
            linger: 0.6
      - say: A gradient-boosted tree builds a score by adding small decision trees in sequence. Each new tree learns a correction from the current model's remaining loss. A separate policy turns the final score into an alert, so both learning and decision costs matter.
        hold: 0.6
        visual_cues:
          - id: opening-beat-2-focus-1
            phrase: A gradient-boosted tree builds a score by adding
            targets:
              - opening-object-snapshot-score-null-risk-score-risk-score-snapshot-2
            color: blue
            linger: 0.6
          - id: opening-beat-2-focus-2
            phrase: A separate policy turns the final score into an alert
            targets:
              - opening-object-alert-the-operator-3
            color: blue
            linger: 0.6
      - say: We will trace one tree correction by hand, then follow a small scheduler study from earlier months to a later holdout. The study shows why time, error costs, and a frozen threshold belong beside the model.
        hold: 0.65
        visual_cues:
          - id: opening-beat-3-focus-1
            phrase: We will trace one tree correction by hand
            targets:
              - opening-object-heartbeat-backlog-priority-1
            color: blue
            linger: 0.6
  - id: clock
    title: Give every month one job
    visual: Job rows move from January through March into fitting, April into model and policy selection, and May into a single frozen evaluation.
    beats:
      - say: First, give the calendar a job. January through March fit the trees. The learner can use those rows to discover splits and leaf corrections, because those are the historical examples available to model fitting.
        hold: 0.55
        visual_cues:
          - id: clock-beat-1-focus-1
            phrase: The learner can use those rows to discover splits and leaf corrections
            targets:
              - clock-object-rows-missed-deadlines-6
            color: blue
            linger: 0.6
          - id: clock-beat-1-focus-2
            phrase: First
            targets:
              - clock-object--5
            color: blue
            linger: 0.6
      - say: April is the later validation month. It selects the number of trees and the alert threshold. Keeping both choices together matters because the threshold is evaluated on scores from the selected model.
        hold: 0.6
        visual_cues:
          - id: clock-beat-2-focus-1
            phrase: April is the later validation month
            targets:
              - clock-object--5
            color: blue
            linger: 0.6
      - say: May is held back for a final check of that frozen candidate. The earlier months supply training examples, April guides the choices, and May gives the candidate a later test. Features and labels also need to respect each job's decision time.
        hold: 0.7
        visual_cues:
          - id: clock-beat-3-focus-1
            phrase: May is held back for a final check of that frozen candidate
            targets:
              - clock-object--5
            color: blue
            linger: 0.6
  - id: eligible-signals
    title: Make every input and label available in time
    visual: The same job row carries decision,feature-arrival and label-arrival clocks; a late feature and unfinished label are removed before a NaN traverses a trained fallback branch.
    beats:
      - say: Trees are a candidate for a measured tabular baseline. The twenty twenty-two benchmark discussed here studied medium-sized datasets around ten thousand rows. Later Tab P F N work studied a defined small-data regime. Neither establishes a permanent winner. In our synthetic fixture, large model means input size at least nine hundred gigabytes, not an independently measured model size.
        hold: 0.6
        visual_cues:
          - id: eligible-signals-step-1
            phrase: Trees are a candidate for a measured tabular baseline
            targets:
              - eligible-signals-model
            color: blue
            linger: 0.4
      - say: A monthly split is only the outer clock. At each historical decision, remove features that arrived afterward, and require a completed label before the fitting cutoff. A March job still running on April first cannot provide its final outcome to that retraining run. Linked incident rows also need a grouping or purging rule at the boundary. The fixture assumes these conditions; it does not implement the timestamp joins.
        hold: 0.6
        visual_cues:
          - id: eligible-signals-step-2
            phrase: A monthly split is only the outer clock
            targets:
              - eligible-signals-model
            color: blue
            linger: 0.4
          - id: eligibility-cutoff
            phrase: remove features that arrived afterward
            targets:
              - eligible-signals-model
            color: yellow
            linger: 0.35
      - say: Follow a missing heartbeat through an estimator contract. The classic classifier used here rejects a NaN. The scikit-learn histogram gradient boosting classifier can learn a missing direction; when that feature had no missing training rows, its documented fallback is the child with more samples. Twelve training rows on the left and five on the right therefore send a new NaN left. Accepted input is not evidence of quality during an outage. Fit any imputer on training rows, and validate unknown categories separately.
        hold: 0.8
        visual_cues:
          - id: eligible-signals-step-3
            phrase: Follow a missing heartbeat through an estimator contract
            targets:
              - eligible-signals-model
            color: green
            linger: 0.4
          - id: eligibility-nan
            phrase: Twelve training rows on the left and five on the right therefore send a new NaN left
            targets:
              - eligible-signals-model
            color: yellow
            linger: 0.35
  - id: residual
    title: A tree fits the remaining error
    visual: Three actual delays connect to an initial prediction of six hours. Signed residuals split into a shared two-row leaf and a separate large-model leaf, then a quarter-sized correction moves the predictions.
    beats:
      - say: For a transparent first step, predict delay hours for three jobs with a starting value of six. Their actual delays are two, eight, and twenty hours. Subtract the prediction from each outcome to reveal what the current model leaves behind.
        hold: 0.55
        visual_cues:
          - id: residual-beat-1-focus-1
            phrase: For a transparent first step
            targets:
              - residual-simulation-7
            color: blue
            linger: 0.6
          - id: residual-beat-1-focus-2
            phrase: predict delay hours for three jobs with a starting value of six
            targets:
              - residual-object-start-top-8
            color: blue
            linger: 0.6
      - say: The residuals are minus four, plus two, and plus fourteen. Suppose a shallow tree groups the first two jobs and gives the large-model job its own leaf. The average correction is minus one for the shared leaf and plus fourteen for the other.
        hold: 0.65
        visual_cues:
          - id: residual-beat-2-focus-1
            phrase: The residuals are minus four, plus two, and plus fourteen.
            targets:
              - residual-simulation-7
            color: blue
            linger: 0.6
          - id: residual-beat-2-focus-2
            phrase: the first two jobs and gives the large-model
            targets:
              - residual-object-large-model-row-14
            color: blue
            linger: 0.6
          - id: gbt-residual-leaf-means
            phrase: The average correction is minus one for the shared leaf and plus fourteen for the other.
            targets:
              - residual-object-snapshot-corrections-mean-residual-snapshot-correc-15
            color: cyan
            linger: 0
      - say: With a learning rate of one quarter, each leaf contributes only a quarter of its proposed move. The new predictions become five point seven five, five point seven five, and nine point five. Mean squared error falls from seventy-two to about forty-three point one three hours squared. The second job gets worse because it shares a leaf with the first; average improvement does not improve every row.
        hold: 0.75
        motion_check:
          region:
            - 235
            - 320
            - 1480
            - 650
          minimumChangedFraction: 0.002
        visual_cues:
          - id: residual-beat-3-focus-1
            phrase: With a learning rate of one quarter
            targets:
              - residual-simulation-7
            color: blue
            linger: 0.6
          - id: residual-beat-3-focus-2
            phrase: Mean squared error falls from seventy-two to about
            targets:
              - residual-simulation-7
              - residual-current-mse
            color: blue
            linger: 0.6
          - id: residual-new-predictions
            phrase: With a learning rate of one quarter, each leaf contributes only a quarter of its proposed move
            targets:
              - residual-simulation-7
            color: green
            linger: 0.3
  - id: classification
    title: Classification trees move a log-odds score
    visual: Three rows start at probability one half. Their binary labels set opposite loss-gradient directions; a sigmoid maps the changing additive logit back into probability.
    beats:
      - say: The scheduler predicts a label, so the classifier works with a different quantity from delay hours. Its trees add to a raw score called the logit. A sigmoid converts that score to a probability between zero and one. Compute the sigmoid as one divided by the quantity one plus the exponential of the negative logit.
        hold: 0.55
        visual_cues:
          - id: classification-beat-1-focus-1
            phrase: The scheduler predicts a label
            targets:
              - classification-origin
            color: blue
            linger: 0.6
          - id: classification-beat-1-focus-2
            phrase: Its trees add to a raw score called the logit
            targets:
              - classification-object-trees-add-to-z-sigmoid-reads-p-26
            color: blue
            linger: 0.6
      - say: At a logit of zero, the probability is one half. For binary log loss, the derivative with respect to the logit is probability minus the observed label. A missed job pushes the score upward; a job that finishes on time pushes it downward.
        hold: 0.65
        visual_cues:
          - id: classification-beat-2-focus-1
            phrase: At a logit of zero
            targets:
              - classification-simulation-22
            color: blue
            linger: 0.6
      - say: The signs describe a local correction direction. A fitted classification tree also chooses partitions and loss-aware leaf values, then adds a shrunken update to the ensemble. The regression residual example gives the intuition; this gradient supplies the classification-specific signal.
        hold: 0.7
        visual_cues:
          - id: classification-beat-3-focus-1
            phrase: A fitted classification tree also chooses partitions and loss-aware leaf values
            targets:
              - classification-fitted-tree
            color: blue
            linger: 0.6
          - id: classification-beat-3-focus-2
            phrase: The signs describe a local correction direction
            targets:
              - classification-simulation-22
            color: blue
            linger: 0.6
          - id: classification-tree-update
            phrase: then adds a shrunken update to the ensemble
            targets:
              - classification-fitted-tree
              - classification-shrunken-update
              - classification-simulation-22
            color: green
            linger: 0.4
  - id: curvature-split
    title: Derive the regularized leaf and split decision
    visual: Row gradients and curvature enter the same leaf accumulators; differentiating the quadratic gives a weight, then one parent is replaced by two charged leaves.
    beats:
      - say: "For binary log loss, a positive label contributes negative log probability; a negative label contributes negative log of the quantity one minus probability. Differentiate with respect to the raw logit: gradient g equals probability minus label, and curvature h equals probability multiplied by the quantity one minus probability. Our probability-one-half rows are a teaching probe. The actual fitted classifier initializes from the training class proportion, one hundred nineteen divided by three hundred sixty."
        hold: 0.6
        visual_cues:
          - id: curvature-split-step-1
            phrase: For binary log loss, a positive label contributes negative log probability; a negative label contributes negative log of the quantity one minus probability
            targets:
              - curvature-split-model
            color: blue
            linger: 0.4
      - say: For a fixed leaf, sum its gradients into G and its curvatures into H. X G Boost's quadratic surrogate adds G times weight, plus one half multiplied by the quantity H plus lambda, multiplied by weight squared. Its derivative is G plus weight multiplied by the quantity H plus lambda. Setting that to zero gives weight equal to negative G divided by the quantity H plus lambda. Lambda penalizes leaf weights; gamma charges each leaf. This solves a local surrogate for a fixed partition.
        hold: 0.6
        visual_cues:
          - id: curvature-split-step-2
            phrase: For a fixed leaf, sum its gradients into G and its curvatures into H
            targets:
              - curvature-split-model
            color: blue
            linger: 0.4
          - id: leaf-optimum
            phrase: Setting that to zero gives weight equal to negative G divided by the quantity H plus lambda
            targets:
              - curvature-split-model
            color: yellow
            linger: 0.35
      - say: A proposed split replaces its parent's score with two child scores. Net gain is one half times the quantity left G squared divided by the quantity left H plus lambda, plus right G squared divided by the quantity right H plus lambda, minus parent G squared divided by the quantity parent H plus lambda; then subtract gamma once. Positive net gain justifies the split in this simplified calculation. Minimum child curvature, support rules, shrinkage and other constraints can still prevent or limit an update.
        hold: 0.6
        visual_cues:
          - id: curvature-split-step-3
            phrase: A proposed split replaces its parent's score with two child scores
            targets:
              - curvature-split-model
            color: blue
            linger: 0.4
          - id: gain-charge
            phrase: then subtract gamma once
            targets:
              - curvature-split-model
            color: yellow
            linger: 0.35
      - say: Small curvature can amplify a confident error. For a positive label at probability point zero one, g is minus point nine nine and h is point zero zero nine nine. The isolated unregularized weight is one hundred. Adding lambda one reduces it to about point nine eight. A confident correct point nine nine has the same curvature but a gradient of only minus point zero one. Inspect gradient and curvature together; optional maximum-step limits provide a further control.
        hold: 0.8
        visual_cues:
          - id: curvature-split-step-4
            phrase: Small curvature can amplify a confident error
            targets:
              - curvature-split-model
            color: green
            linger: 0.4
          - id: curvature-regularize
            phrase: Adding lambda one reduces it to about point nine eight
            targets:
              - curvature-split-model
            color: yellow
            linger: 0.35
          - id: gbt-curvature-hundred
            phrase: The isolated unregularized weight is one hundred.
            targets:
              - curvature-split-model
            color: cyan
            linger: 0
  - id: histogram-scan
    title: Scan three cuts over four persistent bins
    visual: Four labeled rows deposit signed gradient and positive curvature into ordered bins; a moving cut accumulates a left prefix and subtracts it from the parent to build the right child.
    beats:
      - say: Build an authored four-row split search. Each row occupies one ordered bin, the labels are one, one, zero, zero, and all current probabilities are one half. The gradients are minus one half, minus one half, plus one half, plus one half. Each curvature is one quarter. Set lambda to one and gamma to zero. The parent therefore has G zero and H one.
        hold: 0.6
        visual_cues:
          - id: histogram-scan-step-1
            phrase: Build an authored four-row split search
            targets:
              - histogram-scan-model
            color: blue
            linger: 0.4
          - id: histogram-deposit
            phrase: The gradients are minus one half, minus one half, plus one half, plus one half
            targets:
              - histogram-scan-model
            color: yellow
            linger: 0.35
      - say: "Move the cut after the first bin. Its left accumulator contains G minus one half and H one quarter. Subtract those from the parent to get right G plus one half and H three quarters. Insert both sides into the same gain equation: the gain is six thirty-fifths, about point one seven one. The two optimal leaf weights are point four and negative two sevenths."
        hold: 0.6
        visual_cues:
          - id: histogram-scan-step-2
            phrase: Move the cut after the first bin
            targets:
              - histogram-scan-model
            color: blue
            linger: 0.4
          - id: histogram-cut-one
            phrase: Move the cut after the first bin
            targets:
              - histogram-scan-model
            color: yellow
            linger: 0.35
          - id: histogram-gain-one
            phrase: the gain is six thirty-fifths, about point one seven one.
            targets:
              - histogram-scan-model
            color: yellow
            linger: 0.35
          - id: gbt-histogram-one-weights
            phrase: The two optimal leaf weights are point four and negative two sevenths.
            targets:
              - histogram-scan-model
            color: cyan
            linger: 0
      - say: Advance the same cut after bin two. Left G is minus one and H one half; right G is plus one and H one half. Gain becomes two thirds, and the leaf weights are plus and minus two thirds. After bin three, gain falls back to six thirty-fifths. The center cut wins this stated search. Apply the learning rate to the leaf weights before adding them to each row's logit.
        hold: 0.6
        visual_cues:
          - id: histogram-scan-step-3
            phrase: Advance the same cut after bin two
            targets:
              - histogram-scan-model
            color: blue
            linger: 0.4
          - id: histogram-cut-two
            phrase: Advance the same cut after bin two
            targets:
              - histogram-scan-model
            color: yellow
            linger: 0.35
          - id: histogram-gain-two
            phrase: Gain becomes two thirds
            targets:
              - histogram-scan-model
            color: yellow
            linger: 0.35
          - id: gbt-histogram-two-weights
            phrase: and the leaf weights are plus and minus two thirds.
            targets:
              - histogram-scan-model
            color: cyan
            linger: 0
          - id: gbt-histogram-winner
            phrase: The center cut wins this stated search.
            targets:
              - histogram-scan-model
            color: cyan
            linger: 0
      - say: "Histogram construction still reads the data: roughly rows times features for dense input. Once bins hold G and H, a prefix scan considers bin boundaries, roughly bins times features. During tree growth, a parent's histogram minus one child's histogram gives the sibling's histogram. That subtraction saves repeated construction work; it does not erase the original row pass or make a coarse binning exact."
        hold: 0.8
        visual_cues:
          - id: histogram-scan-step-4
            phrase: "Histogram construction still reads the data: roughly rows times features for dense input"
            targets:
              - histogram-scan-model
            color: green
            linger: 0.4
          - id: histogram-subtract
            phrase: a parent's histogram minus one child's histogram gives the sibling's histogram
            targets:
              - histogram-scan-model
            color: yellow
            linger: 0.35
  - id: engine-growth
    title: Change the frontier without changing the loss
    visual: A common eligible-leaf frontier is copied into closest-root,highest-gain and symmetric-level constructions; bin boundaries and a shared predicate stay visible.
    beats:
      - say: Separate growth policy from split method. Given one eligible leaf at depth two with gain point four and another at depth three with gain point nine, a closest-to-root depthwise policy expands depth two first. A highest-gain leafwise policy expands depth three first. Depthwise does not mean depth-first traversal, and a depth limit does not turn leafwise growth into depthwise growth. Capacity settings still need holdout evaluation.
        hold: 0.6
        visual_cues:
          - id: engine-growth-step-1
            phrase: Separate growth policy from split method
            targets:
              - engine-growth-model
            color: blue
            linger: 0.4
          - id: growth-frontier
            phrase: Given one eligible leaf at depth two with gain point four and another at depth three with gain point nine
            targets:
              - engine-growth-model
            color: yellow
            linger: 0.35
          - id: growth-best
            phrase: A highest-gain leafwise policy expands depth three first
            targets:
              - engine-growth-model
            color: yellow
            linger: 0.35
      - say: X G Boost offers depthwise growth and, with supported approximate or histogram methods, loss-guided growth. Exact splitting scans sorted candidates. Approx uses Hessian-weighted sketches per tree; hist uses a global sketch with supplied sample weights. Feature subsampling has method-dependent support. Light G B M uses leafwise gain selection; its number of leaves, maximum depth, leaf support and configurable bin count constrain the fitted structure.
        hold: 0.6
        visual_cues:
          - id: engine-growth-step-2
            phrase: X G Boost offers depthwise growth and, with supported approximate or histogram methods, loss-guided growth
            targets:
              - engine-growth-model
            color: blue
            linger: 0.4
      - say: CatBoost's symmetric policy applies the same predicate to every node at a given depth. The d predicate outcomes form a binary index into a full table of two to the d leaf values. At depth three, three comparisons identify one of eight leaves. Other CatBoost growth policies exist, and Plain versus Ordered boosting is a separate choice. A compact lookup structure is a reason to benchmark inference, not a promised request-latency result.
        hold: 0.8
        visual_cues:
          - id: engine-growth-step-3
            phrase: CatBoost's symmetric policy applies the same predicate to every node at a given depth
            targets:
              - engine-growth-model
            color: green
            linger: 0.4
          - id: growth-bits
            phrase: At depth three, three comparisons identify one of eight leaves
            targets:
              - engine-growth-model
            color: yellow
            linger: 0.35
  - id: sampling-categorical
    title: Preserve statistical meaning while reducing work
    visual: Gradient-ranked rows retain their identities through sampling weights; mutually exclusive sparse columns occupy disjoint bundle bins, then one categorical row is hidden from its own target statistic.
    beats:
      - say: Gradient-based one-side sampling is an optional Light G B M strategy. Keep the large-gradient group, then sample the small-gradient group with a declared inclusion probability. In a toy with four small-gradient rows sampled independently with probability one half, each retained small row receives inverse-probability weight two. A realized sample need not reproduce the full sum exactly; weighting preserves its expectation under this stated sampler.
        hold: 0.6
        visual_cues:
          - id: sampling-categorical-step-1
            phrase: Gradient-based one-side sampling is an optional Light G B M strategy
            targets:
              - sampling-categorical-model
            color: blue
            linger: 0.4
          - id: goss-weight
            phrase: each retained small row receives inverse-probability weight two
            targets:
              - sampling-categorical-model
            color: yellow
            linger: 0.35
      - say: Exclusive feature bundling packs sparse columns with little overlap into disjoint bin ranges. If A and B never activate on the same row, zero can represent neither, one can represent A, and two can represent B in a binary toy. A row with both active breaks that collision-free encoding. Real bundling needs its conflict policy and representation recorded; it is not permission to add two arbitrary dense columns.
        hold: 0.6
        visual_cues:
          - id: sampling-categorical-step-2
            phrase: Exclusive feature bundling packs sparse columns with little overlap into disjoint bin ranges
            targets:
              - sampling-categorical-model
            color: blue
            linger: 0.4
          - id: bundle-conflict
            phrase: A row with both active breaks that collision-free encoding
            targets:
              - sampling-categorical-model
            color: yellow
            linger: 0.35
      - say: Categorical splits can group categories rather than assume numeric distance between their IDs. Light G B M can order categories by gradient-to-curvature statistics for a partition search; small-cardinality settings may instead use one-versus-rest. CatBoost's ordered target statistic excludes the row's own label. For three rows sharing one category, with prior one half and smoothing weight one, preceding labels one then zero give the first three rows statistics one half, three quarters, and one half.
        hold: 0.6
        visual_cues:
          - id: sampling-categorical-step-3
            phrase: Categorical splits can group categories rather than assume numeric distance between their IDs
            targets:
              - sampling-categorical-model
            color: blue
            linger: 0.4
          - id: ordered-statistic
            phrase: preceding labels one then zero give the first three rows statistics one half, three quarters, and one half
            targets:
              - sampling-categorical-model
            color: yellow
            linger: 0.35
      - say: "Ordered boosting addresses a different prediction-shift mechanism: form a row's residual using models that have not fitted that row's target, with preceding examples in an ordering supplying the relevant support. Ordered category statistics and Ordered boosting are distinct choices; Plain boosting can still use ordered statistics. An artificial permutation does not establish future-incident validity. Keep the real temporal validation boundary."
        hold: 0.8
        visual_cues:
