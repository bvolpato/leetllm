            color: blue
            linger: 0.4
      - say: In a separate two-feature game, the empty value is zero, A alone is two, B alone is one, and both give five. In order A then B, the marginal increments are two and three. In order B then A, they are one and four. Average A's two and four to get three; average B's one and three to get two. Base zero plus those credits reconstructs output five. With more features, Shapley averages across subset orders under the specified game.
