          execution, captures independent evidence, scores outside the candidate’s reach and tears down
          the environment. Firecracker provides lightweight virtual machines. gVisor provides a userspace
          application kernel for sandboxed containers. Their names alone do not establish the configured
          isolation. Reset databases, files, conversation memory, cached tool responses and approvals
          tied to earlier calls; a fresh container can inherit a remote service’s old write.
