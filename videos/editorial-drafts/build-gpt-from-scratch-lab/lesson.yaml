            linger: 0.45
  - id: preln-block
    title: Earn the full decoder shapes and residual branches
    visual: The same batch expands into exact QKV/head/score axes, enters two Pre-LN residual branches and
      reaches its tied vocabulary projection.
    beats:
      - say: The full batch enters as twelve by forty-eight integer IDs. Token and learned position embeddings
          make twelve by forty-eight by ninety-six hidden states. One fused projection produces Q, K and
          V, each split into twelve by four by forty-eight by twenty-four. Queries and keys form twelve
          by four by forty-eight by forty-eight scores. Divide their dot products by square root of
          twenty-four, mask future keys with minus infinity, then normalize and weight values. A valid
          row needs at least one allowed finite score.
        hold: 0.7
        visual_cues:
          - id: preln-block-1
            phrase: The full batch enters as twelve by forty-eight integer IDs.
            targets:
              - preln-block-mechanism
          - id: split-heads
            phrase: each split into twelve by four by forty-eight by twenty-four
            targets:
              - preln-block-mechanism
            color: blue
            linger: 0.6
          - id: score-shape
            phrase: then normalize and weight values
            targets:
              - preln-block-mechanism
            color: blue
            linger: 0.6
      - say: In each Pre-LN block, normalize h before attention and add the attention branch back to h, making u.
          Normalize u before the MLP and add that branch back to u. The MLP expands ninety-six to three
          hundred eighty-four, applies GELU, then contracts to ninety-six. Exact GELU is x times the
          standard normal cumulative distribution at x. These per-position operations preserve the causal
          input boundary. The residual’s identity derivative path helps explain the arrangement; it is
          not a universal stability guarantee.
        hold: 0.7
        visual_cues:
          - id: preln-block-2
            phrase: In each Pre-LN block, normalize h before attention and add the attention branch back to h, making
              u.
            targets:
              - preln-block-mechanism
          - id: residual-block
            phrase: add that branch back to u
            targets:
              - preln-block-mechanism
            color: blue
            linger: 0.6
          - id: gelu-width
            phrase: applies GELU, then contracts to ninety-six
            targets:
              - preln-block-mechanism
            color: blue
            linger: 0.6
      - say: Two such blocks and final normalization feed the transpose of the same token embedding matrix.
          Logits have shape twelve by forty-eight by seventeen thousand four hundred eighty-five.
          Flattening gives five hundred seventy-six rows for cross-entropy; targets flatten to five
          hundred seventy-six integers. One FP32 logit tensor alone contains forty million two hundred
          eighty-five thousand four hundred forty bytes, before gradients and backward caches. The lab
          has no dropout and omits GPT-2’s depth-scaled residual initialization; its exact GELU also
          differs from GPT-2’s tanh approximation.
        hold: 0.9
        visual_cues:
          - id: preln-block-3
            phrase: Two such blocks and final normalization feed the transpose of the same token embedding matrix.
            targets:
              - preln-block-mechanism
          - id: tied-output
            phrase: same token embedding matrix
            targets:
              - preln-block-mechanism
            color: blue
            linger: 0.6
          - id: logit-storage
            phrase: forty million two hundred eighty-five thousand four hundred forty bytes
            targets:
              - preln-block-mechanism
            color: blue
            linger: 0.6
  - id: loss
    title: Reward probability on the actual successor
    visual: Four supplied logits normalize to probabilities. The target probability and cross-entropy appear
      before one explicit free-logit gradient update.
    beats:
      - say: A logit is an unnormalized score. Softmax turns the supplied scores into probabilities, and
          cross-entropy takes the negative logarithm of the probability on the true successor. More
          probability on that target means lower loss. The equation averages this penalty across the
          scored positions.
        hold: 0.8
        visual_cues:
          - id: loss-b1-1
            phrase: Softmax turns the supplied scores into probabilities
            targets:
              - softmax-sum
            linger: 0.45
          - id: loss-b1-2
            phrase: negative logarithm of the probability on the true successor
            targets:
              - position-loss
            linger: 0.45
      - say: "This direct-logit illustration starts with scores zero, one, two, minus one for Birds, sing, dawn, and the period. The target is sing, at index one. Gradient descent on these independent logits, with step size one half, subtracts each predicted probability and adds one at the target, all scaled by that step size. This raises the target logit relative to its competitors. The target probability moves from about zero point two three seven to zero point three seven four with the recomputed denominator. A real training step backpropagates through all the layers that produced those logits, then updates their parameters. The miniature exposes that learning signal. An update to shared network parameters need not improve every individual prediction."
        hold: 0.8
        motion_check:
          region:
            - 260
            - 330
            - 1500
            - 590
          minimumChangedFraction: 0.002
        visual_cues:
          - id: loss-b2-1
            phrase: "raises the target logit"
            targets:
              - updated-logits
            linger: 0.45
          - id: loss-b2-2
            phrase: "target probability moves from about zero point two three seven to zero point three seven four with the recomputed denominator"
            targets:
              - target-probability
            linger: 0.45
  - id: checkpoints
    title: Read the loss curve beside the generated text
    visual: The article’s reported sampled validation points reveal chronologically. Label the metric
      "Reported validation loss at this update" and identify both excerpts as article-reported
      continuations. The early excerpt remains a labeled reference while the curve completes; the later
      excerpt appears beside its already plotted checkpoint.
    beats:
      - say: "The article reports a bounded CPU experiment. Its displayed early continuation contains frequent pieces and broken fragments. The reported sampled validation curve improves as training continues. These displayed points describe the article’s reported run, which still needs an independent reproduction."
        hold: 0.8
        motion_check:
          region:
            - 230
            - 330
            - 1050
            - 590
          minimumChangedFraction: 0.002
        visual_cues:
          - id: checkpoints-b1-1
            phrase: validation curve improves
            targets:
              - validation-curve
            linger: 0.45
      - say: "Its displayed later continuation contains short phrases alongside repetition and agreement errors. Lower average cross-entropy captures improved prediction across sampled positions, while a continuation exposes different behavior. Compare several fixed prompts, held-out tasks, and overlap checks before selecting a checkpoint. One attractive sentence cannot characterize the whole model."
        hold: 0.8
        visual_cues:
          - id: checkpoints-b2-1
            phrase: short phrases alongside repetition and agreement errors
            targets:
              - recorded-text
            linger: 0.45
  - id: generation-choice
    title: Sample one retained token, then decode its identity
    visual: A new supplied logit vector is top-k truncated, temperature-scaled, normalized and sampled with a
      declared CDF draw; the chosen local ID travels through its saved inverse map.
    beats:
      - say: Generation keeps the most recent forty-eight local IDs and reads only the final position’s logits.
          The lab retains exactly eight top indices, divides their logits by temperature zero point nine,
          and samples one categorical outcome. Tail removal changes the distribution. Positive
          temperature scaling preserves retained-logit order; lower temperature sharpens it. A unique
          maximum dominates as temperature approaches zero, while tied maxima retain equal limiting
          probability. Greedy temperature zero needs an explicit argmax branch.
        hold: 0.7
        visual_cues:
          - id: generation-choice-1
            phrase: Generation keeps the most recent forty-eight local IDs and reads only the final position’s
              logits.
            targets:
              - generation-choice-mechanism
          - id: retain-eight
            phrase: retains exactly eight top indices
            targets:
              - generation-choice-mechanism
            color: blue
            linger: 0.6
          - id: sampling-temperature
            phrase: temperature zero point nine
            targets:
              - generation-choice-mechanism
            color: blue
            linger: 0.6
      - say: For a separate supplied four-logit example, use two, one, zero, minus one and retain the first two.
          At temperature one half, retained scores become four and two. Their probabilities are about
          zero point eight eight zero eight and zero point one one nine two. Use a supplied uniform draw
          of zero point nine with a cumulative-probability sampler. It passes the first bin and selects
          the second candidate, local ID one. This is a transparent categorical illustration, not a claim
          about the internal algorithm of torch multinomial.
        hold: 0.7
