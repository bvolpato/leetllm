scenes:
  - id: intro
    title: Turn a sentence into many prediction problems
    visual: A familiar four-token prefix grows one word at a time. The final word stays hidden during the
      question.
    beats:
      - say: A tiny language model can learn recognizable phrases while still producing broken sentences.
          Building one yourself makes that behavior much easier to explain. We will trace text through
          targets, attention, probability, and an update, then ask what a falling loss actually tells us
          about the model.
        hold: 0.8
        visual_cues:
          - id: intro-b1-1
            phrase: trace text through targets, attention, probability, and an update
            targets:
              - prefix-tokens
            linger: 0.45
      - say: Our teaching example starts with a short sentence. At each position, the model has a prefix and must
          predict what comes next. Training scores many such positions together. Generation uses the same
          rule repeatedly, appending one chosen token before making the next prediction.
        hold: 0.8
        visual_cues:
          - id: intro-b2-1
            phrase: prefix and must predict what comes next
            targets:
              - next-token-law
            linger: 0.45
  - id: corpus-exposure
    title: Count the stream actually sampled
    visual: "Reported corpus inventory stays separate from counted training and validation target positions. A constant no-input predictor challenges the uniform reference."
    beats:
      - say: "This is the article’s bounded CPU experiment, not a pretrained GPT checkpoint. The bundled Shakespeare file yields about one and a quarter million tokens with the article’s GPT-2 tokenizer. Treat these token counts as fixture assumptions until you rerun its pinned tokenizer. The first ninety percent supplies the training tokens. The remainder supplies validation. This split preserves file order rather than establishing chronological authorship. Repeated phrases can cross it."
        hold: 0.7
        visual_cues:
          - id: corpus-exposure-1
            phrase: This is the article’s bounded CPU experiment, not a pretrained GPT checkpoint.
            targets:
              - corpus-exposure-mechanism
          - id: corpus-tokenize
            phrase: "about one and a quarter million tokens"
            targets:
              - corpus-exposure-mechanism
            color: blue
            linger: 0.6
          - id: corpus-split
            phrase: training tokens
            targets:
              - corpus-exposure-mechanism
            color: blue
            linger: 0.6
      - say: At batch twelve and context forty-eight, each update scores five hundred seventy-six successors.
          Three hundred twenty-one updates therefore score one hundred eighty-four thousand eight hundred
          ninety-six target positions, about sixteen point four percent of the training-stream length.
          Random windows can overlap; that count is neither unique coverage nor a complete pass. Eight
          validation batches likewise score four thousand six hundred eight positions, which need not be
          distinct.
        hold: 0.7
        visual_cues:
          - id: corpus-exposure-2
            phrase: At batch twelve and context forty-eight, each update scores five hundred seventy-six successors.
            targets:
              - corpus-exposure-mechanism
          - id: score-exposure
            phrase: one hundred eighty-four thousand eight hundred ninety-six target positions
            targets:
              - corpus-exposure-mechanism
            color: blue
            linger: 0.6
          - id: sampled-fraction
            phrase: about sixteen point four percent of the training-stream length
            targets:
              - corpus-exposure-mechanism
            color: blue
            linger: 0.6
          - id: validation-exposure
            phrase: four thousand six hundred eight positions
            targets:
              - corpus-exposure-mechanism
            color: blue
            linger: 0.6
      - say: "A uniform predictor on seventeen thousand four hundred eighty-five active IDs has cross-entropy log
          of that vocabulary size, about nine point seven six nine nats per token. This is an analytic
          reference, not a measured checkpoint. Low loss alone does not prove leakage: in a separate
          four-piece toy whose targets are all zero, a constant no-input predictor assigning target ID
          zero a probability of zero point nine scores about zero point one zero five nats. Inspect
          targets and visibility directly."
        hold: 0.9
        visual_cues:
          - id: corpus-exposure-3
            phrase: A uniform predictor on seventeen thousand four hundred eighty-five active IDs has cross-entropy
              log of that vocabulary size, about nine point seven six nine nats per token.
            targets:
              - corpus-exposure-mechanism
          - id: uniform-reference
            phrase: nine point seven six nine nats per token
            targets:
              - corpus-exposure-mechanism
            color: blue
            linger: 0.6
          - id: constant-reference
            phrase: zero point one zero five nats
            targets:
              - corpus-exposure-mechanism
            color: blue
            linger: 0.6
  - id: targets
    title: The target sits one position ahead
    visual: Two aligned rows reveal current tokens and their actual successors. A moving selector pairs each
      input with its shifted target.
    beats:
      - say: Take the pieces of a continuous token stream. Make the input by leaving off the final piece, and
          make the target by leaving off the first. Before revealing the lower row, consider what the
          first position should predict. It must learn the following piece in the stream.
        hold: 0.8
        visual_cues:
          - id: targets-b1-1
            phrase: input by leaving off the final piece
            targets:
              - input-tokens
            linger: 0.45
      - say: Now follow each aligned pair. Every target is one place ahead of its input. Predicting the current
          input would reward copying. A real tokenizer can split words into several pieces, so preserve
          the exact sequence and reverse mapping rather than assuming one word always means one token.
        hold: 0.8
        visual_cues:
          - id: targets-b2-1
            phrase: Every target is one place ahead
            targets:
              - shift-contract
            linger: 0.45
          - id: targets-b2-2
            phrase: aligned pair
            targets:
              - input-tokens
              - target-tokens
            linger: 0.45
  - id: byte-boundaries
    title: Keep the bytes behind each BPE piece
    visual: All six GPT-2 IDs retain their exact literal bytes; two incomplete emoji byte pieces join before
      Unicode decoding.
    beats:
      - say: "The article’s pinned GPT-2 fixture reports six IDs for Good sir, newline, Speak: ten thousand two hundred forty-eight, fifteen thousand nine hundred sixty-seven, eleven, one hundred ninety-eight, five thousand two hundred forty-eight, and four hundred sixty-one. Their pieces are Good, space sir, comma, newline, Spe, and ak. Keep that final ak. At the comma position, the next-token target is the newline; word boundaries do not replace the shifted-token contract."
        hold: 0.7
        visual_cues:
          - id: byte-boundaries-1
            phrase: "The article’s pinned GPT-2 fixture reports six IDs for Good sir, newline, Speak: ten thousand two hundred forty-eight, fifteen thousand nine hundred sixty-seven, eleven, one hundred ninety-eight, five thousand two hundred forty-eight, and four hundred sixty-one."
            targets:
              - byte-boundaries-mechanism
          - id: six-byte-pieces
            phrase: Their pieces are Good, space sir, comma, newline, Spe, and ak
            targets:
              - byte-boundaries-mechanism
            color: blue
            linger: 0.6
          - id: newline-target
            phrase: the next-token target is the newline
            targets:
              - byte-boundaries-mechanism
            color: blue
            linger: 0.6
      - say: "Byte-level pieces need not be complete Unicode characters. The article’s smiling-face fixture reports UTF-8 pieces hexadecimal f zero nine f and nine nine eight two. Decoding those pieces separately inserts replacement characters; concatenating their original bytes and decoding the full sequence recovers the character. Streaming decoding must retain incomplete bytes. An arbitrary generated sequence can still be invalid UTF-8: default replacement and strict rejection are different explicit policies. This independent full-tokenizer fixture does not expand the compact Shakespeare support."
        hold: 0.9
        visual_cues:
          - id: byte-boundaries-2
            phrase: Byte-level pieces need not be complete Unicode characters.
            targets:
              - byte-boundaries-mechanism
          - id: separate-bytes
            phrase: Decoding those pieces separately inserts replacement characters
            targets:
              - byte-boundaries-mechanism
            color: blue
            linger: 0.6
          - id: joined-bytes
            phrase: decoding the full sequence recovers the character
            targets:
              - byte-boundaries-mechanism
            color: blue
            linger: 0.6
  - id: mask
    title: Visibility and target alignment are separate checks
    visual: A four-by-four causal mask constructs its lower triangle. Later input tokens change while earlier
      output signatures remain fixed.
    beats:
      - say: Correct targets still leave another way to cheat. The next token already appears elsewhere in a
          training window. If an earlier position can attend to that future input, the answer can enter
          its hidden state. The lower triangle admits only the current position and its preceding keys.
        hold: 0.8
        visual_cues:
          - id: mask-b1-1
            phrase: lower triangle admits only the current position
            targets:
              - causal-query
            linger: 0.45
      - say: Change the final input while holding the prefix fixed. Under the causal boundary, earlier
          predictions remain unchanged. This perturbation checks information flow directly. Run the
          target-shift check separately, because a perfectly causal model can still be trained against
          the wrong labels. Both agreements belong in the training pipeline.
        hold: 0.8
        visual_cues:
          - id: mask-b2-1
            phrase: Change the final input
            targets:
              - future-change
            linger: 0.45
          - id: mask-b2-2
            phrase: earlier predictions remain unchanged
            targets:
              - prefix-output
            linger: 0.45
  - id: vocab
    title: Keep token identity through a compact vocabulary
    visual: Three sparse original IDs map to three dense local IDs and return to the same literal pieces.
      Label this table "Illustrative three-piece map, separate from the corpus map". Keep the full-corpus
      capacity strip separate and the later hypothetical sampling map distinct.
    beats:
      - say: "The article uses the published GPT-2 tokenizer, then keeps only pieces present in its Shakespeare
          file. A dense local index shrinks the tied embedding matrix. Watch the comma travel through the
          mapping: its index changes, while the piece it identifies stays the same."
        hold: 0.8
        visual_cues:
          - id: vocab-b1-1
            phrase: comma travel through the mapping
            targets:
              - original-id
              - local-id
              - token-piece
            linger: 0.45
      - say: Removing unused output rows also removes candidates from the softmax denominator. That changes the
          prediction problem and limits which prompts remain representable. This lab chooses its support
          using the entire file, including validation identities. Declare that preprocessing boundary
          when interpreting the held-out result.
        hold: 0.8
        visual_cues:
          - id: vocab-b2-1
            phrase: removes candidates from the softmax denominator
            targets:
              - vocab-support
            linger: 0.45
  - id: compact-denominator
    title: A smaller support changes probability and gradients
    visual: A single tied matrix supplies input and output rows; the unused third row receives an output
      gradient before removal changes the denominator.
    beats:
      - say: The tied vocabulary matrix has vocabulary size times hidden width parameters. Full GPT-2 support
          gives four million eight hundred twenty-four thousand six hundred seventy-two weights at width
          ninety-six; active support gives one million six hundred seventy-eight thousand five hundred
          sixty. That removes sixty-five point two percent of this matrix’s rows. The complete compact
          model has one million nine hundred seven thousand forty parameters; removed rows are about
          sixty-two point three percent of the corresponding full-vocabulary model, a different
          denominator.
        hold: 0.7
        visual_cues:
          - id: compact-denominator-1
            phrase: The tied vocabulary matrix has vocabulary size times hidden width parameters.
            targets:
              - compact-denominator-mechanism
          - id: compact-weights
            phrase: active support gives one million six hundred seventy-eight thousand five hundred sixty
            targets:
              - compact-denominator-mechanism
            color: blue
            linger: 0.6
          - id: removed-matrix
            phrase: That removes sixty-five point two percent of this matrix’s rows
            targets:
              - compact-denominator-mechanism
            color: blue
            linger: 0.6
          - id: whole-model
            phrase: a different denominator
            targets:
              - compact-denominator-mechanism
            color: blue
            linger: 0.6
      - say: "Inspect the article’s three-row tied fixture. Input row zero is one, zero; target row one is zero,
          one; unused row two is one, one. The selected hidden vector produces logits one, zero, one.
          Softmax gives the unused row probability about zero point four two two three, and its output
          gradient is that probability times the hidden vector: zero point four two two three, zero. A
          row can receive an output-side gradient without being an input or target."
        hold: 0.7
        visual_cues:
          - id: compact-denominator-2
            phrase: Inspect the article’s three-row tied fixture.
            targets:
              - compact-denominator-mechanism
          - id: unused-gradient
            phrase: zero point four two two three, zero
            targets:
              - compact-denominator-mechanism
            color: blue
            linger: 0.6
      - say: "Remove that unused output row while holding the other logits fixed. The target probability rises from about zero point one five five four to zero point two six eight nine, and loss falls from about one point eight six two to one point three one three. Relabeling the retained pieces is reversible; removing competitors changes the objective. The algorithm builds the map over the full file. The article reports three hundred thirty-five validation-only IDs. Verify that count by finding original IDs in validation that are absent from training. Validation supplies no gradient updates, but its identities influenced preprocessing. An independent evaluation needs support chosen without that inspection or a declared missing-piece policy."
        hold: 0.9
        visual_cues:
          - id: compact-denominator-3
            phrase: Remove that unused output row while holding the other logits fixed.
            targets:
              - compact-denominator-mechanism
          - id: drop-competitor
            phrase: holding the other logits fixed
            targets:
              - compact-denominator-mechanism
            color: blue
            linger: 0.6
          - id: validation-support
            phrase: three hundred thirty-five validation-only IDs
            targets:
              - compact-denominator-mechanism
            color: blue
            linger: 0.6
  - id: stream-boundaries
    title: Preserve a successor that existed in the stream
    visual: A 20-token ruler exposes the false 3→8 join; a separate 49-token boundary fixture builds the only
      legal 48-token window.
    beats:
      - say: Keep a source-token ruler from zero through nineteen. Concatenating chunk zero through three with
          chunk eight through eleven invents a transition from three to eight. A contiguous sixteen-token
          training prefix followed by a four-token validation suffix preserves within-portion adjacency;
          the transition crossing the split is not scored. Concatenating independent documents can be an
          intentional objective, but independent-document training also needs attention isolation and
          boundary-target handling. Resetting position numbers alone does not isolate history.
        hold: 0.7
        visual_cues:
          - id: stream-boundaries-1
            phrase: Keep a source-token ruler from zero through nineteen.
            targets:
              - stream-boundaries-mechanism
          - id: false-join
            phrase: invents a transition from three to eight
            targets:
              - stream-boundaries-mechanism
            color: blue
            linger: 0.6
          - id: contiguous-split
            phrase: preserves within-portion adjacency
            targets:
              - stream-boundaries-mechanism
            color: blue
            linger: 0.6
      - say: One context of length T needs T plus one source tokens to supply its last successor. The batch
          sampler selects a start, copies T inputs and copies the same stream one place ahead as targets.
          Its exclusive random upper bound is source length minus T, so the largest legal start is source
          length minus T minus one. No sampled window crosses the training-validation boundary.
        hold: 0.7
        visual_cues:
          - id: stream-boundaries-2
            phrase: One context of length T needs T plus one source tokens to supply its last successor.
            targets:
              - stream-boundaries-mechanism
          - id: sampler-window
            phrase: largest legal start is source length minus T minus one
            targets:
              - stream-boundaries-mechanism
            color: blue
            linger: 0.6
      - say: "For the exact edge case, source IDs zero through forty-eight contain forty-nine tokens. A
          forty-eight-token context has one legal start, zero. Inputs end at forty-seven and targets end
          at forty-eight. A forty-eight-token source cannot provide the last successor and must fail this
          sampler’s length check. Inspect the final target as well as the overlapping middle: an
          off-by-one can hide at that boundary."
        hold: 0.9
        visual_cues:
          - id: stream-boundaries-3
            phrase: For the exact edge case, source IDs zero through forty-eight contain forty-nine tokens.
            targets:
              - stream-boundaries-mechanism
          - id: last-successor
            phrase: targets end at forty-eight
            targets:
              - stream-boundaries-mechanism
            color: blue
            linger: 0.6
          - id: short-stream
            phrase: must fail this sampler’s length check
            targets:
              - stream-boundaries-mechanism
            color: blue
            linger: 0.6
  - id: forward
    title: Carry token and position information through the decoder
    visual: "A two-coordinate miniature follows Birds at position zero through token-plus-position addition, permitted history, and four vocabulary scores. Footer labels describe the complete lab batch."
    beats:
      - say: An embedding lookup gives each token a learned vector. A position embedding adds where that token
          sits in the window. Each decoder block mixes permitted history through attention and transforms
          each position through a feed-forward network. Residual additions carry the earlier
          representation alongside those branches.
        hold: 0.8
        visual_cues:
          - id: forward-b1-1
            phrase: position embedding adds where that token sits
            targets:
              - embedding-addition
            linger: 0.45
          - id: forward-b1-2
            phrase: permitted history through attention
            targets:
              - attention-value
            linger: 0.45
      - say: "The two-coordinate miniature follows Birds at position zero. The shape labels describe the complete lab batch. Four attention heads divide the feature width and compare query positions with key positions. After recombination, the tied output matrix scores every active vocabulary item. Its final axis must match the local vocabulary."
        hold: 0.8
        visual_cues:
          - id: forward-b2-1
            phrase: Four attention heads divide the feature width
            targets:
              - head-shapes
            linger: 0.45
          - id: forward-b2-2
            phrase: scores every active vocabulary item
            targets:
