            phrase: The article’s validator produces an accepted recommendation only. It does not implement that
              distributed transaction, claim, service or external effect. Retain the source version,
              incident identity and validation outcome so the authorized consumer can check the
              current situation. Authentic source retrieval, quoting and application validation
              protect different parts of that path.
            targets:
              - pf-execution-boundary-mechanism
            color: cyan
            linger: 0.35
