scenes:
  - id: opening
    title: Give a model the information a good answer requires
    visual: >
      A supplied incident reply says 90 minutes beside IR-7's 30-minute rule. Four empty prompt
      sections identify the information we will assemble.
    beats:
      - say: >
          An incident assistant recommends paging within ninety minutes and cites runbook IR-7. Open
          the runbook, and the rule says thirty minutes. Following the recommendation could delay the first page by an hour.
        hold: 0.8
        visual_cues:
          - id: trusted-page-runbook-b1-1
            phrase: rule says thirty minutes
            targets:
              - trusted-page-runbook
            color: green
            linger: 0.6
      - say: >
          A prompt is the context supplied for a prediction: the task, the facts, any examples, and
          the expected response. Ordinary prompting keeps the model's learned weights fixed.
        hold: 0.8
        visual_cues:
          - id: prompt-ingredient-0-b2-1
            phrase: task, the facts, any examples
            targets:
              - prompt-ingredient-0
            color: blue
            linger: 0.6
      - say: >
          Let's assemble one complete prompt, revise its weakest phrase, and follow a response
          through actual checks. Our supplied replies illustrate the workflow; measured model
          performance comes from a separate evaluation.
        hold: 0.9
        visual_cues:
          - id: trusted-page-runbook-b3-1
            phrase: actual checks
            targets:
              - trusted-page-runbook
            color: green
            linger: 0.6
  - id: conditional-context
    title: Compute a sequence probability without changing a weight
    visual: A fixed model block retains the same parameter lock while two authored token branches
      multiply their conditional masses. Editing only the runbook input changes the next
      distribution, while a separate training arrow remains inactive.
    beats:
      - say: A model assigns a conditional probability to each next token given the prompt and the preceding
          output. Multiply those conditional probabilities to obtain the probability of a complete
          token sequence. In an authored two-token example, the first chosen token has probability
          zero point six and the second, conditional on that first token, has zero point four. Their
          sequence probability is zero point two four.
        hold: 0.8
        visual_cues:
          - id: pf-conditional-context-b0
            phrase: A model assigns a conditional probability to each next token given the prompt and the
              preceding output. Multiply those conditional probabilities to obtain the probability
              of a complete token sequence. In an authored two-token example, the first chosen token
              has probability zero point six and the second, conditional on that first token, has
              zero point four. Their sequence probability is zero point two four.
            targets:
              - pf-conditional-context-mechanism
            color: cyan
            linger: 0.35
      - say: Changing the prompt changes those conditions. It does not update the learned weights during
          ordinary inference. An imagined loss could have a nonzero derivative, but we have
          performed no optimizer step. When a chosen token is fed through the next forward pass,
          conventional cached attention computes its keys and values for later positions. Selecting
          its text and writing a parameter update are different operations.
        hold: 0.8
        visual_cues:
          - id: pf-conditional-context-b1
            phrase: Changing the prompt changes those conditions. It does not update the learned weights during
              ordinary inference. An imagined loss could have a nonzero derivative, but we have
              performed no optimizer step. When a chosen token is fed through the next forward pass,
              conventional cached attention computes its keys and values for later positions.
              Selecting its text and writing a parameter update are different operations.
            targets:
              - pf-conditional-context-mechanism
            color: cyan
            linger: 0.35
      - say: Carry IR-7 into this distinction. Supplying its thirty-minute rule can alter a reply’s
          distribution, but cannot guarantee extraction or compliance. Keep the declaration time,
          page status and applicable policy in the available context. A finite context window can
          omit a required fact; more unrelated log text adds tokens without establishing that fact
          or proving a quality improvement.
        hold: 0.8
        visual_cues:
          - id: pf-conditional-context-b2
            phrase: Carry IR-7 into this distinction. Supplying its thirty-minute rule can alter a reply’s
              distribution, but cannot guarantee extraction or compliance. Keep the declaration
              time, page status and applicable policy in the available context. A finite context
              window can omit a required fact; more unrelated log text adds tokens without
              establishing that fact or proving a quality improvement.
            targets:
              - pf-conditional-context-mechanism
            color: cyan
            linger: 0.35
  - id: policy-baseline
    title: Work out the decision before writing the prompt
    visual: >
      A clock advances across the 30-minute deadline. Current elapsed time, remaining time and
      overdue status derive from the same clock state.
    beats:
      - say: >
          The fictional rule requires a first page within thirty minutes of a P1 declaration. Our
          incident is twelve minutes old, and no page has been sent. That leaves eighteen minutes.
        hold: 0.8
        visual_cues:
          - id: remaining-page-time-b1-1
            phrase: eighteen minutes
            targets:
              - remaining-page-time
            color: blue
            linger: 0.6
      - say: >
          Watch the clock approach the boundary. Overdue means elapsed time is strictly greater than
          thirty. Exactly thirty is still on the boundary; the next minute is overdue. The remaining
          time stops at zero.
        hold: 0.9
        visual_cues:
          - id: page-overdue-state-b2-1
            phrase: next minute is overdue
            targets:
              - page-overdue-state
            color: pink
            linger: 0.6
      - say: >
          A missing rule or unknown page status needs review. Writing down these branches first
          gives us a reference answer, a fallback, and useful examples before we ask the model
          anything.
        hold: 0.9
        visual_cues:
          - id: page-deadline-b3-1
            phrase: reference answer
            targets:
              - page-deadline
            color: yellow
            linger: 0.6
          - id: pf-missing-policy
            phrase: A missing rule or unknown page status needs review
            targets:
              - page-deadline
            color: cyan
            linger: 0.35
  - id: role-serialization
    title: Trace actual message roles into model-specific tokens
    visual: An application-owned developer message and separately quoted user incident enter a
      serializer. Two authentic template outputs use different control tokens; literal role-looking
      text stays inside the user payload and never moves to the developer lane.
    beats:
      - say: The application sends structured messages with roles and content. A chat template serializes
          them into the token sequence expected by that model. Hugging Face shows two models from
          the same base family using different control tokens. A ChatML-looking example is one
          format, not a universal wire protocol. Use the actual tokenizer template or provider
          message interface instead of inventing special tokens.
        hold: 0.8
        visual_cues:
          - id: pf-role-serialization-b0
            phrase: The application sends structured messages with roles and content. A chat template serializes
              them into the token sequence expected by that model. Hugging Face shows two models
              from the same base family using different control tokens. A ChatML-looking example is
              one format, not a universal wire protocol. Use the actual tokenizer template or
              provider message interface instead of inventing special tokens.
            targets:
              - pf-role-serialization-mechanism
            color: cyan
            linger: 0.35
      - say: For OpenAI guidance inspected on November sixth, twenty twenty-six, developer instructions have
          priority over user instructions. Supported roles and fields still depend on the model and
          interface. A user note containing the characters system or closing XML tags does not
          become an authenticated instruction role. Escape or serialize inserted data so it cannot
          accidentally close the surrounding representation.
        hold: 0.8
        visual_cues:
          - id: pf-role-serialization-b1
            phrase: For OpenAI guidance inspected on November sixth, twenty twenty-six, developer instructions
              have priority over user instructions. Supported roles and fields still depend on the
              model and interface. A user note containing the characters system or closing XML tags
              does not become an authenticated instruction role. Escape or serialize inserted data
              so it cannot accidentally close the surrounding representation.
            targets:
              - pf-role-serialization-mechanism
            color: cyan
            linger: 0.35
      - say: Roles and delimiters express the intended boundary; they do not enforce all task semantics. The
          application obtains IR-7 from a trusted source and supplies the current snapshot
          separately from hostile notes. If this task needs a first-page recommendation, it needs
          time since P1 declaration and whether a page was already sent. Total incident age alone
          cannot establish either fact.
        hold: 0.8
        visual_cues:
          - id: pf-role-serialization-b2
            phrase: Roles and delimiters express the intended boundary; they do not enforce all task semantics.
              The application obtains IR-7 from a trusted source and supplies the current snapshot
              separately from hostile notes. If this task needs a first-page recommendation, it
              needs time since P1 declaration and whether a page was already sent. Total incident
              age alone cannot establish either fact.
            targets:
              - pf-role-serialization-mechanism
            color: cyan
            linger: 0.35
  - id: prompt-assembly
    title: Assemble the complete prompt
    visual: >
      Four concrete sections accumulate in one persistent editor: task, authenticated facts, a
      boundary demonstration and an exact output contract. A section index tracks the currently
      inserted block.
    beats:
      - say: >
          Start with the task: recommend the first page for this incident. Use the supported
          instruction role for that request and its response rules. Supply the runbook and current
          incident as clearly separated input facts.
        hold: 0.9
        visual_cues:
          - id: assembled-section-0-b1-1
            phrase: task
            targets:
              - prompt-task-body
            color: blue
            linger: 0.6
      - say: >
          Now add one boundary example. At thirty-one minutes, an unpaged P1 is overdue, while the
          deadline remains thirty minutes from declaration. A demonstration shows how the fields
          relate to each other.
        hold: 0.9
        visual_cues:
          - id: assembled-section-2-b2-1
            phrase: boundary example
            targets:
              - prompt-example-body
            color: yellow
            linger: 0.6
      - say: >
          Finish with the contract: action, deadline in minutes, overdue, and source line IDs.
          Include the missing-facts fallback. The complete prompt stays visible so we can inspect
          the actual instructions together.
        hold: 1.1
        visual_cues:
          - id: assembled-section-3-b3-1
            phrase: contract
            targets:
              - prompt-contract-body
            color: green
            linger: 0.6
  - id: demonstration-boundaries
    title: Choose examples by the decision boundary they expose
    visual: Three supplied support tickets share the word guide while their actual causes differ. The
      examples enter three matched labeled slots, then one held-out case visibly stays outside the
      prompt. A separate order permutation keeps every ticket identity fixed.
    beats:
      - say: Zero-shot has no input-output demonstration. One-shot has exactly one; few-shot has two or
          more. Instructions can still define the task in each case. Our support labels separate a
          defect in implemented software, misleading documentation while the software works, and a
          request for an unsupported capability. Classify the cause, rather than treating the word
          guide as the docs label.
        hold: 0.8
        visual_cues:
          - id: pf-demonstration-boundaries-b0
            phrase: Zero-shot has no input-output demonstration. One-shot has exactly one; few-shot has two or
              more. Instructions can still define the task in each case. Our support labels separate
              a defect in implemented software, misleading documentation while the software works,
              and a request for an unsupported capability. Classify the cause, rather than treating
              the word guide as the docs label.
            targets:
              - pf-demonstration-boundaries-mechanism
            color: cyan
            linger: 0.35
      - say: "The article’s guide says dry-run writes files, although the program correctly simulates them:
          docs. A correct guide followed by an actual crash is a bug. Adding a new JSON output flag
          is a feature request. Together these examples show a boundary a repeated easy example
          would leave ambiguous. Keep the input-label pairs correct when teaching a new routing
          convention."
        hold: 0.8
        visual_cues:
          - id: pf-demonstration-boundaries-b1
            phrase: "The article’s guide says dry-run writes files, although the program correctly simulates
              them: docs. A correct guide followed by an actual crash is a bug. Adding a new JSON
              output flag is a feature request. Together these examples show a boundary a repeated
              easy example would leave ambiguous. Keep the input-label pairs correct when teaching a
              new routing convention."
            targets:
              - pf-demonstration-boundaries-mechanism
            color: cyan
            linger: 0.35
      - say: Min and colleagues found small average drops after randomizing demonstration labels in their
          studied classification and multiple-choice tasks, with some larger gaps. That evidence
          highlights format, label space and input distribution; it does not establish that every
          new label mapping is irrelevant. Zhao and colleagues found label-frequency and recency
          biases. Start with balanced examples, permute their order under controlled evaluation, and
          measure this model on this task.
        hold: 0.8
        visual_cues:
          - id: pf-demonstration-boundaries-b2
            phrase: Min and colleagues found small average drops after randomizing demonstration labels in their
              studied classification and multiple-choice tasks, with some larger gaps. That evidence
              highlights format, label space and input distribution; it does not establish that
              every new label mapping is irrelevant. Zhao and colleagues found label-frequency and
              recency biases. Start with balanced examples, permute their order under controlled
              evaluation, and measure this model on this task.
            targets:
              - pf-demonstration-boundaries-mechanism
            color: cyan
            linger: 0.35
      - say: Keep final evaluation cases outside every demonstration and prompt revision. If an error from
          the final set becomes an example, it is now development evidence. A perfect score on that
          already supplied case cannot measure transfer to untouched incidents. Consistent
          formatting helps expose the contract; its actual quality effect still needs a comparison.
        hold: 0.8
        visual_cues:
          - id: pf-demonstration-boundaries-b3
            phrase: Keep final evaluation cases outside every demonstration and prompt revision. If an error
              from the final set becomes an example, it is now development evidence. A perfect score
              on that already supplied case cannot measure transfer to untouched incidents.
              Consistent formatting helps expose the contract; its actual quality effect still needs
              a comparison.
            targets:
              - pf-demonstration-boundaries-mechanism
            color: cyan
            linger: 0.35
  - id: prompt-revision
    title: Replace an ambiguous phrase with an exact reference
    visual: >
      The complete prompt persists. Its vague deadline wording is replaced in place, with the
      changed words highlighted. A supplied reply changes from deadline 90 to 30 only after the
      edit.
    beats:
      - say: >
          Look closely at the draft's output phrase: deadline in minutes. Minutes from when? A model
          might interpret that field as time remaining or invent a different window. The contract
          needs a named reference point.
        hold: 0.9
        visual_cues:
          - id: revised-reference-phrase-b1-1
            phrase: named reference point
            targets:
              - revised-reference-phrase
            color: yellow
            linger: 0.6
      - say: >
          Replace that phrase with deadline minutes since P1 declaration. Keep the task, facts, and
          example unchanged. The highlighted phrase is the only prompt edit, making its intended
          effect easy to test.
        hold: 0.9
        visual_cues:
          - id: revised-reference-phrase-b2-1
            phrase: deadline minutes since P1 declaration
            targets:
              - revised-reference-phrase
            color: yellow
            linger: 0.6
      - say: >
          Our supplied revised reply now contains thirty, with overdue false for the current
          twelve-minute incident. That is the desired behavior. To establish that this wording helps
          a model, run both prompts on the same untouched incidents.
        hold: 1
        visual_cues:
          - id: revised-page-response-b3-1
            phrase: overdue false
            targets:
              - revised-page-response
            color: green
            linger: 0.6
  - id: reasoning-work
    title: Follow extra output positions through inference
    visual: A short answer and a longer supplied explanation share the same fixed model. Each new token
      makes a forward-step tick and then becomes available context. No gradient or weight arrow
      activates; the displayed evidence check remains unchanged for both paths.
    beats:
      - say: An autoregressive answer already uses one generation step per output token. Historical
          chain-of-thought prompting supplied intermediate solution steps in examples and improved
          results on studied reasoning tasks. Extra text can expose partial results to later
          generation, while adding work and often latency. A longer explanation is a proposed
          computational path whose correctness still needs checking.
        hold: 0.8
        visual_cues:
          - id: pf-reasoning-work-b0
            phrase: An autoregressive answer already uses one generation step per output token. Historical
              chain-of-thought prompting supplied intermediate solution steps in examples and
              improved results on studied reasoning tasks. Extra text can expose partial results to
              later generation, while adding work and often latency. A longer explanation is a
              proposed computational path whose correctness still needs checking.
            targets:
              - pf-reasoning-work-mechanism
            color: cyan
            linger: 0.35
      - say: The selected words form discrete context during ordinary inference; they are not a
          differentiable memory being optimized by backpropagation. Conventional attention caches a
          token’s keys and values when it is processed on the next forward pass. Other architectures
          can retain different state, and storage need not live on a GPU. Visible explanation length
          and internal reasoning effort are separate properties.
        hold: 0.8
        visual_cues:
          - id: pf-reasoning-work-b1
            phrase: The selected words form discrete context during ordinary inference; they are not a
              differentiable memory being optimized by backpropagation. Conventional attention
              caches a token’s keys and values when it is processed on the next forward pass. Other
              architectures can retain different state, and storage need not live on a GPU. Visible
              explanation length and internal reasoning effort are separate properties.
            targets:
              - pf-reasoning-work-mechanism
            color: cyan
            linger: 0.35
      - say: OpenAI’s reasoning guide inspected on November sixth, twenty twenty-six, recommends direct task
          instructions and says demands to think step by step may be unnecessary or harmful for its
          reasoning models. That is scoped provider guidance, not an exclusive architecture division
          between instruction following and reasoning. Test supported effort settings, request a
          concise evidence-based justification when useful, and evaluate accuracy together with
          cost.
        hold: 0.8
        visual_cues:
          - id: pf-reasoning-work-b2
            phrase: OpenAI’s reasoning guide inspected on November sixth, twenty twenty-six, recommends direct
              task instructions and says demands to think step by step may be unnecessary or harmful
              for its reasoning models. That is scoped provider guidance, not an exclusive
              architecture division between instruction following and reasoning. Test supported
              effort settings, request a concise evidence-based justification when useful, and
              evaluate accuracy together with cost.
            targets:
              - pf-reasoning-work-mechanism
            color: cyan
            linger: 0.35
  - id: agreement-check
    title: Count agreement, then compare its winner with the rule
    visual: Five fixed path IDs retain four 90-minute answers and one 30-minute answer. The four answer
      tokens enter one count bin, which stays pink when the separate authenticated IR-7 comparison
      rejects 90. Ties and invalid outcomes remain visibly separate policies.
    beats:
      - say: Self-consistency samples several paths and aggregates normalized final answers. The most
          frequent answer is a plurality winner; a majority needs more than half of all counted
          votes. Define tie handling and invalid-output handling before counting. Equivalent answer
          strings need a shared representation, or their votes can be split by formatting alone.
        hold: 0.8
        visual_cues:
          - id: pf-agreement-check-b0
            phrase: Self-consistency samples several paths and aggregates normalized final answers. The most
              frequent answer is a plurality winner; a majority needs more than half of all counted
              votes. Define tie handling and invalid-output handling before counting. Equivalent
              answer strings need a shared representation, or their votes can be split by formatting
              alone.
            targets:
              - pf-agreement-check-mechanism
            color: cyan
            linger: 0.35
      - say: In the article’s constructed five-path fixture, four answers say ninety and one says thirty.
          Four divided by five is eighty percent observed agreement, but IR-7 still requires thirty.
          These are supplied paths, not a model benchmark. Correlated samples can repeat the same
          missing fact. Calibrate any claimed correctness probability against labeled held-out
          outcomes, and still validate the selected answer.
        hold: 0.8
        visual_cues:
          - id: pf-agreement-check-b1
            phrase: In the article’s constructed five-path fixture, four answers say ninety and one says thirty.
              Four divided by five is eighty percent observed agreement, but IR-7 still requires
              thirty. These are supplied paths, not a model benchmark. Correlated samples can repeat
              the same missing fact. Calibrate any claimed correctness probability against labeled
              held-out outcomes, and still validate the selected answer.
            targets:
              - pf-agreement-check-mechanism
            color: cyan
            linger: 0.35
          - id: pf-agreement-build
            phrase: In the article’s constructed five-path fixture, four answers say ninety and one says thirty.
            targets:
              - pf-agreement-check-mechanism
            color: cyan
            linger: 0.35
          - id: pf-agreement-result
            phrase: Four divided by five is eighty percent observed agreement, but IR-7 still requires thirty.
            targets:
              - pf-agreement-check-mechanism
            color: cyan
            linger: 0.35
  - id: complete-response
    title: Follow a complete response through executable checks
    visual: >
      A JSON response assembles field by field. Parsing, schema and policy checks inspect it in
      order. Changing only deadline 30 to 90 preserves structural validity but fails the policy
      comparison.
    beats:
      - say: >
          Watch the complete response assemble: a proposed action, the deadline, the overdue flag,
          and IR-7 as its source. A partial object stays incomplete until its closing brace arrives.
        hold: 0.9
        visual_cues:
          - id: response-field-2-b1-1
            phrase: deadline
            targets:
              - response-field-2
            color: yellow
            linger: 0.6
      - say: >
          First parse the text. Then check the required fields and types. Finally compare every
          decision field with the trusted rule and snapshot. Our complete reply passes all three
          checks and becomes an accepted recommendation.
        hold: 1
        visual_cues:
          - id: response-check-1-b2-1
            phrase: required fields and types
            targets:
              - response-check-1
            color: cyan
            linger: 0.6
      - say: >
          Now change just the deadline to ninety. Parsing still passes, and an integer still
          satisfies this schema. The policy comparison catches the contradiction. A source ID
          becomes useful evidence when the answer agrees with its source.
        hold: 1
        visual_cues:
          - id: response-check-2-b3-1
            phrase: policy comparison
            targets:
              - response-check-2
            color: pink
            linger: 0.6
  - id: grammar-mask
    title: Construct a legal next-token distribution
    visual: The actual four-token object-start fixture retains its logits while illegal token masses are
      masked out. A second two-legal-token state exponentiates centered logits and normalizes
      visibly; the legal opening brace remains an incomplete prefix until later fields and the
      closing brace arrive.
    beats:
      - say: Prompting for JSON, JSON mode and a supported strict schema offer different contracts. JSON
          mode aims at parseable JSON; strict structured output also constrains the supported
          schema. Check refusal and incomplete status, and the provider’s supported subset. Neither
          formatting contract establishes that a numeric deadline agrees with the runbook.
        hold: 0.8
        visual_cues:
          - id: pf-grammar-mask-b0
            phrase: Prompting for JSON, JSON mode and a supported strict schema offer different contracts. JSON
              mode aims at parseable JSON; strict structured output also constrains the supported
              schema. Check refusal and incomplete status, and the provider’s supported subset.
              Neither formatting contract establishes that a numeric deadline agrees with the
              runbook.
            targets:
              - pf-grammar-mask-mechanism
            color: cyan
            linger: 0.35
      - say: Constrained decoding identifies legal continuations and sets illegal logits to negative
          infinity. Subtract the largest legal finite logit, exponentiate each remaining logit and
          divide by the sum of those masses. This keeps illegal probability zero while normalizing
          the allowed choices. At least one legal finite logit must remain. The article’s four-token
          object-start example leaves only an opening brace, with probability one.
        hold: 0.8
        visual_cues:
          - id: pf-grammar-mask-b1
            phrase: Constrained decoding identifies legal continuations and sets illegal logits to negative
              infinity. Subtract the largest legal finite logit, exponentiate each remaining logit
              and divide by the sum of those masses. This keeps illegal probability zero while
              normalizing the allowed choices. At least one legal finite logit must remain. The
              article’s four-token object-start example leaves only an opening brace, with
              probability one.
            targets:
              - pf-grammar-mask-mechanism
            color: cyan
            linger: 0.35
      - say: At another authored position, suppose the two legal logits are one and zero, and a third token
          is forbidden. Centering produces zero and negative one. Their normalized masses are about
          zero point seven three one and zero point two six nine; the forbidden token remains zero.
          A legal prefix is not a complete object, so truncation after the opening brace still
          cannot be accepted.
        hold: 0.8
        visual_cues:
          - id: pf-grammar-mask-b2
            phrase: At another authored position, suppose the two legal logits are one and zero, and a third
              token is forbidden. Centering produces zero and negative one. Their normalized masses
              are about zero point seven three one and zero point two six nine; the forbidden token
              remains zero. A legal prefix is not a complete object, so truncation after the opening
              brace still cannot be accepted.
            targets:
              - pf-grammar-mask-mechanism
            color: cyan
            linger: 0.35
          - id: pf-mask-result
            phrase: Their normalized masses are about zero point seven three one and zero point two six nine;
              the forbidden token remains zero.
            targets:
              - pf-grammar-mask-mechanism
            color: cyan
            linger: 0.35
      - say: A finite-state description can handle regular constraints. Recursive nested objects need
          stack-like state for a general context-free grammar. Real vocabulary tokens may contain
          several characters or partial bytes; the engine must check the complete decoded
          continuation against its parser state. Our Python mask illustrates one character-level
          boundary. It does not execute a grammar compiler or establish its latency.
        hold: 0.8
        visual_cues:
          - id: pf-grammar-mask-b3
            phrase: A finite-state description can handle regular constraints. Recursive nested objects need
              stack-like state for a general context-free grammar. Real vocabulary tokens may
