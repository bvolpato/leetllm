  - id: execution-boundary
    title: Carry the same recommendation across a fresh authority check
    visual: An injected needs-review instruction is rejected for a fully known incident even though its
      object shape is valid. A separate dispatch service rereads policy and page state, then joins
      permission and an atomic no-page claim before any external-effect lane can activate.
    beats:
      - say: An indirect injection can ask for a schema-valid fallback that suppresses the required page.
          Delimiters alone do not stop that behavior; comparing every decision field with the
          trusted snapshot catches it. A synthetic canary string can reveal a literal leak in a
          test. Its absence does not prove that no encoded leak or malicious behavior occurred.
        hold: 0.8
        visual_cues:
          - id: pf-execution-boundary-b0
            phrase: An indirect injection can ask for a schema-valid fallback that suppresses the required page.
              Delimiters alone do not stop that behavior; comparing every decision field with the
              trusted snapshot catches it. A synthetic canary string can reveal a literal leak in a
              test. Its absence does not prove that no encoded leak or malicious behavior occurred.
            targets:
              - pf-execution-boundary-mechanism
            color: cyan
            linger: 0.35
      - say: Keep dispatch credentials outside the model. A separate service checks authorization,
          applicable policy and fresh page state before acting. If another worker paged after our
          snapshot, a previously correct recommendation does not authorize a second page. Join the
          final check with an atomic claim or an idempotent effect contract to close that race;
          merely reading state twice does not reserve it.
        hold: 0.8
        visual_cues:
          - id: pf-execution-boundary-b1
            phrase: Keep dispatch credentials outside the model. A separate service checks authorization,
              applicable policy and fresh page state before acting. If another worker paged after
              our snapshot, a previously correct recommendation does not authorize a second page.
