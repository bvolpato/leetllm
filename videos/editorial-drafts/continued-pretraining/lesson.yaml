scenes:
  - id: intro
    title: Which word completes the field report?
    visual: A broadly pretrained language model reads an unfamiliar domain document and begins predicting its next
      tokens.
    beats:
      - say: A model trained on broad text can write smoothly and still stumble on the language of a new field.
          Continued pretraining gives it more exposure to that field's ordinary text. Useful material can
          include manuals, reports, or field notes, provided the team has permission and the text reflects
          real work.
        hold: 0.55
        visual_cues:
          - id: intro-b1-1
            phrase: language of a new field
            targets:
              - field-context
            linger: 0.45
      - say: We will follow a model from a general starting point through domain documents, replay data, and two
          evaluation lanes. The goal is to learn where adaptation helps and where it can trade away other
          abilities.
        hold: 0.55
        visual_cues:
          - id: intro-b2-1
            phrase: general starting point
            targets:
              - continuation-probability
            linger: 0.45
      - say: Imagine a marine-biology team whose model reads general English well but rarely saw field guides. It
          should learn terms such as reef and tide in context while keeping the broad language skills its
          users still need. The model keeps learning next-token predictions. Record the additional corpus and
          its lineage to trace training exposure, then use controlled evaluations to test changes in behavior.
        hold: 0.75
        visual_cues:
          - id: intro-b3-1
            phrase: reef and tide in context
            targets:
              - field-context
            linger: 0.45
          - id: intro-b3-2
            phrase: keeping the broad language skills
            targets:
              - continuation-probability
            linger: 0.45
      - say: A logit is a score before probability normalization. In this two-class toy, start reef and tree equally
          likely. Increase reef’s logit while leaving tree’s logit fixed. Before the bars move, predict which
          way each probability moves.
        hold: 1.5
        visual_cues:
          - id: intro-probability-prediction
            phrase: Start reef and tree equally likely
            targets:
              - continuation-probability
            color: cyan
            linger: 0.5
      - say: A positive change to reef’s logit must move probability toward reef and away from tree. Hold that
          conservation rule while the domain fixture updates. In a larger vocabulary, increasing reef’s logit while holding
          every other logit fixed guarantees this probability direction.
        hold: 0.85
        visual_cues:
          - id: intro-probability-payoff
            phrase: move probability toward reef and away from tree
            targets:
              - continuation-probability
            color: cyan
            linger: 0.5
  - id: incident-controls
    title: One incident needs three separately testable interventions
    visual: One incident needs three separately testable interventions.
    beats:
      - say: Preserve the marine reef-and-tree teaching model. Beside it, open the article’s fictional payment
          incident. The assistant blames Wi-Fi for A U T H underscore TIMEOUT while the actual runbook
          describes exhausted worker connections, jittered retries and an idempotency token. One sampled
          answer cannot tell us whether retrieval, task behavior or text fit is the limiting failure.
        hold: 0.6
        visual_cues:
          - id: incident-controls-b1
            phrase: Preserve the marine reef-and-tree teaching model.
            targets:
              - incident-controls-construction
            color: cyan
            linger: 0.5
          - id: cpt-incident-runbook
            phrase: the actual runbook describes exhausted worker connections
            targets:
              - cpt-incident-evidence
            color: cyan
            linger: 0.45
      - say: First supply the correct runbook excerpt without changing weights. If it repairs the answer, retrieval is
          a useful baseline. Next compare direct supervised fine-tuning with continued pretraining followed by
          the same supervised recipe, on the same held-out incident tasks. S F T can teach facts and skills as
          well as format. These are candidate experiments, not mutually exclusive diagnoses.
        hold: 0.6
        visual_cues:
          - id: incident-controls-b2
            phrase: First supply the correct runbook excerpt without changing weights.
            targets:
              - incident-controls-construction
            color: cyan
            linger: 0.5
          - id: cpt-incident-retrieval
            phrase: If it repairs the answer, retrieval is a useful baseline.
            targets:
              - cpt-incident-answer
            color: cyan
            linger: 0.45
          - id: cpt-incident-matched
            phrase: continued pretraining followed by the same supervised recipe
            targets:
              - cpt-incident-experiments
            color: cyan
            linger: 0.45
      - say: Longer prompts spend context and compute. Full-attention pairwise prefill work grows quadratically in
          token count at fixed width, while projections, feed-forward work, cache reuse and retrieval
          contribute separately. Measure time to a useful supported answer and task accuracy. A fragmented
          identifier does not make in-context learning impossible, and vocabulary fit alone does not prove the
          benefit of an expensive adaptation.
        hold: 0.85
        visual_cues:
          - id: incident-controls-b3
            phrase: Longer prompts spend context and compute.
            targets:
              - incident-controls-construction
            color: cyan
            linger: 0.5
          - id: cpt-incident-pairs
            phrase: grows quadratically in token count
            targets:
              - cpt-incident-work
            color: cyan
            linger: 0.45
  - id: diagnose
    title: Match the training method to the failure
    visual: A task symptom branches to retrieval, continued pretraining, supervised fine-tuning, and preference
      optimization with distinct input signals.
    beats:
      - say: First identify what fails. Missing current facts may call for retrieval, while trouble modeling domain
          documents can justify another stretch of next-token training. Retrieval supplies outside evidence at
          answer time; continued pretraining changes patterns stored in model weights.
        hold: 0.55
        visual_cues:
          - id: diagnose-b1-1
            phrase: retrieval, while
            targets:
              - retrieve-path
            linger: 0.45
          - id: diagnose-b1-2
            phrase: changes patterns stored in model weights
            targets:
              - domain-path
            linger: 0.45
      - say: When output format fails, supervised fine-tuning provides prompt and response demonstrations. Preference
          methods learn from relative judgments between replies, including acceptable versus unacceptable
          answers. Here, compare two acceptable replies.
        hold: 0.55
        visual_cues:
          - id: diagnose-b2-1
            phrase: supervised fine-tuning
            targets:
              - supervised-path
            linger: 0.45
          - id: diagnose-preference-comparison
            phrase: Preference methods learn from relative judgments between replies
            targets:
              - preference-path
            color: yellow
            linger: 0.65
      - say: These stages can work together, but each spends compute on a different learning signal. Prefer domain
          text relevant to the product task and test its transfer. Cross-domain benefits are possible, so
          relevance guides data selection without guaranteeing a task gain.
        hold: 0.75
        visual_cues:
          - id: diagnose-b3-1
            phrase: different learning signal
            targets:
              - domain-path
              - supervised-path
              - preference-path
            color: cyan
            linger: 0.45
  - id: prompt-gradient
    title: An ignored prompt target can still carry a response derivative
    visual: An ignored prompt target can still carry a response derivative.
    beats:
      - say: In the article’s actual CPU dependency toy, two input embeddings are one, zero and zero, one. Their
          cumulative hidden vector at the scored response is one, one. A fixed output head maps it to logits
          one, one, zero. Score only response class two while ignoring the earlier prompt target. Predict
          whether either used prompt embedding receives a gradient. Pause.
        hold: 1.5
        visual_cues:
          - id: prompt-gradient-b1
            phrase: In the article’s actual CPU dependency toy, two input embeddings are one, zero and zero, one.
            targets:
              - prompt-gradient-construction
            color: cyan
            linger: 0.5
      - say: Both used input rows receive a gradient, because the scored prediction depends on both through that
          cumulative sum. The loss is about one point eight six two. Input row two is unused and has zero
          gradient in this separate input lookup table. Tied input and output weights would add another
          dependency path.
        hold: 0.6
        visual_cues:
          - id: prompt-gradient-b2
            phrase: Both used input rows receive a gradient, because the scored prediction depends on both through that
              cumulative sum.
            targets:
              - prompt-gradient-construction
            color: cyan
            linger: 0.5
          - id: cpt-dependency-backward
            phrase: Both used input rows receive a gradient
            targets:
              - cpt-dependency-rows
            color: cyan
            linger: 0.45
          - id: cpt-dependency-loss
            phrase: The loss is about one point eight six two.
            targets:
              - cpt-dependency-loss
            color: cyan
            linger: 0.45
          - id: cpt-dependency-unused
            phrase: Input row two is unused and has zero gradient
            targets:
              - cpt-dependency-unused
            color: cyan
            linger: 0.45
      - say: Response-only masking removes direct target losses; it does not detach causal context. Frozen parameters
          are a separate decision. The toy uses a cumulative sum rather than a Transformer and supplies a
          fixed head. Its actual CPU backward check establishes these dependencies, not the effect of a full
          adaptation run.
        hold: 0.85
        visual_cues:
          - id: prompt-gradient-b3
            phrase: Response-only masking removes direct target losses; it does not detach causal context.
            targets:
              - prompt-gradient-construction
            color: cyan
            linger: 0.5
  - id: scored-objective
    title: Count the positions the chosen causal loss can score
    visual: Count the positions the chosen causal loss can score.
    beats:
      - say: For decoder-only continued pretraining, each selected target is predicted from its represented preceding
          context. Sum the negative natural log probabilities over those targets, then divide by their
          positive count. An ordinary shifted block of n tokens with no earlier context scores n minus one
          positions. Padding and document-boundary masks can remove more.
        hold: 0.6
        visual_cues:
          - id: scored-objective-b1
            phrase: For decoder-only continued pretraining, each selected target is predicted from its represented
              preceding context.
            targets:
              - scored-objective-construction
            color: cyan
            linger: 0.5
          - id: cpt-objective-shift
            phrase: scores n minus one positions
            targets:
              - cpt-objective-pairs
            color: cyan
            linger: 0.45
      - say: Perplexity is the exponential of that mean negative log probability. Keep the scored-position set and
          available context fixed when comparing checkpoints. A seven-position toy can score six targets for
          continued pretraining while an authored response-only mask scores four. That changes the direct
          supervision, not which context can influence later predictions.
        hold: 0.6
        visual_cues:
          - id: scored-objective-b2
            phrase: Perplexity is the exponential of that mean negative log probability.
            targets:
              - scored-objective-construction
            color: cyan
            linger: 0.5
          - id: cpt-objective-four
            phrase: an authored response-only mask scores four
            targets:
              - cpt-objective-pairs
            color: cyan
            linger: 0.45
      - say: Raw runbooks reward continuations of runbook text. A later assistant dataset rewards the chosen response
          targets under its own serializer and masks. The token-level math can match while the data and
          behavior differ. Update only the parameters declared trainable, whether full weights or adapters; a
          label mask does not decide that parameter set.
        hold: 0.85
        visual_cues:
          - id: scored-objective-b3
            phrase: Raw runbooks reward continuations of runbook text.
            targets:
              - scored-objective-construction
            color: cyan
            linger: 0.5
          - id: cpt-objective-source
            phrase: A later assistant dataset rewards the chosen response targets
            targets:
              - cpt-objective-source
            color: cyan
            linger: 0.45
  - id: fertility-cost
    title: A tokenizer inspection measures pieces rather than competence
    visual: A tokenizer inspection measures pieces rather than competence.
    beats:
      - say: "Use the article’s explicit longest-match toy vocabulary. Timeout is one entry. For the uppercase
          identifier A U T H underscore TIMEOUT, A U T H is present but uppercase TIMEOUT is not. It produces
          nine pieces: A U T H, underscore and seven individual letters. This is an invented tokenizer, not
          production byte-pair encoding."
        hold: 0.6
        visual_cues:
          - id: fertility-cost-b1
            phrase: Use the article’s explicit longest-match toy vocabulary.
            targets:
              - fertility-cost-construction
            color: cyan
            linger: 0.5
          - id: cpt-fertility-pieces
            phrase: It produces nine pieces
            targets:
              - cpt-fertility-pieces
            color: cyan
            linger: 0.45
      - say: Those nine pieces spend more context than one. Measure corpus-wide token lengths with the actual
          checkpoint tokenizer before assigning a multiplier to all documents. If a whole sequence triples in
          length, its full-attention pair component grows ninefold at fixed width. Total forward work and
          measured latency include other operations.
        hold: 0.6
        visual_cues:
          - id: fertility-cost-b2
            phrase: Those nine pieces spend more context than one.
            targets:
              - fertility-cost-construction
            color: cyan
            linger: 0.5
          - id: cpt-fertility-pairs
            phrase: its full-attention pair component grows ninefold
            targets:
              - cpt-fertility-work
            color: cyan
            linger: 0.45
      - say: Keeping the existing vocabulary preserves its ID coordinates and matrix shapes. Continued pretraining
          does not automatically merge the nine pieces into a new token. Subwords can still represent the
          concept, so evaluate held-out text fit and incident tasks. High fertility is an inspection signal
          rather than proof that a vocabulary extension will improve quality.
        hold: 0.85
        visual_cues:
          - id: fertility-cost-b3
            phrase: Keeping the existing vocabulary preserves its ID coordinates and matrix shapes.
            targets:
              - fertility-cost-construction
            color: cyan
            linger: 0.5
  - id: vocabulary-shapes
    title: Adding a row changes both lookup and output support
    visual: Adding a row changes both lookup and output support.
    beats:
      - say: A vocabulary extension adds K rows to the input embedding and the output language-model head, from V by d
          to the quantity V plus K by d. Preserve old IDs, resize the configuration and tokenizer, and handle
          tied weights explicitly. Untied input and output tables need separate treatment. A lookup-table
          initialization alone is not a complete model conversion.
        hold: 0.6
        visual_cues:
          - id: vocabulary-shapes-b1
            phrase: A vocabulary extension adds K rows to the input embedding and the output language-model head, from V
              by d to the quantity V plus K by d.
            targets:
              - vocabulary-shapes-construction
            color: cyan
            linger: 0.5
          - id: cpt-vocab-resize
            phrase: Preserve old IDs, resize the configuration and tokenizer
            targets:
              - cpt-vocab-tables
            color: cyan
            linger: 0.45
      - say: "One candidate initializes a new input row as the average of its old subword rows: sum their vectors and
          divide by the number of pieces. The actual article cell expands five width-eight input embeddings to
          six and verifies that centroid. It does not resize a pretrained output head or establish useful
          contextual behavior."
        hold: 0.6
        visual_cues:
          - id: vocabulary-shapes-b2
            phrase: "One candidate initializes a new input row as the average of its old subword rows: sum their vectors
              and divide by the number of pieces."
            targets:
              - vocabulary-shapes-construction
            color: cyan
            linger: 0.5
          - id: cpt-vocab-centroid
            phrase: sum their vectors and divide by the number of pieces
            targets:
              - cpt-vocab-centroid
            color: cyan
            linger: 0.45
      - say: Initialization studies compare several choices. A reported twenty-twenty-six Hindi experiment in one
          Nemotron configuration found different useful input and output schemes, with norm calibration
          mattering. Initialization-time loss did not reliably predict later convergence. In that experiment,
          validation-loss rankings stabilized after fifty continued-pretraining steps. Downstream evaluation
          compared the selected method with the Mean-all baseline. Choose with short adaptation and retention
          evidence rather than treating a low initial loss as a universal selection rule.
        hold: 0.85
        visual_cues:
          - id: vocabulary-shapes-b3
            phrase: Initialization studies compare several choices.
            targets:
              - vocabulary-shapes-construction
            color: cyan
            linger: 0.5
          - id: cpt-vocab-evidence
            phrase: Initialization-time loss did not reliably predict later convergence.
            targets:
              - cpt-vocab-evidence
            color: cyan
            linger: 0.45
  - id: vocabulary-denominator
    title: An unchanged old logit can lose probability after expansion
    visual: An unchanged old logit can lose probability after expansion.
    beats:
      - say: Keep the article’s two old output rows two, zero and minus two, zero, and hidden vector zero, one. Both
          old logits are zero. Their exponential masses are one and one, so each receives probability one
          half. The mean row is also zero in this direction. Predict the old target’s probability after adding
          it. Pause.
        hold: 1.5
        visual_cues:
          - id: vocabulary-denominator-b1
            phrase: Keep the article’s two old output rows two, zero and minus two, zero, and hidden vector zero, one.
            targets:
              - vocabulary-denominator-construction
            color: cyan
            linger: 0.5
      - say: The denominator gains a third unit mass while the old logits remain zero. The old target probability
          becomes one third. Its negative log probability rises from about zero point six nine three to one
          point zero nine nine, an increase of natural log three halves, about zero point four zero five.
        hold: 0.6
        visual_cues:
          - id: vocabulary-denominator-b2
            phrase: The denominator gains a third unit mass while the old logits remain zero.
            targets:
              - vocabulary-denominator-construction
            color: cyan
            linger: 0.5
          - id: cpt-vocab-third
            phrase: The old target probability becomes one third.
            targets:
              - cpt-vocab-mass
            color: cyan
            linger: 0.45
          - id: cpt-vocab-nll
            phrase: an increase of natural log three halves
            targets:
              - cpt-vocab-loss
            color: cyan
            linger: 0.45
      - say: An initialization can reduce disruption without preserving the old softmax distribution. This exact
          computation isolates the output head. Input embeddings also change shape, and training dynamics and
          downstream retention still need measurement. Code Llama mostly retained the Llama tokenizer and
          added four special infilling markers; that is one documented design, not a general threshold for
          extending every domain vocabulary.
        hold: 0.85
        visual_cues:
          - id: vocabulary-denominator-b3
            phrase: An initialization can reduce disruption without preserving the old softmax distribution.
            targets:
              - vocabulary-denominator-construction
            color: cyan
            linger: 0.5
  - id: corpus
    title: Prepare domain text before training
    visual: Candidate field guides, duplicate pages, contaminated evaluation examples, and clean held-out
      documents move through separate corpus gates.
    beats:
      - say: Start with the documents the model should learn from. Remove boilerplate, corrupted extraction,
          near-duplicates, and text that the team has no right to use. Keep licensing, provenance, language,
          and date metadata beside each source so stale material can be removed later.
        hold: 0.55
        visual_cues:
          - id: corpus-b1-1
            phrase: documents the model should learn from
            targets:
              - source-records
            linger: 0.45
          - id: corpus-b1-2
            phrase: near-duplicates
            targets:
              - corpus-decisions
            linger: 0.45
      - say: Split evaluation material before training and check for overlap with source documents. Deduplication
          reduces repeated passages, while careful lineage keeps the held-out measurement meaningful.
        hold: 0.55
        visual_cues:
          - id: corpus-b2-1
            phrase: Split evaluation material
            targets:
              - held-out-source
            linger: 0.45
          - id: corpus-b2-2
            phrase: lineage
            targets:
              - training-manifest
            linger: 0.45
      - say: Tokenize with the checkpoint's tokenizer, inspect how important terms break into pieces, and record the
          tokenizer version. A vocabulary extension changes embeddings and makes perplexity comparisons more
          delicate.
        hold: 0.75
        visual_cues:
          - id: corpus-b3-1
            phrase: terms break into pieces
            targets:
              - tokenizer-pieces
            linger: 0.45
  - id: grouped-holdout
    title: Keep source revisions in one split before tokenization
    visual: Keep source revisions in one split before tokenization.
    beats:
      - say: The article groups related auth documents, webhook runbooks, S D K notes and payment A P I pages before
          splitting. A SHA two-fifty-six group bucket modulo four chooses validation for bucket zero and
          training otherwise. Every document with the same supplied group travels to the same split.
        hold: 0.6
        visual_cues:
          - id: grouped-holdout-b1
            phrase: The article groups related auth documents, webhook runbooks, S D K notes and payment A P I pages
              before splitting.
            targets:
              - grouped-holdout-construction
            color: cyan
            linger: 0.5
          - id: cpt-groups-buckets
            phrase: A SHA two-fifty-six group bucket modulo four
            targets:
              - cpt-groups
            color: cyan
            linger: 0.45
      - say: Its actual fixture places auth documents and S D K notes in training, and payment and webhook groups in
          validation, with no shared group identity. The function does not discover related groups for us.
          Incorrectly giving two near-duplicates different group names would pass its set-disjointness check.
        hold: 0.6
        visual_cues:
          - id: grouped-holdout-b2
            phrase: Its actual fixture places auth documents and S D K notes in training, and payment and webhook groups
              in validation, with no shared group identity.
            targets:
              - grouped-holdout-construction
            color: cyan
            linger: 0.5
          - id: cpt-groups-route
            phrase: places auth documents and S D K notes in training
            targets:
              - cpt-groups
            color: cyan
            linger: 0.45
          - id: cpt-groups-gap
            phrase: Incorrectly giving two near-duplicates different group names
            targets:
              - cpt-group-leak
            color: cyan
            linger: 0.45
      - say: Hash bucketing targets a fraction across many groups, not exactly one quarter of tokens in a small
          corpus. Check sizes, topic coverage and residual overlap. A common source, revision family or
          deduplication group can carry leakage across otherwise distinct filenames. Grouping and content
          screening protect different evidence paths.
        hold: 0.85
        visual_cues:
          - id: grouped-holdout-b3
            phrase: Hash bucketing targets a fraction across many groups, not exactly one quarter of tokens in a small
              corpus.
            targets:
              - grouped-holdout-construction
            color: cyan
            linger: 0.5
  - id: manifest-gate
    title: A clean-looking document still needs every approval flag
    visual: A clean-looking document still needs every approval flag.
    beats:
      - say: The article’s manifest admits public API documentation with verified rights, scrubbed sensitive content
          and no evaluation-only reservation. It excludes on-call notes with unresolved private information,
          clean held-out probes reserved for evaluation, and a vendor export without training rights. Only the
          eight-hundred-thousand-token API source survives.
        hold: 0.6
        visual_cues:
          - id: manifest-gate-b1
            phrase: The article’s manifest admits public API documentation with verified rights, scrubbed sensitive
              content and no evaluation-only reservation.
            targets:
              - manifest-gate-construction
            color: cyan
            linger: 0.5
          - id: cpt-manifest-admit
            phrase: Only the eight-hundred-thousand-token API source survives.
            targets:
              - cpt-manifest-rows
            color: cyan
            linger: 0.45
      - say: These flags record earlier review. This small function neither verifies a license nor detects secrets. It
          requires literal booleans for rights, scrubbing and evaluation reservation, and a nonnegative
          integer token count. A string spelling false is not a verified false value; a boolean token count is
          not an accepted integer in this exact type check.
        hold: 0.6
        visual_cues:
          - id: manifest-gate-b2
            phrase: These flags record earlier review.
            targets:
              - manifest-gate-construction
            color: cyan
            linger: 0.5
          - id: cpt-manifest-type
            phrase: A string spelling false is not a verified false value
            targets:
              - cpt-manifest-types
            color: cyan
            linger: 0.45
      - say: Preserve access restrictions and a removal path alongside provenance, language, date and source revision.
          A sensitive domain source may need stronger controls than public text. Quality, rights, privacy and
          evaluation isolation are separate decisions on the same document owner, before its tokens enter the
          training stream.
        hold: 0.85
        visual_cues:
          - id: manifest-gate-b3
            phrase: Preserve access restrictions and a removal path alongside provenance, language, date and source
              revision.
            targets:
              - manifest-gate-construction
            color: cyan
            linger: 0.5
          - id: cpt-manifest-remove
            phrase: a removal path alongside provenance
            targets:
              - cpt-manifest-owner
            color: cyan
            linger: 0.45
  - id: normalized-overlap
    title: A normalized hash screen has a precise comparison policy
    visual: A normalized hash screen has a precise comparison policy.
    beats:
      - say: The overlap cell lowercases text and collapses whitespace before hashing, while retaining the original
          strings for training. An auth-timeout candidate with changed case and spacing matches the held-out
          fingerprint and is removed. Two other candidate documents remain. The actual cell checks three
          candidates, one removal and two survivors.
        hold: 0.6
        visual_cues:
          - id: normalized-overlap-b1
            phrase: The overlap cell lowercases text and collapses whitespace before hashing, while retaining the original
              strings for training.
            targets:
              - normalized-overlap-construction
            color: cyan
            linger: 0.5
          - id: cpt-normalize-screen
