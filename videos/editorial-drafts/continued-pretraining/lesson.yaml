      - say: For S G D, the change is minus learning rate times gradient. AdamW instead tracks first and second
          moments, applies bias correction and divides the corrected first moment by the square root of the
          corrected second moment plus epsilon, with separate decoupled weight decay. At its first step from
          zero moments, those corrected moments are g and g squared.
