  - id: parser-layers
    title: Reject ambiguous bytes before comparing policy
    visual: Use raw ordered JSON key pairs, including identical duplicate decision keys, then exact
      field and type checks and trusted age and stale inputs. A visible conjunction stale AND
      age>=threshold computes eligible/not_eligible in both directions. The parser footer must say
      that NaN and Infinity are rejected and decoder RecursionError is relabeled. Explicit depth
      and response-size bounds still need enforcement. Do not label exception translation as a depth guard.
    beats:
      - say: "A complete candidate must first survive parsing. Python JSON parsing can otherwise accept duplicate keys by retaining one value and can accept nonstandard NaN or Infinity. This parser observes object pairs before dictionary conversion and rejects duplicate fields and nonstandard numbers. If the decoder raises RecursionError, the parser translates it into a named rejection. That catch sets no explicit nesting limit. Explicit depth and response-size bounds still need enforcement around decoding."
        hold: 0.6
        visual_cues:
          - id: ap-parser-layers-0
            phrase: "A complete candidate must first survive parsing. Python JSON parsing can otherwise accept duplicate keys by retaining one value and can accept nonstandard NaN or Infinity. This parser observes object pairs before dictionary conversion and rejects duplicate fields and nonstandard numbers. If the decoder raises RecursionError, the parser translates it into a named rejection. That catch sets no explicit nesting limit. Explicit depth and response-size bounds still need enforcement around decoding."
            targets:
              - ap-parser-layers-trace
            color: blue
            linger: 0.4
      - say: Next require exactly decision, rotation-window-days and source-line-IDs. The decision is one of
          two strings; the threshold is an actual integer, so Boolean true is rejected even though
          Python treats Boolean as an integer subclass. Evidence must be a string list matching the
          supported P seven line, and its numeric threshold must equal the trusted value.
        hold: 0.6
        visual_cues:
          - id: ap-parser-layers-1
            phrase: Next require exactly decision, rotation-window-days and source-line-IDs. The decision is one
              of two strings; the threshold is an actual integer, so Boolean true is rejected even
              though Python treats Boolean as an integer subclass. Evidence must be a string list
              matching the supported P seven line, and its numeric threshold must equal the trusted
              value.
            targets:
              - ap-parser-layers-trace
            color: cyan
            linger: 0.4
      - say: "Validate the trusted inputs too: key age is a nonnegative actual integer, stale is a Boolean,
          and policy threshold is present and nonnegative. Eligibility equals stale AND age at least
