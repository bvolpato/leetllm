            color: blue
            linger: 0.4
      - say: The executable classifier receives normalized status and error details. It retries a mapped
          rate-limit four-twenty-nine and transient statuses such as five-zero-three within a safe
          read’s budget. Credit or spending exhaustion needs quota intervention. Four-hundred,
          four-oh-one and four-oh-three need request, credential or access repair. An unknown
          four-twenty-nine goes to inspection, not an automatic retry.
        hold: 0.6
        visual_cues:
          - id: ap-admission-limits-1
            phrase: The executable classifier receives normalized status and error details. It retries a mapped
