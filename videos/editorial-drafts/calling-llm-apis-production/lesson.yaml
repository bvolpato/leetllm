scenes:
  - id: opening
    title: A correct notebook call times out in production
    visual: A shared clock advances through separate local-wait and remote-execution lanes. The local
      deadline closes while the illustrative remote job continues. Then a model candidate disagrees
      with trusted account age and policy, and the server compares those known values.
    beats:
      - say: >
          A model answers correctly in a notebook, then the deployed call stalls. The client times
          out, and the provider may still be processing the request. A local timeout ends the wait; remote
          work can continue.
        hold: 0.7
        motion_check:
          region:
            - 400
            - 400
            - 1300
            - 280
          minimumChangedFraction: 0.002
        visual_cues:
          - id: remote-lifetime-b1-1
            phrase: remote work can continue
            targets:
              - remote-lifetime
            color: pink
            linger: 0.6
          - id: ap-opening-0
            phrase: >
              A model answers correctly in a notebook, then the deployed call stalls. The client
              times out, and the provider may still be processing the request. A local timeout ends the
              wait; remote work can continue.
            targets:
              - ap-opening-trace
            color: blue
            linger: 0.4
      - say: >
          Our fictional account has a stale forty-five-day-old key. Policy P-7 sets rotation
          eligibility at thirty days, while the model proposes “not eligible.”
        hold: 0.75
        visual_cues:
          - id: trusted-key-age-b2-1
            phrase: forty-five-day-old key
            targets:
              - trusted-key-age
            color: blue
            linger: 0.6
          - id: ap-opening-1
            phrase: >
