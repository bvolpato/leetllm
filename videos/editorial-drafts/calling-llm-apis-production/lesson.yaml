          Check both directions. A fabricated negative result is still a policy error, not a safe
          replacement for missing evidence."
        hold: 0.6
        visual_cues:
          - id: ap-parser-layers-2
            phrase: "Validate the trusted inputs too: key age is a nonnegative actual integer, stale is a
