              eligibility at thirty days, while the model proposes “not eligible.”
            targets:
              - ap-opening-trace
            color: cyan
            linger: 0.4
      - say: >
          The server can check that answer against trusted facts. We’ll build a boundary that owns
          the credential, the deadline, validation, and the result shown to the caller.
        hold: 0.8
        visual_cues:
          - id: rotation-policy-result-b3-1
            phrase: check that answer
            targets:
              - rotation-policy-result
            color: green
            linger: 0.6
          - id: ap-opening-2
            phrase: >
