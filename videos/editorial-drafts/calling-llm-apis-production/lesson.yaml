  - id: secret-probe
    title: Keep the credential behind an enforced boundary
    visual: Carry one intent7e3b across caller/server boundary; key bytes remain in server scope.
      Compare missing/blank startup values, public-prefix build exposure and separate unauthorized
      caller admission.
    beats:
      - say: "Keep one account, intent and trace identity attached to the request. A provider credential authorizes billable work. Delivering its bytes to a browser or mobile client exposes them to that client, even when the connection uses encryption."
        hold: 0.6
        visual_cues:
          - id: ap-secret-probe-0
            phrase: "Keep one account, intent and trace identity attached to the request. A provider credential authorizes billable work. Delivering its bytes to a browser or mobile client exposes them to that client, even when the connection uses encryption."
            targets:
              - ap-secret-probe-trace
            color: blue
            linger: 0.4
      - say: The actual startup helper rejects an absent or blank key and prints only loaded status for its
          placeholder. That checks configuration presence. It does not establish provider
          permissions, isolation or a deployed access boundary. Next dot j s can inline referenced
          NEXT PUBLIC environment values into browser bundles; Vite exposes its configured public
          prefix, normally VITE. A secret must stay outside those public values.
        hold: 0.6
        visual_cues:
          - id: ap-secret-probe-1
            phrase: The actual startup helper rejects an absent or blank key and prints only loaded status for
              its placeholder. That checks configuration presence. It does not establish provider
              permissions, isolation or a deployed access boundary. Next dot j s can inline
              referenced NEXT PUBLIC environment values into browser bundles; Vite exposes its
              configured public prefix, normally VITE. A secret must stay outside those public
              values.
            targets:
              - ap-secret-probe-trace
            color: cyan
            linger: 0.4
      - say: Load deployment secrets through an authorized server integration, keep environment credentials
          separate, and revoke a leaked value. Authenticate the user, enforce tenant and resource
          permissions, and bound public route usage. Hiding the provider key does not stop an
          unauthenticated proxy from spending your quota. These local examples create no public
          route and use no live credential.
        hold: 0.6
        visual_cues:
          - id: ap-secret-probe-2
            phrase: Load deployment secrets through an authorized server integration, keep environment
              credentials separate, and revoke a leaked value. Authenticate the user, enforce tenant
              and resource permissions, and bound public route usage. Hiding the provider key does
              not stop an unauthenticated proxy from spending your quota. These local examples
              create no public route and use no live credential.
            targets:
              - ap-secret-probe-trace
            color: yellow
            linger: 0.4
