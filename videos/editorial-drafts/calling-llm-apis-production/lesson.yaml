  - id: timeout-contract
    title: Connection activity can outlive useful progress
    visual: Shared wall-clock shows separate connect/read/firsttext/overall timers. Heartbeat arrivals
      reset only readgap; firsttext timer expires independently. Separate cooperative cancellation
      cleanup extends actual wait while remote state remains unknown.
    beats:
      - say: A connect timeout covers connection establishment under that transport’s semantics, including
          the effects of D N S, T L S, proxies and connection reuse. A read timeout covers waiting
          for a received data chunk. HTTP clients can also bound writes and connection-pool
          acquisition. A read chunk is not necessarily one generated token.
        hold: 0.6
        visual_cues:
          - id: ap-timeout-contract-0
            phrase: A connect timeout covers connection establishment under that transport’s semantics,
              including the effects of D N S, T L S, proxies and connection reuse. A read timeout
              covers waiting for a received data chunk. HTTP clients can also bound writes and
              connection-pool acquisition. A read chunk is not necessarily one generated token.
            targets:
              - ap-timeout-contract-trace
            color: blue
            linger: 0.4
      - say: "A first-visible-text deadline needs a product-defined displayable-text milestone. A nonempty delta can contain only spaces or newlines, so receiving one does not necessarily satisfy that deadline. Metadata and heartbeats can keep a read timer satisfied while useful text remains absent. The overall task clock still includes retrieval, attempts, waits and validation. Choose these limits from the product and measured workload rather than assigning one universal number to every phase."
        hold: 0.6
        visual_cues:
          - id: ap-timeout-contract-1
            phrase: "A first-visible-text deadline needs a product-defined displayable-text milestone. A nonempty delta can contain only spaces or newlines, so receiving one does not necessarily satisfy that deadline. Metadata and heartbeats can keep a read timer satisfied while useful text remains absent. The overall task clock still includes retrieval, attempts, waits and validation. Choose these limits from the product and measured workload rather than assigning one universal number to every phase."
            targets:
              - ap-timeout-contract-trace
            color: cyan
            linger: 0.4
      - say: The actual asyncio exercise waits one millisecond for a stub that sleeps twenty milliseconds
          and returns timeout. Wait-for requests cancellation and waits for cleanup, so elapsed time
          can exceed its timeout. It cannot interrupt blocking synchronous work or prove a remote
          generator stopped. Use cooperative transport, measure overruns and preserve the uncertain
          remote outcome.
        hold: 0.6
        visual_cues:
          - id: ap-timeout-contract-2
            phrase: The actual asyncio exercise waits one millisecond for a stub that sleeps twenty milliseconds
              and returns timeout. Wait-for requests cancellation and waits for cleanup, so elapsed
              time can exceed its timeout. It cannot interrupt blocking synchronous work or prove a
              remote generator stopped. Use cooperative transport, measure overruns and preserve the
              uncertain remote outcome.
            targets:
