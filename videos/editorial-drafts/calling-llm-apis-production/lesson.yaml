  - id: jitter-geometry
    title: Randomize retry arrivals under an explicit delay rule
    visual: Six persistent worker IDs first align at one and three seconds in a hypothetical schedule,
      then replay supplied independent uniforms. Shared axes construct the full-jitter ceiling
      and decorrelated previous-sleep window with the supplied 0.5 draw. Keep capped ties visible.
      Label the lab values as calculated delays passed to a no-op sleeper, not measured elapsed waits.
    beats:
      - say: If workers fail together and all wait one second, then two, their next attempts cluster at
          elapsed times one and three seconds when request durations are omitted. Randomizing each
          worker’s waits spreads these arrivals. That reduces synchronization; it does not guarantee
          different time buckets or provider recovery.
        hold: 0.6
        visual_cues:
          - id: ap-jitter-geometry-0
            phrase: If workers fail together and all wait one second, then two, their next attempts cluster at
              elapsed times one and three seconds when request durations are omitted. Randomizing
              each worker’s waits spreads these arrivals. That reduces synchronization; it does not
