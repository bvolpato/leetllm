      digest unchanged.
    beats:
      - say: The Python tag constrains a Python minor line and Debian release, but tags can move to new
          patch builds. It is also multi-platform. An Arm laptop and an x86 worker can select
          different platform variants from the same tag. Matching recipes do not imply matching
