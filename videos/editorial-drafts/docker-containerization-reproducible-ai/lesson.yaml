  - id: context
    title: Choose which files cross the build boundary
    visual: A concrete project tree feeds a build-context boundary. The three ignore patterns stop
      synthetic local files; allowed source, fixture and requirements retain their identities. COPY
      selects only the application inputs.
    beats:
      - say: "A Docker image stores runtime files and a default command. Docker builds it from a recipe, the
          Dockerfile. The build context defines the project files the builder may read. BuildKit requests needed files as the build proceeds."
        hold: 0.65
        visual_cues:
          - id: context-files
            phrase: project files the builder may read
            targets:
              - project-files
            color: blue
            linger: 0.65
      - say: Here are a local environment file, a virtual environment, and model weights. Docker ignore
          rules keep those paths outside the context. Git ignore rules control a separate trip into
          version history.
        hold: 0.65
        visual_cues:
          - id: context-ignore
            phrase: Docker ignore rules keep those paths outside the context
            targets:
              - ignored-paths
              - dockerignore-rules
            color: pink
            linger: 0.65
      - say: COPY selects the scorer, its small fixture, and the dependency contract from the remaining
          files. The builder can read a file without putting that file into the final image.
