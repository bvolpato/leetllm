  - id: mount-diagnostics
    title: Find the failure boundary before rebuilding
    visual: Two separate traces stop at different places:missing source is rejected before
      launch;existing empty source launches and fails inside the scorer. Daemon-host ownership and
      read-only flags remain separate from image-file ownership.
    beats:
      - say: Two missing-path failures happen at different boundaries. With the default explicit bind mount,
          an absent host source is rejected before the scorer starts. If that directory exists but
          is empty, the mount succeeds and the scorer reports its missing fixture or fallback. A
          read-only mount still obscures the image directory; it does not merge or fall back to
          hidden image files.
        visual_cues:
          - id: dk-mount-diagnostics-beat0
