            targets:
              - platform-identity-construction
            color: cyan
            linger: 0.45
      - say: In this authored identity sketch, index I contains an amd64 manifest A and an arm64 manifest B.
          The index digest fixes that set; a platform-manifest digest fixes one member. Declare the
          deployment platform, such as Linux amd64, and verify the appropriate digest in both FROM
          lines. A tag can later move while the recorded content digest stays fixed.
        visual_cues:
          - id: dk-platform-identity-beat1
            phrase: In this authored identity sketch, index I contains
            targets:
              - platform-identity-construction
            color: blue
            linger: 0.5
          - id: dk-platform-identity-index
            phrase: The index digest fixes that set; a platform-manifest digest fixes one member.
            targets:
              - platform-identity-construction
            color: cyan
            linger: 0.45
          - id: dk-platform-identity-target
            phrase: verify the appropriate digest in both FROM lines.
            targets:
              - platform-identity-construction
            color: cyan
            linger: 0.45
      - say: An Arm machine may need emulation to build or run an amd64 image. Compilation under emulation
          can be slower, so test the target platform explicitly. These controls constrain inputs;
          they do not promise identical rebuild bytes or identical numerical output on every GPU.
          Promoting one tested image by registry digest preserves its artifact identity more
