  - id: permission-boundary
    title: The application user and daemon have different authority
    visual: The observed appuser UID10001 belongs to the process. A separate rootful-daemon capability
      remains outside the container. A mount brings its own numeric owner/mode and does not inherit
      ownership from the hidden image directory.
    beats:
      - say: Inspect the configured platform, user and entrypoint, then inspect the running identity
          separately. Our application UID is ten thousand and one. The group ID comes from user
          creation; do not assume it equals that UID. A successful read-only run proves this
          execution finished without writing to its root filesystem. It does not prove every future
          workload can do so.
        visual_cues:
          - id: dk-permission-boundary-beat0
            phrase: Inspect the configured platform, user and entrypoint, then
            targets:
              - permission-boundary-construction
            color: blue
            linger: 0.5
          - id: dk-permission-boundary-uid
            phrase: Our application UID is ten thousand and one.
            targets:
              - permission-boundary-construction
            color: cyan
            linger: 0.45
          - id: dk-permission-boundary-group
            phrase: do not assume it equals that UID.
            targets:
              - permission-boundary-construction
            color: cyan
            linger: 0.45
      - say: The application account does not limit whoever controls a normal rootful Docker daemon. Daemon
          access can carry host-level authority. A writable bind mount can also change permitted
          host files. Keep the Docker socket and unrelated host paths out of this scorer. A non-root
          label is not a complete isolation argument.
        visual_cues:
          - id: dk-permission-boundary-beat1
            phrase: The application account does not limit whoever controls
            targets:
              - permission-boundary-construction
            color: blue
            linger: 0.5
          - id: dk-permission-boundary-daemon
            phrase: Daemon access can carry host-level authority.
            targets:
              - permission-boundary-construction
            color: cyan
            linger: 0.45
      - say: On a normal Linux Engine without user-namespace remapping, numeric ownership and modes govern
          mounted-path access. The process needs directory traversal and file-read permission; a
          writable destination needs write permission too. Rootless engines and Desktop can map
          identities differently. Prepare storage for the intended account rather than hiding the
          setup defect by running everything as root.
        visual_cues:
          - id: dk-permission-boundary-beat2
            phrase: On a normal Linux Engine without user-namespace remapping,
            targets:
              - permission-boundary-construction
            color: blue
            linger: 0.5
          - id: dk-permission-boundary-mode
            phrase: The process needs directory traversal and file-read permission; a writable destination needs
              write permission too.
            targets:
              - permission-boundary-construction
            color: cyan
            linger: 0.45
