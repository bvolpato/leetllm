  - id: mounts
    title: Which directory will the process see?
    visual: The image fixture stays visible in a separate stored-files view. A synthetic empty host
      directory moves onto the running container path; the visible read target changes, the exact
      fallback error appears, and removing the mount restores the original report without a rebuild.
    beats:
      - say: The copied fixture is a build-time snapshot. Now place an empty host directory at the same
          container path. Before we run it, predict whether the scorer can still read the rows
          stored in the image.
        hold: 1.1
        visual_cues:
          - id: mount-prediction
            phrase: predict whether the scorer can still read the rows
            targets:
              - mount-path
            color: yellow
            linger: 0.65
      - say: The mount attaches the empty directory at app slash eval. That host directory becomes the
          visible read target. The image’s copied rows remain stored underneath the mounted path.
        hold: 0.7
        motion_check:
          region:
            - 180
            - 325
            - 1580
            - 560
          minimumChangedFraction: 0.002
        visual_cues:
          - id: mount-overlay
            phrase: mount attaches the empty directory
            targets:
