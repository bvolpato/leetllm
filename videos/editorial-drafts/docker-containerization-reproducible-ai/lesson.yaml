scenes:
  - id: opening
    title: Will the same command run here?
    visual: The copied project paths stay beside a waiting shell. The failure appears inside the terminal, then the Python runtime appears beneath the project.
    beats:
      - say: The files arrived. Will this scorer run on a second machine? The command still asks that
          machine to supply something. Make a prediction before we press Enter.
        hold: 1.15
        visual_cues:
          - id: opening-predict
            phrase: before we press Enter
            targets:
              - opening-command
            color: yellow
            linger: 0.65
      - say: Assume this command cannot find a usable Python interpreter on the second machine. Let’s give the scorer its own runtime. Then we’ll run an experiment with the
          same image and an empty host folder.
        hold: 0.65
        visual_cues:
          - id: opening-submit
            phrase: Assume this command cannot find a usable Python interpreter on the second machine
            targets:
              - opening-error
            color: pink
            linger: 0.65
          - id: opening-runtime
            phrase: its own runtime
            targets:
              - opening-runtime
            color: cyan
            linger: 0.65
  - id: runtime-contract
    title: Name every input that reaches the process
    visual: The same scorer read pointer visits a placement board:base Python/OS and code in the
      image,fixture on an optional mount,credential absent. A client-only Docker installation stops
      before the engine creates any container.
    beats:
      - say: The same command depends on more than source files. Place Python, operating-system libraries,
          application code and installed packages in the image. Place run-specific data on a
          declared input path. Give a credential only to a process that actually consumes it. A host
          virtual environment is another host dependency, not a portable image contract.
        visual_cues:
          - id: dk-runtime-contract-beat0
            phrase: The same command depends on more than source
            targets:
              - runtime-contract-construction
            color: blue
            linger: 0.5
          - id: dk-runtime-contract-data
            phrase: Place run-specific data on a declared input path.
            targets:
              - runtime-contract-construction
            color: cyan
            linger: 0.45
          - id: dk-runtime-contract-secret
            phrase: Give a credential only to a process that actually consumes it.
            targets:
              - runtime-contract-construction
            color: cyan
            linger: 0.45
      - say: Docker’s command-line client asks a running engine to build or launch the image. Check that
          Docker version reports both client and server. Docker Desktop’s Linux containers use a
          Linux virtual machine; a Linux Engine uses its host kernel. Our scorer needs Linux
          user-space files and a readable fixture, not a GPU or an API key.
        visual_cues:
          - id: dk-runtime-contract-beat1
            phrase: Docker’s command-line client asks a running engine to
            targets:
