  - id: cache
    title: An unchanged input can reuse completed work
    visual: A simplified cache-key model hashes instruction and input identities. A source edit travels
      only to application work while the install key holds. A dependency-contract edit changes the
      install key and invalidates dependent work.
    beats:
      - say: Each build step has inputs. This simplified key sketch ties installation to the base, the
          instruction, and the requirements file. Keeping that contract before application code
          gives stable work a reusable place.
        hold: 0.65
        visual_cues:
          - id: cache-contract
            phrase: base, the instruction, and the requirements file
            targets:
              - installer-key
            color: blue
            linger: 0.65
      - say: Change only the scorer. Its file identity changes, so Docker looks for a matching cached result for the application copy and runs the step if none exists. The
          earlier dependency installation still has the same inputs, so Docker can reuse its result.
        hold: 0.65
        motion_check:
          region:
