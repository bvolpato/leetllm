  - id: stage-inheritance
    title: A new FROM starts a new filesystem
    visual: Builder and independently based runtime keep separate PATH variables,OS-library shelves and
      file inventories. Only /opt/venv crosses COPY;the missing runtime library remains visibly
      absent until explicitly supplied.
    beats:
      - say: Each FROM starts a separate stage. Our runtime starts from the Python base again, rather than
          FROM builder. It therefore needs its own environment settings. Copying slash opt slash
          venv moves those files; it does not copy the builder’s PATH variable, compiler or every
          operating-system library. A runtime declared FROM builder inherits that stage’s filesystem
          and environment settings. Restarting from the original base does not inherit those builder
          additions.
        visual_cues:
          - id: dk-stage-inheritance-beat0
            phrase: Each FROM starts a separate stage. Our runtime
            targets:
              - stage-inheritance-construction
            color: blue
            linger: 0.5
          - id: dk-stage-inheritance-copy
            phrase: it does not copy the builder’s PATH variable, compiler or every operating-system library.
            targets:
              - stage-inheritance-construction
            color: cyan
            linger: 0.45
          - id: dk-stage-inheritance-inherit
            phrase: A runtime declared FROM builder inherits that stage’s filesystem and environment settings.
            targets:
              - stage-inheritance-construction
            color: cyan
            linger: 0.45
      - say: Imagine a future native package whose extension needs a shared library. Its Python files can
          exist inside the copied environment while import still fails because the runtime lacks
          that library. Use a compatible runtime base and install the required runtime libraries
          there. Keep both stages’ Python and environment paths compatible. Two stages are not
          inherently smaller for our empty dependency list.
        visual_cues:
          - id: dk-stage-inheritance-beat1
            phrase: Imagine a future native package whose extension needs
            targets:
              - stage-inheritance-construction
            color: blue
            linger: 0.5
          - id: dk-stage-inheritance-missing
            phrase: the runtime lacks that library.
            targets:
              - stage-inheritance-construction
            color: pink
            linger: 0.45
          - id: dk-stage-inheritance-repair
            phrase: install the required runtime libraries there.
            targets:
              - stage-inheritance-construction
            color: cyan
            linger: 0.45
      - say: WORKDIR sets the base for later relative paths. COPY normally gives files root ownership;
          readable root-owned files may still be readable by appuser. COPY with chown makes the
          intended ownership explicit. USER selects the process identity. The JSON-array ENTRYPOINT
          records Python and the scorer filename as separate arguments.
        visual_cues:
          - id: dk-stage-inheritance-beat2
            phrase: WORKDIR sets the base for later relative paths.
            targets:
              - stage-inheritance-construction
            color: blue
            linger: 0.5
