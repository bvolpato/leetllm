  - id: dependency-artifacts
    title: A version is not the whole downloaded artifact
    visual: A fictional package release points to two wheels and a source archive. The actual install
      command consumes requirements.txt while an unused lock stays outside that dependency edge. An
      allowed-hash set gates downloads.
    beats:
      - say: A version pin chooses a release, but that release may offer several wheels and a source
          archive. A wheel is a prebuilt distribution. The allowed artifact hash checks downloaded
          bytes. With require hashes, list and pin every dependency, including dependencies of
          dependencies. An empty requirements file passes because it asks for no packages.
        visual_cues:
          - id: dk-dependency-artifacts-beat0
            phrase: A version pin chooses a release, but that
            targets:
              - dependency-artifacts-construction
            color: blue
            linger: 0.5
          - id: dk-dependency-artifacts-hash
            phrase: The allowed artifact hash checks downloaded bytes.
            targets:
              - dependency-artifacts-construction
            color: cyan
            linger: 0.45
          - id: dk-dependency-artifacts-closure
            phrase: including dependencies of dependencies.
            targets:
              - dependency-artifacts-construction
            color: cyan
            linger: 0.45
      - say: The install command must consume the dependency contract. Our pip command reads requirements
          dot txt. Merely adding a lockfile beside it does not change that command’s resolution.
          Export the reviewed lock into the hashed requirements, or use that lock manager’s frozen
          install command. When pip must fetch and install a package, a missing required hash causes failure. An already installed package can satisfy a requirement without an artifact hash check. Start with a clean environment and account for its preinstalled packages.
        visual_cues:
          - id: dk-dependency-artifacts-beat1
            phrase: The install command must consume the dependency contract.
            targets:
              - dependency-artifacts-construction
            color: blue
            linger: 0.5
          - id: dk-dependency-artifacts-unused
            phrase: Merely adding a lockfile beside it does not change that command’s resolution.
