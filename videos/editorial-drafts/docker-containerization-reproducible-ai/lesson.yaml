            color: green
            linger: 0.65
      - say: Restore the script, then change requirements. Changing requirements changes the installation cache key. Docker reruns installation unless a matching cached result is available. When the installed environment changes, the runtime receives new files too.
          Follow the dependency arrows to see which work needs revisiting.
