      - say: Return to our two-release accountant and epsilon cap two. Public prompts that use only the accounted
          released model are post-processing and add no new training-data access. An authorized database
          lookup of raw private tickets is a separate exposure; the training guarantee does not cover it.
          New private prompts and logs need their own controls too.
        hold: 0.8
        visual_cues:
