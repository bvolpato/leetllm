      - say: "If a private selection statistic becomes a third release, the computed bound rises above the cap and the plan stays blocked. Choose public selection or redesign and account for the complete pipeline. You can now connect protected units, sensitivity, clipping, noise, sampling and every release to one declared guarantee, then measure held-out utility and attack behavior without confusing either measurement with the proof. Next, active labeling governs the evidence before training: who may see a trace, which rubric defines its label and which records must remain reserved for evaluation."
        hold: 0.8
        visual_cues:
