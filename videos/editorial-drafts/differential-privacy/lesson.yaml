      - say: Count release dependence correctly. Checkpoints that are post-processing of a joint transcript
          already covered by one valid DP analysis need no separate budget beyond that transcript
          guarantee. Separate training runs on overlapping protected users generally compose. For fixed
          disjoint protected-user groups, parallel composition can use the maximum group budget instead
          of summing across groups, provided no protected user crosses groups. A checkpoint selected
          using new raw private scores is an additional data path even when those scores are not
          published.
        hold: 0.8
        visual_cues:
