  - id: coordinate-noise
    title: Count the perturbed coordinates before judging utility
    visual: The same per-coordinate scale fills two parameter spaces, with squared lengths accumulating by
      dimension.
    beats:
      - say: Independent Gaussian coordinates with standard deviation sigma C have expected squared norm d times
          sigma squared C squared. The root mean square norm is sigma C times square root d. After fixed
          public normalizer L and learning rate eta, the parameter-step RMS becomes eta sigma C square
          root d divided by L.
        hold: 1.2
        visual_cues:
          - id: coordinate-noise-b1
            phrase: Independent Gaussian coordinates with standard deviation sigma C have expected squared norm d
              times sigma squared C squared
            targets:
              - coordinate-noise-mechanism
            linger: 0.5
      - say: For illustrative seven-billion full-model coordinates versus five-million adapter coordinates at the
          same scale, the RMS ratio is square root fourteen hundred, about thirty-seven point four two.
          The ratio of expected squared norms is fourteen hundred. Neither quantity is an accuracy ratio
          or a privacy-budget ratio. Different parameterizations turn equal coordinate-space noise into
          different functional changes.
        hold: 0.8
        visual_cues:
          - id: coordinate-noise-b2
            phrase: For illustrative seven-billion full-model coordinates versus five-million adapter coordinates at
              the same scale, the RMS ratio is square root fourteen hundred, about thirty-seven point
              four two
            targets:
              - coordinate-noise-mechanism
            linger: 0.5
          - id: dp-result-coordinate-noise-rms-ratio
            phrase: the RMS ratio is square root fourteen hundred, about thirty-seven point four two
            targets:
              - coordinate-noise-mechanism
            color: cyan
            linger: 0.4
          - id: dp-result-coordinate-noise-energy-ratio
            phrase: The ratio of expected squared norms is fourteen hundred
            targets:
              - coordinate-noise-mechanism
            color: cyan
            linger: 0.4
      - say: Private adapter training clips and perturbs its own protected-unit gradients while the base stays
          fixed. That fine-tuning analysis does not retroactively protect a non-private base trained on
          the same person. It protects incremental fine-tuning participation conditional on that fixed
          base. Protecting the person across both stages requires an analysis of both stages data
          dependence.
        hold: 0.8
        visual_cues:
          - id: coordinate-noise-b3
            phrase: Private adapter training clips and perturbs its own protected-unit gradients while the base stays
              fixed
            targets:
              - coordinate-noise-mechanism
            linger: 0.5
      - say: A low-rank adapter computes frozen base W-zero plus alpha divided by rank, times B times A. For
          input width d-in, output width d-out and rank r, those two factors contain r times the sum of
          d-in and d-out trainable coordinates, compared with d-in times d-out full weights. DP adapter
          training forms each protected-unit gradient over both factors, clips its joint contribution and
          perturbs those trainable coordinates. The frozen base still executes; parameter counts alone
          establish neither training speed nor task quality.
        hold: 0.8
        visual_cues:
          - id: coordinate-noise-extension-4
            phrase: A low-rank adapter computes frozen base W-zero plus alpha divided by rank, times B times A
            targets:
              - coordinate-noise-extension-4
            linger: 0.5
  - id: earned-transfer
    title: Choose the release that keeps its promise
    visual: A fresh clipped contribution changes the sum; a third accounted private release tests the
      preserved budget cap.
    beats:
      - say: Try a new gradient with coordinates six and eight at clip bound two. Its norm is ten. Multiply both
          coordinates by one fifth to get one point two and one point six. Under add-remove adjacency it
          can change the sum by at most two; replacing one bounded vector with its opposite can change it
          by four. The same public normalizer scales both the sensitivity and the noise.
        hold: 1.2
        visual_cues:
