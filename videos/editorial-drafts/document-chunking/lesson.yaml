            linger: 0.35
          - id: late-offset-pool
            phrase: select content-token states
            targets:
              - late-boundaries-operation
            linger: 0.35
      - say: The encoder must expose token states, the input must fit, and its attention pattern must permit the intended context. Whole-document context is not unlimited. The paper also handles longer documents with overlapping larger windows, so a span sees bounded context. This mean-pooling method stores one vector per chunk. Late interaction retains multiple vectors for token-level scoring; it is a different design.
        hold: 0.8
        visual_cues:
          - id: late-boundaries-1
            phrase: The encoder must expose token states, the input must fit, and its attention pattern must permit the intended context
            targets:
              - late-boundaries-operation
            linger: 0.4
      - say: "A public span encoded beside restricted text can have a vector influenced by that restricted context. Filtering the returned text leaves this dependency in the vector. Keep shared encoder inputs within the intended permission and trust scope, and record the context version used to produce each vector. This is a mechanism-based risk, not a measured extraction attack. A better vector also does not insert the missing antecedent into returned evidence: supply that text explicitly or expand the permitted parent."
