    visual: Two child matches point to one retained parent; stale version,denied access and too-small budget are repaired separately.
    beats:
      - say: Follow both child pointers in the actual article fixture. One contains fifteen minutes with deploy ID; the other says include the service name. They point to the same fourteen-word parent section. Two hits yield one parent copy, not twenty-eight words. A twenty-word toy budget accepts it. The complete parent restores the rollback condition and keeps its source page and version.
        hold: 0.8
        visual_cues:
          - id: checked-parent-0
            phrase: Follow both child pointers in the actual article fixture
            targets:
              - checked-parent-operation
            linger: 0.4
          - id: parent-dedup
            phrase: Two hits yield one parent copy
            targets:
              - checked-parent-operation
            linger: 0.35
      - say: "Change only one child version from three to two. Expansion rejects the stale child-to-parent link. Restore version three and remove the parent permission: parent access denied. Restore permission but lower the word budget to ten: context budget exceeded; select smaller complete evidence. More child hits do not repair any of these failures. The fixture checks permission before version and checks the complete deduplicated context budget before returning it."
        hold: 0.8
        visual_cues:
          - id: checked-parent-1
            phrase: Change only one child version from three to two
            targets:
              - checked-parent-operation
            linger: 0.4
          - id: parent-stale
            phrase: Expansion rejects the stale child-to-parent link
            targets:
              - checked-parent-operation
            linger: 0.35
          - id: parent-denied
            phrase: parent access denied
            targets:
              - checked-parent-operation
            linger: 0.35
          - id: parent-small
            phrase: context budget exceeded
            targets:
              - checked-parent-operation
            linger: 0.35
      - say: The serving host supplies allowed parent IDs from a real authorization decision. Carry immutable document and chunking versions, check the expanded parent as well as the child, and deduplicate before measuring the final packed prompt with the generator tokenizer. Never silently remove the deadline to make a parent fit. Words make this lab visible; a production call must reserve its own instruction,question and output tokens.
        hold: 0.8
        visual_cues:
          - id: checked-parent-2
            phrase: The serving host supplies allowed parent IDs from a real authorization decision
            targets:
              - checked-parent-operation
            linger: 0.4
  - id: semantic-cosine
    title: Construct a topic boundary from actual vectors
    visual: Neighboring sentence vectors share one incident axis before a commander sentence turns onto an orthogonal axis; zero vectors remain unknown.
    beats:
      - say: "The semantic lab counts whole words into two hand-written topic coordinates. Rollback failures require deploy IDs activates rollback and deploy, giving two, zero. Page on-call within fifteen minutes activates minutes, giving one, zero. Commander handoff uses the active incident channel gives zero, three. Whole-word matching matters: id is not a substring match inside incident. These are transparent topic counts, not trained embeddings."
        hold: 0.8
        visual_cues:
          - id: semantic-cosine-0
            phrase: The semantic lab counts whole words into two hand-written topic coordinates
            targets:
              - semantic-cosine-operation
            linger: 0.4
      - say: "Compute cosine as dot product divided by the product of vector lengths. The first pair has cosine one: same direction despite different magnitude. The second pair has dot product zero and cosine zero. With a supplied point-five threshold, keep the first pair together and propose a boundary before the commander sentence. Similarity proposes a cut; the hard size limit and labeled evidence checks still decide whether it works."
        hold: 0.8
        visual_cues:
          - id: semantic-cosine-1
            phrase: Compute cosine as dot product divided by the product of vector lengths
            targets:
              - semantic-cosine-operation
            linger: 0.4
          - id: cosine-first
            phrase: The first pair has cosine one
            targets:
              - semantic-cosine-operation
            linger: 0.35
          - id: cosine-second
            phrase: The second pair has dot product zero and cosine zero
            targets:
              - semantic-cosine-operation
            linger: 0.35
      - say: Add No action is required. Its vector is zero, zero, so its cosine is undefined rather than evidence of an abrupt topic change. Send that boundary for review. Real embedding thresholds need tuning on representative cases. A similarity rule that detaches an exception, condition or antecedent can still make a well-formed but unanswerable chunk.
        hold: 0.8
        visual_cues:
          - id: semantic-cosine-2
            phrase: Add No action is required
            targets:
              - semantic-cosine-operation
            linger: 0.4
          - id: cosine-undefined
            phrase: undefined rather than evidence
            targets:
              - semantic-cosine-operation
