scenes:
  - id: subject-intro
    title: One cut can remove the rule’s meaning
    visual: A runbook sentence separates into a condition, deadline, and deploy identifier; a question arrives that needs all three pieces together.
    beats:
      - say: An incident runbook says that after a rollback failure, page the on-call person within fifteen minutes and include the deploy ID.
        hold: 0.55
        visual_cues:
          - id: subject-intro-beat-1-focus-1
            phrase: page the on-call person within fifteen minutes and include the deploy ID
            targets:
              - subject-intro-object-incident-runbook-page-7-rollback-failure-page-on-c-1
            color: blue
            linger: 0.6
      - say: An engineer asks what triggers the page and which ID to include. This cut keeps the fifteen-minute deadline and the deploy ID. What went missing? The words “rollback failure” stayed behind.
        hold: 0.75
        visual_cues:
          - id: subject-intro-beat-2-focus-1
            phrase: This cut keeps the fifteen-minute deadline and the deploy ID
            targets:
              - subject-intro-object-incident-runbook-page-7-rollback-failure-page-on-c-1
            color: blue
            linger: 0.6
      - say: Chunking decides where searchable evidence units begin and end. Let’s test how different cuts preserve the rule a reader needs.
        hold: 0.55
        visual_cues:
          - id: subject-intro-beat-3-focus-1
            phrase: Chunking decides where searchable evidence units begin and end
            targets:
              - subject-intro-object-incident-runbook-page-7-rollback-failure-page-on-c-1
            color: blue
            linger: 0.6
  - id: answerable-units
    title: Judge a chunk by the question it can answer
    visual: Three candidate passages are compared for condition, deadline, and identifier; only the complete rollback sentence satisfies the runbook question.
    beats:
      - say: "A searchable fragment can still be incomplete evidence. “Rollback failure: page on-call within” has the condition, but leaves out the deadline and required identifier."
        hold: 0.55
        visual_cues:
          - id: answerable-units-beat-1-focus-1
            phrase: but leaves out the deadline and required identifier
            targets:
              - answerable-units-simulation-3
            color: blue
            linger: 0.6
      - say: Another fragment has “fifteen minutes with deploy ID” but no condition. It could be mistaken for the routine archive rule beside it.
        hold: 0.75
        visual_cues:
          - id: answerable-units-beat-2-focus-1
            phrase: Another fragment has “fifteen minutes with deploy ID” but no condition
            targets:
              - answerable-units-simulation-3
            color: blue
            linger: 0.6
      - say: The complete sentence keeps the condition, time limit, and identifier together. This query-specific completeness is what the chunk must preserve.
        hold: 0.55
        visual_cues:
          - id: answerable-units-beat-3-focus-1
            phrase: The complete sentence keeps the condition
            targets:
              - answerable-units-simulation-3
            color: blue
            linger: 0.6
  - id: fixed-windows
    title: A word window makes boundaries easy to see
    visual: A six-word window advances across the runbook, cutting between the number fifteen and its unit minutes; source positions remain attached to each slice.
    beats:
      - say: A fixed window is a simple baseline. Choose a size, move forward by that many tokens, and optionally repeat some overlap from the prior window.
        hold: 0.55
        motion_check:
          region:
            - 120
            - 390
            - 1680
            - 390
          minimumChangedFraction: 0.002
        visual_cues:
          - id: fixed-windows-beat-1-focus-1
            phrase: A fixed window is a simple baseline
            targets:
              - fixed-windows-simulation-7
            color: blue
            linger: 0.6
      - say: For this visible word-count fixture, the first six-word slice ends at “fifteen.” The unit “minutes” begins the next slice.
        hold: 0.75
        visual_cues:
          - id: fixed-windows-beat-2-focus-1
            phrase: For this visible word-count fixture
            targets:
              - fixed-windows-simulation-7
            color: blue
            linger: 0.6
      - say: Production size checks should use the embedding model’s tokenizer, including headings and special tokens. A word count is only a teaching stand-in.
        hold: 0.55
        visual_cues:
