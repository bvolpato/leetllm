  - id: late-boundaries
    title: Keep the encoder context and returned evidence explicit
    visual: The same token-span boundaries are pooled after shared contextual encoding; cross-scope text is then removed from the encoder input.
    beats:
      - say: Our earlier eight-position schematic uses display words and an ellipsis as token stand-ins, with illustrative feature values. It shows shared encoding before pooling a selected span. Late chunking keeps boundary cues but lets contextual token states use a longer shared input before mean pooling. Map source spans to tokenizer offsets, select content-token states, handle special tokens deliberately and apply the model-specific normalization. Averaging independently encoded chunk vectors does not recreate that shared context.
        hold: 0.8
        visual_cues:
          - id: late-boundaries-0
            phrase: Our earlier eight-position schematic uses display words and an ellipsis as token stand-ins
            targets:
