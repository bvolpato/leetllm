  - id: manifest-release
    title: Earn the ready flag before checking metadata
    visual: A complete evaluated chunk and a broken fragment share plausible metadata; the prior evidence decision determines which enters the index.
    beats:
      - say: Build the release manifest from the tested runbook. Its local gate requires a prior ready quality decision, nonempty text, source, locator, heading and chunk checksum. The complete rollback chunk passes; the broken deadline fragment remains in review. The function checks fields and a prior decision. It does not compute answerability, authenticate the reviewer or make a splitter-written ready flag trustworthy.
        hold: 0.8
        visual_cues:
          - id: manifest-release-0
            phrase: Build the release manifest from the tested runbook
            targets:
              - manifest-release-operation
            linger: 0.4
          - id: manifest-ready
            phrase: The complete rollback chunk passes
            targets:
              - manifest-release-operation
            linger: 0.35
      - say: The chunk checksum hashes this chunk text. Editing its bytes will almost certainly change its SHA-two-fifty-six checksum. Compare against a trusted prior digest to check for changes. A hash does not certify meaning or producer authenticity and is not the original document checksum. Preserve the ingestion checksum and immutable source version separately. Include source version, splitter configuration and source spans in the index manifest. The index update must explicitly replace or deactivate old records, or retrieval must filter to the active release. Recording the manifest alone leaves old records searchable.
        hold: 0.8
        visual_cues:
          - id: manifest-release-1
            phrase: The chunk checksum hashes this chunk text
            targets:
              - manifest-release-operation
            linger: 0.4
          - id: manifest-edit
            phrase: Editing its bytes will almost certainly change its SHA-two-fifty-six checksum
            targets:
              - manifest-release-operation
            linger: 0.35
      - say: Production records also need ingestion trust labels and authorization scope. Quarantined evidence stays blocked, and permissions apply to the final expanded context. Start this runbook with heading-aware sections, recursive fallback, tokenizer size checks, preserved table headers and source provenance. Add overlap,parent expansion,semantic boundaries or late chunking only when a measured failure justifies their extra work.
        hold: 0.8
        visual_cues:
          - id: manifest-release-2
            phrase: Production records also need ingestion trust labels and authorization scope
            targets:
              - manifest-release-operation
            linger: 0.4
  - id: evaluation-limits
    title: Separate a published finding from a deployment rule
    visual: Chunk size and retrieved-context budget occupy different rulers; the source experiment remains labeled while the runbook evidence decides its own configuration.
    beats:
      - say: Bennani and Moslonka evaluated Wikipedia Natural Questions with SPLADE retrieval and a Ministral eight-billion instruction model. They varied chunks from fifty to five hundred tokens, overlap zero or twenty percent, and retrieved generator context from five hundred to ten thousand tokens. They filled a context budget in rank order rather than holding top-k fixed. This is a particular pipeline and corpus, not proof about every embedder or policy document.
        hold: 0.8
        visual_cues:
          - id: evaluation-limits-0
            phrase: Bennani and Moslonka evaluated Wikipedia Natural Questions with SPLADE retrieval and a Ministral eight-billion instruction model
            targets:
              - evaluation-limits-operation
            linger: 0.4
      - say: Their sentence-preserving splits matched semantic splitting up to roughly five thousand retrieved-context tokens. That number is a context budget, not a five-thousand-token chunk recommendation. In their comparisons, overlap added indexing cost without a measurable quality gain. The runbook uses its own complete-rule tests to decide whether a boundary repair earns its cost.
        hold: 0.8
        visual_cues:
          - id: evaluation-limits-1
            phrase: Their sentence-preserving splits matched semantic splitting up to roughly five thousand retrieved-context tokens
            targets:
              - evaluation-limits-operation
            linger: 0.4
          - id: study-context-five
            phrase: roughly five thousand retrieved-context tokens
            targets:
              - evaluation-limits-operation
            linger: 0.35
      - say: Keep answer metrics distinct. That study reported semantic similarity, exact match and abstention, with uncertainty over questions. More context can add distractors; different metrics can prefer different budgets. Compare the actual answer, citations and useful evidence under a declared budget. Our three smoke cases and hand-written vectors establish arithmetic and boundary behavior, not a production quality ranking.
        hold: 0.8
        visual_cues:
