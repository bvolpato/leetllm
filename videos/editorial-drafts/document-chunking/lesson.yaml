            phrase: A short child span can make a focused search candidate
            targets:
              - parent-child-context-object-search-child-within-15-minutes-25
            color: blue
            linger: 0.6
      - say: A parent pointer can bring back the containing section after retrieval. The host checks that the parent version and permissions still match.
        hold: 0.75
        motion_check:
          region:
            - 1320
            - 390
            - 500
            - 280
          minimumChangedFraction: 0.002
        visual_cues:
          - id: parent-child-context-beat-2-focus-1
            phrase: The host checks that the parent version and permissions still match
            targets:
              - parent-child-context-object-beat-0-check-parent-id-version-access-runbook-v3-a-26
            color: blue
            linger: 0.6
          - id: parent-child-context-beat-2-focus-2
            phrase: A parent pointer can bring back the containing section after retrieval
            targets:
              - parent-child-context-object-search-child-within-15-minutes-25
            color: blue
            linger: 0.6
      - say: Deduplicate parents and measure the full packed prompt with the target tokenizer. A parent pointer does not prove that the returned text is sufficient.
        hold: 0.55
        visual_cues:
          - id: parent-child-context-beat-3-focus-1
            phrase: Deduplicate parents and measure the full packed prompt with the target tokenizer
            targets:
              - parent-child-context-object-beat-0-check-parent-id-version-access-runbook-v3-a-26
            color: blue
            linger: 0.6
  - id: semantic-and-late
    title: Escalate when document meaning crosses the local span
    visual: A topic change separates rollback steps from commander instructions; an early chunk sees only its span, while late pooling uses contextual token states before making chunk vectors.
    beats:
      - say: A long section may change topic without a heading. Semantic boundary detection can propose a split where neighboring sentence representations change.
        hold: 0.55
        visual_cues:
          - id: semantic-and-late-beat-1-focus-1
            phrase: A long section may change topic without a heading
            targets:
              - semantic-and-late-simulation-29
            color: blue
            linger: 0.6
      - say: Late chunking encodes a longer input first, then pools contextual token states for each selected span. A chunk vector can carry information from a name earlier in the document.
        hold: 0.75
        motion_check:
          region:
            - 1030
            - 400
            - 770
            - 360
          minimumChangedFraction: 0.002
        visual_cues:
          - id: semantic-and-late-beat-2-focus-1
            phrase: then pools contextual token states for each selected span
            targets:
              - late-contextual-states
            color: blue
            linger: 0.6
          - id: semantic-and-late-beat-2-focus-2
            phrase: Late chunking encodes a longer input first
            targets:
              - late-full-input
            color: blue
            linger: 0.6
      - say: The pooled vector does not insert that name into the returned passage. Keep the source text or expand context so the answer can cite what it actually received.
        hold: 0.55
        visual_cues:
          - id: semantic-and-late-beat-3-focus-1
            phrase: The pooled vector does not insert that name into the returned passage
            targets:
              - semantic-and-late-simulation-29
            color: blue
            linger: 0.6
  - id: evaluate-and-release
    title: Choose the smallest chunk that can answer
    visual: One runbook question is tested against three real candidate passages and a ten-word cutoff. Coverage checks reveal which chunk carries the condition, deadline, and identifier without exceeding the limit.
    beats:
      - say: Our query asks after a rollback failure, who gets paged, when, and which ID to include. This worked example uses a ten-word cutoff. Which candidate stays under it and contains all three answer fields?
        hold: 0.55
        visual_cues:
          - id: release-query-cutoff-b1-1
            phrase: ten-word cutoff
            targets:
              - release-query
            color: yellow
            linger: 0.6
          - id: release-ten-word-cutoff-b1-2
            phrase: contains all three answer fields
            targets:
              - release-candidates
            color: blue
            linger: 0.6
      - say: The five-word fragment fits but omits the deadline and ID. The twelve-word fragment has the deadline and ID, but omits the failure condition and adds an unrelated archive rule. The ten-word rollback sentence has all three fields and meets the cutoff.
        hold: 0.75
        visual_cues:
          - id: release-fragment-check-b2-1
            phrase: omits the deadline and ID
            targets:
              - release-coverage
            color: cyan
            linger: 0.6
          - id: release-complete-rule-b2-2
            phrase: adds an unrelated archive rule
            targets:
              - release-coverage
            color: yellow
            linger: 0.6
          - id: release-all-fields-b2-3
            phrase: has all three fields and meets the cutoff
            targets:
              - release-coverage
            color: green
            linger: 0.6
      - say: "Choose the ten-word sentence. It is the shortest candidate here that answers the labeled question within the cutoff. Keep its source locator attached: incident-runbook-v3.pdf, page 7."
        hold: 0.55
        visual_cues:
          - id: release-cutoff-choice-b3-1
            phrase: shortest candidate here
            targets:
              - release-selection
            color: green
            linger: 0.6
          - id: release-source-span-b3-2
            phrase: source locator attached
            targets:
              - release-source
            color: blue
            linger: 0.6
  - id: token-offsets
    title: Keep model tokens and source spans separate
    visual: The same runbook span retains its immutable source positions while added retrieval labels and tokenizer overhead consume a different budget.
    beats:
      - say: "Our visible windows count whitespace-separated words. A production embedder consumes its own tokens. Count the complete indexed string: source label, section heading, body and special tokens. Character length and word count cannot certify that input fits. The sentence-transformers checkpoint all-MiniLM-L6-v2 produces three-hundred-eighty-four-dimensional embeddings. Its cited Sentence Transformers configuration limits the whole sequence to two-hundred-fifty-six tokens, including special tokens. That is a model-specific default, not a universal chunk size."
        hold: 0.8
        visual_cues:
          - id: token-offsets-0
            phrase: Our visible windows count whitespace-separated words
            targets:
              - token-offsets-operation
            linger: 0.4
          - id: token-model-contract
            phrase: The sentence-transformers checkpoint all-MiniLM-L6-v2 produces
            targets:
              - token-offsets-operation
            linger: 0.35
      - say: Keep the original evidence span separate from the retrieval representation. Prepending Source Incident Runbook and Section Rollback failure adds source and section context that may help retrieval. Test the benefit on labeled queries. Those labels consume tokens and are not quotations from the source span. Preserve immutable document version, offsets and a mapping through normalization so a citation can recover the actual evidence. State whether offsets count characters, bytes or tokenizer positions.
        hold: 0.8
        visual_cues:
          - id: token-offsets-1
            phrase: Keep the original evidence span separate from the retrieval representation
            targets:
              - token-offsets-operation
            linger: 0.4
          - id: prepend-labels
            phrase: Prepending Source Incident Runbook and Section Rollback failure
            targets:
              - token-offsets-operation
            linger: 0.35
      - say: The article parser recognizes a flat pair of Markdown heading marks. It demonstrates a boundary; it is not a general nested-document or fenced-code parser. Its section ordinal is an application locator, not a clickable PDF anchor. Preserve code fences and table structure with an appropriate parser, and use a recursive fallback when usable structure is absent. A recursive character splitter tries separators in order; it does not infer that a policy exception belongs with its condition.
        hold: 0.8
        visual_cues:
          - id: token-offsets-2
            phrase: The article parser recognizes a flat pair of Markdown heading marks
            targets:
              - token-offsets-operation
            linger: 0.4
  - id: tail-balancing
    title: Repair a short tail under the same hard cap
    visual: Fifteen ordered source words begin as seven,seven,one; their boundaries move while original character spans remain attached.
    beats:
      - say: "Construct the article fallback on fifteen words with a hard size cap of seven and a preferred minimum tail of four. A naive split produces seven, seven, one. Merging the last word into the previous seven produces an eight-word child and violates the cap. Keep source order while redistributing boundaries: five, five, five satisfies both requirements. The fixture records exact character spans zero to thirty, thirty-one to fifty-eight, and fifty-nine to ninety-three, with exclusive end positions. Balancing repaired length,not meaning:the first five-word child still omits deploy ID. Prepend required section context,and require parent expansion when a child is incomplete;an unused pointer elsewhere does not supply evidence."
        hold: 0.8
        visual_cues:
          - id: tail-balancing-0
            phrase: Construct the article fallback on fifteen words with a hard size cap of seven and a preferred minimum tail of four
            targets:
              - tail-balancing-operation
            linger: 0.4
          - id: tail-merge
            phrase: Merging the last word
            targets:
              - tail-balancing-operation
            linger: 0.35
          - id: tail-balance
            phrase: Keep source order while redistributing boundaries
            targets:
              - tail-balancing-operation
            linger: 0.35
          - id: balance-not-evidence
            phrase: Balancing repaired length
            targets:
              - tail-balancing-operation
            linger: 0.35
      - say: Now change only the preferred minimum from four to six. At least three chunks are needed because two chunks of at most seven hold only fourteen words. Three children of at least six would require eighteen words. Both constraints cannot hold for fifteen. Preserve the hard cap and mark the undersized children for review or choose another representation; a ready flag would conceal the unsatisfied preference.
        hold: 0.8
        visual_cues:
          - id: tail-balancing-1
            phrase: Now change only the preferred minimum from four to six
            targets:
              - tail-balancing-operation
            linger: 0.4
          - id: tail-impossible
            phrase: Three children of at least six would require eighteen words
            targets:
              - tail-balancing-operation
            linger: 0.35
      - say: For overlapping fixed windows, stride is size minus overlap. Stop when a window reaches the source end; another wholly duplicated tail adds no evidence. At a twenty-percent overlap ratio, a long-document approximation gives one divided by point eight, or one point two five times as many windows. Short documents need exact counts. In our seventeen-word fixture, size seven with overlaps zero, two and four indexes seventeen, twenty-one and thirty-three words, yet still contains zero complete ten-word rollback rules.
        hold: 0.8
        visual_cues:
          - id: tail-balancing-2
            phrase: For overlapping fixed windows, stride is size minus overlap
            targets:
              - tail-balancing-operation
            linger: 0.4
          - id: overlap-asymptotic
            phrase: At a twenty-percent overlap ratio
            targets:
              - tail-balancing-operation
            linger: 0.35
  - id: labeled-retrieval
    title: Test returned evidence rather than topic alone
    visual: The same labeled runbook query scores competing source spans, then missing-condition and budget mutations change the result.
    beats:
      - say: The article uses a transparent lexical baseline, not an embedding-quality benchmark. Convert query and passage text into whole-word sets, then count their intersection. For rollback, failure, deploy and minutes, the complete rollback rule matches four of four query terms. The routine archive rule matches only deploy. The condition fragment and deadline fragment each match two. A max operation may break that tie by input order, but neither fragment alone proves the complete rule.
        hold: 0.8
        visual_cues:
          - id: labeled-retrieval-0
            phrase: The article uses a transparent lexical baseline, not an embedding-quality benchmark
            targets:
              - labeled-retrieval-operation
            linger: 0.4
      - say: "Keep two checks separate: did retrieval select the intended evidence source, and does the text actually supplied establish the answer? The three-case smoke suite covers paging, archive and commander instructions and passes three of three. That tiny authored fixture establishes only its tested behavior. Add exceptions, tables, boundary-spanning facts, ambiguity and unanswerable cases before comparing realistic retrieval systems."
        hold: 0.8
        visual_cues:
          - id: labeled-retrieval-1
            phrase: "Keep two checks separate: did retrieval select the intended evidence source, and does the text actually supplied establish the answer? The three-case smoke suite covers paging, archive and commander instructions and passes three of three"
            targets:
              - labeled-retrieval-operation
            linger: 0.4
          - id: retrieval-suite
            phrase: passes three of three
            targets:
              - labeled-retrieval-operation
            linger: 0.35
      - say: Across splitter configurations, chunk IDs and boundaries can change. Label stable source versions and answer-bearing spans rather than requiring an old splitter ID. Score the final context after parent expansion and budget selection. Two approved fragments in source order can together supply a complete rule; dropping the condition-bearing half makes that final context insufficient even if both hits originally retrieved correctly.
        hold: 0.8
        visual_cues:
          - id: labeled-retrieval-2
            phrase: Across splitter configurations, chunk IDs and boundaries can change
            targets:
              - labeled-retrieval-operation
            linger: 0.4
          - id: retrieval-drop
            phrase: dropping the condition-bearing half
            targets:
              - labeled-retrieval-operation
            linger: 0.35
      - say: Compare under the same generator-token budget, reserving instructions, question and output. Equal top-k is not equal context when chunks have different lengths. Measure duplicated source spans, index size and retrieval latency alongside source recall, evidence sufficiency and answer quality. A larger index or more retrieved words earns no quality claim by itself.
        hold: 0.8
        visual_cues:
          - id: labeled-retrieval-3
            phrase: Compare under the same generator-token budget, reserving instructions, question and output
            targets:
              - labeled-retrieval-operation
            linger: 0.4
  - id: checked-parent
