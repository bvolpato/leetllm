            color: blue
            linger: 0.6
          - id: fixed-windows-beat-3-focus-2
            phrase: A word count is only a teaching stand-in
            targets:
              - fixed-windows-object-item-word-8
            color: blue
            linger: 0.6
  - id: overlap-limit
    title: Repeated words cannot make a window larger
    visual: Window overlap repeats boundary words and raises the indexed word count, while a ten-word paging rule remains longer than every seven-word window.
    beats:
      - say: Overlap can carry a short phrase across a boundary. It also indexes the repeated words again and can increase storage and retrieval duplication.
        hold: 0.55
        visual_cues:
          - id: overlap-limit-beat-1-focus-1
            phrase: storage and retrieval duplication
            targets:
              - overlap-window-0
            color: blue
            linger: 0.6
          - id: overlap-limit-beat-1-focus-2
            phrase: Overlap can carry a short phrase across a boundary
            targets:
              - overlap-limit-simulation-14
            color: blue
            linger: 0.6
      - say: In this fixture, the complete paging rule is ten words long. A window holds seven, so even four repeated words cannot fit the whole rule inside one window.
        hold: 0.75
        visual_cues:
          - id: overlap-limit-beat-2-focus-1
            phrase: the complete paging rule is ten words long
            targets:
              - overlap-limit-simulation-17
            color: blue
            linger: 0.6
          - id: overlap-limit-beat-2-focus-2
            phrase: In this fixture
            targets:
              - overlap-limit-simulation-14
            color: blue
            linger: 0.6
      - say: The added copies do not restore missing context. Rebalance the cut, return a larger parent, or flag the case for review.
        hold: 0.55
        visual_cues:
          - id: overlap-limit-beat-3-focus-1
            phrase: The added copies do not restore missing context
            targets:
              - overlap-limit-simulation-14
            color: blue
            linger: 0.6
  - id: structure-and-tables
    title: Use headings and column names as structure
    visual: Section-aware chunks keep the rollback heading with its rule; table row groups repeat their header so each value retains its column meaning.
    beats:
      - say: When a document has useful headings, start with those boundaries. Attach the section title to the searchable text so the condition stays near its deadline.
        hold: 0.55
        visual_cues:
          - id: structure-and-tables-beat-1-focus-1
            phrase: Attach the section title to the searchable text
            targets:
              - structure-and-tables-object-section-heading-n-section-heading-22
            color: blue
            linger: 0.6
      - say: A table row cut away from its column names can make a value ambiguous. Repeat the header for each row group when a table must split.
        hold: 0.75
        visual_cues:
          - id: structure-and-tables-beat-2-focus-1
            phrase: A table row cut away from its column
            targets:
              - structure-table-chunks
            color: blue
            linger: 0.6
          - id: table-repeat-header
            phrase: Repeat the header for each row group when a table must split
            targets:
              - structure-table-chunks
            color: cyan
            linger: 0.5
      - say: Keep source locations, versions, and offsets with each chunk. A heading makes its terms searchable, while provenance lets a reviewer return to the original evidence.
        hold: 0.55
        visual_cues:
          - id: structure-and-tables-beat-3-focus-1
            phrase: A heading makes its terms searchable
            targets:
              - structure-and-tables-object-section-heading-n-section-heading-22
            color: blue
            linger: 0.6
          - id: structure-and-tables-beat-3-focus-2
            phrase: Keep source locations
            targets:
