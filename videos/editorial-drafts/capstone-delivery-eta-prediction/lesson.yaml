            linger: 0.4
      - say: Fit the logistic classifier’s standard scaler on training features only, then fit its weights. The ordinary least-squares remaining-hours regressor uses the same five allowed raw features. Delivery outcomes and recording times never enter that matrix. Freeze both models before threshold selection. Validation costs at thresholds point two, point four, point six and point eight are thirty-two, sixteen, three hundred sixty-eight and five hundred forty-eight. Select point four, breaking any tie toward the larger threshold. Lock it before touching the later test cohort.
