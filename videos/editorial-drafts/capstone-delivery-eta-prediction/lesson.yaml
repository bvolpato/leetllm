  - id: synthesis
    title: Keep the estimate and decision replayable
    visual: The input snapshot, median and warning policy converge into a versioned local response.
    beats:
      - say: We have separated an arrival estimate from a late-warning decision, reconstructed the available scans, and compared the actions those scores produce. The historical range tells us about our sample. Future uncertainty needs its own calibration and evaluation on later deliveries.
        hold: 0.75
        visual_cues:
