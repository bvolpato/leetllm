scenes:
  - id: intro
    title: Give an arrival estimate a memory
    visual: A package timeline connects pickup, prediction and historical arrivals while the estimate stays attached to its evidence.
    beats:
      - say: A package is still travelling when its customer checks the tracking page. An arrival estimate can help them plan their evening. Operations also wants to know whether to warn about a delay. We will build those two outputs and inspect the evidence each requires.
        hold: 0.75
        visual_cues:
          - id: intro-b1-1
            phrase: A package is still travelling
            targets:
              - package
            linger: 0.45
          - id: intro-b1-2
            phrase: An arrival estimate can help them
            targets:
              - package
            linger: 0.45
      - say: Begin by fixing the prediction moment. Our package left at ten, and we are looking at noon. Every feature must describe what this service could know then. Later delivery outcomes will teach and evaluate the system after they become available.
        hold: 0.85
        visual_cues:
          - id: intro-b2-1
            phrase: Our package left at ten
            targets:
              - pickup
              - now
            linger: 0.45
          - id: intro-b2-2
            phrase: Later delivery outcomes
            targets:
              - later-delivery-outcome
            linger: 0.45
  - id: prediction-contract
    title: Pin the target and the two outputs
    visual: The original promise remains fixed on the shipment clock while remaining duration and breach probability receive separate owners.
    beats:
      - say: Pin one scheduled snapshot while the shipment is still in transit. Noon happens to be two hours after this pickup; the service can also score a cross-country shipment thirty hours into its trip. Store the exact prediction instant. Define late as delivery after the original customer promise, preserving that promise even if operations revises an internal estimate.
        hold: 1
        visual_cues:
          - id: prediction-contract-b0
            phrase: Pin one scheduled snapshot while the shipment is
            targets:
              - prediction-contract-construction
            linger: 0.4
          - id: original-promise
            phrase: original customer promise
            targets:
              - prediction-contract-construction
            linger: 0.4
      - say: The arrival regressor predicts remaining hours from the snapshot. The historical baseline predicts total duration from pickup. A late-risk classifier instead estimates the chance of breaching the original promise. None of those scores changes the promise. After the deadline has already passed, a separately defined post-breach policy handles the incident.
        hold: 1
        visual_cues:
          - id: prediction-contract-b1
            phrase: The arrival regressor predicts remaining hours from the
            targets:
              - prediction-contract-construction
            linger: 0.4
          - id: remaining-clock
            phrase: remaining hours
            targets:
              - prediction-contract-construction
            linger: 0.4
      - say: Use timezone-aware instants. Convert a local deadline using its declared destination time zone and daylight-saving rules before storing UTC. Canceled and returned shipments need explicit cohort rules. An unresolved shipment has no delivered label yet; recording it as on time changes the target.
        hold: 1
        visual_cues:
          - id: prediction-contract-b2
            phrase: Use timezone-aware instants. Convert a local deadline using
            targets:
              - prediction-contract-construction
            linger: 0.4
      - say: Build features from scan age, backlog age, service tier, elapsed transit and time remaining to the promise. A source must both occur and become queryable online by the snapshot. A lake write or an event-time-only join can still admit information the online service lacked. Feast’s opt-in created-time filter needs a mapped availability clock and a supporting offline store.
        hold: 1
        visual_cues:
          - id: prediction-contract-b3
            phrase: Build features from scan age, backlog age, service
            targets:
              - prediction-contract-construction
            linger: 0.4
          - id: feature-availability
            phrase: become queryable online
            targets:
              - prediction-contract-construction
            linger: 0.4
  - id: clocks
    title: Check two clocks on every scan
    visual: Event and availability clocks independently decide which scan enters the noon feature row.
    beats:
      - say: "A scan has two useful times: when it happened, and when our scoring service could read it. The eleven oclock scan arrived a few minutes later, so it is available at noon. The next scan happened before noon but reached us afterward."
        hold: 0.75
        visual_cues:
          - id: clocks-b1-1
            phrase: when it happened
            targets:
              - event
            linger: 0.45
          - id: clocks-b1-2
            phrase: when our scoring service could read it
            targets:
              - readable
            linger: 0.45
      - say: Apply both boundaries before choosing the latest scan. The delayed record stays outside this snapshot, and the afternoon scan is still in the future. The admitted record now supplies the scan age. This is how we reconstruct information available at a historical decision.
        hold: 0.85
        visual_cues:
          - id: clocks-b2-1
            phrase: Apply both boundaries
            targets:
              - cutoff
              - boundary-rule
            linger: 0.45
          - id: clocks-b2-2
            phrase: The delayed record stays outside
            targets:
              - admission
            linger: 0.45
          - id: clocks-b2-3
            phrase: supplies the scan age
            targets:
              - scan-age
            linger: 0.45
  - id: history
    title: Turn completed journeys into a baseline
    visual: Four eligible durations accumulate into a sorted sample and a median arrival.
    beats:
      - say: We need a first estimate before a complicated model. Select completed journeys on the same route and service tier whose outcomes were already recorded. Their durations supply a small historical baseline. A journey completed this afternoon cannot help a noon prediction.
        hold: 0.75
        visual_cues:
          - id: history-b1-1
            phrase: Select completed journeys
            targets:
              - journeys
            linger: 0.45
          - id: history-b1-2
            phrase: small historical baseline
            targets:
              - journeys
            linger: 0.45
      - say: Sort the four eligible durations. The middle pair gives an eleven-hour median journey, so a ten oclock pickup produces a nine in the evening estimate. Keep the sample count and observed range beside it. We still need held-out evaluation to calibrate uncertainty.
        hold: 0.85
        visual_cues:
          - id: history-b2-1
            phrase: middle pair gives an eleven-hour median
            targets:
              - journeys
              - median
            linger: 0.45
          - id: history-b2-2
            phrase: sample count and observed range
            targets:
              - sample-range
            linger: 0.45
  - id: arrival-targets
    title: Use the duration’s own clock
    visual: A total-duration ruler starts at pickup; a remaining-duration ruler starts at noon; finite historical rank positions expose the extreme-range coverage calculation.
    beats:
      - say: Our eleven-hour historical total duration starts at ten oclock pickup, reaching twenty-one hundred. If a remaining-hours regressor instead outputs nine at noon, add nine to noon and reach the same arrival. Adding eleven to noon would shift the historical estimate two hours late. Match route, tier and still-in-transit eligibility; require both delivery and recorded outcome to be known at the cutoff.
        hold: 1
        visual_cues:
          - id: arrival-targets-b0
            phrase: Our eleven-hour historical total duration starts at ten
            targets:
              - arrival-targets-construction
            linger: 0.4
          - id: duration-clock
            phrase: reach the same arrival
            targets:
              - arrival-targets-construction
            linger: 0.4
          - id: wrong-anchor
            phrase: two hours late
            targets:
              - arrival-targets-construction
            linger: 0.4
      - say: The four historical extremes do not establish a ninety-percent interval. Under exchangeability with no ties, the next observation has five equally likely ranks relative to four past values. Only the three interior ranks lie within the past extremes. Three over five gives sixty-percent marginal coverage across random histories and next examples, not coverage conditional on these particular four durations.
        hold: 1
        visual_cues:
          - id: arrival-targets-b1
            phrase: The four historical extremes do not establish a
            targets:
              - arrival-targets-construction
            linger: 0.4
          - id: range-ranks
            phrase: three interior ranks
            targets:
              - arrival-targets-construction
            linger: 0.4
      - say: Squared error targets a conditional mean at the population optimum; a fitted linear model may miss it. Pinball loss for quantile q multiplies an underprediction residual by q and an overprediction magnitude by one minus q. At q point nine, missing two hours below costs one point eight, while being two hours above costs point two. Separate fifth and ninety-fifth percentile fits define a nominal ninety-percent interval. They can cross, and ordering them does not establish coverage.
        hold: 1
        visual_cues:
          - id: arrival-targets-b2
            phrase: Squared error targets a conditional mean at the
            targets:
              - arrival-targets-construction
            linger: 0.4
          - id: pinball-cost
            phrase: one point eight
            targets:
              - arrival-targets-construction
            linger: 0.4
  - id: conformal-calibration
    title: Let the corrected rank choose the radius
    visual: An untouched ordered residual rack preserves each calibration shipment; the required rank can fall outside the finite rack.
    beats:
      - say: Fit the predictor independently of an untouched calibration cohort. Compute each absolute residual, actual remaining hours minus predicted remaining hours in magnitude, and sort those residuals. For n scores and target one minus alpha, take the ceiling of n plus one times one minus alpha. Use that order statistic as the radius; if its rank exceeds n, use infinity.
        hold: 1
        visual_cues:
          - id: conformal-calibration-b0
            phrase: Fit the predictor independently of an untouched calibration
            targets:
              - conformal-calibration-construction
            linger: 0.4
          - id: conformal-rank
            phrase: ceiling of n plus one
            targets:
              - conformal-calibration-construction
            linger: 0.4
      - say: With four residuals one, two, three and four, and alpha point one, the corrected rank is ceiling of five times point nine, which is five. There is no fifth residual. The construction returns an unbounded interval. Clamping to the fourth residual changes its finite-sample guarantee. With nine residuals one through nine, rank nine exists and the radius is nine hours.
        hold: 1
        visual_cues:
          - id: conformal-calibration-b1
            phrase: With four residuals one, two, three and four,
            targets:
              - conformal-calibration-construction
            linger: 0.4
          - id: conformal-infinite
            phrase: unbounded interval
            targets:
              - conformal-calibration-construction
            linger: 0.4
          - id: conformal-nine
            phrase: radius is nine hours
            targets:
              - conformal-calibration-construction
            linger: 0.4
          - id: conformal-nine-rank
            phrase: rank nine exists
            targets:
              - conformal-calibration-construction
            color: yellow
            linger: 0.4
          - id: conformal-nine-inputs
            phrase: With nine residuals one through nine
            targets:
              - conformal-calibration-construction
            color: blue
            linger: 0.4
          - id: conformal-five-rank
            phrase: corrected rank is ceiling of five times point nine, which is five
            targets:
              - conformal-calibration-construction
            color: yellow
            linger: 0.4
      - say: Return predicted hours minus the radius through predicted hours plus the radius. Exchangeability of calibration and next scores gives marginal coverage at least the target. Individual shipments and routes can differ. These supplied residuals demonstrate arithmetic; they are not fitted ETA calibration data. Represent an unbounded result explicitly in an API instead of serializing infinity as a customer promise. Drift, rolling windows and nonexchangeable methods need their own conditions. Monitor widths, coverage and delayed-label counts by slice.
        hold: 1
        visual_cues:
          - id: conformal-calibration-b2
            phrase: Return predicted hours minus the radius through predicted
            targets:
              - conformal-calibration-construction
            linger: 0.4
  - id: freshness
    title: A high score still needs current evidence
    visual: A risk score is held fixed while scan age crosses the policy freshness limit.
    beats:
      - say: A separate classifier estimates the chance of missing the original promised deadline. Its score enters a policy alongside data freshness. Watch the scan grow older while the score stays high. The input evidence can become unusable even though the prediction sounds confident.
        hold: 0.75
        motion_check:
          region:
            - 230
            - 380
            - 1540
            - 520
          minimumChangedFraction: 0.002
        visual_cues:
          - id: freshness-b1-1
            phrase: Watch the scan grow older
            targets:
              - aging-scan
            linger: 0.45
          - id: freshness-b1-2
            phrase: input evidence can become unusable
            targets:
              - stale-boundary
            linger: 0.45
      - say: Our declared gate sends stale inputs to internal review. When scan age exceeds its limit, the response action is manual_review with reason stale_scan_features, even if the risk score is high. Fresh inputs can continue to the warning threshold. Missing values, invalid scores and schema mismatches need explicit handling too. Preserve these reasons so an operator can distinguish a low risk from unavailable evidence.
        hold: 0.85
        visual_cues:
          - id: freshness-b2-1
            phrase: gate sends stale inputs
            targets:
