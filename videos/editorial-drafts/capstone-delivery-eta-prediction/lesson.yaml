            targets:
              - source-snapshot
            linger: 0.45
      - say: Build the small service around that evidence chain. Retain the prediction time, source records, fitted artifact, input contract and threshold policy. The versioned_trace gate requires threshold_policy_id alongside the model and feature contract identifiers, because a different threshold can change the action for the same score. Then a surprising warning becomes a decision you can replay, explain and improve while keeping customer-facing claims grounded.
