  - id: cost-threshold
    title: Derive the threshold from two action costs
    visual: Warning and silence share a probability ruler; their expected-cost lines intersect at the threshold implied by the declared penalties.
    beats:
      - say: "Keep the simplified penalties: false warning eight, missed standard delay sixty, missed expedited delay one hundred fifty, correct decisions zero. For a calibrated late probability point two, warning a standard shipment costs point eight times eight, or six point four. Silence costs point two times sixty, or twelve. Under those supplied costs, warning has lower expected penalty."
        hold: 1
        visual_cues:
          - id: cost-threshold-b0
            phrase: "Keep the simplified penalties: false warning eight, missed"
            targets:
              - cost-threshold-construction
            linger: 0.4
          - id: expected-cost
            phrase: six point four
            targets:
              - cost-threshold-construction
            linger: 0.4
          - id: expected-cost-choice
            phrase: Under those supplied costs, warning has lower expected penalty
            targets:
              - cost-threshold-construction
            color: green
            linger: 0.4
          - id: silent-expected-cost
            phrase: Silence costs point two times sixty, or twelve
            targets:
              - cost-threshold-construction
            color: pink
            linger: 0.4
      - say: In symbols, warning costs one minus p times the false-warning cost; silence costs p times the missed-delay cost. Warning is at least as good when the former is no larger. Rearranging gives p at least false-warning cost divided by false-warning plus missed-delay cost. Standard threshold eight over sixty-eight is about point one one eight; expedited eight over one hundred fifty-eight is about point zero five zero six.
