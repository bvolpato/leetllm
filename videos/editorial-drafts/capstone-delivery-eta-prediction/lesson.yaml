    title: Verify which bundle actually serves
    visual: A registry pointer moves while loaded workers initially remain old; readiness, routed-release verification and a complete prior bundle complete the serving transition.
    beats:
      - say: A registry alias can point to a candidate while workers still serve the prior model. Promotion requires compatible preprocessing, schema, model and threshold policy, ready loaded workers, verified traffic routing and online checks. Compare the candidate with incumbents and simple policies on identical rows and report critical slices with predeclared support and uncertainty.
