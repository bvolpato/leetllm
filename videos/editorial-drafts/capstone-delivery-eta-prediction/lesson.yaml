  - id: artifact-replay
    title: Reload the complete frozen calculation
    visual: The same feature order, scaler, coefficients and threshold cross a strict JSON boundary, then score the unchanged test row again.
    beats:
      - say: The lab exports synthetic dataset, model parameters, test predictions and report. Its model JSON stores the ordered feature schema, training scaler means and positive scales, classifier coefficients and intercept, raw-feature ETA coefficients and intercept, and locked threshold. At scoring, subtract each training mean, divide by its training scale, take the classifier coefficient dot product, add the saved classifier intercept, and apply the logistic function.
