  - id: selection
    title: Freeze the policy before the final comparison
    visual: Raising the threshold removes a false warning and then misses a critical late case.
    beats:
      - say: The threshold trades warning workload against missed delays. Moving it upward removes some unnecessary warnings. Continue moving and a genuinely late case drops out too. Choose this tradeoff on validation data using the operational objective, then lock it before final evaluation.
