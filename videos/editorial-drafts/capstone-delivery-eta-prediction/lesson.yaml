      - say: At the policy boundary, reject malformed identifiers and non-UTC prediction envelopes. A snapshot mismatch, model mismatch, feature mismatch, unsupported tier, invalid age or score produces its named handling. Finite nonnegative ages must pass their own limits before the threshold comparison. JSON fallbacks turn nonfinite numbers into null; Boolean true is not a probability. Trusted scheduling and source provenance still need real service controls.
