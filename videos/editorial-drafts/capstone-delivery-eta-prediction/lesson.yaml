  - id: monitor
    title: Let outcomes arrive on their own clock
    visual: Immediate freshness measurements appear before delayed warning outcomes are joined.
    beats:
      - say: Once requests arrive, we can immediately measure freshness, missing fields, latency and fallbacks. This lab waits for recorded delivery labels to measure warning cost and probability quality. In an eligible cohort, a trustworthy confirmation that a shipment is still undelivered after its original deadline can establish a late outcome before final delivery. That confirmed binary outcome determines its simplified warning penalty and probability error, but exact arrival error still needs the delivery timestamp. Do not report only the early known late cases as the whole cohort; retain unresolved counts and follow-up windows. Join each mature outcome to the original prediction and the original promise rather than rewriting the record.
        hold: 0.75
        visual_cues:
          - id: monitor-b1-1
            phrase: immediately measure freshness
            targets:
              - immediate-checks
            linger: 0.45
          - id: monitor-b1-2
            phrase: This lab waits for recorded delivery labels
            targets:
              - outcome
            linger: 0.45
          - id: monitor-b1-3
            phrase: original prediction and the original promise
            targets:
              - prediction
              - outcome-join
            linger: 0.45
      - say: Watch counts as well as rates, including route and service-tier slices. A calibration plot compares score buckets with observed late fractions. A new candidate still needs a compatible model, feature transformation and policy, plus readiness and recovery checks on the serving path.
