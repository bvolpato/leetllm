            color: blue
            linger: 0.4
      - say: An expedited probability exactly point zero five stays below eight over one hundred fifty-eight; point zero five one clears it. Rounding across the boundary can change the action. This derivation assumes calibrated probabilities, two available actions, zero correct-outcome costs and no capacity constraint. A warning does not prevent lateness. Add true-warning burden and workload when the real objective needs them. The lab’s point four is a different policy selected among four validation candidates.
