            linger: 0.4
      - say: Validate schema, feature order, vector shapes, numeric types, finite parameters, positive scales and threshold range before scoring the reloaded JSON. The lab checks that the reloaded parameters match the original estimators on the test rows. This explicit format covers these two linear models. A byte fingerprint identifies an artifact; it does not authenticate who produced it. Dependency versions in a report do not pin the environment. Retain an immutable run directory and locked dependencies.
