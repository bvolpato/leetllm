            targets:
              - temporal-fit-construction
            linger: 0.4
      - say: Four-day gaps exclude eight rows; one more training label arrives after fitting. That leaves seventy-nine training, twenty-four validation, twenty-four test and nine excluded. An early prediction does not make its future label available to the trainer. The gap is illustrative; grouping, overlapping journeys and label delays determine the real eligibility contract. Repeated scoring can share outcomes, so define whether the evaluation concerns new shipments or later snapshots of existing ones.
        hold: 1
        visual_cues:
          - id: temporal-fit-b1
