  - id: temporal-fit
    title: Freeze transformations before later cohorts
    visual: A UTC calendar assigns all 136 synthetic shipments to train, validation, test, embargo gaps or unavailable-label exclusion before any weight or policy fit.
    beats:
      - say: The downloadable lab creates one hundred thirty-six synthetic shipments, one snapshot each. Training predictions precede March twenty-two at noon, and their labels must be recorded strictly before that fitting instant. Validation predictions run March twenty-six through April eighteen, with labels known before the April nineteen freeze. Test predictions run April twenty-three through May sixteen, and labels must be known before May twenty-one evaluation.
