            linger: 0.45
      - say: For a separate authored bucket demonstration, four frozen late probabilities are point two, point three, point three and point four. Their mean is point three. After the four outcomes mature, two are late, so observed fraction is point five. Plot mean score point three against two over four, point five, with count four. A future label updates the same prediction cohort; it never rewrites the old score. A Brier score combines calibration, resolution and outcome uncertainty, so it is not a pure calibration measure.
