      - say: For recovery, retain the complete prior bundle and enough loading capacity. Switch traffic through a tested procedure, measure recovery time and verify the release actually answering requests. Restoring a pointer alone does not restore cached workers and cannot undo a notification already sent. Retain prediction time, source records, model bytes, transformation and policy so each proposed warning remains replayable.
