  - id: cost
    title: Count the decisions the score causes
    visual: Four labelled orders receive candidate and scan-age-rule actions, with penalties calculated from those same actions.
    beats:
      - say: A model matters through the decisions it changes. Here a simple rule warns when scans are old. It misses an expedited late delivery with a recent scan. Compare that rule with a risk threshold on the exact same labelled orders and assumed penalty schedule.
