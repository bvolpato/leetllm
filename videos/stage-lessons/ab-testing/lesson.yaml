  - id: cuped-adjustment
    title: Subtract predictable variation without conditioning on treatment
    visual: The first of 24 simulated incidents has a raw score of one. Its frozen history flag explains part of that score. Move each dot by its adjustment and compare the arm contrasts on a common scale.
    beats:
      - say: >-
          Look at the first incident. It resolved, so its outcome is one. Before the experiment, its service already had a favorable history flag. That flag is one too. A new incident has no resolution history of its own. CUPED uses information like this frozen flag to account for some predictable variation. Subtract the flag's distance from one common center, multiplied by the same coefficient in both arms. In this simulation the first score moves to about zero point seven four seven. With a fixed coefficient and random assignment, the expected arm difference in the baseline flag is zero, so the expected treatment contrast is preserved. Latency during a rewrite can change under treatment. Adjusting for it could remove part of the effect we're trying to measure.
        hold: 0.65
        visual_cues:
          - id: incident
            phrase: "the first incident"
            targets: [picture]
          - id: common
            phrase: "one common center"
            targets: [picture]
          - id: adjusted
            phrase: "zero point seven four seven"
            targets: [picture]
      - say: The adjusted variance is variance Y plus theta squared times variance X minus twice theta times
          covariance. For positive finite variance X, minimizing gives theta equal to covariance divided by
          variance X. In a supplied numerical example, variance Y is nine, variance X is four and covariance
          is three. Theta is three quarters. Residual variance becomes six point seven five, a
          twenty-five-percent reduction. The fraction of variance left is one minus the squared correlation.
          Reversing the covariate’s sign reverses theta. Squaring the correlation gives the same reduction either way.
        hold: 0.55
        visual_cues:
          - id: example
            phrase: "In a supplied numerical example"
            targets: [picture]
          - id: theta
            phrase: "Theta is three quarters"
            targets:
              - picture
          - id: variance
            phrase: "six point seven five"
            targets:
              - picture
      - say: >-
          In this simulation of twenty thousand incidents, the flag and the outcome have a correlation of about point four seven. The adjustment cuts the pooled outcome variance by twenty-two point one percent. The raw lift is four point six eight points. The adjusted lift is four point three nine. Look at the interval around each dot. Its margin shrinks from one point three six points to one point two zero. The original outcome stays zero or one. The adjusted score can go below zero or above one. Here we fitted theta from the same outcomes. Plan the analysis to account for that fit, for example with regression adjustment or cross-fitting.
        hold: 0.75
        visual_cues:
          - id: simulation
            phrase: "In this simulation of twenty thousand incidents"
            targets:
              - picture
          - id: reduction
            phrase: "twenty-two point one percent"
            targets:
              - picture
          - id: raw-lift
            phrase: "raw lift is four point six eight points"
            targets:
              - picture
          - id: lab
            phrase: "adjusted lift is four point three nine"
            targets:
              - picture
          - id: margins
            phrase: "Look at the interval around each dot"
            targets:
              - picture
  - id: bandit-routing
    title: Adapt new-incident allocation without switching an existing incident
    visual: Two Beta posteriors supply competing draws. Only a matured chosen reward updates its posterior;
      follow-up messages retain the stored arm.
    beats:
      - say: A fixed-allocation test estimates the defined contrast under predeclared assignment probabilities; it
          need not be fifty fifty. A reward-seeking bandit instead trades exploration for cumulative reward.
          For a stationary Bernoulli arm, begin with a Beta prior, add a success to alpha or a failure to
          beta, and draw one possible success rate for each arm. In this replay the first draw is about zero point nine eight for control and zero point five six for the rewrite. Choose the largest, so this incident goes to control. Thompson sampling draws from uncertainty. Both arms started with the same prior mean.
        hold: 0.55
        visual_cues:
          - id: update-rule
            phrase: "add a success to alpha"
            targets:
              - picture
          - id: sample
            phrase: "draw one possible success rate"
            targets:
              - picture
          - id: choose
            phrase: "Choose the largest"
            targets:
              - picture
          - id: control
            phrase: "this incident goes to control"
            targets: [picture]
      - say: >-
          Over two thousand choices in a simulation with immediate feedback, control gets four hundred sixty-three and the rewrite gets fifteen hundred thirty-seven. That's seventy-six point eight percent of the traffic going to the arm with the higher success rate. In the incident service, route each new incident once and keep its follow-ups in that arm. While its ten-minute window is open, route other incidents using the feedback already in hand. Update after the outcome window matures. Suppose the first incident closes with a failure. Now control's beta count rises from one to two. Its curve shifts toward lower success rates. The rewrite keeps its prior.
        hold: 0.55
        visual_cues:
          - id: allocation
            phrase: "fifteen hundred thirty-seven"
            targets:
              - picture
          - id: mature
            phrase: "after the outcome window matures"
            targets:
              - picture
          - id: failure
            phrase: "control's beta count rises from one to two"
            targets: [picture]
      - say: Adaptive sample sizes depend on earlier rewards. Ordinary fixed-design inference is not automatically
          calibrated, and sampling, stopping and choosing which arm to report can create bias in different
          directions. Retain routing probabilities and use estimators and sequential methods designed for that
          policy with adequate exploration. A resolution reward does not encode grounding or latency
          constraints. A bandit can support scientific learning, but it answers a different operational
          objective and needs explicit guardrail design.
        hold: 0.75
        visual_cues:
          - id: bias
            phrase: "bias in different directions"
            targets:
              - picture
  - id: paired-prompts
    title: Subtract two outcomes before averaging away shared difficulty
    visual: The same prompt difficulty column feeds control and treatment scores. Subtraction cancels that shared
      column; independent prompt samples do not cancel.
    beats:
      - say: For offline paired answer evaluation, generate both candidates for the same prompt. In a simple additive
          score model, control is prompt difficulty plus its noise; treatment is the same difficulty plus
          effect and its noise. Subtraction cancels the shared difficulty exactly in that model. In general,
          variance of the difference is the two score variances minus twice their covariance. Say the variances are nine and four. Independent prompts give thirteen. If paired scores have covariance three, subtract twice three. The paired variance is seven. Positive covariance helps, zero gives no gain, and negative covariance can make pairing noisier.
        hold: 0.55
        visual_cues:
          - id: cancel
            phrase: "Subtraction cancels the shared difficulty"
            targets:
              - picture
          - id: variance
            phrase: "The paired variance is seven"
            targets: [picture]
      - say: >-
          Give each design the same budget of two thousand answers. In this simulation the scores come from a Gaussian model. With separate prompts, the estimated lift is point five seven zero, with standard error point zero eight five. With a thousand shared prompts, the lift is point four four three, with standard error point zero two seven. That's about eighty-nine point five percent less variance in the estimated difference. A hard prompt tends to pull both scores down together. Pairing takes that common movement out of the difference. You can measure how much the scores move together on your own prompts.
        hold: 0.55
        visual_cues:
          - id: independent
            phrase: "standard error point zero eight five"
            targets:
              - picture
          - id: paired-se
            phrase: "standard error point zero two seven"
            targets:
              - paired-prompts-mechanism
            linger: 0.45
          - id: variance-gain
            phrase: "eighty-nine point five percent less variance"
            targets:
              - picture
          - id: scope
            phrase: "A hard prompt tends to pull both scores down"
            targets:
              - picture
      - say: >-
          Search interleaving mixes ranked result lists. A click earns credit for the system that supplied the result under the chosen rule. For paired answer evaluation, a judge reads two complete answers to the same prompt. Randomize their order, hide their identities, define how ties count and calibrate the judge. Analyze the preference votes using the rule you chose. Showing an engineer both answers changes their exposure. Any later resolution reflects that combined experience. Check the preferred answer against its sources too.
        hold: 0.75
        visual_cues:
          - id: interleaving
            phrase: "Search interleaving mixes ranked result lists"
            targets:
              - picture
          - id: answers
            phrase: "a judge reads two complete answers"
            targets:
              - picture
          - id: exposure
            phrase: "changes their exposure"
            targets:
              - picture
  - id: evaluation-stack
    title: "Would the judge catch the opening error?"
    visual: "Compare two practice judge labels with retained human labels, then replay the receipt check with matching policies and with one changed decoder schema."
