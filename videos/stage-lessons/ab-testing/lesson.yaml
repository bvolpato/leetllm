            phrase: "weighting each possible multiplier"
            targets: [picture]
      - say: >-
          Restart both products at one on the article's twenty-outcome stream. At five percent alpha, the stopping line is one over alpha, or twenty. Feed in ten successive successes. The mixture reaches twenty-eight point eight three three and crosses the line. The next ten outcomes are failures. If they bring the ratio down, what happens to the running maximum?
        hold: 2.8
        visual_cues:
          - id: restart
            phrase: "Restart both products"
            targets: [picture]
          - id: ten
            phrase: "Feed in ten successive successes"
            targets: [picture]
          - id: ask
            phrase: "what happens to the running maximum"
            targets: [picture]
      - say: >-
          Deal the failures. The current ratio falls to about zero point five zero nine. The maximum stays where the stream actually reached, at twenty-eight point eight three three. Take the reciprocal of that maximum and cap it at one. The anytime p-value is about zero point zero three four seven at both checkpoints. A later failure can weaken today's evidence and still leave yesterday's crossing on record.
        hold: 0.8
