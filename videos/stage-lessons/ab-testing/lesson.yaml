      - say: >-
          Ville's inequality bounds the chance of ever crossing one over alpha under this null. That guarantee uses independent observations, a known null distribution, common support and fixed mixing weights that sum to one. In our two-arm experiment, the equal-rate null leaves the shared rate unknown. Substituting the observed control rate needs a separate justification. Use a method derived for that model. Inverting valid tests gives a confidence sequence that covers across time. Other metrics need their own error control. For long streams, accumulate the likelihoods with numerically stable arithmetic.
