          Back to the two thousand mature incidents in each arm. The rewrite gained four resolution successes per hundred incidents. Its first-request p95 went from eleven eighty to twelve sixty milliseconds. That eighty millisecond increase fits the speed budget. The human-page rate fell by a fifth of a percentage point. That fits its budget too. Those are point estimates.
