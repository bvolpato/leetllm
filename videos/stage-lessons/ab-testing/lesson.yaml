scenes:
  - id: intro
    title: "Does the runbook back this answer?"
    visual: "A cursor marks a rollback answer usable beside the open runbook. Underline the unsupported word after the question, then score the same answer for resolution and grounding."
    beats:
      - say: >-
          At minute eight, the engineer marks this rollback answer usable. The runbook says rollback requires owner acknowledgement. The assistant says, “Acknowledgement alone authorizes rollback.” Which word turns a requirement into permission?
        hold: 3
        caption_starts:
          - "Which word turns a requirement"
        visual_cues:
          - id: marked
            phrase: "marks this rollback answer usable"
            targets: [picture]
          - id: source
            phrase: "The runbook says"
            targets: [picture]
          - id: ask
            phrase: "Which word turns a requirement"
            targets: [picture]
      - say: >-
          Alone. The runbook names one requirement. The assistant treats it as all the permission the engineer needs. A blinded reviewer records one grounding failure. By minute ten, the answer has a usable mark and no new escalation page. Our experiment records one resolved incident. The same answer goes into both counts.
        hold: 1
        visual_cues:
          - id: alone
            phrase: "Alone"
            targets: [picture]
          - id: audit
            phrase: "one grounding failure"
            targets: [picture]
          - id: resolved
            phrase: "one resolved incident"
            targets: [picture]
      - say: >-
          Should we ship the query rewrite? Randomly assign eligible incidents to two groups. Control searches with the original question. Treatment rewrites the search query. Both use the same runbook index, prompt, generator and decoder. Before any traffic arrives, set the maximum acceptable increase in the grounding failure rate at half a percentage point. Can the rewrite resolve more incidents and stay inside that limit?
        hold: 0.9
        visual_cues:
          - id: split
            phrase: "Randomly assign eligible incidents"
            targets: [picture]
          - id: budget
            phrase: "half a percentage point"
            targets: [picture]
  - id: randomize
    title: "Where does the follow-up go?"
    visual: "Two incident IDs land on opposite sides of the locked hash split. A follow-up returns to its original incident record."
    beats:
      - say: >-
          Use the incident ID and a locked experiment version to pick a bucket from zero to ninety-nine. For incident fourteen, the hash gives bucket fifty-eight. That puts its question in control. Incident one lands in bucket twenty-seven and gets the rewrite. Save the arm and version with each event.
        hold: 0.6
        visual_cues:
          - id: first
            phrase: "bucket fifty-eight"
            targets: [picture]
          - id: second
            phrase: "bucket twenty-seven"
            targets: [picture]
      - say: >-
          Here comes a follow-up from incident fourteen. The engineer has already seen the control answer. Where does the follow-up go?
        hold: 2.4
        visual_cues:
          - id: follow
            phrase: "a follow-up from incident fourteen"
            targets: [picture]
      - say: >-
          Back to the stored control arm. Imagine sending that follow-up to the rewrite instead. The engineer chose what to ask after seeing the control answer. We'd be scoring a mixture of both policies. Assigning whole incidents gives each incident one policy. For a causal comparison we also need consistent outcome measurement, trustworthy assignment, and a check for spillovers between incidents. Two incident IDs can still share an engineer or a worker.
        hold: 0.8
        visual_cues:
          - id: stored
            phrase: "stored control arm"
            targets: [picture]
          - id: mix
            phrase: "The engineer chose what to ask"
            targets: [picture]
          - id: spill
            phrase: "spillovers between incidents"
            targets: [picture]
  - id: unit-and-interference
    title: Name the effect and the paths that mix exposure
    visual: The raw canary question and its supplied rewrite share one pinned generator receipt. Two incident
      identities then exchange learned procedure or compete for a shared worker.
    beats:
      - say: Keep the actual policy contrast visible. Control retrieves from the raw canary question. Treatment uses
          the query canary rollback error-rate policy owner acknowledgement. The rewrite policy forbids adding
          unsupported thresholds, but its outputs still need auditing. Both paths use the same runbook
          snapshot, generator prompt, model and greedy decoder schema. The estimand is the average effect of
          assignment to that rewrite policy among eligible incidents, including its delays and failures. A
          deliberate factorial experiment could study several changes; an unplanned decoder difference cannot
          isolate this one.
        hold: 0.55
        visual_cues:
          - id: policy
            phrase: "including its delays and failures"
            targets:
              - picture
      - say: "SUTVA names two requirements: no interference between randomized units and no consequential hidden
          treatment versions. A technician can learn a rollback procedure from a treatment incident and apply
          it to a later control incident. Extra rewrite work can also delay control through shared compute.
          Randomizing teams may contain within-team learning, but it does not remove shared-infrastructure
          interference. Choose the unit for the intended effect and actual spillover pattern."
        hold: 0.55
        visual_cues:
          - id: versions
            phrase: "no consequential hidden treatment versions"
            targets:
              - picture
          - id: learning
            phrase: "A technician can learn"
            targets:
              - picture
          - id: compute
            phrase: "Extra rewrite work"
            targets:
              - picture
      - say: For equal clusters of twenty incidents with common intracluster correlation zero point one, the planning
          design effect is one plus nineteen times zero point one, or two point nine. This approximation
          inflates variance relative to independent outcomes. Unequal clusters and different estimators need a
          specific calculation. Analyze team-randomized data with team-aware inference. More messages cannot
          substitute for more independent teams. Salt assignment with the locked experiment version, prevent
          callers choosing favorable IDs, and retain the assigned arm on events. A hash does not force exactly
          equal counts.
        hold: 0.75
        visual_cues:
          - id: design-effect
            phrase: "or two point nine"
            targets:
              - picture
          - id: teams
            phrase: "Analyze team-randomized data"
            targets:
              - picture
  - id: metric
    title: Decide what a resolved incident means
    visual: An incident counts as resolved after a usable answer arrives within ten minutes and no new human page
      occurs before the deadline.
    beats:
      - say: Pick one primary outcome before traffic arrives. In this plan, an incident counts as resolved if it gets
          a usable answer within ten minutes and receives no new human escalation page through that deadline.
          Every enrolled incident remains in the denominator in its assigned arm.
        hold: 0.55
        visual_cues:
          - id: usable
            phrase: "usable answer within ten minutes"
            targets:
              - picture
          - id: no-page
            phrase: "no new human escalation page"
            targets:
              - picture
          - id: denominator
            phrase: "Every enrolled incident"
            targets:
              - picture
      - say: The outcome window matters. A treatment answer that arrives late, a missing answer, or an escalation near
          the deadline needs a predeclared rule. Wait until every ten-minute window matures before the
          fixed-horizon analysis.
        hold: 0.6
        visual_cues:
          - id: mature
            phrase: "every ten-minute window matures"
            targets:
              - picture
      - say: This metric is a proxy for service recovery. An engineer can mark an answer useful while the service
          remains down; an appropriate escalation can protect users while counting as a metric failure.
          Validate the proxy against operational recovery and keep grounding, latency, and human pages as
          separate guardrails.
        hold: 0.75
        visual_cues:
          - id: proxy
            phrase: "proxy for service recovery"
            targets:
              - picture
          - id: failure
            phrase: "counting as a metric failure"
            targets:
              - picture
  - id: event-maturity
    title: "When can we score these incidents?"
    visual: "A shared clock advances across three incident histories. A new page lands at the boundary in one row and after it in another. Then a timed-out rewrite changes which denominator a filtered analysis would use."
    beats:
      - say: >-
          Start these three incidents together. Eight minutes in, each engineer marks the answer usable. At minute nine the logs are complete so far. Which of these three outcomes can enter the final count?
        hold: 2.8
        visual_cues:
          - id: eight
            phrase: "Eight minutes in"
            targets: [picture]
          - id: usable
            phrase: "marks the answer usable"
            targets: [picture]
          - id: nine
            phrase: "At minute nine"
            targets: [picture]
          - id: ask
            phrase: "Which of these three outcomes"
            targets: [picture]
      - say: >-
          All three are pending. Advance to the deadline. A new human page comes in for B exactly at minute ten. Score the rows now. A and C qualify. B had a usable mark, but the page arrived inside its window. Go on to minute eighteen. C gets a page there. C keeps its success for the ten-minute metric. The page that started each incident came before enrollment and counts in none of these windows.
        hold: 0.85
        visual_cues:
          - id: pending
            phrase: "All three are pending"
            targets: [picture]
          - id: deadline
            phrase: "Advance to the deadline"
            targets: [picture]
          - id: page
            phrase: "A new human page"
            targets: [picture]
          - id: score
            phrase: "Score the rows now"
            targets: [picture]
          - id: later
            phrase: "Go on to minute eighteen"
            targets: [picture]
          - id: late-page
            phrase: "C gets a page there"
            targets: [picture]
      - say: >-
          Now take three treatment incidents with complete follow-up. Two got usable answers with no new page. One rewrite timed out and never got a usable mark. Count by assignment and that's two out of three. Drop the timeout and it looks like two out of two. Put it back. Intention to treat keeps the policy's delays and failures in the comparison, whatever caused them. If the event log itself is missing, the outcome is unknown. Investigate that gap.
        hold: 0.8
        visual_cues:
          - id: three
            phrase: "three treatment incidents"
            targets: [picture]
          - id: keep
            phrase: "two out of three"
            targets: [picture]
          - id: drop
            phrase: "Drop the timeout"
            targets: [picture]
          - id: restore
            phrase: "Put it back"
            targets: [picture]
      - say: >-
          A grounding audit asks a separate question. In our launch example every enrolled incident has one completed answer and one blinded audit. If only some answers get audited, use the audit denominator and its sampling plan. Likewise, decide in advance how timeouts count toward first-request latency. Dropping unfinished requests can make a slow policy look fast.
        hold: 0.85
        visual_cues:
          - id: audit
            phrase: "A grounding audit"
            targets: [picture]
  - id: lift
    title: Read the rate difference in the right units
    visual: Counts of 760/2,000 and 840/2,000 become 38% and 42%, with a two-arm uncertainty interval around four
      percentage points.
    beats:
      - say: In a compact teaching fixture, the raw-query arm resolves 760 of 2,000 incidents, or thirty-eight
          percent. The rewrite arm resolves 840 of 2,000, or forty-two percent. Subtract the rates and the
          observed absolute lift is four percentage points.
        hold: 0.55
        visual_cues:
          - id: control
            phrase: "760 of 2,000 incidents"
            targets:
              - picture
          - id: treatment
            phrase: "840 of 2,000"
            targets:
              - picture
          - id: absolute
            phrase: "four percentage points"
            targets:
              - picture
      - say: Relative lift asks how large that increase is compared with the thirty-eight-percent baseline. Four
          points divided by thirty-eight percent is about ten and a half percent. Percentage points report
          additional successes per hundred; percent reports a proportional change.
        hold: 0.6
        visual_cues:
          - id: relative
            phrase: "about ten and a half percent"
            targets:
              - picture
      - say: Incidents differ, so another experiment would produce different counts. For two independent
          binary-outcome arms, an approximate standard error adds the sampling variances from both rates. Here
          it is about one point five five points, giving a rough ninety-five-percent interval from one to
          seven points.
        hold: 0.75
        visual_cues:
          - id: se
            phrase: "about one point five five points"
            targets:
              - picture
          - id: interval
            phrase: "interval from one to seven points"
            targets:
              - picture
  - id: independent-units
    title: A duplicated outcome cannot supply new precision
    visual: One incident tile is copied into four message rows. Rates stay fixed while a fictitious denominator
      wrongly compresses the confidence interval.
    beats:
      - say: Copy every incident outcome into four message rows. Both success counts and denominators multiply by
          four, so thirty-eight and forty-two percent remain unchanged. Substituting four times the sample
          size into the independence formula halves the standard error without adding evidence. The article’s
          interval shrinks falsely from one through seven points to about two point five through five point
          five. Aggregate once per randomized incident before applying that calculation.
        hold: 0.55
        visual_cues:
          - id: duplicate
            phrase: "four message rows"
            targets:
              - picture
          - id: false-se
            phrase: "halves the standard error"
            targets:
              - picture
          - id: aggregate
            phrase: "Aggregate once per randomized incident"
            targets:
              - picture
      - say: Build the independent-arm standard error from each arm’s rate times one minus that rate divided by its
          own incident count, then add and take the square root. Multiplying that standard error by one point
          nine six makes the normal-approximation margin. Across repeated suitable experiments the procedure
          targets ninety-five-percent coverage of the defined effect. It does not assign ninety-five-percent
          probability to this fixed true effect or predict another experiment’s outcome. Rare events,
          clustering and multiple claims need their own methods.
        hold: 0.75
        visual_cues:
          - id: formula
            phrase: "add and take the square root"
            targets:
              - picture
  - id: power
    title: Plan traffic around an effect worth finding
    visual: Intervals narrow as the number of independent incidents grows; the planning target calls for a
      two-point effect and eighty-percent power.
    beats:
      - say: A small experiment can estimate a lift imprecisely. The chart keeps the same two teaching rates and
          compares projected interval widths at two hundred, five hundred, and two thousand incidents per arm.
          This lets us see how planned sample size changes precision.
        hold: 0.55
        visual_cues:
          - id: n200
            phrase: "two hundred"
            targets:
              - picture
          - id: n500
            phrase: "five hundred"
            targets:
              - picture
          - id: n2000
            phrase: "two thousand incidents per arm"
            targets:
              - picture
      - say: "Before launch, choose a minimum detectable effect: a true improvement you want a specified chance of
          detecting under the planning model. With a thirty-eight-percent baseline, a two-point target, a
          five-percent two-sided threshold, and eighty-percent power, a common shortcut gives about nine
          thousand two hundred forty-six incidents per arm."
        hold: 0.6
        visual_cues:
          - id: target
            phrase: "minimum detectable effect"
            targets:
              - picture
          - id: sample
            phrase: "nine thousand two hundred forty-six incidents per arm"
            targets:
              - picture
      - say: In this fixture, two thousand incidents per arm give an interval above zero for the observed four-point
          lift. Detecting the smaller two-point planning target reliably requires the larger sample we just
          calculated. Power changes with effect size, sample size, outcome variation, analysis, and the launch
          rule.
        hold: 0.75
        visual_cues:
          - id: observed
            phrase: "observed four-point lift"
            targets:
              - picture
          - id: smaller
            phrase: "smaller two-point planning target"
            targets:
              - picture
  - id: power-and-decision
    title: Detection probability and launch probability differ
    visual: Repeated hypothetical effect estimates cross a zero-detection boundary and a separate observed-value
      threshold. The design MDE and two sample-size approximations stay distinct.
    beats:
      - say: >-
          Imagine repeating the experiment with a true lift of two points. The blue curve shows where the estimates land. A result beyond either yellow line counts as a detection. Our goal is eighty percent power at two points. At that power, about eighty out of a hundred such experiments detect a difference. The other twenty miss it, a Type Two error. When the true lift is zero, five percent cross a yellow line, counting both tails together. We call the lift we plan for the minimum detectable effect. Smaller lifts can still cross a line. Halving the target requires about four times the enrollment to keep the same power.
        hold: 0.55
        visual_cues:
          - id: scaling
            phrase: "Halving the target requires about four times"
            targets:
              - picture
      - say: The shortcut uses twice the baseline Bernoulli variance times the squared sum of the alpha and power
          normal cutoffs, divided by the squared effect. At baseline thirty-eight percent and a two-point
          target it gives nine thousand two hundred forty-six per arm. The fuller independent-proportions
          calculation gives about seventy-nine point six percent power there and needs nine thousand three
          hundred thirty-six for eighty percent. Plan enrollment using the allocation and analysis you intend to run.
        hold: 0.55
        visual_cues:
          - id: shortcut
            phrase: "nine thousand two hundred forty-six per arm"
            targets:
              - picture
          - id: fuller
            phrase: "seventy-nine point six percent power"
            targets:
              - picture
          - id: exact
            phrase: "nine thousand three hundred thirty-six"
            targets:
              - picture
      - say: >-
          Now draw the launch threshold at two points. It runs through the center of the blue curve. If the true lift is exactly two points, only about half the estimates reach that threshold. Even before we check the guardrails, the other half fall short. Enrollment narrows the curve around the same true lift. Plan the calendar duration too, so the experiment covers the weekdays and on-call rotations you care about.
        hold: 0.75
        visual_cues:
          - id: launch
            phrase: "draw the launch threshold"
            targets:
              - picture
          - id: different
            phrase: "only about half the estimates"
            targets:
              - picture
  - id: srm
    title: "Did the planned split reach the table?"
    visual: "Compare two tables of four thousand distinct incidents against the same expected counts and alert cutoff before revealing any resolution outcomes."
    beats:
      - say: >-
          Before reading lift, count distinct enrolled incident IDs. With four thousand incidents and a planned half split, expect two thousand in each arm. This table has sixteen hundred fifty control incidents and twenty-three hundred fifty treatment incidents. Square each arm's distance from its expected count, divide by that expected count and add the two contributions. The chi-square statistic is one hundred twenty-two point five.
        hold: 0.8
        visual_cues:
          - id: observed
            phrase: "This table has"
            targets: [picture]
          - id: square
            phrase: "Square each arm's distance"
            targets: [picture]
          - id: statistic
            phrase: "one hundred twenty-two point five"
            targets: [picture]
      - say: >-
          That's well above our predeclared alert threshold of ten point eight three. Pause for investigation. This is a sample-ratio mismatch. It doesn't identify the cause. Trace the incident IDs from assignment through eligibility filters and event joins. Did a filter drop one arm's events? Check the logs before anyone claims a treatment effect.
        hold: 0.8
        visual_cues:
          - id: alert
            phrase: "Pause for investigation"
            targets: [picture]
      - say: >-
          Here's a different table with the same four thousand incidents: nineteen hundred control and twenty-one hundred treatment. Each bar misses its target by a hundred. Does this split trigger the same alert?
        hold: 2.8
        visual_cues:
          - id: new
            phrase: "a different table"
            targets: [picture]
          - id: ask
            phrase: "Does this split trigger"
            targets: [picture]
      - say: >-
          Each arm contributes five. The statistic is ten, below ten point eight three. No allocation alert. We still need to audit outcome fields for completeness. Counting messages here would ask the wrong question: the rewrite itself might change how often an engineer follows up.
        hold: 0.85
        caption_starts:
          - "No allocation alert"
        visual_cues:
          - id: small
            phrase: "The statistic is ten"
            targets: [picture]
          - id: below
            phrase: "No allocation alert"
            targets: [picture]
  - id: peeking
    title: "Follow one experiment to its planned finish"
    visual: "Retain a marker at the first ordinary threshold crossing while the same cumulative path runs to look twenty. Compare false-alarm counts under four schedules."
    beats:
      - say: >-
          Suppose we give both arms the same policy. Their true resolution rates are both forty percent. Each batch brings in a hundred new incidents per arm. The lines mark the ordinary two-sided cutoff. By the fourth batch, the difference is two point five eight standard errors above zero. A team that stops on the first crossing would call that a difference. This team planned to wait for twenty batches. Does the planned final look also cross?
        hold: 2.5
        visual_cues:
          - id: four
            phrase: "By the fourth batch"
            targets: [picture]
          - id: cross
            phrase: "the first crossing"
            targets: [picture]
          - id: ask
            phrase: "Does the planned final look"
            targets: [picture]
      - say: >-
          Run the rest of the batches. The earlier incidents stay in every later calculation. At look twenty the statistic is one point six one, inside the lines. Those two rules give different answers on the very same incidents. Because the looks share observations, multiplying the odds from twenty independent tests would give the wrong false-alarm rate.
        hold: 0.7
        caption_starts:
          - "At look twenty"
        visual_cues:
          - id: finish
            phrase: "Run the rest"
            targets: [picture]
          - id: inside
            phrase: "inside the lines"
            targets: [picture]
      - say: >-
          Repeat that simulation five thousand times. Count each experiment once if it raises an alarm in either direction. A single final look flags two hundred thirty-one. Stop at the first crossing over five scheduled looks and seven hundred eight flag. Ten looks give nine hundred sixty-one. Twenty looks give twelve hundred forty-four. That's four point six percent at the final look and twenty-four point nine percent with twenty chances to stop.
        hold: 0.8
        visual_cues:
          - id: repeat
            phrase: "Repeat that simulation"
            targets: [picture]
          - id: final
            phrase: "single final look"
            targets: [picture]
          - id: five
            phrase: "five scheduled looks"
            targets: [picture]
          - id: ten
            phrase: "Ten looks give"
            targets: [picture]
          - id: twenty
            phrase: "Twenty looks give"
            targets: [picture]
          - id: rates
            phrase: "four point six percent"
            targets: [picture]
      - say: >-
          A dashboard can update after every batch. To act on those updates, plan a sequential test that accounts for earlier looks. Searching across metrics, variants or subgroups also buys extra chances to find a difference. Declare the family of claims and its error control, such as Bonferroni, or use a fresh experiment to confirm an exploratory finding.
        hold: 0.8
  - id: alpha-spending
    title: "What can we spend before the final look?"
    visual: "Grow a cumulative error curve to half and full information. Switch to two calibrated positive z boundaries and place the same final observation beside each."
    beats:
      - say: >-
          Imagine budgeting the chance of even one false alarm across the entire experiment. Start at zero. Half the planned statistical information has arrived. Here the design allows about half a percent cumulative chance of a false alarm by this point. At full information it allows five percent. This horizontal scale measures information. It tracks the fraction enrolled only when information grows in proportion to enrollment.
        hold: 0.75
        visual_cues:
          - id: half
            phrase: "Half the planned statistical information"
            targets: [picture]
          - id: full
            phrase: "At full information"
            targets: [picture]
      - say: >-
          This spending function is an O'Brien and Fleming style design. At each information fraction, divide the two-sided normal cutoff by the square root of that fraction and take both tails. The result budgets the chance of a crossing by then. To get the cutoff at a particular look, account for how that look shares data with earlier ones, and which paths have already crossed.
        hold: 0.65
        visual_cues:
          - id: function
            phrase: "This spending function"
            targets: [picture]
      - say: >-
          Compare two plans at their final look. In a single ordinary test the positive z boundary is one point nine six. In the published six-look example it's about two point zero four five. Suppose no earlier look crossed. Both teams now observe a final z of two. Which plan rejects the no-effect null?
        hold: 3
        visual_cues:
          - id: two-plans
            phrase: "Compare two plans"
            targets: [picture]
          - id: six
            phrase: "six-look example"
            targets: [picture]
          - id: statistic
            phrase: "observe a final z of two"
            targets: [picture]
          - id: question
            phrase: "Which plan rejects"
            targets: [picture]
      - say: >-
          The single-look plan rejects. Two is beyond its line. The six-look plan finishes short of its line. It has too little evidence to reject. Comparing today's ordinary p-value with the five percent cumulative budget would have given the wrong call for that plan. Calibrate the boundaries and the power for the planned looks. Flexible timing still needs the design's information and monitoring assumptions.
        hold: 0.85
        caption_starts:
          - "The six-look plan finishes"
        visual_cues:
          - id: ordinary
            phrase: "single-look plan rejects"
            targets: [picture]
          - id: sequential
            phrase: "too little evidence to reject"
            targets: [picture]
  - id: mixture-evidence
    title: "Which model expected this outcome?"
    visual: "Feed one success and one failure into two likelihood products. On a fresh sequence, retain the highest mixture ratio as later failures bring the current ratio back down."
    beats:
      - say: >-
          Watch a single stream of independent outcomes. Under the null, each has a forty percent chance of success. One model predicts twenty percent and the other predicts sixty. Give them equal weight and start both likelihood ratios at one. A success arrives. The twenty-percent model gave it half the chance the null did. Its ratio drops to one half. The sixty-percent model gave it one and a half times the chance. Its ratio rises to one and a half. Average the two ratios and we get one.
        hold: 0.8
        visual_cues:
          - id: success
            phrase: "A success arrives"
            targets: [picture]
          - id: first-hit
            phrase: "The twenty-percent model"
            targets: [picture]
          - id: second-hit
            phrase: "The sixty-percent model"
            targets: [picture]
          - id: average
            phrase: "we get one"
            targets: [picture]
      - say: >-
          Now a failure arrives. The null gave failure a sixty percent chance. The first model gave it eighty percent. Multiply its half by eighty over sixty and it recovers to two thirds. The second model gave failure forty percent. Multiply its one and a half by forty over sixty and it falls back to one. The two ratios now average about zero point eight three three. This is a mixture sequential probability ratio test. Under the null, weighting each possible multiplier by its outcome probability gives one. The mixture's expected next value equals its current value. This makes it a nonnegative martingale under the null.
        hold: 0.75
        visual_cues:
          - id: failure
            phrase: "a failure arrives"
            targets: [picture]
          - id: first-miss
            phrase: "The first model gave it eighty percent"
            targets: [picture]
