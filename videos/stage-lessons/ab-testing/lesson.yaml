          Before exposing engineers to a rewrite, try the rollback question offline. The runbook says acknowledgement is required. Read these two candidate answers. A human reviewer labels the requirement supported and the claim of permission unsupported. Now uncover two practice labels from a model judge using the same rubric. It marked both answers supported. How many of its labels agree with the human reviewer?
