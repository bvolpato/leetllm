objectives:
  - id: route-evidence
    can: Trace a literal match, a learned word count, and a positive tie to the queue that gets the report.
    scenes: [opening, rulebook, rule-growth, learning]
  - id: search-and-permission
    can: Separate which candidate wins a verifier score from which action the evidence and policy permit.
    scenes: [search, policy-gate, request-budget, earned-transfer]
