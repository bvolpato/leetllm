version: 1
id: bitter-lesson-compute-over-heuristics
title: "The Bitter Lesson: Where Compute Goes"
source: fundamentals/bitter-lesson-compute-over-heuristics/content.md
sources:
  - title: The Bitter Lesson
    url: http://www.incompleteideas.net/IncIdeas/BitterLesson.html
  - title: Mastering Chess and Shogi by Self-Play with a General Reinforcement Learning Algorithm
    url: https://arxiv.org/abs/1712.01815
  - title: ImageNet Classification with Deep Convolutional Neural Networks
    url: https://proceedings.neurips.cc/paper/2012/hash/c399862d3b9d6b76c8436e924a68c45b-Abstract.html
  - title: Scaling Laws for Neural Language Models
    url: https://arxiv.org/abs/2001.08361
  - title: Training Compute-Optimal Large Language Models
    url: https://arxiv.org/abs/2203.15556
  - title: The Llama 3 Herd of Models
    url: https://arxiv.org/abs/2407.21783
  - title: Scaling LLM Test-Time Compute Optimally can be More Effective than Scaling Model Parameters
    url: https://arxiv.org/abs/2408.03314
scenes:
  - id: opening
    title: "Which ticket goes to latency?"
    visual: >-
      A seven-letter strip slides under the first ticket. It can line up with the same letters in the report.
      On the replay both scans run together. The two destinations appear after the prediction.
    beats:
      - say: >-
          Slide the word timeout along these tickets. Which one will the router send to latency?
        hold: 1.4
      - say: >-
          The letters line up in the first ticket. It goes to latency. Now slide the strip along
          “tokens arrive slowly.” It reaches the end without a match. The ticket goes to manual review.
        hold: 0.8
        caption_starts:
          - "It goes to latency"
          - "Now slide the strip"
          - "It reaches the end"
          - "The ticket goes to manual review"
        visual_cues:
          - id: first-scan
            phrase: "The letters line up in the first ticket"
            targets: [picture]
          - id: control-match
            phrase: "It goes to latency"
            targets: [picture]
          - id: second-round
            phrase: "Now slide the strip"
            targets: [picture]
          - id: initial-miss
            phrase: "The ticket goes to manual review"
            targets: [picture]
      - say: >-
          Give each ticket its own worker. They scan both messages in one round. Where does the
          slow-token report go this time?
        hold: 2.25
        visual_cues:
          - id: add-worker
            phrase: "Give each ticket its own worker"
            targets: [picture]
          - id: same-round
            phrase: "They scan both messages"
            targets: [picture]
          - id: two-worker-question
            phrase: "Where does the slow-token report go this time"
            targets: [picture]
      - say: >-
          Manual review again. Two workers finish sooner. They still look for the same seven letters.
          A learner can train on more examples. A search can try more choices. Both can use extra compute
          to change the decision. That’s the idea behind Rich Sutton’s Bitter Lesson.
        hold: 1.15
        visual_cues:
          - id: parallel-result
            phrase: "Manual review again"
            targets: [picture]
          - id: learn-or-search
            phrase: "A learner can train on more examples"
            targets: [picture]
  - id: rulebook
    title: "Six reports through three checks"
    visual: >-
      The same two opening reports join four more reviewed examples. Three literal keys and their
      destinations appear alongside the actual queue each report reaches.
    beats:
      - say: >-
          Here’s the whole rulebook. Alongside timeout for latency, the developer wrote two more checks.
          Citation sends a report to quality. Password sends it to access. Anything left over goes to manual
          review.
        hold: 0.8
        visual_cues:
          - id: rulebook-beat-1-focus-1
            phrase: "Here’s the whole rulebook"
            targets: [picture]
      - say: >-
          Look down the reports for those strings. Three of them contain a key. The other three describe a
          delay, a bad citation, or an access problem in different words. None of those three contains the
          letters the corresponding check is looking for.
        hold: 1
        visual_cues:
          - id: rulebook-beat-2-focus-1
            phrase: "Three of them contain a key"
            targets: [picture]
          - id: rules-misses
            phrase: "None of those three contains the letters the corresponding check is looking for"
            targets: [picture]
      - say: >-
          That gives us three correct queue assignments out of six. Each report has a reviewed destination
          we can compare with the output. Running these checks again leaves the same three reports waiting.
          Let’s give the developer a chance to change the rulebook.
        hold: 0.8
        visual_cues:
          - id: rulebook-beat-3-focus-1
            phrase: "three correct queue assignments out of six"
            targets: [picture]
          - id: rulebook-beat-3-focus-2
            phrase: "Running these checks again leaves the same three reports waiting"
            targets: [picture]
  - id: rule-growth
    title: "Four edits to the rulebook"
    visual: >-
      Four added keys change individual outputs on the reviewed set. One addition matches a report that
      already routes correctly. Three unseen phrasings then face the final seven keys.
    beats:
      - say: >-
          Suppose the developer repairs the rulebook using those six reports. Add the key tokens. Now “tokens
          arrive slowly” reaches latency. Add cites and the wrong-document report reaches quality.
        hold: 1
        visual_cues:
          - id: patch-tokens
            phrase: "Add the key tokens"
            targets: [picture]
          - id: patch-cites
            phrase: "Add cites"
            targets: [picture]
      - say: >-
          Now add stale source. Look at the report it matches. Citation already sent that one to quality, so
          the score stays at five. Add authenticate and the last report goes to access. All six reviewed
          reports now pass.
        hold: 1.1
        visual_cues:
          - id: patch-source
            phrase: "Now add stale source"
            targets: [picture]
          - id: patch-authenticate
            phrase: "Add authenticate"
            targets: [picture]
      - say: >-
          Set those reports aside. Here are three fresh ones, including “T T F T spiked today.” T T F T
          means time to first token. Read each report against the seven keys. Which fresh reports contain a
          listed key?
        hold: 2.2
        visual_cues:
          - id: fresh-set
            phrase: "Here are three fresh ones"
            targets: [picture]
      - say: >-
          All go to manual review. Seven keys cover yesterday’s six reports. Each of these new reports
          describes the same kind of problem in different words. To find out how often the keys work, try them
          on a fresh sample from the queue.
        hold: 1
        visual_cues:
          - id: fresh-result
            phrase: "All go to manual review"
            targets: [picture]
  - id: learning
    title: "How does a report earn a route?"
    visual: >-
      One labeled issue supplies three quality words. The opening ticket reappears, followed by a reviewed
      correction, a fresh report that shares just one word, and a positive tie.
    beats:
      - say: >-
          Here’s a report a reviewer sent to quality. Each time a word appears, the learner adds one to its
          count for that queue. Suppose the next report says “unsupported citation answer.” Which words can
          it use?
        hold: 1.1
        visual_cues:
          - id: quality-input
            phrase: "Suppose the next report says"
            targets: [picture]
      - say: >-
          Unsupported contributes one point to quality. Citation adds a second. Answer adds a third. Quality
          has the only positive top score, so the report goes to quality.
        hold: 0.85
        visual_cues:
          - id: word-unsupported
            phrase: "Unsupported contributes"
            targets: [picture]
          - id: word-citation
            phrase: "Citation adds"
            targets: [picture]
          - id: word-answer
            phrase: "Answer adds"
            targets: [picture]
          - id: quality-route
            phrase: "the report goes to quality"
            targets: [picture]
      - say: >-
          Here’s “tokens arrive slowly” beside a report labeled latency. They share one word, tokens. That
          earns the one point needed to route it to latency.
        hold: 0.85
        visual_cues:
          - id: opening-report
            phrase: "Here’s “tokens arrive slowly”"
            targets: [picture]
          - id: token-match
            phrase: "They share one word"
            targets: [picture]
          - id: opening-route
            phrase: "to route it to latency"
            targets: [picture]
      - say: >-
          Now try “the site loads slowly.” None of its words occurred in the six training reports. All three
          scores are zero, so the learner sends this one to manual review.
        hold: 1
        caption_starts:
          - "None of its words"
          - "All three scores"
        visual_cues:
          - id: unseen-report
            phrase: "Now try"
            targets: [picture]
          - id: no-evidence
            phrase: "the learner sends this one to manual review"
            targets: [picture]
      - say: >-
          A reviewer labels it latency. Add that example and count again. The four words now give the same
          report four latency points. We know the learner absorbed the correction.
        hold: 1
        visual_cues:
          - id: reviewed-label
            phrase: "A reviewer labels it latency"
            targets: [picture]
          - id: recount
            phrase: "count again"
            targets: [picture]
          - id: corrected-route
            phrase: "four latency points"
            targets: [picture]
      - say: >-
          Keep the updated counts and open a fresh report. It says “pages arrive slowly.” Neither pages nor
          arrive appeared in training. Where should this report go?
        hold: 2.2
        visual_cues:
          - id: fresh-example
            phrase: "open a fresh report"
            targets: [picture]
          - id: predict-transfer
            phrase: "Where should this report go"
            targets: [picture]
      - say: >-
          Slowly supplies one point. That sends the new report to latency. This is one word carrying over. A
          phrase like “responses take ages” still scores zero. Test the release on untouched, labeled issues
          to learn how often these matches help.
        hold: 1
        caption_starts:
          - "That sends the new report to latency"
          - "A phrase like"
        visual_cues:
          - id: one-match
            phrase: "Slowly supplies one point"
            targets: [picture]
          - id: fresh-route
            phrase: "That sends the new report to latency"
            targets: [picture]
      - say: >-
          One more ticket says “timeout password.” Each word was seen once with a different queue. Latency
          and access tie at one. The learner sends the tie to manual review. Picking whichever queue comes
          first would turn the order of the labels into a routing decision.
        hold: 0.9
        caption_starts:
          - "Latency and access tie"
          - "The learner sends the tie"
        visual_cues:
          - id: conflict
            phrase: "One more ticket"
            targets: [picture]
          - id: equal-evidence
            phrase: "Latency and access tie at one"
            targets: [picture]
          - id: tie-decision
            phrase: "The learner sends the tie to manual review"
            targets: [picture]
  - id: search
    title: "Which action wins the search?"
    visual: >-
      A fixed list expands from two to four candidates. A resolution proposal cites the same trusted IDs as the
      winner. Moving it to the front changes which action wins the tie.
    beats:
      - say: >-
          A citation check has failed on run R forty-two. We know the run ID and the name of the failing
          metric. While the deployed model stays fixed, we can spend more time on this request by comparing
          candidate actions. That’s search.
        hold: 0.8
      - say: >-
          Start with two candidates from a list we wrote in advance. A quality action gets one point for
          each distinct ID it cites from the trusted record. Repeated IDs count once. Made-up IDs earn
          nothing. A promotion proposal gets minus one because this is a quality incident. With these two
          choices, retry wins with zero.
        hold: 1
        caption_starts:
          - "A quality action gets"
          - "A promotion proposal"
          - "retry wins with zero"
        visual_cues:
          - id: budget-two
            phrase: "Start with two candidates"
            targets: [picture]
          - id: retry-wins
            phrase: "retry wins with zero"
            targets: [picture]
      - say: >-
          Let the checker see the next two candidates. The first cites the run. The next also cites the
          metric and would block promotion until it recovers. That action wins with two points. Extra search
          exposed a better-supported choice this time.
        hold: 0.95
        caption_starts:
          - "That action wins with two points"
        visual_cues:
          - id: budget-four
            phrase: "see the next two candidates"
            targets: [picture]
          - id: trace-wins
            phrase: "That action wins with two points"
            targets: [picture]
      - say: >-
          Add one more candidate. It marks the issue resolved and cites the very same two IDs. The checker
          gives it the same score. When scores tie, the first action wins. Put the resolution proposal first
          and keep every score fixed. Which action wins in this order?
        hold: 2.15
        visual_cues:
          - id: extra-candidate
            phrase: "Add one more candidate"
            targets: [picture]
          - id: new-order
            phrase: "Put the resolution proposal first"
            targets: [picture]
          - id: predict-order
            phrase: "Which action wins in this order"
            targets: [picture]
      - say: >-
          Marking the issue resolved now wins. Both proposals cite the failed check. Closing the issue would
          take different evidence, such as a passing rerun. Before an action can run, check that the evidence
          supports it and that the caller has permission. Search also depends on which actions the generator
          can propose.
        hold: 1
        visual_cues:
          - id: tie-winner
            phrase: "Marking the issue resolved now wins"
            targets: [picture]
  - id: policy-gate
    title: "Can this build move forward?"
    visual: >-
      A release request carries a report marker and a score. The dot crosses the threshold, then the
      report goes missing while the score holds. Restore the marker to test invalid scores and the boundary.
    beats:
      - say: >-
          “Ship this build.” The model reads that note as a request to promote. Ordinary tickets can go
          straight to latency, quality or access. Unknown routes go to review. A release proposal goes
          through a gate.
        hold: 0.8
        visual_cues:
          - id: proposal
            phrase: "as a request to promote"
            targets: [picture]
          - id: ordinary-routes
            phrase: "Ordinary tickets"
            targets: [picture]
          - id: release-path
            phrase: "A release proposal goes through a gate"
            targets: [picture]
      - say: >-
          The evaluation report is listed. The team set the cutoff at point nine five. At point nine one
          the build goes to review.
        hold: 1
        caption_starts:
          - "At point nine one"
        visual_cues:
          - id: report-listed
            phrase: "The evaluation report is listed"
            targets: [picture]
          - id: score-low
            phrase: "At point nine one the build goes to review"
            targets: [picture]
      - say: >-
          Move the score to point nine eight. Now it passes the score check.
        hold: 1
        caption_starts:
          - "Now it passes"
        visual_cues:
          - id: raise-score
            phrase: "Move the score to point nine eight"
            targets: [picture]
          - id: numeric-pass
            phrase: "Now it passes the score check"
            targets: [picture]
      - say: >-
          Take the report marker off the request. Keep the score at point nine eight. What does the gate
          do now?
        hold: 1.7
        visual_cues:
          - id: remove-report
            phrase: "Take the report marker off the request"
            targets: [picture]
      - say: >-
          It requests the report. The gate checks for that marker first, so it stops there.
        hold: 0.9
        visual_cues:
          - id: missing-verdict
            phrase: "It requests the report"
            targets: [picture]
      - say: >-
          Put the report marker back. What counts as a score? A finite number from zero to one.
        hold: 1
        caption_starts:
          - "A finite number"
        visual_cues:
          - id: restore-report
            phrase: "Put the report marker back"
            targets: [picture]
          - id: valid-score
            phrase: "A finite number from zero to one"
            targets: [picture]
      - say: >-
          Strings, Booleans and NaN go to review. In Python, checking the type and range first sends
          even a huge integer to review before the finiteness check can overflow.
        hold: 1
        caption_starts:
          - "In Python"
        visual_cues:
          - id: invalid-score
            phrase: "Strings, Booleans and NaN go to review"
            targets: [picture]
          - id: check-order
            phrase: "checking the type and range first"
            targets: [picture]
      - say: >-
          Try a score right on the line. Point nine five passes. Before deployment, the release service
          authenticates the report, matches it to the build and evaluation cohort, and checks the caller’s permission.
        hold: 0.9
        caption_starts:
          - "Point nine five passes"
          - "Before deployment"
        visual_cues:
          - id: boundary-score
            phrase: "Try a score right on the line"
            targets: [picture]
          - id: boundary-pass
            phrase: "Point nine five passes"
            targets: [picture]
          - id: release-service
            phrase: "Before deployment"
            targets: [picture]
  - id: historical-pattern
    title: "What did the extra computation buy?"
    visual: >-
      A chess tree grows one level deeper. In vision, image examples change the strength of network
      connections. Separate views show the scope of the AlexNet training time, learned speech patterns,
      and the move a learned policy directs search toward in Go.
    beats:
      - say: >-
          In nineteen ninety-seven, Deep Blue beat Garry Kasparov at chess. Experts gave it features
          for scoring a position. More search let it look a move deeper. Now it can compare the replies
          its opponent might make to each move.
        hold: 1
        visual_cues:
          - id: deep-search
            phrase: "look a move deeper"
            targets: [picture]
      - say: >-
          Look at the edge in this image patch. A hand-designed descriptor like SIFT records how
          brightness changes across a patch. AlexNet learned its filters from labeled images. Its
          designers chose the size of each filter. Training changed what the filter responded to.
        hold: 0.9
        visual_cues:
          - id: vision
            phrase: "Look at the edge"
            targets: [picture]
          - id: learn-filters
            phrase: "AlexNet learned its filters from labeled images"
            targets: [picture]
      - say: >-
          The base network took five to six days to train on two GPUs. For the winning ImageNet entry in
          twenty twelve, the team combined predictions from seven networks. Each contributed to the
          final prediction.
        hold: 1
        visual_cues:
          - id: base-cost
            phrase: "The base network took five to six days"
            targets: [picture]
          - id: ensemble
            phrase: "combined predictions from seven networks"
            targets: [picture]
      - say: >-
          Speech recognition made a similar shift. Early systems used expert knowledge of sounds and the
          vocal tract. Hidden Markov models learned statistical patterns from recordings. Later, deep
          networks could learn features from speech data too.
        hold: 0.9
        visual_cues:
          - id: speech
            phrase: "Speech recognition"
            targets: [picture]
          - id: speech-model
            phrase: "Hidden Markov models"
            targets: [picture]
          - id: speech-net
            phrase: "deep networks"
            targets: [picture]
      - say: >-
          AlphaZero combined learning and search in chess and Go. Its designers supplied the rules,
          a board encoding and a network. Playing against itself taught it which moves to explore first.
          Watch the search follow the favored move. A learned value estimates how promising the new
          position is. That’s what Rich Sutton called the Bitter Lesson. Across seventy years of AI
          research, methods that could learn from more experience or search more possibilities kept
          overtaking shortcuts that experts had spent years designing.
        hold: 1
        visual_cues:
          - id: self-play
            phrase: "AlphaZero combined learning and search"
            targets: [picture]
          - id: move-policy
            phrase: "which moves to explore first"
            targets: [picture]
          - id: follow-move
            phrase: "Watch the search follow the favored move"
            targets: [picture]
          - id: position-value
            phrase: "A learned value estimates"
            targets: [picture]
  - id: training-compute
    title: "One training budget, two ways to spend it"
    visual: >-
      The width and height of a rectangle represent non-embedding parameters and training tokens. Doubling
      the width preserves work, so the height halves.
    beats:
      - say: >-
          Take a dense Transformer. The width of this rectangle stands for the number of non-embedding
          parameters. Its height stands for the training tokens. Each parameter costs roughly six
          floating-point operations per training token, so six times the area gives us an estimate of the
          training work.
        hold: 1
        visual_cues:
          - id: training-compute-beat-1-focus-1
            phrase: "roughly six floating-point operations per training token"
            targets: [picture]
      - say: >-
          Try seven billion parameters and a hundred and forty billion tokens. That works out to five point
          eight eight zettaFLOPs. One zettaFLOP is ten to the twenty-first floating-point operations. To
          turn work into elapsed time we’d also need to know how quickly the hardware sustains it.
        hold: 0.9
        caption_starts:
          - "That works out to"
          - "One zettaFLOP is"
        visual_cues:
          - id: training-compute-beat-2-focus-1
            phrase: "seven billion parameters and a hundred and forty billion tokens"
            targets: [picture]
          - id: train-work
            phrase: "That works out to five point eight eight zettaFLOPs"
            targets: [picture]
          - id: train-unit
            phrase: "One zettaFLOP is ten to the twenty-first floating-point operations"
            targets: [picture]
      - say: >-
          Keep the training budget fixed. Double the width to fourteen billion parameters. What
          training-token count keeps the blue area the same?
        hold: 2
        visual_cues:
          - id: training-compute-beat-3-focus-1
            phrase: "Double the width to fourteen billion parameters"
            targets: [picture]
          - id: fixed-question
            phrase: "What training-token count keeps the blue area the same"
            targets: [picture]
      - say: >-
          Seventy billion tokens. We doubled the work per token, so we can afford half as many. The
          rectangle gives us two plans with the same estimated work. We still need an experiment to find out
          which plan learns more.
        hold: 1
        visual_cues:
          - id: training-compute-beat-3-focus-2
            phrase: "Seventy billion tokens"
            targets: [picture]
  - id: allocation-evidence
    title: "How would you choose a training run?"
    visual: >-
      Forward and backward work build the factor six. A held-out loss and a leaked token distinguish clean
      from contaminated evaluation. Published model sizes and training tokens anchor the fitted
      allocations.
    beats:
      - say: >-
          Where did that six come from? A forward pass takes roughly two operations per parameter per token.
          The backward pass takes about twice as much again. That gives us six in total. This estimate
          counts dense projections and leaves out embeddings. It works best when sequence-dependent
          attention is a small share of the work.
        hold: 0.95
        caption_starts:
          - "A forward pass takes"
          - "The backward pass takes"
        visual_cues:
          - id: allocation-evidence-b1
            phrase: "A forward pass takes roughly two operations per parameter per token"
            targets: [picture]
      - say: >-
          To compare what two runs learned, hold some text out of training. For each actual token, take the
          negative log of the probability the model gave it. Average those values to get held-out
          cross-entropy loss. At a fixed training budget, the split with the lowest held-out loss is
          training-optimal. Kaplan and colleagues saw smooth power-law trends in loss as their models, data
          and compute grew.
        hold: 0.9
        visual_cues:
          - id: allocation-loss
            phrase: "For each actual token, take the negative log of the probability the model gave it"
            targets: [picture]
          - id: allocation-trend
            phrase: "Kaplan and colleagues saw smooth power-law trends in loss"
            targets: [picture]
      - say: >-
          Watch what happens when an evaluation answer slips into training. The model can earn a better score
          by remembering that answer. Compare the two runs on text that stayed outside both training sets.
        hold: 1
        visual_cues:
          - id: allocation-leak
            phrase: "an evaluation answer slips into training"
            targets: [picture]
      - say: >-
          Kaplan’s twenty twenty fit favored putting more of each budget increase into model size.
          Parameters grew as compute to the power of point seven three, and training tokens as compute to
          point two seven. Hoffmann and colleagues tested more than four hundred models. Their fits favored
          growing the two together, with somewhat different exponents depending on how they estimated them.
        hold: 0.9
        visual_cues:
          - id: allocation-evidence-b2
            phrase: "Parameters grew as compute to the power of point seven three"
            targets: [picture]
          - id: allocation-hoffmann
            phrase: "Hoffmann and colleagues tested more than four hundred models"
            targets: [picture]
      - say: >-
          Chinchilla put that idea to the test. It had seventy billion parameters and saw one point four
          trillion training tokens. Gopher had two hundred and eighty billion parameters and saw three
          hundred billion tokens. Chinchilla did better across the reported downstream tasks at roughly
          Gopher’s training compute.
        hold: 0.95
        visual_cues:
          - id: allocation-chinchilla
            phrase: "It had seventy billion parameters and saw one point four trillion training tokens"
            targets: [picture]
          - id: allocation-gopher
            phrase: "Gopher had two hundred and eighty billion parameters and saw three hundred billion tokens"
            targets: [picture]
      - say: >-
          Twenty tokens per parameter describes the Chinchilla run. A different corpus or architecture calls
          for measuring the trade again. The Llama Three team trained its smaller models longer than its
          training-optimal prediction because they performed better at the same inference budget. Once we
          serve a model, we pay for its size again on every request.
        hold: 1
        visual_cues:
          - id: allocation-evidence-b3
            phrase: "Twenty tokens per parameter describes the Chinchilla run"
            targets: [picture]
          - id: allocation-serving
            phrase: "The Llama Three team trained its smaller models longer"
            targets: [picture]
  - id: serving-break-even
    title: "When does the smaller model repay its training?"
    visual: >-
      Two quality-matched plans share a fixed FLOP scale. Their training blocks stay fixed as serving
      extends each total at its own rate. The ends meet at 165B processed tokens per model.
    beats:
      - say: >-
          Suppose two dense models meet our quality target. The seven-billion-parameter model starts with
          the training bill we calculated for a hundred and forty billion tokens. The smaller model has
          three billion parameters and sees four hundred billion training tokens. Look where the blue bars
          end. The smaller model already owes an extra one point three two zettaFLOPs before either model
          serves a request.
        hold: 1
        visual_cues:
          - id: large-training
            phrase: "The seven-billion-parameter model"
            targets: [picture]
          - id: small-training
            phrase: "The smaller model has three billion parameters"
            targets: [picture]
      - say: >-
          Now we have to serve the models. Each processed token costs about twice the parameter count in
          forward operations. That’s fourteen billion operations for the larger model and six billion for
          the smaller one. Count uncached prompt tokens and tokens generated along the way. A request can
          account for many of both.
        hold: 0.85
        visual_cues:
          - id: forward-rates
            phrase: "Each processed token costs about twice the parameter count"
            targets: [picture]
      - say: >-
          Give each model a hundred billion serving tokens. The green part grows faster on the seven-billion
          model. So far it still uses less work overall. It started with a smaller training bill.
        hold: 0.9
        visual_cues:
          - id: first-traffic
            phrase: "Give each model a hundred billion serving tokens"
            targets: [picture]
          - id: first-ranking
            phrase: "it still uses less work overall"
            targets: [picture]
      - say: >-
          Read the gap that’s left. The smaller model still owes point five two zettaFLOPs. Each new token
          saves it eight billion operations. How many more tokens must each model process to close the gap?
        hold: 2.4
        visual_cues:
          - id: repayment
            phrase: "Each new token saves it eight billion operations"
            targets: [picture]
      - say: >-
          Another sixty-five billion. Add those to the first hundred billion and they meet at one hundred
          sixty-five billion tokens each. Both plans have used about eight point one nine zettaFLOPs.
          Starting from zero gives the same answer. Divide the full training premium by the saving on each
          serving token.
        hold: 1
        caption_starts:
          - "they meet at one hundred sixty-five billion tokens each"
          - "Both plans have used"
        visual_cues:
          - id: crossing
            phrase: "they meet at one hundred sixty-five billion tokens each"
            targets: [picture]
          - id: from-zero
            phrase: "Starting from zero gives the same answer"
            targets: [picture]
      - say: >-
          At two hundred billion tokens each, the smaller model now uses less lifetime work. We assumed the
          same quality and the same number of processed tokens. Before buying capacity, measure both models
          on the target workload, including latency and cost.
        hold: 1.15
        visual_cues:
          - id: later-traffic
            phrase: "At two hundred billion tokens each"
            targets: [picture]
          - id: later-ranking
            phrase: "the smaller model now uses less lifetime work"
            targets: [picture]
  - id: request-budget
    title: "What does one returned answer cost?"
    visual: >-
      Two independent candidates process the same eight input tokens. The user receives one answer. A
      separate run spends its whole generation allowance on hidden tokens before producing an answer.
    beats:
      - say: >-
          Here’s a small request we can count by hand. Keep the deployed weights fixed. Our first candidate
          reads eight uncached input tokens, generates six hidden tokens while working on the problem, and
          writes a two-token answer. We processed sixteen tokens and returned two.
        hold: 1.6
        visual_cues:
          - id: first-candidate
            phrase: "Our first candidate"
            targets: [picture]
          - id: one-answer
            phrase: "We processed sixteen tokens and returned two"
            targets: [picture]
      - say: >-
          Try a second candidate for the same request. In this example it reads the prompt again, spends the
          same six tokens reasoning, and writes another two-token answer. A verifier picks one answer to
          send back. We’ve processed thirty-two tokens, and the user still gets just two.
        hold: 0.9
        visual_cues:
          - id: another-candidate
            phrase: "Try a second candidate"
            targets: [picture]
          - id: two-candidates
            phrase: "the user still gets just two"
            targets: [picture]
      - say: >-
          Those bars count tokens processed by the generator. Difficulty estimation, routing, and verification
          can add work of their own. A verifier that just counts citations can give two very different actions
          the same score. Check what the answer says and whether the evidence supports it.
        hold: 0.85
        visual_cues:
          - id: other-work
            phrase: "Difficulty estimation, routing, and verification"
            targets: [picture]
      - say: >-
          Go back to one candidate for a separate run. This time its allowance is eight generated tokens.
          The input is already paid for. Suppose it needs all eight generated tokens for reasoning. How many
          tokens are left for its answer?
        hold: 2
        visual_cues:
          - id: one-again
            phrase: "Go back to one candidate"
            targets: [picture]
          - id: cap-premise
            phrase: "This time its allowance is eight generated tokens"
            targets: [picture]
          - id: cap-question
            phrase: "How many tokens are left for its answer"
            targets: [picture]
      - say: >-
          Zero. The user can receive an empty answer even though the model did work. A reasoning-effort
          setting influences that work without specifying an exact FLOP count. Compare settings on the same
          untouched tasks. Measure useful answers, completion failures, latency and cost at matched quality.
          In post-training, supervised examples or reinforcement learning with verifiable rewards can change
          the next model’s weights. This request used the weights it started with.
        hold: 1
        visual_cues:
          - id: empty-answer
            phrase: "Zero"
            targets: [picture]
          - id: measure-request
            phrase: "Compare settings on the same untouched tasks"
            targets: [picture]
  - id: earned-transfer
    title: "Which model uses less lifetime work?"
    visual: >-
      At the same request count and quality, extra reasoning tokens extend only the smaller model’s
      serving work. A separate release decision holds the passing score fixed and removes the report
      marker. The access ticket returns to show which letter runs the word counter read.
    beats:
      - say: >-
          Each model has processed two hundred billion serving tokens. The three-billion model has the
          shorter bar. Both still handle the same requests at the required quality. Now the smaller model
          processes another hundred billion reasoning tokens. Each of those costs six billion operations.
          Which plan now uses fewer lifetime FLOPs?
        hold: 2.4
        visual_cues:
          - id: extra-tokens
            phrase: "Now the smaller model processes another hundred billion reasoning tokens"
            targets: [picture]
      - say: >-
          The extra tokens add six tenths of a zettaFLOP. The smaller model reaches nine zettaFLOPs. The seven-billion
          model stays at eight point six eight and now uses less estimated work. Count what each model
          actually processes, even when the customer sees the same answer.
        hold: 1.2
        caption_starts:
          - "The smaller model reaches"
          - "The seven-billion model stays"
        visual_cues:
          - id: extra-work
            phrase: "The extra tokens add six tenths of a zettaFLOP"
            targets: [picture]
          - id: new-total
            phrase: "The smaller model reaches nine zettaFLOPs"
            targets: [picture]
      - say: >-
          Suppose the team proposes the seven-billion model for release. The proposal supplies a report
          marker and an evaluation score of point nine seven. The floor is point nine five. With both
          inputs, the local gate returns promote.
        hold: 1
        caption_starts:
          - "The proposal supplies"
          - "the local gate returns promote"
        visual_cues:
          - id: release-request
            phrase: "the team proposes the seven-billion model for release"
            targets: [picture]
          - id: local-pass
            phrase: "the local gate returns promote"
            targets: [picture]
      - say: >-
          Remove just the report marker. The score and the proposed action stay where they were. Which
          action does the local gate return now?
        hold: 2.1
        visual_cues:
          - id: remove-marker
            phrase: "Remove just the report marker"
            targets: [picture]
          - id: gate-question
            phrase: "Which action does the local gate return now"
            targets: [picture]
      - say: >-
          It requests evidence. That score could belong to yesterday’s build. The release service needs
          the report for this one.
        hold: 1.15
        caption_starts:
          - "That score could belong"
        visual_cues:
          - id: gate-answer
            phrase: "It requests evidence"
            targets: [picture]
          - id: match-report
            phrase: "The release service needs the report for this one"
            targets: [picture]
      - say: >-
          Read the ticket “can’t authenticate.” Our router counts runs of lowercase letters. The apostrophe
          splits the first word. That gives us three pieces from two written words. Next we’ll see how a
          tokenizer chooses pieces and why their IDs must match the model checkpoint.
        hold: 0.85
        caption_starts:
          - "The apostrophe splits"
          - "That gives us three pieces"
          - "Next we’ll see"
        visual_cues:
          - id: last-ticket
            phrase: "Read the ticket"
            targets: [picture]
          - id: split-word
            phrase: "The apostrophe splits the first word"
            targets: [picture]
          - id: letter-runs
            phrase: "That gives us three pieces from two written words"
            targets: [picture]
          - id: next-lesson
            phrase: "Next we’ll see how a tokenizer chooses pieces"
            targets: [picture]
