scenes:
  - id: opening
    title: Service response time
    visual: A bright dot rides the rising green trace across a cropped latency chart. Pulling the lower crop
      edge down uncovers the service legend. The plot and its key together identify which service slowed
      down.
    beats:
      - say: Follow the green line. From three to six o’clock, the response time keeps climbing. Which
          service slowed down?
        hold: 2.4
        caption_starts:
          - Which service slowed down
        visual_cues:
          - id: opening-follow-traces
            phrase: Follow the green line
            targets:
              - opening-chart-evidence
            color: cyan
            linger: 0.22
            caption_boundary: true
      - say: The crop gives us the color. Pull the bottom edge down to see the legend. Green means
          checkout. The image encoder turns the plot and the legend into features. The connector lets
          the language model read those features alongside the question.
        hold: 0.9
        visual_cues:
          - id: opening-restore-key
            phrase: Pull the bottom edge down to see the legend
            targets:
              - opening-legend
            color: green
            linger: 0.22
            caption_boundary: true
          - id: opening-match-key
            phrase: Green means checkout
            targets: [opening-chart-evidence, opening-legend]
            color: green
            linger: 0.22
            caption_boundary: true
          - id: opening-beat-2-focus-1
            phrase: The image encoder turns the plot and the legend into features
            targets:
              - opening-image-encoding
            color: cyan
            linger: 0.22
            caption_boundary: true
          - id: opening-beat-2-focus-2
            phrase: The connector lets the language model read those features alongside the question
            targets:
              - opening-modality-meeting
            color: cyan
            linger: 0.22
            caption_boundary: true
      - say: To find similar charts, a search system can rank whole screenshots by a single similarity
          score. To name the service, the decoder needs both the slope and the label. It can read those
          features in the input sequence or from a separate visual memory.
        hold: 0.7
        visual_cues:
          - id: opening-read-evidence
            phrase: the decoder needs both the slope and the label
            targets:
              - opening-route-output
            color: green
            linger: 0.22
            caption_boundary: true
  - id: case-contract
    title: What did the operator ask?
    visual: A separate incident screenshot, deploy record and timestamped transcript establish case C17. The
      case receipt binds immutable inputs to an authenticated tenant. A question receipt names the support
      and component versions behind the answer.
    beats:
      - say: Did latency rise after the deploy? The deploy log says fourteen oh two. The chart turns
          up around fourteen oh three. At fourteen twenty-two, someone on the bridge says, “That
          started before the rollback.” That timestamp tells us when they spoke. Keep the chart, the
          transcript and the recording under separate source IDs so we can check which event they
          meant.
        hold: 0.7
        visual_cues:
          - id: mm-case-contract-0
            phrase: At fourteen twenty-two, someone on the bridge says, “That started before the
              rollback.”
            targets:
              - mm-case-contract-construction
            color: yellow
            linger: 0.4
      - say: Create the case from immutable artifact references and an idempotency key. Tenant identity
          comes from authentication. Authorize each artifact, then return the case identity and a
          processing state for each modality. A later question returns grounded, partial, abstained
          or review, with source spans or regions and exact component versions.
        hold: 0.7
        visual_cues:
          - id: mm-case-contract-1
            phrase: Create the case from immutable artifact references and an idempotency key. Tenant identity
              comes from authentication. Authorize each artifact, then return the case identity and
              a processing state for each modality. A later question returns grounded, partial,
              abstained or review, with source spans or regions and exact component versions.
            targets:
              - mm-case-contract-construction
            color: cyan
            linger: 0.4
      - say: For an image with a transcript already available, suppose we want to serve twenty
          questions per second with p ninety-five under three seconds. Start the timer when we
          accept the question. Stop it after the evidence check. Count time in the queues too. Raw
          audio and long video can finish asynchronously. Size the worker pools from measured
          service times, batching and queue headroom.
        hold: 0.8
        visual_cues:
          - id: mm-case-contract-2
            phrase: Start the timer when we accept the question. Stop it after the evidence check
            targets:
              - mm-case-contract-construction
            color: yellow
            linger: 0.4
  - id: patches
    title: Pixels become a sequence of patch features
    visual: The original dashboard's trace region stays visible beneath a 16-by-16 patch grid. The chart
      key and axis information sit beside the crop. Increasing the resolution keeps the same curves
      and replaces the grid with 24-by-24 patches, showing how the visual-token count grows.
    beats:
      - say: A Vision Transformer first splits an image into square patches. With a 224-pixel image and a
          14-pixel patch size, there are 16 patches across and 16 down, for 256 visual tokens.
        hold: 0.55
        visual_cues:
          - id: patches-beat-1-focus-1
            phrase: for 256 visual tokens
            targets:
              - patches-celllabel
            color: cyan
            linger: 0.65
          - id: patches-beat-1-focus-2
            phrase: With a 224-pixel image and a 14-pixel patch size, there are 16 patches across and 16 down,
              for 256 visual tokens
            targets:
              - patches-celllabel
            color: yellow
            linger: 0.65
      - say: Each patch enters the vision encoder with positional information. The encoder can build context
          across the patch sequence, so a feature can represent local detail together with nearby
          and distant image content.
        hold: 0.6
        visual_cues:
          - id: patches-beat-2-focus-1
            phrase: so a feature can represent local detail together with nearby and distant image content
            targets:
              - patches-celllabel
            color: cyan
            linger: 0.65
          - id: patches-beat-2-focus-2
            phrase: Each patch enters the vision encoder with positional information
            targets:
              - patches-celllabel
            color: yellow
            linger: 0.65
      - say: Increase the image resolution while holding patch size fixed. The grid grows along both axes,
          creating more than twice as many visual tokens. The larger bank can preserve finer details
          while increasing the work in later layers.
        hold: 0.7
        visual_cues:
          - id: patches-beat-3-focus-1
            phrase: The grid grows along both axes, creating more than twice as many visual tokens
            targets:
              - patches-celllabel
            color: cyan
            linger: 0.65
          - id: patches-beat-3-focus-2
            phrase: Increase the image resolution while holding patch size fixed
            targets:
              - patches-celllabel
            color: yellow
            linger: 0.65
  - id: decoded-budget
    title: Count the decoded views rather than the upload bytes
    visual: Two files with different compressed sizes decode into identical view grids. Independent byte
      and decoded-pixel admission rulers precede a 14px patch grid, then 120 preserved frame IDs
      stack into 30720 cells.
    beats:
      - say: Compressed upload bytes govern transport, storage and decoder safety. Visual tokens follow
          decoded dimensions, resize, crop, frame and connector policies. Two differently compressed
          files can produce the same view grid. A small compressed input can also expand into a
          dangerous number of pixels, so enforce separate byte and decoded-resource limits.
        hold: 0.7
        visual_cues:
          - id: mm-decoded-budget-0
            phrase: Compressed upload bytes govern transport, storage and decoder safety. Visual tokens follow
              decoded dimensions, resize, crop, frame and connector policies. Two differently
              compressed files can produce the same view grid. A small compressed input can also
              expand into a dangerous number of pixels, so enforce separate byte and
              decoded-resource limits.
            targets:
              - mm-decoded-budget-construction
            color: yellow
            linger: 0.4
      - say: Our divisible square views use width divided by fourteen, squared. At three hundred thirty-six
          pixels that is twenty-four squared, or five hundred seventy-six patches. Some encoders
          also retain a classification token. A padded partial-edge route uses ceilings, while an
          unpadded convolution can discard the edge. Count the selected processor’s actual output.
        hold: 0.7
        visual_cues:
          - id: mm-decoded-budget-1
            phrase: Our divisible square views use width divided by fourteen, squared. At three hundred
              thirty-six pixels that is twenty-four squared, or five hundred seventy-six patches.
              Some encoders also retain a classification token. A padded partial-edge route uses
              ceilings, while an unpadded convolution can discard the edge. Count the selected
              processor’s actual output.
            targets:
              - mm-decoded-budget-construction
            color: cyan
            linger: 0.4
          - id: mm-patch-count
            phrase: twenty-four squared, or five hundred seventy-six patches.
            targets:
              - mm-decoded-budget-construction
            color: green
            linger: 0.4
      - say: "A minute at two frames per second admits one hundred twenty frames. At two hundred twenty-four
          pixels, each has two hundred fifty-six patches: thirty thousand seven hundred twenty in
          total. That is seven and a half four-thousand-ninety-six-token windows before text.
          Sampling fewer frames or using a trained temporal reducer changes both work and
          missed-event risk."
        hold: 0.8
        visual_cues:
          - id: mm-decoded-budget-2
            phrase: "A minute at two frames per second admits one hundred twenty frames. At two hundred
              twenty-four pixels, each has two hundred fifty-six patches: thirty thousand seven
              hundred twenty in total. That is seven and a half four-thousand-ninety-six-token
              windows before text. Sampling fewer frames or using a trained temporal reducer changes
              both work and missed-event risk."
            targets:
              - mm-decoded-budget-construction
            color: yellow
            linger: 0.4
          - id: mm-video-count
            phrase: thirty thousand seven hundred twenty in total.
            targets:
              - mm-decoded-budget-construction
            color: green
            linger: 0.4
  - id: encoder-directions
    title: Choose the feature and output interfaces independently
    visual: Image patches, a speech spectrogram and audio-text retrieval vectors occupy separate scaled
      lanes. Only the transcript lane becomes ordinary text tokens. Published dated model
      disclosures attach specific frozen/trainable bridges and output decoder branches.
    beats:
      - say: What does the question ask you to find? For a chart, start by testing image features from CLIP
          or SigLIP on the labels you need. For spoken words, Whisper uses log-Mel spectrograms to
          recognize speech. For a sound such as an alarm, CLAP can rank recordings by how well they
          match a text description. Test it on alarms from your own domain.
        hold: 0.7
        visual_cues:
          - id: mm-encoder-directions-0
            phrase: What does the question ask you to find? For a chart, start by testing image features from
              CLIP or SigLIP on the labels you need. For spoken words, Whisper uses log-Mel spectrograms
              to recognize speech. For a sound such as an alarm, CLAP can rank recordings by how well
              they match a text description. Test it on alarms from your own domain.
            targets:
              - mm-encoder-directions-construction
            color: yellow
            linger: 0.4
      - say: Published architecture names do not specify a freeze schedule. BLIP-two trains a query bridge
          with frozen image and language backbones during its reported pretraining. PaLI includes
          frozen-vision pretraining followed by vision tuning. Gemini’s twenty twenty-three
          disclosure describes multimodal pretraining. Meta’s April twenty twenty-five Llama-four
          disclosure combines early fusion and sparse experts with a MetaCLIP-based encoder
          alignment stage.
        hold: 0.7
        visual_cues:
          - id: mm-encoder-directions-1
            phrase: Published architecture names do not specify a freeze schedule. BLIP-two trains a query
              bridge with frozen image and language backbones during its reported pretraining. PaLI
              includes frozen-vision pretraining followed by vision tuning. Gemini’s twenty
              twenty-three disclosure describes multimodal pretraining. Meta’s April twenty
              twenty-five Llama-four disclosure combines early fusion and sparse experts with a
              MetaCLIP-based encoder alignment stage.
            targets:
              - mm-encoder-directions-construction
            color: cyan
            linger: 0.4
      - say: In May twenty twenty-four, OpenAI described GPT-four-o as one network trained across text,
          vision and audio. Follow the arrows on the right. Our copilot reads a screenshot or recording
          and returns cited text. To generate an image or speech, a model also needs a trained output
          decoder for that format. Evaluate each output your product offers.
        hold: 0.8
        visual_cues:
          - id: mm-encoder-directions-2
            phrase: In May twenty twenty-four, OpenAI described GPT-four-o as one network trained across text,
              vision and audio. Follow the arrows on the right. Our copilot reads a screenshot or
              recording and returns cited text. To generate an image or speech, a model also needs a
              trained output decoder for that format. Evaluate each output your product offers.
            targets:
              - mm-encoder-directions-construction
            color: yellow
            linger: 0.4
  - id: connector
    title: What reaches the language model?
    visual: A per-feature map transforms a three-coordinate row into two coordinates. Separate query banks
      read the same 576 inputs. A hypothetical 32-state readback recovers two chart readings and loses the
      series name. A verified original legend crop supplies the name.
    beats:
      - say: The encoder has a row for each of our five hundred seventy-six patches. Follow one row through this
          little projection. One plus three gives four in the first column. Two minus three gives minus one
          in the second. Each row changes width from three to two. All five hundred seventy-six positions
          still reach the decoder.
        hold: 0.65
        visual_cues:
          - id: connector-project-width
            phrase: One plus three gives four in the first column. Two minus three gives minus one in the second
            targets:
              - connector-feature-bank
              - connector-width-projection
            color: cyan
            linger: 0.22
            caption_boundary: true
          - id: connector-preserve-positions
            phrase: All five hundred seventy-six positions still reach the decoder
            targets:
              - connector-preserved-positions
            color: green
            linger: 0.22
            caption_boundary: true
      - say: What if the decoder has room for just thirty-two positions per view? Give the bridge thirty-two
          learned queries. Each reads across the feature bank and returns one mixture. Here you can follow
          one query mixing three sample values. BLIP-two uses this kind of query bridge, called a Q-Former.
        hold: 0.7
        caption_starts:
          - Give the bridge thirty-two learned queries
        visual_cues:
          - id: connector-read-queries
            phrase: Each reads across the feature bank and returns one mixture
            targets:
              - connector-feature-bank
              - connector-query-slots
              - connector-feature-reader
              - connector-output-states
            color: cyan
            linger: 0.22
            caption_boundary: true
      - say: Flamingo uses a Perceiver Resampler. In this configuration, sixty-four latent slots read the same
          five hundred seventy-six features and produce sixty-four states. The number of slots bounds the
          downstream bank. The encoder still processes every admitted patch.
        hold: 0.7
        visual_cues:
          - id: connector-configured-resampler
            phrase: sixty-four latent slots read the same five hundred seventy-six features and produce sixty-four
              states
            targets:
              - connector-feature-bank
              - connector-query-slots
              - connector-output-states
            color: cyan
            linger: 0.22
            caption_boundary: true
      - say: Go back to the thirty-two-state route. Suppose its reader recovers a green trace, five point two at
          three and nine at six. It can't read the series name. What can you report from this view?
        hold: 2.4
        visual_cues:
          - id: connector-probe-trace
            phrase: a green trace, five point two at three and nine at six
            targets:
              - connector-trace-readback
            color: green
            linger: 0.22
            caption_boundary: true
          - id: connector-probe-key
            phrase: It can't read the series name
            targets:
              - connector-key-readback
            color: yellow
            linger: 0.22
            caption_boundary: true
      - say: The green trace rose. Read the legend crop from the original and check the green swatch. It
          says checkout. Test whether the reader can recover that name before adopting a smaller prefix
          or a smaller visual memory. The encoder still has to process every input patch.
        hold: 0.8
        caption_starts:
          - It says checkout
        visual_cues:
          - id: connector-check-source
            phrase: Read the legend crop from the original and check the green swatch
            targets:
              - connector-key-readback
            color: green
            linger: 0.22
            caption_boundary: true
          - id: connector-name
            phrase: It says checkout
            targets: [connector-key-readback]
            color: green
            linger: 0.22
  - id: multi-block-interface
    title: Keep encoder depth separate from decoder insertion depth
    visual: Three encoder block taps retain their distinct feature IDs in a collected bank that feeds
      both key and value aligners. The resulting K/V rail fans into selected last decoder blocks
      with trainable per-block weights. A separate schematic two-block choice omits the L4 insertion
      and shortens the required backward path; earlier frozen blocks still execute forward.
    beats:
      - say: An input projector is one possible insertion point. The twenty twenty-five Modality
          Plug-and-Play paper instead taps several intermediate vision blocks, maps features to keys
          and values, and inserts them into selected last language-model blocks. Choosing which
          visual levels to read and where language blocks receive them are independent decisions.
        hold: 0.7
        visual_cues:
          - id: mm-multi-block-interface-0
            phrase: An input projector is one possible insertion point. The twenty twenty-five Modality
              Plug-and-Play paper instead taps several intermediate vision blocks, maps features to
              keys and values, and inserts them into selected last language-model blocks. Choosing
              which visual levels to read and where language blocks receive them are independent
              decisions.
            targets:
              - mm-multi-block-interface-construction
            color: yellow
            linger: 0.4
      - say: Its per-block trainable weights control inserted modality keys and values inside the shared
          attention module. Moving the insertion closer to the output shortens the
          activation-gradient path during runtime adaptation. Freezing downstream weights alone does
          not remove the activation gradients that an earlier trainable connector needs. Fewer
          connected blocks also give the language model fewer opportunities to combine evidence.
        hold: 0.7
        visual_cues:
          - id: mm-multi-block-interface-1
            phrase: Its per-block trainable weights control inserted modality keys and values inside the shared
              attention module. Moving the insertion closer to the output shortens the
              activation-gradient path during runtime adaptation. Freezing downstream weights alone
              does not remove the activation gradients that an earlier trainable connector needs.
              Fewer connected blocks also give the language model fewer opportunities to combine
              evidence.
            targets:
              - mm-multi-block-interface-construction
            color: cyan
            linger: 0.4
      - say: The paper reports runtime-training experiments with relatively small OPT and BLOOMZ backbones
          and mobile-system tasks. Its training savings do not establish a production inference
          speedup for our copilot. We will separately compare its shared-softmax zero limit with
          Flamingo’s zero visual-residual gate. The two operations have different denominators.
        hold: 0.8
        visual_cues:
          - id: mm-multi-block-interface-2
            phrase: The paper reports runtime-training experiments with relatively small OPT and BLOOMZ
              backbones and mobile-system tasks. Its training savings do not establish a production
              inference speedup for our copilot. We will separately compare its shared-softmax zero
              limit with Flamingo’s zero visual-residual gate. The two operations have different
              denominators.
            targets:
              - mm-multi-block-interface-construction
            color: yellow
            linger: 0.4
  - id: routes
    title: Choose where image and text meet
    visual: "The same image and question flow through three architectures: pooled late fusion compares
      scores, early fusion joins one token sequence, and cross-attention reads a separate visual
      bank."
    beats:
      - say: Late fusion encodes image and text mostly independently, then compares pooled vectors. It works
          well for ranking similar dashboards. The compact score path does not expose patch details
          to a language decoder.
        hold: 0.6
        visual_cues:
          - id: routes-read-0
            phrase: Late fusion encodes image and text mostly independently, then compares pooled vectors
            targets:
              - routes-mechanism-0
            color: blue
            linger: 0.65
      - say: Early fusion projects visual tokens and places them in the language-model prefix.
          Self-attention can then combine image and text states throughout the decoder. The tradeoff
          is a longer shared sequence and its associated cache.
        hold: 0.65
        visual_cues:
          - id: routes-read-1
            phrase: Early fusion projects visual tokens and places them in the language-model prefix
            targets:
              - routes-mechanism-1
            color: green
            linger: 0.65
      - say: Cross-attention keeps a visual memory beside the text stream. Selected decoder layers form
          queries from text and read visual keys and values. It preserves a distinct image bank
          while adding computation at those fusion layers.
        hold: 0.7
        visual_cues:
          - id: routes-read-2
            phrase: Cross-attention keeps a visual memory beside the text stream
            targets:
              - routes-mechanism-2
            color: yellow
            linger: 0.65
