          - id: sg-reservation-five
            phrase: totaling five gibibytes of destination capacity
            targets:
              - reservation-policy-mechanism
            color: cyan
            linger: 0.55
      - say: The documented early policy reserves destination KV before prefill finishes. The prefill-complete
          alternative waits for the final prefill result, then reserves and starts the transfer handshake. It
          can leave more destination space available early, while retaining source KV longer and removing
          chunked-prefill/transfer overlap. The initial guide limits this mode to Mooncake, a Python bootstrap
          registry and specified attention and pipeline sizes of one.
        hold: 0.65
