scenes:
  - id: intro
    title: Which ticket can SGLang explain?
    visual: A bug label lands on the login ticket. Its explanation prompt stays empty until the program copies
      the label into it. The dark-mode ticket waits for its own label.
    beats:
      - say: The login ticket just got the label bug. The dark-mode ticket is still waiting for a label. Which
          explanation can start?
        hold: 2.6
        visual_cues:
          - id: ticket-bug
            phrase: The login ticket just got the label bug
            targets:
              - ticket-return
            color: cyan
            linger: 0.32
            caption_boundary: true
          - id: ticket-dark
            phrase: The dark-mode ticket is still waiting for a label
            targets:
              - ticket-r42
            color: cyan
            linger: 0.32
            caption_boundary: true
          - id: ticket-ask
            phrase: Which explanation can start
            targets:
              - ticket-pending
              - ticket-return
            color: yellow
            linger: 0.32
            caption_boundary: true
      - say: The login ticket’s explanation can start. Copy bug into that ticket’s prompt. Now submit its
          explanation. The dark-mode prompt stays empty until its own label arrives.
        hold: 0.8
        visual_cues:
          - id: ticket-bind
            phrase: Copy bug into that ticket’s prompt
            targets:
              - ticket-slot-r43
            color: cyan
            linger: 0.32
            caption_boundary: true
          - id: ticket-submit
            phrase: Now submit its explanation
            targets:
              - ticket-slot-r43
            color: green
            linger: 0.32
            caption_boundary: true
          - id: ticket-wait
            phrase: until its own label arrives
            targets:
              - ticket-pending
            color: yellow
            linger: 0.32
            caption_boundary: true
      - say: SGLang’s Python program keeps each answer under a name. When the next prompt has the values it
          needs, the program sends it to the serving runtime. An HTTP client can also call that runtime
          directly. Let’s open the dark-mode ticket’s prompt.
        hold: 0.6
        visual_cues:
          - id: intro-return
            phrase: open the dark-mode ticket’s prompt
            targets:
              - ticket-r42
            color: cyan
            linger: 0.32
            caption_boundary: true
  - id: frontend-program
    title: What goes into R42’s prompt?
    visual: The pending ticket fills its named label slot with feature. The same value moves into the assembled
      assistant text before the interpreter submits the bounded explanation.
    beats:
      - say: Here’s the prompt for the dark-mode ticket, R forty-two. The system instruction comes first, then the
          user’s words, then the assistant’s label field. The program calls select with three choices. It can
          return bug, feature, or question. It keeps the result under the name label. Reading that name while
          the call is unfinished makes the program wait.
        hold: 0.6
        visual_cues:
          - id: program-roles
            phrase: the user’s words, then the assistant’s label field
            targets:
              - program-prompt
            color: cyan
            linger: 0.32
            caption_boundary: true
          - id: program-choices
            phrase: The program calls select with three choices
            targets:
              - program-choice
            color: cyan
            linger: 0.32
            caption_boundary: true
      - say: The selection comes back as feature. Put that value after Label in the assistant’s text. Now the
          interpreter can submit the explanation. It can generate up to sixty-four tokens and stops at a
          newline if it reaches one first. If the label is missing or a role starts in the wrong place,
          inspect the assembled prompt before tracing the GPU call.
        hold: 0.8
        visual_cues:
          - id: program-feature
            phrase: The selection comes back as feature
            targets:
              - program-choice
            color: cyan
            linger: 0.32
            caption_boundary: true
          - id: program-append
            phrase: Put that value after Label in the assistant’s text
            targets:
              - program-prompt
            color: cyan
            linger: 0.32
            caption_boundary: true
          - id: program-submit
            phrase: Now the interpreter can submit the explanation
            targets:
              - program-explanation
            color: green
            linger: 0.32
            caption_boundary: true
  - id: program-branches
    title: Copy a shared prefix while preserving branch outputs
    visual: Fork one retained prompt into two named candidates, then join their results. Compare one completed
      program with its multiple model calls.
    beats:
      - say: Fork creates independent prompt-state branches from a common prefix; join brings their results back to
          the program. The shared instructions can reuse model context, while each branch still owns its
          generated values and stopping state. Independent branches may run together. A branch that needs a
          previous answer must wait for it. Flattening both into one unresolved prompt changes that execution
          problem.
        hold: 0.65
        visual_cues:
          - id: sg-program-branches-beat-0
            phrase: Fork creates independent prompt-state branches from a common prefix; join brings their results back to
              the program
            targets:
              - program-branches-mechanism
            color: cyan
            linger: 0.55
          - id: sg-fork
            phrase: Fork creates independent prompt-state branches
            targets:
              - program-branches-mechanism
            color: cyan
            linger: 0.55
          - id: sg-join
            phrase: join brings their results back to the program
            targets:
              - program-branches-mechanism
            color: cyan
            linger: 0.55
      - say: A plain HTTP request and an offline Engine call can enter the runtime without this frontend. The
          same tokens sent to the same warm worker can get the same prefix hit through HTTP. The original
          paper counts completed programs per second. A program that makes three model calls still counts
          once. The paper measures the latency of a single program separately.
        hold: 0.65
        visual_cues:
          - id: sg-program-branches-beat-1
            phrase: A plain HTTP request and an offline Engine call can enter the runtime without this frontend
            targets:
              - program-branches-mechanism
            color: yellow
            linger: 0.55
  - id: runtime-owners
    title: Assign each handoff its actual state owner
    visual: Carry the same request record through input preparation, scheduler, runner, grammar and detokenizer;
      return generated IDs separately from output text.
    beats:
      - say: Inside the runtime, entrypoints parse the request. The tokenizer manager prepares model inputs and tracks
          request and output state. In the usual multiprocess path, a separate detokenizer manager turns
          generated IDs into text. The scheduler owns runnable work and cache locations; the model runner
          builds the forward batch, selects a supported attention path and executes the loaded model.
        hold: 0.65
        visual_cues:
          - id: sg-runtime-owners-beat-0
            phrase: Inside the runtime, entrypoints parse the request
            targets:
              - runtime-owners-mechanism
            color: cyan
            linger: 0.55
          - id: sg-runtime-scheduler
            phrase: The scheduler owns runnable work and cache locations
            targets:
              - runtime-owners-mechanism
            color: cyan
            linger: 0.55
      - say: Grammar and sampling constrain or select the next token before output state advances. Process boundaries
          vary with server mode and parallelism, so trace these responsibilities rather than memorizing one
          process diagram. Preserve the same request identity across queues, model execution and delivery. A
          valid generated ID and a delivered text chunk are different events.
        hold: 0.65
        visual_cues:
          - id: sg-runtime-owners-beat-1
            phrase: Grammar and sampling constrain or select the next token before output state advances
            targets:
              - runtime-owners-mechanism
            color: yellow
            linger: 0.55
          - id: sg-runtime-output
            phrase: A valid generated ID and a delivered text chunk are different events
            targets:
              - runtime-owners-mechanism
            color: yellow
            linger: 0.55
  - id: token-clocks
    title: How long does the reader wait?
    visual: Use supplied request arrival 0, first output 240 and later outputs 280/350 milliseconds. Split
      waiting, forward and delivery inside the same TTFT.
    beats:
      - say: Start the clock when the request arrives. Its first output reaches the client at two hundred
          forty milliseconds. That whole wait is time to first token. The next two arrivals are at two hundred
          eighty and three hundred fifty. Measure from one arrival to the next. The gaps are forty and seventy
          milliseconds. Those are the inter-token latencies the reader experiences.
        hold: 0.65
        visual_cues:
          - id: sg-token-clocks-beat-0
            phrase: Start the clock when the request arrives
            targets:
              - token-clocks-mechanism
            color: cyan
            linger: 0.55
          - id: sg-clock-first
            phrase: Its first output reaches the client at two hundred forty milliseconds
            targets:
              - token-clocks-mechanism
            color: cyan
            linger: 0.55
          - id: sg-clock-gaps
            phrase: The gaps are forty and seventy milliseconds
            targets:
              - token-clocks-mechanism
            color: cyan
            linger: 0.55
      - say: Where did the first two hundred forty milliseconds go? Trace tokenization, queue wait, prefix
          lookup, the first forward pass, sampling and delivery. If the GPU was idle, check when the request
          entered its first batch. For a gap between later tokens, follow that step through scheduling,
          collectives, grammar or draft work, and transport.
        hold: 0.65
        visual_cues:
          - id: sg-token-clocks-beat-1
            phrase: Where did the first two hundred forty milliseconds go
            targets:
              - token-clocks-mechanism
            color: yellow
            linger: 0.55
  - id: mixed-budget
    title: Spend one scheduler budget on decode and unmatched prompt work
    visual: Keep R0/R1, four reused positions and nine unmatched prompt tokens. Spend one decode plus five prefill
      at step 0, then one plus four and two decodes.
    beats:
      - say: This step has room for six fresh input positions. R zero needs one for decode. R one has four
          cached prompt positions and nine still to process. After reserving one for decode, five of R one’s
          prompt positions fit. The shared four already have their keys and values.
        hold: 0.65
        visual_cues:
          - id: sg-mixed-budget-beat-0
            phrase: This step has room for six fresh input positions
            targets:
              - mixed-budget-mechanism
            color: cyan
            linger: 0.55
          - id: sg-budget-five
            phrase: five of R one’s prompt positions fit
            targets:
              - mixed-budget-mechanism
            color: cyan
            linger: 0.55
      - say: The first step spends one plus five and leaves four prompt positions. The second spends one plus four and
          finishes that prompt. Its final prefill can already select R one’s first output token. A later
          decode consumes that selected output as an input and creates its own KV. A selected output and a
          processed input position must stay distinct in the request history.
        hold: 0.65
        visual_cues:
          - id: sg-mixed-budget-beat-1
            phrase: The first step spends one plus five and leaves four prompt positions
            targets:
              - mixed-budget-mechanism
            color: yellow
            linger: 0.55
          - id: sg-budget-second
            phrase: The second spends one plus four and finishes that prompt
            targets:
              - mixed-budget-mechanism
            color: yellow
            linger: 0.55
          - id: sg-budget-selected
            phrase: Its final prefill can already select R one’s first output token
            targets:
              - mixed-budget-mechanism
            color: yellow
            linger: 0.55
          - id: sg-budget-next
            phrase: A later decode consumes that selected output as an input and creates its own KV
            targets:
              - mixed-budget-mechanism
            color: yellow
            linger: 0.55
      - say: Subtract the scheduled decode positions first. Use the remaining budget for as much of the
          unmatched prompt as will fit. Each prompt position pays for one input to the model. A larger chunk
          can get a new request to its first token sooner. A smaller chunk can give existing readers a shorter
          wait for their next token.
        hold: 0.65
        visual_cues:
          - id: sg-mixed-budget-beat-2
            phrase: Subtract the scheduled decode positions first
            targets:
              - mixed-budget-mechanism
            color: cyan
            linger: 0.55
  - id: page-admission
    title: Check capacity and page alignment beyond the arithmetic budget
    visual: Overlay the simplified 6-token accounting with separate page, KV and future-output reservation gates.
      Keep current-prompt and future-output counts distinct.
    beats:
      - say: In the pinned revision, mixed chunking starts disabled. When enabled, PrefillAdder reserves the
          decode positions in its input budget and, if present, its chunk budget. That leaves five places for
          our prompt. Now check where their keys and values will go.
        hold: 0.65
        visual_cues:
          - id: sg-page-admission-beat-0
            phrase: In the pinned revision, mixed chunking starts disabled
            targets:
              - page-admission-mechanism
            color: cyan
            linger: 0.55
      - say: One free page holds four positions. The fifth prompt position needs a second page, so this chunk
          waits. In an idle queue, check the batch and allocator trace for free KV, page alignment, the
          running-request limit and reservations for future output.
        hold: 0.65
        visual_cues:
          - id: sg-page-admission-beat-1
            phrase: One free page holds four positions
            targets:
              - page-admission-mechanism
            color: yellow
            linger: 0.55
          - id: sg-budget-memory
            phrase: The fifth prompt position needs a second page
            targets:
              - page-admission-mechanism
            color: yellow
            linger: 0.55
  - id: radix
    title: A compressed tree shares exact leading token paths
    visual: Executable radix insertion splits a cached sentence at its four-word common prefix. A different
      sentence matches one leading word, and a different cache namespace matches none.
    beats:
      - say: >
          Begin with the cached sentence, Birds sing near the lake at dawn. For this drawing, each word is one
          constructed token. A new sentence begins, Birds sing near the old oak tree. Compare from the start.
          Four tokens agree, so their existing key-value states can be reused under the same compatible cache
          namespace.
        hold: 0.6
        visual_cues:
          - id: radix-beat-1-focus-1
            phrase: A new sentence begins, Birds sing near the old oak tree
            targets:
              - radix-query
              - radix-common-edge
              - radix-match-count
            color: cyan
            linger: 0.65
          - id: sg-radix-match-four
            phrase: Four tokens agree, so their existing key-value states can be reused under the same compatible cache namespace
            targets:
              - radix-match-count
            color: cyan
            linger: 0.45
      - say: >
          Insert the new sentence. A compressed edge splits after the common prefix, leaving two different
          suffix branches. The tree stores paths and their associated cache locations. An attention kernel
          later consumes those locations. The scheduler and tree decide which locations belong to this
          request.
        hold: 0.6
        visual_cues:
          - id: radix-beat-2-focus-1
            phrase: The tree stores paths and their associated cache locations
            targets:
              - radix-common-edge
              - radix-existing-suffix
              - radix-new-suffix
              - radix-match-count
            color: cyan
            linger: 0.65
          - id: radix-beat-2-focus-2
            phrase: A compressed edge splits after the common prefix, leaving two different suffix branches
            targets:
              - radix-common-edge
              - radix-existing-suffix
              - radix-new-suffix
            color: yellow
            linger: 0.65
          - id: radix-insert-path
            phrase: Insert the new sentence
            targets:
              - radix-query
            color: pink
            linger: 0.65
      - say: >
          Now ask about Birds fly over the lake. Only its first word follows the cached leading path. A
          matching word later in the sentence cannot extend that prefix. Change the adapter or another
          cache-key namespace, and this example reuses zero tokens. Real reuse also follows the selected
          backend's page and alignment rules.
        hold: 0.6
        visual_cues:
          - id: radix-beat-3-focus-1
            phrase: Now ask about Birds fly over the lake
            targets:
              - radix-query
              - radix-common-edge
              - radix-match-count
            color: cyan
            linger: 0.65
          - id: radix-beat-3-focus-2
            phrase: Change the adapter or another cache-key namespace, and this example reuses zero tokens
            targets:
              - radix-cache-namespace
              - radix-match-count
            color: yellow
            linger: 0.65
          - id: sg-radix-match-one
            phrase: Only its first word follows the cached leading path
            targets:
              - radix-match-count
            color: cyan
            linger: 0.45
  - id: cache-namespaces
    title: Which cache locations can this request use?
    visual: Five aligned token-ID pairs share one full four-token page. Four KV addresses appear, then disappear
      when only the requested adapter namespace changes.
    beats:
      - say: Read these two rows from the left. Each letter stands for one token ID. Compare A, B, C, D, and E. All
          five match, and both rows belong to namespace A. In this example, the cache reuses whole pages of
          four. The lookup returns locations twelve through fifteen. E starts the next page. The radix tree
          supplies those addresses so the attention kernel can read the stored keys and values.
        hold: 0.75
        visual_cues:
          - id: key-compare
            phrase: Compare A, B, C, D, and E
            targets:
              - key-request
              - key-stored
            color: cyan
            linger: 0.32
            caption_boundary: true
          - id: key-page
            phrase: The lookup returns locations twelve through fifteen
            targets:
              - key-addresses
            color: green
            linger: 0.32
            caption_boundary: true
      - say: Keep every token and its position. Change just the request’s adapter from A to B. The stored page still
          belongs to A. How many of those four locations can B use?
        hold: 2.6
        visual_cues:
          - id: key-switch
            phrase: Change just the request’s adapter from A to B
            targets:
              - key-request
            color: yellow
            linger: 0.32
            caption_boundary: true
          - id: key-question
            phrase: How many of those four locations can B use
            targets:
              - key-addresses
            color: yellow
            linger: 0.32
            caption_boundary: true
      - say: B gets zero. Those keys and values came from a different adapter. In the pinned implementation the
          request’s extra cache key can include its LoRA adapter identity. The article’s lookup helper returns
          zero for different keys. Calling the pinned RadixKey match method on those different keys raises a
          ValueError. Both rule out using A’s page. A cache salt can also separate namespaces. The service
          must still authenticate the caller.
        hold: 0.8
        visual_cues:
          - id: key-zero
            phrase: B gets zero
            targets:
              - key-addresses
            color: pink
            linger: 0.32
            caption_boundary: true
          - id: key-class
            phrase: Calling the pinned RadixKey match method on those different keys raises a ValueError
            targets:
              - key-request
            color: cyan
            linger: 0.32
            caption_boundary: true
  - id: context-position
    title: A repeated suffix does not erase its earlier context
    visual: Place two ticket token paths below a shared system/role prefix. Keep later Label/Explanation suffixes
      separate. Compare output-only grammar with schema text in the input.
    beats:
      - say: "The two ticket requests share system instructions and the user-role opening, then their ticket tokens
          diverge. Repeated Label and Explanation strings later in those prompts are not shared leading
          context: their hidden states depend on the different earlier tickets. Inside one request, the
          explanation can reuse its own already processed label context."
        hold: 0.65
        visual_cues:
          - id: sg-context-position-beat-0
            phrase: The two ticket requests share system instructions and the user-role opening, then their ticket tokens
              diverge
            targets:
              - context-position-mechanism
            color: cyan
            linger: 0.55
          - id: sg-context-diverge
            phrase: then their ticket tokens diverge
            targets:
              - context-position-mechanism
            color: cyan
            linger: 0.55
      - say: An early template token, timestamp or random ID can shorten the longest hit. A model or adapter update
          can invalidate stale KV even when visible text stays identical. An output-only grammar mask need not
          change compatible prompt KV, but each request still needs its own grammar and sampling state. If the
          schema is rendered into the prompt, it changes the token context instead.
        hold: 0.65
        visual_cues:
          - id: sg-context-position-beat-1
            phrase: An early template token, timestamp or random ID can shorten the longest hit
            targets:
              - context-position-mechanism
            color: yellow
            linger: 0.55
          - id: sg-context-early
            phrase: An early template token, timestamp or random ID can shorten the longest hit
            targets:
              - context-position-mechanism
            color: yellow
            linger: 0.55
          - id: sg-context-schema
            phrase: If the schema is rendered into the prompt
            targets:
              - context-position-mechanism
            color: yellow
            linger: 0.55
  - id: locks
    title: Shared paths remain protected until their last live user leaves
    visual: Two live request identities hold the same four cache locations. Removing one identity preserves
      protection; removing the last makes those locations eligible for eviction.
    beats:
      - say: >
          Reuse creates a lifetime problem. Two requests can depend on the same cached prefix while generating
          different suffixes. Our live owner set contains both request identities. Their shared path must stay
          available until the model work that references it has finished.
        hold: 0.6
        visual_cues:
          - id: locks-beat-1-focus-1
            phrase: Two requests can depend on the same cached prefix while generating different suffixes
            targets:
              - locks-r0
              - locks-r1
              - locks-owner-set
              - locks-s-locations-map-v-kv-v
            color: cyan
            linger: 0.65
      - say: >
          Request zero completes and releases its reference. One owner remains, so the shared locations stay
          protected. Counting only the completed request would free data that request one still needs. The
          lifetime belongs to all live users of the path.
        hold: 0.6
        visual_cues:
          - id: locks-beat-2-focus-1
            phrase: One owner remains, so the shared locations stay protected
            targets:
              - locks-r1
              - locks-owner-set
              - locks-s-locations-map-v-kv-v
            color: cyan
            linger: 0.65
          - id: locks-release-r0
            phrase: Request zero completes and releases its reference
            targets:
              - locks-r0
              - locks-owner-set
              - locks-s-locations-map-v-kv-v
            color: blue
            linger: 0.65
          - id: locks-beat-2-focus-2
            phrase: Counting only the completed request would free data that request one still needs
            targets:
              - locks-r1
              - locks-eviction-state
            color: yellow
            linger: 0.65
      - say: >
          Release the second owner and the path becomes eligible for eviction. The cache manager can keep it
          for the next request or reclaim its space. Route that next request to a different replica and it
          will consult that replica’s own cache.
        hold: 0.6
        visual_cues:
          - id: locks-beat-3-focus-1
            phrase: The cache manager can keep it for the next request or reclaim its space
            targets:
              - locks-owner-set
              - locks-eviction-state
              - locks-s-locations-map-v-kv-v
            color: cyan
            linger: 0.65
          - id: locks-release-r1
            phrase: Release the second owner and the path becomes eligible for eviction
            targets:
              - locks-r1
              - locks-owner-set
              - locks-eviction-state
            color: green
            linger: 0.65
  - id: cache-reclamation
    title: Release a live KV owner after its last reader
    visual: Retain the same physical locations and two owners. Add a pending GPU-reader event after application
      cancellation; reclaim only after that event and the last release.
    beats:
      - say: Insert a newly computed suffix after the forward pass creates its KV. While a request uses a
          match, the tree protects its path through the ancestors. If a client cancels during a forward pass,
          the GPU can still be reading those locations. Keep the reference until that read finishes.
        hold: 0.65
        visual_cues:
          - id: sg-cache-reclamation-beat-0
            phrase: Insert a newly computed suffix
            targets:
              - cache-reclamation-mechanism
            color: cyan
            linger: 0.55
      - say: R zero has finished. R one’s final reader is pending, so eviction stays blocked. After that
          reader completes, R one releases its reference. The policy may then reclaim it. Release early and
          another request could overwrite live data. Forget to release and the next request could wait for
          space while the GPU sits idle.
        hold: 0.65
        visual_cues:
          - id: sg-cache-reclamation-beat-1
            phrase: R zero has finished
            targets:
              - cache-reclamation-mechanism
            color: yellow
            linger: 0.55
          - id: sg-reader-pending
            phrase: R one’s final reader is pending
            targets:
              - cache-reclamation-mechanism
            color: yellow
            linger: 0.55
          - id: sg-reader-complete
            phrase: After that reader completes
            targets:
              - cache-reclamation-mechanism
            color: yellow
            linger: 0.55
          - id: sg-owner-release
            phrase: R one releases its reference
            targets:
              - cache-reclamation-mechanism
            color: yellow
            linger: 0.55
          - id: sg-reclaim
            phrase: The policy may then reclaim it
            targets:
              - cache-reclamation-mechanism
            color: yellow
            linger: 0.55
  - id: replica-locality
    title: A healthy local cache can still miss after routing
    visual: Use two replicas with distinct residency maps and an identical request. Move only its route; then show
      longer-prefix-first work delaying an unrelated request.
    beats:
      - say: A radix cache is local to an engine or replica unless a higher-level layer coordinates placement and
          state. Route the same compatible prompt to a different cold replica and its local lookup can miss.
          Extra replicas can raise independent request capacity while changing warm-up and reuse. Cache-aware
