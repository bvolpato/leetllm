  - title: SGLang structured output guide
    url: https://docs.sglang.io/docs/advanced_features/structured_outputs
  - title: SGLang speculative decoding guide, checked 2026-11-06
    url: https://docs.sglang.io/docs/advanced_features/speculative_decoding
  - title: SGLang P/D guide, checked 2026-11-06
    url: https://docs.sglang.io/docs/advanced_features/pd_disaggregation
  - title: SGLang source license
