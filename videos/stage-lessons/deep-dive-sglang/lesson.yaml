    title: Keep reserved, received and active decode bytes separate
    visual: Reserve 10×512 MiB destination space before its bytes arrive. Compare early and prefill-complete
      policies while retaining source KV longer and showing the lost transfer overlap.
    beats:
      - say: A decode pool can be capacity-constrained while waiting for data. Ten pending prefills each
          reserve five hundred twelve mebibytes here, totaling five gibibytes of destination capacity. Those
          slots can all be reserved while zero bytes have arrived. Track the space set aside, the bytes
          received and the requests actively decoding.
        hold: 0.65
