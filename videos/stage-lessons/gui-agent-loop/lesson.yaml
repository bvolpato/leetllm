version: 1
id: gui-agent-loop
title: How an Agent Acts Through a Screen
source: agents/computer-use-gui-browser-agents/content.md
sources:
  - title: Anthropic computer use tool documentation
    url: https://docs.anthropic.com/en/docs/agents-and-tools/tool-use/computer-use-tool
  - title: Playwright actionability
    url: https://playwright.dev/docs/actionability
  - title: WebArena benchmark
    url: https://arxiv.org/abs/2307.13854
  - title: AgentDojo benchmark
    url: https://arxiv.org/abs/2406.13352
  - title: Set-of-Mark prompting for visual grounding
    url: https://arxiv.org/abs/2310.11441
scenes:
  - id: subject-intro
    title: "Copy the parser error to a local draft"
    visual: "A failure mark identifies the parser test. The cursor points at Deploy above the empty traceback field in the local draft. The host withholds the click and highlights Open run."
    beats:
      - say: "The agent wants to click Deploy. You asked it to copy the parser error into a local draft."
        hold: 0.65
        visual_cues:
          - id: point
            phrase: "click Deploy"
            targets: [proposed-point]
          - id: task
            phrase: "a local draft"
            targets: [local-draft]
      - say: "Should the host send this click?"
        hold: 2.4
        visual_cues:
          - id: question
            phrase: "should the host send this click"
            targets: [dispatch-question]
      - say: "Hold the click. Deploy starts a production job. Open run shows the test results. The model picks a point on the screen. The host checks what that button does before sending any input."
        hold: 0.85
        visual_cues:
          - id: withhold
            phrase: "Hold the click"
            targets: [dispatch-count]
          - id: open-run
            phrase: "Open run shows the test results"
            targets: [open-run]
      - say: "For run status, use a supported API. To download a known file, use a stable selector. Here the portal draws the traceback inside an interactive panel. That panel is what the agent needs to open and read."
        hold: 0.8
        visual_cues:
          - id: api
            phrase: "a supported API"
            targets: [status-route]
          - id: selector
            phrase: "a stable selector"
            targets: [artifact-route]
          - id: canvas
            phrase: "inside an interactive panel"
            targets: [visual-route]
  - id: session-admission
    title: "What can this worker reach?"
    visual: "An overbroad manifest is refused. Its profile, domain and account change independently before a restricted worker receives the page."
    beats:
      - say: "Here is the session the agent asked for. A reused profile can carry somebody's cookies. Mail is unrelated to the run. A deploy permission would let this account change production. Any one of those is enough to refuse the launch."
        hold: 0.7
        visual_cues:
          - id: refuse
            phrase: "refuse the launch"
            targets: [session-manifest]
      - say: "Give it a fresh profile so it starts with an empty cookie jar. Allow just the CI domain. Choose a read-only account. Cap its time, steps and storage. Now the host can open the session."
        hold: 0.7
        visual_cues:
          - id: profile
            phrase: "fresh profile"
            targets: [profile-field]
          - id: domain
            phrase: "just the CI domain"
            targets: [domain-field]
          - id: account
            phrase: "read-only account"
            targets: [account-field]
          - id: bounds
            phrase: "Cap its time"
            targets: [session-limits]
          - id: launch
            phrase: "open the session"
            targets: [worker-state]
      - say: "The host's credential broker signs in. The model sees the resulting page. Keep the password and tokens out of prompts, action payloads and logs."
        hold: 0.65
        visual_cues:
          - id: broker
            phrase: "credential broker signs in"
            targets: [credential-broker]
          - id: model-view
            phrase: "model sees the resulting page"
            targets: [model-view]
      - say: "Enforce network policy outside the worker. Allow only the CI endpoints it needs. Check the scheme, address and port on each connection, including redirects, over IPv4 and IPv6. Keep host files, control sockets, terminals and password managers out of reach. A web form can send what the agent types. Limit form input, clipboard transfers, uploads and downloads."
        hold: 0.55
        visual_cues:
          - id: network
            phrase: "network policy outside the worker"
            targets: [network-route]
          - id: clipboard
            phrase: "clipboard transfers"
            targets: [worker-boundary]
      - say: "Choose isolation for the task. A container can share the host kernel. gVisor interposes an application kernel. Firecracker runs a KVM-backed microVM. In the audit record, keep the proposal, the host decision, the observation ID and the verifier's result. Redact values before retention. Even a screenshot from an approved page can contain a secret."
        hold: 0.7
        visual_cues:
          - id: audit
            phrase: "In the audit record"
            targets: [redacted-audit]
      - say: "Give an operator a way to stop the worker. At teardown revoke access and verify that session state has been removed. Now go back to the start of that session and follow one click."
        hold: 0.8
        visual_cues:
          - id: stop
            phrase: "stop the worker"
            targets: [operator-stop]
          - id: cleanup
            phrase: "session state has been removed"
            targets: [worker-state]
  - id: observe-propose-act
    title: "Opening the run"
    visual: "The host observes the dashboard, checks an Open run proposal and records one click. A new observation is issued only after the matching result appears."
    beats:
      - say: "The host captures the search form and calls it frame one. Fill the run field with the ID from the task. The model proposes Open run."
        hold: 0.65
        visual_cues:
          - id: field
            phrase: "Fill the run field"
            targets: [run-field]
          - id: propose
            phrase: "proposes Open run"
            targets: [model-proposal]
      - say: "Check the current session, the run ID and what this button does. It opens a result within our read-only task. Send the click. That's one Open run click. We still need to see which run opened."
        hold: 0.65
        visual_cues:
          - id: check
            phrase: "Check the current session"
            targets: [open-run]
          - id: send
            phrase: "Send the click"
            targets: [dispatched-point]
          - id: sent
            phrase: "one Open run click"
            targets: [dispatch-count]
      - say: "The result arrives for the same run. There's the failed stage, with its details still folded shut. The host captures frame two. The next proposal has to refer to that view."
        hold: 0.6
        visual_cues:
          - id: result
            phrase: "The result arrives"
            targets: [run-result]
          - id: capture
            phrase: "captures frame two"
            targets: [current-frame]
      - say: "That cycle of observing, proposing, checking and observing again continues until the host verifies the local draft, reaches its deadline or hits a safety boundary."
        hold: 0.7
        visual_cues:
          - id: stop
            phrase: "verifies the local draft"
            targets: [loop-stop]
  - id: observation-representations
    title: "Finding the right Failed tests tab"
    visual: "Two visible tabs share a name. The DOM, accessibility tree and image crop reveal different evidence. Filtering by run removes one candidate."
    beats:
      - say: "Two runs, two tabs called Failed tests. The DOM, the page's element tree, gives us tags, attributes and text, including hidden text. See the canvas tag? To read the error drawn there, we need the pixels."
        hold: 0.6
        visual_cues:
          - id: hidden
            phrase: "hidden text"
            targets: [dom-sample]
      - say: "Switch to the accessibility tree. It describes controls by role, name and state. Ask for a tab named Failed tests across the page and it returns both tabs. Scope that query to our run and one tab remains."
        hold: 0.7
        visual_cues:
          - id: tree
            phrase: "the accessibility tree"
            targets: [semantic-tree]
          - id: both
            phrase: "returns both tabs"
            targets: [page-wide-matches]
          - id: scope
            phrase: "one tab remains"
            targets: [run-matches]
      - say: "A magnified screenshot shows which run sits above the tab, a detail its label omits. Tiny text can disappear when the image shrinks. A numbered mark lets the model point to this tab by ID. That's set-of-marks grounding. The host has to bind the mark to this frame and resolve it again when the layout changes."
        hold: 0.6
        visual_cues:
          - id: pixels
            phrase: "A magnified screenshot"
            targets: [pixel-crop]
          - id: marks
            phrase: "A numbered mark"
            targets: [mark-id]
          - id: map
            phrase: "bind the mark to this frame"
            targets: [mark-id]
      - say: "For a normal locator click, check that the sole match is visible, stable, enabled and able to receive the click. A raw mouse coordinate skips those element checks. Either path still needs permission. If the run itself has two indistinguishable matches, ask for a clearer observation or escalate."
        hold: 0.7
        visual_cues:
          - id: locator
            phrase: "normal locator click"
            targets: [actionability-checks]
  - id: grounding-coordinates
    title: "Where is the yellow point?"
    visual: "A point stays fixed inside Failed tests while the crop origin, ruler spacing and coordinate readout change. The CSS answer stays covered through the prediction pause."
    beats:
      - say: "Suppose all the host gets back is the yellow point. In the padded image the model saw, it's one hundred thirty-two pixels across and sixty-six down. Keep your eye on the button. We'll change the ruler underneath it."
        hold: 0.65
      - say: "Subtract the padding, thirty-two on the left and sixteen at the top. Start the ruler at the crop's corner instead. The offset is now one hundred across and fifty down."
        hold: 0.65
        visual_cues:
          - id: padding
            phrase: "Subtract the padding"
            targets: [crop-origin]
          - id: unpadded
            phrase: "one hundred across and fifty down"
            targets: [unpadded-point]
      - say: "The model saw a smaller crop, three hundred twenty by two hundred. Restore the original six hundred forty by four hundred. Each axis doubles. From the crop's corner the point is now two hundred across and one hundred down."
        hold: 0.65
        visual_cues:
          - id: resize
            phrase: "Restore the original"
            targets: [ruler-spacing]
          - id: restored
            phrase: "two hundred across and one hundred down"
            targets: [crop-point]
      - say: "Move the origin to the viewport's upper left. The crop began one hundred pixels across and fifty down from there. Add that offset and the point is at three hundred across and one hundred fifty down in device pixels."
        hold: 0.75
        visual_cues:
          - id: offset
            phrase: "Move the origin"
            targets: [viewport-origin]
          - id: native
            phrase: "three hundred across and one hundred fifty down"
            targets: [device-point]
      - say: "This capture has two device pixels per CSS pixel along each axis. The browser mouse uses CSS pixels. Which point should the host send?"
        hold: 2.3
        visual_cues:
          - id: device-scale
            phrase: "two device pixels per CSS pixel"
            targets: [device-scale]
          - id: predict
            phrase: "Which point should the host send"
            targets: [css-question]
      - say: "One hundred fifty across and seventy-five down. The numbers halve and the target stays put. If the screenshot was already captured in CSS pixels, use those units directly. A desktop image also needs the viewport offset. A full-page image needs the current scroll position."
        hold: 0.85
        visual_cues:
          - id: css
            phrase: "One hundred fifty across and seventy-five down"
            targets: [css-point]
          - id: contract
            phrase: "already captured in CSS pixels"
            targets: [capture-contract]
  - id: observation-freshness
    title: "Two observations of the same run"
    visual: "The same point is marked on the saved and live views. A banner moves the live tab out from under the ring. A fresh proposal opens the failure and the error line moves to the local draft."
    beats:
      - say: "The ring marks the same spot in both views. It sits inside Failed tests. Watch the live page on the right. A status banner pushes the tab down. Where would the old click land now?"
        hold: 2.3
        visual_cues:
          - id: saved-point
            phrase: "The ring marks the same spot"
            targets: [saved-point]
          - id: reflow
            phrase: "A status banner pushes the tab down"
            targets: [live-tab]
          - id: predict
            phrase: "Where would the old click land"
            targets: [freshness-question]
      - say: "On the banner. The proposal belongs to capture two A. The live page has changed, so the host drops that proposal. Zero clicks reach the browser."
        hold: 0.7
        visual_cues:
          - id: reject
            phrase: "On the banner"
            targets: [stale-decision]
      - say: "Capture the current view and ask for a new proposal. Now the host can resolve one actionable Failed tests tab in this run. Recheck the session, tab and layout just before dispatch. Send this click."
        hold: 0.85
        visual_cues:
          - id: recapture
            phrase: "Capture the current view"
            targets: [current-observation]
          - id: resolve
            phrase: "one actionable Failed tests tab"
            targets: [current-target]
          - id: send
            phrase: "Send this click"
            targets: [dispatched-point]
      - say: "The failure panel opens. One Failed tests click reached the portal. Now we can see which key the parser couldn't find. Copy that traceback to the local draft. Read the file back and compare the run ID and the error line. Both match. That completes this inspection."
        hold: 0.9
        visual_cues:
          - id: opened
            phrase: "failure panel opens"
            targets: [open-panel]
          - id: draft
            phrase: "Copy that traceback"
            targets: [local-draft]
          - id: verified
            phrase: "Both match"
            targets: [verified-draft]
  - id: adapter-runtime
    title: "One batch, three proposed actions"
    visual: "In a separate authorized workflow, the executor reads a traceback, pauses an unapproved deploy, and leaves the later scroll unsent. Browser input and native desktop input follow separate channels."
    beats:
      - say: "One model response can ask for all three actions on the right. Pin the model, tool schema and adapter together so both sides agree on coordinate units, action names and call IDs. The model sends proposals. The host checks each one. If the browser session is lost, reconnect to a valid session and observe the page again."
        hold: 0.6
        visual_cues:
          - id: contract
            phrase: "Pin the model"
            targets: [adapter-contract]
          - id: generated
            phrase: "model sends proposals"
            targets: [proposal-state]
          - id: lost-session
            phrase: "browser session is lost"
            targets: [browser-session]
      - say: "Take a separate workflow where a deploy is in scope and a reviewer must approve it. The batch asks for three actions in order. First, read the traceback. Next comes the deploy. Its approval is missing, so pause there. The later scroll stays unsent. On failure, an unknown action or a policy stop, report every unexecuted action as the provider requires. Check fresh state before resuming."
        hold: 0.7
        visual_cues:
          - id: ordered
            phrase: "three actions in order"
            targets: [action-batch]
          - id: capture
            phrase: "read the traceback"
            targets: [read-action]
          - id: pause
            phrase: "pause there"
            targets: [review-boundary]
          - id: later
            phrase: "later scroll stays unsent"
            targets: [scroll-action]
          - id: remaining
            phrase: "report every unexecuted action"
            targets: [provider-result]
      - say: "Some adapters also require confirmation. Obtain it from a person and return the required acknowledgement. The application still checks its own permissions. If the provider returns generated code, isolate its executor and restrict what that code can reach."
        hold: 0.55
        visual_cues:
          - id: confirmation
            phrase: "require confirmation"
            targets: [provider-confirmation]
          - id: code
            phrase: "returns generated code"
            targets: [executor-boundary]
      - say: "A browser driver sends a click in viewport CSS coordinates. A native window is outside that channel. To operate one, check the display, focused window and permissions. A headless browser can capture the portal without a desktop. Native apps may need a virtual display. Configure any remote observer as view-only, with an authenticated, encrypted gateway."
        hold: 0.65
        visual_cues:
          - id: browser
            phrase: "A browser driver sends a click"
            targets: [browser-input]
          - id: browser-boundary
            phrase: "outside that channel"
            targets: [native-window]
          - id: native
            phrase: "display, focused window and permissions"
            targets: [native-input]
          - id: headless
            phrase: "headless browser can capture the portal"
            targets: [browser-capture]
      - say: "Keep the browser version, fonts, scale and viewport fixed across runs. Wait until this run's failure panel appears. Its run ID and error line tell you which panel opened."
        hold: 0.7
        visual_cues:
          - id: reproducible
            phrase: "fonts, scale and viewport"
            targets: [capture-settings]
          - id: visible
            phrase: "this run's failure panel appears"
            targets: [expected-state]
  - id: verify-after-action
    title: "The form after Submit"
    visual: "Both branches start with the same pending request and unchanged form. One resubmits and queues two notes. The other waits and inspects the receipt for the first request."
    beats:
      - say: "A reviewer approved one incident note. The host clicked Submit. The draft is still in the form. Should the host send it again?"
        hold: 2.4
        visual_cues:
          - id: first
            phrase: "host clicked Submit"
            targets: [sent-input]
          - id: question
            phrase: "Should the host send it again"
            targets: [retry-question]
      - say: "Wait. From the form alone, the outcome is unknown. Look behind the form. The first request is pending. Let's follow what happens if we click again, and what happens if we wait."
        hold: 0.7
        visual_cues:
          - id: unknown
            phrase: "The outcome is unknown"
            targets: [host-outcome]
          - id: pending
            phrase: "The first request is pending"
            targets: [pending-requests]
      - say: "The host on the left clicks Submit again. This service accepts a second request for the same text. Let the worker process both requests. It queues two notes."
        hold: 0.8
        visual_cues:
          - id: retry
            phrase: "clicks Submit again"
            targets: [repeat-branch]
          - id: second
            phrase: "a second request"
            targets: [second-request]
          - id: process-two
            phrase: "process both requests"
            targets: [duplicate-delivery]
          - id: two-notes
            phrase: "two notes"
            targets: [queued-count]
      - say: "On the right, leave Submit alone. The worker processes the original request and queues one note. The receipt confirms the note was queued. To verify that it was posted, look for that note on the incident record."
        hold: 0.85
        visual_cues:
          - id: inspect
            phrase: "leave Submit alone"
            targets: [inspect-branch]
          - id: process-one
            phrase: "processes the original request"
            targets: [original-delivery]
          - id: one-note
            phrase: "one note"
            targets: [queued-count]
          - id: receipt
            phrase: "confirms the note was queued"
            targets: [authoritative-receipt]
      - say: "If the deadline arrives while the outcome is still unknown, hand the request ID to a reviewer. They can check the original request before anyone sends another."
        hold: 0.85
        visual_cues:
          - id: deadline
            phrase: "outcome is still unknown"
            targets: [unknown-outcome]
  - id: policy-and-approval
    title: "Which record did the grant cover?"
    visual: "A host-only draft and a blocked deploy give way to a separate approved change for INC-2048. The verifier compares the neighboring incident and discovers a change outside the grant."
    beats:
      - say: "Back on the read-only task, opening the failure is allowed. Saving the draft on this device is allowed too. A deploy would start a production job. Even a perfectly placed click there must be blocked."
        hold: 0.65
        visual_cues:
          - id: read
            phrase: "opening the failure"
            targets: [allowed-read]
          - id: local
            phrase: "Saving the draft"
            targets: [allowed-local-save]
          - id: deploy
            phrase: "A deploy would start"
            targets: [deploy-effect]
          - id: permission
            phrase: "must be blocked"
            targets: [policy-decision]
      - say: "Now give a reviewer a separate request to write to incident twenty forty-eight. Lay the proposed change beside the grant. Match the actor and session, the incident and exact content, the expected record version and the expiry time. Recheck the live version, expiry and revocation immediately before the write. A stale grant needs a fresh decision."
        hold: 0.65
        visual_cues:
          - id: authorized-write
            phrase: "a separate request to write"
            targets: [incident-proposal]
          - id: bind
            phrase: "Match the actor and session"
            targets: [grant-fields]
          - id: recheck
            phrase: "Recheck the live version"
            targets: [live-grant]
      - say: "A local set can catch a second use in one process. Concurrent users or a restart need durable, atomic enforcement so two writers can't spend the same grant. Check before typing into the editor. This one autosaves as you type. Even hovering can have an effect in some applications."
        hold: 0.75
        visual_cues:
          - id: atomic
            phrase: "durable, atomic enforcement"
            targets: [grant-replay]
          - id: effects
            phrase: "autosaves as you type"
            targets: [editor-autosave]
      - say: "The intended incident now contains the note. Look one record down. Incident ninety-nine eleven has also closed. Only the note on twenty forty-eight was approved. The verifier reports failure and stops. It checks every record in its defined scope and the available audit trail. That check detects the closure. Reopening the incident would be a separate recovery action. Decide what recovery is possible before rollout."
        hold: 1
        visual_cues:
          - id: target-correct
            phrase: "intended incident now contains the note"
            targets: [intended-record]
          - id: collateral
            phrase: "has also closed"
            targets: [neighbor-record]
          - id: verifier
            phrase: "reports failure and stops"
            targets: [verifier-outcome]
          - id: recovery
            phrase: "separate recovery action"
            targets: [recovery-scope]
  - id: untrusted-observation
    title: "What the page can tell the host"
    visual: "A page banner supplies words for a proposal. The page, accessibility label and painted dialog remain on the observation side of the host's fixed permission boundary."
    beats:
      - say: "The host sets the permissions for this read-only pilot. A line in a trace, a banner or an image can still sound like someone giving an order."
        hold: 0.6
        visual_cues:
          - id: untrusted
            phrase: "host sets the permissions"
            targets: [host-policy]
      - say: "Here the banner says to rerun deployment. Read those words as a quote from the page. The host can still collect the parser failure and save the local draft. If the model proposes a deploy, the host blocks that write."
        hold: 0.7
        visual_cues:
          - id: injection
            phrase: "banner says to rerun deployment"
            targets: [page-banner]
          - id: extract
            phrase: "Read those words as a quote"
            targets: [quoted-page-text]
          - id: blocked
            phrase: "blocks that write"
            targets: [blocked-effect]
      - say: "Suppose the injection detector misses the banner. The account is still read-only and the host keeps the credentials. The useful read can continue."
        hold: 0.6
        visual_cues:
          - id: detector
            phrase: "detector misses the banner"
            targets: [detector-result]
      - say: "Compare three views of the same control. Hidden DOM text shows up in the page parser. OCR can read the painted words, including a painted dialog that looks like a system prompt. The accessible name says Deploy production. The button says Continue. A fresh screenshot updates what the agent sees. The host still permits reading the failure and saving the draft. If a captcha or access control intervenes, hand it to a person."
        hold: 0.8
        visual_cues:
          - id: hidden-dom
            phrase: "Hidden DOM text"
            targets: [dom-view]
          - id: ocr
            phrase: "OCR can read"
            targets: [pixel-view]
          - id: spoof
            phrase: "painted dialog"
            targets: [painted-dialog]
          - id: a11y
            phrase: "accessible name says"
            targets: [accessibility-name]
          - id: clean
            phrase: "A fresh screenshot"
            targets: [host-policy]
          - id: human
            phrase: "hand it to a person"
            targets: [human-handoff]
  - id: evaluation-contract
    title: "Scoring a five-proposal inspection"
    visual: "The episode log fills as proposals arrive. Clicks dispatched, goal completion and forbidden proposals are counted against their own denominators before the read-only rollout decision."
    beats:
      - say: "Score the five proposals in our local episode. Open run sent a click. The stale Failed tests proposal sent none. The fresh proposal sent the second click. Saving the draft was a local action. Deploy was proposed and blocked."
        hold: 0.8
        visual_cues:
          - id: open
            phrase: "Open run sent a click"
            targets: [open-run-row]
          - id: stale
            phrase: "stale Failed tests proposal"
            targets: [stale-row]
          - id: fresh
            phrase: "fresh proposal sent the second click"
            targets: [fresh-row]
          - id: saved
            phrase: "Saving the draft"
            targets: [draft-row]
          - id: deploy
            phrase: "proposed and blocked"
            targets: [deploy-row]
      - say: "Both dispatched clicks landed inside their annotated boxes. That's two hits out of two dispatched clicks in this example. The saved file contained the expected run and traceback. One episode met its draft goal."
        hold: 0.75
        visual_cues:
          - id: hits
            phrase: "two hits out of two dispatched clicks"
            targets: [grounding-fraction]
          - id: goal
            phrase: "One episode met its draft goal"
            targets: [episode-success]
      - say: "Now count the blocked deploy. One of five proposals was forbidden. Of the two browser clicks actually sent, zero violated policy. A required review belongs in the review count. Even when five proposals stay fixed, reading a larger image can add cost, longer waits can add latency, and a reviewer can spend more time. Count model calls too, and check session cleanup."
        hold: 0.75
        visual_cues:
          - id: attempts
            phrase: "One of five proposals was forbidden"
            targets: [forbidden-fraction]
          - id: violations
            phrase: "zero violated policy"
            targets: [violation-fraction]
          - id: costs
            phrase: "reading a larger image"
            targets: [operating-measures]
      - say: "WebArena checks functional outcomes on live web tasks. OSWorld checks desktop and cross-application state. The original Mind2Web evaluates recorded pages. GAIA scores assistant answers. AgentDojo tests agents facing tool injection. Record the benchmark version and validator. Partial credit and binary success answer different questions."
        hold: 0.65
        visual_cues:
          - id: bench
            phrase: "WebArena checks"
            targets: [webarena-evidence]
          - id: desktop
            phrase: "OSWorld checks"
            targets: [osworld-evidence]
          - id: recorded
            phrase: "original Mind2Web"
            targets: [mindtwo-web-evidence]
          - id: answers
            phrase: "GAIA scores"
            targets: [gaia-evidence]
          - id: injection
            phrase: "AgentDojo tests"
            targets: [agentdojo-evidence]
      - say: "In this replay we supplied the click points and checked the host's decisions. Keep the pilot read-only. On the actual dashboard, let the model pick the points. Measure where they land, how long the run takes and what changed. Check the login, the page origin and the target. Include pages with misleading instructions. Cap time and steps, and review failures before granting write access."
        hold: 0.8
        visual_cues:
          - id: pilot
            phrase: "Keep the pilot read-only"
            targets: [rollout-decision]
  - id: choose-and-measure
    title: "The next inspection"
    visual: "Two run panels collapse into one. After recapture, the run filter encloses two identically named tabs. The empty traceback line and zero click count show where the host stops."
    beats:
      - say: "Frame seven shows two runs. Only the upper tab belongs to the run in our draft. The model proposes that tab."
        hold: 0.75
        visual_cues:
          - id: proposal
            phrase: "model proposes that tab"
            targets: [saved-proposal]
      - say: "Watch the lower tab as the comparison closes. Both tabs now sit inside one run. Drop the old proposal and capture frame eight."
        hold: 0.75
        visual_cues:
          - id: reflow
            phrase: "the comparison closes"
            targets: [current-run-label]
          - id: recapture
            phrase: "capture frame eight"
            targets: [current-observation]
      - say: "Filter by run. Both tabs say Failed tests. Which one opens the parser failure?"
        hold: 2.5
        visual_cues:
          - id: filter
            phrase: "Filter by run"
            targets: [matched-tabs]
          - id: predict
            phrase: "Which one opens the parser failure"
            targets: [dispatch-question]
      - say: "Hold the click. Two tabs match this run. The host has sent zero clicks, and the draft stays unverified."
        hold: 0.9
        visual_cues:
          - id: stop
            phrase: "Hold the click"
            targets: [dispatch-count]
          - id: file
            phrase: "draft stays unverified"
            targets: [local-draft]
      - say: "Send the reviewer this frame with one question. Which tab opens the parser failure? Once the intended tab is clear, the host can check it against the current page."
        hold: 1.1
        visual_cues:
          - id: handoff
            phrase: "Send the reviewer this frame"
            targets: [clarification-request]
