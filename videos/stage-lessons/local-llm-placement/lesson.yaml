            phrase: "The server evaluated the remaining four hundred tokens in that time"
            targets: [prompt-span]
            color: cyan
            linger: 0.25
          - id: prompt-result
            phrase: "That's two thousand uncached prompt tokens per second"
            targets: [prompt-rate]
            color: green
            linger: 0.25
          - id: own-duration
            phrase: "Eighty generated tokens in two seconds gives forty per second"
            targets: [output-rate]
            color: blue
            linger: 0.25
      - say: >-
          Take away the output duration. We still know the count, but we can't calculate its rate. Keep
          the server version with the receipt. To find out how long the engineer waited for the first
          visible token, timestamp its arrival at the client. Use the same arrival stream to check gaps
