  - id: timings
    title: "Which prompt tokens did the clock time?"
    visual: "A bracket contracts from the whole prompt to the uncached suffix. Generated tokens use their own clock. Removing its duration leaves the output rate unavailable."
    beats:
      - say: >-
          One completed request gives us this timing receipt. Of the thousand tokens in the prompt, six
          hundred came from cache. The server reports two tenths of a second for prompt evaluation. Which
          span of the prompt belongs over those two tenths?
