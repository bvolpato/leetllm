        visual_cues:
          - id: cached-prefix
            phrase: "six hundred came from cache"
            targets: [prompt-span]
            color: cyan
            linger: 0.25
          - id: which-time
            phrase: "Which span of the prompt"
            targets: [prompt-span]
            color: blue
            linger: 0.25
      - say: >-
          Move the bracket past the reused prefix. The server evaluated the remaining four hundred tokens
          in that time. That's two thousand uncached prompt tokens per second. Counting the whole prompt
          would give five thousand and credit work skipped on this request. Output has its own clock.
          Eighty generated tokens in two seconds gives forty per second.
        hold: 0.65
        caption_starts: ["The server evaluated the remaining four hundred tokens", "That's two thousand uncached prompt tokens per second"]
        visual_cues:
