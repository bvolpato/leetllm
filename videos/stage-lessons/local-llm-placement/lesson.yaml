    title: "What can a completed receipt establish?"
    visual: "Check the recorded values and units, then mark submission, first chunk, first visible token and completion on a separate client timeline."
    beats:
      - say: >-
          Read the final completed response. The Python helper requires the Boolean value true for done
          and nonnegative integer counts and times. A Boolean is invalid as a numeric metric. If the
          cached count exceeds the total prompt, reject the receipt. Subtract only when both counts are
          present. An omitted cache count leaves the uncached rate unknown, even if you know the total
          number of tokens. A missing or zero duration gives you no rate. Reject a computed rate outside
          the finite range. The helper divides integer quantities before converting the result. That
          keeps a finite ratio usable even when the individual integers are very large.
