scenes:
  - id: intro
    title: "Why did the fourth log fail?"
    visual: "The fourth incident log has an out-of-memory response beside a 24 GB GPU. Replay the four logs on a worksheet. Count the shared weights once, then add workspace and a two-color cache strip for each log."
    beats:
      - say: >-
          The fourth incident log gets an out-of-memory error. This GPU answered a short runbook question.
          Now four long logs share one copy of the model. What else needs room on the card?
        hold: 0.9
        visual_cues:
          - id: failed-request
            phrase: "The fourth incident log gets an out-of-memory error"
            targets: [requests]
            color: pink
            linger: 0.25
          - id: short-answer
            phrase: "This GPU answered a short runbook question"
            targets: [requests]
            color: blue
            linger: 0.25
          - id: shared-model
            phrase: "four long logs share one copy of the model"
            targets: [device-budget]
            color: blue
            linger: 0.25
      - say: >-
          Put the weights on the worksheet at seven point six gigabytes. The yellow line leaves a fifth
          of the card in reserve. Allow two gigabytes for workspace. With capped storage, each log needs
          about six tenths of a gigabyte to remember its tokens. Will all four fit under the line?
        hold: 2.2
        visual_cues:
          - id: working-allocation
            phrase: "Allow two gigabytes for workspace"
            targets: [device-budget]
            color: pink
            linger: 0.25
          - id: ask-fit
            phrase: "Will all four fit under the line"
            targets: [requests, device-budget, question]
            color: yellow
            linger: 0.25
      - say: >-
          Add one cache strip for each log. Just over twelve gigabytes in total. All four fit under the yellow line.
          Each strip has two colors. Some layers keep a recent window of tokens. Others keep the full
          history. To explain the failed request, check how much cache the runner reserved and how much
          workspace it asked for while those logs were open.
        hold: 0.6
        caption_starts: ["Just over twelve gigabytes in total", "All four fit under the yellow line", "To explain the failed request"]
        visual_cues:
          - id: workload-state
            phrase: "Add one cache strip for each log. Just over twelve gigabytes in total."
            targets: [requests, device-budget]
            color: cyan
            linger: 0.25
          - id: check-peak
            phrase: "check how much cache the runner reserved"
            targets: [question]
            color: blue
            linger: 0.25
  - id: weight-payload
    title: "What does the download weigh?"
    visual: "Compare ideal 16-bit and 4-bit codes with the listed native artifact on the same decimal-GB scale. Zeroing dense codes keeps every storage position."
    beats:
      - say: >-
          Start with a single weight file. If it holds N weights at B bits apiece, multiply those numbers
          and divide by eight to get bytes. A real artifact can also carry scales, metadata and
          higher-precision tensors. Set every code here to zero and the dense array still has all sixteen
          slots. Saving space would require a sparse encoding and a runner that can use it.
        hold: 0.6
        visual_cues:
          - id: pl-weight-payload-0-0
            phrase: "Start with a single weight file. If it holds N weights at B bits apiece, multiply those numbers and divide by eight to get bytes."
            targets: [pl-weight-payload-trace]
            color: blue
            linger: 0.25
          - id: pl-weight-payload-0-1
            phrase: "A real artifact can also carry scales, metadata and higher-precision tensors."
            targets: [pl-weight-payload-trace]
            color: blue
            linger: 0.25
          - id: pl-weight-payload-0-2
            phrase: "Set every code here to zero and the dense array still has all sixteen slots. Saving space would require a sparse encoding and a runner that can use it."
            targets: [pl-weight-payload-trace]
            color: blue
            linger: 0.25
      - say: >-
          For Gemma's eleven point nine five billion parameters, uniform sixteen-bit storage gives
          twenty-three point nine gigabytes. Four-bit codes alone take just under six. The eight-gigabyte
          Ollama artifact listed in the article also includes mixed-precision target tensors, a
          sixteen-bit projector and a four-hundred-twenty-three-million-parameter draft model. If the
          runner uses the draft model, it needs space for its weights and can add cache and execution
          costs. The worksheet budgets seven point six gigabytes for weights. On your worker, record
          the loaded artifact and measure its tensors in each memory pool.
        hold: 0.6
        visual_cues:
          - id: pl-weight-payload-1-0
            phrase: "For Gemma's eleven point nine five billion parameters, uniform sixteen-bit storage gives twenty-three point nine gigabytes. Four-bit codes alone take just under six."
            targets: [pl-weight-payload-trace]
            color: blue
            linger: 0.25
          - id: pl-weight-payload-1-1
            phrase: "The eight-gigabyte Ollama artifact listed in the article also includes mixed-precision target tensors, a sixteen-bit projector and a four-hundred-twenty-three-million-parameter draft model."
            targets: [pl-weight-payload-trace]
            color: blue
            linger: 0.25
          - id: pl-weight-payload-1-2
            phrase: "If the runner uses the draft model, it needs space for its weights and can add cache and execution costs."
            targets: [pl-weight-payload-trace]
            color: blue
            linger: 0.25
          - id: pl-weight-payload-1-3
            phrase: "The worksheet budgets seven point six gigabytes for weights. On your worker, record the loaded artifact and measure its tensors in each memory pool."
            targets: [pl-weight-payload-trace]
            color: blue
            linger: 0.25
  - id: workspace-contract
    title: "Which allocations coexist?"
    visual: "Compare the live allocations in two phases on the same device. Then replace the phase-specific work values with an explicit worksheet assumption."
    beats:
      - say: >-
          Both bars follow one request on one device. The weights, cache and other allocations are
          already there when the temporary workspace arrives. The prefill phase uses fourteen gigabytes
          at its peak. The later decode phase uses twelve point four. Pick the larger peak. Adding the
          two peaks counts the same weights twice. Adding a reserved pool to the storage it already
          contains would make a similar mistake. For a split runner, make another budget for host memory.
          Charge each allocation to the pool that supplies it.
        hold: 0.6
        visual_cues:
          - id: pl-workspace-contract-0-0
            phrase: "Both bars follow one request on one device. The weights, cache and other allocations are already there when the temporary workspace arrives."
            targets: [pl-workspace-contract-trace]
            color: blue
            linger: 0.25
          - id: pl-workspace-contract-0-1
            phrase: "The prefill phase uses fourteen gigabytes at its peak. The later decode phase uses twelve point four. Pick the larger peak."
            targets: [pl-workspace-contract-trace]
            color: blue
            linger: 0.25
          - id: pl-workspace-contract-0-2
            phrase: "Adding the two peaks counts the same weights twice. Adding a reserved pool to the storage it already contains would make a similar mistake."
            targets: [pl-workspace-contract-trace]
            color: blue
            linger: 0.25
          - id: pl-workspace-contract-0-3
            phrase: "For a split runner, make another budget for host memory. Charge each allocation to the pool that supplies it."
            targets: [pl-workspace-contract-trace]
            color: blue
            linger: 0.25
      - say: >-
          A memory-efficient attention kernel can avoid building the full matrix of attention scores. It
          still needs workspace. A longer prefill chunk, a different backend, output logits or a captured
          graph can change the peak. Simultaneous requests can change it too. For the four-log worksheet,
          allow two gigabytes for workspace and leave a fifth of the card in reserve. Before setting
          the worker's admission limit, measure its peak workspace and the memory other processes use.
        hold: 0.6
        visual_cues:
          - id: pl-workspace-contract-1-0
            phrase: "A memory-efficient attention kernel can avoid building the full matrix of attention scores. It still needs workspace."
            targets: [pl-workspace-contract-trace]
            color: blue
            linger: 0.25
          - id: pl-workspace-contract-1-1
            phrase: "A longer prefill chunk, a different backend, output logits or a captured graph can change the peak. Simultaneous requests can change it too."
            targets: [pl-workspace-contract-trace]
            color: blue
            linger: 0.25
          - id: pl-workspace-contract-1-2
            phrase: "For the four-log worksheet, allow two gigabytes for workspace and leave a fifth of the card in reserve."
            targets: [pl-workspace-contract-trace]
            color: blue
            linger: 0.25
          - id: pl-workspace-contract-1-3
            phrase: "Before setting the worker's admission limit, measure its peak workspace and the memory other processes use."
            targets: [pl-workspace-contract-trace]
            color: blue
            linger: 0.25
  - id: cache-formula
    title: "How many bytes does one token leave behind?"
    visual: "Build the raw byte count from the two stored arrays and the configured layer dimensions. Repeat the count for multiple sessions, then separate Gemma's sliding and full layers."
    beats:
      - say: >-
          Pick one retained token in one layer. Its cache holds a key and a value for each K V head. Each
          head has a configured width, and each number takes a known number of bytes. The leading two
          counts the separate key and value arrays. Read the width from the configuration. Dividing
          hidden size by the number of query heads can give a different answer. Multiply by layers,
          retained tokens and simultaneous sequences. If layer shapes differ, count each group separately
          and add the results. That gives the raw payload. Page rounding, temporary updates, metadata and
          unused reserved space can raise the allocation.
        hold: 0.6
        visual_cues:
          - id: pl-cache-formula-0-0
            phrase: "Pick one retained token in one layer. Its cache holds a key and a value for each K V head. Each head has a configured width, and each number takes a known number of bytes."
            targets: [pl-cache-formula-trace]
            color: cyan
            linger: 0.25
          - id: pl-cache-formula-0-1
            phrase: "The leading two counts the separate key and value arrays."
            targets: [pl-cache-formula-trace]
            color: cyan
            linger: 0.25
          - id: pl-cache-formula-0-2
            phrase: "Read the width from the configuration. Dividing hidden size by the number of query heads can give a different answer."
            targets: [pl-cache-formula-trace]
            color: cyan
            linger: 0.25
          - id: pl-cache-formula-0-3
            phrase: "Multiply by layers, retained tokens and simultaneous sequences. If layer shapes differ, count each group separately and add the results."
            targets: [pl-cache-formula-trace]
            color: cyan
            linger: 0.25
          - id: pl-cache-formula-0-4
            phrase: "That gives the raw payload. Page rounding, temporary updates, metadata and unused reserved space can raise the allocation."
            targets: [pl-cache-formula-trace]
            color: cyan
            linger: 0.25
      - say: >-
          Take thirty-two identical layers. Eight heads, a width of one hundred twenty-eight, and two
          bytes per number give one hundred twenty-eight kibibytes per token across those layers. A
          kibibyte contains a thousand and twenty-four bytes. A gibibyte contains that factor cubed.
          Multiply the per-token cost by four thousand ninety-six tokens to get half a gibibyte for one
          log. At thirty-two thousand seven hundred sixty-eight tokens each, four logs use sixteen
          gibibytes.
        hold: 0.6
        visual_cues:
          - id: pl-cache-formula-1-0
            phrase: "Take thirty-two identical layers. Eight heads, a width of one hundred twenty-eight, and two bytes per number give one hundred twenty-eight kibibytes per token across those layers."
            targets: [pl-cache-formula-trace]
            color: cyan
            linger: 0.25
          - id: pl-cache-formula-1-1
            phrase: "A kibibyte contains a thousand and twenty-four bytes. A gibibyte contains that factor cubed."
            targets: [pl-cache-formula-trace]
            color: cyan
            linger: 0.25
          - id: pl-cache-formula-1-2
            phrase: "Multiply the per-token cost by four thousand ninety-six tokens to get half a gibibyte for one log. At thirty-two thousand seven hundred sixty-eight tokens each, four logs use sixteen gibibytes."
            targets: [pl-cache-formula-trace]
            color: cyan
            linger: 0.25
      - say: >-
          Now count the layers in our runbook example. Forty sliding layers each use eight K V heads of
          width two hundred fifty-six. Eight full layers each use one head of width five hundred twelve.
          Each sliding layer attends over a window of a thousand and twenty-four positions. The full
          layers share a key and value projection, but the implementation transforms the two states
          separately and caches both. Count both arrays in our worksheet. Keeping those states saves the
          work of projecting the old tokens again. A full-attention layer still reads the retained
          history for each new token. Reprocessing a whole prefix repeats attention over its token pairs.
          Next, look at which positions the runner actually keeps.
        hold: 0.6
        visual_cues:
          - id: pl-cache-formula-2-0
            phrase: "Now count the layers in our runbook example. Forty sliding layers each use eight K V heads of width two hundred fifty-six. Eight full layers each use one head of width five hundred twelve."
            targets: [pl-cache-formula-trace]
            color: cyan
            linger: 0.25
          - id: pl-cache-formula-2-1
            phrase: "Each sliding layer attends over a window of a thousand and twenty-four positions."
            targets: [pl-cache-formula-trace]
            color: cyan
            linger: 0.25
          - id: pl-cache-formula-2-2
            phrase: "The full layers share a key and value projection, but the implementation transforms the two states separately and caches both. Count both arrays in our worksheet."
            targets: [pl-cache-formula-trace]
            color: cyan
            linger: 0.25
          - id: pl-cache-formula-2-3
            phrase: "Keeping those states saves the work of projecting the old tokens again. A full-attention layer still reads the retained history for each new token."
            targets: [pl-cache-formula-trace]
            color: cyan
            linger: 0.25
          - id: pl-cache-formula-2-4
            phrase: "Reprocessing a whole prefix repeats attention over its token pairs. Next, look at which positions the runner actually keeps."
            targets: [pl-cache-formula-trace]
            color: cyan
            linger: 0.25
  - id: retention
    title: "Which parts of the log stay in memory?"
    visual: "Sixteen columns represent one 16,384-token log. A fixed bracket marks the last query's sliding window. Two K/V layouts expose the difference between the positions a query may read and the storage a runner reserves."
    beats:
      - say: >-
          Look at the last query in one of our four logs. Each column stands for a thousand and
          twenty-four positions. This sliding layer can attend to just the yellow column. In a capped
          cache, one tile of keys and one tile of values survive. The eight full-attention layers keep
          keys and values for every column.
        hold: 0.6
        visual_cues:
          - id: last-query
            phrase: "just the yellow column"
            targets: [mask]
            color: blue
            linger: 0.25
          - id: keep-pair
            phrase: "one tile of keys and one tile of values survive"
            targets: [capped-pages]
            color: cyan
            linger: 0.25
          - id: full-attention
            phrase: "The eight full-attention layers"
            targets: [cache-totals]
            color: blue
            linger: 0.25
      - say: >-
          Replay the very same log in a second runner. Its sliding layer reserves room for the whole
          history. Look at the two rows under the bracket. For one sliding layer in this log, how many
          extra key tiles and value tiles does the lower layout reserve?
        hold: 2.1
        visual_cues:
          - id: ask-reserve
            phrase: "how many extra key tiles and value tiles"
            targets: [mask, capped-pages, full-pages]
            color: yellow
            linger: 0.25
      - say: >-
          Fill the earlier slots in the lower row. Fifteen more key tiles and fifteen more value tiles,
          all outside the yellow window. The last query still reads just the final column.
          Across forty sliding layers and four logs, that storage choice takes the sliding allocation
          from about one point three gigabytes to more than twenty-one. The eight full layers still need
          the same amount. Add them and the raw cache alone can reach twenty-two and a half gigabytes.
          Check what your backend reserves.
        hold: 0.65
        visual_cues:
          - id: reserve-earlier
            phrase: "Fill the earlier slots in the lower row"
            targets: [full-pages]
            color: blue
            linger: 0.25
          - id: count-extra
            phrase: "Fifteen more key tiles and fifteen more value tiles"
            targets: [mask, full-pages, cache-totals]
            color: cyan
            caption_boundary: true
            linger: 0.25
          - id: read-totals
            phrase: "Across forty sliding layers and four logs"
            targets: [cache-totals]
            color: blue
            linger: 0.25
  - id: worksheet-evidence
    title: "Change one input in the device budget"
    visual: "Four common-scale stacks keep weights and workspace fixed. The sliding and full-layer cache segments respond separately to log length, session count and physical retention. Both the planning limit and the card capacity stay in place."
    beats:
      - say: >-
          Put those bytes back on the card. Start with four logs, sixteen thousand three hundred
          eighty-four tokens each, and capped storage. The first stack ends at twelve point zero one six
          gigabytes. Now double the length of each log. Only the full-attention layers keep the extra
          history. The total rises by just over one gigabyte.
        hold: 0.6
        visual_cues:
          - id: reference-cache
            phrase: "The first stack ends at twelve point zero one six gigabytes"
            targets: [row-0]
            color: cyan
            linger: 0.25
          - id: longer-logs
            phrase: "Now double the length of each log"
            targets: [row-1]
            color: blue
            linger: 0.25
      - say: >-
          Go back to the original length and double the number of logs instead. Each new session needs
          both kinds of cache. The weights and our assumed workspace stay put. Eight logs bring the total
          to about fourteen point four gigabytes.
        hold: 0.7
        visual_cues:
          - id: more-logs
            phrase: "double the number of logs instead"
            targets: [row-2]
            color: blue
            linger: 0.25
      - say: >-
          Return to four logs and reserve the full sliding buffers. This time the stack crosses both
          lines. It needs over thirty-two gigabytes on a twenty-four gigabyte card. Even if we cut
          working memory to one gigabyte and give up the reserve, the demand still exceeds capacity. A
          real server might decline that request, preempt it, or use a different placement. Its
          allocation and request logs tell us which happened.
        hold: 0.6
        visual_cues:
          - id: full-storage
            phrase: "reserve the full sliding buffers"
            targets: [row-3]
            color: pink
            linger: 0.25
          - id: remove-reserve
            phrase: "cut working memory to one gigabyte and give up the reserve"
            targets: [worksheet-result]
            color: blue
            linger: 0.25
  - id: synthesis
    title: "What failed during prefill?"
    visual: "A hypothetical trace pins the live weights and capped cache to one device. Outline a temporary allocation against physical capacity. Replay with smaller prefill chunks on the same device, keeping the same logs and cache."
    beats:
      - say: >-
          Go back to the worker where the fourth log failed. Suppose we recover this allocation trace from the
          prompt-processing phase, called prefill. Just before the failure, the device holds the weights
          and the capped cache. In this example there are no other allocations. The allocator reports
          just under fourteen gigabytes free. Can it grant a fifteen-gigabyte temporary buffer?
        hold: 2
        visual_cues:
          - id: same-logs
            phrase: "the weights and the capped cache"
            targets: [live-bytes]
            color: blue
            linger: 0.25
          - id: ask-allocation
            phrase: "Can it grant a fifteen-gigabyte temporary buffer"
            targets: [trace-decision]
            color: yellow
            linger: 0.25
      - say: >-
          Trace the requested buffer from the end of the cache. Its outline crosses the physical limit.
          The allocation fails before that buffer becomes live. This trace identifies a workspace
          request. It gives us a reason to try changing how much of each prompt we process at once.
        hold: 1
        caption_starts: ["Its outline crosses the physical limit", "The allocation fails before that buffer becomes live"]
        visual_cues:
          - id: large-request
            phrase: "Trace the requested buffer from the end of the cache. Its outline crosses the physical limit."
            targets: [original]
            color: blue
            linger: 0.25
      - say: >-
          Replay with a smaller prefill chunk. In this example the temporary request drops to six
          gigabytes and succeeds. Same weights. Same logs. Same cache. On your own worker, keep the
          artifact, runtime, placement and request identity with both traces. Record the actual peak and
          the latency change before recommending that chunk size.
        hold: 0.7
        visual_cues:
          - id: small-request
            phrase: "the temporary request drops to six gigabytes"
            targets: [replay]
            color: blue
            linger: 0.25
          - id: save-replay
            phrase: "Record the actual peak and the latency change"
            targets: [trace-decision]
            color: blue
            linger: 0.25
  - id: hardware-contract
    title: "Which number belongs on the memory budget?"
    visual: "Keep device capacity and peak bandwidth on separate axes. Compare the discrete GPU with Apple's shared physical memory and the processes competing for it."
    beats:
      - say: >-
          The runbook worker needs somewhere to hold its bytes and a way to read them as it generates an
          answer. Capacity goes on the memory budget. Bandwidth belongs on a clock. For the RTX
          forty-ninety, the specification gives twenty-four gigabytes of G D D R six X and a
          three-hundred-eighty-four-bit interface, with a peak of one thousand eight gigabytes per
          second. Four-bit weights describe storage. A kernel can unpack those codes and multiply in
          floating point.
        hold: 0.6
        visual_cues:
          - id: pl-hardware-contract-0-0
            phrase: "The runbook worker needs somewhere to hold its bytes and a way to read them as it generates an answer."
            targets: [pl-hardware-contract-trace]
            color: blue
            linger: 0.25
          - id: pl-hardware-contract-0-1
            phrase: "Capacity goes on the memory budget. Bandwidth belongs on a clock."
            targets: [pl-hardware-contract-trace]
            color: blue
            linger: 0.25
          - id: pl-hardware-contract-0-2
            phrase: "For the RTX forty-ninety, the specification gives twenty-four gigabytes of G D D R six X and a three-hundred-eighty-four-bit interface, with a peak of one thousand eight gigabytes per second."
            targets: [pl-hardware-contract-trace]
            color: blue
            linger: 0.25
          - id: pl-hardware-contract-0-3
            phrase: "Four-bit weights describe storage. A kernel can unpack those codes and multiply in floating point."
            targets: [pl-hardware-contract-trace]
            color: blue
            linger: 0.25
      - say: >-
          The Mac Studio configurations in the article use shared memory. The M five Max variants list
          four hundred sixty or six hundred fourteen gigabytes per second, and the M five Ultra lists one
          point two terabytes per second. The maximum supported memory shown for the two families is one
          hundred twenty-eight and five hundred twelve gigabytes respectively. Use those specifications
          to select configurations to test, then time the long logs on the actual machine. Shared
          physical storage lets the CPU and GPU use the same data even when their virtual addresses
          differ.
        hold: 0.6
        visual_cues:
          - id: pl-hardware-contract-1-0
            phrase: "The Mac Studio configurations in the article use shared memory. The M five Max variants list four hundred sixty or six hundred fourteen gigabytes per second, and the M five Ultra lists one point two terabytes per second."
            targets: [pl-hardware-contract-trace]
            color: blue
            linger: 0.25
          - id: pl-hardware-contract-1-1
            phrase: "The maximum supported memory shown for the two families is one hundred twenty-eight and five hundred twelve gigabytes respectively."
            targets: [pl-hardware-contract-trace]
            color: blue
            linger: 0.25
          - id: pl-hardware-contract-1-2
            phrase: "Use those specifications to select configurations to test, then time the long logs on the actual machine."
            targets: [pl-hardware-contract-trace]
            color: blue
            linger: 0.25
          - id: pl-hardware-contract-1-3
            phrase: "Shared physical storage lets the CPU and GPU use the same data even when their virtual addresses differ."
            targets: [pl-hardware-contract-trace]
            color: blue
            linger: 0.25
      - say: >-
          Start the shared-memory budget with what's already on the machine. The operating system and
          other applications take up part of the same pool. Check memory pressure, runtime caches and the
          Metal working-set limit. The amount available can change from one run to the next. MLX
          schedules dependencies between CPU and GPU work on shared arrays. Its execution devices are the
          CPU and GPU. The chip's Neural Engine is outside that interface. Compare compatible runners
          with the same prompts, quality checks and concurrent load.
        hold: 0.6
        visual_cues:
          - id: pl-hardware-contract-2-0
            phrase: "Start the shared-memory budget with what's already on the machine. The operating system and other applications take up part of the same pool."
            targets: [pl-hardware-contract-trace]
            color: blue
            linger: 0.25
          - id: pl-hardware-contract-2-1
            phrase: "Check memory pressure, runtime caches and the Metal working-set limit. The amount available can change from one run to the next."
            targets: [pl-hardware-contract-trace]
            color: blue
            linger: 0.25
          - id: pl-hardware-contract-2-2
            phrase: "MLX schedules dependencies between CPU and GPU work on shared arrays. Its execution devices are the CPU and GPU. The chip's Neural Engine is outside that interface."
            targets: [pl-hardware-contract-trace]
            color: blue
            linger: 0.25
          - id: pl-hardware-contract-2-3
            phrase: "Compare compatible runners with the same prompts, quality checks and concurrent load."
            targets: [pl-hardware-contract-trace]
            color: blue
            linger: 0.25
  - id: pools
    title: "Which pool has to grant the request?"
    visual: "An ordinary device request crosses its own VRAM limit while host memory remains free. A separate host buffer fits. Shared memory instead puts system and model demand on one rail."
    beats:
      - say: >-
