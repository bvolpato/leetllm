  - id: lookup
    title: What does a token ID select?
    visual: Bank occupies row zero in a separate toy vocabulary. Two occurrences gather its
      coordinates from the same table.
    beats:
      - say: Open a different table. What row do river bank and bank deposit share? A token ID selects
          one row in the embedding table. Each column holds one learned feature. Bank is ID zero
          here. Both sentences read the two numbers in row zero.
        caption_starts: [A token ID selects one row]
        hold: 0.7
        visual_cues:
          - id: select
            phrase: A token ID selects one row
            targets:
              - picture
          - id: identical
            phrase: Both sentences read the two numbers
            targets:
              - picture
      - say: On this teaching map, up points toward river and right toward money. Bank begins halfway
          between those directions. Read it in river bank, then in deposit money at the bank. Both
          lookups land at the same point. In a learned table, a meaning can span many coordinates.
        hold: 0.7
        visual_cues:
          - id: halfway
            phrase: Bank begins halfway
            targets:
              - picture
          - id: again
            phrase: Both lookups land at the same point
            targets:
              - picture
      - say: Training can move a stored row. Once you fix the table, its answer depends only on the ID.
          That is what static means here. A model may also encode where the token sits. To use a
          word like deposit, another operation has to read it.
        hold: 0.65
        visual_cues:
          - id: learned
            phrase: Training can move a stored row
            targets:
              - picture
  - id: table-contract
    title: A row lookup is an exact selection
    visual: Build one-hot times E from actual row selection; retain token identity while raw ID order
      has no geometric meaning.
    beats:
      - say: There is one row per vocabulary ID and one column per feature. With vocabulary size V and
          width d, the shape is V by d. Put a one at the ID for bank and zeros at the other IDs.
          Multiply this one-hot row by the table. The zeros discard the other rows and the one
          selects bank. In practice, gather the row directly.
        hold: 0.7
        visual_cues:
          - id: shape
            phrase: the shape is V by d
            targets:
              - picture
          - id: select
            phrase: the one selects bank
            targets:
              - picture
      - say: An ID is an address. Two consecutive addresses can hold unrelated words. Back in the support
          vocabulary, zero selects charge. That row belongs to a different table, so its two
          coordinates are different from the bank row we just read.
        hold: 0.65
        visual_cues:
          - id: charge
            phrase: zero selects charge
            targets:
              - picture
      - say: A tokenizer can split a word into several pieces. That changes which rows you fetch. Each
          piece still has a fixed row in this table. To get a different reading of charge on the
          second ticket, something has to read the rest of that message.
        hold: 0.7
        visual_cues:
          - id: pieces
            phrase: split a word into several pieces
            targets:
              - picture
          - id: static
            phrase: Each piece still has a fixed row
            targets:
              - picture
  - id: neighbors
    title: Count the words around bank
    visual: Each tracked word sends a tally from its actual sentence position to its own bin. The four
