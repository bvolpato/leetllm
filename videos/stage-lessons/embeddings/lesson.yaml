      - say: Search keeps just the word charge from each message. Charge is row zero in this embedding
          table. Send those two numbers to the same index for both searches. Can the two searches
          return different guides?
        caption_starts: [Charge is row zero, Send those two numbers, Can the two searches]
        hold: 2.8
        visual_cues:
