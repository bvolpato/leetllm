  - id: intro
    title: What does “charge” mean here?
    visual: A receipt and a phone show the two meanings of charge. One table row sends identical
      coordinates to both searches. Their first guides stay covered through the question.
    beats:
      - say: On this receipt, a charge is twelve dollars. On this phone, charge means plug it in.
        caption_starts: [On this phone]
        hold: 0.5
        visual_cues:
