            phrase: Put that pair in the river bin
            targets:
              - picture
      - say: The next sentence gives us water, then another river. In the third sentence we find money. In
          the last one we get deposit and one more money. Each dot records one occurrence of a word
          beside bank in this window.
        hold: 0.8
        visual_cues:
          - id: pair-1
            phrase: gives us water
            targets:
              - picture
          - id: pair-2
            phrase: another river
            targets:
              - picture
          - id: pair-3
            phrase: we find money
            targets:
              - picture
          - id: pair-4
            phrase: we get deposit
            targets:
              - picture
          - id: pair-5
            phrase: one more money
            targets:
              - picture
      - say: Six pairs came from those four sentences. Both uses of bank left a trace in one count row. We
          can compress rows like this, train a model to predict the neighbors, or fit the counts
          themselves. Each method gives these observations a different job.
        hold: 0.8
        visual_cues:
          - id: counts
            phrase: Six pairs
            targets:
              - picture
          - id: objectives
            phrase: Each method
            targets:
              - picture
  - id: count-ppmi
    title: Compare an observed pair with its chance baseline
    visual: Trace one count cell through row and column marginals, expected count, ratio, logarithm
      and positive floor; construct zero cells honestly.
    beats:
      - say: We counted bank in a window of four. A two-position window can also pick up shared neighbors.
          Apple and pear both appear with tastes and sweet. Now use a larger, constructed table so
          we can compare counts with chance. Fruit and sweet occur with apple and pear. Water and
          shore occur with river and lake.
        hold: 0.7
        visual_cues:
          - id: matrix
            phrase: use a larger, constructed table
            targets:
              - picture
      - say: Look at apple with fruit. We saw eight pairs. Is that a lot? Start with the margins. Fourteen
          of the fifty-three pairs start with apple. Fifteen of the fifty-three end in fruit. If
          those choices were independent, apple would get fourteen times fifteen over fifty-three
          fruit pairs. That is about three point nine six. We observed roughly twice that count. The
          natural log of the ratio is about point seven zero three.
        caption_starts: [Start with the margins, If those choices were independent, That is about three point nine six, The natural log of the ratio]
        hold: 0.85
        visual_cues:
          - id: marginals
            phrase: Start with the margins
            targets:
              - picture
          - id: expected
            phrase: about three point nine six
            targets:
              - picture
          - id: log
            phrase: about point seven zero three
            targets:
              - picture
      - say: Positive pointwise mutual information keeps a positive log ratio and floors a negative one at
          zero. For an empty cell, write zero directly. That also handles an empty row or a
          completely empty table without taking the log of zero. Rare pairs can earn a large score
          on scant evidence. And hot and cold can both appear near room. Similar usage alone cannot
          tell us whether two words mean the same thing.
        hold: 0.7
        visual_cues:
          - id: floor
            phrase: floors a negative one at zero
            targets:
              - picture
          - id: zeros
            phrase: For an empty cell
            targets:
              - picture
  - id: factorization
    title: Compress context patterns into shared directions
    visual: Construct a rank-two SVD approximation from the actual PPMI matrix and carry labeled rows
      into two axes.
    beats:
      - say: Our table needs one column for each context word. A singular value decomposition rewrites it
          as U times a diagonal matrix of strengths times V transpose. Keep the two strongest
          directions. Scale each of those columns of U by the square root of its strength. Those are
          our two coordinates per word. The corresponding columns of V take the other square roots
          on the context side.
        hold: 0.85
        visual_cues:
          - id: two
            phrase: Keep the two strongest directions
            targets:
              - picture
          - id: scale
            phrase: by the square root of its strength
            targets:
              - picture
      - say: The two leading strengths are about one point four two and one point three five. Follow apple
          and pear. They point the same way and have cosine one. Now compare apple and river. They
          point at right angles and have cosine zero. Those neat angles come from how we built this
          particular count table.
        hold: 0.75
        visual_cues:
          - id: singular
            phrase: The two leading strengths
            targets:
              - picture
          - id: same
            phrase: cosine one
            targets:
              - picture
          - id: cross
            phrase: cosine zero
            targets:
              - picture
      - say: Flip one axis for every word. Apple stays beside pear. Consistently reversing an axis
          preserves the angles even though the coordinates change. Changing the corpus or the number
          of directions you keep can change the neighbors. A successful word analogy tests one such
          relationship. For a real application, check the cases the representation must distinguish.
        hold: 0.75
        visual_cues:
          - id: sign
            phrase: Flip one axis for every word
            targets:
              - picture
  - id: predictive-window
    title: One sentence, two Word2Vec training tasks
    visual: Three neighbors point into a gap in a sentence. Reveal the center word, reverse the
      arrows, and follow one Skip-gram pair into its two embedding tables.
    beats:
      - say: Children, blank, stories each night. In this Word2Vec example, the model gets three
          clues. Continuous bag of words uses children, stories and each to predict the missing
          word. What word would you put in the gap?
        caption_starts: [In this Word2Vec example, Continuous bag of words, What word would you put]
        hold: 2.5
        visual_cues:
          - id: cbow
            phrase: Continuous bag of words
            targets:
              - picture
      - say: Read fills the gap. Turn the arrows around. Skip-gram starts with read and predicts a
          neighbor. Reach at most two positions in either direction. Children is one to the left.
          Stories and each are one and two to the right. That makes three positive training pairs.
          Night is three positions away, so it stays outside the window.
        caption_starts: [Turn the arrows around, Reach at most two positions, That makes three, Night is three positions away]
        hold: 0.75
        visual_cues:
          - id: word
            phrase: Read fills the gap
            targets:
              - picture
          - id: skipgram
            phrase: Turn the arrows around
            targets:
              - picture
          - id: pairs
            phrase: Reach at most two positions
            targets:
              - picture
          - id: night
            phrase: Night is three positions away
            targets:
              - picture
      - say: Take read and stories. Skip-gram takes the input row for read and the output row for
          stories. Their dot product scores this training pair. Later, to compare read with write,
          take both rows from the input table. Cosine compares their directions.
        caption_starts: [Skip-gram takes the input row, Their dot product, Later, Cosine compares]
        hold: 0.75
        visual_cues:
          - id: tables
            phrase: Skip-gram takes the input row
            targets:
              - picture
          - id: compare
            phrase: to compare read with write
            targets:
              - picture
  - id: negative-step
    title: Move the center word by one training step
    visual: Three fixed output rows produce three signed gradient contributions. The center changes
      while a readout recomputes the positive score and loss.
    beats:
      - say: Let read start at one, zero. Give its observed neighbor a separate output row. Their dot
          product is one point two. Now draw two noise rows. These negatives can be real neighbors
          elsewhere. The label belongs to this draw. If a row is drawn twice, count it twice. The
          original sampler raises word frequencies to the three-quarter power and normalizes them.
        hold: 0.8
        visual_cues:
          - id: observed
            phrase: its observed neighbor
            targets:
              - picture
          - id: noise
            phrase: draw two noise rows
            targets:
              - picture
      - say: The loss rewards a high score for the observed pair and low scores on the noise draws. The
          sigmoid turns a score into a number between zero and one. At zero it gives one half. For
          the observed pair, take minus the log of its sigmoid. For each noise pair, negate the
          score first, then take minus the log of the sigmoid. Add those losses.
        hold: 0.8
        visual_cues:
          - id: loss
            phrase: The loss rewards
            targets:
              - picture
      - say: How should the center move? For the observed row, the slope of the loss is the sigmoid of its
          score minus one. Multiply that negative slope by the output row. For each noise row, use
          the sigmoid of its score, with no subtraction. Multiply each slope by its own row. Now add
          the three vectors in the last column. That gives the center gradient. Its first coordinate
          is about minus point eight one three.
        hold: 1.1
        visual_cues:
          - id: positive
            phrase: For the observed row
            targets:
              - picture
          - id: negative
            phrase: For each noise row
            targets:
              - picture
          - id: add
            phrase: Now add the three vectors
            targets:
              - picture
      - say: Our step subtracts one tenth of that gradient from the center. The first coordinate will
          grow. Look at the observed row. Will its score rise or fall?
        hold: 2.5
        visual_cues:
          - id: predict
            phrase: Will its score rise or fall
            targets:
              - picture
      - say: Take the step. The new center scores about one point three against the same observed row, up
          from one point two. The total loss falls from about point eight nine to point eight three.
          We held the outputs fixed so you could follow the center. Training normally updates the
          participating output rows too. This check tells us the local objective improved. We still
          need to measure which words make good neighbors.
        caption_starts: [The new center scores, The total loss falls, We held the outputs fixed]
        hold: 0.8
        visual_cues:
          - id: step
            phrase: Take the step
            targets:
              - picture
  - id: shifted-pmi
    title: How many noise draws compete with an observed pair?
    visual: Keep the apple row fixed, change the number of noise draws, then move from fruit to an
      unobserved water cell with the same column total.
    beats:
      - say: Return to our eight apple and fruit pairs. Suppose the sampler draws noise in proportion to
          context frequency. With one draw per positive pair, apple is expected to meet fruit about
          four times as noise. If we could choose this one dot product freely, its best score would
          be the log of observed pairs divided by expected noise draws. Here that is the same point
          seven zero three we saw in the count table.
        hold: 0.85
        visual_cues:
          - id: optimum
            phrase: the log of observed pairs divided by expected noise draws
            targets:
              - picture
      - say: Make four draws per positive pair. The observed count stays at eight. The expected noise
          count grows to almost sixteen, so the best score turns negative. Levy and Goldberg wrote
          this optimum as PMI minus the natural log of k, the number of draws per positive pair.
        hold: 0.85
        visual_cues:
          - id: four
            phrase: Make four draws per positive pair
            targets:
              - picture
      - say: Now take apple with water. Water has the same column total as fruit, so the expected noise
          stays put. We observed zero such pairs. With only negative pressure, the unrestricted
          optimum goes to minus infinity. A real model shares finite-width vectors across pairs.
          That limits the rank of its score matrix. Regularization and a different noise
          distribution, such as the original three-quarter-power rule, can also change the fit.
        hold: 0.8
        visual_cues:
          - id: absent
            phrase: Now take apple with water
            targets:
              - picture
          - id: capacity
            phrase: limits the rank of its score matrix
            targets:
              - picture
  - id: glove-fit
    title: Fit log counts with a weighted residual
    visual: Trace the actual count through log target, input-output score plus biases, squared
      residual and capped count weighting.
    beats:
      - say: GloVe gives the whole corpus one count table. The observations still come from local windows.
          In the original collection a neighbor two places away contributes one half, so counts can
          be fractional. On each ruler, the yellow mark is the model score. It adds a word-context
          dot product and two biases. Here we have set that score to the log of thirty on all three
          rulers.
        hold: 0.8
        visual_cues:
          - id: score
            phrase: the yellow mark is the model score
            targets:
              - picture
      - say: The blue dot is the log of the observed count. Its distance from the yellow mark is the size
          of the miss. On the middle ruler the marks meet. Count thirty has zero residual. On the
          top ruler the count is three. Subtract log three from log thirty and you get log ten.
          Square that difference and the error is about five point three zero two. GloVe adds up
          weighted squared errors across observed pairs.
        hold: 0.9
        visual_cues:
          - id: targets
            phrase: The blue dot is the log of the observed count
            targets:
              - picture
          - id: zero
            phrase: Count thirty has zero residual
            targets:
              - picture
          - id: error
            phrase: about five point three zero two
            targets:
              - picture
      - say: The weight depends on the count. Divide the count by one hundred, raise that ratio to the
          three-quarter power and cap the result at one. Compare the three bars. Count three gets
          about seven hundredths of the full weight. Thirty gets about four tenths. At one hundred
          the weight reaches one, so three hundred still gets one. Skip empty cells before taking
          any logs. The result is a static vector trained from many windows.
        hold: 0.8
        visual_cues:
          - id: weights
            phrase: The weight depends on the count
            targets:
              - picture
          - id: weight-values
            phrase: Compare the three bars
            targets:
              - picture
  - id: subword-components
    title: Compose an unfamiliar spelling from retained pieces
    visual: Slide bounded character n-grams over play and played, preserve repeated bucket
      occurrences, and construct both sum and exported average.
    beats:
      - say: What could you use for a spelling your table has never seen? Add boundary marks to play and
          played. Slide a three-character window across them. They share the first three pieces,
          including the one that starts at the left boundary. After the y, their pieces differ.
          FastText uses character n-grams like these. The original setup uses lengths three through
          six.
        hold: 0.8
        visual_cues:
          - id: windows
            phrase: Slide a three-character window
            targets:
              - picture
      - say: The displayed strings tell us which spellings overlap. To build a vector, FastText hashes
          each piece to a bucket and fetches its row. In this separate example, the returned IDs are
          zero, zero, one. Take the first row twice. Repeated pieces and hash collisions can both
          repeat a bucket. A known word also has a whole-word row. An unseen spelling uses only its
          subword rows.
        hold: 0.85
        visual_cues:
          - id: occurrences
            phrase: the returned IDs are zero, zero, one
            targets:
              - picture
          - id: oov
            phrase: An unseen spelling uses only its subword rows
            targets:
              - picture
      - say: The three rows sum to two, two. The paper uses a sum for scoring. The word-vector API divides
          by three because three rows were returned. Both coordinates become two thirds. For a
          nonzero vector a positive rescaling keeps the cosine direction and changes the norm and
          raw dot products. To do this for new words, load the full binary model with its subword
          rows. A text export of known word vectors lacks those rows. Measure recall on unseen
          spellings to find out whether the pieces help.
        hold: 0.8
        visual_cues:
          - id: sum
            phrase: The three rows sum to two, two
            targets:
              - picture
          - id: average
            phrase: divides by three
            targets:
              - picture
          - id: export
            phrase: load the full binary model
            targets:
              - picture
  - id: geometry
    title: What changes when an arrow gets longer?
    visual: Keep a horizontal reference and a diagonal candidate on fixed axes. Double the diagonal
      and then normalize it while the dot product and cosine update separately.
    beats:
      - say: To compare a ticket with a guide, we need a score. Take the blue arrow as our reference. Its
          coordinates are one, zero. The other arrow goes one across and one up. Multiply matching
          coordinates and add. The dot product is one.
        hold: 0.7
        visual_cues:
          - id: score
            phrase: The dot product is one
            targets:
              - picture
      - say: Divide that dot product by both lengths and you get cosine similarity. Blue has length one.
          The diagonal has length square root of two. Their cosine is about point seven zero seven.
          Suppose we double the diagonal and keep its direction. Which score will change?
        hold: 3
        visual_cues:
          - id: divide
            phrase: Divide that dot product
            targets:
              - picture
          - id: predict
            phrase: Suppose we double the diagonal
            targets:
              - picture
      - say: Stretch the diagonal. Its dot product doubles. Its length doubles too, so the cosine stays
          put. Now shorten it to unit length. Both arrows have length one, and the dot product
          itself is the cosine. Parallel unit arrows score one, perpendicular arrows zero, and
          opposite arrows minus one. A zero vector has no direction to compare.
        caption_starts: [Its dot product doubles, Its length doubles too, Now shorten it to unit length]
        hold: 0.75
        visual_cues:
          - id: double
            phrase: Stretch the diagonal
            targets:
              - picture
          - id: unit
            phrase: shorten it to unit length
            targets:
              - picture
      - say: That angle has a meaning because both arrows use the same axes. Later we will change the axes
          of a search index and see what happens to its first result.
        hold: 0.7
  - id: context
    title: What can bank borrow from this sentence?
    visual: Two copies of the identical bank vector receive different weighted context updates. Their
      endpoints travel toward river and finance regions.
    beats:
      - say: Bank starts at the blue dot in both sentences. Read the river sentence first. Take half
          the bank arrow. From its tip, add four tenths of river, then one tenth of water.
          Now read the deposit sentence. Start with the same half of bank and add half of money.
        caption_starts: [Read the river sentence, From its tip, then one tenth of water, Now read the deposit sentence]
        hold: 0.85
        visual_cues:
          - id: half
            phrase: Take half the bank arrow
            targets: [picture]
          - id: river
            phrase: add four tenths of river
            targets:
              - picture
          - id: water
            phrase: then one tenth of water
            targets: [picture]
          - id: deposit
            phrase: Start with the same half of bank
            targets: [picture]
          - id: money
            phrase: add half of money
            targets:
              - picture
      - say: Follow each copy of bank from the blue dot to its sum. The river sentence pulls bank up.
          The deposit sentence pulls it right. The blue dot stays put. We now have two contextual
          states from one stored row.
        caption_starts: [The river sentence pulls bank up, The blue dot stays put]
        hold: 0.85
        visual_cues:
          - id: separate
            phrase: Follow each copy of bank
            targets:
              - picture
          - id: mix
            phrase: The river sentence pulls bank up
            targets:
              - picture
      - say: Here we chose the weights. A Transformer learns how to weight information from the
          positions it can read. Attention mixes that evidence. Feed-forward layers then rewrite
          features within a position. A causal model can use the prefix through the current
          position. A bidirectional encoder can also use a clue that comes later.
        hold: 0.75
        visual_cues:
          - id: attention
            phrase: Attention mixes that evidence
            targets:
              - picture
          - id: causal
            phrase: A causal model can use the prefix
            targets:
              - picture
  - id: article-context
    title: Try the two support tickets again
    visual: The two charge dots start on the stored row. Each slides halfway to its own clue. Two live
