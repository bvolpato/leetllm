            color: cyan
            linger: 0.3
          - id: cost-base
            phrase: just over six tenths of a cent per search
            targets:
              - cost-prices
            color: yellow
            linger: 0.3
        caption_starts:
          - The mean is just
      - say: Suppose a policy revision invalidates ten of those cached answers. Those ten requests still need a
          current answer. Keep the same prices, with the cache check included in the full route. With the
          same hundred searches, what happens to the mean cost?
