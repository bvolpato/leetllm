            color: cyan
            linger: 0.4
  - id: retrieval-arithmetic
    title: Compute lexical and vector signals inside the permitted set
    visual: The local term counts and hand-assigned two-dimensional vectors produce separate candidate
      rankings with retained document identities.
    beats:
      - say: Look for parser version two in these two passages. Only the policy contains that exact
          identifier. BM25 counts term occurrences, gives rarer terms more weight and adjusts for
          document length. Add the terms for each passage to get its keyword score. A vector search
          can also find passages that use different wording.
        hold: 0.7
        visual_cues:
          - id: se-retrieval-arithmetic-0
            phrase: Look for parser version two in these two passages
            targets:
              - se-retrieval-arithmetic-mechanism
            color: cyan
            linger: 0.4
          - id: se-retrieval-arithmetic-lexical
            phrase: Add the terms for each passage to get its keyword score
            targets:
              - se-retrieval-arithmetic-mechanism
            color: yellow
            linger: 0.4
      - say: Give the two passages the hand-drawn vectors on these axes. The query points halfway between them.
          For the policy, multiply the matching coordinates and add. The dot product is one and a half.
          Divide by the product of the two lengths. Each length is the square root of the sum of its
          squared coordinates. The exception makes the same angle, so the cosine scores tie. Sorting tied
          scores by document identity puts the exception first. The local code returns zero if a vector
          has zero length.
        hold: 0.75
        visual_cues:
          - id: se-retrieval-arithmetic-1
            phrase: hand-drawn vectors on these axes
            targets:
              - se-retrieval-arithmetic-mechanism
            color: cyan
            linger: 0.35
          - id: se-retrieval-arithmetic-cosine
            phrase: the cosine scores tie
            targets:
              - se-retrieval-arithmetic-mechanism
            color: yellow
            linger: 0.35
      - say: A cross-encoder reads the query and a candidate passage together to score the pair. ColBERT
          keeps a vector for each passage token so it can compare query tokens with passage tokens at
          search time. Try different candidate counts and measure how often the exception survives,
          how well the answer reads and how long the search takes.
        hold: 0.7
        visual_cues:
          - id: se-retrieval-arithmetic-2
            phrase: A cross-encoder reads the query and a candidate passage together
            targets:
              - se-retrieval-arithmetic-mechanism
            color: green
            linger: 0.4
          - id: se-retrieval-arithmetic-interaction
            phrase: ColBERT keeps a vector for each passage token
            targets:
              - se-retrieval-arithmetic-mechanism
            color: yellow
            linger: 0.4
  - id: rrf-rule
    title: Add one reciprocal contribution per branch identity
    visual: Rank-owned fractions accumulate into exact document totals after duplicate occurrences are
      removed within each list.
    beats:
      - say: A single keyword search returned the policy twice. Remove the extra copy before you assign ranks.
          Now the policy is first and the exception is second. A result can earn a contribution in each
          separate list where it appears. For that contribution, add a constant to its rank and take the
          reciprocal. That's reciprocal rank fusion.
        hold: 0.75
        visual_cues:
          - id: se-rrf-rule-0
            phrase: A single keyword search returned the policy twice
            targets:
              - se-rrf-rule-mechanism
            color: cyan
            linger: 0.35
          - id: se-rrf-rule-dedup
            phrase: Remove the extra copy before you assign ranks
            targets:
              - se-rrf-rule-mechanism
            color: yellow
            linger: 0.35
      - say: Use sixty for the constant. First place earns one over sixty-one. Second earns one over sixty-two.
          Look across the two lists. Each passage has one first and one second, so the sums are equal. The
          tie goes to the exception because the code sorts equal totals by document identity.
        hold: 0.75
        visual_cues:
          - id: se-rrf-rule-1
            phrase: First place earns one over sixty-one. Second earns one over sixty-two
            targets:
              - se-rrf-rule-mechanism
            color: cyan
            linger: 0.35
          - id: se-rrf-rule-sum
            phrase: Each passage has one first and one second, so the sums are equal
            targets:
              - se-rrf-rule-mechanism
            color: yellow
            linger: 0.35
          - id: se-rrf-rule-tie
            phrase: the code sorts equal totals by document identity
            targets:
              - se-rrf-rule-mechanism
            color: green
            linger: 0.35
      - say: Sixty was a choice in the original study. Test the constant on the questions your readers ask.
          Using ranks lets a keyword match and a similar vector contribute on the same scale. Let's keep
          the tied scores in view and see what happens when a third search adds a vote.
        hold: 0.75
        visual_cues:
          - id: se-rrf-rule-2
            phrase: Using ranks lets a keyword match and a similar vector contribute on the same scale
            targets:
              - se-rrf-rule-mechanism
            color: cyan
            linger: 0.35
  - id: fusion
    title: Fuse ranks without pretending their raw scores share a scale
    visual: Preserve the original computed fusion construction and its persistent evidence owners. Fuse ranks
      without pretending their raw scores share a scale.
    beats:
      - say: Lexical retrieval can find an exact identifier, while vector retrieval can find related wording. Their
          raw scores use different scales. Reciprocal rank fusion instead adds a contribution determined by
          each passage rank in each list. Keep ranks one-based and remove duplicates inside a branch so
          repetition cannot manufacture extra support.
        hold: 0.65
        visual_cues:
          - id: fusion-beat-1-focus-1
            phrase: Reciprocal rank fusion instead adds a contribution determined by each passage rank in each list
            targets:
              - fusion-lexical-list
              - fusion-dense-list
              - fusion-policy-total
              - fusion-exception-total
            color: cyan
            linger: 0.65
          - id: fusion-beat-1-focus-2
            phrase: Their raw scores use different scales
            targets:
              - fusion-list-map-doc-rank-doc-rank-1-1-61-rank
            color: yellow
            linger: 0.65
      - say: These supplied lists initially give the two required passages equal fused scores. An additional
          authorized rewrite branch changes their order. That can improve a retrieval candidate set, yet the
          generated rewrite remains query expansion rather than evidence. A reranker and held-out labels still
          need to test which passages are useful for the actual question.
        hold: 0.65
        visual_cues:
          - id: fusion-beat-2-focus-1
            phrase: These supplied lists initially give the two required passages equal fused scores
            targets:
              - fusion-policy-total
              - fusion-exception-total
            color: cyan
            linger: 0.65
          - id: fusion-beat-2-focus-2
