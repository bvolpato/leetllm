  - id: economics
    title: What does a cache miss cost?
    visual: Ten requests in a fixed hundred-request sample switch from valid cache hits to full synthesis.
      Each route's request count and unit price determine the mean.
    beats:
      - say: Follow one hundred searches from one sample of traffic. Sixty use full synthesis, thirty reuse
          valid cached answers, and ten need a live lookup. The prices on the right include the work of
          each whole route. Multiply each price by its request count, add the charges and divide by one
          hundred. The mean is just over six tenths of a cent per search.
