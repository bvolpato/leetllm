  - id: labeled-metrics
    title: Measure retrieval identity coverage against actual labels
    visual: Deduplicated ranked identities accumulate binary gain and rank discount against the known authorized
      gold set.
    beats:
      - say: The actual metric function first removes duplicate document identities, then takes K results. Recall is
          the number of distinct relevant retrieved documents divided by the full relevant-set size. If that
          gold set is empty, it returns not applicable rather than treating an unanswerable question as a
          failed retrieval.
        hold: 0.7
        visual_cues:
          - id: se-labeled-metrics-0
            phrase: The actual metric function first removes duplicate document identities, then takes K results
            targets:
              - se-labeled-metrics-mechanism
            color: cyan
            linger: 0.4
          - id: se-labeled-metrics-dedup
            phrase: first removes duplicate document identities, then takes K results
            targets:
              - se-labeled-metrics-mechanism
            color: yellow
            linger: 0.4
      - say: For this binary relevance fixture, each relevant rank contributes one divided by the base-two logarithm
          of the quantity rank plus one. Sum those discounted gains, then divide by the ideal ordering’s
          discounted gain. This is normalized discounted cumulative gain. Nonpositive K is rejected.
        hold: 0.7
        visual_cues:
          - id: se-labeled-metrics-1
            phrase: For this binary relevance fixture, each relevant rank contributes one divided by the base-two
              logarithm of the quantity rank plus one
            targets:
              - se-labeled-metrics-mechanism
            color: yellow
            linger: 0.4
          - id: se-labeled-metrics-formula
            phrase: divide by the ideal ordering’s discounted gain
            targets:
              - se-labeled-metrics-mechanism
            color: yellow
            linger: 0.4
      - say: The gold set requires policy and exception. Retrieving policy then an irrelevant FAQ gives recall one
          half and normalized gain about point six one three one. Retrieving both gives one for each.
          A second copy of the policy still earns just one hit. Read the generated answer next.
          Did it keep the approval condition that retrieval found?
        hold: 0.7
        visual_cues:
          - id: se-labeled-metrics-2
            phrase: The gold set requires policy and exception
            targets:
              - se-labeled-metrics-mechanism
            color: green
            linger: 0.4
          - id: se-labeled-metrics-half
            phrase: normalized gain about point six one three one
            targets:
              - se-labeled-metrics-mechanism
            color: yellow
            linger: 0.4
          - id: se-labeled-metrics-both
            phrase: Retrieving both gives one for each
            targets:
              - se-labeled-metrics-mechanism
            color: yellow
            linger: 0.4
  - id: failure-attribution
    title: Repair the layer that lost the evidence
    visual: The same required exception is traced through retrieval, packing and synthesis so distinct failures
      point to distinct interventions.
    beats:
      - say: Use held-out questions with authorized relevant passages, expected conditions and human-labeled claims.
          Include deleted sources, conflicts, injected instructions, missing exceptions, permission changes
          during streams and repeated IDs. For each question, trace the passage the reader needed from
          retrieval through to the answer.
        hold: 0.7
        visual_cues:
          - id: se-failure-attribution-0
            phrase: Use held-out questions with authorized relevant passages, expected conditions and human-labeled claims
            targets:
              - se-failure-attribution-mechanism
            color: cyan
            linger: 0.4
      - say: Missing current policy points to ingestion or retrieval. A retrieved exception missing from context
          points to packing. If both passages reached the generator, check the sentence it wrote.
          Did it drop the approval condition? Inspect generation and claim checking. An unauthorized
          citation points to the access path regardless of relevance.
        hold: 0.7
        visual_cues:
          - id: se-failure-attribution-1
            phrase: Missing current policy points to ingestion or retrieval
            targets:
              - se-failure-attribution-mechanism
            color: yellow
            linger: 0.4
          - id: se-failure-attribution-pack
            phrase: A retrieved exception missing from context points to packing
            targets:
              - se-failure-attribution-mechanism
            color: yellow
            linger: 0.4
          - id: se-failure-attribution-support
            phrase: check the sentence it wrote
            targets:
              - se-failure-attribution-mechanism
            color: yellow
            linger: 0.4
          - id: se-failure-attribution-security
            phrase: An unauthorized citation points to the access path regardless of relevance
            targets:
              - se-failure-attribution-mechanism
            color: yellow
            linger: 0.4
      - say: With few labeled answers, a RAGAS judge can help flag claims to inspect. People also leave
          clues when they click a citation or rephrase a question. To find out whether the answer was
          right, compare it with the permitted sources and human labels. Track access failures separately
          from relevance, along with checked-claim latency, completion, errors, cost and memory.
          Count searches that failed or withheld an answer, too.
        hold: 0.7
        visual_cues:
          - id: se-failure-attribution-2
            phrase: a RAGAS judge can help flag claims to inspect
            targets:
              - se-failure-attribution-mechanism
            color: green
            linger: 0.4
