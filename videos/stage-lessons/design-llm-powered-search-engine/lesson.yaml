scenes:
  - id: intro
    title: Two hits for one search
    visual: Two policy passages slide out beneath Alice’s search for a migration date. Their deadlines
      stay beside the question as her approval record changes and the permitted window fills.
    beats:
      - say: Can we start the migration on day forty-five? Alice's search turns up two deadlines. The policy
          gives her thirty days from the deprecation notice. For a service account like hers, the exception
          allows sixty days with security approval. Alice's approval is pending. Which deadline applies today?
        hold: 2.6
        visual_cues:
          - id: intro-start
            phrase: Can we start the migration on day forty-five
            targets:
              - intro-query
            color: yellow
            linger: 0.3
          - id: intro-general
            phrase: The policy gives her thirty days from the deprecation notice
            targets:
              - intro-policy
              - migration-base
            color: blue
            linger: 0.3
          - id: intro-exception
            phrase: allows sixty days with security approval
            targets:
              - intro-exception-page
              - migration-extension
            color: green
            linger: 0.3
          - id: intro-pending
            phrase: Alice's approval is pending
            targets:
              - migration-record
            color: cyan
            linger: 0.3
          - id: intro-question
            phrase: Which deadline applies today
            targets:
              - migration-decision
            color: yellow
            linger: 0.3
        caption_starts:
          - Alice's search
          - The policy gives her
          - For a service account
          - Alice's approval is pending
          - Which deadline applies today
      - say: Thirty days. Day forty-five falls outside the window. Now security approves the migration.
          The window extends to sixty days. Alice can keep her date. A search answer needs those four
          words from the exception, only with security approval.
        hold: 1.2
        visual_cues:
          - id: intro-outside
            phrase: Thirty days
            targets:
              - migration-decision
            color: yellow
            linger: 0.3
          - id: intro-approved
            phrase: Now security approves the migration
            targets:
              - migration-record
            color: cyan
            linger: 0.3
          - id: intro-extend
            phrase: The window extends to sixty days
            targets:
              - migration-extension
            color: green
            linger: 0.3
        caption_starts:
          - Day forty-five falls
          - Now security approves
          - The window extends
          - Alice can keep her date
          - A search answer needs
  - id: answer-contract
    title: What does Alice’s answer need to say?
    visual: A draft cites the general policy and the exception. Its last few words disappear while both
      original passages remain readable.
    beats:
      - say: Suppose Alice asks the search engine which window applies, without telling it about her approval.
          It can still give her a useful answer. Start within thirty days of the notice, or within sixty
          for a service account with security approval. Look what happens if the draft drops the last four
          words of the exception. Someone with a pending request could read that draft and choose day
          forty-five.
        hold: 1.2
        visual_cues:
          - id: se-answer-contract-0
            phrase: Start within thirty days of the notice
            targets:
              - se-answer-contract-mechanism
            color: cyan
            linger: 0.3
          - id: se-answer-contract-condition
            phrase: drops the last four words of the exception
            targets:
              - se-answer-contract-mechanism
            color: yellow
            linger: 0.3
      - say: Each source passage is a chunk the engine can retrieve. An embedding represents its content as
          numbers for similarity search. A reranker compares a smaller set of passages more closely with
          Alice's question. When the generator uses those passages to write its reply, that's
          retrieval-augmented generation. The application still has to check who may read each passage and
          whether each citation supports the answer.
        hold: 0.7
        visual_cues:
          - id: se-answer-contract-1
            phrase: Each source passage is a chunk
            targets:
              - se-answer-contract-mechanism
            color: cyan
            linger: 0.3
      - say: Here the two documents fit together because one explicitly grants an exception. If two current
          sources disagree and neither explains which governs, report the conflict. If a required source
          is missing, say what's missing or show links Alice is allowed to open. We'll use a fictional
          workload to price and time that search.
        hold: 0.7
        visual_cues:
          - id: se-answer-contract-2
            phrase: one explicitly grants an exception
            targets:
              - se-answer-contract-mechanism
            color: cyan
            linger: 0.3
          - id: se-answer-contract-conflict
            phrase: report the conflict
            targets:
              - se-answer-contract-mechanism
            color: yellow
            linger: 0.3
  - id: ingest-identity
    title: Publish a source representation with defined offsets
    visual: An immutable revision retains normalized text, hash, character spans and access metadata while index
      publication waits for its required entries.
    beats:
      - say: Before a passage becomes searchable, bind document and revision identity, tenant, original text or a
          retained snapshot, source offsets, content hash, publication and effective times, and access
          metadata. Define the offset representation. Normalized-text character positions are not byte
          positions in original HTML; retain the normalization version.
        hold: 0.7
        visual_cues:
          - id: se-ingest-identity-0
            phrase: Before a passage becomes searchable, bind document and revision identity, tenant, original text or a
              retained snapshot, source offsets, content hash, publication and effective times, and access
              metadata
            targets:
              - se-ingest-identity-mechanism
            color: cyan
            linger: 0.4
          - id: se-ingest-identity-offset
            phrase: Normalized-text character positions are not byte positions in original HTML
            targets:
              - se-ingest-identity-mechanism
            color: yellow
            linger: 0.4
      - say: Updates must remove or supersede old chunks, and deletions or permission revocation need a deny path that
          can act before embeddings rebuild. Publish an index view only when its necessary metadata and
          entries are ready. A current-revision registry can reject stale candidates while indexes converge.
        hold: 0.7
        visual_cues:
          - id: se-ingest-identity-1
            phrase: Updates must remove or supersede old chunks, and deletions or permission revocation need a deny path
              that can act before embeddings rebuild
            targets:
              - se-ingest-identity-mechanism
            color: yellow
            linger: 0.4
          - id: se-ingest-identity-registry
            phrase: A current-revision registry can reject stale candidates while indexes converge
            targets:
              - se-ingest-identity-mechanism
            color: yellow
            linger: 0.4
      - say: That registry knows only updates it has received. It cannot detect a source change that ingestion has not
          learned. Keep publication, effective time, ingestion time and index publication as distinct clocks.
          A newly crawled old revision is still old policy; a timestamp boost cannot establish which rule
          governs.
        hold: 0.7
        visual_cues:
          - id: se-ingest-identity-2
            phrase: That registry knows only updates it has received
            targets:
              - se-ingest-identity-mechanism
            color: green
            linger: 0.4
          - id: se-ingest-identity-clocks
            phrase: Keep publication, effective time, ingestion time and index publication as distinct clocks
            targets:
              - se-ingest-identity-mechanism
            color: yellow
            linger: 0.4
  - id: authority-scope
    title: Carry authenticated scope through every branch
    visual: A request principal retains one authorized corpus while planner rewrites, parent fetches,
      rerankers, previews, logs and cache paths inherit the same boundary.
    beats:
      - say: Derive tenant and group membership in trusted service code. Apply scope to raw and rewritten
          searches, speculative branches, parent-document fetches, external rerankers, citation previews,
          logs and cache lookup. Missing access metadata denies a document. A query or a source
          instruction cannot widen that scope.
        hold: 0.7
        visual_cues:
          - id: se-authority-scope-0
            phrase: Derive tenant and group membership in trusted service code
            targets:
              - se-authority-scope-mechanism
            color: cyan
            linger: 0.4
      - say: Prefer candidate filtering during retrieval before top K truncation when supported. If the backend
          requires filtering afterward, continue scanning or over-fetch within a bounded budget and
          measure authorized recall. Recheck current permissions before text crosses into a less-trusted
          component and again before publication.
        hold: 0.7
        visual_cues:
          - id: se-authority-scope-1
            phrase: Prefer candidate filtering during retrieval before top K truncation when supported
            targets:
              - se-authority-scope-mechanism
            color: yellow
            linger: 0.4
          - id: se-authority-scope-recheck
            phrase: Recheck current permissions before text crosses into a less-trusted component and again before
              publication
            targets:
              - se-authority-scope-mechanism
            color: yellow
            linger: 0.4
      - say: "Alice can see the same two passages even when their scores change. Only one document contains the
          word approval. Count it among two eligible documents, then among all four. The word looks rarer
          in the larger index. Elastic describes this distinction for document-level security: filtering
          the results leaves the global scoring statistics intact. To isolate scores and timing as well as
          returned text, you may need separate indexes and tests of the whole path."
        hold: 0.75
        visual_cues:
          - id: se-authority-scope-2
            phrase: Only one document contains the word approval
            targets:
              - se-authority-scope-mechanism
            color: cyan
            linger: 0.35
          - id: se-authority-scope-statistics
            phrase: filtering the results leaves the global scoring statistics intact
            targets:
              - se-authority-scope-mechanism
            color: yellow
            linger: 0.35
  - id: eligible
    title: Two retrieval slots for Alice’s question
    visual: Four source identities feed two fixed slots in the trusted service. Taking two before checking
      eligibility empties them. Checking the same population first fills them with both required
      identities.
    beats:
      - say: In this example the search backend has room for two hits. Inside the trusted service, the highest
          match is another workspace's roadmap. Next comes the obsolete ninety-day rule. The current
          policy and its exception are farther down. Take the first two. After Alice's access and the
          current revisions are checked, how many usable passages are left in those slots?
        hold: 2.3
        visual_cues:
          - id: eligible-order
            phrase: the highest match is another workspace's roadmap
            targets:
              - eligible-population
            color: cyan
            linger: 0.3
          - id: eligible-take
            phrase: Take the first two
            targets:
              - eligible-slots
            color: blue
            linger: 0.3
          - id: eligible-predict
            phrase: how many usable passages are left in those slots
            targets:
              - eligible-count
            color: yellow
            linger: 0.3
        caption_starts:
          - Take the first two
          - After Alice
      - say: Both slots empty out. A generator that sees this result has neither source. Run the same list
          again. Check eligibility before taking two. Now the current policy and the exception fill the
          slots. If the backend can only filter a result page, keep scanning within a budget and measure
          how often the needed passages survive. When a newer policy hasn't reached the index, fetch the
          authorized current source or tell Alice what's missing.
        hold: 1
        visual_cues:
          - id: eligible-discard
            phrase: Both slots empty out
            targets:
              - eligible-slots
            color: yellow
            linger: 0.3
          - id: eligible-before
            phrase: Check eligibility before taking two
            targets:
              - eligible-population
            color: cyan
            linger: 0.3
          - id: eligible-refill
            phrase: the current policy and the exception fill the slots
            targets:
              - eligible-slots
            color: green
            linger: 0.3
        caption_starts:
          - Run the same list again
          - Now the current policy
  - id: source-router
    title: Keep freshness independent of route selection
    visual: The actual Plan function builds live and document routes independently and retains its separate
      current-revision flag.
    beats:
      - say: Is build ten forty-two still running, and which migration policy applies? The build service
          knows the job's live status. The current policy lives in the document index. A hot index
          can pick up release notes quickly. A warm index can serve stable manuals. A build report
          in either index describes the job when someone wrote it.
        hold: 0.7
        visual_cues:
          - id: se-source-router-0
            phrase: The build service knows the job's live status
            targets:
              - se-source-router-mechanism
            color: cyan
            linger: 0.4
      - say: Our router lowercases the question and looks for keywords. The build identifier opens the live
          API route. The word migration also opens document search. If the question has no live terms,
          document search is the default. Asking for policy, or using words like current or latest,
          requires the current revision. Both routes use Alice's permissions.
        hold: 0.7
        visual_cues:
          - id: se-source-router-1
            phrase: Our router lowercases the question and looks for keywords
            targets:
              - se-source-router-mechanism
            color: yellow
            linger: 0.4
          - id: se-source-router-both
            phrase: The build identifier opens the live API route
            targets:
              - se-source-router-mechanism
            color: yellow
            linger: 0.4
          - id: se-source-router-policy
            phrase: The word migration also opens document search
            targets:
              - se-source-router-mechanism
            color: yellow
            linger: 0.4
          - id: se-source-router-freshness
            phrase: requires the current revision
            targets:
              - se-source-router-mechanism
            color: yellow
            linger: 0.4
      - say: Keep the build identifier, dates and negations when rewriting the question. HyDE generates a
          hypothetical document and uses its vector to search. Here that vector points straight at the
          exception. The generator can now cite the original passage. If a route fails, search within the
          same permissions or ask which source the reader needs.
        hold: 0.7
        visual_cues:
          - id: se-source-router-2
            phrase: Keep the build identifier, dates and negations
            targets:
              - se-source-router-mechanism
            color: green
            linger: 0.4
          - id: se-source-router-hyde
            phrase: that vector points straight at the exception
            targets:
              - se-source-router-mechanism
            color: yellow
            linger: 0.4
          - id: se-source-router-hyde-construct
