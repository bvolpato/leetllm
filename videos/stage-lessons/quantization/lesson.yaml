    title: Choose weights, activations and cache separately
    visual: Three owned precision controls alter separate weight, activation and cache allocations. A SmoothQuant
      paired transform moves range without altering the real-valued product; versioned backend restrictions
      remain explicit.
    beats:
      - say: >-
