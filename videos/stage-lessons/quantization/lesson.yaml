            color: blue
            linger: 0.5
      - say: >-
          Run three held-out inputs through the layer on each grid. Compute all three output residuals by
          subtracting each rounded output from its source output, then average their squares. On the
          two-bit grid the mean squared error is about one. Four bits brings it down to about seven
          hundredths. On the eight-bit grid it falls to about two ten-thousandths.
