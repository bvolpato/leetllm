      block. Follow one code and both sets of coefficients through reconstruction. Inspect the tensor
      types selected by a model preset.
    beats:
      - say: One Q-four-K superblock holds two hundred fifty-six weights, arranged as eight sub-blocks of thirty-two.
          Four-bit codes use one hundred twenty-eight bytes. Each sub-block has a six-bit scale coefficient
          and a six-bit minimum coefficient. Eight such pairs use ninety-six bits, or twelve bytes. Two FP16
          super-scales add four bytes. Together that is one hundred forty-four bytes, or four point five bits
          per weight.
