            phrase: Keep three precision decisions separate
            targets:
              - precision-roles-state-0
            color: blue
            linger: 0.5
      - say: Activation outliers can stretch a shared grid. SmoothQuant uses an equivalent paired rescaling to
          transfer some of that difficulty from activations into weights before W-eight-A-eight quantization.
          Like the earlier identity, its pre-quantization real-valued product is preserved by multiplying and
          dividing corresponding channels. Which graph operations absorb scaling, and what finite precision
          changes, depend on the implementation. Evaluate the transformed, quantized artifact on held-out
