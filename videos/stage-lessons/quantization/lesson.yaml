        visual_cues:
          - id: q4k-unpack-build-0
            phrase: Together that is one hundred forty-four bytes
            targets:
              - q4k-unpack-state-0
            color: blue
            linger: 0.5
          - id: q4k-code-owners
            phrase: eight sub-blocks of thirty-two
            targets:
              - q4k-unpack-state-0
            color: cyan
            linger: 0.4
          - id: q4k-coefficients
            phrase: Eight such pairs use ninety-six bits
            targets:
              - q4k-unpack-state-0
            color: yellow
            linger: 0.4
          - id: q4k-super-factors
            phrase: Two FP16 super-scales add four bytes
            targets:
              - q4k-unpack-state-0
            color: pink
            linger: 0.4
      - say: The reconstruction has the form d times local scale coefficient times code, minus d-minimum times local
          minimum coefficient. For a supplied arithmetic example, take d point one, scale coefficient three,
          code five, d-minimum point two and minimum coefficient two. The value is one point five minus point
