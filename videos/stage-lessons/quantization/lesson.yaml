version: 1
id: quantization
title: "Model Quantization: Which File Can Route the Parcel?"
opening: lesson
source: fundamentals/model-quantization-gptq-awq-gguf/content.md
voice: af_heart
scenes:
  - id: intro
    title: Where does this weight land?
    visual: >-
      A weight hangs between the only two nearby marks on a four-bit grid. Follow its snap to the
      nearest mark, read the bits for that mark, then watch the change travel into one multiplication.
    beats:
      - say: >-
          This model weight is point seven three. Our four-bit grid has a mark at every tenth.
          Which mark is closest?
        hold: 2.1
        visual_cues:
          - id: original-weight
            phrase: "This model weight is point seven three"
            targets: [weight-marker]
            color: blue
      - say: >-
          Point seven. Count tenths from zero and that mark has code seven. We store it as four bits.
          Reading that code gives us the nearest mark. Choosing one of those marks is quantization.
          The distance the dot moved, three hundredths, is the rounding error.
        hold: 0.6
        caption_starts:
          - "We store it as four bits"
          - "The distance the dot moved"
        visual_cues:
          - id: compact-code
            phrase: "Point seven. Count tenths"
            targets: [weight-marker]
            color: cyan
            caption_boundary: true
          - id: stored-bits
            phrase: "We store it as four bits"
            targets: [stored-code]
            color: cyan
      - say: >-
          Multiply both weights by the same input, one and a half. The output moves from one point zero
          nine five to one point zero five. The input multiplied the rounding error by one and a half, too.
        hold: 0.8
        visual_cues:
          - id: changed-computation
            phrase: "The output moves from one point zero nine five to one point zero five"
            targets: [product-step]
            color: cyan
            caption_boundary: true
  - id: payload
    title: Where do the missing bytes go?
    visual: The same fourteen weight cells retain their identities while sixteen bits become four. The cells
      occupy a quarter of the width; a real scale strip and distinct runtime allocations then join the budget.
    beats:
      - say: >-
          Now store seven billion weights. One sixteen-bit weight takes two bytes. Lay those weights
          end to end and they fill this fourteen-gigabyte row.
        visual_cues:
          - id: full-weight-payload
            phrase: fill this fourteen-gigabyte row
            targets:
              - full-weight-payload
            color: blue
          - id: weight-storage
            phrase: two bytes
            targets:
              - payload-b-mathrm-payload-frac-n-b-8
            color: yellow
        hold: 0.5
      - say: >-
          Take just the codes. Watch the same cells travel into a row a quarter as wide. Each weight now
          gets four bits. The number of weights stays fixed.
        visual_cues:
          - id: compact-weight-payload
            phrase: Watch the same cells travel
            targets:
              - packed-weight-payload
            color: cyan
        hold: 0.5
      - say: >-
          To recover a value from a code, store scales alongside the row. Activations, workspace and
          attention memory still need space when the model runs.
        visual_cues:
          - id: scale-metadata
            phrase: store scales
            targets:
              - scale-metadata
            color: yellow
          - id: runtime-resources
            phrase: Activations, workspace and attention memory
            targets:
              - runtime-memory
            color: pink
        hold: 0.5
  - id: budget-inventory
    title: Count the complete weight inventory
    visual: >-
      Compare four payloads for 27 billion weights on one decimal GB axis. Add the FP16 scale bytes to
      the four-bit row. The 24 GB line marks the capacity left for other allocations.
    beats:
      - say: >-
          Try a larger model with twenty-seven billion weights. Sixteen bits per weight means fifty-four
          decimal gigabytes. At eight bits, it needs twenty-seven. At four bits, thirteen and a half. Three
          bits brings the payload down to just over ten. Keep the unit consistent. A gigabyte is a billion
          bytes. A gibibyte is two to the thirtieth bytes.
        hold: 0.7
        visual_cues:
          - id: budget-inventory-build-0
            phrase: Keep the unit consistent
            targets:
              - budget-inventory-state-0
            color: blue
            linger: 0.5
          - id: budget-bits-16
            phrase: fifty-four decimal gigabytes
            targets:
              - budget-inventory-state-0
            color: blue
            linger: 0.4
          - id: budget-bits-8
            phrase: At eight bits, it needs twenty-seven
            targets:
              - budget-inventory-state-0
            color: cyan
            linger: 0.4
          - id: budget-bits-4
            phrase: At four bits, thirteen and a half
            targets:
              - budget-inventory-state-0
            color: green
            linger: 0.4
          - id: budget-bits-3
            phrase: Three bits brings the payload down to just over ten
            targets:
              - budget-inventory-state-0
            color: pink
            linger: 0.4
      - say: >-
          Now add one two-byte scale for every hundred twenty-eight weights. The yellow sliver adds about
          four tenths of a gigabyte. Codes and scales together take just under fourteen gigabytes, or about
          thirteen gibibytes. This assumes full groups. Partial groups, zero-points and tensors kept at
          higher precision can all add bytes.
        hold: 0.7
        visual_cues:
          - id: budget-inventory-build-1
            phrase: Now add one two-byte scale
            targets:
              - budget-inventory-state-1
            color: cyan
            linger: 0.5
      - say: >-
          Draw the line at twenty-four gigabytes. We have about ten left for everything else. On a real
          model such as Qwen three point six, the twenty-seven-billion language model also comes with a
          vision encoder and a mix of layer types. Measure the remaining allocations, including cache and
          temporary buffers, at the context length you intend to serve.
        hold: 0.7
        visual_cues:
          - id: budget-inventory-build-2
            phrase: Measure the remaining allocations
            targets:
              - budget-inventory-state-2
            color: yellow
            linger: 0.5
  - id: grid
    title: Which mark will the code name?
    visual: On a magnified part of an unsigned four-bit grid, the source weight moves from 0.73 to 0.76.
      The cursor waits between marks before a second dot snaps right. Its gap to the source stays on the ruler.
    beats:
      - say: Here’s the ruler from our first multiplication, enlarged. We’re using unsigned four-bit codes
          with zero-point zero. Each integer step is one tenth. You can see why point seven three was
          closer to point seven than to point eight.
        hold: 0.6
        visual_cues:
          - id: grid-scale
            phrase: Each integer step is one tenth
            targets: [grid-spacing]
            color: blue
      - say: Slide the weight three hundredths to the right. It’s now point seven six. On this same grid,
          which integer code will we store?
        hold: 2.1
        visual_cues:
          - id: new-weight
            phrase: Slide the weight three hundredths to the right
            targets: [raw-weight]
            color: blue
          - id: ask-code
            phrase: which integer code will we store
            targets: [grid-code]
            color: yellow
      - say: Store eight. Reading that code back gives point eight. This time the reconstructed weight
          sits four hundredths above the original. Packing can preserve the code exactly. The loss happened
          when we chose the mark.
        hold: 0.8
        visual_cues:
          - id: nearest-level
            phrase: Store eight
            targets: [grid-code]
            color: cyan
            caption_boundary: true
          - id: rounding-gap
            phrase: four hundredths above the original
            targets: [rounding-residual]
            color: yellow
      - say: To encode a weight on a shifted grid, divide by the scale, round, add the zero-point and clip
          to the available codes. To read the value back, subtract the zero-point and multiply by the scale.
          Let’s build a ruler that also covers negative weights.
        hold: 0.5
        visual_cues:
          - id: codec-steps
            phrase: To encode a weight on a shifted grid
            targets: [encode-decode]
            color: cyan
  - id: affine-range
    title: Which integer represents real zero?
    visual: Follow 0.73 to its nearest level and watch out-of-range inputs stop at the endpoints.
      Switch to signed labels while holding the decoded real values in place.
    beats:
      - say: >-
          Let’s build a ruler that puts real zero at an integer mark. Start with a real interval of positive
          width that includes zero. Divide its width by the number of gaps between codes. That’s the scale.
          To locate zero, round the lower real bound divided by the scale, then subtract it from the minimum
          integer code. Clip the result to the code range. That code is the zero-point.
        hold: 0.7
        visual_cues:
          - id: affine-range-build-0
            phrase: subtract it from the minimum integer code
            targets:
              - affine-range-state-0
            color: blue
            linger: 0.5
      - say: >-
          Our ruler runs from minus one to two. Sixteen unsigned codes give us fifteen gaps, each point two
          wide. Start at minus one and take five steps to reach zero. The zero-point is five. When we read
          any code, subtract five and multiply by point two to recover its value.
        hold: 0.7
        visual_cues:
          - id: affine-range-build-1
            phrase: The zero-point is five
            targets:
              - affine-range-state-1
            color: blue
            linger: 0.5
      - say: >-
          Follow point seven three down its column. Divide by point two, round to four, then add five to
          store code nine. Reading it back gives point eight. Follow three down the last column. It’s past
          the end of the ruler, so the last code gives us two. The left endpoint clips minus two in the same
          way. A format also specifies how to round a tie and what positive scale to use when every value is
          zero.
        hold: 0.7
        visual_cues:
          - id: affine-range-build-2
            phrase: Reading it back gives point eight
            targets:
              - affine-column-3
            color: cyan
            linger: 0.5
          - id: upper-clamp
            phrase: the last code gives us two
            targets: [affine-column-5]
            color: pink
          - id: lower-clamp
            phrase: clips minus two in the same way
            targets: [affine-column-0]
            color: pink
      - say: >-
          Keep the real ruler and change its labels from unsigned to signed four-bit integers. Every label
          shifts down eight. The zero-point becomes minus three. The same code offset gives the same real
          value in each column. A symmetric grid sets its zero-point to zero. An asymmetric grid can land
          there too. With a shared nonzero offset, subtract it in the dot product. A kernel can fold that
          correction into reconstruction.
        hold: 0.7
        visual_cues:
          - id: affine-range-build-3
            phrase: The zero-point becomes minus three
            targets:
              - affine-range-state-3
            color: yellow
            linger: 0.5
  - id: pack
    title: Two little codes share one byte
    visual: Five signed code tiles keep their binary identities while pairing into byte slots. The odd final code
      earns a visible padding nibble. Decoding sends those same codes back to the original positions, where
      reconstructed values can be compared.
    beats:
      - say: >-
          We’ve chosen a code for each weight. Now we can pack them. Two four-bit codes fit inside one byte,
          with every code preserved exactly.
        visual_cues:
          - id: preserve-code
            phrase: two four-bit codes fit inside one byte
            targets:
              - packing-codes
            color: cyan
          - id: code-packing
            phrase: every code preserved exactly
            targets:
              - packing-codes
            color: green
        hold: 0.5
      - say: >-
          Slide each pair into its byte. Each half is called a nibble. Our fifth code gets a padded partner.
        visual_cues:
          - id: pair-nibbles
            phrase: Slide each pair into its byte
            targets:
              - packed-bytes
            color: cyan
          - id: padding-nibble
            phrase: a padded partner
            targets:
              - padding-nibble
            color: yellow
        hold: 0.5
      - say: >-
          Read back those bytes using the stored scale and code count. Stop after the fifth code. The
          recovered values return to their original positions.
        visual_cues:
          - id: decode-codes
            phrase: using the stored scale and code count
            targets:
              - pack-s-frac-2-4-7-quad-n-5
            color: yellow
          - id: shared-metadata
            phrase: recovered values return to their original positions
            targets:
              - reconstructed-weights
            color: blue
        hold: 0.5
  - id: codec-contract
    title: Keep the reconstruction contract with the bytes
    visual: The decoder recovers five weights from C0 F7 02. Change only the stored count to seven. The
      unchanged three payload bytes fall one byte short, so the decoder rejects the file.
    beats:
      - say: >-
          Open the three code bytes. In this signed format, the minus-eight pattern is reserved, so the
          usable codes run from minus seven to seven. Python rounds ties to even. Read the low half of each
          byte first. In C zero that gives zero, then minus four. F seven gives seven, then minus one. The
          last byte starts with two. Our count is five, so decoding stops before the pad.
        hold: 0.7
        visual_cues:
          - id: codec-contract-build-0
            phrase: the minus-eight pattern is reserved
            targets:
              - codec-contract-state-0
            color: blue
            linger: 0.5
      - say: >-
          The count takes four bytes, the scale takes eight, and the codes take three. That’s fifteen bytes
          total. Now change just the stored count from five to seven. Seven codes need four payload bytes.
          We still have three, so the decoder rejects the file. It also rejects an invalid scale, the
          reserved code or a reconstruction that overflows. To measure storage, count these encoded bytes. A
          Python list of the same integers occupies a different layout.
        hold: 0.7
        visual_cues:
          - id: codec-contract-build-1
            phrase: fifteen bytes total
            targets:
              - codec-contract-state-1
            color: cyan
            linger: 0.5
          - id: change-count
            phrase: change just the stored count from five to seven
            targets: [codec-contract-state-1]
            color: yellow
          - id: reject-short-payload
            phrase: the decoder rejects the file
            targets: [codec-contract-state-1]
            color: pink
            caption_boundary: true
  - id: granularity
    title: One giant weight stretches the ruler
    visual: The outlier expands a shared range and visibly collapses small-weight markers. Row and group
      boundaries then localize its influence, separating the same retained markers again. Metadata cost is
      introduced only after that payoff.
    beats:
      - say: Put one giant weight among these small ones. A shared ruler must reach all the way to that outlier. Watch
          the small weights collapse onto the same mark.
        visual_cues:
          - id: outlier-range
            phrase: one giant weight
            targets:
              - outlier-weight
            color: yellow
          - id: collapse-small
            phrase: small weights collapse onto the same mark
            targets:
              - small-weight-separation
            color: red
        hold: 0.5
      - say: Give each row its own ruler. The outlier stretches only its row, and the other rows recover their detail.
          These rows are channels, giving us per-channel scales.
        visual_cues:
          - id: row-scales
            phrase: Give each row its own ruler
            targets:
              - row-scale-groups
            color: blue
          - id: local-grid
            phrase: other rows recover their detail
            targets:
              - small-weight-separation
            color: cyan
        hold: 0.5
      - say: Smaller groups contain the damage even further. Each new ruler costs another scale. We trade extra
          metadata for finer control over the weights.
        visual_cues:
          - id: group-scales
            phrase: Smaller groups contain the damage
            targets:
              - local-scale-groups
            color: cyan
          - id: scale-overhead
            phrase: Each new ruler costs another scale
            targets:
              - granularity-frac-16-128-0-125-mathrm-bits-weight
            color: yellow
        hold: 0.5
  - id: group-sum
    title: Keep each scale beside its own partial sum
    visual: >-
      The first pair of codes gives a partial of 6 with scale 0.25. The second gives 2 with scale 2.
      Their scaled contributions extend the output bar by 1.5 and 4.
    beats:
      - say: >-
          The two blue codes share one scale. Under each code is the input it multiplies. Two times four
          gives eight. Subtract two and we get integer partial six. In pink, three times minus one plus one
          times five gives partial two. Keep the groups apart for one more step.
        hold: 0.7
        visual_cues:
          - id: group-sum-build-0
            phrase: integer partial six
            targets:
              - group-sum-state-0
            color: blue
            linger: 0.5
          - id: group-first-partial
            phrase: integer partial six
            targets:
              - group-sum-state-0
            color: blue
            linger: 0.4
          - id: group-second-partial
            phrase: gives partial two
            targets:
              - group-sum-state-0
            color: pink
            linger: 0.4
      - say: >-
          Scale each partial where it belongs. A quarter of six gives one point five. Two times two gives
          four. Their output is five point five. If we added the two partials first and used the blue scale
          for both, we’d get two instead.
        hold: 0.7
        visual_cues:
          - id: group-sum-build-1
            phrase: Their output is five point five
            targets:
              - group-sum-state-1
            color: cyan
            linger: 0.5
          - id: group-first-scale
            phrase: gives one point five
            targets:
              - group-sum-state-1
            color: blue
            linger: 0.4
          - id: group-second-scale
            phrase: Two times two gives four
            targets:
              - group-sum-state-1
            color: pink
            linger: 0.4
      - say: >-
          A kernel can scale each group’s partial sum or reconstruct each weight before multiplying. Both
          paths need to know which group owns each scale. Preserve group indices, dimensions, scale
          precision and any zero-points when you export the weights.
        hold: 0.7
        visual_cues:
          - id: group-sum-build-2
            phrase: Preserve group indices
            targets:
              - group-sum-state-2
            color: yellow
            linger: 0.5
  - id: output
    title: The same rounding error can matter differently
    visual: Two equal weight errors multiply a quiet input and an active input. The input bars grow first; their
      computed output errors grow next on a common scale. The larger outcome is withheld until the prediction
      is earned.
    beats:
      - say: >-
          A weight multiplies an input value called an activation. The layer adds those products. Suppose a
          weight moves by five hundredths. Which rounding error matters more, the one on an input of a tenth
          or the one on an input of two?
        visual_cues:
          - id: linear-product
            phrase: layer adds those products
            targets:
              - output-y-wx
            color: blue
          - id: input-error
            phrase: which rounding error matters more
            targets:
              - output-delta-y-j-w-j-hat-w-j-x-j
            color: yellow
        hold: 1.1
      - say: >-
          First multiply by the quiet input, one tenth. The output barely moves. Five hundredths times a
          tenth gives five thousandths.
        visual_cues:
          - id: quiet-input
            phrase: multiply by the quiet input
            targets:
              - input-0
            color: cyan
          - id: quiet-output
            phrase: The output barely moves
            targets:
              - layer-output-0
            color: green
        hold: 0.5
      - say: >-
          Now use the active input, two. The same change to the weight moves the output by a tenth. That’s
          twenty times the effect. To decide where accuracy matters, we need the inputs the layer actually
          sees.
        visual_cues:
          - id: active-input
            phrase: Now use the active input
            targets:
              - input-1
            color: yellow
          - id: large-output
            phrase: twenty times the effect
            targets:
              - layer-output-1
            color: yellow
        hold: 0.5
  - id: curvature
    title: Learn which channels move together
    visual: >-
      The columns (5, 1) and (4, 1) each contribute a doubled outer product. Their sum builds the
      Hessian. The diagonal shows channel energy and the off-diagonal shows the cross-products.
    beats:
      - say: >-
          Run a few examples through the model and collect the inputs at this layer. That’s calibration.
          Here are two examples for a two-weight layer. Read down the columns. The first is five and one.
          The next is four and one.
        visual_cues:
          - id: calibration-samples
            phrase: Here are two examples
            targets:
              - calibration-inputs
            color: blue
          - id: calibration-loss
            phrase: two-weight layer
            targets:
              - curvature-mathcal-l-wx-hat-w-x-f-2
            color: yellow
        hold: 0.5
      - say: >-
          Multiply each column by its transpose, double that outer product, and add the two contributions.
          The result is the Hessian for this squared output error. Its diagonal records channel energy. The
          off-diagonal adds the cross-products, twice five times one plus twice four times one. Both
          examples activate the second channel alongside the first.
        visual_cues:
          - id: build-curvature
            phrase: double that outer product, and add
            targets:
              - hessian-matrix
            color: blue
          - id: channel-energy
            phrase: diagonal records channel energy
            targets:
              - hessian-diagonal
            color: yellow
          - id: channel-relationships
            phrase: twice five times one plus twice four times one
            targets:
              - hessian-off-diagonal
            color: cyan
        hold: 0.5
      - say: >-
          If we round one weight down, another weight may compensate. Keep these same inputs and see whether
          it can recover what the first weight lost.
        visual_cues:
          - id: shared-correction
            phrase: another weight may compensate
            targets:
              - hessian-off-diagonal
            color: cyan
          - id: calibrated-limit
            phrase: these same inputs
            targets:
              - calibration-inputs
            color: blue
        hold: 0.5
  - id: gptq
    title: Where should the free weight land?
    visual: >-
      Each calibration input has a ruler centered on its source output. Nearest rounding stays in blue.
      Rounding only the first weight creates two different shortfalls. A common shift moves both cyan
      outputs, then the last code snaps into place. The signed gaps feed two separate sums of squares.
    beats:
      - say: >-
          Keep those two calibration inputs. Five times the first weight plus the second gives six point
          six one. On the next row, four replaces five, so the target is five point four one. Round both
          weights to their nearest whole numbers. One and one give outputs of six and five. Read each
          signed gap as output minus target. Both blue marks fall short.
        hold: 0.8
        visual_cues:
          - id: source-products
            phrase: "Five times the first weight plus the second"
            targets: [calibration-outputs]
            color: yellow
          - id: nearest-rounding
            phrase: "Round both weights to their nearest whole numbers"
            targets: [weight-pairs]
            color: blue
      - say: >-
          Start again from the source weights. Round just the first weight down to one. That costs the top
          row one whole unit of output and the bottom row eight tenths. The second weight still multiplies
          one on both rows. What could we add to that weight to split the difference?
        hold: 2.2
        visual_cues:
          - id: round-first-weight
            phrase: "Round just the first weight down to one"
            targets: [calibration-outputs]
            color: cyan
          - id: two-shortfalls
            phrase: "What could we add to that weight to split the difference"
            targets: [gptq-decision]
            color: yellow
      - say: >-
          Add nine tenths, halfway between those two shortfalls. Both outputs move by the same amount. One
          lands a tenth below its target and the other a tenth above. The free weight has moved from point
          six one to one point five one. Which whole number is closer now?
        hold: 1.8
        visual_cues:
          - id: compensate-free-weight
            phrase: "Add nine tenths"
            targets: [calibration-outputs]
            color: cyan
            caption_boundary: true
          - id: nearest-free-code
            phrase: "Which whole number is closer now"
            targets: [gptq-decision]
            color: yellow
      - say: >-
          Two. Fix the second weight there. The top output moves to seven, the bottom to six. Compare
          their distances from the targets with the blue marks. One miss gets smaller and the other gets
          bigger. Square the gaps and add them. The sum drops by four hundredths. GPTQ uses the curvature
          of the layer’s output error to make this correction while the other weights are still free.
        hold: 0.9
        visual_cues:
          - id: round-adjusted-weight
            phrase: "Two. Fix the second weight there"
            targets: [calibration-outputs]
            color: cyan
            caption_boundary: true
          - id: compare-output-errors
            phrase: "The sum drops by four hundredths"
            targets: [gptq-decision]
            color: cyan
            caption_boundary: true
  - id: held-out
    title: Try the same codes on two fresh inputs
    visual: >-
      The two weight pairs and the target-centered output rulers stay in place. The new inputs turn on one
      channel at a time. Both candidates hit the same point on the first row. On the second row their
      distances from 0.61 separate before the held-out sums appear.
    beats:
      - say: >-
          Keep both pairs of codes exactly as they are. Change only the inputs. One, zero selects the
          first weight by itself. Zero, one selects the second. Which pair stays closer to the source on
          these two fresh inputs?
        hold: 2.1
        visual_cues:
          - id: keep-codes
            phrase: "Keep both pairs of codes exactly as they are"
            targets: [fixed-pairs]
            color: blue
          - id: isolate-channels
            phrase: "Zero, one selects the second"
            targets: [fresh-inputs]
            color: yellow
      - say: >-
          On the first row both pairs return one. They make the same mistake there. On the second row the
          source returns point six one. Nearest rounding returns one, and the compensated pair returns
          two. Which pair has less error now?
        hold: 1.6
        visual_cues:
          - id: first-alone
            phrase: "both pairs return one"
            targets: [fresh-inputs]
            color: blue
            caption_boundary: true
          - id: second-alone
            phrase: "the compensated pair returns two"
            targets: [fresh-inputs]
            color: cyan
            caption_boundary: true
      - say: >-
          Nearest rounding wins on these inputs. Its squared gaps add to about point one nine, against
          nearly two for the compensated pair. The correction helped when both channels fired together.
          Here the second weight acts alone. Choose calibration inputs that resemble traffic, then reload
          the file and test on separate requests with the same tokenizer, prompt and decoding settings.
        hold: 0.8
        visual_cues:
          - id: fresh-score
            phrase: "Nearest rounding wins on these inputs"
            targets: [fresh-evidence]
            color: blue
            caption_boundary: true
  - id: factor-order
    title: Update the still-free coordinates
    visual: Fix the first weight and remove its row and column from the Hessian. Invert the remaining
      four and compare the result with the old full inverse. Then follow the upper factor and block update.
    beats:
      - say: >-
          Go back to the two calibration inputs. We found the best shift by splitting the difference. For
          more weights GPTQ gets the shift from an inverse matrix. Let e be the weight minus its rounded
          value. Take the corresponding column of the inverse and divide by its diagonal entry. Subtract e
          times that ratio from each free weight. Here the ratio is minus four and a half. Subtracting a
          fifth times that negative number raises the neighbor by point nine.
        hold: 0.8
        visual_cues:
          - id: factor-order-build-0
            phrase: raises the neighbor by point nine
            targets:
              - factor-order-state-0
            color: cyan
            linger: 0.5
      - say: >-
          Which matrix do we invert after we fix a weight? Keep just the still-free row and column in the
          Hessian. Here the remaining Hessian is just four. Its inverse is a quarter. The twenty point five
          came from inverting both coordinates together. Using it after the first weight is fixed would
          solve the wrong problem.
        hold: 0.7
        caption_starts:
          - "Keep just the still-free row and column"
        visual_cues:
          - id: fix-coordinate
            phrase: Keep just the still-free row and column
            targets: [factor-order-state-1]
            color: blue
          - id: factor-order-build-1
            phrase: the remaining Hessian is just four
            targets:
              - factor-order-state-1
            color: blue
            linger: 0.5
          - id: invert-free
            phrase: Its inverse is a quarter
            targets: [factor-order-state-1]
            color: cyan
            caption_boundary: true
      - say: >-
          The reference implementation handles dead columns, adds damping to the Hessian and forms an upper
          Cholesky factor of its inverse. The factor’s transpose times the factor gives that damped inverse.
          Its rows let GPTQ apply the corrections in order. Strictly positive damping makes an exact
          positive-semidefinite Hessian positive definite. Relative damping can be zero, and
          finite-precision factorization still needs checking.
        hold: 0.7
        visual_cues:
          - id: factor-order-build-2
            phrase: forms an upper Cholesky factor
            targets:
              - factor-order-state-2
            color: cyan
            linger: 0.5
      - say: >-
          Look at the two rows of errors on this separate worksheet. Each rounded column changes the weights
          still free within its block. After the block, multiply the saved errors by the part of the factor
          that connects to later columns. Subtract that product from those columns in one operation.
          Batching saves repeated updates to the later columns. Each rounding decision within the block
          still depends on the one before it.
        hold: 0.7
        visual_cues:
          - id: factor-order-build-3
            phrase: After the block
            targets:
              - factor-order-state-3
            color: yellow
            linger: 0.5
