        hold: 0.7
        visual_cues:
          - id: precision-roles-build-1
            phrase: transfer some of that difficulty
            targets:
              - precision-roles-state-1
            color: cyan
            linger: 0.5
      - say: Cache quantization needs independent support. The vLLM guide inspected on November sixth, twenty
          twenty-six, describes FP8 cache types and calibration. Per-attention-head scaling is restricted to
          its Flash Attention pathway and the documented calibration route. Check the release, backend and
          supported scheme you actually deploy. Smaller weight codes create more free capacity without
          changing any user’s cache bytes unless you separately change that cache representation.
        hold: 0.7
        visual_cues:
