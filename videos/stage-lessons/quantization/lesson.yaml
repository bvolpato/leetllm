    title: Separate a mapped address from resident bytes
    visual: A GGUF header, typed metadata, tensor descriptors and aligned payload offsets retain a concrete byte
      order. Mapping creates an address range; page reads then populate resident memory, and a distinct
      transfer places tensors on a discrete GPU.
    beats:
      - say: Enlarge the container. GGUF stores a header, typed key-value metadata, tensor descriptors and aligned
          payload data. A tensor descriptor carries its name, dimensions, encoding and offset. Architecture
          and tokenizer metadata can include normalization constants, positional settings, vocabulary, special
          tokens and a chat template. A reader still needs support for the architecture, required keys,
          encodings and format version. Self-description provides information to a compatible loader.
