            color: blue
            linger: 0.5
      - say: >-
          A user caches both a key and a value for every saved position. Multiply the layer count, heads,
          head dimension and positions shown here. At two bytes per element, each user needs about three
          hundred thirty-six decimal megabytes. Divide each pool by that same cost and round down. Integer
