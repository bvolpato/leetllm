            targets:
              - q4k-unpack-state-1
            color: cyan
            linger: 0.5
      - say: Q-four-K is a tensor encoding; Q-four-K-M is a model-level preset. The pinned quantizer primarily chooses
          Q-four-K and upgrades selected projections, with architecture-specific exceptions. The file can
          therefore mix tensor types. Inspect its emitted tensor inventory rather than assigning four point
          five bits to every model parameter from the filename. Container bytes, tensor precision, runtime
          support and quality are separate observations.
        hold: 0.7
        visual_cues:
          - id: q4k-unpack-build-2
            phrase: The file can therefore mix tensor types
            targets:
              - q4k-unpack-state-2
            color: yellow
            linger: 0.5
