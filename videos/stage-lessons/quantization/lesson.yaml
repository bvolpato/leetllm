    beats:
      - say: >-
          Start with these four weights. Round each one on a two-bit, a four-bit and an eight-bit grid. The
          two-bit grid uses only three codes, minus one, zero and one. With a step of two, their marks
          are minus two, zero and two. The first and last weights both land on zero. Look across their
