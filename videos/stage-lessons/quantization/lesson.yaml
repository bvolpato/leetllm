            color: cyan
            linger: 0.5
      - say: >-
          Split execution adds CPU work and transfers to the latency budget. Follow the activation from the
          last CPU block to the first GPU block. The backend schedules that transfer and places the cache.
          Its kernel trace shows which instructions ran. Compare placements with the same requests and check
          both timing and task quality.
        hold: 0.7
        visual_cues:
          - id: offload-count-build-2
            phrase: Split execution adds CPU work
            targets:
              - offload-count-state-2
            color: yellow
            linger: 0.5
  - id: artifact-lineage
    title: Evaluate the file that will actually load
    visual: An immutable high-precision source branches into separately encoded candidates. Each file has its own
      digest and reload path; tokenizer/template/backend checks and optional multimodal components remain
      attached.
    beats:
      - say: Conversion and quantization are separate operations. The documented workflow first converts a supported
          source checkpoint to a high-precision GGUF, then runs the quantizer to produce the selected preset.
          Retain the high-precision source so another preset starts from that source. Requantizing an already
          rounded artifact can compound error. Record source revision, converter, quantizer, tensor types and
          the digest of the actual saved file.
        hold: 0.7
        visual_cues:
          - id: artifact-lineage-build-0
            phrase: Retain the high-precision source
            targets:
              - artifact-lineage-state-0
            color: blue
            linger: 0.5
      - say: Reload that saved artifact before evaluating it. Testing an earlier in-memory object bypasses the export
          and reconstruction path you need to trust. Match the tokenizer, chat template, prompts and decoding
          policy, while recording each path’s actual backend and kernels. A shared seed does not guarantee
          identical text across numerical implementations. Keep the raw outputs and failures so a different
          result can be traced to the correct version.
        hold: 0.7
        visual_cues:
          - id: artifact-lineage-build-1
            phrase: Reload that saved artifact
            targets:
              - artifact-lineage-state-1
            color: cyan
            linger: 0.5
      - say: >-
          A multimodal model may need a separate encoder or projector to handle images or audio. Budget
          every component the service loads, and try a request in each modality it promises. Keep those
          results with the saved artifact.
        hold: 0.7
        visual_cues:
          - id: artifact-lineage-build-2
            phrase: Budget every component
            targets:
              - artifact-lineage-state-2
            color: yellow
            linger: 0.5
  - id: benchmark
    title: Does the smaller artifact earn its place?
    visual: "Meaningful decode traffic and prefill weight reuse occupy separate beats. The camera then gives the
      full frame to a constructed eight-GiB device budget: actual seven-billion-weight code and scale bytes
      plus other runtime memory and a KV allocation. A proposed doubling invites a prediction before the cache
      grows across the boundary; reducing it restores fit."
    beats:
      - say: Small-batch decoding often spends substantial time reading weights. Four-bit codes cut those bytes, while
          unpacking and scaling add work. The faster path depends on the kernel and hardware.
        visual_cues:
          - id: decode-reads
            phrase: Four-bit codes cut those bytes
            targets:
              - decode-weight-traffic
            color: blue
          - id: unpack-scale
            phrase: unpacking and scaling add work
            targets:
              - benchmark-unpack-codes-apply-scales
            color: yellow
        hold: 0.5
      - say: During prefill, many prompt positions reuse each weight block. Watch one block serve several positions.
          Reuse changes the balance between memory traffic and computation, so measure the two phases
          separately.
        visual_cues:
          - id: prefill-reuse
            phrase: Watch one block serve several positions
            targets:
              - prefill-weight-reuse
            color: cyan
          - id: phase-balance
            phrase: Reuse changes the balance
            targets:
              - prefill-weight-reuse
            color: yellow
        hold: 0.5
      - say: Our constructed device budget now holds compressed weights, other runtime memory and the attention cache.
          Double the cache for a longer context. Will this same artifact still fit?
        visual_cues:
          - id: attention-memory
            phrase: holds compressed weights, other runtime memory and the attention cache
            targets:
              - runtime-budget
            color: pink
          - id: context-growth
            phrase: Double the cache for a longer context
            targets:
              - context-budget
            color: yellow
        hold: 1.2
      - say: The longer context crosses the limit.
        visual_cues:
          - id: budget-overflow
            phrase: longer context crosses the limit
            targets:
              - context-budget
            color: red
        hold: 1.2
      - say: >-
          Restore the shorter context. The two-gibibyte cache fits again beside the same weights. We can now
          test fresh-task quality and collect measured timing on the requests the service will handle.
        visual_cues:
          - id: restore-context
            phrase: Restore the shorter context
            targets:
              - context-budget
            color: green
          - id: matched-models
            phrase: fresh-task quality
            targets:
              - budget-result
            color: blue
          - id: quality-time-memory
            phrase: measured timing
            targets:
              - budget-result
            color: green
        hold: 0.5
  - id: paired-evaluation
    title: Did the parcel reach the right dock?
    visual: >-
      Compare two replies to one parcel request, then score a held-out trial. Each model has a square for
      every requested reply. Parsing colors one subset. Checking the destination recolors only successful
      routes. Fifteen of file A’s replies parse but fail the task. Cold loading, time to first token and
      delivered token gaps stay distinct.
    beats:
      - say: >-
          A customer asks for dock seven. Both replies parse as JSON. Read the dock numbers. The source
          sends the parcel to seven. Four-bit file A sends it to one. That counts as a failed delivery.
          Perplexity measures token likelihood on a fixed dataset with a given tokenizer and context policy.
          Here each requested dock gives us a task we can score directly.
        hold: 0.6
        caption_starts:
          - "The source sends the parcel to seven"
          - "Four-bit file A sends it to one"
        visual_cues:
          - id: check-dock
            phrase: "Four-bit file A sends it to one"
            targets: [parcel-replies]
            color: cyan
          - id: paired-evaluation-build-0
            phrase: "Perplexity measures token likelihood"
            targets: [paired-evaluation-state-0]
            color: blue
      - say: >-
          Give each model the same hundred held-out parcel requests. These are example counts. The source
          gives ninety parse-valid outputs and eighty-five fully correct results. File A gives ninety-five
          parse-valid outputs but only eighty fully correct results. Fifteen replies that parsed still
          failed the task. Count every request, including anything rejected or cut short. Correct
          destinations fell from eighty-five to eighty percent.
        hold: 1.1
        visual_cues:
          - id: paired-evaluation-build-1
            phrase: "same hundred held-out parcel requests"
            targets: [paired-evaluation-state-1]
            color: blue
          - id: paired-source-parse
            phrase: "ninety parse-valid outputs"
            targets: [paired-evaluation-state-1]
            color: blue
          - id: paired-source-task
            phrase: "eighty-five fully correct results"
            targets: [paired-evaluation-state-1]
            color: green
          - id: paired-candidate-parse
            phrase: "ninety-five parse-valid outputs"
            targets: [paired-evaluation-state-1]
            color: cyan
          - id: paired-candidate-task
            phrase: "eighty fully correct results"
            targets: [paired-evaluation-state-1]
            color: green
          - id: paired-conclusion
            phrase: "from eighty-five to eighty percent"
            targets: [paired-evaluation-state-1]
            color: yellow
            caption_boundary: true
      - say: >-
          Now time the same requests. Record cold loading and compilation separately from warm runs. Time
          to first token includes queueing. After the first token arrives, measure the gaps the reader
          experiences. Count output tokens across users for throughput, and record peak memory at the
          intended batch sizes and context lengths. Keep stop reasons beside the times. A truncated reply
          can be fast and still leave a parcel unrouted. Repeat stochastic runs and report their task
          scores as well.
        hold: 0.6
        visual_cues:
          - id: paired-evaluation-build-2
            phrase: "Time to first token includes queueing"
            targets: [paired-evaluation-state-2]
            color: blue
  - id: diagnose
    title: Use the symptom to choose the next observation
    visual: >-
      For a failed JSON task, follow the reload, template and decoding checks. For slow decoding or
      prompt ingestion, the picture identifies the placement, kernel and request measurements that can
      distinguish causes.
    beats:
      - say: >-
          Suppose the source routes a parcel correctly and the saved candidate fails. First verify the saved
          artifact and rerun the request with the same tokenizer, chat template and decoding constraints. If
          matching the template fixes it, you have found a cause you can reproduce. If failures cluster on
          traffic missing from calibration, try calibration inputs from that domain. Score the new file on
          separate requests.
        hold: 0.7
        visual_cues:
          - id: diagnose-build-0
            phrase: First verify the saved artifact
            targets:
              - diagnose-state-0
            color: blue
            linger: 0.5
      - say: >-
          If decode slows down after compression, inspect actual device placement and kernel dispatch.
          Compare traces from the two files on the same workload. Look for time spent unpacking, reading the
          cache or waiting in a queue. If the trace shows a full weight matrix written out and read back,
          try a supported fused kernel and time the same requests again.
        hold: 0.7
        visual_cues:
          - id: diagnose-build-1
            phrase: inspect actual device placement
            targets:
              - diagnose-state-1
            color: cyan
            linger: 0.5
      - say: If prompt ingestion is slow, determine whether arithmetic, attention, conversion or scheduling is
          limiting. A supported W-eight-A-eight or FP8 experiment can be useful when arithmetic is the
          bottleneck and quality stays acceptable. If most TTFT comes from queueing, changing weight precision
          may leave that delay intact. Change one plausible mechanism, retain a control, and use the resulting
          evidence to decide the next step.
        hold: 0.7
        visual_cues:
          - id: diagnose-build-2
            phrase: determine whether arithmetic
            targets:
              - diagnose-state-2
            color: yellow
            linger: 0.5
  - id: fresh-quantization
    title: Which four-bit file can run the parcel service?
    visual: >-
      Known cache and runtime allocations fill part of each eight-gigabyte bay. The two weight packages
      compete for the remaining space. File B can touch the limit with a smaller cache. Restore the
      required cache, magnify both allocations around the limit, and bring back file A’s parcel score for
      the release decision.
    beats:
      - say: >-
          Return to the parcel service. Its two candidate files each encode six billion weights. The
          device has eight decimal gigabytes. Reserve four for the cache the service needs and three
          quarters of a gigabyte for everything else in this worksheet. A uses four-bit codes with one
          two-byte scale per sixty-four weights. B uses complete Q four K blocks at four and a half bits
          per weight, metadata included. Which file fits beside the required cache?
        hold: 3
        visual_cues:
          - id: fresh-quantization-build-0
            phrase: "Which file fits beside the required cache"
            targets: [fresh-quantization-state-0]
            color: yellow
      - say: >-
          A needs three gigabytes for codes. Divide six billion by sixty-four and allow two bytes per
          group. The scales add just under two tenths of a gigabyte. Add the cache and other
          allocations. A fits with sixty-two and a half megabytes to spare. B uses three and three
          eighths gigabytes for its complete blocks. With the same cache and other allocations,
          B exceeds the limit by a hundred twenty-five megabytes.
        hold: 0.9
        visual_cues:
          - id: a-code-bytes
            phrase: A needs three gigabytes for codes
            targets: [fresh-quantization-state-1]
            color: cyan
          - id: a-scale-bytes
            phrase: The scales add just under two tenths of a gigabyte
            targets: [fresh-quantization-state-1]
            color: yellow
          - id: b-block-bytes
            phrase: three and three eighths gigabytes for its complete blocks
            targets: [fresh-quantization-state-1]
            color: pink
          - id: fresh-quantization-build-1
            phrase: "Add the cache and other allocations"
            targets: [fresh-quantization-state-1]
            color: blue
          - id: fresh-a-total
            phrase: "A fits with sixty-two and a half megabytes to spare"
            targets: [fresh-quantization-state-1]
            color: cyan
            caption_boundary: true
          - id: fresh-b-total
            phrase: "B exceeds the limit by a hundred twenty-five megabytes"
            targets: [fresh-quantization-state-1]
            color: pink
            caption_boundary: true
      - say: >-
          Could B load on this device at all? Try a smaller cache for B alone. Drop its cache to three
          point eight seven five gigabytes. The total reaches eight gigabytes exactly. That leaves zero
          headroom, and the service wanted the larger cache.
        hold: 1
        caption_starts:
          - "Try a smaller cache for B alone"
        visual_cues:
          - id: fresh-quantization-build-2
            phrase: "Try a smaller cache for B alone"
            targets: [fresh-quantization-state-2]
            color: yellow
          - id: fresh-cache-input
            phrase: "to three point eight seven five gigabytes"
            targets: [fresh-quantization-state-2]
            color: pink
            caption_boundary: true
          - id: fresh-cache-boundary
            phrase: "The total reaches eight gigabytes exactly"
            targets: [fresh-quantization-state-2]
            color: yellow
            caption_boundary: true
      - say: >-
          Put back the required four-gigabyte cache. The service needs at least eighty-five correct
          destinations per hundred requests. File A got eighty. File B still needs a task trial.
          Which file meets both requirements?
        hold: 2.5
        caption_starts:
          - "The service needs"
          - "File A got eighty"
          - "Which file meets both requirements"
        visual_cues:
          - id: restore-required-cache
            phrase: "Put back the required four-gigabyte cache"
            targets: [release-budget]
            color: yellow
          - id: apply-task-minimum
            phrase: "at least eighty-five correct destinations per hundred requests"
            targets: [release-tasks]
            color: cyan
      - say: >-
          Hold both files. File A needs five more correct deliveries per hundred. File B needs another
          hundred twenty-five megabytes to hold the required cache. For the next candidate, reload the saved
          file and route the same parcels. Measure peak memory and token timing at the context length and
          concurrency you plan to serve.
        hold: 1.2
        caption_starts:
          - "File A needs five more correct deliveries per hundred"
          - "File B needs another hundred twenty-five megabytes"
          - "For the next candidate"
        visual_cues:
          - id: service-decision
            phrase: "Hold both files"
            targets: [release-verdict]
            color: yellow
            caption_boundary: true
          - id: delivery-shortfall
            phrase: "File A needs five more correct deliveries per hundred"
            targets: [release-tasks]
            color: yellow
          - id: memory-shortfall
            phrase: "File B needs another hundred twenty-five megabytes"
            targets: [release-budget]
            color: yellow
