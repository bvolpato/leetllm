version: 1
lesson: capstone-production-llm-agent
promise: Use the ticket, saved review, live account and committed SQLite rows to decide what an agent may do next and whether repeating a restore can add an effect.
framing: []
objectives:
  - id: policy-inquiry
    can: Trace a ticket from a trusted intake receipt to a cited reply and identify which proposals the host must block.
    scenes: [intro, intake, source-evidence, loop, dispatch]
  - id: retry-decision
    can: Given a retained decision and a failed write, distinguish the writer’s pending insert from the effect a second connection can read and decide what a retry can change.
    scenes: [approval, replay, expiry, operational-contract]
  - id: first-failed-check
    can: Predict which check stops an execution after a packet edit, a live account change or expiry and give the committed effect count after each attempt.
    scenes: [approval, expiry, synthesis]
  - id: run-evidence
    can: Reconstruct a sequential budget from call receipts and decide whether the observed paths and local effects satisfy the fixture release contract.
    scenes: [trace-budget, evaluation, release-mutations, operational-contract]
sections:
  - heading: Connect earlier capstone contracts
    status: taught
    scenes: [intake, source-evidence, evaluation, operational-contract]
  - heading: Refuse risky intake before planning
    status: taught
    scenes:
      - intake
  - heading: Limit what the planner can request
    status: taught
    scenes:
      - dispatch
  - heading: Retrieve evidence, not instructions
    status: taught
    scenes:
      - source-evidence
      - loop
  - heading: Run one bounded action-observation loop
    status: taught
    scenes:
      - loop
      - source-evidence
  - heading: Prove failure paths before adding a model
    status: taught
    scenes:
      - dispatch
      - evaluation
  - heading: Execute approved writes separately
    status: taught
    note: The stage and approve commands in production_agent.py write separate records. A new process can find the packet before a reviewer has made a decision.
    scenes:
      - approval
      - operational-contract
  - heading: Test expiration, binding, and rollback
    status: taught
    note: The two connections count rows in the same effects table. The fixture rolls back a failed insert and checks packet binding, live eligibility and expiry before it checks for a duplicate.
    scenes:
      - replay
      - expiry
      - synthesis
  - heading: Budget runs using trace evidence
    status: taught
    scenes:
      - trace-budget
  - heading: Evaluate trajectories in the dashboard
    status: taught
    scenes:
