      - release-mutations
  - heading: Hold bad candidates even when they answer well
    status: taught
    scenes:
      - release-mutations
  - heading: What a shippable repository contains
    status: taught
    scenes:
      - operational-contract
  - heading: Deliberately break one agent boundary
    status: taught
    scenes:
      - dispatch
      - source-evidence
