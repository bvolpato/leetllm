  - id: selection-score
    title: "What changes the next pick?"
    visual: "Binary preference estimates earn their least-confidence, margin and entropy readouts. A fresh embedding ruler compares two candidates, then holds the coordinates fixed as a weighted pick and a farthest-first pick leave different covering radii."
    beats:
      - say: >-
          Back at the two-answer preference model, p is the chance that a reviewer picks A. At point four nine
          the two answers are almost even. Least confidence takes one minus the larger probability. Margin
          uncertainty takes one minus the gap between the two. Entropy weights each outcome’s surprise by its
          probability. In bits, those surprises use base two. An outcome with zero probability contributes
          zero.
        hold: 0.6
