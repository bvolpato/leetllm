        hold: 2.1
        visual_cues:
          - id: behavior
            phrase: "Here is a simulated log"
            targets: [test-timeline]
          - id: traffic-event
            phrase: "Traffic changed at ten oh one"
            targets: [test-timeline]
          - id: approval-event
            phrase: "Sign-off arrived at ten oh two"
            targets: [test-timeline]
          - id: ask-behavior
            phrase: "Did this run wait for approval"
            targets: [test-timeline]
      - say: >-
          Traffic moved a minute early. Record a failed approval check for this run. You can use this case
          as independent evidence because its family stayed outside training and tuning. In the next lesson
          on agent evaluation, we check what changed in the environment when the agent acted.
        hold: 1.25
        visual_cues:
          - id: behavior-result
            phrase: "Traffic moved a minute early"
            targets: [test-timeline]
          - id: record-failure
            phrase: "Record a failed approval check for this run"
            targets: [test-result]
