            phrase: "Change the predicted chance of A to point nine seven"
            targets: [binary-preference]
            caption_boundary: true
          - id: confident-least
            phrase: "Least confidence falls to point zero three"
            targets: [least-confidence]
          - id: confident-margin
            phrase: "Margin uncertainty falls to point zero six"
            targets: [margin-uncertainty]
          - id: confident-entropy
            phrase: "about point one nine four bits"
            targets: [entropy]
            caption_boundary: true
      - say: >-
          Try a new review pool on a straight line. The seed is at zero. The appeal is one unit away, with
          uncertainty point nine five. The handoff is five units away, with uncertainty point two. You have one
          place. Use the same sixty percent uncertainty and forty percent distance rule. Which record gets the
          place?
        hold: 2.4
        visual_cues:
          - id: ruler
            phrase: "Try a new review pool"
            targets: [embedding-ruler]
            caption_boundary: true
          - id: appeal-input
            phrase: "The appeal is one unit away"
            targets: [embedding-ruler]
            caption_boundary: true
          - id: handoff-input
            phrase: "The handoff is five units away"
            targets: [embedding-ruler]
            caption_boundary: true
