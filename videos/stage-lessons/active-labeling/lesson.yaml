            targets: [entropy]
            caption_boundary: true
      - say: >-
          For this pair, least confidence is point four nine, margin uncertainty is point nine eight, and
          entropy is almost one bit. Change the predicted chance of A to point nine seven. Least confidence
          falls to point zero three. Margin uncertainty falls to point zero six. Entropy falls to about
          point one nine four bits. All three favor binary
          choices near one half. With more than two options, they can rank cases differently.
        hold: 0.6
        visual_cues:
          - id: uncertain-least
            phrase: "least confidence is point four nine"
            targets: [least-confidence]
            caption_boundary: true
          - id: uncertain-margin
            phrase: "margin uncertainty is point nine eight"
            targets: [margin-uncertainty]
            caption_boundary: true
