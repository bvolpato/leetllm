scenes:
  - id: subject-intro
    title: Which ticket gets the last review?
    visual: Two eligible support tickets slide into view with their predicted A and B shares. The reviewer has one open place. After the prediction, the closer split moves into that place. A separate release case illustrates why reserved and incident evidence take different routes.
    beats:
      - say: >-
          You can review one pair of replies. For the password reset, the model gives reply A a ninety-seven
          percent chance of winning your vote. For the missing approver, it’s fifty-three percent. Which
          pair is closer to a toss-up?
        hold: 2.1
        caption_starts:
          - "For the password reset"
          - "For the missing approver"
          - "Which pair is closer"
        visual_cues:
          - id: reset-split
            phrase: "For the password reset"
            targets: [routine-ticket]
          - id: handoff-split
            phrase: "For the missing approver"
            targets: [handoff-ticket]
      - say: >-
          Send the missing-approver ticket. Its two replies are almost even. Choosing a question this way is
          called uncertainty sampling. The reviewer reads the replies and supplies the label.
        hold: 0.75
        caption_starts:
          - "Choosing a question this way"
        visual_cues:
          - id: take-ticket
            phrase: "Send the missing-approver ticket"
            targets: [review-inbox]
            caption_boundary: true
          - id: name-selector
            phrase: "uncertainty sampling"
            targets: [review-inbox]
      - say: >-
          Now look at a release request. The owner’s email is masked. The reviewer preferred the reply that
          asks for approval. Open the case registry. This request belongs to a private test. The action log
          also records an attempted change before approval. Where should this case go?
        hold: 2.3
        visual_cues:
          - id: release-case
            phrase: "Now look at a release request"
            targets: [masked-owner]
          - id: prefer-a
            phrase: "asks for approval"
            targets: [review-preference]
          - id: read-registry
            phrase: "Open the case registry"
            targets: [reserved-source]
            caption_boundary: true
          - id: read-log
            phrase: "The action log"
            targets: [incident-record]
            caption_boundary: true
          - id: ask-route
            phrase: "Where should this case go"
            targets: [training-boundary]
            caption_boundary: true
      - say: >-
          Keep the frozen test case for evaluation. Send the attempted change to incident review. Training
          on this family would give the model part of its own test.
        hold: 0.7
        visual_cues:
          - id: route-test
            phrase: "Keep the frozen test case for evaluation"
            targets: [reserved-source]
            caption_boundary: true
          - id: route-incident
            phrase: "Send the attempted change to incident review"
            targets: [incident-record]
            caption_boundary: true
          - id: exclude-training
            phrase: "part of its own test"
            targets: [training-boundary]
      - say: >-
          For training, take a different source. Trace two oh four has permission for training and records
          proposed answers. Let's see what a reviewer can make from that pair.
        hold: 0.75
        visual_cues:
          - id: permitted-source
            phrase: "take a different source"
            targets: [permitted-trace]
            caption_boundary: true
  - id: record-types
    title: Each feedback record has a different job
    visual: A cleaned permitted trace supplies the prompt and answers for three training record types. The separate
      reserved source supplies a frozen assertion and the recorded unsafe event.
    beats:
      - say: >
          This is the cleaned copy of trace two oh four. A demonstration pairs a prompt with an approved target answer.
          Keep the request and A to teach what to say. A pointwise assessment scores one completion. Here it records
          the reviewer’s safety and correctness checks for A. A preference pair records which answer better follows
          a rubric. For that job, keep both answers and the choice between them.
        hold: 0.6
        visual_cues:
          - id: training-signals
            phrase: "demonstration pairs a prompt with an approved target answer"
            targets:
              - record-jobs
            color: cyan
            linger: 0.5
          - id: pointwise
            phrase: "pointwise assessment scores one completion"
            targets:
              - picture
          - id: preference
            phrase: "preference pair records which answer better follows a rubric"
            targets:
              - picture
      - say: >
          An evaluation fixture preserves expected behavior for a later test. An incident record preserves a failure and
          its investigation. Decide each record's job before selecting examples, so the training pipeline keeps a
          separate boundary around the answer key and unsafe source material.
        hold: 0.7
        visual_cues:
          - id: record-purpose
            phrase: "An evaluation fixture preserves expected behavior for a later test"
            targets:
              - record-jobs
            color: yellow
            linger: 0.5
          - id: incident
            phrase: "An incident record preserves a failure and its investigation"
            targets:
              - picture
  - id: preference-loss
    title: Derive what a comparison trains
    visual: A ranking of four specific answers expands into six distinct pairs. Scalar reward difference enters a sigmoid.
      The reward identity first uses its corresponding optimal policy. The same pair then becomes two trainable
      policy/reference log ratios; shared partition terms cancel and the numeric DPO loss is earned.
    beats:
      - say: "A ranking of four answers supplies six unordered comparisons: each of the four answers pairs with the others, and
          dividing by two avoids double counting. InstructGPT collected rankings of four to nine outputs for reward
          modeling. Bradley–Terry predicts a comparison from scalar reward difference. Give the preferred answer reward
          two and the other reward zero. Their difference is two; one over one plus exponential negative two gives about
          point eight eight one. Adding five to both rewards leaves that probability unchanged."
        hold: 0.7
        visual_cues:
          - id: six-pairs
            phrase: "supplies six unordered comparisons"
            targets:
              - ranking-pairs
            color: cyan
            linger: 0.5
          - id: assign-rewards
            phrase: Give the preferred answer reward two and the other reward zero
            targets:
              - picture
          - id: reward-difference
            phrase: "Their difference is two"
            targets:
              - reward-difference
            color: yellow
            linger: 0.5
          - id: reward-probability
            phrase: "about point eight eight one"
            targets:
              - reward-probability
            color: green
            linger: 0.5
          - id: shift-rewards
            phrase: "Adding five to both rewards"
            targets:
              - picture
      - say: DPO trains the policy from the same winner and loser without fitting a separate reward model. Under its
          KL-regularized derivation, reward equals beta times the log of its corresponding optimal policy probability
          divided by reference probability, plus beta log Z of the prompt. The two answers share the same prompt, so
          subtracting their rewards cancels that final term. DPO then uses a trainable policy to parameterize that
          relative reward. The reference must assign positive probability to both compared completions, and beta is positive.
        hold: 0.7
        visual_cues:
          - id: policy-ratios
            phrase: "log of its corresponding optimal policy probability divided by reference probability"
            targets:
              - policy-ratios
            color: blue
            linger: 0.5
          - id: cancel-partition
            phrase: "cancels that final term"
            targets:
              - cancel-partition
            color: pink
            linger: 0.5
          - id: trainable-policy
            phrase: "DPO then uses a trainable policy"
            targets:
              - picture
      - say: "Use supplied completion probabilities: policy gives the winner point four and loser point one, while the reference
          gives both point two. The log ratios are log two and log one half. With beta point five, their scaled
          difference is log two, sigmoid is two thirds, and the negative log loss is about point four zero five. Average
          this loss over the pairs. The loss rewards the winner relative to the loser. If both replies are unsafe,
          the reviewer sends the pair to incident review. Our training set requires an acceptable winner and keeps
          both replies so DPO can compare them."
        hold: 0.7
        visual_cues:
          - id: loss-inputs
            phrase: "policy gives the winner point four"
            targets:
              - loss-inputs
            color: blue
            linger: 0.5
          - id: loss-result
            phrase: "negative log loss is about point four zero five"
            targets:
              - loss-result
            color: green
            linger: 0.5
          - id: relative-limit
            phrase: "If both replies are unsafe"
            targets:
              - relative-limit
            color: pink
            linger: 0.5
          - id: loss-ratios
            phrase: "The log ratios are log two and log one half"
            targets:
              - loss-ratios
            color: blue
            linger: 0.4
          - id: loss-margin
            phrase: "their scaled difference is log two"
            targets:
              - loss-margin
            color: yellow
            linger: 0.4
  - id: redact-and-provenance
    title: Clean the trace and retain its lineage
    visual: A real email replacement runs before the reviewer copy appears. Trace, prompt and policy versions remain
      attached alongside the redactor and rubric versions throughout the change.
    beats:
      - say: >
          Begin with the raw trace and check its permitted use. Remove the identifying field before sending text to
          selectors or reviewers. Watch the cleaned copy replace the email with a placeholder. Any reversible identity
          mapping belongs in separately restricted storage.
        hold: 0.6
        visual_cues:
          - id: raw-permission
            phrase: raw trace and check its permitted use
            targets:
              - raw-trace
            color: pink
            linger: 0.5
          - id: redact-copy
            phrase: cleaned copy replace the email with a placeholder
            targets:
              - clean-copy
            color: green
            linger: 0.5
      - say: >
          Preserve the trace, prompt and policy versions while adding the redactor and rubric versions. A reviewer needs
          to reconstruct which instructions and evidence produced the answers. Cleaning identity and retaining the
          decision's technical context work together in this record.
        hold: 0.7
        visual_cues:
          - id: retain-lineage
            phrase: trace, prompt and policy versions
            targets:
              - source-lineage
            color: blue
            linger: 0.5
      - say: Keep placeholders stable within one trace and reset their numbering in the next trace. Our article scrubber
          recognizes email, owner tokens and twelve-character commit IDs; it rejects preexisting reserved placeholders
          rather than confusing raw input with its own output. A pattern scrubber still misses identifying descriptions.
          The separate mapping, source permissions, consent and purpose review remain necessary. Keep only the
          authorized facts a reviewer needs, including the applicable policy and whether approval exists.
        hold: 0.7
        visual_cues:
          - id: placeholder-scope
            phrase: stable within one trace
            targets:
              - placeholder-scope
            color: blue
            linger: 0.5
          - id: reset-placeholders
            phrase: reset their numbering in the next trace
            targets:
              - picture
          - id: redaction-limit
            phrase: still misses identifying descriptions
            targets:
              - redaction-limit
            color: pink
            linger: 0.5
  - id: write-rubric
    title: Apply the rule to the answers actually shown
    visual: A safe, correct A beats an unauthorized B under the executable rubric. A visibly different C/D pair then
      triggers both-bad escalation; safe equivalents and unknown evidence retain separate outcomes.
    beats:
      - say: >
          Write the rubric before collecting preferences. This one checks safety and authorization first, then
          correctness. The answer must cite the approval and stay within its permitted canary scope. Ask whether each
          candidate meets those requirements before comparing its style.
        hold: 0.6
        visual_cues:
          - id: policy-first
            phrase: safety and authorization first, then correctness
            targets:
              - policy-rubric
            color: yellow
            linger: 0.5
      - say: >
          The first pair has one acceptable answer. A follows the approval rule, while B invents a completed migration
          and proposes an unapproved write. The computed decision chooses A. The routing rule reads the supplied safety
          and correctness flags. The preference can be traced back to those judgments. Checking whether approval really
          exists takes a reviewer with access to the approval record.
        hold: 0.65
        caption_starts:
          - "one acceptable answer"
          - "A follows the approval rule"
          - "B invents a completed migration"
          - "The preference can be traced"
        visual_cues:
          - id: compare-pair
            phrase: A follows the approval rule
            targets:
              - candidate-answers
            color: green
            linger: 0.5
            caption_boundary: true
          - id: choose-a
            phrase: computed decision chooses A
            targets:
              - rubric-decision
            color: green
            linger: 0.5
      - say: >
          Now inspect a different pair. C exposes private notes and D executes an unapproved write. Both violate the
          safety rule, so the pair goes to incident review. Safe equivalent answers can tie; missing evidence calls for
          adjudication. Keep those outcomes distinct when exporting training records.
        hold: 0.7
        caption_starts:
          - "Both violate the safety rule"
          - "incident review"
          - "tie"
          - "adjudication"
        visual_cues:
          - id: both-unsafe
            phrase: Both violate the safety rule
            targets:
              - candidate-answers
              - rubric-decision
            color: pink
            linger: 0.5
            caption_boundary: true
          - id: incident-route
            phrase: the pair goes to incident review
            targets:
              - rubric-decision
            color: pink
            linger: 0.5
          - id: separate-outcomes
            phrase: Safe equivalent answers can tie
            targets:
              - decision-types
            color: yellow
            linger: 0.5
          - id: adjudicate-missing-evidence
            phrase: "missing evidence calls for adjudication"
            targets:
              - decision-types
            color: yellow
            linger: 0.5
      - say: After safety and correctness, compare the useful next step, then clarity. A pointwise citation score of five means
          both the required suite and approval ID are cited; three omits approval; one invents it. Those are ordered
          anchors, with no assumed equal spacing. Missing approval evidence means review, rather than a style-based
          winner. Blind model identity and balance display order. Store response identities, order, sampling settings,
          permissions and policy versions so the judgment can be replayed.
        hold: 0.7
        visual_cues:
          - id: citation-five
            phrase: A pointwise citation score of five means both the required suite and approval ID are cited
            targets:
              - picture
          - id: citation-three
            phrase: three omits approval
            targets:
              - picture
          - id: citation-one
            phrase: one invents it
            targets:
              - picture
          - id: rating-anchors
            phrase: ordered anchors
            targets:
              - rating-anchors
            color: blue
            linger: 0.5
          - id: missing-context
            phrase: Missing approval evidence means review
            targets:
              - missing-context
            color: pink
            linger: 0.5
          - id: blind-model-identity
            phrase: "Blind model identity"
            targets:
              - picture
            color: yellow
            linger: 0.5
          - id: balance-display-order
            phrase: "balance display order"
            targets:
              - picture
            color: yellow
            linger: 0.5
          - id: store-response-order
            phrase: "Store response identities, order"
            targets:
              - picture
            color: blue
            linger: 0.5
  - id: reviewer-agreement
    title: "One cell per case"
    visual: "Two independent ballots for each of the last two illustrative cases increment the A/A and A/B cells of the article’s table. Its diagonal gives observed agreement. Matching row and column totals give the chance benchmark before the local gate and triage decision appear."
    beats:
      - say: >-
          Two reviewers get the same pair and the same rubric. Each records a choice before they talk. Here are
          the first hundred and eighteen cases. For the next case the first reviewer picks A. So does the
          second. Put one more case where row A meets column A.
        hold: 0.7
        visual_cues:
          - id: ballot-one
            phrase: "the first reviewer picks A"
            targets: [first-reviewer]
            caption_boundary: true
          - id: ballot-two
            phrase: "So does the second"
            targets: [second-reviewer]
            caption_boundary: true
          - id: match-cell
            phrase: "where row A meets column A"
            targets: [review-table]
            caption_boundary: true
      - say: >-
          One pair left. The first reviewer picks A again. The second picks B. Which cell gets this case?
        hold: 1.9
        visual_cues:
          - id: next-case
            phrase: "One pair left"
            targets: [case-id]
            caption_boundary: true
          - id: different-one
            phrase: "The first reviewer picks A again"
            targets: [first-reviewer]
            caption_boundary: true
          - id: different-two
            phrase: "The second picks B"
            targets: [second-reviewer]
            caption_boundary: true
          - id: ask-cell
            phrase: "Which cell gets this case"
            targets: [review-table]
            caption_boundary: true
      - say: >-
          Row A, column B. That cell now holds three cases. All hundred and twenty pairs are in the table.
          Follow the diagonal to count the matches. Forty-two plus thirty-eight plus twenty-seven gives a
          hundred and seven. Divide by the number of cases. That’s about eighty-nine percent observed
          agreement.
        hold: 0.6
        visual_cues:
          - id: split-cell
            phrase: "Row A, column B"
            targets: [review-table]
            caption_boundary: true
          - id: match-sum
            phrase: "Follow the diagonal"
            targets: [matched-count]
            caption_boundary: true
          - id: observed-count
            phrase: "gives a hundred and seven"
            targets: [matched-count]
            caption_boundary: true
          - id: observed-rate
            phrase: "about eighty-nine percent observed agreement"
            targets: [matched-count]
            caption_boundary: true
      - say: >-
          How often would their choices match just from how frequently each person uses A, B and tie? For A,
          multiply the first reviewer’s forty-six out of a hundred and twenty by the second reviewer’s
          forty-eight out of a hundred and twenty. Do the same for B and tie, then add. That gives about
          thirty-four percent chance agreement.
        hold: 0.7
        visual_cues:
          - id: marginals
            phrase: "how frequently each person uses A"
            targets: [review-marginals]
            caption_boundary: true
          - id: a-product
            phrase: "For A, multiply"
            targets: [chance-agreement]
            caption_boundary: true
          - id: other-products
            phrase: "Do the same for B and tie"
            targets: [chance-agreement]
            caption_boundary: true
          - id: chance-result
            phrase: "about thirty-four percent chance agreement"
            targets: [chance-agreement]
            caption_boundary: true
      - say: >-
          Cohen’s kappa asks how much of the possible improvement over that benchmark the reviewers achieved.
          Subtract chance from observed agreement, then divide by the distance from chance to one. Using the
          full counts gives about point eight three five. That clears this team’s point six five threshold.
        hold: 0.6
        visual_cues:
          - id: kappa-rule
            phrase: "Subtract chance from observed agreement"
            targets: [kappa]
            caption_boundary: true
          - id: kappa-result
            phrase: "about point eight three five"
            targets: [kappa]
            caption_boundary: true
          - id: local-gate
            phrase: "clears this team’s point six five threshold"
            targets: [kappa]
            caption_boundary: true
      - say: >-
          Open the thirteen disagreements. For a dispute about sign-off, inspect the approval record. If the
          rule was ambiguous, version the repair and check fresh cases. Preserve genuine differences in
          preference or record a tie. Sample the agreements too. Two people can agree on an answer that cites
          an approval nobody gave.
        hold: 0.8
        visual_cues:
          - id: triage
            phrase: "Open the thirteen disagreements"
            targets: [off-diagonal-cases]
            caption_boundary: true
          - id: sample-matches
            phrase: "Sample the agreements too"
            targets: [review-table]
            caption_boundary: true
  - id: agreement-models
    title: Choose the chance model deliberately
    visual: Observed agreement stays fixed while separate versus pooled marginals change the chance baseline. The four-item
      three-rater table constructs ordered matching pairs and Fleiss kappa. Degenerate all-one-category data has an
      undefined denominator.
    beats:
      - say: "One reviewer approves ninety-two percent of cases. The other approves eighty-eight percent. Even if their
          decisions were independent, they’d often agree. Multiply the two approval rates, then add the product of
          their rejection rates. That gives point eight one nine two. Their actual agreement is eighty-four percent,
          barely above that baseline. The resulting kappa is about point one one five. If both reviewers approve
          every case, observed and expected agreement both reach one. The denominator is zero. Report undefined,
          with the category counts."
        hold: 0.7
        visual_cues:
          - id: base-rate
            phrase: "point eight one nine two"
            targets:
              - base-rate
            color: yellow
            linger: 0.5
          - id: small-kappa
            phrase: "about point one one five"
            targets:
              - small-kappa
            color: pink
            linger: 0.5
          - id: undefined-kappa
            phrase: "denominator is zero"
            targets:
              - undefined-kappa
            color: pink
            linger: 0.5
          - id: undefined-result
            phrase: Report undefined
            targets:
              - undefined-kappa
            color: pink
            linger: 0.5
      - say: Cohen uses separate marginals for two named reviewers. Fleiss uses pooled category proportions with the same number
          of ratings per item, although different people may rate different items. In our four-item table with three
          ratings each, rows are three-zero-zero, zero-two-one, zero-three-zero, and one-zero-two. For each row,
          multiply each category count by the quantity that count minus one, sum those products, then divide by three
          times two. The four agreements are one, one third, one and one third. Their mean is two thirds. Pooled
          category counts four, five and three give chance fifty over one hundred and forty-four. Fleiss kappa is
          twenty-three over forty-seven, about point four eight nine.
        hold: 0.7
        caption_starts:
          - "one one third one and"
          - "one third one and one"
          - "one and one third Their"
          - "one third Their mean is"
          - "two thirds Pooled category counts"
          - "fifty over one hundred and"
          - "fleiss kappa"
        visual_cues:
          - id: rating-table
            phrase: "rows are three-zero-zero"
            targets:
              - rating-table
            color: blue
            linger: 0.5
          - id: ordered-pairs
            phrase: "multiply each category count by the quantity that count minus one"
            targets:
              - ordered-pairs
            color: yellow
            linger: 0.5
          - id: fleiss-result
            phrase: "twenty-three over forty-seven, about point four eight nine"
            targets:
              - fleiss-result
            color: green
            linger: 0.5
          - id: mean-agreement
            phrase: "Their mean is two thirds"
            targets:
              - picture
          - id: pooled-chance
            phrase: "chance fifty over one hundred and forty-four"
            targets:
              - picture
          - id: row-agreements
            phrase: "The four agreements are one"
            targets:
              - picture
          - id: row-two
            phrase: "The four agreements are one, one third"
            targets:
              - picture
          - id: row-three
            phrase: "The four agreements are one, one third, one"
            targets:
              - picture
          - id: row-four
            phrase: "The four agreements are one, one third, one and one third"
            targets:
              - picture
      - say: Even with two ratings per item, pooling changes the baseline when the reviewers have different marginals.
          Both formulas here count every mismatch equally. Weighted Cohen kappa can give a one-step ordinal
          disagreement less weight than a three-step disagreement. Krippendorff alpha accommodates missing ratings
          with an appropriate nominal or ordinal distance. Report the category mix, counts and uncertainty with
          the statistic. To check whether a shared label is correct, compare it with independent evidence.
        hold: 0.7
        visual_cues:
          - id: chance-models
            phrase: "different marginals"
            targets:
              - chance-models
            color: yellow
            linger: 0.5
          - id: ordinal-distance
            phrase: "one-step ordinal disagreement"
            targets:
              - ordinal-distance
            color: blue
            linger: 0.5
  - id: uncertainty-selection
    title: Queue uncertain cases while preserving their estimates
    visual: Four fixed preference estimates remain on the probability line. The selector ranks their computed uncertainty
      and admits A then B to a separate review queue without moving their probabilities.
    beats:
      - say: >
          Now the reviewer has four eligible pairs and two places. Each dot marks the model’s estimated chance
          that a reviewer prefers reply A. An estimate near one half expresses uncertainty. The two closest dots
          sit at point four nine and point five three. Send the most uncertain records to the review queue.
        hold: 0.65
        visual_cues:
          - id: fixed-uncertainty
            phrase: estimate near one half expresses uncertainty
            targets:
              - fixed-estimates
              - estimate-ruler
            color: blue
            linger: 0.5
          - id: select-queue
            phrase: send the most uncertain records to the review queue
            targets:
              - review-queue
            color: yellow
            linger: 0.5
      - say: >
          The selector queues questions for a reviewer. A garbled request can look uncertain too, and a confident
          mistake may never reach this queue. Keep a representative random audit sample alongside it. Use that
          sample to estimate how often failures occur and see which ones the selector overlooked.
        hold: 0.7
        visual_cues:
          - id: review-questions
            phrase: questions for a reviewer
            targets:
              - review-queue
            color: yellow
            linger: 0.5
  - id: diversity-selection
    title: "Four places in the review queue"
    visual: "Six fixed embedding points carry supplied uncertainties. An uncertainty-only batch uses three slots on canaries. For the hybrid batch, five bars add the uncertainty and distance contributions from the first seed. The closest race resolves before the remaining distances and slots update."
    beats:
      - say: >-
          A reviewer has four places for six eligible cases. This is a new pool. Each dot is a record, and the
          three close together are variations on one canary request. Rank them just by uncertainty. Three
          canaries and one injection review use the whole budget.
        hold: 0.8
        visual_cues:
          - id: uncertainties
