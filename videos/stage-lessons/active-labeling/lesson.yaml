            caption_boundary: true
      - say: >-
          Rewind to just the seed. Suppose the goal is to make the longest remaining gap as short as possible.
          Picking the farthest record puts a center at handoff. The appeal is one unit from the seed, so the
          covering radius is one. That is the k-center objective. The weighted rule spent the very same place
