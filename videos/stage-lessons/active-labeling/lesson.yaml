            targets: [weighted-score]
            caption_boundary: true
          - id: ask-next
            phrase: "Which record gets the place"
            targets: [weighted-score]
            caption_boundary: true
      - say: >-
          The appeal gets it. Its distance is one fifth of the longest link. Its score is point six five.
          Handoff gets the full distance bonus, but its score is only point five two. Mark the appeal as
          selected. Now the closest selected record to handoff is the appeal. Their gap is four units.
        hold: 0.8
        visual_cues:
          - id: appeal-result
            phrase: "The appeal gets it"
            targets: [weighted-score]
            caption_boundary: true
          - id: appeal-score
            phrase: "Its score is point six five"
            targets: [weighted-score]
            caption_boundary: true
          - id: handoff-score
            phrase: "its score is only point five two"
            targets: [weighted-score]
            caption_boundary: true
          - id: add-appeal
            phrase: "Mark the appeal as selected"
            targets: [chosen-center]
            caption_boundary: true
