version: 1
id: vectors
opening: lesson
title: "Vectors, Matrices & Tensors: Which Results Can You Reuse?"
source: preparation/vectors-matrices-tensors/content.md
sources:
  - title: "Deep Learning: Linear Algebra"
    url: https://www.deeplearningbook.org/contents/linear_algebra.html
  - title: NumPy matrix multiplication
    url: https://numpy.org/doc/stable/reference/generated/numpy.matmul.html
  - title: NumPy broadcasting
    url: https://numpy.org/doc/stable/user/basics.broadcasting.html
  - title: NumPy mean
    url: https://numpy.org/doc/stable/reference/generated/numpy.mean.html
  - title: NumPy transpose
    url: https://numpy.org/doc/stable/reference/generated/numpy.transpose.html
  - title: PyTorch Linear
    url: https://docs.pytorch.org/docs/stable/generated/torch.nn.Linear.html
scenes:
  - id: intro
    title: Move a word vector
    visual: Slide the tip of the password vector horizontally on a grid. Keep the three saved bars
      at their old marks while the viewer predicts which one can stay. Update the two affected
      bars, then rewind to the pair used in the next scene.
    beats:
      - say: Slide the tip of this arrow one unit to the right.
        hold: 0.55
        visual_cues:
          - id: edit-input
            phrase: Slide the tip of this arrow one unit to the right
            targets:
              - password-input
      - say: For the word password, we saved the horizontal coordinate, the height, and their average.
          Which bar can we leave alone?
        hold: 2.35
        visual_cues:
          - id: read-horizontal
            phrase: the horizontal coordinate
            targets:
              - horizontal-output
          - id: read-height
            phrase: the height
            targets:
              - saved-height
          - id: read-average
            phrase: their average
            targets:
              - average-output
      - say: The height stays at one half. The horizontal coordinate grows by one. Its average with the
          height grows by half as much.
        hold: 2
        caption_starts:
          - The horizontal coordinate grows by one
          - Its average with the height
        visual_cues:
          - id: same-height
            phrase: The height stays at one half
            targets:
              - saved-height
          - id: update-horizontal
            phrase: The horizontal coordinate grows by one
            targets:
              - horizontal-output
          - id: update-average
            phrase: Its average with the height grows by half as much
            targets:
              - average-output
      - say: Slide the tip back. Let's build that starting vector from its two numbers.
        hold: 0.9
        visual_cues:
          - id: carry-password
            phrase: Slide the tip back
            targets:
              - password-input
  - id: coordinates
    title: Where is half, half?
    visual: Two scalar coordinates build a vector on equal-unit axes. A second real row supplies a visible
      coordinate-swap counterexample.
    beats:
      - say: Start at the origin. One number, like this first half, is a scalar. Draw the first coordinate
          horizontally. Half a unit puts us halfway to one on the bottom axis.
        hold: 0.55
        visual_cues:
          - id: first-coordinate
            phrase: Draw the first coordinate horizontally
            targets:
              - horizontal-component
              - coordinate-row
            color: blue
            linger: 0.5
      - say: From there, add the second coordinate vertically. The arrow from the origin to the endpoint
          represents the ordered pair. That's a vector. Its two coordinates are dimensionless features
          we picked for this word.
        hold: 0.7
        visual_cues:
          - id: second-coordinate
            phrase: add the second coordinate vertically
            targets:
              - vertical-component
              - password-vector
            color: pink
            linger: 0.5
      - say: Look at reset. It sits on the horizontal axis. Swap its coordinates. It now sits on the vertical
          axis. If you checked only that the vector had two entries, you'd accept both versions. The
          position tells you which feature each number measures.
        hold: 0.8
        visual_cues:
          - id: look-reset
            phrase: Look at reset
            targets:
              - reset-vector
          - id: swap-coordinates
            phrase: Swap its coordinates
            targets:
              - swap-points
            color: yellow
            linger: 0.6
  - id: directions
    title: Where does one unit go?
    visual: The two rows of the 2-to-3 map produce full output directions. A labeled
      first/third-coordinate view retains all three values in strips.
    beats:
      - say: Here's the rule behind those three bars. Its coefficients form a rectangular table, a matrix.
          We feed it a row vector with two coordinates and get three numbers back. That's
          why the matrix has two input rows and three output columns.
        hold: 0.7
        visual_cues:
          - id: map-shape
            phrase: two input rows and three output columns
            targets:
              - map-matrix
              - map-axes
            color: yellow
            linger: 0.5
      - say: Give it one unit of the first feature and none of the second. That picks out the blue row. Follow
          that slanted direction as it grows. You're looking at outputs zero and two. The table keeps
          the middle coordinate in sight too.
        hold: 0.65
        visual_cues:
          - id: first-direction
            phrase: Follow that slanted direction as it grows
            targets:
              - first-map-direction
              - first-full-direction
            color: blue
            linger: 0.5
      - say: Now give it one unit of the second feature instead. In this view it moves straight upward. Its
          full row also has a one in the middle. Those two directions tell us what the matrix will do
          with any mix of the two input features.
        hold: 0.8
        visual_cues:
          - id: second-direction
            phrase: it moves straight upward
            targets:
              - second-map-direction
              - second-full-direction
            color: pink
            linger: 0.5
  - id: mixture
    title: Where will the sum land?
    visual: Two half weights shrink the actual mapped directions. The second weighted vector travels to
      the first vector's tip; the completed join reveals the output.
    beats:
      - say: Password has half a unit of each input. Take half of the first row. The blue arrow gets half as
          long. All three numbers on its row scale together, even the coordinate we left off the plot.
          Multiplying a whole vector by one number is scalar multiplication.
        hold: 0.6
        visual_cues:
          - id: scale-first
            phrase: Take half of the first row
            targets:
              - first-contribution
              - first-weighted-row
            color: blue
            linger: 0.6
      - say: Take half of the second row as well. Now each arrow has the length that password contributes. We
          need their sum. If you could slide the pink arrow without turning it, where would you put
          its tail?
        hold: 2.1
        visual_cues:
          - id: scale-second
            phrase: Take half of the second row
            targets:
              - second-contribution
              - second-weighted-row
            color: pink
            linger: 0.6
      - say: Move the pink arrow to the blue arrow's tip. Follow it from there. The last coordinate has gone
          up a quarter twice. The two arrows land at half, half, half. That's the original triple we
          saved under password.
        hold: 0.8
        visual_cues:
          - id: join-vectors
            phrase: Move the pink arrow to the blue arrow's tip
            targets:
              - second-contribution
              - mixture-result
            color: yellow
            linger: 0.7
          - id: join-landed
            phrase: The two arrows land at half, half, half
            targets:
              - password-output
            caption_boundary: true
  - id: dot
    title: Can we compute just the last number?
    visual: The third matrix column pairs with the two inputs. Two quarter contributions accumulate on a
      common numeric scale; the full row preserves all three outputs.
    beats:
      - say: Look down the last column of the matrix. Each coefficient tells one input how much to contribute
          to that output. Multiply the first matching pair. Half times half contributes one quarter to
          this output.
        hold: 0.65
        visual_cues:
          - id: dot-first
            phrase: Multiply the first matching pair
            targets:
              - dot-column
              - dot-first-product
            color: blue
            linger: 0.5
          - id: dot-quarter
            phrase: Half times half contributes one quarter to this output
            targets:
              - picture
      - say: The other pair is also half times half. Slide its quarter along the ruler and add that
          contribution. The accumulator reaches the third coordinate we already constructed
          geometrically. Multiplying matched entries and adding them is a dot product. The result for
          this column is one number.
        hold: 0.65
        visual_cues:
          - id: dot-second
            phrase: add that contribution
            targets:
              - dot-second-product
              - dot-accumulator
            color: pink
            linger: 0.6
          - id: dot-accumulate
            phrase: The accumulator reaches the third coordinate we already constructed geometrically
            targets:
              - picture
      - say: Every column asks its own question of the same two inputs. The first keeps the first coordinate.
          The next keeps the second. Here the third output is determined by the first two. It's their
          average. Three slots can hold three views of the same two measurements.
        hold: 0.75
        visual_cues:
          - id: output-relation
            phrase: the third output is determined by the first two
            targets:
              - full-output
              - dependent-output
            color: cyan
            linger: 0.6
  - id: composition
    title: Can one matrix take both steps?
    visual: A 3-to-2 map builds its result from three head-to-tail contributions. Matrix multiplication
      forms the combined map; its direct route lands at the same point.
    beats:
      - say: Pass password's triple to a second matrix. The first coordinate moves right. The second moves up.
          The third contributes to both directions. Trace all three pieces, tip to tail. That's where
          this two-step computation sends our original word.
        hold: 0.85
        visual_cues:
          - id: downstream-first
            phrase: The first coordinate moves right
            targets:
              - downstream-construction
            color: blue
            linger: 0.45
          - id: downstream-second
            phrase: The second moves up
            targets:
              - downstream-construction
            color: pink
            linger: 0.45
          - id: downstream-third
            phrase: The third contributes to both directions
            targets:
              - downstream-construction
              - downstream-result
            color: cyan
            linger: 0.55
      - say: Suppose a million more words are coming through these same two maps. Could we do some work ahead
          of time? Multiply the first matrix by the second. Each new entry is a row dotted with a
          column. The shared width of three disappears. The combined matrix takes a pair straight to a
          pair.
        hold: 0.8
        visual_cues:
          - id: compose-matrices
            phrase: Multiply the first matrix by the second
            targets:
              - composed-matrix
              - composition-contract
            color: yellow
            linger: 0.6
      - say: Try it on the original half, half. Scale its two directions and add them. The yellow arrow ends
          at one, one, exactly where the three earlier steps landed. Matrix multiplication is
          associative. As long as these stages are just the two linear maps, we can precompute their
          product for every word.
        hold: 0.9
        visual_cues:
          - id: direct-first
            phrase: Scale its two directions
            targets:
              - direct-construction
            color: blue
            linger: 0.45
          - id: direct-second
            phrase: and add them
            targets:
              - direct-construction
              - direct-result
            color: green
            linger: 0.6
  - id: rows
    title: One matrix for three words
    visual: Three word states become labeled rows. A shared map visits each row and constructs its owned
      output, preserving the word axis.
    beats:
      - say: In the prompt “reset my password,” give each word one token. Stack the three word vectors in
          a matrix. You can read across a row for one word,
          or down a column for the same feature of three words.
        hold: 0.65
        visual_cues:
          - id: stack-word-rows
            phrase: Stack the three word vectors
            targets:
              - word-inputs
            color: blue
            linger: 0.5
      - say: Apply the same matrix to reset. Then apply it to my. Finally, transform password. Notice what
          stays still in the middle. Each word gets its own turn with exactly the same coefficients.
        hold: 0.65
        visual_cues:
          - id: row-reset
            phrase: Apply the same matrix to reset
            targets:
              - row-reset-output
              - word-map
            color: blue
            linger: 0.45
          - id: row-my
            phrase: Then apply it to my
            targets:
              - row-my-output
              - word-map
            color: pink
            linger: 0.45
          - id: row-password
            phrase: Finally, transform password
            targets:
              - row-password-output
              - word-map
            color: cyan
            linger: 0.6
      - say: Three word rows enter and three word rows leave. Each row is wider because we're collecting three
          answers per word. If reset needs information from password, some other operation must put
          their positions in contact.
        hold: 0.7
        visual_cues:
          - id: preserve-word-axis
            phrase: Three word rows enter and three word rows leave
            targets:
              - word-inputs
              - word-outputs
            color: green
            linger: 0.6
  - id: tensor
    title: Find one number in two messages
    visual: Index into the two messages and project their rows. Four fixed strips then show the same
      operation at 128 token positions per prompt.
    beats:
      - say: Add a second prompt, “change the address.” Put the two matrices in a batch. Now the address of a number has
          three parts. Which message? Which token in it? Which feature of that token? An array with
          these three axes is a tensor. In libraries, a tensor can have any number of axes.
        hold: 0.7
        visual_cues:
          - id: add-message-axis
            phrase: Put the two matrices in a batch
            targets:
              - message-a
              - message-b
              - tensor-shape
            color: cyan
            linger: 0.6
      - say: Counting from zero, choose message one, word position two, and feature zero. That's the first
          number under address. Each integer index uses up one axis. Keeping batch and token with
          colons while selecting one feature gives us a whole sheet of first coordinates instead.
        hold: 0.7
        visual_cues:
          - id: select-message
            phrase: choose message one
            targets:
              - message-b
            color: yellow
            linger: 0.4
          - id: select-word
            phrase: word position two
            targets:
              - address-row
            color: yellow
            linger: 0.4
          - id: select-feature
            phrase: and feature zero
            targets:
              - address-feature
              - tensor-index
            color: yellow
            linger: 0.6
          - id: tensor-slice-columns
            phrase: Keeping batch and token with colons while selecting one feature
            targets:
              - tensor-feature-slice
            color: cyan
            linger: 0.45
      - say: The matrix still takes two features and returns three. Apply it to all six word states. Each
          result has the same message and position as its input. The feature axis is the only one that
          changes width.
        hold: 0.8
        visual_cues:
          - id: project-batch
            phrase: Apply it to all six word states
            targets:
              - message-a
              - message-b
              - tensor-shape
            color: green
            linger: 0.65
      - say: Try four longer prompts. Each has a hundred and twenty-eight tokens. Each token comes with seven
          hundred and sixty-eight features. The new matrix has that many rows and two hundred and
          fifty-six columns. How many output vectors are there, and how wide is each?
        hold: 2.1
        visual_cues:
          - id: large-batch
            phrase: Try four longer prompts
            targets:
              - token-strips
      - say: There are five hundred and twelve vectors, each with two hundred and fifty-six outputs. Keep the
          four strips separate when you write the shape. That lets the next layer locate a token in
          its own prompt.
        hold: 0.8
        visual_cues:
          - id: large-result
            phrase: There are five hundred and twelve vectors, each with two hundred and fifty-six outputs
            targets:
              - output-contract
            caption_boundary: true
  - id: local-edit
    title: Which output coordinate stays put?
    visual: Apply one unit along the first input axis. Two fixed planes keep the old tips in view while
      the table shows all six projected rows.
    beats:
      - say: Here are the original six results again. Add one to password's first input and keep the matrix
          fixed. Before we do it, decide which output rows should move. Then look closer at password.
          Which of its three numbers should stay exactly where it is?
        hold: 2.2
        visual_cues:
          - id: predict-local-edit
            phrase: decide which output rows should move
            targets:
              - password-output
              - local-question
            color: yellow
            linger: 0.6
      - say: Change that one coordinate now. The input point moves horizontally. Its output follows the
          matrix's first direction, so the first and third outputs rise together. Look at the middle
          cell. The first row of the matrix puts zero there, so the edit contributes nothing to it.
        hold: 0.75
        visual_cues:
          - id: change-password
            phrase: Change that one coordinate now. The input point moves horizontally. Its output follows the
              matrix's first direction, so the first and third outputs rise together
            targets:
              - local-input
              - local-output
            color: yellow
            linger: 0.7
      - say: The other five word states keep their outputs. We could reuse every one of those triples. What
          made that safe was applying a fixed matrix to each word separately. We'll try the same edit
          later on a calculation that reads two words at once.
        hold: 0.8
        visual_cues:
          - id: check-locality
            phrase: The other five word states keep their outputs
            targets:
              - batch-controls
              - password-output
            color: green
            linger: 0.8
  - id: latency-gradient
    title: Two numbers that change a latency model
    visual: Switch explicitly from dimensionless word states to the article’s named latency features. The
      gradient scales, reverses and translates the same two-weight point; preserve old/new weight
      identities.
    beats:
      - say: Now one row describes a whole request. The feature positions mean prompt length in hundreds of
          tokens, then queue delay in seconds. The model has one weight for each measurement. The
          first weight has units of seconds per prompt block. The second has units of seconds per
          second in the queue.
        hold: 0.7
        visual_cues:
          - id: gradient-features
            phrase: The feature positions mean prompt length in hundreds of tokens, then queue delay in seconds
            targets:
              - gradient-features
      - say: In the gradients lesson we started with weights two, two. We got loss slopes four, two. That's
          the gradient, one slope for each weight. A learning rate of one tenth scales it to point
          four, point two. Subtract both changes from the same parameter vector. The updated weights
          are one point six and one point eight.
        hold: 0.7
        visual_cues:
          - id: gradient-weights
            phrase: weights two, two
            targets:
              - gradient-weights
          - id: gradient-slopes
            phrase: loss slopes four, two
            targets:
              - gradient-slopes
          - id: gradient-scale
            phrase: A learning rate of one tenth scales it to point four, point two
            targets:
              - gradient-scaled
            color: pink
            linger: 0.45
          - id: gradient-update
            phrase: Subtract both changes from the same parameter vector
            targets:
              - gradient-plane
            color: green
            linger: 0.45
          - id: gradient-result
            phrase: The updated weights are one point six and one point eight
            targets:
              - gradient-result
            color: green
            linger: 0.45
      - say: The features, weights and slopes all have shape two comma in NumPy. That's a tuple with one axis
          of length two. Their units tell us which pair to use for which job. A scalar array has an
          empty shape tuple. An ordinary Python float has no shape attribute.
        hold: 0.85
  - id: latency-dot
    title: What did request B actually send?
    visual: Two named payload fields trade slots above fixed coefficients. The seconds ruler stays fixed,
      with a mark at the original prediction while the reordered values are scored.
    beats:
      - say: For the next few requests, freeze a different toy rule. Charge two seconds per hundred prompt
          tokens, plus a second for each second in the queue. B sent two hundred tokens and waited one
          second. The two labels on its payload tell us which coefficient to use.
        hold: 0.65
      - say: For the prompt, two times two contributes four seconds. For the queue, one times one contributes
          one. Elementwise multiplication gives you both pieces separately. The dot product puts them
          end to end and returns the scalar five seconds.
        hold: 0.8
        visual_cues:
          - id: latency-prompt
            phrase: two times two contributes four seconds
            targets:
              - latency-contributions
            color: blue
            linger: 0.45
          - id: latency-queue
            phrase: one times one contributes one
            targets:
              - latency-contributions
            color: pink
            linger: 0.45
          - id: latency-sum
            phrase: the scalar five seconds
            targets:
              - latency-result
            color: green
            linger: 0.45
      - say: Now B arrives from a different client. Same request, same two measurements. Swap only the feature
          positions. The coefficients stay put. What time will this version of the program report?
        hold: 2.15
        visual_cues:
          - id: latency-swap
            phrase: Swap only the feature positions
            targets:
              - latency-input
            color: pink
            linger: 0.45
      - say: It computes one times two plus two times one, or four. Nobody got a second faster. The program
          just charged the queue value at the prompt rate. Both slots were filled, so a length check
          passed. Restoring the named order repairs the prediction. B makes a good test case because
          swapping two unequal values changes the answer.
        hold: 0.85
        caption_starts:
          - It computes one times two
        visual_cues:
          - id: latency-swapped
            phrase: one times two plus two times one, or four
            targets:
              - latency-result
            color: pink
            linger: 0.45
          - id: latency-restore
            phrase: Restoring the named order repairs the prediction
            targets:
              - latency-input
              - latency-contributions
              - latency-result
            color: green
            linger: 0.45
  - id: request-batch
    title: Give A, B and C their own predictions
    visual: Stack A/B/C feature rows, retain row ownership and pass the same coefficient vector down the
      rows. Release each prediction only after that row’s contraction.
    beats:
      - say: Put B between two more requests. A sent one prompt block and waited zero seconds. C sent three
          blocks and waited one second. All three use the same two weights. After we've added the
          contributions from each pair of features, how many predictions should come back?
        hold: 1.9
      - say: A gives two seconds. B gives five. C gives seven. The result has three entries, one per request.
          Each row kept its own prediction. The axis we summed over was the features within that row.
        hold: 0.8
        visual_cues:
          - id: request-a
            phrase: A gives two seconds
            targets:
              - request-predictions
            color: green
            linger: 0.45
          - id: request-b
            phrase: B gives five
            targets:
              - request-predictions
            color: green
            linger: 0.45
          - id: request-c
            phrase: C gives seven
            targets:
              - request-predictions
            color: green
            linger: 0.45
          - id: request-shape
            phrase: The result has three entries, one per request
            targets:
              - picture
      - say: In a drawing, we can stack the two weights vertically. In NumPy, a one-dimensional weight vector
          still has just one axis. Give it a second axis of length one and the output keeps that axis,
          producing three by one. The next function may care about that extra axis even when the three
          values agree.
        hold: 0.75
        visual_cues:
          - id: request-column
            phrase: producing three by one
            targets:
              - request-shape
            color: green
            linger: 0.45
  - id: many-outputs
    title: What would a second column buy us?
    visual: Open X/W/Y matrices share feature identities. Follow B through the time column first, then
      priority, before filling the other request/output cells. Compute every shown value from X@W.
    beats:
      - say: Give each request two outputs. The first column of weights gives us seconds. The second
          awards priority points for prompt length and time in the queue.
        hold: 0.65
      - say: Follow B across the page. Its time column gives five seconds. Now watch B stay put while we
          select the next column. The prompt contributes two times point two. Add the queue
          contribution, one times one point five. Together that's one point nine. Both answers belong
          to B.
        hold: 0.8
        visual_cues:
          - id: request-b-time
            phrase: Its time column gives five seconds
            targets:
              - two-output-result
            color: green
            linger: 0.45
          - id: priority-first
            phrase: two times point two
            targets:
              - priority-contributions
            color: blue
            linger: 0.45
          - id: priority-second
            phrase: one times one point five
            targets:
              - priority-contributions
            color: pink
            linger: 0.45
          - id: request-b-priority
            phrase: Together that's one point nine
            targets:
              - request-priority
            color: green
            linger: 0.45
            caption_boundary: true
      - say: Run the two columns on the other rows as well. Read the pairs as seconds, then priority. We get
          two and point two, five and one point nine, seven and two point one. For any request and any
          output, it's the two input features that meet and get summed.
        hold: 0.75
        visual_cues:
          - id: request-all-outputs
            phrase: two and point two, five and one point nine, seven and two point one
            targets:
              - two-output-result
            color: green
            linger: 0.45
  - id: shape-guard
    title: Can this replacement matrix run?
    visual: Match B's two measurements to the first two weight rows. Leave a gap for load in the
      time calculation. Restore the two-feature matrix, then copy one request across all three rows.
      Show two storage orders for those six values and the single nonzero singular value.
    beats:
      - say: Both tables are three by two. The left has three requests. The right asks for three
          features. Which measurement would you multiply by the load weight?
        hold: 2.05
      - say: Look at B. Two prompt blocks pair with the prompt row. One second in the queue pairs with
          the queue row. The load row needs a third measurement. B's time calculation stops at that
          empty spot.
        hold: 0.65
        caption_starts:
          - The load row needs a third measurement
        visual_cues:
          - id: match-b
            phrase: Look at B
            targets:
              - supplied-inputs
          - id: shape-unmatched
            phrase: The load row needs a third measurement
            targets:
              - missing-load
      - say: Put the two-feature matrix back. Now B's two measurements give five seconds. To use the
          three-feature model, we'd need a load reading for each request.
        hold: 0.75
        visual_cues:
          - id: shape-repair
            phrase: Put the two-feature matrix back
            targets:
              - shape-map
          - id: repaired-time
            phrase: Now B's two measurements give five seconds
            targets:
              - time-result
      - say: Now copy A into all three request rows. The shape is still three by two. We can store
          those six numbers by row or by column. Either way, NumPy counts two axes. All three rows
          point the same way. That gives this matrix a rank of one. Its singular values measure the
          strengths of its directions. Only the first is above zero.
        hold: 0.75
        visual_cues:
          - id: shape-rank
            phrase: copy A into all three request rows
            targets:
              - request-rows
          - id: storage-orders
            phrase: We can store those six numbers by row or by column
