  - id: broadcasting
    title: Which offset did B receive?
    visual: Two copies of the same outputs sit side by side. One set of corrections travels down columns,
      the other across rows. B's priority agrees in both copies.
    beats:
      - say: Both tables start with the same three requests. We want to add a tenth of a second to every time
          estimate and subtract a tenth from every priority. Send the first offset down the time
          column. Send the second down priority. For B, five and one point nine become five point one
          and one point eight.
        hold: 0.7
        visual_cues:
          - id: down-time
            phrase: Send the first offset down the time column
            targets:
              - time-column
          - id: down-priority
            phrase: Send the second down priority
            targets:
              - priority-column
          - id: feature-bias
            phrase: For B, five and one point nine become five point one and one point eight
            targets:
              - bias-result
            color: green
            linger: 0.45
      - say: Try a second implementation on the right. It supplies one offset per request as a three by one
          array. Go across each row. A gets a tenth added to both numbers. B gets a tenth taken off
          both. C gets zero. B becomes four point nine and one point eight. Which value in B would
          catch the mistake?
        hold: 2.15
        visual_cues:
          - id: across-rows
            phrase: Go across each row
            targets:
              - request-rows
          - id: row-bias
            phrase: B becomes four point nine and one point eight
            targets:
              - bias-result
            color: pink
            linger: 0.45
          - id: check-b
            phrase: Which value in B would catch the mistake
            targets:
              - request-b
      - say: Check the time. Both priorities say one point eight. Only the left time went up by the tenth of a
          second we asked for. Both arrays have the very same shape.
        hold: 0.75
        visual_cues:
          - id: test-time
            phrase: Check the time
            targets:
              - time-cells
            caption_boundary: true
      - say: NumPy lines up dimensions from the right. Equal sizes match, and a missing leading axis or a size
          of one can expand. That's broadcasting. For a strict feature vector, require one dimension
          whose length equals output width. A one by two row would also repeat by feature if your
          interface allows it. The time check tests what the entries actually mean.
        hold: 0.85
        visual_cues:
          - id: broadcast-diagnosis
            phrase: require one dimension whose length equals output width
            targets:
              - bias-contract
            color: green
            linger: 0.45
  - id: pairwise-scores
    title: What changes when two words share a score?
    visual: Transpose the original word matrix and build its raw dot products. Replay password's edit
      against the completed grid. Highlight only entries whose values change.
    beats:
      - say: Go back to the original word vectors, before the edit. This time each answer belongs to a pair of
          words. Turn a copy of the token matrix so its token rows become columns. Now a row on the
          left and a column on the right can name two different words.
        hold: 0.7
        visual_cues:
          - id: score-transpose
            phrase: Turn a copy of the token matrix so its token rows become columns
            targets:
              - score-transposed
            color: yellow
            linger: 0.45
      - say: Reset with itself gives one. Reset with my gives zero. Reset with password gives one half. Read
          across that row and you've compared reset with every word. Password with itself gives one
          quarter plus one quarter, or one half. These are raw dot products, computed from both
          direction and vector length.
        hold: 0.8
        visual_cues:
          - id: score-reset
            phrase: Reset with itself gives one
            targets:
              - picture
          - id: score-my
            phrase: reset with my gives zero
            targets:
              - picture
          - id: score-password
            phrase: reset with password gives one half
            targets:
              - picture
          - id: score-self
            phrase: Password with itself gives one quarter plus one quarter, or one half
            targets:
              - picture
          - id: score-length
            phrase: These are raw dot products, computed from both direction and vector length
            targets:
              - picture
      - say: Each diagonal entry is its token vector's squared length. Switching the two words in a pair gives
          the same answer, so the grid is symmetric. Later, attention uses separate query and key
          maps. That grid can lose the symmetry. Scaling, masking and normalization turn its scores
          into attention weights.
        hold: 0.65
        visual_cues:
          - id: score-diagonal
            phrase: Each diagonal entry is its token vector's squared length
            targets:
              - score-diagonal
            color: green
            linger: 0.45
      - say: Compare that grid with our earlier edit. Increase password's first coordinate by one again. Can a
          score in reset's row change this time?
        hold: 2.15
        visual_cues:
          - id: compare-edit
            phrase: Compare that grid with our earlier edit
            targets:
              - raw-score-grid
      - say: Apply the edit. Reset's row changes exactly where it reads password. The matching entry across
          the diagonal changes too. The score with my stays at one half. My has a zero in the feature
          we touched. Only pairs that read password could change, and some of those still give the
          same number.
        hold: 0.8
        visual_cues:
          - id: repeat-edit
            phrase: Apply the edit
            targets:
              - password-scores
  - id: normalized-scores
    title: How far does password point along reset?
    visual: On equal-unit axes, double password’s arrow along the same ray and grow its projected shadow.
      Normalize nonzero arrows; the self-score becomes1. Keep zero-vector direction unavailable.
    beats:
      - say: Start again with password's original arrow, half, half. Its length is the square root of one
          half. Against reset, a unit arrow pointing right, the dot product measures the horizontal
          shadow. Double the vector to one, one. The shadow doubles, even though the arrow points in
          exactly the same direction.
        hold: 0.8
        visual_cues:
          - id: length-double
            phrase: Double the vector to one, one
            targets:
              - length-scaled
            color: yellow
            linger: 0.45
      - say: To compare just the directions of two nonzero vectors, divide their dot product by both lengths.
          That's cosine similarity. Both arrows have cosine one over square root of two with the
          horizontal reference. Normalizing every token vector to length one gives each a self-score
          of one.
        hold: 0.8
        visual_cues:
          - id: cosine-result
            phrase: Both arrows have cosine one over square root of two with the horizontal reference
            targets:
              - cosine-result
          - id: unit-normalize
            phrase: Normalizing every token vector to length one
            targets:
              - length-scaled
            color: yellow
            linger: 0.45
      - say: Rotate the arrow. Perpendicular directions have cosine zero, and opposite directions have cosine
          minus one. Now shrink it all the way to the origin. The zero vector has no direction. Before
          dividing, the program in the article rejects any row with length zero.
        hold: 0.8
        visual_cues:
          - id: cosine-perpendicular
            phrase: Perpendicular directions have cosine zero
            targets:
              - cosine-perpendicular
            color: blue
            linger: 0.45
          - id: cosine-opposite
            phrase: opposite directions have cosine minus one
            targets:
              - cosine-opposite
            color: pink
            linger: 0.45
          - id: shrink-arrow
            phrase: Now shrink it all the way to the origin
            targets:
              - vector-length
          - id: zero-direction
            phrase: The zero vector has no direction
            targets:
              - zero-direction
            color: yellow
            linger: 0.45
  - id: batched-transpose
    title: Which prompt supplied this number?
    visual: Trace one self-score in a two-by-two-by-two batch. Alter a coordinate in the other prompt
      under a full reversal, then keep that alteration while repairing the transpose. Undo the control
      edit with the repaired operand still in place.
    beats:
      - say: Here's a smaller batch. Both prompts have two tokens, and each token has two features. We want
          one score grid per prompt. Pick the second token in prompt zero and compare it with itself.
          Before looking at any code, what number should that cell contain?
        hold: 2.15
      - say: Two halves squared and added give one half. Keep that check in view. NumPy dot-T reverses every
          axis. The last index on the right now picks a prompt. Look at the yellow column. It reads
          one feature down two tokens in prompt one. The first diagonal entry still comes out to one.
          The second comes out to just one quarter.
        hold: 0.85
        visual_cues:
          - id: expected-self
            phrase: Two halves squared and added give one half
            targets:
              - squared-length
            caption_boundary: true
          - id: batch-reverse
            phrase: NumPy dot-T reverses every axis
            targets:
              - batch-score-0
            color: pink
            linger: 0.45
          - id: batch-diagonal
            phrase: The second comes out to just one quarter
            targets:
              - computed-score
            color: pink
            linger: 0.45
            caption_boundary: true
      - say: Let's test where that quarter came from. In prompt one, change the first zero to one. We haven't
          touched either coordinate of the blue token. What will happen when we run the same code
          again?
        hold: 2.2
        visual_cues:
          - id: other-prompt
            phrase: In prompt one, change the first zero to one
            targets:
              - foreign-feature
      - say: The score jumps to three quarters. The yellow numbers tell us why. The blue half now multiplies a
          one from someone else's prompt. Every dimension is two, so this calculation ran and even
          returned the shape we asked for. With unequal sizes it could fail at the multiply.
        hold: 0.9
        visual_cues:
          - id: cross-prompt-score
            phrase: The score jumps to three quarters
            targets:
              - computed-score
            caption_boundary: true
      - say: Leave that edit in place. Swap just the token and feature axes on the right. Both copies of the
          pair now come from the same blue row. Its self-score is one half. The first token still
          scores one against itself.
        hold: 0.95
        visual_cues:
          - id: batch-repair
            phrase: Swap just the token and feature axes on the right
            targets:
              - right-operand
            color: green
            linger: 0.45
          - id: same-self
            phrase: Its self-score is one half
            targets:
              - computed-score
            caption_boundary: true
      - say: Open both score grids. The edited token in prompt one now reads one, one. Its top-left
          self-score is two. Undo the edit in prompt one. That score drops to one.
          Prompt zero's whole grid holds still. Each prompt gets a token-by-token grid because the
          multiply sums over features within that prompt. You can test this even when the axis sizes
          happen to match.
        hold: 0.9
        visual_cues:
          - id: both-grids
            phrase: Open both score grids
            targets:
              - prompt-score-grids
          - id: restore-control
            phrase: Undo the edit in prompt one
            targets:
              - foreign-feature
          - id: score-contract
            phrase: Each prompt gets a token-by-token grid
            targets:
              - batched-score-shape
  - id: pooling
    title: Can a mean tell which word came first?
    visual: The same three projected word rows contribute into an accumulator one at a time. Divide by the
      actual count, then permute rows and retain the unchanged prompt summary.
    beats:
      - say: Back to reset my password, with its original three projected rows. A downstream model asks for
          one vector for the whole prompt. We can sum the rows and divide by the token count. In
          NumPy, mean along axis one removes the token positions from this batch. It leaves one row of
          features per prompt.
        hold: 0.8
      - say: Follow the three contributions. Projected reset is one, zero, one half. My is zero, one, one
          half. Password is one half, one half, one half. Their sum is one point five in each
          coordinate. Dividing by three gives one half, one half, one half.
        hold: 0.85
        visual_cues:
          - id: pool-reset
            phrase: projected reset is one, zero, one half
            targets:
              - pool-accumulation
            color: blue
            linger: 0.45
          - id: pool-my
            phrase: my is zero, one, one half
            targets:
              - pool-accumulation
            color: pink
            linger: 0.45
          - id: pool-password
            phrase: password is one half, one half, one half
            targets:
              - pool-accumulation
            color: cyan
            linger: 0.45
          - id: pool-sum
            phrase: Their sum is one point five in each coordinate
            targets:
              - pool-result
            color: green
            linger: 0.45
          - id: pool-result
            phrase: Dividing by three gives one half, one half, one half
            targets:
              - pool-result
            color: green
            linger: 0.45
      - say: Reorder those token rows and repeat the sum. Password now comes first. Addition gives the same
          result. A reader could tell that the words moved. A mean of these same vectors can't. If the
          task depends on order, the model needs a way to represent position or interactions that
          depend on position.
        hold: 0.9
        visual_cues:
          - id: pool-permute
            phrase: Reorder those token rows
            targets:
              - pool-owned-rows
            color: blue
            linger: 0.45
          - id: pool-repeat
            phrase: and repeat the sum
            targets:
              - pool-accumulation
          - id: pool-same
            phrase: Addition gives the same result
            targets:
              - pool-result
  - id: padding-mask
    title: Which rows belong in the mean?
    visual: Checks mark the rows a mean actually counts. Add two zero rows, remove them from the count
      with a mask, then clear the mask. A single tally drives the sum, integer denominator and bars.
    beats:
      - say: Here are just two real tokens, one pointing right and one pointing up. Their mean lies halfway
          along each axis. Suppose the batch needs four slots for every prompt. We'll fill the two
          spare slots with zeros. What will an ordinary mean do to this pair?
        hold: 2.1
      - say: Append two zero rows and divide by the padded length four. The sum never moved, but both bars
          dropped from a half to a quarter. An ordinary mean counted two more positions, even though
          those positions added nothing.
        hold: 0.85
        visual_cues:
          - id: padding-add
            phrase: Append two zero rows and divide by the padded length four
            targets:
              - padding-input
            color: pink
            linger: 0.45
      - say: The tokenizer can tell us which positions are real. Its boolean mask has one bit per token in
          each prompt. Add a singleton feature axis so one bit selects a whole vector. Select with
          where, sum the selected values, and divide by the count of real tokens. Two boxes are
          checked. Our original mean is back.
        hold: 0.85
        visual_cues:
          - id: padding-select
            phrase: divide by the count of real tokens
            targets:
              - padding-divisor
            color: green
            linger: 0.45
      - say: Clear every bit. The count is zero, so reject it before dividing. Check that the mask is boolean
          and matches the batch and token axes. The numbers you keep still need to be finite. Once
          you've excluded padding, shuffling the same real vectors still gives the same mean.
        hold: 0.9
        visual_cues:
          - id: clear-mask
            phrase: Clear every bit
            targets:
              - validity-bits
          - id: padding-empty
            phrase: reject it before dividing
            targets:
              - padding-empty
            color: pink
            linger: 0.45
  - id: input-guards
    title: Which input reaches the multiply?
    visual: "Build the actual project_prompts decision path from nested values: numeric rectangular
      conversion, rank checks, feature agreement, nonempty axes, and the surviving projected tensor.
      Run each malformed input through its actual failed boundary."
    beats:
      - say: Run the checks in the order the data arrives. A ragged row with a missing feature must fail at
          conversion. Ask NumPy for a rectangular numeric array. The first row can look fine while the
          next one is short. Then require three hidden-state axes and two projection axes. This next
          input lost its batch axis.
        hold: 0.7
        visual_cues:
          - id: guard-convert
            phrase: A ragged row with a missing feature must fail at conversion
            targets:
              - guard-example
            color: pink
            linger: 0.45
          - id: guard-rank
            phrase: require three hidden-state axes and two projection axes
            targets:
              - guard-example
            color: pink
            linger: 0.45
      - say: Compare the last hidden width with the first projection width. Three numbers per token can't feed
          a map with two input rows. Also reject empty axes for this exercise. Only after those checks
          perform the shared multiply. A good input gives back every projected token. Pooling is a
          separate choice.
        hold: 0.8
        visual_cues:
          - id: guard-feature
            phrase: Compare the last hidden width with the first projection width
            targets:
              - guard-example
            color: pink
            linger: 0.45
          - id: guard-nonempty
            phrase: reject empty axes for this exercise
            targets:
              - guard-example
            color: pink
            linger: 0.45
          - id: guard-product
            phrase: Only after those checks perform the shared multiply
            targets:
              - guard-example
            color: green
            linger: 0.45
      - say: Now test a value. One way is to change one input token under a fixed shared map and verify that
          other token rows stay fixed. These structural checks wouldn't catch the swapped fields in
          the latency example. A known request with two different measurements would.
        hold: 0.85
        visual_cues:
          - id: guard-locality
            phrase: change one input token under a fixed shared map and verify that other token rows stay fixed
            targets:
              - guard-example
            color: green
            linger: 0.45
  - id: linear-api
    title: How does a layer store this map?
    visual: Retain P’s numeric coefficients while placing their transposed arrangement into a real Linear
      weight. Multiply with weight.T, then repeat one bias across owned token rows. Keep input/output
      feature labels visible.
    beats:
      - say: Suppose we want PyTorch Linear to do exactly what our matrix did. Our matrix has a row per input
          feature. Linear has a row per output instead. The library stores the transposed
          coefficients, three by two. It transposes those stored weights in the multiply, then adds a
          bias. That fixed offset makes the map affine.
        hold: 0.75
        visual_cues:
          - id: linear-store
            phrase: The library stores the transposed coefficients, three by two
            targets:
              - linear-stored
            color: cyan
            linger: 0.45
      - say: Give Linear the entire batch of two-feature tokens. Its bias has three entries and repeats across
          the leading positions. A single call returns three features for every token in every prompt.
        hold: 0.8
        visual_cues:
          - id: linear-bias
            phrase: Its bias has three entries and repeats across the leading positions
            targets:
              - linear-bias
            color: pink
            linger: 0.45
      - say: Take the bias off and look at our original map again. Even though the row got wider, the third
          output here equals half the sum of the first two. Neural networks learn the coefficients in
          training. We've fixed these by hand so you can trace the exact effect of an edit.
        hold: 0.75
        visual_cues:
          - id: linear-relation
            phrase: the third output here equals half the sum of the first two
            targets:
              - picture
