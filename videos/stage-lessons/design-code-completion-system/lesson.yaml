version: 1
id: design-code-completion-system
title: One Line, Two Completion Requests
source: system-design/design-code-completion-system/content.md
voice: en-US-AndrewNeural
rate: +0%
sources:
  - title: FIM original paper and joint-training SPM encoding
    url: https://arxiv.org/html/2207.14255v1
  - title: VS Code exact inspected declarations
    url: https://github.com/microsoft/vscode/blob/1fe7285a1162756215a684ee702b16d0ce42bdb4/src/vscode-dts/vscode.d.ts
  - title: Language Server Protocol
    url: https://microsoft.github.io/language-server-protocol/
  - title: Tree-sitter error-tolerant incremental parsing
    url: https://tree-sitter.github.io/tree-sitter/
  - title: Qwen2.5-Coder technical report
    url: https://arxiv.org/html/2409.12186v3
  - title: Speculative decoding Algorithm 1
    url: https://arxiv.org/html/2211.17192v2
