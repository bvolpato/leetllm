  - id: speculative-path
    title: "Verifying a proposed argument"
    visual: >-
      Follow five toy token IDs from the draft into the emitted span. On a sampled rejection,
      align ten draft and target shares for each possible argument. Normalize the two surplus
      request shares and one surplus scope share.
    beats:
      - say: >-
          The small model drafts five tokens for our call. Each piece shown here stands for one
          token in this example. The target keeps the first four, right through the opening
          parenthesis. It replaces user with request. Count the emitted tokens.
        hold: 2
        caption_starts:
          - "The target keeps the first four"
          - "It replaces user with request"
          - "Count the emitted tokens"
        visual_cues:
          - id: spec-draft
            phrase: "drafts five tokens for our call"
            targets: [spec-work]
            linger: 0.35
          - id: spec-four
            phrase: "keeps the first four"
            targets: [spec-work]
            linger: 0.35
          - id: spec-replace
            phrase: "replaces user with request"
            targets: [spec-work]
            linger: 0.35
      - say: >-
          Five tokens. Four came from the draft and one from the correction. The new token still
          needs its keys and values computed before the next decode can use them.
          Move the rejection earlier. If just one draft token survives, the correction makes two
          outputs. Reject the first and the correction is the only output. If all five survive,
          the target can add a sixth token when the stopping rules allow it.
        hold: 0.9
        caption_starts:
          - "Move the rejection earlier"
          - "Reject the first"
          - "If all five survive"
        visual_cues:
          - id: spec-count
            phrase: "Five tokens"
            targets: [spec-work]
            linger: 0.35
          - id: spec-two
            phrase: "the correction makes two outputs"
            targets: [spec-work]
            linger: 0.35
          - id: spec-one
            phrase: "the correction is the only output"
            targets: [spec-work]
            linger: 0.35
          - id: spec-six
            phrase: "can add a sixth token"
            targets: [spec-work]
            linger: 0.35
      - say: >-
          How does a sampling verifier decide? Look at user. The draft gives it four chances in
          ten. The target gives it one. Keep a proposed user one time in four. That's target
          probability divided by draft probability, capped at one. Suppose this draw rejects user.
          Which arguments can replace user, and in what proportions?
        hold: 2
        caption_starts:
          - "Keep a proposed user one time in four"
          - "Suppose this draw rejects user"
        visual_cues:
          - id: spec-chances
            phrase: "four chances in ten"
            targets: [spec-work]
            linger: 0.35
          - id: spec-rate
            phrase: "Keep a proposed user one time in four"
            targets: [spec-work]
            linger: 0.35
          - id: spec-ask
            phrase: "Which arguments can replace user"
            targets: [spec-work]
            linger: 0.35
      - say: >-
          Look for the shares the draft was missing. Request needs two more. Scope needs one more.
          User has no shortfall. Divide each positive shortfall by their total of three. On a
          rejection, draw request two thirds of the time and scope one third. A greedy verifier
          instead follows the target's own greedy choice.
        hold: 1
        caption_starts:
          - "Request needs two more"
          - "Scope needs one more"
          - "draw request two thirds of the time and scope one third"
        visual_cues:
          - id: spec-missing
            phrase: "Look for the shares the draft was missing"
            targets: [spec-work]
            linger: 0.35
          - id: spec-residual
            phrase: "Scope needs one more"
            targets: [spec-work]
            linger: 0.35
          - id: spec-normalize
            phrase: "draw request two thirds of the time and scope one third"
            targets: [spec-work]
            linger: 0.35
      - say: >-
          Return to our five emitted tokens. Suppose the five draft steps together cost one
          ordinary target step and verification costs one more. That's five outputs for the cost
          of two steps, or two and a half per cost unit. On a busy worker, verification occupies
          positions that other requests could use. Measure first-token and full completion latency
          before enabling it.
        hold: 1
        visual_cues:
          - id: spec-cost
            phrase: "verification costs one more"
            targets: [spec-work]
            linger: 0.35
          - id: spec-ratio
            phrase: "two and a half per cost unit"
            targets: [spec-work]
            linger: 0.35
