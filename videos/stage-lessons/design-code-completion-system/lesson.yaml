scenes:
  - id: intro
    title: "Would you show this reply?"
    visual: >-
      The blue reply travels toward its original insertion point. In the editor above it,
      graph. already fills the six columns between that point and the yellow caret.
      Try the full insertion on a separate scratch line.
    beats:
      - say: >-
          Would you show this reply at the caret? Here comes a whole call for the empty assignment.
          Look where it starts. While the model was working, you pasted graph dot.
          The yellow caret is now six columns farther along.
        hold: 2.4
        caption_starts:
          - "Here comes a whole call"
          - "While the model was working"
        visual_cues:
          - id: intro-return
            phrase: "Here comes a whole call"
            targets: [intro-packet]
            linger: 0.35
          - id: intro-paste
            phrase: "you pasted graph dot"
            targets: [editor-buffer, intro-packet]
            linger: 0.35
      - say: >-
          Try it on a scratch line. You get graph dot twice. Drop that reply.
          The editor needs just the part that comes after the dot.
        hold: 1
        caption_starts:
          - "You get graph dot twice"
        visual_cues:
          - id: intro-join
            phrase: "Try it on a scratch line"
            targets: [intro-packet]
            linger: 0.35
          - id: intro-drop
            phrase: "Drop that reply"
            targets: [intro-packet, editor-buffer]
            caption_boundary: true
            linger: 0.35
  - id: lanes
    title: "Who can finish this line?"
    visual: >-
      Two consecutive snapshots expose different holes. One fits a member lookup on a known
      receiver. The other needs an expression that also fits the following return.
    beats:
      - say: >-
          Look again at the dot. The language server knows the type of graph in this example. Ask
          it for members, and it can offer allows right here on the laptop. Now go back to the
          empty assignment. A list of method names doesn't tell you which expression belongs
          between the equals sign and the return below.
        hold: 0.95
        visual_cues:
          - id: lanes-members
            phrase: "Ask it for members"
            targets: [lane-member]
            linger: 0.35
          - id: lanes-assignment
            phrase: "go back to the empty assignment"
            targets: [lane-hole]
            linger: 0.35
      - say: >-
          If the repository permits upload, send those two sides of the hole to the model. If
          permission is missing, keep the buffer local. You can still look up a name in the local
          index when receiver types are missing. A request to change several files and run tests
          belongs on the slower coding agent path. The gateway checks access and upload policy
          before accepting any remote request.
        hold: 0.9
        visual_cues:
          - id: lanes-send
            phrase: "send those two sides of the hole"
            targets: [lane-hole]
            linger: 0.35
          - id: lanes-stay
            phrase: "keep the buffer local"
            targets: [lane-hole]
            linger: 0.35
          - id: lanes-local
            phrase: "look up a name in the local index"
            targets: [lane-member]
            linger: 0.35
  - id: route-policy
    title: Apply semantic availability and actual upload permission
    visual: Use the same graph dot and open assignment; route missing types and string False separately. Keep
      local lookup before upload permission and remote gateway authority.
    beats:
      - say: >-
          Start typing a name. The local index can finish PolicyGraph from the letters on screen.
          After graph dot, the language server can offer methods for that type. An empty assignment
          needs an expression. If upload is permitted, the model can fill it in. Next-edit
          suggestions also predict where to edit. Planning a change across files and testing it is a
          job for the coding agent.
        hold: 0.7
        visual_cues:
          - id: cc-route-policy-0
            phrase: >-
              the letters on screen
            targets:
              - cc-route-policy-mechanism
            color: cyan
            linger: 0.4
      - say: >-
          After a dot or an opening parenthesis, use a local type match when one is available.
          Otherwise, look at the permission column. Only the boolean True opens the remote route.
          The quoted word False, a missing value and the integer one all stay local, even after a
          function signature. Here the inline target is two hundred milliseconds at p ninety-five. A
          multiline body gets five hundred.
        hold: 0.7
        visual_cues:
          - id: cc-route-policy-1
            phrase: >-
              use a local type match
            targets:
              - cc-route-policy-mechanism
            color: cyan
            linger: 0.4
          - id: cc-route-permission
            phrase: >-
              Only the boolean True opens the remote route
            targets:
              - cc-route-policy-mechanism
            color: cyan
            linger: 0.4
      - say: >-
          The editor picks a route. Before the gateway accepts the code, it checks who is asking,
          which repository they can read and whether its policy permits upload. If types are missing
          and upload is unavailable, the editor can still look up names locally.
        hold: 0.7
        visual_cues:
          - id: cc-route-policy-2
            phrase: >-
              whether its policy permits upload
            targets:
              - cc-route-policy-mechanism
            color: cyan
            linger: 0.4
  - id: scope-recovery
    title: Keep a preceding header separate from enclosing scope
    visual: Run actual backward scan on an incomplete assignment, then dedent past the same header; contrast its
      returned string with a syntax-node range.
    beats:
      - say: >-
          The equals sign has nothing after it yet. The editor extension knows where the caret is.
          Tree-sitter can update the syntax tree as you type, even with an unfinished line. Its
          function range helps the context engine choose a permitted snippet. The Language Server
          Protocol lets the editor ask for types. The inference server runs the model on the context
          it receives.
        hold: 0.7
        visual_cues:
          - id: cc-scope-recovery-0
            phrase: >-
              Its function range helps the context engine
            targets:
              - cc-scope-recovery-mechanism
            color: cyan
            linger: 0.4
      - say: >-
          Now look at the unindented line. Scan upward and you still find the same function header.
          Follow the blue function range instead. It ends above the caret. A text scan can also pick
          up a header inside a string or miss one split across lines. Use the enclosing syntax node
          for scope, the language server for types and repository permissions for file access.
        hold: 0.7
        visual_cues:
          - id: cc-scope-recovery-1
            phrase: >-
              Now look at the unindented line
            targets:
              - cc-scope-recovery-mechanism
            color: cyan
            linger: 0.4
          - id: cc-scope-dedent
            phrase: >-
              It ends above the caret
            targets:
              - cc-scope-recovery-mechanism
            color: cyan
            linger: 0.4
  - id: position-units
    title: Convert the caret before constructing the suffix
    visual: Align a, U+1F600 and b by code points, UTF-16 units and UTF-8 bytes; move the same caret to each
      numeric coordinate and preserve b.
    beats:
      - say: Put the caret after the emoji in a, grinning face, b. Python’s index is two. The prefix occupies three
          UTF-sixteen code units and five UTF-eight bytes. The correct Python suffix is b; copying the
          editor’s three into that slice loses b. Cutting UTF-eight at byte three splits the emoji. One
          visible character can occupy several encoding units.
        hold: 0.7
        visual_cues:
          - id: cc-position-units-0
            phrase: Put the caret after the emoji in a, grinning face, b. Python’s index is two. The prefix occupies three
              UTF-sixteen code units and five UTF-eight bytes. The correct Python suffix is b; copying the
              editor’s three into that slice loses b. Cutting UTF-eight at byte three splits the emoji. One
              visible character can occupy several encoding units.
            targets:
              - cc-position-units-mechanism
            color: cyan
            linger: 0.4
          - id: cc-position-three-five
            phrase: three UTF-sixteen code units and five UTF-eight bytes
            targets:
              - cc-position-units-mechanism
            color: cyan
            linger: 0.4
          - id: cc-position-wrong-suffix
            phrase: copying the editor’s three into that slice loses b
            targets:
              - cc-position-units-mechanism
            color: cyan
            linger: 0.4
      - say: >-
          VS Code counts UTF-sixteen units both within a line and in its document offsets. Its
          positionAt and offsetAt methods convert between those two forms. For a Python slice here,
          convert three units to two code points. Now the suffix starts with b. Check the range
          against the current document version. Edits, undo and redo all advance it.
        hold: 0.7
        visual_cues:
          - id: cc-position-units-1
            phrase: >-
              the suffix starts with b
            targets:
              - cc-position-units-mechanism
            color: cyan
            linger: 0.4
  - id: fim
    title: Send both sides of the hole before generating
    visual: Prefix, hole and suffix in file order transform into a model-specific prefix-suffix-middle prompt.
    beats:
      - say: Code is often inserted between existing lines. A prefix-only continuation cannot condition on the return
          statement already below the hole. Fill-in-the-middle training moves the missing span after its
          surrounding text so a causal decoder can generate it while seeing both boundaries.
        hold: 0.75
        visual_cues:
          - id: fim-beat-1-focus-1
            phrase: A prefix-only continuation cannot condition on the return statement already below the hole
            targets:
              - fim-panel-fim
            color: cyan
            linger: 0.65
      - say: "Watch file order become prompt order: prefix, suffix, then the middle marker and generated insertion.
          The marker names here show their roles. A native adapter must use the selected checkpoint’s trained
          tokens and format, then verify that the returned edit fits the preserved code."
        hold: 0.85
        visual_cues:
          - id: fim-beat-2-focus-1
            phrase: A native adapter must use the selected checkpoint’s trained tokens and format
            targets:
              - fim-panel-fim
            color: cyan
            linger: 0.65
  - id: fim-training
    title: Train the middle after its two preserved boundaries
    visual: Split actual source into prefix, middle and suffix, then move middle after suffix with model-specific
      sentinel IDs; build the joint-training SPM variant separately.
    beats:
      - say: >-
          Cut the missing expression out of a training example. Put the prefix and suffix first,
          separated by marker tokens, then put the missing expression last. As the model predicts
          each token of that expression, it can see both sides of the hole. Cutting at character
          boundaries also gives it practice with edits inside tokenizer pieces. In the original
          study, mixing these examples with ordinary text preserved left-to-right completion on the
          evaluations.
        hold: 0.7
        visual_cues:
          - id: cc-fim-training-0
            phrase: >-
              it can see both sides of the hole
            targets:
              - cc-fim-training-mechanism
            color: cyan
            linger: 0.4
      - say: Our displayed PSM order is prefix marker, prefix, suffix marker, suffix, then middle marker. In the
          original paper’s joint-training SPM variant, prefix marker and suffix marker precede the suffix;
          middle marker then precedes the contiguous prefix and generated middle. At inference, stop after
          that prefix and generate the middle. Other SPM encodings exist, so marker placement belongs to the
          checkpoint contract.
        hold: 0.7
        visual_cues:
          - id: cc-fim-training-1
            phrase: Our displayed PSM order is prefix marker, prefix, suffix marker, suffix, then middle marker. In the
              original paper’s joint-training SPM variant, prefix marker and suffix marker precede the suffix;
              middle marker then precedes the contiguous prefix and generated middle. At inference, stop after
              that prefix and generate the middle. Other SPM encodings exist, so marker placement belongs to
              the checkpoint contract.
            targets:
              - cc-fim-training-mechanism
            color: cyan
            linger: 0.4
          - id: cc-fim-psm
            phrase: prefix marker, prefix, suffix marker, suffix, then middle marker
            targets:
              - cc-fim-training-mechanism
            color: cyan
            linger: 0.4
          - id: cc-fim-spm
            phrase: middle marker then precedes the contiguous prefix and generated middle
            targets:
              - cc-fim-training-mechanism
            color: cyan
            linger: 0.4
      - say: >-
          Qwen two point five Coder trained with markers for infill and repository context. A client
          for that checkpoint uses its trained token IDs. With an instruction-following model,
          another option is to give it the two pieces as ordinary text and ask for the insertion.
          Compare the returned spans and the time to display them when choosing among smaller,
          larger and distilled models.
        hold: 0.7
        visual_cues:
          - id: cc-fim-training-2
            phrase: >-
              uses its trained token IDs
            targets:
              - cc-fim-training-mechanism
            color: cyan
            linger: 0.4
  - id: infill-boundaries
    title: Insert only the generated middle into the same hole
    visual: Return the generated span to the original file while retaining suffix and scope; show literal
      marker-like source strings encoded as content.
    beats:
      - say: >-
          The line below returns is_allowed, so the expression above it has to supply that value.
          Our fictional graph offers an allows method. For an actual permission check, look up the
          method signature and test both an allowed and a denied request. Review the policy before
          shipping the call. The editor is proposing source text. The application enforces access
          when it runs.
        hold: 0.7
        visual_cues:
          - id: cc-infill-boundaries-0
            phrase: >-
              test both an allowed and a denied request
            targets:
              - cc-infill-boundaries-mechanism
            color: cyan
            linger: 0.4
      - say: >-
          The adapter puts the checkpoint's marker IDs around the code. If those same characters
          appear inside a source string, encode them as ordinary text. Return only the generated
          middle to the intended range. Check the stop condition, boundaries and document version
          before insertion. The return statement stays where it was.
        hold: 0.7
        visual_cues:
          - id: cc-infill-boundaries-1
            phrase: >-
              encode them as ordinary text
            targets:
              - cc-infill-boundaries-mechanism
            color: cyan
            linger: 0.4
          - id: cc-insert-middle
            phrase: >-
              Return only the generated middle to the intended range
            targets:
              - cc-infill-boundaries-mechanism
            color: cyan
            linger: 0.4
  - id: context
    title: Reserve the suffix inside the whole prompt budget
    visual: A shared eight-thousand-token allocation retains framing, prefix, suffix and definitions before a
      final snippet uses only the remaining space.
    beats:
      - say: The prompt needs useful context without reading the whole repository on every keystroke. Authorize
          candidate files first. Reserve the edit’s suffix and framing, then spend the remaining prompt budget
          on nearby code and relevant definitions. Keep output capacity separately within the model’s total
          context limit.
        hold: 0.75
        visual_cues:
          - id: context-preserve-edit-boundaries
            phrase: Reserve the edit’s suffix and framing
            targets:
              - context-suffix
              - context-framing
            color: cyan
            linger: 0.6
          - id: context-nearby-code
            phrase: then spend the remaining prompt budget on nearby code and relevant definitions
            targets:
              - context-prefix
              - context-definitions
            color: yellow
            linger: 0.6
      - say: Our supplied allocation leaves room for only part of another snippet. Use the remaining capacity rather
          than silently dropping the suffix. Context may change the answer, but it also changes transfer and
          prefill work. Evaluate the complete context policy under the actual latency and privacy
          requirements.
        hold: 0.85
        visual_cues:
          - id: context-additional-snippet
            phrase: Our supplied allocation leaves room for only part of another snippet
            targets:
              - context-snippet
            color: cyan
            linger: 0.6
          - id: context-retain-suffix
            phrase: rather than silently dropping the suffix
            targets:
              - context-suffix
            color: yellow
            linger: 0.6
  - id: context-ranking
    title: Compute symbol overlap after filtering allowed files
    visual: Construct the exact active/S/P/M symbol membership sets and intersection/union; admit only
      threshold-passing authorized definitions into the retained budget.
    beats:
      - say: >-
          Give each file a permission check, including unsaved buffers and retrieved files. With
          eight thousand prompt tokens to spend, set aside space for the suffix and its markers.
          Fill the rest with the prefix, definitions, recent edits and relevant neighbors. Leave
          room in the model's total window for output too. Time prefill on these prompts to see what
          fits the keystroke budget.
        hold: 0.7
        visual_cues:
          - id: cc-context-ranking-0
            phrase: >-
              set aside space for the suffix and its markers
            targets:
              - cc-context-ranking-mechanism
            color: cyan
            linger: 0.4
      - say: >-
          For Jaccard similarity, count unique symbols. The active file and scope_rules share two
          names out of four distinct names altogether. That is two divided by four, or point five.
          Policy_graph shares one of
          four, or point two five. Metrics shares zero of five. With a threshold of at least point
          two five, select the first two.
        hold: 0.7
        visual_cues:
          - id: cc-context-ranking-1
            phrase: >-
              Count unique symbols
            targets:
              - cc-context-ranking-mechanism
            color: cyan
            linger: 0.4
          - id: cc-jaccard-half
            phrase: two divided by four, or point five
            targets:
              - cc-context-ranking-mechanism
            color: cyan
            linger: 0.4
          - id: cc-jaccard-quarter
            phrase: one of four, or point two five
            targets:
              - cc-context-ranking-mechanism
            color: cyan
            linger: 0.4
          - id: cc-jaccard-select
            phrase: select the first two
            targets:
              - cc-context-ranking-mechanism
            color: cyan
            linger: 0.4
      - say: BM twenty-five can search a ready sparse index; prepared dense indexes can also retrieve definitions.
          Measure retrieval, any reranker and assembly together. An iterative retrieve-generate-retrieve loop
          adds serial calls, so this design puts it on the slower route. If a known definition is missing,
          inspect extraction, authorization and index freshness before enlarging the prompt.
        hold: 0.7
        visual_cues:
          - id: cc-context-ranking-2
            phrase: BM twenty-five can search a ready sparse index; prepared dense indexes can also retrieve definitions.
              Measure retrieval, any reranker and assembly together. An iterative retrieve-generate-retrieve
              loop adds serial calls, so this design puts it on the slower route. If a known definition is
              missing, inspect extraction, authorization and index freshness before enlarging the prompt.
            targets:
              - cc-context-ranking-mechanism
            color: cyan
            linger: 0.4
  - id: freshness
    title: "Two replies for one line"
    visual: >-
      R42 arrives first. Compare its captured row with the live row, paint its gray span, then
      deliver R41 while R42 is still visible.
    beats:
      - say: >-
          We're back at the dot in the editor. The reply for the newer request arrives first.
          Compare its row with the editor. Both point just past the dot. The file, version,
          selection, policy and request number all match. Can the editor show this reply at the caret?
        hold: 1.8
        visual_cues:
          - id: fresh-pair
            phrase: "Compare its row with the editor"
            targets: [editor-snapshots, editor-buffer]
            linger: 0.35
      - say: >-
          Show the call in gray. That's ghost text. The developer can still walk away with a line
          that ends at the dot.
        hold: 0.65
        visual_cues:
          - id: fresh-paint
            phrase: "Show the call in gray"
            targets: [editor-buffer]
            linger: 0.35
      - say: >-
          Here comes the reply for the empty assignment. Follow its range. It starts six columns
          earlier, before the word graph. Which suggestion should stay at the caret?
        hold: 2.2
        visual_cues:
          - id: fresh-older
            phrase: "Here comes the reply for the empty assignment"
            targets: [editor-snapshots, editor-buffer]
            linger: 0.35
          - id: fresh-range
            phrase: "It starts six columns earlier"
            targets: [editor-snapshots, editor-buffer]
            linger: 0.35
      - say: >-
          Keep the gray call. Discard only the late reply. The request number, or epoch, advances
          on a text edit, a caret or selection move, or a policy change, even if the editor sends
          nothing. Cancellation may save server work. The captured state tells the editor what to
          do when cancellation arrives too late.
        hold: 1
        visual_cues:
          - id: fresh-keep
            phrase: "Keep the gray call"
            targets: [editor-buffer, editor-snapshots]
            linger: 0.35
          - id: fresh-drop
            phrase: "Discard only the late reply"
            targets: [editor-outcome]
            linger: 0.35
  - id: debounce-history
    title: "Three keystrokes, one send"
    visual: >-
      Replay the article's local request manager. Each new letter cancels the previous timer.
      Inject a late epoch-two response, then move the caret and change policy while the send log
      stays fixed.
    beats:
      - say: >-
          Type r. The editor sets a timer for a hundred and fifty milliseconds. Before it fires,
          type o. That cancels the first timer and starts another. Now type a dot. This trigger
          has zero delay. Only request three reaches the send log.
        hold: 0.95
        visual_cues:
          - id: deb-first
            phrase: "Type r"
            targets: [deb-keys]
            linger: 0.35
          - id: deb-next
            phrase: "type o"
            targets: [deb-keys]
            linger: 0.35
          - id: deb-dot
            phrase: "Now type a dot"
            targets: [deb-keys]
            linger: 0.35
          - id: deb-send
            phrase: "Only request three reaches the send log"
            targets: [deb-log]
            linger: 0.35
      - say: >-
          Request three paints a suggestion. Now hand the editor a late reply marked two. In this
          local test we even give it the current document snapshot. Which reply stays visible?
        hold: 2
        visual_cues:
          - id: deb-paint
            phrase: "Request three paints a suggestion"
            targets: [deb-log]
            linger: 0.35
          - id: deb-late
            phrase: "a late reply marked two"
            targets: [deb-log]
            linger: 0.35
      - say: >-
          Three stays visible. The request number alone rules out two. Move just the caret. That
          clears the ghost and advances the epoch without sending anything. A matching test reply
          can paint at the new position. Now change the policy. The ghost clears again. Tab has
          nothing to insert.
        hold: 1
        visual_cues:
          - id: deb-keep
            phrase: "Three stays visible"
            targets: [deb-log]
            linger: 0.35
          - id: deb-move
            phrase: "Move just the caret"
            targets: [deb-log]
            linger: 0.35
          - id: deb-again
            phrase: "A matching test reply can paint at the new position"
            targets: [deb-log]
            linger: 0.35
          - id: deb-policy
            phrase: "Now change the policy"
            targets: [deb-log]
            linger: 0.35
      - say: >-
          The send log still has just one entry. This replay ran locally. On a server, also
          propagate cancellation and bound the deadline and output length. A request may already
          have entered the GPU queue or started computing. Count that work even when the editor
          discards every late token.
        hold: 0.9
        visual_cues:
          - id: deb-summary
            phrase: "just one entry"
            targets: [deb-log]
            linger: 0.35
  - id: acceptance-race
    title: "Between paint and Tab"
    visual: >-
      Replay the same ghost twice. Tab inserts fifteen characters after an unchanged paint and
      inserts nothing after a policy update. Then rebase only the remaining letters after a
      matching typed prefix.
    beats:
      - say: >-
          The gray call has reached the right place. Press Tab while both rows still match. The
          editor checks the version and range as it applies the edit. The call becomes part of the
          line. The caret lands after the closing parenthesis.
        hold: 0.9
        visual_cues:
          - id: tab-apply
            phrase: "The call becomes part of the line"
            targets: [editor-buffer, editor-snapshots]
            linger: 0.35
      - say: >-
          Rewind to the same gray call. This time the repository policy changes before Tab. The
          letters in the buffer and the caret stay put. What will Tab insert?
        hold: 2.1
        visual_cues:
          - id: tab-policy
            phrase: "the repository policy changes before Tab"
            targets: [editor-snapshots, editor-buffer]
            linger: 0.35
      - say: >-
          Nothing is inserted. Changing the policy cleared the ghost. The editor checks again at
          acceptance because a selection change or a caret move can also happen after paint. A
          real editor must apply an edit against the version and range it just checked in one
          atomic operation.
        hold: 0.9
        visual_cues:
          - id: tab-empty
            phrase: "Nothing is inserted"
            targets: [editor-buffer, editor-snapshots]
            linger: 0.35
      - say: >-
          Replay the original proposal once more. Now the developer types the first three letters
          of allows. To keep the remainder, the client must check that the letters match, move the
          start to column twenty-six and bind the remaining text to the new version. Only then can
          it show the rest. Otherwise it clears the suggestion.
        hold: 1.1
        visual_cues:
          - id: tab-type
            phrase: "types the first three letters of allows"
            targets: [editor-buffer, editor-snapshots]
            linger: 0.35
          - id: tab-rebase
            phrase: "Only then can it show the rest"
