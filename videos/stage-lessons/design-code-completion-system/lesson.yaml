              slice. A model that shows only tiny obvious tokens can raise acceptance while reducing useful
              work. A model that abstains heavily can improve shown-only accuracy while failing users. Report
              cost per accepted-and-retained suggestion alongside correctness and coverage, not request count
              alone.
            targets:
              - cc-evaluation-release-mechanism
            color: cyan
            linger: 0.4
  - id: fleet-work
    title: Subtract pre-admission cancellation before counting uncached input
    visual: >-
      Start with 5,000 active editors making 0.4 requests per second each. Remove the 60 percent
      cancelled before admission. Count prefill for the 800 remaining requests per second and
      compare it with GPU capacity.
    beats:
      - say: >-
          Suppose five thousand editors are actively typing. Each sends point four remote requests a
          second on average. That makes two thousand raw requests per second. Sixty percent cancel
          before GPU admission, leaving eight hundred. If a request cancels after the GPU starts
          work, count the work it already used.
        hold: 0.7
        visual_cues:
          - id: cc-fleet-work-0
            phrase: >-
              five thousand editors are actively typing
            targets:
              - cc-fleet-work-mechanism
            color: cyan
            linger: 0.4
          - id: cc-raw2000
            phrase: two thousand raw requests per second
            targets:
              - cc-fleet-work-mechanism
            color: cyan
            linger: 0.4
          - id: cc-admit800
            phrase: leaving eight hundred
            targets:
              - cc-fleet-work-mechanism
            color: cyan
            linger: 0.4
      - say: Every surviving request in this first worksheet has two thousand forty-eight prompt tokens. Half hit and
          skip three quarters of prefill; misses keep all work. Remaining work fraction is one half times one
          quarter plus one half, or point six two five. Eight hundred times two thousand forty-eight times
          that fraction is one million twenty-four thousand prefill tokens per second.
        hold: 0.7
        visual_cues:
          - id: cc-fleet-work-1
            phrase: Every surviving request in this first worksheet has two thousand forty-eight prompt tokens. Half hit
              and skip three quarters of prefill; misses keep all work. Remaining work fraction is one half
              times one quarter plus one half, or point six two five. Eight hundred times two thousand
              forty-eight times that fraction is one million twenty-four thousand prefill tokens per second.
            targets:
              - cc-fleet-work-mechanism
            color: cyan
            linger: 0.4
          - id: cc-prefill1024k
            phrase: one million twenty-four thousand prefill tokens per second
            targets:
              - cc-fleet-work-mechanism
            color: cyan
            linger: 0.4
      - say: >-
          At our assumed rate of twenty thousand prefill tokens per GPU-second, that takes fifty-one
          point two GPUs, rounded up to fifty-two GPUs for prefill. To size a serving fleet, also
          measure decode, work on late cancellations and KV memory at the target latency. Leave
          capacity for uneven loads, failures and spikes.
        hold: 0.7
        visual_cues:
          - id: cc-fleet-work-2
            phrase: >-
              At our assumed rate
            targets:
              - cc-fleet-work-mechanism
            color: cyan
            linger: 0.4
          - id: cc-gpu52
            phrase: >-
              rounded up to fifty-two GPUs for prefill
            targets:
              - cc-fleet-work-mechanism
            color: cyan
            linger: 0.4
  - id: cohort-work
    title: "Prefill for two groups of requests"
    visual: >-
      Keep 400 hits and 400 misses per second. Swap their lengths on a common token scale, cut
      away the reusable three quarters on hits, and sum the two bands of remaining work.
    beats:
      - say: >-
          Keep the eight hundred requests per second from the previous example. Half hit the
          cache. Every hit skips three quarters of its prompt. Now put the long prompts on the
          hits. Even before we add anything, you can see how much of the long bar the cache takes
          out.
        hold: 0.75
        visual_cues:
          - id: cohort-long-hits
            phrase: "put the long prompts on the hits"
            targets: [cohort-bars]
            linger: 0.35
          - id: cohort-trim
            phrase: "the cache takes out"
            targets: [cohort-bars]
            linger: 0.35
      - say: >-
          Each hit still needs seven hundred sixty-eight tokens. Multiply by four hundred hits a
          second. Add the work from four hundred full misses. That's seven hundred sixteen
          thousand eight hundred prefill tokens a second. At our assumed rate of twenty thousand
          per GPU-second, round up to thirty-six GPUs for prefill.
        hold: 1
        visual_cues:
          - id: cohort-first-total
            phrase: "seven hundred sixteen thousand eight hundred prefill tokens a second"
            targets: [cohort-sum]
            linger: 0.35
          - id: cohort-first-count
            phrase: "round up to thirty-six GPUs"
            targets: [cohort-sum]
            linger: 0.35
      - say: >-
          Swap the lengths. The request count, average length and hit rate all stay the same. This
          time the cache removes three quarters of the short bar. Does the fleet still have the
          same amount of prefill to do?
        hold: 2.15
        visual_cues:
          - id: cohort-swap
            phrase: "Swap the lengths"
            targets: [cohort-bars]
            linger: 0.35
          - id: cohort-short-cut
            phrase: "removes three quarters of the short bar"
            targets: [cohort-bars]
            linger: 0.35
      - say: >-
          The long prompts now miss. All three thousand seventy-two tokens on each of them need
          prefill. The two groups together need one million three hundred thirty-one thousand two
          hundred tokens per second. Round up and you get sixty-seven GPUs. The equal-length case
          needed fifty-two. Group the requests by the work they save before you size the fleet.
          Decode, late cancellations and operating headroom still need their own budget.
        hold: 1
        caption_starts:
          - "one million three hundred thirty-one thousand two hundred tokens per second"
          - "sixty-seven GPUs"
        visual_cues:
          - id: cohort-second-total
            phrase: "one million three hundred thirty-one thousand two hundred tokens per second"
            targets: [cohort-sum]
            linger: 0.35
          - id: cohort-second-count
            phrase: "you get sixty-seven GPUs"
            targets: [cohort-sum]
            linger: 0.35
  - id: affinity-wait
    title: "The warm worker's queue"
    visual: >-
      Pin cold service on a millisecond ruler. Keep warm decode the same width while an extra
      queue pushes warm prefill and decode past the cold finish.
    beats:
      - say: >-
          These two workers can both serve the request. Ignore the queue time they share and line
          up their service times. The cold worker needs seventy-two milliseconds of prefill. The
          warm one needs eleven. Both spend twenty-four on decode. How much extra waiting can the
          warm worker afford?
        hold: 2.1
        visual_cues:
          - id: aff-services
            phrase: "line up their service times"
            targets: [aff-rails]
            linger: 0.35
      - say: >-
          Sixty-one milliseconds brings them level. That's the prefill time the warm worker saved.
          Now suppose the warm queue adds seventy milliseconds. Keep the two service blocks the
          same size. Which finishes first?
        hold: 2.2
        visual_cues:
          - id: aff-tie
            phrase: "Sixty-one milliseconds brings them level"
            targets: [aff-rails]
            linger: 0.35
          - id: aff-extra
            phrase: "the warm queue adds seventy milliseconds"
            targets: [aff-rails]
            linger: 0.35
      - say: >-
          Send this request to the cold worker. It finishes in ninety-six milliseconds after the
          shared wait. Warm finishes in a hundred and five. Cold wins by nine. On a real router,
          check repository access, model, capacity and permitted region first. Compare the full
          waits of eligible workers. A response from either worker still has to match the editor.
        hold: 1
        visual_cues:
          - id: aff-win
            phrase: "Send this request to the cold worker"
            targets: [aff-rails]
            linger: 0.35
          - id: aff-nine
            phrase: "Cold wins by nine"
            targets: [aff-rails]
            linger: 0.35
  - id: batch-cost
    title: Measure shared-GPU scheduling under short-lived editor traffic
    visual: >-
      When the short request finishes, admit the waiting request beside the long one. Count work
      already spent on cancelled requests in the serving cost.
    beats:
      - say: Continuous batching lets requests join and leave active model work; waiting for a fixed batch can delay
          the first token. Paged KV storage manages physical blocks while the scheduler still needs suitable
          input and output budgets. More utilization can accompany worse editor queueing, so compare TTFT,
          edit-to-paint and throughput on the actual cancellable mix.
        hold: 0.7
        visual_cues:
          - id: cc-batch-cost-0
            phrase: Continuous batching lets requests join and leave active model work; waiting for a fixed batch can
              delay the first token. Paged KV storage manages physical blocks while the scheduler still needs
              suitable input and output budgets. More utilization can accompany worse editor queueing, so
              compare TTFT, edit-to-paint and throughput on the actual cancellable mix.
            targets:
              - cc-batch-cost-mechanism
            color: cyan
            linger: 0.4
      - say: >-
          vLLM and SGLang are two engines you can try on this workload. Hugging Face lists TGI in
          maintenance mode. Compare the engines you can deploy using the same traffic, quality
          checks and display policy. Include work spent on cancelled requests and ignored
          suggestions. Divide total serving cost by the number of accepted suggestions with text
          still in the file.
        hold: 0.7
        visual_cues:
          - id: cc-batch-cost-1
            phrase: >-
              Include work spent on cancelled requests
            targets:
              - cc-batch-cost-mechanism
            color: cyan
            linger: 0.4
  - id: upload-boundary
    title: Remove recognized secrets before crossing the client boundary
    visual: >-
      Replace the demo token before upload and keep its mapping on the laptop. Show what happens
      when the file already contains a placeholder. Follow the separate audit event across the
      same boundary.
    beats:
      - say: >-
          Watch the sample token in the editor. Before the prompt leaves the laptop, the extension
          replaces the match with a placeholder and keeps the mapping locally. Now the file already
          contains a placeholder. Stop before upload to keep the two values distinct. This detector
          recognizes one demo pattern. A service also needs coverage tests, upload controls and
          restricted logs.
        hold: 0.7
        caption_starts:
          - "Now the file already contains a placeholder"
          - "Stop before upload"
        visual_cues:
          - id: cc-upload-boundary-0
            phrase: >-
              Watch the sample token
            targets:
              - cc-upload-boundary-mechanism
            color: cyan
            linger: 0.4
          - id: cc-redacted-before-upload
            phrase: >-
              replaces the match with a placeholder and keeps the mapping locally
            targets:
              - cc-upload-boundary-mechanism
            color: cyan
            linger: 0.4
          - id: cc-existing-placeholder
            phrase: "Now the file already contains a placeholder"
            targets: [cc-upload-boundary-mechanism]
          - id: cc-placeholder-collision
            phrase: >-
              Stop before upload
            targets:
              - cc-upload-boundary-mechanism
            color: cyan
            linger: 0.4
      - say: Returned placeholder text remains visible for local review. Never automatically restore a secret into
          arbitrary model-chosen output. Source comments and retrieved files are untrusted context, not
          authority to widen upload permissions or read another repository. A shared prompt cache must honor
          the same authenticated scope as ingestion.
        hold: 0.7
        visual_cues:
          - id: cc-upload-boundary-1
            phrase: Returned placeholder text remains visible for local review. Never automatically restore a secret into
              arbitrary model-chosen output. Source comments and retrieved files are untrusted context, not
              authority to widen upload permissions or read another repository. A shared prompt cache must
              honor the same authenticated scope as ingestion.
            targets:
              - cc-upload-boundary-mechanism
            color: cyan
            linger: 0.4
          - id: cc-return-placeholder
            phrase: Returned placeholder text remains visible for local review
            targets:
              - cc-upload-boundary-mechanism
            color: cyan
            linger: 0.4
      - say: >-
          Look at what crosses the boundary in the audit event. It contains only validated tenant,
          model and bounded latency bucket. The prompt stays out. Trace the same request through
          proxy logs, exceptions, crash reports and SDKs to check where else a copy could land. If
          the agreement rules out training on customer code, disable raw prompt collection and
          downstream training exports.
        hold: 0.7
        visual_cues:
          - id: cc-upload-boundary-2
            phrase: >-
              what crosses the boundary in the audit event
            targets:
              - cc-upload-boundary-mechanism
            color: cyan
            linger: 0.4
          - id: cc-telemetry-fields
            phrase: only validated tenant, model and bounded latency bucket
            targets:
              - cc-upload-boundary-mechanism
            color: cyan
            linger: 0.4
  - id: private-deployment
    title: Keep identity and retention controls inside a private route
    visual: >-
      Place the editor, context engine and inference server inside the offline boundary. Label
      the access, network and logging controls that the team operates there.
    beats:
      - say: >-
          Some teams can send code to a private endpoint. Others self-host, or keep the machine
          offline. In the offline case, the context engine, model and inference server stay local.
          Inside that boundary the team still manages repository access, network rules, logs, the
          software supply chain and model licensing.
        hold: 0.7
        visual_cues:
          - id: cc-private-deployment-0
            phrase: >-
              Some teams can send code to a private endpoint
            targets:
              - cc-private-deployment-mechanism
            color: cyan
            linger: 0.4
          - id: cc-offline-local
            phrase: context engine, model and inference server stay local
            targets:
              - cc-private-deployment-mechanism
            color: cyan
            linger: 0.4
      - say: State what source may be uploaded, retained or used for training, and apply the policy across telemetry,
          batches, caches and recovery paths. Shared device batches can be compatible with isolation if actual
          per-request boundaries and observability are tested; otherwise partition until that evidence exists.
          An ordinary redacted prompt is still governed proprietary context.
        hold: 0.7
        visual_cues:
          - id: cc-private-deployment-1
            phrase: State what source may be uploaded, retained or used for training, and apply the policy across
              telemetry, batches, caches and recovery paths. Shared device batches can be compatible with
              isolation if actual per-request boundaries and observability are tested; otherwise partition
              until that evidence exists. An ordinary redacted prompt is still governed proprietary context.
            targets:
              - cc-private-deployment-mechanism
            color: cyan
            linger: 0.4
  - id: public-matches
    title: Review code provenance and understanding before accepting
    visual: >-
      Follow a proposed permission check through public-code matching. Review the method
      signature and the expected results for requests inside and outside the permitted scope.
    beats:
      - say: >-
          Suppose a suggestion matches public code. Depending on the account or organization policy,
          GitHub can block it or show a reference. The index covers public GitHub repositories and
          refreshes periodically. Review the accepted code for provenance, licensing and attribution
          even when that search turns up nothing.
        hold: 0.7
        visual_cues:
          - id: cc-public-matches-0
            phrase: >-
              GitHub can block it or show a reference
            targets:
              - cc-public-matches-mechanism
            color: cyan
            linger: 0.4
          - id: cc-public-index
            phrase: >-
              refreshes periodically
            targets:
              - cc-public-matches-mechanism
            color: cyan
            linger: 0.4
      - say: >-
          Now read the proposed call as application code. Does this version of the library have an
          allows method? Does it deny a request outside the permitted scope? An invented or
          deprecated method can look convincing on the page. Check the signature and run both
          permission cases before relying on it. Keeping the suggestion in the file records an edit.
          Those tests check its behavior.
        hold: 0.7
        visual_cues:
          - id: cc-public-matches-1
            phrase: >-
              Does it deny a request outside the permitted scope
            targets:
              - cc-public-matches-mechanism
            color: cyan
            linger: 0.4
  - id: diagnostic-repair
    title: Change the state or stage that explains the visible failure
    visual: >-
      Pair each symptom with a check. Trace a late suggestion back to its editor snapshot, a
      missing method back to local type information and a cache miss back to the prefix and
      worker.
    beats:
      - say: >-
          A suggestion landed in the wrong place. Replay the edit, a late reply and the checks at
          paint and Tab. For a slow method lookup after a dot, check whether the language server had
          the receiver's type. If the insertion conflicts with the next line, inspect the suffix and
          the checkpoint's infill format. If the wrong function was sent as context, compare the
          caret with the parser's function range.
        hold: 0.7
        visual_cues:
          - id: cc-diagnostic-repair-0
            phrase: >-
              Replay the edit
            targets:
              - cc-diagnostic-repair-mechanism
            color: cyan
            linger: 0.4
      - say: For poor cache hits, compare actual leading IDs, adapter and policy scope, eviction and replica placement
          before enforcing affinity. For latency spikes, separate queue, context, prefill, decode and
          debounce. For apparent acceptance gains, inspect shown population and retained text. Change one
          causal lever on a fixed replay and preserve the original editor snapshot in the report.
        hold: 0.7
        visual_cues:
          - id: cc-diagnostic-repair-1
            phrase: For poor cache hits, compare actual leading IDs, adapter and policy scope, eviction and replica
              placement before enforcing affinity. For latency spikes, separate queue, context, prefill,
              decode and debounce. For apparent acceptance gains, inspect shown population and retained text.
              Change one causal lever on a fixed replay and preserve the original editor snapshot in the
              report.
            targets:
              - cc-diagnostic-repair-mechanism
            color: cyan
            linger: 0.4
  - id: synthesis
    title: "What did Tab add?"
    visual: >-
      Count one shown suggestion across paint, Tab, undo and the end of its observation window.
      The developer's own graph dot stays in the buffer.
    beats:
      - say: >-
          Come back to the suggestion after graph dot. The latency clock that began with the
          qualifying edit stops when this gray span appears. That's one suggestion shown. The
          developer presses Tab. Now fifteen characters belong to the buffer. That's one accepted
          suggestion.
        hold: 0.8
        visual_cues:
          - id: close-show
            phrase: "when this gray span appears"
            targets: [editor-buffer, edit-counts]
            linger: 0.35
          - id: close-tab
            phrase: "The developer presses Tab"
            targets: [editor-buffer, edit-counts]
            linger: 0.35
      - say: >-
          The developer undoes that insertion. Watch where the caret lands. Graph dot was already
          there. At the end of the observation window, how many of those fifteen inserted
          characters remain?
        hold: 2.1
        visual_cues:
          - id: close-undo
            phrase: "undoes that insertion"
            targets: [editor-buffer, edit-counts]
            linger: 0.35
          - id: close-window
            phrase: "At the end of the observation window"
            targets: [edit-counts]
            linger: 0.35
      - say: >-
          Zero remain. This suggestion still counts as accepted. Following its characters through
          the undo tells us something the Tab press alone couldn't tell us. To learn whether the
          call implements the right policy, we'd still need to check its behavior.
        hold: 0.9
        visual_cues:
          - id: close-zero
            phrase: "Zero remain"
            targets: [edit-counts, editor-buffer]
            linger: 0.35
  - id: fresh-cursor
    title: "A round trip with the caret"
    visual: >-
      A request waits at column 12. Move the real caret three columns to the comment and back.
      Compare the late R101 with epoch 103, then run a fresh R104 through paint and Tab.
    beats:
      - say: >-
          One more reply is on its way. It belongs just after the dot, at column twelve. Move the
          caret to the comment at fifteen. Now move it back to twelve. Neither move changed the
          text or sent a request. The original reply arrives. Can the editor show it here?
        hold: 2.5
        caption_starts:
          - "Move the caret to the comment at fifteen"
          - "Now move it back to twelve"
          - "The original reply arrives"
          - "Can the editor show it here"
        visual_cues:
          - id: cc-fresh-move15
            phrase: "Move the caret to the comment at fifteen"
            targets: [editor-buffer, editor-snapshots]
            linger: 0.35
          - id: cc-fresh-return12
            phrase: "Now move it back to twelve"
            targets: [editor-buffer, editor-snapshots]
            linger: 0.35
          - id: cursor-arrival
            phrase: "The original reply arrives"
            targets: [editor-snapshots, editor-buffer]
            linger: 0.35
      - say: >-
          Drop the old reply. Its request epoch is still one hundred one. The two moves took the
          editor to one hundred three. The range matches again, but that request was invalidated
          on the way out. Send a fresh request from this caret. The new reply matches and paints.
        hold: 0.9
        caption_starts:
          - "Its request epoch is still one hundred one"
          - "Send a fresh request from this caret"
          - "The new reply matches and paints"
        visual_cues:
          - id: cc-fresh-deny
            phrase: "Drop the old reply"
            targets: [editor-snapshots, editor-buffer]
            linger: 0.35
          - id: cc-fresh-current-request
            phrase: "Send a fresh request from this caret"
            targets: [editor-snapshots]
            linger: 0.35
          - id: cc-fresh-current-paint
            phrase: "The new reply matches and paints"
            targets: [editor-buffer, editor-snapshots]
            linger: 0.35
      - say: >-
          Press Tab with both rows still matched. The call goes in just before the comment.
          Try that round trip in a client test. Only the fresh reply should appear.
          Next, two teams share a GPU. Which work can they reuse while keeping their code private?
        hold: 1.2
        visual_cues:
          - id: cursor-insert
            phrase: "The call goes in just before the comment"
            targets: [editor-buffer, editor-snapshots]
            linger: 0.35
