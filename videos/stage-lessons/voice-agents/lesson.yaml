  - id: media-affinity
    title: Keep packet state with its owner while inference scales
    visual: Route four packets for the actual article session to media-c using its fixed worker set; remove that
      worker, show missing DTLS/SRTP/buffer state, and make reconnect/rebuild explicit rather than copying
      model text as transport state.
    beats:
      - say: One media worker owns the call’s DTLS keys, SRTP state, jitter buffer and often its playback cursor.
          Naive round-robin packet routing can send the next packet to a worker without that state. Behind
          this boundary, recognition, language-model and synthesis pools can scale independently by measured
          CPU, GPU and queue pressure.
        hold: 0.85
        visual_cues:
          - id: va-media-affinity-0-0
            phrase: One media worker owns the call’s DTLS keys, SRTP state, jitter buffer and often its playback cursor.
            targets:
              - va-media-affinity-owner
            color: cyan
            linger: 0.3
          - id: va-media-affinity-0-1
            phrase: Naive round-robin packet routing can send the next packet to a worker without that state.
            targets:
              - va-media-affinity-owner
            color: yellow
            linger: 0.3
          - id: va-media-affinity-0-2
            phrase: Behind this boundary, recognition, language-model and synthesis pools can scale independently by
              measured CPU, GPU and queue pressure.
            targets:
              - va-media-affinity-owner
            color: cyan
            linger: 0.3
      - say: The article’s fixed three-worker hash maps all four packets for call-Alex-four-two-one-nine to media-c.
          That demonstrates repeatable affinity only with this unchanged worker set. It is not a
          consistent-hashing or failover implementation. Worker changes need connection-aware routing or a
          defined remapping strategy, plus explicit state recovery.
        hold: 0.85
        visual_cues:
          - id: va-media-affinity-1-0
            phrase: The article’s fixed three-worker hash maps all four packets for call-Alex-four-two-one-nine to
              media-c.
            targets:
              - va-media-affinity-packet-routing
            color: cyan
            linger: 0.3
          - id: va-media-affinity-1-1
            phrase: That demonstrates repeatable affinity only with this unchanged worker set.
            targets:
              - va-media-affinity-owner
            color: yellow
            linger: 0.3
          - id: va-media-affinity-1-2
            phrase: It is not a consistent-hashing or failover implementation.
            targets:
              - va-media-affinity-owner
            color: cyan
            linger: 0.3
          - id: va-media-affinity-1-3
            phrase: Worker changes need connection-aware routing or a defined remapping strategy, plus explicit state
              recovery.
            targets:
              - va-media-affinity-owner
            color: yellow
            linger: 0.3
      - say: If the owner dies, preserve trusted heard-cursor and reconnect information where supported, otherwise
          reconnect and rebuild the session and tell Alex what happened. A transcript alone does not recreate
          encryption or packet timing state. Restore authenticated session and response identity before
          accepting delayed acknowledgements or audio.
        hold: 0.85
        visual_cues:
          - id: va-media-affinity-2-0
            phrase: If the owner dies, preserve trusted heard-cursor and reconnect information where supported, otherwise
              reconnect and rebuild the session and tell Alex what happened.
            targets:
              - va-media-affinity-recovery
            color: cyan
            linger: 0.3
          - id: va-media-affinity-2-1
            phrase: A transcript alone does not recreate encryption or packet timing state.
            targets:
              - va-media-affinity-recovery
            color: yellow
            linger: 0.3
          - id: va-media-affinity-2-2
            phrase: Restore authenticated session and response identity before accepting delayed acknowledgements or
              audio.
            targets:
              - va-media-affinity-recovery
            color: cyan
            linger: 0.3
  - id: release-metrics
    title: "Did the incident line meet its deadline?"
    visual: >-
      Keep all one hundred attempted calls in view. Close the denominator around the ninety calls with audio,
      then widen it to include the silent ten. The count of eighty-six timely replies stays put.
    beats:
      - say: >-
          Suppose we want this hotline to carry ten thousand simultaneous calls. To test that, reproduce the
          call mix. Long pauses, bursts of callers, tool use and long answers put different loads on the system.
          Include the devices, codecs and network losses you expect. Track active streams, media CPU, GPU
          queues, reconnects and errors as well as time to first sound and time to mute. Leave headroom at the
          load that meets those targets.
        hold: 0.55
        visual_cues:
          - id: load-cohort
            phrase: "reproduce the call mix"
            targets: [release-cohort]
            color: blue
            linger: 0.25
      - say: >-
          Zoom in on a hundred attempted calls on one network. Eighty-six started playing within five hundred
          milliseconds. Four more played late. The last ten timed out in silence. We promised first sound within
          the deadline on ninety-five percent of attempts. Did we meet it?
        hold: 2
        visual_cues:
          - id: load-fast
            phrase: "Eighty-six started playing within five hundred milliseconds"
            targets: [release-cohort]
            color: green
            linger: 0.25
          - id: load-late
            phrase: "Four more played late"
            targets: [release-cohort]
            color: yellow
            linger: 0.25
          - id: load-silent
            phrase: "The last ten timed out in silence"
            targets: [release-cohort]
            color: pink
            linger: 0.25
          - id: load-ask
            phrase: "Did we meet it"
            targets: [release-count, release-cohort]
            color: cyan
            linger: 0.25
      - say: >-
          Restrict the count to calls with audio, and eighty-six out of ninety looks like a pass. Now put the
          silent calls back in the denominator. The number that met the deadline hasn’t changed. Eighty-six out
          of a hundred is eighty-six percent. Hold the release on this slice.
        hold: 0.8
        caption_starts:
          - "Eighty-six out of a hundred is eighty-six percent."
          - "Hold the release on this slice."
        visual_cues:
          - id: load-success
            phrase: "Restrict the count to calls with audio"
            targets: [release-cohort, release-count]
            color: cyan
            linger: 0.25
          - id: load-all
            phrase: "put the silent calls back in the denominator"
            targets: [release-cohort, release-count]
            color: yellow
            linger: 0.25
          - id: load-hold
            phrase: "Hold the release on this slice"
            targets: [release-count]
            color: pink
            linger: 0.25
      - say: >-
          Decide in advance how to count missing playback. You can still report latency percentiles for calls
          with audio. Also check what those callers got. Did a cutoff lose an incident digit? Did the agent
          pronounce the identifier correctly, block a forbidden tool call, stop for an interruption and deliver
          the useful answer? Test task completion and recovery on representative calls.
        hold: 0.65
        visual_cues:
          - id: load-quality
            phrase: "Did a cutoff lose an incident digit"
            targets: [release-count]
            color: cyan
            linger: 0.25
  - id: transfer
    title: "When did the phone finish playing “open”?"
    visual: >-
      Put first sound, factual reply start, the reported end of “open,” and Alex’s interruption onto the call
      clock. The two latency brackets still point at the first sound as the reply strip extends past it.
    beats:
      - say: >-
          Rewind Alex’s call. The first sound, “I’ll check that,” played three hundred eighty milliseconds after
          Alex stopped speaking. Start the clock at turn acceptance instead and you count three hundred twenty.
          Both clocks stop at the very same sound.
        hold: 0.6
        visual_cues:
          - id: recap-first
            phrase: "The first sound"
            targets: [recap-trace]
            color: green
            linger: 0.25
          - id: recap-clocks
            phrase: "Start the clock at turn acceptance"
            targets: [recap-measures]
            color: cyan
            linger: 0.25
      - say: >-
          Now listen for the status Alex asked for. The factual reply starts at nine hundred fifty-five on the
          call clock. Its first piece says “Incident is.” How far along this line do we have evidence for the
          word “open”?
        hold: 1.8
        visual_cues:
          - id: recap-facts
            phrase: "The factual reply starts at nine hundred fifty-five"
            targets: [recap-trace]
            color: yellow
            linger: 0.25
          - id: recap-ask
            phrase: "How far along this line"
            targets: [recap-reply, recap-measures]
            color: cyan
            linger: 0.25
      - say: >-
          Add the reply’s five hundred twenty milliseconds to its start time. That puts the end of “open” at
          fourteen hundred seventy-five milliseconds on this uninterrupted stretch of playback. Alex cuts in a
          hundred thirty milliseconds later. A dashboard that stops at the first sound misses the wait for the
          answer.
        hold: 0.7
        caption_starts:
          - "at fourteen hundred seventy-five milliseconds"
        visual_cues:
          - id: recap-add
            phrase: "Add the reply’s five hundred twenty milliseconds"
            targets: [recap-reply]
            color: green
            linger: 0.25
          - id: recap-total
            phrase: "at fourteen hundred seventy-five milliseconds"
            targets: [recap-trace, recap-measures]
            color: green
            linger: 0.25
          - id: recap-stop
            phrase: "Alex cuts in a hundred thirty milliseconds later"
            targets: [recap-trace]
            color: pink
            linger: 0.25
      - say: >-
          On a real call, line up the player’s receipt with the right reply before you draw that conclusion.
          Compare first sound, useful answers and interruption traces across devices and networks. Now take the
          next call event yourself.
        hold: 0.65
        visual_cues:
          - id: recap-receipt
            phrase: "line up the player’s receipt with the right reply"
            targets: [recap-reply]
            color: green
            linger: 0.25
  - id: fresh-interruption
    title: "What can the next reply assume?"
    visual: >-
      A new two-piece reply shares the screen with the owner’s recorded response. The interruption and last
      playback receipt land inside the second piece. A late receipt meets a new reply ID. Use the two surviving
      records to answer Alex.
    beats:
      - say: >-
          Later, the owner replies to the page. Here’s the tool record. The hotline prepares two sentences.
          “Lookup is ready.” “Owner has replied.” Look at where each sentence ends on the audio strip. Alex cuts
          in at five hundred sixty milliseconds. The phone’s last receipt is at four hundred sixty. Which
          sentence goes into conversation history?
        hold: 2.4
        visual_cues:
          - id: fresh-record
            phrase: "the owner replies to the page"
            targets: [fresh-record]
            color: yellow
            linger: 0.25
          - id: fresh-pieces
            phrase: "The hotline prepares two sentences"
            targets: [fresh-strip]
            color: cyan
            linger: 0.25
          - id: fresh-cut
            phrase: "Alex cuts in at five hundred sixty milliseconds"
            targets: [fresh-stop]
            color: pink
            linger: 0.25
          - id: fresh-ack
            phrase: "The phone’s last receipt is at four hundred sixty"
            targets: [fresh-player]
            color: green
            linger: 0.25
          - id: fresh-ask
            phrase: "Which sentence goes into conversation history"
            targets: [fresh-strip, fresh-player, fresh-history]
            color: cyan
            linger: 0.25
      - say: >-
          The first sentence ends at three hundred milliseconds. Keep “Lookup is ready.” The receipt covers part
          of the second sentence. Its next marked boundary is at seven hundred, so we leave that whole sentence
          out. The owner’s reply stays in the tool record.
        hold: 0.65
        caption_starts:
          - "Keep “Lookup is ready.”"
        visual_cues:
          - id: va-fresh-interruption-1-0
            phrase: "Keep Lookup is ready"
            targets: [fresh-history]
            color: green
            linger: 0.25
          - id: fresh-tool-stays
            phrase: "The owner’s reply stays in the tool record"
            targets: [fresh-record]
            color: yellow
            linger: 0.25
      - say: >-
          Freeze reply seven. Alex asks, “Did the owner reply?” The hotline accepts that turn and opens reply
          eight with its cursor at zero. A late receipt for all seven hundred milliseconds arrives. Read the
          reply number on it. Seven. Reject it. The frozen history stays put, and reply eight can continue.
        hold: 0.65
        caption_starts:
          - "Seven. Reject it."
        visual_cues:
          - id: fresh-question
            phrase: "Alex asks"
            targets: [fresh-history]
            color: blue
            linger: 0.25
          - id: fresh-switch
            phrase: "opens reply eight with its cursor at zero"
            targets: [fresh-identities]
            color: blue
            linger: 0.25
          - id: fresh-late
            phrase: "A late receipt for all seven hundred milliseconds arrives"
            targets: [fresh-identities]
            color: yellow
            linger: 0.25
          - id: va-fresh-interruption-2-1
            phrase: "Seven. Reject it"
            targets: [fresh-identities]
            color: pink
            linger: 0.25
      - say: >-
          What should the hotline tell Alex now?
        hold: 1.9
        visual_cues:
          - id: fresh-decision
            phrase: "What should the hotline tell Alex now"
            targets: [fresh-history, fresh-record, fresh-answer]
            color: cyan
            linger: 0.25
      - say: >-
          “Yes, the owner replied.” The tool record gives you that fact. You can give Alex the news without
          assuming the second sentence played all the way through.
        hold: 1.4
        visual_cues:
          - id: fresh-answer
            phrase: "Yes, the owner replied"
            targets: [fresh-answer]
            color: green
            linger: 0.25
