            color: yellow
            linger: 0.3
          - id: va-batch-recognition-1-2
            phrase: Batch recognition can suit recordings, short commands or prototypes whose measured budget permits it.
            targets:
              - va-batch-recognition-downstream
            color: cyan
            linger: 0.3
          - id: va-batch-recognition-1-3
            phrase: Streaming recognition pays some work during speech, while adding the responsibility to handle
              revisions and a separate commitment boundary.
            targets:
              - va-batch-recognition-batch
            color: yellow
            linger: 0.3
  - id: overlap-timeline
    title: Overlap work on one shared clock
    visual: Streaming recognition, turn commit, first LLM clause, synthesis, and playout occupy overlapping spans
      on a millisecond timeline.
    beats:
      - say: >
          In this synthetic trace, acoustic speech ends at zero. Turn commitment finishes at sixty
          milliseconds while recognition is already running. Recognition completes one hundred milliseconds
          after speech ends.
        hold: 0.55
        visual_cues:
          - id: overlap-commit-spoken
            phrase: Turn commitment finishes at sixty milliseconds
            targets:
              - overlap-commit
            color: cyan
            linger: 0.65
          - id: overlap-recognition-spoken
            phrase: Recognition completes one hundred milliseconds after speech ends
            targets:
              - overlap-recognition
            color: yellow
            linger: 0.65
      - say: >
          The model starts before recognition finishes. Speech synthesis begins while generation continues,
          preparing the first chunk as later words arrive. The playback buffer then delivers that chunk to the
          caller.
        hold: 0.7
        visual_cues:
          - id: overlap-generation-spoken
            phrase: The model starts before recognition finishes
            targets:
              - overlap-generation
            color: cyan
            linger: 0.65
          - id: overlap-synthesis-spoken
            phrase: Speech synthesis begins while generation continues
            targets:
              - overlap-synthesis
            color: yellow
            linger: 0.65
          - id: overlap-buffer-spoken
