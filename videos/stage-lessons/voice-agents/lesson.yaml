scenes:
  - id: subject-intro
    title: "How much of the reply played?"
    visual: Alex’s phone is playing the incident update. Its speaker goes quiet when Alex cuts in. The whole
      reply stays visible beside the phone while the hotline waits for the player’s receipt.
    beats:
      - say: >-
          The hotline is explaining why the incident is still open when Alex cuts in. “Wait, page the owner.”
        hold: 0.55
        caption_starts:
          - "Alex cuts in."
          - "Wait, page the owner."
        visual_cues:
          - id: intro-speaking
            phrase: "The hotline is explaining"
            targets: [intro-phone, intro-audio]
            color: cyan
            linger: 0.25
          - id: intro-interrupt
            phrase: "Alex cuts in"
            targets: [intro-phone, intro-stop]
            color: pink
            linger: 0.25
      - say: >-
          The phone has the whole reply, right down to “still running.” Can the hotline count that
          explanation
          as spoken?
        hold: 2.2
        visual_cues:
          - id: intro-delivery
            phrase: "The phone has the whole reply"
            targets: [intro-audio]
            color: cyan
            linger: 0.25
          - id: intro-ask
            phrase: "Can the hotline count that explanation as spoken"
            targets: [intro-phone, intro-audio]
            color: yellow
            linger: 0.25
      - say: >-
          Ask the player how far it got. Its last playback receipt tells the hotline which complete pieces it
          can keep. Rewind to the end of Alex’s question and follow the reply to the speaker.
        hold: 0.75
        visual_cues:
          - id: intro-missing
            phrase: "Ask the player how far it got"
            targets: [intro-receipt]
            color: green
            linger: 0.25
  - id: clock-contract
    title: "How long did Alex wait?"
    visual: >-
      Two brackets end at the same first playback. Lengthening only the endpoint wait shifts commit and first
      playback together across the speech-end target.
    beats:
      - say: >-
          Alex finishes the question. Start one clock here. Sixty milliseconds later the hotline accepts the
          turn. Start a second clock there. Stop both when the phone first plays the agent’s voice. The two
          clocks give us different views of the same wait.
        hold: 0.6
        visual_cues:
          - id: clock-speech
            phrase: "Alex finishes the question"
            targets: [clock-trace]
            color: blue
            linger: 0.25
          - id: clock-commit
            phrase: "the hotline accepts the turn"
            targets: [clock-trace]
            color: cyan
            linger: 0.25
          - id: clock-play
            phrase: "when the phone first plays the agent’s voice"
            targets: [clock-trace, clock-brackets]
            color: green
            linger: 0.25
      - say: >-
          In this example the sound starts at three hundred eighty milliseconds. The caller waited that whole
          time. Subtract the sixty milliseconds before commit and the response path took three hundred twenty.
          Receiving a packet or producing a token would stop the clocks too early.
        hold: 0.7
        visual_cues:
          - id: clock-measure
            phrase: "The caller waited that whole time"
            targets: [clock-brackets]
            color: blue
            linger: 0.25
          - id: clock-subtract
            phrase: "the response path took three hundred twenty"
            targets: [clock-brackets]
            color: cyan
            linger: 0.25
      - say: >-
          Now change just the silence wait. The hotline waits three hundred milliseconds to commit. Everything
          after that takes just as long as before. With a five hundred millisecond target from speech end, does
          this call make it?
        hold: 2
        visual_cues:
          - id: clock-shift
            phrase: "The hotline waits three hundred milliseconds to commit"
            targets: [clock-trace, clock-brackets]
            color: cyan
            linger: 0.25
          - id: clock-ask
            phrase: "does this call make it"
            targets: [clock-limit, clock-brackets]
            color: yellow
            linger: 0.25
      - say: >-
          Three hundred plus three hundred twenty gives six hundred twenty. That misses the caller’s target even
          though the response path still fits its four hundred millisecond budget. The hotline uses these as
          proposed ninety-fifth percentile targets.
        hold: 0.65
        caption_starts:
          - "gives six hundred twenty"
        visual_cues:
          - id: clock-late
            phrase: "gives six hundred twenty"
            targets: [clock-brackets, clock-limit]
            color: yellow
            linger: 0.25
      - say: >-
          The phone first plays “I’ll check that.” Alex still has no status. Time the useful answer separately.
          Also time how quickly playback stops when Alex interrupts. The proposed mute target is one hundred
          milliseconds. Check these targets across devices and networks, including calls that fall silent.
        hold: 0.7
        visual_cues:
          - id: clock-ack
            phrase: "The phone first plays"
            targets: [clock-limits]
            color: green
            linger: 0.25
          - id: clock-mute
            phrase: "how quickly playback stops when Alex interrupts"
            targets: [clock-limits]
            color: pink
            linger: 0.25
  - id: media-owners
    title: Carry one call across distinct state owners
    visual: Move the same call identity from capture to a stateful media worker and inference; keep a local mute
      branch and response-scoped playout ledger outside the model path.
    beats:
      - say: Alex’s microphone and speaker belong to the client. A media worker handles the negotiated connection,
          packet timing, buffer and routing. Recognition, language generation, tools and synthesis form the
          inference path. Multi-party rooms may need a selective forwarding unit; one caller and one assistant
          do not require a group room.
        hold: 0.85
        visual_cues:
          - id: va-media-owners-0-0
            phrase: Alex’s microphone and speaker belong to the client.
            targets:
              - va-media-owners-owners
            color: cyan
            linger: 0.3
          - id: va-media-owners-0-1
            phrase: A media worker handles the negotiated connection, packet timing, buffer and routing.
            targets:
              - va-media-owners-owners
            color: yellow
            linger: 0.3
          - id: va-media-owners-0-2
            phrase: Recognition, language generation, tools and synthesis form the inference path.
            targets:
              - va-media-owners-inference-owner
            color: cyan
            linger: 0.3
          - id: va-media-owners-0-3
            phrase: Multi-party rooms may need a selective forwarding unit; one caller and one assistant do not require a
              group room.
            targets:
              - va-media-owners-owners
            color: yellow
            linger: 0.3
      - say: Keep two control lanes beside the hot path. Local speech onset can mute the speaker without waiting for a
          round trip. The confirmed-playout ledger records what the audio sink acknowledged for this call and
          response. Neither a healthy decoder nor a fast GPU can recover a playback deadline already missed at
          the media edge.
        hold: 0.85
        visual_cues:
          - id: va-media-owners-1-0
            phrase: Keep two control lanes beside the hot path.
            targets:
              - va-media-owners-local-mute
            color: cyan
            linger: 0.3
          - id: va-media-owners-1-1
            phrase: Local speech onset can mute the speaker without waiting for a round trip.
            targets:
              - va-media-owners-local-mute
            color: yellow
            linger: 0.3
          - id: va-media-owners-1-2
            phrase: The confirmed-playout ledger records what the audio sink acknowledged for this call and response.
            targets:
              - va-media-owners-playout-ledger
            color: cyan
            linger: 0.3
          - id: va-media-owners-1-3
            phrase: Neither a healthy decoder nor a fast GPU can recover a playback deadline already missed at the media
              edge.
            targets:
              - va-media-owners-playout-ledger
            color: yellow
            linger: 0.3
  - id: detect-and-commit
    title: Listening and turn completion are separate
    visual: Voice activity frames pause between incident-number digits while the turn detector waits for a
      complete stable request.
    beats:
      - say: >
          Voice activity detection marks frames that sound like speech. It can start a fast mute or indicate
          that audio has arrived. Turn policy combines those frames with context to decide when Alex finished
          the request.
        hold: 0.55
        visual_cues:
          - id: detect-activity-frames
            phrase: Voice activity detection marks frames that sound like speech
            targets:
              - detect-word-0
              - detect-word-1
            color: blue
            linger: 0.6
          - id: detect-turn-policy
            phrase: Turn policy combines those frames with context
            targets:
              - detect-word-0
              - detect-word-1
            color: cyan
            linger: 0.6
      - say: >
          Alex says incident four, pauses, then continues with two one nine. A silence-only endpoint might
          commit after the first pause and send an incomplete identifier to the tool.
        hold: 0.7
        visual_cues:
          - id: detect-partial-identifier
            phrase: Alex says incident four, pauses
            targets:
              - detect-word-0
              - detect-word-1
            color: blue
            linger: 0.6
          - id: detect-spoken-completion
            phrase: then continues with two one nine
            targets:
              - detect-word-3
            color: green
            linger: 0.6
      - say: >
          Turn commitment can combine silence, transcript stability, and semantic completeness. This hotline
          fixture requires a complete four-digit incident identifier. Begin reversible preparation from stable
          partial words when useful, while factual answers and side effects wait for a committed request.
        hold: 0.55
        visual_cues:
          - id: detect-commit-rule
            phrase: Turn commitment can combine silence, transcript stability, and semantic completeness
            targets:
              - detect-and-commit-stable-complete-turn-incident-4219
            color: green
            linger: 0.6
          - id: detect-complete-id
            phrase: a complete four-digit incident identifier
            targets:
              - detect-word-3
              - detect-and-commit-stable-complete-turn-incident-4219
            color: cyan
            linger: 0.6
  - id: vad-worksheet
    title: Count frames before deciding that silence lasted long enough
    visual: Compare a 61 ms silence threshold with four 20 ms frames. Mark the two pre-roll frames, three
      speech frames and three trailing silent frames.
    beats:
      - say: This detector takes one speech probability per frame. Each frame lasts twenty
          milliseconds. It accepts a frame as speech when its probability is at least one half. Divide the
          requested silence duration by frame duration, then round up to a whole number of frames. Sixty
          milliseconds needs three frames; sixty-one needs four, so that realized wait is eighty milliseconds.
        hold: 0.85
        visual_cues:
          - id: va-vad-worksheet-0-0
            phrase: This detector takes one speech probability per frame.
            targets:
              - va-vad-worksheet-frames
            color: cyan
            linger: 0.3
          - id: va-vad-worksheet-0-1
            phrase: Each frame lasts twenty milliseconds.
            targets:
              - va-vad-worksheet-frames
            color: yellow
            linger: 0.3
          - id: va-vad-worksheet-0-2
            phrase: It accepts a frame as speech when its probability is at least one half.
            targets:
              - va-vad-worksheet-frames
            color: cyan
            linger: 0.3
          - id: va-vad-worksheet-0-3
            phrase: Divide the requested silence duration by frame duration, then round up to a whole number of frames.
            targets:
              - va-vad-worksheet-rounding
            color: yellow
            linger: 0.3
          - id: va-vad-worksheet-0-4
            phrase: Sixty milliseconds needs three frames; sixty-one needs four, so that realized wait is eighty
              milliseconds.
            targets:
              - va-vad-worksheet-rounding
            color: cyan
            linger: 0.3
      - say: "The actual sequence begins with two quiet frames, then three speech frames, then three quiet frames.
          Frame two starts speech. With forty milliseconds of pre-roll, the detector retains the two earlier
          quiet frames too: three frames, or sixty milliseconds, at that start event. The third trailing
          silence frame ends the utterance at frame seven."
        hold: 0.85
        visual_cues:
          - id: va-vad-worksheet-1-0
            phrase: The actual sequence begins with two quiet frames, then three speech frames, then three quiet frames.
            targets:
              - va-vad-worksheet-frames
            color: cyan
            linger: 0.3
          - id: va-vad-worksheet-1-1
            phrase: Frame two starts speech.
            targets:
              - va-vad-worksheet-retained
            color: yellow
            linger: 0.3
          - id: va-vad-worksheet-1-2
            phrase: "With forty milliseconds of pre-roll, the detector retains the two earlier quiet frames too: three
              frames, or sixty milliseconds, at that start event."
            targets:
              - va-vad-worksheet-retained
            color: cyan
            linger: 0.3
          - id: va-vad-worksheet-1-3
            phrase: The third trailing silence frame ends the utterance at frame seven.
            targets:
              - va-vad-worksheet-endpoint
            color: yellow
            linger: 0.3
      - say: Trim the trailing silence from retained utterance audio. Two pre-roll frames plus three speech frames
          give five retained frames, or one hundred milliseconds. Forty of those milliseconds come from
          before Alex started speaking. Reject nonfinite probabilities and missing, reordered or wrongly
          typed
          frame identifiers; a live system still needs explicit gap, maximum-length and stream-close policies.
        hold: 0.85
        visual_cues:
          - id: va-vad-worksheet-2-0
            phrase: Trim the trailing silence from retained utterance audio.
            targets:
              - va-vad-worksheet-retained
            color: cyan
            linger: 0.3
          - id: va-vad-worksheet-2-1
            phrase: Two pre-roll frames plus three speech frames give five retained frames, or one hundred milliseconds.
            targets:
              - va-vad-worksheet-retained
            color: yellow
            linger: 0.3
          - id: va-vad-worksheet-2-2
            phrase: Forty of those milliseconds come from before Alex started speaking.
            targets:
              - va-vad-worksheet-retained
            color: cyan
            linger: 0.3
          - id: va-vad-worksheet-2-3
            phrase: Reject nonfinite probabilities and missing, reordered or wrongly typed frame identifiers; a live
              system still needs explicit gap, maximum-length and stream-close policies.
            targets:
              - va-vad-worksheet-frames
            color: yellow
            linger: 0.3
      - say: The phone listens for Alex to start. The server decides when Alex has finished. A false start
          can mute the speaker. An early endpoint can cut off the last digit of the incident number. Count
          those two errors separately across devices, accents, languages, noise levels and pauses. Pick the
          frame duration for the detector you deploy.
        hold: 0.85
        visual_cues:
          - id: va-vad-worksheet-3-0
            phrase: The phone listens for Alex to start. The server decides when Alex has finished.
            targets:
              - va-vad-worksheet-frames
            color: cyan
            linger: 0.3
          - id: va-vad-worksheet-3-1
            phrase: A false start can mute the speaker. An early endpoint can cut off the last digit of the
              incident number.
            targets:
              - va-vad-worksheet-frames
            color: yellow
            linger: 0.3
          - id: va-vad-worksheet-3-2
            phrase: Count those two errors separately across devices, accents, languages, noise levels and
              pauses.
            targets:
              - va-vad-worksheet-frames
            color: cyan
            linger: 0.3
          - id: va-vad-worksheet-3-3
            phrase: Pick the frame duration for the detector you deploy.
            targets:
              - va-vad-worksheet-frames
            color: yellow
            linger: 0.3
  - id: echo-loop
    title: Why does the hotline hear itself?
    visual: Follow a copy of the speaker signal into the microphone. Show where to listen for the returning
      voice during an echo test.
    beats:
      - say: The hotline plays two notes. Listen for a quieter pair.
        hold: 1.15
        hold_sound: echo-test
        visual_cues:
          - id: va-echo-loop-0-0
            phrase: The hotline plays two notes.
            targets: [va-echo-loop-waveforms]
            color: yellow
          - id: va-echo-loop-0-1
            phrase: Listen for a quieter pair.
            targets: [va-echo-loop-echo-path]
            color: cyan
      - say: Hear them come back? In this test the microphone picks up the same two notes three tenths of a second later. A voice detector can hear the hotline's own reply and cut it off mid-sentence.
        hold: 0.6
        visual_cues:
          - id: va-echo-loop-1-0
            phrase: Hear them come back?
            targets: [va-echo-loop-echo-path]
            color: cyan
          - id: va-echo-loop-1-1
            phrase: three tenths of a second later.
            targets: [va-echo-loop-echo-path]
            color: yellow
      - say: Request acoustic echo cancellation from the browser. Test the hotline on speakerphone, then plug in headphones. Listen at the microphone to find out how much of the reply still comes back.
        hold: 0.85
        visual_cues:
          - id: va-echo-loop-2-0
            phrase: Request acoustic echo cancellation from the browser.
            targets: [va-echo-loop-aec]
            color: cyan

  - id: partial-transcripts
    title: Treat repeated words as tentative evidence
    visual: Build successive actual transcript hypotheses and their common word prefixes; preserve an uncommitted
      action record while one Boolean false passes and one string false is rejected.
    beats:
      - say: The article’s recognizer simulation emits interim and final events. Its common-prefix heuristic compares
          consecutive hypotheses word by word. After What is, then What is incident, the shared prefix is What
          is. Another hypothesis extends the incident number. Use the repeated words to prepare a lookup. If
          the recognizer revises them, discard that preparation.
        hold: 0.85
        visual_cues:
          - id: va-partial-transcripts-0-0
            phrase: The article’s recognizer simulation emits interim and final events.
            targets:
              - va-partial-transcripts-hypotheses
            color: cyan
            linger: 0.3
          - id: va-partial-transcripts-0-1
            phrase: Its common-prefix heuristic compares consecutive hypotheses word by word.
            targets:
              - va-partial-transcripts-hypotheses
            color: yellow
            linger: 0.3
          - id: va-partial-transcripts-0-2
            phrase: After What is, then What is incident, the shared prefix is What is.
            targets:
              - va-partial-transcripts-hypotheses
            color: cyan
            linger: 0.3
          - id: va-partial-transcripts-0-3
            phrase: Another hypothesis extends the incident number.
            targets:
              - va-partial-transcripts-hypotheses
            color: yellow
            linger: 0.3
          - id: va-partial-transcripts-0-4
            phrase: Use the repeated words to prepare a lookup. If the recognizer revises them, discard that
              preparation.
            targets:
              - va-partial-transcripts-hypotheses
            color: cyan
            linger: 0.3
      - say: Before commitment, classify intent and perform authorized, cancellable read-only preparation when
          appropriate. The actual helper labels incident text for a read-only status prefetch. History writes
          and speech wait for a committed transcript; a close request then asks for confirmation rather than
          executing a close. Before a close, verify the incident number and check the caller’s permission.
        hold: 0.85
        visual_cues:
          - id: va-partial-transcripts-1-0
            phrase: Before commitment, classify intent and perform authorized, cancellable read-only preparation when
              appropriate.
            targets:
              - va-partial-transcripts-actions
            color: cyan
            linger: 0.3
          - id: va-partial-transcripts-1-1
            phrase: The actual helper labels incident text for a read-only status prefetch.
            targets:
              - va-partial-transcripts-actions
            color: yellow
            linger: 0.3
          - id: va-partial-transcripts-1-2
            phrase: History writes and speech wait for a committed transcript; a close request then asks for confirmation
              rather than executing a close.
            targets:
              - va-partial-transcripts-actions
            color: cyan
            linger: 0.3
          - id: va-partial-transcripts-1-3
            phrase: Before a close, verify the incident number and check the caller’s permission.
            targets:
              - va-partial-transcripts-actions
            color: yellow
            linger: 0.3
      - say: Validate the flag before branching. Boolean false remains uncommitted. The nonempty string false is
          truthy in Python and must be rejected instead of treated as acceptance. The helper enforces the
          flag’s type, while the host must obtain its value from the actual turn decision and bind it to the
          authenticated session.
        hold: 0.85
        visual_cues:
          - id: va-partial-transcripts-2-0
            phrase: Validate the flag before branching.
            targets:
              - va-partial-transcripts-typed-flag
            color: cyan
            linger: 0.3
          - id: va-partial-transcripts-2-1
            phrase: Boolean false remains uncommitted.
            targets:
              - va-partial-transcripts-typed-flag
            color: yellow
            linger: 0.3
          - id: va-partial-transcripts-2-2
            phrase: The nonempty string false is truthy in Python and must be rejected instead of treated as acceptance.
            targets:
              - va-partial-transcripts-typed-flag
            color: cyan
            linger: 0.3
          - id: va-partial-transcripts-2-3
            phrase: The helper enforces the flag’s type, while the host must obtain its value from the actual turn
              decision and bind it to the authenticated session.
            targets:
              - va-partial-transcripts-typed-flag
            color: yellow
            linger: 0.3
  - id: batch-recognition
    title: Measure the recognizer after the endpoint
    visual: Construct the actual1200ms utterance then300ms endpoint and450ms recognition tail; keep the acoustic
      and commit origins visible and compare its750ms post-speech transcript delay with already-streaming
      recognition.
    beats:
      - say: "A batch recognizer can begin after the endpoint, which makes scheduling simpler. In the supplied article
          trace, speech lasts twelve hundred milliseconds, a three-hundred-millisecond endpoint wait follows,
          then recognition takes four hundred fifty. The transcript arrives at nineteen hundred fifty: seven
          hundred fifty milliseconds after speech ended."
        hold: 0.85
        visual_cues:
          - id: va-batch-recognition-0-0
            phrase: A batch recognizer can begin after the endpoint, which makes scheduling simpler.
            targets:
              - va-batch-recognition-batch
            color: cyan
            linger: 0.3
          - id: va-batch-recognition-0-1
            phrase: In the supplied article trace, speech lasts twelve hundred milliseconds, a three-hundred-millisecond
              endpoint wait follows, then recognition takes four hundred fifty.
            targets:
              - va-batch-recognition-batch
            color: yellow
            linger: 0.3
          - id: va-batch-recognition-0-2
            phrase: "The transcript arrives at nineteen hundred fifty: seven hundred fifty milliseconds after speech
              ended."
            targets:
              - va-batch-recognition-post-speech
            color: cyan
            linger: 0.3
      - say: At that point the hotline has the caller’s words. Generation, synthesis and transport still
          follow. Batch recognition can suit recordings, short commands or prototypes whose measured budget
          permits it. Streaming recognition pays some work during speech, while adding the responsibility to
          handle revisions and a separate commitment boundary.
        hold: 0.85
        visual_cues:
          - id: va-batch-recognition-1-0
            phrase: At that point the hotline has the caller’s words.
            targets:
              - va-batch-recognition-post-speech
            color: cyan
            linger: 0.3
          - id: va-batch-recognition-1-1
            phrase: Generation, synthesis and transport still follow.
            targets:
