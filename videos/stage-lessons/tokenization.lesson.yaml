  - id: your-turn
    title: Your turn
    visual: A new corpus, a new vocabulary, and new path probabilities each pose a question, hold for an answer, and then resolve on screen.
    beats:
      - say: Try BPE on these three words. Snow, four times. Snowy, twice. Show, three times. How many positions do we start with, and which pair merges first?
        hold: 5.0
        caption_starts: ["How many positions do we start with"]
        visual_cues:
          - { id: corpus, phrase: on these three words, targets: [picture], color: blue }
          - { id: question, phrase: How many positions, targets: [picture], color: yellow }
      - say: Thirty eight positions. O W appears nine times, more than any other pair, so it merges first. Nine positions disappear, which leaves twenty nine.
        hold: 0.9
        visual_cues:
          - { id: thirty-eight, phrase: "Thirty eight positions", targets: [picture], color: yellow, caption_boundary: true }
          - { id: ow, phrase: "O W appears nine times", targets: [picture], color: yellow, caption_boundary: true }
          - { id: twenty-nine, phrase: "Nine positions disappear, which leaves twenty nine", targets: [picture], color: green, caption_boundary: true }
      - say: Now BERT style WordPiece, with a vocabulary of snow, continuation ball, and S N O W B. What happens to snowball?
        hold: 4.0
        visual_cues:
          - { id: vocab, phrase: a vocabulary of snow, targets: [picture], color: blue }
          - { id: question-wp, phrase: What happens to snowball, targets: [picture], color: yellow }
      - say: The longest match takes S N O W B, and nothing can finish A L L. It doesn't go back, so the whole word becomes unknown.
        hold: 0.9
        visual_cues:
          - { id: longest, phrase: "The longest match takes S N O W B", targets: [picture], color: yellow, caption_boundary: true }
          - { id: no-finish, phrase: "and nothing can finish A L L", targets: [picture], color: red, caption_boundary: true }
          - { id: unknown, phrase: "so the whole word becomes unknown", targets: [picture], color: red, caption_boundary: true }
      - say: Last, Unigram. Marker snow has probability point zero five. The marker alone has point two five, and snow has point four. Which path wins?
        hold: 4.0
        visual_cues:
          - { id: marker, phrase: Marker snow has probability, targets: [picture], color: blue }
          - { id: alone, phrase: The marker alone, targets: [picture], color: blue }
          - { id: question-u, phrase: Which path wins, targets: [picture], color: yellow }
      - say: The two pieces, because point two five times point four is point one, and that beats point zero five. The path with fewer pieces lost, because only the complete path's score counts.
        hold: 1.0
        visual_cues:
          - { id: product, phrase: point two five times point four is point one, targets: [picture], color: green }
          - { id: product-result, phrase: "is point one", targets: [picture], color: green, caption_boundary: true }
          - { id: comparison, phrase: "and that beats point zero five", targets: [picture], color: green, caption_boundary: true }
          - { id: fewer, phrase: "The path with fewer pieces lost", targets: [picture], color: yellow, caption_boundary: true }

  - id: close
    title: What will the model write?
    visual: Two output weight rows face their fixed IDs and decoded pieces. The viewer predicts the emitted piece, then watches the same winning score travel with its weights when the output rows change places.
    beats:
      - say: Here's the replacement tokenizer from the opening. Its dictionary gives one to falls and five to soft. This time we've moved the input rows to match. Each piece selects its original vector, so the model reads the sentence correctly.
        hold: 0.6
        visual_cues:
          - { id: map, phrase: Its dictionary gives one to falls, targets: [decoder], color: blue }
          - { id: input, phrase: moved the input rows to match, targets: [decoder], color: cyan }
      - say: Now let it write one more piece. The output weights are in a separate table, still in training order. Suppose the hidden vector at this step is zero, zero, one. Take its dot product with each row. The first two coordinates drop out, so each score is the last number in its row. The best of the six other rows scores point five.
        hold: 0.5
        visual_cues:
          - { id: output, phrase: The output weights are in a separate table, targets: [output-rows], color: cyan }
          - { id: hidden, phrase: the hidden vector at this step, targets: [hidden-vector], color: cyan }
          - { id: dot, phrase: each score is the last number in its row, targets: [scores], color: cyan }
          - { id: other-rows, phrase: The best of the six other rows scores point five, targets: [scores], color: cyan, caption_boundary: true }
      - say: For greedy decoding, take the highest score and follow its ID down to the dictionary. Which piece will the replacement print?
        hold: 3.4
        visual_cues:
          - { id: predict, phrase: Which piece will the replacement print, targets: [decoder], color: yellow }
      - say: Soft. Row five still wins, just as it did when five meant falls. The dictionary gives that ID a different meaning.
        hold: 1.2
        visual_cues:
          - { id: printed, phrase: Soft, targets: [emitted-piece], color: yellow, caption_boundary: true }
      - say: Leave the hidden vector and dictionary alone. Swap the two output weight rows. Watch where point seven lands. Row one now wins, and the model writes falls. That's the piece the original model would have written here.
        hold: 1.2
        caption_starts: ["Row one now wins"]
        visual_cues:
          - { id: swap, phrase: Swap the two output weight rows, targets: [output-rows], color: cyan }
          - { id: restored, phrase: "Row one now wins, and the model writes falls", targets: [emitted-piece], color: yellow, caption_boundary: true }
      - say: Before shipping a renumbering, check both what the model reads and what it writes. Pin the verified tokenizer to its checkpoint. Next we'll follow one of those learned vectors and see how its meaning changes in context.
        hold: 0.9
