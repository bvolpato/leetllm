          - { id: add, phrase: Add three positions for system instructions, targets: [picture], color: yellow, caption_boundary: true }
          - { id: add-role, phrase: two for role markers, targets: [picture], color: yellow, caption_boundary: true }
          - { id: add-reply, phrase: and one to start the reply, targets: [picture], color: yellow, caption_boundary: true }
          - { id: made-up, phrase: "That's six more positions", targets: [picture], color: cyan, caption_boundary: true }
          - { id: total, phrase: Eight positions in all, targets: [picture], color: yellow, caption_boundary: true }
