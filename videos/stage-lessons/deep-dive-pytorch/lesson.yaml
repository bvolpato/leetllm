scenes:
  - id: intro
    title: Which tensor can PyTorch flatten with a view?
    visual: A gold read head leaps across six fixed storage cells, then doubles back. The original
      and transposed matrices stay beside the two jump distances as a blue reader walks the
      original rows.
    beats:
      - say: Watch the gold cursor jump from zero to three. Those numbers are neighbors in the first row
          of the transpose. To start the next row, it jumps back to one. The six values stay put
          in memory. Transposing changes the order we read them.
        hold: 0.8
        visual_cues:
          - id: jump-out
            phrase: Watch the gold cursor jump from zero to three.
            targets:
              - storage-readers
            color: yellow
            linger: 0.25
            caption_boundary: true
          - id: jump-back
            phrase: To start the next row, it jumps back to one.
            targets:
              - storage-readers
            color: yellow
            linger: 0.25
            caption_boundary: true
      - say: Now read the original tensor row by row. Follow the blue cursor across all six cells. It
          moves one cell to the right each time, even when it crosses from the first row to the
          second. A flat view needs one fixed step through memory. Which tensor can you flatten
          that way?
        hold: 2.5
        caption_starts:
          - Which tensor can you flatten that way?
        visual_cues:
          - id: blue-walk
            phrase: Follow the blue cursor across all six cells.
            targets:
              - storage-readers
            color: blue
            linger: 0.25
            caption_boundary: true
      - say: The original flattens with stride one. The transpose needs two different steps. Three cells
          forward and two back. A flat view has one stride. PyTorch rejects that
          call. How could we put all six values side by side in the transposed order?
        hold: 1.4
        caption_starts:
          - The transpose needs two different steps.
          - How could we put all six values side by side
        visual_cues:
          - id: view-blue
            phrase: The original flattens with stride one.
            targets:
              - stride-test
            color: blue
            linger: 0.25
            caption_boundary: true
          - id: view-gold
            phrase: PyTorch rejects that call.
            targets:
              - stride-test
            color: yellow
            linger: 0.25
            caption_boundary: true
  - id: strides
    title: Follow the write to element three
    visual: The original six-cell allocation stays in place. A reshape fills a second strip in
      transposed order. An alias write changes the first strip while the copied three remains visible
      below.
    beats:
      - say: Keep your eye on the three. In the original matrix it sits at row one, column zero. In the
          transpose it sits at row zero, column one. Both addresses land three elements from the
          start. Each integer takes eight bytes, so the three starts at byte twenty-four.
        hold: 0.8
        visual_cues:
          - id: locate-three
            phrase: Both addresses land three elements from the start.
            targets:
              - addresses
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: byte-offset
            phrase: at byte twenty-four
            targets:
              - addresses
            color: cyan
            linger: 0.25
            caption_boundary: true
      - say: Ask reshape for a flat tensor in gold order. Watch it fill a second allocation. The second box
          down there now holds a three of its own. If I write thirty through the transposed matrix,
          which of these two threes will change?
        hold: 2.4
        visual_cues:
          - id: flat-copy
            phrase: Watch it fill a second allocation.
            targets:
              - storage-copy
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: alias-question
            phrase: which of these two threes will change
            targets:
              - storage-copy
            color: cyan
            linger: 0.25
            caption_boundary: true
      - say: Write thirty to the shared cell. Read it through the original matrix and you get thirty. Read
          the copy and you still get three. For a slow attention call, check the strides going in,
          then look for a copy in the profiler around that call. Include the conversion when you time
          the path.
        hold: 1.1
        visual_cues:
          - id: alias-write
            phrase: Write thirty to the shared cell.
            targets:
              - addresses
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: alias-read
            phrase: Read it through the original matrix
            targets:
              - addresses
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: flat-read
            phrase: Read the copy and you still get three.
            targets:
              - storage-copy
            color: cyan
            linger: 0.25
            caption_boundary: true
  - id: tensor-contract
    title: An index map and a data allocation have different owners
    visual: The same six physical cells retain their identity while sizes/strides/offset/dtype become
      separate metadata; a later consumer performs an explicit ordered copy into a second
      allocation.
    beats:
      - say: Rewind to the six original values. For an ordinary dense strided tensor, the Python handle reaches a TensorImpl object with sizes,
          element strides, storage offset, dtype, device and autograd metadata. Storage owns the
          allocation and its byte region. Add offset to the sum of each logical index times its
          stride, then multiply by element size for a byte offset. Different metadata can reach the
          same physical cell.
        hold: 0.7
        visual_cues:
          - id: pt-tensor-contract-0
            phrase: For an ordinary dense strided tensor, the Python handle reaches a TensorImpl object with
              sizes, element strides, storage offset, dtype, device and autograd metadata. Storage
              owns the allocation and its byte region. Add offset to the sum of each logical index
              times its stride, then multiply by element size for a byte offset. Different metadata
              can reach the same physical cell.
            targets:
              - pt-tensor-contract-mechanism
            color: cyan
            linger: 0.2
      - say: View requires compatible strides. Reshape can share storage or allocate a copy; contiguous
          returns the same tensor when it is already contiguous and otherwise copies into the
          requested contiguous order. The transpose itself leaves our six cells in place. The later
          kernel may require a conversion. Inspect allocation or profiler events at that consumer,
          and include the copy in the measured path.
        hold: 0.7
        visual_cues:
          - id: pt-tensor-contract-1
            phrase: View requires compatible strides. Reshape can share storage or allocate a copy; contiguous
              returns the same tensor when it is already contiguous and otherwise copies into the
              requested contiguous order. The transpose itself leaves our six cells in place. The
              later kernel may require a conversion. Inspect allocation or profiler events at that
              consumer, and include the copy in the measured path.
            targets:
              - pt-tensor-contract-mechanism
            color: cyan
            linger: 0.2
      - say: This storage picture has a domain. Sparse tensors use other representations, and meta tensors
          describe data without allocating its values. Device and dtype affect implementation
          selection. Supported Apple M P S operations run on Apple’s GPU, often with unified memory;
          a discrete CUDA device commonly needs an explicit CPU-to-device transfer. Coverage,
          capacity and numerical behavior require the actual backend test.
        hold: 0.7
        visual_cues:
          - id: pt-tensor-contract-2
            phrase: This storage picture has a domain. Sparse tensors use other representations, and meta
              tensors describe data without allocating its values. Device and dtype affect
              implementation selection. Supported Apple M P S operations run on Apple’s GPU, often
              with unified memory; a discrete CUDA device commonly needs an explicit CPU-to-device
              transfer. Coverage, capacity and numerical behavior require the actual backend test.
            targets:
              - pt-tensor-contract-mechanism
            color: cyan
            linger: 0.2
  - id: dispatch-layers
    title: An operator contract survives several dispatch layers
    visual: One retained matrix call carries schema fields and alias identity through
      backend/autograd/functionalization/fake-mode selections; a wrong stride result fails a
      downstream view even when numbers initially agree.
    beats:
      - say: An operator schema describes names, overloads, argument and return types, defaults, aliases and
          mutation. Many generated Python and C-plus-plus bindings reach an A Ten operator. A custom
          implementation must preserve those semantics, including device, dtype and strides. Correct
          immediate numbers with a false alias or stride description can fail when the next view or
          compiler uses that description.
        hold: 0.7
        visual_cues:
          - id: pt-dispatch-layers-0
            phrase: An operator schema describes names, overloads, argument and return types, defaults, aliases
              and mutation. Many generated Python and C-plus-plus bindings reach an A Ten operator.
              A custom implementation must preserve those semantics, including device, dtype and
              strides. Correct immediate numbers with a false alias or stride description can fail
              when the next view or compiler uses that description.
            targets:
              - pt-dispatch-layers-mechanism
            color: cyan
            linger: 0.2
      - say: >-
          The dispatcher combines the tensor’s backend with the active modes, chooses the
          highest-priority applicable key, and can pass the call on to the next layer. An autograd
          layer can record the operation before a CPU or CUDA backend handles the data. Batching,
          functionalization and tracing also use this shared operator interface. Look in the
          profiler to see which kernel ran.
        hold: 0.7
        visual_cues:
          - id: pt-dispatch-layers-1
            phrase: >-
              The dispatcher combines the tensor’s backend with the active modes, chooses the
              highest-priority applicable key, and can pass the call on to the next layer. An
              autograd layer can record the operation before a CPU or CUDA backend handles the data.
              Batching, functionalization and tracing also use this shared operator interface. Look
              in the profiler to see which kernel ran.
            targets:
              - pt-dispatch-layers-mechanism
            color: cyan
            linger: 0.2
      - say: >-
          Functionalization gives a transformation an out-of-place version of an operation that
          mutates its input. A fake tensor carries shape, dtype and device metadata, so tracing can
          work out the next shape without allocating values. Python fake and tracing modes intercept
          calls in Python. The pinned source also has a Fake key for C-plus-plus fake-tensor mode.
          Both routes still have to return the metadata promised by the operator.
        hold: 0.7
        visual_cues:
          - id: pt-dispatch-layers-2
            phrase: >-
              Functionalization gives a transformation an out-of-place version of an operation that
              mutates its input. A fake tensor carries shape, dtype and device metadata, so tracing
              can work out the next shape without allocating values. Python fake and tracing modes
              intercept calls in Python. The pinned source also has a Fake key for C-plus-plus
              fake-tensor mode. Both routes still have to return the metadata promised by the
              operator.
            targets:
              - pt-dispatch-layers-mechanism
            color: cyan
            linger: 0.2
  - id: tape-lifecycle
    title: The reverse graph follows the branch that actually ran
    visual: A supplied scalar first scales then squares, saves an intermediate and runs its reverse
      derivatives in order; an unexecuted branch stays absent and a leaf update fails at its own
      boundary.
    beats:
      - say: >-
          Eager autograd records the differentiable operations that run while gradient tracking is
          enabled and an input requires gradients. If Python takes the square branch, the square
          goes on the tape. Each backward node keeps the values or metadata its derivative will
          need. Backward follows the nodes in reverse, accumulates gradients into leaves and
          releases saved intermediates as it goes, unless you ask to retain the graph.
        hold: 0.7
        visual_cues:
          - id: pt-tape-lifecycle-0
            phrase: >-
              Eager autograd records the differentiable operations that run while gradient tracking
              is enabled and an input requires gradients. If Python takes the square branch, the
              square goes on the tape. Each backward node keeps the values or metadata its
              derivative will need. Backward follows the nodes in reverse, accumulates gradients
              into leaves and releases saved intermediates as it goes, unless you ask to retain the
              graph.
            targets:
              - pt-tape-lifecycle-mechanism
            color: cyan
            linger: 0.2
      - say: "Try a separate scalar path: y equals two times x, and loss equals y squared. At x three, y is
          six. The square gives derivative twelve with respect to y, then the scale multiplies by
          two, so the input gradient is twenty-four. A detached alias of the saved intermediate can
          invalidate it even if the original leaf’s bytes never changed."
        hold: 0.7
        visual_cues:
          - id: pt-tape-lifecycle-1
            phrase: "Try a separate scalar path: y equals two times x, and loss equals y squared. At x three, y
              is six. The square gives derivative twelve with respect to y, then the scale
              multiplies by two, so the input gradient is twenty-four. A detached alias of the saved
              intermediate can invalidate it even if the original leaf’s bytes never changed."
            targets:
              - pt-tape-lifecycle-mechanism
            color: cyan
            linger: 0.2
          - id: pt-tape-gradient
            phrase: The square gives derivative twelve with respect to y, then the scale multiplies by two, so
              the input gradient is twenty-four.
            targets:
              - pt-tape-lifecycle-mechanism
            color: green
            linger: 0.35
      - say: Some unsafe writes fail immediately, such as an in-place write to a grad-requiring leaf in
          enabled grad mode. Others fail only when a saved version is checked. No-grad removes
          recording; inference mode has stricter metadata and later-use rules, and its newly created
          tensors do not track version counters. Neither is a repair for mutating training values
          that backward needs.
        hold: 0.7
        visual_cues:
          - id: pt-tape-lifecycle-2
            phrase: Some unsafe writes fail immediately, such as an in-place write to a grad-requiring leaf in
              enabled grad mode. Others fail only when a saved version is checked. No-grad removes
              recording; inference mode has stricter metadata and later-use rules, and its newly
              created tensors do not track version counters. Neither is a repair for mutating
              training values that backward needs.
            targets:
              - pt-tape-lifecycle-mechanism
            color: cyan
            linger: 0.2
  - id: autograd
    title: Backward needs the value that forward actually used
    visual: A square at three saves version zero and differentiates to six. A detached alias mutation
      increments the shared version and blocks backward; an independent clone leaves the saved value
      intact.
    beats:
      - say: >
          For the square function at three, forward produces nine and backward needs the original
          input to calculate the derivative. The plotted curve and tangent show the local slope.
          Autograd saves the required value together with version information, so the reverse
          calculation can check that its input still means the same thing.
        hold: 0.6
        visual_cues:
          - id: autograd-beat-1-focus-1
            phrase: Autograd saves the required value together with version information
            targets:
              - autograd-saved-for-backward-x-3-version-0
            color: cyan
            linger: 0.65
          - id: autograd-beat-1-focus-2
            phrase: The plotted curve and tangent show the local slope
            targets:
              - autograd-curve-autograd
            color: yellow
            linger: 0.65
          - id: pt-autograd-0
            phrase: For the square function at three, forward produces nine and backward needs the original
              input to calculate the derivative. The plotted curve and tangent show the local slope.
              Autograd saves the required value together with version information, so the reverse
              calculation can check that its input still means the same thing.
            targets:
              - pt-autograd-mechanism
            color: cyan
            linger: 0.2
      - say: >
          Now mutate the input through a detached alias before backward. Detaching stops gradient
          history, but this alias still reaches the same bytes. The current version advances while
          the saved version stays unchanged. Backward rejects the stale saved value rather than
          calculating a derivative from the modified input.
        hold: 0.6
        visual_cues:
          - id: autograd-beat-2-focus-1
            phrase: The current version advances while the saved version stays unchanged
            targets:
              - autograd-saved-for-backward-x-3-version-0
            color: cyan
            linger: 0.65
          - id: autograd-beat-2-focus-2
            phrase: Detaching stops gradient history, but this alias still reaches the same bytes
            targets:
              - autograd-detached-alias
            color: yellow
            linger: 0.65
          - id: pt-autograd-1
            phrase: Now mutate the input through a detached alias before backward. Detaching stops gradient
              history, but this alias still reaches the same bytes. The current version advances
              while the saved version stays unchanged. Backward rejects the stale saved value rather
              than calculating a derivative from the modified input.
            targets:
              - pt-autograd-mechanism
            color: cyan
            linger: 0.2
      - say: >
          Make an independent clone before writing. The clone changes to four while the original
          stays at three, and the original gradient is six. Views, detachment and copying answer
          different questions. For a custom derivative, a small double-precision numerical gradient
          check adds evidence that the reverse rule matches the forward operation.
        hold: 0.6
        visual_cues:
          - id: autograd-beat-3-focus-1
            phrase: Make an independent clone before writing
            targets:
              - autograd-axes-autograd
            color: cyan
            linger: 0.65
          - id: autograd-beat-3-focus-2
            phrase: Views, detachment and copying answer different questions
            targets:
              - autograd-axes-autograd
            color: yellow
            linger: 0.65
          - id: pt-autograd-2
            phrase: Make an independent clone before writing. The clone changes to four while the original stays
              at three, and the original gradient is six. Views, detachment and copying answer
              different questions. For a custom derivative, a small double-precision numerical
              gradient check adds evidence that the reverse rule matches the forward operation.
            targets:
              - pt-autograd-mechanism
            color: cyan
            linger: 0.2
  - id: attention
    title: Which values reach this query?
    visual: Two keys sit at absolute positions zero and one. Probability mass divides between them and
      scales two perpendicular value vectors. A mask closes one gate. Moving the query to the cached
      end changes the eligible keys on the same strip.
    beats:
      - say: One query has two places to look. Its first key points the same way as the query. The second
          points at a right angle. Their dot products are one and zero. Each key has two features, so
          divide both scores by the square root of two. Softmax gives about two thirds of the weight
          to the first key. Watch the two value vectors add. The first carries the output to the
          right. The second carries it up.
        hold: 0.9
        visual_cues:
          - id: dot-pair
            phrase: Their dot products are one and zero.
            targets:
              - key-strip
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: scale-pair
            phrase: divide both scores by the square root of two
            targets:
              - key-strip
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: mix-shares
            phrase: Softmax gives about two thirds of the weight to the first key.
            targets:
              - share
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: mix-vectors
            phrase: Watch the two value vectors add.
            targets:
              - vector
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: horizontal-value
            phrase: The first carries the output to the right.
            targets: [vector]
            color: blue
          - id: vertical-value
            phrase: The second carries it up.
            targets: [vector]
            color: pink
      - say: Keep the query, keys and values fixed. Give the second key a false entry in the boolean
          attention mask. PyTorch excludes it. The first key gets all the weight. Follow the output
          back to the horizontal axis. It lands at ten, zero, exactly the first value.
        hold: 1.1
        visual_cues:
          - id: block-second
            phrase: Give the second key a false entry
            targets:
              - key-strip
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: remix-one
            phrase: The first key gets all the weight.
            targets:
              - share
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: axis-output
            phrase: Follow the output back to the horizontal axis.
            targets:
              - vector
            color: cyan
            linger: 0.25
            caption_boundary: true
      - say: Now imagine these keys are a cached prefix. The call still has one query row and two keys.
          Upper-left causal alignment treats that row as position zero, so only the first key is
          visible. But our query belongs at position one. Which keys should it be allowed to read?
        hold: 2.3
        visual_cues:
          - id: cached-question
            phrase: our query belongs at position one
            targets:
              - key-strip
            color: cyan
            linger: 0.25
            caption_boundary: true
      - say: Let the second key through as well. At position one, both keys are in the prefix.
          The upward contribution returns.
          Both runs produced two output coordinates, yet only this mask implements the requested
          position. With dropout set to zero, check the output against this mixture before comparing
          kernels. The device, dtype, strides and mask affect which kernel can run. A profiler trace
          tells you which one did.
        hold: 1.2
        visual_cues:
          - id: attention-cached-position
            phrase: Let the second key through as well.
            targets:
              - key-strip
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: cached-mix
            phrase: The upward contribution returns.
            targets:
              - vector
            color: cyan
            linger: 0.25
            caption_boundary: true
  - id: attention-selector
    title: How much space do the scores take?
    visual: Two score planes keep the same query and key lengths. A head-width change doubles the
      products per score while the cell count stays fixed. A working tile crosses the plane in the
      fused example. Four query heads then connect to two stored key/value heads.
    beats:
      - say: Keep one batch and two heads. Each head compares every query to every key. At a length of eight
          thousand one hundred ninety-two on both sides, count the cells in both squares. Stored at
          two bytes per score, that one tensor takes two hundred fifty-six mebibytes. Double the head
          width. Each dot product now needs twice as many products. There are still just as many
          places to put the answers.
        hold: 1.1
        visual_cues:
          - id: score-count
            phrase: count the cells in both squares
            targets:
              - score-planes
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: score-bytes
            phrase: at two bytes per score
            targets:
              - score-planes
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: head-width
            phrase: Double the head width.
            targets:
              - score-planes
            color: cyan
            linger: 0.25
            caption_boundary: true
      - say: A fused kernel can work on one tile at a time. As the tile moves along the keys it updates
          running sums for these query rows. That lets it avoid writing the whole score and
          probability matrices to device memory. Device, dtype, shape, strides and mask all affect
          eligibility. The documented choices include FlashAttention two, memory-efficient, math and,
          in some builds, cuDNN. Record the implementation your profiler sees.
        hold: 0.8
        visual_cues:
          - id: score-tile
            phrase: As the tile moves along the keys
            targets:
              - score-planes
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: score-path
            phrase: Record the implementation your profiler sees.
            targets:
              - score-planes
            color: cyan
            linger: 0.25
            caption_boundary: true
      - say: Here four query heads share two key and value heads. Each pair reads the same stored head.
          Grouped-query attention requires equally sized groups and matching key and value head
          counts. The cited API excludes nested tensors. Check your installed CUDA backend for
          support. For a numerical reference, the math backend accepts double precision and uses
          thirty-two-bit intermediates with half or brain-float sixteen inputs.
        hold: 0.8
        visual_cues:
          - id: group-heads
            phrase: Each pair reads the same stored head.
            targets:
              - score-planes
            color: cyan
            linger: 0.25
            caption_boundary: true
  - id: mask-modes
    title: Which keys do these flags let through?
    visual: A padding flag stays attached to its value of 1000. Copying the boolean mask passes only
      that value to the mixer. Inverting the flags exchanges it for the two real values. A second pass
      sets dropout to zero.
    beats:
      - say: The last key is padding. Its value is a thousand, so we'll notice if it slips in. All three
          scores are zero and dropout is off for this test. The padding mask marks just the last key
          true. Pass those flags straight into scaled dot-product attention. Which value comes out?
        hold: 2.3
        visual_cues:
          - id: pass-padding
            phrase: Pass those flags straight into scaled dot-product attention.
            targets:
              - mask-flags
            color: cyan
            linger: 0.25
            caption_boundary: true
      - say: One thousand. This call reads true as keep. Flip the boolean flags. Four and eight now share
          the weight equally, so the result is six. Align the key axis when you broadcast the mask.
          For an additive mask, use zero on the allowed scores and negative infinity on the blocked
          ones.
        hold: 1.1
        visual_cues:
          - id: wrong-padding
            phrase: One thousand.
            targets:
              - mask-mix
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: invert-padding
            phrase: Flip the boolean flags.
            targets:
              - mask-flags
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: mix-real
            phrase: Four and eight now share the weight equally
            targets:
              - mask-mix
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: bias-mask
            phrase: For an additive mask
            targets:
              - mask-flags
            color: cyan
            linger: 0.25
            caption_boundary: true
      - say: Back in the evaluation module, its old dropout argument is still point two. The functional call
          uses that probability even in evaluation mode with gradients off. Pass zero for inference.
          Now the same two keys give six on every call in this example.
        hold: 0.8
        visual_cues:
          - id: old-dropout
            phrase: its old dropout argument is still point two
            targets:
              - mask-mix
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: zero-dropout
            phrase: Pass zero for inference.
            targets:
              - mask-mix
            color: cyan
