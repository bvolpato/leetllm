  - id: checkpoint
    title: The next update depends on more than the saved weight
    visual: An Adam trajectory runs five updates, then branches into a full-state restore and a weights-only
      restore. Both begin with identical weights but produce different next weights under the same gradient.
    beats:
      - say: >
          A weights export can reproduce an inference output while leaving out the state required to resume
          training. Build a short Adam trajectory and save its weight, moments and counter. The next update
          depends on that history as well as the next gradient.
        hold: 0.6
        visual_cues:
          - id: trajectory
            phrase: "Build a short Adam trajectory and save its weight, moments and counter."
            targets:
              - picture
      - say: >
          Restore the complete state on one branch. On the other, keep the same weight and reset the moments.
          Apply the same next gradient and step number. The branches separate because the optimizer interprets
          that gradient through different histories. The visible gap comes from the calculated next weights.
        hold: 0.7
        visual_cues:
          - id: branch
            phrase: "Restore the complete state on one branch."
            targets:
              - picture
          - id: reset
            phrase: "On the other, keep the same weight and reset the moments."
            targets:
              - picture
          - id: common
            phrase: "Apply the same next gradient and step number."
            targets:
              - picture
          - id: separate
            phrase: "The branches separate because the optimizer interprets that gradient through different histories."
            targets:
              - picture
          - id: gap
            phrase: "The visible gap comes from the calculated next weights."
            targets:
              - picture
      - say: >
          A distributed resume also needs scheduler state and the relevant random and data-loader progress.
          Test it in a fresh engine against an uninterrupted next step. Participating ranks must follow the
          checkpoint operation's collective contract. Test consolidated model export separately with matching
          reference inputs.
