version: 1
id: deep-dive-deepspeed
title: DeepSpeed and the State Behind a Training Step
source: projects/deep-dive-deepspeed/content.md
voice: en-US-AndrewNeural
rate: +0%
sources:
  - title: DeepSpeed ZeRO documentation
    url: https://deepspeed.readthedocs.io/en/stable/zero3.html
  - title: DeepSpeed training API
    url: https://deepspeed.readthedocs.io/en/stable/training.html
  - title: DeepSpeed checkpointing
    url: https://deepspeed.readthedocs.io/en/stable/model-checkpointing.html
scenes:
  - id: intro
    title: Will Adam's next 6 GB fit?
    visual: Slide six outlined squares toward a GPU with sixteen memory slots. Twelve slots already hold weights, gradients and master weights. After the prediction, line up the request beneath the four free slots and show the two squares past the edge.
    beats:
      - say: >
          Here comes a request for six gigabytes. Adam needs that space for its first moment, the running average of the gradients. Can it fit on this GPU?
        hold: 0.55
        caption_starts: ["Adam needs that space", "Can it fit on this GPU?"]
      - say: >
          Each square holds a gigabyte. The three blue squares hold a billion and a half two-byte weights. Their two-byte gradients take three more squares. Adam's four-byte master copy takes six. Count the empty squares.
        hold: 2.2
        caption_starts: ["Their two-byte gradients", "Adam's four-byte master copy", "Count the empty squares."]
        visual_cues:
          - { id: weights, phrase: "The three blue squares", targets: [weights] }
          - { id: gradients, phrase: "Their two-byte gradients", targets: [gradients] }
          - { id: master, phrase: "Adam's four-byte master copy", targets: [master] }
      - say: >
          Four free squares. The request is two gigabytes too large. Adam also tracks the average of the squared gradients. That second moment needs another six gigabytes. The five arrays together need twenty-four. Activations and temporary buffers still need their own space.
        hold: 0.65
        caption_starts: ["The request is two gigabytes too large.", "That second moment needs another six gigabytes."]
        visual_cues:
          - { id: miss, phrase: "The request is two gigabytes too large.", targets: [request] }
          - { id: second, phrase: "That second moment needs another six gigabytes.", targets: [ruler] }
          - { id: total, phrase: "The five arrays together need twenty-four.", targets: [total], caption_boundary: true }
      - say: >
          Suppose four GPUs train on different examples. Does each one need to keep all three pink arrays?
        hold: 1.6
        visual_cues:
          - { id: owners, phrase: "Does each one need to keep all three pink arrays?", targets: [optimizer] }
      - say: >
          DeepSpeed can give each rank a slice to update. That way of sharing the state is called ZeRO.
        hold: 0.6
        visual_cues:
          - { id: split, phrase: "DeepSpeed can give each rank a slice to update.", targets: [optimizer] }
  - id: ownership
    title: Which rank keeps slice B?
    visual: Keep four named model slices in fixed columns for weights, gradients and Adam. Remove copies one family at a time. The surviving B cells identify its owner, and per-rank GB follow from the retained arrays.
    beats:
      - say: >
          Cut the same model into four equal slices, A through D. In ordinary data parallel training, each row processes its own examples and keeps every slice of every array. Look at B in the pink column. Stage one gives its master weight and both moments to rank one. The same rule leaves each rank with one pink slice. That brings persistent state down from twenty-four to ten and a half gigabytes per rank.
        hold: 0.6
        caption_starts: ["Look at B in the pink column.", "Stage one gives its master weight", "to rank one.", "That brings persistent state down"]
        visual_cues:
          - { id: optimizer, phrase: "Stage one gives its master weight and both moments to rank one.", targets: [optimizer] }
      - say: >
          Follow B to the gradients. At stage two, rank one also keeps B's reduced gradient. All four ranks still have the compute weights. At stage three, rank one keeps the weight slice B as well. When a layer needs the full weight tensor, each rank gathers its missing pieces from their owners.
        hold: 0.6
        visual_cues:
          - { id: gradient, phrase: "rank one also keeps B's reduced gradient", targets: [gradients] }
          - { id: parameter, phrase: "rank one keeps the weight slice B as well", targets: [weights] }
      - say: >
          Six gigabytes per rank looks comfortable on a sixteen-gigabyte GPU. That's the state between operations under this recipe. To choose a stage, measure what else is live during the largest gather and how long the layer waits for it. First check the dtype of each array you counted.
        hold: 0.6
        visual_cues:
          - { id: peak, phrase: "measure what else is live during the largest gather", targets: [state] }
  - id: dtype-ledger
    title: Give every state array its own element width
    visual: Construct separate compute-weight,gradient,master-weight and two moment allocations from the same
      parameter count. Change only accumulation dtype and recompute each stage.
    beats:
      - say: The three gigabytes of compute weights came from one point five billion parameters at two bytes each. The
          gradient adds three. A four-byte master weight and two four-byte moments add eighteen. Sixteen bytes
          per parameter make twenty-four decimal gigabytes before activations. Adam averages squared gradients over time.
          A centered variance measures the spread around a mean.
        hold: 0.55
        visual_cues:
          - id: weights
            phrase: "The three gigabytes of compute weights came from one point five billion parameters at two bytes each."
            targets:
              - picture
          - id: gradients
            phrase: "The gradient adds three."
            targets:
              - picture
          - id: total
            phrase: "Sixteen bytes per parameter make twenty-four decimal gigabytes before activations."
            targets:
              - picture
          - id: adam
            phrase: "A four-byte master weight and two four-byte moments add eighteen."
            targets:
              - picture
      - say: Now change only gradient accumulation to four bytes. It adds six gigabytes instead of three, and the
          persistent total becomes twenty-seven. Check the gradient buffer's dtype separately from the compute weights.
          If your optimizer updates the weights directly, leave the master copy out of the count.
        hold: 0.55
        visual_cues:
          - id: wide
            phrase: "Now change only gradient accumulation to four bytes."
            targets:
              - picture
          - id: wide-result
            phrase: "It adds six gigabytes instead of three, and the persistent total becomes twenty-seven."
            targets:
              - picture
      - say: For parameter count P, let p, g and o name bytes per parameter for compute weights, gradients and
          optimizer-related arrays. With N data ranks, stage two retains P times p plus P times the quantity g
          plus o, divided by N. Stage three divides all three terms by N. At the peak, also count the padded
          gathers, activations and workspace that are live at the same time.
        hold: 0.55
        visual_cues:
          - id: formula
            phrase: "With N data ranks, stage two retains P times p plus P times the quantity g plus o, divided by N."
            targets:
              - picture
  - id: reduce
    title: Which gradient goes into Adam's history?
    visual: Follow the same two rank gradients through reduce-then-square and square-then-reduce. Reset the initial Adam state and change one gradient so the pair cancels. Compare the two second moments on the same branches.
    beats:
      - say: >
          Rank zero owns this weight. Two equally weighted ranks contribute gradients of one and three. The owner takes their mean, two. Adam keeps a running average of squared gradients, so square that two. You get four.
        hold: 0.55
        caption_starts: ["The owner takes their mean, two.", "You get four."]
        visual_cues:
          - { id: mean, phrase: "The owner takes their mean, two.", targets: [reduction] }
          - { id: square, phrase: "You get four.", targets: [square] }
      - say: >
          Try the operations in the other order. Squaring on each rank gives one and nine. Their average is five. That difference gets written into the optimizer's history. Starting from zero, this recipe gives the new square a weight of one thousandth. The owner stores four thousandths in its second moment. Its first moment is point two. After bias correction, the first step takes the weight from one to about point nine nine.
        hold: 2.3
        visual_cues:
          - { id: local, phrase: "Their average is five.", targets: [local-squares] }
          - { id: write-v, phrase: "The owner stores four thousandths in its second moment.", targets: [history] }
          - { id: owner, phrase: "the first step takes the weight from one to about point nine nine.", targets: [update] }
      - say: >
          Reset the weight and moments. Keep rank zero's gradient at one. Change rank one's gradient to minus one. The two gradients now cancel. What should the owner store in its second moment?
        hold: 2
        visual_cues:
          - { id: reset, phrase: "Reset the weight and moments.", targets: [history] }
          - { id: change, phrase: "Change rank one's gradient to minus one.", targets: [contribution] }
      - say: >
          Zero. The reduced gradient is zero, and so is its square. Squaring first would leave a positive entry even though the weight stayed put. Check the moments as well as the weight when you compare a sharded update with a reference. Next we'll change how many tokens each rank contributes.
        hold: 0.65
        visual_cues:
          - { id: cancel, phrase: "The reduced gradient is zero, and so is its square.", targets: [history], caption_boundary: true }
          - { id: mistaken, phrase: "Squaring first would leave a positive entry", targets: [local-squares] }
  - id: token-objective
    title: Preserve the intended token objective before sharding
    visual: Two differently sized token sets contribute separate loss sums and counts. Compute the global token
      mean,then reduce the gradient before the nonlinear second-moment operation.
    beats:
      - say: Equal rank averages assume equal weighting units. Suppose one rank has two valid tokens and the other
          six. A mean loss from each rank, averaged equally, gives each rank half the influence. A global
          token mean instead weights those means by two eighths and six eighths. Padding tokens should not
          silently become objective terms.
        hold: 0.55
        visual_cues:
          - id: token
            phrase: "A global token mean instead weights those means by two eighths and six eighths."
            targets:
              - picture
      - say: "Choose the objective first: combine the appropriate loss sums and valid-token counts, then arrange loss
          and distributed scaling to reproduce that gradient. Adam updates its second moment as beta two times
          the old moment plus one minus beta two times the square of the reduced gradient. Squaring local
          gradients first cannot generally reproduce it."
        hold: 0.55
        visual_cues:
          - id: adam
            phrase: "Adam updates its second moment as beta two times the old moment plus one minus beta two times the square of the reduced gradient."
            targets:
              - picture
      - say: The CPU example matches the reference Adam update when both ranks have equal weight.
          To check unequal token counts, run these same eight valid tokens as one batch.
          Compare its loss and next weight with the two-rank run, using the same masks and accumulation schedule.
        hold: 0.55
        visual_cues:
          - id: scope
            phrase: "Compare its loss and next weight"
            targets:
              - picture
  - id: accumulation
    title: Microsteps and optimizer updates have different clocks
    visual: Eight microbatch cells fill across three beats. The engine call counter advances on each microstep
      while the optimizer-update counter changes only at the configured accumulation boundary. Global batch is
      calculated from data degree.
    beats:
      - say: >
          A training engine also owns accumulation bookkeeping. Several microbatches can contribute to one
          optimizer update. Under DeepSpeed's default managed accumulation, call the engine's backward and
          step methods for each microbatch. The engine advances its microstep clock and waits for the
          configured update boundary.
        hold: 0.6
        visual_cues:
          - id: first
            phrase: "Several microbatches can contribute to one optimizer update."
            targets:
              - picture
      - say: >
          The next cells fill without an Adam update yet. The effective batch combines microbatch size,
          accumulation count and data-parallel degree. Tensor-parallel workers cooperate on the same examples,
          so multiplying by every physical GPU would overcount the independent data contributions.
        hold: 0.6
        visual_cues:
          - id: next
            phrase: "The next cells fill without an Adam update yet."
            targets:
              - picture
          - id: batch
            phrase: "The effective batch combines microbatch size, accumulation count and data-parallel degree."
            targets:
              - picture
      - say: >
          The final cell reaches the boundary and the optimizer advances once. The default engine already
          handles its configured accumulation scaling. Dividing the loss again would change the gradient
          magnitude. Alternative unmanaged APIs have different contracts, so keep the loop behavior and
          resolved configuration together.
        hold: 0.6
        visual_cues:
          - id: last
            phrase: "The final cell reaches the boundary and the optimizer advances once."
            targets:
              - picture
  - id: managed-unmanaged
    title: Use the microstep contract of the installed engine
    visual: Replay the same backward contributions through a managed microstep counter and an explicitly unmanaged
      update boundary. Keep loss scaling visible.
    beats:
      - say: Under default managed accumulation, every backward is paired with an engine step call. Step advances the
          microstep counter even when no optimizer update occurs. Calling it only once after eight backward
          calls advances that clock only once. The configured loss averaging is already applied; an extra
          division would scale the gradient twice.
        hold: 0.55
        visual_cues:
          - id: wrong
            phrase: "Calling it only once after eight backward calls advances that clock only once."
            targets:
              - picture
          - id: scale
            phrase: "an extra division would scale the gradient twice."
            targets:
              - picture
          - id: managed
            phrase: "The configured loss averaging is already applied"
            targets:
              - picture
      - say: The separate unmanaged mode makes each step call one optimizer update, and the caller decides when to
          call it. If the actual accumulation count differs from the configured count, disable the engine’s
          accumulation-count scaling and supply the intended weights. Equal-sized means can be equally
          weighted; unequal token counts need the objective-aware weights we just derived.
        hold: 0.55
        visual_cues:
          - id: caller
            phrase: "The separate unmanaged mode makes each step call one optimizer update, and the caller decides when to call it."
            targets:
              - picture
      - say: The August twenty twenty-six source rejects unmanaged accumulation with parameter or optimizer offload.
          The training guide we checked on November sixth supports both. Check which engine your loop actually runs.
          Keep the exact commit, resolved configuration and loop with the result.
        hold: 0.55
        visual_cues:
          - id: version
            phrase: "Keep the exact commit, resolved configuration and loop with the result."
            targets:
              - picture
  - id: bucket-units
    title: Convert element counts after choosing the process groups
    visual: Separate data replicas from tensor workers;derive global batch and convert one communication bucket
      from element count to allocated bytes.
    beats:
      - say: A configuration’s bucket size counts elements. Multiply that count by the actual buffer’s bytes per
          element before comparing it with memory capacity. Two hundred million elements occupy four hundred
          decimal megabytes at two bytes or eight hundred at four. The name of the field does not establish
          its dtype.
        hold: 0.55
        visual_cues:
          - id: dtype
            phrase: "Two hundred million elements occupy four hundred decimal megabytes at two bytes or eight hundred at four."
            targets:
              - picture
      - say: Global batch equals microbatch per data rank times accumulation count times data-parallel degree.
          Tensor-parallel workers cooperate on the same examples. In a simple twelve-GPU arrangement with
          tensor degree three and no other parallel axis, data degree is four. Do not multiply independent
          samples by all twelve workers.
        hold: 0.55
        visual_cues:
          - id: batch
            phrase: "data degree is four."
            targets:
              - picture
      - say: The engine can infer one of train batch, microbatch and accumulation count when the remaining compatible
          quantities and data degree are supplied. Verify the resolved values. Changing accumulation or
          topology can change the objective, communication frequency and working set, even when the total
          physical GPU count stays fixed.
        hold: 0.55
        visual_cues:
          - id: resolve
            phrase: "Verify the resolved values."
            targets:
              - picture
  - id: gather
    title: How much space does rank zero reserve?
    visual: Four owners each hold two of A's eight values. Keep rank zero's local A0 and A1 in their original slots. Allocate an empty destination and count slots before filling them, first with the local pair and then with three pairs from peers.
    beats:
      - say: >
          Zoom in on one rank in stage three. Each of these four layers has eight weights, split evenly over four ranks. Rank zero keeps the first two weights of every layer. Find A zero and A one in its blue row. The next layer needs all of A to compute.
        hold: 0.55
        visual_cues:
          - { id: local, phrase: "Find A zero and A one in its blue row.", targets: [resident] }
      - say: >
          Rank zero can copy two values locally. The other six must come from peers. This gather writes to a separate buffer. How many new slots must it reserve before the first peer sends anything?
        hold: 2.1
        visual_cues:
          - { id: ask, phrase: "How many new slots must it reserve", targets: [destination] }
      - say: >
          Eight new slots. Watch the empty destination appear. Sixteen slots are already in use on this rank, and the received count is still zero. Copy A zero and A one down. Their originals stay in the blue row. Now bring in the three pairs from the other ranks. All eight values are ready for the layer.
        hold: 0.65
        caption_starts: ["Sixteen slots are already in use", "Copy A zero and A one down.", "Now bring in the three pairs"]
        visual_cues:
          - { id: reserve, phrase: "Eight new slots.", targets: [destination], caption_boundary: true }
          - { id: copy, phrase: "Copy A zero and A one down.", targets: [local-copy] }
          - { id: receive, phrase: "Now bring in the three pairs from the other ranks.", targets: [peer-copies] }
      - say: >
          While A computes, start gathering B. Both full buffers are now live, along with all eight resident slots. That makes twenty-four. Once A finishes and releases its buffer, sixteen slots remain. Starting B early may hide a wait. To decide whether you can afford that overlap, count the buffers at the instant they're both live.
        hold: 0.65
        visual_cues:
          - { id: prefetch, phrase: "start gathering B", targets: [prefetch] }
          - { id: release, phrase: "releases its buffer", targets: [destination] }
  - id: padded-gather
    title: Where do five weights go on four ranks?
    visual: Split five A values into four equal-width shards. Distinguish occupied slots from padding and follow all four shards into a new buffer. Keep the local shards present while B gets a padded destination of its own.
    beats:
      - say: >
          Keep the four ranks. This time there are just two tensors. A has five weights and B has seven. Give every owner the same number of whole slots for A. One slot apiece leaves the fifth weight without a home. How wide must each shard be?
        hold: 1.9
        visual_cues:
          - { id: fifth, phrase: "One slot apiece leaves the fifth weight without a home.", targets: [logical] }
      - say: >
          Two slots per rank. Deal the five weights into those pairs. The third rank has one spare slot and the fourth has two. Those are padding. On rank zero, B also needs two local slots. The blue row stays four slots wide for as long as this example runs.
        hold: 0.55
        visual_cues:
          - { id: divide, phrase: "Two slots per rank.", targets: [owners], caption_boundary: true }
          - { id: deal, phrase: "Deal the five weights into those pairs.", targets: [owners] }
          - { id: resident, phrase: "On rank zero, B also needs two local slots.", targets: [resident] }
      - say: >
          For A's gather, allocate a destination as wide as all four pairs. Copy the local pair, then receive the other three pairs, padding included. Look at the three counts. The layer uses five weights. Six slots came from peers. The destination occupies eight slots. With the four resident slots still there, that makes twelve.
        hold: 0.65
        visual_cues:
          - { id: reserve, phrase: "allocate a destination as wide as all four pairs", targets: [destination] }
          - { id: copy, phrase: "Copy the local pair", targets: [local-copy] }
          - { id: receive, phrase: "then receive the other three pairs", targets: [peer-copies] }
          - { id: counts, phrase: "Look at the three counts.", targets: [counts] }
      - say: >
          Now prefetch B while A is live. Seven weights need another eight-slot buffer. The peak rises to twenty. The pinned sequential gather keeps the input shard and allocates a separate output. Check for shared storage before subtracting any local slots. DeepSpeed can partition weights during initialization. If a single live operator still exceeds the device, consider tiling it or splitting its work across devices.
        hold: 0.65
        visual_cues:
          - { id: prefetch, phrase: "Seven weights need another eight-slot buffer.", targets: [prefetch] }
  - id: parameter-coordination
    title: Coordinate external access and dynamic selection separately
    visual: A tied weight is read outside its owner on one branch;another branch chooses different experts across
      data ranks. Repair the two distinct ownership problems.
    beats:
      - say: A tied embedding reused outside its owning module is an external parameter. DeepSpeed discovers common
          cases automatically; otherwise register the consuming module’s existing parameter or use an explicit
          gathered-parameter access scope. This coordinates availability. It does not introduce a new
          trainable parameter into an already-created optimizer.
        hold: 0.55
        visual_cues:
          - id: register
            phrase: "otherwise register the consuming module’s existing parameter or use an explicit gathered-parameter access scope."
            targets:
              - picture
      - say: Now two data ranks choose different existing experts and encounter incompatible gather sequences. A ZeRO
          leaf boundary gathers the enclosing module’s descendants together before executing it. That can
          increase the live working set, while leaving expert forward execution conditional. Set the boundary
          before engine initialization through the supported configuration or utility.
        hold: 0.55
        visual_cues:
          - id: diverge
            phrase: "Now two data ranks choose different existing experts and encounter incompatible gather sequences."
            targets:
              - picture
          - id: leaf
            phrase: "A ZeRO leaf boundary gathers the enclosing module’s descendants together before executing it."
            targets:
              - picture
      - say: The two repairs serve different causes. External registration explains who reads an existing weight. A
          leaf boundary coordinates a dynamic subtree’s availability across ranks. A collective timeout can be
          a later symptom, so retain the earliest rank failure and the actual parameter-use order when
          constructing the reproducer.
        hold: 0.55
        visual_cues:
          - id: causes
            phrase: "The two repairs serve different causes."
            targets:
              - picture
  - id: ring-volume
    title: What crosses one link after the update?
    visual: A four-weight ZeRO-2 example retains four replicas. Mark each owner's new diagonal entry, then relay the slices one hop at a time while counting what rank zero sends. Use the observed three sends as the unit for three explicitly stated schedules.
    beats:
      - say: >
          At stage two, every rank keeps four compute weights in this little model. Each column has a different update owner. Give each owner its reduced gradient and apply the first Adam step. Only four entries change. Which updated weights is rank zero still missing?
        hold: 2.1
        visual_cues:
          - { id: owners, phrase: "apply the first Adam step", targets: [replicas] }
      - say: >
          B, C and D are still stale. Follow the first hop around the ring. Rank zero sends its new A to rank one and takes D from rank three. On the second hop it passes D along and receives C. On the third it passes C and receives B. Now every row has the four updated weights. Gathering one slice from each owner this way is an all-gather.
        hold: 0.6
        caption_starts: ["Follow the first hop around the ring.", "On the second hop", "On the third", "Now every row"]
        visual_cues:
          - { id: stale, phrase: "B, C and D are still stale.", targets: [replicas], caption_boundary: true }
          - { id: first, phrase: "takes D from rank three", targets: [replicas, sent] }
          - { id: second, phrase: "and receives C", targets: [replicas, sent] }
          - { id: third, phrase: "and receives B", targets: [replicas, sent] }
      - say: >
          Count the elements rank zero sent. It sent three for a vector of four. In a balanced ring with N ranks, one all-gather or one reduce-scatter sends N minus one chunks of size P over N per rank. P is the full vector length. Use sends throughout the comparison.
        hold: 0.55
        caption_starts: ["It sent three for a vector of four."]
        visual_cues:
          - { id: unit, phrase: "It sent three for a vector of four.", targets: [schedules] }
      - say: >
          Take one backward call, equal element widths and no extra gathers. Replicated data parallelism scatters reduced gradients, then gathers gradients. Six elements sent. Our stage-two schedule also sends six, but its second operation gathers the updated weights we just traced. At stage three, gather parameters for forward, gather them again for backward, then reduce-scatter gradients. That sends nine.
        hold: 0.55
        visual_cues:
          - { id: ddp, phrase: "Six elements sent.", targets: [ddp] }
          - { id: stage-two, phrase: "its second operation gathers the updated weights we just traced", targets: [zero-two] }
          - { id: stage-three, phrase: "That sends nine.", targets: [zero-three] }
      - say: >
          At large rank counts the two-collective schedules approach two P elements per rank. The three-collective schedule approaches three P. Stage-one replicas also need current weights after an owner updates them. Check the engine's actual calls. Repeated backward passes, recomputation, persistence and different dtypes can change the bytes. Even at the same byte count, overlap and bucket timing change how long compute waits. On NVIDIA GPUs, NCCL commonly runs the collectives that DeepSpeed schedules.
        hold: 0.65
        visual_cues:
          - { id: time, phrase: "overlap and bucket timing change how long compute waits", targets: [cost] }
  - id: coalesced-reduction
    title: Keep communication and optimizer clocks distinct
    visual: Show repeated backward reductions with one eventual Adam update;thenretain a full local gradient
      across a separately supported coalesced scope.
    beats:
      - say: Under default ZeRO-two and ZeRO-three, backward reduces and partitions gradients on each call even while
          accumulation postpones Adam. Retaining only the owned gradient saves persistent memory. Repeating
          the communication can still cost time across an accumulation window.
        hold: 0.55
        visual_cues:
          - id: normal
            phrase: "backward reduces and partitions gradients on each call even while accumulation postpones Adam."
            targets:
              - picture
      - say: "Do not substitute the DDP no-sync context for those stages: the inspected engine rejects it. A separate
          coalesced-gradient-reduction scope can defer reductions across several backward calls. It retains
          the complete local gradient until the scope ends and has restrictions on engine, precision wrapper
          and accumulation boundary."
        hold: 0.55
        visual_cues:
          - id: defer
            phrase: "A separate coalesced-gradient-reduction scope can defer reductions across several backward calls."
            targets:
              - picture
          - id: scope
            phrase: "It retains the complete local gradient until the scope ends"
            targets:
              - picture
      - say: Compare the two schedules on the same tokens. Both finish one Adam update.
          On the right, one reduction replaces eight, but the full gradient occupies memory until that reduction.
          Measure the peak buffer size and the time to finish the update.
        hold: 0.55
        visual_cues:
          - id: same
            phrase: "Both finish one Adam update."
            targets:
              - picture
  - id: offload
    title: When does moving weights cost GPU time?
    visual: Compare two schedules on one five-second clock. Both move twelve gigabytes and run three seconds of GPU work. Leave the overlapping run visible when the dependent run starts.
    beats:
      - say: >
          Offloading weights frees GPU memory. This GPU can work on the current layer while it fetches twelve gigabytes for the next one. At six gigabytes per second, how long does the transfer take?
        hold: 1.7
      - say: >
          Two seconds. Start both clocks. The weights arrive while the GPU is still working. The current layer still has one second of work left. Both finish within three seconds.
        hold: 0.6
        caption_starts: ["Start both clocks.", "The current layer still has one second", "Both finish within three seconds."]
        visual_cues:
          - id: transfer
            phrase: "Start both clocks."
            targets:
              - picture
          - { id: service, phrase: "Two seconds.", targets: [transfer] }
          - id: finish
            phrase: "The current layer still has one second of work left."
            targets:
              - picture
      - say: >
          Now the current layer needs those weights. Watch the lower clock. The GPU waits two seconds before its three seconds of work can start. That takes five seconds. The same twelve gigabytes crossed the link on both runs.
        hold: 0.6
