  - id: fresh-plan
    title: When can A start gathering?
    visual: Keep the three tensors on one rank and compare the same padded A request against allowances of 30 and 29 parameter slots. Leave the rejected request outside the allocation, release B after its last use, then admit A without overlap. Keep the peak of the repaired schedule visible.
    beats:
      - say: >
          One last scheduling decision. A has seven weights, B has eleven and C has five. Three ranks split each tensor. Round each shard up to a whole slot. On rank zero, how many slots must stay even when no layer is computing?
        hold: 1.9
      - say: >
          Nine stay. A needs three, B needs four and C needs two. B computes first. Its full buffer needs four slots from each of three owners. That's twelve more slots, so twenty-one are live. Leave B where it is. Its last use hasn't finished.
        hold: 0.65
        visual_cues:
          - { id: resident, phrase: "Nine stay.", targets: [shards], caption_boundary: true }
          - { id: b, phrase: "so twenty-one are live", targets: [ruler], caption_boundary: true }
      - say: >
          A is next. Its seven weights need a full buffer of nine slots. With an allowance of thirty parameter slots on this rank, can A start gathering while B is still in use?
        hold: 2.0
        visual_cues:
          - { id: ask, phrase: "A is next.", targets: [request] }
      - say: >
          Yes. Nine plus twelve plus nine fills all thirty slots.
        hold: 2.2
        visual_cues:
          - { id: exact, phrase: "Nine plus twelve plus nine fills all thirty slots.", targets: [ruler], caption_boundary: true }
      - say: >
          Replay the same request with one change. This time the allowance is twenty-nine. B still holds its buffer. Should the scheduler start gathering A now, or wait for B's last use?
        hold: 2.2
        visual_cues:
          - { id: replay, phrase: "Replay the same request", targets: [request] }
          - { id: limit, phrase: "This time the allowance is twenty-nine.", targets: [limit] }
      - say: >
          Wait. Only eight slots are free, and A needs nine. Let B finish. Release its twelve slots. The nine local slots stay. Now gather A. Nine local plus nine for A makes eighteen. The highest count on this second schedule was twenty-one, while B was live.
        hold: 0.7
        caption_starts: ["Let B finish.", "Now gather A.", "The highest count on this second schedule"]
        visual_cues:
          - { id: wait, phrase: "Only eight slots are free, and A needs nine.", targets: [request], caption_boundary: true }
          - { id: release, phrase: "Release its twelve slots.", targets: [ruler] }
          - { id: admit, phrase: "Now gather A.", targets: [ruler] }
          - { id: peak, phrase: "was twenty-one, while B was live", targets: [peak] }
      - say: >
          Look again at the peak. B is still on the GPU and A is waiting. Count the bytes in those twenty-one parameter slots. Add the gradients, Adam state, activations and workspace live at that instant. In the next lesson, Ray schedules tasks and actors. Which worker can take the next task?
        hold: 1.1
        caption_starts: ["Count the bytes", "Add the gradients", "In the next lesson"]
        visual_cues:
