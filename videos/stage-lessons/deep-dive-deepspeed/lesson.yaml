            targets:
              - picture
      - say: The pinned PipelineEngine rejects ZeRO-two and ZeRO-three. Current AutoTP training documentation
          separately supports stages zero through three with model-specific partition rules. Those are
          different integration paths. FSDP uses PyTorch-native interfaces; Megatron supplies model-parallel
          components and schedules. Test the required wrapper combination, loss parity and checkpoint behavior
          rather than assuming compatible names imply compatible execution.
