    visual: Keep the same parameter and update counters while following initialization,backward/step,module hooks
      and checkpoint ownership to their actual source modules.
    beats:
      - say: Initialization selects the engine and groups. The runtime engine owns backward, accumulation, step and
          save-load behavior. ZeRO stage-one-and-two code handles gradient and optimizer ownership;
          stage-three code coordinates sharded optimizer state and parameter availability. The
          partition-parameters code owns partitions, gathers and parameter status.
