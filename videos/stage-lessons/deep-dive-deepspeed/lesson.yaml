            targets:
              - picture
          - id: partition
            phrase: "The partition-parameters code owns partitions, gathers and parameter status."
            targets:
              - picture
      - say: These are cooperating responsibilities. A resident parameter calls for its gather and release trace; an
          early optimizer update calls for the accumulation boundary. Offload staging has its own swap-tensor
          path, and pipeline scheduling has its own engine. Following the actual call preserves the
          distinction between a configuration request and an executed operation.
