  - id: offload-domains
    title: Keep storage location and optimizer computation distinct
    visual: Trace optimizer arrays from device to CPU and optional NVMe while preserving the CPU update owner and
      consumer dependencies.
    beats:
      - say: ZeRO-Offload moved optimizer state and optimizer work toward CPU memory. ZeRO-Infinity extends the
          hierarchy to CPU and NVMe storage. The documented optimizer-offload configuration covers stages one
          through three; parameter offload belongs to stage three. Optimizer computation remains on the CPU
          even when its state resides on NVMe.
        hold: 0.55
        visual_cues:
          - id: cpu
            phrase: "ZeRO-Offload moved optimizer state and optimizer work toward CPU memory."
            targets:
              - picture
          - id: nvme
            phrase: "ZeRO-Infinity extends the hierarchy to CPU and NVMe storage."
            targets:
              - picture
          - id: work
            phrase: "Optimizer computation remains on the CPU even when its state resides on NVMe."
            targets:
              - picture
      - say: Bytes divided by achieved bottleneck bandwidth gives a service-time lower bound. Independent work can
          ideally overlap that time, giving a lower bound equal to the larger duration. A consumer that
          requires the transfer first exposes the sum. Multiple transfers, shared links, setup and storage
          queues can make either schedule slower.
        hold: 0.55
        visual_cues:
          - id: dependency
            phrase: "A consumer that requires the transfer first exposes the sum."
            targets:
              - picture
      - say: Follow the NVMe path in this configuration. Verify local storage capacity, compatible I/O operators and
          host staging memory. To find a wait, look at pinned buffers, CPU optimizer time and storage queues.
          Compare tokens per second at the same effective batch and sequence lengths.
        hold: 0.55
        visual_cues:
