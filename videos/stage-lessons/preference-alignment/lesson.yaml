            color: cyan
            linger: 0.45
      - say: Margins below five are pushed upward; overshoots are pushed downward. Squared loss penalizes distance
          from the target without clipping the actual margin or guaranteeing stable neural-network updates.
          The inspected trainer’s IPO score averages completion tokens, so its normalization must also match
          the claimed margin.
