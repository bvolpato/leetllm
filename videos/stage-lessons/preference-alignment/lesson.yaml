            phrase: "Now put ninety-five percent on A"
            targets: [pair-probability, pair-loss]
  - id: update
    title: Push the pair in opposite directions
    visual: A two-logit policy takes repeated DPO gradient steps; each new margin recomputes the
      chosen-versus-rejected update and softmax distribution.
    beats:
      - say: The comparison gradient favors the chosen response and opposes the rejected response. This push and pull
          is weighted by how surprising the preference remains under the current policy. A logit is a score
          before softmax; softmax turns response scores into a distribution whose probabilities sum to one.
        hold: 0.55
        visual_cues:
          - id: update-b1-1
            phrase: probabilities sum to one
            targets:
              - policy-probabilities
            linger: 0.45
      - say: The two-response model starts at the reference, with equal logits. At zero margin, the DPO loss gradient
          is minus point two five for the chosen logit and plus point two five for the rejected. Gradient
          descent moves them in opposite directions and recalculates the margin after each step. As the chosen
          response pulls ahead, the next correction becomes smaller.
        hold: 0.55
        visual_cues:
          - id: update-b2-1
            phrase: opposite directions
            targets:
              - chosen-gradient
              - rejected-gradient
            linger: 0.45
          - id: update-b2-2
            phrase: recalculates the margin
            targets:
              - updated-margin
            linger: 0.45
      - say: Transformer parameters are shared across many responses, so a push on this pair can shift probabilities
          for other sequences too. Evaluate whole-model behavior after training.
        hold: 0.75
        visual_cues:
          - id: update-b3-1
            phrase: shift probabilities
            targets:
              - policy-probabilities
            linger: 0.45
