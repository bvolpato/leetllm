            targets: [length-rule]
      - say: >-
          We judge one pair on each of four hundred independent prompts, in blind order, with no ties. The
          candidate wins one hundred eighty-four. That's forty-six percent. The Wilson interval runs from about
          forty-one point two to fifty point nine percent. Now add forty-eight tokens of mean length growth.
