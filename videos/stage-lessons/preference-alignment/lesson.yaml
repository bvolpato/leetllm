          - id: sig-worked
            phrase: "halfway along the axis from zero to one"
            targets: [sig-plot]
          - id: sig-generation
            phrase: "only about three percent"
            targets: [sig-two-probs]
      - say: >-
          Try a larger margin with the same beta. Let the margin rise from one to five. The point still moves
          right, but near the top it barely climbs. The sigmoid squeezes every margin onto this zero-to-one
          scale. Now let's score what happened when the reviewer actually picked A.
        hold: 0.65
        visual_cues:
          - id: sig-grow
            phrase: "Let the margin rise from one to five"
            targets: [sig-plot]
  - id: loss
    title: What does one vote cost?
    visual: >-
      Hold the station vote fixed and send the probability assigned to that label into the negative log loss.
      Compare a confident miss with a confident match.
    beats:
      - say: >-
          Bring back the vote for route A. Suppose the policy still matches its reference. The comparison gives
          A an even chance. Take the negative natural log of one half and you get a loss of about point six nine
          three. That's the starting loss for this vote.
        hold: 0.6
        visual_cues:
          - id: loss-b1-1
            phrase: "negative natural log of one half"
            targets: [pair-loss]
      - say: >-
          Now give this route pair its worked margin of one. With beta one half, the model puts about sixty-two
          percent on the recorded choice. Follow A's probability into the loss. It drops to about point four
          seven four.
        hold: 0.65
        visual_cues:
          - id: loss-b2-1
            phrase: "give this route pair its worked margin of one"
            targets: [pair-probability]
      - say: >-
          Try two other predictions for that same vote. First, put only eight percent on A. A model that
          confident in B pays a large loss when the reviewer picks A. Now put ninety-five percent on A. The loss
          nearly disappears. So does most of the pull on the margin. The badly misranked pair gets the stronger
          correction.
        hold: 0.75
        visual_cues:
          - id: loss-wrong-order
            phrase: "put only eight percent on A"
            targets: [pair-probability]
          - id: loss-b3-1
            phrase: "pays a large loss"
            targets: [pair-loss]
