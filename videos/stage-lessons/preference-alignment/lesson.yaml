    title: A finite margin target changes the gradient direction
    visual: Plot DPO logistic and IPO squared losses on the same reference-relative-margin axis. Move the current
      margin across the explicit target while separately drawing the bounded forward KL of a complete
      two-response policy.
    beats:
      - say: Identity Preference Optimization uses the squared difference between its reference-relative margin and
          one divided by the quantity two times tau. Tau is positive. At tau point one, the target is five.
