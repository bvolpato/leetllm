  - id: beta-double-role
    title: Initial gradient scale differs from the ideal drift tradeoff
    visual: Draw a fixed preference-logit curve beside the policy optimum. Hold the true preference probability
      and reference fixed while beta changes the initial unscaled-margin derivative and the required ideal
      policy odds.
    beats:
      - say: For unscaled margin m, comparison logit z equals beta times m. The loss derivative with respect to z is
          sigmoid z minus one; with respect to m, multiply that quantity by beta. At zero margin the loss is
          natural log two, the logit derivative is minus one half, and the margin derivative is minus beta
          divided by two.
        hold: 0.7
        visual_cues:
          - id: beta-double-role-b0
            phrase: For unscaled margin m, comparison logit z equals beta times m.
            targets:
              - beta-double-role-construction
            color: cyan
            linger: 0.45
          - id: pa-beta-initial
            phrase: minus beta divided by two
            targets:
              - beta-double-role-construction
            color: yellow
            linger: 0.35
      - say: Both replies start equally likely. Watch what one vote does. With beta one half, the chosen logit's
          gradient is minus point two five. The rejected logit's gradient is plus point two five. Take one
          gradient step and the logits move apart. In a model with shared weights, the
          update also depends on how each weight affects the log probabilities of both replies.
        hold: 0.7
        visual_cues:
          - id: beta-double-role-b1
            phrase: Take one gradient step and the logits move apart
            targets:
              - beta-double-role-construction
            color: cyan
            linger: 0.45
      - say: For a complete two-answer population with uniform reference and true preference probability three
          quarters, the fitted comparison logit is natural log three. The ideal margin is natural log three
          divided by beta, and policy A probability is sigmoid of that margin. Beta point one, point five and
          one give about ninety-nine point nine nine eight, ninety and seventy-five percent.
        hold: 0.7
        visual_cues:
          - id: beta-double-role-b2
            phrase: For a complete two-answer population with uniform reference and true preference probability three
              quarters, the fitted comparison logit is natural log three.
            targets:
              - beta-double-role-construction
            color: cyan
            linger: 0.45
          - id: pa-beta-target
            phrase: Beta point one, point five and one give about ninety-nine point nine nine eight, ninety and
              seventy-five percent
            targets:
              - beta-double-role-construction
            color: yellow
            linger: 0.35
      - say: Larger beta gives a larger initial margin gradient while keeping this ideal fixed-reward policy closer to
          the reference. Actual drift also depends on learning rate, update count and saturation. No hard
          global KL constraint follows from the empirical pair loss. If loss remains near point six nine three
          after updates, first verify gradients and parameter changes, then inspect labels and coverage.
        hold: 0.7
        visual_cues:
          - id: beta-double-role-b3
            phrase: Larger beta gives a larger initial margin gradient while keeping this ideal fixed-reward policy closer
              to the reference.
            targets:
              - beta-double-role-construction
            color: cyan
            linger: 0.45
  - id: likelihood-displacement
    title: Follow the ticket as the margin changes
    visual: >-
      Place both P-7 replies on one reference-relative log scale. Move them left, measure the gap between them,
      then compare the ticket with its own frozen reference.
    beats:
      - say: >-
          Find the ticket and the grant on this ruler. Zero means the policy gives that exact reply the same
          probability as the frozen reference. Subtract the reference log score in each row. The ticket starts
          three tenths to the right of zero. The grant starts four tenths to its left. The distance between them
          is the margin.
        hold: 0.6
        visual_cues:
          - id: displace-start
            phrase: "Subtract the reference log score in each row"
            targets: [score-inputs]
      - say: >-
          Look at a second policy on this same request. Its ticket log score is lower by nine tenths. Its grant
          log score is lower by one point seven. Both marks slide left. The gap opens from point seven to one
          point five. With beta point one, the loss falls from about point six five nine to point six two one.
          Is this policy more or less likely to write the ticket than the reference?
        hold: 2
        visual_cues:
          - id: displace-inputs
            phrase: "Its ticket log score is lower by nine tenths. Its grant log score is lower by one point seven"
            targets: [score-inputs]
          - id: displace-move
            phrase: "Both marks slide left"
            targets: [score-ruler]
          - id: displace-gap
            phrase: "The gap opens from point seven to one point five"
            targets: [score-ruler]
      - say: >-
          Less likely. The ticket sits six tenths below its own reference. The gap grew because the grant fell
          farther. This is likelihood displacement. Some other replies gained probability, and we need to see
          them to know whether that's good news. Track both log scores, the margin and on-policy drift.
          DPO-Positive adds a penalty when the chosen reply falls below its reference.
        hold: 0.7
        visual_cues:
          - id: displace-answer
            phrase: "Less likely"
            targets: [score-ruler]
            caption_boundary: true
  - id: unseen-probability
    title: Where did the missing probability go?
    visual: >-
      Represent the whole response distribution with 100 equal tiles. Transfer columns containing four A tiles
      and one B tile to the unjudged C response while the stored A to B odds stay fixed.
    beats:
      - say: >-
          Suppose the assistant has just three possible replies. A opens the ticket. B grants access. C grants
          access and invents a policy exception to justify it. Each square is one percentage point of the chance
          of generating that reply. The reference gives each reply a third. The only vote in our file is A over
          B.
        hold: 0.55
        visual_cues:
          - id: mass-key
            phrase: "Each square is one percentage point"
            targets: [mass-grid]
      - say: >-
          Here A has forty squares and B has ten. Each of their columns holds four tickets for one grant. C has
          the other fifty squares. At beta point one, the loss on the stored vote is about point six two six.
          Keep the vote and the reference fixed.
        hold: 0.65
        visual_cues:
          - id: mass-odds
            phrase: "four tickets for one grant"
            targets: [pair-odds]
      - say: >-
          Give eight of those columns to the invented exception. Count what's left. Eight tickets, two grants
          and ninety exceptions. Would the loss on the stored vote rise, fall or stay the same?
        caption_starts: ["Eight tickets, two grants", "Would the loss on the stored vote"]
        hold: 2
        visual_cues:
          - id: mass-move
            phrase: "Give eight of those columns to the invented exception"
            targets: [mass-grid]
      - say: >-
          It stays the same. Eight divided by two is still four. The reference odds are still one to one, so the
          margin is still the natural log of four. Both policies pay the same loss, although the second would
          usually invent an exception. Sample replies from that policy. When you find C, ask a reviewer to
          compare the ticket with the invented exception. An online scorer also needs to recognize that
          difference.
        hold: 0.7
        visual_cues:
