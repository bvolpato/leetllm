version: 1
id: preference-alignment
title: Learning from Preferred Answers
source: training/rlhf-dpo-aligning-language-models/content.md
voice: en-US-AndrewNeural
rate: +0%
sources:
  - title: Rafailov et al. Direct Preference Optimization
    url: https://arxiv.org/abs/2305.18290
  - title: Ouyang et al. Training language models to follow instructions with human feedback
    url: https://arxiv.org/abs/2203.02155
  - title: PPO clipped surrogate
    url: https://arxiv.org/abs/1707.06347
  - title: Generalized Advantage Estimation
    url: https://arxiv.org/abs/1506.02438
  - title: IPO Equation17
    url: https://arxiv.org/abs/2310.12036
  - title: DeepSeekMath original GRPO
    url: https://arxiv.org/abs/2402.03300
  - title: TRL pinned1.17.1 DPO scoring/preparation
    url: https://github.com/huggingface/trl/blob/v1.17.1/trl/trainer/dpo_trainer.py
scenes:
  - id: intro
    title: Which directions would you keep?
    visual: >-
      Follow A around the café corner to the train. B starts at the same entrance and loops back. Keep both endpoints in view for the vote.
    beats:
      - say: >-
          Turn left at the entrance. At the café, turn right. Reply A gets you to the train.
        caption_starts: ["At the café", "Reply A gets you to the train"]
        hold: 0.6
        visual_cues:
          - id: start-walk
            phrase: "Turn left at the entrance"
            targets: [route-map, walk-a]
          - id: introduce-a
            phrase: "At the café"
            targets: [route-map, walk-a]
          - id: route-a
            phrase: "turn right"
            targets: [walk-a]
      - say: >-
          Follow B from the same entrance. Past the park, past the river, and back where you started.
          Which reply would you keep?
        caption_starts: ["Past the park", "Which reply would you keep"]
        hold: 2
        visual_cues:
          - id: route-b
            phrase: "Past the park, past the river, and back where you started"
            targets: [walk-b]
      - say: >-
          I'd keep A. It gets me to the station. My vote gives this pair a training label.
        hold: 0.7
        visual_cues:
          - id: route-vote
            phrase: "I'd keep A"
            targets: [walk-a]
            caption_boundary: true
  - id: pair
    title: What travels with the vote?
    visual: >-
      Exchange the complete replies on separate arcs. The vote travels with the same two turns while the prompt
      stays fixed.
    beats:
      - say: >-
          Save the question and both complete replies. One label records what this traveler preferred for this
          trip.
        hold: 0.55
        visual_cues:
          - id: pair-prompt
            phrase: "the question and both complete replies"
            targets: [fixed-prompt]
      - say: >-
          Now swap their positions. Watch the vote travel with the two turns. If we saved the winning
          column, the label would now point to the walk that goes in a circle.
        hold: 0.65
        visual_cues:
          - id: pair-swap
            phrase: "Now swap their positions"
            targets: [chosen-answer, rejected-answer]
      - say: >-
          The record still says A over B for the station request. That same distinction between an answer and
          its position matters when you blind a reviewer to which model wrote it.
        hold: 0.6
  - id: policy-contract
    title: What should the access assistant do?
    visual: >-
      Compare two actions under the same P-7 clause. Set aside a separate candidate's reward and human outcomes
      for the later release decision.
    beats:
      - say: >-
          A service account needs temporary admin access
          for tonight's migration. The policy says to cite P seven and send privileged changes to a reviewer. A
          offers to open the ticket. B tells the user to go ahead until tomorrow. Which reply follows the
          policy?
        hold: 1.65
        visual_cues:
          - id: read-policy
            phrase: "cite P seven and send privileged changes to a reviewer"
            targets: [policy-clause]
      - say: >-
          A follows the policy. A supervised example can teach the assistant to write that reply. A comparison
          gives it another piece of information. This reviewer preferred opening a ticket to giving the user
          permission.
        hold: 0.65
        visual_cues:
          - id: ticket-wins
            phrase: "A follows the policy"
            targets: [access-pair]
            caption_boundary: true
      - say: >-
          Now suppose a release candidate gains point three one on the reward model. In a separate blind
          comparison it wins only one hundred eighty-four times out of four hundred, and its replies average
          forty-eight extra tokens. We'll come back to whether you'd release it.
        hold: 0.7
        visual_cues:
          - id: candidate-reward
            phrase: "gains point three one on the reward model"
            targets: [candidate-record]
          - id: candidate-outcomes
            phrase: "wins only one hundred eighty-four times out of four hundred, and its replies average forty-eight extra tokens"
            targets: [candidate-record]
  - id: bt-judge
    title: What does the judge predict for the ticket?
    visual: >-
      Keep the observed vote on A, locate its reward gap on the sigmoid, and exchange the two reward scores to
      see what happens to the loss.
    beats:
      - say: >-
          The reviewer picked the ticket. Let's see how a learned judge scores that vote. It gives the ticket
          one point eight and the direct grant point seven. Subtract the grant's score from the ticket's. The
          gap is one point one. Which side of even odds should the ticket land on?
        hold: 1.8
        visual_cues:
          - id: judge-scores
            phrase: "the ticket one point eight and the direct grant point seven"
            targets: [judge-scores]
      - say: >-
          Above even. The judge gives the ticket about a seventy-five percent chance of winning. This curve is a
          sigmoid. It takes one divided by one plus the exponential of the negative gap. Using it for a reward
          difference gives the Bradley-Terry comparison model. The negative log of the probability it gave the
          observed vote is about point two eight seven.
        hold: 0.65
        visual_cues:
          - id: judge-prediction
            phrase: "about a seventy-five percent chance of winning"
            targets: [judge-plot]
            caption_boundary: true
          - id: judge-first-loss
            phrase: "about point two eight seven"
            targets: [judge-result]
      - say: >-
          Keep the reviewer's vote for the ticket and swap only the two reward scores. The point crosses the
          middle. The judge now puts roughly twenty-five percent on what the reviewer did. Its loss rises to
          about one point three eight seven. To find out whether its predicted chances match how often people
          agree, check fresh judgments.
        hold: 0.7
        visual_cues:
          - id: judge-flip
            phrase: "swap only the two reward scores"
            targets: [judge-scores, judge-plot]
          - id: judge-second-loss
            phrase: "about one point three eight seven"
            targets: [judge-result]
  - id: methods
    title: Where does the next training reply come from?
    visual: >-
      Keep the P-7 archive fixed through two DPO passes. Generate a new reply from the same request in the PPO
      lane and hand the completed text to the reward model.
    beats:
      - say: >-
          Suppose all you have today is a file of ticket-versus-grant comparisons. Direct preference
          optimization, or DPO, can use those exact words. Score both replies with the policy and the frozen
          reference, then update the policy to fit the vote. Run another pass. The policy has changed. The
          replies in the file still say exactly what they said before.
        hold: 0.6
        visual_cues:
          - id: methods-pair
            phrase: "both replies with the policy and the frozen reference"
            targets: [archive-lane]
          - id: methods-reuse
            phrase: "Run another pass"
            targets: [archive-lane]
      - say: >-
          Now give that same migration request to an actor and let it write a fresh reply. It offers to send
          tonight's change to a reviewer. Once the reply is complete, a learned reward model can score it. In
          reinforcement learning from human feedback, proximal policy optimization, or PPO, uses scored rollouts
          like this to update the actor, with a penalty for drift from the reference.
        hold: 0.7
        visual_cues:
          - id: methods-write
            phrase: "It offers to send tonight's change to a reviewer"
            targets: [rollout-lane]
          - id: methods-score
            phrase: "a learned reward model can score it"
            targets: [rollout-lane]
      - say: >-
          If good pairs are already on disk, DPO can train while generation is offline. If you need a score on
          a failure the current actor just produced, the online loop can see it, provided the judge recognizes
          it. You can also collect a fresh vote and add it to the file for the next DPO pass. Those choices
          can lead to different policies.
        hold: 0.65
        visual_cues:
          - id: methods-collect
            phrase: "collect a fresh vote and add it to the file"
            targets: [next-batch]
  - id: role-ownership
    title: The reference and rollout snapshot own different quantities
    visual: Preserve one generated token trajectory and its old-policy snapshot. Route completed-response score,
      frozen reference charge and trainable prefix values into the actor update while keeping all five
      identities visible.
    beats:
      - say: >-
          Start with a supervised model, fit a reward model from comparisons, then sample replies for PPO.
          Follow one reply through four jobs. The actor writes it, the frozen reward model scores it, the
          frozen reference supplies the baseline for drift, and the critic learns to predict the return.
          The actor and critic can share weights.
        hold: 0.7
        visual_cues:
          - id: role-ownership-b0
            phrase: Follow one reply through four jobs
            targets:
              - role-ownership-construction
            color: cyan
            linger: 0.45
      - say: The actor chooses each next token from its current prefix. The reward model scores the finished response.
          The reference provides baseline log probabilities for drift charges. The critic predicts future
          return from a prefix. Return is the reward collected from that decision onward; advantage measures
          outcome above that baseline.
        hold: 0.7
        visual_cues:
          - id: role-ownership-b1
            phrase: The actor chooses each next token from its current prefix.
            targets:
              - role-ownership-construction
            color: cyan
            linger: 0.45
      - say: Freeze a separate old-policy snapshot when collecting a rollout batch. Its stored token probabilities
          belong to the PPO update ratio. The longer-lived SFT reference belongs to the drift penalty. Reusing
          one batch keeps the old probabilities and detached advantage targets fixed even while actor
          parameters change.
        hold: 0.7
        visual_cues:
          - id: role-ownership-b2
            phrase: Freeze a separate old-policy snapshot when collecting a rollout batch.
            targets:
              - role-ownership-construction
            color: cyan
            linger: 0.45
          - id: pa-old-snapshot
            phrase: Freeze a separate old-policy snapshot
            targets:
              - role-ownership-construction
            color: yellow
            linger: 0.35
  - id: token-return
    title: A single terminal score reaches earlier decisions
    visual: Build a three-token trajectory, charge each sampled old/reference log ratio once, then sweep the GAE
      recurrence backward over retained residuals. Change lambda on the same trajectory and distinguish a
      terminal boundary from a truncated bootstrap.
    beats:
      - say: For the article’s sequence-score recipe, each generated token receives negative beta multiplied by the
          quantity old-policy log probability minus reference log probability. Add the reward model’s sequence
          score once, at the final token. Summing these token charges gives the complete response log-ratio
          charge; adding the sequence score at every token would count it repeatedly.
        hold: 0.7
        visual_cues:
          - id: token-return-b0
            phrase: For the article’s sequence-score recipe, each generated token receives negative beta multiplied by the
              quantity old-policy log probability minus reference log probability.
            targets:
              - token-return-construction
            color: cyan
            linger: 0.45
          - id: pa-terminal-once
            phrase: Add the reward model’s sequence score once, at the final token
            targets:
              - token-return-construction
            color: yellow
            linger: 0.35
      - say: An individual sampled log ratio can be negative. The policy-weighted expectation over the complete
          response distribution is forward KL and is nonnegative. With policy probabilities point eight and
          point two against a half-half reference, the two log ratios are about point four seven and minus
          point nine one six; expected KL is point one nine three.
        hold: 0.7
        visual_cues:
          - id: token-return-b1
            phrase: An individual sampled log ratio can be negative.
            targets:
              - token-return-construction
            color: cyan
            linger: 0.45
          - id: pa-kl-expectation
            phrase: expected KL is point one nine three
            targets:
              - token-return-construction
            color: yellow
            linger: 0.35
      - say: "Compute a temporal residual as immediate reward plus gamma times the next prefix value, minus the
          current prefix value. Work backward: advantage equals this residual plus gamma times lambda times
          the next advantage. A true terminal boundary uses zero next value. A deliberately truncated
          continuing episode needs an appropriate value bootstrap."
        hold: 0.7
        visual_cues:
          - id: token-return-b2
            phrase: Compute a temporal residual as immediate reward plus gamma times the next prefix value, minus the
              current prefix value.
            targets:
              - token-return-construction
            color: cyan
            linger: 0.45
          - id: pa-gae-backward
            phrase: "Work backward: advantage equals this residual plus gamma times lambda times the next advantage"
            targets:
              - token-return-construction
            color: yellow
            linger: 0.35
      - say: Use the supplied three immediate rewards zero, zero, one, with four zero values and gamma one. At lambda
          one, advantages are one, one, one. At lambda one half, they are one quarter, one half, one. The
          terminal score reaches early decisions without identifying which token caused it. Critic error and
          lambda affect that estimate.
        hold: 0.7
        visual_cues:
          - id: token-return-b3
            phrase: Use the supplied three immediate rewards zero, zero, one, with four zero values and gamma one.
            targets:
              - token-return-construction
            color: cyan
            linger: 0.45
          - id: pa-gae-full
            phrase: At lambda one, advantages are one, one, one
            targets:
              - token-return-construction
            color: yellow
            linger: 0.35
          - id: pa-gae-half
            phrase: At lambda one half, they are one quarter, one half, one
            targets:
              - token-return-construction
            color: yellow
            linger: 0.35
  - id: ppo-clipping
    title: What does PPO pay for this token?
    visual: >-
      Use one old token probability and one moving current probability. Read the raw and clipped offers for
      opposite advantages at the same ratio, then keep the smaller value in each row.
    beats:
      - say: >-
          Suppose the policy that wrote a batch gave one sampled token a twenty percent chance. The actor has
          changed since then. Divide its current probability by the saved twenty percent. At the starting point
          the ratio is one. The frozen reference has a different job. It measures drift over the run.
        hold: 0.65
        visual_cues:
          - id: clip-old
            phrase: "saved twenty percent"
            targets: [clip-inputs]
      - say: >-
          Raise the current probability to thirty percent. The token is one and a half times as likely. PPO
          makes two calculations. Use the actual ratio, or clip it to the range from point eight to one point
          two. Multiply each by the same advantage, then keep the smaller product. If the advantage is plus one,
          which product counts?
        hold: 1.8
        visual_cues:
          - id: clip-up
            phrase: "Raise the current probability to thirty percent"
            targets: [clip-inputs]
          - id: clip-offers
            phrase: "Multiply each by the same advantage"
            targets: [clip-products]
      - say: >-
          One point two. Increasing the probability helped a good token, and the extra increase earns nothing.
          Now read the row for an advantage of minus one. Increasing the probability hurt. Minus one point five
          is smaller, so the entire cost counts.
        hold: 0.7
        visual_cues:
          - id: clip-good
            phrase: "One point two"
            targets: [clip-products]
            caption_boundary: true
          - id: clip-bad
            phrase: "Minus one point five is smaller"
            targets: [clip-products]
            caption_boundary: true
      - say: >-
          Take the current probability down to ten percent. Now the ratio is one half. For a positive advantage,
          that harmful decrease counts in full. For a negative advantage, the favorable decrease stops earning
          credit at point eight, so its surrogate is minus point eight. The actual probability went all the way
          to ten percent. Clipping changes the incentive on this sample. Check the actor's ratios, critic error,
          reference drift and fresh replies after an update.
        hold: 0.7
        visual_cues:
          - id: clip-down
            phrase: "Take the current probability down to ten percent"
            targets: [clip-inputs]
          - id: clip-low
            phrase: "its surrogate is minus point eight"
            targets: [clip-products]
  - id: state-budget
    title: Four logical roles have a stated aggregate state cost
    visual: Construct per-parameter dtype segments, replicate them by supplied role size and compare four-role and
      critic-free inventories on a common byte scale. Separate rollout time and placement from the retained
      byte total.
    beats:
      - say: >-
          Count the bytes for one trainable parameter. In this setup it has two bytes of weights, two of
          gradients, two four-byte moments and a four-byte master copy. That adds up to sixteen bytes. Each
          frozen parameter has two weight bytes.
        hold: 0.7
        visual_cues:
          - id: state-budget-b0
            phrase: Count the bytes for one trainable parameter
            targets:
              - state-budget-construction
            color: cyan
            linger: 0.45
          - id: pa-state-bytes
            phrase: sixteen bytes
            targets:
              - state-budget-construction
            color: yellow
            linger: 0.35
          - id: pa-state-weight
            phrase: two bytes of weights
            targets:
              - state-budget-construction
            color: yellow
            linger: 0.35
          - id: pa-state-gradient
            phrase: two of gradients
            targets:
              - state-budget-construction
            color: yellow
            linger: 0.35
          - id: pa-state-moments
            phrase: two four-byte moments
            targets:
              - state-budget-construction
            color: yellow
            linger: 0.35
          - id: pa-state-master
            phrase: a four-byte master copy
            targets:
              - state-budget-construction
            color: yellow
            linger: 0.35
          - id: pa-state-frozen
            phrase: Each frozen parameter has two weight bytes
            targets:
              - state-budget-construction
            color: yellow
            linger: 0.35
      - say: For four separate seventy-billion-parameter backbones, actor and critic each use one thousand one hundred
          twenty decimal gigabytes. Reference and reward each use one hundred forty. The aggregate is two
          thousand five hundred twenty gigabytes before activations, generation caches, temporary storage,
          replication and communication.
        hold: 0.7
        visual_cues:
          - id: state-budget-b1
            phrase: For four separate seventy-billion-parameter backbones, actor and critic each use one thousand one
              hundred twenty decimal gigabytes.
            targets:
              - state-budget-construction
            color: cyan
            linger: 0.45
          - id: pa-state-total
            phrase: The aggregate is two thousand five hundred twenty gigabytes
            targets:
              - state-budget-construction
            color: yellow
            linger: 0.35
      - say: Removing this critic leaves one thousand four hundred gigabytes, saving forty-four point four percent of
          this assumed state budget. Smaller or shared critics, adapters, sharding and offload change
          placement or quantities. InstructGPT used a six-billion reward and value model even with its
          one-hundred-seventy-five-billion policy.
        hold: 0.7
        visual_cues:
          - id: state-budget-b2
            phrase: Removing this critic leaves one thousand four hundred gigabytes, saving forty-four point four percent
              of this assumed state budget.
            targets:
              - state-budget-construction
            color: cyan
            linger: 0.45
          - id: pa-state-remove
            phrase: Removing this critic leaves one thousand four hundred gigabytes
            targets:
              - state-budget-construction
            color: yellow
            linger: 0.35
      - say: Online rollouts add prompt prefill, decoding and scoring work. Colocated engines can alternate generation
          and training. Asynchronous engines can overlap them, but must synchronize weights. OpenRLHF
          supports both layouts. Measure GPU utilization and how far the rollout policy lags behind the actor.
        hold: 0.7
        visual_cues:
          - id: state-budget-b3
            phrase: Online rollouts add prompt prefill, decoding and scoring work.
            targets:
              - state-budget-construction
            color: cyan
            linger: 0.45
          - id: pa-state-overlap
            phrase: asynchronous engines can overlap them
            targets:
              - state-budget-construction
            color: yellow
            linger: 0.35
  - id: optimal-policy
    title: The reference distribution is tilted and renormalized
    visual: Start with an equal two-response reference, multiply each mass by its reward exponential and visibly
      renormalize. Re-express the objective as a negative KL plus a prompt constant, preserving its support
      assumptions.
    beats:
      - say: For a fixed prompt and reward, the ideal reward-minus-KL objective has a closed-form optimal
          distribution. Multiply each reference probability by the exponential of the quantity reward divided
          by beta, then divide by their sum Z. Assume positive beta, finite Z and policies supported by the
          reference.
        hold: 0.7
        visual_cues:
          - id: optimal-policy-b0
            phrase: For a fixed prompt and reward, the ideal reward-minus-KL objective has a closed-form optimal
              distribution.
            targets:
              - optimal-policy-construction
            color: cyan
            linger: 0.45
      - say: In a supplied two-answer example, the reference is half-half, beta is one, and rewards are natural log
          three and zero. Unnormalized masses become one point five and point five. Z is two, so the optimal
          probabilities are three quarters and one quarter.
        hold: 0.7
        visual_cues:
          - id: optimal-policy-b1
            phrase: In a supplied two-answer example, the reference is half-half, beta is one, and rewards are natural log
              three and zero.
            targets:
              - optimal-policy-construction
            color: cyan
            linger: 0.45
          - id: pa-tilt-masses
            phrase: Unnormalized masses become one point five and point five
            targets:
              - optimal-policy-construction
            color: yellow
            linger: 0.35
          - id: pa-tilt-normalize
            phrase: the optimal probabilities are three quarters and one quarter
            targets:
              - optimal-policy-construction
            color: yellow
            linger: 0.35
      - say: The objective can be written as negative beta times KL from the candidate to that optimal distribution,
          plus beta times log Z. The constant does not depend on the candidate distribution. Nonnegative KL
          makes that distribution optimal; a finite neural network and optimizer may neither represent nor
          reach it.
        hold: 0.7
        visual_cues:
          - id: optimal-policy-b2
            phrase: The objective can be written as negative beta times KL from the candidate to that optimal
              distribution, plus beta times log Z.
            targets:
              - optimal-policy-construction
            color: cyan
            linger: 0.45
  - id: reward-cancellation
    title: The same prompt constant cancels inside a pair
    visual: Reverse the optimal-policy equation to expose a reference-relative log ratio and identical prompt
      constant in both answer rewards. Subtract the rewards, cancel the two identical constants and build the
      parameterized pair loss.
    beats:
      - say: Take natural logs of the optimal-policy equation and solve for reward. Reward equals beta times the log
          of optimal probability divided by reference probability, plus beta times log Z. The partition
          function depends on the prompt, not on which completion is selected.
        hold: 0.7
        visual_cues:
          - id: reward-cancellation-b0
            phrase: Take natural logs of the optimal-policy equation and solve for reward.
            targets:
              - reward-cancellation-construction
            color: cyan
            linger: 0.45
      - say: Bradley-Terry needs a reward difference for two answers to that same prompt. Their identical beta log Z
          terms cancel. Replace the optimal policy with the trainable policy. Its implicit reward is beta
          times the policy-to-reference log probability ratio, and its comparison logit is the chosen implicit
          reward minus the rejected one.
        hold: 0.7
        visual_cues:
          - id: reward-cancellation-b1
            phrase: Bradley-Terry needs a reward difference for two answers to that same prompt.
            targets:
              - reward-cancellation-construction
            color: cyan
            linger: 0.45
          - id: pa-reward-cancel
            phrase: Their identical beta log Z terms cancel
            targets:
              - reward-cancellation-construction
            color: yellow
            linger: 0.35
      - say: DPO minimizes negative log sigmoid of that comparison logit on stored labels. It needs no standalone
          reward model, critic or fresh rollout during this optimization stage. Sharing an ideal optimum with
          reward fitting requires the preference-model assumptions, sufficient comparison coverage, suitable
          capacity and successful optimization. Finite DPO and clipped PPO need not produce the same
          checkpoint.
        hold: 0.7
        visual_cues:
          - id: reward-cancellation-b2
            phrase: DPO minimizes negative log sigmoid of that comparison logit on stored labels.
            targets:
              - reward-cancellation-construction
            color: cyan
            linger: 0.45
  - id: reference
    title: The two replies have the same policy score
    visual: >-
      Read two whole-response log probabilities on the same ruler, then measure each from the score its own
      reference assigned. Combine the signed changes into the DPO margin.
    beats:
      - say: >-
          Come back to the station. Under our current policy, both exact replies have the same log probability,
          minus three point four. We get each score by adding the log probabilities of its response tokens. If
          you saw only those two current scores, you'd call it a tie. What happens when we compare each reply to
          its own starting point?
        hold: 1.65
        visual_cues:
          - id: ref-tie
            phrase: "both exact replies have the same log probability"
            targets: [ref-ruler]
      - say: >-
          The frozen reference gave A minus four. A moved up six tenths. The reference gave B minus three. B
          moved down four tenths. The endpoints match, but look where each arrow starts.
        hold: 0.6
        visual_cues:
          - id: ref-ticket
            phrase: "A moved up six tenths"
            targets: [ref-ruler]
          - id: ref-detour
            phrase: "B moved down four tenths"
            targets: [ref-ruler]
      - say: >-
          Subtract B's change from A's. Six tenths minus negative four tenths gives a margin of one. The vote
          tells us which direction we wanted that gap to move.
        hold: 0.65
        visual_cues:
          - id: ref-margin
            phrase: "gives a margin of one"
            targets: [ref-margin]
            caption_boundary: true
  - id: probability
    title: What chance does the model give the vote?
    visual: >-
      Keep the route margin and beta beside a sigmoid. Move from the reference to the worked comparison, then
      try a larger margin on the same axes.
    beats:
      - say: >-
          Put a point at zero on the horizontal axis. Here the policy matches the reference, so neither reply
          has gained ground. The curve gives an even chance to the reviewer picking A. The height is a
          prediction about a vote between these two replies.
        hold: 0.55
        visual_cues:
          - id: sig-even
            phrase: "an even chance"
            targets: [sig-plot]
      - say: >-
          Now use the route margin of one. Multiply by beta, one half, to get halfway along the axis from zero
          to one. Follow the curve up. It puts about sixty-two percent on A winning the comparison. The model's
          chance of writing that exact route is a different number. Its log probability was minus three point
          four, so that chance is only about three percent.
