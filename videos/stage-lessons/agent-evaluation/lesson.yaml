scenes:
  - id: subject-intro
    title: Did Lena get her reservation?
    visual: A reservation confirmation slides into Lena’s chat beside her library card. Open her account and
      compare the promise on the phone with the holds on record.
    beats:
      - say: '“Your book is reserved.” Where would you look to see if Lena has a hold on River Stories?'
        hold: 2.4
        caption_starts: [Where would you look]
        visual_cues:
          - id: completion-claim
            phrase: Your book is reserved
            targets:
              - message
            color: blue
            linger: 0.4
          - id: choose-record
            phrase: Where would you look
            targets:
              - message
              - account
            linger: 0.4
      - say: Open Lena’s account. Look for book B7, the catalog number on the cover. How many matching holds do you
          see?
        hold: 2.1
        visual_cues:
          - id: inspect-account
            phrase: Open Lena’s account
            targets:
              - account
            linger: 0.4
          - id: empty-account
            phrase: How many matching holds
            targets:
              - account
            linger: 0.4
      - say: Zero. Fail this run. Lena asked for one hold on B7. Her account is empty.
        hold: 0.8
        visual_cues:
          - id: opening-verdict
            phrase: Zero. Fail this run
            targets:
              - account
              - decision
            color: pink
            caption_boundary: true
            linger: 0.4
  - id: episode-contract
    title: Set the starting account
    visual: The frozen task stays beside the register. Restoring the backend removes a leftover B8 hold.
      Resetting the agent separately clears its lookup and approval.
    beats:
      - say: For this test episode, Lena wants one hold on book B7. Here’s the account we inherited from a previous
          run. There’s a hold on B8, and the assistant remembers that old lookup and its approval. Restarting
          the assistant would leave the library row in place.
        hold: 0.6
        visual_cues:
          - id: identify-resource
            phrase: one hold on book B7
            targets:
              - request
            linger: 0.4
          - id: inherited-hold
            phrase: There’s a hold on B8
            targets:
              - account
            color: yellow
            linger: 0.4
      - say: Restore the library snapshot. Clear the assistant’s memory and invalidate the old approval. Now we
          start at version two, with an empty account. Freeze the request, permitted tools, budget and checks
          so that each repetition starts with the same task.
        hold: 0.9
        visual_cues:
          - id: reset-account
            phrase: Restore the library snapshot
            targets:
              - account
            linger: 0.4
          - id: memory-reset
            phrase: Clear the assistant’s memory and invalidate the old approval
            targets:
              - agent-memory
            linger: 0.4
          - id: clean-snapshot
            phrase: version two, with an empty account
            targets:
              - account
            linger: 0.4
  - id: action-trace
    title: Follow the reservation
    visual: The catalog identifies the book, a permitted request waits beside the empty account, and dispatch
      creates a named hold and receipt.
    beats:
      - say: The assistant looks up River Stories. The catalog returns B7. That number identifies the book even if
          another title looks similar.
        hold: 0.55
        visual_cues:
          - id: catalog-resource
            phrase: catalog returns B7
            targets:
              - request
            linger: 0.4
      - say: Here is operation seventeen. It asks the library to place a hold for Lena on B7. The host checks the
          authenticated reader and permits this call. Look across at the account. How many holds has that
          permission created?
        hold: 2
        visual_cues:
          - id: permit-action
            phrase: permits this call
            targets:
              - dispatch
            linger: 0.4
          - id: not-executed
            phrase: How many holds has that permission created
            targets:
              - account
            linger: 0.4
      - say: None yet. Now dispatch the request. The library adds hold seventeen and commits version three. Its
          receipt ties the operation to that record. We still need to check what a separate reader can find.
        hold: 0.85
        visual_cues:
          - id: dispatch-request
            phrase: Now dispatch the request
            targets:
              - dispatch
            linger: 0.4
          - id: commit-hold
            phrase: adds hold seventeen and commits version three
            targets:
              - account
            color: cyan
            caption_boundary: true
            linger: 0.4
  - id: hard-gates
    title: Does the read verify the write?
    visual: Align the receipt and the later account read field by field. Substitute a wrong book, then a stale
      version. Replay the valid read with one denied action added to the trace.
    beats:
      - say: Ask a separate reader for Lena’s holds on B7. The library returns a snapshot. Compare it to the
          permitted operation on the left. Both records come from the test environment.
        hold: 0.6
        visual_cues:
          - id: fresh-read
            phrase: library returns a snapshot
            targets:
              - read
              - comparison
            linger: 0.4
      - say: Lena, B7, one hold. The read took place after the write and reached the committed version. This run
          passes. Try changing just the book to B8. Now put B7 back and change just the read version to two.
          One read belongs to the wrong book. The other is too old. Both fail verification.
        hold: 0.9
        visual_cues:
          - id: returned-fields
            phrase: Lena, B7, one hold
            targets:
              - comparison
            linger: 0.4
          - id: checked-verdict
            phrase: This run passes
            targets:
              - verdict
            color: green
            caption_boundary: true
            linger: 0.4
          - id: wrong-book-probe
            phrase: changing just the book to B8
            targets:
              - comparison
            linger: 0.4
          - id: stale-version-probe
            phrase: change just the read version to two
            targets:
              - comparison
            linger: 0.4
          - id: counterfactual-verdict
            phrase: Both fail verification
            targets:
              - verdict
            color: pink
            caption_boundary: true
            linger: 0.4
      - say: Restore the matching read. Keep the same hold and add one forbidden attempt to the trace. The host
          denies the private-account read and returns no private data. Our policy fails a run for making the
          attempt. That tells us something different from finding an unauthorized effect.
        hold: 0.85
        visual_cues:
          - id: forbidden-attempt
            phrase: add one forbidden attempt
            targets:
              - policy
            color: yellow
            linger: 0.4
          - id: effect-versus-attempt
            phrase: returns no private data
            targets:
              - policy
            linger: 0.4
          - id: forbidden-override
            phrase: Our policy fails a run for making the attempt
            targets:
              - verdict
            color: pink
            caption_boundary: true
            linger: 0.4
  - id: recovery
    title: The reply goes missing
    visual: A bounded read retry returns B7. Two identical post-commit accounts then receive retries. Reusing
      the operation key replays a receipt. A new key adds a row.
    beats:
      - say: A catalog read times out. Our policy allows one more read, so charge a second dispatch. This time B7
          comes back. Now lose the reply to a write. What does the assistant know? The library might already
          have committed the hold.
        hold: 1.1
        caption_starts: [Now lose the reply, The library might already]
        visual_cues:
          - id: retry-read
            phrase: allows one more read
            targets:
              - read-path
            linger: 0.4
          - id: read-observation
            phrase: This time B7 comes back
            targets:
              - read-path
            linger: 0.4
          - id: lost-reply
            phrase: lose the reply to a write
            targets:
              - write-path
            linger: 0.4
          - id: uncertain-write
            phrase: might already have committed
            targets:
              - write-path
            linger: 0.4
      - say: From the evaluator’s side we can see what happened. Operation seventeen reached the library once. Both
          copies of Lena’s account start here. This library saves a receipt under each operation key. On the
          left, reuse seventeen. On the right, choose eighteen. Which retry will leave exactly one B7 hold?
        hold: 2.6
        visual_cues:
          - id: offer-new-key
            phrase: On the right, choose eighteen
            targets:
              - new-key
            color: yellow
            linger: 0.4
          - id: choose-keys
            phrase: Which retry will leave exactly one B7 hold
            targets:
              - decision
            linger: 0.4
      - say: Send seventeen again. The library returns its saved receipt. Watch the version and the row on the left.
          Both stay put. Now send eighteen on the right. The library treats it as a new request and creates a
          second hold. Read both accounts independently.
        hold: 0.85
        visual_cues:
          - id: send-same
            phrase: Send seventeen again
            targets: [same-key]
          - id: reconcile-id
            phrase: returns its saved receipt
            targets:
              - same-key
            color: cyan
            caption_boundary: true
            linger: 0.4
          - id: send-new
            phrase: Now send eighteen on the right
            targets: [new-key]
          - id: new-key-risk
            phrase: creates a second hold
            targets:
              - new-key
            color: cyan
            caption_boundary: true
            linger: 0.4
          - id: inspect-retries
            phrase: Read both accounts independently
            targets:
              - same-key
              - new-key
            linger: 0.4
      - say: Both runs made two write attempts. Only the left run passes the exactly-one check. After a
          timeout, check the account and the original operation’s status. If the hold is confirmed, stop.
          If the outcome stays unknown, a retry needs the service’s guarantee that the same key and payload
          will replay the result. For the next test, let permission expire before the retry. Also
          exercise stale reads, malformed calls and loops that use up the budget.
        hold: 1
        visual_cues:
          - id: recovery-contract
            phrase: Only the left run passes the exactly-one check
            targets:
              - same-key
              - new-key
            color: green
            caption_boundary: true
            linger: 0.4
          - id: recovery-probes
            phrase: let permission expire before the retry
            targets:
              - decision
            color: yellow
            linger: 0.4
  - id: repeatability
    title: Which task passes every time?
    visual: Nine retained run outcomes become three task-level marks. The evidence stays visible while the
      viewer selects the row that passed all three times.
    beats:
      - say: These are invented results for three tasks. Run each task three times from a clean start. The catalog
          search passes every time. The hold task and the private-account task each fail once. Seven of the
          nine runs pass. Now read across the rows. Which task could give us three successes in three tries
          here?
        hold: 2.35
        visual_cues:
          - id: repeated-runs
            phrase: Run each task three times
            targets:
              - trial-results
            linger: 0.4
          - id: catalog-trials
            phrase: catalog search passes every time
            targets:
              - trial-results
            linger: 0.4
          - id: other-trials
            phrase: hold task and the private-account task each fail once
            targets:
              - trial-results
            linger: 0.4
          - id: run-rate
            phrase: Seven of the nine runs pass
            targets:
              - trial-results
            color: green
            caption_boundary: true
            linger: 0.4
          - id: all-repetitions
            phrase: Which task could give us three successes
            targets:
              - trial-results
            linger: 0.4
      - say: Only the catalog search. Give each task one mark and check whether all three runs in its row passed.
          One task out of three earns the mark. The seven passing runs answered a different question. They
          counted individual successes, including two on each task that also failed.
        hold: 1
        visual_cues:
          - id: group-checks
            phrase: Give each task one mark
            targets:
              - trial-results
            linger: 0.4
          - id: group-fraction
            phrase: One task out of three earns the mark
            targets:
              - trial-results
            color: green
            caption_boundary: true
            linger: 0.4
      - say: Keep the model, tools, environment and sampling settings fixed across repeats. Average the result by
          task. If you ran the hard task extra times, it still gets one vote in this equal-weight comparison.
        hold: 0.75
        visual_cues:
          - id: task-grouping
            phrase: Average the result by task
            targets:
              - trial-results
            linger: 0.4
  - id: economics
    title: What did each success cost?
    visual: Each run retains its cost and outcome. Include the two failed bars in spend, divide by seven
      successes, then sort the same nine run IDs by elapsed time for nearest-rank p95.
    beats:
      - say: Keep those nine runs. Add every charge, including the tall pink bar for run five. That failed hold cost
          four cents. Run nine failed too. Both belong in the numerator. Now count the seven successful runs
          for the denominator. Twenty point three cents divided by seven gives two point nine cents per
          success. Longer prompts or more retries can raise spend even if the number of passing runs stays at
          seven.
        hold: 0.85
        visual_cues:
          - id: add-costs
            phrase: Add every charge, including the tall pink bar for run five
            targets:
              - cost-bars
              - incurred-spend
            linger: 0.4
          - id: failed-cost
            phrase: That failed hold cost four cents
            targets:
              - failed-cost
            linger: 0.4
          - id: successful-denominator
            phrase: count the seven successful runs
            targets:
              - run-outcomes
              - successful-runs
            linger: 0.4
          - id: cost-quotient
            phrase: gives two point nine cents per success
            targets:
              - cost-per-success
            color: green
            caption_boundary: true
            linger: 0.4
      - say: Use the same run IDs for latency. Put the nine durations in ascending order. For the nearest-rank
          ninety-fifth percentile, multiply nine by point nine five and round up. The ninth time is eight
          seconds. If your product promises a response within six seconds, a completed run that takes longer
          still misses its deadline.
        hold: 0.85
        visual_cues:
          - id: place-durations
            phrase: Put the nine durations in ascending order
            targets:
              - ordered-durations
              - duration-inputs
            linger: 0.4
          - id: sample-quantile
            phrase: The ninth time is eight seconds
            targets:
              - quantile-rank
            color: yellow
            caption_boundary: true
            linger: 0.4
      - say: For a product comparison, match the budgets and sample tasks from the workload. Keep the cost of
          crashes and exhausted attempts. Counting distinct task names would give us three in the denominator,
          although we delivered seven successful runs.
        hold: 0.8
        visual_cues:
          - id: incurred-accounting
            phrase: Keep the cost of crashes and exhausted attempts
            targets:
              - duration-inputs
            linger: 0.4
  - id: transfer
    title: What can this grader see?
    visual: A browser confirmation sits beside the database row for the same hold. Compare what each verifier
      can observe, then fetch the missing permission record.
    beats:
      - say: Suppose our grader can see only this web page. The text confirms that the website displayed a message.
          That might be exactly what a browser task asks for. WebArena, for example, has tasks scored from
          page state. What if our product promises a real reservation?
        hold: 1.2
        visual_cues:
          - id: episode-evidence
            phrase: only this web page
            targets:
              - page
            linger: 0.4
          - id: representative-tasks
            phrase: tasks scored from page state
            targets:
              - page
            linger: 0.4
      - say: Open the database. There’s Lena’s hold. Tau-Bench checks final database changes against a goal while an
          assistant deals with a simulated user and a policy. A final row can establish an outcome. Does
          either record show permission for this particular write?
        hold: 2.3
        visual_cues:
          - id: db-diff
            phrase: Open the database
            targets:
              - account
            linger: 0.4
          - id: scope-question
            phrase: Does either record show permission
            targets:
              - trace
            linger: 0.4
      - say: Fetch the host’s decision for operation seventeen. Match the reader, book and permitted action before
          dispatch. Keep this trace alongside the final read, repeated outcomes and incurred cost. Put the
          library’s own permission cases in its release suite, including cases the developers have never seen.
        hold: 0.85
        visual_cues:
          - id: retain-result
            phrase: Fetch the host’s decision for operation seventeen
            targets:
              - trace
            color: green
            linger: 0.4
  - id: trace-contract
    title: What goes in the trace?
    visual: Follow the library events into a trace. Keep the identifiers for the hold, drop the contact field
      and redact a private value before saving the record.
    beats:
      - say: Here’s what we need to record. The library implements the tools. A harness puts the account back at its
          starting state and enforces the budget. A scorer reads the evidence. Follow the lookup, the
          permission decision, the committed hold and the independent read. Together the actions and returned
          observations form a trajectory through the account’s states. A read or a denied write can leave the
          account unchanged. The harness can inspect records that the assistant never sees.
        hold: 0.8
        visual_cues:
          - id: trace-world
            phrase: The library implements the tools
            targets:
              - trace-contract-mechanism
            linger: 0.4
          - id: trace-observations
            phrase: Follow the lookup, the permission decision, the committed hold and the independent read
            targets:
              - trace-contract-mechanism
            linger: 0.4
          - id: trace-read
            phrase: A read or a denied write
            targets:
              - trace-contract-mechanism
            linger: 0.4
      - say: Which parts of this event help us verify the hold? The book and operation IDs link it to the library
          record. Check the required fields and scan the field names inside the tool arguments. Drop the email field.
          Now check the values. The observation contains a contact detail. Redact that detail before saving
          the trace. Use an allowlist for exported fields, apply the same redaction to final messages and set
          a retention limit. The run, event, time and permission decision let us trace who authorized the hold.
        hold: 0.9
        caption_starts:
          - The book and operation IDs
          - Now check the values
          - Redact that detail
          - Use an allowlist for exported fields
          - The run, event, time and permission decision
        visual_cues:
          - id: trace-keys
            phrase: scan the field names inside the tool arguments
            targets:
              - trace-contract-mechanism
            linger: 0.4
          - id: trace-leak
            phrase: Drop the email field
            targets:
              - trace-contract-mechanism
            linger: 0.4
          - id: trace-value
            phrase: Redact that detail
            targets:
              - trace-contract-mechanism
            linger: 0.4
          - id: trace-export
            phrase: Use an allowlist for exported fields
            targets:
              - trace-contract-mechanism
            linger: 0.4
  - id: process-contract
    title: What did the host permit?
    visual: Compare a strict sequence with a recovery sequence. Hold the dispatch fixed while testing the
      candidate, call identity and permit time independently. Add a second write after verification.
    beats:
      - say: Start with a straightforward case. The contract requires a lookup, a write and a verification, each
          exactly once and in that order. Reverse them and it fails. Repeat the lookup and it fails too. In a
          recovery test, a timeout followed by one successful lookup is allowed. That makes four dispatches,
          and all four count. Choose the sequence that describes this task before you score it.
        hold: 0.75
        visual_cues:
          - id: strict-once
            phrase: a lookup, a write and a verification
            targets:
              - process-contract-mechanism
            linger: 0.4
          - id: strict-reject
            phrase: Repeat the lookup
            targets:
              - process-contract-mechanism
            linger: 0.4
          - id: retry-contract
            phrase: a timeout followed by one successful lookup
            targets:
              - process-contract-mechanism
            linger: 0.4
      - say: Now look at a promotion request. The permit and the write must name the same call, operation, candidate
          and target. Change the candidate on the right. It’s the right tool, but the permit was for somebody
          else. Restore the candidate and change just the call ID. That also breaks the match. Restore the
          call, then move the permit to time thirteen. The write started at twelve. Permission came too late.
          These comparisons assume trusted runtime records. The host still has to authenticate the actor and
          check expiry and revocation.
        hold: 0.85
        visual_cues:
          - id: permit-bind
            phrase: same call, operation, candidate and target
            targets:
              - process-contract-mechanism
            linger: 0.4
          - id: permit-mutate
            phrase: Change the candidate on the right
            targets:
              - process-contract-mechanism
            linger: 0.4
          - id: permit-call
            phrase: change just the call ID
            targets:
              - process-contract-mechanism
            linger: 0.4
          - id: permit-late
            phrase: move the permit to time thirteen
            targets:
              - process-contract-mechanism
            linger: 0.4
      - say: Go back to the library trace. A write gets a successful read. Add a second write after that read. Which
          event checks the second write? Its own later, successful read is still missing. This process policy
          also flags more than two timeouts. A later read can still be wrong. Here’s one for the wrong book.
          Here’s the right book at an older version. Here’s a newer version with zero holds. Check the same
          resource, a comparable version at least as new as the commit, and the intended outcome.
        hold: 0.9
        caption_starts:
          - Which event checks the second write
          - Its own later
          - This process policy
          - Here’s one for the wrong book
        visual_cues:
          - id: write-again
            phrase: Add a second write after that read
            targets:
              - process-contract-mechanism
            linger: 0.4
          - id: missing-read
            phrase: Its own later, successful read is still missing
            targets: [process-contract-mechanism]
          - id: resource-bind
            phrase: one for the wrong book
            targets:
              - process-contract-mechanism
            linger: 0.4
          - id: version-bind
            phrase: right book at an older version
            targets:
              - process-contract-mechanism
            linger: 0.4
          - id: outcome-bind
            phrase: a newer version with zero holds
            targets:
              - process-contract-mechanism
            linger: 0.4
  - id: metric-estimators
    title: Which groups count?
    visual: Count groups of patches that contain a pass. For a reservation that must pass every rerun, shorten
      a probability strip at each step. Compare the per-task results before averaging.
    beats:
      - say: Each row here is a different task. Only the catalog row has three passes. To estimate the chance that
          every one of k reruns passes, count groups within a single row. The denominator counts all groups of
          k you can choose from n runs. The numerator counts groups you can make from the passes alone. If
          fewer than k passes exist, that row contributes zero. Average the three task contributions with
          equal weight. This calculation assumes independent reruns with the same conditions within each task.
        hold: 1
        visual_cues:
          - id: all-k-rule
            phrase: count groups within a single row
            targets:
              - metric-estimators-mechanism
            linger: 0.4
          - id: task-average
            phrase: Average the three task contributions
            targets:
              - metric-estimators-mechanism
            linger: 0.4
      - say: Change the job. Someone will inspect three candidate patches and wants at least one that works. In
          these five samples, patches two and five pass. Lay out all ten groups of three. Look for the group
          that misses both winners. One, three and four is the only miss. Nine groups out of ten contain a
          pass. That’s pass at three. In general, subtract the fraction of all-failure groups from one. A
          deployed selector still needs a way to recognize a good patch without the hidden tests. Retrying
          after feedback also changes the sampling protocol.
        hold: 1
        visual_cues:
          - id: patch-subsets
            phrase: Lay out all ten groups of three
            targets:
              - metric-estimators-mechanism
            linger: 0.4
          - id: missed-triple
            phrase: One, three and four is the only miss
            targets:
              - metric-estimators-mechanism
            color: pink
            caption_boundary: true
            linger: 0.4
          - id: patch-result
            phrase: Nine groups out of ten contain a pass
            targets:
              - metric-estimators-mechanism
            color: green
            caption_boundary: true
            linger: 0.4
          - id: hit-rule
            phrase: subtract the fraction of all-failure groups from one
            targets:
              - metric-estimators-mechanism
            linger: 0.4
      - say: Try the same reservation three times, each time from a clean account. Suppose the runs are independent.
          The first bar shows a seventy percent chance of success on one run. To pass twice, keep seven tenths
          of the first bar. That leaves forty-nine percent. What fraction passes all three?
        hold: 2.2
        caption_starts: [The first bar shows, To pass twice, That leaves forty-nine percent, What fraction passes all three]
        visual_cues:
          - id: first-pass
            phrase: The first bar shows a seventy percent chance
            targets: [metric-estimators-mechanism]
          - id: second-pass
            phrase: keep seven tenths of the first bar
            targets: [metric-estimators-mechanism]
      - say: Take seven tenths once more. The chance of three passes is point three four three. The rest of
          the bar is the chance of at least one failure, point six five seven. Each extra required success
          can shrink the all-pass group. In a patch search, each extra try can add a winning patch.
          Now give two tasks equal weight. One always passes and the other always fails. Half the tasks pass
          all three. Pool them first and
          cube the average, and you get one eighth. Pooling lost the identity of the task being repeated.
          Record the simulator and its randomness when a simulated user is part of the test.
        hold: 0.9
