    url: https://arxiv.org/abs/2107.03374
  - title: Berkeley RDI benchmark audit April2026
    url: https://rdi.berkeley.edu/blog/trustworthy-benchmarks-cont/
  - title: Terminal-Bench catalog
    url: https://www.tbench.ai/benchmarks
  - title: SWE-bench evaluation
    url: https://www.swebench.com/SWE-bench/guides/evaluation/
