  - id: uncertainty
    title: How much evidence clears the floor?
    visual: Grow a Wilson interval on a fixed ruler, compare two workload samples to a fixed 0.85 floor, then
      let the viewer apply the all-pass formula to 25 fresh cases.
    beats:
      - say: Suppose we sampled three independent cases from the workload we plan to serve. Two pass. To put an
          approximate ninety-five percent interval around the pass rate, use a Wilson score interval with z
          equal to one point nine six. Put two thirds in for p and three in for n. The center lands here. The
          radius sets the distance to either end. Extend that distance in both directions. Three observations
          leave a wide range.
        hold: 0.85
        visual_cues:
          - id: wilson-center
            phrase: The center lands here
            targets:
              - uncertainty-mechanism
            linger: 0.4
          - id: wilson-radius
            phrase: The radius sets the distance
            targets:
              - uncertainty-mechanism
            linger: 0.4
          - id: wilson-endpoints
            phrase: Extend that distance in both directions
            targets:
              - uncertainty-mechanism
            linger: 0.4
      - say: The yellow line is our predeclared floor. The lower endpoint has to reach it. The pilot interval runs
          from point two zero eight to point nine three nine. Now take a new sample of thirty cases.
          Twenty-seven pass. Their interval runs from point seven four four to point nine six five. The
          observed rate is ninety percent, but the lower endpoint falls short of the eighty-five percent
          floor.
        hold: 1
        visual_cues:
          - id: small-interval
            phrase: from point two zero eight to point nine three nine
            targets:
              - uncertainty-mechanism
            color: cyan
            caption_boundary: true
            linger: 0.4
          - id: large-case
            phrase: Twenty-seven pass
            targets:
              - uncertainty-mechanism
            linger: 0.4
          - id: large-interval
            phrase: from point seven four four to point nine six five
            targets:
              - uncertainty-mechanism
            color: cyan
            caption_boundary: true
            linger: 0.4
          - id: lower-gate
            phrase: the lower endpoint falls short of the eighty-five percent floor
            targets:
              - uncertainty-mechanism
            color: pink
            caption_boundary: true
            linger: 0.4
      - say: Try a fresh sample. All twenty-five cases pass. With all successes, the Wilson lower endpoint
          simplifies to n divided by n plus z squared. Put twenty-five in both places for n. Does the lower
          endpoint clear point eight five?
        hold: 2.6
        visual_cues:
          - id: all-pass-bound
            phrase: simplifies to n divided by n plus z squared
            targets:
              - uncertainty-mechanism
            linger: 0.4
          - id: bound-question
            phrase: Does the lower endpoint clear point eight five
            targets:
              - uncertainty-mechanism
            linger: 0.4
      - say: Yes. The lower endpoint is about point eight six seven. It clears the floor of point eight five.
        hold: 0.9
        visual_cues:
          - id: bound-result
            phrase: The lower endpoint is about point eight six seven
            targets:
              - uncertainty-mechanism
            color: green
            caption_boundary: true
            linger: 0.4
      - say: Check how the cases were chosen. These twelve runs repeat three tasks. Four repeats of the same task
          share features, so account for that grouping when estimating uncertainty. Hand-picked regressions
          answer a different question from a representative sample. Keep crashes and exhausted attempts in the
          denominator unless you set a separate infrastructure policy in advance. A forbidden action still
          fails its own gate.
        hold: 0.8
        visual_cues:
          - id: regression-groups
            phrase: repeat three tasks
            targets:
              - uncertainty-mechanism
            linger: 0.4
          - id: denominator
            phrase: Keep crashes and exhausted attempts
            targets:
              - uncertainty-mechanism
            linger: 0.4
          - id: hard-veto
            phrase: A forbidden action still fails its own gate
            targets:
              - uncertainty-mechanism
            linger: 0.4
  - id: judge-calibration
    title: Would the judge pick the same reply?
    visual: Show the same two reply identities in opposite slots. Remap pair 2’s second-slot wins, compare all
      four rows with human labels, then keep the communication result beside the policy evidence.
    beats:
      - say: Once we’ve checked permissions and state, we can ask how clearly the assistant replied. A human picked
          the clearer message in each of four pairs. Compare the judge’s first choices with those labels. They
          agree on three of four. Follow pair two. In the original order the judge picked B in the second
          slot. Swap the replies and it picks the second slot again. That slot now holds A. Compare identities
          down the table. Two of the four choices flip. Our example asks for ninety percent agreement and at
          most five percent flips. This judge misses both thresholds.
        hold: 0.95
        visual_cues:
          - id: human-labels
            phrase: A human picked the clearer message
            targets:
              - judge-calibration-mechanism
            linger: 0.4
          - id: forward-input
            phrase: Compare the judge’s first choices
            targets:
              - judge-calibration-mechanism
            linger: 0.4
          - id: forward-score
            phrase: They agree on three of four
            targets:
              - judge-calibration-mechanism
            color: green
            caption_boundary: true
            linger: 0.4
          - id: swap-remap
            phrase: Swap the replies
            targets:
              - judge-calibration-mechanism
            linger: 0.4
          - id: flip-score
            phrase: Two of the four choices flip
            targets:
              - judge-calibration-mechanism
            color: yellow
            caption_boundary: true
            linger: 0.4
          - id: judge-screen
            phrase: This judge misses both thresholds
            targets:
              - judge-calibration-mechanism
            color: yellow
            caption_boundary: true
            linger: 0.4
      - say: Keep the judge advisory. Four pairs leave a lot of uncertainty. A judge can consistently pick the wrong
          reply, or change its choice by chance. To test for a position preference, repeat both orders on a
          larger, independently labeled set. Look closely at sensitive cases. Even a beautifully worded answer
          leaves a forbidden attempt in the trace. Grade the wording separately unless the product explicitly
          requires particular wording.
        hold: 0.8
        visual_cues:
          - id: judge-advisory
            phrase: Keep the judge advisory
            targets:
              - judge-calibration-mechanism
            linger: 0.4
          - id: critical-override
            phrase: leaves a forbidden attempt in the trace
            targets:
              - judge-calibration-mechanism
            linger: 0.4
      - say: The assistant also wrote the text the judge reads. The Berkeley audit in April twenty twenty-six found
          that candidate text could influence evaluators in the versions of CAR-bench and WebArena it tested.
          Quote the message in a fixed field. Keep release tools out of the judge’s reach and send sensitive
          decisions to a person. Quotation marks identify the source. The grader still has to treat the
          contents as untrusted.
        hold: 0.85
        visual_cues:
          - id: judge-injection
            phrase: text could influence evaluators
            targets:
              - judge-calibration-mechanism
            linger: 0.4
          - id: judge-boundary
            phrase: Keep release tools out of the judge’s reach
            targets:
              - judge-calibration-mechanism
            linger: 0.4
  - id: benchmark-surfaces
    title: Choose a verifier for the job
    visual: Match each named public environment to the observable its verifier uses. Keep a changed task set and
      resource limits attached to their version before comparing scores.
    beats:
      - say: Suppose the product changes a repository. SWE-bench runs repository tests and interprets the results
          for the patch. For a browser product, WebArena has checks on answers, URLs and page state. Some
          answer checks use a model judge. For a desktop action, OSWorld can inspect a file, a setting or
          application data. Its original main suite uses Ubuntu. The library needs its own permission tests in
          each of these settings.
        hold: 0.8
        visual_cues:
          - id: bench-swe
            phrase: SWE-bench runs repository tests
            targets:
              - benchmark-surfaces-mechanism
            linger: 0.4
          - id: bench-web
            phrase: WebArena has checks
            targets:
              - benchmark-surfaces-mechanism
            linger: 0.4
          - id: bench-os
            phrase: OSWorld can inspect a file
            targets:
              - benchmark-surfaces-mechanism
            linger: 0.4
      - say: GAIA compares a normalized answer with a reference, including numbers, strings or ordered lists.
          Terminal-Bench uses task-specific verifiers and resource limits for terminal work. Tau-Bench
          compares the final database changes with a goal in a simulated user interaction. Imagine the
          database looks right, but the agent skipped required user confirmation. That final-state reward can
          miss the omission. AgentBench spans several interactive environments. Pick the verifier that can
          actually see the failure your users care about.
        hold: 0.8
        visual_cues:
          - id: bench-gaia
            phrase: GAIA compares
            targets:
              - benchmark-surfaces-mechanism
            linger: 0.4
          - id: bench-terminal
            phrase: Terminal-Bench uses
            targets:
              - benchmark-surfaces-mechanism
            linger: 0.4
          - id: bench-tau
            phrase: Tau-Bench compares
            targets:
              - benchmark-surfaces-mechanism
            linger: 0.4
          - id: confirmation-gap
            phrase: skipped required user confirmation
            targets:
              - benchmark-surfaces-mechanism
            linger: 0.4
      - say: Save the configuration with the score. That includes the task split, image, harness, scorer, model,
          permissions and budget. Save the prompt, tools, action loop and stopping rule around the model too.
          Those make up its scaffold. Log the trial count, simulator settings and date. Hold these fixed to
          compare models, or identify what changed if you compare whole systems. In the article’s October
          twenty twenty-six snapshot, the Terminal-Bench catalog listed version four. If you have results for
          two point one, rerun with the new tasks, verifier and limits before comparing. OSWorld-Verified is
          also a distinct suite.
        hold: 0.8
        visual_cues:
          - id: pin-config
            phrase: Save the configuration with the score
            targets:
              - benchmark-surfaces-mechanism
            linger: 0.4
          - id: version-four
            phrase: catalog listed version four
            targets:
              - benchmark-surfaces-mechanism
            linger: 0.4
          - id: rerun-version
            phrase: rerun with the new tasks, verifier and limits
            targets:
              - benchmark-surfaces-mechanism
            linger: 0.4
  - id: harness-integrity
    title: Where does the next run start?
    visual: Restore the remote hold and the agent cache separately. Place gold and verification dependencies
      across the trusted boundary, then check what a path-only test establishes.
    beats:
      - say: Here the next candidate gets a fresh container. Lena’s old hold is still on the library server. Restore
          the remote database and files too. Clear remembered messages, cached lookups and approvals tied to
          earlier calls. The harness loads the frozen task, starts a disposable environment, limits each run
          from the outside, collects independent evidence, scores it and tears it down. A lightweight virtual
          machine such as Firecracker, or a userspace application kernel such as gVisor, supplies only the
          isolation you actually configure.
        hold: 0.8
        visual_cues:
          - id: reset-remote
            phrase: Restore the remote database
            targets:
              - harness-integrity-mechanism
            linger: 0.4
          - id: reset-approval
            phrase: approvals tied to earlier calls
            targets:
              - harness-integrity-mechanism
            linger: 0.4
      - say: Now look at who can read or change the grader’s materials. Move reference answers beyond the
          candidate’s reach. Protect the verifier’s dependencies and its result collector too. In the
          configurations covered by the April Berkeley audit, exposure of answers affected WebArena and
          verifier integrity affected Terminal-Bench. Check the actual filesystem, network and tool
          permissions under the candidate’s identity.
        hold: 0.8
        visual_cues:
          - id: protect-gold
            phrase: Move reference answers beyond the candidate’s reach
            targets:
              - harness-integrity-mechanism
            linger: 0.4
          - id: protect-deps
            phrase: Protect the verifier’s dependencies
            targets:
              - harness-integrity-mechanism
            linger: 0.4
      - say: This small check compares paths. With the answer file inside the agent’s mount, it fails. With the file
          at the absolute harness path, it passes. The checker rejects parent traversal. It reads path
          components and leaves symbolic links unresolved. To check isolation, test which files the running
          candidate can actually open and which remote accounts it can reach.
        hold: 0.85
        visual_cues:
          - id: path-inside
            phrase: inside the agent’s mount
            targets:
              - harness-integrity-mechanism
            linger: 0.4
          - id: path-outside
            phrase: at the absolute harness path
            targets:
              - harness-integrity-mechanism
            linger: 0.4
          - id: symlink-limit
            phrase: leaves symbolic links unresolved
            targets:
              - harness-integrity-mechanism
            linger: 0.4
  - id: release-report
    title: Would you release this candidate?
    visual: Place the report’s evidence alongside four local thresholds. Compute CPST from three incurred
