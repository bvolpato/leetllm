  - id: pooling-failure
    title: "What survives mean pooling?"
    visual: "Average one coordinate of four projection slices. Then watch opposing heads cancel in a two-position model and compare both old outputs with the pooled output."
    beats:
      - say: "Take one coordinate from each of four key projection slices. Their values are one, three, three and five. Average the four and the new slice gets three. Do this coordinate by coordinate for the key weights, and separately for the value weights and compatible biases."
        hold: 0.7
        visual_cues:
          - id: samples
            phrase: "one, three, three and five"
            targets: [picture]
          - id: pool
            phrase: "the new slice gets three"
            targets: [picture]
      - say: "Will averaging the weights preserve what a head returns? Try two heads, two visible positions and a scalar query of one. Each head gives the value ten the higher score. The second head does it at the other position. Softmax puts about eighty-eight percent on ten in both heads, so each old output is about eight point eight."
        hold: 0.8
        visual_cues:
          - id: opposing
            phrase: "Try two heads"
            targets: [picture]
          - id: old
            phrase: "each old output is about eight point eight"
            targets: [picture]
      - say: "Average the two keys at each position. Plus one and minus one cancel to zero. Now average the values. Both become five. What can any mixture of those values return?"
        hold: 1.9
        visual_cues:
          - id: keys
            phrase: "cancel to zero"
            targets: [picture]
          - id: values
            phrase: "Both become five"
            targets: [picture]
      - say: "Five in both heads. That's a different output for the same input. Use the pooled slices as an initialization. Keep the original query and output weights to start, then continue training so the model can adapt. The GQA paper used the T5 setup, data and Adafactor recipe for five percent of its original steps."
        hold: 0.7
        visual_cues:
          - id: new
            phrase: "Five in both heads"
            targets: [picture]
            caption_boundary: true
          - id: init
            phrase: "Use the pooled slices as an initialization"
            targets: [picture]
          - id: recipe
            phrase: "five percent of its original steps"
            targets: [picture]
      - say: "On its T5 XXL comparison, the average task scores were forty-seven point one for GQA and forty-seven point two for multi-head attention. That covered summarization, translation and TriviaQA and excluded GLUE. For your checkpoint, set a quality limit before comparing held-out tasks. Check cached execution separately."
        hold: 0.8
        visual_cues:
          - id: paper
            phrase: "forty-seven point two for multi-head attention"
            targets: [picture]
          - id: test
            phrase: "Check cached execution separately"
            targets: [picture]
  - id: latent-store
    title: "What fits in one latent cache entry?"
