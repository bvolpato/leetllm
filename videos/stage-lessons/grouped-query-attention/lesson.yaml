version: 1
id: grouped-query-attention
title: Sharing Memory Across Attention Heads
source: fundamentals/multi-query-grouped-query-attention/content.md
sources:
  - title: "Ainslie et al.: GQA: Training Generalized Multi-Query Transformer Models from Multi-Head Checkpoints"
    url: https://arxiv.org/abs/2305.13245
  - title: "FlashAttention: Fast and Memory-Efficient Exact Attention with IO-Awareness"
    url: https://arxiv.org/abs/2205.14135
  - title: "FlashInfer: Efficient and Customizable Attention Engine for LLM Inference Serving"
    url: https://arxiv.org/abs/2501.01005
  - title: DeepSeek-V2 MLA architecture
    url: https://arxiv.org/abs/2405.04434
  - title: PyTorch2.15 SDPA mask alignment
    url: https://docs.pytorch.org/docs/2.15/generated/torch.nn.functional.scaled_dot_product_attention.html
  - title: vLLM Llama head partition and replication
    url: https://github.com/vllm-project/vllm/blob/main/vllm/model_executor/models/llama.py
  - title: NVIDIA H100 shipping specifications
    url: https://www.nvidia.com/en-us/data-center/h100/
  - title: Llama3.1 released architecture
    url: https://arxiv.org/abs/2407.21783
  - title: Gemma2 local/global retention
    url: https://arxiv.org/abs/2408.00118
  - title: Mistral7Bv0.3 configuration
    url: https://huggingface.co/mistralai/Mistral-7B-v0.3/blob/main/config.json
scenes:
  - id: opening
    title: "How many pairs does one word add to the cache?"
    visual: "Two layers have already stored Rain. Follow their eight query wires to the stored pairs, then watch the two layers write different numbers of pairs for fell."
    beats:
      - say: "Here comes the next word, fell. Each head on the left writes a pair for it. Eight heads, eight pairs. Rain stays in the row above."
        hold: 0.7
        visual_cues:
          - id: next
            phrase: "Here comes the next word"
            targets: [picture]
          - id: private-write
            phrase: "Each head on the left"
            targets: [picture]
          - id: private-total
            phrase: "Eight heads, eight pairs"
            targets: [picture]
      - say: "Look at one pair. The blue strip is the key a query can match. The green strip is the value the head can bring back."
        hold: 0.75
        visual_cues:
          - id: pair
            phrase: "Look at one pair"
            targets: [picture]
      - say: "On the right, four queries read the first history. The other four read the second. How many pairs does this layer write for fell?"
        hold: 2.3
        visual_cues:
          - id: first-group
            phrase: "four queries read the first history"
            targets: [picture]
          - id: second-group
            phrase: "The other four read the second"
            targets: [picture]
          - id: ask
            phrase: "How many pairs"
            targets: [picture]
      - say: "Two pairs. One per group. All eight queries can read Rain and fell. That's grouped-query attention. Can two heads that share a history give more weight to different words?"
        hold: 0.9
        visual_cues:
          - id: write
            phrase: "Two pairs"
            targets: [picture]
            caption_boundary: true
          - id: name
            phrase: "That's grouped-query attention"
            targets: [picture]
  - id: attention
    title: "Two readers at the same history"
    visual: "Work both reads against the cached positions for Rain and fell. Keep the first scaled scores, weights and output visible while predicting what happens when the second query turns."
    beats:
      - say: "Follow the first group. Here are its two positions, Rain and fell. Give the first key and value the coordinates one, zero, and the second pair zero, one. The query at fell can see both positions, including its own newly appended key."
        hold: 0.6
        visual_cues:
          - id: positions
            phrase: "Rain and fell"
            targets: [picture]
      - say: "Head zero points along the first key. Its dot products are two and zero. The key has two coordinates, so divide each score by the square root of two. Mask any future positions, then take softmax across the visible scores. About eighty percent of the weight goes to Rain. Mixing the two values puts the output arrow near the first axis."
        hold: 0.7
        visual_cues:
          - id: score
            phrase: "Its dot products are two and zero"
            targets: [picture]
          - id: scale
            phrase: "by the square root of two"
            targets: [picture]
          - id: weights
            phrase: "about eighty percent of the weight goes to Rain"
            targets: [picture]
          - id: blend
            phrase: "near the first axis"
            targets: [picture]
      - say: "Give head one a query pointing straight up. Keep both keys and both values where they are. Which token gets more weight now?"
        hold: 2.1
        visual_cues:
          - id: second
            phrase: "pointing straight up"
            targets: [picture]
          - id: ask
            phrase: "Which token gets more weight now"
            targets: [picture]
      - say: "Fell does. The second key lines up with this query. Its output points toward the other axis. Each head made its own set of weights from exactly the same history."
        hold: 0.9
        visual_cues:
          - id: answer
            phrase: "Fell does"
            targets: [picture]
            caption_boundary: true
          - id: combination
            phrase: "Its output points toward the other axis"
            targets: [picture]
  - id: map
    title: "Follow a query to its stored group"
    visual: "Bracket the two runs of query indices. Use integer division to route query five to the second history."
    beats:
      - say: "Number the query heads from zero. Eight queries divided between two histories gives four readers per history. Starting at zero, trace the first four wires into group zero. The next four go to group one."
        hold: 0.7
        visual_cues:
          - id: divide
            phrase: "four readers per history"
            targets: [picture]
          - id: first
            phrase: "the first four wires into group zero"
            targets: [picture]
          - id: second
            phrase: "The next four go to group one"
            targets: [picture]
      - say: "Take query five. How many whole groups of four come before it?"
        hold: 1.85
        visual_cues:
          - id: pick
            phrase: "Take query five"
            targets: [picture]
      - say: "One whole group. The remainder picks out a reader inside the next group. Query five uses group one's keys and values and makes its own output."
        hold: 0.8
        visual_cues:
          - id: owner
            phrase: "One whole group"
            targets: [picture]
            caption_boundary: true
          - id: out
            phrase: "makes its own output"
            targets: [picture]
  - id: architectures
    title: "Eight readers, three ways to store their history"
    visual: "Keep the query wires in place as the number of learned histories changes from eight to two to one. Compare payloads at fixed length, width and precision."
    beats:
      - say: "Open the fan of wires all the way. In multi-head attention there are eight histories for eight readers. Bring the wires into two groups. That's grouped-query attention. Bring all eight to one history. That's multi-query attention. Each query still chooses how much weight to give each position."
        hold: 0.75
        visual_cues:
          - id: mha
            phrase: "eight histories for eight readers"
            targets: [picture]
          - id: gqa
            phrase: "two groups"
            targets: [picture]
            caption_boundary: true
          - id: mqa
            phrase: "all eight to one history"
            targets: [picture]
      - say: "Keep the sequence, width and precision fixed. Two stored heads use one quarter of the original cache. One stored head uses one eighth. All eight queries in that last layout have to work with the same learned keys and values."
        hold: 0.65
        visual_cues:
          - id: four
            phrase: "one quarter of the original cache"
            targets: [picture]
          - id: eight
            phrase: "one eighth"
            targets: [picture]
      - say: "Return to two groups. Each group can learn a different key and value projection. Whether that extra freedom helps a task is something to measure on the trained model."
        hold: 0.7
        visual_cues:
          - id: learned
            phrase: "Return to two groups"
            targets: [picture]
  - id: tensors
    title: "Which dimension belongs to storage?"
    visual: "Magnify one head of one layer into separate key and value grids. Add the third position, then switch the head count while the size of each grid stays fixed."
    beats:
      - say: "Our little cache now has one request. For this count, each key and value vector is four numbers wide. Append a third position. In the magnified head, that adds four key numbers and four value numbers. A whole head now holds twelve of each."
        hold: 0.8
        visual_cues:
          - id: append
            phrase: "Append a third position"
            targets: [picture]
          - id: twelve
            phrase: "twelve of each"
            targets: [picture]
      - say: "Give each of the eight queries a private history. Read the key tensor from left to right as requests, stored heads, positions and width. Its shape is one by eight by three by four. The value tensor has the same shape."
        hold: 0.8
        visual_cues:
          - id: mha
            phrase: "a private history"
            targets: [picture]
          - id: shape
            phrase: "one by eight by three by four"
            targets: [picture]
      - say: "Bring the four readers in each group back together. Which dimension of the key tensor should change?"
        hold: 2.1
        visual_cues:
          - id: ask
            phrase: "Which dimension of the key tensor should change"
            targets: [picture]
      - say: "The head count falls to two. Each group still has three positions and four numbers per vector. At this decode step the query tensor has eight heads but only one new position. To price the cache, count both stored arrays, then multiply by layers and bytes per number."
        hold: 0.8
        visual_cues:
          - id: gqa
            phrase: "The head count falls to two"
            targets: [picture]
            caption_boundary: true
          - id: queries
            phrase: "only one new position"
            targets: [picture]
          - id: payload
            phrase: "multiply by layers and bytes per number"
            targets: [picture]
  - id: budget
    title: "Can the next token fit?"
    visual: "Give the GQA cache a 256-byte allowance. Price one K/V head at one position, then grow the three layouts on the same byte scale against that fixed limit."
    beats:
      - say: "Give our request two layers and two bytes per number. At one position, one head stores four key numbers and four value numbers in each layer. That's thirty-two bytes across both layers. For three positions, multiply that by three and by the number of stored heads."
        hold: 0.7
        visual_cues:
          - id: fixture
            phrase: "thirty-two bytes across both layers"
            targets: [picture]
      - say: "With eight stored heads the three positions occupy seven hundred sixty-eight bytes. With two, they occupy one hundred ninety-two. A single shared head takes ninety-six. The gold mark is a budget of two hundred fifty-six bytes for this request's raw cache."
        hold: 0.8
        visual_cues:
          - id: mha
            phrase: "seven hundred sixty-eight bytes"
            targets: [picture]
          - id: gqa
            phrase: "one hundred ninety-two"
            targets: [picture]
            caption_boundary: true
          - id: mqa
            phrase: "ninety-six"
            targets: [picture]
          - id: limit
            phrase: "gold mark"
            targets: [picture]
      - say: "Follow the middle row. The grouped cache has two heads and there's room for sixty-four more bytes. Will a fourth position fit?"
        hold: 2.2
        visual_cues:
          - id: ask
            phrase: "Follow the middle row"
            targets: [picture]
      - say: "It fits exactly. Another position adds thirty-two bytes for each of the two stored heads. The new total is two hundred fifty-six. Compare the ends of the other rows. The fourth position costs eight heads' worth in the top row and one head's worth in the bottom row. These bars count the raw cache. Weights, temporary tensors, reservations and replicas also take space on a device."
        hold: 0.85
        visual_cues:
          - id: fit
            phrase: "It fits exactly"
            targets: [picture]
            caption_boundary: true
          - id: fourth
            phrase: "The new total is two hundred fifty-six"
            targets: [picture]
          - id: compare
            phrase: "Compare the ends of the other rows"
            targets: [picture]
          - id: scope
            phrase: "Weights, temporary tensors, reservations and replicas"
            targets: [picture]
  - id: roofline
    title: "How much attention work does one cache read buy?"
    visual: "Count the two attention products using query heads. Count ideal distinct reads using stored heads, then compare the ratios to a hardware bandwidth ceiling."
    beats:
      - say: "For one layer, let each request decode a single token. Count a multiply and an add for each query coordinate at each stored position. That's the query-key product. Mixing the values costs the same again when keys and values have equal width. Together the products take four times the batch size, query heads, positions and width."
        hold: 0.8
        visual_cues:
          - id: qk
            phrase: "the query-key product"
            targets: [picture]
          - id: av
            phrase: "Mixing the values"
            targets: [picture]
          - id: both
            phrase: "Together the products"
            targets: [picture]
      - say: "Suppose the kernel reads each stored key and value once and reuses it for every query in the group. Divide the operation count by the bytes read. Batch size, positions and width cancel. What's left is two times the number of readers per history, divided by bytes per number. At two bytes per number, multi-head attention gets one operation per byte. Eight readers per history gives eight. With sixty-four queries sharing a single history, it's sixty-four."
        hold: 0.8
        visual_cues:
          - id: read
            phrase: "reads each stored key and value once"
            targets: [picture]
          - id: cancel
            phrase: "Batch size, positions and width cancel"
            targets: [picture]
          - id: mha
            phrase: "one operation per byte"
            targets: [picture]
          - id: gqa
            phrase: "Eight readers per history gives eight"
            targets: [picture]
            caption_boundary: true
          - id: mqa
            phrase: "it's sixty-four"
            targets: [picture]
      - say: "With one read per group, the single-history model reaches sixty-four operations per byte. How does that compare with the hardware? The H one hundred SXM lists a BF sixteen peak with structured sparsity. Its dense peak is about half that. Divide the dense peak by memory bandwidth and the ridge is about two hundred ninety-five operations per byte. Below the ridge, memory bandwidth sets the lower ceiling. If the single-history kernel reads every key and value twice, its bar drops to thirty-two. Same work, twice the bytes."
        hold: 0.75
        visual_cues:
          - id: ideal
            phrase: "one read per group"
            targets: [picture]
          - id: sparse
            phrase: "with structured sparsity"
            targets: [picture]
          - id: ridge
            phrase: "two hundred ninety-five operations per byte"
            targets: [picture]
          - id: profile
            phrase: "its bar drops to thirty-two"
            targets: [picture]
  - id: large-budget
    title: "How many requests fit in ten GiB of raw cache?"
    visual: "Compare cache bytes at fixed total positions, then tile the same ten-GiB allowance with whole 4,096-position requests and change the context length."
    beats:
      - say: "Scale up to eighty full-attention layers with sixty-four query heads. Use width one hundred twenty-eight and two bytes per number. Thirty-two requests each hold four thousand ninety-six positions. With private histories, the cache takes about three hundred forty-four decimal gigabytes. Eight stored heads bring it down to about forty-three. A single head takes just over five. One longer request with the same total positions uses the same raw payload. Seventy-two billion two-byte weights would add another hundred forty-four gigabytes."
        hold: 0.75
        visual_cues:
          - id: dimensions
            phrase: "eighty full-attention layers"
            targets: [picture]
          - id: mha
            phrase: "three hundred forty-four decimal gigabytes"
            targets: [picture]
          - id: gqa
            phrase: "about forty-three"
            targets: [picture]
            caption_boundary: true
          - id: mqa
            phrase: "just over five"
            targets: [picture]
          - id: weight
            phrase: "another hundred forty-four gigabytes"
            targets: [picture]
      - say: "Look inside a budget of ten gibibytes for cache alone. One request at four thousand ninety-six positions takes the whole space with private histories. With eight stored heads, it takes one strip, one and a quarter gibibytes. With one stored head, it takes just one small square. The same space holds one, eight or sixty-four requests at those lengths. Eight arrivals could now share a batch. Measure whether that improves completed tokens per second within the latency target."
        hold: 0.8
        visual_cues:
          - id: one-request
            phrase: "the whole space with private histories"
            targets: [picture]
          - id: gqa-request
            phrase: "one and a quarter gibibytes"
            targets: [picture]
          - id: mqa-request
            phrase: "just one small square"
            targets: [picture]
          - id: capacity
            phrase: "one, eight or sixty-four requests"
            targets: [picture]
      - say: "Now follow one request as its prefix grows. The new scale runs up to the multi-head cache for just over a million positions. At thirty-two K the private histories need about eighty-six gigabytes. At four times that length they need about three hundred forty-four gigabytes. At the full length they reach two point seven five terabytes. The eight-head layout uses one eighth at every length. Dividing bytes by device capacity only gives a lower bound. Five devices might hold enough bytes and still fail the head-sharding rule."
        hold: 0.8
        visual_cues:
          - id: long
            phrase: "as its prefix grows"
            targets: [picture]
            caption_boundary: true
          - id: context-32ki
            phrase: "about eighty-six gigabytes"
            targets: [picture]
          - id: context-128ki
            phrase: "about three hundred forty-four gigabytes"
            targets: [picture]
          - id: context-1mi
            phrase: "two point seven five terabytes"
            targets: [picture]
          - id: rank
            phrase: "Five devices"
            targets: [picture]
  - id: model-config
    title: "Read the checkpoint before sizing the cache"
    visual: "Align each Llama 3.1 query count with its eight K/V heads. Compare contrasting retention rules and the context supported by each release."
    beats:
      - say: "Read across each Llama three point one row. All three checkpoints have eight stored heads. The eight-billion model has thirty-two queries, or four readers per history. Doubling or quadrupling the queries gives the sharing ratios beside the larger models. Those releases support a context of one hundred twenty-eight K. The original Llama three release in April twenty twenty-four supported eight K."
        hold: 0.8
        visual_cues:
          - id: counts
            phrase: "eight stored heads"
            targets: [picture]
          - id: ratios
            phrase: "sharing ratios beside the larger models"
            targets: [picture]
          - id: context
            phrase: "supported eight K"
            targets: [picture]
      - say: "Which positions survive also matters. Gemma two alternates a four-K sliding window with eight-K global attention. Mistral seven-billion version zero point three has no sliding window, even though the original paper described one. Add up each layer's retained length. For a recurrent or latent layer, count the state that architecture actually stores."
        hold: 0.75
        visual_cues:
          - id: gemma
            phrase: "eight-K global attention"
            targets: [picture]
          - id: mistral
            phrase: "has no sliding window"
            targets: [picture]
          - id: sum
            phrase: "each layer's retained length"
            targets: [picture]
      - say: "Size the cache for the checkpoint's learned key and value projections. To check retrieval quality, put a fact near the start of a long prompt and ask for it at the end. Repeat with the fact at different positions and with different prompt lengths."
        hold: 0.8
        visual_cues:
