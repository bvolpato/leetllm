            targets: [picture]
      - say: "At fifty milliseconds. The sixteen gigabytes of cache reads became two. The same forty-eight gigabytes of weights still have to cross. Divide sixty-four by fifty and the old reads take one point two eight times as long as the new ones."
        hold: 0.8
