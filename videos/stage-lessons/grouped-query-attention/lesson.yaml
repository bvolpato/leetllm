  - id: physical-heads
    title: "Follow one history across ranks"
    visual: "Trace KV3 in a four-rank partition, split its readers across two ranks at TP16 and test a second layout that fails the partition rule."
    beats:
      - say: "Put the sixty-four query heads and eight stored histories on four devices. Each device runs one tensor-parallel rank. In this vLLM Llama layout, query heads split evenly. With at least as many KV heads as ranks, those heads must split evenly too. That gives each rank sixteen queries and two KV heads. Follow history three. Its eight readers live together on rank one. There are eight physical copies in all, one per history."
        hold: 0.8
        visual_cues:
          - id: four
            phrase: "sixteen queries and two KV heads"
            targets: [picture]
          - id: trace
            phrase: "Follow history three"
            targets: [picture]
          - id: first-total
            phrase: "eight physical copies in all"
            targets: [picture]
      - say: "Keep the checkpoint and increase the rank count to sixteen. Four queries now live on each rank. History three serves queries twenty-four through thirty-one. The first four readers are on rank six, the last four on rank seven. Both ranks need the same keys and values. This layout puts one KV head on every rank."
        hold: 0.8
        visual_cues:
          - id: sixteen
            phrase: "increase the rank count to sixteen"
            targets: [picture]
          - id: perrank
            phrase: "Four queries now live on each rank"
            targets: [picture]
          - id: copies
            phrase: "Both ranks need the same keys and values"
            targets: [picture]
            caption_boundary: true
      - say: "Count the copies. Eight histories now occupy sixteen physical slots. That's twice the unreplicated cache. Matching multi-head attention has sixty-four slots, so the actual saving is fourfold. In this replication regime, the rank count must be a multiple of the KV head count."
        hold: 0.7
        visual_cues:
          - id: double
            phrase: "sixteen physical slots"
            targets: [picture]
          - id: saving
            phrase: "actual saving is fourfold"
            targets: [picture]
      - say: "Try four ranks with twenty-four queries and six KV heads. Each rank gets six queries. Can you give every rank the same number of whole KV heads?"
        hold: 1.7
        visual_cues:
          - id: invalid
            phrase: "Try four ranks"
            targets: [picture]
      - say: "Give each rank one KV head. Two heads are left. A second round would take four, so this Llama layout rejects the split. With a supported split, compare each rank's outputs with a reference and measure its cache."
        hold: 0.8
        visual_cues:
