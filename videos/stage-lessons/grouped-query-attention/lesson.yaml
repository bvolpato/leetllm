  - id: tradeoff
    title: "Where do the grouped reads end?"
    visual: "Place weight and cache traffic end to end on one bandwidth ruler. Keep the entire weight segment fixed while the GQA cache segment contracts, then read both timing bounds."
    beats:
      - say: "A smaller cache can let more requests share a batch. To see what it buys in time, suppose a decode step reads forty-eight gigabytes of weights and sixteen gigabytes of keys and values. Give the device one terabyte per second of bandwidth. On this ruler, every gigabyte costs at least a millisecond."
        hold: 0.8
        visual_cues:
          - id: weights
            phrase: "forty-eight gigabytes of weights"
            targets: [picture]
          - id: cache
            phrase: "sixteen gigabytes of keys and values"
            targets: [picture]
          - id: ruler
            phrase: "every gigabyte costs at least a millisecond"
            targets: [picture]
      - say: "The original reads take at least sixty-four milliseconds. Switch to a grouped model that cuts just the cache traffic eightfold. The weight reads stay fixed. Where should the new step end on this ruler?"
