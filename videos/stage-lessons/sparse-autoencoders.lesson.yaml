  - id: coverage
    title: "What does an exact reconstruction tell us?"
    visual: "A sparrow-specific direction writes both coordinates in a toy example. A loss ruler and a two-probe edit show what reconstruction alone leaves open."
    beats:
      - say: "Take a sparrow. In this little dictionary the first coordinate says bird and the second says sparrow. A combined direction can write both with one active entry. The dot stays put. Now inspect the bird detector. It subtracts the second coordinate from the first, so on this sparrow it reads zero. The specialized slot has absorbed part of the general feature. Looking only at examples where the bird detector fires would hide the birds it misses."
        hold: 0.8
        visual_cues:
          - id: cov-absorb
            phrase: "first coordinate says bird"
            targets: [bird-direction]
          - id: cov-combined
            phrase: "combined direction"
            targets: [sparrow-direction]
          - id: coverage-b1-1
            phrase: "The dot stays put"
            targets: [equivalent-reconstruction]
