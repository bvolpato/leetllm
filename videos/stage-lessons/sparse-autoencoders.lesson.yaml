          - id: dict-bias-add
            phrase: adds it after decoding
            targets:
              - picture
          - id: dict-not-mean
            phrase: need not be the exact data mean
            targets:
              - picture
          - id: dict-tied-init
            phrase: tied initialization
            targets:
              - picture
  - id: objective
    title: Fit the activation while limiting the code
    visual: Two explicitly computed candidate reconstructions exchange objective preference as the sparsity coefficient changes.
    beats:
      - say: "Look at the gap between the dot and its reconstruction. Training charges for that gap through mean squared error. It also charges a penalty on code magnitude. Restoring the pink arrow closes the gap. Dropping it saves the price of one coefficient. Our two candidates use the same five decoder columns, so we can compare their bills. Average squared error over two coordinates and average magnitude over five coefficients. For each positive coefficient the penalty contributes a derivative of lambda divided by five. The optimizer follows that gradient back to the encoder parameters. Subtracting a fixed amount from each code entry would be a different update."
        hold: 0.6
        visual_cues:
          - id: objective-b1-1
            phrase: "mean squared error"
            targets:
              - objective-equation
            linger: 0.45
          - id: obj-penalty
            phrase: "penalty on code magnitude"
            targets:
              - picture
          - id: obj-first
            phrase: "Restoring the pink arrow"
            targets:
              - picture
          - id: obj-second
            phrase: "Dropping it"
            targets:
              - picture
          - id: obj-candidates
            phrase: "Our two candidates"
            targets:
              - picture
          - id: obj-div-d
            phrase: "Average squared error"
            targets:
              - picture
          - id: obj-div-m
            phrase: "average magnitude"
            targets:
              - picture
          - id: obj-derivative
            phrase: "lambda divided by five"
            targets:
              - picture
          - id: obj-not-decay
            phrase: "Subtracting a fixed amount"
            targets:
              - picture
      - say: "With both arrows we hit the target exactly. With one arrow we miss by a whole unit along the pink direction. Its squared length is one, so the mean squared error over two coordinates is one half. Raise the price of each coefficient. At a weight of two and a half, the price of the second arrow exactly equals the error it saves. Keep raising the price to four. Now the one-arrow code costs one point seven, and the exact reconstruction costs two. Training prefers the cheaper code under this objective."
        hold: 0.65
        visual_cues:
          - id: objective-b2-1
            phrase: "At a weight of two and a half"
            targets:
              - candidate-loss
            linger: 0.45
          - id: obj-dense
            phrase: "With both arrows"
            targets:
              - picture
          - id: obj-sparse
            phrase: "With one arrow"
            targets:
              - picture
          - id: obj-raise
            phrase: "Raise the price"
            targets:
              - picture
          - id: obj-preferred
            phrase: "Keep raising the price"
            targets:
              - picture
      - say: "There’s another way to lower the bill. Halve both coefficients and double the lengths of the decoder columns. Each weighted arrow still reaches its old tip, so the reconstruction stays put. The magnitude penalty falls even though the same two entries are active. Unit-length decoder columns rule out this trade. A norm-aware penalty charges for the product of coefficient magnitude and column length, which stays fixed here."
        hold: 0.7
        visual_cues:
          - id: objective-b3-1
            phrase: "Halve both coefficients"
            targets:
              - scale-degeneracy
            linger: 0.45
          - id: objective-b3-2
            phrase: "the reconstruction stays put"
            targets:
              - scale-invariant
            linger: 0.45
          - id: obj-reduce
            phrase: "The magnitude penalty falls"
            targets:
              - picture
          - id: obj-unit
            phrase: "Unit-length decoder columns"
            targets:
              - picture
          - id: obj-norm-aware
            phrase: "norm-aware penalty"
            targets:
              - picture
  - id: shrinkage
    title: A magnitude penalty also shrinks real signals
    visual: The exact one-dimensional L1 optimum moves below a fixed target as the penalty increases, with reconstruction and penalty costs shown separately.
    beats:
      - say: "Hold the blue coefficient fixed. Pink needs a coefficient of one to reach the dot. Add a price for its magnitude and the lowest point on the cost curve slides left. With this scalar loss, the optimum is the target minus half the effective penalty weight, clipped at zero. Raise the weight to one point two. The pink coefficient settles at point four, leaving a gap even though we picked the correct direction."
        hold: 0.65
        visual_cues:
          - id: shrinkage-b1-1
            phrase: "target minus half the effective penalty weight"
            targets:
              - shrinkage-rule
            linger: 0.45
          - id: shrinkage-b1-2
            phrase: "Raise the weight to one point two"
            targets:
              - coefficient-optimum
            linger: 0.45
          - id: shrink-favors
            phrase: "Add a price"
            targets:
              - picture
          - id: shrink-clip
            phrase: "clipped at zero"
            targets:
              - picture
      - say: "Count the active entries. Both arrows still contribute. Raise the weight again and the pink coefficient gets closer to zero, but the count is still two. Only when the coefficient reaches zero does the count fall to one. The L-one penalty charges for magnitude throughout. A support limit cares about how many entries are nonzero."
        hold: 0.7
        visual_cues:
