  - id: feature-audit
    title: "What explains the gap between these requests?"
    visual: "Return to the two reset prompts with a downstream score and a residual. Remove the credential contribution from both originals, restore them, then remove urgency and compare the gap."
    beats:
      - say: "Suppose someone names a learned direction credential. How much could we learn from the name alone? In a Pythia study, aggregate explanation and reconstruction scores often looked similar for trained and randomized models. A randomly initialized model gives us a baseline for interpreting those metrics."
