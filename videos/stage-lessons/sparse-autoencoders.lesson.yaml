  - id: selection
    title: "Which candidates reach the decoder?"
    visual: "Five candidate values remain visible under a support cap. Apply the cap, change the input, and compare a fixed threshold and a window of firing counts."
    beats:
      - say: "These five bars are candidates for the decoder. Each number above a bar gives its proposed coefficient. Suppose we can keep at most two positive entries, and we want the largest ones. Which two slots will write to the reconstruction?"
        hold: 2.1
        visual_cues:
          - id: sel-topk
            phrase: "at most two positive entries"
            targets: [topk-rule]
          - id: sel-question
            phrase: "Which two slots"
            targets: [support-question]
      - say: "Keep slots two and four. Their arrows still have the original magnitudes, two point four and one point seven. The other arrows disappear. That's nonnegative Top K. On a new input, leave slot two alone and push every other candidate below zero. Only one slot writes now, even with room for two."
        caption_starts: ["On a new input", "Only one slot writes now"]
        hold: 0.7
        visual_cues:
          - id: selection-b1-1
            phrase: "Keep slots two and four"
            targets: [selected-coefficients]
          - id: sel-original
            phrase: "original magnitudes"
            targets: [retained-values]
          - id: sel-fewer
            phrase: "push every other candidate below zero"
            targets: [new-candidates]
          - id: sel-cap
            phrase: "Only one slot writes"
            targets: [positive-support]
      - say: A fixed threshold makes a different decision. Raising it can remove weak candidates, and the number retained varies with the input. JumpReLU learns a positive threshold and keeps the pre-activation above it. Its discontinuous threshold needs a specialized gradient estimator during training.
        hold: 0.65
        visual_cues:
          - id: selection-b2-1
            phrase: Raising it
            targets:
              - selected-coefficients
            linger: 0.45
          - id: sel-threshold
            phrase: fixed threshold
            targets:
