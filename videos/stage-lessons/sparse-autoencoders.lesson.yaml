            phrase: an encoder that estimates the code from an observed activation
            targets:
              - dictionary-construction
            color: cyan
            linger: 0.65
          - id: dictionary-hook-context
            phrase: Match the model checkpoint, layer, token positions, and normalization convention
            targets:
              - dictionary-construction
            color: yellow
            linger: 0.65
          - id: dictionary-dimensions
            phrase: For width D and M latent slots
            targets:
              - dictionary-construction
            linger: 0.4
          - id: dictionary-tying
            phrase: Tied weights force
            targets:
              - dictionary-construction
            linger: 0.4
          - id: dict-untied
            phrase: can be untied
            targets:
              - picture
          - id: dict-shapes
            phrase: M by D
