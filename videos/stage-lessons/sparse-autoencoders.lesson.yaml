            phrase: "birds it misses"
            targets: [semantic-recall]
      - say: "What if we measure downstream loss? The clean model scores two. Substituting its reconstruction costs four tenths more. Compare that damage with replacing the activation altogether. If the ablation baseline moves from six to ten, the fraction of loss recovered rises. The same four tenths of damage now count against a bigger denominator. Keep all three raw losses. To evaluate a dictionary you'll also want to know which slots fire, which examples the labels miss, and what happens when you edit a direction."
