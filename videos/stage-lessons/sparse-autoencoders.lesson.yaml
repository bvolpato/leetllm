      - say: "Take the password request again. The arrows reach the dot. To go further, pick a quantity that should change and one that should stay put. Subtract the blue credential arrow. The horizontal reading falls from two point three to point eight. The vertical reading stays at point six. That tells us exactly which readout changed here. Next we need to know where this activation enters the model."
