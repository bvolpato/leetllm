  - id: dictionary
    title: Rebuild an activation from a few directions
    visual: A known sparse code weights two columns of a wider unit-direction dictionary and adds their contributions to reproduce the mixed activation.
    beats:
      - say: A dictionary is a collection of candidate directions in activation space. A sparse code assigns nonzero coefficients to only a few of them. Multiply each selected direction by its coefficient, then add. The result is a reconstruction with the same width as the original activation.
        hold: 0.6
        visual_cues:
          - id: dictionary-b1-1
            phrase: selected direction
            targets:
              - first-direction
            linger: 0.45
          - id: dictionary-b1-2
            phrase: reconstruction
            targets:
              - activation-point
            linger: 0.45
          - id: dict-code
            phrase: nonzero coefficients
            targets:
              - picture
          - id: dict-add
            phrase: then add
            targets:
              - picture
      - say: Follow our two selected directions as their weighted arrows join. Three other available directions stay unused. This supplied dictionary has more entries than the two-dimensional activation space has axes, making it overcomplete. Its sparse code is known because we constructed the mixture ourselves.
        hold: 0.65
        visual_cues:
          - id: dictionary-b2-1
            phrase: weighted arrows join
            targets:
              - activation-point
            linger: 0.45
          - id: dictionary-b2-2
            phrase: sparse code
            targets:
              - sparse-code
            linger: 0.45
          - id: dict-unused
            phrase: stay unused
            targets:
              - picture
          - id: dict-more
            phrase: more entries
            targets:
              - picture
          - id: dict-overcomplete
            phrase: overcomplete
            targets:
              - picture
      - say: A trained sparse autoencoder adds an encoder that estimates the code from an observed activation and a decoder whose columns reconstruct it. Detection and reconstruction weights can be untied. Match the model checkpoint, layer, token positions, and normalization convention before applying an existing dictionary at a hook. For width D and M latent slots, the encoder matrix is M by D and the decoder D by M. A common formulation subtracts decoder bias before encoding and adds it after decoding. That learned reference need not be the exact data mean; other recipes omit the subtraction. Tied weights force decoder to equal encoder transpose throughout training; tied initialization starts them aligned but permits independent later updates. These are different constraints.
        hold: 0.7
        visual_cues:
          - id: dictionary-b3-1
            phrase: a decoder whose columns reconstruct it
            targets:
              - dictionary-construction
            color: cyan
            linger: 0.45
