  - id: gated-learning
    title: Separate detection from estimated magnitude
    visual: A gate lane and magnitude lane share direction ownership while only the gate lane receives direct sparsity pressure.
    beats:
      - say: A Gated SAE makes a binary detection decision and separately estimates a nonnegative magnitude. Its original recipe shares projection directions while permitting different row scales and biases. L-one pressure applies to rectified gate pre-activations. An auxiliary reconstruction through those gate pre-activations teaches detection while freezing the decoder output path. In the paper's pseudocode, the shared decoder bias also centers the encoder input, so it can still receive an auxiliary gradient through that input path unless this path is stopped too.
        hold: 1
        visual_cues:
          - id: gated-learning-b0
            phrase: A Gated SAE makes a binary detection decision
            targets:
              - gated-learning-construction
            linger: 0.4
          - id: gated-magnitude
            phrase: separately estimates
            targets:
              - gated-learning-construction
            linger: 0.4
          - id: gated-aux-stop
            phrase: freezing the decoder output path
            targets:
              - gated-learning-construction
            linger: 0.4
          - id: gated-shared
            phrase: shares projection directions
            targets:
              - picture
          - id: gated-l1
            phrase: L-one pressure applies
            targets:
              - picture
          - id: gated-aux
            phrase: auxiliary reconstruction
            targets:
              - picture
      - say: The magnitude estimate has no direct L-one penalty, although shared parameters and reconstruction gradients can still change it. JumpReLU instead keeps the full pre-activation strictly above a learned positive threshold and uses an L-zero support penalty. A naive threshold derivative is zero almost everywhere, so its recipe uses a custom windowed straight-through estimator. Estimator bandwidth trades bias and variance. To see which architecture reconstructs better, compare them at matched data, width, sparsity and compute.
        hold: 1
        visual_cues:
          - id: gated-learning-b1
            phrase: The magnitude estimate has no direct L-one penalty,
            targets:
              - gated-learning-construction
            linger: 0.4
          - id: jump-threshold
            phrase: strictly above
            targets:
              - gated-learning-construction
            linger: 0.4
          - id: jump-window
            phrase: windowed straight-through estimator
            targets:
              - gated-learning-construction
            linger: 0.4
          - id: jump-instead
            phrase: JumpReLU instead
            targets:
              - picture
          - id: jump-l0
            phrase: L-zero support penalty
            targets:
              - picture
          - id: jump-zero
            phrase: zero almost everywhere
            targets:
              - picture
          - id: jump-bandwidth
            phrase: bandwidth trades bias and variance
            targets:
              - picture
          - id: jump-matched
            phrase: matched data, width, sparsity and compute
            targets:
              - picture
  - id: ablation
    title: "Which edit changed the score?"
    visual: "Two copies share the horizontal feature. Substitution moves one point down before both move left, and each score follows only its own vertical coordinate."
    beats:
      - say: "Zoom in on an activation with a small second coordinate, one tenth. Our score multiplies that coordinate by a hundred. So the original scores ten. The blue feature writes one unit horizontally. The green sliver above its tip is the residual, the part the autoencoder missed."
        hold: 0.8
        visual_cues:
          - id: abl-gain
            phrase: "Our score multiplies"
            targets: [score-readout]
          - id: abl-residual
            phrase: "The green sliver"
            targets: [original-residual]
      - say: "Start the second row from an identical copy. Substitute the reconstruction there. Its second coordinate falls to zero, and the whole score goes with it. The mean squared error is only five thousandths. Look at the blue feature in both rows. It's still there."
        hold: 1.5
        visual_cues:
          - id: abl-copy
            phrase: "an identical copy"
            targets: [comparison-copy]
          - id: abl-miss
            phrase: "Substitute the reconstruction"
            targets: [reconstruction-damage]
          - id: abl-mse
            phrase: "mean squared error"
            targets: [reconstruction-mse]
      - say: "Now subtract the same horizontal feature from each row. Before the arrows move, which score do you expect that subtraction to change?"
        hold: 2.4
        visual_cues:
          - id: abl-predict
            phrase: "subtract the same horizontal feature"
            targets: [ablation-prediction]
      - say: "Slide both points one unit left. Ten stays ten in the original row. Zero stays zero in the other. If we compared the original ten with that final zero, we'd blame the feature for a loss that happened before we touched it. Subtracting the feature from the original activation keeps its residual. That comparison measures the effect of this edit at this hook."
        caption_starts: ["Ten stays ten", "Zero stays zero", "If we compared"]
        hold: 1
        visual_cues:
          - id: abl-apply
            phrase: "Slide both points"
            targets: [shared-subtraction]
          - id: abl-results
            phrase: "Ten stays ten"
            targets: [within-row-score-change]
          - id: abl-copy-result
            phrase: "Zero stays zero"
            targets: [within-row-score-change]
          - id: abl-verdict
            phrase: "blame the feature"
            targets: [ablation-verdict]
  - id: steering
    title: An edit moves overlapping readouts too
    visual: An activation moves along one decoder direction while candidate, orthogonal, and overlapping readouts are computed across the steering sweep.
    beats:
      - say: "Watch the pink shadow as we lift the white dot straight up. It slides along the tilted ruler. The horizontal ruler still reads point two. This is activation steering. At the hook where we measured the activation, we add a scaled decoder direction and let the model continue from the new point."
        hold: 0.6
        visual_cues:
          - id: steer-add
            phrase: "lift the white dot"
