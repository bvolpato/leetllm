        visual_cues:
          - id: audit-aggregate
            phrase: "aggregate explanation and reconstruction scores"
            targets: [null-model-check]
      - say: "A natural language autoencoder puts text between the activation and its reconstruction. Its words can suggest a hypothesis, and the verbalizer can also invent details. A readable description still needs an independent test of what the model does."
        hold: 0.75
        visual_cues:
          - id: audit-verbalize
            phrase: "puts text between"
            targets: [verbalized-activation]
          - id: audit-roundtrip
            phrase: "its reconstruction"
            targets: [verbalized-round-trip]
      - say: "Use held-out requests to check the label. Try a translation, change the formatting, and inspect weak and silent examples. Sonnet studies found features that generalized across contexts, but the dictionary can miss cases. On matched prompts, measure whether a legitimate reset succeeds and whether the model still declines an unauthorized one. A different refusal phrase could leave both outcomes unchanged. Test at the original hook and token positions."
        hold: 0.75
        visual_cues:
          - id: audit-heldout
            phrase: "Use held-out requests"
            targets: [semantic-controls]
          - id: audit-behavior
