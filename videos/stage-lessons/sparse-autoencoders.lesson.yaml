scenes:
  - id: intro
    title: "Did the password signal get stronger?"
    visual: "The word “now” slides into a reset request. A marker keeps the old coordinate reading in view as the bar grows. Split the bar into its two contributions, then trace their arrows."
    beats:
      - say: "Add “now” to “Reset my password.” The first coordinate of our toy activation jumps from one point five to two point three. Did the password signal get stronger?"
        hold: 2.3
        caption_starts: ["The first coordinate", "Did the password signal"]
        visual_cues:
          - id: intro-now
            phrase: "Add “now” to “Reset my password.”"
            targets: [urgent-request]
          - id: intro-meter
            phrase: "The first coordinate"
            targets: [raw-coordinate]
      - say: "Split the bar at the old reading. The blue password component still contributes one point five. The extra eight tenths come from urgency. Both features move the same coordinate."
        hold: 0.7
        caption_starts: ["The blue password component", "The extra eight tenths"]
        visual_cues:
          - id: intro-unpack
            phrase: "Split the bar"
            targets: [coordinate-components]
          - id: intro-same
            phrase: "The blue password component"
            targets: [credential-contribution]
          - id: intro-urgency
            phrase: "The extra eight tenths"
            targets: [urgency-contribution]
      - say: "Draw the credential contribution along the horizontal axis. Now add the slanted urgency arrow at its tip. It carries us eight tenths to the right and six tenths up. The dot is the whole activation. The meter at the start saw only its horizontal position."
        hold: 0.7
        visual_cues:
          - id: intro-arrows
            phrase: "Draw the credential contribution"
            targets: [credential-arrow]
          - id: intro-slant
            phrase: "add the slanted urgency arrow"
            targets: [urgency-arrow]
      - say: "Try two directions at right angles. Turn them together. Both now cast a shadow on the horizontal axis. Two features can share a coordinate just because the axes are tilted. The superposition hypothesis goes further. A model could pack more features than it has dimensions by using overlapping directions. These axes describe the residual stream. An MLP neuron applies its own nonlinear activation."
        hold: 0.7
        visual_cues:
          - id: intro-rotate
            phrase: "two directions at right angles"
            targets: [orthogonal-pair]
          - id: intro-turn
            phrase: "Turn them together"
            targets: [rotated-pair]
          - id: intro-shadows
            phrase: "Both now cast a shadow"
            targets: [axis-projections]
      - say: "In a trained model we have to find candidate directions. A sparse autoencoder learns to rebuild each activation using a few of them. We'll test what one direction does by taking its contribution out and measuring the change in a score."
        hold: 0.8
        visual_cues:
          - id: intro-find
            phrase: "find candidate directions"
            targets: [candidate-mixture]
  - id: packing-bound
    title: Small pairwise overlap can accumulate
    visual: A fixed inactive probe receives twelve signed contribution slivers before a threshold rejects or admits their sum.
    beats:
      - say: "Put two arrows at right angles. Where could a third arrow point to miss both axes?"
        hold: 1.8
        visual_cues:
          - id: packing-bound-b0
            phrase: "a third arrow"
            targets: [packing-bound-construction]
      - say: "Point it straight up. Its blue shadow shrinks to zero, but the pink shadow reaches one. Turn it sideways and the shadows trade places. Every direction in this plane casts at least one shadow. In D dimensions, at most D unit directions can all be perpendicular. The Johnson-Lindenstrauss lemma asks a different question about a finite set of points. Use a suitable linear map to reduce the dimension. Each tick shows one pair’s squared distance afterward divided by its squared distance before. The required dimension grows with the log of the number of points and with the inverse square of the allowed error. All twenty-eight pairs here fit inside the band around one. To test feature recovery, we need to mix known directions and see which ones we get back."
        hold: 1
        caption_starts: ["Its blue shadow", "Turn it sideways", "Every direction in this plane", "The Johnson-Lindenstrauss lemma", "Each tick shows", "All twenty-eight pairs"]
        visual_cues:
          - id: packing-up
            phrase: "Point it straight up"
            targets: [vertical-projection]
          - id: packing-side
            phrase: "Turn it sideways"
            targets: [horizontal-projection]
          - id: packing-answer
            phrase: "casts at least one shadow"
            targets: [projection-verdict]
          - id: jl-projection
            phrase: "suitable linear map"
            targets:
              - packing-bound-construction
            linger: 0.4
          - id: jl-name
            phrase: "Johnson-Lindenstrauss"
            targets:
              - picture
          - id: jl-dimension
            phrase: "required dimension grows"
            targets:
              - picture
          - id: jl-within
            phrase: "fit inside the band"
            targets:
              - picture
          - id: jl-not
            phrase: "To test feature recovery"
            targets:
              - picture
      - say: "Now make twenty-four random directions. Choose each coordinate sign independently and fairly, then divide by the square root of the dimension to get unit length. At sixty-four dimensions the highlighted row shows the overlaps with one probe. Look across all pairs. The formula bounds the chance that even one absolute overlap exceeds one half. At two hundred and fifty-six dimensions the bound is below one in a thousand. Go back to sixteen and it exceeds one, so it gives no useful guarantee there. Higher dimensions can accommodate many nearly perpendicular directions under this sampling rule. What happens when several of those small overlaps add up?"
        hold: 1
        visual_cues:
          - id: packing-bound-b1
            phrase: "make twenty-four random directions"
            targets:
              - packing-bound-construction
            linger: 0.4
          - id: random-bound
            phrase: "Go back to sixteen"
            targets:
              - packing-bound-construction
            linger: 0.4
          - id: bound-concentration
            phrase: "At sixty-four dimensions"
            targets:
              - picture
          - id: bound-formula
            phrase: "Look across all pairs"
            targets:
              - picture
          - id: bound-exp
            phrase: "At two hundred and fifty-six dimensions"
            targets:
              - picture
          - id: bound-many
            phrase: "Higher dimensions can accommodate"
            targets:
              - picture
      - say: "Point the probe at a direction we left out of the mixture. Its coefficient is zero. The largest absolute overlap between any two unit directions is called coherence. Multiply it by the sum of the active coefficient magnitudes to bound the leakage into this probe. Watch twelve active directions join. Each has coefficient one and each adds a positive tenth along the probe. Together they write one point two. The threshold is one. This detector fires on a feature we left out. With only four active directions the leakage is four tenths. When choosing a cutoff we also have to leave room for weak real signals."
        hold: 1
        visual_cues:
          - id: packing-bound-b2
            phrase: "Point the probe"
            targets:
              - packing-bound-construction
            linger: 0.4
          - id: coherence-accumulate
            phrase: "twelve active directions join"
            targets:
              - packing-bound-construction
            linger: 0.4
          - id: coherence-threshold
            phrase: "The threshold is one"
            targets:
              - packing-bound-construction
            linger: 0.4
          - id: coherence-readout
            phrase: "Multiply it by the sum"
            targets:
              - picture
          - id: coherence-leak
            phrase: "one point two"
            targets:
              - picture
          - id: coherence-sparsity
            phrase: "With only four active directions"
            targets:
              - picture
          - id: coherence-weak
            phrase: "weak real signals"
            targets:
