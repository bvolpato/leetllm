      - say: "Return to our two password requests. Give this toy model a refusal score that reads both coordinates. Take the first coordinate and add twice the second. This time the autoencoder misses the same green sliver in each request, one tenth on the vertical axis. Add it back to both. The scores are now one point seven and three point seven. The urgent request scores two points higher."
