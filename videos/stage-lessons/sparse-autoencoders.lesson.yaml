          - id: sel-varies
            phrase: varies with the input
            targets:
              - picture
          - id: sel-jump
            phrase: JumpReLU learns
            targets:
              - picture
          - id: sel-estimator
            phrase: specialized gradient estimator
            targets:
              - picture
      - say: "Run three sentences past these slots. Each dot counts a firing. Slot two fires three times. Slot five stays quiet. Now try the windmill sentence. Slot five fires for the first time. A short observation window can miss rare contexts. What about slots that stay unused through training? AuxK gives them a separate task. It selects inactive latents to reconstruct the error left by the active ones. The main reconstruction still uses its usual support rule. Gao’s recipe typically checks for inactivity over ten million tokens and weights the auxiliary loss by one over thirty-two. Anthropic’s earlier recipe samples high-loss input vectors and resets selected directions, their biases and the corresponding optimizer state. That reset can cause a loss spike."
        hold: 0.7
        visual_cues:
