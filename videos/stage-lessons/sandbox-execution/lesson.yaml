            targets: [picture]
          - id: wh-bool
            phrase: "rejects the Boolean true"
            targets: [picture]
          - id: wh-python
            phrase: "Python treats true as a kind of integer"
            targets: [picture]
          - id: wh-fuel
            phrase: "one thousand fuel units"
            targets: [picture]
          - id: wh-bytes
            phrase: "one memory page of sixty-four kibibytes"
            targets: [picture]
          - id: wh-text
            phrase: "four kibibytes of UTF-eight module text"
            targets: [picture]
          - id: wh-separate
            phrase: "a different resource"
            targets: [picture]
      - say: "Follow one addition on the ring. Forty-one becomes forty-two. Minus one becomes zero. Now start at the largest signed value. One more step wraps to the smallest signed value. The task decides whether that wrap is acceptable. The host checks the exported function and its type. The validator compares the returned integer with its own expected value."
