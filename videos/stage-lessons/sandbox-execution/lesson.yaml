            targets: [picture]
          - id: wh-oracle
            phrase: "its own expected value"
            targets: [picture]
      - say: "Set fuel before instantiation. A start function can run as soon as the instance is created. That function and the later call to run share one budget of a thousand fuel units. Wasmtime charges each metered operation against it. A watchdog tracks elapsed time for the whole job, including compilation. The host also needs CPU and memory limits for the engine and any host functions it provides."
