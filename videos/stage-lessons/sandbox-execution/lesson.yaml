  - id: separated-authority
    title: "Who gets to grade these rows?"
    visual: "The same protected expectation meets an empty result and two repaired rows. A protected receipt stays fixed as the submitted image changes."
    beats:
      - say: "Suppose the worker returns an empty list. Its own test runner exits with zero. The validator has kept the expected rows over here, outside the worker. Compare the two lists. Does this output pass?"
        hold: 2.1
        visual_cues:
          - id: sa-empty
            phrase: "an empty list"
            targets: [picture]
          - id: sa-exit
            phrase: "exits with zero"
            targets: [picture]
          - id: sa-expected
            phrase: "the expected rows"
            targets: [picture]
          - id: sa-ask
            phrase: "Does this output pass"
            targets: [picture]
      - say: "Hold the result. Both expected rows are missing. A read-only test file can still be read, and a grader that shares the candidate’s interpreter can change in memory. The supervisor freezes the files, sets up the worker and enforces its timeout. It sends the bounded result to a validator it trusts. Now the repaired parser returns these two rows. Both rows match in order, so this fixture passes."
        hold: 0.9
        visual_cues:
          - id: sa-hold
            phrase: "Hold the result"
            caption_boundary: true
            targets: [picture]
          - id: sa-repair
            phrase: "the repaired parser returns these two rows"
            targets: [picture]
          - id: sa-pass
            phrase: "this fixture passes"
            caption_boundary: true
            targets: [picture]
      - say: "The supervisor keeps the validator’s passing receipt in a protected record. It identifies the base revision, candidate files, worker image, dependencies and grading version for this job. At first both sides have the same tested inputs. Now change just the submitted image to I eight. The file tree still matches. Can this receipt cover the new image?"
        hold: 2.2
        visual_cues:
