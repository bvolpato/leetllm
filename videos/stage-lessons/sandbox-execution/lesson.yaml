      - say: "Change the lookup. Use the root namespace when comparing the tags of direct children. Start with the first failure. Keep that name. The next case repeats it, so the list stays put. The third case adds a different name because it has an error child. The fourth is skipped. Compare the two rows with the expected output. They match. A report from another producer may need its own fixture."
