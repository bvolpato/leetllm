            targets: [picture]
          - id: td-quarantine
            phrase: "Keep the slot quarantined"
            targets: [picture]
          - id: td-terminated
            phrase: "the count falls to zero"
            caption_boundary: true
            targets: [picture]
      - say: "The reaper verifies the reset against the starting baseline, including files, mounts and open handles. Now slot A can take generation eight. An old cleanup record arrives. It names generation seven. If the reaper looked up slot A by name, which worker would it select?"
        hold: 2.1
