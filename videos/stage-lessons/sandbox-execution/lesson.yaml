            phrase: "travel back to the agent"
            targets: [picture]
      - say: "Look one line lower in the report. The failure is a child of the test case. On the next try, read the direct children. That repair needs the same file grant. Host credentials stay outside and the network stays closed. Check cleanup before reusing the worker slot."
        hold: 0.8
