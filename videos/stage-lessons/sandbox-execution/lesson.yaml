  - id: evaluate-two-axes
    title: "What counts as a successful pair?"
    visual: "Ten pairs of different indices share a grid. The three all-failing pairs identify the complement, while each containment question awaits evidence."
    beats:
      - say: "Functional tests tell us which candidates returned the expected rows. Containment probes need different observations, such as a denied file read or a verified cleanup. Let’s count just the functional outcomes first."
        hold: 0.7
        visual_cues:
          - id: ev2-functional
            phrase: "Functional tests"
            targets: [picture]
          - id: ev2-containment
            phrase: "Containment probes"
            targets: [picture]
      - say: "Here are five candidates. Candidates zero and two pass. Choose two different indices uniformly without replacement. Each square above the diagonal is one possible pair. Of these ten pairs, how many contain two failures?"
        hold: 2.1
        visual_cues:
          - id: ev2-pool
            phrase: "five candidates"
            targets: [picture]
          - id: ev2-two
            phrase: "Candidates zero and two pass"
            targets: [picture]
          - id: ev2-choose
            phrase: "Choose two different indices uniformly without replacement"
            targets: [picture]
          - id: ev2-ask
            phrase: "how many contain two failures"
            targets: [picture]
      - say: "Three pairs miss both passers. That leaves seven successful pairs out of ten. For this pool, pass at two is seventy percent. The question marks on the right stay put. Keep the tested artifact and environment fixed. Record access checks, timeouts and cleanup alongside the functional result."
        hold: 0.9
        visual_cues:
          - id: ev2-ten
            phrase: "Three pairs miss both passers"
            caption_boundary: true
            targets: [picture]
          - id: ev2-seven
            phrase: "seven successful pairs out of ten"
            caption_boundary: true
            targets: [picture]
          - id: ev2-result
            phrase: "pass at two is seventy percent"
            caption_boundary: true
            targets: [picture]
          - id: ev2-nothing
            phrase: "The question marks on the right"
            targets: [picture]
          - id: ev2-fixed
            phrase: "the tested artifact and environment fixed"
            targets: [picture]
          - id: ev2-report
            phrase: "access checks, timeouts and cleanup"
            targets: [picture]
      - say: "For any group size from one up to the size of the pool, start with one. Subtract the fraction of groups that miss every passer. The numerator counts ways to choose the whole group from the failures. The denominator counts all ways to choose that many different indices. Change the experiment and draw with replacement. Each draw can repeat an index. The chance of two failures is three fifths squared. That gives a success rate of sixty-four percent."
        hold: 0.75
        visual_cues:
          - id: ev2-formula
            phrase: "start with one"
            targets: [picture]
          - id: ev2-fails
            phrase: "choose the whole group from the failures"
            targets: [picture]
          - id: ev2-all
            phrase: "all ways to choose that many different indices"
            targets: [picture]
          - id: ev2-replacement
            phrase: "draw with replacement"
            targets: [picture]
          - id: ev2-squared
            phrase: "three fifths squared"
            targets: [picture]
          - id: ev2-sixtyfour
            phrase: "sixty-four percent"
            caption_boundary: true
            targets: [picture]
      - say: "For independent, identically distributed candidates, the combinatorial formula estimates fresh-sample success without bias. Substituting the observed pass fraction in the replacement formula generally introduces bias. Two different indices may contain the same code. And when one repair uses feedback from the previous attempt, those patches depend on each other. Sample independent whole repair runs and grade their final artifacts. Fix tasks, environments, tool budgets and grading. Count infrastructure failures and incomplete runs separately."
        hold: 0.8
        visual_cues:
          - id: ev2-unbiased
            phrase: "estimates fresh-sample success without bias"
            targets: [picture]
          - id: ev2-plugin
            phrase: "Substituting the observed pass fraction"
            targets: [picture]
          - id: ev2-identical
            phrase: "Two different indices may contain the same code"
            targets: [picture]
          - id: ev2-trajectories
            phrase: "independent whole repair runs"
            targets: [picture]
          - id: ev2-freeze
            phrase: "Fix tasks, environments, tool budgets and grading"
            targets: [picture]
          - id: ev2-infra
            phrase: "infrastructure failures and incomplete runs"
            targets: [picture]
