  - id: subject-intro
    title: "When a sandboxed parser fails"
    visual: "The lookup and the read-only report share the first frame. The exception moves from the worker to the agent while the worker’s permissions stay in view."
    beats:
      - say: "The agent’s parser gets one report to read. To find failed tests, it looks up status in the opening tag. What will that lookup return?"
        hold: 2.3
        visual_cues:
          - id: intro-report
            phrase: "one report to read"
            targets: [picture]
          - id: intro-lookup
            phrase: "looks up status"
            targets: [picture]
          - id: intro-predict
            phrase: "What will that lookup return"
            targets: [picture]
      - say: "Python raises a KeyError. The opening tag has a class and a name. Watch the error travel back to the agent through the bounded output channel."
        hold: 0.8
        visual_cues:
          - id: intro-error
            phrase: "Python raises a KeyError"
            caption_boundary: true
            targets: [picture]
          - id: intro-class
            phrase: "a class"
            targets: [picture]
          - id: intro-name
            phrase: "a name"
            targets: [picture]
