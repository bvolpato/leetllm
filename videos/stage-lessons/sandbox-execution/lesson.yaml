  - id: wasm-boundary
    title: "How much work can the guest do?"
    visual: "A teaching model gives a guest one host import and one hundred units of fuel. Its remaining work stays visible when the meter runs out."
    beats:
      - say: "Some jobs need only a small function interface. Here the host checks the module shape and links just one import, a way to write a result. Here that result writer is the guest’s only route to host services."
