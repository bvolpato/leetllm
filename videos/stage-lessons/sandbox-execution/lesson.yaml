  - id: teardown-lifecycle
    title: "Who owns slot A now?"
    visual: "Three children remain after the parent exits. The reaper verifies termination and reset, admits a replacement, then processes a delayed acknowledgement against the recorded generation."
    beats:
      - say: "The parser started three child processes. The supervisor requests cancellation. When the parent stops, count the children still inside the job. All three remain. A parent exit tells the supervisor when the parser stopped. Its descendants and its scratch files still need cleanup."
        hold: 0.8
        visual_cues:
          - id: td-children
            phrase: "three child processes"
            targets: [picture]
          - id: td-cancel
            phrase: "requests cancellation"
            targets: [picture]
          - id: td-stop
            phrase: "the parent stops"
            targets: [picture]
          - id: td-gone
            phrase: "All three remain"
            caption_boundary: true
            targets: [picture]
      - say: "Before starting a job, record the immutable worker ID, its lease generation and a maximum lifetime outside the worker. If the supervisor loses contact, an independent reaper can use that record to find an expired job. Keep the slot quarantined while the outcome is unknown. The reaper targets the whole job. When the runtime confirms that its process tree is empty, the count falls to zero."
        hold: 0.8
        visual_cues:
          - id: td-identity
            phrase: "the immutable worker ID"
            targets: [picture]
          - id: td-generation
            phrase: "its lease generation"
            targets: [picture]
          - id: td-lifetime
            phrase: "a maximum lifetime"
            targets: [picture]
          - id: td-contact
            phrase: "the supervisor loses contact"
            targets: [picture]
          - id: td-reaper
