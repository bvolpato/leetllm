  - id: execution-boundaries
    title: "Follow one file read"
    visual: "Four schematic workers request the first 128 bytes of an assigned report. Only the requested file changes on the second read."
    beats:
      - say: "Suppose four workers each need the first hundred and twenty-eight bytes of this report. For report data, each has a grant to that file alone. Follow the read across the container. Its syscall filter checks the call, and the shared host kernel resolves the file through the worker’s mount. Namespaces, capabilities and cgroups constrain different parts of that process. Devices and daemon access need their own restrictions."
        hold: 0.65
        visual_cues:
          - id: eb-route-0
            phrase: "across the container"
            targets: [picture]
      - say: "In gVisor, the Sentry handles the application’s system call and mediates filesystem access. In Firecracker, a guest kernel reads from an attached volume. A virtual machine monitor runs the guest on KVM. Those paths make different demands on system call compatibility, host support and provisioning."
        hold: 0.7
        visual_cues:
          - id: eb-route-1
            phrase: "the Sentry"
            targets: [picture]
          - id: eb-route-2
            phrase: "a guest kernel"
            targets: [picture]
      - say: "The WebAssembly version uses a linked host reader scoped to this report. The runtime checks guest memory and control flow. The host supplies any file, clock or network interface. Send the read down each route. In these four configurations, all four return the first hundred and twenty-eight bytes."
        hold: 0.8
        visual_cues:
          - id: eb-route-3
            phrase: "a linked host reader"
            targets: [picture]
          - id: eb-read
            phrase: "Send the read"
            targets: [picture]
          - id: eb-allowed
            phrase: "all four return the first hundred and twenty-eight bytes"
            caption_boundary: true
            targets: [picture]
      - say: "Now request the notes file. Keep every grant exactly as it was. Which of these workers can read the notes?"
        hold: 2.2
        visual_cues:
          - id: eb-change
            phrase: "request the notes file"
            targets: [picture]
          - id: eb-predict
            phrase: "Which of these workers can read the notes"
            targets: [picture]
      - say: "None of the four has that file. The mount, the scoped filesystem, the attached volume and the linked reader each expose only the report in this example. Pick a runtime compatible with the program, then check the actual grants with a harmless allowed file and an ungranted one."
        hold: 0.8
        visual_cues:
          - id: eb-deny
            phrase: "None of the four has that file"
            caption_boundary: true
            targets: [picture]
          - id: eb-check
            phrase: "check the actual grants"
            targets: [picture]
  - id: controls-by-failure
    title: "What stops when a limit is reached?"
    visual: "A synthetic token crosses the output channel while networking is disabled. A scratch write, a new task, CPU throttling and a wall deadline each change a different part of the job."
    beats:
      - say: "Imagine we accidentally give this worker a synthetic token. Its network is closed. Watch the ordinary output channel. A copy of the token can still reach the supervisor, its logs, or an exported file. Keep credentials out of jobs that do not need them."
        hold: 0.8
        visual_cues:
          - id: cf-credentials
            phrase: "a synthetic token"
            targets: [picture]
          - id: cf-network
            phrase: "Its network is closed"
            targets: [picture]
          - id: cf-print
            phrase: "the ordinary output channel"
            targets: [picture]
          - id: cf-returns
            phrase: "reach the supervisor"
            targets: [picture]
      - say: "Now run the worker without that token. Its scratch mount holds sixty-four mebibytes inside a five-hundred-and-twelve-mebibyte memory limit. As scratch fills, its pages also consume memory. At the scratch cap another write can fail. The process stays alive. With equal memory and memory-plus-swap limits, swap is disabled where supported. Memory pressure may trigger reclaim, an allocation failure or a kill. The task limit includes threads. At sixty-four tasks, another task request can fail while existing tasks keep running."
        hold: 0.8
        visual_cues:
          - id: cf-sixtyfour
            phrase: "scratch mount holds sixty-four mebibytes"
            targets: [picture]
          - id: cf-fivetwelve
            phrase: "a five-hundred-and-twelve-mebibyte memory limit"
            targets: [picture]
          - id: cf-consumes
            phrase: "its pages also consume memory"
            targets: [picture]
          - id: cf-scratch
            phrase: "At the scratch cap"
            targets: [picture]
          - id: cf-write-fails
            phrase: "another write can fail"
            targets: [picture]
          - id: cf-distinct
            phrase: "The process stays alive"
            targets: [picture]
          - id: cf-swap
            phrase: "swap is disabled where supported"
            targets: [picture]
          - id: cf-pressure
            phrase: "reclaim, an allocation failure or a kill"
            targets: [picture]
          - id: cf-threads
            phrase: "The task limit includes threads"
            targets: [picture]
          - id: cf-tasks
            phrase: "At sixty-four tasks"
            targets: [picture]
          - id: cf-reject
            phrase: "another task request can fail"
            targets: [picture]
      - say: "Follow the CPU strip. Each interval spans a hundred milliseconds of wall time. The job can use up to fifty milliseconds of CPU time per interval. With one busy thread, the quota runs out halfway across. Two threads can spend that same budget together. In the example they run side by side for twenty-five milliseconds each. Fifty divided by a hundred gives half a logical CPU in aggregate. The threads can keep going period after period. A quota caps bandwidth and guarantees no minimum progress."
        hold: 0.8
        visual_cues:
          - id: cf-period
            phrase: "a hundred milliseconds of wall time"
            targets: [picture]
          - id: cf-quota
            phrase: "fifty milliseconds of CPU time"
            targets: [picture]
          - id: cf-cpu
            phrase: "the quota runs out halfway across"
            targets: [picture]
          - id: cf-aggregate
            phrase: "Two threads can spend that same budget together"
            targets: [picture]
          - id: cf-equation
            phrase: "half a logical CPU in aggregate"
            caption_boundary: true
            targets: [picture]
          - id: cf-loop
            phrase: "keep going period after period"
            targets: [picture]
      - say: "Separately, bound the output, logs and memory of each job, and the number of jobs sharing the host. When thirty seconds of wall time elapse, the supervisor’s watchdog requests termination of the whole job. Now it has to verify what actually stopped."
        hold: 0.8
        visual_cues:
          - id: cf-bounds
            phrase: "bound the output, logs and memory"
            targets: [picture]
          - id: cf-deadline
            phrase: "thirty seconds of wall time elapse"
            targets: [picture]
