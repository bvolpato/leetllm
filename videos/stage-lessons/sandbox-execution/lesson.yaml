  - id: wasm-failure-matrix
    title: "At the last byte of a page"
    visual: "A four-byte window moves two addresses across the end of a fixed guest page. Growth and access have different outcomes. A separate host reader uses a scoped resource."
    beats:
      - say: "In the article’s bounded tests, a guest loop consumes its budget and raises an out-of-fuel trap. Put the loop in a start function and it traps during instantiation. Now look at one full page of guest memory. Ask for another page under the same one-page limit. Growth returns minus one. The guest can handle that return value."
