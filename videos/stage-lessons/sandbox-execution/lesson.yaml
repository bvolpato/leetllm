  - id: actual-wasm-host
    title: "One integer in, one integer out"
    visual: "The article’s import-free guest adds one to a signed integer. The ring crosses the signed limit, then the host sets fuel before instantiation."
    beats:
      - say: "Here is the article’s narrower job. The guest takes a signed thirty-two-bit integer and returns an integer of the same type. The host links no imports and allows at most one linear memory. It accepts integer forty-one. It rejects the Boolean true, even though Python treats true as a kind of integer. The host budgets one thousand fuel units for guest work, one memory page of sixty-four kibibytes, and four kibibytes of UTF-eight module text. Each limit applies to a different resource."
        hold: 0.75
        visual_cues:
          - id: wh-signature
            phrase: "takes a signed thirty-two-bit integer"
            targets: [picture]
          - id: wh-imports
            phrase: "links no imports"
