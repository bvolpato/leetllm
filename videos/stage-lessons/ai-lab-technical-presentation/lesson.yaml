  - id: path
    title: "Follow one partner runbook lookup"
    visual: "A request crosses authorization before the adapter reaches the store. Two page receipts keep the same source and request ID."
    beats:
      - say: "A support engineer opens a runbook in the support UI. Follow the request ID to the gateway. It checks tenant authorization before the adapter can use that tenant's credentials. The store belongs to the platform team. My instrumentation covers the call across that boundary. The trace records an ID and keeps the credentials private."
        hold: 0.7
        visual_cues:
          - id: ui
            phrase: "support UI"
            targets: [picture]
          - id: gateway
            phrase: "gateway"
            targets: [picture]
