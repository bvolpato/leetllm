            phrase: "wrote the contract"
            targets: [picture]
          - id: store
            phrase: "The platform team owns the tenant store"
            targets: [picture]
      - say: "To support the onboarding comparison, tell the panel what started and stopped the clock, how many sources you compared, and how complicated they were. The records show twenty days and six days. That's fourteen fewer days. A change in staffing or source difficulty could also explain part of the difference."
        hold: 0.85
