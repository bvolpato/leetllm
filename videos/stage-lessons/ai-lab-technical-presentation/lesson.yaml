            phrase: "Replay just the last response"
            targets: [picture]
          - id: terminal
            phrase: "null"
            targets: [picture]
          - id: done
            phrase: "Stop and report complete."
            targets: [picture]
            caption_boundary: true
  - id: tradeoff
    title: "Why keep the adapter in the gateway?"
    visual: "The adapter moves from a shared process to its own service. The same lookup now crosses a remote boundary to reach the same upstream source."
    beats:
      - say: "The interviewer asks why you kept the adapter in the gateway. We could ship the first migration together and debug one process. We accepted a risk. A busy adapter could starve its neighbors. Move it into a separate service. Now we can ship it separately and give it its own budget. Follow the lookup again. There's an extra network call to operate and recover when it fails."
        hold: 0.7
        visual_cues:
          - id: local
            phrase: "adapter in the gateway"
            targets: [picture]
          - id: risk
            phrase: "starve its neighbors"
            targets: [picture]
          - id: split
            phrase: "a separate service"
            targets: [picture]
          - id: isolates
            phrase: "ship it separately and give it its own budget"
            targets: [picture]
          - id: hop
            phrase: "extra network call"
            targets: [picture]
      - say: "What would make you revisit that choice? Suppose an engineer says the queue got slower. Start by locating the wait. If the source has a quota, moving the adapter leaves the same quota at the far end. Let's put times on that request."
        hold: 0.85
        visual_cues:
          - id: reverse
            phrase: "revisit that choice"
            targets: [picture]
          - id: quota
            phrase: "source has a quota"
            targets: [picture]
          - id: still
            phrase: "the same quota at the far end"
            targets: [picture]
  - id: source-wait
    title: "Would a service split shorten this lookup?"
    visual: "Two serial traces retain the same source wait. A second example shows how limiting one adapter to three of four workers lets another adapter run."
    beats:
      - say: "The source makes this lookup wait a thousand milliseconds. Everything else takes two hundred milliseconds. The whole request takes twelve hundred milliseconds. These are invented timings for one request whose steps run in sequence."
        hold: 0.65
        visual_cues:
