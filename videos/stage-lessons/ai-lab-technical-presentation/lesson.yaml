            targets: [picture]
      - say: "In this project I'd say, “I wrote the contract, the adapters, the gateway changes, the tests, and the trace instrumentation. The platform team owns the tenant store.” You can measure time across their interface and still give them credit for the implementation."
        hold: 0.55
