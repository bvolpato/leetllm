  - id: failure-invariant
    title: "What should the adapter do on page three?"
    visual: "A three-page trace returns a cursor from two pages ago. Replaying the same prefix with a terminal cursor produces the other valid stopping status."
    beats:
      - say: "Let's give your listener a harder trace. Start with an empty set. Page one returns C seventeen. Remember it. Use it to request page two. That returns a new cursor, C twenty-four. Now both cursors are in the set."
        hold: 0.65
        visual_cues:
          - id: first
            phrase: "C seventeen"
            targets: [picture]
          - id: save
            phrase: "Remember it"
            targets: [picture]
          - id: second
            phrase: "request page two"
            targets: [picture]
          - id: new
            phrase: "C twenty-four"
            targets: [picture]
          - id: both
            phrase: "both cursors are in the set"
            targets: [picture]
      - say: "We use the second cursor to request page three. The source sends back C seventeen. Do you send a fourth request, report complete, or report incomplete?"
        hold: 2.8
        visual_cues:
          - id: third
            phrase: "page three"
            targets: [picture]
          - id: repeat
            phrase: "C seventeen"
            targets: [picture]
          - id: ask
            phrase: "Do you send a fourth request, report complete, or report incomplete?"
            targets: [picture]
            caption_boundary: true
      - say: "You saw seventeen on page one. Checking only the last cursor would miss the cycle. Stop and report incomplete. Keep the source ID and the request ID with that failure."
        hold: 0.6
        visual_cues:
          - id: found
            phrase: "saw seventeen on page one"
            targets: [picture]
          - id: stop
            phrase: "Stop and report incomplete."
            targets: [picture]
            caption_boundary: true
      - say: "Replay just the last response. This time its next cursor is null. That's the contract's end marker. Stop and report complete. Both traces stop at page three. The status tells the caller whether it can trust the collection to be complete. Keep these cases as tests, and take a sanitized trace to the talk in case the live demo fails. One demo shows one execution."
        hold: 0.95
        visual_cues:
