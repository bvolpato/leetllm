            targets: [picture]
      - say: "Move the adapter to its own service. Keep the source wait and the other work fixed. We now have an extra twenty-millisecond remote call. What is the new total, with the source quota unchanged?"
        hold: 2.8
        visual_cues:
          - id: copy
