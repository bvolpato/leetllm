scenes:
  - id: opening
    title: "Would you defend this interview slide?"
    visual: "A presenter underlines the word saved on a draft slide. Two rows show twenty and six days of onboarding. The gap stays visible as the presenter revises the headline."
    beats:
      - say: "Would you defend this interview slide? My connector saved fourteen days. Each square marks one day of onboarding. The earlier group took twenty days. The later group took six."
        hold: 0.6
        caption_starts: ["My connector saved fourteen days.", "Each square marks one day"]
      - say: "Count the gap between the two rows. Fourteen days. How much of that gap can you credit to your connector?"
        hold: 2.6
        caption_starts: ["Fourteen days.", "How much of that gap"]
        visual_cues:
          - id: gap
            phrase: "Count the gap"
            targets: [picture]
          - id: ask
            phrase: "How much of that gap can you credit to your connector?"
            targets: [picture]
      - say: "Try this headline. Onboarding took fourteen fewer days in the groups we compared. I can show the adapter I built. To explain the gap, I'd compare source difficulty and staff time across the groups."
        hold: 1.1
        caption_starts: ["Onboarding took fourteen fewer days in the groups we compared.", "I can show the adapter I built.", "I'd compare source difficulty and staff time"]
        visual_cues:
          - id: scope
            phrase: "Onboarding took fourteen fewer days in the groups we compared"
            targets: [picture]
          - id: check
            phrase: "To explain the gap"
            targets: [picture]
  - id: format-contract
    title: "Which project fits this invitation?"
    visual: "A public study has a matched negative result. A private trace remains outside the presentation, even after its identifier is removed."
    beats:
      - say: "Read the invitation before you build the deck. Who's in the room? Do questions come out of your speaking time? Which projects, materials and tools does this team allow? Fifteen minutes is our practice slot. OpenAI and DeepMind both describe formats that vary by role or team."
        hold: 0.6
        visual_cues:
          - id: prompt
            phrase: "invitation"
            targets: [picture]
          - id: materials
            phrase: "materials and tools"
            targets: [picture]
      - say: "Suppose the panel asks for a public experiment. On the same forty examples, the baseline succeeded twenty-four times and your quantized model twenty-two. Two fewer out of forty is a drop of five percentage points. You can present the experiment and show the panel what you expected and what you saw. An infrastructure panel might ask about an operating decision instead."
        hold: 0.8
        visual_cues:
          - id: method
            phrase: "same forty examples"
            targets: [picture]
          - id: negative
            phrase: "a drop of five percentage points"
            targets: [picture]
            caption_boundary: true
          - id: project
            phrase: "present the experiment"
            targets: [picture]
      - say: "Now open the deployment trace. There's a tenant name in it. Even if you remove the identifier, you need approval for what you share and where you send it. Use approved aggregates or a sanitized diagram and say what you withheld. Choose another project if the evidence you can share loses its meaning. Check permission for the live interview separately. DeepMind's guide permits AI preparation and asks candidates to leave it out of live tasks unless instructed otherwise."
        hold: 0.7
        visual_cues:
          - id: private
            phrase: "deployment trace"
            targets: [picture]
          - id: redact
            phrase: "remove the identifier"
            targets: [picture]
          - id: upload
            phrase: "where you send it"
            targets: [picture]
          - id: policy
            phrase: "Check permission for the live interview"
            targets: [picture]
  - id: argument
    title: "Which details belong in the talk?"
    visual: "A six-sentence outline connects the presenter’s choice to a source receipt and the limits of a before-and-after comparison."
    beats:
      - say: "Try drafting six sentences before you open your slide editor. Here's our problem. Eight integrations each handled credentials and fetched pages of runbooks. The replacement had to keep each tenant's credentials separate and keep the lookup's ninety-fifth percentile below eight hundred milliseconds. I put source-specific adapters behind one contract inside the gateway."
        hold: 0.8
        visual_cues:
          - id: links
            phrase: "six sentences"
            targets: [picture]
          - id: sources
            phrase: "Eight integrations"
            targets: [picture]
          - id: constraint
            phrase: "keep each tenant's credentials separate"
            targets: [picture]
          - id: choice
            phrase: "one contract"
            targets: [picture]
      - say: "A separate service could ship independently, at the cost of a network call. A limit belongs in the outline too. A different mix of sources could help explain the shorter onboarding time. Now which detail lets a listener challenge the contract itself? Two page receipts with the same cursor let them see whether an adapter can mistakenly report a complete collection."
        hold: 0.8
        visual_cues:
          - id: split
            phrase: "separate service"
            targets: [picture]
          - id: cost
            phrase: "mix of sources"
            targets: [picture]
          - id: challenge
            phrase: "challenge the contract itself"
            targets: [picture]
          - id: receipt
            phrase: "page receipts with the same cursor"
            targets: [picture]
  - id: evidence-inventory
    title: "Whose work does this evidence show?"
    visual: "The onboarding history, contract test, and store-call span stay next to their owners and the claims each can support."
    beats:
      - say: "What would you open if someone interrupted here? For repeated integration work, open a source history. For a tenant-scoped lookup that failed, open a contract test. To establish where a real request spent time, open its trace. Those three artifacts answer different questions."
        hold: 0.55
        visual_cues:
