  - id: neural-gradient
    title: Which score should training raise?
    visual: Keep three probabilities on the same signed scale. Move the observed token’s marker one unit left to
      obtain its logit gradient. Carry that signed value into the two rows of a weight column, then follow the
      original weights back to an input feature.
    beats:
      - say: Here’s a smaller model with just three possible next tokens. It gives its biggest share to B. The record
          says C. If we want this model to give the recorded word more probability next time, which score needs
          a push up?
        hold: 2.1
        visual_cues:
          - id: gradient-target
            phrase: The record says C
            targets:
              - gradient-token-2
            color: yellow
            linger: 0.18
      - say: Look at C’s blue dot. Move one unit left from its probability. The new mark lands below zero, at minus
          point seven. Leave A and B where they are. These marks give the logit derivatives of the unweighted
          cross-entropy loss for this observation. Each is the predicted probability minus one for the recorded
          token, or minus zero for any other token. Gradient descent subtracts the derivative. If we adjusted
          the logits directly, subtracting C’s negative derivative would raise its score.
        hold: 0.8
        visual_cues:
          - id: gradient-subtract
            phrase: Move one unit left from its probability
            targets:
              - gradient-token-2
            color: yellow
            linger: 0.18
      - say: Follow C’s error back one more step. In this little affine head, two features feed each score. Multiply
          the gradient for C by each input feature. Two gives a weight gradient of minus one point four. Minus
          one flips the sign for the weight below. Each bias receives its output’s gradient directly. Apply the
          same multiplication to the other columns. Now every weight has a derivative for this example.
        hold: 0.75
        visual_cues:
          - id: gradient-column
            phrase: Multiply the gradient for C by each input feature
            targets:
              - gradient-column-2
            color: green
            linger: 0.18
          - id: gradient-all
            phrase: Apply the same multiplication to the other columns
            targets:
              - gradient-column-0
              - gradient-column-1
            color: green
            linger: 0.18
      - say: To get back to the first input feature, use the three weights across its row. Multiply each weight by its
          output gradient and add. A single feature helped produce all three scores, so all three terms count.
          In the larger model we trained, split the feature gradients back into the two embedding rows we looked
          up. Add the contributions whenever a row was used more than once. The lab averages the gradients from
          all six examples before it updates any parameter, using a learning rate of point four.
        hold: 0.8
        visual_cues:
          - id: gradient-input
            phrase: Multiply each weight by its output gradient and add
            targets:
              - gradient-back
            color: cyan
            linger: 0.18
