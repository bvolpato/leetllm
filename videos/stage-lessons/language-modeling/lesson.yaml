scenes:
  - id: intro
    title: What follows “The cat”?
    visual: A cursor waits after “The cat.” Three suggestions share a probability strip. The word “sat” moves to the cursor. Its share splits into two possible continuations.
    beats:
      - say: The cursor is after “The cat.” The model gives “sat” a sixty percent chance of coming next. “Slept” gets thirty percent. “Ate” gets ten.
        caption_starts:
          - The model gives
        hold: 0.5
        visual_cues:
          - id: intro-distribution
            phrase: gives “sat” a sixty percent chance
            targets:
              - intro-choices
            color: blue
            linger: 0.18
          - id: intro-slept
            phrase: Slept gets thirty percent
            targets:
              - intro-choices
            color: green
            linger: 0.18
          - id: intro-ate
            phrase: “Ate” gets ten
            targets:
              - intro-choices
            color: pink
            linger: 0.18
      - say: Suppose you always pick the widest strip. Which word goes on the page?
        hold: 2.4
      - say: Put “sat” on the page. Now the model reads three words. After “The cat sat,” end gets four fifths of the
          new row. “Beside” gets the rest. Look back at the original strip. What share goes through “sat” and
          then stops?
        caption_starts:
          - After “The cat sat,”
          - Look back at the original strip.
        hold: 2.8
        visual_cues:
          - id: intro-append
            phrase: Put sat on the page
            targets:
              - intro-selected-token
            color: yellow
            linger: 0.18
          - id: intro-next
            phrase: end gets four fifths of the new row
            targets:
              - intro-children
            color: yellow
            linger: 0.18
      - say: Only the blue part reached “sat.” Four fifths of that sixty percent gives forty-eight percent for “sat”
          followed by end. Each time we add a word, we have a new prefix and a new set of chances.
        caption_starts:
          - forty-eight percent
        hold: 1
        visual_cues:
          - id: intro-path
            phrase: Four fifths of that sixty percent gives forty-eight percent
            targets:
              - intro-joint
            color: yellow
            linger: 0.18
  - id: tokens
    title: Keep the prefix on this side
    visual: Whole-word toy tokens and invented IDs share aligned cards. A boundary separates The cat from the
      covered next token, then reveals the observed target.
    beats:
      - say: We'll use whole words as tokens. Their IDs select vocabulary entries. The prefix is the cat; cover the
          next word while predicting it. In this recorded sentence, the observed target is sat. Real
          tokenizers can use smaller text pieces.
        caption_starts:
          - In this recorded sentence,
        hold: 0.4
        visual_cues:
          - id: token-ids
            phrase: Their IDs select vocabulary entries
            targets:
              - token-ids
            color: blue
            linger: 0.3
          - id: token-target
            phrase: the observed target is sat
            targets:
              - token-target
            color: green
            linger: 0.4
  - id: counts
    title: Build a predictor from three observations
    visual: Three cat sentences contribute one adjacent pair at a time. Counts normalize, then a separate
      three-output add-one exercise gives the unseen ate candidate a real share.
    beats:
      - say: Start with three observations. First, the cat sat. Second, the cat sat again. Third, the cat slept.
          Collect the word immediately after cat each time. Two sat observations and one slept observation
          give us a bigram count row.
        hold: 0.4
        visual_cues:
          - id: count-first
            phrase: First, the cat sat
            targets:
              - count-row-0
              - count-bars
            color: blue
            linger: 0.15
          - id: count-second
            phrase: The cat sat again
            targets:
              - count-row-1
              - count-bars
            color: blue
            linger: 0.15
          - id: count-third
            phrase: The cat slept
            targets:
              - count-row-2
              - count-bars
            color: green
            linger: 0.3
      - say: Divide by the three observed transitions. Sat gets two thirds; slept gets one third. This count model
          remembers only the previous token, cat. Longer count models can keep more words of history.
        hold: 0.4
        visual_cues:
          - id: count-normalize
            phrase: Divide by the three observed transitions
            targets:
              - count-bars
              - count-total
            color: cyan
            linger: 0.4
      - say: Ate has count zero. For this separate smoothing exercise, only these three verbs are eligible. Add one to
          every count, then divide by six. Ate now has a share. A full vocabulary needs a pseudo-count for
          every eligible entry.
        hold: 0.4
        visual_cues:
          - id: count-unseen
            phrase: Ate has count zero
            targets:
              - count-ate
            color: pink
            linger: 0.2
          - id: count-smooth
            phrase: Add one to every count, then divide by six
            targets:
              - count-bars
              - count-total
            color: yellow
            linger: 0.4
