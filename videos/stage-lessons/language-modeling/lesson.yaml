  - id: sparse-history
    title: A longer history needs evidence
    visual: Split the “returns” row by its preceding word. Show the observed counts for each pair, then trace a missing pair back to the one-word row.
    beats:
      - say: In our six comments, a bigram pools all the words that followed “returns.” A trigram looks back
          one more word. After “function returns,” we saw “value” twice. After “test returns,” we saw “result”
          once and “error” once. An n-gram looks back n minus one tokens. With fifty thousand choices in each
          of four positions, there are six point two five times ten to the eighteenth possible sequences. A
          sparse table stores the sequences it sees.
        hold: 0.65
        visual_cues:
          - id: sparse-history-b1
            phrase: In our six comments, a bigram pools all the words that followed “returns.”
            targets:
              - sparse-history-construction
            color: blue
