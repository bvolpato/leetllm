    title: Which targets count toward the average?
    visual: Two equally padded rows hold four real targets. Each real target contributes its loss in bits. Pool
      the four targets, mark repeated window positions as context, then count the UTF-8 bytes of The cat sat for
      a common unit.
    beats:
      - say: These batches take up the same amount of space. Fill the first batch with one target and two padding
          slots. Fill the second with three targets. To make the losses easy to count, measure them in bits.
          Each block is one bit of surprise. One half costs one bit. One eighth costs three. What number should
          divide the total?
        hold: 2.4
        visual_cues:
          - id: pool-batches
            phrase: Fill the first batch with one target and two padding slots. Fill the second with three targets
            targets:
              - batch-a
              - batch-b
            color: blue
            linger: 0.18
          - id: pool-bits
            phrase: Each block is one bit of surprise. One half costs one bit. One eighth costs three
            targets:
              - batch-a
              - batch-b
            color: green
            linger: 0.18
      - say: Divide ten bits by four scored targets. That’s two and a half bits per target. We used base two, so raise
          two to that average for a perplexity of about five point seven. Averaging the two batch perplexities
          would give five. Giving each batch’s mean loss equal weight would give a perplexity of four. Batch B
          contains three of the four targets, so its losses need three places in the sum.
        hold: 0.7
        visual_cues:
          - id: pool-mean
            phrase: Divide ten bits by four scored targets
            targets:
              - pool-equation
            color: yellow
            linger: 0.18
      - say: A long document adds another wrinkle. Disjoint chunks lose earlier context at each cut. Here, position
          zero follows a start token. Slide the window and keep the overlapping positions as context. Look at
          position three. Its first appearance contributes a loss. Its second appearance helps predict later
          tokens. Keep one loss sum and one count across windows. Skip padding and ignored labels in both. A
          window with zero scored labels has no mean of its own.
        hold: 0.7
        visual_cues:
          - id: pool-stride
            phrase: Slide the window and keep the overlapping positions as context
            targets:
              - pool-windows
            color: green
            linger: 0.18
      - say: Go back to “The cat sat.” We can compare the two ways of scoring it in a common unit. Count the UTF-eight
          bytes, including both spaces. Each letter here takes one byte. The end token is scored in both
          versions and adds no text bytes. Divide total nats by the natural log of two to get bits, then divide
          by eleven bytes. Both scores give the same bits per byte. Keep the encoding, text boundaries and
          context policy fixed. Calibration and factual accuracy need separate checks.
        hold: 0.8
        visual_cues:
          - id: pool-bytes
            phrase: Count the UTF-eight bytes including both spaces
            targets:
