  - id: context
    title: Earlier words can change the scores
    visual: Tired and hungry select different supplied scalar embeddings. The same three-output head produces
      logits and probabilities while cat stays fixed.
    beats:
      - say: Compare the tired cat with the hungry cat. A bigram sees cat in both. Our tiny neural head also reads the
          adjective. I'll supply one-number embeddings and one shared score table. Multiply the tired
          embedding through that table, then apply softmax.
        hold: 0.4
        visual_cues:
          - id: context-head
            phrase: Multiply the tired embedding through that table
            targets:
              - context-head
              - context-distribution
            color: blue
            linger: 0.4
      - say: Replace tired with hungry. The embedding changes, the scores change, and ate takes the largest share.
          This is a constructed three-verb head. Larger neural models learn richer representations; shared
          parameters let evidence influence related contexts. Held-out predictions tell us how well that
          sharing generalizes.
        hold: 0.4
        visual_cues:
          - id: context-hungry
            phrase: Replace tired with hungry
            targets:
              - context-adjective
              - context-head
              - context-distribution
            color: pink
            linger: 0.4
  - id: neural-forward
    title: Why does the next word change?
    visual: Look up the two embeddings for “function returns” and assemble the score for “value.” Switch to “test returns” and put the two training comments beside their fitted next-word probabilities.
    beats:
      - say: "The complete article lab uses eight vocabulary words and six coordinates per embedding. Look up function
          and returns, concatenate their two rows into twelve features, and apply one shared twelve-by-eight
          affine map plus eight biases. That is forty-eight embedding parameters, ninety-six map parameters
          and eight biases: one hundred fifty-two trainable numbers. The original Bengio model also used a
          nonlinear tanh hidden route; this smaller lab deliberately omits it."
