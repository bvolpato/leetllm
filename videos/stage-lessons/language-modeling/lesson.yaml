  - id: loss
    title: What changes when “cat” becomes two tokens?
    visual: Each observed probability contributes a length in nats. Keep the total length fixed. Split only the
      cat segment into the losses of c and at, then compare the two target counts and per-token perplexities.
    beats:
      - say: These are the four probabilities from our sentence, including its stop. Which words cost the model the
          most? Take the negative natural log of each probability. That turns each one into a length measured in
          nats. Cat and sat use the most space because the model gave each of them only sixty percent. Divide
          the total by four scored targets to get the average loss per target.
        caption_starts:
          - Take the negative natural log
          - Cat and sat use the most space
        hold: 0.65
        visual_cues:
          - id: loss-terms
            phrase: Take the negative natural log of each probability
            targets:
              - loss-bars
            color: green
            linger: 0.18
          - id: loss-mean
            phrase: Divide the total by four scored targets
            targets:
              - loss-mean
            color: cyan
            linger: 0.18
      - say: Raise e to that average loss. The result is called perplexity. It’s the reciprocal of the geometric mean
          of those four target probabilities. For a model that gives every choice an equal share, perplexity
          tells you how many choices there are.
        hold: 0.75
        visual_cues:
          - id: loss-perplexity
            phrase: Raise e to that average loss
            targets:
              - loss-perplexity
            color: cyan
            linger: 0.18
      - say: Copy the strip. In the copy, score “c” and then “at” in place of “cat.” Give the first piece a
          probability of three quarters and the next four fifths. Their product is the sixty percent we started
          with. We keep the other factors the same. Our cut runs through just the green segment. Both strips
          still end at the same place. Will the perplexity per token stay the same?
        caption_starts:
          - Give the first piece
          - Both strips still end
        hold: 2.8
        visual_cues:
          - id: loss-resegment
            phrase: Give the first piece a probability of three quarters and the next four fifths
            targets:
              - loss-resegmentation
            color: green
            linger: 0.18
      - say: Divide that same length by five targets this time. The average gets smaller, so perplexity falls. Both
          versions assigned exactly the same probability to the text and its stop. Before you use a lower token
          perplexity to choose a model, check the tokenizer, the evaluation text, the context and which targets
          were scored.
        caption_starts:
          - The average gets smaller
        hold: 0.9
        visual_cues:
          - id: loss-five
            phrase: Divide that same length by five targets this time
            targets:
              - loss-divisor
            color: cyan
            linger: 0.18
