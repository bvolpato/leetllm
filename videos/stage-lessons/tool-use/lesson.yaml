      - say: Tool use joins a language model to software through a controlled request boundary. The model chooses a
          proposal. The runtime validates its structure and permission, performs a bounded operation, and
          records an observation with the identity needed to continue the conversation.
        hold: 0.55
        visual_cues:
          - id: transfer-beat-1-focus-1
            phrase: Tool use joins a language model to software
            targets:
              - transfer-call-0
              - transfer-call-1
              - transfer-call-2
              - transfer-call-3
              - transfer-call-4
            color: blue
            linger: 0.6
      - say: Enforce attempt, time, and spending limits outside the prompt. Reserve an attempt before dispatch, count
          failures as attempts, and make timeout behavior explicit. Independent authorized reads can sometimes
          run together, while dependent or conflicting writes need deliberate ordering.
        hold: 0.75
        visual_cues:
          - id: transfer-beat-2-focus-1
            phrase: Enforce attempt, time, and spending limits outside the prompt
            targets:
              - transfer-attempts
              - transfer-clock
              - transfer-spending
            color: blue
            linger: 0.6
          - id: transfer-reserve-attempt
            phrase: Reserve an attempt before dispatch
            targets:
              - transfer-attempts
              - transfer-spending
              - transfer-first-attempt
            color: blue
            linger: 0.65
          - id: transfer-count-failure
            phrase: count failures as attempts
            targets:
              - transfer-first-attempt
              - transfer-attempts
              - transfer-clock
              - transfer-spending
            color: pink
            linger: 0.65
          - id: transfer-timeout
            phrase: make timeout behavior explicit
            targets:
              - transfer-timeout-state
              - transfer-clock
              - transfer-attempts
              - transfer-spending
            color: pink
            linger: 0.65
          - id: transfer-independent-reads
            phrase: Independent authorized reads can sometimes run together
            targets:
              - transfer-parallel-reads
            color: cyan
            linger: 0.65
          - id: transfer-order-writes
            phrase: dependent or conflicting writes need deliberate ordering
            targets:
              - transfer-ordered-writes
            color: yellow
            linger: 0.65
      - say: When reviewing a tool-using assistant, follow one call across the whole round trip. Check what it
          requested, why the runtime admitted it, what the service returned, and whether the final answer or
          claimed effect agrees with independently observed state.
        hold: 0.55
        visual_cues:
          - id: transfer-beat-3-focus-1
            phrase: When reviewing a tool-using assistant
            targets:
              - transfer-call-0
              - transfer-call-2
              - transfer-call-4
              - transfer-observed-answer
            color: blue
            linger: 0.6
  - id: fresh-comparison
    title: Which release scored higher on Q1?
    visual: >-
      File immutable score receipts by suite and release. Fill the empty B/Q1 cell with a new authorized read,
      measure A minus B across that row, then run both promotion proposals through the same read-only session.
    beats:
      - say: >-
          You’re on the release desk. You can read evaluations for A and B. Which release scored higher on suite Q
          one? File the first receipt under A. It scored zero point eight six on Q one. B scored zero point eight
          nine on Q two. You have one more read. Which release and suite would you ask for?
        hold: 2.5
        caption_starts:
          - "It scored zero point eight six on Q one."
          - "B scored zero point eight nine on Q two."
          - "You have one more read."
        visual_cues:
          - id: fresh-a
            phrase: "It scored zero point eight six on Q one"
            targets: [fresh-a-cell]
            color: blue
            linger: 0.35
          - id: fresh-b
            phrase: "B scored zero point eight nine on Q two"
            targets: [fresh-b-other]
            color: blue
            linger: 0.35
          - id: fresh-ask
            phrase: "Which release and suite would you ask for"
            targets: [fresh-grid]
            color: yellow
            linger: 0.35
      - say: >-
          B’s score on Q two leaves a hole in the Q one row. Read B on Q one. Give the new call its own number,
          and leave the old receipt where it is. B returns zero point eight three and its gate passed. Subtract
          B’s score from A’s. A leads by zero point zero three on Q one. That’s the comparison these two receipts
          support.
        hold: 1.2
        visual_cues:
          - id: tu-fresh-suite-denial
            phrase: "B’s score on Q two leaves a hole in the Q one row"
            targets: [fresh-grid]
            color: yellow
            linger: 0.35
            caption_boundary: true
          - id: tu-fresh-read-repair
            phrase: "Read B on Q one"
            targets: [fresh-b-cell]
            color: blue
            linger: 0.35
          - id: tu-fresh-new-score
            phrase: "B returns zero point eight three and its gate passed"
            targets: [fresh-b-cell]
            color: cyan
            linger: 0.35
            caption_boundary: true
          - id: fresh-subtract
            phrase: "Subtract B’s score from A’s"
            targets: [fresh-grid]
            color: cyan
            linger: 0.35
          - id: tu-fresh-delta
            phrase: "A leads by zero point zero three on Q one"
            targets: [fresh-calculation]
            color: cyan
            linger: 0.35
            caption_boundary: true
      - say: >-
          Someone asks the assistant to promote A. Its proposal names the release and adds an argument, approved
          equals true. The host rejects the extra field. Take that field off. The request now has exactly the
          shape the promotion tool expects. With this session, can the host send the write?
        hold: 2.2
        visual_cues:
          - id: fresh-proposal
            phrase: "Its proposal names the release and adds an argument"
            targets: [fresh-policy]
            color: blue
            linger: 0.35
          - id: tu-fresh-deny-extra
            phrase: "The host rejects the extra field"
            targets: [fresh-policy]
            color: yellow
            linger: 0.35
            caption_boundary: true
          - id: fresh-remove-extra
            phrase: "Take that field off"
            targets: [fresh-policy]
            color: blue
            linger: 0.35
          - id: fresh-write-question
            phrase: "With this session, can the host send the write"
            targets: [fresh-policy]
            color: yellow
            linger: 0.35
      - say: >-
          The host stops at the role check. The promotion count stays at zero. Follow the Q one row from
          receipt C thirty-one to C thirty-three. Those two reads support the answer. A scored higher by three
          hundredths. Another app can use MCP to call the same evaluation tool with its own reader’s permissions.
        hold: 1.5
        caption_starts: ["Follow the Q one row from receipt C thirty-one to C thirty-three."]
        visual_cues:
          - id: fresh-deny-role
            phrase: "The host stops at the role check"
            targets: [fresh-policy]
            color: yellow
            linger: 0.35
            caption_boundary: true
          - id: fresh-report
            phrase: "Follow the Q one row from receipt C thirty-one to C thirty-three"
            targets: [fresh-grid, fresh-calculation]
            color: cyan
            linger: 0.35
