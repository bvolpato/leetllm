  - id: required-fan-in
    title: Which release can the engineer select?
    visual: Keep the two required release slots fixed. Compare the same local reads with a timeout, a complete pair, and a duplicate call ID. Show each returned error rate against the common budget.
    beats:
      - say: >-
          The engineer asks for a comparison of versions sixteen and seventeen. The host marks those two reads as
          required before either runs. It can launch both authorized reads together. Seventeen comes back clean,
          with nine errors per thousand requests. The limit is twenty. Sixteen’s lookup times out. Can the
          engineer pick a candidate from this pair?
        hold: 2.15
        visual_cues:
          - id: join-launch
            phrase: "launch both authorized reads together"
            targets: [join-pair]
            color: blue
            linger: 0.35
          - id: join-seventeen
            phrase: "Seventeen comes back clean, with nine errors per thousand requests"
            targets: [join-b]
            color: cyan
            linger: 0.35
          - id: join-first-timeout
            phrase: "Sixteen’s lookup times out"
            targets: [join-a]
            color: yellow
            linger: 0.35
          - id: join-partial-question
            phrase: "Can the engineer pick a candidate from this pair"
            targets: [join-pair, join-decision]
            color: yellow
            linger: 0.35
      - say: >-
          The comparison has to wait. Seventeen’s low rate tells us nothing about sixteen’s missing result. File
          the timeout under its own call number. The host records a timeout or a dropped connection as a failed
          read and lets unexpected programming errors surface. While one read waits, the other can finish.
        hold: 0.95
        visual_cues:
          - id: join-wait
            phrase: "The comparison has to wait"
            targets: [join-decision]
            color: yellow
            linger: 0.35
            caption_boundary: true
      - say: >-
          Try the same two calls again in a separate run. This time sixteen returns its record. Its canary failed
          with eighty-one errors per thousand. Seventeen is still clean at nine. With both results in their
          slots, keep the clean releases within budget, then choose the one with the lowest error rate. Which
          version qualifies?
        hold: 2.1
        caption_starts:
          - "Its canary failed with eighty-one errors per thousand."
          - "Which version qualifies?"
        visual_cues:
          - id: join-complete
            phrase: "sixteen returns its record"
            targets: [join-a]
            color: blue
            linger: 0.35
          - id: join-sixteen
            phrase: "Its canary failed with eighty-one errors per thousand"
            targets: [join-a]
            color: cyan
            linger: 0.35
          - id: join-compare
            phrase: "With both results in their slots"
            targets: [join-pair]
            color: cyan
            linger: 0.35
      - say: >-
          Seventeen qualifies. That selects a candidate. Sending a promotion still requires current policy and
          trusted approval. Now change just the second receipt. Suppose another copy of the first reply arrives
          in its place. There are still two replies. Can they fill the two required slots?
        hold: 2
        visual_cues:
          - id: join-select
            phrase: "Seventeen qualifies"
            targets: [join-decision]
            color: cyan
            linger: 0.35
            caption_boundary: true
          - id: join-duplicate
            phrase: "another copy of the first reply arrives in its place"
            targets: [join-b]
            color: blue
            linger: 0.35
          - id: join-duplicate-question
            phrase: "Can they fill the two required slots"
            targets: [join-pair, join-decision]
            color: yellow
            linger: 0.35
      - say: >-
          Both copies carry call one. The slot for call two is empty. The host checks for exactly one reply per
          required call, a matching release, and a success flag that is literally Boolean true. An extra
          exploratory lookup can fail without blocking a comparison that never needed it. Cap concurrency, keep
          one deadline for the task, and wait for every required read before acting on the result.
        hold: 1.25
        visual_cues:
          - id: join-duplicate-verdict
            phrase: "The slot for call two is empty"
            targets: [join-pair, join-decision]
            color: yellow
            linger: 0.35
            caption_boundary: true
  - id: permission-before-ranking
    title: Which tools reach this model turn?
    visual: >-
      Filter the catalog for a triage session. Project each permitted unit vector onto the query axis, select one
      tool, and leave the unfilled task requirement visible.
    beats:
      - say: >-
          Here are four tools in the host’s catalog. This caller has triage access. Filter by role and resource
          scope first. Even a tool description can disclose information. That leaves the status and policy reads.
          With two slots both reach the model. Check permission again when a call comes back. We’ll use
          hand-picked coordinates to see what happens when there’s just one slot.
