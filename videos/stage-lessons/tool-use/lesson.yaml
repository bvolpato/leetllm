        visual_cues:
          - id: tu-permission-before-ranking-1
            phrase: "four tools in the host’s catalog"
            targets: [tu-permission-before-ranking-mechanism]
            color: blue
            linger: 0.35
          - id: tu-rank-permission
            phrase: "Filter by role and resource scope first"
            targets: [tu-permission-before-ranking-mechanism]
            color: cyan
            linger: 0.35
      - say: >-
          Represent a tool and a query as arrows. Cosine similarity compares their directions. Normalize each
          arrow, then multiply matching coordinates and add. That sum is their dot product. To normalize, divide
          by the vector’s length, the square root of the sum of its squared coordinates. Our helper takes three
          finite numbers. It first rescales by the largest absolute coordinate to prevent overflow, and clamps the
          final cosine to the range from minus one to one. A zero vector has no direction, so the helper rejects
          it.
        hold: 1
        visual_cues:
          - id: tu-permission-before-ranking-2
            phrase: "Cosine similarity compares their directions"
            targets: [tu-permission-before-ranking-mechanism]
            color: blue
            linger: 0.35
          - id: tu-rank-dot
            phrase: "multiply matching coordinates and add"
            targets: [tu-permission-before-ranking-mechanism]
            color: cyan
            linger: 0.35
          - id: tu-rank-norm
            phrase: "the square root of the sum of its squared coordinates"
            targets: [tu-permission-before-ranking-mechanism]
            color: cyan
            linger: 0.35
          - id: tu-rank-zero
            phrase: "A zero vector has no direction"
            targets: [tu-permission-before-ranking-mechanism]
            color: yellow
            linger: 0.35
      - say: >-
          The query points straight to the right. Both permitted arrows already have length one. Drop a line from
          A to the horizontal axis. It lands at zero point six. Do the same for B. It lands at zero point eight.
          Those horizontal distances are the two cosine scores. The write tool points straight along the query,
          but it was removed before scoring. There’s one slot, and the job needs both reads. Which tool fills the
          slot, and can the job finish?
        hold: 2.2
        caption_starts:
          - "It lands at zero point six."
          - "It lands at zero point eight."
          - "Which tool fills the slot, and can the job finish?"
        visual_cues:
          - id: rank-query
            phrase: "The query points straight to the right"
            targets: [rank-axis]
            color: blue
            linger: 0.35
          - id: rank-project-a
            phrase: "Drop a line from A to the horizontal axis"
            targets: [rank-axis]
            color: blue
            linger: 0.35
          - id: rank-score-a
            phrase: "It lands at zero point six"
            targets: [rank-axis]
            color: cyan
            linger: 0.35
          - id: rank-project-b
            phrase: "Do the same for B"
            targets: [rank-axis]
            color: blue
            linger: 0.35
          - id: rank-score-b
            phrase: "It lands at zero point eight"
            targets: [rank-axis]
            color: cyan
            linger: 0.35
          - id: rank-slot
            phrase: "Which tool fills the slot, and can the job finish"
            targets: [rank-options, rank-axis]
            color: yellow
            linger: 0.35
      - say: >-
          B gets the slot. It can read the policy. The job also needs A to fetch the status. With one required
          tool missing, the job cannot finish. Check which required tools were retrieved and whether the task
          completed, alongside the relevance of each result.
        hold: 1.15
