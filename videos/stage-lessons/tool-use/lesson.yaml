scenes:
  - id: subject-intro
    title: Is River Walk available today?
    visual: >-
      A lookup slip slides out beside the book jacket. Follow read-7 to the library catalog and back to
      Lena’s app. Fill the copy count when the call IDs match. Keep the reservation field separate.
    beats:
      - say: >-
          The model asks for River Walk by its book number, B seven. Can Lena tell how many copies are
          available yet?
        hold: 2.2
        caption_starts: ["Can Lena tell how many copies are available yet?"]
        visual_cues:
          - id: intro-request
            phrase: "The model asks for River Walk"
            targets: [intro-slip]
            color: blue
            linger: 0.35
          - id: intro-count-question
            phrase: "Can Lena tell how many copies are available yet"
            targets: [intro-answer]
            color: yellow
            linger: 0.35
      - say: >-
          She needs the library’s reply. The lookup tool reads the catalog. Lena’s app checks the book number and
          her permission to read the entry, then sends the lookup to the library. The catalog shows three copies. The reply
          carries the same call ID as the request. When those IDs match, the model can tell Lena that three
          copies are available.
        hold: 1.1
        visual_cues:
          - id: intro-dispatch
            phrase: "sends the lookup to the library"
            targets: [intro-slip]
            color: blue
            linger: 0.35
          - id: intro-copies
            phrase: "The catalog shows three copies"
            targets: [intro-shelf]
            color: cyan
            linger: 0.35
            caption_boundary: true
          - id: intro-return
            phrase: "The reply carries the same call ID as the request"
            targets: [intro-slip]
            color: cyan
            linger: 0.35
          - id: intro-link
            phrase: "When those IDs match"
            targets: [intro-answer, intro-slip]
            color: cyan
            linger: 0.35
      - say: >-
          Lena wants one of those copies. Look at the reservation field. Did the lookup put a copy aside for her?
        hold: 2.1
        visual_cues:
          - id: intro-hold-question
            phrase: "Look at the reservation field"
            targets: [intro-answer]
            color: yellow
            linger: 0.35
      - say: >-
          The lookup checked availability. A hold is a different tool call. The app checks permission for that
          write. Lena gets a reservation number when the library records the hold.
        hold: 1
        visual_cues:
          - id: intro-hold
            phrase: "A hold is a different tool call"
            targets: [intro-answer]
            color: yellow
            linger: 0.35
            caption_boundary: true
  - id: release-observation
    title: Why did the canary fail?
    visual: >-
      File the release-status reply against status-1. Place its error budget on a fixed percent ruler before
      plotting the returned rate and reading the gap.
    beats:
      - say: >-
          Why did the canary for reranker version sixteen fail?
          The assistant proposes a status lookup. The host checks the arguments and the engineer’s project, reads
          the release service, and files the reply under the call number, status one.
        hold: 0.8
        visual_cues:
          - id: release-propose
            phrase: "proposes a status lookup"
            targets: [release-slip]
            color: blue
            linger: 0.35
          - id: release-read
            phrase: "reads the release service"
            targets: [release-slip]
            color: blue
            linger: 0.35
          - id: release-file
            phrase: "files the reply under the call number, status one"
            targets: [release-slip]
            color: cyan
            linger: 0.35
      - say: >-
          Here’s what came back from our example service. The canary failed. The allowed error rate was two
          percent. Keep your eye on that mark. The observed error rate was eight point one percent. By how many
          percentage points did the canary exceed its budget?
        hold: 2
        caption_starts:
          - "The observed error rate was eight point one percent."
          - "By how many percentage points did the canary exceed its budget?"
        visual_cues:
          - id: release-status
            phrase: "The canary failed"
            targets: [release-slip]
            color: cyan
            linger: 0.35
            caption_boundary: true
          - id: release-budget
            phrase: "The allowed error rate was two percent"
            targets: [release-ruler]
            color: yellow
            linger: 0.35
          - id: release-rate
            phrase: "The observed error rate was eight point one percent"
            targets: [release-ruler]
            color: blue
            linger: 0.35
          - id: release-ask
            phrase: "By how many percentage points did the canary exceed its budget"
            targets: [release-ruler]
            color: yellow
            linger: 0.35
      - say: >-
          It exceeded its error budget by six point one percentage points. The second model turn can use those
          two fields to explain the failure. To find which change caused the errors, the engineer would need more evidence.
        hold: 1.1
        visual_cues:
          - id: release-gap
            phrase: "It exceeded its error budget by six point one percentage points"
            targets: [release-ruler]
            color: cyan
            linger: 0.35
            caption_boundary: true
      - say: >-
          Here, the application ran the tool with its own service credentials. A provider can run a hosted tool
          inside its service. Check where the call runs, what data crosses that boundary, and what those
          credentials can reach. The host also has to handle a direct answer, several proposed calls, an invalid
          request, or a refusal.
        hold: 0.9
        visual_cues:
          - id: release-host
            phrase: "A provider can run a hosted tool inside its service"
            targets: [release-executor]
            color: blue
            linger: 0.35
  - id: request-envelope
    title: Make the proposal explicit
    visual: A model turn constructs a complete tool name, book identifier, and call identifier in a bounded envelope.
    beats:
      - say: The host starts by describing its available tools. Our lookup needs a tool name and one book identifier.
          A returned call also has an identifier linking it to its eventual result. Those fields form a
          proposal that the dispatcher can inspect.
        hold: 0.55
        visual_cues:
          - id: request-envelope-beat-1-focus-1
            phrase: The host starts by describing its available tools
            targets:
              - request-envelope-fields
              - request-envelope-object-collected-128-bytes-6
            color: blue
            linger: 0.6
      - say: The host waits for a complete call before execution. Streaming text may arrive in fragments, and an early
          fragment can resemble a valid request while its arguments remain incomplete. Apply size limits while
          collecting it and handle refusal or malformed output explicitly.
        hold: 0.75
        visual_cues:
          - id: request-envelope-beat-2-focus-1
            phrase: Apply size limits while collecting it and handle
            targets:
              - request-envelope-fields
              - request-envelope-object-collected-128-bytes-6
            color: blue
            linger: 0.6
      - say: Tool-call envelopes differ across APIs. Use the fields documented for the actual endpoint, then adapt
          them into the runtime's internal record. Our displayed envelope is a teaching contract. Guessing a
          universal text delimiter would make parsing and result linkage fragile.
        hold: 0.55
        visual_cues:
          - id: request-envelope-beat-3-focus-1
            phrase: Tool-call envelopes differ across APIs
            targets:
              - request-envelope-fields
              - request-envelope-object-collected-128-bytes-6
            color: blue
            linger: 0.6
  - id: provider-linkage
    title: Attach each observation to its real provider call identity
    visual: Construct endpoint-specific proposal/result pairs with independent item IDs and call IDs, then swap
      one identifier and visibly reject the mismatched continuation.
    beats:
      - say: In OpenAI Responses, a function-call item has a name, JSON-string arguments, an item I D and a separate
          call I D. Function-call output links with the call I D. In the article fixture, the item is f c
          underscore item underscore one, while the call is status dash one. Attaching a result to the item
          identifier would create the wrong link.
        hold: 0.7
        visual_cues:
          - id: tu-provider-linkage-1
            phrase: In OpenAI Responses, a function-call item has a name, JSON-string arguments, an item I D and a
              separate call I D
            targets:
              - tu-provider-linkage-mechanism
            color: cyan
            linger: 0.4
          - id: tu-response-call-link
            phrase: Function-call output links with the call I D
            targets:
              - tu-provider-linkage-mechanism
            color: cyan
            linger: 0.4
          - id: tu-response-wrong-id
            phrase: Attaching a result to the item identifier would create the wrong link
            targets:
              - tu-provider-linkage-mechanism
            color: cyan
            linger: 0.4
      - say: Chat Completions instead returns an assistant tool-calls entry with its I D and function arguments. The
          application replies with a tool message whose tool-call I D matches. Claude Messages returns a
          tool-use block with object-valued input; a tool-result block names its tool-use I D inside the next
          user message, before any new text.
        hold: 0.7
        visual_cues:
          - id: tu-provider-linkage-2
            phrase: Chat Completions instead returns an assistant tool-calls entry with its I D and function arguments
            targets:
              - tu-provider-linkage-mechanism
            color: cyan
            linger: 0.4
          - id: tu-chat-call-link
            phrase: tool-call I D matches
            targets:
              - tu-provider-linkage-mechanism
            color: cyan
            linger: 0.4
          - id: tu-claude-result-link
            phrase: a tool-result block names its tool-use I D inside the next user message, before any new text
            targets:
              - tu-provider-linkage-mechanism
            color: cyan
            linger: 0.4
      - say: Gemini Interactions returns a function-call step with object-valued arguments. Return a function-result
          step with its name, call I D equal to the call step I D, and result content blocks. Stateful
          continuation can use previous interaction I D; stateless continuation preserves the returned steps,
          including thoughts. Preserve each endpoint’s required history rather than flattening every API into
          one tool-message format.
        hold: 0.7
        visual_cues:
          - id: tu-provider-linkage-3
            phrase: Gemini Interactions returns a function-call step with object-valued arguments
            targets:
              - tu-provider-linkage-mechanism
            color: green
            linger: 0.4
          - id: tu-gemini-result-link
            phrase: call I D equal to the call step I D
            targets:
              - tu-provider-linkage-mechanism
            color: cyan
            linger: 0.4
          - id: tu-gemini-history
            phrase: including thoughts
            targets:
              - tu-provider-linkage-mechanism
            color: cyan
            linger: 0.4
  - id: complete-batch
    title: Collect and validate the whole batch before dispatch
    visual: Accumulate bounded UTF-8 argument fragments for two calls. Mark response completion and each call
      completion separately, then reject a batch whose later call is incomplete before dispatching its earlier
      valid call.
    beats:
      - say: The article adapter requires response status completed and each function-call status completed. It
          rejects missing, empty or duplicate call identifiers, a tool outside the allowlist, and arguments
          that are not a string within two thousand forty-eight UTF-8 bytes. It then validates arguments with
          the strict application model. These are independent gates before any authorization or service
          execution.
        hold: 0.7
        visual_cues:
          - id: tu-complete-batch-1
            phrase: The article adapter requires response status completed and each function-call status completed
            targets:
              - tu-complete-batch-mechanism
            color: cyan
            linger: 0.4
          - id: tu-batch-response-complete
            phrase: response status completed and each function-call status completed
            targets:
              - tu-complete-batch-mechanism
            color: cyan
            linger: 0.4
          - id: tu-batch-byte-limit
            phrase: two thousand forty-eight UTF-8 bytes
            targets:
              - tu-complete-batch-mechanism
            color: cyan
            linger: 0.4
      - say: Watch the second call. Its tool name is complete. Its release ID field stops at the colon, before
          the value. The adapter rejects the whole batch. The first call never reaches the service.
          While fragments arrive, the host also caps the number of bytes it collects.
        hold: 0.7
        visual_cues:
          - id: tu-complete-batch-2
            phrase: Watch the second call
            targets:
              - tu-complete-batch-mechanism
            color: cyan
            linger: 0.4
          - id: tu-batch-late-invalid
            phrase: The adapter rejects the whole batch
            targets:
              - tu-complete-batch-mechanism
            color: cyan
            linger: 0.4
      - say: A zero-call response needs ordinary answer or refusal handling. Preserve non-call output items in
          conversation history where the endpoint requires them. When several calls pass validation, keep
          their IDs distinct. The host checks permission for each call and schedules the ones it allows.
        hold: 0.7
        visual_cues:
          - id: tu-complete-batch-3
            phrase: A zero-call response needs ordinary answer or refusal handling
            targets:
              - tu-complete-batch-mechanism
            color: green
            linger: 0.4
          - id: tu-batch-zero-calls
            phrase: A zero-call response needs ordinary answer or refusal handling
            targets:
              - tu-complete-batch-mechanism
            color: cyan
            linger: 0.4
  - id: schema-validation
    title: Check shape before touching a resource
    visual: A string book ID passes; a numeric ID and a surprise write field take visible rejection branches.
    beats:
      - say: A JSON schema describes the shape of accepted arguments. Here book ID must be a nonempty string, and no
          extra fields are accepted. The runtime parses and validates the model's arguments before trying to
          resolve that resource.
        hold: 0.55
        visual_cues:
          - id: schema-validation-beat-1-focus-1
            phrase: A JSON schema describes the shape of accepted arguments
            targets:
              - schema-contract
              - schema-valid
            color: blue
            linger: 0.6
      - say: Watch a numeric identifier fail the type rule. Then watch a request with a surprise place-hold field fail
          the extra-field rule. Both rejections keep an availability lookup narrow. A model cannot add a new
          capability by inventing another argument.
        hold: 0.75
        visual_cues:
          - id: schema-validation-beat-2-focus-1
            phrase: Watch a numeric identifier fail the type rule
            targets:
              - schema-numeric
              - schema-contract
            color: blue
            linger: 0.6
          - id: schema-extra-field
            phrase: Then watch a request with a surprise place-hold field fail the extra-field rule
            targets:
              - schema-extra-field
              - schema-contract
            color: pink
            linger: 0.65
      - say: Shape validation still leaves meaning to check. A string can name a missing book or a resource outside
          this caller's account. Keep structured validation errors bounded, and distinguish a correctable
          argument problem from a policy denial that another spelling will not fix.
        hold: 0.55
        visual_cues:
          - id: schema-validation-beat-3-focus-1
            phrase: Shape validation still leaves meaning to check
            targets:
              - schema-resource-meaning
              - schema-valid
            color: blue
            linger: 0.6
  - id: strict-contract
    title: Represent optional values without permitting surprise authority
    visual: Build the release_id and include_gates schema, then compare omission, null, true, numeric one, an
      extra field and an invalid identifier through exact Pydantic checks.
    beats:
      - say: The complete release contract accepts a release identifier of one to one hundred twenty-eight ASCII
          letters, digits, periods, underscores or hyphens, beginning with a letter or digit. Pydantic strict
          mode rejects coercion for these strings and Booleans, while extra forbid rejects unknown fields.
          Strict behavior is type-specific; JSON date strings can still be valid for date types.
        hold: 0.7
        visual_cues:
          - id: tu-strict-contract-1
            phrase: The complete release contract accepts a release identifier of one to one hundred twenty-eight ASCII
              letters, digits, periods, underscores or hyphens, beginning with a letter or digit
            targets:
              - tu-strict-contract-mechanism
            color: cyan
            linger: 0.4
          - id: tu-strict-identifier
            phrase: beginning with a letter or digit
            targets:
              - tu-strict-contract-mechanism
            color: cyan
            linger: 0.4
          - id: tu-strict-extra
            phrase: extra forbid rejects unknown fields
            targets:
              - tu-strict-contract-mechanism
            color: cyan
            linger: 0.4
      - say: The logical application model allows include gates to be omitted or null. Only the actual Boolean true
          requests gate details; numeric one is rejected. In the documented OpenAI strict schema, every
          property is required, so represent the optional value as Boolean or null and set additional
          properties false on each object. Generation constraints still leave semantic value and permission
          checks to the host.
        hold: 0.7
        visual_cues:
          - id: tu-strict-contract-2
            phrase: The logical application model allows include gates to be omitted or null
            targets:
              - tu-strict-contract-mechanism
            color: cyan
            linger: 0.4
          - id: tu-strict-null
            phrase: allows include gates to be omitted or null
            targets:
              - tu-strict-contract-mechanism
            color: cyan
            linger: 0.4
          - id: tu-strict-bool
            phrase: Only the actual Boolean true requests gate details; numeric one is rejected
            targets:
              - tu-strict-contract-mechanism
            color: cyan
            linger: 0.4
          - id: tu-strict-required-null
            phrase: represent the optional value as Boolean or null and set additional properties false on each object
            targets:
              - tu-strict-contract-mechanism
            color: cyan
            linger: 0.4
      - say: The two article parsers have different duplicate-key behavior. The reader’s JSON dispatcher explicitly
          rejects duplicate argument fields using an object-pairs hook. Do not infer that a strict type schema
          alone supplies that policy. Default Python JSON keeps the last duplicate value; differing parser
          policies can make components validate and execute different apparent requests.
        hold: 0.7
        visual_cues:
          - id: tu-strict-contract-3
            phrase: The two article parsers have different duplicate-key behavior
            targets:
              - tu-strict-contract-mechanism
            color: green
            linger: 0.4
          - id: tu-duplicate-reader
            phrase: explicitly rejects duplicate argument fields using an object-pairs hook
            targets:
              - tu-strict-contract-mechanism
            color: cyan
            linger: 0.4
          - id: tu-duplicate-default
            phrase: Default Python JSON keeps the last duplicate value
            targets:
              - tu-strict-contract-mechanism
            color: cyan
            linger: 0.4
  - id: tool-choice
    title: Let a required call finish as an answer on a later turn
    visual: Apply auto, required, none and forced-function controls to successive generation turns while leaving
      runtime permission unchanged.
    beats:
      - say: Tool choice controls generation for this turn. Auto permits an answer or one or more calls. Required
          demands one or more calls. None disables calls, and a forced-function setting names a specific
          function where supported. Set a required call only on the turn that needs it, then allow an answer;
          leaving calls required can prevent completion.
        hold: 0.7
        visual_cues:
          - id: tu-tool-choice-1
            phrase: Tool choice controls generation for this turn
            targets:
              - tu-tool-choice-mechanism
            color: cyan
            linger: 0.4
          - id: tu-choice-required-turn
            phrase: Set a required call only on the turn that needs it, then allow an answer
            targets:
              - tu-tool-choice-mechanism
            color: cyan
            linger: 0.4
          - id: tu-choice-loop
            phrase: leaving calls required can prevent completion
            targets:
              - tu-tool-choice-mechanism
            color: cyan
            linger: 0.4
      - say: OpenAI Responses and Chat Completions use different forced-function envelopes. Claude uses a type field
          with auto, any, tool or none, and some models or thinking settings reject the forcing modes. Check
          the selected endpoint and model. A generation setting does not dispatch the function or prove that
          its requested effect is allowed.
        hold: 0.7
        visual_cues:
          - id: tu-tool-choice-2
            phrase: OpenAI Responses and Chat Completions use different forced-function envelopes
            targets:
              - tu-tool-choice-mechanism
            color: cyan
            linger: 0.4
      - say: Parallel tool calls false limits the documented OpenAI generation to zero or one call, rather than making
          a batch safe to execute. The current OpenAI guide says that when a fine-tuned model calls multiple
          functions in one turn, strict mode is disabled for those calls. Keep those provider details in
          adapters and compatibility checks, while the application independently enforces registration,
          parsing, scope, execution and budgets.
        hold: 0.7
        visual_cues:
          - id: tu-tool-choice-3
            phrase: Parallel tool calls false limits the documented OpenAI generation to zero or one call, rather than
              making a batch safe to execute
            targets:
              - tu-tool-choice-mechanism
            color: green
            linger: 0.4
          - id: tu-choice-one-call
            phrase: zero or one call
            targets:
              - tu-tool-choice-mechanism
            color: cyan
            linger: 0.4
          - id: tu-choice-ft-limit
            phrase: strict mode is disabled for those calls
            targets:
              - tu-tool-choice-mechanism
            color: cyan
            linger: 0.4
  - id: authorization
    title: Resolve permission in trusted runtime state
    visual: A valid request encounters caller, action, and resource checks; private account data stays outside an
      unauthorized read.
    beats:
      - say: The runtime identifies the caller from trusted session state. It resolves the requested resource and
          checks whether that principal may perform that action. A model-supplied account name or a confident
          explanation cannot substitute for the authenticated principal.
        hold: 0.55
        visual_cues:
          - id: authorization-beat-1-focus-1
            phrase: The runtime identifies the caller from trusted session state
            targets:
              - authorization-session
            color: cyan
            linger: 0.6
          - id: authorization-check-action
            phrase: checks whether that principal may perform that action
            targets:
              - authorization-policy
              - authorization-node-req
              - authorization-outcome
            color: cyan
            linger: 0.65
      - say: Reads need this check too. A book's public availability may be readable, while another reader's borrowing
          history is private. A valid resource identifier must not become a way to fetch whichever record the
          host's broad service credentials happen to reach.
        hold: 0.75
        visual_cues:
          - id: authorization-beat-2-focus-1
            phrase: Reads need this check too
            targets:
              - authorization-session
              - authorization-node-req
              - authorization-policy
            color: cyan
            linger: 0.6
          - id: authorization-private-history
            phrase: another reader's borrowing history is private
            targets:
              - authorization-node-req
              - authorization-policy
              - authorization-outcome
            color: pink
            linger: 0.65
      - say: "The request now passes for our authorized availability lookup. Notice where permission lives: in the
          runtime's policy inputs and checks. Tool definitions guide what the model may propose; enforcement
          controls what the application actually allows to happen."
        hold: 0.55
        visual_cues:
          - id: authorization-beat-3-focus-1
            phrase: The request now passes for our authorized availability lookup
            targets:
              - authorization-policy
              - authorization-outcome
            color: cyan
            linger: 0.6
