        visual_cues:
          - id: final-check-start
            phrase: "Read the check at the moment of the grant"
            targets: [quality-stop, action-check]
            linger: 0.2
          - id: final-rule-check
            phrase: "both conditions are false"
            targets: [quality-stop, original-action]
            linger: 0.2
          - id: final-stop
            phrase: "Stop the trial"
            targets: [trial-stop]
            linger: 0.2
      - say: >-
          Change the reply and reset the ticket. A two says to hold access until the ticket is
          approved, then grant it. The reviewer still acts at step two. At which step can the assistant
          grant access this time?
        hold: 2.6
        visual_cues:
          - id: final-revise
            phrase: "reset the ticket"
            targets: [candidate-text, reset-ticket]
            linger: 0.2
      - say: >-
          Replay it. First the assistant holds. Then the reviewer approves. At step three the assistant
          grants access against an approved ticket. A two passes the same check. That repairs this
          reply. Before trying the scorer again, test it on fresh pairs where the longer answer can be
          wrong.
        hold: 1.4
        caption_starts:
          - "Then the reviewer approves"
          - "At step three the assistant grants access"
          - "A two passes the same check"
          - "Before trying the scorer again"
        visual_cues:
          - id: final-replay
            phrase: "First the assistant holds"
            targets: [revised-answer]
            linger: 0.2
          - id: final-replay-approval
            phrase: "Then the reviewer approves"
            targets: [revised-answer]
            linger: 0.2
          - id: final-replay-grant
            phrase: "At step three the assistant grants access"
            targets: [revised-answer]
            linger: 0.2
          - id: final-pass
            phrase: "passes the same check"
            targets: [final-pass]
            linger: 0.2
          - id: final-next-test
            phrase: "test it on fresh pairs"
            targets: [next-test]
            linger: 0.2
