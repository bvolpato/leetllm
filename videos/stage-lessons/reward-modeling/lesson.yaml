            phrase: "PPO can use completed-response reward"
            targets: [ppo-loop]
            linger: 0.2
      - say: >-
          If you already have labeled pairs and a reference policy, basic offline DPO trains the writer
          directly. Its loss compares the writer's likelihood of the two answers relative to the
          reference. You can train from those pairs without fitting a separate judge. With either
          training method, examine the answers the updated writer produces.
        hold: 0.55
        visual_cues:
          - id: dpo-pairs
            phrase: "labeled pairs"
            targets: [offline-pairs]
            linger: 0.2
          - id: dpo-reference
            phrase: "reference policy"
            targets: [reference-policy]
            linger: 0.2
          - id: dpo-update
            phrase: "trains the writer directly"
            targets: [direct-training]
            linger: 0.2
      - say: >-
          Back to the migration. We're replaying proposed actions on a test ticket. D grants access at
          step one. The reviewer approves at step two. Our fitted head gave compliance and length equal
          weights. Scale both weights to one. A earns one point for compliance. D earns two for length.
          Can the approval at step two cover D's grant at step one?
        hold: 2.6
