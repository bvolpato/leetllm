            targets:
              - signal-spectrum-mechanism
            linger: 0.45
      - say: >-
          Follow this calculation. Two plus three is five. Double five and you get ten. The second line
          says eleven. A process reward model can mark the first erroneous step. Lightman and colleagues
          used step judgments to choose among solutions from a fixed generator on MATH. Labeling steps
          takes work, and a judge can still miss an error. A generative judge can write a verdict or give
          probabilities for verdict tokens. Check its latency, sensitivity to answer order and factual errors.
        hold: 0.5
        visual_cues:
          - id: signal-spectrum-step-2
            phrase: first erroneous step
            targets:
              - signal-spectrum-mechanism
            linger: 0.45
          - id: process-location
            phrase: erroneous step
            targets:
              - signal-spectrum-mechanism
            linger: 0.4
      - say: >-
          This function always returns five. It passes the test for two plus three. Try four plus four
          and it will fail the hidden test. The expected sum is eight. An executable verifier rewards
          whatever its tests check. A final-answer parser can accept the right number even when a step
          in the explanation is wrong. Basic offline DPO learns directly from labeled pairs by comparing
          the writer's log probabilities with a reference policy.
