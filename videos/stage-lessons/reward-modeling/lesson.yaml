              - reward-markers
            linger: 0.35
      - say: >-
          It's still seventy-five percent. The gap is still one point one. Both scores gained ten,
          so subtracting cancels the two tens. The loss stays fixed too. Pair labels leave the score origin free.
          Slide back to our original scores before changing their scale.
