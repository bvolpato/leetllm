  - id: rlhf-and-dpo
    title: Would you train the writer on this reward?
    visual: >-
      Candidate ranking and offline DPO lead back to P7-42. Rescale the fitted head's equal weights
      to one and compare each reply's score with its actions. Both replays start with a pending
      ticket and receive the same approval. D's failed grant stays visible while A2 takes the check.
    beats:
      - say: >-
          Suppose the writer samples three finished replies. The scorer ranks them and A wins best of
          three. We can return A immediately. In online reinforcement learning, PPO can use
          completed-response reward to update the writer. Now an error in the judge can change what the
          writer learns to say.
