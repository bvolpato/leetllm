          - id: final-action
            phrase: "D grants access at step one"
            targets: [original-action]
            linger: 0.2
          - id: final-approval
            phrase: "The reviewer approves at step two"
            targets: [original-action]
            linger: 0.2
          - id: final-fitted-weights
            phrase: "gave compliance and length equal weights"
            targets: [candidate-ranking]
            linger: 0.2
          - id: final-weights
            phrase: "Scale both weights to one"
            targets: [candidate-ranking]
            linger: 0.2
          - id: final-review-score
            phrase: "A earns one"
            targets: [candidate-ranking]
            linger: 0.2
          - id: final-shortcut-score
            phrase: "D earns two"
            targets: [candidate-ranking]
            linger: 0.2
      - say: >-
          Read the check at the moment of the grant. Either we're holding access, or the ticket must
          already be approved. At step one both conditions are false. Later approval can't undo that
          grant. Stop the trial and keep the failing trace.
