    title: Choose the signal and preserve its checked property
    visual: The same proposed reasoning answer gains terminal, per-step, generative-verdict and executable-check
      feedback at the exact locations those methods can inspect.
    beats:
      - say: A terminal scalar scores the completed rollout. PPO commonly uses a learned value baseline for
          advantages; outcome-supervised GRPO uses relative rewards within a response group without that value
          model. Best-of-N selects the largest score among sampled answers. That selection is often called
          rejection sampling in post-training recipes, but it is not exact sampling from a specified target
          distribution.
