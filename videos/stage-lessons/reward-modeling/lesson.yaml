  - id: centering-and-kl
    title: Center the pair midpoint without confusing its spread
    visual: The same two score markers first translate together, then the midpoint penalty is constructed. A
      fixed-reference objective shows a changed reward/KL balance.
    beats:
      - say: Track the pair midpoint separately from the margin. The checked TRL centering term is gamma times the
          mean squared sum of chosen and rejected scores. The pair sum is twice its midpoint, so this is four
          gamma times the squared midpoint. Scores plus one hundred and minus one hundred pay zero centering
          penalty despite a huge margin. Joint updates through shared weights can still change margins.
        hold: 0.5
        visual_cues:
          - id: centering-and-kl-step-1
            phrase: four gamma times
            targets:
              - centering-and-kl-mechanism
            linger: 0.45
          - id: centering-extreme
            phrase: plus one hundred and minus one hundred
            targets:
              - centering-and-kl-mechanism
            linger: 0.4
      - say: This coefficient defaults to disabled in the checked one point seventeen point one configuration; zero
          point zero one is a suggested starting value. InstructGPT shifted demonstration rewards to mean
          zero before reinforcement learning. Look at our centered pair. Its scores are still two hundred
          points apart. To check a forecast, compare it with reviewer votes. To compare two scorers,
          first align their scales and origins on shared examples.
        hold: 0.5
        visual_cues:
          - id: centering-and-kl-step-2
            phrase: two hundred points apart
            targets:
              - centering-and-kl-mechanism
            linger: 0.45
      - say: For the ideal objective, expected reward minus beta times divergence from the reference policy,
          multiplying all rewards by three at fixed beta gives the same maximizer as dividing beta by three
          with original rewards. Adding the same constant to every answer for one prompt also preserves
          the ideal maximizer. In a PPO run, measure how far the policy moves. Clipping, normalization,
          training data and the number of updates all affect that distance.
        hold: 0.65
        visual_cues:
          - id: centering-and-kl-step-3
            phrase: dividing beta by three
            targets:
              - centering-and-kl-mechanism
            linger: 0.45
  - id: shortcuts-and-calibration
    title: Two forecasts pick the same winner
    visual: >-
      Four reviewer choices stay in fixed A/B order above two forecasts. Both get three winners right.
      The final B ballot exposes the cost of near certainty. The squared error for every ballot stays
      above its share of the mean.
    beats:
      - say: >-
          A ranking tells us which answer comes first. What about the probability attached to it? Keep
          A and B fixed before anyone votes. Four reviewers read the same pair independently. Three
          choose A and one chooses B. Both forecasts pick A, so each gets three out of four right.
          Which forecast fits these four votes better?
        hold: 2.3
        visual_cues:
          - id: calibration-votes
            phrase: "Three choose A and one chooses B"
            targets: [fixed-votes]
            linger: 0.2
      - say: >-
          Look at the vote for B. The target for A is zero on that ballot. A forecast of point nine
          nine misses by almost one. Square that difference and you get point nine eight zero one. The
          point seven five forecast pays a smaller penalty there. Now square the errors on the three A
          votes, where the target is one. Those votes favor the more confident forecast.
        hold: 0.7
        visual_cues:
          - id: calibration-miss
            phrase: "Look at the vote for B"
            targets: [calibration-errors]
            linger: 0.2
          - id: calibration-build
            phrase: "square the errors on the three A votes"
            targets: [calibration-errors]
            linger: 0.2
      - say: >-
          For each forecast, add its four squared errors and divide by four. That mean is the Brier
          score. The lower score goes to point seven five. The one confident miss outweighs three small
          gains. To judge calibration on future requests, collect votes across more pairs and check how
          the forecasts match each group.
        hold: 0.8
        caption_starts:
          - "The lower score goes to point seven five"
        visual_cues:
          - id: calibration-average
            phrase: "add its four squared errors and divide by four"
            targets: [brier-mean]
            linger: 0.2
  - id: length-margin-counterexample
    title: Make the proposed correction fail visibly
    visual: A length-only direction remains attached to a longer winner while a subtracted length margin shifts
      its loss; a separate short-good/long-wrong pair retains the wrong order.
    beats:
      - say: "Try a proposed correction: subtract alpha times the positive chosen-minus-rejected length gap from the
          score difference. If the head scores only b times length and the gap is positive, its effective
          logit is b minus alpha, multiplied by that gap. Increasing b can still drive training loss down.
          This correction has not forced the length weight to zero."
        hold: 0.5
        visual_cues:
          - id: length-margin-counterexample-step-1
            phrase: b minus alpha
            targets:
              - length-margin-counterexample-mechanism
            linger: 0.45
      - say: >-
          Set the length gap and alpha to one. Turn the length weight from zero to three, then six.
          Watch the losses fall from about one point three to seven thousandths. Now test a short
          correct reply against a long wrong one. At zero the replies tie. At three and six the longer,
          wrong reply wins.
        hold: 0.5
        visual_cues:
          - id: length-margin-counterexample-step-2
            phrase: At zero the replies tie
            targets:
              - length-margin-counterexample-mechanism
            linger: 0.45
          - id: length-losses
            phrase: Watch the losses fall
            targets:
              - length-margin-counterexample-mechanism
            linger: 0.4
      - say: >-
          Vary quality and presentation independently. Include short answers that solve the problem,
          longer ones that need the detail, and errors at both lengths. Match lengths to isolate quality.
          To test sycophancy, keep both replies polite and vary whether they agree with a false premise.
          Try changing the format too. In one study by Eisenstein and colleagues, about eight percent
          of the preference data used lists. Roughly half the generated helpfulness answers used them.
        hold: 0.65
        visual_cues:
          - id: length-margin-counterexample-step-3
            phrase: quality and presentation independently
            targets:
              - length-margin-counterexample-mechanism
            linger: 0.45
          - id: length-factorial
            phrase: quality and presentation independently
            targets:
              - length-margin-counterexample-mechanism
            linger: 0.4
