version: 1
id: reward-modeling
title: "Reward Modeling: Scores, Data, Calibration and the Approval Rule"
source: training/reward-modeling-from-preference-data/content.md
scenes:
  - id: introduction
    title: Which reply gets your vote?
    visual: >-
      A paper request for admin access slides beside two completed replies. The approval requirement
      stays on the slip while the reviewer reads the replies and casts one vote.
    beats:
      - say: >-
          An engineer asks for admin access. A asks for a review ticket and waits. B says access is
          already enabled. Look at the slip. P-seven requires an approved ticket. Which reply gets your vote?
        hold: 2.5
        caption_starts:
          - "Look at the slip"
        visual_cues:
          - id: opening-answers
            phrase: "A asks for a review ticket and waits"
            targets: [answer-a]
            linger: 0.2
          - id: opening-grant
            phrase: "B says access is already enabled"
            targets: [answer-b]
            linger: 0.2
          - id: opening-rule
            phrase: "P-seven requires an approved ticket"
            targets: [approval-lock]
            linger: 0.2
      - say: >-
          Record A over B. A reward model can learn from that choice. A also uses more words.
          If the longer reply always wins in training, what happens when the wrong reply is longer?
        hold: 1
        caption_starts:
          - "A also uses more words"
        visual_cues:
          - id: opening-choice
            phrase: "Record A over B"
            targets: [human-choice]
            linger: 0.2
  - id: likelihood-isnt-preference
    title: Which answer is more likely?
    visual: Three supplied toy token probabilities arrive for each unchanged answer. Prefix products accumulate;
      the final products stay hidden through a prediction pause before likelihood and approval rankings
      separate.
    beats:
      - say: >-
          The writer predicts one token, or piece of text, at a time. Here each reply has three tokens
          with example probabilities. The first piece gets a probability
          given the request. The next depends on the pieces already written. Multiply all three along
          each row. Which complete answer gets more probability?
        hold: 1.2
        caption_starts:
          - "The first piece gets a probability"
          - "Multiply all three along each row"
        visual_cues:
          - id: likelihood-first-piece
            phrase: The first piece gets a probability
            targets:
              - likelihood-piece-1
            linger: 0.35
          - id: likelihood-second-piece
            phrase: The next depends on the pieces already written
            targets:
              - likelihood-piece-2
            linger: 0.35
          - id: likelihood-third-piece
            phrase: Multiply all three along each row
            targets:
              - likelihood-piece-3
              - likelihood-products
            linger: 0.35
      - say: >-
          B has twice the probability of A. The last two factors match, but the writer gave B's first
          token twice the probability. Our approval rule selects A. That's what the reward model learns
          from the reviewer's choice between the completed replies.
        hold: 0.35
        caption_starts:
          - "Our approval rule selects A"
        visual_cues:
          - id: likelihood-product-result
            phrase: B has twice the probability of A
            targets:
              - likelihood-products
              - likelihood-ranking
            linger: 0.35
          - id: likelihood-rule-choice
            phrase: Our approval rule selects A
            targets:
              - human-label
            linger: 0.35
  - id: human-comparisons
    title: Two reviewers read the same replies
    visual: >-
      Two independent ballots open in turn. Comparing their choices produces a split vote. Both ballots
      stay visible when the approval rubric supplies a strict label.
    beats:
      - say: >-
          Two reviewers read the same pair independently. The first marks A because it waits for
          approval. The second marks B because the migration is urgent. Compare the ballots. One vote
          for each answer. Each reviewer picked a winner.
        hold: 0.8
        visual_cues:
          - id: first-vote
            phrase: "first marks A"
            targets: [first-ballot]
            linger: 0.2
          - id: collect-votes
            phrase: "second marks B"
            targets: [second-ballot]
            linger: 0.2
          - id: compare-votes
            phrase: "One vote for each answer"
            targets: [labeler-votes]
            linger: 0.2
      - say: >-
          For this exercise the rubric puts approval first, so the strict training label is A over B.
          Keep both votes in the record. If you want to learn how often reviewers choose A, those two
          votes give you a target of one half. An explicit tie or an abstention needs its own label.
        hold: 0.6
        visual_cues:
          - id: resolve-rubric
            phrase: "rubric puts approval first"
            targets: [policy-rule]
            linger: 0.2
          - id: retain-votes
            phrase: "Keep both votes in the record"
            targets: [labeler-votes]
            linger: 0.2
  - id: policy-and-judge
    title: One writer, one shared scorer
    visual: Two identifiable prompt-answer sequences pass through the same scalar scorer one after another;
      completed score records persist.
    beats:
      - say: Call the writer the policy. It produces an answer token by token. The reward model reads the prompt and
          the completed answer, then returns one scalar, a single number.
        hold: 0.35
        visual_cues:
          - id: policy-write
            phrase: produces an answer token by token
            targets:
              - policy-tokens
            linger: 0.35
          - id: score-answer-a
            phrase: returns one scalar
            targets:
              - reward-score
            linger: 0.35
      - say: Use the same scorer for B. These illustrative scores are one point eight for A and zero point seven for
          B. Their order predicts a preference. These dimensionless scores describe the model's ranking.
        hold: 0.35
        visual_cues:
          - id: score-answer-b
            phrase: same scorer for B
            targets:
              - candidate-scores
            linger: 0.35
  - id: pair-contract
    title: Check what actually reaches the scorer
    visual: Matched context cells are verified, an identical-token counterexample yields equal scores, and
      restoring the distinguishing answer makes the pair usable.
    beats:
      - say: >-
          Start both replies with the same request. Match the system rules, available tools, and
          conversation history too. If only one reply had access to a tool, the reviewer would be
          comparing two different tasks.
        hold: 0.35
        visual_cues:
          - id: match-shared-context
            phrase: Match the system rules, available tools, and conversation history
            targets:
              - shared-context
              - matched-prefix
            linger: 0.35
      - say: Use the same chat template and inspect the token IDs that actually reach the scorer. Identical inputs
          produce identical deterministic scores. Retain the distinguishing answer token so the two scorer
          inputs stay distinct.
        hold: 0.35
        visual_cues:
          - id: inspect-scorer-input
            phrase: same chat template and inspect the token IDs that actually reach the scorer
            targets:
              - scorer-prefix
            linger: 0.35
          - id: identical-input-scores
            phrase: Identical inputs produce identical deterministic scores
            targets:
              - input-score-contract
            linger: 0.35
          - id: retain-answer-token
            phrase: Retain the distinguishing answer token
            targets:
              - answer-token
            linger: 0.35
      - say: Save the generating checkpoint and annotator cohort with the pair. Keep ties separate from strict wins. A
          clean training file still learns any systematic mistakes in its labels.
        hold: 0.35
        visual_cues:
          - id: pair-contract-b3-1
            phrase: generating checkpoint and annotator cohort
            targets:
              - pair-metadata
            linger: 0.35
  - id: format-length-boundary
    title: A label belongs to the exact scored inputs
    visual: One P-7 pair keeps its shared prompt while formatting, tokenization, a lost answer suffix and a strict
      length gate change the actual candidate identities.
    beats:
      - say: An explicit-prompt row separates the shared prompt from chosen and rejected answers. Conversational rows
          instead preserve identical role history and branch at the final assistant turn. In the checked TRL
          one point seventeen point one source, conversations use the tokenizer’s chat template; ordinary
          strings are concatenated and tokenized. Ordinary strings do not automatically become a chat
          dialogue. Inspect the actual model inputs.
        hold: 0.5
        visual_cues:
          - id: format-length-boundary-step-1
            phrase: actual model inputs
            targets:
              - format-length-boundary-mechanism
            linger: 0.45
          - id: format-history
            phrase: identical role history
            targets:
              - format-length-boundary-mechanism
            linger: 0.4
      - say: "If templating or truncation turns both answers into the same token IDs and masks, a deterministic shared
          scorer returns the same value. Their margin is zero and strict-winner loss is log two. Their
          pair-loss parameter gradients cancel: increasing one shared score increases the other identically.
          Distinct raw text alone does not establish distinct scored inputs."
        hold: 0.5
        visual_cues:
          - id: format-length-boundary-step-2
            phrase: parameter gradients cancel
            targets:
              - format-length-boundary-mechanism
            linger: 0.45
          - id: format-equal
            phrase: Their margin is zero
            targets:
              - format-length-boundary-mechanism
            linger: 0.4
      - say: A preference may depend on the final false statement. Cutting that suffix can erase the reason for its
          label. The checked trainer’s maximum length defaults to one thousand twenty-four and filters the
          entire pair if either full templated candidate exceeds it; None disables that filter. The
          boundary-length pair survives. Report removed counts and domains because filtering also changes the
          training distribution.
        hold: 0.65
        visual_cues:
          - id: format-length-boundary-step-3
            phrase: filters the entire pair
            targets:
              - format-length-boundary-mechanism
            linger: 0.45
          - id: format-length
            phrase: one thousand twenty-four
            targets:
              - format-length-boundary-mechanism
            linger: 0.4
  - id: prompt-groups
    title: Six comparisons are still one prompt
    visual: Four answer identities construct all six edges. Moving the same edges across a split exposes leakage;
      grouping them keeps the unseen-prompt test separate.
    beats:
      - say: Four candidate answers give six comparisons. Each answer appears in three pairs. All six rows share one
          prompt.
        hold: 0.35
        visual_cues:
          - id: build-six-pairs
            phrase: six comparisons
            targets:
              - six-pairs
            linger: 0.35
      - say: Split the rows at random and the same prompt, even the same answer, can land in both training and
          evaluation. The test has become familiar.
        hold: 0.35
        visual_cues:
          - id: split-pairs
            phrase: both training and evaluation
            targets:
              - split-train
              - split-eval
            linger: 0.35
      - say: For unseen-prompt evaluation, keep the whole prompt group together. Put other prompt groups in evaluation
          and check near duplicates. Testing new answers to familiar prompts is a different, legitimate goal.
        hold: 0.35
        visual_cues:
          - id: group-prompts
            phrase: whole prompt group together
            targets:
              - heldout-prompts
            linger: 0.35
  - id: group-weight-soft-target
    title: Keep group weighting and preference uncertainty explicit
    visual: Thirty-six edges remain attached to one nine-answer prompt; a second two-answer prompt retains one
      edge. Loss mass changes under pair averaging versus group averaging, then a three-strength ranking is
      constructed.
    beats:
      - say: Nine answers give thirty-six comparisons, while two answers give one. Averaging all thirty-seven rows
          gives the first prompt thirty-six times as much loss weight. Average within each prompt and then
          across the two prompts to give each one half of the loss weight. That does not equalize their
          gradient norms. Score each answer once and reuse it across its pairs. InstructGPT grouped correlated
          comparisons after observing overfitting from treating them independently.
        hold: 0.5
        visual_cues:
          - id: group-weight-soft-target-step-1
            phrase: one half of the loss weight
            targets:
              - group-weight-soft-target-mechanism
            linger: 0.45
          - id: group-pairs
            phrase: thirty-six comparisons
            targets:
              - group-weight-soft-target-mechanism
            linger: 0.4
          - id: group-weights
            phrase: one half
            targets:
              - group-weight-soft-target-mechanism
            linger: 0.4
      - say: >-
          Plackett-Luce models a whole ranking as a sequence of choices. Give A, B and C strengths of
          three, two and one. The chance of choosing A first is three over six. Remove A. Two of the three
          remaining units belong to B, so its share is two over three. C is the only choice left.
          Multiply the first two shares. The probability of the complete A, B, C order is one third.
        hold: 0.5
        visual_cues:
          - id: group-weight-soft-target-step-2
            phrase: probability of the complete
            targets:
              - group-weight-soft-target-mechanism
            linger: 0.45
          - id: pl-first
            phrase: three over six
            targets:
              - group-weight-soft-target-mechanism
            linger: 0.4
          - id: pl-remove
            phrase: Remove A
            targets: [group-weight-soft-target-mechanism]
            linger: 0.2
          - id: pl-second
            phrase: two over three
            targets:
              - group-weight-soft-target-mechanism
            linger: 0.4
          - id: pl-product
            phrase: one third
            targets:
              - group-weight-soft-target-mechanism
            linger: 0.4
      - say: A strict winner label differs from repeated votes. Fix answer identities before observing votes. If a
          fraction q chooses A, binary cross entropy can train toward that soft target; for an interior q its
          optimum forecast is q. A split vote can reflect opposing preferences, while an explicit equally-good
          annotation states a tie. Choose a tie-aware or cohort model when the annotation requires it.
        hold: 0.65
        visual_cues:
          - id: group-weight-soft-target-step-3
            phrase: optimum forecast is q
            targets:
              - group-weight-soft-target-mechanism
            linger: 0.45
          - id: soft-optimum
            phrase: optimum forecast is q
            targets:
              - group-weight-soft-target-mechanism
            linger: 0.4
  - id: transformer-score-head
    title: Build the score, one product at a time
    visual: A causal prefix grows to the final real token. A two-component supplied hidden vector meets one shared
      weight vector; each product and their sum appear only at its narration cue. A and B use the same head.
    beats:
      - say: A transformer turns each token into a hidden vector, a learned summary. In a causal decoder, an early
          position sees only its prefix. Follow the available context as the answer arrives.
        hold: 0.35
        visual_cues:
          - id: head-context
            phrase: available context as the answer arrives
            targets:
              - hidden-states
            linger: 0.35
      - say: The final real token can use the whole answer. Select that representation and exclude padding. We will
          use two invented vector components so the arithmetic fits on screen; a real model has many more.
        hold: 0.35
        visual_cues:
          - id: head-final
            phrase: final real token
            targets:
              - hidden-states
            linger: 0.35
      - say: "Use the supplied vector for A with one shared set of weights. The first component times its weight gives
          one. The second contributes zero point eight. Add the products: one point eight."
        hold: 0.35
        visual_cues:
          - id: head-a-first
            phrase: The first component times its weight gives one
            targets:
              - scalar-head
            linger: 0.35
          - id: head-a-second
            phrase: The second contributes zero point eight
            targets:
              - scalar-head
            linger: 0.35
          - id: head-a-sum
            phrase: "Add the products: one point eight"
            targets:
              - reward-score
            linger: 0.35
          - id: head-a-result
            phrase: one point eight
            targets:
              - reward-score
            linger: 0.35
      - say: Now score B with the same weights. The first product is zero point five; the second is zero point two.
          Their sum is zero point seven. The larger A score earns the ranking. Independent tests tell us
          whether the model learned the rule.
        hold: 0.35
        visual_cues:
          - id: head-b-first
            phrase: The first product is zero point five
            targets:
              - scalar-head
            linger: 0.35
          - id: head-b-second
            phrase: the second is zero point two
            targets:
              - scalar-head
            linger: 0.35
          - id: head-b-sum
            phrase: Their sum is zero point seven
            targets:
              - reward-score
            linger: 0.35
          - id: head-b-result
            phrase: zero point seven
            targets:
              - reward-score
            linger: 0.35
  - id: padding-and-artifact
    title: Trace the final unmasked position
    visual: Identical final hidden vectors move to different physical slots under left/right padding; the head
      weights and saved feature order stay attached.
    beats:
      - say: Trace the mask, rather than trusting the last array slot. In the article’s right-padded sequence, mask
          one, one, zero selects index one; left padding zero, one, one selects index two. Both select hidden
          vector two, three. The shared head one half, one gives one plus three, or four. A padding state of
          ninety-nine, ninety-nine must not become the readout.
        hold: 0.5
        visual_cues:
          - id: padding-and-artifact-step-1
            phrase: Both select hidden vector
            targets:
              - padding-and-artifact-mechanism
            linger: 0.45
          - id: padding-select
            phrase: mask one, one, zero
            targets:
              - padding-and-artifact-mechanism
            linger: 0.4
          - id: padding-score
            phrase: or four
            targets:
              - padding-and-artifact-mechanism
            linger: 0.4
      - say: For contiguous right padding starting at index zero, mask sum minus one gives the final real position.
          For conventional left padding of a nonempty sequence, the final real token is at the end. The
          article’s general routine takes the greatest unmasked position and rejects an empty sequence. Causal
          attention includes the diagonal; a dedicated scoring token after the answer can also see the whole
          preceding sequence.
        hold: 0.5
        visual_cues:
          - id: padding-and-artifact-step-2
            phrase: greatest unmasked position
            targets:
              - padding-and-artifact-mechanism
            linger: 0.45
      - say: A scalar head replaces the vocabulary projection. Train the backbone, adapters plus the head, or only the
          head with a frozen backbone. A shared scalar bias cancels from every score difference and receives
          zero gradient from the pair loss alone. Save the actual trainable score head with adapters, the base
          revision, tokenizer and template, then compare held-out outputs after reloading.
        hold: 0.65
        visual_cues:
          - id: padding-and-artifact-step-3
            phrase: zero gradient from the pair loss alone
            targets:
              - padding-and-artifact-mechanism
            linger: 0.45
          - id: padding-bias
            phrase: zero gradient
            targets:
              - padding-and-artifact-mechanism
            linger: 0.4
  - id: margin-to-probability
    title: Turn a score gap into a forecast
    visual: Persistent A and B markers translate through subtraction. Exponential strengths form a normalized
      share; the sigmoid and equal-score counterexample track that same margin.
    beats:
      - say: Subtract the rejected score from the chosen score. One point eight minus zero point seven leaves a margin
          of one point one. Only this difference enters the pairwise probability.
        hold: 0.35
        visual_cues:
          - id: margin-to-probability-b1-1
            phrase: chosen score
            targets:
              - chosen-score
            linger: 0.35
          - id: subtract-rejected-score
            phrase: Subtract the rejected score
            targets:
              - rejected-score
            linger: 0.35
          - id: score-margin-result
            phrase: margin of one point one
            targets:
              - score-margin
            linger: 0.35
      - say: Bradley-Terry exponentiates both scores into positive strengths. Divide the chosen answer's strength by
          their total. Its share is about seventy-five percent, equivalent to the sigmoid of our margin.
        hold: 0.35
        visual_cues:
          - id: exponential-strengths
            phrase: positive strengths
            targets:
              - exponential-strength
            linger: 0.35
          - id: chosen-strength-share
            phrase: Divide the chosen answer's strength by their total
            targets:
              - strength-share
            linger: 0.35
          - id: sigmoid-mapping
            phrase: equivalent to the sigmoid
            targets:
              - sigmoid-curve
            linger: 0.35
      - say: "Equal scores would give an even chance. Bring A back to one point eight. Its forecast returns to
          seventy-five percent. Now collect four votes with A and B fixed in advance. Three reviewers pick A
          and one picks B. That matches this small sample. We need judgments across many pairs to assess
          calibration."
        hold: 0.35
        visual_cues:
          - id: equal-score-chance
            phrase: Equal scores would give an even chance
            targets:
              - sigmoid-curve
            linger: 0.35
          - id: restore-score
            phrase: Bring A back to one point eight
            targets: [chosen-score, sigmoid-curve]
            linger: 0.2
          - id: check-human-judgments
            phrase: Now collect four votes
            targets:
              - human-votes
            linger: 0.35
  - id: pairwise-likelihood
    title: A confident mistake pays more loss
    visual: The observed winner remains fixed while the margin moves through a wrong and a correct ranking.
      Probability and the negative logarithm are calculated from the same state.
    beats:
      - say: The label says A won. The model assigned that outcome about zero point seven five. Negative log
          probability gives a loss of about zero point two nine.
        hold: 0.35
        visual_cues:
          - id: pairwise-likelihood-b1-1
            phrase: label says A won
            targets:
              - winner-label
            linger: 0.35
          - id: pairwise-likelihood-b1-2
            phrase: assigned that outcome
            targets:
              - winner-probability
            linger: 0.35
      - say: Now make the margin minus two. A receives only twelve percent, although the observed label still says A.
          Its negative log loss rises to two point one three. Confident mistakes are expensive.
        hold: 0.35
        visual_cues:
          - id: loss-wrong
            phrase: margin minus two
            targets:
              - pair-loss
            linger: 0.35
      - say: Move the margin to plus two. A gets eighty-eight percent and loss falls to zero point one three. This is
          binary cross entropy with the score difference as its logit, the input to the sigmoid.
        hold: 0.35
        visual_cues:
          - id: loss-correct
            phrase: margin to plus two
            targets:
              - loss-result
            linger: 0.35
  - id: stable-loss-and-margins
    title: Separate stable evaluation from a required margin
    visual: One logit travels from minus1000 to plus1000 without exponentiating the dangerous positive argument. A
      rating margin shifts the same loss curve and preserves its nonzero slope.
    beats:
      - say: >-
          Take a score difference of minus one thousand. If you compute the sigmoid first, it can round
          to zero. Then its log blows up. Use binary cross entropy with logits, or softplus of the
          negative difference. Look at the exponential in this stable scalar form. Its input is always
          zero or negative, so its value stays at or below one. The loss is one thousand for the confident
          mistake. At plus one thousand the loss rounds to zero.
        hold: 0.5
        visual_cues:
          - id: stable-loss-and-margins-step-1
            phrase: stable scalar form
            targets:
              - stable-loss-and-margins-mechanism
            linger: 0.45
          - id: stable-extremes
            phrase: The loss is one thousand
            targets:
              - stable-loss-and-margins-mechanism
            linger: 0.4
      - say: >-
          A rating-dependent margin, m, changes the training target. Subtract m from the score difference.
          When the difference reaches m, the effective logit is zero. The probability is one half, the
          loss is log two, and its slope is minus one half. Training still pushes the scores farther apart.
          For a target probability rho, the required difference is m plus the log of rho divided by one minus rho.
        hold: 0.5
        visual_cues:
          - id: stable-loss-and-margins-step-2
            phrase: Training still pushes the scores farther apart
            targets:
              - stable-loss-and-margins-mechanism
            linger: 0.45
          - id: stable-boundary
            phrase: probability is one half
            targets:
              - stable-loss-and-margins-mechanism
            linger: 0.4
      - say: >-
          Set m to one. To get a ninety-percent effective forecast, the gap has to grow to about three
          point one nine seven. Llama Two used the strength of a reviewer's preference to set the
          margin. Its weakest preference got zero. In Llama Three, the benefit shrank as the dataset grew,
          and the team dropped the margin.
        hold: 0.65
        visual_cues:
          - id: stable-loss-and-margins-step-3
            phrase: three point one nine seven
            targets:
              - stable-loss-and-margins-mechanism
            linger: 0.45
          - id: stable-target
            phrase: three point one nine seven
            targets:
              - stable-loss-and-margins-mechanism
            linger: 0.4
  - id: score-gradients
    title: Move weights, then check the margin
    visual: Output derivatives oppose one another. A separate shared-weight update derives its gradient and
      learning-rate product before recomputing both scores.
    beats:
      - say: The chosen-score derivative is sigmoid of the margin minus one; the rejected derivative has the opposite
          sign. Treating scores as independent variables, descent pushes the chosen score up and the rejected
          score down.
        hold: 0.35
        visual_cues:
          - id: score-gradients-b1-1
            phrase: chosen-score derivative
            targets:
              - chosen-derivative
            linger: 0.35
          - id: score-gradients-b1-2
            phrase: rejected derivative
            targets:
              - rejected-derivative
            linger: 0.35
      - say: With margin minus two, the derivative magnitude is about zero point eight eight. An illustrative
          output-space step narrows the wrong gap. Actual backpropagation updates shared model weights. Both
          outputs can move in the same direction.
        hold: 0.35
        visual_cues:
          - id: output-descent
            phrase: step narrows the wrong gap
            targets:
              - score-update
            linger: 0.35
      - say: "Take one shared weight, minus one, and features one and two. The weight gradient is zero point two six
          nine. Multiply by learning rate zero point one, then subtract: the weight becomes minus one point
          zero two seven. Both scores fall, but the rejected falls farther. Their margin improves."
        hold: 0.35
        visual_cues:
          - id: shared-gradient
            phrase: weight gradient is zero point two six nine
            targets:
              - shared-weight
            linger: 0.35
          - id: shared-update
            phrase: Multiply by learning rate zero point one, then subtract
            targets:
              - shared-weight
            linger: 0.35
          - id: shared-result
            phrase: Their margin improves
            targets:
              - updated-margin
            linger: 0.35
  - id: fit-the-head
    title: What did the reward head learn?
    visual: >-
      One training pair changes the sign of its length difference. Two fits start at zero and use those
      rows for 300 updates. The same violating reply gains words. Each head converts its two features
      into score contributions before all three held-out rankings are checked.
    beats:
      - say: >-
          Let's give each reply two numbers we can inspect. The first says whether it follows the
          approval rule. The second measures length on a scaled ruler. We assign both features by hand.
          On the left, the preferred reply in each training pair gains one unit on both features. Copy
          those pairs to the right. Now make the second winner shorter by one unit. It still follows
          the rule.
        hold: 0.65
        visual_cues:
          - id: fit-swap
            phrase: "make the second winner shorter by one unit"
            targets: [balanced-data]
            linger: 0.2
      - say: >-
          Start both heads at zero. On the left, compliance and length get identical gradients. On the
          right, one pair pulls the length weight up and the other pulls it down by the same amount.
          Run three hundred gradient steps with the same learning rate and L two penalty. The left head
          still weights both features equally. On the right the length weight stays at zero. Both heads
          rank both training pairs correctly. The penalty shrinks weights. The opposing examples
          explain the cancellation.
        hold: 0.8
        visual_cues:
          - id: fit-updates
            phrase: "Run three hundred gradient steps with the same learning rate and L two penalty"
            targets: [fitted-weights]
            linger: 0.2
      - say: >-
          Try both heads on the same replies. A says to wait for approval. D grants access now. Give D
          a longer explanation. It promises to request approval afterward. D now has two length units
          and still has zero for compliance. A has one for compliance and zero for length. Multiply
          each feature by its weight, then add. Which head will rank D above A?
        hold: 2.8
        visual_cues:
          - id: fit-add-words
            phrase: "Give D a longer explanation"
            targets: [answer-features]
            linger: 0.2
      - say: >-
          The head trained on two longer winners picks D. Its two length units earn about three point
          two six, twice the score A earns for following the rule. The head trained with a shorter
          winner picks A. With zero weight on length, D's extra words contribute nothing. A earns
          about two point six seven for compliance.
        hold: 0.9
        caption_starts:
          - "The head trained with a shorter winner picks A"
        visual_cues:
          - id: fit-confounded
            phrase: "The head trained on two longer winners picks D"
            targets: [confounded-scores]
            linger: 0.2
          - id: fit-balanced
            phrase: "The head trained with a shorter winner picks A"
            targets: [balanced-scores]
            linger: 0.2
      - say: >-
          Try three fresh pairs. A always waits for approval. D always grants access early. In the first
          two rows D is longer. In the last row the replies are the same length. Read down the two columns.
          The head that rewarded length picks D twice. When the lengths match, A wins on compliance.
          The head trained with a shorter winner picks A in all three. To reproduce the fit,
          check the gradient against finite differences and reload the weights with the features in the same order.
        hold: 0.9
        caption_starts:
          - "Read down the two columns"
          - "The head that rewarded length"
          - "The head trained with a shorter winner"
          - "To reproduce the fit"
        visual_cues:
          - id: fit-controlled
            phrase: "Read down the two columns"
            targets: [controlled-rows]
            linger: 0.2
  - id: offset-and-scale
