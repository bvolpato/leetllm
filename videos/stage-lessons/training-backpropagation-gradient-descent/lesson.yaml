version: 1
id: training-backpropagation-gradient-descent
title: How a Prediction Learns from Its Error
opening: lesson
source: preparation/training-backpropagation-gradient-descent/content.md
voice: en-US-AndrewNeural
rate: +0%
sources:
  - title: PyTorch autograd mechanics
    url: https://docs.pytorch.org/docs/stable/notes/autograd.html
  - title: PyTorch numerical gradient checking
    url: https://docs.pytorch.org/docs/stable/notes/gradcheck.html
  - title: Glorot and Bengio, understanding training difficulty
    url: https://proceedings.mlr.press/v9/glorot10a.html
  - title: He et al., rectifier initialization
    url: https://arxiv.org/abs/1502.01852
scenes:
  - id: opening
    title: "Will the token arrive by the blue mark?"
    visual: "The shot opens partway through a tick. The stopwatch hand crosses the model's blue mark while the cursor waits. A yellow arc traces the extra wait until the token appears. The same gap carries onto the latency ruler."
    beats:
      - say: >-
          Two milliseconds.
        hold: 0.35
        visual_cues:
          - id: open-clock
            phrase: "Two milliseconds"
            targets: [request-observation]
      - say: >-
          The model expected the token here. Still waiting.
        hold: 1.15
        caption_starts: ["Still waiting"]
        visual_cues:
          - id: open-predict
            phrase: "The model expected the token here"
            targets: [request-prediction]
      - say: >-
          Six milliseconds. There's the token. Compare the two marks. Four milliseconds short.
        hold: 1.65
        caption_starts: ["Compare the two marks", "Four milliseconds short"]
        visual_cues:
          - id: open-observe
            phrase: "Six milliseconds"
            targets: [request-observation]
          - id: open-gap
            phrase: "Compare the two marks"
            targets: [signed-residual]
          - id: open-gap-value
            phrase: "Four milliseconds short"
            targets: [signed-residual]
  - id: forward
    title: "How much did the model miss by?"
    visual: "The two endpoints stay on screen. The signed miss supplies the side length of a four-by-four square. Half its area remains highlighted."
    beats:
      - say: >-
          Here's where the blue mark came from. This request has a complexity score of two.
          The weight multiplies the input, so we get one times two. The bias comes in afterward.
          Adding zero leaves the prediction at two milliseconds.
        hold: 0.65
        visual_cues:
          - id: forward-input
            phrase: "complexity score of two"
            targets: [affine-product]
          - id: forward-weight
            phrase: "weight multiplies the input"
            targets: [affine-product]
          - id: forward-bias
            phrase: "bias comes in afterward"
            targets: [affine-bias]
      - say: >-
          Read the marks in order. Prediction minus measurement gives minus four milliseconds. The minus
          sign tells us which way we missed. To score the size of the miss, make a square with a side
          four milliseconds long. Its area is sixteen square milliseconds.
        hold: 0.7
        visual_cues:
          - id: forward-error
            phrase: "Prediction minus measurement"
            targets: [signed-residual]
          - id: forward-square
            phrase: "make a square"
            targets: [error-area]
          - id: forward-area
            phrase: "area is sixteen"
            targets: [error-area]
      - say: >-
          Keep half the area. That's our loss, eight square milliseconds. The half will cancel the factor
          of two when we differentiate the square, leaving the signed miss as our slope.
        hold: 0.9
        visual_cues:
          - id: forward-half
            phrase: "Keep half the area"
            targets: [error-area]
          - id: forward-score
            phrase: "our loss"
            targets: [error-area]
  - id: sensitivity
    title: Which direction makes the loss smaller?
    visual: The same prediction moves right and down its loss bowl. Equal parameter nudges have
      different prediction effects. The local loss slope and input sensitivity multiply into the
      parameter gradients.
    beats:
      - say: Imagine nudging the prediction a little toward the observation. Watch the point move down the
          loss curve. A slope tells us how much the loss changes for a small change in the
          prediction.
        hold: 0.7
        visual_cues:
          - id: sensitivity-nudge
            phrase: nudging the prediction a little
            targets:
              - loss-point
            color: green
            linger: 0.2
          - id: sensitivity-slope
            phrase: A slope tells us
            targets:
              - slope-ratio
            color: yellow
            linger: 0.2
      - say: Here that slope is negative four. Increasing the prediction reduces the loss. Now give the
          weight and bias equal tiny nudges. Which one moves this prediction farther?
        hold: 1.1
        visual_cues:
          - id: sensitivity-slope-result
            phrase: Here that slope is negative four
            targets:
              - slope-ratio
            color: yellow
            linger: 0.2
          - id: sensitivity-compare
            phrase: equal tiny nudges
            targets:
              - parameter-nudges
            color: cyan
            linger: 0.2
      - say: "The weight's nudge gets multiplied by the input, so its effect is twice as large. Multiply
          those sensitivities along each path: the weight gradient is negative eight, and the bias
          gradient is negative four. A gradient measures local influence on the loss."
        hold: 0.8
        visual_cues:
          - id: sensitivity-weight
            phrase: effect is twice as large
            targets:
              - weight-sensitivity
            color: blue
            linger: 0.2
          - id: sensitivity-gradients
            phrase: "Multiply those sensitivities along each path: the weight gradient is negative eight, and
              the bias gradient is negative four"
            targets:
              - parameter-gradients
            color: yellow
            linger: 0.2
  - id: reverse-mode
    title: Reuse the local rules in reverse
    visual: Four large forward operation stations become a reverse sweep. Seed one multiplies by the
      residual, passes through subtraction, splits at addition, and uses saved input two on the
      weight branch.
    beats:
      - say: Backpropagation organizes that calculation as a graph. First compute forward and save the values we'll need again.
          Going back, visit each output before its parents so that every contribution has arrived
          when a parent passes on its gradient. That's reverse topological order. Keeping those
          values costs memory. Checkpointing saves space by recomputing selected forward operations.
        hold: 0.6
        visual_cues:
          - id: reverse-forward
            phrase: compute forward
            targets:
              - forward-graph
            color: cyan
            linger: 0.2
      - say: Start at the scalar loss with a derivative of one. The half-square multiplies the incoming
          signal by the saved residual. Subtracting the fixed target passes that signal unchanged
          toward the prediction.
        hold: 0.7
        visual_cues:
          - id: reverse-seed
            phrase: derivative of one
            targets:
              - reverse-seed
            color: yellow
            linger: 0.2
          - id: reverse-residual
            phrase: multiplies the incoming signal by the saved residual
            targets:
              - reverse-residual
            color: pink
            linger: 0.2
          - id: reverse-prediction
            phrase: unchanged toward the prediction
            targets:
              - reverse-prediction
            color: cyan
            linger: 0.2
      - say: Addition sends the signal to both inputs. The bias path is finished. The multiplication rule
          uses our saved input on the weight path. One reverse sweep shares this work across all the
          parameters connected to the loss.
        hold: 0.8
        visual_cues:
          - id: reverse-branch
            phrase: sends the signal to both inputs
            targets:
              - reverse-branch
            color: green
            linger: 0.2
          - id: reverse-weight
            phrase: uses our saved input on the weight path
            targets:
              - reverse-weight
            color: blue
            linger: 0.2
  - id: one-update
    title: "What changes when the optimizer steps?"
    visual: "The model and server marks hold still as both parameters update. The two gains appear below the ruler. On the answer, the model mark travels first by the weight gain and then by the bias gain."
    beats:
      - say: >-
          These gradients came from the same prediction. Subtract a tenth of each gradient from its
          parameter. Both slopes were negative, so both parameters increase. The blue mark still records
          what the model predicted before the step.
        hold: 0.9
        visual_cues:
          - id: update-rule
            phrase: "Subtract a tenth"
            targets: [optimizer-rule]
          - id: update-apply
            phrase: "both parameters increase"
            targets: [updated-parameters]
      - say: >-
          The weight went up by eight tenths, and the input doubles that gain. The bias adds four
          tenths more. Starting from two, where will the next blue mark land?
        hold: 2.1
        caption_starts: ["The bias adds", "Starting from two"]
        visual_cues:
          - id: update-weight-contribution
            phrase: "input doubles that gain"
            targets: [prediction-contributions]
          - id: update-bias-contribution
            phrase: "bias adds four tenths"
            targets: [prediction-contributions]
      - say: >-
          Run the new forward pass. Four milliseconds. The server measurement stays at six. With half the
          gap, the square has a quarter of its old area. Loss fell from eight to two on this request.
        hold: 1.1
        caption_starts: ["Four milliseconds", "Loss fell from eight to two"]
        visual_cues:
          - id: update-payoff
            phrase: "Four milliseconds"
            targets: [updated-request]
          - id: update-loss
            phrase: "Loss fell from eight to two"
            targets: [updated-request]
  - id: gradient-check
    title: Check the backward rule with two forward passes
    visual: At unchanged bias, perturb weight by plus and minus epsilon. A centered quotient compares
      two true loss evaluations with the analytic backward gradient. Double precision and
      smooth-point boundaries stay explicit.
    beats:
      - say: >-
          Hold the bias at zero. Move the weight a hundredth to either side of one.
          Each dot is a forward pass. Read the loss at each dot.
        hold: 0.7
        visual_cues:
          - id: check-minus
            phrase: Move the weight a hundredth
            targets:
              - finite-samples
            color: cyan
            linger: 0.2
          - id: check-readings
            phrase: Read the loss at each dot
            targets:
              - finite-ratio
            color: yellow
            linger: 0.2
      - say: >-
          From blue to pink, the weight rises by two hundredths. The loss drops by sixteen
          hundredths. What slope connects the dots?
        hold: 2.6
        caption_starts: ["What slope connects the dots"]
        visual_cues:
          - id: check-ratio
            phrase: What slope connects the dots
            targets: [finite-ratio]
      - say: >-
          Minus eight. Backpropagation gave us the same slope. For this quadratic, the centered
          slope equals the derivative at the midpoint. To check another gradient, vary one
          parameter at a time on a smooth stretch of the curve. Use double precision to measure
          the small difference in loss.
        hold: 0.7
        caption_starts: ["For this quadratic", "To check another gradient"]
        visual_cues:
          - id: check-match
            phrase: Minus eight
            targets:
              - finite-comparison
            color: green
            linger: 0.2
  - id: autograd-buffer
    title: Two paths can lead to the same parameter
    visual: One parameter feeds both multiplication slots. Two contributions of three arrive at
      the same buffer. On a fresh pass, two rows show what PyTorch and the article's scalar engine
      each keep, add, and store.
    beats:
      - say: Follow the two arrows out of a. Both slots read the same value, three. Multiply them
          and you get nine. Change a and both inputs change.
        hold: 0.6
        visual_cues:
          - id: buffer-shared
            phrase: same value
            targets:
              - shared-parameter
            color: blue
            linger: 0.2
      - say: Follow the upper path back. It contributes three, the value in the other slot.
          The lower path contributes three more. Both land in the same buffer. The derivative is six.
        hold: 0.7
        visual_cues:
          - id: buffer-first
            phrase: Follow the upper path back
            targets:
              - owned-gradient-buffer
            color: cyan
            linger: 0.2
          - id: buffer-second
            phrase: The lower path contributes three more
            targets:
              - owned-gradient-buffer
            color: pink
            linger: 0.2
      - say: Keep a at three. Build a fresh square and run backward again. PyTorch kept the first
          six. What will its buffer hold after this pass?
        hold: 2.1
        caption_starts: ["PyTorch kept the first six", "What will its buffer hold"]
        visual_cues:
          - id: buffer-again
            phrase: "Build a fresh square"
            targets: [owned-gradient-buffer]
          - id: buffer-kept
            phrase: "PyTorch kept the first six"
            targets: [owned-gradient-buffer]
      - say: Twelve. This pass adds six to the six already there. The article's scalar engine
          clears every reachable buffer before each backward pass. Its two paths add six to zero.
          It finishes at six.
        hold: 0.7
        caption_starts: ["This pass adds", "The article's scalar engine", "It finishes at six"]
        visual_cues:
          - id: buffer-repeat
            phrase: Twelve
            targets: [owned-gradient-buffer]
          - id: buffer-reset
            phrase: "clears every reachable buffer"
            targets: [owned-gradient-buffer]
          - id: buffer-fresh-result
            phrase: "It finishes at six"
            targets: [owned-gradient-buffer]
      - say: To combine micro-batches in PyTorch, clear the buffer once at the start of the
          effective batch. Keep the weights fixed while the gradients add up. After the optimizer
          step, run forward with the new weights.
        hold: 0.7
        visual_cues:
          - id: buffer-clear
            phrase: clear the buffer once
            targets:
              - owned-gradient-buffer
            color: yellow
            linger: 0.2
  - id: local-rules
    title: Layers route a signal using saved forward values
    visual: Three successive full-stage constructions show dense outer product and transposed input
      gradient, a ReLU mask, then a saved max-pool winner receiving a signed gradient.
    beats:
      - say: Dense layers use the same multiplication rule in arrays. Pair every incoming error component
          with every saved input to form the weight-gradient matrix. The bias receives the incoming
          signal, and the transposed weight matrix sends a signal toward earlier layers.
        hold: 0.8
        visual_cues:
          - id: dense-outer
            phrase: Pair every incoming error component with every saved input
            targets:
              - dense-weight-gradient
            color: yellow
            linger: 0.2
          - id: dense-input
            phrase: transposed weight matrix
            targets:
              - dense-input-gradient
            color: blue
            linger: 0.2
      - say: ReLU uses the input it saved. A positive input passes the incoming gradient. Follow
          minus four through the left gate. A negative input blocks it, so the middle gate sends
          back zero. At exactly zero the curve has a corner. The derivative is undefined there,
          and this backward rule returns zero. If a gate stays closed on every example, it gets
          zero gradient along this path. A change in an earlier layer or a step from stored
          momentum can open it again.
        hold: 0.8
        visual_cues:
          - id: relu-mask
            phrase: positive input passes
            targets:
              - relu-routing
            color: green
            linger: 0.2
          - id: relu-block
            phrase: a negative input blocks it
            targets:
              - picture
          - id: relu-zero
            phrase: this backward rule returns zero
            targets:
              - picture
      - say: Max pooling saves the winning location. During backward, the incoming gradient goes to that
          location, including its sign. The other cells receive zero from this window. If windows
          overlap, their contributions add. Ties require an explicit winner convention; this example
          chooses the first maximum in row-major order.
        hold: 0.8
        visual_cues:
          - id: pool-save
            phrase: Max pooling saves the winning location
            targets:
              - pool-routing
          - id: pool-route
            phrase: goes to that location
            targets:
              - pool-routing
            color: pink
            linger: 0.2
  - id: nonlinear-request
    title: "Which hidden weight receives the error?"
    visual: "Two labeled branches predict the same delay as the affine model. Both receive a backward signal. The closed ReLU stops one signal, and only the open branch changes its hidden parameters under plain SGD."
    beats:
      - say: >-
          Run the same request through a model with two hidden units. Each row has its own weight and bias. Read the upper
          row first. It gets two. The lower row multiplies by minus one and adds one, giving minus one.
          ReLU keeps the upper value and sends zero along the lower row.
        hold: 0.7
        visual_cues:
          - id: network-weights
            phrase: "Run the same request"
            targets: [network-parameters]
          - id: network-h
            phrase: "ReLU keeps the upper value"
            targets: [network-gates]
      - say: >-
          Each output weight starts at one. Add the two contributions and an output bias of zero. The
          model again predicts two milliseconds. The server measured six, so the residual is minus four
          and the loss is eight. How far back along each row can that error travel?
        hold: 2.2
        visual_cues:
          - id: network-output-weights
            phrase: "Each output weight"
            targets: [network-output]
          - id: network-y
            phrase: "Add the two contributions"
            targets: [network-output]
          - id: network-residual
            phrase: "residual is minus four"
            targets: [network-output]
          - id: network-question
            phrase: "How far back"
            targets: [network-backward]
      - say: >-
          At the output weights, multiply the residual by the activation each row supplied. The upper output weight gets a gradient of minus eight. The lower activation was zero, so its
          output weight gets zero. The output bias gets the residual itself. Now
          send minus four back along both rows, since both output weights were one.
        hold: 0.65
        visual_cues:
          - id: network-out-grad
            phrase: "At the output weights"
            targets: [network-output]
          - id: network-incoming
            phrase: "back along both rows"
            targets: [network-backward]
      - say: >-
          Follow the two signals past the gates. Only the upper gate passes its signal. It reaches the
          hidden bias unchanged. Multiply by the saved input, two, for the hidden weight gradient of
          minus eight. Both lower gradients are zero for this request.
        hold: 0.85
        visual_cues:
          - id: network-backward
            phrase: "past the gates"
            targets: [network-backward]
          - id: network-gradient-result
            phrase: "reaches the hidden bias"
            targets: [network-gradients]
      - say: >-
          Take one plain gradient descent step at point zero five. The two active weights each gain four
          tenths. The active hidden bias and the output bias each gain two tenths. Now run forward again.
          The upper unit produces three. Its output weight multiplies that by one point four. Add the new
          output bias and we get four point four milliseconds. The remaining miss costs one point two
          eight square milliseconds.
        hold: 1.05
        visual_cues:
          - id: network-parameters
            phrase: "Take one plain gradient descent step"
            targets: [network-parameters]
          - id: network-recompute
            phrase: "upper unit produces three"
            targets: [network-hidden]
          - id: network-product
            phrase: "output weight multiplies"
            targets: [network-output]
          - id: network-update
            phrase: "Add the new output bias"
            targets: [network-output]
          - id: network-loss-result
            phrase: "remaining miss costs"
            targets: [network-output]
  - id: network-transfer
    title: "Work one step on a new request"
    visual: "Follow the error through the open upper gate. After the update, the new output weight, activation and bias stay together while the viewer computes the prediction."
    beats:
      - say: >-
          Reset the network. This time the input is three. The upper gate passes three.
          The lower gate closes. The network predicts three milliseconds and the server measures seven.
          That's an error of minus four.
        hold: 0.85
        visual_cues:
          - id: transfer-forward
            phrase: "The upper gate passes three"
            targets: [transfer-network]
          - id: transfer-output
            phrase: "The network predicts three milliseconds"
            targets: [transfer-network]
      - say: >-
          The upper output weight multiplied three on the forward pass. Its gradient is minus four
          times three, or minus twelve. That weight was one, so minus four comes back through the
          upper gate. The hidden weight also multiplied three. It gets the same gradient.
          Each active bias gets minus four.
        hold: 0.7
        visual_cues:
          - id: transfer-gradients
            phrase: "or minus twelve"
            targets: [transfer-network]
          - id: transfer-back
            phrase: "comes back through the upper gate"
            targets: [transfer-network]
          - id: transfer-bias
            phrase: "Each active bias"
            targets: [transfer-network]
      - say: >-
          The rate is point zero two five. Each active weight gains three tenths.
          Each active bias gains a tenth. Run the upper unit again. It now gives four.
          Multiply that four by the new output weight and add the output bias.
          How long is the predicted wait?
        hold: 3.1
        caption_starts: ["Run the upper unit again", "How long is the predicted wait"]
        visual_cues:
          - id: transfer-weights
            phrase: "each active weight gains"
            targets: [transfer-network]
          - id: transfer-bias-step
            phrase: "Each active bias gains a tenth"
            targets: [transfer-network]
          - id: transfer-hidden
            phrase: "It now gives four"
            targets: [transfer-network]
          - id: transfer-product
            phrase: "Multiply that four by the new output weight"
            targets: [transfer-network]
          - id: transfer-prediction
            phrase: "Add the output bias"
            targets: [transfer-prediction]
      - say: >-
          Five point three milliseconds. The miss shrank from four milliseconds to one point seven.
          Half its square is about one point four five square milliseconds, down from eight.
        hold: 1.25
        caption_starts: ["The miss shrank from four", "Half its square"]
        visual_cues:
          - id: transfer-result
            phrase: "Five point three milliseconds"
            targets: [transfer-result]
          - id: transfer-loss
            phrase: "about one point four five square milliseconds"
            targets: [transfer-network]
  - id: training-loop
    title: "What survives an optimizer step?"
    visual: "The affine model's weight, saved forward tensors and gradient buffer change on separate cues. An unused parameter with momentum distinguishes None from zero. The dropout demonstration ends with training and recording both restored."
    beats:
      - say: >-
          Put the affine model back in the training loop. The weight still has a gradient from the
          preceding batch. Clear it to None. Run a forward pass, compute the scalar loss, then run
          backward. The buffer now holds minus eight. The weight is still one.
        hold: 0.7
        visual_cues:
          - id: loop-clear
            phrase: "Clear it to None"
            targets: [loop-stage-0]
          - id: loop-forward
            phrase: "Run a forward pass"
            targets: [loop-stage-1]
          - id: loop-loss
            phrase: "scalar loss"
            targets: [loop-stage-2]
          - id: loop-backward
            phrase: "run backward"
            targets: [loop-stage-3]
      - say: >-
          Backward normally releases the tensors saved for that pass. You can still read the loss
          value. Now step the optimizer. The weight moves to one point
          eight. The gradient buffer still holds minus eight. Run a fresh forward pass to measure the new
          prediction.
        hold: 0.8
        visual_cues:
          - id: loop-release
            phrase: "releases the tensors"
            targets: [loop-buffer-contract]
          - id: loop-step
            phrase: "step the optimizer"
            targets: [loop-stage-4]
      - say: >-
          This batch skipped a weight. Its value is one, and its momentum buffer still holds two.
          If its gradient stays None, PyTorch skips that weight. What happens if the gradient is zero?
        hold: 1.8
        visual_cues:
          - id: loop-none
            phrase: "gradient stays None"
            targets: [loop-buffer-contract]
          - id: loop-zero-question
            phrase: "What happens if the gradient is zero"
            targets: [loop-buffer-contract]
      - say: >-
          Momentum still moves it. Nine tenths of the old buffer gives one point eight.
          At a learning rate of one tenth, the weight drops to point eight two.
          Clear the gradients when you start the next effective batch.
        hold: 0.75
        caption_starts: ["the weight drops to point eight two"]
        visual_cues:
          - id: loop-momentum
            phrase: "Nine tenths of the old buffer"
            targets: [loop-buffer-contract]
          - id: loop-zero
            phrase: "the weight drops to point eight two"
            targets: [loop-buffer-contract]
          - id: loop-next
            phrase: "Clear the gradients"
            targets: [loop-stage-0]
      - say: >-
          Switch to evaluation mode. Send the same input through dropout. All three paths carry it.
          Batch normalization uses its stored statistics when available. Otherwise it uses this
          batch. Look at the saved graph. Recording is on, so this pass saved tensors for backward.
        hold: 0.65
        visual_cues:
          - id: loop-eval
            phrase: "Switch to evaluation mode"
            targets: [evaluation-behavior]
          - id: loop-dropout
            phrase: "Send the same input through dropout"
            targets: [evaluation-behavior]
      - say: >-
          Run the same input inside no grad. All three paths still carry it. This time the graph
          stays empty. No grad pauses reverse-mode recording in this thread. Leave the block and
          switch back to training mode for the next batch.
        hold: 0.9
        visual_cues:
          - id: loop-no-grad
            phrase: "inside no grad"
            targets: [evaluation-recording]
          - id: loop-return
            phrase: "switch back to training mode"
            targets: [evaluation-behavior]
  - id: batches
    title: "Who gets a say in this update?"
    visual: "A fixed-width strip gives each request a share of the gradient. Weighting two chunks equally expands the lone request. A token grid changes the denominator, then a six-request strip compares update counts."
    beats:
      - say: >-
          Start three requests at zero weight and zero bias. Multiply each residual by its own input. B is five milliseconds short and its input is two, so
          it contributes minus ten to the weight gradient. Give each request an equal share. The full mean gradient is the
          sum divided by three.
        hold: 0.7
        visual_cues:
          - id: batch-rows
            phrase: "each request an equal share"
            targets: [batch-shares]
          - id: batch-full
            phrase: "full mean gradient"
            targets: [chunk-gradient-buffer]
      - say: >-
          Now memory fits only two requests at once. Put A and B together, then process C alone. We still
          want that original mean. Suppose we give half the strip to each chunk. Look at how much room C
          takes. Does this still train the same objective?
        hold: 2.1
        visual_cues:
          - id: batch-group
            phrase: "Put A and B together"
            targets: [chunk-partition]
          - id: batch-wrong
            phrase: "half the strip"
            targets: [batch-shares]
      - say: >-
          C now has twice the influence of A. It also has the largest gradient magnitude, so the combined slope is steeper. To give each request its original share, give the pair two thirds of the strip. Scale
          each chunk's mean loss by its share before backward. Keep the parameters fixed during both
          calls. The buffer recovers the original gradient. Now take one step.
        hold: 0.85
        visual_cues:
          - id: batch-wrong-result
            phrase: "combined slope is steeper"
            targets: [chunk-gradient-buffer]
          - id: batch-repair
            phrase: "pair two thirds"
            targets: [batch-shares]
          - id: batch-weight
            phrase: "buffer recovers"
            targets: [chunk-gradient-buffer]
      - say: >-
          Now each numbered square is a token loss. The first row has three targets and four padding
          slots. The second row has seven targets. How many targets should we divide by?
        hold: 2.1
        visual_cues:
          - id: token-mean
            phrase: "Now each numbered square is a token loss"
            targets: [token-weights]
          - id: token-question
            phrase: "How many targets"
            targets: [token-weights]
      - say: >-
          There are ten targets in all. Each one gets a tenth of the weight. The first row supplies
          three tenths and the second supplies seven tenths. The combined mean is three point four.
          With independent examples, that weighting also recovers the full batch gradient.
          Training-mode batch normalization uses the statistics of each group, so splitting the
          batch can change the losses themselves.
        hold: 0.7
        caption_starts: ["The combined mean is three point four"]
        visual_cues:
          - id: token-count
            phrase: "There are ten targets in all"
            targets: [token-weights]
          - id: token-weight
            phrase: "The first row supplies"
            targets: [token-weights]
          - id: token-result
            phrase: "The combined mean is three point four"
            targets: [token-weights]
      - say: >-
          Now compare taking a separate step after each batch. Here are six requests repeated ten times.
          Full-batch descent steps after all six. A mini-batch of two steps three times per pass. Online
          descent steps after each request. That's sixty chances to move instead of ten on the same data.
          With uniform independent sampling the mean gradient is unbiased, and averaging independent examples divides the gradient covariance by the batch size. Check the learning rate again and measure validation loss and throughput when you
          change it.
        hold: 0.85
        visual_cues:
          - id: batch-regimes
            phrase: "six requests repeated ten times"
            targets: [batch-regimes]
          - id: batch-mini
            phrase: "mini-batch of two"
            targets: [batch-regimes]
          - id: batch-online
            phrase: "Online descent"
            targets: [batch-regimes]
  - id: learning-rate
    title: "How far should one step go?"
    visual: "All four learning rates start from the same signed miss on one fixed plot. Successive steps show contraction, an exact fit, oscillation and divergence. A negative input tests the direction of the weight update."
    beats:
      - say: >-
          Return to our first request, with a weight of one, bias zero, and input two. The dot starts
          four milliseconds below the target. Follow the two paths that change the prediction. The weight
          path multiplies the residual by the input on the way back and by that input again on the way
          forward. The bias adds one more path. That's where x squared plus one comes from. After each
          step, the residual is multiplied by one minus the learning rate times that sum.
        hold: 0.8
        visual_cues:
          - id: rate-rule
            phrase: "x squared plus one"
            targets: [rate-residual-rule]
      - say: >-
          For this input the sum is five. Try a rate of one tenth. Each step closes half the remaining
          gap. At one fifth the multiplier is zero. The very first step lands on the target.
        hold: 0.65
        visual_cues:
          - id: rate-contract
            phrase: "rate of one tenth"
            targets: [rate-trajectory-0]
          - id: rate-exact
            phrase: "At one fifth"
            targets: [rate-trajectory-1]
      - say: >-
          What happens if we double that rate once more? At point four the multiplier is minus one. Watch
          the distance from zero on each side. The prediction keeps crossing the target, and loss stays
          fixed. At one half, each crossing carries it farther away. Each run starts with the same gradient.
          After the first step, the new residual determines the next gradient.
        hold: 1
        caption_starts: ["At point four the multiplier is minus one", "At one half"]
        visual_cues:
          - id: rate-boundary
            phrase: "At point four"
            targets: [rate-trajectory-2]
          - id: rate-diverge
            phrase: "At one half"
            targets: [rate-trajectory-3]
      - say: >-
          A nonzero miss shrinks here when the multiplier has magnitude below one. That puts the rate
          strictly between zero and point four. Many parameter pairs fit this one example. Two times the
          weight plus the bias just has to equal six.
        hold: 0.75
        visual_cues:
          - id: rate-valley
            phrase: "Many parameter pairs"
            targets: [rate-residual-rule]
      - say: >-
          Set the rate back to a tenth. Reverse the input and the starting weight together. The same blue
          mark still falls short of six. Which direction should the weight move now?
        hold: 2.1
        visual_cues:
          - id: rate-sign
            phrase: "Reverse the input"
            targets: [rate-signed-input]
      - say: >-
          The weight gradient is positive eight. Subtract eight tenths from the weight and add four
          tenths to the bias. Run the model again. A more negative weight times a negative input raises
          the prediction to four.
        hold: 1.1
        visual_cues:
          - id: rate-sign-step
            phrase: "weight gradient is positive eight"
            targets: [rate-signed-input]
          - id: rate-sign-payoff
            phrase: "Run the model again"
            targets: [rate-signed-input]
  - id: deep-gradients
    title: "What happens to a gradient across depth?"
    visual: "A signal crosses five contracting or expanding layers. On one square set of axes, a finite vector is clipped to a radius and then compared with clipping each coordinate separately."
    beats:
      - say: >-
          Trace one backward signal toward the first layer. Each layer halves this signal. By the time it
          reaches the first layer, just one thirty-second is left. Now let every layer multiply by one
          and a half. The signal grows at every crossing. Real layer Jacobians can shrink one direction
          and expand another.
        hold: 0.85
        visual_cues:
          - id: deep-contract
            phrase: "Each layer halves this signal"
            targets: [contracting-chain]
          - id: deep-expand
            phrase: "multiply by one and a half"
            targets: [expanding-chain]
      - say: >-
          Look at this finite gradient with coordinates six and eight. Its length is ten. Suppose the
          largest length you want is five. Where on this plot would you put the tip if you wanted to keep
          its direction?
        hold: 2.1
        visual_cues:
          - id: deep-vector
            phrase: "this finite gradient"
            targets: [clipped-gradient-vector]
          - id: deep-cap
            phrase: "largest length you want is five"
            targets: [clipping-result]
      - say: >-
          Bring it halfway back along the same ray. Both coordinates shrink by the same factor. That's
          norm clipping. Now try capping each coordinate at five. That tip lands somewhere else. It
          points in a different direction, and its distance from the origin still exceeds five.
        hold: 0.8
        visual_cues:
          - id: deep-clip
            phrase: "halfway back along the same ray"
            targets: [clipped-gradient-vector]
          - id: deep-value
            phrase: "capping each coordinate at five"
            targets: [clipping-result]
      - say: >-
          Accumulate all the backward passes first. With mixed precision, unscale the gradient. Clip the
          combined vector, then step the optimizer. Momentum or Adam can still turn the final parameter
          update away from this ray. If a value is already infinite or NaN, trace back to the first
          failing operation.
        hold: 0.9
        visual_cues:
          - id: deep-order
            phrase: "all the backward passes"
            targets: [clipping-order]
          - id: deep-unscale
            phrase: "unscale the gradient"
            targets: [clipping-order]
          - id: deep-clip-stage
            phrase: "Clip the combined vector"
            targets: [clipping-order]
          - id: deep-step
            phrase: "step the optimizer"
            targets: [clipping-order]
  - id: initialization
    title: Choose the signal scale before learning starts
    visual: Variance contributions form a sum. Equal-width Xavier scaling controls it. Symmetric points
      then pass through ReLU; He widens the same identified points and restores their output second
      moment. Their positions and second moment use the same scale on both passes.
    beats:
      - say: Initialization sets the signal scale before the first update. Take independent, centered weights and inputs of unit variance. Each input brings
          another term into the weighted sum. Those terms have variances that add. With two hundred
          and fifty-six inputs, the variance of the sum is two hundred and fifty-six. Scaling the weight variance inversely with fan-in keeps that sum controlled.
        hold: 0.7
        visual_cues:
          - id: init-sum
            phrase: variances that add
            targets:
              - variance-sum
            color: cyan
            linger: 0.2
          - id: init-scale
            phrase: inversely with fan-in
            targets:
              - initial-weight-rule
            color: yellow
            linger: 0.2
      - say: Xavier balances forward fan-in and backward fan-out for roughly linear, centered activations.
          For equal-width layers, its weight variance is one over the width. Random, independently
          initialized weights also let hidden units learn different roles. For different input and output widths, add the
          two widths together. Divide two by that sum for the gain-one Xavier variance. Its normal standard
          deviation is the square root of that variance. For a symmetric uniform distribution, divide six
          by the sum of the two widths and take the square root. Use that distance on either side
          of zero. Different
          outgoing weights can already break the symmetry of units with equal incoming weights. Zero
          biases with independent weights are common.
        hold: 0.7
        visual_cues:
          - id: init-xavier
            phrase: balances forward fan-in and backward fan-out
            targets:
              - initial-weight-rule
            color: blue
            linger: 0.2
          - id: init-normal
            phrase: Its normal standard deviation
            targets:
              - picture
          - id: init-uniform
            phrase: a symmetric uniform distribution
            targets:
              - picture
          - id: init-random
            phrase: hidden units learn different roles
            targets:
              - picture
      - say: Now pass a symmetric signal through ReLU. Its negative half becomes zero, halving the expected
          squared activation. He initialization doubles the preactivation variance to compensate.
          Watch the same points widen, then pass through ReLU. This preserves a second moment, the average squared activation. ReLU's output has
          a positive mean, so that second moment differs from its variance. For He initialization, divide two by the fan-in to get weight variance. Take its square root
          for the normal standard deviation.
        hold: 0.8
        visual_cues:
          - id: init-relu
            phrase: negative half becomes zero
            targets:
              - initialization-signal
            color: pink
            linger: 0.2
          - id: init-he
            phrase: He initialization doubles the preactivation variance to compensate
            targets:
              - initial-weight-rule
              - initialization-signal
            color: yellow
            linger: 0.2
          - id: init-he-points
            phrase: same points widen
            targets:
              - initialization-signal
            color: green
            linger: 0.2
          - id: init-moment
            phrase: preserves a second moment
            targets:
              - initialization-moment
            color: green
            linger: 0.2
  - id: diagnosis
    title: "Which part of the update failed?"
    visual: "Two attempts run from identical weights and gradients. The loss rises on the first and falls after a smaller step. Separate readouts isolate stale gradients, a square root outside its domain, a blocked ReLU and diverging holdout curves."
    beats:
      - say: >-
          Freeze one reproducible batch. We're back at the original weight of one, and the checked weight
          gradient is minus eight. Take a step with rate one half. Loss was eight. Now it's eighteen.
          What would you change first?
        hold: 2.15
        visual_cues:
          - id: diagnostic-step
            phrase: "Take a step with rate one half"
            targets: [diagnostic-state]
      - say: >-
          Reload the original weights and keep the same batch. Try the step at one tenth. Loss falls to
          two. The smaller step improved the same example with the same gradient. If a gradient check
          passes but loss rises after the step, inspect the update rule and step size.
        hold: 0.75
        caption_starts: ["Try the step at one tenth", "Loss falls to two"]
        visual_cues:
          - id: diagnostic-repair
            phrase: "Reload the original weights"
            targets: [diagnostic-state]
          - id: diagnostic-retry
            phrase: "Try the step at one tenth"
            targets: [diagnostic-state]
      - say: >-
          Now watch a buffer across two backward calls. It doubles on identical data with fixed weights.
          Check where the effective batch starts and where gradients are cleared. If loss becomes
          nonfinite, trace the first invalid operation. Here the input is finite. Its real square root is
          already undefined. Clipping the gradient later can't recover that forward pass.
        hold: 0.7
        visual_cues:
          - id: diagnostic-buffer
            phrase: "buffer across two backward calls"
            targets: [diagnostic-state]
          - id: diagnostic-state
            phrase: "first invalid operation"
            targets: [diagnostic-state]
      - say: >-
          For an early layer with a tiny gradient, inspect the saved preactivation. This unit got a
          negative value on this example. Check whether it stays inactive across a batch. Also check the
          initialization and the size of the optimizer step.
        hold: 0.65
        visual_cues:
          - id: diagnostic-small
            phrase: "saved preactivation"
            targets: [diagnostic-state]
      - say: >-
          Compare training and validation losses under the same evaluation conditions. Two curves that
          stay high could mean missing features, heavy regularization, limited capacity or a failed
          optimizer. First see whether the model can fit a small clean batch. Now follow this different
          run. Training loss keeps falling as validation turns upward. That gap calls for a check of the
          split, the traffic mix and possible leakage. Compare regularization or early stopping on
          validation data.
        hold: 0.95
        visual_cues:
          - id: diagnostic-high
            phrase: "Two curves that stay high"
            targets: [diagnostic-curves]
          - id: diagnostic-curves
            phrase: "this different run"
            targets: [diagnostic-curves]
          - id: diagnostic-gap
            phrase: "as validation turns upward"
            targets: [diagnostic-curves]
  - id: validation
    title: "Which weights should we restore?"
    visual: "The latest evaluated point and the saved minimum have independent markers. A second run zooms the validation loss scale and shows a new best checkpoint that uses up patience."
    beats:
      - say: >-
          That first training request improved. For a deployment decision, divide the data by what you'll
          do with it. Fit the weights and preprocessing on training data. Use validation to choose the
          model and stopping time. Reserve the test set for the final estimate. Repeated choices can
          overfit validation. Keep related requests in one split if they would leak information. For
          future traffic, a chronological holdout can better reflect what the server will face.
        hold: 0.8
        visual_cues:
          - id: validation-roles
            phrase: "Use validation to choose"
            targets: [validation-roles]
          - id: validation-test
            phrase: "Reserve the test set"
            targets: [validation-roles]
      - say: >-
          Here's a run with a patience budget of three validation checks. Save a copy of the weights at
          each new minimum. The next three losses fall. Watch the saved checkpoint follow them. At epoch
          four its loss is one point eight.
        hold: 0.8
        visual_cues:
          - id: validation-build
            phrase: "patience budget of three"
            targets: [validation-checkpoint]
          - id: validation-fall
            phrase: "next three losses fall"
            targets: [validation-checkpoint]
      - say: >-
          Two later checks come in higher. The green checkpoint stays put. The third spends the last of
          the patience budget. Which point should we load for evaluation?
        hold: 2.05
        visual_cues:
          - id: validation-later
            phrase: "Two later checks"
            targets: [validation-patience]
          - id: validation-patience
            phrase: "third spends the last"
            targets: [validation-patience]
      - say: >-
          Restore epoch four. Save a deep copy when the weights reach a new low. A reference can share
          storage with weights that keep changing. To resume training you also need the optimizer,
          scheduler and random state.
        hold: 0.75
        visual_cues:
          - id: validation-restore
            phrase: "Restore epoch four"
            targets: [validation-checkpoint]
      - say: >-
          Now zoom in on a new run. Patience is two checks. To reset it, loss must drop by more than one
          hundredth from the last reset. We start at one. At the second check, loss drops to point nine
          nine five. That's a new low, so we save the weights. The drop is only half of what we'd need to
          reset patience.
        hold: 0.8
        visual_cues:
          - id: validation-small
            phrase: "new run"
            targets: [validation-checkpoint]
          - id: validation-save
            phrase: "second check"
            targets: [validation-checkpoint]
      - say: >-
          The third check is slightly worse. Patience is gone. Which weights will survive?
        hold: 2.05
        visual_cues:
          - id: validation-last
            phrase: "third check"
            targets: [validation-patience]
      - say: >-
          Epoch two survives. The save rule kept the lowest loss. The reset rule measured progress
          against the last reset, so even several small improvements could have counted together.
          Evaluate the restored model in evaluation mode on the untouched test set once your choices are
          fixed.
        hold: 1.05
        visual_cues:
          - id: validation-small-restore
            phrase: "Epoch two survives"
            targets: [validation-checkpoint]
  - id: next-loss
    title: "Which class score should rise?"
    visual: "The three probabilities occupy a common axis. The docs gradient crosses zero when its target is subtracted. The last shot shows the raw scores that go into the loss and how it shifts them for normalization."
    beats:
      - say: >-
          Sometimes the output is a choice. Take an issue labeled as bug, docs, or security. A classifier
          gives each class a raw score called a logit. Softmax turns those scores into probabilities. The
          model favors security.
        hold: 0.7
        visual_cues:
          - id: classification-softmax
            phrase: "Softmax turns those scores"
            targets: [classification-probabilities]
      - say: >-
          The maintainer resolves the issue as docs. That's the target. Cross-entropy penalizes the model
          for giving that class only three tenths of the probability. If you could adjust these logits
          directly, which score would a descent step raise?
        hold: 2.25
        visual_cues:
          - id: classification-target
            phrase: "resolves the issue as docs"
            targets: [classification-target]
          - id: classification-question
            phrase: "which score"
            targets: [classification-gradient]
      - say: >-
          For this labeled issue, take probability minus target. For docs, subtract one from three
          tenths. The bar lands at minus seven tenths. Gradient descent raises the docs score because
          its gradient is negative. The other classes subtract zero and keep positive gradients.
          Backpropagation carries all three gradients through the classifier. Averaging the loss over
          examples scales each contribution by the same factor.
        hold: 0.7
        caption_starts: ["For docs, subtract one", "The other classes subtract zero"]
        visual_cues:
          - id: classification-gradient
            phrase: "take probability minus target"
            targets: [classification-gradient]
          - id: classification-result
            phrase: "For docs, subtract one"
            targets: [classification-gradient]
      - say: >-
          Pass the raw logits and the docs label to PyTorch cross-entropy. Inside the loss, subtract
          the largest logit from all three. The largest becomes zero, so its exponential is one.
          The shift keeps the class probabilities the same and makes the log-space calculation stable.
        hold: 0.85
        visual_cues:
          - id: classification-logits
            phrase: "Pass the raw logits"
            targets: [classification-logits]
          - id: classification-shift
            phrase: "subtract the largest logit"
            targets: [classification-logits]
          - id: classification-exp
            phrase: "its exponential is one"
            targets: [classification-logits]
  - id: signed-request
    title: "Which hidden weight should move?"
    visual: "A negative complexity score switches the open branch while preserving the previous three-millisecond prediction, target, residual and rate. The viewer chooses a hidden weight and its direction before the reverse sweep and latency replay."
    beats:
      - say: >-
          This request scores two below the reference. Put minus two through the starting weights.
          The upper gate closes. The lower gate passes three.
        hold: 0.65
        visual_cues:
          - id: signed-gate
            phrase: "The upper gate closes"
            targets: [signed-gates]
      - say: >-
          The network predicts three milliseconds. The server measured seven. The error is minus
          four. Which hidden weight moves, and in which direction?
        hold: 3.2
        visual_cues:
          - id: signed-initial
            phrase: "The network predicts three milliseconds"
            targets: [signed-prediction]
          - id: signed-question
            phrase: "Which hidden weight"
            targets: [signed-decision]
      - say: >-
          Both output weights are one, so minus four reaches both gates. Only the lower gate passes
          it. For its hidden weight, multiply minus four by minus two. That gives positive eight.
          At a rate of point zero two five, subtract a fifth from the lower weight. It drops from
          minus one to minus one point two. Its bias rises to one point one.
        hold: 0.65
        caption_starts: ["Only the lower gate passes it", "That gives positive eight", "It drops from"]
        visual_cues:
          - id: signed-back
            phrase: "minus four reaches both gates"
            targets: [signed-backward]
          - id: signed-pass
            phrase: "Only the lower gate passes it"
            targets: [signed-backward]
          - id: signed-gradient
            phrase: "That gives positive eight"
            targets: [signed-weight-gradient]
          - id: signed-step
            phrase: "It drops from"
            targets: [signed-update]
      - say: >-
          Run the lower unit again. With its new weight and bias, it gives three
          and a half. Its output weight rose to one point three because its gradient was minus twelve.
          Add the output bias of a tenth. Where does that put the blue mark?
        hold: 2.05
        visual_cues:
          - id: signed-hidden
            phrase: "gives three and a half"
            targets: [signed-gates]
          - id: signed-product
            phrase: "Its output weight rose"
            targets: [signed-output]
          - id: signed-ruler
            phrase: "Where does that put the blue mark"
            targets: [signed-prediction]
      - say: >-
          It lands at four point six five milliseconds. The lower weight moved down. Multiplying
          that smaller weight by minus two pushed the prediction up. The miss shrank from four
          milliseconds to two point three five. Loss fell from eight to about two point seven six
          square milliseconds.
        hold: 2.45
        caption_starts: ["The miss shrank from four", "Loss fell from eight"]
        visual_cues:
          - id: signed-reading
            phrase: "It lands at four point six five milliseconds"
            targets: [signed-prediction]
          - id: signed-loss
            phrase: "loss fell from eight to about two point seven six square milliseconds"
            targets: [signed-loss]
