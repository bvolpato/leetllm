version: 1
id: gemm
title: GEMM at the edge of a tile
opening: lesson
source: fundamentals/gemm-naive-cuda-tensor-cores/content.md
voice: en-US-AndrewNeural
rate: +0%
sources:
  - title: "NVIDIA CUDA C++ Programming Guide: Matrix Multiplication"
    url: https://docs.nvidia.com/cuda/cuda-c-programming-guide/
  - title: NVIDIA CUTLASS Efficient GEMM
    url: https://docs.nvidia.com/cutlass/latest/media/docs/cpp/efficient_gemm.html
