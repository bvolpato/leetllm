scenes:
  - id: puzzle
    title: When does this bulb light up?
    visual: Start with a glowing bulb and switch A on. Plot each switch setting as it is tested.
      Shade the on side of a candidate line, then join the pairs of corners to find their common midpoint.
    beats:
      - say: Switch A is on. The bulb is lit. Turn A off. Now turn B on. The bulb lights again.
          What will happen if we turn A back on too?
        caption_starts:
          - Turn A off
          - Now turn B on
          - The bulb lights again
          - What will happen
        hold: 1.9
        visual_cues:
          - id: first-switch
            phrase: Turn A off
            targets:
              - lamp-bench
              - lamp-cases
            color: cyan
            linger: 0.35
          - id: other-switch
            phrase: Now turn B on
            targets:
              - lamp-bench
              - lamp-cases
            color: cyan
            linger: 0.35
      - say: Flip A. The bulb goes dark. Either switch alone lights it. Each dot records one setting.
          Can one straight line separate the lit dots from the dark ones? Make the shaded side the on side.
          Both yellow dots are in it. What does the line predict when both switches are on?
        caption_starts:
          - The bulb goes dark
          - Each dot records one setting
          - Make the shaded side the on side
          - What does the line predict
        hold: 2.3
        visual_cues:
          - id: both-switches
            phrase: Flip A
            targets:
              - lamp-bench
              - lamp-cases
            color: cyan
            linger: 0.35
          - id: boundary-attempt
            phrase: Make the shaded side the on side
            targets:
              - lamp-cases
              - lamp-bench
            color: yellow
            linger: 0.35
      - say: The cut predicts light. The bulb is dark. Could turning the line solve that?
        hold: 1.4
        visual_cues:
          - id: cut-verdict
            phrase: The cut predicts light
            targets:
              - lamp-cases
              - lamp-bench
            color: yellow
            linger: 0.35
            caption_boundary: true
      - say: Join the two lit settings. Any straight cut that puts both on one side leaves the whole segment
          there. Now join the dark settings. Their segment has to stay on the other side. The segments
          share a midpoint. A straight cut would have to put that point on both sides. Let's build a
          circuit that can bend.
        hold: 0.9
        visual_cues:
          - id: join-lit
            phrase: Join the two lit settings
            targets:
              - lamp-cases
            color: yellow
            linger: 0.35
          - id: join-dark
            phrase: Now join the dark settings
            targets:
              - lamp-cases
            color: blue
            linger: 0.35
          - id: midpoint
            phrase: The segments share a midpoint
            targets:
              - lamp-cases
              - lamp-bench
            color: cyan
            linger: 0.35
            caption_boundary: true
  - id: collapse
    title: More affine layers still make one affine map
    visual: Two scalar affine operations carry one value forward, then move together as their
      composed expression is merged algebraically.
    beats:
      - say: A neuron starts with a weighted sum and a bias. Suppose one layer doubles an input
          and adds one. A second triples that result and subtracts two. Follow our input
          through both operations.
        hold: 0.6
        visual_cues:
          - id: affine-first
            phrase: one layer doubles an input and adds one
            targets:
              - affine-chain
            color: cyan
            linger: 0.6
          - id: affine-second
            phrase: A second triples that result and subtracts two
            targets:
              - affine-chain
            color: blue
            linger: 0.6
          - id: affine-example
            phrase: Follow our input
            targets:
              - affine-chain
            color: cyan
            linger: 0.8
          - id: affine-value-input
            phrase: Follow our input through both operations.
            targets:
              - affine-chain
            color: cyan
            linger: 0.55
      - say: Substitute the first expression into the second. The whole chain becomes six times
          the input plus one. Matrix layers collapse in the same way. To make a richer
          function, we need an activation that changes this affine structure.
        hold: 0.8
        visual_cues:
          - id: merge-layers
            phrase: Substitute the first expression into the second
            targets:
              - affine-chain
              - merged-rule
            color: yellow
            linger: 0.9
  - id: hinges
    title: Where should the lamp response bend?
    visual: Keep a graph of brightness against the total switch input. Draw the first two hinges
      separately. Sweep the output coefficient from zero to minus two so the right arm drops while the
      left arm stays fixed. Probe the response to two half inputs.
    beats:
      - say: Let a hidden unit add the two switch settings. It keeps a positive sum and returns
          zero for anything below zero. That bend gives the unit its name, a rectified linear
          unit, or ReLU. With both switches off, start at zero. Turn one on to reach one.
          Turn on both to reach two.
        hold: 0.65
        visual_cues:
          - id: lamp-sweep
            phrase: Turn one on to reach one. Turn on both to reach two
            targets:
              - count-hinge
            color: cyan
            linger: 0.35
      - say: Give a second unit the same count. Subtract one before applying ReLU. Look where this second hinge
          starts to rise. If we subtract twice its height from the first hinge, what happens to the right
          end of the line?
        hold: 2.1
        visual_cues:
          - id: second-hinge
            phrase: where this second hinge starts to rise
            targets:
              - threshold-hinge
            color: blue
            linger: 0.35
      - say: Turn up the subtraction until the second hinge counts twice. The left arm stays put. The right arm
          tips down. At two, the second hinge takes away exactly what the first one added. Either switch
          alone still lights the lamp.
        caption_starts:
          - The left arm stays put
          - The right arm tips down
        hold: 1.1
        visual_cues:
          - id: lamp-subtract
            phrase: Turn up the subtraction until the second hinge counts twice
            targets:
              - lamp-combination
            color: yellow
            linger: 0.35
      - say: Suppose we replace both switches with dimmers. Each one is set halfway. What brightness does this
          circuit predict?
        hold: 2.1
      - say: Together they reach one. The second hinge is still at zero, so the lamp reaches full brightness.
          That's a prediction for a setting we never measured on the bench.
        hold: 0.9
        visual_cues:
          - id: halfway-answer
            phrase: so the lamp reaches full brightness
            targets:
              - halfway-result
              - lamp-combination
            color: yellow
            linger: 0.35
            caption_boundary: true
  - id: scorer
    title: The same building block scores a request
    visual: Familiar weighted-sum operations now combine prompt and queue scores. The bias
      shifts the sum, then sigmoid maps the logit to a bounded score.
    beats:
      - say: Will a completion request time out? On a scale from zero to ten, its prompt size is six
          and its queue wait is eight. Give prompt size a weight of point seven and queue wait a
          weight of point three. Multiply each feature by its weight and add the contributions.
        hold: 0.6
        visual_cues:
          - id: weighted-features
            phrase: add the contributions
            targets:
              - weighted-sum
            color: cyan
            linger: 0.7
      - say: Add the bias of minus four. Watch the total move back along the same scale.
          Even when both features are zero, the neuron starts at minus four. The two
          weights set the contributions, and the bias sets the baseline.
        hold: 0.6
        visual_cues:
          - id: shift-baseline
            phrase: Add the bias of minus four
            targets:
              - bias-shift
            color: pink
            linger: 0.7
      - say: Apply sigmoid to this logit. Take the exponential of the negative logit, add one,
          then divide one by that sum. Put in two point six and the score comes out about point nine three.
          To check that as a probability, take requests with that score and count how often they time out.
        caption_starts:
          - Put in two point six
          - the score comes out about point nine three
          - To check that as a probability
        hold: 0.7
        visual_cues:
          - id: sigmoid-score
            phrase: Apply sigmoid to this logit
            targets:
              - bounded-score
            color: green
            linger: 0.8
          - id: timeout-score
            phrase: the score comes out about point nine three
            targets: [bounded-score]
            color: green
  - id: forward
    title: Follow one request through two layers
    visual: A nonsymmetric weight matrix exposes one neuron per row. The two row dot products
      are revealed separately, then ReLU activations feed the output logit and sigmoid.
    beats:
      - say: Build a two-input, two-hidden-unit, one-output network. Here the weights are stored
          with one neuron per row, as in PyTorch. Take this request and pair both features
          with the first row. Its dot product is slightly positive.
        hold: 0.7
        visual_cues:
          - id: first-dot
            phrase: pair both features with the first row
            targets:
              - request-vector
              - weight-rows
              - hidden-values
            color: cyan
            linger: 0.8
          - id: first-dot-result
            phrase: Its dot product is slightly positive.
            targets:
              - hidden-values
            color: cyan
            linger: 0.55
      - say: Apply the second row to that same request. This neuron gives queue wait a much
          stronger coefficient. Both hidden values are positive, so ReLU keeps them. Each
          row measures a different aspect of the same input.
        hold: 0.6
        visual_cues:
          - id: second-dot
            phrase: Apply the second row
            targets:
              - weight-rows
              - hidden-values
            color: blue
            linger: 0.8
          - id: second-dot-result
            phrase: Both hidden values are positive, so ReLU keeps them.
            targets:
              - hidden-values
            color: cyan
            linger: 0.55
      - say: Combine those hidden values with the output weights and bias. Then apply sigmoid. We
          can trace every step from the original features to the final score. This trace
          will also give the backward pass the values it needs.
        hold: 0.8
        visual_cues:
          - id: output-dot
            phrase: Combine those hidden values
            targets:
              - output-score
            color: yellow
            linger: 0.8
  - id: affine-identity
    title: Could one affine layer replace this network?
    visual: Check the request network before sigmoid at three inputs. Pair the two opposite inputs and
      compare their combined outputs with twice the zero-input output.
    beats:
      - say: Imagine removing both ReLU gates from our scorer. The first weight matrix would feed straight into
          the second. The second matrix would also multiply the first bias. We could store the result as
          one matrix and one bias. A narrow hidden layer can limit the rank of that matrix. What changes
          when the gates go back in?
        hold: 1
        visual_cues:
          - id: affine-identity-beat-0
            phrase: The second matrix would also multiply the first bias
            targets:
              - affine-identity-mechanism
            color: cyan
            linger: 0.35
      - say: Use the output just before sigmoid. An affine function has a symmetry. Give it opposite inputs and
          their weighted parts cancel when you add the two outputs. The sum has to equal twice the output
          at zero. Test our scorer on one and four. Now reverse both signs. Finally, set both features to
          zero. Does the sum match?
        hold: 1.9
        visual_cues:
          - id: affine-identity-beat-1
            phrase: Use the output just before sigmoid
            targets:
              - affine-identity-mechanism
            color: cyan
            linger: 0.35
          - id: affine-witness-values
            phrase: Test our scorer on one and four
            targets:
              - affine-identity-mechanism
            color: cyan
            linger: 0.35
          - id: nn-affine-negative
            phrase: Now reverse both signs
            targets:
              - affine-identity-mechanism
            color: cyan
            linger: 0.35
          - id: nn-affine-zero
            phrase: set both features to zero
            targets:
              - affine-identity-mechanism
            color: cyan
            linger: 0.35
      - say: The two outputs sum to minus point seven one. Twice the output at zero is minus one. That gap
          rules out every affine replacement for this particular network. Different ReLU weights could
          still give an affine function. Here we have three measurements that settle the question.
        hold: 1
        visual_cues:
          - id: affine-identity-beat-2
            phrase: The two outputs sum to minus point seven one. Twice the output at zero is minus one
            targets:
              - affine-identity-mechanism
            color: yellow
            linger: 0.35
            caption_boundary: true
  - id: bounded
    title: A curve also controls a learning signal
    visual: One pre-activation sweeps across sigmoid and tanh. Local tangent segments and
      derivative readouts show saturation at the same input.
    beats:
      - say: Compare sigmoid with tanh at the same input. Sigmoid stays between zero and one. Tanh
          also produces negative values. Move the input through the middle and into the
          tails, and watch each curve's local slope.
        hold: 0.7
        visual_cues:
          - id: bounded-sweep
            phrase: Move the input through the middle and into the tails
            targets:
              - sigmoid-curve
              - tanh-curve
            color: cyan
            linger: 0.7
      - say: In the tails, both slopes become small. Backpropagation multiplies the arriving
          learning signal by this local slope. Repeating small factors through many hidden
          layers can weaken that signal. Sigmoid's largest slope is only one quarter, even
          at its center.
        hold: 0.7
        visual_cues:
          - id: tail-slope
            phrase: both slopes become small
            targets:
              - tail-gradients
            color: yellow
            linger: 0.8
  - id: smooth
    title: Hard and smooth gates
    visual: A probe crosses ReLU's corner, then GELU and SiLU are drawn over the same axes.
      Their negative values and local slopes are compared at minus one.
    beats:
      - say: ReLU has a different gate. Cross its corner from the negative side. The local
          derivative changes from zero to one. A negative unit blocks this path's learning
          signal; a positive unit passes it through. We use a zero backward value at the
          corner itself.
        hold: 0.7
        visual_cues:
          - id: relu-crossing
            phrase: Cross its corner from the negative side
            targets:
              - relu-curve
              - activation-slopes
            color: yellow
            linger: 0.8
      - say: Now compare the negative branch with GELU and SiLU. These smooth gates dip below zero
          instead of clipping the entire branch. Their slopes can be small, zero, or
          negative. Smoothness changes the local calculation; evaluate the resulting
          network on its task.
        hold: 0.7
        visual_cues:
          - id: smooth-negative
            phrase: compare the negative branch with GELU and SiLU
            targets:
              - gelu-curve
              - silu-curve
              - activation-slopes
            color: cyan
            linger: 0.8
  - id: activation-products
    title: What passes through a gate?
    visual: Compare the local slopes at the same input. Then follow two distinct projections into a SwiGLU
      block, pairing each activated coordinate with its own multiplier before the readout.
    beats:
      - say: A curve's height tells us what a unit passes forward. Its slope tells us how a change travels
          backward. Sigmoid's slope is its output times one minus that output. Even at its steepest,
          that's one quarter. Tanh peaks at a slope of one. Pass a unit signal through six of each of
          those peak slopes. Repeated quarters shrink it fast. The weights along a real path also affect
          the result.
        hold: 0.8
        visual_cues:
          - id: activation-products-beat-0
            phrase: Pass a unit signal through six of each of those peak slopes
            targets:
              - activation-products-mechanism
            color: cyan
            linger: 0.35
      - say: Keep the input at minus one and send a sensitivity of minus two back through each gate. Multiply
          by each local slope. ReLU blocks it. The GELU slope here is negative, so the signal changes
          sign. The SiLU slope here is positive, so it keeps its sign. A smooth gate can also have zero
          slope at its minimum. A ReLU unit can become active again if its inputs move. To reach an
          individual weight, multiply by that weight's input feature. A negative feature can flip the
          sign again.
        hold: 1
        visual_cues:
          - id: activation-products-beat-1
            phrase: Multiply by each local slope
            targets:
              - activation-products-mechanism
            color: yellow
            linger: 0.35
          - id: activation-signed-products
            phrase: multiply by that weight's input feature
            targets:
              - activation-products-mechanism
            color: cyan
            linger: 0.35
      - say: GELU multiplies its input by the standard Gaussian cumulative probability there. SiLU multiplies
          its input by its sigmoid. Swish allows an extra scale factor inside that sigmoid. A SwiGLU
          block uses SiLU on one projection of the input. A second projection of the same input supplies
          the multiplier for each coordinate. An output projection mixes the products.
        hold: 0.8
        visual_cues:
          - id: activation-products-beat-2
            phrase: A SwiGLU block uses SiLU on one projection of the input
            targets:
              - activation-products-mechanism
            color: cyan
            linger: 0.35
      - say: Try these two coordinates. The first projection gives one and minus two. Pass them through SiLU.
          The first stays positive and the second stays negative. Pair each with its multiplier from the
          other projection. Notice the two minus signs in the second pair. Both products come out
          positive. Now give the first product half weight and subtract the second product. The readout
          is about point eight six.
        hold: 1
        visual_cues:
          - id: activation-products-beat-3
            phrase: The first projection gives one and minus two
            targets:
              - activation-products-mechanism
            color: cyan
            linger: 0.35
          - id: nn-swiglu-activation
            phrase: The first stays positive and the second stays negative
            targets:
              - activation-products-mechanism
            color: cyan
            linger: 0.35
            caption_boundary: true
          - id: match-coordinates
            phrase: Pair each with its multiplier from the other projection
            targets:
              - activation-products-mechanism
            color: blue
            linger: 0.35
          - id: swiglu-product-values
            phrase: Both products come out positive
            targets:
              - activation-products-mechanism
            color: yellow
            linger: 0.35
            caption_boundary: true
          - id: nn-swiglu-output
            phrase: The readout is about point eight six
            targets:
              - activation-products-mechanism
            color: green
            linger: 0.35
            caption_boundary: true
  - id: parameters
    title: Nine adjustable values
    visual: Six connection weights are counted on the graph. Three separate bias markers
      appear at the non-input units and complete the parameter count.
    beats:
      - say: How many values can training adjust? Count one weight for each connection. The first
          layer has four, and the output layer has two. Input features supply data; the
          connection weights belong to the model.
        caption_starts:
          - The first layer has four
          - and the output layer has two
        hold: 0.7
        visual_cues:
          - id: count-connections
            phrase: one weight for each connection
            targets:
              - connection-weights
              - parameter-total
            color: cyan
            linger: 0.8
          - id: six-weights
            phrase: and the output layer has two
            targets: [parameter-total]
            color: yellow
      - say: Add one bias for each computed unit. Two hidden biases and one output bias bring the
          total to nine. For any dense layer, multiply inputs by outputs, then add the
          number of outputs for its biases.
        caption_starts:
          - Two hidden biases
          - bring the total to nine
        hold: 0.7
        visual_cues:
          - id: count-biases
            phrase: Add one bias for each computed unit
            targets:
              - neuron-biases
              - parameter-total
            color: pink
            linger: 0.8
          - id: nine-parameters
            phrase: bring the total to nine
            targets: [parameter-total]
            color: yellow
  - id: parameter-scale
    title: Where are the parameters in an image classifier?
    visual: Count connections and biases for the small scorer. Spread the three layers of the image
      classifier across one scale, keeping every layer count attached to its dimensions. Compare a dense
      connection pattern with a sliding filter.
    beats:
      - say: Keep those six weights and three biases in view. A second request uses those same
          nine values. It adds work and hidden activations, while the parameter count stays fixed.
        hold: 0.75
        visual_cues:
          - id: parameter-scale-beat-0
            phrase: six weights and three biases
            targets:
              - parameter-scale-mechanism
            color: cyan
            linger: 0.35
      - say: Flatten a square image with twenty-eight pixels on a side. Each first-layer unit gets all seven
          hundred eighty-four pixels and a bias. Now make two hundred fifty-six such units. Draw that
          layer's share. The next layer connects those units to a hundred twenty-eight new ones. The last
          layer feeds just ten outputs. Together the layers use about two hundred thirty-five thousand
          parameters. See how much of that first bar comes from connecting every pixel to every unit.
        hold: 1
        visual_cues:
          - id: parameter-scale-beat-1
            phrase: Flatten a square image with twenty-eight pixels on a side
            targets:
              - parameter-scale-mechanism
            color: cyan
            linger: 0.35
          - id: nn-dense-first
            phrase: Draw that layer's share
            targets:
              - parameter-scale-mechanism
            color: cyan
            linger: 0.35
          - id: nn-dense-second
            phrase: The next layer connects those units to a hundred twenty-eight new ones
            targets:
              - parameter-scale-mechanism
            color: blue
            linger: 0.35
          - id: nn-dense-third
            phrase: The last layer feeds just ten outputs
            targets:
              - parameter-scale-mechanism
            color: yellow
            linger: 0.35
          - id: dense-count-values
            phrase: Together the layers use about two hundred thirty-five thousand parameters
            targets:
              - parameter-scale-mechanism
            color: yellow
            linger: 0.35
            caption_boundary: true
      - say: Look at one dense unit. Move an edge across the image and a different set of weights sees it. A
          convolution slides the same local weights over the pixels. The choice matters when a useful
          pattern can move. The count tells us how many parameters we can fit. Accuracy and runtime need
          their own measurements.
        hold: 0.8
        visual_cues:
          - id: parameter-scale-beat-2
            phrase: A convolution slides the same local weights over the pixels
            targets:
              - parameter-scale-mechanism
            color: yellow
            linger: 0.35
  - id: batch
    title: One parameter set serves a batch
    visual: Four named input rows produce hidden rows using shared weights. A one-column score
      matrix is added with the same row order and explicit tensor dimensions.
    beats:
      - say: Stack four requests as rows. Multiplying by the transposed weight matrix evaluates
          each neuron on each row. Broadcasting reuses the bias vector. ReLU changes the
          values while preserving the hidden tensor's shape.
        hold: 0.7
        visual_cues:
          - id: batch-hidden
            phrase: evaluates each neuron on each row
            targets:
              - batch-input
              - batch-contract
            color: yellow
            linger: 0.8
      - say: Apply the output layer to every hidden row. The result has four rows and one score
          column. Each request keeps its place, and every request uses the same nine
          parameters. Shapes connect the layers, but they can hide a subtle mistake.
        hold: 0.7
        visual_cues:
          - id: batch-output
            phrase: Apply the output layer
            targets:
              - batch-score-column
            color: green
            linger: 0.8
  - id: transpose
    title: A valid shape can hide the wrong multiply
    visual: Correct and incorrect products use the same nonsymmetric weight matrix. Both have
      the same output shape; their different feature pairings are visible before answers
      are revealed.
    beats:
      - say: Our weight matrix is square. Both of these products have a legal shape. Study which
          weights each product pairs with the request. Will they produce the same hidden
          values?
        hold: 1.4
        visual_cues:
          - id: transpose-question
            phrase: which weights each product pairs with the request
            targets:
              - transpose-right
              - transpose-wrong
            color: blue
            linger: 0.8
      - say: Reveal the two results. Only the transposed product agrees with our
          one-neuron-per-row convention and the hand trace. A square matrix lets the wrong
          multiply run successfully. A checked sample catches the changed meaning.
        caption_starts:
          - Only the transposed product
        hold: 0.8
        visual_cues:
          - id: transpose-answer
            phrase: Reveal the two results
            targets:
              - transpose-right
              - transpose-wrong
            color: yellow
            linger: 0.8
  - id: residual
    title: Which way should the score move?
    visual: Plot binary cross-entropy for an observed timeout. Move the same logit along the loss curve,
      then return to the starting point and connect its tangent to the two factors in the chain rule.
    beats:
      - say: Take a different request. Its prompt score is one, its queue score is four, and it actually timed
          out. The first hidden value is clipped to zero. The second passes through. The scorer
          puts this request below the halfway mark. Binary cross-entropy uses the score for the
          outcome we observed. For a completed request we'd use one minus the timeout score.
          For this timeout the loss is minus the log of its score.
          We're on the yellow dot. Which way should the logit move to bring the loss down?
        hold: 2.2
        visual_cues:
          - id: training-case
            phrase: The first hidden value is clipped to zero
            targets:
              - bce-chain
            color: cyan
            linger: 0.35
          - id: score-target
            phrase: The scorer puts this request below the halfway mark
            targets:
              - training-prediction
              - bce-chain
            color: yellow
            linger: 0.35
          - id: bce-loss
