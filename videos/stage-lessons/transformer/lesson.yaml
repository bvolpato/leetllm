  - id: failure-contract
    title: Where did the forward pass go wrong?
    visual: Repair a six-feature update before adding it to a four-feature row. Then compare two full blocks
      with identical causal masks. One computes its first normalization across each token’s features. The
      other computes it across positions. A change to the last input separates their first output rows.
    beats:
      - say: The residual for “the” has four features. The feed-forward branch expanded it to six. Suppose
          someone tries to add those six back directly. With three tokens we have eighteen entries on one
          side and twelve on the other. A reshape cannot make that addition work. Project the six features
          back into the original four, then add the matching coordinates. If the error came earlier, check
          the head split and that the mask and scores are on the same device.
        hold: 0.85
        visual_cues:
          - id: tr-failure-contract-voice-0
            phrase: eighteen entries on one side and twelve on the other
            targets:
              - failure-contract-construction
            color: cyan
            linger: 0.35
          - id: tr-failure-contract-project
            phrase: Project the six features back into the original four
            targets:
              - failure-contract-construction
            color: green
            linger: 0.35
      - say: A wrong read can still have the right shape. The cached query at position three returned exactly
          the first value. Look at which keys it was allowed to read. Select the mask for its absolute
          position and compare with the full prefix. For other symptoms, use the number that changed. A
          row of undefined weights calls for checking which keys survived masking. If the temperature
          setting does nothing, check whether it was applied to the logits before softmax.
        hold: 0.8
        visual_cues:
          - id: tr-failure-contract-voice-1
            phrase: Look at which keys it was allowed to read
            targets:
              - failure-contract-construction
            color: cyan
            linger: 0.35
          - id: tr-failure-contract-mask
            phrase: Select the mask for its absolute position
            targets:
              - failure-contract-construction
            color: green
            linger: 0.35
      - say: Now take two copies of our original three-token block. Both give every future key zero attention
          weight. Both have dropout off. Only the first normalization differs. On the left, the word
          “function” uses its own four features to compute a mean. On the right, its first feature uses a
          mean taken down the column, across all three words. Suppose we edit the first feature of the
          last word. Which block could change what “function” sends out?
        hold: 2.3
        visual_cues: []
      - say: Add four to that feature of “the.” On the left, the edit falls outside the highlighted row. Its
          mean stays put. On the right, the edit lands inside the column and moves its mean. Compare the
          output for “function” before and after the edit in each block. Only the right one changed.
          Information from the last word crossed positions during normalization, before attention ever
          used its mask. Restore normalization across features and repeat the comparison. Keep the input,
          weights, dtype and dropout settings fixed. The test checks this path through the block. A cache
          has another way to go wrong. It can leave out something the query should have read.
        hold: 1.1
        caption_starts:
          - On the left, the edit falls outside the highlighted row
          - On the right, the edit lands inside the column
          - Only the right one changed
        visual_cues:
          - id: change-last-feature
            phrase: Add four to that feature of “the”
            targets:
              - failure-contract-construction
            color: pink
            linger: 0.35
          - id: tr-failure-contract-compare-rows
            phrase: Compare the output for “function” before and after the edit in each block
            targets:
              - failure-contract-construction
            color: yellow
            linger: 0.35
  - id: fresh-decoder
    title: What did the last query actually read?
    visual: Two labeled value points share axes from prediction through repair. Each key stays paired with
      its value and weight. The last test returns to the opening three tokens. Two rows of six computed
      logits expose a changed greedy token, then agree after the absolute-position repair.
    beats:
      - say: Try a fresh pair of keys. The blue key picks out the first coordinate of the query. The green key
          picks out the second. Their values are the two points on the plot. At position one, the query
          can read both. It has a positive first coordinate and a negative second coordinate. A mixture of
          the two values lands on the line between them. Which point will it land closer to?
