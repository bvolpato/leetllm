      - say: The original Transformer paired an encoder and decoder. BERT uses an encoder. GPT uses a
          decoder. Look at the middle of this sentence. T5 hides a span from the encoder and trains the
          decoder to write the missing text. Ordinary text also supplies training examples for a decoder
          like GPT. Shift the targets by one token and each input has a next token to predict. An
