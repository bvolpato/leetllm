      - say: The dot products are two for blue and minus one for green. Divide each by the square root of two,
          the key width. Apply softmax across the two scores. Blue gets about eighty-nine percent of the
          weight. Take that share of the blue value, then add the green contribution at its tip. Read the
          two coordinates at the tip of the second arrow. The short upward step is the evidence that the
          green key contributed. This is a pair of features. The vocabulary projection comes later.
