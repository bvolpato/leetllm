          the earlier keys and values for the next read. In translation the green source row stays
          fixed. Every new target query can reuse the same projected source keys and values for
          cross-attention. Running without a cache recomputes those projections. Caching trades that
          repeated work for memory. Reading a longer history and processing the initial prompt still
          take computation. Scaling studies relate training resources to loss. To choose an architecture
          for a particular task, measure performance on that task.
