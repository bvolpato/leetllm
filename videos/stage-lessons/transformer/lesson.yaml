scenes:
  - id: intro
    title: Which row scores the next word?
    visual: A cursor blinks after the three words. The bar heights show the four features of each word.
      The last row lights up, and its bracket reaches back across the whole prompt.
    beats:
      - say: The cursor is waiting after “function returns the.” Each word has four numbers underneath it.
          Which row will the decoder use to score the word at the cursor?
        hold: 2.2
        visual_cues:
          - id: enter-prefix
            phrase: function returns the
            targets:
              - prefix
            color: blue
            linger: 0.35
          - id: enter-rows
            phrase: four numbers underneath it
            targets:
              - input-rows
            color: blue
            linger: 0.3
      - say: Follow the row for “the.” It sits at position two because we counted from zero. It can read all
          three positions, including its own. The empty slot is where its prediction goes.
        hold: 0.8
        visual_cues:
          - id: select-query
            phrase: Follow the row for “the”
            targets:
              - prefix
            color: yellow
            linger: 0.35
          - id: carry-row
            phrase: read all three positions, including its own
            targets:
              - history-span
            color: cyan
            linger: 0.35
      - say: This decoder has one block and one attention head. We picked the weights by hand and will use
          them for both predictions. The row for “the” starts with a lookup at vocabulary ID two.
        hold: 0.6
        visual_cues:
          - id: lookup-start
            phrase: at vocabulary ID two
            targets:
              - opening-id
            color: yellow
            linger: 0.35
  - id: embedding
    title: Give the token its content and position
    visual: The token ID selects the exact the embedding. A separately displayed position vector adds
      coordinate by coordinate to create its width-four input.
    beats:
      - say: "The token the has ID two in this vocabulary. That ID selects one learned embedding row. It is
          a lookup: the same ID selects the same row. Watch the four coordinates arrive together,
          still carrying the label the."
        hold: 0.5
        visual_cues:
          - id: embedding-lookup
            phrase: four coordinates arrive together
            targets:
              - embedding-row
            color: blue
            linger: 0.5
      - say: The token sits at position two when counting from zero. Add that position's vector. Follow the
          first coordinate, then the remaining coordinates. Content and position now share one
          four-number row. This toy uses additive positions; other architectures can rotate queries
          and keys instead.
        hold: 0.6
        visual_cues:
          - id: position-add
            phrase: Follow the first coordinate, then the remaining coordinates
            targets:
              - positioned-row
            color: cyan
            linger: 0.5
      - say: Keep this original row. A copy will enter normalization, while the original waits for the
          residual addition. The other two tokens have their own positioned rows. They will supply
          the information that this selected position can read.
        hold: 0.5
        visual_cues:
          - id: preserve-input
            phrase: original waits
            targets:
              - original-branch
            color: blue
            linger: 0.4
  - id: normalization
    title: Center and rescale one row
    visual: Four coordinate markers move on one fixed scale from the positioned row to centered values
      and then normalized values. The unchanged original remains below.
    beats:
      - say: Layer normalization starts inside this one row. Mark the mean of its four coordinates. Subtract
          that mean from each coordinate. The four points move together until their mean is zero;
          the differences between them survive this centering step.
        hold: 0.6
        visual_cues:
          - id: center-row
            phrase: Subtract that mean from each coordinate
            targets:
              - normalization-points
            color: yellow
            linger: 0.5
          - id: norm-mean
            phrase: Mark the mean of its four coordinates.
            targets:
              - norm-statistics
            color: yellow
            linger: 0.5
      - say: Now divide by the row's standard deviation, with a small epsilon inside the square root. The
          centered points spread onto the normalized scale. We use unit learned scale and zero bias.
          Labels beside the points track their current coordinates.
        hold: 0.6
        visual_cues:
          - id: rescale-row
            phrase: centered points spread onto the normalized scale
            targets:
              - normalization-points
            color: cyan
            linger: 0.5
          - id: norm-statistic
            phrase: Now divide by the row's standard deviation, with a small epsilon inside the square root.
            targets:
              - norm-statistics
            color: cyan
            linger: 0.5
      - say: Normalization prepares a view for attention. The original row stays unchanged on its own
          branch. Each token is normalized across its own features, so this step keeps token
          identities separate. Communication between positions comes next.
        hold: 0.5
        visual_cues:
          - id: norm-branch
            phrase: original row stays unchanged
            targets:
              - original-branch
            color: blue
            linger: 0.4
  - id: mask
    title: Build one query's legal read
    visual: The last input row projects to a query and scores the three prefix keys. A second view adds the
      observed fourth token during training. Its finite score changes to negative infinity before the
      exponentials are normalized.
    beats:
      - say: "A projection makes this position's query. Another makes each token's key. Here is the first query
          coordinate: multiply the normalized inputs by these fixed coefficients and add. The second
          coordinate completes the query. Our value projection keeps all four normalized coordinates."
        hold: 0.6
        visual_cues:
          - id: query-project
            phrase: multiply the normalized inputs by these fixed coefficients and add
            targets:
              - query-calculation
            color: cyan
            linger: 0.5
      - say: Compare this query with each visible key. Matching coordinates multiply, then their products add.
          Divide each score by the square root of two, our query and key width. These three scores decide
          how strongly this position will read each value row.
        hold: 0.6
        visual_cues:
          - id: key-scores
            phrase: Matching coordinates multiply, then their products add
            targets:
              - score-row
            color: yellow
            linger: 0.5
      - say: During generation the fourth word is still missing. Switch to training on a complete four-word
          example. The target now has a key and a finite score. If “the” is supposed to predict that
          fourth word, how much weight should its key receive?
        hold: 2
        visual_cues:
          - id: training-key
            phrase: Switch to training on a complete four-word example
            targets:
              - masked-row
            color: yellow
            linger: 0.35
      - say: Set its score to negative infinity before softmax. Its exponential becomes zero. For the other
          three keys, subtract the largest legal score and exponentiate. Divide by the shared total. The
          three shares become weights that sum to one. Now we can use them to mix the values.
        hold: 0.8
        caption_starts:
          - Its exponential becomes zero
        visual_cues:
          - id: causal-mask
            phrase: Set its score to negative infinity before softmax
            targets:
              - masked-row
            color: pink
            linger: 0.4
          - id: causal-weights
            phrase: become weights that sum to one
            targets:
              - legal-weights
            color: green
            linger: 0.5
  - id: attention
    title: Where will the contextual blend land?
    visual: A labeled coordinate-one/four slice shows the three value points and their convex hull. Actual
      weights scale their vectors, then transfer them head-to-tail. The completed blend is held inside the
      triangle; one small accumulator retains all four coordinates.
    beats:
      - say: "The triangle shows two coordinates of each four-number value row: coordinate one across,
          coordinate four up. Returns has the largest weight. Where will the mixture land? Start with
          function. Shrink its arrow by its weight, then place that contribution at the origin."
        hold: 0.7
        visual_cues:
          - id: mix-function
            phrase: Shrink its arrow by its weight, then place that contribution
            targets:
              - weighted-contribution
              - attention-sum
            color: blue
            linger: 0.5
      - say: Now take returns. Its weight shrinks this value arrow. Move the weighted arrow to the previous tip,
          keeping its direction and length. Its new tip is the two-source partial sum. The row on the
          right keeps all four coordinates.
        hold: 0.7
        visual_cues:
          - id: mix-returns
            phrase: Its weight shrinks this value arrow. Move the weighted arrow to the previous tip
            targets:
              - weighted-contribution
              - attention-sum
            color: pink
            linger: 0.5
      - say: The last arrow comes from the word “the.” Place it at the current tip. The tip of that third arrow
          marks the complete read, inside the triangle. All three positive weights sum to one, so the
          mixture stays inside their convex hull. Each head builds its own contextual read this way.
        hold: 0.7
        visual_cues:
          - id: mix-the
            phrase: The last arrow comes from the word “the.” Place it at the current tip
            targets:
              - weighted-contribution
              - attention-sum
            color: green
            linger: 0.5
  - id: residual
    title: Add the update to the waiting state
    visual: The actual attention vector shrinks under its scaled-identity projection. An explicitly
      labeled equal-unit close-up translates the update onto the original point, retaining both
      states and one full four-coordinate row.
    beats:
      - say: Shrink the complete read by point three five. This is our head's output projection. The arrow
          keeps its direction and scales its length. A general learned projection can mix
          coordinates too. Keep the token's original row waiting for the addition.
        hold: 0.5
        visual_cues:
          - id: output-project
            phrase: Shrink the complete read by point three five
            targets:
              - attention-update
            color: cyan
            linger: 0.5
      - say: Here is a close-up of the original state, using the same coordinate indices and equal units on
          both axes. Translate the attention update to this point. Its tip becomes the new
          contextual state. The original point stays visible, so you can see exactly what the update
          changed.
        hold: 0.7
        visual_cues:
          - id: residual-add
            phrase: Translate the attention update to this point
            targets:
              - residual-result
            color: green
            linger: 0.5
      - say: The row still belongs to the, at the same position and width. Its numbers have changed. A
          second sublayer will work inside this contextual row. It receives another normalized view
          while this residual result waits for the next addition.
        hold: 0.5
        visual_cues:
          - id: next-normalization
            phrase: another normalized view
            targets:
              - ffn-input
            color: yellow
            linger: 0.4
  - id: feed-forward
    title: Expand, reshape, and return to four coordinates
    visual: The selected normalized residual row expands into six actual preactivations. Negative bars
      move to zero under ReLU; the output projection builds four update coordinates, then the second
      residual adds them.
    beats:
      - say: The feed-forward layer uses the same weights at every position. Here it expands four inputs
          into six hidden features. The first four copy the inputs; the last two subtract pairs of
          inputs. These are the actual values before the activation, including their negative signs.
        hold: 0.6
        visual_cues:
          - id: ffn-expand
            phrase: last two subtract pairs of inputs
            targets:
              - hidden-preactivation
            color: cyan
            linger: 0.5
      - say: Which hidden features will survive? Apply ReLU. Each negative hidden value becomes zero; each
          positive value survives. Watch those bars move. This bend gives the sublayer a nonlinear
          response. The surviving features can contribute to the projected update.
        hold: 0.7
        caption_starts:
          - Each negative hidden value becomes zero
        visual_cues:
          - id: ffn-relu
            phrase: negative hidden value becomes zero
            targets:
              - hidden-activation
            color: pink
            linger: 0.5
      - say: The return projection makes a four-coordinate update. Here is one of its calculations. Bring
          that update to the waiting contextual point. Coordinate one stays fixed in this slice
          while coordinate four rises. The full four-coordinate row now completes the block.
        hold: 0.7
        visual_cues:
          - id: ffn-project
            phrase: return projection makes a four-coordinate update
            targets:
              - ffn-update
            color: green
            linger: 0.4
          - id: ffn-add
            phrase: Bring that update to the waiting contextual point
            targets:
              - block-output
            color: green
            linger: 0.5
  - id: causality
    title: Which way can a change travel?
    visual: A changed last input coordinate is physically introduced after the prediction. Recomputed
      output differences show earlier rows unchanged; a separate first-input change reaches later
      outputs.
    beats:
      - say: Before scoring words, check the whole block. Change only the final input row. Could the earlier
          outputs move? Hold that prediction, then add four to this one coordinate. The block
          recomputes attention, normalization, and both residual updates.
        hold: 0.8
        visual_cues:
          - id: change-future
            phrase: add four to this one coordinate
            targets:
              - changed-input
            color: yellow
            linger: 0.5
      - say: Compare the outputs. The first two rows stay exactly equal; the selected last row changes. The
          causal mask preserves this direction through the complete block. Now change the first
          input instead. Predict which later positions can receive that change.
        hold: 0.8
        caption_starts:
          - The first two rows stay exactly equal
          - Now change the first input instead
        visual_cues:
          - id: compare-future
            phrase: first two rows stay exactly equal
            targets:
              - causal-comparison
            color: green
            linger: 0.4
          - id: change-past
            phrase: Now change the first input instead
            targets:
              - changed-input
            color: pink
            linger: 0.4
      - say: That earlier change reaches later output rows through their legal reads. The feed-forward layer
          then transforms each updated row separately. Return to our original prefix and original
          weights. Its completed last row is ready to score the vocabulary.
        hold: 0.5
        visual_cues:
          - id: compare-past
            phrase: earlier change reaches later output rows
            targets:
              - causal-comparison
            color: cyan
            linger: 0.5
  - id: logits
    title: Turn the final state into a vocabulary choice
    visual: Final normalization supplies the selected row. Actual output-weight products construct the
      result logit, all six logits enter a stable shared softmax denominator, and greedy decoding
      reveals the selected token.
    beats:
      - say: Apply final normalization to the completed last row. Each vocabulary entry has an output weight
          vector. For result, multiply its matching coordinates and add. That dot product is one
          logit. Repeat with the other entries to score all six IDs using the same state.
        hold: 0.6
        visual_cues:
          - id: final-normalization
            phrase: final normalization
            targets:
              - final-state
            color: yellow
            linger: 0.4
          - id: result-product
            phrase: multiply its matching coordinates and add
            targets:
              - result-products
            color: green
            linger: 0.5
          - id: vocabulary-products
            phrase: Repeat with the other entries
            targets:
              - vocabulary-logits
            color: cyan
            linger: 0.5
      - say: Subtract the largest logit for numerical stability, then exponentiate. Build one shared
          denominator from all six weights. Divide each weight by that total. The resulting
          probability strip has a fixed budget of one, shared among the vocabulary entries.
        hold: 0.7
        visual_cues:
          - id: next-token-probabilities-b2-1
            phrase: Build one shared denominator from all six weights
            targets:
              - softmax-denominator
              - next-token-probabilities
            color: green
            linger: 0.5
          - id: probability-shares
            phrase: Divide each weight by that total
            targets:
              - next-token-probabilities
            color: cyan
            linger: 0.5
      - say: Which token does greedy decoding choose?
        hold: 1.2
        visual_cues: []
      - say: "It takes the largest score: result. The earlier stages earned this choice through one
          connected calculation. These hand-set weights produce a readable example. Training would
          compare such scores with observed text and adjust the weights."
        hold: 0.8
        visual_cues:
          - id: greedy-choice
            phrase: "largest score: result"
            targets:
              - chosen-token
            color: yellow
            linger: 0.5
  - id: feedback
    title: Feed the chosen ID into the next real step
    visual: The chosen result ID appends and re-embeds at position three. A fresh query and block
      produce a new full state. An explicitly pairwise coordinate-three/four score boundary compares
      the two leading candidates, with all six full-state logits retained beside it.
    beats:
      - say: Append result's actual ID, three. Look up its embedding and add the new position vector. This
          is a fresh input row for result. Its starting state comes from that lookup and position,
          while the prefix now contains four token IDs.
        hold: 0.6
        visual_cues:
          - id: append-token
            phrase: Append result's actual ID, three
            targets:
              - feedback-prefix
            color: green
            linger: 0.4
          - id: feedback-embedding
            phrase: Look up its embedding and add the new position vector
            targets:
              - feedback-input
            color: cyan
            linger: 0.5
      - say: Run the same block again. Result makes a new query and mixes four legal value rows. Follow its
          new mixture through both updates and final normalization. The earlier three block outputs
          stay equal; appending a future token preserves their legal context.
        hold: 0.7
        visual_cues:
          - id: feedback-read
            phrase: mixes four legal value rows
            targets:
              - feedback-mixture
            color: cyan
            linger: 0.5
          - id: feedback-state
            phrase: through both updates and final normalization
            targets:
              - feedback-output
            color: yellow
            linger: 0.5
      - say: Keep the output weights fixed. Predict the next winner. Result and value read coordinates three
          and four. Their scores tie when these two coordinates are equal.
        hold: 1.3
        visual_cues: []
      - say: Plot the new final row. It lies on value's side. The full vocabulary calculation now selects
          value. Each chosen ID becomes input for the next decision; that is the decoding loop.
        hold: 0.8
        caption_starts:
          - It lies on value's side
          - The full vocabulary calculation now selects value
        visual_cues:
          - id: feedback-point
            phrase: Plot the new final row
            targets:
              - decision-comparison
              - full-vocabulary-scores
            color: cyan
            linger: 0.6
          - id: feedback-choice
            phrase: full vocabulary calculation now selects value
            targets:
              - feedback-choice
            color: green
            linger: 0.6
  - id: position-designs
    title: Give order a declared mechanism
    visual: Keep the original prefix and its saved states visible. Shuffle an unmasked three-row
      attention example, exhaust a three-row learned position table, and rotate the same query/key
      pair together while preserving their relative angle.
    beats:
      - say: Move “the” from the last row to the first. For this calculation, keep each input vector intact
          and let every row read every other row. Its keys and values move together, so the output for
          “the” follows it to the top with the same numbers. This is permutation equivariance. A causal
          mask gives that move a different effect. In the first position, “the” can now read only
          itself.
        hold: 0.65
        visual_cues:
          - id: tr-position-designs-voice-0
            phrase: the output for “the” follows it to the top with the same numbers
            targets:
              - position-designs-construction
            color: cyan
            linger: 0.4
      - say: The original Transformer added sine and cosine waves at several frequencies. GPT and BERT
          learned a table of position vectors. Here the table has rows zero, one and two. The next token
          needs position three. To use that position, extend the table and evaluate the model on longer
          inputs.
        hold: 0.65
        visual_cues:
          - id: tr-position-designs-voice-1
            phrase: The original Transformer added sine and cosine waves at several frequencies. GPT and
                BERT learned a table of position vectors. Here the table has rows zero, one and two. The
                next token needs position three. To use that position, extend the table and evaluate the
                model on longer inputs.
            targets:
              - position-designs-construction
            color: cyan
            linger: 0.4
          - id: tr-position-designs-learned
            phrase: The next token needs position three
            targets:
              - position-designs-construction
            color: yellow
            linger: 0.4
      - say: "RoPE rotates query and key coordinate pairs. In this authored two-coordinate example, begin
          both vectors at one, zero and rotate by point one radians per position. Positions four and
          one give a relative angle point three and dot product about point nine five five. Move
          both positions forward by two: the relative angle and dot product stay the same. Content
          still matters. T5 offers another design, a learned relative-position bias added to
          scores."
        hold: 0.65
        visual_cues:
          - id: tr-position-designs-voice-2
            phrase: "RoPE rotates query and key coordinate pairs. In this authored two-coordinate example, begin
              both vectors at one, zero and rotate by point one radians per position. Positions four
              and one give a relative angle point three and dot product about point nine five five.
              Move both positions forward by two: the relative angle and dot product stay the same.
              Content still matters. T5 offers another design, a learned relative-position bias
              added to scores."
            targets:
              - position-designs-construction
            color: cyan
            linger: 0.4
          - id: tr-position-designs-rope
            phrase: Positions four and one give a relative angle point three and dot product about point nine
              five five.
            targets:
              - position-designs-construction
            color: yellow
            linger: 0.4
          - id: tr-position-designs-rope-shift
            phrase: "Move both positions forward by two: the relative angle and dot product stay the same."
            targets:
              - position-designs-construction
            color: yellow
            linger: 0.4
  - id: matching-scale
    title: What gives one key a larger share?
    visual: Two equal cross-scores compete against different scores in their own rows. The width example
      keeps blue unscaled attention shares on a fixed percentage scale while green scaled shares grow
      underneath. A separate token grid grows from three to six positions beside fixed-width rows.
    beats:
      - say: Let each of these two rows act as both query and key. A compared with B gives one. Reverse them and
          it still gives one. Fill in the two self-matches. Look across row A. Both scores are one, so the
          two keys split the weight evenly. Down in row B, that same score of one now competes with a two.
          The smaller score gets about twenty-seven percent. Equal dot products can receive different
          weights because each query has its own denominator. A learned query and a separate learned key
          let the model change the matching rule. The value projection chooses what each match delivers.
        hold: 0.9
        caption_starts:
          - Both scores are one
          - Down in row B
          - The smaller score gets about twenty-seven percent
        visual_cues:
          - id: tr-matching-scale-cross
            phrase: A compared with B gives one. Reverse them and it still gives one.
            targets:
              - matching-scale-construction
            color: cyan
            linger: 0.35
          - id: tr-matching-scale-raw
            phrase: Fill in the two self-matches
            targets:
              - matching-scale-construction
            color: cyan
            linger: 0.35
          - id: tr-matching-scale-first
            phrase: the two keys split the weight evenly
            targets:
              - matching-scale-construction
            color: green
            linger: 0.35
          - id: tr-matching-scale-shares
            phrase: The smaller score gets about twenty-seven percent
            targets:
              - matching-scale-construction
            color: green
            linger: 0.35
      - say: What happens to a dot product when a head has more coordinates? Suppose the query and key
          components are all independent, each with mean zero and variance one. One coordinate product
          then has variance one. Add one product per coordinate. The variances add, so the variance of the
          dot product equals the key width. Its standard deviation is the square root of that width.
          Dividing by that quantity keeps the score scale steady under these assumptions. Learned
          coordinates can be correlated.
        hold: 0.7
        visual_cues:
          - id: tr-matching-scale-voice-1
            phrase: Add one product per coordinate
            targets:
              - matching-scale-construction
            color: cyan
            linger: 0.35
          - id: tr-matching-scale-variance
            phrase: the variance of the dot product equals the key width
            targets:
              - matching-scale-construction
            color: yellow
            linger: 0.35
      - say: Here are three scores from a head of width sixty-four. The first key gets almost all the weight
          before scaling. Divide all three scores by eight and apply softmax again. Look at the green
          bars. The first key still wins, but the other two now receive about half the total weight
          between them. The order stayed the same. The gaps that softmax sees got smaller. Learned scores
          can still be far enough apart to produce a sharp read.
        hold: 0.9
        visual_cues:
          - id: tr-matching-scale-scaled
            phrase: Divide all three scores by eight and apply softmax again
            targets:
              - matching-scale-construction
            color: green
            linger: 0.35
      - say: Now change the length of the prompt. Keep the feature width fixed and go from three tokens to six.
          Each new token adds a query and a key, so the explicit score grid grows along both edges. Nine
          pair scores become thirty-six. The projected queries, keys and values each gain rows along just
          one axis. Each array doubles in size. A fused implementation can compute the read without
          storing the whole grid.
        hold: 0.85
        visual_cues:
          - id: tr-matching-scale-length
            phrase: go from three tokens to six
            targets:
