  - id: evaluation-limits
    title: What did the retrieval study measure?
    visual: Chunk size and retrieved-context budget occupy different rulers; the source experiment remains labeled while the runbook evidence decides its own configuration.
    beats:
      - say: Bennani and Moslonka tested chunking on Wikipedia questions with SPLADE retrieval and a Ministral eight-billion instruction model. They varied individual chunks from fifty to five hundred tokens. They also varied how much retrieved text the generator could read, from five hundred to ten thousand tokens. Hits filled that budget in rank order.
        hold: 0.8
        visual_cues:
          - id: evaluation-limits-0
            phrase: Bennani and Moslonka tested chunking on Wikipedia questions
            targets:
              - evaluation-limits-operation
            linger: 0.4
      - say: Read the lower ruler. Sentence-preserving splits matched semantic splits up to roughly five thousand retrieved-context tokens in that experiment. The upper ruler still ends at five hundred tokens per chunk. Comparing zero with twenty percent overlap, the authors measured more indexing work without a measurable answer-quality gain in their setting.
