        visual_cues:
          - id: evaluation-limits-1
            phrase: Read the lower ruler
            targets:
              - evaluation-limits-operation
            linger: 0.4
          - id: study-context-five
            phrase: roughly five thousand retrieved-context tokens
            targets:
              - evaluation-limits-operation
            linger: 0.35
      - say: Take a reference answer of “Maya” and a response of “MAYA” in capitals with a period. Normalizing case and punctuation gives an exact match. A semantic similarity score needs its scoring model. An abstention measure asks whether the system answered at all. Those measures can favor different context budgets, especially when extra passages bring distractors. Check uncertainty across questions and evaluate the citations on your own runbook.
        hold: 0.8
