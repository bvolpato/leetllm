version: 1
lesson: softmax
promise: Trace a reported change in cross-entropy to the model's probabilities, the word being scored, or the divisor, and decide whether training improved the prediction.
objectives:
  - id: competing-shares
    can: Construct normalized shares from score gaps and preserve them through a common shift using bounded exponentials.
    scenes:
      - intro
      - scores
      - exponentials
      - mass
  - id: loss-stability
    can: Compute a target loss from logits when its probability underflows, and identify rows with invalid scores or no permitted candidates.
    scenes:
      - loss
      - temperature-limits
  - id: derive-gradient
    can: Use the softmax derivatives and the negative-log slope to predict the sign and size of every logit correction when the observed word changes.
    scenes:
      - gradient-chain
      - gradient
      - update
      - transfer
  - id: target-uncertainty
    can: Distinguish target entropy from the cost of a mismatch, identify a support conflict, and calculate the finite optimum gap for a smoothed target.
    scenes:
      - entropy-reference
      - smoothing-equilibrium
  - id: loss-choice
    can: Compare the logit gradients from cross-entropy and Brier loss. Diagnose and remove a second softmax by comparing the model prediction with the distribution scored by the loss.
    scenes:
      - squared-vs-ce
      - loss-input-contract
  - id: temperature
    can: Predict what temperature changes in sampling, calibration, and distillation, including ties and the scale of the gradient.
    scenes:
      - temperature
      - temperature-limits
  - id: sequence-contract
    can: Follow each score to its next-token target through either tensor layout. Use the individual losses and the divisor to detect a wrong pairing or an ignored target counted in the mean.
    scenes:
      - loss-input-contract
      - transfer
      - teacher-forcing
      - token-reduction
      - class-not-position
      - weighted-reduction
      - earned-transfer
  - id: vocabulary-memory
    can: Calculate the size of a logit matrix and merge the exponential sums of two vocabulary tiles when the second tile has a higher maximum.
    scenes:
      - vocabulary-tiles
