    title: What happens to a tie when we cool it?
    visual: "Two leaders share the probability as the temperature falls. Three equal scores then overflow when divided first. Subtracting their maximum gives three zeros and restores the tie. Masking one candidate leaves two equal shares. Masking all three leaves a zero denominator."
    beats:
      - say: "Cool the scores toward zero temperature. Ran leads, so its share approaches one. Now raise slept until it ties ran. The two leaders share that probability equally in the limit. Turn the temperature up and all three shares approach a third. Turning the dial preserves their order. At exactly zero, division is undefined. Some decoders switch to a greedy choice there. A sampler draws from the shares. To calibrate those shares, fit the temperature to held-out outcomes."
        hold: 0.8
        caption_starts: ["Now raise slept", "Turn the temperature up", "At exactly zero", "To calibrate those shares"]
        visual_cues:
          - id: temperature-limits-0
            phrase: "Turning the dial preserves their order."
