  - id: weighted-reduction
    title: Carry the denominator with a weighted loss
    visual: Identical one-hot labels use integer or float target representations;weighted numerators match while their PyTorch means differ.
    beats:
      - say: Class weights change the reduction contract. With integer targets, no smoothing and non-ignored positions, each target loss is multiplied by its class weight. PyTorch mean divides by the sum of those target-class weights. Floating-point probability targets instead divide by the number of positions. A float one-hot target can therefore produce a different weighted mean from its integer equivalent.
        hold: 0.8
        visual_cues:
          - id: weighted-count
            phrase: divide by the number of positions
            targets:
              - reduction-rule
            color: cyan
            linger: 0.35
          - id: weighted-reduction-0
            phrase: Class weights change the reduction contract
            targets:
              - weighted-reduction-operation
            linger: 0.4
          - id: weighted-contract
            phrase: PyTorch mean divides by the sum of those target-class weights
            targets:
              - weighted-reduction-operation
            color: cyan
            linger: 0.4
      - say: "Take two predictions with two classes each. Both predictions are uniform, so each ordinary loss is natural log two. The two target classes have weights of two and four. The weighted numerator is six times natural log two. Integer-target mean divides by six and returns natural log two. Float one-hot mean divides by two and returns three times natural log two. The same predictions and the same weighted sum give two means because PyTorch uses different divisors."
        hold: 0.8
        visual_cues:
          - id: weighted-reduction-1
            phrase: "Take two predictions with two classes each"
            targets:
              - weighted-reduction-operation
            linger: 0.4
          - id: weighted-uniform
            phrase: each ordinary loss is natural log two
            targets: [ ordinary-losses ]
          - id: weighted-weights
            phrase: "weights of two and four"
            targets: [ class-weights ]
          - id: weighted-numerator
            phrase: The weighted numerator is six times natural log two
            targets:
              - weighted-reduction-operation
            color: cyan
            linger: 0.4
          - id: weighted-integer
            phrase: Integer-target mean divides by six and returns natural log two.
            targets:
              - weighted-reduction-operation
            color: cyan
            linger: 0.4
          - id: weighted-float
            phrase: Float one-hot mean divides by two and returns three times natural log two.
            targets:
              - weighted-reduction-operation
            color: cyan
            linger: 0.4
      - say: "To combine shards or microbatches, add the weighted loss sums and add their denominators. Divide once at the end. If you change the target type, class weights or smoothing, check how the loss function computes both parts."
        hold: 0.8
        visual_cues:
          - id: weighted-reduction-2
            phrase: "To combine shards or microbatches"
            targets:
              - weighted-reduction-operation
            linger: 0.4
          - id: weighted-combine
            phrase: "Divide once at the end"
            targets:
              - weighted-reduction-operation
            color: cyan
            linger: 0.4
  - id: vocabulary-tiles
    title: "How much memory does one set of scores need?"
    visual: "The dimensions and four bytes per score give the allocation for a full logit matrix. Two vocabulary tiles from a single position then contribute to the same running sum. Raising the baseline shrinks the first contribution before the second joins it."
    beats:
      - say: "So far each row has held three scores. Take sixteen sequences of four thousand ninety-six positions each. Give every position a score for every vocabulary entry. In this example there are over a hundred and twenty-eight thousand entries. At four bytes per score, the logits alone occupy about thirty-one point three one gibibytes. That’s before you save any other activations or gradients."
        hold: 0.8
        visual_cues:
          - id: vocabulary-tiles-0
            phrase: "each row has held three scores"
            targets: [score-matrix]
          - id: vocab-positions
            phrase: "sixteen sequences of four thousand ninety-six positions each"
            targets: [positions]
          - id: vocab-matrix
            phrase: "every vocabulary entry"
            targets: [columns]
          - id: vocab-bytes
            phrase: "At four bytes per score"
            targets: [matrix-bytes]
          - id: vocab-gib
            phrase: "about thirty-one point three one gibibytes"
            targets: [matrix-size]
      - say: "An ordinary loss call receives the matrix after it’s been allocated. Instead, project one tile of vocabulary scores at a time. Look at just one position. The first tile has a maximum of two. The second brings a new maximum of four. Before adding anything, shrink the first tile’s sum by e to the power of two minus four. Both tiles now use four as their baseline. Add the incoming weights. Four plus the log of that sum gives the log-sum-exp for the whole row. The observed word had the first score in the first tile. Save that two. Subtract the observed word’s score from the log-sum-exp to get a loss of about two point one five nats."
        hold: 0.8
        visual_cues:
          - id: vocabulary-tiles-1
            phrase: "receives the matrix after it’s been allocated"
            targets: [matrix-allocation]
          - id: tile-fused
            phrase: "project one tile of vocabulary scores at a time"
            targets: [vocabulary-tiles]
          - id: tile-incoming
            phrase: "The second brings a new maximum of four"
            targets: [second-tile]
          - id: tile-rescale
            phrase: "shrink the first tile’s sum by e to the power of two minus four"
            targets: [rescaled-prior]
          - id: tile-add
            phrase: "Add the incoming weights"
            targets: [merged-sum]
          - id: tile-result
            phrase: "Four plus the log of that sum gives the log-sum-exp for the whole row"
            targets: [tile-result]
          - id: tile-picked
            phrase: "The observed word had the first score in the first tile"
            targets: [selected-score]
          - id: tile-target
            phrase: "a loss of about two point one five nats"
            targets: [target-logit]
      - say: "Cut Cross-Entropy uses this idea to combine the output projection and the loss without storing the whole matrix in global GPU memory. The paper also filters small gradients for speed. Before adopting an implementation, check its supported objectives and approximation settings. Measure the complete training step on your hardware and compare its loss and gradients with a reference."
        hold: 0.8
        visual_cues:
          - id: vocabulary-tiles-2
            phrase: "Cut Cross-Entropy uses this idea"
            targets: [source]
          - id: tile-full-contract
            phrase: "without storing the whole matrix in global GPU memory"
            targets: [allocation-avoided]
          - id: tile-measure
            phrase: "Measure the complete training step"
            targets: [measurement]
  - id: earned-transfer
    title: "Two reports on the same batch"
    visual: "Two copies of a masked batch start with the same probabilities and mean. One report counts an ignored position. In the other, the first target gains probability. Both means reach the same number before the viewer repairs the first report."
    beats:
      - say: "Two reports start with the same batch. The first observed word gets a quarter of the probability and the second gets half. The third position is ignored. We have integer targets and no class weights. Take a negative natural log for each observed word. The losses add to about two point zero eight nats. We scored two words, so the starting mean is about one point zero four nats per word."
        hold: 1
        visual_cues:
          - id: fresh-targets
            phrase: "The first observed word"
            targets: [target-probabilities]
          - id: fresh-ignored
            phrase: "The third position is ignored"
            targets: [ignored-position]
          - id: fresh-two-losses
            phrase: "a negative natural log for each observed word"
            targets: [position-losses]
          - id: fresh-loss-sum
            phrase: "The losses add to about two point zero eight nats"
            targets: [loss-sum]
          - id: fresh-start
            phrase: "the starting mean is about one point zero four nats per word"
            targets: [baseline-mean]
      - say: "In report A the dashboard starts counting all three stored positions. Keep your eye on the two predictions. In report B we keep the original divisor and give the first observed word twice its old probability. Now both reports read the same. Which one shows a better prediction on this batch? Point to the evidence."
        hold: 3.6
        caption_starts: ["In report B", "Now both reports read the same.", "Which one shows a better prediction"]
        visual_cues:
          - id: earned-dashboard
            phrase: "counting all three stored positions"
            targets: [first-divisor]
          - id: fresh-b-update
            phrase: "give the first observed word twice its old probability"
            targets: [second-prediction]
          - id: earned-predict
            phrase: "Which one shows a better prediction on this batch"
            targets: [decision]
      - say: "B. Its first word gained probability while the same two targets were scored. In A the predictions never moved. The extra count came from an ignored position. Restore A’s divisor to two. Its mean goes straight back to where it started. B keeps the lower loss. That first word cost less because the model gave it more probability, just as it did for slept."
        hold: 1.4
        caption_starts: ["In A the predictions never moved.", "Restore A’s divisor to two.", "B keeps the lower loss."]
        visual_cues:
