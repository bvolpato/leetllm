      - say: "Here all three scores are equal. Divide by the tiny temperature first. Each quotient overflows. Subtract the largest quotient and we get infinity minus infinity."
        hold: 1.45
        caption_starts: ["Each quotient overflows.", "Subtract the largest quotient"]
