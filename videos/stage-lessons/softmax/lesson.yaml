version: 1
id: softmax
title: When Does a Lower Loss Mean a Better Prediction?
source: preparation/softmax-cross-entropy-optimization/content.md
sources:
  - title: "Goodfellow, Bengio and Courville: Maximum Likelihood Estimation"
    url: https://www.deeplearningbook.org/contents/ml.html
  - title: "PyTorch: CrossEntropyLoss"
    url: https://docs.pytorch.org/docs/stable/generated/torch.nn.CrossEntropyLoss.html
  - title: "Hinton, Vinyals and Dean: Distilling the Knowledge in a Neural Network"
    url: https://arxiv.org/abs/1503.02531
  - title: Label smoothing in Inception
    url: https://arxiv.org/abs/1512.00567
  - title: When Does Label Smoothing Help?
    url: https://arxiv.org/abs/1906.02629
  - title: Cut Your Losses in Large-Vocabulary Language Models
    url: https://arxiv.org/abs/2411.09009
  - title: Strictly Proper Scoring Rules, Prediction, and Estimation
    url: https://sites.stat.washington.edu/raftery/Research/PDF/Gneiting2007jasa.pdf
scenes:
  - id: intro
    title: "Which word was on the page?"
    visual: "A blue card slides the model’s guess, ran, into the sentence. Its 84.4% share stays visible below. When the card lifts, the page reveals slept. A line connects the observed word to its green share."
    beats:
      - say: "The model’s first choice is ran. It gets about eighty-four percent. What word is under the card?"
        hold: 1.6
        caption_starts: ["It gets about eighty-four percent.", "What word is under the card?"]
        visual_cues:
          - id: intro-uncover
            phrase: "What word is under the card?"
            targets: [covered-word]
      - say: "Slept. The word on the page is our target. Which slice gives its probability?"
        hold: 2.3
        caption_starts: ["Which slice"]
        visual_cues:
          - id: intro-observed
            phrase: "Slept."
            targets: [observed-word]
            caption_boundary: true
          - id: intro-question
            phrase: "Which slice"
            targets: [prediction]
      - say: "The green slice. Slept got about eleven percent. Give slept more probability and the loss on this word falls. Softmax calculates those shares from three scores."
        hold: 0.65
        caption_starts: ["Slept got about eleven percent"]
        visual_cues:
          - id: intro-target
            phrase: "The green slice"
            targets: [observed-share]
          - id: intro-scores
            phrase: "three scores"
            targets: [score-ruler]
  - id: scores
    title: Read the gaps between scores
    visual: Three positions on a common score ruler show fixed gaps. A shared offset changes every tick value while the two gap lengths remain fixed.
    beats:
      - say: Our model gives ran three, slept one, and ate zero. These scores are logits. A larger score means a stronger preference. The two-point lead matters more than the name of the starting point.
        hold: 0.35
        visual_cues:
          - id: score-values
            phrase: ran three, slept one, and ate zero
            targets:
              - score-ruler
            color: cyan
            linger: 0.35
          - id: score-logits
            phrase: These scores are logits
            targets:
              - recipe
            color: cyan
            linger: 0.35
          - id: score-gaps
            phrase: The two-point lead
            targets:
              - score-gaps
            color: yellow
            linger: 0.35
      - say: Add a thousand to every score. Watch the ruler labels change while those gaps hold their lengths. The relative preferences stay the same. Our probability rule should preserve that relationship.
        hold: 0.35
        visual_cues:
          - id: score-offset
            phrase: Add a thousand to every score
            targets:
              - shared-logit-offset
            color: cyan
            linger: 0.35
      - say: Subtract that shared offset and the original scores return. Logits can be any real numbers. Next we will turn their gaps into positive weights, then divide one budget among them.
        hold: 0.35
        visual_cues:
          - id: score-next
            phrase: turn their gaps into positive weights
            targets:
              - score-gaps
            color: cyan
            linger: 0.35
          - id: score-restore
            phrase: Subtract that shared offset
            targets:
              - shared-logit-offset
            color: cyan
            linger: 0.35
  - id: exponentials
    title: Give each score a positive weight
    visual: Each exponential is evaluated in turn. Subtracting the maximum shrinks all weights by a common factor; adding a large offset leaves the shifted values and ratio fixed.
    beats:
      - say: Exponentiation gives every finite score a positive weight. First ran, then slept, then ate. A two-point score lead becomes a weight ratio of about seven to one. We have weights; their total is still free to vary.
        hold: 0.35
        visual_cues:
          - id: exp-ratio
            phrase: a weight ratio of about seven to one
            targets:
              - weight-ratio
            color: yellow
            linger: 0.35
          - id: exp-ran
            phrase: First ran
            targets:
              - positive-weight-0
            color: blue
            linger: 0.35
          - id: exp-slept
            phrase: then slept
            targets:
              - positive-weight-1
            color: green
            linger: 0.35
          - id: exp-ate
            phrase: then ate
            targets:
              - positive-weight-2
            color: pink
            linger: 0.35
      - say: For safe arithmetic, subtract the largest score first. The largest exponent becomes zero, so its weight is one. Every weight receives the same scale factor. Their ratio survives, ready for normalization.
        hold: 0.35
        visual_cues:
          - id: exp-survives
            phrase: Their ratio survives
            targets:
              - weight-ratio
            color: yellow
            linger: 0.35
          - id: exp-shift
            phrase: subtract the largest score first
            targets:
              - shifted-weights
            color: yellow
            linger: 0.35
      - say: Now add a thousand to the input scores. Subtract the new maximum before taking exponentials. The same small weights remain. This order prevents overflowing exponentials while preserving the intended shares.
        hold: 0.35
        visual_cues:
          - id: exp-overflow
            phrase: prevents overflowing exponentials
            targets:
              - overflow
            color: red
            linger: 0.35
          - id: exp-offset
            phrase: add a thousand to the input scores
            targets:
              - exponential-inputs
            color: cyan
            linger: 0.35
  - id: mass
    title: Three claims on one budget
    visual: Each weight contributes to a running denominator. Fractions then fill one unit strip. Raising only slept's score recomputes every share, followed by an explicit restore.
    beats:
      - say: Put ran's weight into the total. Add slept's weight, then ate's. Every candidate divides by this same denominator. Fill ran's share, slept's share, and ate's share. Together they use exactly one unit of probability.
        hold: 0.35
        visual_cues:
          - id: mass-unit
            phrase: exactly one unit of probability
            targets:
              - unit-strip
            color: yellow
            linger: 0.35
          - id: mass-add-0
            phrase: Put ran's weight into the total
            targets:
              - normalizing-denominator
            color: blue
            linger: 0.1
          - id: mass-add-1
            phrase: Add slept's weight
            targets:
              - normalizing-denominator
            color: green
            linger: 0.1
          - id: mass-add-2
            phrase: then ate's
            targets:
              - normalizing-denominator
            color: pink
            linger: 0.1
          - id: mass-share-0
            phrase: Fill ran's share
            targets:
              - probability-share-0
            color: blue
            linger: 0.1
          - id: mass-share-1
            phrase: slept's share
            targets:
              - probability-share-1
            color: green
            linger: 0.1
          - id: mass-share-2
            phrase: and ate's share
            targets:
              - probability-share-2
            color: pink
            linger: 0.35
      - say: "Raise only slept's score by one. Its weight grows, the denominator grows, and every share changes. The strip makes the competition visible: slept gains space as both neighbors give some up."
        hold: 0.35
        visual_cues:
          - id: mass-raise
            phrase: Raise only slept's score by one
            targets:
              - mass-distribution
            color: green
            linger: 0.35
      - say: "Restore the original scores. Slept received about eleven percent. Which observation should cost more: the favorite ran, or the surprising slept? Keep your answer while we put both on a loss curve."
        hold: 0.8
        visual_cues:
          - id: mass-eleven
            phrase: Slept received about eleven percent
            targets:
              - prediction
            color: green
            linger: 0.35
          - id: mass-predict
            phrase: Which observation should cost more
            targets:
              - prediction
            color: yellow
            linger: 0.35
          - id: mass-restore
            phrase: Restore the original scores
            targets:
              - mass-distribution
            color: yellow
            linger: 0.35
  - id: loss
    title: Price the word that actually appeared
    visual: A selected point moves from the favorite probability to the observed-word probability on a negative-log curve. Stable loss is then assembled from gap and log-total terms, including an underflow example.
    beats:
      - say: "Cross-entropy takes the negative natural log of the target's probability. Start at ran's large share: observing that favorite would cost very little. As target probability approaches one, the cost approaches zero."
        hold: 0.35
        visual_cues:
          - id: loss-favorite
            phrase: Start at ran's large share
            targets:
              - target-loss-point
            color: blue
            linger: 0.35
      - say: "Move to the observed slept probability. The point climbs: a small share means a larger loss. That resolves our prediction. The missed word costs about two point one seven nats, using the unrounded probability."
        hold: 0.35
        visual_cues:
          - id: loss-result
            phrase: The missed word costs about two point one seven nats
            targets:
              - target-loss-value
            color: yellow
            linger: 0.35
          - id: loss-observed
            phrase: Move to the observed slept probability
            targets:
              - target-loss-point
              - target-loss-value
            color: green
            linger: 0.35
      - say: Compute that loss safely from the logits. Take the maximum minus the target score. Add the log of our shifted weight total. Even when a target weight rounds to zero, this log-space calculation can retain its finite loss.
        hold: 0.35
        visual_cues:
          - id: loss-gap
            phrase: Take the maximum minus the target score
            targets:
              - loss-gap
            color: yellow
            linger: 0.35
          - id: loss-log-total
            phrase: Add the log of our shifted weight total
            targets:
              - loss-log-total
              - target-loss-value
            color: cyan
            linger: 0.35
          - id: loss-extreme
            phrase: Even when a target weight rounds to zero
            targets:
              - stable-extreme
            color: pink
            linger: 0.35
  - id: gradient-chain
    title: "What moves when one score rises?"
    visual: "A centered scale measures the three changes in probability from one nudge to the slept logit. At the original scores, signed local slopes on the target share multiply the slope of the loss."
    beats:
      - say: "Keep the blue and pink scores fixed. If we raise the score for slept, where will its extra probability come from?"
        hold: 1.8
        caption_starts: ["If we raise the score for slept"]
        visual_cues:
          - id: gradient-chain-0
            phrase: "If we raise the score for slept"
            targets: [share-change-ruler]
      - say: "Blue and pink both give some up. Watch their bars move left. Together they give up exactly as much probability as green gains."
        hold: 1.2
        visual_cues:
          - id: jacobian-nudge
            phrase: "Blue and pink both give some up."
            targets: [slept-score]
      - say: "Return to the original scores. Imagine making the nudge smaller and smaller. The slope tells us how fast each probability changes per unit of score. Collect those slopes in a table called the softmax Jacobian. In one column we change just one score. For the word we nudged, the delta in the formula is one. Its own slope is its share times the share left for everyone else. For every other word the delta is zero, so the slope is minus the product of the two shares. Each column sums to zero because the whole strip still holds one unit."
        hold: 0.6
        visual_cues:
          - id: jacobian-formula
            phrase: "Return to the original scores"
            targets: [jacobian]
          - id: jacobian-column
            phrase: "Each column sums to zero"
            targets: [column-sum]
      - say: "Now follow just the share of slept. Start with its own score. A tiny increase earns probability at the positive rate on the first line. Raise ran instead and slept loses almost as fast. Raise ate instead and the effect is much smaller. Ran had a much larger share to compete with. To get the change in loss, multiply each of these rates by the slope of the negative log, minus one over the probability of slept."
        hold: 0.8
        visual_cues:
          - id: gradient-chain-1
            phrase: "Now follow just the share of slept"
            targets: [target-slope-table]
          - id: jacobian-self
            phrase: "the positive rate on the first line"
            targets: [slept-self-slope]
          - id: jacobian-ran
            phrase: "slept loses almost as fast"
            targets: [ran-cross-slope]
          - id: jacobian-ate
            phrase: "the effect is much smaller"
            targets: [ate-cross-slope]
          - id: jacobian-loss-slope
            phrase: "minus one over the probability of slept"
            targets: [loss-slope]
      - say: "Follow the first line into the loss. Its probability slope has a factor of p slept. The negative log divides by that same factor. Cancel the two and the gradient on the slept score is p slept minus one. On the ran line the probability slope is negative. The two minus signs give a plus, and the same cancellation leaves p ran. For a normalized soft target, sum the routes with their target weights. Those weights add to one, so the full gradient on the logits is prediction minus target. There’s a shorter route from the logits. Differentiate the log of the sum of exponentials. Each score’s derivative is its own softmax share. For a single observed word, subtracting its score takes one off its derivative. You can check a slope by nudging one score a little each way and dividing the difference in loss by the distance between the nudges."
        hold: 0.75
        visual_cues:
          - id: gradient-chain-2
            phrase: "Follow the first line into the loss"
            targets: [gradient-column]
          - id: chain-target-route
            phrase: "Its probability slope has a factor of p slept"
            targets: [target-product]
          - id: chain-target-cancel
            phrase: "Cancel the two"
            targets: [target-cancellation]
          - id: chain-target
            phrase: "the gradient on the slept score is p slept minus one"
            targets: [target-gradient]
          - id: chain-competitor-route
            phrase: "On the ran line"
            targets: [competitor-product]
          - id: chain-competitor-cancel
            phrase: "the two minus signs give a plus"
            targets: [competitor-cancellation]
          - id: chain-competitor
            phrase: "the same cancellation leaves p ran"
            targets: [competitor-gradient]
          - id: chain-normalized
            phrase: "the full gradient on the logits is prediction minus target"
            targets: [gradient-formula]
          - id: chain-logsumexp
            phrase: "Each score’s derivative is its own softmax share"
            targets: [log-sum-exp-gradient]
  - id: gradient
    title: Subtract what happened from what was predicted
    visual: The one-hot observed-word row is selected first. Each probability-minus-target subtraction constructs its own signed gradient bar. Three contributions then cancel in a running sum.
    beats:
      - say: "Back to the dog. The target row records what happened: one for slept, zero for each other word. The combined loss derivative is probability minus target. First subtract ran's zero. Its positive gradient says that raising the wrong favorite raises the loss."
        hold: 0.35
        visual_cues:
          - id: gradient-target
            phrase: one for slept, zero for each other word
            targets:
              - one-hot-target
            color: green
            linger: 0.35
          - id: gradient-0
            phrase: First subtract ran's zero.
            targets:
              - logit-gradient-0
            color: blue
            linger: 0.35
      - say: "For slept, subtract one. Its gradient is negative, so raising that score lowers the loss. For ate, subtract zero: a small positive correction. Gradient descent subtracts these gradients, raising slept and lowering its competitors."
        hold: 0.35
        visual_cues:
          - id: gradient-descent
            phrase: Gradient descent subtracts these gradients
            targets:
              - logit-pushes
            color: yellow
            linger: 0.35
          - id: gradient-1
            phrase: For slept, subtract one. Its gradient is negative, so raising that score lowers the loss.
            targets:
              - logit-gradient-1
            color: green
            linger: 0.35
          - id: gradient-2
            phrase: "For ate, subtract zero: a small positive correction."
            targets:
              - logit-gradient-2
            color: pink
            linger: 0.35
      - say: Add the three corrections. The competitors' positive parts exactly balance the target's negative part. The total is zero, matching our fixed score gaps under a common shift. Backpropagation carries this local signal into the network's shared weights.
        hold: 0.35
        visual_cues:
          - id: gradient-zero
            phrase: The total is zero
            targets:
              - gradient-balance
            color: yellow
            linger: 0.35
          - id: gradient-balance
            phrase: Add the three corrections
            targets:
              - gradient-balance
            color: yellow
            linger: 0.35
  - id: update
    title: Make the correction earn more target probability
    visual: The existing cue-driven direct logit update recomputes all probability bars and the observed-word loss through intermediate states, then holds the completed result.
    beats:
      - say: Try one direct update to these logits. Subtract one point five times each gradient. The corrected target score rises while the competitors fall. Follow the changed gaps into a new probability distribution.
        hold: 0.35
        visual_cues:
          - id: update-step
            phrase: Subtract one point five times each gradient
            targets:
              - recipe
            color: cyan
            linger: 0.35
          - id: logit-update-rule-b1-1
            phrase: The corrected target score rises
            targets:
              - logit-update-values
              - updated-probabilities
            color: cyan
            linger: 0.35
      - say: Watch slept gain probability. Its share passes the old favorite as cross-entropy decreases. We recompute every bar and the loss from the changing logits throughout the step.
        hold: 0.35
        visual_cues:
          - id: updated-probabilities-b2-1
            phrase: Watch slept gain probability
            targets:
              - updated-probabilities
            color: green
            linger: 0.35
          - id: updated-target-loss-b2-2
            phrase: as cross-entropy decreases
            targets:
              - updated-target-loss
            color: green
            linger: 0.35
      - say: Slept now receives about sixty-one percent. The original eleven percent has become a much better prediction for this observation. Shared network parameters affect other examples too; held-out predictions measure how broadly that learning helps.
        hold: 0.35
        visual_cues:
          - id: update-result
            phrase: Slept now receives about sixty-one percent
            targets:
              - updated-probabilities
            color: green
            linger: 0.35
  - id: temperature
    title: Can cooling fix the missed word?
    visual: Temperature first sharpens then flattens the original mistaken ranking, with the observed target always marked. Restoring one and applying learned scores changes the leader.
    beats:
      - say: "Bring back the original scores. Ran leads slept by two points. Lower the temperature and ran takes more of the strip. Raise it and the other words gain some space. We divide every score gap by the same positive temperature, so ran keeps its lead."
        hold: 0.35
        caption_starts: ["Lower the temperature", "Raise it", "We divide every score gap"]
        visual_cues:
          - id: temperature-original
            phrase: Bring back the original scores
            targets:
              - temperature-distribution
            color: cyan
            linger: 0.35
          - id: temperature-order
            phrase: We divide every score gap
            targets:
              - temperature-lead
            color: yellow
            linger: 0.35
          - id: temperature-distribution-b1-1
            phrase: Lower the temperature
            targets:
              - temperature-distribution
            color: blue
            linger: 0.35
          - id: temperature-higher-b1-2
            phrase: Raise it
            targets:
              - temperature-distribution
            color: cyan
            linger: 0.35
      - say: "Turn the temperature down again. Which word gains probability?"
        hold: 1.8
      - say: "Ran takes almost the whole strip. Slept, the word on the page, now gets less than one percent."
        hold: 0.35
        caption_starts: ["Slept, the word on the page"]
        visual_cues:
          - id: temperature-distribution-b2-1
            phrase: Ran takes almost the whole strip
            caption_boundary: true
            targets:
              - temperature-distribution
            color: blue
            linger: 0.35
      - say: "Bring temperature back to one. Now apply our learned scores. Watch slept pass ran. Learning changed the score order."
        hold: 0.35
        caption_starts: ["Now apply our learned scores.", "Watch slept pass ran."]
        visual_cues:
          - id: temperature-changed
            phrase: Learning changed the score order
            targets:
              - temperature-order
            color: yellow
            linger: 0.35
          - id: temperature-restore
            phrase: Bring temperature back to one
            targets:
              - temperature-distribution
            color: cyan
            linger: 0.35
          - id: temperature-learned
            phrase: Now apply our learned scores
            targets:
              - temperature-distribution
            color: green
            linger: 0.35
  - id: transfer
    title: "What changes when the word changes?"
    visual: A new prefix changes the scores and the observed target. After combining the two original losses, the opening strip returns. Changing only its target to ate leaves every share fixed while the loss and gradient change.
    beats:
      - say: "A fresh line begins with the cat. These new scores favor ate. On this page, the observed word is ate. Which score gets the upward correction? Work out the sign of its gradient."
        hold: 2.4
        visual_cues:
          - id: transfer-cat
            phrase: A fresh line
            targets:
              - fresh-sentence
            color: cyan
            linger: 0.35
          - id: transfer-predict
            phrase: Which score gets the upward correction
            targets:
              - fresh-prediction
            color: yellow
            linger: 0.35
          - id: transfer-forward
            phrase: These new scores favor ate
            targets:
              - fresh-distribution
            color: cyan
            linger: 0.35
          - id: transfer-target
            phrase: the observed word is ate
            targets:
              - fresh-target
            color: pink
            linger: 0.35
      - say: "Ate's probability minus one is negative. Subtract that gradient: its score rises and its probability grows. This already likely target needs a smaller correction than the earlier surprising slept."
        hold: 0.35
        visual_cues:
          - id: transfer-smaller
            phrase: a smaller correction than the earlier surprising slept
            targets:
              - fresh-comparison
            color: yellow
            linger: 0.35
          - id: transfer-gradient
            phrase: Ate's probability minus one is negative.
            targets:
              - fresh-gradient
            color: pink
            linger: 0.35
          - id: transfer-update
            phrase: Subtract that gradient
            targets:
              - fresh-distribution
            color: green
            linger: 0.35
      - say: Return to both initial predictions. For these two training examples, multiply the observed-word probabilities. Negative log turns that product into the sum of their two losses. Divide by two to report the mean. The surprising dog example contributes most of that cost.
        hold: 0.35
        visual_cues:
          - id: transfer-return
            phrase: Return to both initial predictions
            targets:
              - fresh-distribution
            color: cyan
            linger: 0.35
          - id: transfer-most
            phrase: contributes most of that cost
            targets:
              - combined-loss
            color: yellow
            linger: 0.35
          - id: transfer-product
            phrase: For these two training examples, multiply the observed-word probabilities.
            targets:
              - joint-probability
            color: cyan
            linger: 0.35
          - id: transfer-loss-sum
            phrase: Negative log turns that product into the sum of their two losses.
            targets:
              - combined-loss
            color: yellow
            linger: 0.35
          - id: transfer-mean
            phrase: Divide by two to report the mean.
            targets:
              - mean-loss
            color: green
            linger: 0.35
      - say: "Bring back the original dog prediction. It still gives slept about eleven percent. Change just the word on the page. This time the dog ate. Does the loss go up or down?"
        hold: 2.2
        visual_cues:
          - id: transfer-replay
            phrase: "Bring back the original dog prediction"
            targets: [original-dog-shares]
          - id: transfer-relabel
            phrase: "This time the dog ate"
            targets: [observed-word]
            caption_boundary: true
      - say: "Up by exactly one nat. Ate’s score is one below slept’s, and the shared log-sum-exp is the same. Now subtract one from ate’s share. The negative gradient belongs to ate, so its score gets the upward push. Changing the label changed the training signal before we took a single step."
        hold: 0.8
        visual_cues:
          - id: transfer-relabel-loss
            phrase: "Up by exactly one nat"
            targets: [changed-target-loss]
          - id: transfer-relabel-gradient
            phrase: "The negative gradient belongs to ate"
            targets: [changed-target-gradient]
  - id: entropy-reference
    title: "What loss remains at a perfect match?"
    visual: "Two readers split the target evenly. The prediction moves away from their split and back while the three costs follow it. Dividing two submitted weights of 0.8 by their sum restores the readers’ target."
    beats:
      - say: "Our dog example put the whole target on one word. Now suppose two people complete a new line. One writes ran and one writes slept. Give their answers equal weight. The dashed outlines show that target distribution. Its entropy measures the surprise you would get, on average, from using the target’s own probabilities. Cross-entropy uses the model’s probabilities to score those same answers. The extra cost is the mismatch, called KL divergence."
        hold: 0.8
        visual_cues:
          - id: entropy-reference-0
            phrase: "the whole target on one word"
            targets: [hard-target]
          - id: entropy-reader-one
            phrase: "One writes ran"
            targets: [first-answer]
          - id: entropy-reader-two
            phrase: "one writes slept"
            targets: [second-answer]
          - id: entropy-soft-target
            phrase: "Give their answers equal weight"
            targets: [soft-target]
          - id: entropy-h
            phrase: "Its entropy measures"
            targets: [entropy-formula]
          - id: entropy-ce
            phrase: "Cross-entropy uses the model’s probabilities"
            targets: [cross-entropy-formula]
          - id: entropy-identities
            phrase: "The extra cost is the mismatch"
            targets: [kl-formula]
      - say: "Let the prediction fill those outlines exactly. Either answer gets half. How much loss is left?"
        hold: 2
        visual_cues:
          - id: entropy-reference-1
            phrase: "fill those outlines exactly"
            targets: [matching-prediction]
      - say: "Minus the log of one half. That’s about point six nine three nats. Both words cost the same, so that’s also their average. The mismatch is zero."
        hold: 1.6
        caption_starts: ["That’s about point six nine three nats.", "The mismatch is zero."]
        visual_cues:
          - id: entropy-half-cost
            phrase: "That’s about point six nine three nats."
            targets: [matched-loss]
          - id: entropy-match
