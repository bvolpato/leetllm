          - id: bootstrap-zero
            phrase: every resample is all zeros
            targets:
              - zero-bootstrap
            color: blue
            linger: 0.35
  - id: prior-and-calibration
    title: Show what the prior contributes
    visual: The Beta(2,2) MAP mode adds one prior success and one prior failure to actual observed counts
      using visibly separate terms. Those fixed terms retain their size as labels increase. A separate
      preselected20% score bucket gets its own Wilson comparison.
    beats:
      - say: The first five messages contain one specialist case. A prior describes beliefs about rates before
          these labels. The posterior combines those beliefs with the labels; its mode is the peak over
          candidate rates. For our Beta two-two prior, use that peak. Add one success term and one failure
          term to this calculation. The mode becomes two sevenths. Outlined pieces keep prior terms
          separate from reviewed messages.
        hold: 0.45
        caption_starts:
          - "two sevenths"
        visual_cues:
          - id: prior
            phrase: A prior describes beliefs about rates before these labels
            targets:
              - prior-contribution
          - id: posterior
            phrase: The posterior combines those beliefs with the labels
            targets:
              - prior-contribution
          - id: peak
            phrase: its mode is the peak over candidate rates
            targets:
              - prior-contribution
          - id: two-sevenths
            phrase: The mode becomes two sevenths
            targets:
              - prior-contribution
          - id: outlined
            phrase: Outlined pieces keep prior terms separate
            targets:
              - prior-contribution
          - id: prior-terms
            phrase: Add one success term and one failure term
            targets:
              - prior-contribution
            color: yellow
            linger: 0.35
      - say: Bring back the full hundred labels. The same two prior terms now sit beside far more evidence. Our
          maximum-likelihood fraction is sixteen percent; this MAP mode is about sixteen point seven.
          Fixed prior strength has less influence as the observed counts grow.
        hold: 0.45
        visual_cues:
          - id: same-terms
            phrase: The same two prior terms
            targets:
              - prior-data
          - id: mle
            phrase: Our maximum-likelihood fraction is sixteen percent
            targets:
              - prior-data
          - id: map
            phrase: about sixteen point seven
            targets:
