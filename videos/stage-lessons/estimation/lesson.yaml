          - id: bias-fixed
            phrase: point zero zero three one three six
            targets:
              - mse-bar
          - id: floor
            phrase: Mean squared error approaches that floor
            targets:
              - mse-bar
          - id: repair
            phrase: Sampling the omitted slices repairs the target mismatch
            targets:
              - bias-cloud
      - say: Bayesian shrinkage changes a center for another reason. With a Beta two-two prior, one success in
          five gives a Beta three-six posterior. Its mode is two sevenths, while its mean is three ninths.
          The prior terms are not new reviewed cases. Report the prior and distinguish posterior mean,
          posterior mode and Wilson’s adjusted interval center.
        hold: 1
        visual_cues:
          - id: shrinkage
            phrase: Bayesian shrinkage changes a center for another reason
            targets:
              - posterior
          - id: beta-prior
            phrase: With a Beta two-two prior
            targets:
