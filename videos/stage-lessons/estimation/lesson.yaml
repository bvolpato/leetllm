version: 1
id: estimation
title: What Can One Sample Tell Us?
source: foundations/statistics-estimation-uncertainty/content.md
voice: en-US-AndrewNeural
rate: +0%
sources:
  - title: "Wilson: Probable Inference, the Law of Succession, and Statistical Inference"
    url: https://doi.org/10.1080/01621459.1927.10502953
  - title: "SciPy: Bootstrap confidence intervals"
    url: https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.bootstrap.html
  - title: "NIST: Confidence intervals for proportions"
    url: https://www.itl.nist.gov/div898/handbook/prc/section2/prc241.htm
  - title: "Howard et al.: Time-uniform, nonparametric, nonasymptotic confidence sequences"
    url: https://arxiv.org/html/1810.08240v9
  - title: "Artstein and Poesio: Inter-Coder Agreement for Computational Linguistics"
    url: https://aclanthology.org/J08-4004/
scenes:
  - id: intro
    title: Would you book the extra shift?
    visual: A constructed weekly support queue retains actual message IDs. A uniform sample moves into a
      review tray before labels and its estimate appear; the staffing threshold stays visible and the full
      queue outcome stays covered.
    beats:
      - say: Our regular support team can handle specialist work for one in five messages. Above that, we book an
          extra shift. This is a constructed week. Would you book it? The message outcomes are still
          covered.
        hold: 0.9
        visual_cues:
          - id: one-in-five
            phrase: one in five messages
            targets:
              - staffing-rule
          - id: extra-shift
            phrase: we book an extra shift
            targets:
              - staffing-rule
          - id: would-you
            phrase: Would you book it
            targets:
              - staffing-question
          - id: still-covered
            phrase: still covered
            targets:
              - weekly-queue
      - say: Draw one hundred distinct message IDs at random. Every message has the same chance of selection.
          Review their outcomes independently. Sixteen need a specialist. Count the pink labels, then
          divide by all one hundred reviewed messages.
        hold: 0.5
        caption_starts:
          - "Sixteen need a specialist"
        visual_cues:
          - id: sample-draw
            phrase: Draw one hundred distinct message IDs at random
            targets:
              - selected-messages
            color: blue
            linger: 0.35
          - id: same-chance
            phrase: Every message has the same chance of selection
            targets:
              - tagged-message
          - id: sample-label
            phrase: Sixteen need a specialist
            targets:
              - reviewed-labels
            color: pink
            linger: 0.35
          - id: sample-fraction
            phrase: divide by all one hundred reviewed messages
            targets:
              - sample-estimate
            color: yellow
            linger: 0.35
      - say: "Our estimate is sixteen percent. The quantity we want is the specialist share of this whole weekly
          queue. Keep your staffing choice in mind: another random sample could move that estimate."
        hold: 0.5
        caption_starts:
          - "sixteen percent"
        visual_cues:
          - id: estimate-lands
            phrase: Our estimate is sixteen percent
            targets:
              - sample-estimate
          - id: whole-queue
            phrase: the specialist share of this whole weekly queue
            targets:
              - weekly-queue
          - id: could-move
            phrase: another random sample could move that estimate
            targets:
              - sample-estimate
          - id: opening-choice
            phrase: Keep your staffing choice in mind
            targets:
              - staffing-question
            color: yellow
            linger: 0.35
  - id: sampling
    title: Watch a counted batch become one point
    visual: One simulated binary batch is counted and its identified tally becomes a scatter point. Further
      complete batches populate a distribution; a second cloud uses four times the labels on identical
      rate axes.
    beats:
      - say: "For this simulation, set the underlying rate to sixteen percent. Count one random batch of a
          hundred. Its fraction becomes this point. Repeat with fresh labels: each point is one complete
          sample, while the rate stays fixed."
        hold: 0.45
        visual_cues:
          - id: true-rate
            phrase: set the underlying rate to sixteen percent
            targets:
              - true-rate
          - id: batch-count
            phrase: Count one random batch of a hundred
            targets:
              - batch-labels
            color: pink
            linger: 0.35
          - id: batch-point
            phrase: Its fraction becomes this point
            targets:
              - batch-to-point
            color: yellow
            linger: 0.35
          - id: batch-repeat
            phrase: Repeat with fresh labels
            targets:
              - sample-cloud
            color: blue
            linger: 0.35
      - say: Some estimates land high and some low. That spread is sampling variation. A point describes one
          sample; the whole cloud shows how the estimator moves under this fixed model.
        hold: 0.4
        visual_cues:
          - id: high-low
            phrase: Some estimates land high and some low
            targets:
              - sample-cloud
          - id: spread
            phrase: That spread is sampling variation
            targets:
              - sample-cloud
          - id: one-sample
            phrase: A point describes one sample
            targets:
              - batch-to-point
          - id: whole-cloud
            phrase: the whole cloud shows how the estimator moves
            targets:
              - sample-cloud
      - say: Give each sample four hundred labels. Watch the second cloud form on the same scale. Four times the
          independent labels roughly halves the standard error, the typical movement of the estimate.
          Extra labels buy precision gradually.
        hold: 0.45
        caption_starts:
          - "halves the standard error"
        visual_cues:
          - id: four-hundred
            phrase: Give each sample four hundred labels
            targets:
              - large-cloud
          - id: four-times
            phrase: Four times the independent labels
            targets:
              - standard-error
          - id: halves
            phrase: roughly halves the standard error, the typical movement of the estimate
            targets:
              - standard-error
          - id: larger-cloud
            phrase: Watch the second cloud form on the same scale
            targets:
              - large-cloud
            color: cyan
            linger: 0.35
  - id: score-interval
    title: Keep the candidate rates that pass
    visual: The sample's plug-in uncertainty scale first makes a Wald range. A candidate population rate
      traverses its own score curve, leaving an accepted band under the 1.96 cutoff; actual intersections
      project to the rate axis before endpoint values appear.
    beats:
      - say: Return to our observed sixteen out of a hundred. Its estimated standard error is about four
          percentage points. The quick Wald interval adds nearly twice that scale on each side. Its error
          bar uses the observed fraction.
        hold: 0.4
        visual_cues:
          - id: standard-error
            phrase: about four percentage points
            targets:
              - wald-interval
          - id: observed-fraction
            phrase: Its error bar uses the observed fraction
            targets:
              - wald-interval
          - id: wald-range
            phrase: adds nearly twice that scale on each side
            targets:
              - wald-interval
            color: blue
            linger: 0.35
      - say: Wilson asks a different question. Slide a candidate population rate across the axis. Compare our
          count with what that candidate expects, using its own sampling scale. Keep candidates whose
          absolute score stays below the yellow cutoff.
        hold: 0.5
        visual_cues:
          - id: wilson-asks
            phrase: Wilson asks a different question
            targets:
              - candidate-score
          - id: candidate-sweep
            phrase: Slide a candidate population rate across the axis
            targets:
              - candidate-score
            color: yellow
            linger: 0.35
          - id: own-scale
            phrase: using its own sampling scale
            targets:
              - candidate-score
          - id: keep-below
            phrase: stays below the yellow cutoff
            targets:
              - candidate-score
      - say: Project the two crossings down. The accepted rates run from about ten to twenty-four percent. That is
          the Wilson interval. It crosses our twenty-percent staffing threshold, so this sample supports
          rates on either side. Our original choice still needs evidence.
        hold: 0.55
        caption_starts:
          - "ten to twenty-four percent"
          - "twenty-four percent"
          - "crosses our twenty-percent staffing threshold"
        visual_cues:
          - id: score-project
            phrase: Project the two crossings down
            targets:
              - score-projection
            color: green
            linger: 0.35
          - id: score-endpoints
            phrase: ten to twenty-four percent
            targets:
              - wilson-interval
            color: green
            linger: 0.35
          - id: wilson-name
            phrase: That is the Wilson interval
            targets:
              - wilson-interval
          - id: either-side
            phrase: supports rates on either side
            targets:
              - staffing-threshold
  - id: accumulating-evidence
    title: More labels, the same center
    visual: Sixteen visibly bracketed groups each contain four specialist outcomes in twenty-five labels.
      Groups arrive intact and their counts change the denominator and actual Wilson range; the first
      interval remains fixed for comparison.
    beats:
      - say: Isolate sample size with a controlled illustration. This group has four specialist cases among
          twenty-five labels. Every group we add has that same fraction. Predict what will happen to the
          center and width.
        hold: 0.7
        caption_starts:
          - "same fraction"
        visual_cues:
          - id: one-group
            phrase: four specialist cases among twenty-five labels
            targets:
              - label-groups
          - id: same-fraction
            phrase: Every group we add has that same fraction
            targets:
              - label-groups
          - id: predict
            phrase: Predict what will happen to the center and width
            targets:
              - contracting-interval
      - say: Bring in the groups. Each arrival adds its four pink outcomes and all twenty-five labels. The point
          stays at sixteen percent while the computed interval contracts. The faint interval preserves our
          starting uncertainty.
        hold: 0.45
        caption_starts:
          - "stays at sixteen percent"
          - "sixteen percent while"
          - "contracts"
        visual_cues:
          - id: add-groups
            phrase: Bring in the groups
            targets:
              - label-groups
              - contracting-interval
            color: cyan
            linger: 0.35
          - id: stays
            phrase: The point stays at sixteen percent
            targets:
              - contracting-interval
          - id: contracts
            phrase: the computed interval contracts
            targets:
              - contracting-interval
          - id: faint-first
            phrase: The faint interval preserves our starting uncertainty
            targets:
              - first-interval
      - say: Four hundred labels give a much narrower range. Random data would usually move the center too. We
          held the fraction fixed here to see sample size by itself. For a fixed queue, sampling a large
          share also needs a finite-population correction.
        hold: 0.45
        visual_cues:
          - id: narrower
            phrase: Four hundred labels give a much narrower range
            targets:
              - contracting-interval
          - id: random-center
            phrase: Random data would usually move the center too
            targets:
              - contracting-interval
          - id: held-fixed
            phrase: We held the fraction fixed here
            targets:
              - contracting-interval
          - id: finite
            phrase: sampling a large share also needs a finite-population correction
            targets:
              - finite-population
  - id: boundary
    title: Ten clean labels leave room for surprise
    visual: Ten actual zero labels feed a collapsed Wald point and an extended Wilson range, then the
      all-positive case mirrors it. The final construction switches explicitly to repeated simulated
      intervals against one fixed rate, coloring genuine misses.
    beats:
      - say: "Try ten messages with zero specialist cases. Should the population rate be pinned to zero? Wald uses
          a zero estimated standard error and collapses there. Wilson still accepts rates above zero: ten
          clean labels leave uncertainty."
        hold: 0.6
        caption_starts:
          - "zero estimated standard error"
          - "collapses there"
          - "accepts rates above zero"
          - "above zero"
        visual_cues:
          - id: pinned
            phrase: Should the population rate be pinned to zero
            targets:
              - collapsed-wald
          - id: zero-wald
            phrase: Wald uses a zero estimated standard error and collapses there
            targets:
              - collapsed-wald
            color: red
            linger: 0.35
          - id: zero-wilson
            phrase: Wilson still accepts rates above zero
            targets:
              - zero-score-range
            color: green
            linger: 0.35
      - say: The Wilson upper endpoint is about twenty-eight percent. For zero positives among n independent
          labels, the two-sided ninety-five-percent Wilson upper bound is one point nine six squared
          divided by the sum of n and one point nine six squared. Ten positives out of ten gives the mirror
          image, leaving room below one. The sample fraction can reach a boundary while the interval still
          spans other population rates.
        hold: 0.4
        caption_starts:
          - "twenty-eight percent"
        visual_cues:
          - id: upper-endpoint
            phrase: about twenty-eight percent
            targets:
              - zero-score-range
          - id: zero-upper-rule
            phrase: For zero positives among n independent labels, the two-sided ninety-five-percent Wilson upper bound is one point nine six squared divided by the sum of n and one point nine six squared
            targets:
              - zero-score-formula
          - id: boundary-point
            phrase: The sample fraction can reach a boundary
            targets:
              - all-score-range
          - id: all-wilson
            phrase: Ten positives out of ten gives the mirror image, leaving room below one
            targets:
              - all-score-range
            color: cyan
            linger: 0.35
      - say: Now repeat the whole procedure in a simulation. The true rate stays fixed; each sample creates a new
          interval. Green intervals cover that rate, red ones miss. Ninety-five percent is the method's
          approximate coverage target across repetitions. Exact coverage varies with rate and sample size.
          This confidence interval concerns the population rate. A prediction range for a future sample
          fraction needs a separate calculation because that new sample has its own variation.
        hold: 0.45
        visual_cues:
          - id: repeat
            phrase: Now repeat the whole procedure in a simulation
            targets:
              - coverage-intervals
          - id: true-rate
            phrase: The true rate stays fixed
            targets:
              - coverage-intervals
          - id: coverage-target
            phrase: Ninety-five percent
            targets:
              - coverage-intervals
          - id: population-rate
            phrase: This confidence interval concerns the population rate
            targets:
              - coverage-intervals
          - id: prediction
            phrase: A prediction range for a future sample fraction
            targets:
              - coverage-intervals
          - id: coverage-build
            phrase: each sample creates a new interval. Green intervals cover that rate, red ones miss
            targets:
              - coverage-intervals
            color: yellow
            linger: 0.35
  - id: sample-design
    title: Which messages did the sample leave out?
    visual: A fixed queue contains 1,000 messages, including 700 routine messages. Distinct routine
      messages move into the tray without replacement and leave dim source positions. The Wilson bar
      is labeled as an uncorrected binomial illustration. The known mix constructs 84, 50, and 42
      specialist cases and their weighted total.
    beats:
      - say: A separate toy queue of a thousand messages exposes selection bias. Seven hundred are routine.
          It mixes routine questions, billing, and account access. Select only routine questions without
          replacement, and two parts of the queue never enter the tray. The bar is an uncorrected
          binomial Wilson illustration. Finite-queue inference needs its sampling design. More routine
          labels tighten the estimate around that slice's twelve-percent rate.
        hold: 0.45
        caption_starts:
          - "only routine questions without replacement"
          - "two parts of the queue never enter the tray"
          - "never enter the tray"
        visual_cues:
          - id: mixes
            phrase: It mixes routine questions, billing, and account access
            targets:
              - toy-queue
          - id: never-enter
            phrase: two parts of the queue never enter the tray
            targets:
              - routine-selection
          - id: binomial-illustration
            phrase: The bar is an uncorrected binomial Wilson illustration
            targets:
              - routine-interval
          - id: slice-rate
            phrase: that slice's twelve-percent rate
            targets:
              - routine-interval
          - id: biased-selection
            phrase: Select only routine questions
            targets:
              - routine-selection
            color: blue
            linger: 0.35
          - id: biased-precision
            phrase: More routine labels tighten the estimate
            targets:
              - routine-interval
            color: blue
            linger: 0.35
      - say: "Use the known mix to rebuild the whole. Per thousand messages, routine questions contribute
          eighty-four expected specialist cases. Billing adds fifty; account access adds forty-two. Join
          those contributions: one hundred seventy-six per thousand, or seventeen point six percent."
        hold: 0.45
        caption_starts:
          - "eighty-four expected specialist cases"
          - "fifty"
          - "forty-two"
          - "one hundred seventy-six per thousand"
          - "seventeen point six percent"
        visual_cues:
          - id: known-mix
            phrase: Use the known mix to rebuild the whole
            targets:
              - toy-queue
          - id: total-percent
            phrase: seventeen point six percent
            targets:
              - weighted-total
          - id: weight-routine
            phrase: routine questions contribute eighty-four expected specialist cases
            targets:
              - weighted-routine
            color: blue
            linger: 0.25
          - id: weight-billing
            phrase: Billing adds fifty
            targets:
              - weighted-billing
            color: cyan
            linger: 0.25
          - id: weight-account
            phrase: account access adds forty-two
            targets:
              - weighted-account
            color: pink
            linger: 0.25
          - id: weighted-total
            phrase: Join those contributions
            targets:
              - weighted-total
            color: yellow
            linger: 0.35
      - say: The missing slices explain the gap. Sample across the target queue, or weight separately sampled
          slice rates by their population shares. Real slice rates have uncertainty too; calculate it
          using that sampling design. Keep this counterexample separate from our original weekly audit.
        hold: 0.4
        visual_cues:
          - id: gap
            phrase: The missing slices explain the gap
            targets:
              - routine-interval
          - id: uncertainty-too
            phrase: Real slice rates have uncertainty too
            targets:
              - weighted-total
          - id: separate
            phrase: Keep this counterexample separate
            targets:
              - toy-queue
          - id: design-repair
            phrase: Sample across the target queue, or weight separately sampled slice rates by their population shares
            targets:
              - repaired-selection
            color: green
            linger: 0.35
  - id: resampling
    title: Reuse the labels, retain their identities
    visual: The original weekly sample keeps its exact IDs and labels. One positive ID is drawn twice with
      replacement, a complete hundred-draw resample becomes one histogram contribution, and subsequent
      completed resamples build the distribution from prefixes rather than a finished reveal.
    beats:
      - say: Back to our original hundred reviewed messages. Bootstrap draws reuse those IDs with replacement.
          Watch the same pink message arrive twice. Its source label stays put. After a hundred draws,
          count the selected outcomes and compute one new fraction.
        hold: 0.45
        visual_cues:
          - id: reuse
            phrase: Bootstrap draws reuse those IDs with replacement
            targets:
              - bootstrap-draws
          - id: stays-put
            phrase: Its source label stays put
            targets:
              - bootstrap-draws
          - id: count-outcomes
            phrase: count the selected outcomes
            targets:
              - resample-fraction
          - id: one-fraction
            phrase: compute one new fraction
            targets:
              - resample-fraction
          - id: bootstrap-duplicate
            phrase: Watch the same pink message arrive twice
            targets:
              - bootstrap-draws
            color: pink
            linger: 0.35
          - id: bootstrap-complete
            phrase: After a hundred draws
            targets:
              - resample-fraction
            color: yellow
            linger: 0.35
      - say: Add that fraction to the histogram. Repeat the whole draw, count, and deposit. Each completed
          resample adds one entry. Their spread approximates sampling movement using our observed labels
          as the stand-in population. Extra repetitions refine the calculation while the original evidence
          stays at a hundred labels.
        hold: 0.45
        visual_cues:
          - id: bootstrap-histogram
            phrase: Add that fraction to the histogram
            targets:
              - bootstrap-histogram
            color: cyan
            linger: 0.35
          - id: repeat
            phrase: Repeat the whole draw, count, and deposit
            targets:
              - bootstrap-histogram
          - id: adds-one
            phrase: Each completed resample adds one entry
            targets:
