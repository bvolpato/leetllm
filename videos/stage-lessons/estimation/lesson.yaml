            phrase: its mean is three ninths
            targets:
              - posterior
          - id: not-cases
            phrase: The prior terms are not new reviewed cases
            targets:
              - posterior
          - id: three-centers
            phrase: distinguish posterior mean, posterior mode and Wilson’s adjusted interval center
            targets:
