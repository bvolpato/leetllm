          - id: less-influence
            phrase: Fixed prior strength has less influence
            targets:
              - prior-data
          - id: prior-data
            phrase: Bring back the full hundred labels
            targets:
              - prior-data
            color: blue
            linger: 0.35
      - say: Calibration needs a separate comparison. A preselected model-score bucket forecasts twenty percent
          and yields sixteen positives among a hundred new labels. Place that forecast against its Wilson
          interval. Twenty percent is compatible here; further held-out evidence can resolve a smaller
          gap.
        hold: 0.45
        caption_starts:
          - "sixteen positives among a hundred new labels"
          - "compatible here"
        visual_cues:
          - id: calibration
            phrase: Calibration needs a separate comparison
            targets:
              - calibration-comparison
          - id: bucket
            phrase: forecasts twenty percent
            targets:
              - calibration-comparison
          - id: yields
            phrase: sixteen positives among a hundred new labels
            targets:
