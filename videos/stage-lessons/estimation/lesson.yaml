          - id: spread
            phrase: Their spread approximates sampling movement
            targets:
              - bootstrap-histogram
          - id: stand-in
            phrase: our observed labels as the stand-in population
            targets:
              - bootstrap-draws
          - id: refine
            phrase: the original evidence stays at a hundred labels
            targets:
              - bootstrap-draws
      - say: With ten observed zeros, every resample is all zeros. Its percentile interval collapses. Resampling
          can only recombine observed outcomes. Related messages also need to stay grouped when their
          dependence is part of the sampling design.
        hold: 0.4
        caption_starts:
          - "all zeros"
          - "collapses"
        visual_cues:
