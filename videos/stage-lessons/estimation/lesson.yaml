      - say: Calibration uses a separate preselected score bucket and held-out labels. One compatible interval
          does not establish calibration of the whole model. Choose bins before inspecting outcomes;
          searching many bins needs a multiple-comparison plan. Sampling uncertainty, ambiguous labels and
          unfamiliar traffic need distinct checks. The names aleatoric and epistemic do not turn one
          sampling interval into all of those checks.
