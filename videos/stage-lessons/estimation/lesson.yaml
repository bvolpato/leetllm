  - id: target-and-missing
    title: Keep the denominator attached to the target
    visual: Stable selected IDs divide into resolvedpositive, resolvednegative and unknown trays; unknown
      markers move only when actual labels arrive.
    beats:
      - say: "Name the population, estimand, estimator and estimate separately. The population is the whole weekly
          queue. The estimand is its unknown specialist share. The estimator is the rule count divided by
          sample size. Sixteen percent is the estimate realized by this sample. In the article’s
          flagged-signup example, the same denominator estimates abuse among flags: review precision, not
          recall or the false-positive rate."
        hold: 1
        caption_starts:
          - "whole weekly queue"
          - "unknown specialist share"
          - "count divided by sample size"
          - "Sixteen percent is the estimate"
        visual_cues:
          - id: name-population
            phrase: The population is the whole weekly queue
            targets:
              - target-names
          - id: name-estimand
            phrase: The estimand is its unknown specialist share
            targets:
              - target-names
          - id: name-estimator
            phrase: The estimator is the rule count divided by sample size
            targets:
              - target-names
          - id: name-estimate
            phrase: Sixteen percent is the estimate
            targets:
              - target-names
          - id: precision
            phrase: review precision
            targets:
              - target-denominator-comparison
          - id: not-recall
            phrase: not recall or the false-positive rate
            targets:
              - target-denominator-comparison
          - id: target-flagged-comparison
            phrase: In the article’s flagged-signup example
            targets:
              - target-denominator-comparison
            linger: 0.5
      - say: Random selection does not guarantee complete labels. If sixteen of eighty resolved cases are positive
          and twenty more selected cases remain unresolved, twenty percent describes the resolved cases.
          Across all one hundred selected cases, the possible fraction runs from sixteen to thirty-six
          percent, depending on those missing labels. Sampling uncertainty about the whole queue is
          additional.
        hold: 1
        caption_starts:
          - "twenty percent describes the resolved cases"
          - "sixteen to thirty-six percent"
          - "thirty-six percent"
        visual_cues:
          - id: incomplete
            phrase: Random selection does not guarantee complete labels
            targets:
              - missing-labels
          - id: resolved
            phrase: sixteen of eighty resolved cases are positive
            targets:
              - missing-labels
          - id: unresolved
            phrase: twenty more selected cases remain unresolved
            targets:
              - missing-labels
          - id: resolved-rate
            phrase: twenty percent describes the resolved cases
            targets:
              - missing-labels
          - id: possible-range
            phrase: the possible fraction runs from sixteen to thirty-six percent
            targets:
              - missing-labels
          - id: additional
            phrase: Sampling uncertainty about the whole queue is additional
            targets:
              - missing-labels
      - say: Report selected, resolved and unresolved counts. Difficult cases may be less likely to resolve, so
