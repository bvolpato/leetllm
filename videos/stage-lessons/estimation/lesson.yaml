      - say: A row bootstrap breaks that within-campaign dependence. A campaign bootstrap draws ten campaign
          identities with replacement and keeps their ten labels together. In this equal-size, perfectly
          dependent fixture, the campaign fraction has variance point two times point eight divided by
          ten; pretending one hundred independent rows gives a variance ten times smaller.
