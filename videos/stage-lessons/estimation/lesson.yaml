  - id: bias-and-prior
    title: Separate sampling bias, prior influence and interval meaning
    visual: The MSE curve switches to independent routine draws from a population with the same slice
      rates and mix. A source that stays full feeds fresh draws, while the draw count reaches 10,000.
      The schematic bell narrows around 12%, leaving a 5.6-point gap from the target population rate.
      Posterior prior terms remain distinct from observed labels.
    beats:
      - say: For this curve, switch from the fixed queue to independent routine draws from a population with
          the same slice rates and mix. An estimator’s mean squared error equals its squared bias plus
          variance. Routine-only estimates center at twelve percent while the target population rate is seventeen
          point six. The bias is minus five point six percentage points. As routine-only sample size
          grows, its variance shrinks while squared bias stays fixed at point zero zero three one three
          six. Mean squared error approaches that floor. Sampling the omitted slices repairs the target
          mismatch.
        hold: 1
        caption_starts:
          - "shrinks"
          - "stays fixed"
        visual_cues:
          - id: independent-draws
            phrase: switch from the fixed queue to independent routine draws
