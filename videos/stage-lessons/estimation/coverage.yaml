version: 1
lesson: estimation
promise: Estimate a queue rate, construct and interpret uncertainty, and distinguish missing labels,
  sampling design, bias, priors and calibration before deciding capacity.
framing: []
objectives:
  - id: intro
    can: Estimate a defined queue rate
    scenes:
      - intro
  - id: sampling
    can: Distinguish sampling variation from a changed population
    scenes:
      - sampling
  - id: score-interval
    can: Invert a score test to form a Wilson interval
    scenes:
      - score-interval
  - id: accumulating-evidence
    can: Predict sample-size effects on interval width
    scenes:
      - accumulating-evidence
  - id: boundary
    can: Diagnose boundary failures and repeated-use coverage
    scenes:
      - boundary
  - id: sample-design
    can: Weight disjoint population slices
    scenes:
      - sample-design
  - id: resampling
    can: Draw bootstrap samples without claiming new evidence
    scenes:
      - resampling
  - id: prior-and-calibration
    can: Separate prior shrinkage from calibration evidence
    scenes:
      - prior-and-calibration
  - id: target-and-missing
    can: Report estimand and unresolved-label bounds
    scenes:
      - target-and-missing
  - id: cluster-evidence
    can: Match resampling units to dependence
    scenes:
      - cluster-evidence
  - id: bias-and-prior
    can: Distinguish squared bias, variance and posterior summaries
    scenes:
      - bias-and-prior
  - id: missing-label-transfer
    can: Compute missing-label bounds for a new sample
    scenes:
      - missing-label-transfer
  - id: report
    can: Apply a predeclared staffing rule and preserve evidence limits
    scenes:
      - report
sections:
  - heading: Start with the target behind 16%
    status: taught
    scenes:
      - intro
      - target-and-missing
  - heading: Let the next hundred challenge the point estimate
    status: taught
    scenes:
      - sampling
  - heading: Replay sampling with the labels in hand
    status: taught
    scenes:
      - resampling
      - cluster-evidence
  - heading: Put a scale on the movement
    status: taught
    scenes:
      - sampling
      - score-interval
  - heading: Wald collapses at 0/10; Wilson doesn't
    status: taught
    scenes:
      - boundary
      - score-interval
  - heading: More reviews only help if they match the queue
    status: taught
    scenes:
      - accumulating-evidence
      - sample-design
  - heading: A domestic-only sample is precise about the wrong pile
    status: taught
    scenes:
      - sample-design
      - bias-and-prior
  - heading: A prior pulls the center for a different reason
    status: taught
    scenes:
      - prior-and-calibration
      - bias-and-prior
  - heading: A four-point calibration gap can still be noise
    status: taught
    scenes:
      - prior-and-calibration
      - bias-and-prior
  - heading: Print the counts, the interval, and the sampling plan
    status: taught
    scenes:
      - report
      - target-and-missing
  - heading: Tighter intervals don't fix the wrong labels
    status: taught
    scenes:
      - target-and-missing
      - bias-and-prior
  - heading: Practice with 24/120 high-value flags
    status: article-only
    reason: exercise
    note: The page supplies this independent audit practice; the film teaches a new missing-label transfer and
      the underlying interval and design mechanisms.
