            phrase: "How many rows match"
            targets: [paired-labels]
            color: yellow
            linger: 0.18
      - say: >-
          Six labels match, so raw agreement is seventy-five percent. Some matches are easy to come by. Compact is common
          on both ballots. The margins imply about thirty-six percent expected agreement, leaving Cohen's kappa near zero
          point six one. Let’s see where that adjustment comes from.
        hold: 0.8
        visual_cues:
          - id: observed-matches
            phrase: "Six labels match, so raw agreement is seventy-five percent"
            targets: [paired-labels, observed-agreement]
            color: green
            linger: 0.18
            caption_boundary: true
          - id: expected-matches
            phrase: "margins imply about thirty-six percent expected agreement"
            targets: [label-margins, expected-agreement]
            color: yellow
            linger: 0.18
            caption_boundary: true
          - id: adjust-agreement
            phrase: "Cohen's kappa near zero point six one"
            targets: [kappa]
            color: cyan
            linger: 0.18
            caption_boundary: true
      - say: >-
          First keep the case numbers attached. The two misses are different. On case six the judge chose compact over the
          human’s stepwise. On case seven it chose stepwise where the human saw a tie. Keep those confusion counts. They
          tell a reviewer which disagreements to reopen.
        hold: 0.85
        visual_cues:
          - id: report-confusion
            phrase: "The two misses are different"
            targets: [paired-labels, label-margins]
            color: blue
            linger: 0.18
      - say: >-
          Now set the case numbers aside. Take any one of the eight human labels and pair it with any one of the eight
          judge labels. That gives sixty-four equally weighted combinations. Three human compact labels cross four judge
          compact labels. Twelve squares match. Stepwise adds nine more and tie adds two. That’s the chance baseline,
          twenty-three over sixty-four. Six observed matches are forty-eight over sixty-four. Above the baseline, we
          gained twenty-five parts out of the forty-one still possible. That’s kappa, twenty-five over forty-one, about
          point six zero nine eight. It describes agreement on these cases. Inspect the errors and validate on reviewed
          cases from the task before using the score for a release.
        hold: 1.3
        visual_cues:
          - id: chance-products
            phrase: "Three human compact labels cross four judge compact labels"
            targets: [chance-products]
            color: cyan
            linger: 0.18
          - id: compact-product
            phrase: "Twelve squares match"
            targets: [chance-products]
            color: green
            linger: 0.18
          - id: step-product
            phrase: "Stepwise adds nine more"
            targets: [chance-products]
            color: cyan
            linger: 0.18
          - id: tie-product
            phrase: "tie adds two"
            targets: [chance-products]
            color: yellow
            linger: 0.18
          - id: chance-baseline
            phrase: "twenty-three over sixty-four"
            targets: [chance-baseline]
            color: yellow
            linger: 0.18
            caption_boundary: true
          - id: chance-observed
            phrase: "Six observed matches are forty-eight over sixty-four"
            targets: [chance-baseline]
            color: green
            linger: 0.18
            caption_boundary: true
          - id: earned-kappa
            phrase: "twenty-five over forty-one, about point six zero nine eight"
            targets: [earned-kappa]
            color: green
            linger: 0.18
            caption_boundary: true
  - id: prevalence-trap
