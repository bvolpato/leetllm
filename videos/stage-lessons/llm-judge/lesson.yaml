  - id: zero-error-bound
    title: How much error could a clean sample hide?
    visual: Fifty independent cases set the exponent in the zero-error bound. A fixed plot shows which preplanned sample size brings the limit below one percent. Repeats stay tied to the same cases.
    beats:
      - say: >-
          Suppose you set aside fifty independent known-bad answers before testing. The judge rejects all fifty. That’s
          zero false acceptances. How often could a bad answer still get through? Call that probability p and assume it’s
          the same on each trial. Rejecting one bad answer has probability one minus p. To get a clean run, all fifty have
          to be rejected, so fifty goes in the exponent. Find the rate that makes this clean result a five percent event.
          That gives the one-sided ninety-five percent upper limit. At fifty cases the limit is about five point eight two
          percent.
        hold: 1.05
        visual_cues:
          - id: zero-inputs
            phrase: "fifty independent known-bad answers"
            targets: [zero-inputs]
            color: cyan
            linger: 0.18
          - id: zero-observed
            phrase: "The judge rejects all fifty"
            targets: [zero-observed]
            color: green
            linger: 0.18
          - id: zero-probability
            phrase: "probability one minus p"
            targets: [zero-probability]
            color: cyan
            linger: 0.18
          - id: upper-formula
            phrase: "fifty goes in the exponent"
            targets: [upper-formula]
            color: yellow
            linger: 0.18
          - id: upper-fifty
            phrase: "five point eight two percent"
            targets: [upper-fifty]
            color: pink
            linger: 0.18
            caption_boundary: true
      - say: >-
          Suppose your target is an upper limit below one percent. Plan a larger sample and keep the same assumption of
          zero false accepts. Follow the curve as the number of independent cases grows. To find where it crosses the
          target, divide the log of point zero five by the log of point nine nine. Round up to two hundred ninety-nine
          independent known-bad cases. Its upper limit is about point nine nine seven percent. One fewer case leaves the
          limit just above the target. Three divided by the sample size is a quick approximation. Ninety-five percent
          describes how often this procedure covers the true rate over repeated samples.
        hold: 0.9
        visual_cues:
          - id: required-count
            phrase: "Follow the curve as the number of independent cases grows"
            targets: [required-count]
            color: cyan
            linger: 0.18
          - id: required-result
            phrase: "two hundred ninety-nine independent known-bad cases"
            targets: [required-result]
            color: green
            linger: 0.18
            caption_boundary: true
          - id: required-limit
            phrase: "Its upper limit is about point nine nine seven percent"
            targets: [required-result]
            color: green
            linger: 0.18
            caption_boundary: true
          - id: confidence-meaning
            phrase: "over repeated samples"
            targets: [confidence-meaning]
            color: yellow
            linger: 0.18
      - say: >-
          Could you use the original fifty cases six times? That gives three hundred calls on the same fifty cases. Those
          repeats measure how often the judge changes its mind. They add no independent cases. Choose the sample and the
          analysis before testing. Waiting for a lucky clean streak changes the stopping rule and invalidates this bound.
          For a separate budget, two hundred distinct cases, two orders and three repeats cost twelve hundred judge calls.
          The bound concerns known-bad answers. Production misses also depend on how often bad answers arrive, which tasks
          you sampled, and which failures your test missed.
        hold: 0.8
        caption_starts: ["That gives three hundred calls on the same fifty cases.", "Those repeats measure how often the judge changes its mind."]
        visual_cues:
          - id: repeat-distinction
            phrase: "three hundred calls on the same fifty cases"
            targets: [repeat-distinction]
            color: pink
            linger: 0.18
          - id: stopping-rule
            phrase: "lucky clean streak"
            targets: [stopping-rule]
            color: pink
            linger: 0.18
          - id: call-budget
            phrase: "twelve hundred judge calls"
            targets: [call-budget]
            color: yellow
            linger: 0.18
            caption_boundary: true
          - id: bound-scope
            phrase: "The bound concerns known-bad answers"
            targets: [bound-scope]
            color: cyan
            linger: 0.18
          - id: larger-plan
            phrase: "two hundred distinct cases"
            targets: [call-budget]
            color: cyan
            linger: 0.18
