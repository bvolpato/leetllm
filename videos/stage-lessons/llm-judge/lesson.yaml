  - id: agreement
    title: How often do the labels agree?
    visual: Eight paired rows give observed agreement. An eight-by-eight grid then crosses every human label with every judge label to construct the marginal baseline.
    beats:
      - say: >-
          Take eight hand-written pairs. Each row holds a human label and a judge label for the same case. Read across
          case six. The human picked stepwise and the judge picked compact. On case eight they both called a tie. How many
          rows match when you include that tie?
        hold: 2.3
