    visual: An approve-everything judge misses all ten bad answers. Cross the two ballots’ label frequencies to explain its zero kappa, then change the last ten reviewer labels.
    beats:
      - say: In a separate binary worksheet, reviewers call ninety of one hundred answers acceptable. A judge approves
          everything. It agrees on ninety cases and catches none of the ten known-bad answers. With acceptable
