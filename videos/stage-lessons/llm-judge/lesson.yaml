          restore again. Now open the backup service’s record for this exact job. The restore completed. There’s been no
          later change or new request. Repeating the restore would redo finished work. What should Maya check next to find
          out whether the backup is usable?
        hold: 2.6
        caption_starts: ["Run the restore again.", "The restore completed."]
        visual_cues:
          - id: fresh-return
            phrase: "Both picked alpha for clarity"
            targets: [fresh-choice]
            color: cyan
            linger: 0.18
          - id: fresh-completion
            phrase: "open the backup service’s record for this exact job"
            targets: [fresh-completion]
            color: cyan
            linger: 0.18
          - id: fresh-state-failure
            phrase: "Repeating the restore would redo finished work"
            targets: [fresh-state-failure]
            color: pink
            linger: 0.18
            caption_boundary: true
          - id: fresh-next
            phrase: "What should Maya check next"
            targets: [next-action, fresh-completion]
            color: yellow
            linger: 0.18
      - say: >-
          Verify recovery instead. For example, read a known file from the restored copy and compare its contents with the
          expected version. Keep that check open until the evidence comes back. The judge settled which reply it
          preferred. The service record is what changed Maya’s next step.
        hold: 1.8
        caption_starts: ["For example, read a known file"]
        visual_cues:
          - id: fresh-state-repair
            phrase: "Verify recovery instead"
            targets: [fresh-state-repair]
            color: green
            linger: 0.18
            caption_boundary: true
          - id: verify-file
            phrase: "read a known file from the restored copy"
            targets: [recovery-check]
            color: cyan
            linger: 0.18
