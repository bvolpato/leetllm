scenes:
  - id: subject-intro
    title: Two replies to Maya’s rollback alert
    visual: Two message bubbles contract to the first three words of each reply. Open the full replies and underline the same action in two places.
    beats:
      - say: >-
          Read just the first three words of each reply. Which preview tells Maya what to do?
        hold: 2.5
        visual_cues:
          - id: find-action
            phrase: "Which preview tells Maya what to do"
            targets: [scan-question, compact-answer, stepwise-answer]
            color: yellow
            linger: 0.18
      - say: >-
          The compact reply opens with “Stop the rollout.” Open the checklist. It starts with a warning.
          There’s the same instruction in step one. Both replies tell Maya to stop the rollout and run the rollback.
          One puts the action first. The other gives her two steps she can tick off.
        hold: 1
        caption_starts: ["Open the checklist."]
        visual_cues:
          - id: compact-mark
            phrase: "The compact reply opens with Stop the rollout"
            targets: [compact-answer]
            color: green
            linger: 0.18
            caption_boundary: true
          - id: step-mark
            phrase: "There’s the same instruction in step one"
            targets: [stepwise-answer]
            color: cyan
            linger: 0.18
          - id: both-actions
            phrase: "Both replies tell Maya to stop the rollout and run the rollback"
            targets: [compact-answer, stepwise-answer]
            color: cyan
            linger: 0.18
      - say: >-
          Which layout is easier to follow? Give a language model the replies, Maya’s task and a rubric for clarity.
          Now the model can act as an LLM judge.
          Suppose the judge picks the checklist because the numbered actions are easy to scan.
          We can swap the replies to see if it still picks the checklist, then ask on-call engineers how they’d vote.
        hold: 0.85
        caption_starts: ["Suppose the judge picks the checklist"]
        visual_cues:
          - id: judge-pick
            phrase: "the judge picks the checklist"
            targets: [judge-receipt]
            color: yellow
            linger: 0.18
          - id: test-pick
            phrase: "swap the replies"
            targets: [judge-receipt]
            color: cyan
            linger: 0.18
  - id: separate-checks
    title: What did the check establish?
    visual: A fixed action field and two opposite sentences pass the same checks. Read the changed words to decide which answer follows the instruction.
    beats:
      - say: >-
          The policy calls for rollback. Here are two records with the same policy version and the same action field.
          Compare the action field with the allowed value. Both match. Code can settle that question exactly.
        hold: 0.6
        visual_cues:
          - id: exact-fields
            phrase: "Compare the action field"
            targets: [exact-check]
            color: blue
            linger: 0.18
      - say: >-
          Now read the sentences beside those fields. One says to run the rollback. The other says, “Do not run the
          rollback.” If we search both replies for the word rollback, which ones pass?
        hold: 2.1
        visual_cues:
          - id: two-sentences
            phrase: "read the sentences"
            targets: [sentences]
            color: cyan
            linger: 0.18
          - id: opposite-meaning
            phrase: "Do not run the rollback"
            targets: [sentences]
            color: pink
            linger: 0.18
          - id: search-word
            phrase: "search both replies for the word rollback"
            targets: [keyword, sentences]
            color: yellow
            linger: 0.18
      - say: >-
          Both pass. The search found the word twice, once in each reply. The words “do not” reverse the second
          recommendation. An exact field check can pass while the prose contradicts the policy. To evaluate that prose,
          compare its meaning with the source. Use a validated judge to assist that review, and send unfamiliar or
          high-consequence exceptions to the policy owner. Access and action permissions stay with the host.
        hold: 1
        visual_cues:
          - id: keyword-hits
            phrase: "Both pass"
            targets: [keyword]
            color: yellow
            linger: 0.18
            caption_boundary: true
          - id: negation
            phrase: "reverse the second recommendation"
            targets: [sentences]
            color: pink
            linger: 0.18
  - id: evaluation-formats
    title: How many judgments will this comparison take?
    visual: Three replies anchor an ordinal scale. Six candidate revisions form fifteen unordered pairs.
      Keeping only edges to a fixed baseline changes the number of comparisons.
    beats:
      - say: Suppose Maya gets one reply. We can grade it on its own. That’s pointwise evaluation. Here, zero means a
          required action is missing, one means both appear but their order is unclear, and two means both
          actions and their order are clear. These are ordinal levels. The numbers put answers in order. To
          average them, you’d have to explain how much improvement each step represents. One call per answer
          gives N judgments for N answers.
        hold: 0.7
        visual_cues:
          - id: pointwise-anchors
            phrase: zero means a required action is missing
            targets:
              - pointwise-anchors
            color: cyan
            linger: 0.4
          - id: ordinal-limit
            phrase: These are ordinal levels
            targets:
              - ordinal-limit
            color: yellow
            linger: 0.4
          - id: pointwise-one
            phrase: one means both appear but their order is unclear
            targets:
              - pointwise-anchors
            color: cyan
            linger: 0.4
          - id: pointwise-two
            phrase: two means both actions and their order are clear
            targets:
              - pointwise-anchors
            color: cyan
            linger: 0.4
      - say: "Put two replies side by side for the same task and you have a pairwise comparison. Six prompt
          revisions are the six dots on the left. Each dot can meet five others. That counts each connecting
          line twice, so divide by two. You get fifteen unordered pairs. Showing both orders requires thirty calls per task. A
          fixed baseline uses N minus one pairs. Comparing the five alternatives only with one fixed baseline
          needs five pairs, or ten calls with swaps. What happens if we send a longer reference? Suppose the
          input grows from two hundred tokens per call to eight hundred. The ten calls now read eight thousand
          input tokens instead of two thousand. That’s a different workload for the same number of calls.
          Preferences can cycle: A over B, B over C, then C over A. A forced winner can also choose between
          two unsupported replies."
        hold: 0.7
        caption_starts: ["You get fifteen unordered pairs.", "Showing both orders requires thirty calls per task.", "What happens if we send a longer reference?"]
        visual_cues:
          - id: pair-lattice
            phrase: Six prompt revisions
            targets:
              - pair-lattice
            color: cyan
            linger: 0.4
          - id: pair-count
            phrase: fifteen unordered pairs
            targets:
              - pair-count
            color: yellow
            linger: 0.4
          - id: pair-calls
            phrase: Showing both orders requires thirty calls per task
            targets:
              - pair-count
            color: yellow
            linger: 0.4
          - id: preference-cycle
            phrase: Preferences can cycle
            targets:
              - preference-cycle
            color: pink
            linger: 0.4
          - id: baseline-count
            phrase: A fixed baseline uses N minus one pairs
            targets:
              - pair-lattice
              - pair-count
            color: green
            linger: 0.4
          - id: baseline-result
            phrase: Comparing the five alternatives only with one fixed baseline needs five pairs, or ten calls with swaps
            targets:
              - pair-count
            color: green
            linger: 0.4
          - id: longer-input
            phrase: the input grows from two hundred tokens per call to eight hundred
            targets: [input-budget]
            color: cyan
          - id: input-total
            phrase: eight thousand input tokens instead of two thousand
            targets: [input-budget]
            color: cyan
            caption_boundary: true
      - say: Reference guidance supplies an answer key or source evidence alongside either format. Verify each claim
          and its conditions, including valid paraphrases or alternative solutions that a short reference may
          omit. Prometheus used custom rubrics and reference answers. G-Eval studied criterion-based forms for
          summarization and dialogue. JudgeLM learned GPT-four judgments using swap augmentation and reference
          techniques. Agreement with that teacher measures how well JudgeLM learned its preferences.
          To check a factual claim in Maya’s reply, open the policy it cites.
        hold: 0.7
        visual_cues:
          - id: reference-guidance
            phrase: alongside either format
            targets:
              - reference-guidance
            color: cyan
            linger: 0.4
          - id: teacher-boundary
            phrase: To check a factual claim
            targets:
              - teacher-boundary
            color: yellow
            linger: 0.4
  - id: rubric
    title: Write criteria a reviewer can apply
    visual: DEP-27's required action and an anchored clarity rubric are applied to compact and stepwise candidate
      replies.
    beats:
      - say: >
          Our fictional policy, DEP twenty-seven, says to stop the rollout and run the rollback procedure
          after a threshold is crossed. Candidate compact states both facts in one sentence. Candidate
          stepwise gives the same facts as two numbered actions.
        hold: 0.55
        visual_cues:
          - id: policy-actions
            phrase: stop the rollout and run the rollback procedure
            targets:
              - policy-rule
            color: blue
            linger: 0.5
          - id: same-facts
            phrase: same facts as two numbered actions
            targets:
              - compact-answer
              - stepwise-answer
            color: cyan
            linger: 0.5
      - say: >
          A rubric can score whether both required actions appear, whether their order is clear, and whether
          an operator can scan them quickly. Give each level an example so reviewers know what a zero, one,
          and two mean.
        hold: 0.7
        visual_cues:
          - id: score-levels
            phrase: zero, one, and two
            targets:
              - rubric-levels
            color: yellow
            linger: 0.5
      - say: >
          For this example, assume a reviewer checked both replies against the policy. Keep
          the policy, answer text, rubric version, and judge configuration tied to each evaluation case.
        hold: 0.55
        visual_cues:
          - id: bound-case
            phrase: policy, answer text, rubric version
            targets:
              - policy-rule
              - rubric-levels
            color: blue
            linger: 0.5
  - id: strict-receipt
    title: Can this receipt enter the comparison?
    visual: Compare a two-field receipt with a duplicate verdict. Keep a structural rejection separate from an accepted receipt whose evidence misquotes reply B.
    beats:
      - say: >-
          The host knows the case, the two reply versions and the order it sent. The model gets to return a verdict and
          evidence. Here’s one receipt. The verdict is B. Its evidence is a list containing a nonblank observation. Those
          are the only two fields. The other permitted verdicts are A, tie and review. This receipt passes the shape
          check. We still have to check what the observation says.
        hold: 0.9
        visual_cues:
          - id: host-binding
            phrase: "the order it sent"
            targets: [host-binding]
            color: cyan
            linger: 0.18
          - id: strict-fields
            phrase: "a verdict and evidence"
            targets: [raw-receipt]
            color: cyan
            linger: 0.18
          - id: valid-receipt
            phrase: "passes the shape check"
            targets: [parse-result]
            color: green
            linger: 0.18
            caption_boundary: true
      - say: >-
          Now slip another verdict into that same receipt. Read the two entries in order. The first says A and the second
          says B. What will Python’s default JSON decoder keep? Can the host safely count that as a vote?
        hold: 2.5
        visual_cues:
          - id: duplicate-keys
            phrase: "slip another verdict into that same receipt"
            targets: [raw-receipt]
            color: pink
            linger: 0.18
          - id: decode-question
            phrase: "What will Python’s default JSON decoder keep"
            targets: [parse-result, raw-receipt]
            color: yellow
            linger: 0.18
      - say: >-
          Python keeps B, the last value. By the time you inspect the dictionary, A has disappeared. Give the decoder an
          object pairs hook so it sees both names before building the dictionary. It rejects the duplicate. The same check
          catches a Unicode escape that spells the same field name after decoding. Keep the raw receipt as a parse
          failure. A failed parse supplies no vote.
        hold: 0.9
        visual_cues:
          - id: default-last-wins
            phrase: "Python keeps B, the last value"
            targets: [default-result]
            color: yellow
            linger: 0.18
            caption_boundary: true
          - id: strict-decode
            phrase: "It rejects the duplicate"
            targets: [parse-result]
            color: pink
            linger: 0.18
            caption_boundary: true
          - id: decoded-name
            phrase: "a Unicode escape that spells the same field name"
            targets: [raw-receipt]
            color: cyan
            linger: 0.18
      - say: >-
          The article’s strict decoder also rejects nonstandard numbers such as NaN and infinity, malformed JSON such as a
          trailing comma, and non-text input. Across its two exercises it rejects four bad JSON receipts and six malformed
          structured replies. For a decoded object, reject extra fields, unknown verdicts, wrong types and empty or blank
          evidence. Record provider refusals, truncation and transport errors separately. Send only validated receipts
          into aggregation. Constructing the result object yourself can skip these checks.
        hold: 0.7
        visual_cues:
          - id: provider-boundary
            phrase: "Record provider refusals"
            targets: [parse-result]
            color: blue
            linger: 0.18
      - say: >-
          Go back to the clean receipt. It says B leads with the action. Read B’s first sentence. It leads with the
          threshold warning. The receipt parses, but the reason misquotes the reply. Check the observation against the
          actual text before trusting it. The host must bind the case and configuration IDs to the exact evidence, rubric,
          judge and settings. An ID alone can’t authenticate a record or grant access.
        hold: 1.2
        visual_cues:
          - id: audit-clean
            phrase: "the clean receipt"
            targets: [raw-receipt]
            color: cyan
            linger: 0.18
          - id: check-b
            phrase: "Read B’s first sentence"
            targets: [actual-reply]
            color: cyan
            linger: 0.18
          - id: misquote
            phrase: "It leads with the threshold warning"
            targets: [actual-reply]
            color: pink
            linger: 0.18
            caption_boundary: true
  - id: reader-model-check
    title: Does the model’s verdict follow from the policy?
    visual: The article reported seven actual local-model outcomes. A correct paraphrase is followed by three
      valid-JSON false supports; the evidence sentence and verdict are inspected separately.
    beats:
      - say: The article records a local Qwen-three run on seven claims. The model has one point seven billion
          parameters. Sampling and thinking were off. Read the human key beside those claims. It has two
          supported, two contradicted and three review labels. The model recognized that permission means
          approval here. It also recognized the linked plan requirement, caught one contradiction and sent the
          planted instruction to review. These are the results recorded in the article.
        hold: 0.7
        visual_cues:
          - id: reader-snapshot
            phrase: records a local Qwen-three
            targets:
              - reader-snapshot
            color: cyan
            linger: 0.4
          - id: reader-labels
            phrase: two supported, two contradicted and three review
            targets:
              - reader-labels
            color: cyan
            linger: 0.4
      - say: Look at the claim that commander approval is optional. The model marked it supported. Now read
          its reason. It says that approval is required. It also approved two requirements the policy never
          states, one for security review and one for on-call approval. All three are valid JSON. The smaller
          model in the article, with zero point six billion parameters, called every claim supported.
          Before relying on either judge, measure its mistakes on held-out claims for your own policy.
        hold: 0.7
        visual_cues:
          - id: semantic-miss
            phrase: commander approval is optional
            targets:
              - semantic-miss
            color: pink
            linger: 0.4
          - id: valid-json-misses
            phrase: All three are valid JSON
            targets:
              - valid-json-misses
            color: yellow
            linger: 0.4
  - id: order-swap
    title: Which reply did the judge pick?
    visual: The same two reply excerpts move between fixed slots. Each receipt records a slot and the reply that occupied it. A replay changes only the second verdict.
    beats:
      - say: >-
          Here are the two replies Maya saw. Compact is in A and stepwise is in B. Our first receipt says B. File that
          choice under stepwise. For the second call, slide the two replies into each other’s slots. The task, the
          wording, the rubric and the judge settings all stay fixed.
        hold: 0.7
        visual_cues:
          - id: first-slots
            phrase: "Compact is in A and stepwise is in B"
            targets: [first-mapping]
            color: cyan
            linger: 0.18
          - id: slot-first-verdict
            phrase: "Our first receipt says B"
            targets: [first-receipt]
            color: yellow
            linger: 0.18
          - id: first-name
            phrase: "File that choice under stepwise"
            targets: [first-receipt]
            color: cyan
            linger: 0.18
          - id: reverse-order
            phrase: "slide the two replies into each other’s slots"
            targets: [swapped-mapping]
            color: blue
            linger: 0.18
      - say: >-
          This receipt says A. Read A against the new order. Do the two receipts pick the same reply?
        hold: 2.4
        visual_cues:
          - id: slot-second-verdict
            phrase: "This receipt says A"
            targets: [second-receipt]
            color: yellow
            linger: 0.18
          - id: ask-stable
            phrase: "Do the two receipts pick the same reply"
            targets: [decision, first-receipt, second-receipt, swapped-mapping]
            color: blue
            linger: 0.18
      - say: >-
          Yes. Both pick stepwise. B on the first call and A on the second call follow the numbered instructions. Record
          one preference for the pair. Whether a reviewer agrees is a separate question.
        hold: 1
        visual_cues:
          - id: stable-identity
            phrase: "Both pick stepwise"
            targets: [decision, second-receipt]
            color: cyan
            linger: 0.18
            caption_boundary: true
      - say: >-
          Replay just the second receipt. Keep the replies in their reversed positions. This time it says B. The first
          receipt still says B. Which reply does this second B name, and can we record a winner?
        hold: 2.6
        visual_cues:
          - id: replay
            phrase: "Replay just the second receipt"
            targets: [second-receipt]
            color: cyan
            linger: 0.18
          - id: second-b
            phrase: "This time it says B"
            targets: [second-receipt]
            color: yellow
            linger: 0.18
          - id: ask-conflict
            phrase: "Which reply does this second B name"
            targets: [decision, first-receipt, second-receipt, swapped-mapping]
            color: blue
            linger: 0.18
      - say: >-
          It names compact. The first B named stepwise. Record this pair as unresolved and keep both receipts. The choice
          followed the slot on this pair. Repeat the comparison across other tasks and check human labels before
          attributing a general preference to position.
        hold: 1
        visual_cues:
          - id: second-name
            phrase: "It names compact"
            targets: [second-receipt]
            color: green
            linger: 0.18
            caption_boundary: true
          - id: conflicting-identities
            phrase: "Record this pair as unresolved"
            targets: [decision, first-receipt, second-receipt]
            color: pink
            linger: 0.18
            caption_boundary: true
  - id: swap-contract
    title: Reconcile identity while preserving ties and review
    visual: Two host-bound receipts first validate reversed order/configuration, then feed separate same-winner,
      stable-tie, unresolved and human-review tracks.
    beats:
      - say: Before combining two calls, require the same case and judge configuration and exactly reversed candidate
          orders. The executable fixture rejects a same-order pair, a cross-case pair and a
          cross-configuration pair. Normalize A and B through each host-owned order. If one call chooses a
          winner and the other says tie, keep the case unresolved. Two explicit ties give a stable tie. If
          either requests review, route it to review under this supplied conservative policy.
        hold: 0.7
        visual_cues:
          - id: same-case-contract
            phrase: same case and judge configuration
            targets:
              - same-case-contract
            color: cyan
            linger: 0.4
          - id: mixed-swap
            phrase: one call chooses a winner and the other says tie
            targets:
              - mixed-swap
            color: pink
            linger: 0.4
          - id: stable-tie
            phrase: Two explicit ties
            targets:
              - stable-tie
            color: cyan
            linger: 0.4
          - id: review-outcome
            phrase: If either requests review
            targets:
              - review-outcome
            color: yellow
            linger: 0.4
      - say: >-
          Both calls favor a reply that says commander approval is optional. The policy says it’s required.
          Swapping the replies can expose a preference for one position. For pairs that split, repeat the calls to see
          whether the votes vary. Check the evidence and rubric for ambiguity. Track unresolved pairs by task
          and save the rule for combining votes with each judge version.
        hold: 0.7
        visual_cues:
          - id: stable-mistake
            phrase: The policy says it’s required
            targets:
              - stable-mistake
            color: pink
            linger: 0.4
          - id: version-reconciliation
            phrase: save the rule for combining votes
            targets:
              - version-reconciliation
            color: cyan
            linger: 0.4
  - id: blind-and-probe
    title: Remove labels and test shortcuts
    visual: Candidate names disappear while their answers remain; a redundant version changes length without
      adding useful information.
    beats:
      - say: >
          Hide model brand names and experiment labels from the judge. Keep the candidate IDs and their slot
          mapping in the host's record, where the verdict can be traced back to the original answer.
        hold: 0.55
        visual_cues:
          - id: blind-brands
            phrase: Hide model brand names
            targets:
              - anonymous-input
            color: blue
            linger: 0.5
          - id: retain-mapping
            phrase: candidate IDs and their slot mapping
            targets:
              - host-mapping
            color: green
            linger: 0.5
      - say: >
          To probe verbosity, add redundant wording without adding facts or useful structure. Ask blinded
          reviewers to check that the edit preserves quality, then see whether the judge changes its
          preference across matched cases.
        hold: 0.7
        visual_cues:
          - id: verbosity-probe
            phrase: add redundant wording
            targets:
              - verbosity-pair
            color: yellow
            linger: 0.5
      - say: >
          In the JudgeDeceiver study, an instruction inside a candidate reply could change the judge’s score.
          Run the judge without action-taking tools or unnecessary secrets. Check the verdict and its evidence against the rubric.
        hold: 0.55
        visual_cues:
          - id: injection-probe
            phrase: an instruction inside a candidate reply
            targets:
              - injection-text
            color: pink
            linger: 0.5
          - id: isolate-tools
            phrase: without action-taking tools or unnecessary secrets
            targets:
              - isolated-run
            color: blue
            linger: 0.5
  - id: controlled-probes
    title: What changes a judge’s vote?
    visual: The same instruction gains padding, then an author label. In a separate example, compare three votes with the disputed claim and the policy.
    beats:
      - say: >-
          Add one sentence to the reply. It repeats the same two actions. Have blinded reviewers check that the extra
          words add nothing useful, then compare both orders across tasks. Try a numbered checklist too. If the steps
          are easier to follow, give it credit for organization. Length-Controlled AlpacaEval fits a logistic model to
          preferences. Set the length difference to zero in that model to estimate the overall win rate for equal-length replies.
        hold: 0.7
        visual_cues:
          - id: padding-only
            phrase: "Add one sentence to the reply"
            targets: [padding-only]
            color: cyan
          - id: useful-elaboration
            phrase: "Try a numbered checklist"
            targets: [useful-elaboration]
            color: cyan
          - id: length-model
            phrase: "Set the length difference to zero"
            targets: [length-model]
            color: yellow
      - say: >-
          Keep the reply exactly as written. Switch the author label from A to B. Do the votes move with the name across cases?
          To test self-preference, hide the names. Give different judge families the same anonymous replies, matched
          for quality by human reviewers. Panickssery and colleagues found that some models recognized and favored their
          own writing. Check whether the writing style gives away the author on your cases.
        hold: 0.7
        visual_cues:
          - id: brand-probe
            phrase: "Switch the author label"
            targets: [brand-probe]
            color: cyan
          - id: self-probe
            phrase: "hide the names"
            targets: [self-probe]
            color: cyan
          - id: identity-scope
            phrase: "the writing style gives away the author"
            targets: [identity-scope]
            color: yellow
      - say: >-
          Here’s a claim that commander approval is optional. Three judges mark it supported. Open the policy.
          It says approval is required. All three judges accepted the same error. Three yes-or-no votes always give a majority.
          If judges can also vote tie or request review, decide how to count those outcomes.
          A twenty twenty-six preprint used the other judges’ majority to estimate each judge’s error rate and simulated changes over time.
          On this claim, that method would count every vote as correct. To find shared mistakes, compare each judge and the
          panel with independent human labels. Count false approvals by type of case.
        hold: 0.7
        caption_starts: ["Open the policy.", "It says approval is required.", "On this claim", "To find shared mistakes"]
        visual_cues:
          - id: correlated-panel
            phrase: "Three judges mark it supported"
            targets: [correlated-panel]
            color: cyan
          - id: open-policy
