            targets: [recent-exchange]
            color: yellow
      - say: >-
          Now the shift asks why the lead approved the rollback. The archived entry has a nine-unit excerpt with the signed decision and its recorded reason. How can you fit that excerpt while keeping the recent exchange and all twelve reply slots?
        hold: 3.1
