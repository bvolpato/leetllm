            targets: [source-in]
            color: yellow
          - id: fit-result
            phrase: "uses thirty-seven of forty"
            targets: [fit-result]
            color: yellow
      - say: >-
          Read the signed excerpt. The canary callback returned HTTP five hundred. The next shift can cite that line and still has twelve slots to answer.
        caption_starts: ["The canary callback returned HTTP five hundred"]
        hold: 1.2
        visual_cues:
