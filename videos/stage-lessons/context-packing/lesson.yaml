version: 1
id: context-packing
opening: lesson
title: Choosing What Fits in a Context Window
source: fundamentals/long-context-window-management/content.md
voice: en-US-AndrewNeural
rate: +0%
sources:
  - title: Lost in the Middle
    url: https://arxiv.org/abs/2307.03172
  - title: RULER, What is the real context size of your long-context language models
    url: https://arxiv.org/abs/2404.06654
  - title: RoFormer
    url: https://arxiv.org/abs/2104.09864
  - title: Position Interpolation
    url: https://arxiv.org/abs/2306.15595
  - title: YaRN
    url: https://arxiv.org/abs/2309.00071
  - title: StreamingLLM
    url: https://arxiv.org/abs/2309.17453
  - title: Ring Attention
    url: https://arxiv.org/abs/2310.01889
  - title: Grouped-query attention
    url: https://arxiv.org/abs/2305.13245
  - title: FlashAttention
    url: https://arxiv.org/abs/2205.14135
  - title: PagedAttention
    url: https://arxiv.org/abs/2309.06180
scenes:
  - id: intro
    title: "Who approved the canary rollback?"
    visual: "Two chat messages sit inside the assistant's request. A signed decision slips out of the archive folder beside them."
    beats:
      - say: >-
          Rollback complete. That's the last message in the assistant's request.
        hold: 0.4
        visual_cues:
          - id: read-completion
            phrase: "Rollback complete"
            targets: [completion-message]
            color: green
      - say: >-
          One message earlier, the deploy owner asked for the rollback. Can you tell who approved it?
        hold: 2.6
        visual_cues:
          - id: read-request
            phrase: "deploy owner asked"
            targets: [request-message]
            color: yellow
      - say: >-
          Open the archived decision. The incident lead signed it. Let's pack that signed line with the question and leave room for the reply.
        caption_starts: ["The incident lead signed it", "Let's pack that signed line"]
        hold: 1
        visual_cues:
          - id: open-record
            phrase: "Open the archived decision"
            targets: [archive-record]
            color: yellow
          - id: read-signature
            phrase: "The incident lead signed it"
            targets: [archive-signature]
            color: yellow
  - id: budget
    title: "How much room does history get?"
    visual: "Generation takes the right end of a 32-unit window. Mandatory input takes eight more slots. The audience calculates the gap before its length appears."
    beats:
      - say: >-
          A context window limits the tokens the model can take in and generate in one request. Give this one thirty-two slots. Each slot stands for a token unit in our example. Set aside eight for the reply so that generation can finish even if we fill the rest with input.
        hold: 0.7
        visual_cues:
          - id: reserve-reply
            phrase: "Set aside eight for the reply"
            targets: [reply-slots]
            color: cyan
      - say: >-
          The instructions take four units. The current question takes four more. How many can we spend on history?
        hold: 2.2
        visual_cues:
          - id: rules
            phrase: "instructions take four"
            targets: [rule-slots]
            color: cyan
          - id: question
            phrase: "current question takes four"
            targets: [question-slots]
            color: cyan
      - say: >-
          Sixteen units remain for history. In a real request, count the serialized input with the deployment's tokenizer. That includes message boundaries, tools and separators. A reusable prefix still occupies positions even when its cached state saves work.
        hold: 0.9
        visual_cues:
          - id: available
            phrase: "Sixteen units remain for history"
            targets: [history-budget]
            color: cyan
  - id: complete-turns
    title: "Which exchanges can travel together?"
    visual: "Whole recent exchanges enter the budget in chronological prompt order. The twelve-unit exchange containing D1 remains in the archive when only two slots are free."
    beats:
      - say: >-
          Start at the newest exchange. Its question and answer cost six units together. Keep both so we know what the answer refers to. The next pair costs eight. Keep that pair too, in front of the newer one.
        hold: 0.8
        visual_cues:
          - id: pack-newest
            phrase: "Keep both"
            targets: [packed-newest]
            color: green
          - id: pack-middle
            phrase: "Keep that pair too"
            targets: [packed-middle]
            color: green
      - say: >-
          Now look at the oldest exchange. It contains the decision record. Can its twelve units fit beside the two pairs we've kept?
        hold: 2.2
        visual_cues:
          - id: try-oldest
            phrase: "oldest exchange"
            targets: [archive-packet]
            color: green
      - say: >-
          Only two slots are free. Adding twelve would take the request to forty-two. Leave the whole exchange in the archive. This newest-first rule keeps a continuous run of complete exchanges. For a tool call, keep its identifier and its result together too. Our request fits. The assistant still has no evidence of who approved the rollback.
        caption_starts: ["Adding twelve would take the request to forty-two", "Leave the whole exchange in the archive"]
        hold: 1.1
        visual_cues:
          - id: exclude-oldest
            phrase: "take the request to forty-two"
            targets: [oldest-attempt]
            color: green
  - id: overflow
    title: "What if the question itself grows?"
    visual: "With history empty, a longer mandatory request crosses the same limit. Retrying the original mandatory request under the same cap shows which inputs caused the rejection."
    beats:
      - say: >-
          Set the history aside. Keep the same thirty-two slots and the same eight for the reply. This time the instructions need fourteen and the current question needs twelve. Would removing history get this through?
        hold: 2.1
        visual_cues:
          - id: larger-input
            phrase: "instructions need fourteen"
            targets: [required-parts]
            color: pink
      - say: >-
          The mandatory total is thirty-four. The required input and reply alone exceed the limit by two units. The packer rejects this request. Keep the question intact and ask for a smaller task, split it, or use a larger window you've tested.
        hold: 0.8
        visual_cues:
          - id: reject-request
            phrase: "mandatory total is thirty-four"
            targets: [overflow-total]
            color: pink
      - say: >-
          Go back to the four-unit instructions and four-unit question. The same check now accepts them with room to spare. Apply it to the final serialized request and check the server's separate input and output caps.
        hold: 0.9
        visual_cues:
          - id: retry-request
            phrase: "four-unit instructions and four-unit question"
            targets: [retry-packet]
            color: pink
          - id: accept-request
            phrase: "check now accepts them"
            targets: [retry-total]
            color: pink
  - id: compaction
    title: "Would you sign this note?"
    visual: "A four-unit note and D1 agree on the decision and citation. The draft assigns approval to the requester. The archived approver is copied into the same field before the note can replace E2."
    beats:
      - say: >-
          Back to the two recent exchanges. We can give the older decision a short note of its own. Read this draft beside the archived entry. They both say the rollback was approved. The citation even points to the right version.
        hold: 0.55
        visual_cues:
          - id: draft-note
            phrase: "Read this draft"
            targets: [note-draft]
            color: yellow
      - say: >-
          The draft names an approver. Does the decision record give that person the same role?
        hold: 2.7
        visual_cues:
          - id: challenge
            phrase: "Does the decision record"
            targets: [draft-actor]
            color: yellow
      - say: >-
          The deploy owner requested it. The incident lead approved it. Someone reading the draft would credit the wrong person. A filled field and a valid source ID can still give you a false answer.
        caption_starts: ["The incident lead approved it"]
        hold: 1
        visual_cues:
          - id: check-role
            phrase: "incident lead approved it"
            targets: [actor-comparison]
            color: yellow
      - say: >-
          Copy the role on the approval line into the note. The corrected note now agrees with the source on the decision, the approving role and the version. Here we can compare fields directly. For a prose summary, check the meaning too, including omissions, contradictions and unsupported additions.
        caption_starts: ["The corrected note now agrees"]
        hold: 0.75
        visual_cues:
          - id: repair-actor
            phrase: "Copy the role on the approval line"
            targets: [corrected-actor]
            color: yellow
          - id: verified
            phrase: "now agrees with the source"
            targets: [checked-note]
            color: yellow
      - say: >-
          Give that four-unit note priority. Lift out the eight-unit middle exchange. The newest exchange stays intact. Put the note in the gap. With the answer reserve, we use twenty-six of thirty-two. The archive still holds the full record for a different question.
        caption_starts: ["Lift out the eight-unit middle exchange","Put the note in the gap","With the answer reserve"]
        hold: 1
        visual_cues:
          - id: remove-middle
            phrase: "Lift out the eight-unit middle exchange"
            targets: [middle-packet]
            color: yellow
          - id: insert-note
            phrase: "Put the note in the gap"
            targets: [packed-note]
            color: yellow
  - id: cost-length
    title: "What does one more position cost?"
    visual: "A causal triangle builds from query rows. Doubling both axes changes the prefill count. One more decode position adds only a new row while the earlier rows stay fixed."
    beats:
      - say: >-
          A note can fit and still be expensive to read. Each square is one query looking at one allowed key. During prompt ingestion, or prefill, draw one row per position. The first gets one key, the next gets two, and the tenth gets ten, including itself. That makes fifty-five pairs.
        hold: 0.75
        visual_cues:
          - id: prefill
            phrase: "draw one row per position"
            targets: [pair-grid]
            color: cyan
          - id: pair-count
            phrase: "That makes fifty-five pairs"
            targets: [prefill-count]
            color: cyan
      - say: >-
          Double the length to twenty positions. Both sides of the triangle grow. Now there are two hundred ten pairs. At long lengths, double the input and full attention has roughly four times the pairwise work. From four thousand ninety-six tokens to a hundred thirty-one thousand seventy-two, length grows thirty-two times. Its squared term grows about a thousandfold.
        hold: 0.75
        visual_cues:
          - id: double-length
            phrase: "Double the length to twenty positions"
            targets: [pair-grid]
            color: cyan
          - id: double-total
            phrase: "two hundred ten pairs"
            targets: [prefill-count]
            color: cyan
          - id: real-scale
            phrase: "length grows thirty-two times"
            targets: [length-scale]
            color: cyan
      - say: >-
          Keep those twenty keys and values in the cache. When we decode one more position, which rows of scores do we need to compute?
        hold: 2.2
        visual_cues:
          - id: cached-prefix
            phrase: "Keep those twenty keys and values"
            targets: [cached-rows]
            color: cyan
      - say: >-
          Add just the bottom row. Its new query scores twenty cached keys and its own key. Earlier queries have already done their work. FlashAttention can tile these calculations to reduce memory traffic. To turn pair counts into latency, we still have to measure the kernels and the rest of the model.
        caption_starts: ["Its new query scores twenty cached keys"]
        hold: 0.95
        visual_cues:
          - id: decode-row
            phrase: "Add just the bottom row"
            targets: [decode-row]
            color: cyan
  - id: cache-shape
    title: "How much cache follows one request?"
    visual: "A pair of bars represents separately retained keys and values. Additional requests multiply the payload. On the same byte scale, changing the number of KV heads expands both bars."
    beats:
      - say: >-
          Take a decoder with eighty full-attention layers. Each position needs both a key and a value. Each layer stores eight heads, a hundred twenty-eight numbers per head, in each array. Each number takes two bytes. Multiply by the number of positions. At a hundred thirty-one thousand seventy-two positions, one request holds forty gibibytes.
        hold: 0.8
        visual_cues:
          - id: axes
            phrase: "both a key and a value"
            targets: [cache-shape]
            color: cyan
          - id: one-total
            phrase: "one request holds forty gibibytes"
            targets: [cache-payload]
            color: cyan
      - say: >-
          Admit four independent requests at that length. Their caches now occupy a hundred sixty gibibytes. The same seventy billion two-byte weights take about a hundred thirty gibibytes. The cached state grows with each request and each new token. Add space for pages, metadata, temporary buffers and future tokens before deciding how many requests to admit.
        hold: 0.85
        visual_cues:
          - id: four-requests
            phrase: "Admit four independent requests"
            targets: [request-copies]
            color: cyan
          - id: four-total
            phrase: "occupy a hundred sixty gibibytes"
            targets: [cache-payload]
            color: cyan
      - say: >-
          Keep that comparison for one decode step. Each new query needs the retained keys and values for its own sequence. That's forty gibibytes of logical reads for one request, a hundred sixty for four. The batch could share a single read of the weights. Which traffic limits speed depends on the kernels, on-chip reuse, repeated loads and sharding. Measure it on the GPU.
        hold: 0.8
        visual_cues:
          - id: reads
            phrase: "one decode step"
            targets: [decode-reads]
            color: cyan
      - say: >-
          Go back to one request. Its sixty-four query heads shared eight sets of keys and values. That's grouped-query attention. Give every query head its own set, as in full multi-head attention. The cache grows eightfold to three hundred twenty gibibytes. A model that shares one set across every head uses multi-query attention. These shapes require compatible training or an evaluated conversion.
        hold: 1
        visual_cues:
          - id: one-request
            phrase: "Go back to one request"
            targets: [request-copies]
            color: cyan
          - id: many-heads
            phrase: "Give every query head its own set"
            targets: [head-count]
            color: cyan
          - id: many-total
            phrase: "three hundred twenty gibibytes"
            targets: [cache-payload]
            color: cyan
  - id: mixed-layers
    title: "Which positions does each layer keep?"
    visual: "Local cache occupancy stops at 1,024 positions. Full layers continue to 131,072. Distinct head shapes and observed eviction determine the byte calculation."
    beats:
      - say: >-
          Try a decoder with two kinds of layer. Forty local layers keep up to a thousand twenty-four positions apiece. They each have eight key-value heads of width two hundred fifty-six. The other eight layers use one head of width five hundred twelve. Watch the local layers fill. Now lengthen the prompt. The full layers keep growing to a hundred thirty-one thousand seventy-two positions.
        hold: 0.8
        visual_cues:
          - id: local-cap
            phrase: "Watch the local layers fill"
            targets: [local-cache]
            color: cyan
          - id: full-growth
            phrase: "Now lengthen the prompt"
            targets: [full-cache]
            color: cyan
      - say: >-
          Keep separate key and value arrays with two bytes per element. The local layers together need just under a third of a gibibyte. The full layers need two. Add their payloads. The sum is two point three one two five gibibytes. Assigning the local head shape and the full length to all forty-eight layers would give forty-eight gibibytes.
        hold: 0.8
        visual_cues:
          - id: layer-sum
            phrase: "two point three one two five gibibytes"
            targets: [layer-sum]
            color: cyan
      - say: >-
          The smaller estimate depends on evicting old local keys and values. Inspect the retained buffers. A mask can hide positions while storage stays allocated. A shared projection can also produce different key and value arrays after transformation. Multi-head latent attention stores a learned latent and positional-key state. Recurrent layers keep their own state. Count what each layer retains before dividing it across devices.
        hold: 0.95
        visual_cues:
          - id: inspect-buffers
            phrase: "Inspect the retained buffers"
            targets: [retention-check]
            color: cyan
  - id: local-visibility
    title: "Can the last query read the approval?"
    visual: "On a ten-position causal grid, query 9 loses its direct link to key 1 under a width-four mask. A three-layer route and a retained sink make two different connections visible."
    beats:
      - say: >-
          Return to ten positions. The approval is at key one. Query nine can read it directly under full causal attention. Give each query just four positions, including itself. Follow the last row. Which keys still connect to query nine?
        hold: 2.1
        visual_cues:
          - id: local-window
            phrase: "Give each query just four positions"
            targets: [window-band]
            color: cyan
      - say: >-
          Keys six through nine. The whole grid now has thirty-four pairs. Its rows grow from one to four and then stay four wide. At long lengths that costs roughly the length times the window width. Across three layers, a signal could travel from key one to position three, then six, then nine. A global layer offers a direct path. Whether the model retains the detail along a longer path takes a recall test.
        hold: 0.85
        visual_cues:
          - id: direct-answer
            phrase: "Keys six through nine"
            targets: [direct-keys]
            color: yellow
          - id: stacked-path
            phrase: "Across three layers"
            targets: [indirect-route]
            color: cyan
      - say: >-
          For code near the cursor, nearby tokens may supply what you need. For the rollback, the only signed approval might be far away. In StreamingLLM's experiments, keeping a few initial entries helped stabilize long generation. Keep position zero alongside this window. The sink is visible to the last query. The approval at position one is still outside its direct reach.
        hold: 0.9
        visual_cues:
          - id: sink
            phrase: "Keep position zero alongside this window"
            targets: [sink-and-window]
            color: cyan
  - id: position-dials
    title: "How does stretching the range change a rotation?"
    visual: "Three paired rotary dimensions show fast, medium and slow angular steps. The coordinate is compressed uniformly, then the frequency bands change separately."
    beats:
      - say: >-
          Both hands start at position one. Move the blue query one token ahead. On the fast dial it's now one radian from the yellow key. On the slow dial the hands barely separate. Each dial represents a pair of dimensions in a query or key head. Rotary position embeddings, or RoPE, rotate each pair by position times frequency. The gap carries the distance between tokens into attention.
        caption_starts: ["Move the blue query one token ahead", "On the fast dial", "Each dial represents"]
        hold: 0.8
        visual_cues:
          - id: position-dials-0
            phrase: "Move the blue query one token ahead"
            targets: [rotary-dials]
            color: cyan
      - say: >-
          To fit eight times the training range into the same coordinates, divide each position by eight. On the fast dial, our neighbors are now just an eighth of a radian apart. The slow dial shrinks by the same factor. Farther out, position sixteen thousand three hundred eighty-four maps to two thousand forty-eight.
        caption_starts: ["On the fast dial", "Farther out"]
        hold: 0.8
        visual_cues:
          - id: compress
            phrase: "divide each position by eight"
            targets: [rotary-dials]
            color: cyan
          - id: mapped
            phrase: "maps to two thousand forty-eight"
            targets: [mapped-coordinate]
            color: cyan
      - say: >-
          NTK-aware scaling stretches the slow frequencies more than the fast ones. Watch how YaRN treats the bands. The fast dial gets its full step back, so neighbors are a radian apart again. The slow dial keeps the smaller step for long distances. The middle blends the two. YaRN also scales attention scores before softmax. The sampler's temperature acts later, when choosing an output token. Before raising the server's limit, test recall and loss across the longer range.
        caption_starts: ["The fast dial gets its full step back", "YaRN also scales attention scores"]
        hold: 0.9
        visual_cues:
          - id: position-dials-2
            phrase: "The fast dial gets its full step back"
            targets: [frequency-bands]
            color: cyan
  - id: basis-consistency
    title: "Can we reuse this rotated key?"
    visual: "Two unit vectors initially align despite their different positions. The blue query stays pinned while the key turns. The score appears when the viewer has seen the new angle."
    beats:
      - say: >-
          A key was cached at position one with a frequency of one radian per position. It points at one radian. Now the frequency changes to a half. Our query is at position two, so it also points at one radian. The two unit vectors line up. Their dot product is one. Would a fresh computation on the new basis give the same score?
        hold: 2.1
        visual_cues:
          - id: basis-consistency-0
            phrase: "key was cached"
            targets: [stale-key]
            color: yellow
      - say: >-
          Leave the blue query where it is. Rotate the cached key onto the new basis. The key belongs at half a radian. The gap is half a radian, so the fresh dot product is its cosine, about point eight seven eight. Mixing the two bases produced that perfect alignment.
        caption_starts: ["Rotate the cached key", "The key belongs at half a radian", "about point eight seven eight"]
        hold: 0.8
        visual_cues:
          - id: basis-consistency-1
            phrase: "Rotate the cached key"
            targets: [corrected-angle]
            color: cyan
          - id: fresh-score
            phrase: "about point eight seven eight"
            targets: [fresh-score]
            color: cyan
      - say: >-
          A backend might freeze its basis for this request or retain unrotated keys so it can apply the intended rotation. Compare cached and uncached scores on the same input across the length boundary. If the cache uses an incompatible position configuration, invalidate it before reuse.
        hold: 1
        visual_cues:
          - id: basis-consistency-2
            phrase: "Compare cached and uncached scores"
            targets: [cache-check]
            color: cyan
  - id: cache-execution
    title: "What changes when the cache changes?"
    visual: "A common 64 GiB scale compares two discrete payload formats. An empty page takes a new owner. Reused prefixes and new suffixes stay attached to the three requests that read them."
    beats:
      - say: >-
          With sixty-four gibibytes for cache, one forty-gibibyte request fits. On a backend with eight-bit floating-point cache, each element takes one byte and each payload drops to twenty gibibytes. Three payloads use sixty. That leaves four gibibytes for scale metadata, page overhead and more tokens. Check that headroom, calibrate the scales and test answer quality at the lengths you'll serve.
        caption_starts: ["Three payloads use sixty", "That leaves four gibibytes"]
        hold: 0.8
        visual_cues:
          - id: precision
            phrase: "each payload drops to twenty gibibytes"
            targets: [cache-format]
            color: cyan
      - say: >-
          Sometimes the bytes are there but the free slots are scattered. Give the new request those free pages as it grows. PagedAttention lets its logical sequence occupy separate physical blocks. That reduces allocation waste. Each retained position still takes the same bytes.
        hold: 0.65
        visual_cues:
          - id: page-map
            phrase: "free slots are scattered"
            targets: [page-map]
            color: cyan
          - id: allocate-pages
            phrase: "those free pages"
            targets: [page-owners]
            color: cyan
      - say: >-
          Now three requests share an exact forty-eight-thousand-token prefix. Their different suffixes are on the right. With cold caches we prefill one hundred forty-six thousand six hundred tokens across the requests. Retain the prefix after the first request. The next two process only their suffixes as new input. That brings new prefill work down to fifty thousand six hundred tokens.
        hold: 0.8
        visual_cues:
          - id: prefixes
            phrase: "three requests share an exact"
            targets: [three-prefixes]
            color: cyan
          - id: cold-count
            phrase: "prefill one hundred forty-six thousand six hundred tokens"
            targets: [cold-prefill]
            color: cyan
          - id: reuse
            phrase: "Retain the prefix after the first request"
            targets: [reused-blocks]
            color: cyan
          - id: reuse-count
            phrase: "down to fifty thousand six hundred tokens"
            targets: [new-prefill]
            color: cyan
      - say: >-
          The prefix still occupies context in all three requests, and decode still reads it. Edit an early token in the third request. Later blocks lose their match too. Reuse also depends on cache identity, isolation, adapter state and eviction. Keep durable records separately. Chunked prefill tackles scheduling. It lets ongoing decodes run between pieces of a long prompt and can change time to first token.
        hold: 0.85
        visual_cues:
          - id: decode-reads
            phrase: "decode still reads it"
            targets: [logical-prefix]
            color: cyan
          - id: edited-prefix
            phrase: "Edit an early token"
            targets: [invalid-blocks]
            color: cyan
  - id: distributed-context
    title: "How does a query reach another device’s keys?"
    visual: "Query blocks stay with four owners as key/value blocks circulate. A separate serving example groups four physical pages per logical block and rounds a 1,025-token history."
    beats:
      - say: >-
          Suppose one sequence spans four devices. The queries belong to different ranks. A query doing global attention still needs keys and values held elsewhere. Keep each query where it is and circulate the key and value blocks. Ring Attention overlaps this exchange with blockwise computation in distributed training. Communication still takes time.
        hold: 0.85
        visual_cues:
          - id: distributed-context-0
            phrase: "circulate the key and value blocks"
            targets: [ring-blocks]
            color: cyan
      - say: >-
          For serving, a compatible decode backend can shard the history among existing tensor-parallel ranks. It may communicate differently from a training ring. Head replication, layout and backend support affect each device's share. Measure prefill and decode independently.
        hold: 0.85
        visual_cues:
          - id: distributed-context-1
            phrase: "shard the history"
            targets: [decode-shards]
            color: cyan
      - say: >-
          Take four physical groups of sixteen positions. Together they make one logical block of sixty-four. A history of a thousand twenty-five tokens fills sixteen logical blocks, then needs one more slot. The seventeenth block rounds capacity up to a thousand eighty-eight. Rounding in groups of sixteen would give a thousand forty. Check the backend's actual logical block size before making that reservation.
        hold: 1
        visual_cues:
          - id: distributed-context-2
            phrase: "four physical groups of sixteen positions"
            targets: [physical-groups]
            color: cyan
          - id: block-round
            phrase: "seventeenth block rounds capacity up to a thousand eighty-eight"
            targets: [rounded-blocks]
            color: cyan
  - id: placement
    title: "Can this reader reach the same fact?"
    visual: "The same pair of token IDs moves through an 18-position document with fixed edge read regions and output headroom. Each result comes from executing both searches."
    beats:
      - say: >-
          Here the whole document fits. A full scan can inspect all eighteen positions. Give a second reader just four positions at each end. At the head, the two gold tokens land inside its first four. Both readers find the pair.
        hold: 0.75
        visual_cues:
          - id: edges
            phrase: "four positions at each end"
            targets: [edge-range]
            color: blue
          - id: head-result
            phrase: "Both readers find the pair"
            targets: [head-result]
            color: blue
      - say: >-
          Move those same tokens halfway through the filler. Eight filler tokens now precede the pair and eight follow it. The length and the answer allowance stay fixed. Which reader can find both gold tokens here?
        hold: 2.6
        visual_cues:
          - id: middle-position
            phrase: "Move those same tokens halfway"
            targets: [needle]
            color: blue
      - say: >-
          Only the full scan finds them here. The edge reader never examines the middle positions. Slide the pair to the tail. Both readers find it there. We programmed these two searches to check our test harness.
        caption_starts: ["Slide the pair to the tail","Both readers find it there"]
        hold: 0.85
        visual_cues:
          - id: middle-result
            phrase: "Only the full scan finds them here"
            targets: [middle-result]
            color: blue
          - id: tail-position
            phrase: "Slide the pair to the tail"
            targets: [needle]
            color: blue
          - id: tail-result
            phrase: "Both readers find it there"
            targets: [tail-result]
            color: blue
      - say: >-
          For a model, run the same question at each depth and score its actual answer. Vary the length, distractors and combinations of facts. Include a case where the fact is absent. If the middle repeatedly fails, try the needed excerpt near an edge and rerun the paired cases.
        hold: 0.85
        visual_cues:
          - id: model-test
            phrase: "score its actual answer"
            targets: [placement-comparison]
            color: blue
  - id: exact-counts
    title: "Which service had the most March timeouts?"
    visual: "A ranked prefix and a scan of all seven rows update the same two counters. The third B event breaks the tie while the two excluded records stay visible."
    beats:
      - say: >-
          Suppose the team asks for a count instead. Which service had the most March timeouts? The retrieval system returns its two highest-ranked March timeouts. Both belong to A. Can we already tell the team who won?
        hold: 2.3
        visual_cues:
          - id: rank-two
            phrase: "two highest-ranked March timeouts"
            targets: [ranked-rows]
            color: green
      - say: >-
          Two is A's count in the returned rows. Three more March timeouts never reached that prompt. Count the rest of the matches. The first two bring B level with A. The next one puts B ahead.
        caption_starts: ["The first two bring B level with A","The next one puts B ahead"]
        hold: 0.9
        visual_cues:
          - id: show-scope
            phrase: "in the returned rows"
            targets: [partial-count]
            color: green
          - id: tie
            phrase: "first two bring B level with A"
            targets: [next-rows]
            color: green
          - id: winner
            phrase: "next one puts B ahead"
            targets: [last-match]
            color: green
      - say: >-
          Check the last two records as well. One timeout happened in February. The March success has the wrong event type. With every row accounted for, B wins three to two. Send the counts and the source IDs for the model to explain.
        hold: 0.8
        visual_cues:
          - id: exclude-rows
            phrase: "Check the last two records"
            targets: [excluded-rows]
            color: green
          - id: complete-count
            phrase: "B wins three to two"
            targets: [count-receipt]
            color: green
      - say: >-
          For live data, define an event, deduplicate it, set the month boundaries and record how current the data is. Raising the retrieval limit might find more matches. An exact count needs every qualifying event.
        hold: 0.85
        visual_cues:
          - id: provenance
            phrase: "every qualifying event"
            targets: [count-receipt]
            color: green
  - id: evidence-route
    title: "Which sources reach the answer?"
    visual: "D1 appears in the full packet and can disappear from retrieved candidates. Chunk aggregation has to preserve its identity before the final model can cite it."
    beats:
      - say: >-
          For a short, stable incident packet, read all four records together as a baseline. The model can compare the sources directly. The model has to process every token and may still miss evidence in the middle.
        hold: 0.8
        visual_cues:
          - id: full-route
            phrase: "all four records together"
            targets: [full-packet]
            color: cyan
      - say: >-
          For a lookup in a changing archive, retrieve a few candidates first. Here's a search that returned the deploy note and runbook. Where is the signed decision?
        caption_starts: ["Here's a search", "Where is the signed decision"]
        hold: 2.2
        visual_cues:
          - id: lookup-route
            phrase: "retrieve a few candidates"
            targets: [retrieved-set]
            color: cyan
      - say: >-
          D one is still in the archive. Retrieve the decision by its source ID and verify the version. Now the assistant can cite the signed line. Retrieval adds a search step. With either route, keep the citation with the current version.
        caption_starts: ["Retrieve the decision by its source ID", "Now the assistant can cite the signed line"]
        hold: 0.8
        visual_cues:
          - id: missed-source
            phrase: "D one is still in the archive"
            targets: [missing-source]
            color: yellow
          - id: recover-source
            phrase: "Retrieve the decision by its source ID"
            targets: [recovered-source]
            color: yellow
      - say: >-
          If the answer needs relationships across a larger packet, combine the evidence from its chunks. Carry D one's decision and its source through the merge. Check that the combined result preserves the required facts. Treat retrieved text as evidence and keep instructions separate. Duplicating an excerpt uses tokens and can repeat a stale claim. Test any change in placement on paired cases.
        hold: 0.8
        visual_cues:
          - id: chunk-route
            phrase: "combine the evidence from its chunks"
            targets: [chunk-inputs]
            color: cyan
          - id: merge-chunks
            phrase: "through the merge"
            targets: [chunk-output]
            color: cyan
      - say: >-
          For the March tally, the decisive property was completeness. An exact aggregate can carry a whole population's counts into a small request. For a signed decision, one verified excerpt may be enough.
        hold: 0.85
        visual_cues:
          - id: aggregate-route
            phrase: "An exact aggregate"
            targets: [aggregate-receipt]
            color: cyan
  - id: release-slices
    title: "Which run clears the depth requirement?"
    visual: "A length-by-depth test grid gives way to paired synthetic results. Both overall means are visible before the per-depth rates and the binding 85 percent floor are compared."
    beats:
      - say: >-
          Hide the same known fact at different depths. Repeat at each packed length with fresh distractors and space for the reply. Save the source, expected answer, generated answer and score. Include cases with no fact. Our earlier edge reader checked the harness. A release needs actual model answers.
        hold: 0.8
        visual_cues:
          - id: release-slices-0
            phrase: "different depths"
            targets: [length-depth-grid]
            color: cyan
      - say: >-
          Add linked facts, multi-hop questions and aggregates, as RULER does. Plot next-token loss by length and look for a jump beyond the training range. A length problem can occur even when every depth behaves alike. Measure first-token delay, decode latency, peak memory and concurrency on the serving path.
        hold: 0.8
        visual_cues:
          - id: release-slices-1
            phrase: "Add linked facts"
            targets: [linked-facts]
            color: cyan
      - say: >-
          Consider two hypothetical runs with a hundred cases at each depth. Both get ninety percent overall. Before either run, we set a floor of eighty-five percent at every depth. Open the depth scores. Which run clears the floor?
        hold: 2.5
        visual_cues:
          - id: means
            phrase: "two hypothetical runs"
            targets: [overall-scores]
            color: cyan
          - id: floor
            phrase: "floor of eighty-five percent"
            targets: [depth-floor]
            color: cyan
          - id: depths
            phrase: "Open the depth scores"
            targets: [slice-scores]
            color: cyan
      - say: >-
          The baseline clears it. The candidate gets perfect scores at the edges, but only seventy of a hundred in the middle. Hold that release. For a real decision, retain the paired outcomes, inspect scorer mistakes and report sample sizes and uncertainty for each required slice.
        hold: 1
        visual_cues:
          - id: depth-verdict
            phrase: "only seventy of a hundred in the middle"
            targets: [failed-depth]
            color: cyan
  - id: synthesis
    title: "Which request supports the handoff?"
    visual: "Two feasible 32-unit requests stay aligned. Identical questions expose different evidence. The actor and source can be read back from only one packed request."
    beats:
      - say: >-
          Bring the two rollback requests back side by side. Both fit under thirty-two with the same reply reserve. One kept the two newest exchanges. The other kept the latest exchange and a checked note. Which request can the next shift cite for the approver?
        hold: 2.45
        visual_cues:
          - id: compare-input
            phrase: "two newest exchanges"
            targets: [paired-requests]
            color: yellow
      - say: >-
          Read the recent messages first. One person asked for the rollback and another reported it complete. Neither message names the approver. Read the note in the smaller request. It gives the incident lead and the decision record, D one, version three.
        caption_starts: ["Neither message names the approver","It gives the incident lead"]
        hold: 1
        visual_cues:
          - id: recent-answer
            phrase: "Neither message names the approver"
            targets: [recent-answer]
            color: yellow
          - id: cited-answer
            phrase: "decision record, D one, version three"
            targets: [cited-answer]
            color: yellow
      - say: >-
          We can verify that answer against the archive. To learn whether the model actually uses the note, score the role it gives and the source it cites as we change the placement. That gives us separate checks on what fits, which facts survived, and which facts the model used.
        hold: 0.9
        visual_cues:
          - id: audit-answer
            phrase: "score the role it gives and the source it cites"
            targets: [use-check]
            color: yellow
  - id: your-turn
    title: "What should the next shift receive?"
    visual: "On a fresh 40-unit budget, a question changes from who to why. A six-unit note and a nine-unit excerpt from the same version compete. Replacing the note admits the documented reason with the reply reserve intact."
    beats:
      - say: >-
          Try a fresh forty-unit request. Reserve twelve for the reply. The rules take six and the question takes two. How much room does that leave for optional input?
