      - say: "One hundred twelve."
        hold: 0.7
        visual_cues:
          - id: full
            phrase: "One hundred twelve"
            targets:
              - picture
      - say: "Now count just the private pages. Suppose each guest adds fifty mebibytes. Convert the same pool to mebibytes, divide by fifty and round down. Four thousand five hundred eighty-seven private footprints fit. Per-guest overhead and extra headroom reduce the number the host can admit."
        hold: 0.7
        caption_starts: ["Four thousand five hundred eighty-seven"]
        visual_cues:
          - {id: fifty, phrase: "each guest adds fifty mebibytes", targets: [picture]}
          - id: private
            phrase: "Four thousand five hundred eighty-seven private footprints fit"
            targets:
              - picture
      - say: "Now count runnable jobs on a host with one hundred twenty-eight cores. Thirty sessions per core gives three thousand eight hundred forty sessions. At three percent average duty, they need one hundred fifteen point two cores on average. If all sessions wake together, run one per core. One hundred twenty-eight run. Three thousand seven hundred twelve wait in the queue."
        hold: 2.2
        caption_starts: ["three thousand eight hundred forty sessions", "one hundred fifteen point two cores on average", "One hundred twenty-eight run", "Three thousand seven hundred twelve wait in the queue"]
        visual_cues:
