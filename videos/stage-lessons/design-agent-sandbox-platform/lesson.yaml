          - {id: load, phrase: "At seven milliseconds the snapshot has loaded", targets: [picture]}
      - say: "The supervisor finishes its readiness checks at sixteen milliseconds. The first user instruction starts at seventeen. Compare that with the fifteen-millisecond target. This request took two milliseconds longer. If we had stopped at snapshot load, we would have missed ten milliseconds of startup."
