  - id: group-budget
    title: Spend one shared CPU allowance across threads
    visual: Two VMM threads subtract their CPU time from one group-owned period budget while guest process limits
      remain separate.
    beats:
      - say: "Put the VMM and its tasks in the same host cgroup. For fair-class scheduling, CPU max sets a CPU-time quota and a period, both in microseconds. All the threads in that group spend the same allowance."
        hold: 0.7
        visual_cues:
          - id: shared
            phrase: "All the threads in that group spend the same allowance"
            targets:
              - picture
      - say: At the article setting of one hundred thousand over one hundred thousand, one thread spending sixty
          thousand leaves forty thousand for the group in that period. Quota divided by period gives the mean
          core-equivalent allowance. Scheduling and the chosen period still affect bursts and latency.
        hold: 0.7
        visual_cues:
          - id: setting
            phrase: At the article setting of one hundred thousand over one hundred thousand
            targets:
              - picture
          - id: spend
            phrase: one thread spending sixty thousand leaves forty thousand for the group in that period
            targets:
              - picture
      - say: "Set memory max to cover the guest footprint and VMM overhead. Monitor memory events and decide how to handle an out-of-memory condition. The host limits the number of host tasks. The guest limits its own processes. Set budgets for disk, output and network use as well."
        hold: 0.7
        visual_cues:
          - id: memory
            phrase: "Set memory max to cover the guest footprint and VMM overhead"
            targets:
              - picture
  - id: readonly-data
    title: Read shared data while accounting for its working set
    visual: A revision-bound read-only model image feeds clean pages to two guests; separate collector writes
      allocate private pages.
    beats:
      - say: To read a fifty-gibibyte model without copying it into scratch, use an authorized read-only virtual block
          device backed by a managed image. Bind its revision and access policy to the instance. A
          filesystem-sharing feature needs explicit VMM and guest support.
        hold: 0.7
        visual_cues:
          - id: read
            phrase: use an authorized read-only virtual block device backed by a managed image
            targets:
              - picture
      - say: "Concurrent cold readers can fault together. The host has to fetch those pages and keep the active ones in its page cache. Measure that working set and the I O burst when deciding how many guests to admit."
        hold: 0.7
        visual_cues:
          - id: fault
            phrase: Concurrent cold readers can fault together
            targets:
              - picture
      - say: "A garbage collector writes marks, reference counts and other heap metadata. Those writes can give the guest private pages even when the user’s model weights stay the same. Track the clean pages that reads bring in and the private pages that writes create."
        hold: 0.7
        visual_cues:
          - id: dirty
            phrase: "Those writes can give the guest private pages"
            targets:
