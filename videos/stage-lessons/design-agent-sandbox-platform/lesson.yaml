  - id: state-machine
    title: "Try to dispose of A’s scratch"
    visual: "The article’s Python calls run against A/generation 1. The cancellation, mismatched notice and matching notice leave different evidence beside the same page and file."
    beats:
      - say: "Run the article’s small Python model. A and B each start restored. Supply all five observations and each clone becomes ready. Now we can start them. A can read or write only while running and only at an integer index inside the base. The model rejects negative indices."
        hold: 0.6
        visual_cues:
          - {id: admit, phrase: "each clone becomes ready", targets: [picture]}
          - {id: start, phrase: "Now we can start them", targets: [picture]}
      - say: "A writes ninety-nine at index one and saves a row in output dot C S V. B still reads twenty. Now A requests cancellation. Try to dispose of A’s resources at this point."
        hold: 1.75
        visual_cues:
          - {id: write, phrase: "saves a row in output dot C S V", targets: [picture]}
          - {id: cancel, phrase: "A requests cancellation", targets: [picture]}
          - {id: try, phrase: "Try to dispose of A’s resources", targets: [picture]}
      - say: "Python raises execution retirement required. The page and file are still there. Send a retirement notice for A, generation two. The owner beside those resources is A, generation one. The model rejects the mismatch."
        hold: 0.75
        visual_cues:
          - {id: fail, phrase: "Python raises execution retirement required", targets: [picture], caption_boundary: true}
          - {id: wrong, phrase: "Send a retirement notice for A, generation two", targets: [picture]}
          - {id: reject, phrase: "The model rejects the mismatch", targets: [picture], caption_boundary: true}
      - say: "Change only the notice to generation one. A has requested cancellation, and both parts of its identity now match. The model accepts the confirmation. Dispose now, and A’s private page and scratch file clear. B still reads twenty. In Python we supplied the retirement fact ourselves. Who establishes it on a real host?"
        hold: 0.7
        visual_cues:
          - {id: right, phrase: "Change only the notice to generation one", targets: [picture]}
          - {id: retired, phrase: "The model accepts the confirmation", targets: [picture], caption_boundary: true}
          - {id: dispose, phrase: "A’s private page and scratch file clear", targets: [picture]}
  - id: retirement
    title: "Who still has A’s disk open?"
    visual: "A replay of the opening separates cancellation, execution retirement and the exporter’s last access to A’s scratch backing."
    beats:
      - say: "Return to the exporter from the opening. The controller has asked generation four to stop. A cancellation reply records the request. Its owner record still covers the process tree, private memory, scratch, network and credentials."
        hold: 0.65
        visual_cues:
          - {id: request, phrase: "asked generation four to stop", targets: [picture]}
      - say: "The host verifies that this generation’s execution has stopped. Look at the line to the scratch disk. The exporter still holds it open. If the controller loses its heartbeat now, its replacement must reconcile these resources under the same owner."
        hold: 0.7
        visual_cues:
          - {id: stop, phrase: "this generation’s execution has stopped", targets: [picture]}
          - {id: reader, phrase: "The exporter still holds it open", targets: [picture]}
      - say: "The exporter finishes and closes its reader. Once the other references are closed, the network is detached and the capabilities are revoked, the host can dispose of the private backing. The next tenant gets fresh scratch. An authorized export can have a different lifetime from its source."
        hold: 0.8
        visual_cues:
          - {id: close, phrase: "closes its reader", targets: [picture]}
          - {id: dispose, phrase: "dispose of the private backing", targets: [picture]}
          - {id: fresh, phrase: "The next tenant gets fresh scratch", targets: [picture]}
  - id: reference-retirement
    title: Who holds the virtual machine?
    visual: Two host processes hold descriptors for one VM. The creator exits and its edge disappears. Its helper still holds a duplicate descriptor.
    beats:
      - say: "A host can finish the export and still have another resource to track. Two processes have handles to one virtual machine. On the left is the process that created it. On the right, a host helper holds a duplicate file descriptor. The creator exits. Follow the remaining line. The helper’s handle keeps the VM allocated."
        hold: 0.8
        visual_cues:
          - {id: duplicate, phrase: "a host helper holds a duplicate file descriptor", targets: [picture]}
          - {id: creator, phrase: "The creator exits", targets: [picture]}
      - say: "On Linux, the host can use cgroup kill to stop a process tree in a non-root cgroup it owns, provided that group has a valid domain configuration. In a threaded cgroup, the kernel reports that the operation is unsupported. Verify which processes actually exited. A process number can already belong to somebody else."
        hold: 0.7
        visual_cues:
          - {id: threaded, phrase: "the kernel reports that the operation is unsupported", targets: [picture]}
      - say: "If the controller loses the reply, the slot stays with A while its replacement checks the open references. In this case execution has stopped, access is revoked and the other resources have been retired. The host verifies that the helper closed the last VM descriptor. Now the host can reclaim this VM’s resources."
        hold: 0.8
        visual_cues:
          - {id: uncertain, phrase: "If the controller loses the reply", targets: [picture]}
          - {id: close, phrase: "the helper closed the last VM descriptor", targets: [picture]}
  - id: reconciliation-table
    title: Choose recovery from the observed failure
    visual: Each concrete failed resource retains ownership until its own observation and recovery complete.
    beats:
      - say: A missing controller heartbeat can coexist with a running VMM. Reconcile the durable tenant and
          generation against host processes, cgroups, sockets, volumes and network objects, then adopt or stop
          that same owner. A second controller must not merely declare its predecessor gone.
        hold: 0.7
        visual_cues:
          - id: inventory
            phrase: Reconcile the durable tenant and generation against host processes, cgroups, sockets, volumes and
              network objects
            targets:
              - picture
      - say: For runaway processes inspect guest limits, CPU and output growth. For private-memory growth inspect
          resident pages, memory events and guest OOM state, stop admission and preserve host reserve. For a
          stalled handler inspect fault progress and storage errors. Retire the affected execution before
          reclaiming.
        hold: 0.7
        visual_cues:
          - id: process
            phrase: For runaway processes inspect guest limits, CPU and output growth
            targets:
              - picture
          - id: memory
            phrase: For private-memory growth inspect resident pages, memory events and guest OOM state
            targets:
              - picture
          - id: handler
            phrase: For a stalled handler inspect fault progress and storage errors
            targets:
              - picture
      - say: For credential abuse inspect caller, capability, operation, resource and upstream result, deny
          unauthorized work and revoke affected authority. Incomplete cleanup quarantines resources until
          process, descriptor, mount and network checks establish disposal. Fault-inject crashes, delayed
          cleanup, duplicate events, cold pages and cross-tenant probes in the deployed runtime.
        hold: 0.7
        visual_cues:
          - id: credential
            phrase: For credential abuse inspect caller, capability, operation, resource and upstream result
            targets:
              - picture
          - id: quarantine
            phrase: Incomplete cleanup quarantines resources
            targets:
              - picture
  - id: endpoint-clock
    title: "Time one sandbox start"
    visual: "A single cursor follows an accepted request. The load mark stays at 7 ms while the clock passes the 15 ms target and reaches the first user instruction at 17 ms."
