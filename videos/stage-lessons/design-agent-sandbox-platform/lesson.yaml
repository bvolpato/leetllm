  - id: bounded-ack
    title: "Where does the acknowledgement end?"
    visual: "The cursor stops on the newline in two local streams. The same unread payload follows each. Only the port changes, from the included lower bound to the excluded upper bound."
    beats:
      - say: "The host is waiting for one line. These bytes could arrive together. The reader asks for one byte at a time. Watch it stop at the newline after the port. The bytes spelling payload still belong to the application."
        hold: 0.75
        visual_cues:
          - {id: read, phrase: "one byte at a time", targets: [picture]}
          - {id: stop, phrase: "stop at the newline", targets: [picture]}
      - say: "Replay that read with a slow first fragment. The reader allows sixty-four bytes and two seconds for the whole line. Suppose the O and K arrive one and a half seconds in. The next read gets half a second. An early end of stream, too many bytes or an expired deadline fails the handshake."
        hold: 0.7
        visual_cues:
          - {id: replay, phrase: "Replay that read", targets: [picture]}
          - {id: limits, phrase: "two seconds for the whole line", targets: [picture]}
          - {id: elapsed, phrase: "one and a half seconds in", targets: [picture]}
          - {id: left, phrase: "The next read gets half a second", targets: [picture], caption_boundary: true}
      - say: "The complete line must say OK, a space and decimal digits before the newline. Our first port is exactly the lower bound. The reader returns that port and leaves the payload unread."
        hold: 0.7
        visual_cues:
          - {id: first, phrase: "The reader returns that port", targets: [picture], caption_boundary: true}
          - {id: complete, phrase: "The complete line", targets: [picture]}
      - say: "Change just the port to the upper bound. The delimiter and payload are in the same places. Can this stream carry the next command?"
        hold: 1.9
        visual_cues:
          - {id: upper, phrase: "Change just the port to the upper bound", targets: [picture]}
          - {id: ask, phrase: "Can this stream carry the next command", targets: [picture]}
      - say: "Reject the acknowledgement. The upper bound is excluded. The reader stopped at the newline in both cases. Only the first handshake passed. A passing handshake still needs a generation-bound session, bounded commands and responses, backpressure, cancellation and a separate application timeout."
        hold: 0.75
        visual_cues:
          - {id: reject, phrase: "Reject the acknowledgement", targets: [picture], caption_boundary: true}
  - id: capacity
    title: Dirty memory and synchronized bursts bound the pool
    visual: A fixed 224 GiB pool supports a current grid of memory-planning slots as dirty footprint grows. A
      separate CPU burst fixture admits at most 128 active jobs and puts the exact remaining arrivals into a
      visible queue, retaining the mean duty-cycle calculation as a labeled reference.
    beats:
      - say: "Watch the two bars. The host sets memory aside for itself and the shared image. As each job writes more private pages, fewer jobs fit in the remaining memory. Include page tables, VMM overhead, caches and headroom when you size that pool."
        hold: 0.65
        visual_cues:
          - id: dirty
            phrase: "As each job writes more private pages"
            targets:
              - picture
      - say: "Now look at the cores and the queue below. Many mostly idle sessions can wake together. Once the cores fill, the rest wait. Protect the host reserve with admission and per-job limits. Measure tail startup and execution latency at that burst load."
        hold: 0.65
        visual_cues:
          - id: wake
            phrase: Many mostly idle sessions can wake together
            targets:
              - picture
          - id: admission
            phrase: "Protect the host reserve"
            targets:
              - picture
  - id: capacity-arithmetic
    title: Compute memory slots and the synchronized queue
    visual: A fixed scale compares 112 full footprints with 4,587 private footprints in the same 224 GiB pool.
      A separate example shows 128 running sessions and 3,712 waiting sessions.
    beats:
      - say: "Start with two hundred fifty-six gibibytes. Set aside thirty-two for the host and shared data. That leaves two hundred twenty-four. If each guest takes two gibibytes, how many fit?"
