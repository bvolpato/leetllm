  - id: puct-allocation
    title: Which branch gets the next visit?
    visual: Compare two feasible repair branches by stacking a visit bonus on each value estimate. Back up a
      successful rollout, then replay the same visit with value zero. Only the attraction of A changes between
      the replays.
    beats:
      - say: Suppose we can afford one more visit to a repair branch. In this small search example, A and B are both
          feasible and each has an estimated value of one half. The parent has sixteen visits. Each of these two
          children has one. The prior is the model's preference before seeing the rollout. A has the higher
          prior. When the values and visit counts tie, this rule gives the higher prior a bigger exploration
          bonus. Which branch gets the next visit?
        hold: 1.9
        visual_cues:
          - id: puct-input
            phrase: each has an estimated value of one half
            targets:
              - puct-plot
            linger: 0.15
          - id: puct-priors
            phrase: A has the higher prior
            targets:
              - puct-plot
            linger: 0.15
      - say: Give each branch a bonus for exploration. Multiply its prior by the square root of the parent's visits,
          then divide by one plus that child's visits. Here the exploration constant is one. For A that's point
          two times four divided by two. Add the bonus to its half and A reaches point nine. B reaches point
          eight. Visit A. This selection rule is called PUCT. At an unvisited parent the bonus is zero, so ties
          need a starting rule.
        hold: 0.8
        caption_starts:
          - A reaches point nine
        visual_cues:
          - id: puct-bonus
            phrase: For A that's point two times four divided by two
            targets:
              - puct-plot
            linger: 0.15
          - id: puct-initial
            phrase: B reaches point eight
            targets:
              - puct-plot
            linger: 0.15
            caption_boundary: true
          - id: puct-visit
            phrase: Visit A
            targets:
              - puct-plot
            linger: 0.15
            caption_boundary: true
