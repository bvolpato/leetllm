          value. Each has one vector per KV head at every layer. Multiply by the head width and by the bytes in
          one element. Use the number of KV heads here. A grouped-query model can have more query heads. Our
          example has eighty layers, eight KV heads, a width of one hundred twenty-eight and two bytes per
          element. The product on screen is the storage for one token."
