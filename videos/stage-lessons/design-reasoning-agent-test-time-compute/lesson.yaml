      - say: Watch the rare value disappear from the cache. A later step may need the information that page held. In the
          VaSE experiments, evicting rare, large-magnitude values sometimes sent a model back through the same
          failed proposal. VaSE protects those values and samples others for eviction. To recover an evicted state
          from saved text, the model has to compute it again. At your target compression ratio, compare repeated
          loops, exact checks and final quality with the uncompressed run.
