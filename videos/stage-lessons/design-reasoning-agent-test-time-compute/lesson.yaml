scenes:
  - id: intro
    title: The checkout canary
    visual: A 240 ms metrics receipt slides beside the live checkout rollout. Compare their revision numbers,
      fetch a matching receipt, then place its latency on the release policy ruler.
    beats:
      - say: Would you use this reading for revision seven? It serves one checkout request in ten. Its smoke test
          passed. The receipt says two hundred forty milliseconds at the ninety-fifth percentile. Compare the
          revisions. Which call would help?
        hold: 2.2
        visual_cues:
          - id: intro-smoke
            phrase: Its smoke test passed
            targets:
              - traffic
            color: cyan
            linger: 0.15
          - id: intro-meter
            phrase: two hundred forty milliseconds
            targets:
              - receipt
            color: cyan
            linger: 0.15
          - id: intro-revision
            phrase: Compare the revisions
            targets:
              - traffic
              - receipt
            color: cyan
            linger: 0.15
      - say: Ask the metrics tool for revision seven. The first receipt belongs to six. The new receipt says
          revision seven. Same latency, now for the right rollout.
        hold: 0.75
        visual_cues:
          - id: intro-request
            phrase: Ask the metrics tool
            targets:
              - receipt
            color: cyan
            linger: 0.15
          - id: intro-match
            phrase: The new receipt says revision seven
            targets:
              - receipt
            color: cyan
            linger: 0.15
      - say: It's ten seconds old, inside the thirty-second window. With smoke tests passing, hold starts at
          two hundred milliseconds and rollback starts at three hundred. Where does this reading land?
        hold: 2
        caption_starts:
          - rollback starts at three hundred
        visual_cues:
          - id: intro-age
            phrase: ten seconds old
            targets:
              - receipt
            color: cyan
            linger: 0.15
          - id: intro-policy
            phrase: hold starts at two hundred milliseconds
            targets:
              - policy
            color: cyan
            linger: 0.15
      - say: Hold the canary at ten percent. One lookup settled it. Test-time compute is the work a model does
          after training to answer a request. For a repair, the next call might be better spent trying another
          path or checking a step.
        hold: 0.9
        visual_cues:
          - id: intro-hold
            phrase: Hold the canary at ten percent
            targets:
              - policy
            color: cyan
            linger: 0.15
            caption_boundary: true
  - id: api-controls
    title: A reasoning setting is not the shared request budget
    visual: Pair each per-call model setting with what it controls. Keep authenticated observations and the shared
      request budget in application state.
    beats:
      - say: Suppose you turn up reasoning effort on the call that drafted Hold. Effort changes how much the model
          deliberates, execution mode selects a supported standard or pro run, and context controls which
          compatible reasoning items carry into a later turn. The tool receipt still has to come from the metrics
          service, and the application still decides whether to search.
        hold: 0.6
        visual_cues:
          - id: ra-api-controls-0-0
            phrase: Suppose you turn up reasoning effort on the call that drafted Hold.
            targets:
              - ra-api-controls-trace
            color: blue
            linger: 0.3
          - id: ra-api-controls-0-1
            phrase: Effort changes how much the model deliberates, execution mode selects a supported standard or pro run,
              and context controls which compatible reasoning items carry into a later turn.
            targets:
              - ra-api-controls-trace
            color: blue
            linger: 0.3
          - id: ra-api-controls-0-2
            phrase: The tool receipt still has to come from the metrics service, and the application still decides whether
              to search.
            targets:
              - ra-api-controls-trace
            color: blue
            linger: 0.3
      - say: Support depends on the model. In the guide used for this lesson, GPT-six Astra rejects an effort setting
          of none. The output limit on one call counts hidden reasoning, visible output and formatting tokens.
          Three calls can each hit that limit, so the application needs a budget for the whole request. Keep the
          receipts and the reservations in application state, where the controller can check them.
        hold: 0.6
        visual_cues:
          - id: ra-api-controls-1-0
            phrase: Support depends on the model. In the guide used for this lesson, GPT-six Astra rejects an effort
              setting of none.
            targets:
              - ra-api-controls-trace
            color: blue
            linger: 0.3
          - id: ra-api-controls-1-1
            phrase: The output limit on one call counts hidden reasoning, visible output and formatting tokens.
            targets:
              - ra-api-controls-trace
            color: blue
            linger: 0.3
          - id: ra-api-controls-1-2
            phrase: Three calls can each hit that limit, so the application needs a budget for the whole request.
            targets:
              - ra-api-controls-trace
            color: blue
            linger: 0.3
          - id: ra-api-controls-1-3
            phrase: Keep the receipts and the reservations in application state, where the controller can check them.
            targets:
              - ra-api-controls-trace
            color: blue
            linger: 0.3
  - id: xml-contract
    title: What did the parser accept?
    visual: Put an invalid final tag beside its corrected spelling. The valid XML projects one advisory but the
      evidence slot stays empty until a qualifying tool receipt arrives.
    beats:
      - say: Read the last field in this response. It says final. The parser expects final underscore answer. It
          rejects the document even though a person can see the word Hold. Fix the tag and keep the text. Now the
          parser can read the checkpoint, the verification summary and the final answer. Has the model supplied a
          metrics receipt?
        hold: 1.8
        visual_cues:
          - id: xml-invalid
            phrase: It rejects the document
            targets:
              - xml
            color: cyan
            linger: 0.15
          - id: xml-fix
            phrase: Fix the tag and keep the text
            targets:
              - xml
            color: cyan
            linger: 0.15
          - id: xml-parse
            phrase: the verification summary and the final answer
            targets:
              - xml
            color: cyan
            linger: 0.15
      - say: The receipt slot is still empty. The bounded parser checks field names, structure and nonempty values. It
          rejects declarations, attributes, nested fields and oversized input. The metrics adapter supplies a
          separate authenticated record. Match the deployment, integer revision and ten-percent traffic share.
          Check for a Boolean smoke result and finite, nonnegative latency.
        hold: 0.9
        visual_cues:
          - id: xml-empty
            phrase: The receipt slot is still empty
            targets:
              - xml-result
            color: cyan
            linger: 0.15
            caption_boundary: true
          - id: xml-receipt
            phrase: The metrics adapter supplies a separate authenticated record
            targets:
              - xml-result
            color: cyan
            linger: 0.15
      - say: This exercise also uses whole seconds for both clock readings. Subtract observed time from current time.
          Ages from zero through thirty seconds qualify. A future reading, a stale one or a wrong revision blocks
          the advice until the evidence is corrected. Once the record passes, we can use the release owner's
          policy.
        hold: 0.8
        visual_cues:
          - id: xml-age
            phrase: Subtract observed time from current time
            targets:
              - xml-result
            color: cyan
            linger: 0.15
  - id: evidence
    title: Where does the reading land?
    visual: Keep one authenticated receipt on the same p95 ruler. Move to the exact rollback boundary, then age the
      same record past the freshness window and withhold the policy result.
    beats:
      - say: Keep the fresh revision-seven receipt and the passing smoke test. Under this policy, a failed smoke test
          would already call for rollback. With smoke passing, latency decides. At two hundred forty
          milliseconds, the marker lands inside the hold range. Now change just the latency to exactly three
          hundred milliseconds. Does the boundary itself belong to hold or rollback?
        hold: 2
        visual_cues:
          - id: evidence-move
            phrase: change just the latency to exactly three hundred milliseconds
            targets:
              - policy
            color: cyan
            linger: 0.15
      - say: Rollback starts at three hundred. The comparison includes equality. Now leave the reading there and
          advance the clock. At thirty-one seconds old, can this receipt still support rollback?
        hold: 2
        visual_cues:
          - id: evidence-boundary
            phrase: Rollback starts at three hundred
            targets:
              - policy
            color: cyan
            linger: 0.15
            caption_boundary: true
          - id: evidence-late
            phrase: At thirty-one seconds old
            targets:
              - receipt
            color: cyan
            linger: 0.15
      - say: Withhold the advice and refresh the measurement. A stale reading can cross a threshold just as easily as a
          fresh one. Checking the revision and the time comes first. An authorized actuator would have to check
          the live revision again before changing traffic.
        hold: 0.9
        visual_cues:
          - id: evidence-refresh
            phrase: Withhold the advice and refresh the measurement
            targets:
              - policy
            color: cyan
            linger: 0.15
            caption_boundary: true
  - id: candidates
    title: Which repair reaches the database?
    visual: Two complete dependency paths share an API and a database. Score A higher, mark the blocked edge on A,
      and follow only the eligible path to the database.
    beats:
      - say: Holding the canary buys time to investigate. The parser flag changed near the spike. Compare timing by
          route and run a compatibility check before attributing the slowdown to that flag. For the repair,
          suppose two complete paths lead from the API to the database. A goes through the legacy adapter. B goes
          through the feature flag.
        hold: 0.6
        visual_cues:
          - id: paths-introduce
            phrase: two complete paths
            targets:
              - paths
            color: cyan
            linger: 0.15
          - id: paths-branches
            phrase: through the legacy adapter
            targets:
              - paths
            color: cyan
            linger: 0.15
      - say: A learned scorer prefers A. Now read the compatibility record. The link from the API to the legacy adapter
          is blocked. Which candidate can you send on for review?
        hold: 2.1
        visual_cues:
          - id: paths-scores
            phrase: A learned scorer prefers A
            targets:
              - paths
            color: cyan
            linger: 0.15
          - id: paths-block
            phrase: to the legacy adapter is blocked
            targets:
              - paths
            color: cyan
            linger: 0.15
      - say: Send B. A scores higher, but its first hop fails the exact check. Follow B through the feature flag to the
          database. Both of its hops pass. Best-of-N means generating complete candidates, checking which ones
          are eligible and ranking the survivors. To evaluate this selector, count how often its chosen path
          works on real repairs.
        hold: 0.9
        visual_cues:
          - id: paths-select
            phrase: Send B
            targets:
              - paths
            color: cyan
            linger: 0.15
            caption_boundary: true
          - id: paths-follow
            phrase: Follow B through the feature flag to the database
            targets:
              - paths
            color: cyan
            linger: 0.15
  - id: coverage-operation
    title: Candidate coverage and returned correctness are different counts
    visual: Multiply the failure probability across five independent attempts, take the complement, and show how
      stable arithmetic handles a very small probability.
    beats:
      - say: What if each attempt has a thirty percent chance of finding a sound repair, and all five attempts are
          independent? For all five to miss, the first must miss, and the next, all the way to the fifth.
          Multiply point seven five times. Subtract that chance of five misses from one. There's about an
          eighty-three percent chance the set contains a sound repair. That figure counts sets with at least one
          good plan. Whether the user gets it depends on the selector.
        hold: 0.6
        visual_cues:
          - id: ra-coverage-operation-0-0
            phrase: What if each attempt has a thirty percent chance of finding a sound repair, and all five attempts are
              independent?
            targets:
              - ra-coverage-operation-trace
            color: blue
            linger: 0.3
          - id: ra-coverage-operation-0-1
            phrase: For all five to miss, the first must miss, and the next, all the way to the fifth. Multiply point seven
              five times.
            targets:
              - ra-coverage-operation-trace
            color: blue
            linger: 0.3
          - id: ra-coverage-operation-0-2
            phrase: Subtract that chance of five misses from one. There's about an eighty-three percent chance the set
              contains a sound repair.
            targets:
              - ra-coverage-operation-trace
            color: blue
            linger: 0.3
          - id: ra-coverage-operation-0-3
            phrase: That figure counts sets with at least one good plan. Whether the user gets it depends on the selector.
            targets:
              - ra-coverage-operation-trace
            color: blue
            linger: 0.3
      - say: "A shared prompt can send different attempts down the same wrong path. If errors are correlated,
          multiplying five independent failure probabilities gives the wrong estimate. There's also a numerical
          trap: at a success probability of ten to the minus twenty, ordinary subtraction makes one minus that
          probability round to one. The stable formula on screen still gives about ten to the minus eighteen for
          a hundred attempts. That is a tiny chance of finding a candidate even with the arithmetic fixed."
        hold: 0.6
        visual_cues:
          - id: ra-coverage-operation-1-0
            phrase: A shared prompt can send different attempts down the same wrong path.
            targets:
              - ra-coverage-operation-trace
            color: blue
            linger: 0.3
          - id: ra-coverage-operation-1-1
            phrase: If errors are correlated, multiplying five independent failure probabilities gives the wrong estimate.
            targets:
              - ra-coverage-operation-trace
            color: blue
            linger: 0.3
          - id: ra-coverage-operation-1-2
            phrase: "There's also a numerical trap: at a success probability of ten to the minus twenty, ordinary
              subtraction makes one minus that probability round to one. The stable formula on screen still gives
              about ten to the minus eighteen for a hundred attempts."
            targets:
              - ra-coverage-operation-trace
            color: blue
            linger: 0.3
          - id: ra-coverage-operation-1-3
            phrase: That is a tiny chance of finding a candidate even with the arithmetic fixed.
            targets:
              - ra-coverage-operation-trace
            color: blue
            linger: 0.3
  - id: voting-baseline
    title: A majority label can preserve a shared mistake
    visual: Count five votes for the two repair paths. Check the blocked edge on the majority path, then compare
      token continuations with genuinely different parser choices.
    beats:
      - say: Suppose each of five attempts names its preferred repair, A or B. Count the labels. Three name A and two
          name B, so a majority vote returns A. That's self-consistency. But all three votes for A use the same
          blocked connection. Repeating a mistake can win the vote. Use voting for comparable final answers and
          let an exact compatibility check decide whether the winner can run.
        hold: 0.6
