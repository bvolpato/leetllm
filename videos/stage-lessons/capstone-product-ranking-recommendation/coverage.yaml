version: 1
lesson: capstone-product-ranking-recommendation
promise: Build a ranking experiment that can trace a missing product to eligibility, retrieval, or ordering. Rebuild a stale proposal and check which outcomes belong to the response the shopper received.
objectives:
  - id: select-and-order
    can: Filter before the candidate cutoff, compare recall with fixed-universe NDCG, and rebuild a three-place response when stock or the seller limit excludes a listing.
    scenes:
      - intro
      - funnel-contract
      - eligibility
      - slate-recheck
      - ordering
      - metric-contracts
      - recall
      - offline-gates
      - probability-value
      - fresh-ranking
  - id: fit-with-time
    can: Compute one pair's gradient and score margin, average nine pair gradients, and select the fitted weights using grouped requests with time-safe features and mature labels.
    scenes:
      - pairwise
      - pairwise-objective
      - training-matrix
      - time
      - temporal-protocol
      - trained-model
  - id: preserve-feedback
    can: Distinguish assignment, selection, and examination probabilities. Join an event to its returned product and apply an experiment stop rule with the correct denominator.
    scenes:
      - exposure
      - click-model
      - propensity-contract
      - synthesis
      - response-lineage
      - outcome-join
      - experiment-contract
      - online-guardrails
      - receipt-boundary
      - fresh-ranking
