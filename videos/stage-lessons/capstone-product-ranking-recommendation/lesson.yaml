        visual_cues:
          - id: return-convert
            phrase: "four percent and six percent"
            targets: [conversion]
      - say: >-
          The return rule asks a different question. Stop if treatment returns per purchase exceed control
          by more than one percentage point. Keep only the purchases in view. None of the four control
          purchases came back. One treatment purchase came back. Does the return rule stop treatment?
        hold: 2.2
        visual_cues:
          - id: return-rule
