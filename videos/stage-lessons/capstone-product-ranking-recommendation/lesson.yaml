version: 1
id: capstone-product-ranking-recommendation
title: Build a Ranking Experiment
source: foundations/capstone-product-ranking-recommendation/content.md
sources:
  - title: "Stanford IR: ranked retrieval evaluation"
    url: https://nlp.stanford.edu/IR-book/html/htmledition/evaluation-of-ranked-retrieval-results-1.html
  - title: RankNet original paper
    url: https://www.microsoft.com/en-us/research/publication/learning-to-rank-using-gradient-descent/
  - title: RankNet to LambdaMART overview
    url: https://www.microsoft.com/en-us/research/publication/from-ranknet-to-lambdarank-to-lambdamart-an-overview/
  - title: Original MMR paper
    url: https://www.cs.cmu.edu/afs/cs/Web/People/jgc/publication/MMR_DiversityBased_Reranking_SIGIR_1998.pdf
  - title: "Joachims et al.: unbiased learning to rank"
    url: https://arxiv.org/abs/1608.04468
  - title: "Agarwal et al.: estimating position bias"
    url: https://arxiv.org/abs/1812.05161
  - title: Scikit-learn probability calibration
    url: https://scikit-learn.org/stable/modules/calibration.html
  - title: Scikit-learn cross-validation
    url: https://scikit-learn.org/stable/modules/cross_validation.html
  - title: "Guo et al.: calibration error"
    url: https://arxiv.org/abs/1706.04599
  - title: TensorFlow retrieval versus ranking
    url: https://www.tensorflow.org/recommenders/examples/basic_retrieval
  - title: Trustworthy online controlled experiments
    url: https://experimentguide.com/
scenes:
  - id: intro
    title: "Would you rank this printer?"
    visual: "A label printer feeds out P8’s catalog ticket beside its 0.98 text match. The stock and policy checks decide whether it gets one of three ranking slots."
    beats:
      - say: >-
          This label printer scores point nine eight, the best text match. Its catalog ticket says sold out
          and policy blocked. Would you give it one of your three ranking slots?
        hold: 2.2
        caption_starts:
          - "Would you give it"
        visual_cues:
          - id: printer-stock
            phrase: "sold out"
            targets: [catalog-ticket]
          - id: printer-block
            phrase: "policy blocked"
            targets: [catalog-ticket]
      - say: >-
          Skip P eight. Policy is the first check it fails, so that's the reason we log. The next match
          is P eleven. It's in stock, but it can't ship to this shopper. Keep going. P five, P six and
          P four pass all three checks. The ranker gets to put those three in order.
        hold: 1
        caption_starts:
          - "P five, P six and P four"
        visual_cues:
          - id: printer-policy
            phrase: "Skip P eight"
            targets: [policy-rejection]
          - id: printer-catalog
            phrase: "The next match"
            targets: [catalog-checks]
          - id: printer-region
            phrase: "can't ship to this shopper"
            targets: [region-rejection]
          - id: printer-p5
            phrase: "P five"
            targets: [ranker-input]
          - id: printer-p6
            phrase: "P six"
            targets: [ranker-input]
          - id: printer-p4
            phrase: "P four"
            targets: [ranker-input]
          - id: printer-next
            phrase: "put those three in order"
            targets: [ranker-input]
  - id: eligibility
    title: "When does the shortlist fill?"
    visual: "Two passes consume the same five retrieval scores. Cutting the list early strands two places in the shortlist."
    beats:
      - say: >-
          Try taking the three largest scores first. That gives us P eight, P eleven and P five. Now enforce
          the rules. Only P five survives. Two eligible printers were within reach the whole time.
        hold: 0.8
        visual_cues:
          - id: budget-early
            phrase: "three largest scores first"
            targets: [cutoff]
          - id: budget-reject
            phrase: "Now enforce the rules"
            targets: [early-shortlist]
      - say: >-
          Filter the full set first and all three eligible printers fit. A learned penalty could be
          outweighed by another feature. The hard checks belong in the selection code. Check current
          eligibility again when building the response and save the policy version. A serving system needs
          an authoritative source for those checks.
        hold: 0.8
        visual_cues:
          - id: budget-filter
            phrase: "Filter the full set first"
            targets: [eligible-shortlist]
          - id: budget-current
            phrase: "Check current eligibility again"
            targets: [current-policy]
  - id: funnel-contract
    title: "Who gets the second printer slot?"
    visual: "A printer keeps its relevance score while similarity to the first selection shortens the two remaining selection-value bars by different amounts."
    beats:
      - say: >-
          This little catalog has ten listings across two searches. We sort supplied retrieval scores. A
          large catalog might need lexical search or a two-tower model to produce that shortlist. A richer
          ranker then scores each survivor. This exercise fits two linear weights. LambdaMART is another
          option. Its boosted trees can weight pairwise updates by the change in a ranking metric. A
          separate display cutoff sets how many places we can fill.
        hold: 0.7
        visual_cues:
          - id: funnel-score
            phrase: "ranker then scores each survivor"
            targets: [ranker]
          - id: funnel-places
            phrase: "display cutoff"
            targets: [display-budget]
      - say: >-
          Suppose the shopper wants a choice of printers. In this separate worksheet we give a listing sixty
          percent of its relevance score, then subtract forty percent of its similarity to the most similar
          printer already chosen. For the first place, the list is empty. All three similarity penalties are
          zero. The largest value is point five seven six, so the first printer is P five.
        hold: 0.65
        visual_cues:
          - id: mmr-empty
            phrase: "For the first place"
            targets: [selection-values]
          - id: mmr-first
            phrase: "the first printer is P five"
            targets: [first-slot]
      - say: >-
          Now compare the two remaining printers with P five. P six is almost a duplicate. Its similarity is
          point nine. P four's similarity is only point one. Before we subtract the penalties, which one
          would you put second?
        hold: 2.1
        visual_cues:
          - id: mmr-similarity
            phrase: "compare the two remaining printers"
            targets: [similarities]
      - say: >-
          Subtract the penalties. P six loses point three six and has point one four four left. P four loses
          only point zero four and keeps point two three. Give the second place to P four. This tradeoff is
          called maximal marginal relevance. The lab implements a seller limit as its own rule. This
          calculation illustrates a different way to build the list.
        hold: 0.8
        visual_cues:
          - id: mmr-penalty
            phrase: "Subtract the penalties"
            targets: [selection-values]
          - id: mmr-second
            phrase: "second place to P four"
            targets: [second-slot]
  - id: slate-recheck
    title: "Two calls with the same proposal"
    visual: "The proposed REQ-501 slate and the impression_rows call stay pinned while one stock flag changes between two runs."
    beats:
      - say: >-
          The treatment ranker proposes these three printers. Each comes from a different seller, so all
          three fit our limit of two per seller. That limit checks concentration. Fairness needs its own
          evaluation. The catalog still has all three in stock. Call impression rows with this request,
          shopper, time, query and arm. It checks current eligibility and returns all three positions.
        hold: 0.9
        visual_cues:
          - id: stock-first
            phrase: "all three in stock"
            targets: [stock-flags]
          - id: stock-call
            phrase: "Call impression rows"
            targets: [response-call]
          - id: stock-return
            phrase: "returns all three positions"
            targets: [response-rows]
      - say: >-
          Replay the same call as a second case. This time P five sells out after scoring. Can that call
          still write these three rows?
        hold: 2.1
        visual_cues:
          - id: stock-change
            phrase: "P five sells out after scoring"
            targets: [current-stock]
      - say: >-
          It rejects the whole proposal. P five still has its old score, but the catalog record changed. For
          a new response, fetch current candidates and rebuild under the seller limit. If too few pass, the
          service needs a refill or shorter-list policy. To audit the first response, keep the catalog that
          produced it. The loader also rejects malformed flags, grades and nonfinite scores before they
          enter this pipeline.
        hold: 1
        visual_cues:
          - id: stock-error
            phrase: "rejects the whole proposal"
            targets: [recheck-output]
          - id: stock-history
            phrase: "To audit the first response"
            targets: [catalog-history]
  - id: ordering
    title: "What is the first position worth?"
    visual: "Colored paths connect the same three products in two orders. Each destination carries its new discounted gain."
    beats:
      - say: >-
          All three eligible printers reached the ranker. On the left is the control response. Our authored
          judgments give P four grade one, P five grade three and P six grade two. A higher grade earns more
          gain. Later positions get less credit. Look at the gain underneath each printer. P five earns
          about four point four two of its possible seven in second place. Add the three contributions and
          the control earns six point nine one seven. That sum is discounted cumulative gain. Which printer
          gains the most from first place?
        hold: 2.1
        visual_cues:
          - id: position-gains
            phrase: "gain underneath each printer"
            targets: [discounted-gains]
          - id: position-control
            phrase: "earns six point nine one seven"
            targets: [control-dcg]
          - id: position-question
            phrase: "Which printer gains the most from first place"
            targets: [position-question]
      - say: >-
          Move P five to the top. Its grade stays three, but now it sits in first place and earns the full
          seven. P six takes second and P four takes third. That ideal order earns nine point three nine
          three. Divide each total by that same ideal. Control scores about point seven three six. The
          treatment matches the ideal and scores one. This ratio is normalized discounted cumulative gain,
          or N D C G. Both orders still contain both relevant printers. Retrieval recall stays at two out of
          two.
        hold: 1
        visual_cues:
          - id: position-order
            phrase: "Move P five to the top"
            targets: [ranking-paths]
          - id: position-ideal
            phrase: "earns nine point three nine three"
            targets: [ideal-dcg]
          - id: position-normalize
            phrase: "scores one"
            targets: [normalized-gain]
  - id: metric-contracts
    title: Earn the ranking metric and its denominator
    visual: One relevance grade becomes an exponential gain, receives a position discount and
      contributes to a fixed-universe metric.
    beats:
      - say: Pin the metric before comparing methods. This lab uses gain equal to two raised to the
          relevance grade, minus one. At one-based position i, divide that gain by the base-two
          logarithm of the quantity i plus one. Add the first K contributions for D C G. Sort the
          fixed judgment universe into its ideal order and divide observed D C G by ideal D C G for
          N D C G. Some libraries use linear gain, so their number can differ even on the same list.
        hold: 0.75
        visual_cues:
          - id: metric-gains
            phrase: two raised to the relevance grade, minus one
            targets:
              - metric-contracts-mechanism
            color: cyan
            linger: 0.5
          - id: metric-discount
            phrase: divide that gain by the base-two logarithm
            targets:
              - metric-contracts-mechanism
            color: cyan
            linger: 0.5
          - id: metric-normalize
            phrase: divide observed D C G by ideal D C G
            targets:
              - metric-contracts-mechanism
            color: cyan
            linger: 0.5
      - say: "Binary candidate recall uses a different rule here: relevant means eligible grade at least
          two. Divide the number of those products retrieved by all relevant eligible judgments in
          the declared universe. Grade one still contributes positive graded gain to N D C G. With
          an explicitly supplied fixed judgment universe, the N D C G helper rejects duplicate
          products, unknown items and changed relevance grades. Without that argument, it uses the
          returned rows as their own universe. The recall helper separately rejects duplicates and
          query or eligibility violations. No relevant eligible judgments is an error for recall,
          while zero ideal gain yields N D C G zero."
        hold: 0.75
        visual_cues:
          - id: metric-recall
            phrase: relevant means eligible grade at least two
            targets:
              - metric-contracts-mechanism
            color: cyan
            linger: 0.5
          - id: metric-guards
            phrase: With an explicitly supplied fixed judgment universe
            targets:
              - metric-contracts-mechanism
            color: cyan
            linger: 0.5
      - say: >-
          Mean reciprocal rank asks where the first relevant result appears. Take one divided by that
          one-based rank, or zero if none appears, then average across query instances. A first relevant item
          at rank three contributes one third. If you define relevance by a click, the result describes
          clicking under that display order. Independent judgments let you evaluate the order even for items
          that shoppers have never seen. Use shopper outcomes to measure satisfaction and calibrated
          probabilities to estimate purchases.
        hold: 0.75
        visual_cues:
          - id: metric-mrr
            phrase: first relevant item at rank three contributes one third
            targets:
              - metric-contracts-mechanism
            color: cyan
            linger: 0.5
  - id: recall
    title: "Which stage needs the repair?"
    visual: "A fixed ideal row stays above a moving returned order. Removing a printer closes the gap in the returned list. Restoring it at a low score produces a different failure."
    beats:
      - say: >-
          Keep the three eligible printer judgments pinned at the top. P five and P six meet our recall
          threshold of grade two. Now suppose retrieval drops P six. P four slides into second place. Could
          any scoring weights bring P six back?
        hold: 2.1
        visual_cues:
          - id: drop-printer
            phrase: "retrieval drops P six"
            targets: [returned-order]
          - id: drop-question
            phrase: "Could any scoring weights bring P six back"
            targets: [repair-question]
      - say: >-
          We have to restore P six to the candidate set. For now the ranker sees just one of the two
          relevant printers. That is half recall. It puts both survivors in the best possible order. Their
          gain is seven plus one divided by log base two of three. Compare that gain with the best among the
          survivors and both sides are identical. The score is one.
        hold: 0.8
        visual_cues:
          - id: drop-repair
            phrase: "restore P six to the candidate set"
            targets: [repair-question]
          - id: drop-count
            phrase: "one of the two relevant printers"
            targets: [candidate-recall]
          - id: drop-survivors
            phrase: "best among the survivors"
            targets: [conditional-denominator]
          - id: drop-perfect
            phrase: "The score is one"
            targets: [conditional-ndcg]
      - say: >-
          Use the full eligible reference above instead. P six belongs in second place there and P four
          belongs in third. The returned gain stays at seven point six three one. The ideal rises to nine
          point three nine three. Their ratio is about point eight one two. That fixed reference exposes the
          lost option.
        hold: 0.85
        visual_cues:
          - id: drop-reference
            phrase: "full eligible reference above"
            targets: [eligible-denominator]
          - id: drop-ideal
            phrase: "nine point three nine three"
            targets: [eligible-denominator]
          - id: drop-fixed
            phrase: "about point eight one two"
            targets: [fixed-ndcg]
      - say: >-
          For the second run, restore P six to retrieval. Keep the judgments. Lower just its ranking score
          to point two. P four now outranks it. Look at the returned order. Which stage would you repair
          this time?
        hold: 2.15
        visual_cues:
          - id: restore-printer
            phrase: "restore P six to retrieval"
            targets: [returned-order]
          - id: demote-input
            phrase: "Lower just its ranking score"
            targets: [rank-scores]
          - id: demote-printer
            phrase: "P four now outranks it"
            targets: [returned-order]
          - id: demote-question
            phrase: "Which stage would you repair this time"
            targets: [repair-question]
      - say: >-
          Both relevant printers made it through. Recall is two out of two. P six earns less gain in third
          place. Against the same ideal, this order scores about point nine seven two. To move P six above P
          four, restore P six's ranking score. Comparing recall with fixed-universe N D C G tells us which
          stage lost the value.
        hold: 1
        visual_cues:
          - id: demote-count
            phrase: "two out of two"
            targets: [candidate-recall]
          - id: demote-score
            phrase: "about point nine seven two"
            targets: [fixed-ndcg]
          - id: demote-answer
            phrase: "restore P six's ranking score"
            targets: [repair-question]
  - id: offline-gates
    title: Two judged searches and a scoring budget
    visual: Actual two-query gains and the P3 omission remain beside synthetic percentile samples and
      independently named gates.
    beats:
      - say: The two-query hand-entered fixture has baseline N D C G about point nine seven two for
          insulated bag and point seven three six for label printer. Their mean is point eight five
          four. The candidate gives one on both. These are regression scores supplied by the author;
          the model-fitting exercise is a separate artifact.
        hold: 0.75
        visual_cues:
          - id: offline-per-query
            phrase: baseline N D C G about point nine seven two
            targets:
              - offline-gates-mechanism
            color: cyan
            linger: 0.5
          - id: offline-mean
            phrase: Their mean is point eight five four
            targets:
              - offline-gates-mechanism
            color: cyan
            linger: 0.5
      - say: Now remove P three from the insulated-bag candidate list. Its surviving ideal order still
          normalizes to one against itself. Keep the original eligible universe, and N D C G falls
          to about point eight one two; binary recall falls to one half. A per-query gate can also
          catch a poor ordering hidden by a better mean. Preserve the cutoff, universe and relevance
          rule with each result.
        hold: 0.75
        visual_cues:
          - id: offline-drop
            phrase: remove P three
            targets:
              - offline-gates-mechanism
            color: cyan
            linger: 0.5
          - id: offline-universe
            phrase: Keep the original eligible universe
            targets:
              - offline-gates-mechanism
            color: cyan
            linger: 0.5
      - say: >-
          The local gates check for blocked displays, missing or repeated listings, unknown versions and
          sellers with more than two places. They also check assignment and outcome joins. Sort the ten
          supplied scoring times. For nearest-rank p ninety-five, multiply ten by point nine five and round
          up. That's the tenth time, eighteen milliseconds. It passes the worksheet's twenty millisecond
          limit. To apply this check to a service, time it on representative requests.
        hold: 0.75
        visual_cues:
          - id: offline-gates
            phrase: "Sort the ten supplied scoring times"
            targets:
              - offline-gates-mechanism
            color: cyan
            linger: 0.5
          - id: offline-percentile
            phrase: "the tenth time, eighteen milliseconds"
            targets:
              - offline-gates-mechanism
            color: cyan
            linger: 0.5
          - id: offline-synthetic
            phrase: "It passes the worksheet"
            targets:
              - offline-gates-mechanism
            color: cyan
            linger: 0.5
  - id: pairwise
    title: "Learning from a printer preference"
    visual: "Two fixed product points project onto a shared scoring direction. The bars update from the same weights as that direction turns."
    beats:
      - say: >-
          These two points are printers. Moving right means a stronger text match. Moving up means better
          listing quality. Start the scoring direction horizontally. P four leads on match, while the higher
          grade belongs to P five. The dashed lines project each printer onto the scoring direction. Which
          printer should move ahead if we learn this preference?
        hold: 2.15
        visual_cues:
          - id: pairwise-b1-1
            phrase: "Start the scoring direction horizontally"
            targets: [scoring-direction]
          - id: pairwise-b1-2
            phrase: "P four leads on match"
            targets: [score-bars]
          - id: pairwise-question
            phrase: "Which printer should move ahead"
            targets: [score-question]
      - say: >-
          Use this single preference for twelve small updates. Watch the direction turn toward quality. The
          points stay put. As their projections change, P five overtakes P four. A larger margin means the
          preferred product scores farther ahead. This illustration fits one preference. We still need later
          requests to find out whether a learned rule transfers.
        hold: 0.9
        visual_cues:
          - id: pairwise-b2-1
            phrase: "twelve small updates"
            targets: [update-count]
          - id: pairwise-b2-2
            phrase: "direction turn toward quality"
            targets: [scoring-direction]
          - id: pairwise-b2-3
            phrase: "P five overtakes P four"
            targets: [score-bars]
  - id: pairwise-objective
    title: "What does one preference change?"
    visual: "Two score markers share the same scale. One update from a tie makes the margin between the preferred and weaker training products measurable."
    beats:
      - say: >-
          Switch from the rotating printer example to a single pair from the training file. In this request
          the judgments prefer A two over A one. Read the feature columns across. A two gives up a tenth in
          text match and gains six tenths in quality. Better minus worse gives the signed difference in
          yellow. A score is the dot product of weights and features. With both weights at zero, the scores
          tie. Which feature should gain weight?
        hold: 2
        visual_cues:
          - id: pair-difference
            phrase: "Better minus worse"
            targets: [feature-difference]
          - id: pair-tie
            phrase: "the scores tie"
            targets: [score-rulers]
      - say: >-
          Quality should gain weight. Take the preferred score minus the other score. That gap is the
          margin. Our pair loss is the log of one plus the exponential of the negative margin. Its gradient
          is the negative feature difference times the sigmoid of the negative margin. At a tie the sigmoid
          is one half. The gradient is half the difference with both signs reversed. That is positive point
          zero five for match and negative point three for quality.
        hold: 0.7
        visual_cues:
          - id: pair-gradient
            phrase: "half the difference with both signs reversed"
            targets: [pair-gradient]
      - say: >-
          Subtract point three times that gradient from the starting weights. The match weight becomes
          negative point zero one five. The quality weight becomes positive point zero nine. Apply those
          weights to both products. Both scores rise, but A two moves farther. Its lead is now point zero
          five five five.
        hold: 0.8
        visual_cues:
          - id: pair-update
            phrase: "quality weight becomes positive point zero nine"
            targets: [pair-weights]
          - id: pair-move
            phrase: "Apply those weights to both products"
            targets: [score-rulers]
          - id: pair-margin
            phrase: "lead is now point zero five five five"
            targets: [score-margin]
      - say: >-
          The full fit averages the losses over all preferred pairs and adds half of lambda times the
          squared weight norm. Average the gradients the same way and add lambda times the weights. The code
          evaluates the sigmoid with log-add-exp for numerical stability. This linear model uses the
          preference objective from RankNet, which used a neural scoring function.
        hold: 0.75
        visual_cues:
          - id: pair-average
            phrase: "averages the losses"
            targets: [full-objective]
          - id: pair-regularize
            phrase: "add lambda times the weights"
            targets: [regularizer]
  - id: training-matrix
    title: Build the actual nine-pair average
    visual: All three request groups contribute their three signed preference differences; accumulation
      leads to the actual first full update.
    beats:
      - say: "Each of three training requests has grades one, two and three. Form a directed pair whenever
          one grade is larger: three pairs per request, nine total. Equal grades contribute no
          preference pair. Keep product and request identities on every row. The feature differences
          all lie between negative one and one in this authored scale."
        hold: 0.75
        visual_cues:
          - id: training-pairs
            phrase: three pairs per request, nine total
            targets:
              - training-matrix-mechanism
            color: cyan
            linger: 0.5
      - say: At zero weights, all nine wrong-order probabilities are one half. The average gradient is
          approximately positive point zero one six six seven in text match and negative point one
          six one one one in quality. The first full update with step point three is negative point
          zero zero five, positive point zero four eight three three. It differs from the isolated A
          two versus A one update because all nine rows contribute.
        hold: 0.75
        visual_cues:
          - id: training-gradient
            phrase: The average gradient is approximately positive point zero one six six seven in text match
              and negative point one six one one one in quality
            targets:
              - training-matrix-mechanism
            color: cyan
            linger: 0.5
          - id: training-update
            phrase: The first full update with step point three is negative point zero zero five, positive point
              zero four eight three three
            targets:
              - training-matrix-mechanism
            color: cyan
            linger: 0.5
      - say: This objective gives each pair one ninth of the weight. Each request supplies three pairs,
          so each contributes a third of the total. A request with many more judged pairs would
          contribute more. To give every request equal weight, average within each request first.
          These features share a zero-to-one scale. Fit any scaler for new features on training
          rows only.
        hold: 0.75
        visual_cues:
          - id: training-weights
            phrase: A request with many more judged pairs would contribute more
            targets:
              - training-matrix-mechanism
            color: cyan
            linger: 0.5
          - id: training-scale
            phrase: "Fit any scaler for new features"
            targets:
              - training-matrix-mechanism
            color: cyan
            linger: 0.5
  - id: time
    title: "What was available at the training freeze?"
    visual: "One May 4 request stays on a UTC clock. Moving the last label across the freeze changes membership. Moving a feature past serving invalidates the input."
    beats:
      - say: >-
          Here is one request from the training file. Keep its three product rows together. Their features
          were available at eleven on May fourth. The search ran at noon. Follow the bottom track. The last
          label arrived the next day at noon, twelve hours after training froze. Can this request enter the
          May fifth training set?
        hold: 2.1
        visual_cues:
          - id: clock-label
            phrase: "Follow the bottom track"
            targets: [label-clock]
          - id: clock-question
            phrase: "Can this request enter the May fifth training set"
            targets: [training-freeze]
      - say: >-
          Leave all three rows out. Serving time still puts the request in the training window. Every label
          has to arrive strictly before the freeze. A label at midnight would also be too late. Now move all
          three labels to six the previous evening. At the freeze they're mature. Include the request, and
          the training count rises from three requests to four.
        hold: 0.8
        visual_cues:
          - id: clock-pending
            phrase: "Leave all three rows out"
            targets: [frozen-membership]
          - id: clock-earlier
            phrase: "move all three labels"
            targets: [label-clock]
          - id: clock-include
            phrase: "Include the request"
            targets: [frozen-membership]
      - say: >-
          Keep those earlier labels and change one more input. Suppose a feature first became available at
          three in the afternoon, after the search. Reject that feature record. The scorer could never have
          used it at noon. For the fit we'll return to the original file, choose regularization on later
          validation requests, then evaluate on still later test requests. Holding out new products or new
          queries tests a different kind of generalization.
        hold: 0.95
        visual_cues:
          - id: clock-late-feature
            phrase: "first became available at three"
            targets: [feature-clock]
          - id: clock-invalid
            phrase: "Reject that feature record"
            targets: [feature-validation]
  - id: temporal-protocol
    title: "Which requests were ready at each cutoff?"
    visual: Serving time selects a half-open window, feature availability precedes serving, and every
      label must precede the freeze.
    beats:
      - say: >-
          Each row is one request. Eight requests with three products each give us twenty-four rows. The
          cyan dot marks when we served the request. The white dot marks when its last label arrived. All
          three products share the same query and serving time. The loader checks U T C timestamps, distinct
          product IDs, valid grades and finite features in range. Features must be available by serving time,
          and a label can arrive at serving time or later.
        hold: 0.75
        visual_cues:
          - id: temporal-rows
            phrase: "Each row is one request"
            targets:
              - temporal-protocol-mechanism
            color: cyan
            linger: 0.5
          - id: temporal-clocks
            phrase: "The white dot marks"
            targets:
              - temporal-protocol-mechanism
            color: cyan
            linger: 0.5
      - say: >-
          The yellow lines mark midnight in UTC. Training starts May first and ends when May fifth begins.
          Validation takes the next two days. The test requests were served on May seventh and eighth. We
          wait until May tenth to freeze their labels. For each group, every label has to arrive before its
          cutoff. A label that lands exactly on the line misses it.
        hold: 0.75
        visual_cues:
          - id: temporal-windows
            phrase: "The yellow lines mark midnight"
            targets:
              - temporal-protocol-mechanism
            color: cyan
            linger: 0.5
          - id: temporal-freeze
            phrase: "every label has to arrive before its cutoff"
            targets:
              - temporal-protocol-mechanism
            color: cyan
            linger: 0.5
      - say: >-
          Follow the fourth line across May fifth. The request made the training window. Its labels missed
          the cutoff by twelve hours, so all three rows stay out. That leaves three training requests, two
          for validation and two for test. Slow outcomes are easier to lose this way. If you're tracking
          returns, record how many are still pending when you freeze the data. These later requests can
          repeat a query or a product. To test an unfamiliar query or a new product, hold it out as a
          separate group.
        hold: 0.75
        visual_cues:
          - id: temporal-counts
            phrase: "That leaves three training requests"
            targets:
              - temporal-protocol-mechanism
            color: cyan
            linger: 0.5
          - id: temporal-pending
            phrase: "Follow the fourth line"
            targets:
              - temporal-protocol-mechanism
            color: cyan
            linger: 0.5
          - id: temporal-late
            phrase: "its labels missed the cutoff by twelve hours"
            targets: [pending-request]
  - id: trained-model
    title: "Which fit goes to test?"
    visual: "Two fits start at zero. Their quality weights follow different paths, but the validation scores tie. The tie-break selects one fit for the held-out requests."
    beats:
      - say: >-
          Both fits start at zero. Give each six hundred gradient steps at a learning rate of point three.
          Blue has no penalty on large weights. Cyan has lambda point one. Watch the quality weight. The blue
          curve keeps climbing. The penalty keeps the cyan curve much lower. Both fits put the validation
          products in ideal order. They tie at one. Our tie-break picks the stronger penalty, so the cyan fit
          goes to test.
