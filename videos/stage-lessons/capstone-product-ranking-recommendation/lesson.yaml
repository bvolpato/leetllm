            phrase: "about sixteen point seven percent"
            targets: [return-rates]
          - id: return-stop
            phrase: "says to stop treatment"
            targets: [return-decision]
      - say: >-
          Try the same rule with zero purchases in control. Its conversion is zero, but its return rate is
          zero divided by zero. That rate is undefined. Hold the return comparison until both denominators
          exist. A blocked display can still trigger a separate safety stop. The twenty millisecond scoring
          check and the hundred and twenty millisecond full-search stop also time different work.
        hold: 0.9
        visual_cues:
          - id: return-empty
            phrase: "zero purchases in control"
            targets: [purchase-denominator]
          - id: return-undefined
            phrase: "That rate is undefined"
            targets: [control-returns]
          - id: return-hold
            phrase: "Hold the return comparison"
            targets: [return-decision]
