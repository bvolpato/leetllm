            color: cyan
            linger: 0.5
  - id: exposure
    title: "Clicks on three printers"
    visual: "Yellow clicks stay in their original rows as each product's observed display count shrinks to its first ten impressions."
    beats:
      - say: >-
          Now look at a separate log of displays. Each dot is one displayed impression. Yellow means the
          shopper clicked. Each row contains ten impressions. P four has ten rows. P six has just one. Count
          the yellow dots. Which printer collected the most clicks?
        hold: 2.2
