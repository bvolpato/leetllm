        visual_cues:
          - id: model-weights
            phrase: "The selected weights are about"
            targets:
              - trained-model-mechanism
            color: cyan
            linger: 0.5
          - id: model-test
            phrase: "The fitted model scores one"
            targets:
              - trained-model-mechanism
            color: cyan
            linger: 0.5
      - say: >-
          Those two requests are our synthetic holdout. If we tune the model again using this result, we need
