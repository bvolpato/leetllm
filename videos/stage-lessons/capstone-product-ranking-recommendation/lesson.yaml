            targets: [returned-purchase]
          - id: return-question
            phrase: "Does the return rule stop treatment"
            targets: [return-decision]
      - say: >-
          The treatment rate is one out of six purchases, about sixteen point seven percent. Control is zero
          out of four. The worksheet says to stop treatment. For a real trial, buyers need comparable
          follow-up windows. These small counts alone give us little evidence about a population effect.
        hold: 0.8
        visual_cues:
