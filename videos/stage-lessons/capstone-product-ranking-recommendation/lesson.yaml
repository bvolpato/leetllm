  - id: probability-value
    title: What is one impression worth?
    visual: "An eighty-dollar printer turns impressions into expected clicks, purchases and gross sales. A second worksheet checks one probability bin against ten held-out outcomes."
    beats:
      - say: >-
          A rank score tells us which printer comes first. What is one impression of an eighty-dollar printer
          worth? Follow one purchase path. The shopper clicks, then buys. Count at most one purchase through
          that click. We want gross sales before fees and returns. Multiply the chance of a click by the
          chance of a purchase given the click, then by the price.
        hold: 0.75
        visual_cues:
          - id: value-score
            phrase: "A rank score tells us which printer comes first"
            targets:
              - probability-value-mechanism
            color: cyan
            linger: 0.5
          - id: value-price
            phrase: "one impression of an eighty-dollar printer"
            targets: [purchase-path]
          - id: value-rule
            phrase: "Multiply the chance of a click"
            targets:
              - probability-value-mechanism
            color: cyan
            linger: 0.5
      - say: >-
          Start with a hundred impressions. At a click probability of point two, we'd expect twenty clicks.
          If one in four clicks leads to a purchase, that's five printers. At eighty dollars each, that's
          four hundred dollars in gross sales. Divide by the hundred impressions. That's four dollars per
          impression on average.
        hold: 0.75
        caption_starts:
          - "that's five printers"
          - "That's four dollars per impression"
        visual_cues:
          - id: value-example
            phrase: "Start with a hundred impressions"
            targets:
              - probability-value-mechanism
            color: cyan
            linger: 0.5
          - id: value-clicks
            phrase: "we'd expect twenty clicks"
            targets: [expected-clicks]
          - id: value-purchases
            phrase: "that's five printers"
            targets: [expected-purchases]
          - id: value-total
            phrase: "four hundred dollars in gross sales"
            targets: [expected-gross]
          - id: value-unit
            phrase: "That's four dollars per impression"
            targets: [expected-value]
      - say: >-
          Now check a probability against held-out outcomes. Take ten predictions of point eight. We'd expect
          eight positives. Count the green dots. Six were positive, so the observed rate is point six. The
          gap is point two. A reliability diagram makes this comparison for each probability bin. Expected
          calibration error averages the absolute gaps, weighting each bin by its share of examples. With
          ten examples, one outcome changes this bin's rate by a tenth. Changing the bin boundaries
          changes which predictions you compare. Check calibration again when the traffic changes.
        hold: 0.75
        caption_starts:
          - "Six were positive"
          - "The gap is point two"
        visual_cues:
          - id: value-bins
            phrase: "Take ten predictions of point eight"
            targets:
              - probability-value-mechanism
            color: cyan
            linger: 0.5
          - id: value-outcomes
            phrase: "Count the green dots"
            targets: [held-out-outcomes]
          - id: value-ece
            phrase: "Six were positive"
            targets:
              - probability-value-mechanism
            color: cyan
            linger: 0.5
          - id: value-gap
            phrase: "The gap is point two"
            targets: [calibration-gap]
  - id: online-guardrails
    title: "Which purchases came back?"
    visual: "Two hundred search marks collapse to the four control purchases and six treatment purchases. A returned purchase stays marked as the denominator changes."
    beats:
      - say: >-
          Here is a separate, invented experiment worksheet. Each dot is one search. A colored dot is a
          search with one purchase. Four control searches and six treatment searches converted. Out of a
          hundred searches on each side, that gives four percent and six percent. Treatment leads on
          conversion.
