  - id: click-model
    title: "What does a click at position three tell us?"
    visual: "A common ruler tracks expected weighted clicks for two positions. The marks converge under inverse weighting and separate again when the same cap clips only one weight."
    beats:
      - say: >-
          Suppose the two listings are equally likely to be relevant. Give each a relevance probability of
          one half. In this toy model, a click requires both examination and relevance. Examination depends
          only on position, and at this fixed context we assume it's independent of relevance. Position one
          gets examined four times as often as position three. Multiply examination by relevance. The
          expected click rates are point four and point one.
        hold: 0.8
        visual_cues:
          - id: click-product
            phrase: "a click requires both examination and relevance"
            targets: [click-inputs]
          - id: click-raw
            phrase: "expected click rates are point four and point one"
            targets: [expected-clicks]
      - say: >-
          Now weight each click by one divided by its examination probability. A top-position click counts
          one and a quarter times. A third-position click counts five times. Watch where the marks meet.
          Both expected weighted clicks per impression are one half. That's an average over the toy model. A
          finite log can come out differently.
        hold: 0.75
        visual_cues:
          - id: click-inverse
            phrase: "weight each click by one divided by its examination probability"
            targets: [inverse-weights]
      - say: >-
          Cap each inverse weight at two. Keep the smaller of two and the weight already on the screen.
          Which position loses weight?
        hold: 2.1
        visual_cues:
          - id: click-cap
            phrase: "Cap each inverse weight at two"
            targets: [clipping-rule]
          - id: click-question
            phrase: "Which position loses weight"
            targets: [clipping-question]
      - say: >-
          Follow position three. Its raw click probability stays at one tenth. The weight falls from five to
          two, so its weighted expectation falls to two tenths. Position one keeps its weight and its half.
          Clipping limits the influence of an individual click at the cost of bias here. If we lower the cap
          to one, both weights become one. We're back at the raw click rates. Real clicks can also reflect
          trust or accidents. A useful correction needs evidence for the observation model.
        hold: 0.9
        visual_cues:
          - id: click-clip
            phrase: "Follow position three"
            targets: [clipped-weights]
          - id: click-one
            phrase: "lower the cap to one"
            targets: [clipping-rule]
  - id: propensity-contract
    title: "Could the shopper see product Z?"
    visual: Experiment assignment, selection and examination receive separate named paths; zero exposure
      stays visibly empty instead of being rescaled.
    beats:
      - say: Follow one shopper. A fifty-fifty split decides which ranker they get. That ranker's selection
          policy determines which products can appear. Examination propensity describes the chance that
          the shopper looks at a product in its assigned position. Suppose the policy never shows product
          Z. There are no clicks for Z to reweight. Independent judgments or approved exploration can
          give us observations for that product.
        hold: 0.75
        visual_cues:
          - id: propensity-types
            phrase: "A fifty-fifty split"
            targets:
              - propensity-contract-mechanism
            color: cyan
            linger: 0.5
          - id: propensity-zero
            phrase: "never shows product Z"
            targets:
              - propensity-contract-mechanism
            color: pink
            linger: 0.5
      - say: >-
          Look at the same two printers under different rankers. When their positions swap, we can compare
          how often shoppers click them in each position. Randomized swaps are one way to get that variation.
          Agarwal and colleagues used changes across historical rankers to estimate relative examination
          rates. Their method needs overlapping positions, comparable assignment and a model of how position
          affects attention.
        hold: 0.75
        visual_cues:
          - id: propensity-relative
            phrase: "Look at the same two printers"
            targets:
              - propensity-contract-mechanism
            color: cyan
            linger: 0.5
      - say: >-
          Relative rates tell us how much more often one position gets examined. To recover an absolute
          relevance rate, we also need the examination scale. Multiplying the data loss by a positive
          constant leaves its best unregularized fit in the same place. With a fixed penalty, the balance
          changes. Scale the penalty too to preserve the fit. Here the propensity fields stay empty. Keep
          these rows for evaluation. Before training on clicks, validate the estimate against observations
          and have the training pipeline enforce the permitted use.
        hold: 0.75
        visual_cues:
          - id: propensity-scale
            phrase: "Multiplying the data loss"
            targets:
              - propensity-contract-mechanism
            color: cyan
            linger: 0.5
          - id: propensity-fixed
            phrase: "With a fixed penalty"
            targets:
              - propensity-contract-mechanism
            color: cyan
            linger: 0.5
          - id: propensity-unset
            phrase: "the propensity fields stay empty"
            targets:
              - propensity-contract-mechanism
            color: cyan
            linger: 0.5
  - id: synthesis
