            targets:
              - trained-model-mechanism
            color: cyan
            linger: 0.5
          - id: model-selected
            phrase: "the cyan fit goes to test"
            targets: [model-selection]
      - say: >-
          The selected weights are about negative point one zero nine for text match and positive one point
          two two nine for quality. In these training requests, some strong text matches got low grades. On
          the two later test requests, sorting by match alone scores point eight five four on average. The
          fitted model scores one.
        hold: 0.75
        caption_starts:
