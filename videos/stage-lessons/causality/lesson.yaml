      - say: "You could randomize the routing. A common random draw makes assignment independent of potential outcomes by design. Or randomize within each risk group, with a different routing probability for each. Then the independence holds within the risk group. A finite trial can still get an uneven mix by chance. Track missing outcomes and check whether the results carry to the deployment queue."
        hold: 0.65
        visual_cues:
          - id: random
            phrase: "A common random draw"
            targets: [picture]
          - id: strata
            phrase: "Or randomize within each risk group"
            targets: [picture]
          - id: within
            phrase: "the independence holds within the risk group"
            targets: [picture]
      - say: "What do we have today? The raw report puts the assistant twenty-two points behind. It got the harder tickets. At next week’s case mix, the point estimate puts the assistant ten points ahead. Under our independent-ticket approximation, the interval runs from minus seven point two to plus twenty-seven point two points. Do these tickets justify changing the route for everyone?"
        hold: 2.1
        visual_cues:
          - id: raw
            phrase: "twenty-two points behind"
            caption_boundary: true
            targets: [picture]
          - id: adjusted
            phrase: "the point estimate puts the assistant ten points ahead"
            caption_boundary: true
            targets: [picture]
          - id: interval
            phrase: "the interval runs from minus seven point two to plus twenty-seven point two points"
            caption_boundary: true
            targets: [picture]
          - id: decision
            phrase: "Do these tickets justify changing the route for everyone"
            targets: [picture]
      - say: "I’d test the change first. The interval covers both benefit and harm, and hidden urgency could still explain part of the difference. Even a precise average would leave the effect on one ticket unresolved. Choose the design for the decision. If both routes draw on the same staff, a trial across independent queues can measure the effect of deploying the policy on a whole queue. A trial that randomizes individual tickets in one queue answers a different question."
        hold: 0.8
        visual_cues:
          - id: individual
            phrase: "the effect on one ticket unresolved"
            targets: [picture]
          - id: trial
            phrase: "a trial across independent queues"
            targets: [picture]
  - id: selection
    title: Selecting an audit can manufacture an advantage
    visual: A common-effect audit node receives assignment and outcome; filtering to audited tickets changes the
      observed success comparison.
    beats:
      - say: Consider a separate example where both workflows resolve half their tickets. Audit every assistant ticket
          and every failed control ticket. In the audit log, assistant cases retain successes and failures,
          while control cases contain only failures. Selection creates an apparent assistant advantage from
          equal underlying rates.
        hold: 0.6
        visual_cues:
          - id: rule
            phrase: "Audit every assistant ticket and every failed control ticket"
            targets:
              - picture
          - id: filter
            phrase: "In the audit log"
            targets:
              - picture
          - id: advantage
            phrase: "Selection creates an apparent assistant advantage from equal underlying rates"
            targets:
              - picture
      - say: The audit is a common effect of assignment and outcome. Conditioning on it opens a selection path in the
          assumed graph. The direction of the resulting bias depends on the audit rule, so recording the
          mechanism matters more than applying a general slogan about which variables to control.
        hold: 0.6
        visual_cues:
          - id: collider
            phrase: "Conditioning on it opens a selection path"
            targets:
              - picture
      - say: You can now separate an observed comparison, an adjusted target-population estimate, and a causal claim
          supported under explicit assumptions. Start with the action, population, outcome horizon, assignment
          process, and available alternatives. Those choices determine what evidence the comparison contains
          and what further experiment would be useful.
        hold: 0.75
        visual_cues:
          - id: evidence
            phrase: "Start with the action"
            targets:
              - picture
