version: 1
id: causality
title: "Causal inference: follow the tickets from assignment to policy value"
source: foundations/causal-inference-confounding-counterfactuals/content.md
sources:
  - title: "Hernán and Robins: Causal Inference, What If"
    url: https://miguelhernan.org/s/hernanrobins_WhatIf_2jan25.pdf
  - title: "Pearl: The Seven Tools of Causal Inference"
    url: https://ftp.cs.ucla.edu/pub/stat_ser/r481-reprint.pdf
  - title: Doubly Robust Policy Evaluation and Learning
    url: https://arxiv.org/abs/1103.4601
  - title: Sequential doubly robust policy evaluation
    url: https://proceedings.mlr.press/v48/jiang16.html
  - title: Unbiased learning to rank with biased feedback
    url: https://arxiv.org/abs/1608.04468
scenes:
  - id: intro
    title: "Send every ticket back to human support?"
    visual: "A service outage and a password reset drop into different queues. Open the full log, then sort the same tickets by intake risk to compare the hard cases."
    beats:
      - say: "A service outage lands with the assistant. A password reset goes to a human. Open the full ticket log. Within a day, the assistant resolved fifty-four of its hundred tickets. The human team, our control, resolved seventy-six of its hundred."
        hold: 0.65
        visual_cues:
          - id: reset
            phrase: "A password reset goes to a human"
            targets: [picture]
          - id: log
            phrase: "Open the full ticket log"
            targets: [picture]
          - id: assistant
            phrase: "fifty-four of its hundred tickets"
            caption_boundary: true
            targets: [picture]
          - id: control
            phrase: "seventy-six of its hundred"
            caption_boundary: true
            targets: [picture]
      - say: "Sort the tickets by their risk at intake. Look at the hard tickets. Forty-five of ninety resolved with the assistant. Four of ten resolved under control. Which workflow resolved a larger share?"
        hold: 2.3
        visual_cues:
          - id: sort
            phrase: "Sort the tickets by their risk at intake"
            targets: [picture]
          - id: hard
            phrase: "Look at the hard tickets"
            targets: [picture]
      - say: "The assistant did. Half of its hard tickets resolved, compared with forty percent under control. The assistant got ninety hard tickets. The human team got ten. What would happen if both workflows handled the same queue?"
        hold: 0.8
        visual_cues:
          - id: answer
            phrase: "Half of its hard tickets resolved, compared with forty percent under control"
            caption_boundary: true
            targets: [picture]
          - id: decision
            phrase: "What would happen if both workflows handled the same queue"
            targets: [picture]
  - id: policy-definition
    title: Define the unit, action and outcome
    visual: A persistent ticket links pre-routing risk, its versioned assistant workflow and the 24-hour outcome.
      A prompt change updates the action version. The shared-staff branch connects this routing choice to
      another ticket’s queue.
    beats:
      - say: Our two hundred tickets are synthetic. A unit is one ticket at its routing decision; treatment is a
          specified assistant workflow, and control is the existing human workflow. Resolution means success
          within twenty-four hours in both arms. Risk is recorded before routing. Keep that outcome definition
          and time horizon attached to every rate.
        hold: 0.65
        visual_cues:
          - id: routing
            phrase: "one ticket at its routing decision"
            targets:
              - picture
          - id: window
            phrase: "within twenty-four hours in both arms"
            targets:
              - picture
          - id: baseline
            phrase: "Risk is recorded before routing"
            targets:
              - picture
      - say: Consistency says the observed outcome equals the potential outcome under the workflow actually received.
          Record model, prompt, tool and control versions. A defined stochastic assistant policy can produce
          different text on different runs without automatically violating consistency. A changed prompt that
          changes the workflow is a different action version for causal evaluation.
        hold: 0.65
        visual_cues:
          - id: new-prompt
            phrase: "A changed prompt that changes the workflow"
            targets:
              - picture
      - say: If routing one ticket changes staff availability for others, its effect travels through the shared queue.
          Define whether the question concerns an individual assignment or a queue-level deployment policy.
          Randomizing an offer to use a feature and forcing its use are also different actions. The observed
          comparison cannot choose that intervention definition for us.
        hold: 0.65
        visual_cues:
          - id: queue
            phrase: "If routing one ticket changes staff availability"
            targets:
              - picture
          - id: another
            phrase: "for others"
            targets:
              - picture
  - id: simpson
    title: "What went into each total?"
    visual: "Each tile keeps its outcome. The height of the green stack shows the within-risk rate. Changing the widths of the easy and hard groups tests whether the logged totals would rank the workflows the same way at a common mix."
    beats:
      - say: "Read the easy columns first. Nine of ten assistant tickets resolved. Seventy-two of ninety control tickets resolved. Compare the green heights and you can see ninety percent against eighty. Now look at the hard columns. Half resolved with the assistant and forty percent with control. The assistant leads by ten percentage points on both comparisons."
        hold: 0.55
        visual_cues:
          - id: easy
            phrase: "Read the easy columns first"
            targets: [picture]
          - id: hard
            phrase: "Now look at the hard columns"
            targets: [picture]
      - say: "Count the green tiles in the original trays. The assistant gets nine resolutions from easy tickets and forty-five from hard ones. Control gets seventy-two from easy tickets alone. The wider column supplies more of the total. That gives control the higher overall rate, seventy-six percent against fifty-four."
        hold: 0.7
        visual_cues:
          - id: count
            phrase: "Count the green tiles in the original trays"
            targets: [picture]
      - say: "Set a target of half easy and half hard for both workflows. The yellow marks show where their dividers would go. Keep the height of each green stack. Which workflow will lead?"
        hold: 2.2
        visual_cues:
          - id: target
            phrase: "Set a target of half easy and half hard"
            targets: [picture]
      - say: "Move the dividers to the middle. Each original ticket keeps its outcome, but its width now shows how much it counts. Average the two green heights in each tray. At the shared mix the assistant leads, seventy percent to sixty. This reversal between the pooled and within-group comparisons is Simpson’s paradox. To read the ten-point gap as an effect of routing, we still need to know how the tickets were assigned."
        hold: 0.8
        visual_cues:
          - id: move
            phrase: "Move the dividers to the middle"
            targets: [picture]
          - id: result
            phrase: "At the shared mix the assistant leads, seventy percent to sixty"
            caption_boundary: true
            targets: [picture]
  - id: graph
    title: Draw the assignment mechanism you assume
    visual: A causal graph places pre-routing risk above assignment and outcome, exposing the backdoor path.
    beats:
      - say: Suppose pre-routing risk influences both workflow assignment and resolution. Draw an arrow from risk to
          each of those variables. Also draw the possible effect of assignment on resolution. Risk is a common
          cause, creating a backdoor path between the action and the outcome.
        hold: 0.6
        visual_cues:
          - id: fork
            phrase: "Draw an arrow from risk to each of those variables"
            targets:
              - picture
          - id: effect
            phrase: "possible effect of assignment on resolution"
            targets:
              - picture
          - id: backdoor
            phrase: "Risk is a common cause"
            targets:
              - picture
      - say: The graph records causal assumptions about how the system works. Its arrows do not emerge automatically
          from correlations in the table. Under the stated model, conditioning on risk blocks this particular
          noncausal path. We must also consider whether another common cause remains unmeasured.
        hold: 0.6
        visual_cues:
          - id: condition
            phrase: "conditioning on risk blocks this particular noncausal path"
            targets:
              - picture
      - say: A variable’s role matters. Adjusting for a common cause differs from adjusting for a consequence of
          treatment, and conditioning on a common effect can introduce selection bias. Choose an adjustment
          set from the causal question and the assumed graph, then inspect the information needed to justify
          it.
        hold: 0.75
        visual_cues:
          - id: role
            phrase: "A variable’s role matters"
            targets:
              - picture
  - id: graph-junctions
    title: Trace an open path before adjusting
    visual: Build a chain, fork and collider with named assignment and outcome nodes. Conditioning frames change
      whether the displayed path is open. A separately labeled symbolic cancellation illustrates why an open
      path need not yield nonzero association.
    beats:
      - say: Path blocking has three basic junctions. In a chain, assignment changes a diagnostic summary, which
          affects resolution. Conditioning on that mediator blocks this directed route. A total effect
          includes that route, so adjusting it away changes the comparison. Such conditioning does not
          automatically identify a direct causal effect.
        hold: 0.65
        visual_cues:
          - id: chain
            phrase: "assignment changes a diagnostic summary"
            targets:
              - picture
          - id: mediator
            phrase: "Conditioning on that mediator blocks this directed route"
            targets:
              - picture
      - say: In a fork, a pre-treatment common cause influences assignment and outcome. Conditioning on that cause
          blocks this particular backdoor path. In a collider, two arrows meet at a common effect. The path is
          blocked until we condition on that effect or one of its descendants; other non-colliders can still
          block a longer path.
        hold: 0.65
        visual_cues:
          - id: fork
            phrase: "In a fork"
            targets:
              - picture
          - id: cause
            phrase: "a pre-treatment common cause influences assignment and outcome"
            targets:
              - picture
          - id: risk
            phrase: "Conditioning on that cause"
            targets:
              - picture
          - id: collider
            phrase: "In a collider"
            targets:
              - picture
          - id: open
            phrase: "until we condition on that effect"
            targets:
              - picture
      - say: Check every path to establish d-separation. Under the causal Markov assumption, d-separation implies
          conditional independence. An open path permits dependence but need not produce a nonzero
          association, because contributions can cancel. Reading causal structure backward from observed
          independence needs an additional faithfulness assumption. A graph’s arrows remain assumptions about
          the data-generating mechanism.
        hold: 0.65
        visual_cues:
          - id: dependence
            phrase: "An open path permits dependence"
            targets:
              - picture
  - id: backdoor-set
    title: Block the paths that enter assignment
    visual: Keep the measured-risk fork and workflow effect. The adjustment chapter applies the same symbolic
      target shares to the actual four subgroup rates. Adding a hidden customer-tier fork exposes the path
      that measured-risk adjustment leaves open.
    beats:
      - say: "The backdoor criterion is a sufficient graphical condition: the adjustment set contains no descendant of
          treatment and blocks every path from assignment to outcome that starts with an arrow into
          assignment. It is not a rule to control every available variable. A treatment-affected summary or
          selected audit can remove a real route or open a noncausal one."
        hold: 0.65
        visual_cues:
          - id: block
            phrase: "blocks every path from assignment to outcome"
            targets:
              - picture
          - id: enters
            phrase: "starts with an arrow into assignment"
            targets:
              - picture
      - say: With the relevant causal assumptions, positivity and consistency, adjustment averages each
          treatment-specific outcome rate within an adjustment stratum using one population distribution. For
          discrete strata, multiply the outcome rate by that stratum’s target probability and sum. Both arms
          must use the same chosen target rather than their different observed assignment mixes.
        hold: 0.65
        visual_cues:
          - id: average
            phrase: "multiply the outcome rate by that stratum’s target probability and sum"
            targets:
              - picture
      - say: Risk-only adjustment is insufficient if a hidden customer tier still changes routing and outcome through
          an unblocked path. Measuring more rows does not close that path. Conversely, an unrecorded variable
          need not confound this comparison if the recorded set already blocks its relevant paths. Recording a
          baseline attribute later does not alone make it treatment-affected.
        hold: 0.65
        visual_cues:
          - id: hidden
            phrase: "a hidden customer tier"
            targets:
              - picture
          - id: open
            phrase: "through an unblocked path"
            targets:
              - picture
  - id: intervene
    title: Set the action and remove its incoming arrow
    visual: The do-operation severs risk-to-assignment while retaining risk-to-outcome and assignment-to-outcome
      mechanisms.
    beats:
      - say: An observational question asks what happened among tickets that received the assistant. An intervention
          asks what would happen if we assigned a specified population to it. In a structural model, the
          intervention replaces the assignment mechanism with a fixed action and removes its incoming arrows.
        hold: 0.6
        visual_cues:
          - id: observed
            phrase: "among tickets that received the assistant"
            targets:
              - picture
          - id: intervention
            phrase: "if we assigned a specified population"
            targets:
              - picture
          - id: cut
            phrase: "removes its incoming arrows"
            targets:
              - picture
      - say: The other mechanisms remain in place. Risk still influences resolution, while it stops choosing the
          assigned workflow. This difference explains why conditioning on assistant use can yield a different
          number from intervening to route everyone to the assistant. The target population must be specified
          in both questions.
        hold: 0.6
        visual_cues:
          - id: survives
            phrase: "Risk still influences resolution"
            targets:
              - picture
      - say: The do notation names the comparison; the graph and evidence determine whether we can identify its value.
          If routing all tickets changes a shared queue, that interference belongs in the intervention model.
          A ticket-level estimate and a whole-queue policy effect can therefore answer different questions.
        hold: 0.75
        visual_cues:
          - id: queue
            phrase: "If routing all tickets changes a shared queue"
            targets:
              - picture
          - id: interference
            phrase: "that interference belongs in the intervention model"
            targets:
              - picture
          - id: policy
            phrase: "a whole-queue policy effect"
            targets:
              - picture
  - id: standardize
    title: "How many resolutions should the release team expect?"
    visual: "A target marker sets both trays to 70 easy and 30 hard tickets per hundred. Within-risk success heights stay fixed while their widths change. Counts of expected resolutions appear before the two totals."
    beats:
      - say: "The release team expects seventy easy tickets and thirty hard ones per hundred next week. Mark that mix on both trays. We have a resolution rate for each of those groups under each workflow."
        hold: 0.55
        visual_cues:
          - id: target
            phrase: "Mark that mix on both trays"
            targets: [picture]
      - say: "Line up the dividers. The assistant’s easy tickets resolved ninety percent of the time, so seventy easy tickets contribute sixty-three expected resolutions. Its hard tickets contribute fifteen. Control gets fifty-six from easy tickets and twelve from hard ones."
        hold: 0.6
        visual_cues:
          - id: align
            phrase: "Line up the dividers"
            targets: [picture]
          - id: contributions
            phrase: "Control gets fifty-six from easy tickets and twelve from hard ones"
            caption_boundary: true
            targets: [picture]
      - say: "Read the two sums. How many more resolutions per hundred does this comparison predict for the assistant?"
        hold: 2.3
        visual_cues:
          - id: predict
            phrase: "How many more resolutions per hundred"
            targets: [picture]
      - say: "Seventy-eight under the assistant and sixty-eight under control give ten more per hundred. We’ve standardized both rates to next week’s case mix. A causal interpretation requires both routes to be possible in each group. Within each group, the cases sent down either route must be comparable on their potential outcomes. Hidden urgency that affects both routing and resolution would break that assumption."
        hold: 0.7
        visual_cues:
          - id: estimate
            phrase: "Seventy-eight under the assistant and sixty-eight under control give ten more per hundred"
            caption_boundary: true
            targets: [picture]
      - say: "For that prediction to travel, the workflow versions, the resolution measure and the risk-specific rates must still apply next week. If routing changes the staff queue for other tickets, model that shared effect. Look at the easy assistant column again. Only ten actual tickets supplied the rate we just applied to seventy. How much could a single different outcome matter?"
        hold: 0.8
        visual_cues:
          - id: small
            phrase: "Only ten actual tickets"
            targets: [picture]
  - id: standardize-uncertainty
    title: Change one small cell and propagate the uncertainty
    visual: Ten actual low-risk assistant outcome tiles retain their positions while one success becomes failure
      in a labeled sensitivity case. Recompute the 70/30 result, restore the original counts, then show the
      four calculated binomial variance contributions and separately held standard error and interval.
    beats:
      - say: "Nine of these ten easy tickets resolved. What if just eight had resolved? Change one green ticket to red. The easy-ticket rate drops ten points. Easy tickets make up seventy percent of next week’s queue, so that one ticket takes seven points off the assistant’s lead. Its lead shrinks from ten points to three."
        hold: 1.65
        caption_starts:
          - "Change one green ticket to red"
          - "so that one ticket takes seven points"
          - "Its lead shrinks from ten points to three"
        visual_cues:
          - id: flip
            phrase: "Change one green ticket to red"
            targets:
              - picture
          - id: seven
            phrase: "so that one ticket takes seven points off the assistant’s lead"
            targets: [picture]
          - id: three
            phrase: "Its lead shrinks from ten points to three"
            targets:
              - picture
      - say: Return to the original counts. Under independent tickets, fixed target weights and conditional binomial
          sampling, estimate variance by summing squared stratum weights times the two cell variances. Each
          cell contributes its success rate times one minus that rate, divided by its sample size. Take the
          square root for the standard error.
        hold: 0.65
        visual_cues:
          - id: restore
            phrase: "Return to the original counts"
            targets:
              - picture
          - id: variance
            phrase: "estimate variance by summing squared stratum weights"
            targets:
              - picture
      - say: That gives about eight point seven seven percentage points of standard error. The
          ten-point estimate plus or minus one point nine six standard errors gives a rough interval from
          minus seven point two to twenty-seven point two points. The interval spans a loss and a gain.
          With just ten easy assistant tickets, the normal approximation can be rough. If tickets share
          staff or the target weights come from a sample, account for those sources of uncertainty too.
        hold: 0.65
        visual_cues:
          - id: se
            phrase: "eight point seven seven percentage points of standard error"
            targets:
              - picture
          - id: interval
            phrase: "from minus seven point two to twenty-seven point two points"
            targets:
              - picture
  - id: potential
    title: One ticket reveals one of its alternatives
    visual: Two potential-outcome columns appear, then each ticket’s actual assignment reveals only one cell;
      alternative population pairings share the same averages.
    beats:
      - say: For each ticket, imagine its outcome under the assistant and its outcome under control. Their difference
          is the individual treatment effect. At the original decision, the ticket receives one workflow, so
          we observe only that outcome. The alternative remains missing for that same ticket.
        hold: 0.6
        visual_cues:
          - id: receive
            phrase: "the ticket receives one workflow"
            targets:
              - picture
          - id: observed
            phrase: "we observe only that outcome"
            targets:
              - picture
          - id: missing
            phrase: "The alternative remains missing"
            targets:
              - picture
      - say: Two hypothetical populations can share assistant success of seventy-eight percent and control success of
          sixty-eight percent while pairing individual outcomes differently. One population helps ten tickets
          and harms none; another helps twenty and harms ten. Their average effect is identical, while their
          individual consequences differ.
        hold: 0.6
        visual_cues:
          - id: pop
            phrase: "Two hypothetical populations"
            targets:
              - picture
          - id: assistant-margin
            phrase: "assistant success of seventy-eight percent"
            targets:
              - picture
          - id: margins
            phrase: "and control success of sixty-eight percent"
            targets:
              - picture
          - id: first
            phrase: "One population helps ten tickets and harms none"
            targets:
              - picture
          - id: alternative
            phrase: "another helps twenty and harms ten"
            targets:
              - picture
      - say: Even an ideal randomized experiment can identify marginal outcome rates without revealing every
          within-ticket pairing. An individual counterfactual asks for additional structure or assumptions. A
          simulated replay can test an alternative inside its simulator, while its relevance to the historical
          event needs its own validation.
        hold: 0.75
        visual_cues:
          - id: experiment
            phrase: "Even an ideal randomized experiment"
            targets:
              - picture
  - id: estimands
    title: Keep the target population in the effect
    visual: Three population compositions scale the same low- and high-risk effect contributions. Keep the
      original homogeneous ten-point effects before introducing a separate four/sixteen-point vector. Hold
      each new sum and its completed geometry until the spoken result.
    beats:
      - say: The average treatment effect averages the difference between a ticket’s assistant and control potential
          outcomes over a specified population. The effect on the treated averages that same difference only
          among tickets assigned the assistant. Another control ticket does not reveal the missing original
          outcome for a treated ticket, and replaying later changes its history.
        hold: 0.65
        visual_cues:
          - id: treated
            phrase: "only among tickets assigned the assistant"
            targets:
              - picture
      - say: "Our original subgroup differences are both ten points, so changing their weights leaves that estimated
          difference unchanged. Now consider an explicitly different hypothetical effect vector: four points
          for low risk and sixteen for high risk. A fifty-fifty population averages ten points, while the
          treated ten-ninety mix averages fourteen point eight."
        hold: 0.65
        visual_cues:
          - id: equal
            phrase: "Our original subgroup differences are both ten points"
            targets:
              - picture
          - id: change-effects
            phrase: "Now consider an explicitly different hypothetical effect vector"
            targets:
              - picture
          - id: easy-effect
            phrase: "four points for low risk"
            targets:
              - picture
          - id: different
            phrase: "and sixteen for high risk"
            targets:
              - picture
          - id: half
            phrase: "A fifty-fifty population"
            targets:
              - picture
          - id: ate
            phrase: "averages ten points"
            targets:
              - picture
          - id: att-mix
            phrase: "the treated ten-ninety mix"
            targets:
              - picture
          - id: att
            phrase: "averages fourteen point eight"
            targets:
              - picture
      - say: The separate seventy-thirty deployment population would average seven point six points for that changed
          effect vector. This demonstrates why A T E and A T T can differ under selective routing and
          heterogeneous effects. A common-probability randomized assignment makes their population targets
          coincide under independence; finite realized treated subsets can still differ by chance.
        hold: 0.65
        visual_cues:
          - id: deploy
            phrase: "The separate seventy-thirty deployment population"
            targets:
              - picture
          - id: deployment
            phrase: "would average seven point six points"
            targets:
              - picture
  - id: harm-bounds
    title: Move the pairing while preserving both margins
    visual: Recolor a 100-person hypothetical response-type grid while retaining the 78/68 success margins. The
      four type counts follow h exactly. Reach the 22-harmed endpoint, then impose a separate no-harm
      assumption and return h to zero.
    beats:
      - say: The two success margins constrain individual response types without fixing their pairing. Let h be the
          number harmed per hundred. With seventy-eight assistant successes and sixty-eight control successes,
          always-resolves equals sixty-eight minus h, helped equals ten plus h, and never-resolves equals
          twenty-two minus h.
        hold: 0.65
        visual_cues:
          - id: margins
            phrase: "sixty-eight control successes"
            targets:
              - picture
      - say: All four counts must be nonnegative. Harm can therefore range from zero to twenty-two per hundred. At the
          upper endpoint the counts are forty-six always resolve, thirty-two helped, twenty-two harmed and
          zero never resolve. Both success margins remain unchanged. In general, binary harm cannot exceed
          either control success or assistant failure, so its maximum is the smaller of those two rates.
        hold: 0.65
        visual_cues:
          - id: range
            phrase: "Harm can therefore range from zero to twenty-two per hundred"
            targets:
              - picture
          - id: endpoint
            phrase: "forty-six always resolve, thirty-two helped, twenty-two harmed and zero never resolve"
            targets:
              - picture
      - say: A no-harm assumption removes the harmed category and fixes these four proportions for this binary
          setting, but not which ticket has each type. Positive average improvement does not establish that
          assumption, individual benefit or safety on another metric. Even ideal intervention marginals do not
          reveal the within-ticket pairing needed for an individual counterfactual.
        hold: 0.65
        visual_cues:
          - id: no-harm
            phrase: "A no-harm assumption removes the harmed category"
            targets:
              - picture
  - id: overlap
    title: Weights cannot create an unobserved action
    visual: Rare assignments expand under inverse-probability weights; a zero-support cell opens a visible hole in
      the comparison.
    beats:
      - say: Inverse-probability weighting gives more influence to assignments that were rare under the logging
          policy. An assistant ticket with assignment probability one tenth receives weight ten. This can
          balance measured groups toward a specified population when the relevant identification assumptions
          and propensity model are appropriate.
        hold: 0.6
        visual_cues:
          - id: rare
            phrase: "receives weight ten"
            targets:
              - picture
      - say: Large weights concentrate the estimate on a few observations. They do not create new independent tickets.
          If a workflow was impossible for a target group under the logging policy, its outcome for that group
          is unsupported. Reweighting cannot supply the missing comparison without extrapolation assumptions
          or new data.
        hold: 0.6
        visual_cues:
          - id: impossible
            phrase: "If a workflow was impossible for a target group"
            targets:
              - picture
          - id: missing
            phrase: "its outcome for that group is unsupported"
            targets:
              - picture
      - say: Inspect support, covariate balance, and weight concentration. Clipping can trade variance for bias, and
          fitting a propensity model cannot remove hidden common causes by itself. A randomized comparison
          with well-defined workflows can address assignment confounding, while missing outcomes and shared
          queues still require careful design.
        hold: 0.75
        visual_cues:
          - id: inspect
            phrase: "Inspect support"
            targets:
              - picture
  - id: weighted-tickets
    title: "How much does each ticket count?"
    visual: "The same 200 logged outcomes acquire inverse-assignment weights. The rare and common groups each supply 100 units per arm. Weighted successes and total weight remain paired in the normalized rates."
    beats:
      - say: "Return to the original log. Half the tickets were easy and half were hard. Look at the chance of getting the assistant. It was one in ten for easy tickets and nine in ten for hard tickets. Those are routing probabilities. To weight a ticket, divide one by the chance of the route it actually took. For a control ticket, that chance is one minus the assistant probability."
        hold: 0.65
        visual_cues:
          - id: propensity
            phrase: "one in ten for easy tickets and nine in ten for hard tickets"
            targets: [picture]
      - say: "Start with the ten easy tickets that got the assistant. Each counts ten times, for one hundred units of weight. The ninety hard tickets each count ten ninths, also one hundred units. For control, the rare assignment is a hard ticket. Its ten hard tickets carry as much weight as its ninety easy ones. That gives each arm two hundred units of weight from just a hundred actual tickets."
        hold: 0.65
        visual_cues:
          - id: rare
            phrase: "for one hundred units of weight"
            targets: [picture]
          - id: common
            phrase: "also one hundred units"
            targets: [picture]
          - id: control
            phrase: "For control, the rare assignment is a hard ticket"
            targets: [picture]
          - id: mass
            phrase: "That gives each arm two hundred units of weight"
            targets: [picture]
      - say: "Now count only the green area. The assistant has one hundred forty weighted successes and control has one hundred twenty. Divide by two hundred in each arm. At the log’s half-easy mix, you get seventy percent and sixty percent. At the deployment mix, seventy percent easy, you got seventy-eight and sixty-eight. The two gaps agree here because both risk groups have the same ten-point difference."
        hold: 0.65
