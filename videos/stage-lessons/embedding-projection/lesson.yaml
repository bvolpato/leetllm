  - id: tsne
    title: t-SNE pulls a pair whose neighbor probability is lost
    visual: A local pair receives probability 0.10 in the original space and 0.01 in the map. Bringing
      it closer raises its map probability and reduces its illustrative KL term.
    beats:
      - say: t-SNE turns high-dimensional distances into probabilities of neighboring pairs. It adjusts
          points in the map to make its pair probabilities agree with those original neighborhoods.
        hold: 0.6
        visual_cues:
          - id: tsne-beat-1-focus-1
            phrase: make its pair probabilities agree with those original
            targets:
              - tsne-mechanism
            color: blue
            linger: 0.6
          - id: tsne-beat-1-focus-2
            phrase: It adjusts points in the map to make
            targets:
              - tsne-mechanism
            color: blue
            linger: 0.6
      - say: For one illustrative pair, suppose the original probability is zero point one zero and the map
          probability is zero point zero one. Its contribution, p times the natural log of p over q,
          is about zero point two three zero.
        hold: 0.65
        visual_cues:
          - id: tsne-beat-2-focus-1
            phrase: original probability is zero point one zero and the map probability is zero point zero one
            targets:
              - tsne-mechanism
            color: blue
            linger: 0.6
          - id: tsne-beat-2-focus-2
            phrase: Its contribution, p times the natural log of p over q, is about zero point two three zero
            targets:
              - tsne-mechanism
            color: blue
            linger: 0.6
      - say: Move that pair closer until the map probability reaches zero point one zero. This pair's
          contribution falls to zero. Moving a point changes its distances to the other points too. The full objective
          adds up the contributions from all ordered pairs.
        hold: 0.75
        visual_cues:
          - id: tsne-beat-3-focus-1
            phrase: Move that pair closer until the map probability reaches zero point one zero
            targets:
              - tsne-mechanism
            color: blue
            linger: 0.6
          - id: tsne-zero
            phrase: This pair's contribution falls to zero
            targets:
              - tsne-mechanism
  - id: tsne-contract
    title: What sets one edge’s share of the map?
    visual: Two Gaussian weight rows build the symmetric source target. A triangle then shares map
      probability among six ordered pairs. The cyan base stays fixed as the yellow apex rises and both
      other weights shrink.
    beats:
      - say: Start in the source vectors at A. In this example its Gaussian weight for B is four times its
          weight for C. Divide by the row total. B gets four fifths of A's neighbor probability, and C
          gets one fifth. Each point has its own bandwidth. Adjusting it changes the spread of its row.
          The exponential of that row’s entropy, using natural logs, is its perplexity, an effective
          neighbor count.
        hold: 0.7
        visual_cues:
          - id: ts-row
            phrase: Divide by the row total
            targets:
              - tsne-contract-mechanism
      - say: Now read the row from B. Here B also gives A four fifths. Add the two directions, then divide by
          twice the number of points. With three points, that's one point six divided by six, about
          point two six seven. That's the source target for the ordered pair from A to B. Self-pairs get
          zero.
        hold: 0.65
        visual_cues:
          - id: ts-reverse
            phrase: read the row from B
            targets:
              - tsne-contract-mechanism
          - id: ts-target
            phrase: about point two six seven
            targets:
              - tsne-contract-mechanism
      - say: On the map, the cyan base is two units long. Its weight is one divided by one plus two squared,
          or one fifth. Each sloping edge has squared length two, so its weight is one third. Count both
          directions for each of the three edges. Their six weights sum to about one point seven three.
