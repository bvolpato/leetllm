  - id: methods
    title: Linear variance and local neighbors are different targets
    visual: A centered point cloud rotates onto its leading variance direction beside a separate
      local-neighbor graph whose edge list remains explicit.
    beats:
      - say: Principal component analysis, or PCA, is a linear projection. It finds directions with large
          variation across the fitted data, then maps points onto the leading directions. Its
          objective measures how much overall variance remains.
        hold: 0.6
        visual_cues:
          - id: methods-beat-1-focus-1
            phrase: It finds directions with large variation across the fitted data
            targets:
              - methods-mechanism
            color: blue
            linger: 0.6
          - id: methods-beat-1-focus-2
            phrase: Principal component analysis
            targets:
              - methods-mechanism
            color: blue
            linger: 0.6
          - id: axis-sweep
            phrase: directions with large variation
            targets:
              - methods-mechanism
            linger: 0.5
          - id: axis-project
            phrase: then maps points onto the leading directions
            targets:
              - methods-mechanism
            linger: 0.5
      - say: "A nearest-neighbor map asks a different question: which points should remain local neighbors?
          t-SNE and UMAP build low-dimensional layouts around neighborhood relationships, using
          different probability or graph objectives."
        hold: 0.65
        visual_cues:
          - id: methods-beat-2-focus-1
            phrase: "A nearest-neighbor map asks a different question: which"
            targets:
              - methods-mechanism
            color: blue
            linger: 0.6
          - id: methods-beat-2-focus-2
            phrase: "different question: which points should remain local neighbors"
            targets:
              - methods-mechanism
            color: blue
            linger: 0.6
      - say: A high-variance direction may reflect a broad topic. A low-variance direction can distinguish
          two policy clauses that a user needs kept apart. Compare neighbor lists and judged
          retrieval queries alongside explained variance.
        hold: 0.7
        visual_cues:
          - id: methods-beat-3-focus-1
            phrase: A high-variance direction may reflect a broad topic
            targets:
              - methods-mechanism
            color: blue
            linger: 0.6
  - id: pca-fit
    title: Construct a fitted coordinate system
    visual: A progressive numerical construction retains the policy vectors, fitted artifacts and
      measured distinctions through this chapter.
    beats:
      - say: "Start with points one comma one, two comma two and three comma three. Their mean is two comma
          two. Subtract that same mean from every row: the centered points are minus one comma minus
          one, zero comma zero, and one comma one. Project onto the unit direction one comma one
          divided by the square root of two. The coordinates become minus square root of two, zero
          and positive square root of two."
        hold: 0.75
        visual_cues:
          - id: pca-mean
            phrase: Their mean is two comma two
            targets:
              - pca-fit-mechanism
            linger: 0.5
          - id: pca-center
            phrase: Subtract that same mean
            targets:
              - pca-fit-mechanism
            linger: 0.5
          - id: pca-axis
            phrase: Project onto the unit direction
            targets:
              - pca-fit-mechanism
            linger: 0.5
          - id: pca-scores
            phrase: The coordinates become minus square root of two, zero and positive square root of two
            targets:
              - pca-fit-mechanism
            linger: 0.5
      - say: For an N by d centered data matrix, thin singular value decomposition writes X as U Sigma V
          transpose. With r equal to the smaller of N and d, U is N by r and V is d by r. Centering
          limits rank to at most the smaller of N minus one and d. The leading columns of V give the
          retained directions. Covariance eigenvalues are the squared singular values divided by N
          minus one when N exceeds one. Explained variance retained is the retained sum of squared
          singular values divided by the total.
        hold: 0.75
        visual_cues:
          - id: svd-shapes
            phrase: thin singular value decomposition
            targets:
              - pca-fit-mechanism
            linger: 0.5
          - id: centered-rank
            phrase: Centering limits rank
            targets:
              - pca-fit-mechanism
            linger: 0.5
          - id: pca-covariance
            phrase: Covariance eigenvalues
            targets:
              - pca-fit-mechanism
            linger: 0.5
          - id: pca-energy
            phrase: Explained variance retained is the retained sum of squared singular values divided by the total
            targets:
              - pca-fit-mechanism
            linger: 0.5
      - say: Forming X transpose X squares the matrix condition number and can worsen numerical sensitivity;
          direct SVD avoids that explicit product. Some PCA solvers use covariance, so record the
          actual solver. PCA centers features without automatically standardizing them. Scaling and
          whitening change the geometry and need their own validation. Fit supervised preprocessing
          inside each training fold; select dimensions on development queries and reserve fresh test
          queries.
        hold: 0.75
        visual_cues:
          - id: pca-condition
            phrase: squares the matrix condition number
            targets:
              - pca-fit-mechanism
            linger: 0.5
          - id: pca-whiten
            phrase: Scaling and whitening
            targets:
              - pca-fit-mechanism
            linger: 0.5
          - id: pca-fold
            phrase: inside each training fold
            targets:
              - pca-fit-mechanism
            linger: 0.5
  - id: pca-query
    title: Measure from the saved origin
    visual: The arrow tips stay fixed as their common origin slides to the fitted mean. Unit-length arrows
      expose a dot-product cosine of minus one. A new query at the mean has no direction.
    beats:
      - say: A document sits at three, one. Its query sits at one, three. From the original origin the arrows
          make an acute angle. Their dot product is six, and the product of their lengths is ten. That's
          a cosine of point six. We'll keep both axes and use the identity basis.
        hold: 0.55
      - say: Move the common origin to the saved mean, two, two. Leave the tips where they are. The document
          now points one step right and one down. The query points one left and one up. From this new
          origin, what is their cosine?
        hold: 2.3
        visual_cues:
          - id: pca-move-origin
            phrase: Move the common origin
            targets:
              - pca-query-mechanism
          - id: pca-centered
            phrase: one left and one up
            targets:
              - pca-query-mechanism
          - id: pca-ask-cos
            phrase: what is their cosine
            targets:
              - pca-query-mechanism
      - say: It's minus one. The arrows point in opposite directions. Centering changed the angle even though
          we kept every coordinate. To use a dot product for cosine search, shorten both arrows to unit
          length. Now their dot product changes from minus two to minus one.
        hold: 0.7
        visual_cues:
          - id: pca-opposite
            phrase: It's minus one
            targets:
              - pca-query-mechanism
            caption_boundary: true
          - id: pca-unit
            phrase: shorten both arrows
            targets:
              - pca-query-mechanism
          - id: pca-unit-dot
            phrase: their dot product changes from minus two to minus one
            targets:
              - pca-query-mechanism
      - say: Try a query at the mean itself. Subtraction leaves a zero vector. Its cosine is undefined. Reject
          a zero or nonfinite input and check the length after projection too. For very large finite
          values, dividing by the largest absolute coordinate before taking the norm avoids overflow.
        hold: 0.6
        visual_cues:
          - id: pca-mean-query
            phrase: Try a query at the mean
            targets:
              - pca-query-mechanism
          - id: pca-undefined
            phrase: Its cosine is undefined
            targets:
              - pca-query-mechanism
      - say: Save the encoder version, mean, ordered directions and normalization policy with the index. A new
          worker must reuse them. Even a change as small as an axis sign has to agree on both sides. If
          one direction dominates the corpus, use judged policy queries to find out whether removing it
          costs an answer.
        hold: 0.7
  - id: recall-sweep
    title: How short can this policy index go?
    visual: "Count judged chunk hits at each retained dimension, then hold six dimensions fixed while
      document noise changes. The two runs of query #1 show which returned IDs displaced relevant
      chunks."
    beats:
      - say: On a small corpus of sixty documents with six coordinates, keeping two principal components
          retains ninety-nine point two percent of the variance. One rotation query still finds its
          theme. Now we need to know how many relevant clauses survive across different questions.
        hold: 0.6
        visual_cues:
          - id: sweep-first
            phrase: ninety-nine point two percent of the variance
            targets:
              - recall-sweep-mechanism
      - say: Start a new experiment. There are twenty queries in twenty-four dimensions. Each query has three
          judged relevant chunks, and the index can return three. That gives us sixty chances to recover
          a relevant chunk. Fit PCA on the documents, then project the queries with the same transform.
          The blue row measures how much of the documents' spread survives.
        hold: 0.6
        visual_cues:
          - id: sweep-new
            phrase: Start a new experiment
            targets:
              - recall-sweep-mechanism
          - id: sweep-spread
            phrase: The blue row
            targets:
              - recall-sweep-mechanism
      - say: Count the retrieved chunks. At two dimensions we recover twenty-three of the sixty. At eight we
          get all sixty, even though the projection keeps only about seventy-three percent of the
          variance. Suppose our development recall floor is ninety-five percent. Which is the shortest
          tested index that clears it?
        hold: 2.4
        visual_cues:
          - id: sweep-hits
            phrase: Count the retrieved chunks
            targets:
              - recall-sweep-mechanism
          - id: sweep-floor
            phrase: development recall floor
            targets:
              - recall-sweep-mechanism
      - say: Six dimensions clear it. That index retrieves fifty-eight of the sixty chunks. Four dimensions
          recover only fifty-two. At twelve dimensions more variance survives, but we've already
          recovered everything on these queries at eight.
        hold: 0.85
        visual_cues:
          - id: sweep-six
            phrase: Six dimensions clear it
            targets:
              - recall-sweep-mechanism
            caption_boundary: true
      - say: Follow query number one through the six-dimensional index. The relevant chunk IDs are three, four
          and five. All three are in its first result. Now increase the document noise from point one
          one to point two. Use the same random seed, refit on those documents, and replay the same
          queries.
        hold: 0.7
        visual_cues:
          - id: sweep-query
            phrase: Follow query number one
            targets:
              - recall-sweep-mechanism
          - id: sweep-noise
            phrase: increase the document noise
            targets:
              - recall-sweep-mechanism
      - say: This time the index returns three, two and thirty-five. Only chunk three still answers this
          query. Across the twenty queries, forty-seven of sixty relevant chunks survive. That's a
          recall of point seven eight three. Even the full-space index now misses two. Check the
          original retrieval before blaming the projection for every loss. Separate related query
          families, freeze the candidate on development data, and use fresh queries and full resource
          measurements for a final result.
        hold: 0.8
        visual_cues:
          - id: sweep-ids
            phrase: returns three, two and thirty-five
            targets:
              - recall-sweep-mechanism
          - id: sweep-count
            phrase: forty-seven of sixty relevant chunks survive
            targets:
              - recall-sweep-mechanism
