  - id: budget
    title: How much room does the shorter vector buy?
    visual: Six equal sections represent the 1,536 float32 coordinates. Five sections empty, the live
      coordinate count falls to 256, and the byte ledger compares the same ten million records.
    beats:
      - say: There is a reason to try shortening these vectors. One policy record has fifteen hundred
          thirty-six coordinates. At four bytes per float, that record takes six thousand one hundred
          forty-four bytes before the graph or metadata.
        hold: 0.6
        visual_cues:
          - id: budget-beat-1-focus-1
            phrase: six thousand one hundred forty-four bytes
            targets:
              - budget-mechanism
      - say: Keep just two hundred fifty-six coordinates. Each record now takes one thousand twenty-four
          bytes. For ten million records, the raw array goes from sixty-one point four four to ten point
          two four decimal gigabytes.
        hold: 0.7
        visual_cues:
          - id: budget-shrink
            phrase: Keep just two hundred fifty-six coordinates
            targets:
              - budget-mechanism
          - id: budget-small
            phrase: one thousand twenty-four bytes
            targets:
              - budget-mechanism
          - id: budget-totals
            phrase: ten point two four decimal gigabytes
            targets:
              - budget-mechanism
      - say: The raw array takes one sixth of the space. The same byte count can still buy very different
          search quality. You'll need both the full index cost and the number of relevant clauses that
          reach the reader.
        hold: 0.7
        visual_cues:
          - id: budget-beat-3-focus-1
            phrase: one sixth of the space
            targets:
              - budget-mechanism
  - id: geometry-budget
    title: Count vector bytes and state the geometry assumption
    visual: A progressive numerical construction retains the policy vectors, fitted artifacts and
      measured distinctions through this chapter.
    beats:
      - say: High dimension can make intuition unreliable. For two independent isotropic Gaussian vectors
          with coordinate variance sigma squared, their squared distance has mean two d sigma
          squared and variance eight d sigma to the fourth. Its standard deviation divided by its
          mean is the square root of two divided by d. Relative squared-distance variation therefore
          shrinks as dimension grows in this model. Learned embeddings need not satisfy its
          independence or isotropy assumptions.
        hold: 0.75
        visual_cues:
          - id: gaussian-mean
            phrase: mean two d sigma squared
            targets:
              - geometry-budget-mechanism
            linger: 0.5
          - id: gaussian-var
            phrase: variance eight d sigma to the fourth
            targets:
              - geometry-budget-mechanism
            linger: 0.5
          - id: gaussian-ratio
            phrase: square root of two divided by d
            targets:
              - geometry-budget-mechanism
            linger: 0.5
      - say: The raw vector ledger excludes document text, identifiers, graph links, levels and allocator
          overhead. HNSW connection and search parameters also affect recall, memory and work.
          Reducing dimension lowers coordinate storage and arithmetic, but it does not determine
          end-to-end latency or graph quality. Measure the full index and serving request after the
          exact representation, metric and search settings are fixed.
        hold: 0.75
        visual_cues:
          - id: index-overhead
            phrase: raw vector ledger excludes
            targets:
              - geometry-budget-mechanism
            linger: 0.5
          - id: index-settings
            phrase: HNSW connection and search parameters
            targets:
              - geometry-budget-mechanism
            linger: 0.5
