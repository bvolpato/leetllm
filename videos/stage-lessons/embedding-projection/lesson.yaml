            caption_boundary: true
      - say: "Drop z again. Merge lands on the question. Those eight units were the entire separation. This is
          dimensionality reduction: we kept x and y and threw away a coordinate. Use the map to find a
          suspicious neighbor, then check the original vectors and the clause the reader actually
          needs."
        hold: 0.8
