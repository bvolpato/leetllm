            phrase: original values of z
            targets:
              - projection-mechanism
          - id: window-ask
            phrase: With z restored
            targets:
              - projection-mechanism
      - say: Lift merge back to its original position. Watch its distance travel from zero to eight while the
          other two stay put. Rotation is now the nearest clause. That's the one that tells the reader
