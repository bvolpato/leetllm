    beats:
      - say: Here are the original values of z. The query, rotation and access all have zero there. Merge has
          eight. The rails measure distance from the query. Rotation is one unit away along x, and
          access is two away along y. With z restored, which clause will be closest?
        hold: 2.4
        visual_cues:
