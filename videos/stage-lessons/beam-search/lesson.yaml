  - id: speculative-balance
    title: Restore target mass after rejecting a draft
    visual: A three-token mass ledger routes actual accepted proposal mass and positive residual correction into
      exactly the target bins. An unadjusted redraw takes a separate visibly biased route; identical and
      disjoint supports receive explicit boundary decisions.
    beats:
      - say: Exact speculative sampling aims to accelerate a specified target policy while preserving its output
          distribution in ideal arithmetic. At one position, draw from the actual draft distribution q. Accept
          a proposed token with the smaller of one and its target probability p divided by its draft
          probability q. Accepted proposal mass at that token is the smaller of p and q. A draft cannot
          propose a token to which its own distribution gives zero mass.
        hold: 0.6
        visual_cues:
          - id: speculative-balance-build-0
            phrase: Accepted proposal mass at that token is the smaller of p and q
            targets:
              - speculative-balance-state-0
            color: cyan
            linger: 0.55
      - say: "The article supplies target probabilities point six, point three and point one, and draft probabilities
          point eight, point one and point one. Accepted mass is point six, point one and point one, totaling
          point eight. Rejection probability is point two. Take the positive part of target minus draft and
          normalize it: all the residual mass belongs to the second token, revoke. Adding that correction
          restores the target row exactly."
        hold: 0.6
        visual_cues:
          - id: speculative-balance-build-1
            phrase: Adding that correction restores the target row exactly
            targets:
              - speculative-balance-state-1
            color: cyan
            linger: 0.55
      - say: "Redrawing from the original target on rejection gives create too much mass. It ends up at point seven two, while revoke falls to point one six and rename gets point one two. If the target and draft already agree, every proposal passes. Apply the correction using the actual draft probabilities and the target probabilities after its temperature, filters and masks. That recovers the target’s frequencies across draws. Individual runs can still produce different text with the same seed."
        hold: 0.8
        visual_cues:
          - id: speculative-balance-build-2
            phrase: Redrawing from the original target
            targets:
              - speculative-balance-state-2
            color: cyan
            linger: 0.55
