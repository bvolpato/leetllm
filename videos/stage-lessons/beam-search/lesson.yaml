            phrase: choose which states to expand, prune or revisit
            targets:
              - thought-search-state-0
            color: cyan
            linger: 0.55
      - say: "Watch A and B on the left. Breadth-first visits both before it goes down a level. On the right, depth-first follows A to a leaf, then backtracks to try another branch. If the evaluator prunes B, both searches lose the chance to visit its children."
        hold: 0.6
        visual_cues:
