            targets:
              - thought-search-state-1
            color: cyan
            linger: 0.55
      - say: "Monte Carlo Tree Search uses earlier simulations to decide which branch to visit next. In methods such as RAP it selects a branch, expands it, simulates an outcome and sends its reward back up the path. Here A has eight visits and B has only two. Add an exploration bonus to each mean reward. With weight one, take the log of the parent's visit count, divide by the child's visit count, then take the square root. B has both the higher mean and the larger bonus. Its score is about one point six seven, ahead of A at point nine four. Choose B. This visit returns a reward of point two. Add it to B's reward total and count one more visit. One point four across three visits gives a mean of about point four six seven. Send the same reward up to the parent. Four point six across eleven visits gives a mean of about point four one eight. Both averages are ready for the next selection."
        hold: 0.8
