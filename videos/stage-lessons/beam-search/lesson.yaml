  - id: thought-search
    title: Which branch gets the next visit?
    visual: A finite thought tree computes breadth-first and depth-first frontier changes, then a separate
      two-branch MCTS fixture selects from actual means plus exploration bonuses and backs one supplied reward
      up to its ancestors.
    beats:
      - say: "In a thought tree each branch continues a partial solution by one reasoning step. Evaluate the proposed steps, then choose which states to expand, prune or revisit. In the original Tree of Thoughts experiments, the model itself judged which branches looked promising."
        hold: 0.6
