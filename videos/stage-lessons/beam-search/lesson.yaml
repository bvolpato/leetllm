scenes:
  - id: policy-premise
    title: Which word fills the blank?
    visual: A pin travels across the next-token probability strip. The word under its tip fills the sampled slot. Beside it, the highest-scoring word fills the greedy slot. The key rotation guide gives the two words their meaning.
    beats:
      - say: "Follow the pin. The sampler drew a point three quarters of the way along this strip. Which word goes in the blank?"
        hold: 2.2
        visual_cues:
          - id: draw-pin
            phrase: "three quarters"
            targets: [draw-position]
      - say: "Revoke. The pin landed in its stretch of blue. The sampler draws uniformly along the strip, so a wider stretch gives a word a better chance."
        hold: 0.55
        visual_cues:
          - id: sample-word
            phrase: "Revoke"
            targets: [sample-output]
            caption_boundary: true
      - say: "Here are the scores behind that strip. Fill the same blank by taking the highest score. Which word wins this time?"
        hold: 2
        visual_cues:
          - id: scores
            phrase: "the scores behind that strip"
            targets: [logits]
      - say: "Create wins with a score of three. Taking the highest score at each step is greedy decoding."
        hold: 0.55
        visual_cues:
          - id: greedy-word
            phrase: "Create wins"
            targets: [greedy-output]
            caption_boundary: true
      - say: "Read the guide. Create a replacement key, deploy it, then revoke the old key. Our draw picked the last step first. Each answer now ends in a different word, so the model sees a different history when it scores the next token. Beam search keeps several histories around to see where they lead."
        hold: 0.8
        visual_cues:
          - id: guide-order
            phrase: "Read the guide"
            targets: [guide]
  - id: search-space
    title: Follow a path instead of enumerating the tree
    visual: An actual bounded three-way tree expands by depth; a distinct logarithmic count ruler extends the
      multiplication to the supplied32000-token,100-position example. A single ancestral sample follows one
      retained path.
    beats:
      - say: At each position, the model supplies a conditional distribution given the prompt and every generated
          token so far. Multiply those conditional probabilities along a path to obtain its joint probability.
          Adding log probabilities gives the same ranking while avoiding long products of tiny numbers. A
          direct stable log-softmax can retain a log probability even when its ordinary probability
          underflows.
        hold: 0.6
        visual_cues:
          - id: search-space-build-0
            phrase: Multiply those conditional probabilities along a path
            targets:
              - search-space-state-0
            color: cyan
            linger: 0.55
      - say: "At every fork there are three choices. Three choices for three positions already give twenty-seven paths. With V choices at each of T positions, the bottom row has V to the power T leaves. With a thirty-two-thousand-token vocabulary and one hundred positions, that's about three point two seven times ten to the power four hundred fifty. An end token can stop a path sooner, and a grammar can rule out branches."
        hold: 0.6
        visual_cues:
          - id: search-space-build-1
            phrase: Three choices for three positions already give twenty-seven paths
            targets:
              - search-space-state-1
            color: cyan
            linger: 0.55
          - id: search-space-large-vocabulary
            phrase: thirty-two-thousand-token vocabulary
            targets:
              - search-space-state-1
            color: cyan
            linger: 0.55
      - say: "In a model where two paths reach the same state and have the same future choices, Viterbi can keep just the better path to that state. A transformer usually gives different next-token probabilities after different prefixes. A KV cache speeds up scoring each prefix. To sample a whole path, draw one conditional token at a time. This is ancestral sampling. The chance of following a particular path is the product of its edge probabilities."
        hold: 0.8
        visual_cues:
          - id: search-space-build-2
            phrase: draw one conditional token at a time
            targets:
              - search-space-state-2
            color: cyan
            linger: 0.55
  - id: logit-shift
    title: Turn scores into one normalized row
    visual: Four stable token identities move from logits through maximum subtraction and exponentiation into a
      unit-mass categorical strip. The normalization is computed from the current values, with a movable
      uniform draw kept separate from the mode.
    beats:
      - say: "Each word has a raw score called a logit. Create has three and quota has negative one. Softmax turns all four scores into probabilities that sum to one. Which word will get the biggest share?"
        hold: 1.8
        visual_cues:
          - id: logit-shift-build-0
            phrase: all four scores
            targets:
              - logit-shift-state-0
            color: cyan
            linger: 0.55
      - say: "Create leads. Subtract three, the largest score, from every entry. The shifted scores are zero, negative point five, negative two and negative four. Now exponentiate. The first weight is one, and the others are smaller. Together they weigh about one point seven six. Divide each weight by their sum. Create gets about fifty-seven percent of the strip. The shift divided all four weights by the same factor, so it leaves their shares unchanged."
        hold: 0.6
        visual_cues:
          - id: logit-shift-build-1
            phrase: Create leads
            targets:
              - logit-shift-state-1
            color: cyan
            linger: 0.55
          - id: logit-shift-subtract
            phrase: Subtract three, the largest score, from every entry
            targets:
              - logit-shift-subtracted-row
            color: cyan
            linger: 0.3
          - id: logit-shift-exponentiate
            phrase: Now exponentiate
            targets:
              - logit-shift-exponential-row
            color: yellow
            linger: 0.3
          - id: logit-shift-normalize
            phrase: Divide each weight by their sum
            targets:
              - logit-shift-probability-row
            color: cyan
            linger: 0.45
          - id: shift-result
            phrase: The shifted scores are zero, negative point five, negative two and negative four
            targets:
              - calculated-row
          - id: normalize-result
            phrase: Create gets about fifty-seven percent
            targets:
              - calculated-row
      - say: "A uniform draw at point seven five lands in revoke’s interval. That gives us one word. The rest of the sentence could still say to revoke the old key after deploying its replacement."
        hold: 0.8
        visual_cues:
          - id: logit-shift-build-2
            phrase: A uniform draw at point seven five lands in revoke’s interval
            targets:
              - logit-shift-state-2
            color: cyan
            linger: 0.55
  - id: logit-boundaries
    title: Keep overflow, masks and tiny log probabilities distinct
    visual: An exponent ruler exposes raw exp1000 overflow, then max subtraction. A separate all-masked row fails
      explicitly, and a tiny finite log probability stays on a log ruler after ordinary probability rounds to
      zero.
    beats:
      - say: Now supply logits one thousand, nine hundred ninety-nine and nine hundred ninety-eight. Direct
          exponentiation overflows ordinary floating-point math. Subtracting the maximum leaves zero, negative
          one and negative two, whose exponentials fit and produce about point six six five, point two four
          five and point zero nine zero. This operation preserves the mathematical distribution; it changes
          the numerical route.
        hold: 0.6
        visual_cues:
          - id: logit-boundaries-build-0
            phrase: Subtracting the maximum leaves zero, negative one and negative two
            targets:
              - logit-boundaries-state-0
            color: cyan
            linger: 0.55
          - id: logit-boundaries-exponentiate
            phrase: whose exponentials fit
            targets:
              - logit-boundaries-state-0
            color: yellow
            linger: 0.35
          - id: stable-result
            phrase: produce about point six six five, point two four five and point zero nine zero
            targets:
              - calculated-row
      - say: An extreme negative gap can still underflow its probability to zero. Taking a logarithm after that
          rounding cannot recover the original finite log probability; calculate log-softmax directly when you
          need that quantity. Negative infinity deliberately masks a token. If every token is masked, this lab
          rejects the row rather than dividing zero by zero. Its actual code also rejects NaN and positive
          infinity.
        hold: 0.8
        visual_cues:
          - id: logit-boundaries-build-1
            phrase: If every token is masked, this lab rejects the row
            targets:
              - logit-boundaries-state-1
            color: cyan
            linger: 0.55
  - id: greedy-loop
    title: Append the chosen token before asking again
    visual: The actual two-step article fixture shows the current prefix, its own conditional row and a distinct
      next row after appending create. Greedy ownership stays separate from model weights and KV reuse.
    beats:
      - say: Greedy selects the largest score at the current position. The article’s first row selects create. Append
          that token to the prompt before looking at the next row. In this supplied two-step fixture, the
          second scores are four for a period, one point five for then, and point five for after. Predict
          which token is appended next.
        hold: 0.6
        visual_cues:
          - id: greedy-loop-build-0
            phrase: Append that token to the prompt before looking at the next row
            targets:
              - greedy-loop-state-0
            color: cyan
            linger: 0.55
      - say: "The period wins. The answer now reads, “The first rotation step is create.” A period adds punctuation. An end token tells the decoder to stop. With identical logits and a fixed tie rule, greedy decoding repeats the same choice. Numerical differences in the runtime can change those logits. The KV cache saves attention state for the prefix so the model can reuse it when scoring the next word."
        hold: 0.8
        visual_cues:
          - id: greedy-loop-build-1
            phrase: The period wins
            targets:
              - greedy-loop-state-1
            color: cyan
            linger: 0.55
  - id: opening
    title: "Which opening is worth keeping?"
    visual: The article’s two-token tree feeds two answer slots. Each retained opening is paired with its strongest next token and their product. The final beat hands off to Mia’s four-token lattice.
    beats:
      - say: "Finish “You should” in exactly two tokens. These are new probabilities. Read the probabilities beside each opening. Forty percent of the mass goes to the word ‘create’. Thirty-five goes to ‘first’, and the last quarter goes to ‘revoke’. If you can keep just one opening, which one gets the next turn?"
        hold: 2.05
        visual_cues:
          - id: opening-row
            phrase: "new probabilities"
            targets: [first-choices]
      - say: "Create. Its best next token is a period, with a one-in-five chance on that branch. Multiply the two edges. That whole path gets eight percent."
        hold: 0.7
        visual_cues:
          - id: one-kept
            phrase: "Create"
            targets: [greedy-opening]
          - id: one-child
            phrase: "best next token is a period"
            targets: [greedy-child]
          - id: one-product
            phrase: "That whole path gets eight percent"
            targets: [greedy-product]
            caption_boundary: true
      - say: "Rewind to the same three openings. This time keep two. Create keeps its slot, first gets the second, and revoke drops out. After first, create has a seventy percent chance. Which two-token path takes the lead?"
        hold: 2.15
        visual_cues:
          - id: two-kept
            phrase: "first gets the second"
            targets: [second-opening]
          - id: two-child
            phrase: "seventy percent chance"
            targets: [second-child]
      - say: "The pair is ‘first create’. Thirty-five percent times seventy percent gives twenty-four and a half percent. A smaller first branch won because more of its mass stayed on one continuation. The period on the other branch was ordinary punctuation. Both paths ended at the two-token limit."
        hold: 0.75
        visual_cues:
          - id: two-winner
            phrase: "The pair is ‘first create’"
            targets: [winning-path]
            caption_boundary: true
          - id: two-product
            phrase: "twenty-four and a half percent"
            targets: [beam-product]
            caption_boundary: true
      - say: "Now start a sentence with Mia. Each word counts as one token. Here a path finishes only when it emits the end token, E O S. Keep finished paths aside and give the others up to four generated tokens, counting E O S. Rank unfinished paths by cumulative log probability, breaking ties alphabetically."
        hold: 0.75
        visual_cues:
          - id: mia-rules
            phrase: "start a sentence with Mia"
            targets: [mia-lattice]
  - id: probabilities
    title: Each edge scores a conditional choice
    visual: The opening row sums to one; a separate pair of prefix-labeled lanes multiplies successive conditional
      probabilities; an EOS row distinguishes finishing from extending the completed phrase.
    beats:
      - say: Given the same prefix, the model assigns mass across its next-token choices. Opened receives the largest
          share, looked receives a little less, and slept receives the smallest. These supplied toy
          probabilities let us trace each branch.
        hold: 0.5
        visual_cues:
          - id: probabilities-beat-1-focus-1
            phrase: Opened receives the largest share
            targets:
              - probabilities-active-bars
            color: yellow
            linger: 0.6
          - id: probabilities-beat-1-focus-2
            phrase: the model assigns mass across its next-token choices
            targets:
              - probabilities-active-bars
            color: blue
            linger: 0.6
      - say: A complete path needs another conditional choice after every unfinished word. Multiply the edge
          probabilities along one path to obtain its joint probability. In log space, add each edge's log
          probability and keep the same ranking without tiny repeated products.
        hold: 0.55
        visual_cues:
          - id: probabilities-beat-2-focus-1
            phrase: Multiply the edge probabilities along one path to obtain its joint probability
            targets:
              - probabilities-equation-string-raw-p-text-opened-the-p-text-opened-mid-tex-13
            color: blue
            linger: 0.6
          - id: probabilities-beat-2-focus-2
            phrase: A complete path needs another conditional choice after every unfinished word
            targets:
              - probabilities-active-bars
            color: yellow
            linger: 0.6
      - say: A period and an end-of-sentence token have different meanings in a tokenizer. We will use the explicit
          EOS marker for completion, so the search knows exactly when a candidate stops and how many generated
          tokens its score includes.
        hold: 0.65
        visual_cues:
          - id: probabilities-beat-3-focus-1
            phrase: We will use the explicit EOS marker for completion
            targets:
              - probabilities-active-bars
            color: yellow
            linger: 0.6
          - id: probabilities-beat-3-focus-2
            phrase: A period and an end-of-sentence token have different meanings in a tokenizer
            targets:
              - probabilities-active-bars
            color: blue
            linger: 0.6
  - id: first-beam
    title: Keep several openings while pruning
    visual: Search expands every opening and marks the top two cumulative log scores as active while the third is
      pruned.
    beats:
      - say: Beam search keeps a small set of active prefixes. At the first step, width two retains opened and looked.
          The shorter route beginning with slept falls below the cutoff, so later steps cannot extend that
          route in this run.
        hold: 0.5
        visual_cues:
          - id: first-beam-beat-1-focus-1
            phrase: Beam search keeps a small set of active prefixes
            targets:
              - first-beam-simulation-18
            color: blue
            linger: 0.6
          - id: beam-retain
            phrase: width two retains opened and looked
            targets:
              - example-state
          - id: beam-prune
            phrase: slept falls below the cutoff
            targets:
              - example-state
      - say: Notice what the width controls. It is the number of partial sentences carried between steps. The model
          still scores possible next tokens, and the search still compares cumulative path scores before
          deciding which prefixes remain active.
        hold: 0.5
        visual_cues:
          - id: first-beam-beat-2-focus-1
            phrase: path scores before deciding which prefixes remain active
            targets:
              - first-beam-simulation-18
            color: blue
            linger: 0.6
          - id: first-beam-beat-2-focus-2
            phrase: Notice what the width controls
            targets:
              - first-beam-object-label-19
            color: blue
            linger: 0.6
      - say: A beam acts like a narrow moving frontier through the tree. Its surviving leaves are promising under
          scores seen so far. The frontier is a compute budget, and pruning makes the procedure an
          approximation to searching every sequence.
        hold: 0.65
        visual_cues:
          - id: first-beam-beat-3-focus-1
            phrase: and pruning makes the procedure an approximation to searching every sequence
            targets:
              - first-beam-simulation-18
            color: blue
            linger: 0.6
          - id: first-beam-beat-3-focus-2
            phrase: A beam acts like a narrow moving frontier through the tree
            targets:
              - first-beam-object-label-19
            color: blue
            linger: 0.6
  - id: search-lattice
    title: Expand the surviving lattice
    visual: The retained prefixes open their conditional rows; a live candidate table recomputes cumulative path
      probabilities and highlights the next beam frontier.
    beats:
      - say: At this step, opened branches to the or a, while looked branches outside or up. Each edge belongs to its
          own prefix. One expansion later, opened the can propose door, and looked outside can continue to
          again.
        hold: 0.55
        visual_cues:
          - id: search-lattice-beat-1-focus-1
            phrase: At this step
            targets:
              - search-lattice-simulation-27
            color: blue
            linger: 0.6
      - say: The search adds each new log probability to its prefix score, ranks the resulting candidates, and keeps
          the leading active paths. Follow the inherited prefix into the new score. That identity is what
          turns local predictions into a sentence-level comparison.
        hold: 0.55
        visual_cues:
          - id: search-lattice-beat-2-focus-1
            phrase: and keeps the leading active paths
            targets:
              - search-lattice-simulation-27
            color: blue
            linger: 0.6
      - say: After another expansion, opened the door reaches EOS with the strongest completed route in the width-two
          run. Looked outside again quietly remains unfinished at the four-token horizon. The best words at
          each position did not need to form one sentence.
        hold: 0.65
        visual_cues:
          - id: search-lattice-beat-3-focus-1
            phrase: opened the door reaches EOS with the strongest completed route
            targets:
              - search-lattice-simulation-29
            color: blue
            linger: 0.6
          - id: search-lattice-beat-3-focus-2
            phrase: Looked outside again quietly remains unfinished at the four-token horizon
            targets:
              - search-lattice-simulation-29
            color: blue
            linger: 0.6
  - id: stopping
    title: EOS turns a path into an answer
    visual: EOS edges leave the active frontier and enter a completed set; an unfinished sentence remains eligible
      for another expansion.
    beats:
      - say: Now run the same tree with width three. This separate run keeps slept alive, where it reaches EOS
          immediately. An EOS choice moves a candidate into the completed set, while unfinished prefixes stay
          active for another expansion.
        hold: 0.5
        visual_cues:
          - id: stopping-beat-1-focus-1
            phrase: where it reaches EOS immediately
            targets:
              - stopping-simulation-34
            color: blue
            linger: 0.6
      - say: In the width-three run, the completed paths include Mia slept and Mia opened the door. For slept then
          EOS, point two times point nine five gives point one nine. For opened, the, door, then EOS, point
          four five times point five times point eight times point eight five gives point one five three. The
          short path therefore earns the higher joint probability in this fixture.
        hold: 0.55
        visual_cues:
          - id: stopping-beat-2-focus-1
            phrase: In the width-three run
            targets:
              - stopping-simulation-34
            color: blue
            linger: 0.6
          - id: stopping-beat-2-focus-2
            phrase: the completed paths include Mia slept and Mia opened the door
            targets:
              - stopping-simulation-34
            color: blue
            linger: 0.6
          - id: stop-short-result
            phrase: gives point one nine
            targets:
              - calculated-result
          - id: stop-long-result
            phrase: gives point one five three
            targets:
              - calculated-result
      - say: Completion criteria and length constraints define eligible outputs. Early stopping determines how long
          search continues and can change which candidates are discovered. Reaching a length limit can leave
          an unfinished prefix. Here EOS alone marks completion, and the four-token horizon ends expansion.
          State these rules before comparing outputs, or the final ranking may mix different tasks.
        hold: 0.65
        visual_cues:
          - id: stopping-beat-3-focus-1
            phrase: Completion criteria and length constraints define eligible outputs
            targets:
              - stopping-simulation-34
            color: blue
            linger: 0.6
  - id: length-score
    title: Length normalization changes the comparison
    visual: A computed ranking compares joint log probability with mean log probability per generated token,
      including EOS, and reveals the winner for each rule.
    beats:
      - say: Compare the completed candidates from the width-three run. Joint probability favors the short path. Every
          extra conditional probability is at most one, so extra edges add nonpositive log terms and can
          pressure a raw-sum objective toward brief completions.
        hold: 0.5
        visual_cues:
          - id: length-score-beat-1-focus-1
            phrase: Joint probability favors the short path
            targets:
              - length-scored-paths
            color: blue
            linger: 0.6
          - id: length-score-beat-1-focus-2
            phrase: Compare the completed candidates from the width-three run
            targets:
              - length-scored-paths
            color: blue
            linger: 0.6
      - say: Divide each completed log score by its generated-token count, including EOS. This changes the objective
          from total sequence probability to average log probability per token. Slept has log score about
          negative one point six six one across two generated tokens, giving mean about negative point eight
          three zero. Opened the door has log score about negative one point eight seven seven across four,
          giving mean about negative point four six nine. The larger, less negative mean favors opened the
          door, reversing their raw order.
        hold: 0.55
        visual_cues:
          - id: length-score-beat-2-focus-1
            phrase: Divide each completed log score by its generated-token count
            targets:
              - length-scored-paths
            color: blue
            linger: 0.6
      - say: GNMT used a different length penalty, and libraries expose their own conventions. The formula belongs to
          the decoding policy. Tune it on development examples and check the resulting answer lengths
          alongside task quality.
        hold: 0.7
        visual_cues:
          - id: length-score-beat-3-focus-1
            phrase: GNMT used a different length penalty
            targets:
              - length-scored-paths
            color: blue
            linger: 0.6
  - id: width
    title: How much work did the beam do?
    visual: Six edges fan out from two Mia prefixes. The beam keeps two unfinished children and files EOS separately. Two cache diagrams show the same six scored extensions with a copied or shared prompt. A final comparison counts expansions through all four steps.
    beats:
      - say: "Freeze the width-two search right after the first word. We're holding two prefixes, Mia opened and Mia looked. Each has three possible next tokens. How many extensions will the search score at this step?"
        hold: 2.1
        visual_cues:
          - id: width-children
            phrase: "three possible next tokens"
            targets: [outgoing-edges]
      - say: "Six extensions. Four children continue the sentence. The other two finish it. We keep the two best unfinished paths, opened the and looked outside, and put both end-token paths in the completed set. Six scored, two carried forward."
        hold: 0.65
        visual_cues:
          - id: six-scored
            phrase: "Six extensions"
            targets: [extension-count]
            caption_boundary: true
          - id: two-carried
            phrase: "opened the and looked outside"
            targets: [retained-prefixes]
          - id: file-eos
            phrase: "in the completed set"
            targets: [completed-prefixes]
      - say: "Those same six edges can cost different amounts of memory. Both prefixes start with Mia. A runtime could copy the prompt's cached keys and values for each prefix. Or it could let both prefixes point to one copy. The next tokens still need their own state. We examined six extensions either way."
        hold: 0.7
        visual_cues:
          - id: copied-prompt
            phrase: "copy the prompt's cached keys and values"
            targets: [copied-cache]
          - id: shared-prompt
            phrase: "point to one copy"
            targets: [shared-cache]
      - say: "Now count every extension examined over the four generated positions. Width one examined eleven, width two examined eighteen, and width three examined twenty-five. Only width three kept slept long enough to score its end token. Here that changed the most probable completed sentence. On real prompts, measure latency, memory and answer quality alongside the search count."
        hold: 0.85
        visual_cues:
          - id: count-horizon
            phrase: "four generated positions"
            targets: [horizon-counts]
          - id: all-counts
            phrase: "width three examined twenty-five"
            targets: [work-totals]
          - id: width-winner
            phrase: "the most probable completed sentence"
            targets: [completed-winners]
  - id: wider-counterexample
    title: "Two cutoffs on the same tree"
    visual: Two ranked columns have cutoffs after two and three slots. C enters only on the right. Its children move above A2 and push it below that cutoff. Final conditional factors stay beside each surviving prefix for the prediction.
    beats:
      - say: "Run the same three-token tree twice. Both searches see A at one half, B at three tenths and C at two tenths. The left beam has room for two openings. The right has room for three."
        hold: 0.65
        visual_cues:
          - id: width-slots
