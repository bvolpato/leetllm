version: 1
id: capstone-damaged-package-vision-classifier
title: A Vision Classifier Needs Usable Evidence
source: foundations/capstone-damaged-package-vision-classifier/content.md
sources:
  - title: "PyTorch: binary cross-entropy with logits"
    url: https://docs.pytorch.org/docs/stable/generated/torch.nn.BCEWithLogitsLoss.html
scenes:
  - id: intro
    title: "Which photo gets the next inspection?"
    visual: The mailer slides into place beside the dark carton as their brightness bars grow on the same scale. Mark the minimum on both bars, hold the choice, then bracket the mailer's torn seam.
    beats:
      - say: >-
          The dark carton scores point nine four for damage, the mailer point eight three. Both clear the priority threshold of point seven.
        hold: 0.55
        visual_cues:
          - id: threshold
            phrase: "priority threshold"
            targets: [picture]
      - say: >-
          Both parcels are in frame and in focus. The minimum brightness is point two. The carton stops at point one two, the mailer at point six four. Which photo gets the inspection slot?
        hold: 2.1
        visual_cues:
          - id: light
            phrase: "minimum brightness"
            targets: [picture]
      - say: >-
          Inspect the mailer. You can follow the split in its folded seam. For the dark carton, ask for a retake in better light. Keep its original score with the request.
        caption_starts: ["Inspect the mailer", "ask for a retake"]
        hold: 0.9
        visual_cues:
          - id: inspect
            phrase: "Inspect the mailer"
            targets: [picture]
          - id: retake
            phrase: "a retake in better light"
            targets: [picture]
  - id: evidence-contract
    title: "Who decides what happens to the return?"
    visual: The dark carton goes back to the uploader for a retake, while the torn mailer goes to a specialist. Then compare the invented routing records with the labeled photographs a classifier needs.
    beats:
      - say: >-
          A retake request goes back to the uploader. It tells them to improve the light, steady the camera or get the whole parcel in frame. Normal and priority photos go to a specialist. The specialist inspects the parcel. A separate order policy governs refunds, replacements and restocking.
        hold: 0.7
        visual_cues:
          - id: queues
            phrase: "photos go to a specialist"
            targets:
              - picture
          - id: refund
            phrase: "A separate order policy"
            targets:
              - picture
      - say: >-
          The scores and specialist labels in this exercise are invented. We can run them through the router and check where each photo goes. To train a classifier, we'd need photographs of damaged and clear parcels. Here the only training case is damaged, photographed twice. The validation set has no usable damaged parcel.
        hold: 0.7
        visual_cues:
          - id: invented
            phrase: "scores and specialist labels"
            targets: [picture]
          - id: limits
            phrase: "only training case is damaged"
            targets: [picture]
      - say: >-
          For a real classifier, obtain permission to use the photographs and record what that permission covers. Restrict access and remove personal shipping details from portfolio images. In the model card, record the uses you evaluated, the uses you excluded, your thresholds and the errors you found for each group of parcels.
        hold: 0.7
        visual_cues:
          - id: permission
            phrase: "obtain permission to use the photographs"
            targets:
              - picture
          - id: model-card
            phrase: "In the model card"
            targets:
              - picture
  - id: labels
    title: Define the question the image can answer
    visual: A visible seam defect and hidden package contents occupy separate regions of an annotated parcel sketch.
    beats:
      - say: Define visible external packaging damage before collecting examples. A torn seam, crushed corner or
          puncture can support that label. The contents remain hidden from this photograph. Keep uncertain and
          unusable images explicit so a missing judgment never becomes an undamaged training example.
        hold: 0.75
        visual_cues:
          - id: visible
            phrase: visible external packaging damage
            targets:
              - picture
          - id: seam
            phrase: torn seam
            targets:
              - picture
          - id: hidden
            phrase: contents remain hidden
            targets:
              - picture
      - say: Our product makes a review-queue decision. It can ask for another photo, retain an ordinary review or
          request priority inspection. These actions preserve specialist judgment. The label guide should
          explain ambiguous cases and record reviewer disagreement before any neural architecture enters the
          experiment.
        hold: 0.85
        visual_cues:
          - id: queue
            phrase: review-queue decision
            targets:
              - picture
          - id: uncertain
            phrase: ambiguous cases
            targets:
              - picture
  - id: groups
    title: One physical parcel owns all its views
    visual: Alternate photo cards converge into physical case groups before those groups enter train, validation
      and test lanes.
    beats:
      - say: A customer takes several pictures of the same crushed box. Those images share the barcode, background and
          markings. Splitting the photographs independently can place almost the same parcel on both sides of
          evaluation, making recognition of a familiar case look like generalization.
        hold: 0.75
        visual_cues:
          - id: views
            phrase: several pictures of the same crushed box
            targets:
              - picture
          - id: leak
            phrase: both sides of evaluation
            targets:
              - picture
      - say: Group alternate views and reuploads by the physical case first. Then apply time boundaries, keeping an
          entire case together or quarantining a case that spans the boundary. Exact file hashes catch
          identical bytes; recompressed photographs still need the same physical-case grouping.
        hold: 0.85
        visual_cues:
          - id: group
            phrase: Group alternate views and reuploads
            targets:
              - picture
          - id: together
            phrase: entire case together
            targets:
              - picture
          - id: hashes
            phrase: recompressed photographs still need the same physical-case grouping
            targets:
              - picture
  - id: manifest-identity
    title: "Which records belong to one physical parcel?"
    visual: Group photo IDs by case inside each split. Then hold a new parcel's two views and its later label against a single historical cutoff.
    beats:
      - say: >-
          Read each line as one physical return. In training, four oh one has two uploads. In test, four oh four does too. Count the uploads first and the physical parcels second. Training has two photos from one case, validation has two from two, and test has seven from six. That's eleven photos but only nine physical parcels.
        hold: 0.7
        visual_cues:
          - id: counts
            phrase: "test has seven from six"
            targets: [picture]
          - id: total
            phrase: "only nine physical parcels"
            targets: [picture]
      - say: >-
          Keep the image location and hash with the case ID, capture time, source and packaging. Keep human usability, damage label, reviewer and guideline too. A hash identifies the file bytes. Recompression changes the bytes while the parcel can stay the same.
        hold: 0.6
      - say: >-
          Try a new parcel. Its first view is from day eight and its second is from day thirteen. The split and the historical training cutoff are both on day ten. Its label becomes available on day fourteen. Where do those two views belong, and can this training run use the label?
        hold: 2
        visual_cues:
          - id: fresh
            phrase: "Try a new parcel"
            targets: [picture]
          - id: late
            phrase: "label becomes available on day fourteen"
            targets: [picture]
      - say: >-
          Quarantine both views. This physical case spans the split. The label arrived after the training cutoff, so exclude the label too. Group K Fold keeps a group together. You still have to impose chronological boundaries and check label availability. Apply training augmentation after splitting to keep transformed siblings together.
        hold: 0.8
        visual_cues:
          - id: quarantine
            phrase: "Quarantine both views"
            targets: [picture]
          - id: exclude
            phrase: "exclude the label too"
            targets: [picture]
  - id: typed-inputs
    title: Reject malformed records before routing
    visual: Separate the R-406-a capture and supplied score from the offline human label. Check a finite numeric score, a Boolean and infinity against the score contract.
    beats:
      - say: The fixture validates its inputs before choosing a route. IDs must be nonblank strings with no outside
          whitespace. Capture day must be a positive integer rather than a Boolean. A usable photo needs a
          literal Boolean damage label; an unusable photo must instead retain an unknown label.
        hold: 0.7
        visual_cues:
          - id: validate
            phrase: validates its inputs before choosing a route
            targets:
              - picture
          - id: unknown
            phrase: an unusable photo must instead retain an unknown label
            targets:
              - picture
      - say: Each damage, blur and brightness value must be a finite integer or float in the closed interval zero
          through one; Boolean values are rejected despite Python treating them as integer-like. The
          package-visible flag must itself be a literal Boolean. The range is checked before converting an
          arbitrarily large integer to a float.
        hold: 0.7
        visual_cues:
          - id: numeric
            phrase: finite integer or float
            targets:
              - picture
          - id: boolean
            phrase: Boolean values are rejected
            targets:
              - picture
      - say: >-
          Follow the two router inputs in the table. The capture record identifies the upload. The model output supplies its scores and visibility flag. The human label goes to evaluation. A reviewer can use it to find dark photos that slipped through or usable photos sent back for a retake.
        hold: 0.7
        visual_cues:
          - id: separate
            phrase: "model output supplies"
            targets:
              - picture
          - id: answer-key
            phrase: "human label goes to evaluation"
            targets:
              - picture
  - id: quality
    title: "What did the camera actually capture?"
    visual: R-406-a stays dark while one supplied number changes. Compare the new route with the human usability label, then replace the capture with a well-lit empty frame.
    beats:
      - say: >-
          Back to the dark carton. Its brightness is point one two, below the point two minimum. The score of point nine four stays in the record, and the router requests a new photo. A human also marked this image unusable.
        hold: 0.55
        visual_cues:
          - id: retake
            phrase: "the router requests a new photo"
            targets: [picture]
          - id: human
            phrase: "A human also marked"
            targets: [picture]
      - say: >-
          Keep those exact pixels. Change only the reported brightness to point three. The parcel is visible and the blur reading is within the limit. What route does that change produce?
        hold: 2
        visual_cues:
          - id: change
            phrase: "reported brightness to point three"
            targets: [picture]
      - say: >-
          Now it goes to priority review. The specialist would still open the same dark picture. Comparing the route with the human label catches an unusable photo in the priority queue. Also check the opposite error. Rejecting a usable photo can delay a genuinely damaged parcel.
        hold: 0.65
        visual_cues:
          - id: wrong
            phrase: "Now it goes to priority review"
            targets: [picture]
          - id: mismatch
            phrase: "an unusable photo in the priority queue"
            targets: [picture]
      - say: >-
          Try the empty frame. It has plenty of light and a low blur score. In this example, a larger blur score means more blur. The first check asks whether the parcel is visible. Here the uploader needs to put the parcel in the frame.
        hold: 0.85
        visual_cues:
          - id: empty
            phrase: "the empty frame"
            targets: [picture]
          - id: presence
            phrase: "put the parcel in the frame"
            targets: [picture]
  - id: focus-stencil
    title: "What does this edge detector measure?"
    visual: Move a five-pixel cross one column across a sharp step. Fill the two corresponding signed responses, then complete the nine interior cells and compute their population variance.
    beats:
      - say: >-
          Think of this five by five grid as a strip across a parcel edge. Dark pixels have intensity zero. Bright pixels have intensity one. The yellow cross is a discrete Laplacian. It adds the four neighbors and subtracts four times the center.
        hold: 0.5
        visual_cues:
          - id: neighbors
            phrase: "The yellow cross"
            targets: [picture]
      - say: >-
          Start on the dark side. Only its neighbor on the right is bright. What value goes in the first response cell?
        hold: 1.6
        visual_cues:
          - id: first
            phrase: "Start on the dark side"
            targets: [picture]
      - say: >-
          The first response is plus one. Its sign tells us we sampled the dark side of this edge. Now step across the edge to the bright center. Three neighbors are bright and the one on the left is dark. Three minus four gives minus one. Use signed or floating point arithmetic to keep that sign.
        caption_starts: ["plus one"]
        hold: 0.7
        visual_cues:
          - id: positive
            phrase: "plus one"
            targets: [picture]
          - id: across
            phrase: "step across the edge"
            targets: [picture]
          - id: negative
            phrase: "gives minus one"
            targets: [picture]
      - say: >-
          Repeat that operation at every interior center. The border has no complete cross, so we leave it out. Each row reads one, minus one, zero. The nine responses average to zero.
        hold: 0.5
        visual_cues:
          - id: interior
            phrase: "every interior center"
            targets: [picture]
          - id: mean
            phrase: "average to zero"
            targets: [picture]
      - say: >-
          Square each difference from the mean. Six squares are one and three are zero. Divide six by all nine retained centers. The population variance is two thirds. Fix the region, resize and border rule when comparing images. Smoothing first can suppress noise. Texture and contrast can also change this statistic.
        hold: 0.8
        visual_cues:
          - id: variance
            phrase: "The population variance is two thirds"
            targets: [picture]
  - id: contrast-intervention
    title: "What changes if we turn down the contrast?"
    visual: Keep the edge fixed while the bright pixels fall from 1 to 0.5. The signed grid scales with them. Compare the new squared responses with the original variance.
    beats:
      - say: >-
          Keep the edge exactly where it is. Halve every intensity in the same grid, with no blur and the same nine centers. Each sum and subtraction scales by one half, so the signed responses become a half, minus a half, and zero in each row. What happens to the variance?
        hold: 1.8
        visual_cues:
          - id: halve
            phrase: "Halve every intensity"
            targets: [picture]
          - id: response
            phrase: "a half, minus a half, and zero in each row"
            targets: [picture]
          - id: ask
            phrase: "What happens to the variance"
            targets: [picture]
      - say: >-
          The mean is still zero. Six responses now contribute one quarter each. Divide their sum by nine and you get one sixth. Halving contrast cut the variance to a quarter of what it was. In general, scaling intensities by a factor scales variance by that factor squared.
        hold: 0.7
        visual_cues:
          - id: variance
            phrase: "you get one sixth"
            targets: [picture]
          - id: law
            phrase: "by that factor squared"
            targets: [picture]
      - say: >-
          The edge stayed sharp. Compare sharp low-contrast images and blurred images with human usability labels before using this statistic for focus. Our router uses a separate blur score. Larger values mean blurrier images. The fixture supplies that score directly, so its point four five cutoff applies only to that scale.
        hold: 0.8
        visual_cues:
          - id: boundary
            phrase: "a separate blur score"
            targets: [picture]
  - id: exposure-detail
    title: Measure the parcel region and retain its small cue
    visual: Compare a dark parcel region with a bright label, then scale a four-pixel detail from a 1024-pixel image to a 224-pixel input.
    beats:
      - say: >-
          A bright shipping label can lift the average brightness of a dark frame. Look just at the parcel region. Its histogram shows how many pixels are dark or bright. The clipped fraction tells you how many sit at the darkest or brightest value the image can record. To estimate illumination in lux, you also need a calibrated sensor.
        hold: 0.7
        visual_cues:
          - id: region
            phrase: "parcel region"
            targets:
              - picture
      - say: >-
          Shrink the frame from one thousand twenty-four pixels wide to two hundred twenty-four. A four-pixel tear shrinks by the same ratio. It now spans point eight seven five output pixels, less than one pixel wide.
        hold: 0.7
        visual_cues:
          - id: resize
            phrase: "Shrink the frame"
            targets:
              - picture
          - id: detail
            phrase: point eight seven five output pixels
            targets:
              - picture
      - say: >-
          To see which input preserves a useful trace of the tear, compare a whole-frame input, a parcel crop and higher resolution on labeled small defects. Check parcel presence, exposure and focus as well. To relate pixel width to centimeters, you need a physical scale. Time the quality checks and classifier together on the intended device.
        hold: 0.7
        visual_cues:
          - id: compare
            phrase: Compare a whole-frame input, a parcel crop and higher resolution
            targets:
              - picture
  - id: ordered-router
    title: "A photo at all three limits"
    visual: Trace a numeric sample at all three equality boundaries. Replace only the damage number with a Boolean and start again at input validation.
    beats:
      - say: >-
          Here is a visible parcel right on all three limits. Brightness is point two, blur is point four five, and damage is point seven. At these limits, where does this photo go?
        hold: 1.9
      - say: >-
          The parcel is visible, so the first gate passes. Brightness fails only below its minimum. Blur fails only above its maximum. Both quality checks pass. Damage at the threshold qualifies for priority review.
        hold: 0.65
        visual_cues:
          - id: visible
            phrase: "the first gate passes"
            targets: [picture]
          - id: quality
            phrase: "Both quality checks pass"
            targets: [picture]
          - id: priority
            phrase: "qualifies for priority review"
            targets: [picture]
      - say: >-
          Replace just the damage score with the Boolean value True. Python can use True as a number in arithmetic. Can this record enter the first gate?
        hold: 1.7
        visual_cues:
          - id: boolean
            phrase: "the Boolean value True"
            targets: [picture]
      - say: >-
          Input validation rejects it. The score must be a finite number between zero and one, and this validator excludes Booleans. The record produces no route. With valid input, a visibility failure asks for the parcel in frame. A quality failure asks for better light or focus. An accepted score below threshold stays in normal review.
        hold: 0.55
        visual_cues:
          - id: invalid
            phrase: "Input validation rejects it"
            targets: [picture]
      - say: >-
          On the seven test photos, the router sends three to priority, two to normal review, and asks for two retakes. These counts measure photo attempts. A learned parcel detector also takes inference time, so measure the whole path before claiming that checking quality first saves time.
        hold: 0.8
        visual_cues:
          - id: totals
            phrase: "asks for two retakes"
            targets: [picture]
  - id: threshold
    title: "Which accepted photos go to priority?"
    visual: Four accepted photos sit on aligned score rulers. The cutoff stays fixed while the priority and normal routes appear on their respective rows.
    beats:
      - say: >-
          Here are four accepted photos from the test set, one view per parcel. Place each score against the same frozen cutoff of point seven. Which photos get priority?
        hold: 1.7
        visual_cues:
          - id: scores
            phrase: "Place each score"
            targets: [picture]
      - say: >-
          The first two cross the line and go to priority. The last two stay in normal review. The warehouse photo scored point six three. Keep its normal route on file so we can check it against the specialist's verdict.
        hold: 0.6
        visual_cues:
          - id: priority
            phrase: "The first two cross the line and go to priority"
            targets: [picture]
          - id: normal
            phrase: "The last two stay in normal review"
            targets: [picture]
      - say: >-
          For each case, damage still needs a specialist judgment. To choose a cutoff for a real model, agree on a review budget and the cost of missed damage, then use validation cases. Freeze that choice before measuring the final holdout.
        hold: 0.8
        visual_cues:
          - id: outcome
            phrase: "damage still needs a specialist judgment"
            targets: [picture]
  - id: development-threshold
    title: "How far can the specialist queue stretch?"
    visual: Six labeled validation cases each occupy one column. Eligible tickets move into four review slots. Two overflow positions expose the cost of recovering the last damaged case.
    beats:
      - say: >-
          The fixture's validation split has no usable damaged case, so it can't tell us which cutoff to use. Try a separate invented worksheet. Each ticket is one case, with its score and specialist label together. Four of these six cases are damaged. We can inspect four cases and must recover at least three damaged ones.
        hold: 0.7
      - say: >-
          Try a cutoff of point eight. The first two tickets get slots. Only one says damaged. That's one true positive, one false positive and three missed cases. Recall is one out of four.
        hold: 0.6
        visual_cues:
          - id: eight
            phrase: "cutoff of point eight"
            targets: [picture]
          - id: eight-count
            phrase: "Recall is one out of four"
            targets: [picture]
      - say: >-
          Lower the cutoff to point seven. Two more damaged cases move up, including the one exactly on the line. Now three of the four slots hold damaged cases, and three of the four damaged cases have slots. Precision and recall are both three quarters.
        hold: 0.6
        visual_cues:
          - id: seven
            phrase: "cutoff to point seven"
            targets: [picture]
          - id: seven-count
            phrase: "Precision and recall are both three quarters"
            targets: [picture]
      - say: >-
          Try point three. The last damaged case comes in, and the clear case at point four eight comes along too. All four damaged cases have slots, but we'd need six inspections. Which cutoff meets both requirements?
        hold: 2.1
        visual_cues:
          - id: three
            phrase: "Try point three"
            targets: [picture]
          - id: three-count
            phrase: "we'd need six inspections"
            targets: [picture]
          - id: ask
            phrase: "Which cutoff meets both requirements"
            targets: [picture]
      - say: >-
          Choose point seven. The last two tickets stay out and the four available slots are enough. Freeze this choice before opening the holdout. These six invented cases taught us how to choose a threshold. A camera model needs that comparison on real labeled cases.
        hold: 0.8
        visual_cues:
          - id: choose
            phrase: "Choose point seven"
            targets: [picture]
  - id: preprocess
    title: "Which pixels reach the classifier?"
    visual: A 224-pixel window slides across a 512-by-256 schematic. The tear stays on the original carton and disappears from the magnified model input as the window passes it.
    beats:
      - say: >-
          Look at the torn corner on the left of this carton. The yellow window covers it. The square on the right shows those same pixels, enlarged. When the window moves to the center, which detail falls outside?
        hold: 1.8
        visual_cues:
          - id: ask
            phrase: "When the window moves to the center"
            targets: [picture]
      - say: >-
          Move it to the center. Part of the shipping label comes into view, and the torn corner is gone. The classifier sees only that square. Other features could still give a high score. To learn whether the lost corner matters, compare transforms on labeled parcels with small tears.
        hold: 0.7
        visual_cues:
          - id: center
            phrase: "Move it to the center"
            targets: [picture]
          - id: seam
            phrase: "the torn corner is gone"
            targets: [picture]
          - id: meaning
            phrase: "classifier sees only that square"
            targets: [picture]
      - say: >-
          A pretrained encoder can turn those pixels into features. Train a head for the agreed damage label, then compare frozen features with further tuning on the same held-out cases. If you also want to name the defect, collect a separate annotation for each category and mask any unknown ones.
        hold: 0.8
  - id: transform-bundle
    title: "Two views of the same torn corner"
    visual: The documented center crop and a full frame fitted into the same square show the tradeoff between retaining the corner and shrinking its detail.
    beats:
      - say: >-
          That square is the center crop from the documented ResNet eighteen weights transform. It resizes the short side to two hundred fifty-six, then takes the center two hundred twenty-four pixels in each direction. It rescales the color channels to zero through one. For each channel, subtract its documented mean and divide by its standard deviation.
        hold: 0.7
        visual_cues:
          - id: crop
            phrase: "resizes the short side"
            targets: [picture]
          - id: normalize
            phrase: "rescales the color channels"
            targets: [picture]
      - say: >-
          Try fitting the whole frame inside the same square. The padding leaves the torn corner in view. Look how much smaller the tear becomes. Compare the complete alternatives on validation photos before choosing which pixels to serve.
        hold: 0.65
        visual_cues:
          - id: letterbox
            phrase: "fitting the whole frame"
            targets: [picture]
      - say: >-
          Save the chosen transform with the weights, numerical precision, label guide, thresholds and route policy. The weights can stay fixed while a change in the serving crop changes their input. Training augmentation can vary. Use the evaluated deterministic transform for serving.
        hold: 0.8
        visual_cues:
          - id: bundle
            phrase: "Save the chosen transform"
            targets: [picture]
  - id: representation-choice
    title: "How does an encoder pick up a seam?"
    visual: Follow a mailer from a frozen ResNet encoder to its damage head. Compare a moving ConvNeXt window with a two-pixel patch projection and test the candidate encoders on the same parcels.
    beats:
      - say: >-
          Start with a ResNet trained on ImageNet. Freeze its encoder and train a new head on labeled parcel photos. The encoder supplies features. The head learns which features predict visible damage. For a second experiment, fine-tune the encoder too.
        hold: 0.7
        visual_cues:
          - id: head
            phrase: "Freeze its encoder"
            targets: [picture]
          - id: tune
            phrase: "fine-tune the encoder"
            targets: [picture]
      - say: >-
          ConvNeXt slides a seven by seven filter over each feature channel, then mixes channels. Its blocks use an inverted bottleneck, LayerNorm and GELU. A vision transformer divides the image into patches. Each patch becomes a token through a learned linear projection. Look at just two adjacent pixels. Both pairs average one half. Suppose one coordinate takes the right pixel minus the left, with all other weights and the bias set to zero. Dark to light gives plus one. Light to dark gives minus one. A feature inside a patch can reach the token this way. The original vision transformer adds position embeddings and uses global self-attention to mix information across patch tokens.
        caption_starts: ["plus one", "minus one"]
        hold: 0.7
        visual_cues:
          - id: convnext
            phrase: "ConvNeXt slides"
            targets: [picture]
          - id: patches
            phrase: "A vision transformer divides the image into patches"
            targets: [picture]
          - id: weights
            phrase: "the right pixel minus the left"
            targets: [picture]
          - id: response
            phrase: "plus one"
            targets: [picture]
          - id: reverse
            phrase: "minus one"
            targets: [picture]
          - id: attention
            phrase: "adds position embeddings"
            targets: [picture]
      - say: >-
          Test the encoders on the same held-out parcels with the same number of priority slots. Which one catches more damaged parcels, including the small tears? Record each training budget, checkpoint, resolution and preprocessing. Measure latency on the target device at the batch size and precision you plan to serve.
        hold: 0.7
        visual_cues:
          - id: holdout
            phrase: "Test the encoders on the same held-out parcels"
            targets:
              - picture
  - id: head-forward
    title: "How does the head turn two features into a score?"
    visual: Two supplied features meet their weights one row at a time. Their opposite contributions cancel, leaving the bias. Reveal the probability and the loss on separate cues.
    beats:
      - say: >-
          Suppose a head gets two features. We'll supply their values directly so you can follow the arithmetic. The first feature is two. Its weight is a quarter, so its contribution is one half. The next feature is minus one. Its weight is a half, so its contribution is minus one half.
        hold: 0.65
        visual_cues:
          - id: first
            phrase: "its contribution is one half"
            targets: [picture]
          - id: second
            phrase: "its contribution is minus one half"
            targets: [picture]
      - say: >-
          The two products cancel. Add the bias of minus one and the logit is minus one. To turn that into a probability, take one divided by one plus the exponential of the negative logit. Here sigmoid gives about point two six eight nine.
        hold: 0.6
        visual_cues:
          - id: logit
            phrase: "the logit is minus one"
            targets: [picture]
          - id: probability
            phrase: "sigmoid gives about point two six eight nine"
            targets: [picture]
      - say: >-
          Our example has a known damaged target of one. Binary cross-entropy charges the negative natural log of the probability assigned to that target. Here the loss is about one point three one three three. With a frozen encoder, learning can still change those weights and the bias. Fine-tuning would change the feature mapping as well.
        hold: 0.8
        visual_cues:
          - id: loss
            phrase: "the loss is about one point three one three three"
            targets: [picture]
  - id: head-update
    title: "Which weight goes down on this update?"
    visual: Use the same two features, signed gradients and learning rate for all three parameters. The newly computed logit moves along a fixed ruler, then the old and new losses appear together.
    beats:
      - say: >-
          The head put too little probability on the damaged label. For binary cross-entropy with a sigmoid, the logit gradient is probability minus target. Subtract one from the probability we just got. The gradient is about minus point seven three one one.
        hold: 0.65
        visual_cues:
          - id: gradient
            phrase: "gradient is about minus point seven three one one"
            targets: [picture]
      - say: >-
          Multiply that gradient by each feature to get its weight gradient. The first multiplier is two, the second is minus one, and the bias has a multiplier of one. Now subtract a tenth of each gradient from its parameter. Which weight goes down?
        hold: 2
        visual_cues:
          - id: factors
            phrase: "the bias has a multiplier of one"
            targets: [picture]
          - id: ask
            phrase: "subtract a tenth of each gradient"
            targets: [picture]
      - say: >-
          The second weight goes down because its gradient is positive. The first weight and the bias both go up. Read each new value beside the gradient that moved it. Reuse the original features, two and minus one. Multiply by the new weights, add the new bias, and the logit is about minus point five six one four.
        hold: 0.65
        visual_cues:
          - id: update
            phrase: "The first weight and the bias both go up"
            targets: [picture]
          - id: logit
            phrase: "the logit is about minus point five six one four"
            targets: [picture]
      - say: >-
          The probability of damage rises to about point three six three two. The loss on this one damaged example drops to about one point zero one two seven. To learn whether that step helps other parcels, measure discrimination and calibration on unseen positive and negative cases.
        hold: 0.8
        visual_cues:
          - id: loss
            phrase: "drops to about one point zero one two seven"
            targets: [picture]
  - id: masked-categories
    title: "Which defect labels can train the head?"
    visual: Three defect slips retain their logits and targets. Only the two assessed loss terms move into the mean, while the unassessed target stays behind.
    beats:
      - say: >-
          A parcel can have a torn seam and a crushed corner at the same time. Give each defined defect its own sigmoid output. They can share a backbone and co-occur. Define tasks such as substance identification or label readability separately.
        hold: 0.5
      - say: >-
          Here a reviewer marked the seam present and the corner absent. They didn't assess the third defect. For a present target, use minus the log of its probability. For an absent target, use minus the log of one minus its probability. For these logits the two losses are about point six nine three one and two point one two six nine. How many terms belong in the mean?
        hold: 1.9
        visual_cues:
          - id: terms
            phrase: "the two losses are about point six nine three one and two point one two six nine"
            targets: [picture]
          - id: ask
            phrase: "How many terms belong in the mean"
            targets: [picture]
      - say: >-
          Take just the two assessed terms. Add them and divide by two. The mean loss is about one point four one. A third slot in the head doesn't give us a third judgment. If every target is unknown, skip that supervised contribution.
        hold: 0.7
        visual_cues:
          - id: two
            phrase: "Take just the two assessed terms"
            targets: [picture]
          - id: mean
            phrase: "The mean loss is about one point four one"
            targets: [picture]
      - say: >-
          For each observed logit, subtract its target from its probability and divide by the same count of two. The unassessed logit gets zero gradient. Use a combined cross-entropy operator that takes logits so rounding a probability cannot spoil the logarithm. Before changing a review queue, measure each category's precision, recall and workload on annotated cases.
        hold: 0.8
        visual_cues:
          - id: gradients
            phrase: "The unassessed logit gets zero gradient"
            targets: [picture]
  - id: calibration-quality
    title: Keep score calibration separate from operating-point choice
    visual: For usable photos near 0.80, compare the score with the observed damage frequency. Then keep one logit fixed and move its probability across a queue cutoff by changing temperature.
    beats:
      - say: >-
          The dark carton goes back for a retake. Now take a group of usable photos with scores near point eight. If those probabilities are well calibrated, about eight in ten should have confirmed damage. Compare the scores with the fraction the specialist confirms. Fit the calibrator on held-out validation cases and reserve the final test for evaluation.
