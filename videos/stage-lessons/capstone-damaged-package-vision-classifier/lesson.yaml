          - id: dark
            phrase: "dark carton"
            targets:
              - picture
      - say: >-
          Temperature scaling divides a logit by a positive temperature before applying sigmoid. Keep the logit at two. At temperature one the probability is about point eight eight zero eight. At temperature two it falls to point seven three one one. Both clear a point five threshold. At a cutoff of point eight, only the first qualifies.
        hold: 0.7
        visual_cues:
          - id: initial
            phrase: "At temperature one"
            targets: [picture]
          - id: change
            phrase: "At temperature two"
            targets: [picture]
          - id: temperature
            phrase: "point seven three one one"
            targets: [picture]
          - id: cutoff
            phrase: "a cutoff of point eight"
            targets: [picture]
      - say: Choose quality and damage thresholds against the whole intended workflow. Report the fraction rejected,
          the human-usable images incorrectly rejected, and damaged-case recovery. An accepted-only classifier
          table can look strong while the quality gate discards the evidence needed to detect a miss.
        hold: 0.7
        visual_cues:
          - id: workflow
            phrase: Choose quality and damage thresholds against the whole intended workflow
            targets:
              - picture
  - id: bundle-replay
    title: "Can we reproduce the route for R-408?"
    visual: Compare the computation rebuilt from the retained snapshot with a submitted trace. Move only the trace's threshold marker and follow the consequence through full-record replay.
    beats:
