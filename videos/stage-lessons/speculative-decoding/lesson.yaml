  - id: paired-service
    title: Which offered load can we serve?
    visual: Two trials use matched requests. A client timeline reveals a 198 ms gap. A 95% attainment
      threshold separates the two offered loads in a pair of twenty-second examples.
    beats:
      - say: Send the same prompts at the same offered load in both runs. Keep target weights, quantization,
          sampling and hardware matched. Repeat the pairs to estimate uncertainty. For fixed-length timing,
          record the output cap and how you handle end tokens. For real tasks, keep their completion lengths.
          Faster decoding may still leave someone waiting longer for the first word if drafting or queueing
          delays it.
        hold: 0.7
        visual_cues:
          - id: sd-paired-service-b0
            phrase: Send the same prompts at the same offered load
            targets:
              - sd-paired-service-mechanism
            color: cyan
            linger: 0.45
      - say: Read this stream as the client saw it. The first token arrived at three hundred milliseconds. Two more
          arrived almost together. The fourth arrived at five hundred. The gaps were one, one and one hundred
          ninety-eight milliseconds. The average is about sixty-seven milliseconds. The user still waited
          almost two tenths of a second for the last token. If several tokens arrive in one network event, you
          only know when the bundle arrived.
        hold: 0.7
        visual_cues:
          - id: sd-paired-service-b1
            phrase: Read this stream as the client saw it
            targets:
              - sd-paired-service-mechanism
            color: cyan
            linger: 0.45
          - id: sd-service-gaps
            phrase: one, one and one hundred ninety-eight milliseconds
            targets:
              - sd-paired-service-mechanism
            color: cyan
            linger: 0.45
          - id: sd-service-average
            phrase: average is about sixty-seven milliseconds
            targets:
              - sd-paired-service-mechanism
            color: cyan
            linger: 0.45
      - say: Here are two twenty-second trials. At least ninety-five percent of all offered requests must qualify.
          Trial B completed more qualifying requests per second. Which trial met the service requirement?
        hold: 2.2
        visual_cues:
          - id: sd-paired-service-b2
            phrase: At least ninety-five percent of all offered requests must qualify
            targets:
              - sd-paired-service-mechanism
            color: cyan
            linger: 0.45
      - say: Trial A. It qualified a hundred seventy-four of a hundred eighty offered requests, nearly ninety-seven
          percent. Trial B qualified only about ninety-three percent. Keep failed, rejected and canceled
          requests in that denominator. A is the highest passing load we tested, at nine offered requests per
          second. Its qualified throughput is eight point seven per second over the full twenty seconds.
          Record that alongside draft work, verification positions, acceptance by reached position, memory
          peaks and cost per completed task.
        hold: 0.8
        visual_cues:
          - id: sd-service-verdict
            phrase: Trial A
            targets:
              - sd-paired-service-mechanism
            color: cyan
            linger: 0.18
            caption_boundary: true
          - id: sd-service-capacity
            phrase: eight point seven per second
            targets:
              - sd-paired-service-mechanism
            color: cyan
            linger: 0.18
            caption_boundary: true
  - id: diagnose
    title: Isolate the sampler before blaming model kernels
    visual: Fixed probability tables isolate the sampler. A separate comparison checks serial and
      verification logits on matching model inputs and prefix states.
    beats:
      - say: Suppose an implementation gives a different distribution. First feed the sampler fixed probability
          tables. Try identical laws, disjoint laws and a forced rejection at each position. Check two-token
          sequences and stopping. If the tables pass, compare serial and verification logits for exactly the
          same model inputs, using a stated numerical tolerance.
        hold: 0.7
        visual_cues:
          - id: sd-diagnose-b0
            phrase: feed the sampler fixed probability tables
            targets:
              - sd-diagnose-mechanism
            color: cyan
            linger: 0.45
      - say: If those logits differ, trace the first difference back to its input. Was the preceding word the same?
          Did the mask, position and cache represent the same history? Then check preprocessing, quantization
          and reduction order. Even deterministic kernels can round differently across batch shapes. That
          comparison narrows the search. Agreement on a few seeds or greedy outputs leaves rare stochastic
          events untested.
        hold: 0.7
        visual_cues:
          - id: sd-diagnose-b1
            phrase: trace the first difference back to its input
            targets:
              - sd-diagnose-mechanism
            color: cyan
            linger: 0.45
  - id: transfer
    title: The space after “sang”
    visual: Each candidate word has its target and draft probabilities together. The acceptance draw sits
      below softly. The retained cache and pending correction stay separate until the target processes
      nearby.
    beats:
      - say: The draft already had sang accepted. Its next candidate is softly. The target assigns it probability
          0.30, the draft assigns 0.60, and the acceptance draw is 0.80. Predict whether softly is committed,
          then find the word with positive target-minus-draft mass.
        visual_cues:
          - id: same-prefix
            phrase: draft already had sang accepted
            targets:
              - transfer-prefix
              - transfer-proposal
            color: blue
          - id: candidate-distribution
            phrase: target assigns it probability
            targets:
