          them with tree attention. Medusa-one freezes the backbone while training heads. Medusa-two trains
          backbone and heads together, so the target being accelerated can itself change. Preserve the actual
          target checkpoint identity in comparisons.
        hold: 0.7
        visual_cues:
          - id: sd-medusa-contract-b0
            phrase: Medusa adds future-position heads to target hidden features, builds candidate continuations and
              verifies them with tree attention.
            targets:
              - sd-medusa-contract-mechanism
            color: cyan
            linger: 0.45
      - say: Follow the frozen target across the top row. An exact sampler preserves that checkpoint's
          probabilities. Medusa's typical acceptance rule can favor plausible branches and change how often
          they appear. Now move down to the jointly trained model. Even an exact sampler there preserves the
          probabilities of the new checkpoint.
        hold: 0.7
        visual_cues:
          - id: sd-medusa-contract-b1
            phrase: Medusa's typical acceptance rule
            targets:
              - sd-medusa-contract-mechanism
            color: cyan
            linger: 0.45
  - id: eagle-family
    title: Follow the actual feature and training objectives
    visual: Trace original EAGLE's pre-head feature prediction, EAGLE-2's confidence-guided tree and
      EAGLE-3's direct token training on features from several layers.
    beats:
      - say: Original EAGLE predicts the features that feed the target's language model head. The head turns
          those features into probabilities for the next token. After a token is sampled, the draft takes
          that token as input for its next prediction.
        hold: 0.7
        visual_cues:
          - id: sd-eagle-family-b0
            phrase: features that feed the target's language model head
            targets:
              - sd-eagle-family-mechanism
            color: cyan
            linger: 0.45
      - say: EAGLE-two grows a tree using draft confidence. Multiply the scores along each path. The right
          path gets point four two, enough to edge past point four on the left. EAGLE-three trains the draft
          to predict tokens directly. It combines features from low, middle and high layers of the target and
          practices several drafting steps during training.
        hold: 0.7
        visual_cues:
          - id: sd-eagle-family-b1
            phrase: Multiply the scores along each path
            targets:
              - sd-eagle-family-mechanism
            color: cyan
            linger: 0.45
          - id: sd-eagle3-objective
            phrase: EAGLE-three trains the draft to predict tokens directly
            targets:
              - sd-eagle-family-mechanism
            color: cyan
            linger: 0.45
      - say: Those features occupy memory alongside the draft weights and the tree. On a serving system, use
          compatible checkpoints, quantization, kernels, graphs, parallel layout and sampler settings.
          Measure how many requests fit and how long their answers take.
        hold: 0.7
        visual_cues:
          - id: sd-eagle-family-b2
            phrase: Those features occupy memory
            targets:
              - sd-eagle-family-mechanism
            color: cyan
            linger: 0.45
  - id: lookup-methods
    title: The train arrives at …
    visual: A repeated prompt suffix supplies the following span as deterministic proposals. Rejection
      removes the proposed word from the target law and normalizes the remaining words.
    beats:
      - say: The prompt ends with “The train.” Find those words earlier in the prompt. The earlier occurrence
          continues with “arrives at.” Prompt lookup copies that span as a guess. Some engines also search
          previously generated text. Here the lookup always proposes the same next token, so its draft
          probability is one. Its chance of acceptance is exactly the target probability. On rejection,
          remove that token and divide up the remaining target mass.
        hold: 0.7
        visual_cues:
          - id: sd-lookup-methods-b0
            phrase: Find those words earlier in the prompt
            targets:
              - sd-lookup-methods-mechanism
            color: cyan
            linger: 0.45
          - id: sd-lookup-copy
            phrase: continues with “arrives at.”
            targets: [sd-lookup-methods-mechanism]
            color: cyan
            caption_boundary: true
      - say: For target point two, point three and point five, a deterministic third-token proposal survives with
          chance point five. On rejection the residual is point four, point six and zero. No extra neural
          weights are required for this lookup, but searching, index maintenance, buffers and target
          verification still cost work.
        hold: 0.7
        visual_cues:
          - id: sd-lookup-methods-b1
            phrase: For target point two, point three and point five, a deterministic third-token proposal survives with
              chance point five.
            targets:
              - sd-lookup-methods-mechanism
            color: cyan
            linger: 0.45
          - id: sd-lookup-residual
            phrase: the residual is point four, point six and zero
            targets:
              - sd-lookup-methods-mechanism
            color: cyan
            linger: 0.45
      - say: The article's October twenty twenty-six engine guides describe other ways to propose several
          tokens. Native multi-token prediction uses modules built for a model family. Other families use a
          separate assistant checkpoint. A trained parallel draft such as PARD produces several positions
          together. To budget that pass, count its own weights and buffers and time the positions it produces
          together.
        hold: 0.7
        visual_cues:
          - id: sd-lookup-methods-b2
            phrase: other ways to propose several tokens
            targets:
              - sd-lookup-methods-mechanism
            color: cyan
            linger: 0.45
  - id: block-contract
