scenes:
  - id: intro
    title: Three words ahead
    visual: A cursor separates the words the reader has seen from three draft guesses on the same line. The target
      scores the guesses together. The sampler keeps sang and drops the two words on the rejected path.
    beats:
      - say: The reader sees “The bird.” The draft is already three words ahead. It guessed sang, used sang
          to guess softly, then used softly to guess today.
        hold: 0.6
        visual_cues:
          - id: draft-sang
            phrase: It guessed sang
            targets:
              - draft-line
            color: cyan
            linger: 0.18
            caption_boundary: true
          - id: draft-softly
            phrase: used sang to guess softly
            targets:
              - draft-line
            color: cyan
            linger: 0.18
            caption_boundary: true
          - id: draft-today
            phrase: used softly to guess today
            targets:
              - draft-line
            color: cyan
            linger: 0.18
            caption_boundary: true
      - say: The target scores all three guesses in one pass. Look at today. Which word did the target have
          to read just before it could score today?
        hold: 2.3
        visual_cues:
          - id: verify-line
            phrase: scores all three guesses in one pass
            targets:
              - score-line
            color: cyan
            linger: 0.18
            caption_boundary: true
          - id: ask-history
            phrase: Which word did the target have to read just before it could score today
            targets:
              - score-line
            color: cyan
            linger: 0.18
            caption_boundary: true
      - say: It read softly. Suppose the sampler keeps sang. The cursor moves. Now suppose it rejects softly.
          The score for today went through softly, so that score goes with it. We need a word that follows
          sang.
        hold: 0.65
        caption_starts:
          - The score for today went through softly
        visual_cues:
          - id: trace-history
            phrase: It read softly
            targets:
              - score-line
            color: cyan
            linger: 0.18
            caption_boundary: true
          - id: keep-sang
            phrase: Suppose the sampler keeps sang
            targets:
              - reader-line
            color: cyan
            linger: 0.18
            caption_boundary: true
          - id: open-space
            phrase: We need a word that follows sang
            targets:
              - reader-line
            color: cyan
            linger: 0.18
            caption_boundary: true
          - id: old-history
            phrase: Now suppose it rejects softly
            targets:
              - draft-line
            color: cyan
            linger: 0.18
            caption_boundary: true
      - say: That's speculative decoding. The target scores the draft together, and the sampler checks each
          guess in order. How do we fill that space and give each word its usual chance under the target?
        hold: 0.7
        visual_cues:
          - id: sampler-question
            phrase: How do we fill that space
            targets:
              - reader-line
            color: cyan
            linger: 0.18
            caption_boundary: true
  - id: draft
    title: The child saw a …
    visual: Three word columns pair each draft probability with its target probability. A uniform draw on
      the cumulative draft strip selects dog.
    beats:
      - say: The child saw a ... Suppose there are just three possible next words. The small model gives dog half
          its probability. The target gives dog three tenths. We need both numbers for that same word, after
          that same prefix.
        hold: 0.65
        visual_cues:
          - id: dog-row
            phrase: The small model gives dog half its probability
            targets:
              - dog-pair
            color: cyan
            linger: 0.18
            caption_boundary: true
          - id: target-row
            phrase: The target gives dog three tenths
            targets:
              - dog-pair
            color: cyan
            linger: 0.18
            caption_boundary: true
      - say: Lay the draft probabilities end to end. Draw a uniform number between zero and one. Our draw is point
          three five. It lands inside dog, so dog is the proposal. Its draft probability, which we'll call q,
          is one half. The target probability, p, is three tenths.
        hold: 0.7
        visual_cues:
          - id: draw-source
            phrase: Lay the draft probabilities end to end
            targets:
              - draft-strip
            color: cyan
            linger: 0.18
            caption_boundary: true
          - id: sample-mark
            phrase: Our draw is point three five
            targets:
              - draft-strip
            color: cyan
            linger: 0.18
            caption_boundary: true
          - id: select-dog
            phrase: dog is the proposal
            targets:
              - dog-pair
            color: cyan
            linger: 0.18
            caption_boundary: true
      - say: Use the probabilities that actually generated these choices. If the draft filters out a word,
          renormalize what remains. Apply the target's own serving rules to its column as well. And check that
          dog is the same token event in both columns.
        hold: 0.6
        visual_cues:
          - id: served-laws
            phrase: the probabilities that actually generated these choices
            targets:
              - dog-pair
            color: cyan
            linger: 0.18
            caption_boundary: true
  - id: accept
    title: How often should dog get through?
    visual: Five tenths of draft mass and three tenths of target mass establish a cutoff on a fixed unit
      interval. Replay the same dog proposal with a new acceptance draw. Only the marker moves.
    beats:
      - say: The draft supplies five tenths of the mass on dog. The target needs three tenths. If you kept every
          dog, the reader would see too many. What fraction of the proposed dogs should get through?
        hold: 2
        visual_cues:
          - id: dog-inputs
            phrase: five tenths of the mass on dog
            targets:
              - dog-shares
            color: cyan
            linger: 0.18
            caption_boundary: true
          - id: dog-question
            phrase: What fraction of the proposed dogs should get through
            targets:
              - dog-shares
            color: cyan
            linger: 0.18
            caption_boundary: true
      - say: Three out of five. Divide the target's three tenths by the draft's five tenths. That sets the cutoff at
          point six. If the target wants at least as much of a word as the draft supplies, keep every proposal
          of that word. That's why we cap the ratio at one. A word the draft just sampled has positive draft
          probability.
        hold: 0.55
        visual_cues:
          - id: acceptance-ratio
            phrase: That sets the cutoff at point six
            targets:
              - draw-ruler
            color: cyan
            linger: 0.18
            caption_boundary: true
          - id: cap-one
            phrase: cap the ratio at one
            targets:
              - dog-shares
            color: cyan
            linger: 0.18
            caption_boundary: true
      - say: Use a fresh uniform draw for the acceptance test. Point two falls inside the keep region, so this dog
          passes. Replay the same proposal. Move just the draw to point eight. Does this dog pass?
        hold: 2.15
        visual_cues:
          - id: first-draw
            phrase: Point two falls inside the keep region
            targets:
              - draw-ruler
            color: cyan
            linger: 0.18
            caption_boundary: true
          - id: first-result
            phrase: this dog passes
            targets:
              - draw-ruler
            color: cyan
            linger: 0.18
            caption_boundary: true
          - id: second-draw
            phrase: Move just the draw to point eight
            targets:
              - draw-ruler
            color: cyan
            linger: 0.18
            caption_boundary: true
          - id: draw-question
            phrase: Does this dog pass
            targets:
              - draw-ruler
            color: cyan
            linger: 0.18
            caption_boundary: true
      - say: Reject this dog. Point eight is outside the keep region. Over repeated draws we keep three fifths of
          the dogs, which leaves three tenths of all outputs on the accepted dog path. Now we have to decide
          which word to emit on a rejection.
        hold: 0.7
        visual_cues:
          - id: second-result
            phrase: Reject this dog
            targets:
              - draw-ruler
            color: cyan
            linger: 0.18
            caption_boundary: true
          - id: accepted-share
            phrase: three tenths of all outputs on the accepted dog path
            targets:
              - dog-shares
            color: cyan
            linger: 0.18
            caption_boundary: true
  - id: residual
    title: A rejection supplies the target’s missing mass
    visual: The positive part of target minus draft leaves a gap on bird. Normalization assigns bird the
      full correction probability. Moving the draft onto the target makes rejection impossible.
    beats:
      - say: Acceptance alone leaves a probability deficit wherever the target wants more mass than the proposer
          supplies. On rejection, draw a replacement from the positive part of target minus draft, normalized
          by its sum. This is the residual distribution for the current prefix.
        visual_cues:
          - id: positive-deficit
            phrase: positive part of target minus draft
            targets:
              - positive-deficit
            color: yellow
          - id: normalize-residual
            phrase: normalized by its sum
            targets:
              - residual-law
            color: green
        hold: 0.6
      - say: Our constructed distributions leave a deficit only on bird. The residual therefore puts all correction
          probability on that token. The other words can already obtain their complete target mass through
          accepted proposals, so they receive no additional correction mass in this example.
        visual_cues:
          - id: bird-deficit
            phrase: deficit only on bird
            targets:
              - positive-deficit
            color: yellow
          - id: bird-correction
            phrase: all correction probability on that token
            targets:
              - residual-law
            color: green
        hold: 0.6
      - say: The total residual mass equals the overall chance of rejection. If the two distributions match exactly,
          that total is zero and rejection is impossible. A correct implementation avoids attempting to
          normalize a zero residual on a branch that cannot be reached.
        visual_cues:
          - id: rejection-mass
            phrase: overall chance of rejection
            targets:
              - residual-equation
            color: yellow
          - id: zero-residual
            phrase: that total is zero
            targets:
              - positive-deficit
              - residual-equation
              - residual-law
            color: blue
          - id: matching-laws
            phrase: If the two distributions match exactly
            targets:
              - matching-laws
              - positive-deficit
            color: cyan
        hold: 0.8
  - id: proof
    title: Where does the rejected probability go?
    visual: Target marks stay fixed across three word rows. Excess leaves dog and cat as the missing share fills
      on bird. A new draft gives cat's rejected probability two destinations and tests the conditional chance
      of one.
    beats:
      - say: Return to the original draft. Each division is a tenth of the probability. Dog has two tenths beyond
          its target mark. Cat has one extra tenth. The portions inside the marks can already reach the reader
          through acceptance. Where should the three extra tenths go?
        hold: 2
        visual_cues:
          - id: accepted-path
            phrase: the portions inside the marks
            targets:
              - mass-ledger
            color: cyan
            linger: 0.18
            caption_boundary: true
          - id: find-space
            phrase: Where should the three extra tenths go
            targets:
              - mass-ledger
            color: cyan
            linger: 0.18
            caption_boundary: true
      - say: They all go to bird. Follow the two tenths from dog and the tenth from cat into the open space. Bird
          gets two tenths from accepted proposals and three tenths from corrections. Together they make five
          tenths.
        hold: 0.8
        visual_cues:
          - id: correction-path
            phrase: Follow the two tenths from dog and the tenth from cat into the open space
            targets:
              - mass-ledger
            color: cyan
            linger: 0.18
            caption_boundary: true
          - id: add-contributions
            phrase: Together they make five tenths
            targets:
              - mass-ledger
            color: cyan
            linger: 0.18
            caption_boundary: true
      - say: For each word, acceptance supplies the smaller of its two probabilities. Correction supplies whatever
          the target still needs. Even a word the draft never proposes can receive its entire share through
          correction. With the actual conditional laws and exact arithmetic, those two paths add up to the
          target at every prefix.
        hold: 0.55
        visual_cues:
          - id: target-law-identity
            phrase: those two paths add up to the target at every prefix
            targets:
              - mass-identity
            color: cyan
            linger: 0.18
            caption_boundary: true
      - say: Keep the same target marks and deal a new draft. Cat now has five tenths. Look at the two gaps. When
          cat is rejected, how often should the correction be dog?
        hold: 2.4
        visual_cues:
          - id: new-shares
            phrase: deal a new draft
            targets:
              - mass-ledger
            color: cyan
            linger: 0.18
            caption_boundary: true
          - id: two-gaps
            phrase: When cat is rejected, how often should the correction be dog
            targets:
              - mass-ledger
            color: cyan
            linger: 0.18
            caption_boundary: true
      - say: One time in three. Dog still needs one tenth of all outputs, and the rejected draws account for three tenths.
          Dividing the gap by the rejection probability gives one third. The other two thirds go to bird. This
          is the difference between a word's share of corrections and its share of all outputs.
        hold: 0.85
        visual_cues:
          - id: dog-third
            phrase: One time in three
            targets:
              - mass-ledger
            color: cyan
            linger: 0.18
            caption_boundary: true
          - id: split-correction
            phrase: The other two thirds go to bird
            targets:
              - mass-ledger
            color: cyan
            linger: 0.18
            caption_boundary: true
  - id: wrong-correction
    title: What if we redraw from the whole target?
    visual: Fixed target marks for noon, dawn and dusk let the same rejection share flow through two different
      replacement rules. The excess on noon and dusk then moves to the gap on dawn.
    beats:
      - say: Try the timetable example. Noon already gets the target's full forty percent from accepted proposals.
          Dawn still needs twenty percentage points. Suppose we use an ordinary target draw whenever a
          proposal fails. Will noon stay at forty percent?
        hold: 2
        visual_cues:
          - id: train-overlap
            phrase: the target's full forty percent from accepted proposals
            targets:
              - train-ledger
            color: cyan
            linger: 0.18
            caption_boundary: true
          - id: redraw-question
            phrase: Will noon stay at forty percent
            targets:
              - train-ledger
            color: cyan
            linger: 0.18
            caption_boundary: true
      - say: Noon rises to forty-eight percent. One fifth of all draws need a correction. If forty percent of those
          corrections go to noon, that adds eight percentage points to a word that was already full. Dusk goes
          over its mark too. Dawn gets only half of the missing twenty points.
        hold: 1
        visual_cues:
          - id: wrong-allocation
            phrase: Noon rises to forty-eight percent
            targets:
              - train-ledger
            color: cyan
            linger: 0.18
            caption_boundary: true
          - id: wrong-dawn
            phrase: Dawn gets only half of the missing twenty points
            targets:
              - train-ledger
            color: cyan
            linger: 0.18
            caption_boundary: true
      - say: Keep the accepted shares fixed. Change only the replacement rule. Send the rejected share to the gap at
          dawn. Noon returns to forty percent, dawn reaches fifty, and dusk drops back to ten. That repairs
          the sampling probabilities. The target can still give a wrong train time.
        hold: 0.8
        visual_cues:
          - id: repair-rule
            phrase: Change only the replacement rule
            targets:
              - train-ledger
            color: cyan
            linger: 0.18
            caption_boundary: true
          - id: repair-flow
            phrase: Send the rejected share to the gap at dawn
            targets:
              - train-ledger
            color: cyan
            linger: 0.18
            caption_boundary: true
          - id: repair-result
            phrase: dusk drops back to ten
            targets:
              - train-ledger
            color: cyan
            linger: 0.18
            caption_boundary: true
  - id: serving-laws
    title: Which odds does the target use?
    visual: The proposal probabilities stay fixed. Filtering dusk out of the target leaves 0.85 to
      normalize across noon and dawn. Labels on dawn and dusk compare their raw and served acceptance
      factors.
    beats:
      - say: Keep the three train times and start a new round with the probabilities shown. Here the target
          keeps only its two most likely words. Dusk drops
          out. The target probabilities left on noon and dawn add to eighty-five percent, so divide each by
          point eight five. Noon gets eleven seventeenths, dawn six seventeenths, and dusk gets zero. The
          draft keeps its original probabilities.
        hold: 0.7
        visual_cues:
          - id: sd-serving-laws-b0
            phrase: the target keeps only its two most likely words
            targets:
              - sd-serving-laws-mechanism
            color: cyan
            linger: 0.45
          - id: drop-dusk
            phrase: Dusk drops out
            targets: [sd-serving-laws-mechanism]
            color: pink
          - id: sd-target-law
            phrase: Noon gets eleven seventeenths, dawn six seventeenths, and dusk gets zero
            targets:
              - sd-serving-laws-mechanism
            color: cyan
            linger: 0.45
      - say: Look at dawn, token one. With the raw target score, you'd keep only about eighty-six percent of its
          proposals. After filtering, dawn's target probability is just above its draft probability, so keep
          every dawn. For dusk the raw ratio would let sixty percent through. The target removed dusk, so its
          acceptance must be zero. Apply each model's own temperature, filters and penalties before comparing
          the two normalized distributions.
        hold: 0.7
        visual_cues:
          - id: sd-serving-laws-b1
            phrase: Look at dawn, token one
            targets:
              - sd-serving-laws-mechanism
            color: cyan
            linger: 0.45
          - id: sd-policy-one
            phrase: keep every dawn
            targets:
              - sd-serving-laws-mechanism
            color: cyan
            linger: 0.45
          - id: sd-policy-zero
            phrase: its acceptance must be zero
            targets:
              - sd-serving-laws-mechanism
            color: cyan
            linger: 0.45
  - id: event-mapping
    title: Map common token events before comparing probabilities
    visual: Two token strings share numeric ID 4012 across vocabularies. A translation maps shared events
      while split and merged segments remain unresolved.
    beats:
      - say: Before you divide, check what each token ID names. Both models might use ID four thousand twelve,
          with different strings attached to it. Using the same tokenizer solves that problem directly. If two
          tokenizers split a word into different pieces, matching a few IDs by name leaves a real alignment
          problem.
        hold: 0.7
        visual_cues:
          - id: sd-event-mapping-b0
            phrase: check what each token ID names
            targets:
              - sd-event-mapping-mechanism
            color: cyan
            linger: 0.45
      - say: The vLLM guide the article checked in September twenty twenty-six describes one narrower solution.
          Normalize the token strings, keep the shared set, restrict the draft to those tokens, and translate
          its chosen ID for the target. This Token-Level Intersection path documents greedy drafting. A
          stochastic draft would need the probabilities of the actual translated events.
        hold: 0.7
        visual_cues:
          - id: sd-event-mapping-b1
            phrase: keep the shared set
            targets:
              - sd-event-mapping-mechanism
            color: cyan
            linger: 0.45
  - id: chain
    title: One target pass, three conditional scores
    visual: Three probability rows sit under the proposed words. Each row names the last token the target read.
      A separate reader line advances through sang, stops, then takes the correction. The computed row for
      today remains inspectable even when its test is skipped.
    beats:
      - say: Back at The bird, follow the three guesses. The draft sampled sang, then used sang to propose softly.
          It used softly to propose today. It saved the proposal distribution for each of those prefixes. The
          target can read the draft in one causal pass. Each score below a word comes from the input
          immediately before that word.
        hold: 0.6
        visual_cues:
          - id: conditional-prefixes
            phrase: the three guesses
            targets:
              - chain-draft
            color: cyan
            linger: 0.18
            caption_boundary: true
          - id: target-rows
            phrase: The target can read the draft in one causal pass
            targets:
              - chain-rows
            color: cyan
            linger: 0.18
            caption_boundary: true
      - say: Start at sang. The target gives it more probability than the draft does, so keep sang. Now check softly
          after sang. Its cutoff is one half and the draw is point eight. Stop at softly. Look at the score
          for today. The target has already computed it. Should the sampler test it?
        hold: 2.15
        visual_cues:
          - id: accept-first
            phrase: keep sang
            targets:
              - chain-reader
            color: cyan
            linger: 0.18
            caption_boundary: true
          - id: reject-second
            phrase: Stop at softly
            targets:
              - chain-draft
            color: cyan
            linger: 0.18
            caption_boundary: true
          - id: look-at-today
            phrase: Should the sampler test it
            targets:
              - chain-rows
            color: cyan
            linger: 0.18
            caption_boundary: true
      - say: Skip that test. Today's score was computed after softly. That prefix is gone. Use the target and draft
          distributions from just after sang to sample the correction. Here the missing mass is all on nearby.
          The reader gets The bird sang nearby. From here, both models need the corrected history. Check that
          their masks, positions, scoring rows and saved state all refer to that history.
        hold: 0.8
        visual_cues:
          - id: discard-suffix
            phrase: Skip that test
            targets:
              - chain-rows
            color: cyan
            linger: 0.18
            caption_boundary: true
          - id: dependent-suffix
            phrase: Today's score was computed after softly
            targets:
              - chain-draft
            color: cyan
            linger: 0.18
            caption_boundary: true
          - id: residual-correction
            phrase: the missing mass is all on nearby
            targets:
              - chain-reader
            color: cyan
            linger: 0.18
            caption_boundary: true
          - id: corrected-prefix
            phrase: both models need the corrected history
            targets:
              - chain-reader
            color: cyan
            linger: 0.18
            caption_boundary: true
  - id: row-alignment
    title: Attach every distribution to its preceding input
    visual: The target processes pending input u after cached prefix C. Its output scores x1. After x2
      fails, the target retains state through x1 and commits the correction with its state pending.
    beats:
      - say: Align the actual causal rows. Cached prefix C already has state; committed token u is pending. Inputs u,
          x one, x two and x three produce rows p one through p four. The row emitted by u scores x one. The
          row emitted by x one scores x two. The row after x three supplies the bonus. A token’s own logits
          predict what follows it.
        hold: 0.7
        visual_cues:
          - id: sd-row-alignment-b0
            phrase: Align the actual causal rows.
            targets:
              - sd-row-alignment-mechanism
            color: cyan
            linger: 0.45
          - id: sd-row-u
            phrase: The row emitted by u scores x one
            targets:
              - sd-row-alignment-mechanism
            color: cyan
            linger: 0.45
          - id: sd-row-x1
            phrase: The row emitted by x one scores x two
            targets:
              - sd-row-alignment-mechanism
            color: cyan
            linger: 0.45
          - id: sd-row-bonus
            phrase: The row after x three supplies the bonus
            targets:
              - sd-row-alignment-mechanism
            color: cyan
            linger: 0.45
      - say: If x one survives and x two is rejected, retain target state for C, u and x one. Discard state for x two
          and its dependent x three. Emit the correction at the x-two position, with its own KV still pending.
          Draft and target computed lengths can differ; ordinary drafting may leave its last sampled proposal
          unprocessed.
        hold: 0.7
        visual_cues:
          - id: sd-row-alignment-b1
            phrase: If x one survives and x two is rejected, retain target state for C, u and x one.
            targets:
              - sd-row-alignment-mechanism
            color: cyan
            linger: 0.45
          - id: sd-row-trim
            phrase: Discard state for x two and its dependent x three
            targets:
              - sd-row-alignment-mechanism
            color: cyan
            linger: 0.45
          - id: sd-row-pending
            phrase: with its own KV still pending
            targets:
              - sd-row-alignment-mechanism
            color: cyan
            linger: 0.45
      - say: To see what the cache remembers, write one digit for every token it processes. Read one, two,
          three. The state now reads one hundred twenty-three. Keep the first two tokens and replace the
          third with four. The reader has three tokens, but the reusable state is still twelve. Processing
          the correction gives one hundred twenty-four.
        hold: 0.7
        visual_cues:
          - id: sd-row-alignment-b2
            phrase: write one digit for every token it processes
            targets:
              - sd-row-alignment-mechanism
            color: cyan
            linger: 0.45
          - id: sd-row-124
            phrase: Processing the correction gives one hundred twenty-four
            targets:
              - sd-row-alignment-mechanism
            color: cyan
            linger: 0.45
  - id: commit
    title: Committed text and computed state advance separately
    visual: On rejection, the target trims the rejected suffix. On full acceptance, the final target row
      supplies a bonus. The correction and the bonus each need a forward pass before their state exists.
    beats:
