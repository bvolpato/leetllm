            phrase: the acceptance draw is 0.80
            targets: [transfer-uniform]
            color: yellow
          - id: candidate-prediction
            phrase: Predict whether softly is committed
            targets:
              - transfer-prediction
              - transfer-candidate
            color: yellow
        hold: 2.3
      - say: The ratio is min of one and 0.30 divided by 0.60, which is 0.50. Since 0.80 is larger, reject softly and
          discard the dependent proposal today. The positive deficit is 0.00, 0.30, 0.00, so its total is
          0.30. Normalizing leaves all correction mass on nearby.
        caption_starts:
