  - id: architecture-evaluation
    title: "Two policies on the same release"
    visual: A fixed three-read checklist and an early-exit policy run against the same two reader fixtures. The second release exposes a denied proposal and a supported answer at the same completed-read count.
    beats:
      - say: >-
          Compare two scripted policies on the releases we investigated earlier. One always asks for CI, migration and replay, in that order. The other can answer after CI if the runner is down. Both use the same host and a budget of four decision turns.
        hold: 0.55
        visual_cues:
          - id: eval-policies
            phrase: "One always asks for CI, migration and replay"
            targets: [runs]
            linger: 0.25
      - say: >-
          On the migration failure, both do three reads and use the fourth turn to answer. Now switch to the runner outage. The host has one permitted read for this release, the CI result. Both policies receive it. Which policy can finish the task?
        hold: 2
        visual_cues:
          - id: eval-three
            phrase: "both do three reads"
            targets: [runs]
            linger: 0.25
          - id: eval-migration-answer
            phrase: "use the fourth turn to answer"
            targets: [runs]
            linger: 0.25
          - id: eval-outage
            phrase: "switch to the runner outage"
            targets: [runs]
            linger: 0.25
          - id: eval-first-read
            phrase: "Both policies receive it"
            targets: [runs]
            linger: 0.25
          - id: eval-ask
            phrase: "Which policy can finish the task"
            targets: [result]
            linger: 0.25
      - say: >-
          The early exit reports the runner outage. The fixed checklist asks for the migration. The host rejects that request before a read occurs. Count the completed reads. One on each side, with very different outcomes. A coded workflow could use that same early exit. These runs test the rule we gave each policy.
        hold: 0.65
        visual_cues:
          - id: eval-answer
            phrase: "The early exit reports the runner outage"
            targets: [runs]
            linger: 0.25
            caption_boundary: true
          - id: eval-denied
            phrase: "host rejects that request before a read occurs"
            targets: [runs]
            linger: 0.25
            caption_boundary: true
          - id: eval-count
            phrase: "One on each side"
            targets: [result]
            linger: 0.25
      - say: >-
          When you compare real systems, hold tasks, tools, permissions, model settings and budget fixed. Keep expected answers out of the prompt. Include ambiguous evidence, expired or unavailable health, denied effects and stuck loops. Measure supported answers, unsupported claims, attempted effects, recovery, elapsed time and total cost. Add a router for known categories, a plan for dependencies, reflection for useful feedback, or search for recoverable branches when the comparison justifies it.
        hold: 0.65
        visual_cues:
          - id: eval-matched
            phrase: "hold tasks, tools, permissions, model settings and budget fixed"
            targets: [result]
            linger: 0.25
