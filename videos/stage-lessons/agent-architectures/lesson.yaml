  - id: ci-policy
    title: A successful lookup can report a failed build
    visual: "Two CI replies lead to different next steps. A migration failure prompts a file read. A runner outage leaves the second read empty."
    beats:
      - say: >-
          A build failed. Our scripted assistant asks for its CI result. The lookup succeeds. The result says the migration failed. The assistant reads the authorized migration file and finds a column added without a guard. Here's the entry it leaves in the log. Review migration semantics. No write performed.
        hold: 0.7
        visual_cues:
          - id: aa-ci-policy-0
            phrase: >-
              A build failed. Our scripted assistant asks for its CI result. The lookup succeeds. The result says the migration failed. The assistant reads the authorized migration file and finds a column added without a guard. Here's the entry it leaves in the log. Review migration semantics. No write performed.
            targets:
              - aa-ci-policy-mechanism
            color: cyan
            linger: 0.4
          - id: ci-request
            phrase: "asks for its CI result"
            targets:
              - aa-ci-policy-mechanism
            color: cyan
            linger: 0.4
          - id: ci-first-result
            phrase: "the migration failed"
            targets:
              - aa-ci-policy-mechanism
            color: cyan
            linger: 0.4
          - id: ci-second-read
            phrase: "finds a column added without a guard"
            targets:
              - aa-ci-policy-mechanism
            color: cyan
            linger: 0.4
          - id: ci-conclusion
            phrase: "Review migration semantics. No write performed"
            targets:
              - aa-ci-policy-mechanism
            color: cyan
            linger: 0.4
      - say: >-
          Change the first reply to runner unavailable. Now there's no migration result to investigate. The assistant reports insufficient evidence after one call. If the CI read times out instead, the host counts the attempt and stores an error receipt before deferral.
        hold: 0.7
        visual_cues:
          - id: aa-ci-policy-1
            phrase: >-
              Change the first reply to runner unavailable. Now there's no migration result to investigate. The assistant reports insufficient evidence after one call. If the CI read times out instead, the host counts the attempt and stores an error receipt before deferral.
            targets:
              - aa-ci-policy-mechanism
            color: cyan
            linger: 0.4
          - id: ci-runner
            phrase: runner unavailable
            targets:
              - aa-ci-policy-mechanism
            color: cyan
            linger: 0.4
          - id: ci-defer
            phrase: insufficient evidence after one call
            targets:
              - aa-ci-policy-mechanism
            color: cyan
            linger: 0.4
          - id: ci-timeout
            phrase: stores an error receipt before deferral
            targets:
              - aa-ci-policy-mechanism
            color: cyan
            linger: 0.4
      - say: >-
          Give the assistant two tool attempts. If it keeps asking for the same CI result, it receives two receipts. The host stops it before a third dispatch. It can still give a final answer after the last read. Each result here fits in a hundred and twenty characters. To use one later, keep its request, repository, revision and retrieval time.
        hold: 0.7
        visual_cues:
          - id: aa-ci-policy-2
            phrase: >-
              Give the assistant two tool attempts. If it keeps asking for the same CI result, it receives two receipts. The host stops it before a third dispatch. It can still give a final answer after the last read. Each result here fits in a hundred and twenty characters. To use one later, keep its request, repository, revision and retrieval time.
            targets:
              - aa-ci-policy-mechanism
            color: cyan
            linger: 0.4
          - id: ci-two-attempts
            phrase: receives two receipts
            targets:
              - aa-ci-policy-mechanism
            color: cyan
            linger: 0.4
          - id: ci-third-held
            phrase: before a third dispatch
            targets:
              - aa-ci-policy-mechanism
            color: cyan
            linger: 0.4
  - id: completion-evidence
    title: "When has the investigation earned an answer?"
    visual: Two releases share their first read. Their claim-specific evidence and decision turns diverge on facing rows. A first-turn claim with an empty host record gets the same completion check.
    beats:
      - say: >-
          Here's a second local investigation, with a different stopping rule. Both releases begin by reading the continuous integration result. On release R eighteen forty-two, the migration failed. Read the migration, then run the replay on a throwaway database. This schema diagnosis needs all three results.
        hold: 0.6
        visual_cues:
          - id: invest-ci
            phrase: "reading the continuous integration result"
            targets: [run-a]
            linger: 0.25
          - id: invest-fact
            phrase: "the migration failed"
            targets: [run-a]
            linger: 0.25
          - id: invest-file
            phrase: "Read the migration"
            targets: [run-a]
            linger: 0.25
          - id: invest-replay
            phrase: "run the replay on a throwaway database"
            targets: [run-a]
            linger: 0.25
          - id: invest-schema
            phrase: "needs all three results"
            targets: [run-a]
            linger: 0.25
      - say: >-
          On release R eighteen forty-three, the runner was unavailable. That first read is enough to report a runner outage. The host accepts each answer against the evidence its own claim requires. One case took three reads. The other took one.
        hold: 0.65
        visual_cues:
          - id: invest-runner
            phrase: "the runner was unavailable"
            targets: [run-b]
            linger: 0.25
          - id: invest-outage
            phrase: "report a runner outage"
            targets: [run-b]
            linger: 0.25
      - say: >-
          Start release R eighteen forty-two again. On its very first turn, the policy claims a schema bug and cites all three tools. Look at what actually came back. Can the host accept this answer?
        hold: 2
        visual_cues:
          - id: invest-cites
            phrase: "cites all three tools"
            targets: [claim]
            linger: 0.25
          - id: invest-question
            phrase: "Can the host accept this answer"
            targets: [observed]
            linger: 0.25
      - say: >-
          The host rejects it. The list of observed results is empty. Citing a tool can't fill its slot. This check establishes that the required reads happened. Checking whether a conclusion follows from those results takes a verifier for the claim itself.
        hold: 0.6
        visual_cues:
          - id: invest-reject
            phrase: "The host rejects it"
            targets: [observed]
            linger: 0.25
            caption_boundary: true
      - say: >-
          Count the turns on the successful migration run. Three turns read tools. A fourth returns the answer. Give this loop only two turns, and it stops before the replay. The earlier loop counted tool attempts instead. For either budget, the counter tells you what the host admitted. A model call can run many forward passes.
        hold: 0.7
        visual_cues:
          - id: invest-three
            phrase: "Three turns read tools"
            targets: [run-a]
            linger: 0.25
          - id: invest-fourth
            phrase: "A fourth returns the answer"
            targets: [run-a]
            linger: 0.25
          - id: invest-limit
            phrase: "only two turns"
            targets: [run-a]
            linger: 0.25
          - id: invest-stop
            phrase: "stops before the replay"
            targets: [run-a]
            linger: 0.25
  - id: workflow-choice
    title: "Two readers, one closure notice"
    visual: Two policies receive the same Art notice. One uses a fixed fallback. The other can use the extra sentence about the east entrance to propose a different read.
    beats:
      - say: >-
          Try an alternative version of the notice from Art. Give exactly the same notice to two assistants. On the left, you wrote a fallback rule. If the main gallery is closed, check History. That assistant follows the route you chose.
        hold: 0.65
        visual_cues:
          - id: choice-notice
            phrase: "same notice to two assistants"
            targets: [notice]
            linger: 0.25
          - id: choice-rule
            phrase: "If the main gallery is closed, check History"
            targets: [coded]
            linger: 0.25
      - say: >-
          Read the second sentence. Other galleries are open through the east entrance. What could the assistant on the right usefully check before it gives up on Art?
        hold: 1.95
        visual_cues:
          - id: choice-detail
            phrase: "Other galleries are open through the east entrance"
            targets: [notice]
            linger: 0.25
          - id: choice-question
            phrase: "What could the assistant on the right usefully check"
            targets: [model-choice]
            linger: 0.25
      - say: >-
          It could check today's visiting hours at the east entrance. Here the model proposes that follow-up after reading the notice. You could also write an east-entrance rule. If you can enumerate the cases you need, a coded workflow will handle them. When new kinds of notices keep turning up, compare the two approaches on the same tasks, including the time and cost of the extra model calls.
        hold: 0.7
        visual_cues:
          - id: choice-follow
            phrase: "check today's visiting hours at the east entrance"
            targets: [model-choice]
            linger: 0.25
            caption_boundary: true
          - id: choice-compare
            phrase: "compare the two approaches on the same tasks"
            targets: [coded]
            linger: 0.25
  - id: context-triangle
    title: "How often do you send the same observation?"
    visual: A token triangle keeps each observation color and call number. Repeated copies fill later call
      columns, then sum into the actual87500 total; the first observation owns9copies rather than10.
    beats:
      - say: >-
          Each column is one model request. The first sends two thousand tokens of instructions and tool definitions. After each reply, we add fifteen hundred tokens of actions and observations. Send the whole history again each time. The tenth column has nine extra blocks, for fifteen thousand five hundred input tokens.
        hold: 0.7
        visual_cues:
          - id: aa-context-triangle-0
            phrase: >-
              Each column is one model request. The first sends two thousand tokens of instructions and tool definitions. After each reply, we add fifteen hundred tokens of actions and observations. Send the whole history again each time. The tenth column has nine extra blocks, for fifteen thousand five hundred input tokens.
            targets:
              - aa-context-triangle-mechanism
            color: cyan
            linger: 0.4
          - id: context-final
            phrase: fifteen thousand five hundred input tokens
            targets:
              - aa-context-triangle-mechanism
            color: cyan
            linger: 0.4
      - say: >-
          Add the blue bases first. Ten copies of two thousand gives twenty thousand. Above them are forty-five extra blocks, one plus two all the way up to nine. At fifteen hundred tokens each, those blocks bring the total to eighty-seven thousand five hundred. Follow the first observation across the chart. You send it nine times. The tenth observation arrives after the last call.
        hold: 0.7
        visual_cues:
          - id: aa-context-triangle-1
            phrase: >-
              Add the blue bases first. Ten copies of two thousand gives twenty thousand. Above them are forty-five extra blocks, one plus two all the way up to nine. At fifteen hundred tokens each, those blocks bring the total to eighty-seven thousand five hundred. Follow the first observation across the chart. You send it nine times. The tenth observation arrives after the last call.
            targets:
              - aa-context-triangle-mechanism
            color: cyan
            linger: 0.4
          - id: context-total
            phrase: eighty-seven thousand five hundred
            targets:
              - aa-context-triangle-mechanism
            color: cyan
            linger: 0.4
          - id: context-nine
            phrase: nine times
            targets:
              - aa-context-triangle-mechanism
            color: cyan
            linger: 0.4
      - say: >-
          With K requests, the base goes in K times. The extra blocks form a triangle. Multiply K by one less than K, then divide by two to count those blocks. That's why replaying fixed additions makes total input grow quadratically. Even when blocks vary in size, a block added after call J goes in K minus J more times. A final synthesis call adds another column. A ReAct loop can also keep full receipts elsewhere and fetch just the evidence it needs.
        hold: 0.7
        visual_cues:
          - id: aa-context-triangle-2
            phrase: >-
              With K requests, the base goes in K times. The extra blocks form a triangle. Multiply K by one less than K, then divide by two to count those blocks. That's why replaying fixed additions makes total input grow quadratically. Even when blocks vary in size, a block added after call J goes in K minus J more times. A final synthesis call adds another column. A ReAct loop can also keep full receipts elsewhere and fetch just the evidence it needs.
            targets:
              - aa-context-triangle-mechanism
            color: cyan
            linger: 0.4
  - id: cache-and-context
    title: "Where do the repeated tokens go?"
    visual: "The ten columns first keep at most two previous blocks. Restoring the full history shows which tokens the cache writes once and which tokens it reads again."
    beats:
      - say: >-
          Keep only the last two blocks above each blue base. Across ten requests you now send forty-five thousand five hundred tokens. Check that the assistant can still answer with the older observations removed. Now restore the full history and let the cache keep every matching prefix. Across the same ten calls you get seventy-two thousand cached-read tokens and fifteen thousand five hundred new cache-write tokens.
        hold: 0.7
        visual_cues:
          - id: aa-cache-and-context-0
            phrase: >-
              Keep only the last two blocks above each blue base. Across ten requests you now send forty-five thousand five hundred tokens. Check that the assistant can still answer with the older observations removed. Now restore the full history and let the cache keep every matching prefix. Across the same ten calls you get seventy-two thousand cached-read tokens and fifteen thousand five hundred new cache-write tokens.
            targets:
              - aa-cache-and-context-mechanism
            color: cyan
            linger: 0.4
          - id: context-bounded
            phrase: forty-five thousand five hundred
            targets:
              - aa-cache-and-context-mechanism
            color: cyan
            linger: 0.4
          - id: context-cached
            phrase: seventy-two thousand cached-read tokens
            targets:
              - aa-cache-and-context-mechanism
            color: cyan
            linger: 0.4
          - id: context-written
            phrase: fifteen thousand five hundred new cache-write tokens
            targets:
              - aa-cache-and-context-mechanism
            color: cyan
            linger: 0.4
          - id: context-restore
            phrase: "restore the full history"
            targets: [aa-cache-and-context-mechanism]
            linger: 0.25
      - say: >-
          Follow the yellow block on the first call. The cache writes it once. On the next call those same tokens are blue and can be read from the cache. That reuse depends on the prefix still matching and still being stored. To work out the bill, apply the service's rates to reads, writes and output, then include tools and retries. To explain a slow answer, measure queues, cache misses, tool time and output length.
        hold: 0.7
        visual_cues:
          - id: aa-cache-and-context-1
            phrase: >-
              Follow the yellow block on the first call. The cache writes it once. On the next call those same tokens are blue and can be read from the cache. That reuse depends on the prefix still matching and still being stored. To work out the bill, apply the service's rates to reads, writes and output, then include tools and retries. To explain a slow answer, measure queues, cache misses, tool time and output length.
            targets:
              - aa-cache-and-context-mechanism
            color: cyan
            linger: 0.4
          - id: context-base
            phrase: "yellow block on the first call"
            targets: [aa-cache-and-context-mechanism]
            linger: 0.25
          - id: context-base-read
            phrase: "On the next call those same tokens"
            targets: [aa-cache-and-context-mechanism]
            linger: 0.25
  - id: tainted-interface
    title: "Who can authorize a patch draft?"
    visual: "The host classifies the tools, checks approval for the exact change and records one draft. It rejects a subsequent malformed request before another draft can be created."
    beats:
      - say: >-
          A CI log can tell us which migration failed. Keep its source attached when you summarize it. The host has a separate registry for permissions. Read CI is a read. Open patch is a write, even when that suggestion came from a log.
        hold: 0.7
        visual_cues:
          - id: aa-tainted-interface-0
            phrase: >-
