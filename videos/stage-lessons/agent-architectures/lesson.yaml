            targets:
              - aa-react-research-mechanism
            color: cyan
            linger: 0.4
          - id: research-act
            phrase: forty-five at best
            targets:
              - aa-react-research-mechanism
            color: cyan
            linger: 0.4
          - id: research-butler
            phrase: BUTLER reported thirty-seven
            targets:
              - aa-react-research-mechanism
            color: cyan
            linger: 0.4
          - id: research-webshop
            phrase: ReAct reached forty percent
            targets:
