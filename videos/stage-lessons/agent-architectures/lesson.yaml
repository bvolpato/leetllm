scenes:
  - id: subject-intro
    title: "Where should the assistant look next?"
    visual: A train follows the line to Art. A gallery closure makes History the next candidate. Its opening hours and its route are still unknown.
    beats:
      - say: >-
          This train goes straight to the Art Museum. See the notice at the stop? The gallery you came to see is closed for repairs.
        hold: 0.55
        visual_cues:
          - id: intro-art
            phrase: "This train goes straight to the Art Museum"
            targets: [art-route, art-stop]
            linger: 0.25
          - id: intro-closure
            phrase: "closed for repairs"
            targets: [art-stop]
            linger: 0.25
      - say: >-
          The History Museum is across town. You still want ninety minutes inside and you need to finish by five. What should your assistant look up first, the opening hours or a train to History?
        hold: 2.2
        visual_cues:
          - id: intro-history
            phrase: "the History Museum"
            targets: [history-stop]
            linger: 0.25
          - id: intro-task
            phrase: "ninety minutes inside"
            targets: [task]
            linger: 0.25
          - id: intro-question
            phrase: "the opening hours or a train to History"
            targets: [map-question]
            linger: 0.25
      - say: >-
          Check whether History is open today. If it is, then find a train that goes there.
        hold: 0.75
        visual_cues:
          - id: intro-next
            phrase: "Check whether History is open today"
            targets: [history-stop]
            linger: 0.25
            caption_boundary: true
  - id: control-contract
    title: "Who sends the request?"
    visual: A proposed hours lookup passes from the policy to the host and then to the hours service. A receipt slot stays empty while the request is in flight.
    beats:
      - say: >-
          The assistant proposes a lookup for today's hours at History. Its policy chooses the question. The request is still here on the left.
        hold: 0.55
        visual_cues:
          - id: control-propose
            phrase: "proposes a lookup"
            targets: [proposal]
            linger: 0.25
      - say: >-
          The host checks the venue, date and permission to read the hours. Then it sends the request. The model supplies the arguments. Application code runs the tool.
        hold: 0.6
        visual_cues:
          - id: control-validate
            phrase: "checks the venue, date and permission"
            targets: [host]
            linger: 0.25
          - id: control-dispatch
            phrase: "sends the request"
            targets: [dispatch]
            linger: 0.25
      - say: >-
          Who picked History? If you wrote the fallback rule, your code picked it. That's a workflow, even if it branches, retries or asks a model for a summary. In Anthropic's terminology, an agent lets the model choose what work or tool to try next.
        hold: 0.55
        visual_cues:
          - id: control-code
            phrase: "your code picked it"
            targets: [proposal]
            linger: 0.25
          - id: control-policy
            phrase: "the model choose what work or tool to try next"
            targets: [proposal]
            linger: 0.25
      - say: >-
          Keep the request and the returned result in the task's state. That's enough to choose again. A written plan and long-term memory are optional.
        hold: 0.65
        visual_cues:
          - id: control-state
            phrase: "returned result in the task's state"
            targets: [dispatch]
            linger: 0.25
  - id: state-record
    title: "What came back from History?"
    visual: The outbound and returned halves of one hours lookup share a call ID. The return carries the venue, date, timestamp and hours.
    beats:
      - say: >-
          Call hours twenty-four asks for History's hours today. The empty half on the right is where its reply will go.
        hold: 0.7
        visual_cues:
          - id: record-request
            phrase: "Call hours twenty-four"
            targets: [request]
            linger: 0.25
          - id: record-empty
            phrase: "empty half on the right"
            targets: [reply]
            linger: 0.25
      - say: >-
          The hours service replies. History is open from one until six today. The host saves the answer with the call ID and the time it arrived. That record is the receipt.
        hold: 0.65
        visual_cues:
          - id: record-reply
            phrase: "The hours service replies"
            targets: [reply]
            linger: 0.25
          - id: record-hours
            phrase: "open from one until six today"
            targets: [reply]
            linger: 0.25
      - say: >-
          Six is when the museum closes. Five is when you need to finish. The hours service supplied one limit. You supplied the other.
        hold: 0.7
        visual_cues:
          - id: record-close
            phrase: "Six is when the museum closes"
            targets: [reply]
            linger: 0.25
          - id: record-limit
            phrase: "Five is when you need to finish"
            targets: [task]
            linger: 0.25
  - id: react-loop
    title: "One lookup, two next moves"
    visual: Two runs start with the same History hours request. Changing only the returned hours changes the proposed follow-up.
    beats:
      - say: >-
          With History open, the assistant asks for a journey to History. That's one pass through the ReAct loop. Choose a lookup, let the host run it, then use the observation to choose again.
        hold: 0.7
        visual_cues:
          - id: loop-open
            phrase: "With History open"
            targets: [open-run]
            linger: 0.25
          - id: loop-route
            phrase: "asks for a journey to History"
            targets: [open-run]
            linger: 0.25
      - say: >-
          Try a second run. Same request, same museum. This time the reply says closed all day. Would you spend the next lookup on a train to History?
        hold: 1.9
        visual_cues:
          - id: loop-other
            phrase: "Try a second run"
            targets: [closed-run]
            linger: 0.25
          - id: loop-closed
            phrase: "closed all day"
            targets: [closed-run]
            linger: 0.25
          - id: loop-question
            phrase: "Would you spend the next lookup"
            targets: [next-choice]
            linger: 0.25
      - say: >-
          Look for another venue. Changing one reply changed the next action. Both runs leave a trail of requests and results. We'll follow the first run, where History is open.
        hold: 0.6
        visual_cues:
          - id: loop-alternative
            phrase: "Look for another venue"
            targets: [closed-run]
            linger: 0.25
            caption_boundary: true
          - id: loop-main
            phrase: "the first run"
            targets: [open-run]
            linger: 0.25
  - id: react-research
    title: "What did the Act control see?"
    visual: "Follow a lookup through Thought, Action and Observation. Compare best and average ALFWorld success rates and the WebShop results as the corresponding bars appear."
    beats:
      - say: >-
          The ReAct paper calls these three parts Thought, Action and Observation. A thought can be a short note about what to try. The paper's prompts sometimes go straight to the action. To see what an assistant actually did, follow the request the host validated to the result it recorded.
        hold: 0.7
        visual_cues:
          - id: aa-react-research-0
            phrase: >-
              The ReAct paper calls these three parts Thought, Action and Observation. A thought can be a short note about what to try. The paper's prompts sometimes go straight to the action. To see what an assistant actually did, follow the request the host validated to the result it recorded.
            targets:
              - aa-react-research-mechanism
            color: cyan
            linger: 0.4
      - say: >-
          In the paper's ALFWorld tasks, the best of six ReAct prompts reached seventy-one percent success. Their average was fifty-seven. The Act control kept the observations and dropped the written reasoning. It reached forty-five at best. BUTLER reported thirty-seven. On WebShop, ReAct reached forty percent, versus twenty-nine point one for imitation learning and twenty-eight point seven for imitation plus reinforcement learning.
        hold: 0.7
        visual_cues:
          - id: aa-react-research-1
            phrase: >-
              In the paper's ALFWorld tasks, the best of six ReAct prompts reached seventy-one percent success. Their average was fifty-seven. The Act control kept the observations and dropped the written reasoning. It reached forty-five at best. BUTLER reported thirty-seven. On WebShop, ReAct reached forty percent, versus twenty-nine point one for imitation learning and twenty-eight point seven for imitation plus reinforcement learning.
            targets:
              - aa-react-research-mechanism
            color: cyan
            linger: 0.4
          - id: research-act-control
            phrase: "The Act control kept the observations and dropped the written reasoning"
            targets:
              - aa-react-research-mechanism
            color: cyan
            linger: 0.4
