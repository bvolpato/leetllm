            caption_boundary: true
          - id: first-end
            phrase: Class zero alone takes point nine eight
            targets:
              - picture
            caption_boundary: true
      - say: The direct set is empty. The first edge already passed the cutoff, and every following piece adds mass. A
          model can give one class almost all the probability and still produce this result.
        hold: 1
        visual_cues:
          - id: empty
            phrase: The direct set is empty
            targets:
