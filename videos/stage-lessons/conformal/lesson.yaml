            caption_boundary: true
  - id: aps-crossing
    title: Where does the first crossing occur?
    visual: Compare two stopping rules on the same strip, then sort a fresh row whose second cumulative score lands
      exactly on the cutoff.
    beats:
      - say: Follow the blue bar from zero to its tip. It passes the yellow cutoff and ends at point nine eight.
          Keep the first class that crosses the line. Here that gives us class zero. Every label the direct rule
          kept stays in the set, so adding the crossing label preserves the lower coverage bound.
        hold: 1
        visual_cues:
          - id: trace
            phrase: Follow the blue bar from zero to its tip
            targets: [picture]
          - id: one
            phrase: Here that gives us class zero
            targets:
              - picture
            caption_boundary: true
      - say: Go back to the equal shares. The first three end inside. The fourth piece carries us past the line, so the
          conservative rule keeps all four. If nothing crosses the cutoff, this rule keeps every class.
        hold: 1
        visual_cues:
