version: 1
id: conformal
title: Prediction Sets with Measured Coverage
source: foundations/conformal-prediction-uncertainty-sets/content.md
voice: af_heart
rate: +12%
sources:
  - title: "Angelopoulos and Bates: A Gentle Introduction to Conformal Prediction"
    url: https://arxiv.org/abs/2107.07511
  - title: "Shafer and Vovk: A Tutorial on Conformal Prediction"
    url: https://jmlr.org/papers/v9/shafer08a.html
  - title: "Romano, Sesia and Candes: Classification with Valid and Adaptive Coverage"
    url: https://arxiv.org/abs/2006.02544
  - title: "Angelopoulos et al.: Conformal Risk Control, version 4"
    url: https://arxiv.org/abs/2208.02814v4
  - title: "Barber et al.: Conformal Prediction Beyond Exchangeability"
    url: https://arxiv.org/abs/2202.13415
  - title: NumPy quantile method conventions
    url: https://numpy.org/doc/stable/reference/generated/numpy.quantile.html
scenes:
  - id: intro
    title: Does the edge of the arrival window count?
    visual: A train moves along a time scale and stops at the right edge of its arrival window. Move the same
      arrival a minute later, then use held-out server requests to ask how wide a new interval should be.
    beats:
      - say: The app predicts eight forty. The yellow window reaches two minutes either way. The train pulls in
          at eight forty-two. Does the edge count as covered?
        hold: 2.3
        caption_starts:
          - Does the edge count as covered
        visual_cues:
          - id: stop
            phrase: The train pulls in at eight forty-two
            targets: [picture]
            caption_boundary: true
      - say: Yes. Both endpoints count. Move the arrival one minute later. Now it's outside. This window is for
          today's train. A confidence interval for the mean would estimate its average arrival time across days.
        hold: 1
        visual_cues:
          - id: covered
            phrase: Yes
            targets: [picture]
          - id: later
            phrase: Move the arrival one minute later
            targets: [picture]
            caption_boundary: true
          - id: miss
            phrase: Now it's outside
            targets: [picture]
            caption_boundary: true
      - say: How wide should a prediction interval be for a server response? The forecast is forty milliseconds.
          The caller gives up at fifty. Nine held-out errors will set the radius.
        hold: 0.9
        visual_cues:
          - id: server
            phrase: How wide should a prediction interval be
            targets: [picture]
          - id: deadline
            phrase: The caller gives up at fifty
            targets: [picture]
            caption_boundary: true
          - id: held-out
            phrase: Nine held-out errors
            targets: [picture]
            caption_boundary: true
  - id: split
    title: Which requests can calibrate the interval?
    visual: Separate fitting, selection, calibration and testing. Trace what happens when calibration outcomes feed
      back into the fitted procedure.
    beats:
      - say: This is split conformal prediction. Fit the predictor on training requests. Choose the model using separate
          validation data. Then freeze the whole procedure, including preprocessing, the predictor and the scoring
          rule. Only now open the calibration outcomes and measure the misses. Test requests come later.
        hold: 0.8
        visual_cues:
          - id: fit
            phrase: Fit the predictor on training requests
            targets:
              - picture
            caption_boundary: true
          - id: freeze
            phrase: freeze the whole procedure
            targets:
              - picture
            caption_boundary: true
      - say: Suppose you send the calibration errors back to the training step and keep the model that does best on
          them. Those requests just helped pick the winner. Its errors can look smaller there than on fresh
          traffic. Picking only the easy calibration requests after seeing their errors would bias the sample too.
        hold: 1
        visual_cues:
          - id: feedback
            phrase: send the calibration errors back to the training step
            targets:
              - picture
            caption_boundary: true
      - say: Keep that winning model frozen and bring in an untouched calibration split. The new requests and that split
          must come from a process that lets them trade places in the rank argument. Given the fitted procedure,
          the coverage probability averages over the calibration data and a new request together. For each
          held-out record, keep its forecast next to its outcome.
        hold: 1
        visual_cues:
          - id: independent
            phrase: bring in an untouched calibration split
            targets:
              - picture
            caption_boundary: true
          - id: audit
            phrase: For each held-out record
            targets:
              - picture
            caption_boundary: true
  - id: scores
    title: How far did each forecast miss?
    visual: Compare opposite signed errors on two aligned latency tracks. Both gaps become 3 ms sticks in the
      calibration rack.
    beats:
      - say: Look at request C two. The forecast was thirty-five milliseconds. It finished at thirty-two. Now look at C
          three. The forecast was forty and it finished at forty-three. Which forecast missed by more?
        hold: 2.2
        visual_cues:
          - id: first
            phrase: It finished at thirty-two
            targets:
              - picture
            caption_boundary: true
          - id: second
            phrase: Now look at C three
            targets:
              - picture
            caption_boundary: true
          - id: second-actual
            phrase: it finished at forty-three
            targets:
              - picture
            caption_boundary: true
          - id: ask
            phrase: Which forecast missed by more
            targets:
              - picture
            caption_boundary: true
      - say: They both missed by three milliseconds. One finished early and the other finished late. Measure the
          distance between each pair of dots and you get the absolute residual. That's our nonconformity score.
          A bigger score means the forecast missed by more.
        hold: 1.1
        visual_cues:
          - id: tie
            phrase: They both missed by three milliseconds
            targets:
              - picture
            caption_boundary: true
      - say: Here are all nine held-out requests. The two sticks of height three still belong to different requests. Mix
          up the records and the gaps travel with them. We want a radius we can apply to the next forecast before
          we know its outcome.
        hold: 1
        visual_cues:
          - id: nine
            phrase: Here are all nine held-out requests
            targets:
              - picture
            caption_boundary: true
          - id: reorder
            phrase: Mix up the records
            targets:
              - picture
            caption_boundary: true
  - id: quantile
    title: Which slot sets the radius?
    visual: Count the future position, sort the named residuals and move the selection from the eighth slot to the
      ninth when the coverage target rises.
    beats:
      - say: We want the set to cover at least eighty percent of new outcomes across repeated draws. That leaves twenty
          percent for misses, the quantity called alpha. Count nine held-out errors and one future position.
          Multiply ten by point eight and round up. That gives rank eight.
        hold: 0.9
        visual_cues:
          - id: future
            phrase: nine held-out errors and one future position
            targets:
              - picture
            caption_boundary: true
          - id: rank
            phrase: That gives rank eight
            targets:
              - picture
            caption_boundary: true
      - say: Sort the nine sticks from shortest to tallest. Count to the eighth slot. The stick there measures eight
          milliseconds. Eight is doing two jobs here. The position is a count. The stick's height is an error in
          milliseconds.
        hold: 1
        visual_cues:
          - id: sort
            phrase: Sort the nine sticks from shortest to tallest
            targets:
              - picture
            caption_boundary: true
          - id: value
            phrase: The stick there measures eight milliseconds
            targets:
              - picture
            caption_boundary: true
      - say: Raise the target to eighty-five percent. Ten times point eight five lands halfway between eight and nine.
          Which stick do we take?
        hold: 2.4
        visual_cues:
          - id: higher-target
            phrase: Raise the target to eighty-five percent
            targets:
              - picture
            caption_boundary: true
      - say: Round up to rank nine. That stick measures twelve milliseconds. The rule is the ceiling of the number of
          positions, including the future one, times the desired coverage. Take the value at that rank.
        hold: 1
        visual_cues:
          - id: next-rank
            phrase: That stick measures twelve milliseconds
            targets:
              - picture
            caption_boundary: true
      - say: Back at eighty percent, we need the eighth stick. Let's make sure the code picks it.
        hold: 0.8
        visual_cues:
          - id: restore
            phrase: Back at eighty percent
            targets:
              - picture
            caption_boundary: true
  - id: index-contract
    title: Which value did the library return?
    visual: Compare two NumPy expressions on the sorted residuals. Two rank tracks show why the 95% target needs at
      least nineteen scores for a finite observed threshold.
    beats:
      - say: Python starts counting at zero. To select rank eight, ask partition for index seven and read that element.
          It returns eight milliseconds. Partition only needs to put the requested order statistic in the right
          place.
        hold: 1
        visual_cues:
          - id: partition
            phrase: ask partition for index seven
            targets:
              - picture
            caption_boundary: true
          - id: direct
            phrase: It returns eight milliseconds
            targets:
              - picture
            caption_boundary: true
      - say: Try NumPy's higher quantile with the level set to eight ninths. For nine scores its last index is eight. It
          multiplies that last index by the level and rounds up. That picks index eight, the ninth stick. The call
          returns twelve milliseconds. An interval this wide is conservative here, but it uses a different stick.
        hold: 1.2
        visual_cues:
          - id: level
            phrase: Try NumPy's higher quantile
            targets:
              - picture
            caption_boundary: true
          - id: higher
            phrase: The call returns twelve milliseconds
            targets:
              - picture
            caption_boundary: true
      - say: Now try both calls for the ninety percent target. Rank nine uses index eight. The quantile level is nine
          ninths, or one. This time both calls return twelve. Agreement at the maximum could hide the earlier
          indexing mistake.
        hold: 1
        visual_cues:
          - id: max
            phrase: Now try both calls for the ninety percent target
            targets:
              - picture
            caption_boundary: true
          - id: ninety
            phrase: This time both calls return twelve
            targets:
              - picture
            caption_boundary: true
      - say: At ninety-five percent the corrected rank is ten. Look at the empty slot. With only nine calibration errors
          the ordinary rule gives an infinite radius. Clipping to the largest stick would cover just nine of ten
          possible distinct ranks.
        hold: 1
        visual_cues:
          - id: missing
            phrase: At ninety-five percent
            targets:
              - picture
            caption_boundary: true
          - id: infinite
            phrase: the ordinary rule gives an infinite radius
            targets:
              - picture
            caption_boundary: true
      - say: How much calibration data would give us a finite threshold at ninety-five percent? With nineteen scores for
          twenty possible positions, rank nineteen exists. That's the first sample size where the required slot
          holds an observed error. A stable threshold may need many more.
        hold: 1
        visual_cues:
          - id: samples
            phrase: How much calibration data
            targets:
              - picture
            caption_boundary: true
          - id: minimum
            phrase: rank nineteen exists
            targets:
              - picture
            caption_boundary: true
  - id: interval
    title: Where do the endpoints land?
    visual: Return to the 80% radius, open the interval around forty and check an interior outcome, a miss and the
      inclusive boundary on the same axis.
    beats:
      - say: Back to our original request and the eighty percent target. The forecast is forty. The selected error is
          eight milliseconds. Where do the two endpoints land?
        hold: 2.4
      - say: Subtract eight on the left and add eight on the right. The interval is thirty-two to forty-eight, sixteen
          milliseconds wide. An arrival at forty-four fits. At fifty-three, the arrival falls outside.
        hold: 0.9
        visual_cues:
          - id: unfold
            phrase: Subtract eight on the left and add eight on the right
            targets:
              - picture
            caption_boundary: true
          - id: endpoints
            phrase: The interval is thirty-two to forty-eight, sixteen milliseconds wide
            targets:
              - picture
            caption_boundary: true
          - id: hit
            phrase: An arrival at forty-four fits
            targets:
              - picture
            caption_boundary: true
          - id: miss
            phrase: the arrival falls outside
            targets:
              - picture
            caption_boundary: true
      - say: Bring the arrival back to exactly forty-eight. Its distance from forty equals the radius. An error at the
          boundary counts because the test allows any error less than or equal to eight.
        hold: 1
        visual_cues:
          - id: boundary
            phrase: Bring the arrival back to exactly forty-eight
            targets:
              - picture
            caption_boundary: true
      - say: Switch to the ninety-five percent target with those same nine errors. Now the radius is infinite. Both ends
          run off the ruler. Every finite outcome fits, including ones long after the caller gives up. If you know
          a bound on possible outcomes you can use that information, but it didn't come from these nine errors.
        hold: 0.9
        visual_cues:
          - id: infinite
            phrase: Now the radius is infinite
            targets:
              - picture
            caption_boundary: true
  - id: exchangeability
    title: Which score gets to be the future one?
    visual: Hold each of ten distinct scores out in turn. Compare what occupies calibration slot eight when the
      future score is eight and when it is nine.
    beats:
      - say: For the rank argument, imagine that any of these ten requests could have been the next one. Formally, their
          joint distribution must stay the same when you permute their positions, given the frozen procedure.
          That's exchangeability. Independent draws from the same distribution give you one way to satisfy it.
          Scrambling one observed log can't establish it.
        hold: 0.9
      - say: Use the distinct scores one through ten just for counting. Hold out the first seven one at a time. Each
          time, close the gap and count to the eighth remaining score. It's nine in every one of these trials. The
          held-out score fits each time.
        hold: 0.9
        visual_cues:
          - id: enumerate
            phrase: Hold out the first seven one at a time
            targets:
              - picture
            caption_boundary: true
      - say: Now hold out eight. With that gap closed, which score sits in the highlighted eighth slot? Does it cover
          the score we've put aside?
        hold: 2.3
        visual_cues:
          - id: eight
            phrase: Now hold out eight
            targets:
              - picture
            caption_boundary: true
      - say: Nine sits in that slot. Eight is covered. Now hold out nine instead. Look at the eighth calibration slot
          again. What changed?
        hold: 2.3
        visual_cues:
          - id: inside
            phrase: Eight is covered
            targets:
              - picture
            caption_boundary: true
          - id: nine
            phrase: Now hold out nine instead
            targets:
              - picture
            caption_boundary: true
      - say: Eight stayed in the rack. Nine exceeds eight, so this time we miss. Hold out ten and the threshold stays at
          eight. Ten misses too. Eight of the ten possible positions are covered. Exchangeability makes those
          distinct future ranks equally likely. That's where the eighty percent comes from.
        hold: 1.2
        visual_cues:
          - id: outside
            phrase: so this time we miss
            targets:
              - picture
            caption_boundary: true
          - id: ten
            phrase: Hold out ten
            targets:
              - picture
            caption_boundary: true
          - id: last
            phrase: Ten misses too
            targets:
              - picture
            caption_boundary: true
          - id: total
            phrase: Eight of the ten possible positions are covered
            targets:
              - picture
            caption_boundary: true
  - id: ties-bound
    title: What happens when errors tie?
    visual: Retain both requests with a 3 ms error. Compare an all-zero boundary to the exact distinct-rank result
      and its looser upper bound.
    beats:
      - say: Back in the latency data, two requests had a three-millisecond error. Keep both in the ranking. We include
          the boundary, so a tie there can let extra outcomes into the set. Take the extreme case where every
          score is zero, including the future one. An inclusive threshold of zero covers one hundred percent.
        hold: 1
        visual_cues:
          - id: tie
            phrase: two requests had a three-millisecond error
            targets:
              - picture
            caption_boundary: true
          - id: zero
            phrase: every score is zero
            targets:
              - picture
            caption_boundary: true
          - id: hundred
            phrase: covers one hundred percent
            targets:
              - picture
            caption_boundary: true
      - say: With distinct scores the counting argument gives exactly k divided by n plus one. In our ten positions
          that's eight out of ten. You may also see a looser upper bound that adds one rank's worth to the target.
          Here that range is eighty to ninety percent. For tied scores we can rely on the lower bound, while the
          zero example shows how far above it coverage can go.
        hold: 1
        visual_cues:
          - id: distinct
            phrase: exactly k divided by n plus one
            targets:
              - picture
            caption_boundary: true
          - id: bound
            phrase: Here that range is eighty to ninety percent
            targets:
              - picture
            caption_boundary: true
      - say: We're averaging over a fresh calibration sample and the next outcome together. Holding one particular
          calibration sample fixed gives a different question. Neither its chosen radius nor the target tells one
          tenant their individual chance of being covered.
        hold: 1
        visual_cues:
          - id: scope
            phrase: averaging over a fresh calibration sample and the next outcome together
            targets:
              - picture
            caption_boundary: true
  - id: coverage
    title: Which arrivals fall inside?
    visual: Place each observed latency on its own interval. Replay the fourth observation exactly at the upper
      endpoint while the other three records stay fixed.
    beats:
      - say: Take four new requests. Center an eight-millisecond radius on each forecast. All four intervals have width
          sixteen. Here come the first three arrivals. Each lands inside its own interval. Look at the fourth
          forecast, forty-four. Its upper endpoint is fifty-two.
        hold: 0.8
        visual_cues:
          - id: radius
            phrase: Center an eight-millisecond radius
            targets:
              - picture
            caption_boundary: true
          - id: width
            phrase: All four intervals have width sixteen
            targets:
              - picture
            caption_boundary: true
          - id: first-three
            phrase: Here come the first three arrivals
            targets:
              - picture
            caption_boundary: true
      - say: The fourth request finishes at fifty-five. What fraction of these four arrivals did we cover?
        hold: 2.1
        visual_cues:
          - id: fourth
            phrase: The fourth request finishes at fifty-five
            targets:
              - picture
            caption_boundary: true
      - say: Three of four, or seventy-five percent. The calibration sample gave us one particular radius. The test then
          gave us just four outcomes. Even a million test requests with this one radius would measure coverage for
          this calibration sample. The marginal guarantee averages over fresh calibration samples and fresh
          requests together.
        hold: 0.9
        visual_cues:
          - id: rate
            phrase: Three of four, or seventy-five percent
            targets:
              - picture
            caption_boundary: true
      - say: Keep the forecasts fixed. Replay only the fourth outcome at fifty-two. Where does the count go now?
        hold: 2.1
        visual_cues:
          - id: replay
            phrase: Replay only the fourth outcome at fifty-two
            targets:
              - picture
            caption_boundary: true
      - say: All four are covered. The endpoint belongs to the interval. Changing one outcome moved the observed
          fraction from three quarters to one. The target and the sixteen-millisecond width stayed the same.
        hold: 1
        visual_cues:
          - id: all
            phrase: All four are covered
            targets:
              - picture
            caption_boundary: true
  - id: classifier-score
    title: Which class probabilities are large enough?
    visual: Use the true labels to calibrate the individual score. Compare four probability bars with one fixed
      cutoff, then flatten the probabilities.
    beats:
      - say: What if the outcome is a class label? Here's a classifier that gives almost all its probability to class
          zero. Give each candidate a score of one minus its probability. A large score now means the model
          assigned that candidate very little probability.
        hold: 0.8
        visual_cues:
          - id: score
            phrase: a score of one minus its probability
            targets:
              - picture
            caption_boundary: true
      - say: Start a separate calibration set for the classifier. The true class is zero on all nine held-out rows.
          Read each score from the probability the model assigned to that true class. Sort those scores. At our
          eighty percent target the eighth score is point four. To score at most point four, a candidate needs
          probability at least point six.
        hold: 1
        visual_cues:
          - id: calibration
            phrase: Start a separate calibration set for the classifier
            targets:
              - picture
            caption_boundary: true
          - id: cutoff
            phrase: the eighth score is point four
            targets:
              - picture
            caption_boundary: true
          - id: probability-cutoff
            phrase: probability at least point six
            targets:
              - picture
            caption_boundary: true
      - say: Back on the confident request, look for bars that reach the cutoff. Which labels go in the set?
        hold: 2
        visual_cues:
          - id: candidate
            phrase: Back on the confident request
            targets:
              - picture
            caption_boundary: true
      - say: Only class zero makes it. Its probability is point nine eight. Now spread the probability equally over the
          four classes. Where does that leave the set?
        hold: 2
        visual_cues:
          - id: confident
            phrase: Only class zero makes it
            targets:
              - picture
            caption_boundary: true
          - id: uniform
            phrase: spread the probability equally
            targets:
              - picture
            caption_boundary: true
      - say: The set is empty. Each bar stops at a quarter and the cutoff is still point six. You can use these model
          outputs even if they aren't calibrated probabilities. Poor scores can still give awkward sets. A caller
          needs a policy for an empty answer as well as for a single label.
        hold: 0.8
        visual_cues:
          - id: empty
            phrase: The set is empty
            targets:
              - picture
            caption_boundary: true
  - id: aps-inversion
    title: Which labels end inside the cutoff?
    visual: Assemble a probability strip in descending order. Calibrate its cutoff on true-label endpoints, then
      read the direct sets on two queries.
    beats:
      - say: Keep the four equal shares. Lay them end to end, largest first. When two shares tie, use the smaller class
          number first. Start with class zero. To score class two, add the next two pieces. Its right edge sits at
          three quarters. That distance from zero is the cumulative score for class two.
        hold: 1.1
        visual_cues:
          - id: first
            phrase: Start with class zero
            targets:
              - picture
            caption_boundary: true
          - id: third
            phrase: add the next two pieces
            targets:
              - picture
            caption_boundary: true
      - say: This score needs its own calibration. In the nine held-out rows, class zero was the true label and had the
          largest share every time. Its right edge was just that first share. Here are those nine endpoints in
          order. For eighty percent coverage, which one sets the cutoff?
        hold: 2.2
        visual_cues:
          - id: calibrate
            phrase: This score needs its own calibration
            targets:
              - picture
            caption_boundary: true
      - say: Rank eight gives us point nine. That's the mark we'll use for every label on the next request.
        hold: 1.3
        visual_cues:
          - id: threshold
            phrase: Rank eight gives us point nine
            targets:
              - picture
            caption_boundary: true
      - say: Return to the four equal pieces and add the last one. A label qualifies if its right edge is on or to the
          left of the yellow line. Which class numbers qualify?
        hold: 2.2
        visual_cues:
          - id: return
            phrase: Return to the four equal pieces
            targets:
              - picture
            caption_boundary: true
          - id: last
            phrase: add the last one
            targets:
              - picture
            caption_boundary: true
      - say: Classes zero, one and two qualify. Class three ends at one. This way of keeping the labels that pass the
