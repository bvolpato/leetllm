            caption_boundary: true
      - say: Keeping the crossing label makes this version of adaptive prediction sets nonempty. Randomized APS
          can drop that label. If it was the only one, the set becomes empty. Calibrate the randomized score when
          you use that version.
        hold: 0.8
  - id: subgroup-mix
    title: Which requests account for the misses?
    visual: The width of each group represents its share of a thousand arrivals and the filled height its coverage.
      Change the mix while keeping the two heights fixed.
    beats:
      - say: Each column is a group in a separate report of a thousand requests. Its width tells you how common that
          group is. Short requests take up three quarters of the space. Filled height is coverage. The short group
          covers ninety-six percent, the long group only fifty-four percent.
        hold: 0.9
      - say: Read the filled areas together. That's seven hundred twenty covered short requests and one hundred
          thirty-five covered long ones. Together they cover eighty-five point five percent of arrivals. The total
          clears the eighty percent target. Nearly half the long requests still miss.
        hold: 1
        visual_cues:
          - id: counts
            phrase: seven hundred twenty covered short requests and one hundred thirty-five covered long ones
            targets:
              - picture
            caption_boundary: true
          - id: aggregate
            phrase: Together they cover eighty-five point five percent of arrivals
            targets:
              - picture
            caption_boundary: true
      - say: Give the two groups equal shares of traffic. Keep the heights fixed. Does the combined area still clear
          eighty percent?
        hold: 2.3
        visual_cues:
          - id: mixture
            phrase: Give the two groups equal shares of traffic
            targets:
              - picture
            caption_boundary: true
      - say: Now only seventy-five percent are covered. The short group contributed four hundred eighty hits and the
          long group two hundred seventy. Neither group's rate moved. Log group counts as well as rates. Two long
          requests could tell a very different story by chance.
        hold: 1
        visual_cues:
          - id: seventy-five
            phrase: only seventy-five percent are covered
            targets:
              - picture
            caption_boundary: true
      - say: If you need a target within each request type, define the groups in advance and calibrate them separately
          when there's enough exchangeable data in each. Ordinary marginal coverage alone can leave a particular
          group far below target.
        hold: 0.9
  - id: normalized-score
    title: How wide should T4's interval be?
    visual: Divide the nine errors by their own frozen scales, select the eighth normalized score, then resize the
      original four bands around their fixed observations.
    beats:
      - say: Suppose a second model estimates how large an error to expect for each input. Freeze it along with the
          predictor before calibration. Its scale must be positive. It can be useful without being the exact
          conditional standard deviation. Look at request C eight. Its eight-millisecond error divided by its
          four-millisecond scale gives two. The units cancel.
        hold: 1
        visual_cues:
          - id: divide
            phrase: divided by its four-millisecond scale gives two
            targets:
              - picture
            caption_boundary: true
      - say: Divide each held-out error by its own scale, then sort those scores. Use the same corrected rank as before.
          The eighth normalized score is two. This threshold has no units. To get a radius in milliseconds,
          multiply by the new request's scale.
        hold: 1
        visual_cues:
          - id: sort
            phrase: sort those scores
            targets:
              - picture
            caption_boundary: true
          - id: threshold
            phrase: The eighth normalized score is two
            targets:
              - picture
            caption_boundary: true
      - say: Go back to the original four arrivals, including T four at fifty-five. The fixed interval misses that one.
          Now use the scales predicted before seeing these outcomes. For T one the scale is three milliseconds.
          Twice three gives a six-millisecond radius. Watch the two middle intervals resize around their own
          forecasts.
        hold: 1
        visual_cues:
          - id: return
            phrase: Go back to the original four arrivals
            targets:
              - picture
            caption_boundary: true
          - id: scales
            phrase: Now use the scales
            targets:
              - picture
            caption_boundary: true
          - id: first
            phrase: Twice three gives a six-millisecond radius
            targets:
              - picture
            caption_boundary: true
          - id: middle
            phrase: the two middle intervals resize
            targets:
              - picture
            caption_boundary: true
      - say: T four has a six-millisecond scale and a forecast of forty-four. Where does its new upper endpoint land?
          Will it reach the observed fifty-five?
        hold: 2.6
        visual_cues:
          - id: question
            phrase: Where does its new upper endpoint land
            targets: [picture]
            caption_boundary: true
      - say: Twice six gives a radius of twelve, so the endpoint reaches fifty-six. The dot stays at fifty-five while
          the band passes it. All four of these outcomes are now inside. That's a reason to test this fixed rule
          on more traffic. Choosing whichever score looks best on calibration would require fresh calibration or a
          separate selection analysis. The coverage promise is still marginal.
        hold: 1.2
        visual_cues:
          - id: fourth
            phrase: the endpoint reaches fifty-six
            targets:
              - picture
            caption_boundary: true
  - id: shift
    title: Can the old calibration travel with the queue?
    visual: Keep the radius fixed as new requests arrive. Separate the illustrated stream from the population
      mixture calculation and inspect the source of the misses.
    beats:
      - say: Exchangeable requests can include a few very slow ones. Watch these arrivals with the radius fixed
          at eight milliseconds. Red rings mark misses. In the traffic mix above, raise the long requests' share
          to one half. The coverage bar drops below the target.
        hold: 1
        visual_cues:
          - id: tail
            phrase: Exchangeable requests can include a few very slow ones
            targets:
              - picture
            caption_boundary: true
          - id: stream
            phrase: Watch these arrivals
            targets:
              - picture
            caption_boundary: true
          - id: drift
            phrase: raise the long requests' share
            targets:
              - picture
            caption_boundary: true
      - say: Look at the current outcomes and how you collected them. Were slow requests less likely to get a label? Did
          a new tenant change the mix? A burst of related requests, a time trend or a deployment can break
          exchangeability. Shuffling those records won't recover the old sampling process.
        hold: 1
        visual_cues:
          - id: monitor
            phrase: Look at the current outcomes and how you collected them
            targets:
              - picture
            caption_boundary: true
      - say: Before you recalibrate, separate a biased forecast, input-dependent error size, a changed mix and records
          reused in fitting. Compare signed errors, widths and subgroup counts over time. New calibration data
          help when they and the following traffic meet the method's assumptions. Methods for shift or time
          dependence need their own assumptions.
        hold: 0.9
        visual_cues:
          - id: diagnose
            phrase: separate a biased forecast, input-dependent error size, a changed mix and records reused in fitting
            targets:
              - picture
            caption_boundary: true
  - id: crc-loss
    title: What counts as a costly answer?
    visual: Follow three incorrect answers as a stricter router removes them. Identify the drop at each score before
      applying the bounded-loss correction.
    beats:
      - say: Suppose a router can send an answer or hold it for review. Count an error when a wrong answer actually goes
          out. Divide by all incoming requests and you get joint error. Divide by just the answers you sent and
          you get error among accepted answers. Now make the router stricter. Both the number of mistakes sent and
          the number of answers sent can change.
        hold: 1
        visual_cues:
          - id: denominators
            phrase: error among accepted answers
            targets:
              - picture
            caption_boundary: true
          - id: stricter
            phrase: Now make the router stricter
            targets:
              - picture
            caption_boundary: true
      - say: Follow the loss for each wrong answer. While its verifier score beats the threshold, the answer goes out
          and its loss is one. Raise the threshold past more scores and those losses fall to zero. At the score
          itself we already withhold the answer. That's a right-continuous drop. A correct answer always
          contributes zero.
        hold: 0.9
        visual_cues:
          - id: curves
            phrase: Follow the loss for each wrong answer
            targets:
              - picture
            caption_boundary: true
          - id: non-increasing
            phrase: Raise the threshold past more scores
            targets:
              - picture
            caption_boundary: true
          - id: right-continuous
            phrase: At the score itself we already withhold the answer
            targets:
              - picture
            caption_boundary: true
      - say: Conformal risk control uses this shape. Given exchangeable loss curves that stay between zero and one,
          never increase with the threshold and are right-continuous, start with the total calibration loss. Add
          one and divide by n plus one. Choose the least conservative passing threshold. You also need a maximally
          conservative fallback whose loss meets the target.
        hold: 1
        visual_cues:
          - id: criterion
            phrase: Add one and divide by n plus one
            targets:
              - picture
            caption_boundary: true
      - say: This bounds expected loss over the calibration sample and the next request together. Among the answers
          you send, the error rate can rise as the router gets stricter. The denominator shrinks too. Measure that
          rate with a fixed generator and verifier, and label the sent answers for correctness.
        hold: 1
        visual_cues:
          - id: expected
            phrase: This bounds expected loss over the calibration sample and the next request together
            targets:
              - picture
            caption_boundary: true
  - id: crc-threshold
    title: Which threshold passes the joint-error test?
    visual: Move the acceptance threshold across nine labeled answers. Compare the observed rate and corrected
      decision at 0.1 and 0.6, then run the fallback.
    beats:
      - say: The red marks are the three wrong answers among nine. The router sends an answer when its verifier
          score is strictly above the threshold, lambda. The yellow mark is at point one. The red answer directly
          below it stays back. The wrong answers at point six and point nine still go out.
        hold: 0.9
      - say: Two mistakes in nine arrivals is about twenty-two percent, below our twenty-five percent target. Now use
          the correction. Count the two mistakes plus one, over nine arrivals plus one. Does this threshold pass?
        hold: 2
      - say: Three tenths is thirty percent, so point one fails. Keep raising the threshold until another wrong answer
          drops out. That happens at point six. Count the mistakes above the line again. What's their corrected
          rate?
        hold: 2.1
        visual_cues:
          - id: fail
            phrase: Three tenths is thirty percent, so point one fails
            targets:
              - picture
            caption_boundary: true
          - id: six
            phrase: That happens at point six
            targets:
              - picture
            caption_boundary: true
      - say: One mistake plus one, divided by ten, gives twenty percent. Point six passes. Now read the actual
          calibration counts. One wrong answer among nine arrivals is about eleven percent. The router sent three
          answers, so one wrong among the three it sent is about thirty-three percent. The twenty-five percent
          target was for joint risk.
        hold: 1.2
        visual_cues:
          - id: pass
            phrase: Point six passes
            targets:
              - picture
            caption_boundary: true
      - say: If no threshold meets the correction, use the fallback. At threshold one the router sends nothing, so its
          joint loss is zero. Error among sent answers has an empty denominator there. These are calibration
          counts. Measuring future errors requires new labeled requests.
        hold: 1
        visual_cues:
          - id: fallback
            phrase: At threshold one the router sends nothing
            targets:
              - picture
            caption_boundary: true
  - id: selected-error
    title: Which requests belong in the denominator?
    visual: A hundred prediction sets retain their label identities. Filter to the ten singletons and compare the
      same wrong answers against all arrivals and against the selected rows.
    beats:
      - say: Here are a hundred help requests. Ninety get the pair billing and technical. Ten get just billing. In this
          constructed population the true label is technical every time. Count the sets that contain it. Ninety of
          the hundred cover the truth.
        hold: 1
        visual_cues:
          - id: truth
            phrase: the true label is technical every time
            targets:
              - picture
            caption_boundary: true
          - id: coverage
            phrase: Ninety of the hundred cover the truth
            targets:
              - picture
            caption_boundary: true
      - say: Send only the singletons. Look at the highlighted row. How many wrong answers went out per hundred incoming
          requests? And what fraction of the answers we actually sent were wrong?
        hold: 2.5
        visual_cues:
          - id: select
            phrase: Send only the singletons
            targets:
              - picture
            caption_boundary: true
      - say: Ten wrong answers went out per hundred arrivals. That's ten percent joint error. Now use just the sent
          answers as the denominator. Ten wrong out of ten sent is one hundred percent. The population coverage
          figure was accurate, and every answer this policy sent was wrong.
        hold: 1.2
        visual_cues:
          - id: joint
            phrase: That's ten percent joint error
            targets:
              - picture
            caption_boundary: true
          - id: selected
            phrase: Ten wrong out of ten sent is one hundred percent
            targets:
              - picture
            caption_boundary: true
      - say: To measure error among automated answers, label the answers the policy actually sends. The set size
          can help route a request for review. A tool still checks the caller's identity, permissions and any
          required confirmation before it acts.
        hold: 0.9
  - id: transfer
    title: What moved the upper endpoint?
    visual: Compare a forecast shift, a target change, and a one-score change against the same 40 ms prediction and
      50 ms deadline. Restore the original inputs between experiments.
    beats:
      - say: Return to that caller who gives up at fifty. The original interval ends at forty-eight. You could choose to
          route requests whose whole interval fits under the deadline. But that rule selects a subgroup. The
          eighty percent marginal coverage target doesn't tell you how many of those routed requests will finish
          on time.
        hold: 0.9
      - say: Change just the forecast to forty-four. The interval slides to thirty-six through fifty-two. It still spans
          sixteen milliseconds, but now it straddles the deadline.
        hold: 1.1
        visual_cues:
          - id: center
            phrase: Change just the forecast to forty-four
            targets:
              - picture
            caption_boundary: true
      - say: Restore the forty-millisecond forecast. Leave the errors alone and raise the target to ninety percent. We
          now need the ninth stick. Its twelve-millisecond radius puts the interval at twenty-eight through
          fifty-two. This time the band got wider.
        hold: 1
        visual_cues:
          - id: restore-center
            phrase: Restore the forty-millisecond forecast
            targets:
              - picture
            caption_boundary: true
          - id: coverage-start
            phrase: raise the target to ninety percent
            targets:
              - picture
            caption_boundary: true
          - id: coverage
            phrase: Its twelve-millisecond radius puts the interval at twenty-eight through fifty-two
            targets:
              - picture
            caption_boundary: true
      - say: Restore the eighty percent target. This time change just the eighth error from eight to nine. Does that
          move the rank or just the endpoints?
        hold: 2.3
        visual_cues:
          - id: restore-target
            phrase: Restore the eighty percent target
            targets:
              - picture
            caption_boundary: true
          - id: residual-start
            phrase: change just the eighth error from eight to nine
            targets:
              - picture
            caption_boundary: true
      - say: We still use rank eight. The interval now runs from thirty-one to forty-nine, eighteen milliseconds wide.
          To audit a decision like this, record the model and calibration versions, the score rule, target,
          interval, group and observed latency. Keep the width and the group counts next to coverage, and measure
          the deadline failures on the requests your policy actually selects.
        hold: 1
        visual_cues:
          - id: residual
            phrase: The interval now runs from thirty-one to forty-nine
            targets:
              - picture
            caption_boundary: true
          - id: record
            phrase: To audit a decision like this
            targets:
              - picture
            caption_boundary: true
  - id: fresh-deadline
    title: What goes in the request log?
    visual: Use a fresh rank and two arrival times on the opening clock. Recalibrate one score while leaving the
      second arrival pinned on both tracks.
    beats:
      - say: A different model predicts fifty-two milliseconds. Its caller gives up at fifty-five. This time we have
          nineteen ordered calibration errors. The first seventeen are at most six milliseconds. The last two are
          seven and twelve. For ninety percent coverage, which rank do you use, and where do the endpoints land?
        hold: 3.5
      - say: Nineteen plus the future request gives twenty positions. Ninety percent of twenty gives rank eighteen. Read
          seven milliseconds from that slot. Center seven on either side of fifty-two and the interval runs from
          forty-five to fifty-nine. Its width is fourteen milliseconds.
        hold: 1.1
        visual_cues:
          - id: rank
            phrase: Ninety percent of twenty gives rank eighteen
            targets:
              - picture
            caption_boundary: true
          - id: range
            phrase: the interval runs from forty-five to fifty-nine
            targets:
              - picture
            caption_boundary: true
      - say: The response arrives at fifty-nine. Look at the same arrival on both tracks. What goes in the log for
          coverage and for the deadline?
        hold: 2.4
        visual_cues:
          - id: arrival
            phrase: The response arrives at fifty-nine
            targets:
              - picture
            caption_boundary: true
      - say: The endpoint counts, so mark it covered. The caller stopped at fifty-five. Mark it four milliseconds late.
        hold: 1.1
        visual_cues:
          - id: covered
            phrase: so mark it covered
            targets:
              - picture
            caption_boundary: true
          - id: late
            phrase: Mark it four milliseconds late
            targets:
              - picture
            caption_boundary: true
      - say: Replay the request one millisecond slower. It arrives at sixty. The upper endpoint is still fifty-nine.
          This one is outside by one millisecond and five milliseconds late.
        hold: 1.1
        visual_cues:
          - id: replay
            phrase: It arrives at sixty
            targets:
              - picture
            caption_boundary: true
          - id: outside
            phrase: outside by one millisecond
            targets:
              - picture
            caption_boundary: true
          - id: five-late
            phrase: five milliseconds late
            targets:
              - picture
            caption_boundary: true
      - say: Keep that sixty-millisecond arrival pinned. Change just the error in slot eighteen from seven to eight. The
          number of scores and the target stay fixed. Which verdict changes for that arrival, coverage or meeting the deadline?
        hold: 2.8
        visual_cues:
          - id: change
            phrase: the error in slot eighteen from seven to eight
            targets:
              - picture
            caption_boundary: true
      - say: We still take rank eighteen. Eight on either side of fifty-two gives forty-four through sixty. The
          width is now sixteen. The same arrival is covered. It's still five milliseconds late.
        hold: 2.4
        visual_cues:
          - id: new-range
            phrase: gives forty-four through sixty
            targets:
              - picture
            caption_boundary: true
          - id: new-hit
            phrase: The same arrival is covered
            targets:
              - picture
            caption_boundary: true
          - id: still-late
            phrase: It's still five milliseconds late
            targets:
              - picture
            caption_boundary: true
