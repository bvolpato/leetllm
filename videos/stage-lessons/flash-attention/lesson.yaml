  - id: blackwell-reference
    title: Keep a common reference while reducing exponential overhead
    visual: An old m/ell/N triple remains on screen as a small maximum increase offers two valid common-reference
      paths. A wrong switched-reference-without-rescale branch fails beside them; asynchronous MMA, shared
      storage and tensor memory retain distinct roles.
    beats:
      - say: Blackwell’s tensor-core growth makes exponential throughput and shared-memory movement more prominent in
          the FlashAttention-four paper’s design. It combines larger asynchronous matrix pipelines,
          software-emulated exponentials, conditional rescaling, tensor memory and a two-thread-block backward
          design that reduces some shared traffic and global atomic additions. These are hardware scheduling
          and numerical choices around the dense operator.
        hold: 0.6
        visual_cues:
          - id: blackwell-reference-beat-1
            phrase: Blackwell’s tensor-core growth makes exponential throughput and shared-memory movement more prominent
              in the FlashAttention-four paper’s design
            targets:
              - blackwell-reference-state-0
            color: cyan
            linger: 0.5
      - say: Conditional rescaling can keep the old reference maximum when an increase is small enough for its
          numerical policy. All incoming weights must then use that same old reference. For example, keeping
          reference two when a new score is two point two uses exponential of point two for that new weight.
          Alternatively, change the reference to two point two and rescale both old sums. Both describe the
          same ideal normalized ratio; switching the reference while leaving old sums untouched does not.
        hold: 0.6
        visual_cues:
          - id: blackwell-reference-beat-2
            phrase: Conditional rescaling can keep the old reference maximum when an increase is small enough for its
              numerical policy
            targets:
              - blackwell-reference-state-1
            color: cyan
            linger: 0.5
          - id: fa-keep-reference
            phrase: keeping reference two
            targets:
              - blackwell-reference-state-1
            color: yellow
            linger: 0.55
          - id: fa-bad-reference
            phrase: switching the reference while leaving old sums untouched
            targets:
              - blackwell-reference-state-1
            color: yellow
            linger: 0.55
      - say: CuTe-DSL compiles GPU kernels from Python. The authors report shorter compile times than with
          their FA3 C++ templates. On the B200, their BF16 kernel reached sixteen hundred thirteen teraflops
          per second, seventy-one percent of peak. The paper compares it with cuDNN nine point thirteen and
          Triton, and reports that later cuDNN versions reached similar speeds.
        hold: 0.6
        visual_cues:
          - id: blackwell-reference-beat-3
            phrase: CuTe-DSL compiles GPU kernels from Python
            targets:
              - blackwell-reference-state-2
            color: cyan
            linger: 0.5
      - say: Those reported sweeps cover causal and noncausal shapes, head widths and lengths from one thousand to
          thirty-two thousand while keeping total tokens at thirty-two thousand. The current repository’s CuTe
          implementation targets Hopper and Blackwell; a paper’s benchmark machine and today’s package
          compatibility are different lists. Check the actual build and input contract before selecting an
          implementation.
        hold: 0.8
        visual_cues:
          - id: blackwell-reference-beat-4
            phrase: Those reported sweeps cover causal and noncausal shapes, head widths and lengths from one thousand to
              thirty-two thousand while keeping total tokens at thirty-two thousand
