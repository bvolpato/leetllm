  - id: benchmark-scopes
    title: How much faster is the whole workload?
    visual: A published training receipt retains hardware, sequence length, target and repeated-run context; a
      separate supplied application timeline changes only its attention segment.
    beats:
      - say: Both BERT-large runs fit on eight A100 GPUs. The original paper timed how long it took to reach
          the same masked-language-model accuracy at sequence length five hundred twelve. The
          MLPerf-one-point-one baseline averaged twenty minutes over ten runs. FlashAttention averaged
          seventeen point four. That cuts elapsed time by thirteen percent, or about fifteen percent more runs
          per unit time.
        hold: 0.6
        visual_cues:
          - id: benchmark-scopes-beat-1
            phrase: Both BERT-large runs fit on eight A100 GPUs
            targets:
              - benchmark-scopes-state-0
            color: cyan
            linger: 0.5
      - say: The FA2 paper’s GPT-style training result reaches two hundred twenty-five teraflops per GPU and
          seventy-two percent model FLOPs utilization. Model utilization describes the surrounding training
          computation, while an attention-kernel throughput number describes a different timed scope.
          Optimizer work, communication and feed-forward layers can remain after attention gets faster.
        hold: 0.6
        visual_cues:
          - id: benchmark-scopes-beat-2
            phrase: The FA2 paper’s GPT-style training result reaches two hundred twenty-five teraflops per GPU and
              seventy-two percent model FLOPs utilization
            targets:
              - benchmark-scopes-state-1
            color: cyan
            linger: 0.5
      - say: Take one request that lasts a hundred milliseconds. The short segment is attention, twenty
          milliseconds. The remaining eighty go to other work. Halving attention saves ten milliseconds. The
          request now takes ninety. Divide a hundred by ninety for the speedup. With this same serial workload
          and quality target, that means about eleven percent more requests per second.
        hold: 0.8
        visual_cues:
