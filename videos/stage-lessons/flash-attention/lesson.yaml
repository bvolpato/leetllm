      - say: In this example, eight logical sixteen-token pages sit in scattered physical blocks. A
          one-hundred-twenty-eight-token read tile follows all eight mappings. For the pinned FlashAttention
          cache API, choose a page size divisible by two hundred fifty-six. That API supports the forward pass
          only.
        hold: 0.6
