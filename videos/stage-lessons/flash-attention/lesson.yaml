scenes:
  - id: intro
    title: Three scores, two slots
    visual: Two scores fill the on-chip slots while a third key waits. The first two contributions survive in a row
      summary as the third key takes a free slot. The full score grid then grows around the original three words.
    beats:
      - say: Both score slots are full. The query for test has scored fix and this. How can it score its own key?
        hold: 1.6
        visual_cues:
          - id: full-slots
            phrase: Both score slots are full
            targets:
              - score-slots
            color: cyan
            linger: 0.18
            caption_boundary: true
          - id: waiting
            phrase: How can it score its own key
            targets:
              - waiting-key
            color: cyan
            linger: 0.18
            caption_boundary: true
      - say: FlashAttention saves what the first two keys contribute to the blend. Now it reuses a slot to score test.
          All three keys count toward one output.
        hold: 0.65
        visual_cues:
          - id: save-pair
            phrase: FlashAttention saves what the first two keys contribute to the blend
            targets:
              - saved-pair
            color: cyan
            linger: 0.18
            caption_boundary: true
          - id: reuse-slot
            phrase: reuses a slot to score test
            targets:
              - score-slots
              - waiting-key
            color: cyan
            linger: 0.18
            caption_boundary: true
          - id: complete-row
            phrase: All three keys count toward one output
            targets:
              - saved-pair
            color: cyan
            linger: 0.18
            caption_boundary: true
      - say: Look at the full score array for this prompt. Test can use all three keys. Fix can use only itself. Six
          pairs can contribute. The array has nine slots. Now extend the prompt to fix this test and run it.
          How many slots does the full array need now?
        hold: 2.1
        visual_cues:
          - id: read-test
            phrase: Test can use all three keys
            targets:
              - score-grid
            color: cyan
            linger: 0.18
            caption_boundary: true
          - id: read-fix
            phrase: Fix can use only itself
            targets:
              - score-grid
            color: cyan
            linger: 0.18
            caption_boundary: true
          - id: allowed-pairs
            phrase: Six pairs can contribute
            targets:
              - score-grid
              - grid-count
            color: cyan
            linger: 0.18
            caption_boundary: true
          - id: extend-prompt
            phrase: and run it
            targets:
              - score-grid
              - grid-count
            color: cyan
            linger: 0.18
            caption_boundary: true
      - say: Thirty-six slots. Four of the old squares fit inside this one. Twenty-one pairs can contribute. Each row
          still produces a single output.
        hold: 0.65
        visual_cues:
          - id: square-result
            phrase: Thirty-six slots
            targets:
              - score-grid
              - grid-count
            color: cyan
            linger: 0.18
            caption_boundary: true
          - id: four-copies
            phrase: Four of the old squares
            targets:
              - score-grid
            color: cyan
            linger: 0.18
            caption_boundary: true
          - id: larger-triangle
            phrase: Twenty-one pairs can contribute
            targets:
              - score-grid
              - grid-count
            color: cyan
            linger: 0.18
            caption_boundary: true
  - id: request-lifetime
    title: Follow the word “test”
    visual: The third row of the prompt becomes an output vector and a saved training statistic. A new query then
      reads the same prompt plus its own appended key.
    beats:
      - say: Number the words from zero. Test is query two. It reads three keys and produces one vector. We'll use a
          single coordinate of that vector so you can check each contribution by eye. The scores in this example
          already include the scale for the head width.
        hold: 0.65
        visual_cues:
          - id: track-test
            phrase: Test is query two
            targets:
              - prompt-row
            color: cyan
            linger: 0.18
            caption_boundary: true
          - id: one-coordinate
            phrase: a single coordinate
            targets:
              - request-output
            color: cyan
            linger: 0.18
            caption_boundary: true
      - say: During training, backward will need those probabilities again. We can save one number for this row and
          rebuild them from the scores. Now append a fourth token, and its key and value, to the cache. This
          next query needs four keys. The position of the query tells us where its visible history ends.
        hold: 0.7
        visual_cues:
          - id: save-stat
            phrase: save one number for this row
            targets:
              - request-output
            color: cyan
            linger: 0.18
            caption_boundary: true
          - id: append-key
            phrase: append a fourth token
            targets:
              - prompt-row
            color: cyan
            linger: 0.18
            caption_boundary: true
          - id: decode-row
            phrase: This next query needs four keys
            targets:
              - prompt-row
              - request-output
            color: cyan
            linger: 0.18
            caption_boundary: true
  - id: operator
    title: What does the full row return?
    visual: Each key has one column from score to scalar value to weight. Three weighted contributions meet at the
      dense reference output.
    beats:
      - say: Test compares its query with each key. Divide each dot product by the square root of the head width. In
          our example, fix scores one and carries ten. This scores two and carries twenty. Test scores three and
          carries forty.
        hold: 0.6
        visual_cues:
          - id: dense-input
            phrase: Test compares its query with each key
            targets:
              - dense-pairs
            color: cyan
            linger: 0.18
            caption_boundary: true
          - id: key-fix
            phrase: fix scores one and carries ten
            targets:
              - dense-pairs
            color: cyan
            linger: 0.18
            caption_boundary: true
          - id: key-this
            phrase: This scores two and carries twenty
            targets:
              - dense-pairs
            color: cyan
            linger: 0.18
            caption_boundary: true
          - id: key-test
            phrase: Test scores three and carries forty
            targets:
              - dense-pairs
            color: cyan
            linger: 0.18
            caption_boundary: true
      - say: Use the largest score, three, as the reference. Test is exactly at that reference, so its exponential
          weight is one. The other two scores sit one and two steps below it. Their weights shrink. Divide each
          weight by the sum across the row to get its share.
        hold: 0.65
        visual_cues:
          - id: dense-weights
            phrase: its exponential weight is one
            targets:
              - dense-weights
            color: cyan
            linger: 0.18
            caption_boundary: true
          - id: dense-shares
            phrase: Divide each weight by the sum
            targets:
              - dense-shares
            color: cyan
            linger: 0.18
            caption_boundary: true
      - say: Test gets about two thirds of the weight. Follow that column down. Forty times its share contributes
          about twenty-six point six. Add the other two contributions and the output is about thirty-two point
          four. It has to land between ten and forty. Keep that range in mind when we throw scores away.
        hold: 0.85
        visual_cues:
          - id: dense-terms
            phrase: Follow that column down
            targets:
              - dense-terms
            color: cyan
            linger: 0.18
            caption_boundary: true
          - id: dense-output
            phrase: the output is about thirty-two point four
            targets:
              - dense-output
            color: cyan
            linger: 0.18
            caption_boundary: true
  - id: memory
    title: How many trips do scores and probabilities make?
    visual: The same three-by-three packet crosses between compute and HBM in four explicit directions. A counter
      advances only when the transfer completes.
    beats:
      - say: To get that blend, a simple implementation runs three operations. Watch the space between the arithmetic
          units and the large pool of GPU memory. We call that memory HBM. First, write the whole square of
          scores to HBM.
        hold: 0.6
        visual_cues:
          - id: store-scores
            phrase: write the whole square of scores to HBM
            targets:
              - memory-channel
              - hbm-data
            color: cyan
            linger: 0.18
            caption_boundary: true
      - say: Softmax reads those scores back. It normalizes each row, then writes the square of probabilities out. The
          value multiply reads those probabilities back. Four transfers of a full square, just to pass
          intermediate results between the three operations.
        hold: 0.65
        visual_cues:
          - id: fetch-scores
            phrase: reads those scores back
            targets:
              - memory-channel
              - hbm-data
            color: cyan
            linger: 0.18
            caption_boundary: true
          - id: store-probabilities
            phrase: writes the square of probabilities out
            targets:
              - memory-channel
              - hbm-data
            color: cyan
            linger: 0.18
            caption_boundary: true
          - id: fetch-probabilities
            phrase: reads those probabilities back
            targets:
              - memory-channel
              - hbm-data
            color: cyan
            linger: 0.18
            caption_boundary: true
          - id: count-transfers
            phrase: Four transfers of a full square
            targets:
              - traffic-count
            color: cyan
            linger: 0.18
            caption_boundary: true
      - say: Masking the future changes which entries count toward the blend. A materialized square still takes up a
          slot for each of them. FlashAttention can consume a tile near the arithmetic units and reuse the
          space. How much traffic could that save on a long prompt?
        hold: 0.75
        visual_cues:
          - id: small-workspace
            phrase: consume a tile near the arithmetic units
            targets:
              - local-data
            color: cyan
            linger: 0.18
            caption_boundary: true
  - id: memory-ledger
    title: Count allocation, logical transfers and retained rows separately
    visual: The same batch/head/token factors construct one score slab, four named intermediate transfers and an
      independent LSE strip. Separate rulers retain binary GiB and decimal GB.
    beats:
      - say: "Take the article’s supplied configuration: batch eight, thirty-two heads and eight thousand one hundred
          ninety-two tokens. Each head has sequence length squared scalar scores. At two bytes per score,
          multiply all four factors to get thirty-two gibibytes, about thirty-four point three six decimal
          gigabytes, for one full score matrix. A causal triangle does not shrink that allocated square."
        hold: 0.6
        visual_cues:
          - id: memory-ledger-beat-1
            phrase: "Take the article’s supplied configuration: batch eight, thirty-two heads and eight thousand one
              hundred ninety-two tokens"
            targets:
              - memory-ledger-state-0
            color: cyan
            linger: 0.5
          - id: fa-score-bytes
            phrase: thirty-two gibibytes
            targets:
              - memory-ledger-state-0
            color: yellow
            linger: 0.55
      - say: In a four-pass materializing FP16 baseline, write scores, read scores, write probabilities and read
          probabilities. Four times thirty-two gives one hundred twenty-eight gibibytes of logical
          intermediate transfers. The inputs and output add traffic. Fusion, cache reuse and intermediate
          precision change the physical traffic a profiler observes. PyTorch’s math SDPA keeps FP16 and BF16
          intermediates in FP32, so that baseline requires its own byte calculation.
        hold: 0.6
        visual_cues:
          - id: memory-ledger-beat-2
            phrase: In a four-pass materializing FP16 baseline, write scores, read scores, write probabilities and read
              probabilities
            targets:
              - memory-ledger-state-1
            color: cyan
            linger: 0.5
          - id: fa-four-passes
            phrase: Four times thirty-two
            targets:
              - memory-ledger-state-1
            color: yellow
            linger: 0.55
      - say: Build every size from its actual axes and bytes per element. A score matrix uses batch times heads times
          query length times key length. A row statistic uses batch times heads times query length. The square
          allocation, the sum of transfers and the saved training state describe different quantities.
          Avoiding one array does not remove model weights, Q, K, V or output.
        hold: 0.8
        visual_cues:
          - id: memory-ledger-beat-3
            phrase: Build every size from its actual axes and bytes per element
            targets:
              - memory-ledger-state-2
            color: green
            linger: 0.5
  - id: local-budgets
    title: Fit logical tiles into distinct local resource budgets
    visual: A host-to-HBM-to-SM cutaway retains separate shared-memory and register boundaries. The
      Q/K/V/output/score pieces accumulate into an explicit 144 KiB logical subtotal without crossing resource
      boundaries by implication.
    beats:
      - say: HBM holds device tensors; CPU DRAM is a separate host tier across a system link. Inside an H100 streaming
          multiprocessor, shared memory has two hundred twenty-eight kibibytes, with at most two hundred
          twenty-seven per thread block. Its sixty-five thousand five hundred thirty-six registers, each
          thirty-two bits, form a separate two hundred fifty-six kibibyte register file. Shared memory also
          shares physical capacity with L1 cache; resident blocks and launch settings affect its usable
          budget.
        hold: 0.6
        visual_cues:
          - id: local-budgets-beat-1
            phrase: HBM holds device tensors; CPU DRAM is a separate host tier across a system link
            targets:
              - local-budgets-state-0
            color: cyan
            linger: 0.5
      - say: For the supplied square tile, Q, K and V each have one hundred twenty-eight rows by sixty-four
          FP16 entries. Each occupies sixteen kibibytes. An FP32 output accumulator occupies thirty-two, and a
          one hundred twenty-eight square FP32 score tile occupies sixty-four. Their logical subtotal is one
          hundred forty-four kibibytes. To see what fits, count the arrays assigned to shared memory and the
          values held in registers separately.
        hold: 0.6
        visual_cues:
          - id: local-budgets-beat-2
            phrase: For the supplied square tile, Q, K and V each have one hundred twenty-eight rows by sixty-four FP16
              entries
            targets:
              - local-budgets-state-1
            color: cyan
            linger: 0.5
          - id: fa-tile-inventory
            phrase: Their logical subtotal
            targets:
              - local-budgets-state-1
            color: yellow
            linger: 0.55
      - say: For unequal tiles, multiply query rows by head width for Q, and key rows by their respective
          widths for K and V. The output uses query rows times value width. The scores use query rows times
          key rows. Count the bytes for each dtype, including any buffers that overlap during a load. A
          thread-block cluster can share local storage across its members. Transfers from host memory have
          their own bandwidth limit at the system link.
        hold: 0.8
        visual_cues:
          - id: local-budgets-beat-3
            phrase: For unequal tiles, multiply query rows by head width for Q
            targets:
              - local-budgets-state-2
            color: green
            linger: 0.5
  - id: roofline-bound
    title: Derive a bandwidth roof before interpreting utilization
    visual: A fixed memory-bandwidth slope and compute ceiling meet at a computed ridge; one hypothetical workload
      at intensity one remains visibly distinct from an actual GPU timing trace.
    beats:
      - say: Arithmetic intensity means floating-point operations per byte transferred. The roofline bound is the
          smaller of a relevant compute peak and intensity times bandwidth. For H100 SXM, the listed nineteen
          seventy-nine teraflops figure uses sparsity. Halving it gives an illustrative dense FP16 or BF16
          tensor-core ceiling of nine hundred eighty-nine point five teraflops per second, alongside a three
          point three five terabyte-per-second HBM rating.
        hold: 0.6
        visual_cues:
          - id: roofline-bound-beat-1
            phrase: Arithmetic intensity means floating-point operations per byte transferred
            targets:
              - roofline-bound-state-0
            color: cyan
            linger: 0.5
      - say: Dividing the compute ceiling by bandwidth gives a ridge near two hundred ninety-five point four
          operations per byte. At just one operation per byte, the memory can supply at most three point three
          five trillion operations per second. That is about a third of one percent of the dense tensor-core
          ceiling. The softmax reductions and exponentials run on different resources, each with its own
          ceiling.
        hold: 0.6
        visual_cues:
          - id: roofline-bound-beat-2
            phrase: Dividing the compute ceiling by bandwidth gives a ridge near two hundred ninety-five point four
              operations per byte
            targets:
              - roofline-bound-state-1
            color: cyan
            linger: 0.5
          - id: fa-ridge
            phrase: a ridge near
            targets:
              - roofline-bound-state-1
            color: yellow
            linger: 0.55
      - say: Tiling increases useful reuse and can avoid expensive intermediate transfers. On a
          bandwidth-limited kernel, doing more work per byte moves the workload up the sloping roof. To locate
          a real kernel on this chart, profile its operations and bytes transferred. Time the application
          separately to see how much of that gain reaches the user.
        hold: 0.8
        visual_cues:
          - id: roofline-bound-beat-3
            phrase: Tiling increases useful reuse and can avoid expensive intermediate transfers
            targets:
              - roofline-bound-state-2
            color: green
            linger: 0.5
  - id: tiles
    title: Two places to put three scores
    visual: A resident query owns two scratch slots. Keys arrive in two groups. The row summary has its own
      persistent position beside the slots.
    beats:
      - say: Keep the query for test on chip. Bring in the keys and values for fix and this together. The two scores
          fit. Test's own key is still waiting for a slot.
        hold: 0.55
        visual_cues:
          - id: load-pair
            phrase: Bring in the keys and values for fix and this together
            targets:
              - scratch
            color: cyan
            linger: 0.18
            caption_boundary: true
          - id: waiting-key
            phrase: still waiting for a slot
            targets:
              - next-key
            color: cyan
            linger: 0.18
            caption_boundary: true
      - say: FlashAttention-two streams key and value tiles past this query. Each allowed pair still gets a score.
          Once a tile has contributed, the kernel can reuse its scratch space. The full score and probability
          arrays never have to make that round trip through high-bandwidth memory.
        hold: 0.55
        visual_cues:
          - id: reuse-scratch
            phrase: reuse its scratch space
            targets:
              - scratch
              - summary
            color: cyan
            linger: 0.18
            caption_boundary: true
      - say: Suppose we saved just the average for these two keys. The third key arrives. How much weight
          should the average get?
        hold: 1.8
        caption_starts:
          - How much weight should the average get
      - say: Keep the total weight. Keep the weighted sum of the values. Save the reference score that sets
          the scale for both sums. With those three quantities, the next key can join the blend.
        hold: 0.8
        visual_cues:
          - id: keep-sums
            phrase: Keep the total weight
            targets:
              - summary
            color: cyan
            linger: 0.18
            caption_boundary: true
          - id: keep-values
            phrase: Keep the weighted sum of the values
            targets:
              - summary
            color: cyan
            linger: 0.18
            caption_boundary: true
          - id: keep-ref
            phrase: Save the reference score
            targets:
              - summary
            color: cyan
            linger: 0.18
            caption_boundary: true
  - id: online
    title: What survives the first tile?
    visual: On two fixed tracks, the first two keys build total weight and weighted value. Their scratch slots
