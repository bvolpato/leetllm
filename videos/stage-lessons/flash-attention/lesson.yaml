  - id: rescale
    title: Put both tiles on one scale
    visual: Both saved lengths contract against their old endpoints. The new key appends its own weight and
      weighted value, then the two totals produce the row output.
    beats:
      - say: They shrink. The old scores are each one step farther below three than they were below two. That
          subtracts one inside every exponential. Multiply the old weights by e to the minus one.
        hold: 0.4
        visual_cues:
          - id: reference-three
            phrase: They shrink
            targets:
              - weight-track
              - value-track
            color: cyan
            linger: 0.18
            caption_boundary: true
          - id: common-factor
            phrase: e to the minus one
            targets:
              - reference
              - tile-note
            color: cyan
            linger: 0.18
            caption_boundary: true
      - say: Watch both blue strips contract together. Total weight drops from about one point three seven to point
          five zero three. Weighted value drops from about twenty-three point six eight to eight point seven
          one. Their ratio is still seventeen point three one. We changed the units of weight for the same two
          keys.
        hold: 0.6
        visual_cues:
          - id: new-reference
