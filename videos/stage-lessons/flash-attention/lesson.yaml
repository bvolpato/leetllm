    visual: Logical token positions map through scattered physical page IDs before a kernel read tile gathers
      their data; allocation page size and computation tile size retain independent brackets.
    beats:
      - say: A paged KV allocator chooses where logical token blocks live and how requests share them. An attention
          kernel follows a block table to read the K/V rows needed by its queries. Online softmax can merge
