            color: cyan
            linger: 0.45
          - id: pt-label-layout-once
            phrase: Do not feed an already-shifted array into another shifting operation
            targets:
              - label-layout-mechanism
            color: cyan
            linger: 0.45
  - id: lineage
    title: A checkpoint needs the next document too
    visual: Restore the consumed cursor to position 2 in the same shard order. E is the next block.
    beats:
      - say: Prepared shards should carry immutable identities, source policies, and tokenizer information.
          A manifest describes the files and their hashes. This turns a changing directory into a
          specific dataset artifact that another run can verify and load again.
        hold: 0.6
        visual_cues:
          - id: lineage-b1-1
            phrase: specific dataset artifact
            targets:
              - shard-order
            linger: 0.45
      - say: Resuming training also needs the sampler cursor and randomness state. The same original seed
          does not tell us how far every worker has advanced. In the picture, restoring the cursor
          selects the same next block rather than replaying familiar documents.
        hold: 0.6
        visual_cues:
          - id: lineage-b2-1
            phrase: sampler cursor
            targets:
              - sampler-cursor
            linger: 0.45
          - id: lineage-b2-2
            phrase: same next block
            targets:
              - next-block
            linger: 0.45
          - id: pt-lineage-cursor
            phrase: restoring the cursor selects the same next block
            targets:
              - lineage-mechanism
            color: cyan
            linger: 0.45
      - say: Keep held-out evaluations separate from training preparation and check contamination against
          their contents. Related documents may need group-based splits. Privacy and license
          policies also belong in the pipeline, with inspectable decisions appropriate to the source
          and intended use.
        hold: 0.8
        visual_cues:
          - id: lineage-b3-1
            phrase: Related documents
            targets:
              - shard-order
            linger: 0.45
  - id: restart-consistency
    title: Restore consumed work rather than the furthest read
    visual: Inspect the saved six-record order. Read from consumed cursor 2, then compare the records skipped by prefetch cursor 4 with those repeated by replaying the seed.
    beats:
      - say: Workers can extract text and compute signatures for different records in parallel. To
          compare band matches, send records in the same bucket to a common comparison owner. Packing
          then builds sequences in a reproducible order. Measure how fast those stages run, how much they
          store, and how many bytes travel between workers.
        hold: 0.8
        visual_cues:
          - id: pt-restart-consistency-shuffle
            phrase: common comparison owner
            targets:
              - restart-consistency-mechanism
            color: cyan
            linger: 0.45
      - say: The executed six-record restart fixture fingerprints its in-memory records, saves a
          deterministic shuffled order and resumes after two consumed records. Its restored
          four-record suffix rejoins the original two-record prefix with no repeats or omissions. A
          changed record fails the manifest check. In a file manifest, verify every referenced
          shard’s bytes against its digest; hashing the manifest alone does not inspect those files.
        hold: 0.8
        visual_cues:
          - id: pt-restart-consistency-suffix
            phrase: no repeats or omissions
            targets:
              - restart-consistency-mechanism
            color: cyan
            linger: 0.45
          - id: pt-restart-consistency-manifest
            phrase: verify every referenced shard’s bytes
            targets:
              - restart-consistency-mechanism
            color: cyan
            linger: 0.45
      - say: Production restoration must align data position with a completed optimizer step, including
          intra-sequence offset, worker state and relevant randomness. A reader can prefetch beyond
          consumed work. Restoring that furthest reader cursor skips unconsumed records; restarting
          from the original seed repeats already consumed ones. Restore model, optimizer and
          schedule together, and restore or deterministically regenerate prefetch and stochastic
          transforms.
        hold: 0.8
        visual_cues:
          - id: pt-restart-consistency-prefetch
            phrase: prefetch beyond consumed work
            targets:
              - restart-consistency-mechanism
            color: cyan
            linger: 0.45
          - id: pt-restart-consistency-skip
            phrase: skips unconsumed records
            targets:
              - restart-consistency-mechanism
            color: cyan
            linger: 0.45
          - id: pt-restart-consistency-repeat
            phrase: repeats already consumed ones
            targets:
              - restart-consistency-mechanism
            color: cyan
            linger: 0.45
          - id: pt-restart-consistency-restore
            phrase: Restore model, optimizer and schedule together
            targets:
              - restart-consistency-mechanism
            color: cyan
            linger: 0.45
  - id: anneal-synthetic
    title: Control both the late mixture and its evidence
    visual: Trace a cooldown and its source mix, then compare replacement with accumulation. The held-out domain has a separate release minimum.
    beats:
      - say: Late-stage data annealing here pairs a learning-rate cooldown with a targeted source-mixture
          change. The Llama three report describes a linear decay to zero over its final forty
          million tokens, upsampling very high quality sources and averaging checkpoints. Its
          separate small annealing probes evaluate candidate data. Compare candidate final mixtures
          from the same starting checkpoint and check both target gains and lost domain coverage.
        hold: 0.8
        visual_cues:
          - id: pt-anneal-synthetic-forty
            phrase: final forty million tokens
            targets:
              - anneal-synthetic-mechanism
            color: cyan
            linger: 0.45
          - id: pt-anneal-synthetic-compare
            phrase: same starting checkpoint
            targets:
              - anneal-synthetic-mechanism
            color: cyan
            linger: 0.45
      - say: Synthetic data can propose gap-filling exercises, explanations and formats. Phi-one combined
          filtered real code with synthetic textbooks and exercises, within its reported coding
          tasks. A second exercise based on the same program gives the model another chance to practice it.
          Count the generated exercise and its human source separately. Preserve provenance, privacy
          decisions and dataset or teacher-model terms, and validate answers through executable
          tests or source-supported checks.
        hold: 0.8
        visual_cues:
          - id: pt-anneal-synthetic-generated
            phrase: synthetic textbooks and exercises
            targets:
              - anneal-synthetic-mechanism
            color: cyan
            linger: 0.45
          - id: pt-anneal-synthetic-provenance
            phrase: Preserve provenance, privacy decisions
            targets:
              - anneal-synthetic-mechanism
            color: cyan
            linger: 0.45
      - say: Recursive replacement can lose distribution tails under studied model-collapse assumptions.
          Accumulating original and generated data avoided collapse in Gerstgrasser and colleagues’
          language-model experiments, with a separate bounded-error result for a linear model. Keep the
          original records traceable. Evaluate the rare cases on their own. A mix can improve its average
          and still miss a separately declared held-out coverage floor.
        hold: 0.8
        visual_cues:
          - id: pt-anneal-synthetic-retain
            phrase: Accumulating original and generated data avoided collapse
            targets:
              - anneal-synthetic-mechanism
            color: cyan
            linger: 0.45
          - id: pt-anneal-synthetic-floor
            phrase: separately declared held-out coverage floor
            targets:
              - anneal-synthetic-mechanism
            color: cyan
            linger: 0.45
  - id: transfer
    title: What changed when the cutoff moved?
    visual: The same retained record supplies two identical 100-token blocks. After the cutoff changes, two
      aligned held-out rows show exactly which test outcomes differ.
    beats:
      - say: Back to C, our little program. At point five, the unique inventory contains one hundred twenty code
          tokens. Let's follow four draws of a hundred tokens each. First take the start of C, then A.
          Take the same part of C again, then E. The model saw two hundred code token presentations, even
          though both code blocks came from the same hundred positions. A source ID and offset let us
          trace that repeat.
        hold: 1
        caption_starts:
          - The model saw two hundred code token presentations
        visual_cues:
          - id: pt-transfer-draws
            phrase: First take the start of C, then A. Take the same part of C again, then E
            targets:
              - transfer-mechanism
      - say: Keep extraction and deduplication fixed. Raise only the cutoff from point five to point eight five.
          There goes C. E drops out too. A remains, with two hundred forty tokens. Weight each surviving
          score by its token count and the mean rises from about point eight two to point nine. Could this
          inventory supply a single code token, however often we draw from it?
        hold: 2.1
        visual_cues:
          - id: pt-transfer-tighten
            phrase: Raise only the cutoff from point five to point eight five
            targets:
              - transfer-mechanism
      - say: There is no code left to draw. Compare two illustrative runs with the same starting checkpoint and
          training budget. Score them on the same ten held-out cases. Seven successes become five. Look at
          cases one and two. Both changed from a success to a miss. We lost C and E together, so these
          results alone can't tell us which removal mattered. Restore C alone in the next trial, keep the
          budget fixed, and evaluate on fresh cases.
        hold: 1
        caption_starts:
          - Seven successes become five
        visual_cues:
          - id: pt-transfer-tests
            phrase: Score them on the same ten held-out cases
            targets:
              - transfer-mechanism
          - id: pt-transfer-totals
            phrase: Seven successes become five
            targets:
              - transfer-mechanism
          - id: pt-transfer-test-code
            phrase: Restore C alone in the next trial
            targets:
              - transfer-mechanism
