version: 1
id: pretraining-data
title: From Raw Records to a Reproducible Training Stream
source: training/pre-training-data-pipelines-scale/content.md
sources:
  - title: Penedo et al. The FineWeb Datasets
    url: https://arxiv.org/abs/2406.17557
  - title: Soldaini et al. Dolma
    url: https://arxiv.org/abs/2402.00159
  - title: Lee et al. Deduplicating Training Data Makes Language Models Better
    url: https://arxiv.org/abs/2107.06499
  - title: Hoffmann et al. Training Compute-Optimal Large Language Models
    url: https://arxiv.org/abs/2203.15556
  - title: "Rae et al. Scaling Language Models: Gopher"
    url: https://arxiv.org/abs/2112.11446
  - title: Li et al. DataComp-LM
    url: https://arxiv.org/abs/2406.11794
  - title: Common Crawl Get Started
    url: https://commoncrawl.org/get-started
  - title: Grattafiori et al. The Llama 3 Herd of Models
    url: https://arxiv.org/abs/2407.21783
  - title: Penedo et al. FineWeb2
    url: https://arxiv.org/abs/2506.20920
  - title: NVIDIA Nemotron-CC-v2.1 dataset card
    url: https://huggingface.co/datasets/nvidia/Nemotron-CC-v2.1
  - title: Gerstgrasser et al. Accumulating Real and Synthetic Data
    url: https://arxiv.org/abs/2404.01413
  - title: OpenAI tiktoken published encodings
    url: https://github.com/openai/tiktoken/blob/main/tiktoken_ext/openai_public.py
scenes:
  - id: intro
    title: Two records from a web crawl
    visual: A Python function and a repeated menu land at their classifier scores on one ruler. Compare two cutoffs, then move the boundary past the code.
    beats:
      - say: Which cutoff keeps the function and drops the menu? The classifier scores the program at
          point seven and the menu at point one. We keep any record at or above the cutoff. Would you set
          it to point five or point eight five?
        hold: 2.2
        caption_starts:
          - The classifier scores
          - Would you set it
        visual_cues:
          - id: pt-intro-menu
            phrase: the menu at point one
            targets:
              - intro-mechanism
          - id: pt-intro-choose
            phrase: Would you set it to point five or point eight five
            targets:
              - intro-mechanism
      - say: Try point five. The menu falls below the cutoff. The code record clears it, so all one
          hundred twenty tokens go into the training pool.
        hold: 1
        caption_starts:
          - The menu falls
          - The code record clears it
        visual_cues:
          - id: pt-intro-first
            phrase: Try point five
            targets:
              - intro-mechanism
      - say: Now slide the cutoff to point eight five. It passes the program too. That was the only code
          in this batch. Save its source ID. If the model later struggles with code, we can trace which
          tokens reached training and test what happens when we put this program back.
        hold: 1
        caption_starts:
          - It passes the program too
        visual_cues:
          - id: pt-intro-raise
            phrase: slide the cutoff to point eight five
            targets:
              - intro-mechanism
  - id: inventory-plan
    title: How many tokens must the corpus supply?
    visual: A 1.4T training target stays fixed as quality filtering and deduplication reduce a 2T extracted
      inventory.
    beats:
      - say: How much text goes through training? In this dense Chinchilla-style plan, seventy billion
          parameters times twenty token presentations per parameter gives one point four trillion
          presentations. Show the model a page twice and its tokens count twice. The number of optimizer
          updates depends on how many tokens you put in each batch.
        hold: 0.8
        visual_cues:
          - id: pt-inventory-plan-appetite
            phrase: seventy billion parameters times twenty token presentations per parameter gives one point four
              trillion presentations
            targets:
              - inventory-plan-mechanism
            color: cyan
            linger: 0.45
      - say: For the main dense matrix operations, multiply the number of trainable weights by token
          presentations, then by six. That gives five point eight eight times ten to the twenty-three
          FLOPs for this plan. With the same token budget, longer sequences give attention more work per
          token. Recomputing activations adds work too. How long the run takes also depends on how busy
          we keep the hardware.
        hold: 0.8
        visual_cues:
          - id: pt-inventory-plan-flops
            phrase: five point eight eight times ten to the twenty-three FLOPs
            targets:
              - inventory-plan-mechanism
            color: cyan
            linger: 0.45
      - say: Start with two trillion extracted tokens. Quality filtering removes thirty percent, leaving one
          point four trillion. Deduplication removes twenty percent of that remainder, leaving one point
          one two trillion. If each surviving token is used once, how far short of the target are we?
        hold: 2.1
        visual_cues:
          - id: pt-inventory-plan-filter
            phrase: Quality filtering removes thirty percent
            targets:
              - inventory-plan-mechanism
            color: cyan
            linger: 0.45
          - id: pt-inventory-plan-dedup
            phrase: Deduplication removes twenty percent of that remainder, leaving one point one two trillion
            targets:
              - inventory-plan-mechanism
            color: cyan
            linger: 0.45
      - say: We need two hundred eighty billion more presentations. We could add eligible sources or
          deliberately repeat some text. A bigger download helps only to the extent that its tokens reach
          training.
        hold: 1
        visual_cues:
          - id: pt-inventory-plan-gap
            phrase: two hundred eighty billion more presentations
            targets:
              - inventory-plan-mechanism
            color: cyan
            linger: 0.45
  - id: extract
    title: Will the return statement still run?
    visual: Copy the body of page P1. Compare the Python return statement and its four leading spaces at the
      source and destination.
    beats:
      - say: Here is the page that supplied our program. Start with the whole response. Home and Subscribe
          belong to the menu. Links and Contact belong to the footer. Select the body between them. Two
          sentences and a Python function are worth keeping. What has to survive besides the words?
        hold: 1.5
        visual_cues:
          - id: extract-b1-1
            phrase: Home and Subscribe belong to the menu
            targets:
              - excluded-navigation
            linger: 0.45
          - id: extract-b1-2
            phrase: Select the body between them
            targets:
              - extracted-spans
            linger: 0.45
      - say: Copy the two sentences, including their final periods. Leave the navigation behind. Copy the
          function header, then its indented return statement. Four leading spaces put the return inside
          the function. Flatten that line to the left margin and Python will reject this extract. Other
          page types have different failure modes. Inspect tables and equations on their own sources.
        hold: 0.6
        visual_cues:
          - id: extract-b2-1
            phrase: Copy the two sentences, including their final periods
            targets:
              - extracted-spans
            linger: 0.45
          - id: extract-b2-2
            phrase: Leave the navigation behind
            targets:
              - excluded-navigation
            linger: 0.45
          - id: extract-code
            phrase: Copy the function header, then its indented return statement
            targets:
              - extracted-spans
      - say: Save the original page, its source ID and the versioned extraction policy. That lets us go back
          from record C to this very line. Inspect samples across source types before processing the
          crawl. If you start from somebody else's extracted text, their choices about spaces and
          punctuation have already reached you.
        hold: 0.8
        visual_cues:
          - id: extract-b3-1
            phrase: versioned extraction policy
            targets:
              - extraction-policy
            linger: 0.45
          - id: extract-b3-2
            phrase: source types
            targets:
              - source-page
            linger: 0.45
  - id: archives
    title: Choose which archived evidence reaches extraction
    visual: Follow P1 through a raw WARC response, WAT metadata and WET text. Compare retained indentation in two copies of the same program.
    beats:
      - say: Common Crawl offers three different artifacts for the same crawl. WARC preserves raw crawl
          records, including HTTP responses and page HTML. WAT stores computed metadata. WET stores
          automatically extracted plain text. Reading WET inherits the earlier extractor. Returning
          to WARC lets us make and version our own extraction choices.
        hold: 0.8
        visual_cues:
          - id: pt-archives-warc
            phrase: WARC preserves raw crawl records
            targets:
              - archives-mechanism
            color: cyan
            linger: 0.45
          - id: pt-archives-wat
            phrase: WAT stores computed metadata
            targets:
              - archives-mechanism
            color: cyan
            linger: 0.45
          - id: pt-archives-wet
            phrase: WET stores automatically extracted plain text
            targets:
              - archives-mechanism
            color: cyan
            linger: 0.45
      - say: A book gives us a long argument. A repository gives us code and tests. A forum answer can
          show the steps that solved a problem. Each has its own license and formatting needs. Keep
          snapshot, source identity and extracted spans attached. Stars tell us a repository is popular.
          To judge the code itself, inspect the programs and run their tests.
        hold: 0.8
        visual_cues:
          - id: pt-archives-identity
            phrase: Keep snapshot, source identity and extracted spans attached
            targets:
              - archives-mechanism
            color: cyan
            linger: 0.45
      - say: FineWeb and DataComp-LM each improved on their WET baseline by extracting text from raw
          responses. Try that comparison on our Python function. Inspect it against the source. Both
          copies have four spaces before return. Those spaces put the statement inside the function. The
          final period survived in the prose too.
        hold: 0.8
        visual_cues:
          - id: pt-archives-inspect
            phrase: Inspect it against the source
            targets:
              - archives-mechanism
            color: cyan
            linger: 0.45
  - id: filter
    title: A quality rule chooses what remains
    visual: The score cutoff crosses C and E. A separate prose rule then excludes C at a fixed cutoff of 0.50.
    beats:
      - say: These are all five records before deduplication. Even the two mirrors still count separately. The
          menu already falls below the starting cutoff of point two. A classifier learns from its examples
          and labels. A rule for repeated lines or empty pages can catch a different problem.
        hold: 0.6
        visual_cues:
          - id: filter-b1-1
            phrase: examples and labels
            targets:
              - filtered-records
            linger: 0.45
      - say: Raise the cutoff to point six nine. Nothing crosses it yet. Now move past the program's score and
          its one hundred twenty tokens leave. Move past E and another two hundred leave. At point eight
          five, only the two mirrors remain. Their mean score is higher. That follows from discarding
          lower scores. To find out what the model learned, compare matched training runs.
        hold: 0.6
        visual_cues:
          - id: filter-threshold-rise
            phrase: Raise the cutoff to point six nine
            targets:
              - score-cutoff
              - filtered-records
              - retained-tokens
              - retained-score
            color: yellow
            linger: 0.6
          - id: filter-b2-1
            phrase: move past the program's score
            targets:
              - retained-tokens
            linger: 0.45
          - id: filter-b2-2
            phrase: Move past E
            targets:
              - retained-score
            linger: 0.45
      - say: Try a different policy. Reset the score cutoff to point five. Four records now qualify. Suppose we
          also require a prose source and at least two hundred tokens. Which additional record will we
          lose?
        hold: 2.1
        visual_cues:
          - id: filter-rule-question
            phrase: Which additional record will we lose
            targets:
              - filtered-records
      - say: C drops out. The little program fails both parts of the prose rule. The two mirrors and the bird
          sentence survive. Now six hundred eighty tokens remain, all prose. We can test a code-specific
          rule against this one on the tasks the engineering assistant needs.
        hold: 0.9
        visual_cues:
          - id: filter-b3-1
            phrase: C drops out
            targets:
              - filtered-records
            linger: 0.45
  - id: prose-gates
    title: Apply a prose rule to the actual record
    visual: Apply the English prose gates to a 71-word runbook, a four-word note, repeated sale text and 25
      CSS rules. Mark the first failing check for each record.
    beats:
      - say: Open the article’s executable prose filter. It is a teaching subset of Gopher’s English-web rules.
          It keeps fifty through one hundred thousand whitespace-split words and mean word length from
          three through ten characters. Each hash-symbol count divided by word count, and each ellipsis
          count divided by word count, must be at most zero point one.
        hold: 0.8
        visual_cues:
          - id: pt-prose-gates-words
            phrase: fifty through one hundred thousand whitespace-split words
            targets:
              - prose-gates-mechanism
            color: cyan
            linger: 0.45
          - id: pt-prose-gates-symbols
            phrase: must be at most zero point one
            targets:
              - prose-gates-mechanism
            color: cyan
            linger: 0.45
      - say: Consider this runbook. Its seventy-one words include both “the” and “and.” The gate asks for
          at least two distinct English stopwords from its list. At least eighty percent of the words must
          also contain a letter. The runbook passes all the implemented checks. The four-word note is too
          short. Eighty copies of sale clear the length check but have no listed stopwords. The CSS has
          twenty-five hash signs for one hundred twenty-five words. That's one in five, twice the allowed
          ratio. Only the runbook passes this filter.
        hold: 0.8
        caption_starts:
          - Only the runbook
        visual_cues:
          - id: pt-prose-gates-stopwords
            phrase: at least two distinct English stopwords
            targets:
              - prose-gates-mechanism
          - id: pt-prose-gates-outputs
            phrase: Only the runbook passes this filter
            targets:
              - prose-gates-mechanism
      - say: The published suite also checks repeated lines, paragraphs and n-grams. Its top two-, three- and
          four-gram limits use character fractions of zero point two zero, zero point one eight and zero
          point one six, respectively. Longer n-grams have separate duplicate-character rules. The runbook
          passed our simpler filter. To check it for repetition, run these extra gates. Evaluate code,
          mathematics and other languages with rules suited to those sources.
        hold: 0.8
        visual_cues:
          - id: pt-prose-gates-ngrams
            phrase: zero point two zero, zero point one eight and zero point one six
            targets:
              - prose-gates-mechanism
            color: cyan
            linger: 0.45
          - id: pt-prose-gates-subset
            phrase: run these extra gates
            targets:
              - prose-gates-mechanism
            color: cyan
            linger: 0.45
  - id: score-contracts
    title: Follow the labels behind a quality score
    visual: Read the labels behind the scorer. Set an inclusive cutoff on five source records and measure
      the retained share of their original 1,000 tokens.
    beats:
      - say: A language detector can struggle with a page that mixes two languages. That page may still
          be worth keeping. What did the scorer learn to recognize? DataComp-LM trained fastText with
          positive examples from OpenHermes and highly rated ELI5 answers. Its top-ten-percent document
          cutoff counted whole documents. Their lengths determine how many tokens survive.
        hold: 0.8
        visual_cues:
          - id: pt-score-contracts-dclm
            phrase: top-ten-percent document cutoff
            targets:
              - score-contracts-mechanism
            color: cyan
            linger: 0.45
      - say: FineWeb-Edu trained a scorer to recognize educational material. It used four hundred sixty
          thousand teacher annotations on a zero-to-five scale, four hundred ten thousand for training
          and fifty thousand for validation. CCNet asked a different question. How predictable is this
          text to a language model trained on Wikipedia? Lower perplexity puts it closer to that
          reference. To assess correctness, you still need to check the facts or run the code.
        hold: 0.8
        visual_cues:
          - id: pt-score-contracts-labels
            phrase: four hundred ten thousand for training and fifty thousand for validation
            targets:
              - score-contracts-mechanism
            color: cyan
            linger: 0.45
          - id: pt-score-contracts-ccnet
            phrase: closer to that reference
            targets:
              - score-contracts-mechanism
            color: cyan
            linger: 0.45
      - say: Try the scorer on these five records. The proof scores point nine eight. The API documentation
          scores point nine two. The strip widths show their token counts. Set the cutoff to point nine.
          The forum post, the news story and the scrape fall below it. The proof and the documentation
          keep two hundred eighty of the thousand tokens, or twenty-eight percent. A higher cutoff can
          leave both the yield and the mean unchanged between records. Once you cross a record, you lose
          its tokens. If any remain, their mean score can only stay the same or rise. To decide whether
          that trade helps, evaluate the tasks you need.
        hold: 1
        caption_starts:
          - The proof and the documentation keep
        visual_cues:
          - id: pt-score-contracts-records
            phrase: The proof scores point nine eight
            targets:
              - score-contracts-mechanism
          - id: pt-score-contracts-cut
            phrase: Set the cutoff to point nine
            targets:
              - score-contracts-mechanism
          - id: pt-score-contracts-yield
            phrase: two hundred eighty of the thousand tokens, or twenty-eight percent
            targets:
              - score-contracts-mechanism
          - id: pt-score-contracts-quality
            phrase: evaluate the tasks you need
            targets:
              - score-contracts-mechanism
  - id: corpus-evidence
    title: Separate corpus inventory from evidence of value
    visual: Compare corpus recipes, apply one English stopword gate to three records, and keep organic, translated and synthetic text in separate categories.
    beats:
      - say: C4 illustrates aggressive heuristic cleaning; the Pile documented a twenty-two-source mixture;
          Dolma made a large English corpus and its processing inspectable. FineWeb tested
          extraction, filtering and per-crawl deduplication, rather than choosing a recipe from raw
          size. DataComp-LM’s multi-stage pipeline turned a two hundred forty trillion token pool
          into a much smaller selected inventory. Judge a source by its contribution under a matched
          evaluation.
        hold: 0.8
        visual_cues:
          - id: pt-corpus-evidence-sources
            phrase: the Pile documented a twenty-two-source mixture
            targets:
              - corpus-evidence-mechanism
            color: cyan
            linger: 0.45
          - id: pt-corpus-evidence-evaluate
            phrase: Judge a source by its contribution
            targets:
              - corpus-evidence-mechanism
            color: cyan
            linger: 0.45
      - say: Nemotron-CC combined retained organic web text with synthetic variants. Its full and
          high-quality subsets traded results differently across reported tasks. FineWeb2 later
          adapted language processing and quality thresholds across more than one thousand
          languages. Copying one English stopword rule into every language can remove the very
          coverage that the deployment needs.
        hold: 0.8
        visual_cues:
          - id: pt-corpus-evidence-languages
            phrase: more than one thousand languages
            targets:
              - corpus-evidence-mechanism
            color: cyan
            linger: 0.45
          - id: pt-corpus-evidence-copy
            phrase: Copying one English stopword rule into every language can remove the very coverage that the
              deployment needs
            targets:
              - corpus-evidence-mechanism
            color: cyan
            linger: 0.45
      - say: The December twenty twenty-five Nemotron-CC version two point one card reports two point five
          trillion added English tokens across organic, translated and synthetically rephrased text,
          with dataset and teacher-model terms. Keep those categories separate. A public-human-text
          stock forecast depends on scenarios; training does not consume that text irreversibly.
          Distinguish unique human inventory, synthetic variants and repeated presentations when
          planning a longer run.
        hold: 0.8
        visual_cues:
          - id: pt-corpus-evidence-separate
            phrase: Keep those categories separate
            targets:
              - corpus-evidence-mechanism
            color: cyan
            linger: 0.45
          - id: pt-corpus-evidence-presentations
            phrase: Distinguish unique human inventory, synthetic variants and repeated presentations
            targets:
              - corpus-evidence-mechanism
            color: cyan
            linger: 0.45
  - id: dedup
    title: Repeated pages spend repeated practice
    visual: Exact duplicates A and B share a retained representative. Two edited sentences expose
      trigram overlap, a Jaccard score of one third and a threshold decision to retain both.
    beats:
      - say: An identical page mirrored across several sites can receive many times the exposure of another
          document. Exact deduplication groups matching normalized content. In our inventory, the
          second copy vanishes and its source lineage remains connected to the retained
          representative.
        hold: 0.6
        visual_cues:
          - id: dedup-b1-1
            phrase: matching normalized content
            targets:
              - duplicate-records
            linger: 0.45
      - say: Near-duplicates need a richer comparison. Break documents into overlapping word shingles and
          compare their sets. MinHash and locality-sensitive hashing can cheaply suggest candidate
          pairs at scale. A separate exact check can decide whether each proposed pair crosses the
          chosen threshold.
        hold: 0.6
        visual_cues:
          - id: dedup-b2-1
            phrase: overlapping word shingles
            targets:
              - shingle-words
            linger: 0.45
          - id: dedup-b2-2
            phrase: compare their sets
            targets:
              - shingle-sets
            linger: 0.45
          - id: dedup-b2-3
            phrase: each proposed pair
            targets:
              - shingle-union
            linger: 0.45
      - say: "A shared introduction does not make two complete documents interchangeable. Inspect what a
          deduplication policy removes, including repeated material within documents. Count both
          documents and tokens: dropping one long page can change the mixture more than dropping
          several short pages."
        hold: 0.8
        visual_cues:
          - id: dedup-b3-1
            phrase: two complete documents
            targets:
              - shingle-sets
            linger: 0.45
          - id: dedup-b3-2
            phrase: what a deduplication policy removes
            targets:
              - jaccard
            linger: 0.45
  - id: minhash-work
    title: Construct the candidate signature from real shingles
    visual: Compare the six shared bigrams and four differing bigrams. Inspect the four 64-bit minima in band 1 before verifying the A and B edge.
    beats:
      - say: Exact hashing first groups equal normalized strings. Reading and hashing costs time
          proportional to their bytes; the hash-table lookup has expected constant cost. A digest
          collision is not string equality, so grouped bytes can be compared. Changing a timestamp
          may change the digest while preserving almost all of a document’s content.
        hold: 0.8
        visual_cues:
          - id: pt-minhash-work-exact
            phrase: grouped bytes can be compared
            targets:
              - minhash-work-mechanism
            color: cyan
            linger: 0.45
      - say: For near duplicates, form sets of contiguous word shingles. Jaccard similarity is intersection
          size divided by union size. In the article’s executed bigram example, A and B share six
          shingles in a union of ten, so similarity is zero point six. Each of thirty-two salted
          hashes selects the minimum hash over a document’s set. Four consecutive minima form each
          of eight bands.
        hold: 0.8
        visual_cues:
          - id: pt-minhash-work-shingles
            phrase: Jaccard similarity is intersection size divided by union size
            targets:
              - minhash-work-mechanism
            color: cyan
            linger: 0.45
          - id: pt-minhash-work-six
            phrase: six shingles in a union of ten, so similarity is zero point six
            targets:
              - minhash-work-mechanism
            color: cyan
            linger: 0.45
          - id: pt-minhash-work-minima
            phrase: Four consecutive minima form each of eight bands
            targets:
              - minhash-work-mechanism
            color: cyan
            linger: 0.45
      - say: The actual A and B signatures match zero-based bands one and three. A band collision proposes
          the pair; our code then calculates exact Jaccard and accepts an edge at the supplied zero
          point five threshold. The component keeps A and drops B, retaining their lineage; C
          remains separate. Finite salted hashes approximate ideal random permutations. Under an
          ideal uniform permutation, equal minima have probability equal to Jaccard similarity.
        hold: 0.8
        visual_cues:
          - id: pt-minhash-work-bands
            phrase: match zero-based bands one and three
            targets:
              - minhash-work-mechanism
            color: cyan
            linger: 0.45
          - id: pt-minhash-work-edge
            phrase: accepts an edge at the supplied zero point five threshold
            targets:
              - minhash-work-mechanism
            color: cyan
            linger: 0.45
          - id: pt-minhash-work-keep
            phrase: keeps A and drops B
            targets:
              - minhash-work-mechanism
            color: cyan
            linger: 0.45
  - id: lsh-chain
    title: Which shingles survive a chain of matches?
    visual: Eight four-row bands give a candidate probability. Three shingle sets then form a verified path.
      The alphabetically first representative retains only four of the six distinct shingles.
    beats:
      - say: What makes two signatures worth comparing? All four rows in one band have to match. If each ideal
          independent row matches with probability s, one band matches with probability s to the fourth.
          For eight bands, subtract the chance that all eight miss from one. Follow the curve from a
          quarter similarity through one half to three quarters. At one half, about forty percent of pairs
          become candidates. Even a promising pair can miss every band.
        hold: 1
        visual_cues:
          - id: pt-lsh-chain-formula
            phrase: one band matches with probability s to the fourth
            targets:
              - lsh-chain-mechanism
          - id: pt-lsh-chain-curve
            phrase: Follow the curve from a quarter similarity through one half to three quarters
            targets:
              - lsh-chain-mechanism
      - say: Now take three different records. Each numbered tile stands for a shingle. The middle record
          contains all six. Verify the proposed pairs against a point six cutoff. A shares four of six
          with B. So does C. Both neighboring pairs pass at two thirds. Compare the ends directly. A and C
          share just two of six, so their edge fails. Keep the alphabetically first record in each
          connected group. Which shingles will disappear?
        hold: 2.2
        visual_cues:
          - id: pt-lsh-chain-pass
            phrase: Both neighboring pairs pass at two thirds
            targets:
              - lsh-chain-mechanism
          - id: pt-lsh-chain-fail
            phrase: their edge fails
            targets:
              - lsh-chain-mechanism
          - id: pt-lsh-chain-question
            phrase: Which shingles will disappear
            targets:
              - lsh-chain-mechanism
      - say: Follow the green edges from A through B to C. All three belong to one group. Keep A and remove B
          and C. Five and six have disappeared. They were in B and C, and neither one was in A. Inspect
          what large components remove. Crowded band buckets can also require a quadratic number of pair
          comparisons.
        hold: 1
        caption_starts:
          - Five and six have disappeared
        visual_cues:
          - id: pt-lsh-chain-component
            phrase: Keep A and remove B and C
            targets:
              - lsh-chain-mechanism
      - say: Check which recipe you intend to run. FineWeb used five-word shingles and one hundred twelve
          hashes, arranged in fourteen bands of eight. It linked band matches directly. Our example
          verifies Jaccard before adding an edge. FineWeb also compared per-crawl and global
