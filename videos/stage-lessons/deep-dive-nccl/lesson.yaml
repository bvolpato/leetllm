    beats:
      - say: Try two schedules on paper. Each start costs two microseconds. Count six starts for the ring and four
          for the tree. Give each rank one decimal kilobyte of input. Assume both schedules move one and a
          half times that many bytes, at the rates beside the tracks. Those bytes barely extend either track.
          The tree finishes about four microseconds earlier.
