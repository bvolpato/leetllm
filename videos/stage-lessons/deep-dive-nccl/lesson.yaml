  - id: ring
    title: Follow slot 2 around the ring
    visual: Follow one numbered packet clockwise around four stationary ranks. The incoming sum lands before the
      destination adds its local value. Each addition marks one new contributor.
    beats:
      - say: Start at rank three with its contribution of three thousand in slot two. Send it to rank zero. Rank
          zero adds its own three. The packet now holds three thousand three. Other slots travel on the other
          links at the same time.
        hold: 0.6
        visual_cues:
          - id: ring-hop-0
            phrase: Send it to rank zero
            targets:
              - ring-rail
          - id: ring-add-0
            phrase: adds its own three. The packet now holds three thousand three
            targets:
              - ring-add
            caption_boundary: true
      - say: That partial sum travels to rank one. Add thirty here and the packet holds three thousand thirty-three.
          The highlighted ranks tell you whose gradients are already in the packet. Who still has a
          contribution to make?
        hold: 1.9
        visual_cues:
          - id: ring-hop-1
            phrase: That partial sum travels to rank one
            targets:
              - ring-rail
          - id: ring-add-1
            phrase: Add thirty here and the packet holds three thousand thirty-three
            targets:
              - ring-add
            caption_boundary: true
          - id: ring-whose
            phrase: Who still has a contribution to make
            targets:
              - ring-add
      - say: Rank two has the last three hundred. Bring the packet down to rank two. Add three hundred and the sum
          reaches three thousand three hundred thirty-three. The packet has reached the owner of slot two. A
          sharded optimizer can use that gradient once the reduce-scatter completes on its stream.
        hold: 1
        visual_cues:
          - id: ring-hop-2
            phrase: Bring the packet down to rank two
            targets:
              - ring-rail
          - id: ring-add-2
            phrase: Add three hundred and the sum reaches three thousand three hundred thirty-three
            targets:
              - ring-add
            caption_boundary: true
          - id: ring-owner
            phrase: the owner of slot two
            targets:
              - ring-rail
  - id: gather
    title: Who else needs a copy?
    visual: Keep the same ring at the reduce-scatter boundary. Deliver copies to the other three ranks,
      preserving the value at every sender. Collect the completed slots in rank order.
    beats:
      - say: Now suppose every replica needs the whole gradient. Rank two keeps its finished slot and sends a copy
          to rank three. Watch what happens to the number when it arrives. Both ranks hold the same sum.
        hold: 0.7
        caption_starts:
          - "Both ranks hold the same sum."
        visual_cues:
          - id: gather-copy-0
            phrase: sends a copy to rank three
            targets:
              - ring-rail
          - id: gather-count
            phrase: Both ranks hold the same sum
            targets:
              - ring-add
      - say: Rank three sends a copy to rank zero. Three ranks now hold this slot inside the running collective.
          The number of copies changed. Each application reader still waits for the collective to finish writing.
        hold: 0.6
        visual_cues:
          - id: gather-copy-1
            phrase: Rank three sends a copy to rank zero
            targets:
              - ring-rail
          - id: gather-count-three
            phrase: Three ranks now hold this slot
            targets:
              - ring-add
      - say: Rank zero sends the last copy to rank one. The other completed slots have traveled alongside this one.
          Read them in rank order and each rank has the whole vector. That's all-gather. Together the two
          phases give the all-reduce result. If an optimizer updates just its shard, it can skip this gradient
          gather. Any later gather of updated weights moves a different buffer.
        hold: 0.9
        visual_cues:
          - id: gather-copy-2
            phrase: Rank zero sends the last copy to rank one
            targets:
              - ring-rail
          - id: gather-vector
            phrase: each rank has the whole vector
            targets:
              - ring-add
            caption_boundary: true
  - id: traffic-bound
    title: How many bytes leave one GPU?
    visual: Count outgoing four-byte chunks on rank 2 in each phase. Keep its input size and its separate
      receive count in view as the example becomes the ring formula.
    beats:
      - say: Rank two starts with four floats, each thirty-two bits wide. Each one fills a four-byte chunk. During
          reduce-scatter it sends three chunks to its neighbor. During all-gather it sends three more.
          Six sends at four bytes each give twenty-four bytes sent. Rank two also receives twenty-four
          bytes from its other neighbor.
        hold: 0.6
        caption_starts:
          - "Six sends at four bytes each"
          - "Rank two also receives"
        visual_cues:
          - id: nc-traffic-bound-b0-s0
            phrase: Rank two starts with four floats, each thirty-two bits wide. Each one fills a four-byte chunk.
            targets:
              - nc-traffic-bound-mechanism
            color: cyan
            linger: 0.3
          - id: nc-traffic-bound-b0-s1
            phrase: During reduce-scatter it sends three chunks to its neighbor.
            targets:
              - nc-traffic-bound-mechanism
            color: cyan
            linger: 0.3
          - id: nc-traffic-bound-b0-s2
            phrase: During all-gather it sends three more.
            targets:
              - nc-traffic-bound-mechanism
            color: cyan
            linger: 0.3
          - id: nc-traffic-bound-b0-s3
            phrase: Six sends at four bytes each give twenty-four bytes sent.
            targets:
              - nc-traffic-bound-mechanism
            color: cyan
            linger: 0.3
          - id: nc-traffic-bound-b0-s4
            phrase: Rank two also receives twenty-four bytes from its other neighbor.
            targets:
              - nc-traffic-bound-mechanism
            color: cyan
            linger: 0.3
      - say: With k ranks and M input bytes per rank, each chunk holds M divided by k bytes. Each phase
          sends one chunk in each of k minus one steps. Double that step count for both phases, then
          multiply by the chunk size to get bytes sent. In our four-rank ring, that's one and a half
          times the input.
        hold: 0.6
        visual_cues:
          - id: nc-traffic-bound-b1-s0
            phrase: With k ranks and M input bytes per rank, each chunk holds M divided by k bytes.
            targets:
              - nc-traffic-bound-mechanism
            color: cyan
            linger: 0.3
          - id: nc-traffic-bound-b1-s1
            phrase: Each phase sends one chunk in each of k minus one steps.
            targets:
              - nc-traffic-bound-mechanism
            color: cyan
            linger: 0.3
          - id: nc-traffic-bound-b1-s2
