scenes:
  - id: intro
    title: One weight in slot 2
    visual: Pull slot 2 from each GPU into a four-term sum. Return the sum to the GPUs that update the
      weight, then open their buffers to compare replicated and sharded updates.
    beats:
      - say: Pull the gradient for one weight from each GPU. Each GPU is a rank with its own training
          examples. Add the four values in slot two. Their sum is three thousand three hundred thirty-three.
          Each GPU updates a full copy of the model. Which ranks need that sum?
        hold: 2.3
        visual_cues:
          - id: intro-column
            phrase: Pull the gradient for one weight from each GPU
            targets:
              - intro-column
          - id: intro-terms
            phrase: Add the four values in slot two
            targets:
              - intro-column
          - id: intro-sum
            phrase: Their sum is three thousand three hundred thirty-three
            targets:
              - intro-equation
            caption_boundary: true
          - id: intro-destination
            phrase: Each GPU updates a full copy of the model
            targets:
              - intro-outputs
      - say: All four ranks need it. Do the same addition in each slot and give every rank the full result. That's a
          sum all-reduce. On NVIDIA GPUs, NCCL coordinates the exchange. The training code chooses the
          reduction and any scaling.
        hold: 0.8
        visual_cues:
          - id: intro-all-reduce
            phrase: All four ranks need it
            targets:
              - intro-outputs
            caption_boundary: true
          - id: nc-intro-b1-s1
            phrase: give every rank the full result
            targets:
              - intro-outputs
            caption_boundary: true
      - say: Change the optimizer. Each rank now updates just the weight in its own numbered slot. Look down the
          third output column again. Which copy of that gradient does the optimizer still need?
        hold: 2.3
        visual_cues:
          - id: intro-sharded
            phrase: Each rank now updates just the weight in its own numbered slot
            targets:
              - intro-outputs
          - id: intro-which-copy
            phrase: Which copy of that gradient
            targets:
              - intro-outputs
      - say: Keep the copy on rank two. The other ranks keep their own slots. That placement is called
          reduce-scatter. Now we know what belongs in each output buffer. We still need to find out when it's
          safe to read it.
        hold: 0.8
        visual_cues:
          - id: intro-owner
            phrase: Keep the copy on rank two
            targets:
              - intro-outputs
            caption_boundary: true
          - id: intro-shards
            phrase: The other ranks keep their own slots
            targets:
              - intro-outputs
  - id: ownership-contract
    title: Choose the collective from who needs which values
    visual: Keep the four rank vectors. Isolate rank-index shards, a root-only result, and one full sum. Apply
      ncclAvg once and show the erroneous second division as a separate counterfactual.
    beats:
      - say: "Let's change who receives the result while the four inputs stay fixed. With all-reduce, the complete
          sum appears in every row. Reduce sends that sum to just one root, while broadcast copies the root's
          original input to everyone. With reduce-scatter, follow the diagonal: rank zero gets slot zero, rank
          one gets slot one, and so on. All-gather copies each of those slots into the same position on every
          rank. Every copy keeps the value its owner supplied."
        hold: 0.6
        visual_cues:
          - id: nc-ownership-contract-b0-s0
            phrase: Let's change who receives the result while the four inputs stay fixed.
            targets:
              - nc-ownership-contract-mechanism
            color: cyan
            linger: 0.3
          - id: nc-ownership-contract-b0-s1
            phrase: With all-reduce, the complete sum appears in every row.
            targets:
              - nc-ownership-contract-mechanism
            color: cyan
            linger: 0.3
          - id: nc-ownership-contract-b0-s2
            phrase: Reduce sends that sum to just one root, while broadcast copies the root's original input to
              everyone.
            targets:
              - nc-ownership-contract-mechanism
            color: cyan
            linger: 0.3
          - id: nc-ownership-contract-b0-s3
            phrase: "With reduce-scatter, follow the diagonal: rank zero gets slot zero, rank one gets slot one, and so
              on."
            targets:
              - nc-ownership-contract-mechanism
            color: cyan
            linger: 0.3
          - id: nc-ownership-contract-b0-s4
            phrase: All-gather copies each of those slots into the same position on every rank.
            targets:
              - nc-ownership-contract-mechanism
            color: cyan
            linger: 0.3
          - id: nc-ownership-contract-b0-s5
            phrase: Every copy keeps the value its owner supplied.
            targets:
              - nc-ownership-contract-mechanism
            color: cyan
            linger: 0.3
      - say: "There is one more choice for slot two: what should the four contributions mean? For an equal-rank
          average, divide the sum by four to get eight hundred thirty-three point two five. You can ask NCCL
          to average for you. Divide that average by four again and the gradient shrinks to a quarter of the
          value you wanted. Use the scaling that matches the training objective."
        hold: 0.6
        caption_starts:
          - "For an equal-rank average"
        visual_cues:
          - id: nc-ownership-contract-b1-s0
            phrase: "There is one more choice for slot two: what should the four contributions mean?"
            targets:
              - nc-ownership-contract-mechanism
            color: cyan
            linger: 0.3
          - id: nc-ownership-contract-b1-s1
            phrase: For an equal-rank average, divide the sum by four to get eight hundred thirty-three point two five.
            targets:
              - nc-ownership-contract-mechanism
            color: cyan
            linger: 0.3
          - id: nc-ownership-contract-b1-s2
            phrase: You can ask NCCL to average for you.
            targets:
              - nc-ownership-contract-mechanism
            color: cyan
            linger: 0.3
          - id: nc-ownership-contract-b1-s3
            phrase: Divide that average by four again and the gradient shrinks to a quarter of the value you wanted.
            targets:
              - nc-ownership-contract-mechanism
            color: cyan
            linger: 0.3
          - id: nc-ownership-contract-b1-s4
            phrase: Use the scaling that matches the training objective.
            targets:
              - nc-ownership-contract-mechanism
            color: cyan
            linger: 0.3
