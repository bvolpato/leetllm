  - id: receipt
    title: What does six milliseconds cost the step?
    visual: Keep the isolated four-rank benchmark row fixed. Place its six milliseconds after compute, then move
      the same interval four milliseconds earlier on a shared ruler. Mark the part beyond compute.
    beats:
      - say: Scale from four numbers to a gradient buffer of two hundred fifty-six mebibytes per rank. In this
          example a four-rank sum all-reduce takes six milliseconds. Divide the logical bytes by that time.
          You get about forty-four point seven four decimal gigabytes per second. That's the algorithmic
          bandwidth.
        hold: 0.6
        visual_cues:
          - id: receipt-algorithm
            phrase: forty-four point seven four decimal gigabytes per second
            targets:
              - receipt-row
            caption_boundary: true
      - say: Remember the six sends of a quarter buffer each. For four ranks the traffic factor is one and a half.
          Multiply the algorithmic bandwidth by that factor. The bus score is about sixty-seven point one one
          gigabytes per second. That's how NCCL tests normalizes this all-reduce. For bytes on a particular
          link, use hardware counters.
        hold: 0.7
        visual_cues:
          - id: receipt-factor
            phrase: the traffic factor is one and a half
            targets:
              - receipt-row
          - id: receipt-bus
            phrase: sixty-seven point one one gigabytes per second
            targets:
              - receipt-row
            caption_boundary: true
      - say: Put the transfer after eight milliseconds of compute. The step ends at fourteen. Now suppose the bucket
          is ready four milliseconds earlier, with independent compute still running. Start the same
          six-millisecond transfer there. Four milliseconds fit behind compute. Only two milliseconds of
          communication stick out past it.
        hold: 0.8
        visual_cues:
          - id: receipt-serial
            phrase: The step ends at fourteen
            targets:
              - receipt-schedules
          - id: receipt-shift
            phrase: Start the same six-millisecond transfer there
            targets:
              - receipt-schedules
          - id: nc-receipt-b2-s1
            phrase: Only two milliseconds of communication stick out past it
            targets:
              - receipt-schedules
            caption_boundary: true
      - say: Eight milliseconds of compute plus two of waiting gives ten for the step. The benchmark row is
          identical in both schedules. The completion event moved four milliseconds closer to the start.
          Measure that event and the end of the real step to see how much overlap survives contention.
        hold: 0.9
        visual_cues:
          - id: receipt-step
            phrase: ten for the step
            targets:
              - receipt-schedules
            caption_boundary: true
          - id: receipt-fixed
            phrase: The benchmark row is identical in both schedules
            targets:
              - receipt-row
