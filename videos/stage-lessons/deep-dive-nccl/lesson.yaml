    title: Find the first differing call
    visual: Run the article's CPU log comparison on two rank-2 edits. Scan the same sequence columns to see how
      a count difference at step 0 and a root difference at step 1 give distinct results.
    beats:
      - say: "Each rank recorded two calls: a sum all-reduce, then a broadcast. The CPU checker compares the tuples
          one step at a time. Change just the count on rank two from four floats to three. Where does the
          first disagreement occur?"
        hold: 1.8
        visual_cues:
          - id: log-count
            phrase: Change just the count on rank two from four floats to three
            targets:
              - log-table
      - say: At step zero. The operation names match, but the counts differ. Reset the count to four and change the
          broadcast root on rank two from zero to one. The checker passes the first column. Now it stops at
          step one. Drop the second call altogether and it still stops at one. Swap the original two calls
          instead and it stops at zero.
        hold: 0.7
        visual_cues:
          - id: log-first
            phrase: At step zero
            targets:
              - log-table
            caption_boundary: true
          - id: log-reset
            phrase: Reset the count to four
            targets:
              - log-table
          - id: log-root
            phrase: change the broadcast root on rank two from zero to one
            targets:
              - log-table
          - id: log-scan
            phrase: passes the first column
            targets:
              - log-table
          - id: log-second
            phrase: it stops at step one
            targets:
              - log-table
            caption_boundary: true
          - id: log-missing
            phrase: Drop the second call altogether and it still stops at one
            targets:
              - log-table
            caption_boundary: true
          - id: log-swap
            phrase: Swap the original two calls instead and it stops at zero
            targets:
              - log-table
            caption_boundary: true
      - say: That index tells you which calls to inspect. Agreement alone can't tell you whether you chose the right
          operation for the model. In a live job, keep the earliest local error on each rank, along with its
          device, communicator and sequence. Start with warnings. If you need more detail, capture
          initialization, network and graph logs separately for each process. For container startup failures,
          check shared memory and locked-memory limits.
        hold: 0.7
        visual_cues:
          - id: log-evidence
            phrase: which calls to inspect
            targets:
              - log-table
          - id: log-warn
            phrase: Start with warnings
            targets:
              - log-detail
      - say: If every rank launched the kernel, compare progress counters. A kernel that stalled after launch leaves
          different evidence from a missing call. NCCL two point thirty-two point three also reports important
          nonfatal fallbacks. On mixed versions, keep the warning level and add attention notices through the
          separate levels setting. Older releases can turn off logging if you set attention as the main level.
          Remove experimental algorithm and protocol overrides once you've made the comparison.
