  - id: agreement
    title: A communicator executes an ordered group program
    visual: Four per-rank operation logs agree on their first call. A broadcast mismatch then appears at the
      second sequence position on rank two; restoring the matching all-gather lets every row advance.
    beats:
      - say: >
          A communicator identifies the participating ranks and their devices. Every rank must enter
          compatible operations in the same order. Our first sequence position agrees on the operation, count
          and dtype. This shared contract is what allows the library to coordinate the participants.
        hold: 0.6
        visual_cues:
          - id: agreement-communicator
            phrase: A communicator identifies the participating ranks and their devices
            targets:
              - agreement-contract-0
              - agreement-contract-1
            color: cyan
            linger: 0.6
          - id: agreement-ordered
            phrase: Our first sequence position agrees on the operation, count and dtype
            targets:
              - agreement-contract-2
              - agreement-contract-3
            color: cyan
            linger: 0.6
          - id: nc-agreement-b0-s0
            phrase: A communicator identifies the participating ranks and their devices.
            targets:
              - nc-agreement-mechanism
            color: cyan
            linger: 0.3
          - id: nc-agreement-b0-s1
            phrase: Every rank must enter compatible operations in the same order.
            targets:
              - nc-agreement-mechanism
            color: cyan
            linger: 0.3
          - id: nc-agreement-b0-s2
            phrase: Our first sequence position agrees on the operation, count and dtype.
            targets:
              - nc-agreement-mechanism
            color: cyan
            linger: 0.3
          - id: nc-agreement-b0-s3
            phrase: This shared contract is what allows the library to coordinate the participants.
            targets:
              - nc-agreement-mechanism
            color: cyan
            linger: 0.3
      - say: >
          At the next position, one rank calls a different collective. The others can wait even when every
          physical link is healthy. Compare the earliest operation-log divergence before interpreting peer
          timeouts as a network failure. A missing rank or an earlier allocation failure can create a similar
          wait.
        hold: 0.7
        visual_cues:
          - id: agreement-mismatch
            phrase: At the next position, one rank calls a different collective
            targets:
              - agreement-next-2
            color: cyan
            linger: 0.6
          - id: agreement-compare
            phrase: Compare the earliest operation-log divergence
            targets:
              - agreement-next-1
              - agreement-next-2
            color: cyan
            linger: 0.6
          - id: nc-agreement-b1-s0
            phrase: At the next position, one rank calls a different collective.
            targets:
              - nc-agreement-mechanism
            color: cyan
            linger: 0.3
          - id: nc-agreement-b1-s1
            phrase: The others can wait even when every physical link is healthy.
            targets:
              - nc-agreement-mechanism
            color: cyan
            linger: 0.3
          - id: nc-agreement-b1-s2
            phrase: Compare the earliest operation-log divergence before interpreting peer timeouts as a network failure.
            targets:
              - nc-agreement-mechanism
            color: cyan
            linger: 0.3
          - id: nc-agreement-b1-s3
            phrase: A missing rank or an earlier allocation failure can create a similar wait.
            targets:
              - nc-agreement-mechanism
            color: cyan
            linger: 0.3
      - say: >
          Repair the mismatched call and the ordered program agrees again. Streams cannot repair a
          disagreement about which operation the group is performing. Frameworks build process groups and
          bucket schedules above NCCL partly to keep this distributed instruction sequence consistent.
        hold: 0.6
        visual_cues:
          - id: agreement-repair
            phrase: Repair the mismatched call and the ordered program agrees again
            targets:
              - agreement-next-2
            color: cyan
            linger: 0.6
          - id: agreement-agreed
            phrase: this distributed instruction sequence consistent
            targets:
              - agreement-next-0
              - agreement-next-1
              - agreement-next-3
            color: cyan
            linger: 0.6
          - id: nc-agreement-b2-s0
            phrase: Repair the mismatched call and the ordered program agrees again.
            targets:
              - nc-agreement-mechanism
            color: cyan
            linger: 0.3
          - id: nc-agreement-b2-s1
            phrase: Streams cannot repair a disagreement about which operation the group is performing.
            targets:
              - nc-agreement-mechanism
            color: cyan
            linger: 0.3
          - id: nc-agreement-b2-s2
            phrase: Frameworks build process groups and bucket schedules above NCCL partly to keep this distributed
              instruction sequence consistent.
            targets:
              - nc-agreement-mechanism
            color: cyan
            linger: 0.3
  - id: alltoall-layout
    title: Where do the expert tokens go?
    visual: A 3×3 matrix of named payloads transposes from source-owned rows to destination-owned columns. Then
      pad unequal counts explicitly before showing grouped send/receive alternative.
    beats:
      - say: Suppose the three GPUs are sending tokens to different experts. Each source cuts its row into
          equal-sized chunks, one for each destination. Read down the middle column for destination one. In
          source order it holds two, twenty and two hundred. Deliver each destination's column in that order,
          keeping every value separate. That's an all-to-all exchange.
        hold: 0.6
        visual_cues:
          - id: nc-alltoall-layout-b0-s0
            phrase: Suppose the three GPUs are sending tokens to different experts.
            targets:
              - nc-alltoall-layout-mechanism
