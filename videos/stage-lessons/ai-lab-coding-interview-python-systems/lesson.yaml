scenes:
  - id: opening
    title: "How many times will these workers fetch /guide?"
    visual: "Step two workers through the same Python lines. Pause them at fetch, then compare the call log with the set."
    beats:
      - say: "Worker A checks the set for the guide. It’s empty. Pause A on the fetch line, just before the call."
        hold: 0.45
        visual_cues:
          - id: opening-check
            phrase: "Worker A checks the set for the guide"
            targets: [picture]
          - id: opening-pause
            phrase: "Pause A on the fetch line"
            targets: [picture]
      - say: "Now B checks the same set. Still empty. Both workers are on the fetch line. How many calls will the log record when they resume?"
        hold: 2.4
        caption_starts: ["How many calls will the log record"]
        visual_cues:
          - id: opening-a
            phrase: "Both workers are on the fetch line"
            targets: [picture]
          - id: opening-b
            phrase: "B checks the same set"
            targets: [picture]
          - id: opening-question
            phrase: "How many calls will the log record"
            targets: [picture]
      - say: "A calls fetch. B calls it too. When A returns, it adds the guide to the set. B adds the same address. One entry in the set, two calls in the log. Which one would you count in a test?"
        hold: 1.25
        caption_starts: ["B calls it too","One entry in the set"]
        visual_cues:
          - id: opening-fetch-a
            phrase: "A calls fetch"
            targets: [picture]
          - id: opening-fetch-b
            phrase: "B calls it too"
            targets: [picture]
          - id: opening-record
            phrase: "it adds the guide to the set"
            targets: [picture]
          - id: opening-add-b
            phrase: "B adds the same address"
            targets: [picture]
  - id: contract-loop
    title: "What should the test count?"
    visual: "Run the same fetch-count assertion with one worker and with two workers paused after the check. Keep both call logs beside the final sets."
    beats:
      - say: "Give fetch a local stand-in that appends the URL to a list every time it's called. With one worker, the list contains guide once. The assertion passes."
        hold: 0.5
        visual_cues:
          - id: contract-single
            phrase: "list contains guide once"
            targets: [picture]
          - id: contract-pass
            phrase: "The assertion passes"
            targets: [picture]
      - say: "Reset the fixture. Send both workers through the empty check as before. Their final set still looks right. The list has two calls for guide. Run the same assertion. It fails on the extra call."
        hold: 1
        visual_cues:
          - id: contract-race
            phrase: "both workers through the empty check"
            targets: [picture]
          - id: contract-double
            phrase: "two calls for guide"
            targets: [picture]
          - id: contract-fail
            phrase: "It fails on the extra call"
            targets: [picture]
      - say: "That's a small case you can keep while you change the code. Agree on the input, the output order, and what happens to a bad link or a failed fetch. Missing pages send you back to admission. The right pages in the wrong order send you back to the queue. These exercises run locally. Check the assessment instructions before using reference material or AI tools."
        hold: 0.6
        visual_cues:
          - id: contract-isolate
            phrase: "a small case you can keep"
            targets: [picture]
  - id: claim
    title: "Where can a second worker enter?"
    visual: "Replay the two workers at the same URL. A records the claim inside the lock. B skips while A is still fetching. Run the barrier fixture without assigning a winning thread."
    beats:
      - say: "Replay the guide race with one change. A takes the lock, looks up the address, and adds it to the set before releasing the lock. Checking and adding now happen in one turn. That's the claim."
        hold: 0.55
        visual_cues:
          - id: claim-enter
            phrase: "A takes the lock"
            targets: [picture]
          - id: claim-insert
            phrase: "adds it to the set"
            targets: [picture]
          - id: claim-release
            phrase: "releasing the lock"
            targets: [picture]
      - say: "A starts fetching outside the lock. While A is waiting, B gets the lock and finds the guide already claimed. B skips the call. Another URL could still get a turn. A lock held through the fetch would make that other URL wait too."
        hold: 1.1
        visual_cues:
          - id: claim-slow
            phrase: "A starts fetching outside the lock"
            targets: [picture]
          - id: claim-skip
            phrase: "B skips the call"
            targets: [picture]
      - say: "Try it with a fresh address. Release two threads from a barrier and collect both answers from claim. Sorted, the answers are false and true. Either thread can win. By the time the second thread takes the lock, the first has already added the address."
        hold: 0.7
        caption_starts: ["the answers are false and true"]
        visual_cues:
          - id: claim-barrier
            phrase: "Release two threads from a barrier"
            targets: [picture]
          - id: claim-verdict
            phrase: "the answers are false and true"
            targets: [picture]
  - id: frontier
    title: "What stays behind when a page leaves the queue?"
    visual: "Pop pages from the front and keep each admitted URL in the claim set. A second link to API leaves its first queue position intact. The fetch log records the callback order."
    beats:
      - say: "Back up to the crawler with one worker. Start returns three links in order. Guide comes first, then API with a fragment, then a page on another origin. Drop the fragment. Skip that other origin. The queue now holds guide followed by API. Both addresses are already claimed."
        hold: 0.7
        visual_cues:
          - id: frontier-links
            phrase: "Start returns three links in order"
            targets: [picture]
          - id: frontier-start
            phrase: "The queue now holds guide followed by API"
            targets: [picture]
      - say: "Take guide off the front. Its first link points back to API. API is still in the queue, and its address is in the set. Its place is already spoken for. Guide's second link is FAQ. Where should it go?"
        hold: 1.9
        visual_cues:
          - id: frontier-guide
            phrase: "Take guide off the front"
            targets: [picture]
          - id: frontier-dupe
            phrase: "Its first link points back to API"
            targets: [picture]
          - id: frontier-predict
            phrase: "Where should it go"
            targets: [picture]
      - say: "Behind API. Append FAQ at the back. Fetch API next. It links back to start, which stays claimed even though it left the queue earlier. Fetch FAQ last. If we add workers, this is the order we'll need to reproduce."
        hold: 1.2
        visual_cues:
          - id: frontier-faq
            phrase: "Append FAQ at the back"
            targets: [picture]
          - id: frontier-api
            phrase: "Fetch API next"
            targets: [picture]
          - id: frontier-end
            phrase: "Fetch FAQ last"
            targets: [picture]
  - id: url-policy
    title: "Which links share a fetch?"
    visual: "Compare the scheme, host and port with the start origin. Keep the query in each claim key and remove the fragment. Mark invalid input and separate network checks from URL parsing."
    beats:
      - say: "These links point to two sections of the API page. First compare the scheme, host and port with the start page. Lowercase the host for the comparison. Both links match. Drop the fragments and the default port. Keep the path and query, including the path’s percent encoding. An empty path becomes a slash. Both links now have the same claim key. Change the query to two and the crawler has a second address to fetch."
        hold: 0.6
        visual_cues:
          - id: ci-url-policy-0-build
            phrase: "These links point to two sections"
            targets:
              - ci-url-policy-trace
            color: cyan
            linger: 0.3
          - id: url-origin
            phrase: "Lowercase the host for the comparison"
            targets:
              - picture
          - id: url-strip
            phrase: "Drop the fragments and the default port"
            targets:
              - picture
          - id: url-changed-query
            phrase: "Change the query to two"
            targets:
              - picture
          - id: url-query
            phrase: "Keep the path and query"
            targets:
              - picture
      - say: "Resolve a relative link against the page it came from. The crawler accepts HTTP and HTTPS links with a host. It rejects embedded credentials, whitespace, backslashes and low ASCII control characters. A bad port makes the crawler skip that link. A different origin also means skip. With an invalid starting address, the queue stays empty. The crawler keeps accepted links in callback order. If the callback raises an exception, the caller sees it."
        hold: 0.6
        visual_cues:
          - id: ci-url-policy-1-build
            phrase: "Resolve a relative link"
            targets:
              - ci-url-policy-trace
            color: cyan
            linger: 0.3
          - id: url-invalid
            phrase: "A bad port makes the crawler skip that link"
            targets:
              - picture
          - id: url-foreign
            phrase: "A different origin also means skip"
            targets:
              - picture
      - say: "These keys tell the crawler which pages it has claimed. Before a network fetch, check that the resolved address is allowed. Check each redirect destination too. Set a timeout and a response size limit for the request."
        hold: 0.6
        visual_cues:
          - id: ci-url-policy-2-build
            phrase: "These keys tell the crawler which pages it has claimed"
            targets:
              - ci-url-policy-trace
            color: cyan
            linger: 0.3
          - id: url-network
            phrase: "check that the resolved address is allowed"
            targets:
              - picture
  - id: claim-failure
    title: "What may a crawler worker publish?"
    visual: "Keep two callback slots in parent order while the second parent finishes first. Try claiming in the workers, then replay with raw lists and move the admission cursor in parent order. Follow a later stop through publication."
    beats:
      - say: "The queue sent guide first and API second. Suppose API finishes first. Its two links arrive together. A worker that claims children immediately takes shared for API. Guide comes back with another fragment of shared, followed by FAQ. That first link now looks like a duplicate, so the worker drops it."
        hold: 1.15
        visual_cues:
          - id: order-api
            phrase: "Its two links arrive together"
            targets: [picture]
          - id: order-api-claims
            phrase: "takes shared for API"
            targets: [picture]
          - id: order-guide
            phrase: "Guide comes back"
            targets: [picture]
          - id: order-lost
            phrase: "the worker drops it"
            targets: [picture]
      - say: "Now join what each worker kept, guide's list first. Which page would sit at the front of the next queue?"
        hold: 2.3
        visual_cues:
          - id: order-question
            phrase: "Which page would sit at the front of the next queue"
            targets: [picture]
      - say: "FAQ comes first. Shared lands second, in the list from API, and types comes last. Each child has just one queue entry, but a single worker would have found shared in guide's first slot. Sorting the URLs would impose a different order again."
        hold: 1.3
        visual_cues:
          - id: order-wrong-front
            phrase: "FAQ comes first"
            targets: [picture]
          - id: order-wrong-middle
            phrase: "Shared lands second"
            targets: [picture]
          - id: order-wrong-tail
            phrase: "types comes last"
            targets: [picture]
      - say: "Rewind. API still finishes first. Keep its raw links in the second parent's slot. Leave the queue empty until guide returns. Now read guide's links from left to right. Resolve each link against its parent, skip invalid or foreign origins, and claim each new address as you append it."
        hold: 0.65
        visual_cues:
          - id: order-rewind
            phrase: "Rewind"
            targets: [picture]
          - id: order-buffer-api
            phrase: "Keep its raw links"
            targets: [picture]
          - id: order-buffer-guide
            phrase: "guide returns"
            targets: [picture]
          - id: order-read-guide
            phrase: "read guide's links from left to right"
            targets: [picture]
      - say: "Guide puts shared at the front, then FAQ. Now read API. Its fragment names the same page, so skip that link and append types. The first occurrence in parent order owns the queue position. You can also keep ordering metadata if it enforces that same admission order."
        hold: 1.2
        visual_cues:
          - id: order-first
            phrase: "Guide puts shared at the front"
            targets: [picture]
          - id: order-second
            phrase: "then FAQ"
            targets: [picture]
          - id: order-read-api
            phrase: "Now read API"
            targets: [picture]
          - id: order-duplicate
            phrase: "skip that link"
            targets: [picture]
          - id: order-last
            phrase: "append types"
            targets: [picture]
      - say: "One more change. A fetch is in flight when someone presses stop. Check the stop event again when the children return. Withhold those children. The request already started. Also check before scheduling and before fetching. Use a semaphore for the number of active fetches, and a separate per-host quota for how often they may start."
        hold: 0.8
        visual_cues:
          - id: stop-request
            phrase: "A fetch is in flight"
            targets: [picture]
          - id: stop-set
            phrase: "someone presses stop"
            targets: [picture]
          - id: stop-children
            phrase: "Withhold those children"
            targets: [picture]
      - say: "If that fetch fails, a one-attempt policy can leave the URL claimed. To retry, keep its attempt count. A retryable failure goes into retry wait until the backoff ends. Then the next attempt can claim it. Record a success or a terminal failure when the policy is settled."
        hold: 0.8
        visual_cues:
          - id: retry-policy
            phrase: "If that fetch fails"
            targets: [picture]
          - id: retry-wait
            phrase: "goes into retry wait"
            targets: [picture]
          - id: retry-again
            phrase: "the next attempt can claim it"
            targets: [picture]
          - id: retry-finish
            phrase: "a success or a terminal failure"
            targets: [picture]
  - id: state-objects
    title: "How much work did four pages take?"
    visual: "Count popped pages and raw links separately. Give guide one repeated link and compare both counts before turning to scheduler retries."
    beats:
      - say: "The crawler's queue has a front. A deque lets you take the next page from that end. A heap lets a priority pick the next job instead. A Counter can count fetches, and an OrderedDict can track recent use. Give time decisions an injected monotonic clock. For a worker waiting for a job, a condition can signal that work is available. The worker checks the predicate under the lock. An event carries the stop signal."
        hold: 0.65
        visual_cues:
          - id: ci-state-objects-0-build
            phrase: "The crawler's queue has a front"
            targets: [picture]
          - id: objects-deque
            phrase: "take the next page from that end"
            targets: [picture]
          - id: objects-count
            phrase: "A Counter can count fetches"
            targets: [picture]
          - id: objects-wake
            phrase: "a condition can signal that work is available"
            targets: [picture]
          - id: objects-stop
            phrase: "An event carries the stop signal"
            targets: [picture]
      - say: "Back on the single-worker graph, count every pop and every raw link the callback hands us. We fetched four pages and inspected six links. Suppose guide now returns one extra copy of the API link. Which count changes?"
        hold: 1.8
        visual_cues:
          - id: objects-cost
            phrase: "count every pop and every raw link"
            targets: [picture]
          - id: objects-extra
            phrase: "one extra copy of the API link"
            targets: [picture]
      - say: "Only the link count goes up, from six to seven. The queue still pops four pages. For V reachable pages and E links inspected, that's expected order V plus E in queue and set work, with order V retained state. Longer URL strings and slower callbacks can cost more even when both counts stay fixed."
        hold: 0.65
        visual_cues:
          - id: objects-seven
            phrase: "from six to seven"
            targets: [picture]
      - say: "Priority scheduling adds a heap operation each time work returns for a retry. If each of V tasks makes at most A attempts, heap work is order A V log V, plus order V plus E to handle the dependency graph."
        hold: 0.8
        visual_cues:
          - id: objects-attempts
            phrase: "Priority scheduling adds a heap operation"
            targets: [picture]
  - id: expiry
    title: "Two reads, one millisecond apart"
    visual: "Write a record with a five-second lifetime. Move the injected clock by one millisecond and keep the physical record on screen until get checks it. Compare the two observed return values."
    beats:
      - say: "At ten seconds, write running under task one. Give it five seconds to live. Store the deadline, fifteen, beside the value. Our test controls the clock, so we can go straight to the last millisecond before that deadline."
        hold: 0.7
        visual_cues:
          - id: expiry-write
            phrase: "write running under task one"
            targets: [picture]
          - id: expiry-deadline
            phrase: "the deadline, fifteen"
            targets: [picture]
      - say: "Set the clock to fourteen point nine nine nine. Read the key. It returns running. Now advance just one millisecond. The old row is still in memory. At exactly fifteen seconds, what should the next get return?"
        hold: 2.3
        visual_cues:
          - id: expiry-before
            phrase: "fourteen point nine nine nine"
            targets: [picture]
          - id: expiry-first-read
            phrase: "It returns running"
            targets: [picture]
          - id: expiry-step
            phrase: "advance just one millisecond"
            targets: [picture]
          - id: expiry-question
            phrase: "what should the next get return"
            targets: [picture]
      - say: "It returns None. The deadline equals the time of the read, so get removes the row and reports a missing key. The read did the cleanup. With a lifetime of zero, even a read at the write time meets that same condition."
        hold: 1.1
        visual_cues:
          - id: expiry-miss
            phrase: "It returns None"
            targets: [picture]
          - id: expiry-remove
            phrase: "get removes the row"
            targets: [picture]
  - id: ttl-reads
    title: Every read uses the same logical instant
    visual: "Read a zero-lifetime entry, then scan two keys at one instant. Replace an expiring value with a permanent one and clear its old deadline."
    beats:
      - say: A TTL entry stores a string value and either an expiration deadline or no
          deadline. Get, scan and an eventual compare-and-set must agree that
          equality with the deadline is expired. Zero TTL therefore expires
          immediately. Negative or nonfinite lifetimes are invalid. None is
          reserved for missing or no expiration, so stored values must be
          strings; annotations alone do not enforce that.
        hold: 0.6
        visual_cues:
          - id: ci-ttl-reads-0-build
            phrase: A TTL entry stores a string value and either an expiration deadline or
              no deadline. Get, scan and an eventual compare-and-set must agree
              that equality with the deadline is expired. Zero TTL therefore
              expires immediately. Negative or nonfinite lifetimes are invalid.
              None is reserved for missing or no expiration, so stored values
              must be strings; annotations alone do not enforce that.
            targets:
              - ci-ttl-reads-trace
            color: cyan
            linger: 0.3
          - id: ci-ttl-reads-zero
            phrase: Zero TTL therefore expires immediately.
            targets:
              - ci-ttl-reads-trace
            color: yellow
            linger: 0.3
      - say: The actual scan samples the injected clock once and checks all matching
          keys at that same logical instant. It iterates a copy of the keys
          because expired entries can be deleted. Sorting k surviving matches
          after inspecting n stored keys costs order n plus k log k, excluding
          string comparisons. Overwriting an expiring record with a permanent
          value replaces the old deadline.
        hold: 0.6
        visual_cues:
          - id: ci-ttl-reads-1-build
            phrase: The actual scan samples the injected clock once and checks all matching
              keys at that same logical instant. It iterates a copy of the keys
              because expired entries can be deleted. Sorting k surviving
              matches after inspecting n stored keys costs order n plus k log k,
              excluding string comparisons. Overwriting an expiring record with
              a permanent value replaces the old deadline.
            targets:
              - ci-ttl-reads-trace
            color: cyan
            linger: 0.3
          - id: ci-ttl-reads-scan
            phrase: It iterates a copy of the keys because expired entries can be deleted.
            targets:
              - ci-ttl-reads-trace
            color: cyan
            linger: 0.3
          - id: ci-ttl-reads-overwrite
            phrase: Overwriting an expiring record with a permanent value replaces the old
              deadline.
            targets:
              - ci-ttl-reads-trace
            color: cyan
            linger: 0.3
          - id: ttl-freeze
            phrase: samples the injected clock once
            targets:
              - picture
      - say: The clock must return finite nondecreasing seconds. A monotonic deadline
          uses a clock whose starting point is unspecified. It supports
          elapsed-time decisions but is not a portable persistent timestamp
          across machines or reboots. Lazy cleanup leaves unread expired entries
          in memory, and this store is single-threaded. Add an explicit cleanup
          or eviction policy and synchronize every public transition when the
          contract expands.
        hold: 0.6
        visual_cues:
          - id: ci-ttl-reads-2-build
            phrase: The clock must return finite nondecreasing seconds. A monotonic deadline
              uses a clock whose starting point is unspecified. It supports
              elapsed-time decisions but is not a portable persistent timestamp
              across machines or reboots. Lazy cleanup leaves unread expired
              entries in memory, and this store is single-threaded. Add an
              explicit cleanup or eviction policy and synchronize every public
              transition when the contract expands.
            targets:
              - ci-ttl-reads-trace
            color: cyan
            linger: 0.3
          - id: ttl-origin
            phrase: A monotonic deadline uses a clock whose starting point is unspecified
            targets:
              - picture
  - id: cas-boundary
    title: "Two writers at the deadline"
    visual: "Start with the article's untimed compare-and-set calls. At the TTL boundary, trace two conditional writers across one real record. Replay the same turns with one lock around cleanup, comparison and replacement."
    beats:
      - say: "Compare-and-set lets a caller name the value it expects to replace. Try the article's store without expiry. Expect missing and write running. That works once. Repeat the same expectation and it fails. Expect running instead and you can write ready."
        hold: 0.75
        visual_cues:
          - id: cas-first
            phrase: "That works once"
            targets: [picture]
          - id: cas-repeat
            phrase: "it fails"
            targets: [picture]
          - id: cas-third
            phrase: "you can write ready"
            targets: [picture]
      - say: "Now design the version with expiry. Reset the record to running with a deadline of fifteen. Freeze the clock at fifteen. Two writers each expect a missing key. A wants to write ready. B wants to write queued. Both replacements are permanent."
        hold: 0.8
        visual_cues:
          - id: cas-reset
            phrase: "Reset the record to running"
            targets: [picture]
      - say: "Suppose A cleans up the expired row, sees the missing key, and lets go of the lock before writing. B gets a turn. The key is missing, so B writes queued. If A now acts on its earlier comparison, whose successful write will disappear?"
        hold: 2.25
        visual_cues:
          - id: cas-clean
            phrase: "cleans up the expired row"
            targets: [picture]
          - id: cas-gap
            phrase: "lets go of the lock"
            targets: [picture]
          - id: cas-b-write
            phrase: "B writes queued"
            targets: [picture]
          - id: cas-question
            phrase: "whose successful write will disappear"
            targets: [picture]
      - say: "B's write disappears. A overwrites queued with ready. Both writers reported success, even though they both expected to create the first value. That pair of results tells you where the lock was dropped."
        hold: 1.2
        visual_cues:
          - id: cas-stale
            phrase: "A overwrites queued with ready"
            targets: [picture]
      - say: "Replay at the same deadline. A holds one lock while it removes the expired value, compares against missing, and writes ready. Only then may B check. B finds ready and returns false. One writer succeeded. If the public methods also acquire the lock, use one internal helper per step or a reentrant lock."
        hold: 1
        visual_cues:
          - id: cas-replay
            phrase: "Replay at the same deadline"
            targets: [picture]
          - id: cas-atomic-clean
            phrase: "removes the expired value"
            targets: [picture]
          - id: cas-atomic-write
            phrase: "writes ready"
            targets: [picture]
          - id: cas-deny
            phrase: "B finds ready and returns false"
            targets: [picture]
      - say: "Take a snapshot here. Later a writer changes the live value to running. Someone reading the snapshot must still see ready. A synchronized copy works for these strings. Mutable contents need isolation too. Versioned records or copy-on-write can preserve the same view. These are designs to test when you extend the article's store."
        hold: 0.9
        visual_cues:
          - id: cas-snapshot
            phrase: "Take a snapshot here"
            targets: [picture]
          - id: cas-later
            phrase: "changes the live value to running"
            targets: [picture]
  - id: scheduler
    title: "Does deploy get a turn?"
    visual: "Hold docs, test and deploy fixed across two runs. Trace which task actually ran, the attempt count, and the remaining dependency. Replay the first failed test with a different attempt cap."
    beats:
      - say: "Docs and test are ready. Deploy depends on test. The scheduler takes the lowest priority number, so docs runs first. Now test runs and returns false. The policy allows two attempts. Should deploy enter the ready heap yet?"
        hold: 1.9
        visual_cues:
          - id: sched-docs
            phrase: "docs runs first"
            targets: [picture]
          - id: sched-false
            phrase: "returns false"
            targets: [picture]
          - id: sched-question
            phrase: "Should deploy enter the ready heap yet"
            targets: [picture]
      - say: "Deploy still has one unmet dependency. Put test back at its original priority. This time it succeeds. Only that success takes deploy's count from one to zero. Deploy enters the heap, runs and completes."
        hold: 0.9
        visual_cues:
          - id: sched-retry
            phrase: "Put test back at its original priority"
            targets: [picture]
          - id: sched-success
            phrase: "This time it succeeds"
            targets: [picture]
          - id: sched-release
            phrase: "from one to zero"
            targets: [picture]
