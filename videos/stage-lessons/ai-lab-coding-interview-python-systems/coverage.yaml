version: 1
lesson: ai-lab-coding-interview-python-systems
promise: Decide where a worker may claim a URL and where its children enter the breadth-first queue.
  Apply the same reasoning to expiry, retries, rate limits, credit events, parser state and worker results.
objectives:
  - id: opening
    can: Explain how two calls to fetch can leave just one URL in the final set
    scenes:
      - opening
      - contract-loop
  - id: contract-loop
    can: Count calls to the local fetch stub to distinguish a single fetch from duplicate work
    scenes:
      - contract-loop
  - id: state-objects
    can: Choose the queue, counter, clock or synchronization primitive a transition needs, and distinguish fetched pages from inspected links when estimating its cost
    scenes:
      - state-objects
  - id: frontier
    can: Predict the next queue entry while tracking addresses that stay claimed after a pop
    scenes:
      - frontier
  - id: url-policy
    can: Normalize URL identity and distinguish same origin from destination authorization
    scenes:
      - url-policy
  - id: claim
    can: Place one atomic claim before the slow fetch
    scenes:
      - claim
  - id: claim-failure
    can: Keep raw child lists until the parent can normalize and admit them in breadth-first order. Check retry, quota and stop state at their own boundaries.
    scenes:
      - claim-failure
      - fresh-worker-plan
  - id: expiry
    can: Predict get immediately before and at the deadline, including when the physical row disappears
    scenes:
      - expiry
  - id: ttl-reads
    can: Apply one read instant, reserved missing values and consistent deadline replacement
    scenes:
      - ttl-reads
  - id: cas-boundary
    can: Identify a lost successful write when cleanup, comparison and replacement span two lock acquisitions
    scenes:
      - cas-boundary
  - id: scheduler
    can: Use the attempt count and the remaining dependency count to distinguish a failed task from one that never ran
    scenes:
      - scheduler
  - id: graph-validation
    can: Reject complete-graph failures before effects and apply actual priority tie-breaking
    scenes:
      - graph-validation
  - id: scheduler-workers
    can: Describe a synchronized work claim and completion-publication handoff
    scenes:
      - scheduler-workers
  - id: limiter
    can: Compute refill, admission and denial without spending twice
    scenes:
      - limiter
  - id: bucket-contract
    can: Calculate refill and wait while preserving per-key and idle-cleanup contracts
    scenes:
      - bucket-contract
  - id: ledger
    can: Return the original idempotent result while preserving later balance changes
    scenes:
      - ledger
  - id: ledger-lifetime
    can: Separate cached success, retryable rejection, transaction durability and global key ownership
    scenes:
      - ledger-lifetime
  - id: lock-order
    can: Combine global lock order, duplicate removal and partial-acquisition cleanup
    scenes:
      - lock-order
  - id: parser-state
    can: Trace header and continuation ownership and define a chunk-safe extension
    scenes:
      - parser-state
  - id: concurrency
    can: Use the wait and CPU times to choose a worker model, and merge an isolated worker's return by job ID
    scenes:
      - concurrency
  - id: worker-runtime
    can: Distinguish optional free threading, isolated serialization and event-loop yielding
    scenes:
      - worker-runtime
  - id: fresh-worker-plan
    can: Compute when each parent finishes on one CPU lane and merge the returned lists by parent and link order
    scenes:
      - fresh-worker-plan
