scenes:
  - id: intro
    title: Which build can write the sum?
    visual: Two native images face the same GPU. Both runs should write the sum shown above the chip.
      The matching image reaches its output slot. The other stops at the loader.
    beats:
      - say: Slot one should hold minus one and three quarters. Look at the GPU.
          Its compute capability is twelve point zero. Build A targets twelve point zero. Build B targets
          nine point zero. Both carry PTX that the driver could compile. Switch that fallback off.
          Which build can still write the sum?
        hold: 2.5
        visual_cues:
          - id: expected
            phrase: Slot one should hold minus one and three quarters
            targets:
              - reference
            color: cyan
            linger: 0.45
          - id: device
            phrase: Look at the GPU. Its compute capability is twelve point zero
            targets:
              - chip
            color: cyan
            linger: 0.45
          - id: targets
            phrase: Build A targets twelve point zero. Build B targets nine point zero
            targets:
              - track-a
              - track-b
            color: cyan
            linger: 0.45
          - id: native-only
            phrase: Switch that fallback off
            targets:
              - fallback
            color: yellow
            linger: 0.45
      - say: Send both images to the loader. Build A writes minus one and three quarters. Build B stops at
          image selection. Its native code targets a different major compute capability. Its output slot
          stays empty. Let’s open A’s native image and follow one store.
        caption_starts:
          - Build A writes
          - Build B stops
        hold: 0.85
        visual_cues:
          - id: approach
            phrase: Send both images to the loader
            targets:
              - track-a
              - track-b
            color: cyan
            linger: 0.45
          - id: write-a
            phrase: Build A writes minus one and three quarters
            targets:
              - track-a
            color: green
            linger: 0.45
          - id: stop-b
            phrase: Build B stops at image selection
            targets:
              - track-b
            color: pink
            linger: 0.45
          - id: inspect-a
            phrase: follow one store
            targets:
              - track-a
            color: cyan
            linger: 0.45
  - id: artifacts
    title: Follow the value written to slot one
    visual: The source and a PTX sketch accumulate four aligned operations. Each operation moves a concrete
      value. A target cubin supplies the physical register names in the native column.
    beats:
      - say: Stay with build A and look at index one. Load the quarter from x. Load negative two from y. Add the
          two values, then store their sum in output slot one. The middle column is a sketch of those
          steps in PTX, a virtual instruction set. The names that start with a percent sign tell us which
          value the next instruction reads. We still need the target build to find out where those values
          land.
        hold: 0.75
        visual_cues:
          - id: load-x
            phrase: Load the quarter from x
            targets:
              - operations
            color: cyan
            linger: 0.45
          - id: load-y
            phrase: Load negative two from y
            targets:
              - operations
            color: cyan
            linger: 0.45
          - id: virtual-add
            phrase: Add the two values
            targets:
              - operations
            color: cyan
            linger: 0.45
          - id: virtual-store
            phrase: store their sum in output slot one
            targets:
              - operations
            color: green
            linger: 0.45
          - id: virtual-values
            phrase: names that start with a percent sign
            targets:
              - operations
            color: cyan
            linger: 0.45
      - say: Open the disassembly of the native image. This build loads the inputs into registers four
          and seven. Its floating-point add writes register nine. Follow nine into the store. There’s our
          sum in output slot one. If you rebuild for another GPU, open that cubin to see which
          instructions and registers its compiler chose.
        hold: 0.75
        visual_cues:
          - id: native-open
            phrase: Open the disassembly of the native image
            targets:
              - operations
            color: cyan
            linger: 0.45
          - id: native-load
            phrase: loads the inputs into registers four and seven
            targets:
              - operations
            color: cyan
            linger: 0.45
          - id: native-add
            phrase: floating-point add writes register nine
            targets:
              - operations
            color: cyan
            linger: 0.45
          - id: native-store
            phrase: Follow nine into the store
            targets:
              - operations
            color: green
            linger: 0.45
  - id: host-device-package
    title: Keep the host path separate from each device image
    visual: Host code and device code take separate compilation paths. The pictured package retains a native
      sm_90 cubin and compute_90 PTX.
    beats:
      - say: Look inside vector add dot C U. Main runs on the CPU. The add kernel runs on the GPU. The
          compiler driver separates them. It sends main to a C plus plus compiler, then packages
          requested device images inside the host object. That bundle is called a fatbinary. Here it
          carries native code for S M ninety and virtual code for compute ninety.
        hold: 0.7
        visual_cues:
          - id: split-host-device
            phrase: separates them
            targets:
              - package-paths
            color: cyan
            linger: 0.55
          - id: package-images
            phrase: packages requested device images
            targets:
              - package-paths
            color: cyan
            linger: 0.55
      - say: Follow PTX into the cubin. The assembler reads the virtual instructions in PTX, allocates
          physical registers and writes encoded instructions and metadata into a cubin. That file uses
          the ELF format. SASS is the human-readable disassembly of those instructions. One route into
          PTX starts with NVVM IR, a GPU-specific form of LLVM IR. A module must satisfy NVVM’s rules for
          libNVVM to compile it.
        hold: 0.7
        visual_cues:
          - id: assemble-target
            phrase: allocates physical registers
            targets:
              - artifact-boundaries
            color: cyan
            linger: 0.55
          - id: disassemble-view
            phrase: SASS is the human-readable disassembly
            targets:
              - artifact-boundaries
            color: cyan
            linger: 0.55
      - say: Different frontends expose different intermediate files. CUDA Tile uses Tile IR. When you
          have a PTX file, read its two header lines. The target names the GPU features it needs. An
          ordinary target can work on a compatible later GPU. An architecture-specific A suffix or a
          family-specific F suffix narrows that choice. A driver must also understand the PTX ISA
          version. Here that’s nine point two.
        hold: 0.7
        visual_cues:
          - id: ptx-driver-version
            phrase: A driver must also understand the PTX ISA version
            targets:
              - compatibility-header
            color: cyan
            linger: 0.55
  - id: captured-native
    title: What can the native listing establish?
    visual: Four byte offsets in the captured sm_120 disassembly connect two inputs to register R9 and the
      output store. The resource report and numerical checks describe separate properties of that build.
    beats:
      - say: The recorded build uses CUDA thirteen point two on a device with compute capability twelve point
          zero. The cubin is marked S M one twenty. The standalone PTX file has two labels. Its target is
          S M ninety, and its instruction set version is nine point two. One label names the features the
          code assumes. The other tells you which PTX syntax the driver has to understand.
        hold: 0.7
        visual_cues:
          - id: capture-labels
            phrase: The recorded build
            targets:
              - native-build-labels
            color: cyan
            linger: 0.55
      - say: Read the native byte offsets down the left. At index one the two global loads bring a quarter into
          register four and negative two into register seven. An earlier predicate makes invalid indices
          exit before these loads. Where is the sum just before the store?
        hold: 2.2
        visual_cues:
          - id: capture-inputs
            phrase: At index one
            targets:
              - native-values
            color: cyan
            linger: 0.55
          - id: load-r4
            phrase: the two global loads bring a quarter into register four and negative two into register seven
            targets:
              - native-values
            color: cyan
            linger: 0.55
      - say: The add writes minus one and three quarters to register nine. The store at hexadecimal offset one
          five zero copies that register to output slot one. Those offsets and the source line mapping tie
          the instructions to this particular build.
        caption_starts:
          - to register nine
        hold: 0.75
        visual_cues:
          - id: add-r9
            phrase: The add writes minus one and three quarters to register nine
            targets:
              - native-values
            color: cyan
            linger: 0.55
            caption_boundary: true
          - id: store-r9
            phrase: copies that register to output slot one
            targets:
              - native-values
            color: cyan
            linger: 0.55
      - say: The assembler reports twelve registers, zero stack bytes and zero spill loads or stores for
          this kernel. Now run the addition. The executable passes lengths one, two hundred fifty-five,
          two hundred fifty-six, two hundred fifty-seven and one thousand. Each run starts with NaNs in
          the output. A skipped store leaves a NaN where we expect a finite sum. All five shapes match
          their references, and memcheck reports zero errors.
        hold: 0.7
        visual_cues:
          - id: resource-twelve
            phrase: twelve registers
            targets:
              - native-report
            color: cyan
            linger: 0.55
          - id: shape-fixtures
            phrase: passes lengths one
            targets:
              - native-fixtures
            color: cyan
            linger: 0.55
  - id: loader
    title: Select a compatible image before launching work
    visual: Three explicit loader cases traverse compatible-native, usable-PTX/JIT, and missing-image
      branches, holding each branch for the corresponding narration.
    beats:
      - say: The loader first looks for a compatible native image. When usable PTX is available instead, the
          driver can compile it for a supported target. That path can add work to the first request.
          Compatibility depends on the exact architecture features, PTX version, and driver support
          recorded with the package.
        hold: 0.65
        visual_cues:
          - id: loader-native-path
            phrase: The loader first looks for a compatible native image
            targets:
              - loader-compatible-native-image
              - loader-s-result
            color: blue
            linger: 0.5
          - id: loader-ptx-path
            phrase: When usable PTX is available instead
            targets:
              - loader-compatible-native-image
              - loader-usable-ptx
              - loader-s-result
            color: yellow
            linger: 0.5
          - id: loader-first-request-work
            phrase: the driver can compile it for a supported target. That path can add work to the first
              request
            targets:
              - loader-first-compile-work
              - loader-s-result
            color: green
            linger: 0.5
      - say: Now remove both compatible options. Execution stops at image selection, so kernel performance
          counters cannot diagnose this failure. Inspect the packaged images and target information.
          Test the native-only and forced-PTX paths in separate processes, and separate compilation,
          loading, first launch, and warm execution in the cold-start trace.
        hold: 0.65
        visual_cues:
          - id: loader-missing-images
            phrase: Now remove both compatible options
            targets:
              - loader-compatible-native-image
              - loader-usable-ptx
              - loader-s-result
            color: pink
            linger: 0.5
  - id: actual-loader-cases
    title: Which path did the loader exercise?
    visual: Fresh processes on the same compute capability 12.0 device exercise native and PTX loading on
      build A, build B and a package with its PTX removed.
    beats:
      - say: These are the captured runs behind our opening. Build A carries an S M one twenty cubin and compute
          ninety PTX. Normal mode and native-only mode pass all five shapes on the same twelve point zero
          GPU. Now ignore the native image. Forced PTX with the driver disk cache disabled also passes.
          Each mode starts in a fresh process with conflicting JIT flags removed. It takes that last run
          to establish that this driver can compile the fallback.
        hold: 0.7
        visual_cues:
          - id: target-branches
            phrase: Normal mode and native-only mode pass all five shapes
            targets:
              - loader-cases
            color: cyan
            linger: 0.55
            caption_boundary: true
          - id: forced-target-ptx
            phrase: Forced PTX with the driver disk cache disabled also passes
            targets:
              - loader-cases
            color: cyan
            linger: 0.55
            caption_boundary: true
      - say: Build B changes just the native image to S M ninety. Keep the device and the compute ninety PTX.
          Forced PTX succeeds. Now disable PTX compilation and the run reports, PTX JIT compilation was
          disabled. That’s where B stopped in the opening. Finally remove the PTX from B and restore
          normal mode. The loader reports, no kernel image is available for execution on the device. None
          of those switches changed the addition.
        hold: 0.7
        visual_cues:
          - id: hopper-ptx
            phrase: Forced PTX succeeds
            targets:
              - loader-cases
            color: cyan
            linger: 0.55
            caption_boundary: true
          - id: disabled-jit-error
            phrase: PTX JIT compilation was disabled
            targets:
              - loader-cases
            color: cyan
            linger: 0.55
            caption_boundary: true
          - id: missing-image-error
            phrase: no kernel image is available for execution on the device
            targets:
              - loader-cases
            color: cyan
            linger: 0.55
            caption_boundary: true
      - say: Build B stopped at the loader. Open its host executable with cuobjdump to inventory or
          extract images. For a closer look, give nvdisasm the extracted cubin. It shows the native
          instructions and where registers are live. In the recorded check, passing the host executable
          directly to nvdisasm produced an input error. Save the exact message with the file that
          produced it.
        hold: 0.7
        visual_cues:
          - id: extract-cubin
            phrase: inventory or extract images
            targets:
              - image-inventory
            color: cyan
            linger: 0.55
  - id: register-lifetimes
    title: Separate virtual values from simultaneous physical storage
    visual: Extending a value’s last use changes the number of overlapping live values. A second example rounds a warp allocation and fits complete blocks into a register file.
    beats:
      - say: Watch when each value is still needed. A is needed from operation zero through three, B from
          two through six, and C from four through seven. By the time C arrives, A’s last use is over.
          They can reuse one slot. B stays live across the handoff, so give it the second slot.
        hold: 0.7
        visual_cues:
          - id: lifetime-a
            phrase: A is needed from operation zero through three
            targets:
              - lifetime-intervals
            color: cyan
            linger: 0.55
          - id: lifetime-b
            phrase: B from two through six
            targets:
              - lifetime-intervals
            color: cyan
            linger: 0.55
          - id: lifetime-c
            phrase: C from four through seven
            targets:
              - lifetime-intervals
            color: cyan
            linger: 0.55
          - id: reuse-slot
            phrase: reuse one slot
            targets:
              - physical-slots
            color: cyan
            linger: 0.55
      - say: Now extend A’s last use through operation five. B and C stay where they were. At operations
          four and five, all three values are live at once. Now each needs its own slot. Look for that
          extra overlap in a cubin’s liveness listing. The build’s resource report tells you how many
          registers the assembler actually allocated.
        hold: 0.7
        visual_cues:
          - id: extend-a
            phrase: extend A’s last use through operation five
            targets:
              - lifetime-intervals
            color: cyan
            linger: 0.55
          - id: third-live
            phrase: all three values are live at once
            targets:
              - physical-slots
            color: cyan
            linger: 0.55
      - say: How many blocks fit when each thread uses thirty-two registers? Thirty-two threads in a warp
          request one thousand twenty-four. In this model we round that per-warp demand upward in units
          of two hundred fifty-six. This warp fills four units exactly. Multiply by eight warps per
          block. Eight of those blocks fill the register file and reach the sixty-four-warp limit.
        hold: 0.7
        visual_cues:
          - id: rounded-demand
            phrase: round that per-warp demand upward
            targets:
              - rounded-demand
            color: cyan
            linger: 0.55
  - id: registers
    title: How the register file fills
    visual: A magnified warp allocation and a fixed register file show how demand rounds up, how whole
      blocks fit, and how demand can rise again within the same allocation.
    beats:
      - say: Here’s the register file we just filled. Each block has eight warps, and all eight blocks fit. Look
          inside one warp. Its thirty-two threads each need thirty-two registers. They fill four
          allocation units exactly. Now give each thread one more register. The warp needs one thousand
          fifty-six. Those extra thirty-two registers open a fifth unit. Each warp now takes one thousand
          two hundred eighty registers, so one block takes ten thousand two hundred forty. With the same
          register file, can a seventh block still fit?
        hold: 2.4
        visual_cues:
          - id: register-initial-allocation
            phrase: Look inside one warp
            targets:
              - warp-allocation
            color: cyan
            linger: 0.45
          - id: register-add-one
            phrase: give each thread one more register
            targets:
              - warp-allocation
            color: yellow
            linger: 0.45
          - id: round-unit
            phrase: open a fifth unit
            targets:
              - warp-allocation
            color: yellow
            linger: 0.45
          - id: block-footprint
            phrase: one block takes ten thousand two hundred forty
            targets:
              - register-file
            color: cyan
            linger: 0.45
            caption_boundary: true
      - say: Six whole blocks fit. Try sliding a seventh into the space at the right. Only four thousand
          ninety-six registers are free. The block needs all ten thousand two hundred forty before any of
          its warps can join. Six blocks give us forty-eight resident warps out of a possible sixty-four.
          Now raise the demand to forty registers per thread. Look at that fifth unit again. Does a block
          have to leave?
        hold: 2.3
        visual_cues:
          - id: register-fewer-blocks
            phrase: Six whole blocks fit
            targets:
              - register-file
            color: green
            linger: 0.45
            caption_boundary: true
          - id: try-seventh
            phrase: sliding a seventh into the space at the right
            targets:
              - register-file
            color: yellow
            linger: 0.45
          - id: free-registers
            phrase: four thousand ninety-six registers are free
            targets:
              - register-file
            color: yellow
            linger: 0.45
            caption_boundary: true
          - id: register-forty
            phrase: raise the demand to forty registers per thread
            targets:
              - warp-allocation
            color: yellow
            linger: 0.45
      - say: All six can stay. Forty times thirty-two fills the fifth unit exactly. We used its empty space, so
          the block allocation stayed the same. At forty-one registers per thread we cross the next step.
          The larger blocks leave room for five. This counts blocks that can reside together under our
          assumptions. On a real target, shared memory or another hardware limit may bind first. Before
          setting a register cap, check the build for spills and time the warmed kernel. Better reuse can
          make fewer resident warps faster.
        hold: 1
        visual_cues:
          - id: same-step
            phrase: All six can stay
            targets:
              - register-file
            color: green
            linger: 0.45
            caption_boundary: true
          - id: register-next
            phrase: At forty-one registers per thread
            targets:
              - warp-allocation
            color: yellow
            linger: 0.45
          - id: five-blocks
            phrase: The larger blocks leave room for five
            targets:
              - register-file
            color: green
            linger: 0.45
            caption_boundary: true
          - id: register-resource-reports
            phrase: check the build for spills and time the warmed kernel
            targets:
              - register-file
            color: cyan
            linger: 0.45
  - id: spill-workload
    title: A spill changes accesses and can consume another residency budget
    visual: A thread repeatedly stores and reloads a four-byte value. A separate example places spills in a finite shared-memory budget.
    beats:
      - say: Watch one thread spill a value to local memory, then read it back. In this loop, one
          four-byte spill store and one four-byte spill load execute twenty times per thread. That
          requests one hundred sixty bytes per thread. Local memory is backed by device memory. Its
          accesses can hit in cache, so count the requests here and measure traffic to device memory on
          the GPU.
        hold: 0.7
        visual_cues:
          - id: spill-accesses
            phrase: one four-byte spill store and one four-byte spill load
            targets:
              - spill-loop
            color: cyan
            linger: 0.55
          - id: spill-iterations
            phrase: execute twenty times
            targets:
              - spill-loop
            color: cyan
            linger: 0.55
          - id: spill-total
            phrase: one hundred sixty bytes per thread
            targets:
              - spill-total
            color: cyan
            linger: 0.55
      - say: The assembler gives you the static spill report. Multiply each access width by its execution
          count to get the requested bytes. If you cap registers, the compiler may change which values
          spill and which instructions run. It raises a cap below the ABI minimum to that minimum. A
          launch with more threads per block than its declared maximum fails. Time the warmed kernel to
          see what the cap actually changed.
        hold: 0.7
        visual_cues:
          - id: static-dynamic
            phrase: Multiply each access width by its execution count
            targets:
              - spill-report
            color: cyan
            linger: 0.55
          - id: launch-maximum
            phrase: more threads per block than its declared maximum fails
            targets:
              - spill-report
            color: cyan
            linger: 0.55
      - say: CUDA thirteen added an option for whole-program compilation that uses shared memory before
          local fallback for spills. Extra shared storage can reduce resident blocks. This option
          excludes dynamic shared memory and warp register reallocation. Explicit launch bounds help
          predict the allocation. Compare the two builds’ register, stack, spill and shared-memory
          reports, then measure the warmed kernels on the target.
        hold: 0.7
        visual_cues:
          - id: shared-spill
            phrase: shared memory before local fallback
            targets:
              - spill-storage
            color: cyan
            linger: 0.55
          - id: shared-residency
            phrase: Extra shared storage can reduce resident blocks
            targets:
              - spill-storage
            color: cyan
            linger: 0.55
  - id: identity
    title: Which version of the addition did the cache return?
    visual: Two lookups see the same main file and different included header bytes. One lookup sends nine to
      the output after the scale changes. The other follows the miss through recompilation to eighteen.
    beats:
      - say: Here the kernel also multiplies its sum by a scale from a header file. Four plus five is nine. The
          scale is one, so we store nine. Save that compiled operation in a cache. The next build uses the
          same main file and the same two inputs. Change just the header to scale two. If the lookup
          checks only the main file, what value will the cached operation write?
        hold: 2.4
        visual_cues:
          - id: cache-original
            phrase: The scale is one, so we store nine
            targets:
              - cache-recipe
            color: green
            linger: 0.45
            caption_boundary: true
          - id: cache-save
            phrase: Save that compiled operation
            targets:
              - cache-lookups
            color: cyan
            linger: 0.45
          - id: cache-header
            phrase: Change just the header to scale two
            targets:
              - cache-recipe
            color: yellow
            linger: 0.45
      - say: It still writes nine. The executable it retrieved has one baked in. Look up the same build using
          the included header bytes as part of the key. The changed bytes make this a miss. Compile the
