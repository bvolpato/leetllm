            targets: [signed-form]
          - id: maya-pending
            phrase: "The queue acknowledges one pending entry"
            targets: [queue-entry]
      - say: >-
          Retry the same key and payload. The same reference comes back. Compare the full retained record
          against the expected entry. They match and there’s still just one row. Maya asks, “Is the
          money back?” What can you tell her from this receipt?
        hold: 2.6
        caption_starts:
          - "What can you tell her from this receipt"
        visual_cues:
          - id: maya-recover
            phrase: "The same reference comes back"
            targets: [recovered-reference]
          - id: maya-effects
            phrase: "They match"
            targets: [expected-effect]
