            phrase: "Maya asks"
            targets: [queue-entry]
      - say: >-
          “Your credit request is pending.” Give her the reference. A billing worker still has to apply the
          credit. For Alex’s original nine hundred dollars, the specialist queue acknowledged the review
          packet. Alex can use the review reference. Maya can use the credit request reference.
          Which record would show that either customer got the money?
        hold: 2.2
        visual_cues:
