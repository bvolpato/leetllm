  - id: finite-report
    title: Validate the evidence before applying the release rule
    visual: Decode the exact candidate metric tuple. Send Boolean,NaN,infinite,missing and out-of-range values through the actual strict reference validator, then apply the separate quality/schema/latency/cost gates only to a valid tuple.
    beats:
      - say: A gate cannot interpret missing or invalid evidence as a good measurement. The reference validator requires actual integer or float metric values, rejects Booleans, checks finiteness and valid rate ranges, and rejects negative latency or cost. It also catches integer telemetry too large for its floating-point validation. Check the domain before reading a point estimate against a threshold.
