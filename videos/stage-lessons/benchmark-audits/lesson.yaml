scenes:
  - id: intro
    title: "Which assistant should take the renewal desk?"
    visual: "Pull the ten renewal requests out of the hundred-question score sheet, then open both assistants’ results on the same ten slips."
    beats:
      - say: "Pull out the ten renewal questions. Both assistants scored ninety out of a hundred on the whole sheet. Who should answer renewals?"
        hold: 0.5
        caption_starts: ["Both assistants scored", "Who should answer renewals"]
        visual_cues:
          - id: tied-scores
            phrase: "Both assistants scored ninety out of a hundred"
            targets: [picture]
      - say: "Line up the same ten questions for both assistants. On the other ninety questions, A got eighty-eight right. B got eighty-one. Which one answered more renewals correctly?"
        hold: 2.4
        caption_starts: ["Which one answered more renewals correctly"]
        visual_cues:
          - id: renewal-file
            phrase: "Line up the same ten questions"
            targets: [picture]
          - id: ordinary-a
            phrase: "A got eighty-eight right"
            targets: [picture]
            caption_boundary: true
          - id: ordinary-b
            phrase: "B got eighty-one"
            targets: [picture]
            caption_boundary: true
          - id: ask-renewals
            phrase: "Which one answered more renewals correctly"
            targets: [picture]
      - say: "Open A's ten renewals. Two passed. Open B's row underneath. Nine passed. Look at question ninety-three. Both assistants got the same request. Only B got it right."
        hold: 0.85
        caption_starts: ["Open B's row underneath", "Look at question ninety-three", "Only B got it right"]
        visual_cues:
          - id: open-a
            phrase: "Open A's ten renewals"
            targets: [picture]
          - id: count-a
            phrase: "Two passed"
            targets: [picture]
            caption_boundary: true
          - id: open-b
            phrase: "Open B's row underneath"
            targets: [picture]
          - id: count-b
            phrase: "Nine passed"
            targets: [picture]
            caption_boundary: true
          - id: one-renewal
            phrase: "Look at question ninety-three"
            targets: [picture]
      - say: "A benchmark has two parts. The tasks decide what we ask. The scoring rule decides which answers count. For a renewal, what would a correct answer have to say?"
        hold: 0.7
        visual_cues:
          - id: tasks
            phrase: "The tasks decide what we ask"
            targets: [picture]
          - id: grading
            phrase: "The scoring rule decides which answers count"
            targets: [picture]
  - id: contract
    title: Keep the comparison contract visible
    visual: Two aligned harness rows preserve dataset, input path, prompt, budget, and scorer. A changed retrieval depth moves the comparison from model replacement to a whole-system experiment.
    beats:
      - say: Imagine changing the model inside a library assistant. Both candidates should receive the same questions, available evidence, response requirements, and scoring rules. Record the prompt, tools, sampling settings, and attempt budget as well. Each model still needs its own correct chat formatting.
        hold: 0.6
        visual_cues:
          - id: contract-beat-1-focus-1
            phrase: Imagine changing the model inside a library assistant
            targets:
              - contract-simulation-6
            color: blue
            linger: 0.6
      - say: Now give the second system five retrieved passages where the first received three. Its answers may improve, and that is useful to measure. The experiment now compares two complete systems. Retrieval changed along with the model, so the report must describe both changes.
        hold: 0.7
        visual_cues:
          - id: contract-beat-2-focus-1
            phrase: Now give the second system five retrieved passages
            targets:
              - contract-simulation-6
            color: blue
            linger: 0.6
          - id: ba-contract-passages
            phrase: five retrieved passages
            targets:
              - ba-contract-passages
            color: cyan
            linger: 0.4
          - id: ba-contract-consequence
            phrase: Its answers may improve
            targets:
              - ba-contract-consequence
            color: cyan
            linger: 0.4
      - say: Public benchmarks also have distinct contracts. Multiple-choice knowledge, executable programs, and human preferences score different units. Use those results to choose promising candidates, then compare them on the task your application actually needs.
        hold: 0.65
        visual_cues:
          - id: contract-beat-3-focus-1
            phrase: Public benchmarks also have distinct contracts
            targets:
              - contract-simulation-6
            color: blue
            linger: 0.6
  - id: gold-contract
    title: Validate the questions before grading the answers
    visual: Construct three actual CodeAssist gold records. Keep their IDs and policy source beside required clauses, duplicate one identity, then repair an unsupported requirement before admitting any model output.
    beats:
      - say: "Open the answer key. Each row pairs a question with the policy that supplies its answer. In this example, a deployment freeze requires commander approval, a threshold breach calls for the rollback runbook, and exposed tokens must be revoked within fifteen minutes. Keep the required facts and forbidden claims with each source."
        hold: 0.7
        visual_cues:
          - id: gold-contract-phase-0
            phrase: "Open the answer key"
            targets:
              - gold-contract-mechanism
            color: cyan
            linger: 0.55
          - id: ba-gold-contract-approval
            phrase: commander approval
            targets:
              - ba-gold-contract-approval
            color: cyan
            linger: 0.4
      - say: "Give each row a unique identity. Duplicating an identity can attach a score to the wrong question. The validator checks for repeated IDs and looks for required phrases in the source. A reviewer then compares each gold requirement with the policy that governs the case. Does the policy actually say what the answer key demands?"
        hold: 0.7
        visual_cues:
          - id: gold-contract-phase-1
            phrase: Give each row a unique identity
            targets:
              - gold-contract-mechanism
            color: cyan
            linger: 0.55
          - id: ba-gold-contract-unique
            phrase: Duplicating an identity
            targets:
              - ba-gold-contract-unique
            color: cyan
            linger: 0.4
          - id: ba-gold-contract-gold
            phrase: "compares each gold requirement"
            targets:
              - ba-gold-contract-gold
            color: cyan
            linger: 0.4
      - say: "The source says to use the rollback runbook. Suppose the answer key says to keep deploying. An assistant could follow the policy and lose the point. Repair the gold row first. Record the reviewed answer and how serious a mistake would be. Include critical requests and cases where the assistant should say it lacks the evidence to answer."
        hold: 0.7
        visual_cues:
          - id: gold-contract-phase-2
            phrase: "The source says to use the rollback runbook"
            targets:
              - gold-contract-mechanism
            color: cyan
            linger: 0.55
          - id: ba-gold-contract-unsupported
            phrase: "the answer key says to keep deploying"
            targets:
              - ba-gold-contract-unsupported
            color: pink
            linger: 0.4
          - id: ba-gold-contract-repair
            phrase: repair the gold row first
            targets:
              - ba-gold-contract-repair
            color: cyan
            linger: 0.4
  - id: checker
    title: "Would the checker accept this deadline?"
    visual: "Keep the rule fixed. Run each complete answer through the same two substring tests. Compare its literal verdict with the independently supplied reading of the deadline."
    beats:
      - say: "The library rule says borrowed books are due on Friday. Here's our first answer, word for word. The checker looks for two pieces of text, books and Friday. It ignores capitalization. Both pieces are there. A reviewer also accepts this deadline."
        hold: 0.65
        visual_cues:
          - id: checker-test
            phrase: "The checker looks for two pieces of text"
            targets: [picture]
          - id: literal-first
            phrase: "Both pieces are there"
            targets: [picture]
          - id: review-first
            phrase: "A reviewer also accepts this deadline"
            targets: [picture]
      - say: "Now move the deadline. Books are due after Friday. Will the checker accept that answer?"
        hold: 2.1
        visual_cues:
          - id: later-answer
            phrase: "Books are due after Friday"
            targets: [picture]
          - id: later-ask
            phrase: "Will the checker accept that answer"
            targets: [picture]
      - say: "It passes. Both search terms survived. The word after lets the borrower return the book too late. The reviewer rejects it. That's a false positive."
        hold: 0.75
        visual_cues:
          - id: later-literal
            phrase: "It passes"
            targets: [picture]
            caption_boundary: true
          - id: later-meaning
            phrase: "The reviewer rejects it"
            targets: [picture]
      - say: "Try an abbreviation. The answer still says to return the books by Friday. The weekday is written with just three letters, F, R, I. The reviewer accepts the abbreviation. What will the same checker do?"
        hold: 2
        visual_cues:
          - id: short-answer
            phrase: "Try an abbreviation"
            targets: [picture]
          - id: short-meaning
            phrase: "The reviewer accepts the abbreviation"
            targets: [picture]
          - id: short-ask
            phrase: "What will the same checker do"
            targets: [picture]
      - say: "It fails. The letters needed for Friday end too soon. That's a false negative. Use exact checks for fields with exact requirements. For meaning, run the frozen checker on independently reviewed answers and read the disagreements."
        hold: 0.85
        visual_cues:
          - id: short-literal
            phrase: "It fails"
            targets: [picture]
            caption_boundary: true
          - id: compare-probes
            phrase: "read the disagreements"
            targets: [picture]
  - id: rag-stage
    title: Locate the first missing policy fact
    visual: Carry one source clause through retrieved context and generated answer. Remove it before assembly, restore it, then omit it only from the response; retain each actual first-failure label.
    beats:
      - say: Follow the commander-approval fact through the actual request. First inspect the final context sent to the model, after permissions, ranking and token-budget selection. If that clause is absent there, the response never received the required evidence. A relevant document retrieved earlier but dropped during assembly does not count as evidence the model saw.
        hold: 0.7
        visual_cues:
          - id: rag-stage-phase-0
            phrase: Follow the commander-approval fact through the actual request
            targets:
              - rag-stage-mechanism
            color: cyan
            linger: 0.55
          - id: ba-rag-stage-drop
            phrase: clause is absent there
            targets:
              - ba-rag-stage-drop
            color: cyan
            linger: 0.4
      - say: "Keep the context complete and change only the answer: it mentions the freeze but substitutes an on-call engineer for commander approval. Now the first observed failure is generation or instruction following. The article’s literal classifier reports bad retrieval, bad generation or pass by checking required phrases in that order. It inherits the same negation and paraphrase limits as its checker."
        hold: 0.7
        visual_cues:
          - id: rag-stage-phase-1
            phrase: "Keep the context complete and change only the answer: it mentions the freeze but substitutes an on-call engineer for commander approval"
            targets:
              - rag-stage-mechanism
            color: cyan
            linger: 0.55
          - id: ba-rag-stage-complete
            phrase: Keep the context complete
            targets:
              - ba-rag-stage-complete
            color: cyan
            linger: 0.4
          - id: ba-rag-stage-engineer
            phrase: substitutes an on-call engineer
            targets:
              - ba-rag-stage-engineer
            color: cyan
            linger: 0.4
          - id: generation-failure
            phrase: Now the first observed failure is generation or instruction following
            targets:
              - picture
      - say: An exact citation can identify a source while an attached claim contradicts it. Exercise correct answer with correct page, correct answer with wrong page, and a negated answer with correct page. Source identity and semantic entailment are separate checks. Preserve context, answer and source versions so a repair targets the observed boundary and then repeats the complete regression path.
        hold: 0.7
        visual_cues:
          - id: rag-stage-phase-2
            phrase: An exact citation can identify a source while an attached claim contradicts it
            targets:
              - rag-stage-mechanism
            color: cyan
            linger: 0.55
          - id: ba-rag-stage-citation
            phrase: Source identity and semantic entailment
            targets:
              - ba-rag-stage-citation
            color: cyan
            linger: 0.4
  - id: rag-metrics
    title: Measure what arrived and what was said
    visual: Build ranked relevance flags, reference-fact coverage and generated-claim support from one retained policy packet. Construct their different denominators and leave an omitted answer fact visible.
    beats:
      - say: Retrieval precision and recall answer different questions. In a supplied ranked list with relevance flags one, zero, one, precision at the first relevant rank is one, and at the third is two thirds. Averaging those precisions gives five sixths, about point eight three three. That score rewards useful context appearing early. To find a fact missing from every chunk, look at recall.
        hold: 0.7
        visual_cues:
          - id: rag-metrics-phase-0
            phrase: Retrieval precision and recall answer different questions
            targets:
              - rag-metrics-mechanism
            color: cyan
            linger: 0.55
          - id: precision-first
            phrase: precision at the first relevant rank is one
            targets:
              - rag-metrics-mechanism
            color: yellow
            linger: 0.45
          - id: precision-third
            phrase: at the third is two thirds
            targets:
              - rag-metrics-mechanism
            color: yellow
            linger: 0.45
          - id: precision-average
            phrase: five sixths, about point eight three three
            targets:
              - rag-metrics-mechanism
            color: yellow
            linger: 0.45
          - id: ba-rag-metrics-rank1
            phrase: precision at the first relevant rank is one
            targets:
              - ba-rag-metrics-rank1
            color: cyan
            linger: 0.4
          - id: ba-rag-metrics-rank3
            phrase: at the third is two thirds
            targets:
              - ba-rag-metrics-rank3
            color: cyan
            linger: 0.4
          - id: ba-rag-metrics-average
            phrase: five sixths
            targets:
              - ba-rag-metrics-average
            color: cyan
            linger: 0.4
      - say: For reference-based context recall, divide covered reference facts by required reference facts. Suppose the context contains two of three required facts. Recall is two thirds. If the response states only those two supported facts, its faithfulness is two supported claims divided by two claims, or one. The response is still incomplete. A supported claim can also repeat an outdated source.
        hold: 0.7
        visual_cues:
          - id: rag-metrics-phase-1
            phrase: For reference-based context recall, divide covered reference facts by required reference facts
            targets:
              - rag-metrics-mechanism
            color: cyan
            linger: 0.55
          - id: context-recall
            phrase: Recall is two thirds
            targets:
              - rag-metrics-mechanism
            color: yellow
            linger: 0.45
          - id: faithfulness-one
            phrase: or one
            targets:
              - rag-metrics-mechanism
            color: yellow
            linger: 0.45
          - id: ba-rag-metrics-recall
            phrase: Recall is two thirds
            targets:
              - ba-rag-metrics-recall
            color: cyan
            linger: 0.4
          - id: ba-rag-metrics-faithful
            phrase: or one
            targets:
              - ba-rag-metrics-faithful
            color: cyan
            linger: 0.4
          - id: two-claims
            phrase: If the response states only those two supported facts
            targets:
              - picture
      - say: "Ragas can also score how closely an answer addresses the question. It generates questions from the answer and compares their embeddings with the original question, averaging cosine similarities. An answer about deployments can stay on topic while leaving out who approves the change. Use independent reviewer labels to check how well the model-based scores capture those distinctions."
        hold: 0.7
        visual_cues:
          - id: rag-metrics-phase-2
            phrase: "It generates questions from the answer"
            targets:
              - rag-metrics-mechanism
            color: cyan
            linger: 0.55
          - id: ba-rag-metrics-relevance
            phrase: averaging cosine similarities
            targets:
              - ba-rag-metrics-relevance
            color: cyan
            linger: 0.4
  - id: knowledge-contract
    title: Keep the task and parser attached to the score
    visual: The same candidate choices pass through choice-probability and generated-letter scoring contracts. Construct four versus ten uniform-guess branches, then retain GPQA subset ancestry and a private HELM scenario.
    beats:
      - say: Public benchmarks help shortlist capabilities. MMLU covers fifty-seven subjects with four choices per question. One choice is correct, so a uniform guess has a one-in-four chance. Over many guesses the expected fraction correct is one fourth. Common evaluations use five demonstrations and choice-token probabilities; generated-answer parsing is another protocol. Changing that path changes what a score measures, even when both results are percentages.
        hold: 0.7
        visual_cues:
          - id: knowledge-contract-phase-0
            phrase: Public benchmarks help shortlist capabilities
            targets:
              - knowledge-contract-mechanism
            color: cyan
            linger: 0.55
          - id: mmlu-guess
            phrase: one fourth
            targets:
              - knowledge-contract-mechanism
            color: yellow
            linger: 0.45
          - id: ba-knowledge-contract-four
            phrase: four choices per question
            targets:
              - ba-knowledge-contract-four
            color: cyan
            linger: 0.4
          - id: ba-knowledge-contract-quarter
            phrase: one fourth
            targets:
              - ba-knowledge-contract-quarter
            color: cyan
            linger: 0.4
      - say: "MMLU-Pro adds reviewed, reasoning-focused questions with up to ten choices. Exactly ten choices give a one-tenth guessing expectation. Its reported chain-of-thought advantage belongs to the tested models and protocol. GPQA instead uses expert biology, physics and chemistry: Extended has five hundred forty-six questions, main four hundred forty-eight, and Diamond one hundred ninety-eight. Validator-based filtering changes the subsets, so name the actual split."
        hold: 0.7
        visual_cues:
          - id: knowledge-contract-phase-1
            phrase: MMLU-Pro adds reviewed, reasoning-focused questions with up to ten choices
            targets:
              - knowledge-contract-mechanism
            color: cyan
            linger: 0.55
          - id: pro-guess
            phrase: a one-tenth guessing expectation
            targets:
              - knowledge-contract-mechanism
            color: yellow
            linger: 0.45
          - id: ba-knowledge-contract-ten
            phrase: up to ten choices
            targets:
              - ba-knowledge-contract-ten
            color: cyan
            linger: 0.4
          - id: ba-knowledge-contract-gpqa
            phrase: Extended has five hundred forty-six questions
            targets:
              - ba-knowledge-contract-gpqa
            color: cyan
            linger: 0.4
      - say: The original GPQA study’s non-expert validators scored about thirty-four percent on Extended with internet access in that study. HELM evaluates several dimensions, including accuracy, calibration, robustness, fairness and bias. The framework accepts custom scenarios. To measure compliance with your own policy, give it cases from your application.
        hold: 0.7
        visual_cues:
          - id: knowledge-contract-phase-2
            phrase: The original GPQA study’s non-expert validators scored about thirty-four percent on Extended with internet access in that study
            targets:
              - knowledge-contract-mechanism
            color: cyan
            linger: 0.55
          - id: ba-knowledge-contract-human
            phrase: thirty-four percent
            targets:
              - ba-knowledge-contract-human
            color: cyan
            linger: 0.4
          - id: ba-knowledge-contract-custom
            phrase: accepts custom scenarios
            targets:
              - ba-knowledge-contract-custom
            color: cyan
            linger: 0.4
  - id: math-frontier
    title: An answer parser and a dataset version change the experiment
    visual: Extract a numeric answer under two declared parsers, preserve a symbolic derivation separately, then construct a visible version transition and a small authored colored-grid rule.
    beats:
      - say: GSM8K contains about eight and a half thousand grade-school word problems, typically two to eight arithmetic steps. Its reference solutions mark the final number after four hash characters; a particular harness decides whether model outputs need that delimiter. MATH has twelve thousand five hundred competition problems with worked solutions. Extracted final-answer correctness and a valid derivation are different contracts; record parser and tool access.
        hold: 0.7
        visual_cues:
          - id: math-frontier-phase-0
            phrase: GSM8K contains about eight and a half thousand grade-school word problems, typically two to eight arithmetic steps
            targets:
              - math-frontier-mechanism
            color: cyan
            linger: 0.55
          - id: ba-math-frontier-parser
            phrase: a particular harness decides
            targets:
              - ba-math-frontier-parser
            color: cyan
            linger: 0.4
          - id: ba-math-frontier-proof
            phrase: correctness and a valid derivation
            targets:
              - ba-math-frontier-proof
            color: cyan
            linger: 0.4
      - say: Harder suites also need exact versions. Humanity’s Last Exam finalized its original twenty-five-hundred-question public set in April twenty-twenty-five and retains a private holdout. Its site lists Rolling in October twenty-twenty-five and Diamond in September twenty-twenty-six. FrontierMath spans advanced-undergraduate through research-level tiers. Its Tiers One through Four page reports a June twelfth twenty-twenty-six version-two release addressing errors in forty-two percent of problems. A comparison across that revision needs both models scored on the same version.
        hold: 0.7
        visual_cues:
          - id: math-frontier-phase-1
            phrase: Harder suites also need exact versions
            targets:
              - math-frontier-mechanism
            color: cyan
            linger: 0.55
          - id: ba-math-frontier-hle
            phrase: April twenty-twenty-five
            targets:
              - ba-math-frontier-hle
            color: cyan
            linger: 0.4
          - id: ba-math-frontier-versions
            phrase: forty-two percent
            targets:
              - ba-math-frontier-versions
            color: cyan
            linger: 0.4
      - say: ARC-AGI-two asks a system to infer a rule from example input and output grids, then apply it to a new grid. In our little grid, the blue square extends to the right until it reaches the edge. ARC tasks can require several rules together, with the choice depending on the symbols around a cell. Record which split you used. The public, semi-private and private sets have different exposure histories.
        hold: 0.7
        visual_cues:
          - id: math-frontier-phase-2
            phrase: ARC-AGI-two asks a system to infer a rule from example input and output grids, then apply it to a new grid
            targets:
              - math-frontier-mechanism
            color: cyan
            linger: 0.55
          - id: ba-math-frontier-arc
            phrase: apply it to a new grid
            targets:
              - ba-math-frontier-arc
            color: cyan
            linger: 0.4
  - id: code-contract
    title: "Which library tests did this patch pass?"
    visual: "Apply a patch to the loan-period function. Run the selected repair and regression assertions, then try the textbook case that the selected harness omitted."
    beats:
      - say: "HumanEval asks for a function that passes tests. It has one hundred sixty-four handwritten Python problems. SWE-bench starts with an issue in a repository and asks for a patch. Its original collection had two thousand two hundred ninety-four issue-based tasks across twelve Python repositories. For either kind of benchmark, ask which tests the scorer actually ran."
        hold: 0.65
        visual_cues:
          - id: harnesses
            phrase: "SWE-bench starts with an issue in a repository"
            targets: [picture]
      - say: "Here is a small library example. The new-release loan period should be seven days. The old function gives it twenty-one. Ordinary books already get the right twenty-one days. Our harness selects those two checks. In a repository repair benchmark, a failing check that the patch must fix is called fail to pass. A working check that must keep passing is called pass to pass."
        hold: 0.75
        visual_cues:
          - id: loan-code
            phrase: "Here is a small library example"
            targets: [picture]
          - id: old-new
            phrase: "The old function gives it twenty-one"
            targets: [picture]
          - id: old-book
            phrase: "Ordinary books already get the right twenty-one days"
            targets: [picture]
      - say: "Apply this patch. It gives new releases seven days and every other item twenty-one. Run the two selected checks. Both pass. Under the selected tests, this issue is resolved."
        hold: 0.95
        visual_cues:
          - id: loan-patch
            phrase: "Apply this patch"
            targets: [picture]
          - id: selected-tests
            phrase: "Both pass"
            targets: [picture]
          - id: harness-resolved
            phrase: "this issue is resolved"
            targets: [picture]
      - say: "Look at the third case. A textbook loan should last twenty-eight days. What does the patched function return for a textbook?"
        hold: 2.2
        visual_cues:
          - id: omitted-test
            phrase: "A textbook loan should last twenty-eight days"
            targets: [picture]
          - id: omitted-ask
            phrase: "What does the patched function return for a textbook"
            targets: [picture]
      - say: "Twenty-one days. Textbooks took their own branch in the old function. The patch removed it. Keep the omitted failure beside the selected result so a reviewer can see what resolved covered. In SWE-bench, record the Docker environment, selected tests and parser. Compare agents with the same prompt loop, tools and attempt budget, or report the differences. Ten attempts can each make several model and tool calls. Retain timeouts, costs and the patch that actually came back."
        hold: 0.85
        visual_cues:
          - id: omitted-fail
            phrase: "Twenty-one days"
            targets: [picture]
            caption_boundary: true
          - id: record-budget
            phrase: "Ten attempts can each make several model and tool calls"
            targets: [picture]
  - id: benchmark-audit
    title: Keep the audited subset inside its real denominator
