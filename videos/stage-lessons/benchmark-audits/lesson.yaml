            targets: [picture]
      - say: "It belongs to the wrong problem. At two attempts, X always has a pass and Y never does. Average those problem scores and you get one half. Pool all eight and you also count pairs that contain one answer to each problem. Those sixteen extra pairs all look successful. That's how the pooled estimate gets to about point seven eight six."
