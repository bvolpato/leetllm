    title: "What happens if we mix samples from different problems?"
    visual: "Count without replacement inside one problem. Compare the plug-in and subset estimates, then expose the impossible cross-problem pairs in a pooled calculation."
    beats:
      - say: "Try the same problem twice. Each attempt independently passes half the time. The four outcomes are equally likely. Only the last pair misses both times. The other three pairs contain a pass. Now let p be the pass probability on each try. One miss has probability one minus p. For all k attempts to miss, multiply that failure probability across the k draws. Subtract the result from one to get the chance of at least one pass."
        hold: 0.6
        visual_cues:
          - id: two-tries
            phrase: "Try the same problem twice"
            targets: [picture]
          - id: both-miss
            phrase: "Only the last pair misses both times"
            targets: [picture]
          - id: three-pass
            phrase: "The other three pairs contain a pass"
            targets: [picture]
          - id: true-rate
            phrase: "Now let p be the pass probability"
            targets: [picture]
          - id: all-fail
            phrase: "For all k attempts to miss"
            targets: [failure-power]
          - id: at-least-one
            phrase: "Subtract the result from one"
            targets: [at-least-one-pass]
      - say: "In a benchmark run, we estimate that chance from the programs we collected. Here twenty of a hundred programs passed. Call the pass count c and the pool size n. Substituting one fifth for p and asking about ten attempts gives about point eight nine two six. Across repeated pools this shortcut is biased low for k greater than one. The all-failure power bends upward, so variation in the observed rate raises its average failure estimate."
        hold: 0.7
        visual_cues:
          - id: observed-pool
            phrase: "twenty of a hundred programs passed"
            targets: [picture]
          - id: plug-estimate
            phrase: "gives about point eight nine two six"
            targets: [picture]
      - say: "Instead, remove each index as you draw it. To miss ten times you must draw a failure from eighty of a hundred, then from seventy-nine of ninety-nine. After nine misses, only seventy-one failures remain among ninety-one programs for the last draw. Subtract the product of all ten failure fractions from one. The result is about point nine zero four nine. In the formula, the top counts ways to draw k failures from the n minus c failing indices. The bottom counts every size k subset. Under our independent sampling model, the resulting estimate is unbiased across fresh pools. With fewer failures than draws, every subset contains a pass. Identical program text can occupy distinct indices. Correlated or adaptive attempts need their own sampling model."
        hold: 0.7
        visual_cues:
          - id: without-replacement
            phrase: "remove each index as you draw it"
            targets: [picture]
          - id: second-draw
            phrase: "then from seventy-nine of ninety-nine"
            targets: [remaining-programs]
          - id: last-draw
            phrase: "After nine misses"
            targets: [remaining-programs]
          - id: subset-estimate
            phrase: "about point nine zero four nine"
            targets: [picture]
            caption_boundary: true
      - say: "Try two problems. All four programs for X pass. All four for Y fail. A user asks for Y. Could a program written for X count as a success on that request?"
