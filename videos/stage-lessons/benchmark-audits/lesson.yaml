  - id: wilson-construction
    title: "How much does a perfect sample tell us?"
    visual: "Test candidate pass rates against three observed passes, locate the Wilson crossing, then compare three intervals on one release scale."
    beats:
      - say: "Three cases out of three passed. The usual Wald interval puts the observed rate into its variance formula. At one hundred percent that variance is zero. Both ends land on one hundred percent. Could the data really pin down the pass rate that closely?"
        hold: 1.65
        visual_cues:
          - id: wald-equals
            phrase: "Both ends land on one hundred percent"
            targets: [picture]
            caption_boundary: true
      - say: "Try a different question. Could these three passes have come from a system with a pass rate of eighty percent? Use that proposed rate to calculate the standard error. The score measures how many such standard errors separate our observed rate from the proposal. At eighty percent the distance is less than one. That's inside the limit of one point nine six."
        hold: 0.75
        visual_cues:
          - id: propose
            phrase: "a pass rate of eighty percent"
            targets: [picture]
          - id: score-eighty
            phrase: "the distance is less than one"
            targets: [picture]
          - id: score-limit
            phrase: "inside the limit of one point nine six"
            targets: [picture]
      - say: "Slide the proposed rate down. The distance grows. At about forty-three point eight percent the curve meets the limit. Lower rates fall outside. The rates we keep form the Wilson interval. Squaring the score inequality gives a quadratic. Its roots give the endpoints. For an all-pass sample the lower root simplifies to n over n plus z squared. Here n is three. When some cases fail, use the full lower root. It takes the observed fraction and sample size, with the same z we chose at the start."
        hold: 0.8
        visual_cues:
          - id: slide-rate
            phrase: "Slide the proposed rate down"
            targets: [picture]
          - id: crossing
            phrase: "forty-three point eight percent"
            targets: [picture]
            caption_boundary: true
          - id: accepted
            phrase: "The rates we keep form the Wilson interval"
            targets: [picture]
          - id: quadratic
            phrase: "Its roots give the endpoints"
            targets: [picture]
          - id: all-pass-formula
            phrase: "Here n is three"
            targets: [picture]
          - id: general-root
            phrase: "use the full lower root"
            targets: [picture]
      - say: "Suppose a release rule requires the lower end to reach ninety-five percent. The next run passed forty-nine of fifty. A larger run passed nine hundred ninety of a thousand. Which lower end will clear the line?"
        hold: 2
        visual_cues:
          - id: compare-runs
            phrase: "Suppose a release rule"
            targets: [picture]
          - id: floor-ask
            phrase: "Which lower end will clear the line"
            targets: [picture]
      - say: "Forty-nine out of fifty gives about eighty-nine point five percent at the lower end. The larger run reaches ninety-eight point two percent. Only the larger run clears this floor. These are two-sided intervals with nominal ninety-five percent coverage over repeated samples. A one-sided ninety-five percent bound uses a different z, about one point six four five. Choose the procedure in advance. Biased cases and correlated repeats still need investigation."
        hold: 0.9
        visual_cues:
          - id: bound-fifty
            phrase: "eighty-nine point five percent at the lower end"
            targets: [picture]
            caption_boundary: true
          - id: bound-thousand
            phrase: "reaches ninety-eight point two percent"
            targets: [picture]
            caption_boundary: true
          - id: interval-scope
            phrase: "A one-sided ninety-five percent bound"
            targets: [picture]
  - id: paired-diagnosis
    title: "Which disagreements count in a paired comparison?"
    visual: "Sort library case IDs by the two assistants' outcomes. Use a new sample to count the two tails for a paired test, then try a smaller sample with no regressions."
    beats:
      - say: "Put the two library answers to question ninety-three side by side. A missed it and B passed. That makes one fix. Sort all hundred questions the same way. Questions both systems pass or both fail stay in the report. They contribute nothing to the change in pass rate."
        hold: 0.65
        visual_cues:
          - id: one-fix
            phrase: "question ninety-three side by side"
            targets: [picture]
          - id: sort-pairs
            phrase: "Sort all hundred questions"
            targets: [picture]
          - id: shared-cases
            phrase: "They contribute nothing to the change"
            targets: [picture]
      - say: "Seven questions improved and seven broke. That's how these two totals tie. For an exact paired test, count just the disagreements and keep their directions. Assume independent case pairs sampled from one target population under a fixed protocol. If the marginal pass rates are equal, a disagreement favors either system with probability one half. Conditional on how many disagreed, the number of fixes then follows a fair-coin binomial distribution. This is the exact McNemar test."
        hold: 0.65
        visual_cues:
          - id: library-tie
            phrase: "Seven questions improved and seven broke"
            targets: [picture]
          - id: paired-null
            phrase: "count just the disagreements"
            targets: [picture]
          - id: coin-null
            phrase: "a disagreement favors either system with probability one half"
            targets: [picture]
      - say: "Take a different sample with nine fixes and one break. The horizontal axis counts fixes among those ten disagreements. To be at least this lopsided in either direction, the ten coin flips must give zero or one fix, or nine or ten. Each tail has one extreme sequence and ten with a single flip the other way. That makes eleven of the thousand twenty-four equally likely sequences. Both tails together give a p-value of about point zero two one five."
        hold: 0.8
        visual_cues:
          - id: new-ten
            phrase: "a different sample with nine fixes and one break"
            targets: [picture]
          - id: two-tails
            phrase: "zero or one fix, or nine or ten"
            targets: [picture]
          - id: tail-count
            phrase: "eleven of the thousand twenty-four"
            targets: [picture]
          - id: nine-one-result
            phrase: "about point zero two one five"
            targets: [picture]
            caption_boundary: true
      - say: "For three fixes and one break there are only four disagreements. Each tail now contains five of sixteen sequences, so the two-sided p-value is point six two five. A three-to-one split is common with so few cases. Try five fixes and zero breaks instead. At a five percent cutoff, is five out of five enough?"
        hold: 2.2
        visual_cues:
          - id: new-four
            phrase: "only four disagreements"
            targets: [picture]
          - id: four-tails
            phrase: "Each tail now contains five of sixteen sequences"
            targets: [paired-tails]
          - id: three-one-result
            phrase: "the two-sided p-value is point six two five"
            targets: [picture]
            caption_boundary: true
          - id: new-five
            phrase: "Try five fixes and zero breaks instead"
            targets: [picture]
          - id: five-ask
            phrase: "is five out of five enough"
            targets: [picture]
      - say: "All fixes is one sequence. All breaks is another. Two out of thirty-two gives point zero six two five. It misses the cutoff. In general, double the smaller binomial tail and cap the result at one. A small p-value measures evidence against equal pass rates under these assumptions. The importance of the change depends on what broke."
        hold: 0.7
        visual_cues:
          - id: five-tails
            phrase: "All breaks is another"
            targets: [picture]
          - id: five-result
            phrase: "gives point zero six two five"
            targets: [picture]
            caption_boundary: true
      - say: "Back at the library, the seven broken questions are eighty-two through eighty-eight. Read those answers before deciding what the renewal gains are worth. Keep critical gates separate. If cases cluster or come from fixed strata, check the sampling model. For a variable hosted model, declare how repeated answers become a pass or a fail for each case and retain the repeats."
        hold: 0.75
        visual_cues:
          - id: broken-file
            phrase: "the seven broken questions are eighty-two through eighty-eight"
            targets: [picture]
