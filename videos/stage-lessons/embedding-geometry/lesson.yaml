      - say: Put dimension zero in the least significant bit. The first coordinate moves to the right-hand end of
          the byte. The high bits are padding. In hexadecimal A is zero five and B is zero D. Exclusive OR
          keeps a one at bit three, where their signs differ. Count the set bits. The Hamming distance is
          one.
