  - id: pq-transform
    title: Preserve the scoring objective across transformations
    visual: The same points rotate before subspace boundaries are drawn, then reconstructed norms and a
      residual coarse-centroid anchor enter the score calculation.
    beats:
      - say: Quantization can change reconstructed lengths. An inner-product lookup table measures query dot
          reconstructed document, not necessarily their cosine. Reconstructed norm tables can supply
          the missing norm. Even when original vectors were normalized, unequal reconstructed norms
          can make L2 and inner-product code rankings differ. Choose and evaluate the actual serving
          objective.
        hold: 0.7
        visual_cues:
          - id: norm
            phrase: Reconstructed norm tables can supply the missing norm
            targets:
              - picture
          - id: lengths
            phrase: Quantization can change reconstructed lengths.
            targets:
              - picture
      - say: Optimized product quantization learns an orthonormal transform together with codebooks to
          reduce distortion under the selected subspace decomposition. Apply the same transform to
          queries. Before quantization, an orthonormal transform preserves exact dot products and L2
          distances. Afterward, the codebooks still introduce approximation, so reconstruction error
          and retrieval quality remain separate measurements.
        hold: 0.7
        visual_cues:
          - id: rotate
            phrase: Apply the same transform to queries
            targets:
              - picture
          - id: quantize
            phrase: the codebooks still introduce approximation
            targets:
              - picture
      - say: An IVF residual path first chooses a coarse centroid and encodes document minus that centroid.
          Scoring must account for that coarse anchor; interpreting residual codes as complete
          vectors uses the wrong origin. Version transforms, coarse centroids and subspace codebooks
          together, and test a separately built index before migrating serving traffic.
        hold: 0.7
        visual_cues:
          - id: anchor
            phrase: encodes document minus that centroid
            targets:
              - picture
          - id: restore
            phrase: Scoring must account for that coarse anchor
            targets:
              - picture
