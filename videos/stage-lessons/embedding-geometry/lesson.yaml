scenes:
  - id: opening
    title: Two guides for one query
    visual: The search arrow draws underneath two guide pages. The viewer compares the directions before the angle marks appear, then reads the horizontal reach from the same tips.
    beats:
      - say: How do I rotate an API key? I can open either guide. Which guide makes the smaller angle
          with my blue search arrow?
        hold: 2.1
        caption_starts:
          - Which guide makes the smaller angle
        visual_cues:
          - id: ask
            phrase: Which guide makes the smaller angle
            targets:
              - picture
      - say: The rotation guide does. From blue to green, the turn is about eleven degrees. From blue
          to pink, it's about twenty-seven. The longer audit arrow makes the wider angle.
        hold: 0.6
        visual_cues:
          - id: winner
            caption_boundary: true
            phrase: The rotation guide does
            targets:
              - picture
          - id: small-angle
            phrase: about eleven degrees
            targets:
              - picture
          - id: wider
            phrase: From blue to pink
            targets:
              - picture
          - id: large-angle
            phrase: about twenty-seven
            targets:
              - picture
      - say: An encoder turns each text into a list of numbers called an embedding. Here, two coordinates
          locate each arrow's tip. Now follow the tips down to the horizontal axis. Let's score the same
          guides by how far right they reach.
        hold: 0.65
        visual_cues:
          - id: coordinates
            phrase: two coordinates locate each arrow's tip
            targets:
              - picture
          - id: reach
            phrase: follow the tips down
            targets:
              - picture
  - id: coordinates
    title: Read the horizontal reach
    visual: Each guide drops a perpendicular to the query axis. Two sums use those projections to rank the
      original passages.
    beats:
      - say: Keep the arrows where they are. To take a dot product, multiply matching coordinates and add. Start
          with rotation. One times its horizontal coordinate, plus zero times its height. The dashed line
          drops straight to one on the axis.
        hold: 0.55
        visual_cues:
          - id: first
            phrase: Start with rotation
            targets:
              - picture
      - say: Now follow audit down to the axis at four. Both heights get multiplied by zero because this query
          points due right. Which guide has the larger dot product?
        hold: 1.85
        visual_cues:
          - id: second
            phrase: follow audit down to the axis
            targets:
              - picture
          - id: ask
            phrase: Which guide has the larger dot product
            targets:
              - picture
      - say: Audit wins, four to one. Its arrow extends farther along the query even though it makes the wider
          angle. If the encoder learned to use vector length as a signal, that difference can matter. Check
          the model's scoring rule and test it on judged queries.
        hold: 0.7
        visual_cues:
          - id: result
            caption_boundary: true
            phrase: Audit wins, four to one
            targets:
              - picture
  - id: rulers
    title: Two ways to compare the same arrows
    visual: Angle arcs give way to dashed segments starting at the tip of q. The operands and score stay with
      each guide.
    beats:
      - say: Trace the angle from the blue arrow to each guide. To compare directions, divide the dot product by
          the lengths of both arrows. That score is cosine. The query has length one. For rotation, one
          divided by just over one gives about point nine eight one.
        hold: 0.55
        visual_cues:
          - id: angle
            phrase: Trace the angle
            targets:
              - picture
          - id: a
            phrase: gives about point nine eight one
            targets:
              - picture
      - say: For audit, four divided by about four and a half gives point eight nine four. A score of one means
          the directions match. Zero means a right angle, and minus one means opposite directions.
        hold: 0.65
        visual_cues:
          - id: b
            phrase: gives point eight nine four
            targets:
              - picture
      - say: Now start at the tip of the query. How far would you travel in a straight line to reach each guide?
          Rotation is just above it, a gap of point two. To reach audit you go three across and two up. The
          diagonal is the square root of thirteen, about three point six one. That's Euclidean distance.
          Smaller gaps rank first.
        hold: 0.75
        visual_cues:
          - id: gap
            phrase: start at the tip of the query
            targets:
              - picture
          - id: short
            phrase: a gap of point two
            targets:
              - picture
          - id: long
            phrase: about three point six one
            targets:
              - picture
  - id: magnitude
    title: Stretch just the rotation arrow
    visual: A fixed ruler tracks A's projection against B's stationary mark at four. Cosine and endpoint
      distance refer to the same moving tip.
    beats:
      - say: Suppose we stretch just the green arrow along its own ray. The pink mark stays at four on the dot
          product ruler. Green starts at one. At what scale will green tie pink?
        hold: 2.1
        visual_cues:
          - id: ask
            phrase: At what scale will green tie pink
            targets:
              - picture
      - say: At four times its original length. The tips sit at different heights, but they project to the same
          place on the horizontal axis. Carry green out to ten times its original length. Its dot score
          passes pink and reaches ten.
        hold: 0.8
        visual_cues:
          - id: four
            caption_boundary: true
            phrase: At four times its original length
            targets:
              - picture
          - id: ten
            phrase: Carry green out to ten times its original length
            targets:
              - picture
      - say: Look back at the cosine. It's still point nine eight one because a positive stretch preserves the
          angle. Measure the gap from the query now. The endpoint is nine units to the right and two above.
          That's a distance of about nine point two two. One change in length moved two of our three
          measurements.
        hold: 0.7
        visual_cues:
          - id: gap
            phrase: Measure the gap from the query now
            targets:
              - picture
  - id: normalize
    title: Put both tips on the unit circle
    visual: The stretched rotation guide and unchanged audit guide slide in along their rays. Chords join the
      query tip to their unit endpoints.
    beats:
      - say: Start with green still stretched to ten across and two up. For each guide, divide both coordinates by
          its own length. Watch the two tips slide back along their rays. Each stops one unit from the
          origin. The query was already there. This is L two normalization.
        hold: 0.65
        visual_cues:
          - id: divide
            phrase: divide both coordinates by its own length
            targets:
              - picture
      - say: Look closer at the circle. Draw a chord from the blue tip to each guide. On this circle the dot
          product equals cosine because both lengths are one. The squared chord length is one plus one minus
          twice the dot product. A larger dot product has to give a shorter chord.
        hold: 0.55
        visual_cues:
          - id: closer
            phrase: Look closer at the circle
            targets:
              - picture
          - id: chords
            phrase: Draw a chord
            targets:
              - picture
          - id: identity
            phrase: one plus one minus twice the dot product
            targets:
              - picture
      - say: Green has the larger dot product, about point nine eight one, and the smaller squared gap, about
          point zero three nine. Pink has a dot product near point eight nine four and a squared gap near
          point two one one. These are three ways to recover the same exact order on unit vectors. An
          approximate search still has to find the candidates.
        hold: 0.7
        visual_cues:
          - id: a
            phrase: the smaller squared gap, about point zero three nine
            targets:
              - picture
          - id: b
            phrase: a squared gap near point two one one
            targets:
              - picture
  - id: norm-contract
    title: Check the direction before dividing
    visual: Two extreme, finite vectors pass through the same safe scaling step. Truly zero and invalid inputs
      stop before scoring. Doubling the query length scales both dot products.
    beats:
      - say: What should the service do with a zero vector? Look at the bottom two rows. Zero has no direction. An
          empty vector or one with a nonfinite value is invalid too. Reject those
          inputs and record the failure before scoring. The two rows above them have perfectly good
          directions.
        hold: 0.65
        visual_cues:
          - id: invalid
            phrase: Reject those inputs and record the failure before scoring
            targets:
              - picture
      - say: On the first row, squaring the coordinates can overflow. On the second, it can underflow to zero. For
          each valid row, divide by its largest absolute coordinate first. Both rows become one, one. Now
          take their length and divide. In each case the result is about point seven zero seven in both
          coordinates. A fixed epsilon in the denominator could overwhelm the tiny row.
        hold: 0.7
        visual_cues:
          - id: scale
            phrase: divide by its largest absolute coordinate first
            targets:
              - picture
          - id: result
            phrase: the result is about point seven zero seven in both coordinates
            targets:
              - picture
      - say: Here's a different question about length. Keep the guides at unit length and double the length of the
          query. Both dot products double, so their order stays the same. The same holds for any fixed,
          finite, nonzero query in exact arithmetic. Check that the computed scores are finite too. For
          actual cosine values, a shared threshold, or the unit-vector distance identity, normalize the
          query as well. Access to the passage still depends on permission.
        hold: 0.75
        visual_cues:
          - id: factor
            phrase: double the length of the query
            targets:
              - picture
          - id: contract
            phrase: normalize the query as well
            targets:
              - picture
  - id: prefix
    title: Keep the first two coordinates
    visual: Three eligible rows stay in storage order. The last two coordinates dim on each row. Each query
      keeps a separate full-width and prefix result.
    beats:
      - say: Suppose a model supports several widths. Matryoshka training applies a loss at each selected prefix
          width so that an early slice can be useful on its own. PCA instead projects vectors after
          training. Check which widths your model supports. Fewer coordinates mean fewer bytes and less
          arithmetic per comparison.
        hold: 0.6
      - say: Try three eligible guides with four hand-built coordinates each. The rotation query is a copy of the
          rotation row. The lifecycle query is a copy of lifecycle. Their last coordinates help distinguish
          them from audit. At full width each query selects its own guide with cosine one.
        hold: 0.65
        visual_cues:
          - id: full
            phrase: each query selects its own guide with cosine one
            targets:
              - picture
      - say: Keep just the first two coordinates of every query and guide. Normalize the surviving coordinates
          again for cosine scoring. Ties go to the first row in storage. Which guide wins the rotation query
          now?
        hold: 2
        visual_cues:
          - id: cut
            phrase: Keep just the first two coordinates
            targets:
              - picture
          - id: ask
            phrase: Which guide wins the rotation query now
            targets:
              - picture
      - say: Audit takes it. Both rows start with one, zero, and audit came first. Lifecycle still retrieves
          lifecycle. Across the two queries, top-one evidence recall falls from two out of two to one out of
          two. Normalizing a slice fixes its length. The discarded distinction is gone. Test relevance
          against labeled guides, and test approximate search separately against exact neighbors.
        hold: 0.8
        visual_cues:
          - id: tie
            caption_boundary: true
            phrase: Audit takes it
            targets:
              - picture
          - id: life
            phrase: Lifecycle still retrieves lifecycle
            targets:
              - picture
          - id: hits
            phrase: from two out of two to one out of two
            targets:
              - picture
  - id: payload
    title: How many bytes does one row take?
    visual: One linear byte ruler holds the row width fixed across four formats. A separate shelf counts
      retained originals. A second store changes the row count and width together.
    beats:
      - say: Keep one million rows and a width of fifteen hundred thirty-six. Each coordinate takes four bytes as
          a full-precision float. That makes six thousand one hundred forty-four bytes per row. Multiply by
          a million and you get about five point seven two gibibytes of coordinates. One byte per coordinate
          brings the row down to fifteen hundred thirty-six bytes, a quarter of the original payload.
        hold: 0.55
        visual_cues:
          - id: fp32
            phrase: six thousand one hundred forty-four bytes per row
            targets:
              - picture
          - id: int8
            phrase: down to fifteen hundred thirty-six bytes
            targets:
              - picture
      - say: One bit for each coordinate packs the same row into one hundred ninety-two bytes. Suppose instead you
          store one byte for each group of sixteen coordinates. That's ninety-six groups, or ninety-six
          bytes per row. This is the product code we'll build later. A million such codes take about
          ninety-two mebibytes, one sixty-fourth of the float payload.
        hold: 0.6
        visual_cues:
          - id: sign
            phrase: into one hundred ninety-two bytes
            targets:
              - picture
          - id: codes
            phrase: ninety-six bytes per row
            targets:
              - picture
      - say: Every group needs a shared book of two hundred fifty-six centers. Each center holds sixteen floats.
          Across ninety-six books, that's one and a half mebibytes. Now keep the original vectors for
          rescoring. You still owe the full five point seven two gibibytes somewhere. Links, labels,
          replicas and metadata go on top of that.
        hold: 0.65
        visual_cues:
          - id: book
            phrase: one and a half mebibytes
            targets:
              - picture
          - id: originals
            phrase: keep the original vectors for rescoring
            targets:
              - picture
      - say: Change the size of the store. Give it fifty million rows but halve the width to seven hundred
          sixty-eight. The choices are side by side. Full precision costs a hundred fifty-three point six
          decimal gigabytes. One byte per coordinate takes thirty-eight point four. A ninety-six-byte row
          takes four point eight. These sizes count the rows alone. To find out what still
          retrieves the right passage, we need a query.
        hold: 0.65
        visual_cues:
          - id: scale
            phrase: Give it fifty million rows but halve the width to seven hundred sixty-eight
            targets:
              - picture
  - id: quantization
    title: Two passage tips on a 0.2 grid
    visual: A magnified grid locates C and D inside one rounding cell. The originals stay marked as their
      stored copies converge.
    beats:
      - say: Keep the query pointing right. Here are two other eligible passages, C and D. We've magnified the
          tips so you can see the difference. C makes the smaller angle, and its original cosine is higher.
          What happens if storage keeps only multiples of point two?
        hold: 0.7
      - say: The yellow square runs halfway to the neighboring grid lines in both directions. Round each
          coordinate to the nearest grid value. Where will C and D land?
        hold: 2.2
        visual_cues:
          - id: cell
            phrase: The yellow square
            targets:
              - picture
          - id: ask
            phrase: Where will C and D land
            targets:
              - picture
      - say: Move each tip to its nearest grid point. Both land at one, point two. They now tie on cosine. The
          little marks they left behind are their originals. Quantization has erased a distinction we could
          measure there.
        hold: 0.8
        visual_cues:
          - id: round
            phrase: Move each tip to its nearest grid point
            targets:
              - picture
          - id: tie
            caption_boundary: true
            phrase: They now tie on cosine
            targets:
              - picture
      - say: We can store those originals separately and use the cheap codes to choose a shortlist. The question
          for a search system is whether that shortlist still contains the passage we need. We'll come back
          to these two points with a different query.
        hold: 0.65
  - id: scalar-codec
    title: A byte code needs a reconstruction rule
    visual: A coordinate becomes a signed byte and decodes back to 0.42. Two aligned rulers show how the same byte positions map to an interval that starts at two.
    beats:
      - say: Let's pack one coordinate into a signed byte. The coordinate is point four two four.
          The largest absolute value in this dimension's calibration sample is one point two seven.
          Divide that bound by one hundred twenty-seven. Each step is one hundredth. Dividing the
          coordinate by that step gives forty-two point four. Round to forty-two and clip to the
          range from minus one hundred twenty-seven to plus one hundred twenty-seven. Forty-two fits.
          Store that byte. Multiply by the step to recover point four two.
        hold: 0.7
        visual_cues:
          - id: step
            phrase: Each step is one hundredth
            targets:
              - picture
          - id: divide
            phrase: Dividing the coordinate by that step gives forty-two point four
            targets:
              - picture
          - id: round
            phrase: Round to forty-two
            targets:
              - picture
          - id: clip
            phrase: Forty-two fits
            targets:
              - picture
          - id: byte
            phrase: Store that byte
            targets:
              - picture
          - id: decode
            phrase: Multiply by the step to recover point four two
            targets:
              - picture
      - say: This gives two hundred fifty-five levels and leaves minus one hundred twenty-eight unused.
          Fit one scale per dimension and freeze it for later rows. For an all-zero calibration
          dimension, a scale of one maps zero to zero. Pack the codes in a signed-byte array to get
          one byte per coordinate. Use the same scales when you score the stored rows.
        hold: 0.7
        visual_cues:
          - id: freeze
            phrase: Fit one scale per dimension and freeze it
            targets:
              - picture
      - say: Now spread an unsigned byte over the interval from two to three. Each step is one over
          two hundred fifty-five. Code zero reconstructs two and code two hundred fifty-five
          reconstructs three. Two is the real offset you add when you decode. Where would real zero
          fall on that ruler?
        hold: 1.7
        caption_starts:
          - Where would real zero fall
        visual_cues:
          - id: range
            phrase: Code zero reconstructs two and code two hundred fifty-five reconstructs three
            targets:
              - picture
          - id: offset
            phrase: Two is the real offset you add
            targets:
              - picture
          - id: range-codec
            phrase: Now spread an unsigned byte over the interval from two to three
            targets:
              - picture
          - id: zero
            phrase: Code zero reconstructs two
            targets:
              - picture
          - id: locate-zero
            phrase: Where would real zero fall on that ruler
            targets:
              - picture
      - say: Five hundred ten steps to the left of code zero, outside the byte. An interval from zero
          to three can represent zero exactly with the same number of steps. Each step is now three
          times as wide.
        hold: 0.7
        visual_cues:
          - id: invalid
            phrase: outside the byte
            targets:
              - picture
          - id: widen-range
            phrase: Each step is now three times as wide
            targets:
              - picture
      - say: For a dot product, multiply the query coordinate by the whole decoded value, offset
          plus scale times code. Then add up the terms. For a fixed query, an offset shared across
          rows adds the same amount to every score. You can leave it out when ranking those rows.
          Include it when reporting scores, applying a threshold, or comparing rows with different offsets.
        hold: 0.7
        visual_cues:
          - id: dot
            phrase: offset plus scale times code
            targets:
              - picture
  - id: scalar-scales
    title: What does one code step buy?
    visual: Two 127-step rulers span different coordinate ranges. Restoring each step size reverses the
      code-only ranking.
    beats:
      - say: Here's a shortcut that sends the wrong passage to the top. The query gives equal weight to both
          coordinates. A contributes eight in the first coordinate. B contributes one in the second. The
          first ruler covers zero to ten in a hundred and twenty-seven steps. The second covers just zero to
          one in the same number of steps.
        hold: 0.65
      - say: Eight lands on code one hundred two. One on the shorter ruler uses every step, code one hundred
          twenty-seven. Add up just the code values and B wins on counts. Which row has the larger dot
          product once you restore the units?
        hold: 2
        visual_cues:
          - id: codes
            phrase: code one hundred twenty-seven
            targets:
              - picture
          - id: wrong
            phrase: B wins on counts
            targets:
              - picture
          - id: ask
            phrase: Which row has the larger dot product once you restore the units
            targets:
              - picture
      - say: A does. Each of its steps is ten over one hundred twenty-seven, ten times as big as a step on the
          second ruler. Multiply each code by its own scale. A scores about eight point zero three one. B
          scores one. The slight rounding error leaves the original order intact.
        hold: 0.75
        visual_cues:
          - id: restore
            phrase: B scores one
            targets:
              - picture
      - say: That's the repair for inner product. If your index promises cosine, check the lengths of the
          reconstructed vectors too. Even if the originals were unit length, rounding can move their tips
          off the unit circle. Compare against exact cosine before accepting that approximation.
        hold: 0.7
  - id: calibration
    title: An outlier spends the available buckets
    visual: Two staircases share equal-unit axes over the same 101 ordinary values; a separate outlier
      point retains its clipping error.
    beats:
      - say: Take one hundred one equally spaced ordinary values from minus one to one, then include one
          calibration value at twenty-five. A maximum-derived bound of twenty-five gives a step of
          twenty-five over one hundred twenty-seven. Many ordinary values collapse into the same
          bucket. A supplied clipped bound of one gives finer ordinary resolution but saturates the
          outlier.
        hold: 0.7
        visual_cues:
          - id: wide
            phrase: Many ordinary values collapse into the same bucket
            targets:
              - picture
          - id: fine
            phrase: finer ordinary resolution
            targets:
              - picture
      - say: Calculated on these ordinary values, mean absolute reconstruction error is about zero point
          zero four eight three with the wide bound and zero point zero zero one nine with bound
          one. Clipping twenty-five to one also incurs an error of twenty-four. For a separate
          direction test, normalize the rows one, zero point zero five and one, zero point zero four
          against query one, zero. The second direction is closer. The coarse codec makes both
          candidates identical and changes the tie-broken winner; finer calibration preserves the
          better direction. Select calibration on development data and measure held-out shortlist
          recall, including clipped cases.
        hold: 0.7
        visual_cues:
          - id: errors
            phrase: zero point zero zero one nine with bound one
            targets:
              - picture
          - id: clip
            phrase: an error of twenty-four
            targets:
              - picture
          - id: original
            phrase: The second direction is closer.
            targets:
              - picture
          - id: coarse
            phrase: changes the tie-broken winner
            targets:
              - picture
          - id: precise
            phrase: finer calibration preserves the better direction.
            targets:
              - picture
          - id: outlier
            phrase: Clipping twenty-five to one
            targets:
              - picture
          - id: directions
            phrase: For a separate direction test
            targets:
              - picture
  - id: wide-arithmetic
    title: Run the dot product in two widths
    visual: The two exact integer scores split into high and low bytes. Narrow output discards each high byte.
      Widening the inputs preserves both bytes.
    beats:
      - say: Suppose both the query and the stored rows are integer codes. The query and A each contain two copies
          of one hundred twenty-seven. B is smaller by one in both coordinates. Both products should be
          larger for A. The exact sums are thirty-two thousand two hundred fifty-eight for A and thirty-two
          thousand four for B.
        hold: 0.8
        visual_cues:
          - id: correct
            phrase: thirty-two thousand two hundred fifty-eight for A and thirty-two thousand four for B
            targets:
              - picture
      - say: Write the result into a signed eight-bit integer. The high bytes disappear. The low bytes read two
          for A and four for B. The smaller original score now wins. What happens if you cast those results
          to a wider type?
        hold: 1.8
        visual_cues:
          - id: wrap
            phrase: The low bytes read two for A and four for B
            targets:
              - picture
      - say: You still have two and four. Those high bytes are gone. Widen the operands before multiplication and
          give the sum a wide enough accumulator. Now the full scores survive. With this symmetric codec, an
          absolute bound is the dimension count times one hundred twenty-seven squared. For fifteen hundred
          thirty-six coordinates that's about twenty-four point eight million, safely inside signed
          thirty-two-bit range. Other code ranges and offsets need their own bound.
        hold: 0.7
        visual_cues:
          - id: late
            phrase: You still have two and four
            targets:
              - picture
          - id: widen
            phrase: Widen the operands before multiplication
            targets:
              - picture
          - id: bound
            phrase: safely inside signed thirty-two-bit range
            targets:
              - picture
  - id: pq-codebooks
    title: Store one ID for each pair
    visual: Four pairs share a row. Open the book for one pair at a time and send the nearest center's ID to the matching storage slot.
    beats:
      - say: Split these eight coordinates into four pairs. Open the first book. It holds two representative
          points called centers. We'll store the ID of the nearest one.
        hold: 0.65
        visual_cues:
          - id: split
            phrase: Split these eight coordinates into four pairs
            targets:
              - picture
          - id: nearest
            phrase: Open the first book
            targets:
              - picture
      - say: The first pair is one point two, three point four. Compare it with the two centers on the page.
          Which center is nearest?
        hold: 1.7
        caption_starts:
          - Which center is nearest
      - say: Center one matches exactly. Store its ID in the first slot. Repeat with the other three books.
          All four slots hold a one, yet each one retrieves a different pair. Its position tells you
          which book to open. That's product quantization. To train each book, k-means clusters samples
          from its pair of coordinates to minimize squared reconstruction error. To test search quality,
          rank passages for labeled queries.
        hold: 0.6
        visual_cues:
          - id: ids
            caption_boundary: true
            phrase: Center one matches exactly
            targets:
              - picture
          - id: repeat
            phrase: Repeat with the other three books
            targets:
              - picture
      - say: These four slots use one byte each. Two choices would fit in one bit with bit packing. A book
