scenes:
  - id: intro
    title: "Which token comes after the comma?"
    visual: "A copy of the printed comma flies into the model input. The two lines on the page are the clue. The line break travels into the target slot, then joins the input when sampled."
    beats:
      - say: "The comma lands at the end of the model's input. Look at the printed passage. Which token comes between the comma and the S in Speak?"
        caption_starts:
          - "Which token comes between"
        hold: 2.1
        visual_cues:
          - id: read-prefix
            phrase: "The comma lands at the end of the model's input"
            targets: [prefix]
      - say: "It's the line break. During training, the printed passage supplies the target. The first piece of Speak comes one token later. When we generate text, the model samples a token. If it picks the line break, append it to the input. Watch where the next prediction goes."
        caption_starts:
          - "When we generate text"
          - "If it picks the line break"
        hold: 0.9
        visual_cues:
          - id: show-break
            phrase: "It's the line break"
            targets: [next-piece]
          - id: append-piece
            phrase: "append it to the input"
            targets: [next-piece]
  - id: targets
    title: "What would this loader reward?"
    visual: "Two copies of the source begin aligned. The lower strip slides left by one place, putting the line break beneath the comma and the final piece beneath Spe."
    beats:
      - say: "Here's the same passage cut into six pieces. We're using five as inputs. Follow the arrow under the comma. This loader has copied its inputs into its labels. What would a model have to predict to get full credit here?"
        caption_starts:
          - "What would a model have to predict"
        hold: 2
        visual_cues:
          - id: copy-pair
            phrase: "Follow the arrow under the comma"
            targets: [labels]
      - say: "Another comma. The model could earn credit just by copying what it can already see. Slide the labels one place to the left. Now the comma predicts the line break, and the last input, the first piece of Speak, predicts the rest of the word. All five positions can be scored in one forward pass. Check the entire label row against the source starting at its second piece, including that last label."
        hold: 0.9
        visual_cues:
          - id: slide-labels
            phrase: "Slide the labels one place to the left"
            targets: [labels]
  - id: byte-boundaries
    title: "The two pieces of Speak"
    visual: "The six GPT-2 IDs sit directly above their literal pieces. A second pair of tiles preserves incomplete UTF-8 bytes across a token boundary."
    beats:
      - say: "These are GPT-two token IDs. Read down each column to find its piece. The dot before sir stands for a space. Follow Speak across the last two columns. Dropping the final piece would lose the end of the word and the last training label. At the comma, the target is still the line break, ID one ninety-eight."
        hold: 0.8
        visual_cues:
          - id: byte-boundaries-1
            phrase: "These are GPT-two token IDs"
            targets: [byte-boundaries-mechanism]
          - id: six-byte-pieces
            phrase: "Read down each column"
            targets: [byte-boundaries-mechanism]
          - id: newline-target
            phrase: "ID one ninety-eight"
            targets: [byte-boundaries-mechanism]
      - say: "A token boundary can even fall inside one character. These four bytes make a smiling face in the full tokenizer. Decode the two pieces separately and three replacement characters appear. Keep the first two bytes in a buffer. Join the next two bytes before decoding and the smile survives. A generated sequence can still contain invalid bytes. Choose explicitly whether to replace them or reject them."
        hold: 0.9
        visual_cues:
          - id: byte-boundaries-2
            phrase: "These four bytes make a smiling face"
            targets: [byte-boundaries-mechanism]
          - id: separate-bytes
            phrase: "Decode the two pieces separately"
            targets: [byte-boundaries-mechanism]
          - id: joined-bytes
            phrase: "Join the next two bytes before decoding"
            targets: [byte-boundaries-mechanism]
  - id: vocab
    title: "Which row holds the comma?"
    visual: "The comma travels from GPT-2 ID 11 to Shakespeare row 2 and back. Its piece stays in place while the active fraction of the full table remains visible."
    beats:
      - say: "The comma has ID eleven in GPT-two. In the Shakespeare file, only some of those IDs occur. Sort the ones that occur and number their rows from zero. Look up eleven in that list. The comma lands in row two. That's the row the lab uses for both its input embedding and its output score."
        hold: 0.7
        visual_cues:
          - id: lookup-row
            phrase: "Look up eleven in that list"
            targets: [comma-row]
      - say: "Run the lookup backwards. If the model samples local row two, the saved list gives us eleven again, and the decoder prints a comma. The blue part of the strip shows the seventeen thousand four hundred eighty-five active rows. An unfamiliar prompt piece can have a valid GPT-two ID and still fall outside this checkpoint. Reject it before the embedding lookup."
        hold: 0.8
        visual_cues:
          - id: inverse-row
            phrase: "Run the lookup backwards"
            targets: [comma-row]
          - id: active-rows
            phrase: "blue part of the strip"
            targets: [vocabulary-size]
  - id: compact-denominator
    title: "Where does the missing probability go?"
    visual: "A tied table loses its inactive rows. A three-row version then removes one competing score while both retained logits stay fixed."
    beats:
      - say: "Each row carries ninety-six weights. Input lookup and output scoring share them, so count the table once. Shrink it to the active rows. The counts on the right are for this one matrix. About sixty-five percent of its rows disappear. Count the whole model instead and the reduction is about sixty-two percent, because the other layers stayed the same size."
        hold: 0.7
        visual_cues:
          - id: compact-denominator-1
            phrase: "Each row carries ninety-six weights"
            targets: [compact-denominator-mechanism]
          - id: compact-weights
            phrase: "Shrink it to the active rows"
            targets: [compact-denominator-mechanism]
          - id: removed-matrix
            phrase: "About sixty-five percent of its rows disappear"
            targets: [compact-denominator-mechanism]
          - id: whole-model
            phrase: "Count the whole model instead"
            targets: [compact-denominator-mechanism]
      - say: "Look at these three rows. We read row zero and want to predict row one. Row two never appears as an input or a target here. Yet its score ties for first. It takes forty-two percent of the probability. Its share times the hidden vector gives its output gradient. Training has a reason to change a piece it never saw."
        hold: 0.7
        visual_cues:
          - id: compact-denominator-2
            phrase: "Look at these three rows"
            targets: [compact-denominator-mechanism]
          - id: unused-gradient
            phrase: "its output gradient"
            targets: [compact-denominator-mechanism]
      - say: "Take row two out. Watch the target row while the two remaining scores stay fixed. Its share rises from about sixteen percent to twenty-seven percent. The loss falls without a training step. Renumbering pieces preserves their identity. Removing competitors changes the prediction problem. The lab chose its rows using the whole file, including three hundred thirty-five IDs seen only in validation. Those IDs entered the vocabulary during preprocessing. Only training windows update the weights. For an independent evaluation, choose the vocabulary in advance and decide how to handle an unfamiliar piece."
        hold: 0.85
        visual_cues:
          - id: compact-denominator-3
            phrase: "Take row two out"
            targets: [compact-denominator-mechanism]
          - id: drop-competitor
            phrase: "Watch the target row while the two remaining scores stay fixed"
            targets: [compact-denominator-mechanism]
          - id: validation-support
            phrase: "three hundred thirty-five IDs seen only in validation"
            targets: [compact-denominator-mechanism]
  - id: corpus-exposure
    title: "How many predictions did training score?"
    visual: "The file becomes one ordered token strip and a contiguous split. Count scored positions as batches accumulate and compare two loss references."
    beats:
      - say: "The lab starts the model with random weights. Its training text is the bundled Shakespeare file. Tokenize that file once and you have a little over a million and a quarter pieces. Split the stream in file order. The blue prefix supplies training windows. The gold suffix supplies validation windows. File order preserves neighbors within each part. Repeated phrases can still occur on both sides."
        hold: 0.8
        visual_cues:
          - id: corpus-exposure-1
            phrase: "bundled Shakespeare file"
            targets: [corpus-exposure-mechanism]
          - id: corpus-tokenize
            phrase: "Tokenize that file once"
            targets: [corpus-exposure-mechanism]
          - id: corpus-split
            phrase: "Split the stream in file order"
            targets: [corpus-exposure-mechanism]
      - say: "One batch has twelve windows, each with forty-eight targets. That's five hundred seventy-six predictions per update. Count them over three hundred twenty-one updates. Their total is sixteen point four percent of the training stream's length. A window can land on the same passage twice, so the number of distinct positions can be smaller. Each validation estimate scores eight batches in the same way."
        hold: 0.7
        visual_cues:
          - id: corpus-exposure-2
            phrase: "One batch has twelve windows"
            targets: [corpus-exposure-mechanism]
          - id: score-exposure
            phrase: "Count them over three hundred twenty-one updates"
            targets: [corpus-exposure-mechanism]
          - id: sampled-fraction
            phrase: "sixteen point four percent of the training stream's length"
            targets: [corpus-exposure-mechanism]
          - id: validation-exposure
            phrase: "eight batches in the same way"
            targets: [corpus-exposure-mechanism]
      - say: "Give every active token an equal share. The negative natural log of that share is about nine point seven seven nats per token. That's a reference we can calculate before training. Now try a four-token vocabulary where every target happens to be zero. A predictor that ignores its input and puts ninety percent on zero averages about a tenth of a nat. That predictor could get the same score with every input covered. To test for leakage, change a future input and compare the earlier predictions."
        hold: 0.8
        visual_cues:
          - id: corpus-exposure-3
            phrase: "Give every active token an equal share"
            targets: [corpus-exposure-mechanism]
          - id: uniform-reference
            phrase: "nine point seven seven nats per token"
            targets: [corpus-exposure-mechanism]
          - id: constant-reference
            phrase: "a four-token vocabulary where every target happens to be zero"
            targets: [corpus-exposure-mechanism]
  - id: stream-boundaries
    title: "Did these tokens meet in the source?"
    visual: "Two nonadjacent chunks put 3 beside 8. A contiguous split keeps the original neighbors. A window advances to the last legal start, then loses its final successor."
    beats:
      - say: "Follow the original positions across the top. Suppose we stitch these two blue chunks together. After three, the loader would reward eight. Look back at the original neighbor. It was four. Splitting the file into a prefix and a suffix preserves the neighbors inside each. Leave out the transition across the cut. If your task trains on independent documents, also block attention across documents and handle the target at each boundary. Restarting position numbers alone leaves earlier keys readable."
        hold: 0.75
        visual_cues:
          - id: stream-boundaries-1
            phrase: "Follow the original positions"
            targets: [stream-boundaries-mechanism]
          - id: false-join
            phrase: "the loader would reward eight"
            targets: [stream-boundaries-mechanism]
          - id: contiguous-split
            phrase: "Splitting the file into a prefix and a suffix"
            targets: [stream-boundaries-mechanism]
      - say: "A four-input window needs a fifth token for its last label. Slide it to the last legal start. Here the source has twenty tokens, so start fifteen works. Start sixteen would run out of labels. In general the random sampler's exclusive upper bound is source length minus context length. Draw within the training or validation portion separately."
        hold: 0.75
        visual_cues:
          - id: stream-boundaries-2
            phrase: "A four-input window needs a fifth token"
            targets: [stream-boundaries-mechanism]
          - id: sampler-window
            phrase: "Slide it to the last legal start"
            targets: [stream-boundaries-mechanism]
      - say: "Give the lab sampler exactly forty-nine tokens. With context forty-eight it can start only at zero. The last input is forty-seven. Its target is forty-eight. Remove that last token and the sampler must reject the stream. Checking only where the two rows overlap would miss this last label."
        hold: 0.85
        visual_cues:
          - id: stream-boundaries-3
            phrase: "exactly forty-nine tokens"
            targets: [stream-boundaries-mechanism]
          - id: last-successor
            phrase: "Its target is forty-eight"
            targets: [stream-boundaries-mechanism]
          - id: short-stream
            phrase: "Remove that last token"
            targets: [stream-boundaries-mechanism]
  - id: mask
    title: "Can the next input change the comma’s score?"
    visual: "A copy of the same four-token input changes only at position 3. A bracket first excludes, then admits that key. The paired line-break scores come from the same two-coordinate head."
    beats:
      - say: "Back at the comma, the correct label is a line break. But that very piece is sitting to its right in the training input. Which keys may the comma read? Keep the bracket through the comma itself. That's the causal mask. In this little head, readable keys share the weight equally. The line-break score is their average first coordinate. What should happen to that score if we change only the fourth input?"
        caption_starts:
          - "Which keys may the comma read"
          - "Keep the bracket through the comma itself"
        hold: 2
        visual_cues:
          - id: mask-keys
            phrase: "Keep the bracket through the comma itself"
            targets: [read-keys]
      - say: "Replace the line break with sir in the test copy. Leave the reference label alone. The three numbers inside the bracket are still zero, one and two. Their mean stays one in both runs. Every earlier logit also matches. Now suppose we admit the fourth key. Will the comma's score still match across the two inputs?"
        caption_starts:
          - "Their mean stays one in both runs"
          - "Now suppose we admit the fourth key"
        hold: 2.1
        visual_cues:
          - id: swap-future
            phrase: "Replace the line break with sir in the test copy"
            targets: [last-input]
          - id: causal-reading
            phrase: "Their mean stays one in both runs"
            targets: [readout]
      - say: "Open the bracket by one key. The original run now includes a five, and the changed run includes a three. The means split, two versus one and a half. Changing the future has changed a prediction in the past. Restore the causal mask and repeat the probe. Then check the labels separately. Copying the current token into its own label would pass the visibility check."
        caption_starts:
          - "The means split"
        hold: 0.85
        visual_cues:
          - id: open-key
            phrase: "Open the bracket by one key"
            targets: [read-keys]
          - id: open-reading
            phrase: "The means split, two versus one and a half"
            targets: [readout]
          - id: restore-mask
            phrase: "Restore the causal mask and repeat the probe"
            targets: [read-keys, readout]
  - id: forward
    title: "Follow the comma through one head"
    visual: "In a four-piece miniature, the comma's embedding and position add to its value. Three readable values average to one hidden vector. That vector scores each of the four tied rows."
    beats:
      - say: "Put the mask back. Where did that score of one come from? Each input has a piece embedding and a position embedding. At the comma, adding them gives two, three. In this miniature the value projection just passes that vector through. Collect the three readable values. Average the first coordinates, then the second coordinates. The comma now carries one, two. The line break was outside the bracket the whole time."
        hold: 0.75
        visual_cues:
          - id: collect-values
            phrase: "Collect the three readable values"
            targets: [values]
          - id: mean-vector
            phrase: "The comma now carries one, two"
            targets: [hidden]
      - say: "Now read the same embedding table in the other direction. Score each piece by taking its dot product with that hidden vector. The line-break row picks out the first coordinate, one. The comma row picks out the second, two. This head favors another comma. The source still says line break. How much probability did the head give the answer it will be scored on?"
        hold: 1.65
        visual_cues:
          - id: score-rows
            phrase: "Score each piece by taking its dot product with that hidden vector"
            targets: [scores]
  - id: loss
    title: "What earns credit at the comma?"
    visual: "Four scores become a shared strip of probability. Only the line break's segment pays this position's penalty. One illustrated free-logit update changes both the partition and the loss."
    beats:
      - say: "Keep those four scores. To turn them into probability, exponentiate each score and add the four weights. That's the softmax denominator. The line break gets its own weight divided by that sum, about twenty-four percent. Take the negative natural log of that share. This one position contributes about one point four four nats. The training loss averages a penalty like this for each scored position."
        caption_starts:
          - "about twenty-four percent"
          - "This one position contributes"
        hold: 0.7
        visual_cues:
          - id: exp-sum
            phrase: "exponentiate each score and add the four weights"
            targets: [weights]
          - id: target-share
            phrase: "about twenty-four percent"
            targets: [share]
          - id: score-target
            phrase: "about one point four four nats"
            targets: [penalty]
      - say: "Treat these four scores as adjustable numbers for one step. A competitor's gradient is its probability. The target's gradient is its probability minus one. Subtract half of each gradient. Watch the gold share widen as all four weights are recomputed. The penalty falls. In the full network we backpropagate that signal through the tied weights and the decoder, then let AdamW update the parameters."
        hold: 0.9
        visual_cues:
          - id: step-logits
            phrase: "Subtract half of each gradient"
            targets: [scores]
  - id: preln-block
    title: "Scale the same prediction to a full batch"
    visual: "A batch becomes four head slices, a causal score plane, two residual branches and one vocabulary distribution per position."
    beats:
      - say: "Scale back up to the CPU lab. Each of the twelve windows has forty-eight positions and each position now has ninety-six features. One projection makes queries, keys and values. Split each into four heads of width twenty-four. Within one head, each of forty-eight queries compares with forty-eight keys. That's why the score grid is square. Divide dot products by the square root of the head width, mask future scores with minus infinity, then normalize and mix the values. Each row needs at least one allowed finite score."
        hold: 0.7
        visual_cues:
          - id: preln-block-1
            phrase: "twelve windows"
            targets: [preln-block-mechanism]
          - id: split-heads
            phrase: "Split each into four heads of width twenty-four"
            targets: [preln-block-mechanism]
          - id: score-shape
            phrase: "each of forty-eight queries compares with forty-eight keys"
            targets: [preln-block-mechanism]
      - say: "Keep one copy of the input on the blue path. The other goes through layer normalization and attention. Join the heads, project their output back to the input width, and add it to the saved input. Call the sum u. Follow one token through the next branch. Normalize its ninety-six features, then expand to three hundred eighty-four. Apply GELU to each value. It multiplies the value by the probability that a standard normal draw falls below it. Project back to ninety-six features. Now we can add the saved u. Both shortcuts give gradients a direct path. The second branch works on each token separately."
        caption_starts:
          - "Call the sum u"
          - "Apply GELU to each value"
          - "Project back to ninety-six features"
        hold: 0.8
        visual_cues:
          - id: preln-block-2
            phrase: "Keep one copy of the input on the blue path"
            targets: [preln-block-mechanism]
          - id: residual-block
            phrase: "add it to the saved input"
            targets: [preln-block-mechanism]
          - id: expand-width
            phrase: "then expand to three hundred eighty-four"
            targets: [preln-block-mechanism]
          - id: apply-gelu
            phrase: "Apply GELU to each value"
            targets: [preln-block-mechanism]
          - id: gelu-width
            phrase: "Project back to ninety-six features"
            targets: [preln-block-mechanism]
          - id: add-mlp
            phrase: "Now we can add the saved u"
            targets: [preln-block-mechanism]
      - say: "Run two of those blocks and a final normalization. The output head reuses the token embeddings. Each of five hundred seventy-six positions now has a score for every active piece. Flatten the first two axes and line each row up with its one integer target for cross-entropy. Even before backward storage, those float32 scores take about forty megabytes. This lab uses exact GELU, omits dropout and skips GPT-two's depth-scaled residual initialization. The original implementation used a tanh approximation for GELU."
        hold: 0.85
        visual_cues:
          - id: preln-block-3
            phrase: "a final normalization"
            targets: [preln-block-mechanism]
          - id: tied-output
            phrase: "The output head reuses the token embeddings"
            targets: [preln-block-mechanism]
          - id: logit-storage
            phrase: "about forty megabytes"
            targets: [preln-block-mechanism]
  - id: checkpoints
    title: "What improved after 240 more updates?"
    visual: "The six actual CPU validation measurements appear in order. Both measured losses and fixed-prompt excerpts keep their own checkpoint labels when the later text is uncovered."
    beats:
      - say: "Return to the real training run. At update eighty-one, look below the curve. The early model was given our fixed prompt and produced the fragment, And the I the. The loss beside update eighty-one comes from eight sampled validation batches. It measures predictions about held-out text. The generated quote comes from a separate run of the sampler."
