  - id: resume
    title: "Which training window comes after a restart?"
    visual: "A sampler cursor passes supplied window starts 4 and 1. Restarting at the seed returns to 4. Restoring the progressed state advances to 9."
    beats:
      - say: "Generation can replay a seed. Training needs to pick up where it left off. Here are four example starting positions for training windows. The sampler has already used four and one when we save. If we reload only the initial seed, which window will the next update get?"
        hold: 1.95
        visual_cues:
          - id: consume-draws
            phrase: "already used four and one"
            targets: [cursor]
      - say: "Four again. Restore the progressed sampler state instead. The next draw is nine, just as it would have been without a restart. Keeping validation sampling on its own stream lets us inspect the model without changing the next training batch. Now give both training paths that same batch and compare the update."
