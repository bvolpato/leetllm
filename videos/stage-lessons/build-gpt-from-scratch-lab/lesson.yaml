          - id: relative-rotation
            phrase: "They rotate query and key pairs"
            targets: [architecture-choices-mechanism]
      - say: "SwiGLU multiplies a linear branch by a SiLU gate, then projects back. Now follow the four query heads. Group them in pairs that share keys and values. Moving from four stored key-value heads to two halves the stored elements at fixed length and head width. At the same data type that's half the ideal cache bytes. Serving speed needs a timed run, and changing an architecture also calls for a quality and checkpoint-compatibility check."
