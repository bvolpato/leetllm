  - id: architecture-choices
    title: "What can change inside the decoder?"
    visual: "Changing how features are normalized or how heads share keys changes the computation. The permitted prefix and scored successor stay fixed."
    beats:
      - say: "Our lab borrows learned absolute positions, pre-normalization, multi-head attention, GELU and tied embeddings from GPT-two. Keep the causal next-token task and change some parts. Llama two is one historical example. It used rotary positions, RMS normalization and a gated feed-forward layer. Its seven- and thirteen-billion models used ordinary multi-head attention. Its seventy-billion model shared keys and values across groups of query heads."
