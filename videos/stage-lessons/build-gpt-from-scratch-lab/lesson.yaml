            phrase: "Our lab borrows learned absolute positions"
            targets: [architecture-choices-mechanism]
          - id: historical-stack
            phrase: "Its seventy-billion model shared keys and values"
            targets: [architecture-choices-mechanism]
      - say: "Give both normalizers the vector one, three. Use unit gain, zero offset and zero epsilon so you can see the arithmetic. Layer normalization subtracts the mean, two, then divides by a standard deviation of one. The first coordinate turns negative. RMS normalization divides both coordinates by the square root of five. Both stay positive. It measures mean square without subtracting the mean. Rotary positions make a different change. They rotate query and key pairs so their dot products reflect relative position. Test the context lengths you plan to use."
