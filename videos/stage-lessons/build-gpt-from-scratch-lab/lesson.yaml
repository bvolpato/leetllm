            phrase: "another two hundred forty updates"
            targets: [curve]
      - say: "Read the later sample. It manages the contraction in I'll do, then gives us I is the king. That verb still disagrees with its subject. Both excerpts use the same prompt, seed and sampling settings. Before choosing a checkpoint, compare several fixed prompts, look for copied training phrases, and test the task you care about. If loss improves while copying gets more frequent, keep both results in the decision. Repeat the comparison across seeds to see how much the loss varies."
