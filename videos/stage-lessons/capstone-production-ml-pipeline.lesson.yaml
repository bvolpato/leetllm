scenes:
  - id: intro
    title: Would you let this model warn customers?
    visual: Two late critical parcels roll into view beside the cost of all four test deliveries. The warning log appears under each parcel. Both outcomes stay visible while the viewer decides whether to open the canary.
    beats:
      - say: Both of these critical parcels arrived late. The test log shows a warning for the first customer. The second got none.
        caption_starts:
          - The test log shows
          - The second got none
        hold: 0.45
        visual_cues:
          - id: intro-sent
            phrase: a warning for the first customer
            targets: [intro-mechanism]
          - id: intro-miss
            phrase: The second got none
            targets: [intro-mechanism]
      - say: Across all four test deliveries, cost fell from a hundred units to ninety-six. A canary would give the trial model a small share of live requests. It has to match or beat the old cost and send a warning for at least ninety percent of late critical deliveries. Would you open the canary?
        caption_starts:
          - It has to match
          - Would you open the canary
        hold: 2.1
        visual_cues:
          - id: intro-policy
            phrase: It has to match or beat the old cost
            targets: [intro-mechanism]
          - id: intro-question
            phrase: A canary would give the trial model a small share of live requests
            targets: [intro-mechanism]
      - say: Keep it offline. It warned one of the two customers who needed it. That's fifty percent recall. The four percent saving passes the cost check. Both checks have to pass before the model gets traffic.
        caption_starts:
          - That's fifty percent recall
          - The four percent saving
        hold: 0.65
        visual_cues:
          - id: intro-hold
            phrase: Keep it offline
            targets: [intro-mechanism]
          - id: intro-recall
            phrase: That's fifty percent recall
            targets: [intro-mechanism]
          - id: intro-total
            phrase: The four percent saving passes the cost check
            targets: [intro-mechanism]
      - say: Keep delivery two on the failed receipt. These costs came from hand-entered records. Now fit a separate candidate, starting with the scans it could use.
        hold: 0.65
        visual_cues:
          - id: intro-record
            phrase: Keep delivery two on the failed receipt
            targets: [intro-mechanism]
  - id: feature-clocks
    title: Delivery one at noon
    visual: For eval-1, a fixed noon cutoff crosses three scan tracks. Each track connects the observed
      time to the service availability time and keeps the recorded delay alongside it. Only a scan
      with both marks on the eligible side can feed the model.
    beats:
      - say: Take delivery one from the evaluation sheet. Its prediction was due at noon. Each line starts
          when the carrier observed a scan and ends when the service could read it. Look at scan B.
          The carrier saw ninety-nine minutes of delay before noon. Its report arrived half an hour
          after the prediction. Which recorded delay could the service actually use?
        hold: 2
        visual_cues:
          - id: clock-a
            phrase: Each line starts
            targets:
              - feature-clocks-mechanism
          - id: clock-b
            phrase: Look at scan B
            targets:
              - feature-clocks-mechanism
          - id: clock-c
            phrase: Which recorded delay could the service actually use
            targets:
              - feature-clocks-mechanism
      - say: Use the nine minutes on scan A. It was observed at ten and available at eleven. B arrived too
          late. C was still in the future. For this delivery, keep only scans that pass both clocks,
          then take the most recent observation among them.
        hold: 0.65
        visual_cues:
          - id: clock-chosen
            phrase: Use the nine minutes on scan A
            targets:
              - feature-clocks-mechanism
          - id: clock-b-excluded
            phrase: B arrived too late
            targets:
              - feature-clocks-mechanism
          - id: clock-c-excluded
            phrase: C was still in the future
            targets:
              - feature-clocks-mechanism
      - say: Two timestamps with different offsets can describe the same instant. Convert them to UTC before
          checking for duplicate scans of the same entity. Match each request to exactly one outcome.
          A duplicate outcome would count a parcel twice, so the builder rejects it. If there is no
          eligible scan, keep the input missing. This builder also needs a separate policy to exclude
          a scan for being too old.
        hold: 0.6
        visual_cues:
          - id: clock-join
            phrase: Match each request to exactly one outcome
            targets:
              - feature-clocks-mechanism
          - id: clock-duplicate
            phrase: the builder rejects it
            targets:
              - feature-clocks-mechanism
          - id: clock-missing
            phrase: keep the input missing
            targets:
              - feature-clocks-mechanism
      - say: Labels have their own deadline. Only requests before May twenty-five with outcomes available by
          that cutoff can enter training. For the May twenty-eight evaluation requests, the May
          thirty-one snapshot can supply the answer key. Keep that answer on the evaluation side of
          the ledger. It never enters the prediction. These cutoffs let us reconstruct a historical
          request from a later snapshot.
        hold: 0.7
        visual_cues:
          - id: clock-train
            phrase: requests before May twenty-five
            targets:
              - feature-clocks-mechanism
          - id: clock-eval
            phrase: the May thirty-one snapshot
            targets:
              - feature-clocks-mechanism
          - id: clock-label
            phrase: It never enters the prediction
            targets:
              - feature-clocks-mechanism
  - id: fit
    title: A warning model fitted on six deliveries
    visual: Training delays and their late labels share a plot. Training alone sets the transform and
      fitted line. The eight-minute input is marked before the score appears, then its point is read
      against the warning threshold. The four evaluation rows use the saved line.
    beats:
      - say: Each gray point is a training delivery. The three smallest delays belong to parcels that
          arrived on time. The other three arrived late. All six delays add to thirty minutes. Divide
          by six and we get five. Save that mean for missing inputs and for centering. The distance
          from the smallest to the largest delay is ten minutes. That’s our scale.
        hold: 0.6
        visual_cues:
          - id: fit-points
            phrase: Each gray point
            targets:
              - fit-mechanism
          - id: fit-mean
            phrase: we get five
            targets:
              - fit-mechanism
          - id: fit-range
            phrase: ten minutes
            targets:
              - fit-mechanism
      - say: Subtract five and divide by ten. The transformed delays now average zero. The late labels
          average one half. To fit the line, multiply each centered feature by its centered label and
          add the products. Their sum is one point two. The squared features sum to one. Dividing
          those sums gives a slope of one point two. With a mean feature of zero, the intercept is the
          mean label, one half.
        hold: 0.65
        visual_cues:
          - id: fit-transform
            phrase: Subtract five and divide by ten
            targets:
              - fit-mechanism
          - id: fit-cross
            phrase: Their sum is one point two
            targets:
              - fit-mechanism
          - id: fit-square
            phrase: The squared features sum to one
            targets:
              - fit-mechanism
          - id: fit-line
            phrase: the intercept is the mean label
            targets:
              - fit-mechanism
      - say: Now bring back delivery two. Its eight-minute delay is marked on the horizontal axis. Use the
          saved line and the warning threshold of one half. Would this fitted model send a warning?
        hold: 2
        visual_cues:
          - id: fit-probe
            phrase: Its eight-minute delay is marked
            targets:
              - fit-mechanism
          - id: fit-question
            phrase: Would this fitted model send a warning
            targets:
              - fit-mechanism
      - say: Yes. Eight minus five, divided by ten, gives point three. Move up to the line. One half plus
          one point two times point three gives a score of point eight six. The other evaluation
          deliveries use the same transform. Look at the zero-minute input. Its score is negative
          point one. This line can go below zero. We use it to decide which delays cross the warning threshold.
        caption_starts:
          - Eight minus five
          - Move up to the line
          - point eight six
          - Look at the zero-minute input
        hold: 0.8
        visual_cues:
          - id: fit-z
            phrase: gives point three
            targets:
              - fit-mechanism
          - id: fit-rise
            phrase: Move up to the line
            targets:
              - fit-mechanism
          - id: fit-score
            phrase: point eight six
            targets: [fit-mechanism]
          - id: fit-eval
            phrase: The other evaluation deliveries
            targets:
              - fit-mechanism
          - id: fit-negative
            phrase: the zero-minute input
            targets:
              - fit-mechanism
  - id: bundle
    title: Save enough state to reproduce a decision
    visual: Preprocessing and model values enter one bundle, and a reload probe produces the same outputs.
    beats:
      - say: Saving coefficients alone leaves the computation incomplete. The fitted transformation, input schema and
          warning threshold all affect the answer. Put them in the same retained package, together with
          training identity and the code used to build it, then reload and compare predictions.
        hold: 0.75
        visual_cues:
          - id: bundle-b1-1
            phrase: fitted transformation
            targets:
              - bundle-mechanism
            linger: 0.45
          - id: bundle-b1-2
            phrase: input schema and warning threshold
            targets:
              - bundle-mechanism
            linger: 0.45
          - id: bundle-b1-3
            phrase: reload and compare predictions
            targets:
              - bundle-mechanism
            linger: 0.45
          - id: bundle-build
            phrase: together with training identity and the code used to build it
            targets:
              - bundle-mechanism
      - say: Take a request with a missing delay. The model imputes the training mean. Five minutes
          gives a score of one half. Our rule sends a warning at threshold equality. Count those warnings
          when you evaluate the cost of missing scans. A schema mismatch
          or an invalid saved parameter should stop the inference path before a customer gets a warning.
        caption_starts:
          - The model imputes the training mean
          - Five minutes gives
          - Our rule sends a warning
        hold: 0.85
        visual_cues:
          - id: bundle-b2-1
            phrase: imputes the training mean
            targets:
              - bundle-mechanism
            linger: 0.45
          - id: bundle-b2-score
            phrase: Five minutes gives a score of one half
            targets: [bundle-mechanism]
          - id: bundle-b2-2
            phrase: threshold equality
            targets:
              - bundle-mechanism
            linger: 0.45
          - id: bundle-b2-3
            phrase: schema mismatch
            targets:
              - bundle-mechanism
            linger: 0.45
          - id: bundle-stop
            phrase: stop the inference path
            targets:
              - bundle-mechanism
      - say: To recover a release, keep its data snapshot, feature version, model and action threshold
          together. Record the promotion policy, monitor and previous release. Here the promotion policy
          holds the monitoring thresholds. The monitor itself still needs an identity. For a vision model,
          restore the cropper and review threshold with the weights. Register the package while the old
          release serves. Now price the four test deliveries. Each warning costs two units. Each missed
          late delivery costs twenty-five. The fitted model sends two warnings for four units. The silent
          baseline misses both late deliveries for fifty.
        hold: 2.7
        visual_cues:
          - id: bundle-extension-3
            phrase: To recover a release
            targets:
              - bundle-mechanism
            linger: 0.8
          - id: pipe-result-trained-cost-receipt
            phrase: The silent baseline misses both late deliveries for fifty
            targets:
              - bundle-mechanism
            color: cyan
            linger: 0.45
          - id: bundle-monitor-limit
            phrase: The monitor itself still needs an identity
            targets:
              - bundle-mechanism
  - id: strict-model-loader
    title: Verify bytes and the computation that those bytes describe
    visual: One retained request, release and evidence identity constructs each operation and consequence;
      predictions precede their computed outcomes.
    beats:
      - say: The bundle stores the input feature name, fitted imputation, center and range, slope and intercept,
          warning threshold, training IDs and cutoff, training-row digest, builder-source digest and Python
          version. The training digest excludes later evaluation outcomes; the separate full-fixture digest
          includes them. Reload compares predictions from retained bytes with the pre-save computation.
        hold: 0.8
        visual_cues:
          - id: strict-model-loader-b1
            phrase: The bundle stores the input feature name, fitted imputation, center and range, slope and intercept,
              warning threshold, training IDs and cutoff, training-row digest, builder-source digest and
              Python version
            targets:
              - strict-model-loader-mechanism
            linger: 0.8
          - id: loader-reload
            phrase: Reload compares predictions from retained bytes with the pre-save computation
            targets:
              - strict-model-loader-mechanism
      - say: First compare the serialized bytes with the registered digest. Appending one space changes that digest
          and stops reload. Once the bytes match, check the values inside. Reject duplicate JSON
          keys, nonfinite numbers, a nonpositive scale, an unexpected schema or an unsupported threshold.
          Reject Boolean or unrepresentably huge numeric inputs. At a missing delay, reuse the saved
          imputation value from training.
        hold: 0.8
        visual_cues:
          - id: strict-model-loader-b2
            phrase: First compare the serialized bytes with the registered digest
            targets:
              - strict-model-loader-mechanism
            linger: 0.8
          - id: loader-space
            phrase: Appending one space changes that digest and stops reload
            targets:
              - strict-model-loader-mechanism
          - id: loader-contract
            phrase: Once the bytes match
            targets:
              - strict-model-loader-mechanism
          - id: loader-invalid
            phrase: Reject duplicate JSON keys, nonfinite numbers, a nonpositive scale, an unexpected schema or an
              unsupported threshold
            targets:
              - strict-model-loader-mechanism
          - id: loader-input
            phrase: Reject Boolean or unrepresentably huge numeric inputs
            targets:
              - strict-model-loader-mechanism
          - id: loader-impute
            phrase: At a missing delay, reuse the saved imputation value
            targets:
              - strict-model-loader-mechanism
      - say: This loader reads numeric JSON. For a scikit-learn model, restore the training version
          and its dependencies. Load pickle files only from a trusted source because loading one can
          run code. The checksum identifies the saved bytes. Replaying a known request checks the
          prediction those bytes produce.
        hold: 0.8
        visual_cues:
          - id: strict-model-loader-b3
            phrase: This loader reads numeric JSON
            targets:
              - strict-model-loader-mechanism
            linger: 0.8
          - id: loader-runtime
            phrase: restore the training version and its dependencies
            targets:
              - strict-model-loader-mechanism
          - id: loader-checksum-limit
            phrase: The checksum identifies the saved bytes
            targets:
              - strict-model-loader-mechanism
  - id: offline
    title: Bind the gate to the actual rows
    visual: The failed recall fixture stays held while a separately fitted passing package enters the offline gate.
    beats:
      - say: Now return to the cheaper candidate that missed a critical case. Derive recall from its row decisions and
          compare it with the declared floor. Its cost improvement cannot erase the failed requirement. Keep a
          separate receipt naming those exact rows and the policy that evaluated them.
        hold: 0.75
        visual_cues:
          - id: offline-b1-1
            phrase: Derive recall from its row decisions
            targets:
              - offline-mechanism
            linger: 0.45
          - id: offline-b1-2
            phrase: cost improvement
            targets:
              - offline-mechanism
            linger: 0.45
          - id: offline-b1-3
            phrase: failed requirement
            targets:
              - offline-mechanism
            linger: 0.45
          - id: failed-evaluation-receipt
            phrase: Keep a separate receipt naming those exact rows and the policy that evaluated them
            targets:
              - offline-mechanism
            color: pink
            linger: 0.45
      - say: The independently fitted package has its own evaluation outputs. A passing offline result can open a
          limited next stage under this local policy. Bind that result to the release, model bytes and policy
          values, so changing a package or threshold invalidates the earlier receipt.
        hold: 0.85
        visual_cues:
          - id: offline-b2-1
            phrase: own evaluation outputs
            targets:
              - offline-mechanism
            linger: 0.45
          - id: offline-b2-2
            phrase: A passing offline result can open a limited next stage under this local policy
            targets:
              - offline-mechanism
            linger: 0.45
          - id: offline-row-build
            phrase: The independently fitted package has its own evaluation outputs
            targets:
              - offline-mechanism
            linger: 0.7
      - say: The no-leakage gate checks intersection of training and evaluation entity IDs. A shared ID fails even
          when recall passes. Different IDs can still hide related parcels, and the overlap gate does not
          discover future features. The builder supplies separate clock checks. If the critical slice has no
          positives, there are no late critical deliveries to count. Leave recall blank. If baseline cost
          is zero, relative cost change is missing. Either missing measurement keeps the candidate offline.
        hold: 0.8
        visual_cues:
          - id: offline-extension-3
            phrase: The no-leakage gate checks intersection of training and evaluation entity IDs
            targets:
              - offline-mechanism
            linger: 0.8
          - id: offline-shared
            phrase: A shared ID fails even when recall passes
            targets:
              - offline-mechanism
          - id: offline-no-positive
            phrase: If the critical slice has no positives
            targets:
              - offline-mechanism
          - id: offline-zero-base
            phrase: If baseline cost is zero, relative cost change is missing
            targets:
              - offline-mechanism
  - id: bound-evidence
    title: Does this receipt still describe delivery two?
    visual: The evaluator compares the current rows with a saved receipt. A correction to one cost changes the row fingerprint. The saved fingerprint stays in view while the controller holds the release for reevaluation.
    beats:
      - say: The registry saves the package and its release record. Production still runs version zero.
          The evaluator checks the row types, the list of expected delivery IDs and any overlap with
          training. It adds up each model's costs. Divide the trial total by the positive baseline total
          and subtract one. For critical recall, divide the number of late critical deliveries that got
          warnings by the number that arrived late in that group.
        hold: 0.8
        visual_cues:
          - id: bound-evidence-b1
            phrase: The registry saves the package
            targets:
              - bound-evidence-mechanism
            linger: 0.8
          - id: bound-evidence-overlap
            phrase: any overlap with training
            targets:
              - bound-evidence-mechanism
            linger: 0.7
          - id: evidence-metrics
            phrase: by the number that arrived late in that group
            targets:
              - bound-evidence-mechanism
      - say: The receipt records a fingerprint for the artifact, the release and the promotion policy.
          The evaluator uses a consistent JSON encoding so it can compare the values later. Before
          opening a canary, look up the receipt by ID. Check the candidate and its fingerprints, then
          check that the previous release is still serving. If the receipt is missing or any required
          check failed, keep the candidate offline.
        hold: 0.8
        visual_cues:
          - id: bound-evidence-b2
            phrase: The receipt records a fingerprint
            targets:
              - bound-evidence-mechanism
            linger: 0.8
          - id: evidence-open
            phrase: check that the previous release is still serving
            targets:
              - bound-evidence-mechanism
          - id: evidence-missing
            phrase: keep the candidate offline
            targets:
              - bound-evidence-mechanism
      - say: Look up a saved receipt. Delivery two cost two units when the evaluator ran. Suppose the
          cost on that row changes to three units. The row fingerprint changes. The receipt still describes the two-unit
          row, so hold the release and evaluate the corrected rows. In a service, protect the saved
          receipt and the artifact. Give a trusted evaluator control of the data, model run and new receipts.
        caption_starts:
          - Suppose the cost on that row
          - The row fingerprint changes
        hold: 0.8
        visual_cues:
          - id: bound-evidence-b3
            phrase: Look up a saved receipt
            targets:
              - bound-evidence-mechanism
            linger: 0.8
          - id: evidence-replace
            phrase: the cost on that row changes to three units
            targets:
              - bound-evidence-mechanism
          - id: evidence-hold
            phrase: hold the release and evaluate the corrected rows
            targets:
              - bound-evidence-mechanism
          - id: evidence-writer
            phrase: Give a trusted evaluator control
            targets:
              - bound-evidence-mechanism
  - id: canary
    title: The canary’s observation history
    visual: Four of twenty request marks move onto the candidate lane. Labels and paired costs attach to
      those four identities. A second history retains an earlier positive cost change beside the same
      favorable latest result. The canary pointer follows the decision.
    beats:
      - say: Imagine twenty requests arriving together. Sixteen keep the old model. These four go to version
          one. We can already measure response time and errors. The carriers haven’t reported which
          parcels arrived late. Should we give the candidate more traffic yet?
        hold: 2
        visual_cues:
          - id: canary-four
            phrase: These four go to version one
            targets:
              - canary-mechanism
          - id: canary-fast
            phrase: response time and errors
            targets:
              - canary-mechanism
          - id: canary-pending
            phrase: The carriers haven’t reported
            targets:
              - canary-mechanism
          - id: canary-first-vote
            phrase: Should we give the candidate more traffic yet
            targets:
              - canary-mechanism
      - say: Hold the canary at its current exposure. Zero labels have arrived for four requests. The cost
          change is still unknown. A measured cost change of zero would mean we broke even.
        caption_starts:
          - A measured cost change of zero
        hold: 0.55
        visual_cues:
          - id: canary-hold
            phrase: Hold the canary at its current exposure
            targets:
              - canary-mechanism
      - say: Now the day-seven window arrives. Match each carrier report to the request that version one
          served. Two parcels arrived late and two arrived on time. In this illustration each report
          supplies twenty-three cost units for the candidate and twenty-five for the baseline. Add all
          four pairs. Ninety-two divided by one hundred, minus one, gives minus eight percent.
        caption_starts:
          - Add all four pairs
          - gives minus eight percent
        hold: 0.65
        visual_cues:
          - id: canary-day-seven
            phrase: the day-seven window arrives
            targets:
              - canary-mechanism
          - id: canary-match
            phrase: Match each carrier report
            targets:
              - canary-mechanism
          - id: canary-pair
            phrase: each report supplies twenty-three cost units
            targets:
              - canary-mechanism
          - id: canary-sum
            phrase: Add all four pairs
            targets:
              - canary-mechanism
          - id: canary-delta
            phrase: gives minus eight percent
            targets:
              - canary-mechanism
      - say: Keep both windows on file. Both have healthy service, the latest has labels, and every measured
          cost change is at or below zero. The controller can issue a ready receipt. Production still
          selects version zero until a separate promotion call.
        hold: 0.6
        visual_cues:
          - id: canary-history
            phrase: Keep both windows on file
            targets:
              - canary-mechanism
          - id: canary-ready
            phrase: issue a ready receipt
            targets:
              - canary-mechanism
      - say: Try a different history. This time the earlier window already had labels. Its cost was a
          hundred and fourteen against a hundred. The next window again comes in at ninety-two against
          a hundred. Both windows pass the service checks. Can this canary stay open?
        caption_starts:
          - The next window
          - Can this canary stay open
        hold: 2.2
        visual_cues:
          - id: canary-alternative
            phrase: Try a different history
            targets:
              - canary-mechanism
          - id: canary-earlier
            phrase: a hundred and fourteen against a hundred
            targets:
              - canary-mechanism
          - id: canary-later
            phrase: ninety-two against a hundred
            targets:
              - canary-mechanism
          - id: canary-vote
            phrase: Can this canary stay open
            targets:
              - canary-mechanism
      - say: Abort this canary. The earlier window crossed the cost limit by fourteen percent. The later
          saving leaves that breach in the history. Remove the candidate’s canary pointer. Production
          still selects version zero.
        hold: 0.85
        visual_cues:
          - id: canary-abort
            phrase: Abort this canary
            targets:
              - canary-mechanism
          - id: canary-remove
            phrase: Remove the candidate’s canary pointer
            targets:
              - canary-mechanism
  - id: canary-window-contract
    title: What if a window arrives without a usable measurement?
    visual: The controller evaluates an article window at the policy boundary. A missing cost, a
      nonfinite latency and a dictionary each change one input on an independent run. The receipt and
      named canary show the three outcomes.
    beats:
      - say: The four labeled deliveries let us reconstruct a cost change. The article’s controller takes a
          summary instead. Its day-seven record covers forty-two hundred requests and supplies a cost
          change of minus eight percent. That online summary is separate from the fitted model’s
          offline cost of four against fifty.
        hold: 0.55
        visual_cues:
          - id: contract-record
            phrase: day-seven record
            targets:
              - canary-window-contract-mechanism
          - id: contract-delta
            phrase: supplies a cost change of minus eight percent
            targets:
              - canary-window-contract-mechanism
          - id: contract-offline
            phrase: offline cost of four against fifty
            targets:
              - canary-window-contract-mechanism
      - say: Start each run with the same accepted offline receipt, production on version zero and the
          canary on version one. Give the evaluator the first-hour window, followed by day seven. It
          checks the release and its bindings, unique window IDs, and strictly increasing, nonnegative
          integer days. Each must count a positive whole number of requests. A Boolean count fails the
          contract.
        hold: 0.55
        visual_cues:
          - id: contract-start
            phrase: Start each run
            targets:
              - canary-window-contract-mechanism
          - id: contract-days
            phrase: strictly increasing
            targets:
              - canary-window-contract-mechanism
          - id: contract-count
            phrase: a positive whole number of requests
            targets:
              - canary-window-contract-mechanism
      - say: Try the limits exactly. Set the second window to one percent errors, two hundred fifty
          milliseconds at the ninety-fifth percentile, and zero measured cost change. The policy
          allows equality. Both windows pass, so the controller records ready. A separate promotion
          call would still have to move production.
        caption_starts:
