  - id: alias-generation
    title: Make the production transition atomic with its audit event
    visual: One retained request, release and evidence identity constructs each operation and consequence;
      predictions precede their computed outcomes.
    beats:
      - say: The Python controller checks production and then assigns it sequentially. A second controller can change
          the pointer between those actions. A transaction or compare-and-swap must check the expected release
          and alias generation while committing the pointer and audit event together.
        hold: 0.8
        visual_cues:
          - id: alias-generation-b1
            phrase: The Python controller checks production and then assigns it sequentially
            targets:
              - alias-generation-mechanism
            linger: 0.8
      - say: Consider production v zero at generation forty-one. Another controller moves it to v two at generation
          forty-two, then back to v zero at generation forty-three. The text label matches the old receipt
          again, but generation forty-one is stale. Compare the expected generation as well as the release,
          and record which rollout produced the evidence and when.
        hold: 0.8
        visual_cues:
          - id: alias-generation-b2
            phrase: Consider production v zero at generation forty-one
            targets:
              - alias-generation-mechanism
            linger: 0.8
          - id: alias-generation-away
            phrase: Another controller moves it to v two at generation forty-two
            targets:
              - alias-generation-mechanism
            linger: 0.7
          - id: alias-generation-returned
            phrase: then back to v zero at generation forty-three
            targets:
              - alias-generation-mechanism
            linger: 0.7
          - id: pipe-result-aba-stale-comparison
            phrase: The text label matches the old receipt again, but generation forty-one is stale
            targets:
              - alias-generation-mechanism
            color: cyan
            linger: 0.45
      - say: The pointer has moved. Now follow a request. Check which workers loaded the package, became
          ready and received traffic. Time recovery through those steps, including any wait for compatible
          features. A warning sent before recovery stays in the customer's inbox.
        hold: 0.8
        visual_cues:
          - id: alias-generation-b3
            phrase: The pointer has moved
            targets:
              - alias-generation-mechanism
            linger: 0.8
          - id: alias-workers
            phrase: Check which workers loaded the package
            targets:
              - alias-generation-mechanism
  - id: recovery
    title: Two day-eight production reports
    visual: Two possible day-eight reports share healthy service metrics and the same selected v1.
      Missing quality leaves the switch in place. The labeled regression yields a rollback receipt,
      loads v0 and changes the nine-minute probe.
    beats:
      - say: Return to the release that passed its checks and was promoted. Version one is selected. Send it
          a nine-minute delay. The fitted model scores point nine eight and warns. Now imagine two
          possible day-eight reports for this release. Both show nine hundred requests, healthy
          latency and few errors.
        hold: 0.5
        visual_cues:
          - id: recovery-probe
            phrase: Send it a nine-minute delay
            targets:
              - recovery-mechanism
          - id: recovery-windows
            phrase: two possible day-eight reports
            targets:
              - recovery-mechanism
      - say: In the first report the outcome labels are still missing. In the other they have arrived, and
          warning cost is fourteen percent above baseline. The limit is zero regression. Which report
          gives you a reason to restore the previous model?
        hold: 2
        visual_cues:
          - id: recovery-pending
            phrase: the outcome labels are still missing
            targets:
              - recovery-mechanism
          - id: recovery-measured
            phrase: fourteen percent above baseline
            targets:
              - recovery-mechanism
          - id: recovery-vote
            phrase: Which report gives you a reason
            targets:
              - recovery-mechanism
      - say: Keep version one for the pending report. Set a deadline and fallback for missing measurements.
          The measured increase in the second report does justify recovery. Fetch its stored rollback
          receipt, recheck the live release and reload the previous package. Move the local pointer
          back to version zero.
        caption_starts:
          - The measured increase in the second report
          - Move the local pointer
        hold: 0.55
        visual_cues:
          - id: recovery-hold
            phrase: Keep version one for the pending report
            targets:
              - recovery-mechanism
          - id: recovery-breach
            phrase: The measured increase in the second report
            targets:
              - recovery-mechanism
          - id: recovery-select
            phrase: Move the local pointer back to version zero
            targets:
              - recovery-mechanism
      - say: Replay the nine-minute delay. Its score drops to zero and the warning goes silent. That checks
          the restored computation. A real service must also verify worker readiness and routing. A
          warning sent yesterday stays in the customer’s inbox.
        caption_starts:
          - Its score drops to zero
          - the warning goes silent
        hold: 0.75
        visual_cues:
          - id: recovery-replay
            phrase: Replay the nine-minute delay
            targets:
              - recovery-mechanism
          - id: recovery-result
