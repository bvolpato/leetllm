            phrase: Delivery warnings need scan freshness now and labeled warning cost later
            targets:
              - product-monitoring-mechanism
          - id: product-ranking
            phrase: Ranking needs eligible candidate supply now and an assignment-aware purchase or return outcome later
            targets:
