            phrase: take away the latest labels and their cost
            targets:
              - canary-window-contract-mechanism
      - say: Hold it open. The measurement is due. An empty history or a single healthy window also holds.
          Next, restore the complete pair and change only the latency to a nonfinite value. This time
          the record itself fails validation. Abort and remove this candidate’s canary. A measured
          breach or a binding mismatch also aborts. Another candidate’s canary stays in place.
        caption_starts:
