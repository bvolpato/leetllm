  - id: promotion
    title: Follow receipt three to the production switch
    visual: The stored canary receipt leads back to its accepted offline receipt and evaluation rows. A
      separate promotion call reloads the packages, records the local alias move and clears the
      canary. A nine-minute replay reads the selected model.
    beats:
      - say: Take history A, with the day-zero and day-seven windows. The evaluator filed ready receipt
          three for version one. That receipt names version zero as the production base. Follow its
          reference to the accepted offline receipt, then to the stored evaluation rows. Recheck the
          package and policy fingerprints against the registered values.
        hold: 0.5
        visual_cues:
          - id: promotion-ready
            phrase: ready receipt three
            targets:
              - promotion-mechanism
          - id: promotion-offline
            phrase: the accepted offline receipt
            targets:
              - promotion-mechanism
          - id: promotion-rows
            phrase: the stored evaluation rows
            targets:
              - promotion-mechanism
          - id: promotion-bind
            phrase: Recheck the package and policy fingerprints
            targets:
              - promotion-mechanism
      - say: Read the live pointer just before the move. If another release is already selected, leave it
          there and hold promotion. Here the base still matches version zero. Call promote with
          receipt three. The controller reloads both packages, moves production to version one, clears
          the canary, and records the move with its receipt ID.
        hold: 0.65
        visual_cues:
          - id: promotion-base
            phrase: Read the live pointer
            targets:
              - promotion-mechanism
          - id: promotion-match
            phrase: the base still matches version zero
            targets:
              - promotion-mechanism
          - id: promotion-call
            phrase: Call promote with receipt three
            targets:
              - promotion-mechanism
          - id: promotion-select
            phrase: moves production to version one
            targets:
              - promotion-mechanism
          - id: promotion-event
            phrase: records the move with its receipt ID
            targets:
              - promotion-mechanism
      - say: Send a nine-minute delay through the selected package. Its score is point nine eight and the
          warning comes on. This replay checks the local selection. To confirm a deployed change,
          check which workers loaded the package and which revision received routed requests. The
          local check and assignment happen one after the other. What if two controllers write at
          once?
        hold: 0.7
        visual_cues:
          - id: promotion-send
            phrase: Send a nine-minute delay
            targets:
              - promotion-mechanism
          - id: promotion-probe-result
            phrase: Its score is point nine eight
            targets:
              - promotion-mechanism
          - id: promotion-workers
            phrase: which revision received routed requests
            targets:
