            phrase: Forecasting needs fresh counts now and residual or alert-decision cost later
            targets:
              - product-monitoring-mechanism
          - id: product-vision
            phrase: Vision needs photo quality now and reviewer-confirmed damage later
            targets:
              - product-monitoring-mechanism
      - say: A canary bounds initial exposure while checking a release. To find out whether the warnings
          helped customers, run an A B test. Randomly assign customers to the two versions and compare
          their outcomes. The canary can be part of that experiment. A training schedule or drift trigger
          creates another candidate, which must pass the same data, model, monitoring and promotion evidence
          checks.
