  - id: superstep-join
    title: A scheduling barrier does not validate evidence
    visual: A constructed scheduling probe records one partial and one complete merge for separate edges, then a single waiting-edge merge. It does not execute the release validator, which rejects missing evidence.
    beats:
      - say: "LangGraph plans a superstep and chooses which nodes to run. These three workers start from the same state. Watch their receipts collect at the barrier. When the workers finish, the runtime applies their updates together. The next step starts with all three receipts."
        caption_starts:
          - "These three workers"
          - "Watch their receipts"
          - "When the workers finish"
          - "The next step starts"
        hold: 1
        visual_cues:
