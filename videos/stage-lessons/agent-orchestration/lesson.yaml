  - id: subject-intro
    title: Can the new search ranker take more traffic?
    visual: Two receipts sit beside a dial set to the requested traffic share. Reveal the policy ceiling, then follow all three workers to the join.
    beats:
      - say: "One search in four would go to the new ranker. Two checks are in. Two regressions in a hundred test cases. Four errors in ten thousand canary requests. Both pass. What else could limit the rollout?"
        caption_starts:
          - "Two checks are in"
          - "Two regressions"
          - "Four errors"
          - "Both pass"
          - "What else"
