            phrase: "The next step starts"
            targets:
              - picture
          - id: superstep-join-construct-0
            phrase: "plans a superstep"
            targets:
              - superstep-join-construction
            color: yellow
            linger: 0.6
      - say: For a default scalar channel, one update replaces its value. Concurrent updates to that unreduced key raise an invalid-concurrent-graph-update error, even when the supplied values agree. A list-add reducer concatenates results; it is associative but not commutative, and it keeps duplicates. Adding an empty list leaves the saved receipts in place. For a new full attempt, start a fresh thread, use Overwrite to replace the saved list with an empty one, or use an attempt-aware reducer. When resuming the same failed attempt, keep the successful branches’ saved writes and retry the failed work.
