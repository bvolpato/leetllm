          - id: eval-question
            phrase: "Two regressions"
            targets:
              - picture
          - id: health-question
            phrase: "Four errors"
            targets:
              - picture
        hold: 2
      - say: "The rollout policy. Its ceiling is twenty-five percent, exactly the share we asked for. Follow the three receipts back to their workers. These reads can run independently. The policy worker finishes first. The health worker takes longest. Once all three arrive, bring them back together. Each receipt names the revision and shows the age of the evidence. Each branch contributes its own result. The arrows show where those results go. A join waits for the required work, validates the receipts, and creates one proposal. The proposal goes to a reviewer. The writer changes traffic only after approval."
