  - id: typed-receipts
    title: Give each worker a narrow update contract
    visual: Graph state enters the branch node. Its helper gets a copied request view, and the checked update carries only its own receipt. The merge compares the record with the request.
    beats:
      - say: "LangGraph gives each Python branch node the graph state. Look inside the evaluation node. It copies the request fields into a read-only view for its receipt helper. The helper gets the request identity, tenant, release, and expected revision. It uses the traffic target when it checks the source. Each node returns only its own receipt through a checked output wrapper. The evaluation branch supplies evaluation evidence. Its update cannot replace the approval field or quietly change the requested traffic amount."
