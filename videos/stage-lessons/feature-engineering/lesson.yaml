scenes:
  - id: intro
    title: Which field could warn us at nine?
    visual: An escalation stamp lands on a job ticket. Rewind to scoring time and the stamp lifts off
      while the original queue count stays on the ticket. Test the two fields on four completed jobs.
    beats:
      - say: This job got an escalation stamp after it missed its deadline. The queue count beside it
          was recorded at nine the day before. Which field could the scheduler use at nine to predict a miss?
        hold: 2.2
        caption_starts:
          - The queue count beside it
          - Which field could the scheduler use
        visual_cues:
          - id: intro-reading
            phrase: The queue count beside it
            targets:
              - intro-queue
            linger: 0.25
          - id: intro-flags
            phrase: an escalation stamp
            targets:
              - intro-outcomes
            linger: 0.25
      - say: The queue count. Wind the record back to nine. The stamp disappears, but those eighteen jobs
          were already waiting. Try a rule on four past jobs. Predict a miss whenever more than ten jobs
          are waiting. Which jobs would you flag?
        hold: 1.9
        caption_starts:
          - Try a rule on four past jobs
          - Which jobs would you flag
        visual_cues:
          - id: intro-rewind
            phrase: Wind the record back to nine
            targets:
              - intro-outcomes
            linger: 0.25
          - id: intro-backlogs
            phrase: Try a rule on four past jobs
            targets:
              - intro-queue
            linger: 0.25
      - say: The first and fourth jobs. Their backlogs were eighteen and twenty-two. Now open the outcome
          records. The first and third jobs missed. The backlog rule got two of the four right. Copying
          the escalation flag gets all four right because the stamp records what already happened.
          Feeding that answer back into the prediction is leakage. Keep the finish time for the training
          label. Build the input from what the scheduler could read at nine.
        hold: 0.9
        caption_starts:
          - Now open the outcome records
          - The first and third jobs missed
          - The backlog rule got two
          - Copying the escalation flag
        visual_cues:
          - id: intro-predict
            phrase: The first and fourth jobs
            targets: [intro-queue]
            linger: 0.25
          - id: intro-finish
            phrase: The first and third jobs missed
            targets:
              - intro-outcomes
            linger: 0.25
          - id: intro-count
            phrase: two of the four right
            targets:
              - intro-queue
            linger: 0.25
          - id: intro-copy
            phrase: all four right
            targets:
              - intro-outcomes
            linger: 0.25
  - id: decision-time
    title: Which heartbeat belongs to J-204?
    visual: Event and readable times stay beside their delivery intervals across a fixed 09:00 line. The
      latest eligible interval supplies the age.
    beats:
      - say: Look at the two pings just before nine. One left the job at eight thirty and reached the scorer a
          minute later. The other left at eight fifty and arrived at nine fifteen. The yellow line is the
          decision. Which ping sets the heartbeat age here?
        hold: 2.1
        visual_cues:
          - id: decision-packets
            phrase: The other left at eight fifty and arrived at nine fifteen
            targets:
              - decision-receipts
            linger: 0.25
      - say: Follow each ping to the time it became readable. The eight fifty ping crosses the line. The eight
          thirty ping makes it through, and it is newer than the one from one o’clock. From eight thirty
          to nine is thirty minutes, or half an hour. That is the value we put in the row.
        hold: 0.9
        caption_starts:
          - The eight fifty ping crosses the line
          - The eight thirty ping makes it through
          - From eight thirty to nine is
          - thirty minutes, or half an hour
        visual_cues:
          - id: decision-filter
            phrase: The eight fifty ping crosses the line
            targets:
              - decision-receipts
            linger: 0.25
          - id: decision-selected
            phrase: The eight thirty ping makes it through
            targets: [decision-receipts]
            linger: 0.25
          - id: decision-time-beat-2-focus-2
            phrase: thirty minutes, or half an hour
            targets:
              - decision-age
            linger: 0.25
      - say: A point-in-time lookup applies both tests to the same job. A noon ping would give a negative age at
          nine. Clipping that age to zero would still tell the model about a ping from the future. Leave
          it outside this decision.
        hold: 0.65
        visual_cues:
          - id: decision-noon
            phrase: A noon ping would give a negative age at nine
            targets:
              - decision-receipts
            linger: 0.25
  - id: temporal-contract
    title: Two copies of the same ping
    visual: The same job row chooses eligible revisions on two clocks while later outcome stays in a
      separate ledger.
    beats:
      - say: Look inside the revision history for that eight thirty ping. One copy reached the scorer at eight
          thirty-one. A correction to the very same ping arrived at nine oh five. There is also a ping
          from a different job. Which revision belongs to J two oh four at nine?
        hold: 1.9
        visual_cues:
          - id: temporal-contract-0
            phrase: A correction to the very same ping
            targets:
              - temporal-contract-operation
            color: cyan
            linger: 0.5
      - say: Keep the first copy. Filter to the same job and to records that pass both clocks, then take the
          latest eligible event. If two eligible revisions tie, use a deterministic tie rule. If none
          qualify, use the declared missing policy. A windowed count would count eligible events across
          the window. In Feast, an event-time join alone can admit a late correction. The created-time
          filter needs a supported backend and a non-null timestamp that means the scorer could read the record.
        hold: 0.85
        visual_cues:
          - id: temporal-contract-1
            phrase: Keep the first copy
            targets:
              - temporal-contract-operation
            color: cyan
            linger: 0.5
      - say: Now let the job run. Its deadline was nine on May second. It finished on May third, so this
          job gets a missed-deadline label of one. Keep that label outside the input row. Define a
          separate rule for cancellations and jobs still running. To test on future scheduler traffic,
          fit the transforms and model on earlier jobs whose labels are ready, account for related jobs,
          then score later decisions. Random splitting can suit an exchangeable population.
        hold: 0.85
        visual_cues:
          - id: temporal-contract-2
            phrase: It finished on May third
            targets:
              - temporal-contract-operation
            color: cyan
            linger: 0.5
  - id: numerical-scale
    title: Choose a scale that preserves useful differences
    visual: Eight queue waits map through standard and robust scaling; the ordinary 42-minute case and
      the 12,000-minute tail keep their computed positions visible.
    beats:
      - say: Queue waits range from five minutes to twelve thousand. The extreme job pulls the mean far
          above ordinary waits, so standardization places five and forty-two minutes only about nine
          thousandths of a unit apart.
        hold: 0.55
        visual_cues:
          - id: numerical-scale-beat-1-focus-1
            phrase: Queue waits range from five minutes to twelve thousand
            targets:
              - numerical-scale-simulation-16
            color: blue
            linger: 0.6
          - id: feature-standard-separation
            phrase: so standardization places five and forty-two minutes only about nine thousandths of a unit apart.
            targets:
              - feature-standard-separation
            color: cyan
            linger: 0
      - say: For the forty-two-minute wait, the supplied training values give a standard score near negative
          point three seven four. Using the median and inclusive interquartile range gives a robust
          score near point five two two.
        hold: 0.65
        visual_cues:
          - id: numerical-scale-beat-2-focus-1
            phrase: For the forty-two-minute wait
            targets:
              - numerical-scale-simulation-16
            color: blue
            linger: 0.6
          - id: feature-robust-map
            phrase: Using the median and inclusive interquartile range gives a robust score near point five two two.
            targets:
              - numerical-scale-simulation-16
            color: cyan
            linger: 0.45
      - say: The same twelve-thousand-minute outlier maps to a robust score above four hundred sixteen.
          Robust scaling centers and rescales the data, while clipping would replace extreme values
          with a chosen boundary and needs its own justification and version.
        hold: 0.7
        visual_cues:
          - id: numerical-scale-beat-3-focus-1
            phrase: The same twelve-thousand-minute outlier maps to a robust
            targets:
              - numerical-scale-simulation-16
            color: blue
            linger: 0.6
  - id: running-statistics
    title: Keep a running mean as readings arrive
    visual: Each incoming reading updates the same mean marker and adds one product to the sum of squared
      deviations. The last state supplies both variance denominators.
    beats:
      - say: Suppose your training readings are two, four and six. A standardizer stores their mean and standard
          deviation. Use that fitted pair when a new reading arrives. During evaluation, fit it inside
          each training fold. Decide how to handle a constant feature before dividing by its zero scale.
          Reject nonfinite readings. If you intend to update the scaler while serving, evaluate those
          updates in the order they will happen.
        hold: 0.7
        visual_cues:
          - id: running-statistics-0
            phrase: stores their mean and standard deviation
            targets:
              - running-statistics-operation
            linger: 0.25
      - say: Watch how Welford builds that pair without rereading old values. Start with count zero, mean zero
          and a sum of squared deviations called M two. The first reading is two. Move the mean all the
          way to two. The reading now sits on the mean, so it adds zero to M two. With only one reading,
          sample variance is undefined.
        hold: 0.8
        visual_cues:
          - id: welford-first
            phrase: Move the mean all the way to two
            targets:
              - running-statistics-operation
            linger: 0.25
      - say: Here comes four. Its distance from the old mean is two. Divide by the new count of two, then add
          one to the mean. The new mean is three. Four is now one unit above it, so add two times one to M
          two. Bring in six. Its old and new distances are three and two. That adds six more, taking M two
          from two to eight. For population variance, divide eight by three readings. For sample variance,
          divide by two.
        hold: 1
        visual_cues:
          - id: welford-second
            phrase: Here comes four
            targets:
              - running-statistics-operation
            linger: 0.25
          - id: welford-second-mean
            phrase: then add one to the mean
            targets: [running-statistics-operation]
          - id: welford-second-product
            phrase: add two times one to M two
            targets: [running-statistics-operation]
          - id: welford-third
            phrase: Bring in six
            targets:
              - running-statistics-operation
            linger: 0.25
          - id: welford-third-mean
            phrase: Its old and new distances are three and two
            targets: [running-statistics-operation]
          - id: welford-third-product
            phrase: from two to eight
            targets: [running-statistics-operation]
          - id: feature-welford-variance
            phrase: For sample variance, divide by two
            targets:
              - running-statistics-operation
            linger: 0.25
  - id: scale-artifact
    title: Keep transform meaning and fitted parameters distinct
    visual: The same eight observations occupy standard,robust and logarithmic rulers.
    beats:
      - say: For the original eight waits, subtract the training mean from the value, then divide that
          difference by the training standard deviation. Robust score subtracts median twenty-seven
          and divides by inclusive interquartile range twenty-eight point seven five. Quartiles
          sixteen point five and forty-five point two five depend on the declared interpolation
          convention. A zero interquartile range needs its own policy, just as a zero standard
          deviation does.
        hold: 0.85
        visual_cues:
          - id: scale-artifact-0
            phrase: For the original eight waits, subtract the training mean from the value
            targets:
              - scale-artifact-operation
            color: cyan
            linger: 0.5
      - say: "Positive affine scaling remains invertible in exact arithmetic, so the ordinary differences
          have not vanished. Scale can change optimization conditioning, regularization and
          numerical precision. An exact threshold tree can represent corresponding splits after an
          invertible monotone transform. Robust scaling does not clip: the outlier remains large.
          For nonnegative telemetry, log one plus the value compresses the right tail but still
          grows without bound. Choose and evaluate the representation for the estimator."
        hold: 0.85
        visual_cues:
          - id: scale-artifact-1
            phrase: Positive affine scaling remains invertible in exact arithmetic, so the ordinary differences
              have not vanished.
            targets:
              - scale-artifact-operation
            color: cyan
            linger: 0.5
          - id: feature-scale-log
            phrase: For nonnegative telemetry, log one plus the value compresses the right tail
            targets:
              - scale-artifact-operation
            color: cyan
            linger: 0.45
  - id: missingness
    title: Keep a missing reading distinct from zero
    visual: Two queue rows both carry a numeric zero until a missingness bit separates a measured empty
      queue from an unavailable sensor reading.
    beats:
      - say: A measured backlog of zero means the queue is empty. A blank reading means the sensor path
          supplied no number. Filling both with zero gives the model identical coordinates for
          different situations.
        hold: 0.55
        visual_cues:
          - id: missingness-beat-1-focus-1
            phrase: A measured backlog of zero means the queue is empty
            targets:
              - missingness-operation
            color: blue
            linger: 0.6
      - say: Impute a documented value, then add a binary indicator showing that the original measurement
          was missing. Read the pair as backlog, then missing bit. The measured zero gives zero, zero.
          The blank gives zero, one.
        hold: 0.6
        visual_cues:
          - id: missingness-beat-2-focus-1
            phrase: Impute a documented value
            targets:
              - missingness-operation
            color: blue
            linger: 0.6
          - id: missingness-beat-2-focus-2
            phrase: then add a binary indicator showing that the original measurement was missing
            targets:
              - missingness-operation
            color: blue
            linger: 0.6
      - say: The indicator can become predictive when outages correlate with an outcome, so evaluate that
          association. It captures measurement availability; investigate outage causes separately
          and store the imputation policy in the model artifact.
        hold: 0.65
        visual_cues:
          - id: missingness-beat-3-focus-1
            phrase: and store the imputation policy in the model
            targets:
              - missingness-operation
            color: blue
            linger: 0.6
          - id: missingness-beat-3-focus-2
            phrase: It captures measurement availability
            targets:
              - missingness-operation
            color: blue
            linger: 0.6
  - id: categories
    title: How far apart are two runner pools?
    visual: The same three pool names exchange numeric codes on a ruler. A fixed one-hot representation
      keeps its coordinates when the arbitrary codes change.
    beats:
      - say: Put three runner pools on a number line. In this codebook, A one hundred is at zero, H one hundred
          at one, and L four at two. A model that measures distance sees H one hundred as the nearest
          neighbor of A one hundred. Did we measure anything about those machines to earn that distance?
        hold: 1.6
        visual_cues:
          - id: pool-ruler
            phrase: H one hundred as the nearest neighbor
            targets:
              - pool-codes
            linger: 0.25
      - say: Exchange the codes for H one hundred and L four. The new nearest neighbor is L four. All we changed
          was the numbering. For a model that treats a number as a quantity, those codes quietly introduce
          an order and a distance.
        hold: 0.8
        caption_starts: [The new nearest neighbor is L four]
        visual_cues:
          - id: pool-exchange
            phrase: Exchange the codes for H one hundred and L four
            targets:
              - pool-codes
            linger: 0.25
      - say: This encoder trained on two pool names. Give each known name its own coordinate. A one hundred switches on the first bit. H one
          hundred switches on the second. This is one-hot encoding. Keep this layout with the model. We’ve
          reserved the third slot for other. What should happen when L four first reaches this encoder?
        hold: 1.5
        visual_cues:
          - id: pool-bits
            phrase: each known name its own coordinate
            targets:
              - pool-bits
            linger: 0.25
          - id: pool-a100
            phrase: switches on the first bit
            targets:
              - pool-bits
            linger: 0.25
          - id: pool-h100
            phrase: switches on the second
            targets:
              - pool-bits
            linger: 0.25
  - id: category-contract
    title: Where does a new pool go?
    visual: L4 slides into the fitted other slot. A second encoder ignores the same name and leaves
      all three bits at zero. A wider grid shows the sparse representation.
    beats:
      - say: Map L four to other. The third bit switches on. Keep those three slots in the same order
          when the model runs. A model with native categorical support can use a code as a name.
          A model that measures distance would treat that same code as a position on the number line.
        hold: 0.85
        visual_cues:
          - id: category-contract-0
            phrase: Keep those three slots in the same order
            targets:
              - category-contract-operation
            color: cyan
            linger: 0.5
          - id: feature-category-map
            phrase: Map L four to other
            targets:
              - category-contract-operation
            color: cyan
            linger: 0.45
      - say: Send L four to an encoder set to ignore unknown names. All three bits stay at zero.
          Our encoder lights up the other bit because we reserved that slot during fitting.
          You could also reject an unknown name or group it with infrequent categories.
          Use the same fitted encoder in training and serving.
        hold: 0.85
        caption_starts:
          - All three bits stay at zero
          - Our encoder lights up the other bit
        visual_cues:
          - id: category-contract-1
            phrase: All three bits stay at zero
            targets:
              - category-contract-operation
            color: cyan
            linger: 0.5
      - say: Sparse storage avoids materializing every zero, while column metadata and model parameters
          still grow with category count. Converting a wide sparse matrix to dense can be expensive.
          Indicator-based trees may need several splits to group categories, while native
          categorical splitting can group categories in one split.
        hold: 0.85
        visual_cues:
          - id: category-contract-2
            phrase: Sparse storage avoids materializing every zero, while column metadata and model parameters
              still grow with category count.
            targets:
              - category-contract-operation
            color: cyan
            linger: 0.5
  - id: crossfit-construction
    title: What happens if T8’s label flips?
    visual: All eight jobs stay visible. A second calculation admits only the four fitting jobs. Flipping T8
      updates both inputs to the full-data estimate while the held-out estimate stays in place.
    beats:
      - say: Suppose we represent each pool by the share of its jobs that missed the deadline. That is a
          target encoding. Eight jobs finished. Five missed. T eight is our only L four job, and it missed. Give the overall
          miss rate the weight of five observations. Add one miss from L four to five times five eighths,
          then divide by six. That gives eleven sixteenths. Notice how T eight helped twice, once in the L
          four count and again in the overall miss rate.
        hold: 0.85
        visual_cues:
          - id: feature-target-prior
            phrase: Five missed
            targets:
              - fold-jobs
            linger: 0.25
          - id: feature-target-full
            phrase: That gives eleven sixteenths
            targets:
              - fold-full
            linger: 0.25
      - say: Set aside T eight and the rest of its fold. Four jobs remain. Three missed, and none ran on L four.
          With no L four examples, the estimate comes entirely from those four jobs. It is three quarters.
          Suppose we correct T eight’s label from missed to on time. Which of the two estimates will move?
        hold: 2.2
        visual_cues:
          - id: fold-split
            phrase: Set aside T eight and the rest of its fold
            targets:
              - fold-jobs
            linger: 0.25
          - id: feature-fitting-prior
            phrase: Three missed, and none ran on L four
            targets:
              - fold-fit
            linger: 0.25
          - id: feature-target-held
            phrase: It is three quarters
            targets:
              - fold-fit
            linger: 0.25
      - say: Flip just that one label. The full-data calculation loses the L four miss, and its overall miss
          rate falls to four eighths. Its estimate falls to about point four one seven. The fitting four
          are exactly the same four jobs, so T eight’s held-out value stays at three quarters. Another row
          can change if its fitting fold includes T eight.
        hold: 0.9
        caption_starts:
          - The full-data calculation loses the L four miss
          - Its estimate falls to about point four one seven
          - The fitting four are exactly the same four jobs
        visual_cues:
          - id: feature-target-flip
            phrase: Flip just that one label
            targets:
              - fold-jobs
            linger: 0.25
          - id: fold-recompute
            phrase: Its estimate falls to about point four one seven
            targets:
              - fold-full
            linger: 0.25
      - say: For any pool, add its allowed miss count to the smoothing weight times the allowed prior. Divide by
          the pool’s allowed job count plus the weight. A positive weight gives an unseen pool the prior.
          With weight zero and no jobs, you need a fallback for zero divided by zero. We chose a weight
          of five. An empirical Bayes procedure would estimate its hyperparameters from data. Laplace
          add-one smoothing uses a particular prior. Cross-fitting decides which jobs count. For serving, fit the map on the
          whole allowed training set.
        hold: 0.75
        visual_cues:
          - id: fold-weight
            phrase: With weight zero and no jobs
            targets:
              - fold-fit
            linger: 0.25
  - id: matured-encoding
    title: Which outcomes can enter the pool average?
    visual: Two jobs share one runner pool. A clock moves along their score-to-outcome intervals. A nine
      o'clock artifact stays pinned while a second encoder advances to the ten o'clock arrival.
    beats:
      - say: These two jobs ran in the same pool. Follow the first job from its prediction at six to
          its outcome at eight. At seven the second job gets a prediction too. Neither result has
          arrived yet. The encoder waits for its first label. Shuffling these jobs into training folds
          could bring a later outcome into an earlier prediction.
        hold: 0.8
        caption_starts:
          - At seven the second job gets a prediction too
          - Neither result has arrived yet
        visual_cues:
          - id: mature-first
            phrase: from its prediction at six to its outcome at eight
            targets:
              - mature-history
            linger: 0.25
          - id: feature-label-seven
            phrase: Neither result has arrived yet
            targets:
              - mature-count
            linger: 0.25
      - say: Advance to nine. The first job finished on time, so it contributes a zero. The second
          result arrives at ten. How many jobs can we count in the miss rate at nine?
        hold: 2
        visual_cues:
          - id: feature-label-nine
            phrase: Advance to nine
            targets:
              - mature-history
            linger: 0.25
      - say: One outcome. Zero misses in one job gives zero. Save that version at nine. Now advance a separate,
          updating encoder to ten. The second outcome arrives exactly at the cutoff and counts as a miss.
          One miss in two jobs gives one half. The saved version still reads zero. Both jobs share one
          pool, so smoothing toward the overall rate gives the same answer.
        hold: 1.1
        caption_starts:
          - Zero misses in one job gives zero
          - Now advance a separate
          - The second outcome arrives exactly at the cutoff
          - One miss in two jobs gives one half
        visual_cues:
          - id: mature-denominator
            phrase: One outcome
            targets: [mature-count]
          - id: mature-rate
            phrase: Zero misses in one job gives zero
            targets: [mature-count]
          - id: mature-save
            phrase: Save that version at nine
            targets:
              - mature-count
            linger: 0.25
          - id: mature-advance
            phrase: advance a separate, updating encoder to ten
            targets:
              - mature-history
            linger: 0.25
          - id: feature-label-ten
            phrase: One miss in two jobs gives one half
            targets:
              - mature-count
            linger: 0.25
      - say: To reproduce the updating encoder, keep the fitting cutoff and the version used for each decision.
          Exclude related jobs when the task calls for it. In scikit-learn, fit transform cross-fits the
          training rows. Fitting once and transforming those same rows gives them the full training map.
          Its cross-fitting interface needs every row held out exactly once. A forward split that skips
          the first row misses that requirement. A dedicated forward encoder can give that first row the
          warm-up rule we used here.
        hold: 0.8
        visual_cues:
          - id: feature-splitter-requirement
            phrase: A forward split that skips the first row
            targets:
              - mature-coverage
            linger: 0.25
  - id: contract
    title: Two writers, one heartbeat
    visual: Both writers read the same 08:30 ping. One sends elapsed minutes to a slot trained on hours.
      Converting the unit restores the slot without changing the event.
    beats:
      - say: Two services read the same eight thirty heartbeat. At nine, one writes thirty and the other
          writes half. Both send a finite number. Look at the unit on the model’s slot. Which writer
          can feed this model directly?
        hold: 2
        visual_cues:
          - id: contract-compare
            phrase: one writes thirty and the other writes half
            targets:
              - contract-unit
            linger: 0.25
      - say: Writer B can. The fitted layout says hours. Divide thirty minutes by sixty. Now both services send half an hour.
          That is one part of a feature contract. It also specifies the type, the source cutoff, the
          missing-value rule, allowed categories and any clipping limit.
        hold: 0.8
        visual_cues:
          - id: contract-unit-name
            phrase: Writer B can
            targets:
              - contract-unit
            linger: 0.25
          - id: contract-convert
            phrase: Divide thirty minutes by sixty
            targets:
              - contract-unit
            linger: 0.25
      - say: Keep those rules and the slot order with the model and its fitted preprocessing. If queued minutes
          and heartbeat hours trade places, the vector keeps its length while each weight gets a different
          measurement. First check the named row before those values lose their names.
        hold: 0.8
        visual_cues:
          - id: contract-order
