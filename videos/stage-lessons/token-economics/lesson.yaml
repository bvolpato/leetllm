  - id: quality-evidence
    title: What can 1,200 reviews tell us?
    visual: The current report records 1,994 passes in 2,000 cited answers and zero unsafe hits in 1,200
      reviewed hits. One unsafe hit changes the quality verdict. A graph shows how the upper rate falls
      as independent reviews accumulate.
    beats:
      - say: Start with the report itself. It must cover this release and answer schema, with complete evidence.
          On the lab clock it can be at most an hour old, and a future timestamp fails. PolicyOps chose at
          least two thousand reviewed answers, at least a thousand reviewed cache hits, a cited-answer pass
          rate of at least ninety-nine point five percent, and zero observed unsafe hits.
        hold: 0.7
        visual_cues:
          - id: te-quality-evidence-0
            phrase: at least two thousand reviewed answers
            targets:
              - te-quality-evidence-mechanism
            color: cyan
            linger: 0.4
      - say: Reviewers accepted nineteen hundred ninety-four of two thousand cited answers. That's
          ninety-nine point seven percent. They found zero unsafe replies in twelve hundred reviewed hits.
          Now change one reviewed hit to unsafe. The release fails that requirement even with the same high
          cited-answer score. A stale report, the wrong release or too few reviewed cases can also fail it.
        hold: 0.7
        visual_cues:
          - id: te-quality-evidence-1
            phrase: change one reviewed hit to unsafe
            targets:
              - te-quality-evidence-mechanism
            color: cyan
            linger: 0.4
      - say: Return to zero unsafe replies. As the number of independent, representative reviews grows, the
          upper limit on the failure rate falls. For zero failures the approximate ninety-five-percent upper rate
          is three divided by the number reviewed. Three over twelve hundred is about a quarter of one
          percent. At that rate we'd expect about eight unsafe replies among thirty-two hundred hits. A
          single day's count can be higher. The exact one-sided upper rate is one minus point zero five
          raised to one over the sample size. Keep reviewing representative cases and difficult cases.
          Related or selectively sampled hits need a different uncertainty analysis.
        hold: 0.8
        visual_cues:
          - id: te-quality-evidence-2
            phrase: the number of independent, representative reviews grows
            targets:
              - te-quality-evidence-mechanism
            color: green
            linger: 0.4
  - id: cold-reservation
