version: 1
lesson: production-retrieval
promise: Decide whether Luna can receive a cited yes, a cited no or an abstention, and trace a wrong answer to the source, permission, comparison or release check that allowed it.
objectives:
  - id: authority
    can: Apply caller, validity and deletion predicates before payloads cross the trusted search
      boundary
    scenes:
      - versioned-evidence
      - validity-invariants
      - authorized-retrieval
      - filtering-contract
      - revocation-and-cache
  - id: lineage
    can: Resolve a child to its checked parent under one pinned bundle and measure complete context
    scenes:
      - pinned-bundle
      - child-to-parent
      - context-budget
  - id: support
    can: Check which passage a citation names, apply both inclusive limits and distinguish a supported denial from an abstention.
    scenes:
      - subject-intro
      - answer-from-evidence
      - prompt-contract
      - recorded-model-failure
      - evidence-is-data
      - release-gates
      - fresh-evidence
  - id: lifecycle
    can: Decide whether a cached draft survives a grant change, a deletion across rollback or a change to either requested age.
    scenes:
      - revocation-and-cache
      - cache-identity
      - fresh-evidence
  - id: diagnosis
    can: Distinguish ANN, candidate and context recall from generated-claim faithfulness
    scenes:
      - lexical-counterexample
      - trace-and-diagnose
      - recall-contracts
  - id: release
    can: Compute caller-visible latency, block a reply with an unsupported limit and require a complete Boolean gate report before promoting the fixture candidate.
    scenes:
      - three-paths
      - serial-latency
      - release-gates
      - tails-and-gates
sections:
  - heading: The promise the service must keep
    status: taught
    scenes:
      - subject-intro
      - three-paths
      - answer-from-evidence
  - heading: Build the evidence record
    status: taught
    scenes:
      - versioned-evidence
      - validity-invariants
  - heading: Retrieve small, cite enough context
    status: taught
    scenes:
      - child-to-parent
      - context-budget
  - heading: Put authorization before similarity
    status: taught
    scenes:
      - authorized-retrieval
      - filtering-contract
      - pinned-bundle
      - revocation-and-cache
      - cache-identity
  - heading: "Failure test: a tempting but forbidden result"
    status: taught
    scenes:
      - authorized-retrieval
      - filtering-contract
  - heading: Pack evidence for a grounded answer
    status: taught
    note: The film tries a longer appendix in the reference packer. Labels and separators count toward the 400-character source budget. The separate token example uses a toy byte tokenizer.
    scenes:
      - child-to-parent
      - context-budget
      - prompt-contract
  - heading: Answer or abstain
    status: taught
    scenes:
      - answer-from-evidence
      - recorded-model-failure
      - lexical-counterexample
      - fresh-evidence
  - heading: Recheck evidence when permission changes
    status: taught
    note: The two-source draft uses the mastery question's document-level revocation. The final rollback case uses the reference fixture's deletion of eu-access.
    scenes:
      - revocation-and-cache
      - fresh-evidence
  - heading: Record enough to investigate a request
    status: taught
    scenes:
      - trace-and-diagnose
      - cache-identity
  - heading: Budget latency by stage
    status: taught
    scenes:
      - serial-latency
      - tails-and-gates
  - heading: Use frozen cases as a release gate
    status: taught
    scenes:
      - release-gates
      - tails-and-gates
      - recall-contracts
  - heading: What to block before launch
    status: taught
    note: A harmless request to open a review ticket exercises the reviewed-text check on a permitted page.
    scenes:
      - evidence-is-data
      - release-gates
      - tails-and-gates
  - heading: Decide what the release report proves
    status: taught
    scenes:
      - tails-and-gates
  - heading: "Practice: move one boundary at a time"
    status: taught
    scenes:
      - fresh-evidence
      - answer-from-evidence
      - release-gates
      - pinned-bundle
      - tails-and-gates
