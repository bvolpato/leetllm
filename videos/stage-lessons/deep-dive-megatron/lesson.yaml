  - id: research-ownership
    title: Where Megatron’s parallel strategies came from
    visual: Paired matrix cuts, scheduling and sequence-memory reductions remain attached to their research
      contribution and implementation owner.
    beats:
      - say: The tensor-parallel paper pairs column and row cuts to avoid an unnecessary intermediate exchange. Later
          cluster work composes tensor, pipeline and data parallelism with schedules. Sequence parallelism and
          selective recomputation address activation memory and redundant work. Parallel folding gives
          attention and experts different mappings. Use each paper to predict communication, then trace the
          pinned code that performs it.
        hold: 0.7
        visual_cues:
          - id: mg-research-ownership-b0
            phrase: The tensor-parallel paper pairs column and row cuts to avoid an unnecessary intermediate exchange.
              Later cluster work composes tensor, pipeline and data parallelism with schedules. Sequence
              parallelism and selective recomputation address activation memory and redundant work. Parallel
              folding gives attention and experts different mappings. Use each paper to predict communication,
              then trace the pinned code that performs it.
            targets:
              - mg-research-ownership-mechanism
            color: cyan
            linger: 0.3
      - say: NVIDIA leads the project. If you change how a layer is partitioned, discuss the design
          with the maintainers, run the tests and sign off the contribution. When distributing the
          code, check the repository license, file-specific terms and third-party notices. The
          weights, tokenizer, datasets and any commercial product you use have their own terms.
        hold: 0.7
        visual_cues:
