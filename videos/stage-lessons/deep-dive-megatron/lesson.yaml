  - id: context
    title: Which keys can the query at six read?
    visual: >-
      Eight positions stay fixed across two context peers. The query owns four local values. Three
      remote values cross into their matching global columns. A fourth lies beyond the query and
      stays behind the causal boundary. The running sum and count change on arrival.
    beats:
      - say: >-
          Put a query at position six. It can look back and include itself. We've placed the keys on
          two workers. All allowed keys have the same score here, so each one gets an equal vote.
          The blue values live on the query's worker. They add to twenty-one. With only those four
          keys, its running average is five and a
          quarter.
        hold: 0.7
        visual_cues:
          - id: ctx-find-query
            phrase: "Put a query at position six"
            targets: [query-marker]
            linger: 0.3
            caption_boundary: true
          - id: ctx-local-sum
            phrase: "With only those four keys"
            targets: [attention-result]
            linger: 0.3
            caption_boundary: true
      - say: >-
          The other worker holds four more values. One of them is ninety. Which positions should cross
          into this query's average? Use the position numbers above the empty slots.
        hold: 2.5
        visual_cues:
          - id: ctx-remote-options
            phrase: "Which positions should cross"
            targets: [remote-values]
            linger: 0.3
            caption_boundary: true
      - say: >-
          Watch the count below the line. Bring over the two at position three. Now the four at position
          four. Finally, the two at position five. The four local keys and three
          remote keys give twenty-nine divided by seven, about four point one four. Ninety stays out.
          Position seven lies in the query's future.
        hold: 1
        visual_cues:
          - id: ctx-receive-three
            phrase: "Bring over the two at position three"
            targets: [remote-values, attention-result]
            linger: 0.3
            caption_boundary: true
          - id: ctx-receive-four
            phrase: "Now the four at position four"
            targets: [remote-values, attention-result]
            linger: 0.3
            caption_boundary: true
          - id: ctx-receive-five
            phrase: "Finally, the two at position five"
            targets: [remote-values, attention-result]
            linger: 0.3
            caption_boundary: true
          - id: ctx-full-mean
            phrase: "twenty-nine divided by seven"
            targets: [attention-result]
            linger: 0.3
            caption_boundary: true
          - id: ctx-mask
            phrase: "Position seven lies in the query's future"
            targets: [future-value]
            linger: 0.3
            caption_boundary: true
      - say: >-
          If each worker sent just its average and you gave each worker half the vote, you'd get about
          three point nine six. Look at the four blue positions and the three pink ones. With equal
          scores, the local mean needs four sevenths of the vote and the remote mean needs three
          sevenths. With unequal scores, use the softmax normalization mass of each part. Context
          parallelism changes where the keys live. Their global positions still determine which ones this
          query can read.
        hold: 1
