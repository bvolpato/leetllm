            color: cyan
            linger: 0.3
  - id: earned-return
    title: Can the new mesh resume this step?
    visual: >-
      Column six from the opening feeds a one-weight training step. The next-example cursor and
      the arithmetic stay in view above a common weight scale. Restoring velocity and then the
      data cursor changes the actual input and movement on that scale.
    beats:
      - say: >-
          Both runs start at the gold weight, one point five. It now lives on rank one. Every
          other input is zero. On the saved next example, the input to column six is two. The
          target is two. The prediction is three. For half the squared error, subtract the target
          from the prediction and multiply by the input. Each run keeps half its old velocity and
          uses a learning rate of one tenth. The uninterrupted run saved a velocity of point
          eight. The restart has zero. Where will the two weights land after one step?
        hold: 3.2
        visual_cues:
          - id: end-saved-example
            phrase: "the input to column six is two"
            targets: [stream]
            linger: 0.3
            caption_boundary: true
          - id: end-probe-result
            phrase: "The prediction is three"
            targets: [probe-output]
            linger: 0.3
            caption_boundary: true
          - id: end-gradient-rule
            phrase: "subtract the target from the prediction and multiply by the input"
            targets: [step-rule]
            linger: 0.3
            caption_boundary: true
          - id: end-history
            phrase: "saved a velocity of point eight"
            targets: [reference-lane]
            linger: 0.3
            caption_boundary: true
          - id: end-predict
            phrase: "Where will the two weights land"
            targets: [weight-scale]
            linger: 0.3
            caption_boundary: true
      - say: >-
          The two weights must agree within one thousandth to pass this check. Three minus two,
          times two, gives a gradient of two. Half the saved velocity contributes another point
          four. Move the uninterrupted weight left by point two four. One point two six is its new
          value. With the velocity reset, the restart subtracts just point two. One point three is
          the restarted weight. Both predicted three before the update. Their weights are now four
          hundredths apart. Restore the missing velocity.
        caption_starts:
          - "One point two six is its new value"
          - "One point three is the restarted weight"
        hold: 1.3
        visual_cues:
          - id: mg-fresh-gradient
            phrase: "gives a gradient of two"
            targets: [step-rule]
            linger: 0.3
            caption_boundary: true
          - id: mg-fresh-full
            phrase: "Move the uninterrupted weight left by point two four. One point two six"
            targets: [reference-lane]
            linger: 0.3
            caption_boundary: true
          - id: mg-fresh-reset
            phrase: "With the velocity reset, the restart subtracts just point two. One point three"
            targets: [candidate-lane]
            linger: 0.3
            caption_boundary: true
      - say: >-
          Start again at the saved weight. This time both runs have the right velocity. Move only the
          restart's data cursor back one example. Its input is now one and the target is still two. Will
          the restarted weight move left or right of one point five?
        hold: 2.8
        visual_cues:
          - id: mg-fresh-old-input
            phrase: "Move only the restart's data cursor back one example"
            targets: [stream]
            linger: 0.3
            caption_boundary: true
          - id: end-direction
            phrase: "left or right of one point five"
            targets: [weight-scale]
            linger: 0.3
            caption_boundary: true
      - say: >-
          On the older example the prediction is one point five, below the target. Its gradient is
          minus one half. Add the carried point four and the velocity is minus one tenth.
          Subtract that negative step. The weight moves right. One point five one is its new value.
          That's a quarter of a unit away from the reference. Advance to the saved example. Run that
          step again from the same saved weight. Both marks line up. One point two six is the next
          weight in both runs. After a reshard, comparing the next update checks the weight, the
          optimizer history and the data position together.
        caption_starts:
          - "One point five one is its new value"
          - "Both marks line up"
          - "One point two six is the next weight in both runs"
        hold: 1.6
        visual_cues:
          - id: mg-fresh-stale-result
            phrase: "The weight moves right. One point five one"
