          arithmetic excludes extra activation recomputation. A hardware-work numerator may count that
          recomputation. For a supplied toy interval, useful work forty, extra recomputation ten and capacity
          one hundred give model utilization forty percent and hardware-work utilization fifty percent.
        hold: 0.7
