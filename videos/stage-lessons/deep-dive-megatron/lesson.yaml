  - id: precision-recipes
    title: Choosing a precision recipe
    visual: An outlier raises the current maximum from four to thirty-two. The next picture groups
      operands into blocks of thirty-two, each with its own scale.
    beats:
      - say: The largest magnitude in the previous tensor was four. Look at the last value in this
          one. It jumps to thirty-two. With delayed scaling, Transformer Engine uses the preceding
          history to choose a scale. Current scaling uses the largest magnitude in this tensor, so
          it sees the jump immediately. The recipe also specifies the supported operations,
          hardware and accumulation precision.
        hold: 0.7
        visual_cues:
          - id: mg-precision-recipes-b0
            phrase: The largest magnitude in the previous tensor was four. Look at the last value in
              this one. It jumps to thirty-two. With delayed scaling, Transformer Engine uses the
              preceding history to choose a scale. Current scaling uses the largest magnitude in
              this tensor, so it sees the jump immediately. The recipe also specifies the
              supported operations, hardware and accumulation precision.
            targets:
              - mg-precision-recipes-mechanism
            color: cyan
            linger: 0.3
          - id: mg-current-amax
            phrase: Current scaling uses the largest magnitude in this tensor
            targets:
              - mg-precision-recipes-mechanism
            color: yellow
            linger: 0.3
      - say: MXFP eight uses a scale per thirty-two-value block. Each blue group gets its own scale.
          NVFP four uses smaller blocks and adds training safeguards. Both rely on compatible
          hardware and kernels. For memory planning, count the master weights, gradients and Adam
          moments at the precision the optimizer actually stores.
