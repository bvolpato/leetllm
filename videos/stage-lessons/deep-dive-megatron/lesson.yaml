            color: cyan
            linger: 0.3
      - say: If every layer slows after raising tensor degree, inspect whether those tensor peers cross a slow
          physical link. Pipeline idle lanes suggest insufficient independent microbatches or stage imbalance.
          Context stalls suggest remote-context exchange; expert tails suggest skew or dispatch congestion; a
          data-state memory win can expose reduce-scatter or all-gather tails. Change one causal input and
          keep the workload matched.
