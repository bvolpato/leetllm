  - id: fit-boundary
    title: When does training need a mesh?
    visual: A cluster-scale training need is compared with a single-device adaptation need using explicit memory
      and operational evidence.
    beats:
      - say: This stack is useful when you control a cluster and need the parallel training and recovery machinery
          enough to manage its topology. Builders and conversion paths can support new dense, MoE, multimodal
          or hybrid models, but each model needs compatible shapes and state mapping. Version skew and
          combinatorial launch choices become real debugging work.
        hold: 0.7
        visual_cues:
          - id: mg-fit-boundary-b0
            phrase: This stack is useful when you control a cluster and need the parallel training and recovery machinery
              enough to manage its topology. Builders and conversion paths can support new dense, MoE,
              multimodal or hybrid models, but each model needs compatible shapes and state mapping. Version
              skew and combinatorial launch choices become real debugging work.
            targets:
              - mg-fit-boundary-mechanism
            color: cyan
            linger: 0.3
      - say: If the model already fits on one GPU, you can iterate there without coordinating a mesh.
          When you do change the mesh, replay a fixed batch and compare its gradient or next
          update. Check token routes and global positions where they matter. Then run a short
          validation slice and test the restart. If a kernel shows a memory or synchronization
          error, investigate it with Compute Sanitizer.
        hold: 0.7
        visual_cues:
          - id: mg-fit-boundary-b1
            phrase: If the model already fits on one GPU, you can iterate there without coordinating a
              mesh. When you do change the mesh, replay a fixed batch and compare its gradient or
              next update. Check token routes and global positions where they matter. Then run a
              short validation slice and test the restart. If a kernel shows a memory or
              synchronization error, investigate it with Compute Sanitizer.
            targets:
