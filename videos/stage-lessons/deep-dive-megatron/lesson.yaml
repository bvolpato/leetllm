            targets:
              - mg-small-lattice-mechanism
            color: cyan
            linger: 0.3
          - id: mg-world-sixty-four
            phrase: multiply to sixty-four.
            targets:
              - mg-small-lattice-mechanism
            color: yellow
            linger: 0.3
  - id: mesh
    title: A rank is a coordinate in several communication groups
    visual: Sixty-four ranks occupy TP columns and DP rows inside PP and CP facets. Rank three's tensor peers,
      pipeline peer and data peers follow actual coordinate strides. The current peer coordinate and rank
      equation explain each group.
    beats:
      - say: >
          Factor this dense world into tensor shards, pipeline stages, context lanes and data replicas. Their
          product assigns every rank once. In our chosen ordering, tensor coordinates change fastest.
          Highlight rank three and follow the nearby tensor peers that cooperate on its layer arithmetic.
        hold: 0.6
        visual_cues:
          - id: mesh-rank-three-peers
            phrase: Highlight rank three and follow the nearby tensor peers that cooperate on its layer arithmetic
            targets:
              - mesh-selected-rank
              - mesh-group-peers
            color: yellow
            linger: 0.5
      - say: >
          Change the selected group to pipeline peers. The partner now has a distant global rank number
          because the pipeline coordinate changes on a larger stride. Rank numbering describes a logical
          layout. The launcher must still place those ranks on suitable devices and physical links.
        hold: 0.6
        visual_cues:
          - id: mesh-pipeline-peers
            phrase: Change the selected group to pipeline peers
            targets:
              - mesh-selected-rank
              - mesh-group-peers
            color: cyan
            linger: 0.5
          - id: mesh-pipeline-stride
            phrase: the pipeline coordinate changes on a larger stride
            targets:
              - mesh-coordinate-strides
            color: yellow
            linger: 0.5
      - say: >
          Finally highlight the data peers. They process independent examples while holding corresponding
          model shards. Each operation communicates in the group that owns its data. Context parallelism adds
          a sequence axis; sequence parallelism reuses tensor peers for selected activation work and adds no
          extra world-size factor.
        hold: 0.6
        visual_cues:
          - id: mesh-data-peers
            phrase: Finally highlight the data peers
            targets:
              - mesh-selected-rank
              - mesh-group-peers
            color: cyan
            linger: 0.5
  - id: rank-algorithm
    title: Decode a global rank and check its owning groups
    visual: Rank twenty-seven passes through remainder and integer-division operations; selected groups preserve
      its other coordinates.
    beats:
      - say: The numbering helper repeatedly takes the remainder by an axis size, then divides the remaining rank by
          that size using integer division. For rank twenty-seven, the tensor remainder is three. After
          division, context remainder is zero; data remainder is three; pipeline remainder is zero. Rebuilding
          gives three plus twenty-four, or twenty-seven.
        hold: 0.7
        visual_cues:
          - id: mg-rank-algorithm-b0
            phrase: The numbering helper repeatedly takes the remainder by an axis size, then divides the remaining rank
              by that size using integer division. For rank twenty-seven, the tensor remainder is three. After
              division, context remainder is zero; data remainder is three; pipeline remainder is zero.
              Rebuilding gives three plus twenty-four, or twenty-seven.
            targets:
              - mg-rank-algorithm-mechanism
            color: cyan
            linger: 0.3
          - id: mg-rank-rebuild
            phrase: Rebuilding gives three plus twenty-four, or twenty-seven.
            targets:
              - mg-rank-algorithm-mechanism
            color: yellow
            linger: 0.3
      - say: Its tensor group is twenty-four through twenty-seven. Its pure data group is three, eleven, nineteen and
          twenty-seven. Its pipeline partner is fifty-nine. The pinned rank generator builds groups from these
          dimensions and rejects a world that does not divide by the model-parallel product. Independent batch
          count uses pure data replicas; dense gradient ownership can include context peers.
        hold: 0.7
        visual_cues:
          - id: mg-rank-algorithm-b1
            phrase: Its tensor group is twenty-four through twenty-seven. Its pure data group is three, eleven, nineteen
              and twenty-seven. Its pipeline partner is fifty-nine. The pinned rank generator builds groups
              from these dimensions and rejects a world that does not divide by the model-parallel product.
              Independent batch count uses pure data replicas; dense gradient ownership can include context
              peers.
            targets:
              - mg-rank-algorithm-mechanism
            color: cyan
            linger: 0.3
          - id: mg-rank-tp-group
            phrase: Its tensor group is twenty-four through twenty-seven.
            targets:
              - mg-rank-algorithm-mechanism
            color: yellow
            linger: 0.3
          - id: mg-rank-dp-group
            phrase: Its pure data group is three, eleven, nineteen and twenty-seven.
            targets:
              - mg-rank-algorithm-mechanism
            color: yellow
            linger: 0.3
          - id: mg-rank-pp-group
            phrase: Its pipeline partner is fifty-nine.
            targets:
              - mg-rank-algorithm-mechanism
            color: yellow
            linger: 0.3
  - id: stored-shapes
    title: Match mathematical shards to stored weight orientation
    visual: The article H8/I16 tensor shapes transpose into actual PyTorch storage without changing channel
      ownership.
    beats:
      - say: "The article’s larger MLP uses hidden width eight, intermediate width sixteen and four tensor shards. In
          mathematical input-times-weight notation, each up shard is eight by four and each down shard is four
          by eight. The source stores linear weights as output features by input features: four by eight, then
          eight by four. The transpose preserves the same ownership."
        hold: 0.7
        visual_cues:
          - id: mg-stored-shapes-b0
            phrase: "The article’s larger MLP uses hidden width eight, intermediate width sixteen and four tensor shards.
              In mathematical input-times-weight notation, each up shard is eight by four and each down shard
              is four by eight. The source stores linear weights as output features by input features: four by
              eight, then eight by four. The transpose preserves the same ownership."
            targets:
              - mg-stored-shapes-mechanism
            color: cyan
            linger: 0.3
          - id: mg-storage-transpose
            phrase: four by eight, then eight by four.
            targets:
              - mg-stored-shapes-mechanism
            color: yellow
            linger: 0.3
      - say: The article’s standard-library tanh approximation to GeLU computes the serial eight-coordinate output,
          then sums four sharded partial vectors. Their maximum difference stays below ten to the minus twelve
          for that supplied calculation. This checks CPU decomposition with biases, dropout, sequence
          parallelism and backward omitted. Fused GPU kernels have their own rounding and tolerances.
        hold: 0.7
        visual_cues:
          - id: mg-stored-shapes-b1
            phrase: The article’s standard-library tanh approximation to GeLU computes the serial eight-coordinate output,
              then sums four sharded partial vectors. Their maximum difference stays below ten to the minus
              twelve for that supplied calculation. This checks CPU decomposition with biases, dropout,
              sequence parallelism and backward omitted. Fused GPU kernels have their own rounding and
              tolerances.
            targets:
              - mg-stored-shapes-mechanism
            color: cyan
            linger: 0.3
          - id: mg-stored-output-match
            phrase: Their maximum difference stays below ten to the minus twelve for that supplied calculation.
            targets:
              - mg-stored-shapes-mechanism
            color: yellow
            linger: 0.3
  - id: tensor
    title: Keep intermediate channels local until partial outputs combine
    visual: A two-coordinate input projects to four intermediate channels split across two ranks. Local GeLU
      produces activation shards, matching down-projection rows produce two partial outputs, and their sum
      matches the serial MLP.
    beats:
      - say: >
          Split the output channels of a feed-forward layer's first projection. Each rank receives the same
          input but owns different intermediate channels. Our small matrices calculate the four projected
          coordinates explicitly. The two highlighted groups are real channel shards, rather than independent
          data examples.
        hold: 0.6
        visual_cues:
          - id: tensor-beat-1-focus-1
            phrase: Each rank receives the same input but owns different intermediate channels
            targets:
              - tensor-up-map-row-row-slice-rank-2-rank-2-2
            color: cyan
            linger: 0.65
          - id: tensor-project-coordinates
            phrase: Our small matrices calculate the four projected coordinates explicitly
            targets:
              - tensor-up-map-row-row-slice-rank-2-rank-2-2
              - tensor-projected-coordinates
            color: yellow
            linger: 0.5
      - say: >
          Apply GeLU separately to each local coordinate. An elementwise function needs no neighboring channel
          values, so these shards can remain local. The following projection owns matching rows. Each rank
          turns its local activation slice into a partial contribution to the final output vector.
        hold: 0.6
        visual_cues:
          - id: tensor-local-gelu
            phrase: Apply GeLU separately to each local coordinate
            targets:
              - tensor-projected-coordinates
              - tensor-local-activations
            color: cyan
            linger: 0.5
          - id: tensor-matching-down-rows
            phrase: The following projection owns matching rows
            targets:
              - tensor-down-shards
            color: yellow
            linger: 0.5
          - id: tensor-build-partials
            phrase: Each rank turns its local activation slice into a partial contribution to the final output vector
            targets:
              - tensor-local-activations
              - tensor-down-shards
              - tensor-partial-vectors
            color: green
            linger: 0.5
      - say: >
          Sum the partial output vectors and compare with the serial calculation. They agree within numerical
          precision. This column-then-row structure avoids gathering intermediate channels between the
          projections. Other communication appears in backward or sequence-parallel variants, and a final
          output bias belongs after the partial sums combine.
        hold: 0.6
        visual_cues:
          - id: tensor-sum-output
            phrase: Sum the partial output vectors and compare with the serial calculation
            targets:
              - tensor-partial-vectors
              - tensor-summed-output
            color: green
            linger: 0.5
          - id: tensor-serial-match
            phrase: They agree within numerical precision
            targets:
              - tensor-summed-output
              - tensor-serial-reference
            color: green
            linger: 0.45
  - id: backward-bias
    title: Reduce input gradients and add output bias once
    visual: Two partial outputs first sum; one shared bias is added after reduction, with a visible duplicate-bias
      failure.
    beats:
      - say: In the forward pass the ranks added their partial outputs. Now trace the arrows back
          toward the input. Each column shard contributes to the gradient of that same input, so
          those input-gradient contributions must combine. With sequence parallelism,
          reduce-scatter and all-gather can take the place of some replicated reductions.
        hold: 0.7
        visual_cues:
          - id: mg-backward-bias-b0
            phrase: In the forward pass the ranks added their partial outputs. Now trace the arrows back
              toward the input. Each column shard contributes to the gradient of that same input,
              so those input-gradient contributions must combine. With sequence parallelism,
              reduce-scatter and all-gather can take the place of some replicated reductions.
            targets:
              - mg-backward-bias-mechanism
            color: cyan
            linger: 0.3
          - id: mg-backward-sum
            phrase: those input-gradient contributions must combine.
            targets:
              - mg-backward-bias-mechanism
            color: yellow
            linger: 0.3
      - say: "The two shards return one and two. They share one output bias of three. Sum the partials and add the bias once. That gives six. Add the bias on both shards and the sum jumps to nine. The extra three is a second copy of the bias. For attention, check that the query heads and key/value groups divide across the tensor ranks, or use a supported replication scheme."
        caption_starts:
          - "That gives six"
          - "the sum jumps to nine"
        hold: 0.7
        visual_cues:
          - id: mg-backward-bias-b1
            phrase: "The two shards return one and two. They share one output bias of three. Sum the partials and add the bias once. That gives six. Add the bias on both shards and the sum jumps to nine. The extra three is a second copy of the bias. For attention, check that the query heads and key/value groups divide across the tensor ranks, or use a supported replication scheme."
            targets:
              - mg-backward-bias-mechanism
            color: cyan
            linger: 0.3
          - id: mg-bias-six
            phrase: "That gives six"
            targets:
              - mg-backward-bias-mechanism
            color: yellow
            linger: 0.3
          - id: mg-bias-nine
            phrase: the sum jumps to nine
            targets:
              - mg-backward-bias-mechanism
            color: yellow
            linger: 0.3
  - id: pipeline
    title: How much work reaches each pipeline?
    visual: >-
      Numbered microbatches move through two stage lanes. Two fixed-scale schedules keep the same
      64 examples and two examples per microbatch. Each train of microbatches has an idle cell at
      either end. The shorter run ends at its own fifth tick.
    beats:
      - say: >-
          One pair of examples enters the early layers. Treat the pair as one microbatch. The late layers
          have to wait for its activation. One tick later, they take the pair and the early layers have
          nothing left to do. Those two empty slots are the pipeline bubble.
        hold: 0.8
        visual_cues:
          - id: pipe-first-stage
            phrase: "enters the early layers"
            targets: [first-wave]
            linger: 0.3
            caption_boundary: true
          - id: pipe-handoff
            phrase: "One tick later, they take the pair"
            targets: [first-wave]
            linger: 0.3
            caption_boundary: true
      - say: >-
          Now share sixty-four examples among four data replicas. Each gets sixteen examples, or eight
          pairs. Follow the numbers on one replica. As the late layers take pair one, the early layers
          start pair two. Counting across both stages, two of eighteen slots are idle. That's one ninth.
        hold: 1
        visual_cues:
          - id: pipe-eight-pairs
            phrase: "eight pairs"
            targets: [four-replicas]
            linger: 0.3
            caption_boundary: true
          - id: pipe-eight-wave
            phrase: "As the late layers take pair one, the early layers start pair two"
            targets: [four-replicas]
            linger: 0.3
            caption_boundary: true
          - id: pipe-eight-idle
            phrase: "two of eighteen slots are idle"
            targets: [four-replicas]
            linger: 0.3
            caption_boundary: true
      - say: >-
          Keep the sixty-four examples and the pair size. Double the number of data replicas to eight.
          Look at the empty schedule below the first one. How many pairs will reach each replica now, and
          what fraction of its stage slots will be idle?
        hold: 2.6
        visual_cues:
          - id: pipe-change-dp
            phrase: "Double the number of data replicas to eight"
            targets: [eight-replicas]
            linger: 0.3
            caption_boundary: true
      - say: >-
          Each replica gets eight examples, so only four pairs go through. The last pair leaves after
          five ticks. Two of ten slots are idle. One fifth of the slots now sit idle, up from one ninth,
          even though this forward wave finishes sooner. Tensor and context ranks help on the same
          examples. Only data replicas split this batch. To learn the actual step time, include backward
          work, stage imbalance and communication.
        caption_starts:
          - "One fifth of the slots"
        hold: 1.2
        visual_cues:
          - id: pipe-four-pairs
            phrase: "only four pairs go through"
            targets: [eight-replicas]
            linger: 0.3
            caption_boundary: true
          - id: pipe-short-wave
            phrase: "The last pair leaves after five ticks"
            targets: [eight-replicas]
            linger: 0.3
            caption_boundary: true
          - id: pipe-four-idle
            phrase: "Two of ten slots are idle"
            targets: [eight-replicas]
            linger: 0.3
            caption_boundary: true
  - id: microbatch-budget
    title: Derive independent microbatches before predicting a bubble
    visual: The same global examples are allocated across replicas before stage fill is constructed.
    beats:
      - say: Microbatches per replica equal global batch divided by the product of microbatch size and pure data
          degree. The article’s sixty-four examples, microbatch two and data degree four give eight. At
          sequence length two thousand forty-eight, that update contains one hundred thirty-one thousand
          seventy-two token positions before padding and loss masks. Tensor and context copies add no
          independent examples.
        hold: 0.7
        visual_cues:
          - id: mg-microbatch-budget-b0
            phrase: Microbatches per replica equal global batch divided by the product of microbatch size and pure data
              degree. The article’s sixty-four examples, microbatch two and data degree four give eight. At
              sequence length two thousand forty-eight, that update contains one hundred thirty-one thousand
              seventy-two token positions before padding and loss masks. Tensor and context copies add no
              independent examples.
            targets:
              - mg-microbatch-budget-mechanism
            color: cyan
            linger: 0.3
          - id: mg-micro-eight
            phrase: give eight.
            targets:
              - mg-microbatch-budget-mechanism
            color: yellow
            linger: 0.3
          - id: mg-token-budget
            phrase: one hundred thirty-one thousand seventy-two token positions
            targets:
              - mg-microbatch-budget-mechanism
            color: yellow
            linger: 0.3
      - say: For equal stages and a non-interleaved idealization, idle fraction is pipeline stages minus one, divided
          by the quantity microbatches plus pipeline stages minus one. Bubble time relative to useful compute
          instead divides pipeline stages minus one by microbatches. With two stages and eight microbatches
          these are one ninth and one eighth. Different denominators describe the same idealized schedule.
        hold: 0.7
        visual_cues:
          - id: mg-microbatch-budget-b1
            phrase: For equal stages and a non-interleaved idealization, idle fraction is pipeline stages minus one,
              divided by the quantity microbatches plus pipeline stages minus one. Bubble time relative to
              useful compute instead divides pipeline stages minus one by microbatches. With two stages and
              eight microbatches these are one ninth and one eighth. Different denominators describe the same
              idealized schedule.
            targets:
              - mg-microbatch-budget-mechanism
            color: cyan
            linger: 0.3
          - id: mg-bubble-ratios
