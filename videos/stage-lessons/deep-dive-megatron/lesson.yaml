scenes:
  - id: intro
    title: Four workers saved the row. Two are reloading it.
    visual: >-
      Seven weights have landed in the new shards. The gold weight leaves its saved slot and pauses
      above the last opening. Fixed column numbers and rank brackets let the viewer work out its
      new address before it lands. A single nonzero input probes the reloaded row.
    beats:
      - say: >-
          The gold weight is leaving rank three, slot zero. Four workers saved this row of weights,
          two columns each.
        hold: 0.6
        visual_cues:
          - id: intro-saved-pairs
            phrase: "Four workers saved this row of weights"
            targets: [saved-ranges]
            linger: 0.3
            caption_boundary: true
          - id: intro-find-six
            phrase: "The gold weight is leaving rank three, slot zero"
            targets: [tracked-weight]
            linger: 0.3
            caption_boundary: true
      - say: >-
          Two workers now reload four columns each. Counting from zero, which rank and slot get
          column six?
        hold: 2.6
        visual_cues:
          - id: intro-new-layout
            phrase: "Two workers now reload four columns each"
            targets: [new-ranges]
            linger: 0.3
            caption_boundary: true
          - id: intro-choose-owner
            phrase: "which rank and slot get column six"
            targets: [tracked-weight]
            linger: 0.3
            caption_boundary: true
      - say: >-
          Rank one. Its shard starts at column four. Subtract four from six. Slot two is the new
          local index. The weight is still one point five.
        caption_starts:
          - "Slot two is the new local index"
        hold: 0.9
        visual_cues:
          - id: intro-move
            phrase: "Rank one"
            targets: [tracked-weight]
            linger: 0.3
            caption_boundary: true
          - id: intro-local-index
            phrase: "Subtract four from six. Slot two is the new local index"
            targets: [new-address]
            linger: 0.3
            caption_boundary: true
      - say: >-
          Give column six an input of two and every other column zero. With no bias, both layouts
          give three. Now we can check the new layout with a single multiplication.
        hold: 0.8
        visual_cues:
          - id: intro-probe
            phrase: "Give column six an input of two and every other column zero"
            targets: [probe]
            linger: 0.3
            caption_boundary: true
          - id: intro-score
            phrase: "both layouts give three"
            targets: [probe]
            linger: 0.3
            caption_boundary: true
  - id: diagnosis
    title: Let the observed wall choose the first partition
    visual: One supplied layer and its buffers retain byte identities as width, depth, activation or routing
      pressure selects a different intervention.
    beats:
      - say: A worker that cannot store one wide matrix needs a different split from a worker waiting for a hot
          expert. Tensor parallelism divides layer channels; pipeline parallelism divides layer ranges;
          context parallelism divides sequence positions. Data replicas process independent samples. Expert
          parallelism distributes sparse networks. Selective recomputation trades stored activations for
          repeated forward arithmetic.
        hold: 0.7
        visual_cues:
          - id: mg-diagnosis-b0
            phrase: A worker that cannot store one wide matrix needs a different split from a worker waiting for a hot
              expert. Tensor parallelism divides layer channels; pipeline parallelism divides layer ranges;
              context parallelism divides sequence positions. Data replicas process independent samples.
              Expert parallelism distributes sparse networks. Selective recomputation trades stored
              activations for repeated forward arithmetic.
            targets:
              - mg-diagnosis-mechanism
            color: cyan
            linger: 0.3
      - say: Follow one sample through that choice. Its tensor shards cooperate inside layers, its activation crosses
          pipeline boundaries, and its queries may consume remote context. Data parallelism supplies other
          samples rather than shortening this sample’s path. Use the smallest supported combination that
          removes the measured wall, then inspect the new wait.
        hold: 0.7
        visual_cues:
          - id: mg-diagnosis-b1
            phrase: Follow one sample through that choice. Its tensor shards cooperate inside layers, its activation
              crosses pipeline boundaries, and its queries may consume remote context. Data parallelism
              supplies other samples rather than shortening this sample’s path. Use the smallest supported
              combination that removes the measured wall, then inspect the new wait.
            targets:
              - mg-diagnosis-mechanism
            color: cyan
            linger: 0.3
  - id: source-contract
    title: Where does Megatron build the rank map?
    visual: The pinned rank generator uses four axis sizes. Core, the reference trainer and Bridge each own a different part of the run.
    beats:
      - say: Where does a rank get its neighbors? Megatron Core builds its groups from the axis sizes
          and their order. The commit on screen is the version used for this map. Its extra weight
          rematerialization factors are set to one, so the four axes below account for the whole
          dense mesh.
        hold: 0.7
        visual_cues:
          - id: mg-source-contract-b0
            phrase: Where does a rank get its neighbors? Megatron Core builds its groups from the axis
              sizes and their order. The commit on screen is the version used for this map. Its
              extra weight rematerialization factors are set to one, so the four axes below
              account for the whole dense mesh.
            targets:
              - mg-source-contract-mechanism
            color: cyan
            linger: 0.3
      - say: If the peers look wrong, start in Core, where the layers, groups and pipeline schedules
          live. For the tokenizer, data or launch arguments, open the reference trainer. For a
          checkpoint conversion, look in Bridge. Record the versions on screen with the run so you
          can reconstruct the same setup.
        hold: 0.7
        visual_cues:
          - id: mg-source-contract-b1
            phrase: If the peers look wrong, start in Core, where the layers, groups and pipeline
              schedules live. For the tokenizer, data or launch arguments, open the reference
              trainer. For a checkpoint conversion, look in Bridge. Record the versions on screen
              with the run so you can reconstruct the same setup.
            targets:
              - mg-source-contract-mechanism
            color: cyan
            linger: 0.3
  - id: small-lattice
    title: Construct a small rank coordinate before expanding the world
    visual: Eight ranks build from two tensor cells, two data rows and two pipeline planes; rank three stays
      anchored through the sixty-four-rank expansion.
    beats:
      - say: "Begin with eight ranks: two tensor coordinates, two data coordinates and two pipeline coordinates.
          Tensor varies fastest, then data, then pipeline. Rank three is tensor one, data one, pipeline zero.
          Its tensor partner is two; its data partner is one; its pipeline partner is seven. Vary one
          coordinate while retaining the others."
        hold: 0.7
        visual_cues:
          - id: mg-small-lattice-b0
            phrase: "Begin with eight ranks: two tensor coordinates, two data coordinates and two pipeline coordinates.
              Tensor varies fastest, then data, then pipeline. Rank three is tensor one, data one, pipeline
              zero. Its tensor partner is two; its data partner is one; its pipeline partner is seven. Vary
              one coordinate while retaining the others."
            targets:
              - mg-small-lattice-mechanism
            color: cyan
            linger: 0.3
          - id: mg-small-coordinate
            phrase: Rank three is tensor one, data one, pipeline zero.
            targets:
              - mg-small-lattice-mechanism
            color: yellow
            linger: 0.3
          - id: mg-small-partners
            phrase: Its tensor partner is two; its data partner is one; its pipeline partner is seven.
            targets:
              - mg-small-lattice-mechanism
            color: yellow
            linger: 0.3
      - say: For the larger dense fixture, tensor four, context two, data four and pipeline two multiply to
          sixty-four. The chosen strides are one, four, eight and thirty-two. A global rank equals tensor
          coordinate plus four times context, plus eight times data, plus thirty-two times pipeline. Logical
          adjacency still needs a launcher placement receipt before it implies a fast physical link.
        hold: 0.7
        visual_cues:
          - id: mg-small-lattice-b1
            phrase: For the larger dense fixture, tensor four, context two, data four and pipeline two multiply to
              sixty-four. The chosen strides are one, four, eight and thirty-two. A global rank equals tensor
