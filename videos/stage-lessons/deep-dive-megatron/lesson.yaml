  - id: measured-trace
    title: Time completed work and inspect the actual blocked edge
    visual: The same fixed workload keeps enqueue, device completion, communication path and repeated timing
      window distinct.
    beats:
      - say: Freeze global examples, token positions, loss masks, microbatch, precision and code identity before
          comparing meshes. CUDA stream calls are asynchronous. A host timer around enqueue measures
          submission, not necessarily completed device work. Use compatible device-event or synchronized
          timing boundaries, warmup and repeated windows. Record memory high-water marks and the slow
          communication tail alongside step time.
        hold: 0.7
        visual_cues:
          - id: mg-measured-trace-b0
            phrase: Freeze global examples, token positions, loss masks, microbatch, precision and code identity before
              comparing meshes. CUDA stream calls are asynchronous. A host timer around enqueue measures
              submission, not necessarily completed device work. Use compatible device-event or synchronized
              timing boundaries, warmup and repeated windows. Record memory high-water marks and the slow
              communication tail alongside step time.
            targets:
              - mg-measured-trace-mechanism
            color: cyan
            linger: 0.3
          - id: mg-completed-work
            phrase: Use compatible device-event or synchronized timing boundaries
            targets:
              - mg-measured-trace-mechanism
            color: yellow
            linger: 0.3
      - say: Nsight Systems locates host gaps, streams, launches and overlapping stages. Nsight Compute examines a
          selected kernel’s memory, arithmetic and occupancy behavior. Active warps alone do not diagnose a
          link stall. NCCL operation time, algorithm bandwidth and bus bandwidth have different denominators;
          keep operation, payload and rank count beside the number.
        hold: 0.7
        visual_cues:
          - id: mg-measured-trace-b1
            phrase: Nsight Systems locates host gaps, streams, launches and overlapping stages. Nsight Compute examines a
              selected kernel’s memory, arithmetic and occupancy behavior. Active warps alone do not diagnose
              a link stall. NCCL operation time, algorithm bandwidth and bus bandwidth have different
              denominators; keep operation, payload and rank count beside the number.
            targets:
