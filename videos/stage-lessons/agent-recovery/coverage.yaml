version: 1
lesson: agent-recovery
promise: After a lost reply, use the saved key, the current permission and the controller’s observation to choose the next call and tell the operator what happened.
framing: []
objectives:
  - id: identity
    can: Read the same key after a fault on either side of commit, then decide whether to replay, query status or seek fresh approval.
    scenes:
      - subject-intro
      - recovery-transfer
      - action-boundary
      - operation-identity
      - commit-boundary
      - replay-contract
      - workflow-world
      - resume-with-evidence
  - id: budget
    can: Check a retry against the caller deadline, decide whether a fourth read is allowed from the evidence it gained, and reserve cumulative spend before dispatch.
    scenes:
      - retry-clock
      - progress-budget
      - spend-budget
      - recovery-transfer
  - id: health
    can: Trace probe slots and generation checks under cancellation and stale completions.
    scenes:
      - circuit-breaker
      - breaker-contract
  - id: claim
    can: Date a status claim, choose a permitted fallback or compensation, and count completed tasks separately from safe handoffs.
    scenes:
      - fallback-evidence
      - compensation
      - recovery-transfer
