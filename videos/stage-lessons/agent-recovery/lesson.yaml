scenes:
  - id: subject-intro
    title: The missing receipt
    visual: The agent keeps a copy of an approved request as its receipt timer expires. The saved key travels to the controller for a lookup. A replay shows where the original receipt was lost.
    beats:
      - say: This timer starts when the agent sends the approved rollback. Time runs out. The receipt is still missing.
        hold: 0.5
        visual_cues:
          - id: timeout
            phrase: Time runs out
            targets: [picture]
      - say: The agent still has its copy of the request, including the key it saved before sending. Did the controller queue the rollback?
        hold: 2.4
        visual_cues:
          - id: saved-key
            phrase: the key it saved
            targets: [picture]
          - id: ask-queue
            phrase: Did the controller queue the rollback
            targets: [picture]
      - say: Look up the saved key at the controller. It returns job one, queued. Now the agent can follow that job.
        hold: 0.65
        visual_cues:
          - id: saved-lookup
            phrase: Look up the saved key
            targets: [picture]
          - id: lookup-reply
            phrase: job one, queued
            targets: [picture]
      - say: Replay the original request. The controller saved the job and sent its receipt. In this test, we cut the connection on the way back. The lookup tells the operator that job one was queued when checked. The worker can tell us how the rollback ends.
        hold: 1
        visual_cues:
          - id: inspect-fault
            phrase: Replay the original request
            targets: [picture]
          - id: lost-receipt
            phrase: sent its receipt
            targets: [picture]
          - id: receipt-broke
            phrase: cut the connection
            targets: [picture]
          - id: queued-claim
            phrase: job one was queued when checked
            targets: [picture]
  - id: action-boundary
    title: A proposal passes through an admission check
    visual: A status-only request allows a read proposal through a policy gate while a rollback proposal is stopped before dispatch.
    beats:
      - say: Before that rollback, the operator asked how the deployment was going. The model proposes a status read. The application checks the proposal against the operator's task. A status question permits a status read, so this call goes through.
        visual_cues:
          - id: app-decides
            phrase: application checks the proposal
            targets:
              - picture
          - id: proposed-read
            phrase: model proposes a status read
            targets:
              - action-boundary-read
            color: cyan
          - id: read-authority
            phrase: status question permits a status read
            targets:
              - action-boundary-gate
              - action-boundary-allow
            color: green
        hold: 0.55
      - say: Now the model proposes a rollback. That takes a separate approval for this revision under current conditions. The tool name and arguments are valid. The approval slot is empty, so the application stops the write.
        visual_cues:
          - id: valid-request
            phrase: tool name and arguments are valid
            targets:
              - picture
          - id: no-approval
            phrase: approval slot is empty
            targets:
              - picture
