  - id: operation-identity
    title: Which identifier survives a retry?
    visual: The trace changes on the second send. The saved key and target lead back to the first job. A changed target conflicts and a substitute key creates a second job in the example.
    beats:
      - say: Rewind to the approved request. The agent saves one operation key for this rollback. Beside it goes the exact payload, including the run and target revision. That pair names the work even if the connection breaks.
        hold: 0.55
        visual_cues:
          - id: logical-key
            phrase: one operation key
            targets: [picture]
          - id: same-payload
            phrase: the exact payload
            targets: [picture]
          - id: across-attempts
            phrase: That pair names the work
            targets: [picture]
      - say: Follow the first send. Its trace identifies one trip to the controller. The job lands in the queue, but the reply gets lost. For the second send, give the trip a new trace and keep the saved key. The job ID belongs to the queue entry. We now have a name for the trip, the logical operation and the work the controller accepted.
        hold: 0.7
        visual_cues:
          - id: attempt-traces
            phrase: Follow the first send
            targets: [picture]
          - id: same-key
            phrase: For the second send
            targets: [picture]
          - id: accepted-job
            phrase: job ID belongs to the queue entry
            targets: [picture]
          - id: third-identity
            phrase: a name for the trip
            targets: [picture]
      - say: This controller checks its ledger for the key and compares the payload. Both match, so it returns the original job. Now change just the revision to eighteen. The stored target is seventeen, so the controller rejects the conflict.
        hold: 0.6
        visual_cues:
          - id: enforces
            phrase: checks its ledger
            targets: [picture]
          - id: same-key-replay
            phrase: returns the original job
            targets: [picture]
          - id: changed-target
            phrase: change just the revision to eighteen
            targets: [picture]
          - id: conflict
            phrase: rejects the conflict
            targets: [picture]
      - say: Put seventeen back. Keep the run and revision exactly as originally approved. Suppose the sender substitutes a fresh key. How many queued jobs will this controller have?
        hold: 2.1
        visual_cues:
          - id: random-key
            phrase: substitutes a fresh key
            targets: [picture]
          - id: job-count-question
            phrase: How many queued jobs
            targets: [picture]
      - say: Two. The controller creates job two because the new key has no ledger entry. Both jobs now request the same rollback. To trace another network attempt, change the trace ID and keep the operation key.
        hold: 0.75
        visual_cues:
          - id: new-job
            phrase: controller creates job two
            targets: [picture]
  - id: commit-boundary
    title: Move the fault across the commit
    visual: Two fresh database files get the same request. Move the fault across the SQLite commit, reopen both files and compare the same lookup with the paired durable rows.
    beats:
      - say: Start with an empty SQLite file. The controller keeps a ledger beside its queue. For one approved rollback it writes two rows in one transaction. One records the job. The other links its key and exact payload to that job.
        hold: 0.6
        visual_cues:
          - id: atomic-records
            phrase: a ledger beside its queue
            targets: [picture]
          - id: paired-writes
            phrase: two rows in one transaction
            targets: [picture]
          - id: binds
            phrase: links its key and exact payload
            targets: [picture]
      - say: Interrupt the first request just before commit. Both inserts roll back. Repeat in a fresh file, this time letting both rows cross the commit line. Then drop the reply. The sender still has no receipt. Only the fault position changed. Look at what survived in each file.
        hold: 0.9
        visual_cues:
          - id: before-commit-fault
            phrase: just before commit
            targets: [picture]
          - id: after-commit-fault
            phrase: both rows cross the commit line
            targets: [picture]
          - id: no-reply
            phrase: sender still has no receipt
            targets: [picture]
          - id: failure-point
            phrase: what survived in each file
            targets: [picture]
      - say: Reopen both files. Run the same lookup with the saved key against each one. What will the reopened files return?
        hold: 2.2
        visual_cues:
          - id: open-files
            phrase: Reopen both files
            targets: [picture]
          - id: predict-reads
            phrase: What will the reopened files return
            targets: [picture]
      - say: The first file returns None. Both writes were undone. The second file returns job one, queued. That establishes one queue entry. A completed rollback would need a worker result. These reads went straight to the database after each request ended. A replica that's still catching up could give an empty answer even when the primary holds the job.
        hold: 0.8
        visual_cues:
          - id: first-file
            phrase: first file returns None
            targets: [picture]
          - id: second-file
            phrase: second file returns job one
            targets: [picture]
          - id: worker-proof
            phrase: one queue entry
            targets: [picture]
  - id: retry-clock
    title: How long until the next status read?
    visual: Sample three retry delays, add the service floor to each wait and compare the third proposed start to the five-second deadline.
    beats:
      - say: The status read hit temporary overload. Give it a five-second deadline. In these first three retries the random window doubles from one second to two, then four. A cap limits how far it can grow. Full jitter samples uniformly across each window. The blue dots show other clients drawing their own waits.
        hold: 0.6
        visual_cues:
          - id: sample-full-jitter
            phrase: Full jitter samples uniformly across each window
            targets: [picture]
          - id: spread-clients
            phrase: other clients drawing their own waits
            targets: [picture]
      - say: Now the service asks each client to wait at least a second and a half. A Retry-After hint can be a delay in seconds or an HTTP date. Our policy adds the random offset after that floor so clients still spread out. By the third retry, four point seven seconds have elapsed. Add the floor and the sampled one point six seconds. When would that retry start, and would it fit?
        hold: 2.25
        visual_cues:
          - id: retry-after-floor
            phrase: wait at least a second and a half
            targets: [picture]
          - id: bounded-offset
            phrase: adds the random offset after that floor
            targets: [picture]
          - id: combined-deadline
            phrase: four point seven seconds have elapsed
            targets: [picture]
      - say: Seven point eight seconds. The five-second deadline covers the whole task. Stop before sleeping or sending again. For a write with a missing reply, use the saved key to check for an existing job before choosing whether to send again.
        hold: 0.8
        visual_cues:
          - id: read-clock
            phrase: Seven point eight seconds
            targets: [picture]
          - id: whole-deadline
            phrase: deadline covers the whole task
            targets: [picture]
          - id: stop-retry
            phrase: Stop before sleeping
            targets: [picture]
          - id: not-safe
            phrase: a write with a missing reply
            targets: [picture]
  - id: progress-budget
    title: What did the third read buy?
    visual: Hold three calls and five unused slots fixed. Change the third log page and compare the stall counter and permission to make a fourth call.
    beats:
      - say: The log reader may make eight calls in all. Two consecutive reads without new evidence stop it early. The first read brings page four. The second brings page four again. That's two calls against the budget, one distinct page, and one stall.
        hold: 0.55
        visual_cues:
          - id: useful-evidence
            phrase: first read brings page four
            targets: [picture]
          - id: repeated-page
            phrase: second brings page four again
            targets: [picture]
          - id: no-change
            phrase: one distinct page
            targets: [picture]
      - say: The third read brings page five. The verifier accepts it as new evidence for this task, so the stall counter goes back to zero. Five calls remain. New evidence resets only the stall counter.
        hold: 0.65
        visual_cues:
          - id: new-page
            phrase: third read brings page five
            targets: [picture]
          - id: finite-calls
            phrase: Five calls remain
            targets: [picture]
      - say: Keep the same three calls. Change the third result to page four again. Five slots are still empty. Would you admit call four?
        hold: 2.1
        visual_cues:
          - id: other-page
            phrase: third result to page four again
            targets: [picture]
          - id: admit-four
            phrase: Would you admit call four
            targets: [picture]
      - say: Stop here. The second stall exhausted the allowance. The hard cap still has room, but the reader keeps returning the same evidence. If the reader has no other source, hand off page four and explain why it stopped.
        hold: 0.65
        visual_cues:
          - id: second-stall
            phrase: Stop here
            targets: [picture]
      - say: The point where a run stops tells you what to do next. For a schema error, repair the proposal and check it again. For a transient read, retry within the budget. For a write that went out, use its saved key to reconcile the outcome. Each of those decisions relies on a different observation.
        hold: 0.7
        visual_cues:
          - id: schema-route
            phrase: repair the proposal
            targets: [picture]
          - id: retry-route
            phrase: For a transient read
            targets: [picture]
          - id: unknown-write-route
            phrase: For a write that went out
            targets: [picture]
          - id: separate-routes
            phrase: a different observation
            targets: [picture]
  - id: circuit-breaker
    title: A circuit breaker limits calls to an unhealthy dependency
    visual: The breaker moves from closed to open and then admits a single half-open probe; an older in-flight success cannot close a newer open generation.
    beats:
      - say: A circuit breaker watches qualifying dependency failures. In the closed state, calls proceed. After the configured threshold, it opens and rejects new calls for a cooldown instead of adding load to the failing service.
        visual_cues:
          - id: cooldown
            phrase: for a cooldown
            targets:
              - picture
          - id: closed-calls
            phrase: closed state, calls proceed
            targets:
              - circuit-breaker-readout
            color: green
          - id: failure-threshold
            phrase: After the configured threshold
            targets:
              - breaker-probe-slot
            color: pink
          - id: open-breaker
            phrase: opens and rejects new calls
            targets:
              - breaker-generation
            color: pink
        hold: 0.55
      - say: When the cooldown ends, a half-open state admits a limited probe. A healthy response can close this breaker; another qualifying failure can reopen it. Cancellation also has to release the local probe slot.
        visual_cues:
          - id: reopen
            phrase: another qualifying failure can reopen it
            targets:
              - picture
          - id: cancel-probe
            phrase: Cancellation also has to
            targets:
              - picture
          - id: cancel-release
            phrase: release the local probe slot
            targets:
              - picture
          - id: half-open-probe
            phrase: half-open state admits a limited probe
            targets:
              - breaker-probe-slot
            color: yellow
          - id: healthy-probe
            phrase: healthy response can close this breaker
            targets:
              - breaker-generation
              - breaker-probe-slot
            color: green
        hold: 0.75
      - say: Suppose an older request succeeds after a newer failure has opened the circuit. Return that result to its caller, while keeping the newer breaker state. A generation check prevents stale health evidence from replacing current state.
        visual_cues:
          - id: generation-check
            phrase: A generation check
            targets:
              - picture
          - id: older-success
            phrase: older request succeeds
            targets:
              - circuit-breaker-old
            color: blue
          - id: caller-result
            phrase: Return that result to its caller
            targets:
              - circuit-breaker-caller
            color: blue
          - id: newer-generation
            phrase: keeping the newer breaker state
            targets:
              - circuit-breaker-current
            color: pink
        hold: 0.55
  - id: resume-with-evidence
    title: Where is the job after a restart?
    visual: The pending key recovered from the checkpoint finds the controller's job. Compare its observation time with the current clock to date the report.
    beats:
      - say: The agent restarts. Its checkpoint says to wait for the rollback. It still has the operation key and the approved revision. Where can it find the job ID?
        visual_cues:
          - id: pending-identity
            phrase: the operation key
            targets: [picture]
          - id: verified-inputs
            phrase: the approved revision
            targets: [picture]
          - id: job-question
            phrase: Where can it find the job ID
            targets: [picture]
        hold: 1.8
      - say: Send the saved key to the controller. Its ledger links that key to job one. Read the status of job one. The controller saw it queued at nine hundred ninety seconds on the clock. Now the clock reads one thousand seconds. How old is that observation?
        visual_cues:
          - id: reconcile-controller
            phrase: Send the saved key to the controller
            targets: [picture]
          - id: check-state
            phrase: Read the status of job one
            targets: [picture]
          - id: current-status
            phrase: saw it queued
            targets: [picture]
          - id: observed-at
            phrase: nine hundred ninety seconds
            targets: [picture]
          - id: current-time
            phrase: one thousand seconds
            targets: [picture]
        hold: 2.1
      - say: Ten seconds have passed. Tell the operator that job one was queued ten seconds ago. Save the observation time with that report.
        visual_cues:
          - id: age
            phrase: Ten seconds have passed
            targets: [picture]
          - id: bounded-claim
            phrase: job one was queued ten seconds ago
            targets: [picture]
        hold: 0.8
  - id: replay-contract
    title: A replay contract has a scope and a lifetime
    visual: Two attempts preserve the same operation payload while expiry, changed intent and lagging status change admissible recovery.
    beats:
      - say: Reopen the SQLite file. One transaction stored the key, payload and queued job. Now two workers arrive on separate connections, both carrying the same new key. BEGIN IMMEDIATE lets one writer in at a time. The first worker creates job two. The second finds that job in the ledger and gets the same reply. Two keys, two jobs. If a writer waits too long for the lock, SQLite returns SQLITE BUSY. Keep the same key and deadline for a retry.
        hold: 1
        visual_cues:
          - id: sqlite-file
            phrase: Reopen the SQLite file
            targets:
              - picture
          - id: two-workers
            phrase: two workers arrive on separate connections
            targets:
              - picture
          - id: serialize
            phrase: BEGIN IMMEDIATE lets one writer in at a time
            targets:
              - picture
          - id: two-jobs
            phrase: Two keys, two jobs
            targets:
              - picture
          - id: busy
            phrase: SQLITE BUSY
            targets:
              - picture
          - id: shared-commit
            phrase: One transaction stored the key, payload and queued job
            targets:
              - replay-contract-mechanism
            color: yellow
          - id: shared-replay
            phrase: second finds that job in the ledger
            targets:
              - replay-contract-mechanism
            color: yellow
      - say: Before replaying a request, check the service’s key scope, payload comparison, retention window and error rules. Stripe API version one replays the first executed status and response, including a five-hundred error. Validation failures and concurrent conflicts before execution do not save that result. Keys may be pruned after at least twenty-four hours. Reusing a pruned key can create a new request. Version two instead tries to complete failed work where possible and returns an updated response. Check the API version to know which reply to expect.
        hold: 1
        visual_cues:
          - id: contract-terms
            phrase: key scope, payload comparison, retention window and error rules
            targets:
              - picture
          - id: v1-replay
            phrase: replays the first executed status and response
            targets:
              - picture
          - id: not-saved
            phrase: do not save that result
            targets:
              - picture
          - id: pruned-reuse
            phrase: reusing a pruned key can create a new request
            targets:
              - picture
          - id: v2-updated
            phrase: returns an updated response
            targets:
              - picture
          - id: v2-complete
            phrase: Version two instead tries to complete failed work
            targets:
              - picture
          - id: versioned
            phrase: Check the API version
            targets:
              - picture
          - id: retention-pruned
            phrase: Keys may be pruned after at least twenty-four hours
            targets:
              - replay-contract-mechanism
            color: yellow
      - say: Look at the primary and its replica. The primary has the job. A read from the lagging replica comes back empty. Unless the service guarantees that an empty lookup rules out an in-flight or committed job, keep the outcome unknown. Changing the target revision is a new proposal. It needs new admission. Before returning a stored result, authenticate the caller and check access to that tenant and operation.
        hold: 1
        visual_cues:
          - id: lagging-replica
            phrase: read from the lagging replica
            targets:
              - picture
          - id: keep-unknown
            phrase: keep the outcome unknown
            targets:
              - picture
          - id: new-admission
            phrase: needs new admission
            targets:
              - picture
          - id: auth-tenant
            phrase: authenticate the caller and check access
            targets:
              - picture
          - id: changed-revision
            phrase: Changing the target revision is a new proposal
            targets:
              - replay-contract-mechanism
            color: yellow
  - id: workflow-world
    title: A crash between two writes
    visual: A crash separates a committed queue entry from an empty local receipt. Follow the saved key back to that entry, then compare the persistence schedules and the two possible Activity histories.
    beats:
      - say: Rewind to just before the first send. These are two different disks. The workflow saves the key and payload on its own disk. Once that save finishes, it sends the request. The controller commits job one on the other disk. Before the workflow can save the receipt, its process crashes. After restart, which job ID can the workflow read from its own journal?
        hold: 2.4
        visual_cues:
          - id: save-key
            phrase: saves the key and payload
            targets: [picture]
          - id: dispatch
            phrase: it sends the request
            targets: [picture]
          - id: commit
            phrase: controller commits job one
            targets: [picture]
          - id: crash
            phrase: its process crashes
            targets: [picture]
          - id: own-journal
            phrase: which job ID can the workflow read from its own journal
            targets: [picture]
      - say: None. The receipt is empty. The saved key tells the worker which operation to reconcile. It also needs to check current approval and preconditions before another send. Both still hold here, and the controller still recognizes the key. Replay the unchanged request. Back comes job one. Now save that receipt. The job on the right stayed in place the whole time.
        hold: 0.85
        visual_cues:
          - id: no-receipt
            phrase: The receipt is empty
            targets: [picture]
          - id: key-survived
            phrase: The saved key
            targets: [picture]
          - id: permission
            phrase: check current approval and preconditions
            targets: [picture]
          - id: same-dispatch
            phrase: Replay the unchanged request
            targets: [picture]
          - id: same-job
            phrase: Back comes job one
            targets: [picture]
          - id: save-receipt
            phrase: save that receipt
            targets: [picture]
      - say: How do we put the key on disk in time? LangGraph saves a thread's state between graph steps, called super-steps. Use a persistent store. Put the key in an earlier step. With synchronous persistence, wait for the store to acknowledge that save. Then let the dispatch step run.
        hold: 0.55
        visual_cues:
          - id: graph
            phrase: LangGraph saves
            targets: [picture]
          - id: sync-save
            phrase: store to acknowledge that save
            targets: [picture]
          - id: sync-send
            phrase: let the dispatch step run
            targets: [picture]
      - say: Compare the other two schedules at the red crash line. In asynchronous mode the save starts, but the next step can dispatch while the write is still in flight. In exit mode the workflow can dispatch with no saved key because it skips intermediate checkpoints. The synchronous step is the one that confirmed this key was durable first. Pending writes can also preserve results from successful nodes when a sibling in the same step fails.
        hold: 0.8
        visual_cues:
          - id: async-save
            phrase: the save starts
            targets: [picture]
          - id: async-send
            phrase: dispatch while the write is still in flight
            targets: [picture]
          - id: exit-send
            phrase: dispatch with no saved key
            targets: [picture]
          - id: durable-first
            phrase: confirmed this key was durable first
            targets: [picture]
      - say: Temporal rebuilds a deterministic workflow by replaying its event history. Here are two histories for the same job. Which workflow can recover its result entirely from history?
        hold: 2.25
        visual_cues:
          - id: temporal
            phrase: Temporal rebuilds
            targets: [picture]
          - id: which-history
            phrase: Which workflow can recover its result entirely from history
            targets: [picture]
      - say: The upper history already contains the Activity's completion, so read job one from history. In the lower history the completion is missing, even though the controller accepted the job. The Activity can run again. Reusing the saved key and unchanged payload lets the controller return the original job. Two attempts can lead back to one job because the destination recognizes the operation.
        hold: 1
        visual_cues:
          - id: history-read
            phrase: read job one from history
            targets: [picture]
          - id: missing-result
            phrase: the completion is missing
            targets: [picture]
          - id: rerun
            phrase: Activity can run again
            targets: [picture]
          - id: original-job
            phrase: return the original job
            targets: [picture]
          - id: one-job
            phrase: Two attempts can lead back to one job
            targets: [picture]
  - id: spend-budget
    title: What does the run spend?
