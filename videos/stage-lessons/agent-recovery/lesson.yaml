            phrase: model proposes a rollback
            targets:
              - action-boundary-write
            color: pink
          - id: separate-approval
            phrase: a separate approval
            targets:
              - action-boundary-gate
              - action-boundary-deny
            color: yellow
        hold: 0.75
      - say: Suppose a status read is missing the run ID. The application allows one repair. Add the missing field and check the new proposal again. For the rollback, permission is missing. Ask the model twice and the approval slot stays empty.
        visual_cues:
          - id: schema-fail
            phrase: status read is missing the run ID
            targets:
