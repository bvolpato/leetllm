scenes:
  - id: intro
    title: "What does the first word decide?"
    visual: "Slide two word suggestions into a probability strip below the unfinished sentence. Lift the greedy
      choice into the first blank, then reopen both branches and compare two unfinished products."
    beats:
      - say: "Finish “The dog” with two more words, one token per blank. Ran gets sixty percent. Slept gets
          forty. If you take the likelier word, which endings disappear?"
        caption_starts:
          - "Ran gets sixty percent"
          - "Slept gets forty"
          - "If you take the likelier word"
        hold: 2.3
        visual_cues:
          - id: intro-ran
            phrase: "Ran gets sixty percent"
            targets: [dog-tree]
            linger: 0.35
          - id: intro-slept
            phrase: "Slept gets forty"
            targets: [dog-tree]
            linger: 0.35
      - say: "Ran goes in the blank. Slept drops out, along with every ending that starts with it. Taking the
          most likely token at each step is greedy decoding."
        caption_starts:
          - "Slept drops out"
          - "Taking the most likely token"
        hold: 0.8
        visual_cues:
          - id: intro-commit
            phrase: "Ran goes in the blank"
            targets: [dog-tree]
            linger: 0.35
          - id: intro-drop
            phrase: "Slept drops out"
            targets: [dog-tree]
            linger: 0.35
      - say: "Suppose you get to look one word further before you commit. After ran, home gets seventy percent.
          After slept, soundly gets ninety percent. Which pair is more likely, ran home or slept soundly?"
        caption_starts:
          - "After ran"
          - "After slept"
          - "Which pair is more likely"
        hold: 3
        visual_cues:
          - id: intro-home
            phrase: "home gets seventy percent"
            targets: [dog-tree]
            linger: 0.35
          - id: intro-soundly
            phrase: "soundly gets ninety percent"
            targets: [dog-tree]
            linger: 0.35
          - id: intro-pair
            phrase: "Which pair is more likely"
            targets: [dog-tree]
            linger: 0.35
  - id: tree
    title: "Follow each pair through the fork"
    visual: "Keep the two unfinished products from the opening in place. Draw each probability bar as its
      product is spoken. Split the ran branch while the slept bar stays fixed."
    beats:
      - say: "Ran home gets sixty percent times seventy percent. That gives it forty-two percent of all two-word
          endings. Slept soundly gets ninety percent of a smaller first share, so it gets thirty-six percent
          overall. Ran home wins this comparison."
        caption_starts:
          - "That gives it forty-two percent"
          - "Slept soundly gets ninety percent"
          - "Ran home wins this comparison"
        hold: 1
        visual_cues:
          - id: tree-home
            phrase: "forty-two percent of all two-word endings"
            targets: [dog-tree]
            linger: 0.35
          - id: tree-soundly
            phrase: "thirty-six percent overall"
            targets: [dog-tree]
            linger: 0.35
          - id: tree-original-winner
            phrase: "Ran home wins this comparison"
            targets: [dog-tree]
            linger: 0.35
      - say: "Here are the other endings. Quickly takes the rest of the ran branch. Outside takes the rest of
          the slept branch. Now suppose home has to share its seventy percent equally with a new option,
          outside. Which pair will lead after that split?"
        hold: 2.7
        visual_cues:
          - id: tree-split-question
            phrase: "home has to share its seventy percent equally with a new option, outside"
            targets: [dog-tree]
            linger: 0.35
      - say: "Keep your eye on the ran branch. Move half of home's share across to outside. Both words finish
          with thirty-five percent of the ran branch. Multiply by the same sixty percent as before. Each path
          now gets twenty-one percent overall. Slept soundly wins with the same thirty-six percent it had
          before."
        caption_starts:
          - "Both words finish with thirty-five percent"
          - "Each path now gets twenty-one percent"
          - "Slept soundly wins"
        hold: 1.2
        visual_cues:
          - id: tree-b3-1
            phrase: "Keep your eye on the ran branch"
            targets: [dog-tree]
            linger: 0.35
          - id: tree-branch-spread
            phrase: "Move half of home's share across to outside"
            targets: [dog-tree]
            linger: 0.35
          - id: tree-final-path-product
            phrase: "Both words finish with thirty-five percent of the ran branch"
            targets: [dog-tree]
            linger: 0.35
          - id: tree-split-winner
            phrase: "Slept soundly wins"
            targets: [dog-tree]
            linger: 0.35
  - id: greedy
    title: "Make one commitment at a time"
    visual: "Close the slept branch on the first greedy choice. Compare the remaining conditional probabilities,
      show the tie, and write the selected words into the sentence."
    beats:
      - say: "Now run the decoder one word at a time on that revised tree. It compares sixty with forty and
          keeps ran. Look at the second words still available. Home and outside tie for first place. Our fixed
          vocabulary order lists home first. Which sentence comes out?"
        hold: 2.2
        visual_cues:
          - id: greedy-commit
            phrase: "and keeps ran"
            targets: [dog-tree]
            linger: 0.35
          - id: greedy-tie
            phrase: "Home and outside tie for first place"
            targets: [dog-tree]
            linger: 0.35
      - say: "The dog ran home. The tie rule picks home on every replay of these same scores. Its path gets
          twenty-one percent. The decoder lost access to slept soundly when it committed to ran. How could we
          give the second word a say in the decision?"
        hold: 1.1
        visual_cues:
          - id: greedy-pick
            phrase: "The dog ran home"
            targets: [dog-tree]
            linger: 0.35
  - id: beam
    title: "Give the decoder a second place"
    visual: "Reserve two places at the first fork. Expand both prefixes, expose the five multiplication
      problems, then rank the products on one scale and retain the two winners."
    beats:
      - say: "Give the decoder two places to hold unfinished text. At the first fork, keep both ran and slept.
          Each unfinished string is a prefix. This is beam search with width two. Expand both prefixes by one
          word. Which two paths earn a place now? Use the same vocabulary order for ties."
        hold: 2.5
        visual_cues:
          - id: beam-keep
            phrase: "keep both ran and slept"
            targets: [dog-tree]
            linger: 0.35
          - id: beam-expand
            phrase: "Expand both prefixes by one word"
            targets: [dog-tree]
            linger: 0.35
      - say: "Compare the five products. Slept soundly takes first place, and ran home takes second on the tie.
          Both paths stop here because this example always ends after two words. For a longer sequence, add the
          conditional log probabilities. That gives the same ranking as multiplying the probabilities and avoids
          tiny products."
        caption_starts:
          - "Slept soundly takes first place"
          - "and ran home takes second"
        hold: 1.25
        visual_cues:
          - id: beam-products
            phrase: "Compare the five products"
            targets: [dog-tree]
            linger: 0.35
          - id: beam-frontier
            phrase: "Slept soundly takes first place, and ran home takes second on the tie"
            targets: [dog-tree]
            linger: 0.35
      - say: "Here, width two kept every first word. With three or more choices it could discard a prefix before
          seeing its best continuation. A real search also has to decide when an answer has ended. Let's try
          those decisions on a status update."
        hold: 0.7
  - id: status-model
    title: Text likelihood and observed status answer different questions
    visual: A second explicitly supplied status model replaces the dog example. Keep token identities, first-step
      values and telemetry evidence separate while constructing degraded-period and in-recovery products.
    beats:
      - say: Now use the article’s separate status assistant. After the canary status is, degraded has probability
          point four five, in has point three zero, and on has point one five. Broken has point zero two.
          Eight other tokens each carry point zero one. Each displayed word represents one token.
        hold: 0.65
        visual_cues:
          - id: dec-status-model-1
            phrase: Now use the article’s separate status assistant. After the canary status is, degraded has probability
              point four five, in has point three zero, and on has point one five. Broken has point zero two.
              Eight other tokens each carry point zero one. Each displayed word represents one token.
            targets:
              - dec-status-model-mechanism
            color: blue
            linger: 0.35
      - say: After degraded, a period has probability point four zero. After in, recovery has point nine zero. The
          path probability is the product of its conditional probabilities. Greedy therefore writes degraded,
          period, at point one eight, while in recovery scores point two seven.
        hold: 0.65
        visual_cues:
          - id: dec-status-model-2
            phrase: After degraded, a period has probability point four zero. After in, recovery has point nine zero. The
              path probability is the product of its conditional probabilities. Greedy therefore writes
              degraded, period, at point one eight, while in recovery scores point two seven.
            targets:
              - dec-status-model-mechanism
            color: blue
            linger: 0.35
          - id: dec-status-products
            phrase: Greedy therefore writes degraded, period, at point one eight, while in recovery scores point two
              seven.
            targets:
              - dec-status-model-mechanism
            color: yellow
            linger: 0.35
      - say: Those products rank text under this supplied model. The canary’s actual state comes from deployment
          telemetry. A grammar can constrain the answer’s shape, but a syntactically valid status can still
          contradict the observations. Keep the evidence check beside the selection policy.
        hold: 0.65
        visual_cues:
          - id: dec-status-model-3
            phrase: Those products rank text under this supplied model. The canary’s actual state comes from deployment
              telemetry. A grammar can constrain the answer’s shape, but a syntactically valid status can
              still contradict the observations. Keep the evidence check beside the selection policy.
            targets:
              - dec-status-model-mechanism
            color: blue
            linger: 0.35
  - id: pruned-prefix
    title: "What can a beam still reach?"
    visual: "Split each of the two retained prefix bars into ten equal children. Leave the discarded on branch
      alongside them and uncover its certain continuation. Then rank children from two new conditional rows to
      test the per-parent shortcut."
    beats:
      - say: "Keep the first-word probabilities from the status update. Width two still keeps degraded and in.
          Change what comes next. Split each of those two prefixes ten equal ways. Give the discarded word on a
          single certain continuation, track. If you could look down every branch, which two-word path would you
          find?"
        hold: 2.6
        visual_cues:
          - id: prune-split
            phrase: "Split each of those two prefixes ten equal ways"
            targets: [beam-frontier]
            linger: 0.35
          - id: prune-track
            phrase: "a single certain continuation, track"
            targets: [beam-frontier]
            linger: 0.35
      - say: "On track gets fifteen percent. Even the best surviving child gets only four and a half percent. A
          beam cannot bring back a prefix it has already discarded. Exhaustive search can find that path. In a
          branching tree the number of paths it has to examine grows exponentially with length."
        hold: 1.2
        visual_cues:
          - id: prune-result
            phrase: "On track gets fifteen percent"
            targets: [beam-frontier]
            linger: 0.35
      - say: "There is another cut we can make safely. Keep those same two parents, and give each three children
          with the new conditional probabilities shown here. Rank the path products within each row. Could the
          third child of either parent earn a place in the global top two?"
        hold: 2.5
        visual_cues:
          - id: prune-children
            phrase: "give each three children"
            targets: [beam-frontier]
            linger: 0.35
      - say: "Each third child already has two siblings ahead of it. Compare the top two children from each
          parent and you recover the global top two across this expansion. The same argument works for width B
          at equal length under cumulative log probability with a consistent tie rule. Diversity bonuses or
          separate quotas for finished answers can change the ranking. Width counts retained prefixes at a step.
          The stopping rule determines how many steps you take."
        hold: 1
        visual_cues:
          - id: prune-siblings
            phrase: "two siblings ahead of it"
            targets: [beam-frontier]
            linger: 0.35
  - id: completed-score
    title: Score the ending event and retain the stop reason
    visual: Carry the .18 and .27 prefixes into explicit EOS edges .9 and .5. Construct .162 and .135, then
      compare EOS-completed versus length-truncated records without inventing an EOS probability.
    beats:
      - say: "Our short dog tree deliberately stopped after two tokens. A real completed response also needs its
          ending event scored. Extend the two status paths with supplied EOS probabilities: point nine after
          degraded, period, and point five after in recovery. EOS means end of sequence."
        hold: 0.65
        visual_cues:
          - id: dec-completed-score-1
            phrase: "Our short dog tree deliberately stopped after two tokens. A real completed response also needs its
              ending event scored. Extend the two status paths with supplied EOS probabilities: point nine
              after degraded, period, and point five after in recovery. EOS means end of sequence."
            targets:
              - dec-completed-score-mechanism
            color: blue
            linger: 0.35
      - say: The completed products are point one six two and point one three five. Including EOS reverses the earlier
          prefix ranking. Reaching an output limit is a different event. An active prefix stopped by the limit
          has no scored EOS, even if the visible words look finished.
        hold: 0.65
        visual_cues:
          - id: dec-completed-score-2
            phrase: The completed products are point one six two and point one three five. Including EOS reverses the
              earlier prefix ranking. Reaching an output limit is a different event. An active prefix stopped
              by the limit has no scored EOS, even if the visible words look finished.
            targets:
              - dec-completed-score-mechanism
            color: blue
            linger: 0.35
          - id: dec-eos-products
            phrase: The completed products are point one six two and point one three five.
            targets:
              - dec-completed-score-mechanism
            color: yellow
            linger: 0.35
      - say: State the return contract. A complete-only decoder excludes truncated candidates. A prefix-allowed
          decoder can compare them with finished candidates under its chosen score, while retaining each stop
          reason. Appending an unscored EOS would invent a completed probability.
        hold: 0.65
        visual_cues:
          - id: dec-completed-score-3
            phrase: State the return contract. A complete-only decoder excludes truncated candidates. A prefix-allowed
              decoder can compare them with finished candidates under its chosen score, while retaining each
              stop reason. Appending an unscored EOS would invent a completed probability.
            targets:
              - dec-completed-score-mechanism
            color: blue
            linger: 0.35
  - id: length-objective
    title: Length normalization changes the search objective
    visual: Build the GNMT denominator from length and alpha, divide each negative log score, and reveal the
      ranking flip for lengths 2 and 5 only after both completed inputs are established.
    beats:
      - say: Adding conditional log probabilities avoids the underflow of long products. Every extra probability
          factor is at most one, so extending a particular prefix cannot raise its raw log score. Across
          different prefixes, though, length alone does not determine which score wins.
        hold: 0.65
        visual_cues:
          - id: dec-length-objective-1
            phrase: Adding conditional log probabilities avoids the underflow of long products. Every extra probability
              factor is at most one, so extending a particular prefix cannot raise its raw log score. Across
              different prefixes, though, length alone does not determine which score wins.
            targets:
              - dec-length-objective-mechanism
            color: blue
            linger: 0.35
      - say: GNMT divides the sequence log probability by a length penalty. Add five to the counted length, divide
          that sum by six, and raise the ratio to alpha. Our two completed examples count length two and five,
          excluding EOS, and have log scores minus one and minus one point zero eight.
        hold: 0.65
        visual_cues:
          - id: dec-length-objective-2
            phrase: GNMT divides the sequence log probability by a length penalty. Add five to the counted length, divide
              that sum by six, and raise the ratio to alpha. Our two completed examples count length two and
              five, excluding EOS, and have log scores minus one and minus one point zero eight.
            targets:
              - dec-length-objective-mechanism
            color: blue
            linger: 0.35
      - say: With alpha point six, their normalized scores are about minus point nine one one seven and minus point
          seven nine four nine. The longer candidate now wins. Alpha zero restores raw scoring. The GNMT paper
          also used a coverage penalty; its tuned experiment values are not defaults for a new task.
        hold: 0.65
        visual_cues:
          - id: dec-length-objective-3
            phrase: With alpha point six, their normalized scores are about minus point nine one one seven and minus point
              seven nine four nine. The longer candidate now wins. Alpha zero restores raw scoring. The GNMT
              paper also used a coverage penalty; its tuned experiment values are not defaults for a new task.
            targets:
              - dec-length-objective-mechanism
            color: blue
            linger: 0.35
          - id: dec-length-scores
            phrase: With alpha point six, their normalized scores are about minus point nine one one seven and minus point
              seven nine four nine.
            targets:
              - dec-length-objective-mechanism
            color: yellow
            linger: 0.35
  - id: normalized-stop
    title: A normalized prefix score can rise after extension
    visual: Update a length-one log score -1 through an actual .99 conditional and a length-two denominator. Keep
      raw and normalized trajectories on separate aligned scales.
    beats:
      - say: Length normalization also affects stopping. Start with length one and log probability minus one. With
          alpha point six, its normalized score is minus one. Append a token with conditional probability
          point nine nine. The raw log score becomes slightly more negative.
        hold: 0.65
        visual_cues:
          - id: dec-normalized-stop-1
            phrase: Length normalization also affects stopping. Start with length one and log probability minus one. With
              alpha point six, its normalized score is minus one. Append a token with conditional probability
              point nine nine. The raw log score becomes slightly more negative.
            targets:
              - dec-normalized-stop-mechanism
            color: blue
            linger: 0.35
          - id: dec-normalized-append
            phrase: Append a token with conditional probability point nine nine.
            targets:
              - dec-normalized-stop-mechanism
            color: yellow
            linger: 0.35
      - say: The length-two denominator grows enough that the normalized score improves to about minus point nine two
          one. An early-stop argument based on raw scores only falling is insufficient for this objective. Use
          a bound that matches the actual normalization and termination rules.
        hold: 0.65
        visual_cues:
          - id: dec-normalized-stop-2
            phrase: The length-two denominator grows enough that the normalized score improves to about minus point nine
              two one. An early-stop argument based on raw scores only falling is insufficient for this
              objective. Use a bound that matches the actual normalization and termination rules.
            targets:
              - dec-normalized-stop-mechanism
            color: blue
            linger: 0.35
          - id: dec-normalized-improve
            phrase: The length-two denominator grows enough that the normalized score improves to about minus point nine
              two one.
            targets:
              - dec-normalized-stop-mechanism
            color: yellow
            linger: 0.35
  - id: search-quality
    title: "What does a wider beam buy?"
    visual: "Match each task with its quality check. Build a row of 50,000 child scores per active prefix.
      Compare the eight-row batch with the work for one prefix."
    beats:
      - say: "In experiments with GPT-two, Holtzman and colleagues found that choosing high-probability text
          often produced generic or repetitive answers. Some very wide beams even preferred to end the answer
          immediately. Meister and colleagues studied how changing the search objective affected translation."
        hold: 0.65
        visual_cues:
          - id: dec-search-quality-1
            phrase: "Some very wide beams even preferred to end the answer immediately"
            targets:
              - dec-search-quality-mechanism
            color: blue
            linger: 0.35
      - say: "A translation should preserve the source meaning. A code completion should pass its tests. A
          canary update should agree with the deployment record. Widening the beam changes which prefixes
          survive. Compare the finished answers on the check that matters for your task."
        hold: 0.65
        visual_cues:
          - id: dec-search-quality-2
            phrase: "Widening the beam changes which prefixes survive"
            targets:
              - dec-search-quality-mechanism
            color: blue
            linger: 0.35
      - say: "One prefix with a vocabulary of fifty thousand gets one row of fifty thousand scores. Keep eight
          prefixes, and one step can score four hundred thousand continuations. The engine can batch those rows
          and share cached state for their common prefix. Each different suffix needs its own state. Measure the
          time for the whole step."
        hold: 0.65
        visual_cues:
          - id: dec-search-quality-3
            phrase: "Keep eight prefixes, and one step can score four hundred thousand continuations"
            targets:
              - dec-search-quality-mechanism
            color: blue
            linger: 0.35
          - id: dec-beam-work
            phrase: "four hundred thousand continuations"
            targets:
              - dec-search-quality-mechanism
            color: yellow
            linger: 0.35
  - id: temperature
    title: "Where does the same draw land?"
    visual: "Lay the five next-word probabilities end to end. Keep a supplied draw at 0.40 while the boundaries
      move with temperature. The reader can locate the word before the output appears."
    beats:
      - say: "This time the dog has five possible next words. Lay their probabilities end to end, so each word
          owns a piece of a strip from zero to one. Put a draw at point four. At temperature one, which word
          contains the draw?"
        hold: 2.6
        visual_cues:
          - id: temperature-marker
            phrase: "Put a draw at point four"
            targets: [temperature-strip]
            linger: 0.35
      - say: "Ran contains it. Its first slice reaches point four five. Cool the row to one half. To do that,
          divide the model's scores, called logits, by temperature before softmax. Here we can use the log of
          each original probability as its logit. Halving temperature squares each probability before we divide
          by the sum. Ran's slice grows."
        hold: 1
        visual_cues:
          - id: temperature-first
            phrase: "Ran contains it"
            targets: [temperature-strip]
            linger: 0.35
          - id: temperature-cool
            phrase: "Cool the row to one half"
            targets: [temperature-strip]
            linger: 0.35
      - say: "Keep the draw exactly where it is. Now warm the same original row to temperature two. Taking
          square roots grows the share for waited from five percent to almost eleven. Ran is still the most
          likely word. At temperature two, which word contains point four?"
        hold: 2.8
        visual_cues:
          - id: temperature-warm
            phrase: "warm the same original row to temperature two"
            targets: [temperature-strip]
            linger: 0.35
      - say: "Slept. The boundary moved past our mark. Temperature changed the probabilities deterministically.
          In ordinary sampling, drawing a fresh point supplies the randomness. Some decoders reserve exact zero
          for a separate greedy branch. That branch takes the largest eligible score before any division by
          temperature."
        hold: 1
        visual_cues:
          - id: temperature-second
            phrase: "Slept"
            targets: [temperature-strip]
            linger: 0.35
  - id: temperature-odds
    title: A scaled logit gap determines the relative odds
    visual: Keep a pair of logit columns and their fixed gap while the positive denominator T changes. Construct
      exp(gap/T), then separate tied eligible maxima from hard-masked entries.
    beats:
      - say: For any two eligible tokens, divide their logit gap by positive temperature, then exponentiate. That
          gives their probability ratio. A gap of two gives odds about seven point four at temperature one,
          fifty-four point six at one half, and three point eight at one point five.
        hold: 0.65
        visual_cues:
          - id: dec-temperature-odds-1
            phrase: For any two eligible tokens, divide their logit gap by positive temperature, then exponentiate. That
              gives their probability ratio. A gap of two gives odds about seven point four at temperature
              one, fifty-four point six at one half, and three point eight at one point five.
            targets:
              - dec-temperature-odds-mechanism
            color: blue
            linger: 0.35
          - id: dec-temperature-odds
            phrase: A gap of two gives odds about seven point four at temperature one, fifty-four point six at one half,
              and three point eight at one point five.
            targets:
              - dec-temperature-odds-mechanism
            color: yellow
            linger: 0.35
      - say: As positive temperature approaches zero, probability becomes uniform across exactly tied maximum logits.
          With two tied maxima, each approaches one half; a deterministic argmax tie rule can instead choose
          one. As temperature grows without bound, a fixed finite eligible set approaches a uniform
          distribution.
        hold: 0.65
        visual_cues:
          - id: dec-temperature-odds-2
            phrase: As positive temperature approaches zero, probability becomes uniform across exactly tied maximum
              logits. With two tied maxima, each approaches one half; a deterministic argmax tie rule can
              instead choose one. As temperature grows without bound, a fixed finite eligible set approaches a
              uniform distribution.
            targets:
