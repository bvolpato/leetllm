version: 1
id: reinforcement-learning
title: Choose Actions by Their Future Consequences
source: foundations/introduction-to-reinforcement-learning-fundamentals/content.md
sources:
  - title: "Reinforcement Learning: An Introduction, Sutton and Barto"
    url: https://mitpress.mit.edu/9780262039246/reinforcement-learning/
  - title: Q-learning, Watkins and Dayan
    url: https://link.springer.com/article/10.1007/BF00992698
scenes:
  - id: intro
    title: "Where should this access request go?"
    visual: "An access request slides up to a fork. Both routes stay visible as their costs and later rewards appear in two rows. The totals stay hidden for the decision."
    beats:
      - say: "This access request is missing proof. Would you ask for it or send the ticket straight to a reviewer?"
        hold: 0.6
        visual_cues:
          - id: ask-route
            phrase: "ask for it"
            targets: [picture]
          - id: review-route
            phrase: "straight to a reviewer"
            targets: [picture]
      - say: "Suppose everyone sends valid proof when asked. In our simulator, asking costs four points now. Approval with that proof earns seventy on the next step. Sending the ticket to review costs eighteen now. The reviewer verifies it and earns eighty on the next step."
        hold: 0.6
        visual_cues:
          - id: certain
            phrase: "Suppose everyone sends valid proof"
            targets: [picture]
          - id: ask-cost
            phrase: "asking costs four points now"
            targets: [picture]
          - id: ask-later
            phrase: "seventy on the next step"
            targets: [picture]
          - id: review-cost
            phrase: "costs eighteen now"
            targets: [picture]
          - id: review-later
            phrase: "eighty on the next step"
            targets: [picture]
      - say: "Each point earned one step later counts for nine tenths of a point now. Review earns more at the end, but it also costs more up front. Which first move earns the larger return?"
        hold: 2.6
        visual_cues:
          - id: discount
            phrase: "nine tenths of a point"
            targets: [picture]
          - id: decide
            phrase: "Which first move earns the larger return"
            targets: [picture]
  - id: episode
    title: "What each route is worth at nine"
    visual: "Copies of the later rewards move back to the desk at their discounted values. The two immediate costs complete the totals on the same request slip."
    beats:
      - say: "Bring the seventy points back one step. At nine o’clock they’re worth sixty-three. Pay the four-point cost of asking, and the evidence route comes to fifty-nine."
        caption_starts:
          - "At nine o’clock"
          - "and the evidence route comes to fifty-nine"
        hold: 0.55
        visual_cues:
          - id: ask-back
            phrase: "Bring the seventy points back one step"
            targets: [picture]
          - id: ask-now
            phrase: "worth sixty-three"
            targets: [picture]
          - id: ask-total
            phrase: "comes to fifty-nine"
            targets: [picture]
      - say: "Do the same for the reviewer’s eighty. Its value at the desk is seventy-two. The eighteen-point cost brings the return to fifty-four."
        caption_starts:
          - "Its value at the desk"
          - "The eighteen-point cost"
        hold: 0.7
        visual_cues:
          - id: review-back
            phrase: "Do the same for the reviewer’s eighty"
            targets: [picture]
          - id: review-now
            phrase: "is seventy-two"
            targets: [picture]
          - id: review-total
            phrase: "brings the return to fifty-four"
            targets: [picture]
      - say: "Ask for evidence. Review has the larger final reward, but its extra handling cost outweighs that difference. In the simulator, approving right away closes this ticket without proof and earns minus one hundred twenty. P seven blocks that action at the real desk."
        hold: 0.6
        visual_cues:
          - id: choose
            phrase: "Ask for evidence"
            targets: [picture]
          - id: unsafe
            phrase: "earns minus one hundred twenty"
            targets: [picture]
      - say: "From a new ticket to a closed one, that sequence of decisions and rewards is an episode. Its return adds the rewards, counting a reward two steps away with two factors of the discount. Reinforcement learning uses experience of those consequences to choose actions. Predicting a label on a finished ticket leaves an open question here. What would we learn if we asked for proof?"
        hold: 0.8
        visual_cues:
          - id: return-rule
            phrase: "counting a reward two steps away"
            targets: [picture]
      - say: "These tickets all close in a few steps, so even an undiscounted sum is finite. For a continuing task with bounded rewards and a discount below one, the geometric sum on screen bounds the size of the return. Here we discount per step. A step might take a minute or an hour. That timing downweights later penalties, too. If waiting makes people leave, we need to include that outcome and its cost."
        hold: 0.8
        visual_cues:
          - id: bound
            phrase: "the geometric sum on screen"
            targets: [picture]
          - id: wait
            phrase: "If waiting makes people leave"
            targets: [picture]
  - id: mdp
    title: "What did the desk know?"
    visual: "A receipt turns a new request into a verified one. Two requests at the same stage then expose the missing elapsed-time field."
    beats:
      - say: "Try the same action on either side of verification. Approve a new request with no proof, and P seven blocks it. Approve after verification, and the ticket can close safely. That single field changes what approval can do. It belongs in the state the router sees."
        hold: 0.55
        visual_cues:
          - id: different-state
            phrase: "Approve after verification"
            targets: [picture]
      - say: "Suppose this ticket has waited forty-five seconds. If waiting makes people more likely to leave, include elapsed time too. Given a state and an action, ask whether any earlier detail would change the distribution of the next state or reward. If the state already captures everything that matters for that prediction, it has the Markov property."
        hold: 0.55
        visual_cues:
          - id: wait-field
            phrase: "include elapsed time too"
            targets: [picture]
          - id: markov
            phrase: "the Markov property"
            targets: [picture]
      - say: "The router is the agent. It asks for proof. The requester and verifier are part of its environment. Now receipt E seventeen comes back. It records verified proof, a cost of four points, and twenty more seconds on the clock. That’s one transition. The states, available actions, transition probabilities, rewards and discount together specify a Markov decision process."
        hold: 0.6
        visual_cues:
          - id: agent-action
            phrase: "It asks for proof"
            targets: [picture]
          - id: observation
            phrase: "Now receipt E seventeen comes back"
            targets: [picture]
      - say: "Compare two new tickets again. Both still lack proof. One has waited forty-five seconds and the other sixty-five. If their chances of leaving differ, the label new hides something the router needs. Keep the elapsed time, or use enough history to infer the missing state. If the agent only ever sees part of the environment, it can use a belief over possible states. The environment itself hasn’t changed."
        hold: 0.9
        visual_cues:
          - id: counterexample
            phrase: "Compare two new tickets again"
            targets: [picture]
          - id: partial
            phrase: "the label new hides something the router needs"
            targets: [picture]
  - id: bellman
    title: "Work backward from the next state"
    visual: "Rewards and successor values travel back along the request graph. The comparison switches from a new ticket to a verified ticket."
    beats:
      - say: "The router’s policy chooses which move to propose. P seven separately governs what may execute. The router can choose a single action or draw one at random. A state value asks what return you expect if you start there and follow that policy. An action value fixes the first move and then follows the policy. To plan the best route, let the later decisions be the best available too."
        hold: 0.6
        visual_cues:
          - id: value
            phrase: "A state value asks"
            targets: [picture]
      - say: "Start with the new ticket. In our simulator, immediate unsupported approval costs one hundred twenty. Requesting evidence brings back fifty-nine points after the cost of asking. Sending it to review brings back fifty-four. The largest return tells the desk which opening move to make. Request evidence."
        caption_starts:
          - "Request evidence"
        hold: 0.65
        visual_cues:
          - id: approve-value
            phrase: "immediate unsupported approval costs one hundred twenty"
            targets: [picture]
          - id: evidence-backup
            phrase: "Requesting evidence"
            targets: [picture]
          - id: evidence-value
            phrase: "brings back fifty-nine points"
            targets: [picture]
          - id: review-backup
            phrase: "Sending it to review"
            targets: [picture]
          - id: review-value
            phrase: "brings back fifty-four"
            targets: [picture]
          - id: greedy
            phrase: "Request evidence"
            targets: [picture]
      - say: "Move the decision forward one step. The evidence has been verified. Approval now earns seventy immediately. Asking a human to check that proof costs another ten before the reviewer can earn eighty. Discount the eighty, then subtract the ten. The review route is worth sixty-two. That’s where the value of seventy at the verified state came from."
        caption_starts:
          - "The review route is worth sixty-two"
        hold: 0.65
        visual_cues:
          - id: successor
            phrase: "Move the decision forward one step"
            targets: [picture]
          - id: supported-approval
            phrase: "Approval now earns seventy immediately"
            targets: [picture]
          - id: successor-result
            phrase: "The review route is worth sixty-two"
            targets: [picture]
      - say: "Using successor values to update an earlier value is a Bellman backup. For a fixed policy, average over its action probabilities and the possible outcomes of each action. For an optimal backup, average the outcomes for each action first, then take the best action. A closed ticket contributes zero future value. The reward for closing it was paid on the way in."
        hold: 0.8
        visual_cues:
          - id: policy
            phrase: "For a fixed policy"
            targets: [picture]
          - id: terminal
            phrase: "A closed ticket contributes zero future value"
            targets: [picture]
  - id: value-iteration
    title: "How many sweeps reach the desk?"
    visual: "Synchronous sweeps carry successor values back one step at a time. A separate policy-iteration calculation first evaluates the review rule and then changes the first action."
    beats:
      - say: "Suppose the desk knows the transitions and rewards, but every state value starts at zero. On the first sweep, read only those old zeros. At the new ticket the best immediate score is the four-point cost of asking, so its value is minus four."
        hold: 0.65
        visual_cues:
          - id: zero
            phrase: "every state value starts at zero"
            targets: [picture]
          - id: first
            phrase: "On the first sweep"
            targets: [picture]
          - id: immediate
            phrase: "its value is minus four"
            targets: [picture]
      - say: "That first sweep also writes seventy for verified evidence and eighty for the review queue. On the second sweep, bring those entries back to the desk. Asking becomes fifty-nine, and direct review becomes fifty-four. Asking still wins. This time the desk can see the reward beyond its first move."
        hold: 0.6
        visual_cues:
          - id: successors
            phrase: "seventy for verified evidence and eighty for the review queue"
            targets: [picture]
          - id: second
            phrase: "On the second sweep"
            targets: [picture]
          - id: backward
            phrase: "bring those entries back to the desk"
            targets: [picture]
          - id: updated
            phrase: "Asking becomes fifty-nine"
            targets: [picture]
          - id: review-result
            phrase: "direct review becomes fifty-four"
            targets: [picture]
          - id: best
            phrase: "Asking still wins"
            targets: [picture]
      - say: "A third sweep leaves these values in place. This is value iteration. In a finite model with bounded rewards and a discount below one, exact optimality backups converge from any finite starting values. Each sweep shrinks the largest possible error by a factor no greater than the discount. The optimal value is unique, though several actions can tie for it."
        hold: 0.65
        visual_cues:
          - id: stable
            phrase: "A third sweep leaves these values in place"
            targets: [picture]
          - id: converges
            phrase: "exact optimality backups converge"
            targets: [picture]
          - id: contract
            phrase: "shrinks the largest possible error"
            targets: [picture]
      - say: "Now try policy iteration. Give the desk a fixed rule. Send a new ticket to review, approve a verified ticket, and let the reviewer finish any queued ticket. Evaluating that rule gives the new ticket a value of fifty-four. Only then ask whether changing the first move helps. Asking for evidence gives fifty-nine, so switch the opening action. Exact evaluation and greedy improvement with consistent tie handling eventually settle on an optimal rule in this finite discounted model. Approximate evaluation needs its own error check."
        caption_starts:
          - "Evaluating that rule"
          - "Asking for evidence gives fifty-nine"
        hold: 0.8
        visual_cues:
          - id: policy-iteration
            phrase: "Now try policy iteration"
            targets: [picture]
          - id: evaluate
            phrase: "a value of fifty-four"
            targets: [picture]
          - id: improve
            phrase: "so switch the opening action"
            targets: [picture]
  - id: uncertain-transition
    title: "When the requester walks away"
    visual: "One hundred marks show the probability mass of the evidence request. A quarter switches to an abandoned outcome. A return ruler keeps direct review fixed at 54 as the evidence mean moves to the tie."
    beats:
      - say: "Until now, everyone sent proof. These hundred marks show that assumption. Each stands for one percent of the possible outcomes of asking. A green mark is a reply with verified proof, worth fifty-nine points over the route. Direct review is still worth fifty-four."
        hold: 0.6
        visual_cues:
          - id: certain
            phrase: "Each stands for one percent"
            targets: [picture]
          - id: review-line
            phrase: "Direct review is still worth fifty-four"
            targets: [picture]
      - say: "Change just the chance of a reply. Suppose one in four requesters leaves. We still spend four points asking. Closing the ticket unresolved costs another fifty on that same step. Each abandoned route therefore returns minus fifty-four."
        caption_starts:
          - "Each abandoned route"
        hold: 0.6
        visual_cues:
          - id: quarter
            phrase: "one in four requesters leaves"
            targets: [picture]
          - id: costs
            phrase: "costs another fifty on that same step"
            targets: [picture]
          - id: abandoned
            phrase: "returns minus fifty-four"
            targets: [picture]
      - say: "Seventy-five parts of the hundred earn fifty-nine each. The other twenty-five earn minus fifty-four each. If you had to route the next ticket before seeing its outcome, would you ask or send it to review?"
        hold: 2.55
        visual_cues:
          - id: weigh
            phrase: "The other twenty-five earn minus fifty-four each"
            targets: [picture]
          - id: predict
            phrase: "would you ask or send it to review"
            targets: [picture]
      - say: "The evidence route averages thirty point seven five. Send the ticket to review. One request can earn fifty-nine or minus fifty-four. Thirty point seven five is the weighted mean across possible requests. An actual batch of a hundred can have a different mix."
        caption_starts:
          - "Send the ticket to review"
        hold: 0.7
        visual_cues:
          - id: mean
            phrase: "averages thirty point seven five"
            targets: [picture]
          - id: winner
            phrase: "Send the ticket to review"
            targets: [picture]
      - say: "Watch the green marker as we lower the abandonment chance. Each time one percentage point switches from abandonment back to a reply, it replaces minus fifty-four with fifty-nine. That gains one hundred thirteen points per hundred requests, or one point one three in the mean. Review stays put."
        hold: 0.55
        visual_cues:
          - id: sweep
            phrase: "as we lower the abandonment chance"
            targets: [picture]
          - id: gain
            phrase: "one point one three in the mean"
            targets: [picture]
      - say: "At zero abandonment, asking leads review by five. If p is the fraction who leave, asking loses one hundred thirteen times p. The lead disappears when p is five divided by one hundred thirteen, about four point four two percent. Below that point ask for evidence. Above it choose review. The cutoff depends on the costs and on when we charge them. To use it on real tickets, we’d need to measure how often requesters actually reply."
        hold: 0.85
        visual_cues:
          - id: lead
            phrase: "asking leads review by five"
            targets: [picture]
          - id: equation
            phrase: "asking loses one hundred thirteen times p"
            targets: [picture]
          - id: tie
            phrase: "about four point four two percent"
            targets: [picture]
          - id: regions
            phrase: "Above it choose review"
            targets: [picture]
  - id: q-learning
    title: "What does one observed reply change?"
    visual: "One observed reply moves the evidence action's table entry halfway toward its greedy target. The two other opening estimates stay at zero."
    beats:
      - say: "Suppose we don’t know the chance of a reply. We could estimate a transition model. Or we could update an action value directly from experience. Here’s one transition record. This ticket was new, we asked for proof, paid four points and received verified evidence. That row tells us what happened once."
        hold: 0.55
        visual_cues:
          - id: record
            phrase: "Here’s one transition record"
            targets: [picture]
          - id: sample
            phrase: "paid four points and received verified evidence"
            targets: [picture]
      - say: "Look at the entry for asking on a new ticket. It starts at zero. Our best estimated next action at the verified state is worth seventy. Discount it by point nine and subtract the four points we spent. The target is fifty-nine. With a step size of one half, how far does the entry move?"
        caption_starts:
          - "The target is fifty-nine"
        hold: 2.1
        visual_cues:
          - id: target-rule
            phrase: "Discount it by point nine"
            targets: [picture]
          - id: target
            phrase: "The target is fifty-nine"
            targets: [picture]
          - id: ask-step
            phrase: "how far does the entry move"
            targets: [picture]
      - say: "Twenty-nine point five. Only the cell for asking changed. Approval and review still have their old estimates. This is a Q-learning update. It uses the best estimated next action even when the router that supplies the data explores. For tabular values to converge, the learner needs repeated visits and suitable step sizes in a stationary finite model with bounded rewards and a discount below one. A neural network shares weights across estimates, so one update can change several action values."
        hold: 0.85
        visual_cues:
          - id: half
            phrase: "Twenty-nine point five"
            targets: [picture]
          - id: one-cell
            phrase: "Only the cell for asking changed"
            targets: [picture]
          - id: off-policy
            phrase: "the best estimated next action"
            targets: [picture]
  - id: td-targets
    title: "Which future belongs in the update?"
    visual: "A receipt for one observed ask is replayed before and after closure. Two next-action estimates travel into distinct target slots. Two more records stop at the same cost, but only one has a continuing review queue."
    beats:
      - say: "Here’s one ticket that did get a reply. We paid four points to ask. At the evidence-ready state, put a finger over the rest of the record. Suppose our current estimate of the future under this policy is fifty. What target can we form right now?"
        hold: 2.1
        visual_cues:
          - id: paid
            phrase: "We paid four points to ask"
            targets: [picture]
          - id: estimate
            phrase: "our current estimate of the future under this policy is fifty"
            targets: [picture]
          - id: predict-td
            phrase: "What target can we form right now"
            targets: [picture]
      - say: "Minus four plus nine tenths of fifty gives forty-one. That’s a one-step temporal difference target. Now uncover what actually happened. This ticket closed with a verified approval worth seventy. Its observed discounted return was fifty-nine. Monte Carlo uses that completed return."
        caption_starts:
          - "Now uncover what actually happened"
          - "Its observed discounted return"
        hold: 0.6
        visual_cues:
          - id: td-answer
            phrase: "gives forty-one"
            targets: [picture]
          - id: uncover
            phrase: "Now uncover what actually happened"
            targets: [picture]
          - id: recorded
            phrase: "a verified approval worth seventy"
            targets: [picture]
          - id: mc-answer
            phrase: "return was fifty-nine"
            targets: [picture]
      - say: "Across complete episodes sampled from a fixed policy, Monte Carlo has the right average target for that policy. It also picks up all the later randomness. Using the exact conditional mean for the tail removes that source of variation. Using an estimate lets us update sooner, but a bad estimate can bias the target. On this ticket, the estimate was fifty and the observed reward was seventy."
        hold: 0.6
        visual_cues:
          - id: compare
            phrase: "the estimate was fifty and the observed reward was seventy"
            targets: [picture]
      - say: "Replay the moment just after the same four-point cost. This time we have estimates for each next action. Approving with proof is worth seventy. Sending the verified request on for review is worth sixty-two. One update follows the action the router actually selects. That rule is called SARSA. The exploratory router picks review. Which next-action value goes into the SARSA target?"
        hold: 2.45
        visual_cues:
