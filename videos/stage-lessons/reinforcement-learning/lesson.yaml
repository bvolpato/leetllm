      - say: "Zero for every token. Each reward equals the group mean, so each numerator is zero. The reference penalty can still contribute an update. These scores compare sampled replies within a group. They include each reply in its own baseline and scale it by that group’s spread. They differ from the exact advantage of an action at a state. The weight given to long replies also affects the training objective. Dropping the critic saves its resources. Generating more replies, or longer ones, still takes work. Check performance on held-out tasks before trusting a higher training score."
