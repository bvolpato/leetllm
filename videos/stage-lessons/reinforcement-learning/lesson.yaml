  - id: llm-policy
    title: "What did each token earn?"
    visual: "A proposed token appends to a prefix. Three completions receive group-relative scores. On a replay the verifier gives all three the same reward and the viewer predicts the score that reaches each token."
    beats:
      - say: "Turn the route into text. For this first token, give our toy model the same three probabilities as the router. The prompt names the ticket. The model can start its reply with a token such as Request. That next token is the action. Append it to the prefix and you have the next state. An end token can stop generation, and a preference model or a verifier can score the finished reply. A tool-using agent also acts on the outside world and receives observations from it."
        hold: 0.65
        visual_cues:
          - id: tokens
            phrase: "a token such as Request"
            targets: [picture]
          - id: append
            phrase: "Append it to the prefix"
            targets: [picture]
      - say: "In classical preference training with PPO, the actor generates the reply. The critic estimates the value of a partial reply. The reward model scores the completion. A frozen reference supplies the comparison for a divergence penalty. For the update ratio, divide the token’s new probability by its probability under the rollout policy that sampled the tokens. Give this token an advantage of one and set the upper clip at one point two. Raise the ratio to one point four. The clipped score stays at one point two. The policy can still move farther, so measure its divergence and its return after the update."
        caption_starts:
          - "Raise the ratio"
          - "The clipped score stays"
        hold: 0.65
        visual_cues:
