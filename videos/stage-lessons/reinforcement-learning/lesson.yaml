  - id: exploration
    title: "Which actions did the router try?"
    visual: "A named episode passes through an exploration draw and a uniform action draw. Eight proposals accumulate by action so a proposed unsafe move can be distinguished from an executed learning visit."
    beats:
      - say: "Freeze a table in which asking has the highest estimated value. Most of the time the router takes that move. One time in five, on average, it explores. Follow episode E zero two. The first draw is point zero nine, below the one-fifth cutoff. The second draw is point nine one. It lands in the last of three equal slots, so this episode proposes human review. This mixture of the best current move and a random draw is called epsilon-greedy. Epsilon is the chance of exploring. Every proposal still goes through the authorization gate."
        hold: 0.55
        visual_cues:
          - id: epsilon
            phrase: "One time in five"
            targets: [picture]
          - id: explore
            phrase: "The first draw is point zero nine"
            targets: [picture]
          - id: uniform
            phrase: "The second draw is point nine one"
            targets: [picture]
          - id: proposal
            phrase: "this episode proposes human review"
            targets: [picture]
          - id: gate
            phrase: "the authorization gate"
            targets: [picture]
      - say: "Replay eight simulator tickets with those estimates fixed. Each ticket goes into the bin for the action it proposes. Six ask for proof. One goes to review. Look at the ticket in the approval bin. With no proof, a live gate would reject it and route to a reviewer. Count that as a proposal to approve. Only the executed action supplies an observed outcome."
        hold: 0.6
        visual_cues:
          - id: episodes
            phrase: "Replay eight simulator tickets"
            targets: [picture]
          - id: unsafe
            phrase: "a live gate would reject it"
            targets: [picture]
      - say: "Eight proposals are a small sample. Tabular Q-learning’s convergence result needs every state-action pair updated infinitely often. For each pair, its visit-indexed learning rates must sum to infinity while their squares sum to a finite number. One more detail about these odds. Asking can also win the uniform draw. Its probability is point eight plus one fifth of one third, about eighty-seven percent."
        hold: 0.8
        visual_cues:
          - id: convergence
            phrase: "every state-action pair updated infinitely often"
            targets: [picture]
          - id: greedy-odds
            phrase: "Its probability is point eight"
            targets: [picture]
          - id: probability
            phrase: "about eighty-seven percent"
            targets: [picture]
  - id: policy-gradient
    title: "How should the policy change its odds?"
    visual: "A two-step payoff supplies a time-weighted derivative. A table pairs each baseline with its gradient variance. The opening action probabilities then move by one exact logit update."
    beats:
      - say: "Suppose the router gives each action a probability. After a good episode, we can adjust the parameters that set those odds. REINFORCE weights the gradient of each chosen action’s log probability by its reward-to-go, the discounted return from that action onward. For an objective measured from the start of the episode, also discount back to the start. Sum those contributions along the episode and average over sampled episodes. This calculation assumes a fixed starting distribution and environment dynamics that do not depend directly on those parameters."
        hold: 0.55
        visual_cues:
          - id: reinforce
            phrase: "weights the gradient of each chosen action’s log probability"
            targets: [picture]
      - say: "Take just two steps. The first is fixed. On the second, a coin with adjustable odds pays one on heads and zero on tails. At logit zero the coin is fair. The probability of heads changes at a rate of one quarter per unit of logit there. The reward arrives one step from the start. With our discount, the objective’s derivative is point two two five. Drop that time weight and you get point two five."
        hold: 0.65
        visual_cues:
          - id: bernoulli
            phrase: "a coin with adjustable odds"
            targets: [picture]
          - id: derivative
            phrase: "the objective’s derivative is point two two five"
            targets: [picture]
          - id: wrong
            phrase: "you get point two five"
            targets: [picture]
