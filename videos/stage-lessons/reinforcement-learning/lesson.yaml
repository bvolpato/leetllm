            targets: [picture]
          - id: old-policy
            phrase: "the rollout policy that sampled the tokens"
            targets: [picture]
          - id: clip-limit
            phrase: "set the upper clip at one point two"
            targets: [picture]
          - id: clip-ratio
            phrase: "Raise the ratio to one point four"
            targets: [picture]
          - id: clip-score
            phrase: "The clipped score stays at one point two"
            targets: [picture]
      - say: "Now generate three replies to the same prompt. In the original group-relative method, called GRPO, their scores supply a comparison in place of a trained critic. Our verifier gives Approve access zero points. Request evidence earns one. Review this request earns two. Subtract the group mean of one. Divide by the population standard deviation, about zero point eight two, plus a tiny positive stabilizer. The reply worth two ends up about one point two two five above the mean in these units."
        hold: 0.6
        visual_cues:
          - id: group
            phrase: "generate three replies to the same prompt"
            targets: [picture]
          - id: reward-approve
            phrase: "Approve access zero points"
            targets: [picture]
          - id: reward-proof
            phrase: "Request evidence earns one"
            targets: [picture]
