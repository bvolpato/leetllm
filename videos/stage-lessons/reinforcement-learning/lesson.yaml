      - say: "Keep the queued ticket’s eighty. Its target is fifty-four. The closed ticket has no future, so its target is minus eighteen. When a recording times out, use the last observation from that ticket. A reset gives you a different ticket. If the task itself has a deadline, reaching it ends the episode. Include the time left in the state when it changes the decision."
