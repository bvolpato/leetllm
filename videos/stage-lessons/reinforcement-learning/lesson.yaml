            targets: [picture]
      - say: "Follow that score back to the words that produced it. Under the original outcome-supervised recipe, every token in the last reply receives that same positive score. The tokens in the first reply all get the negative score. The update uses a clipped token ratio and a separate penalty for diverging from the reference policy."
        hold: 0.6
        visual_cues:
          - id: token-score
            phrase: "every token in the last reply receives that same positive score"
            targets: [picture]
      - say: "Try the verifier again. This time every reply earns one. Keep the positive stabilizer. What normalized reward score reaches each token now?"
