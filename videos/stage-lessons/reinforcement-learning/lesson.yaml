      - say: "Sixty-two. The router picked review. With the four-point cost and the discount, the SARSA target is fifty-one point eight. That’s on-policy learning. Q-learning takes the higher estimate, seventy. Its target stays fifty-nine even when the router takes the other action. That’s what makes this update off-policy."
