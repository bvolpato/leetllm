scenes:
  - id: intro
    title: One gradient descent step
    visual: Two weights sit at one on a steep blue curve and a shallow green curve. Their rulers share a
      scale. A single update draws two very different distances from the starting marks.
    beats:
      - say: Watch both weights take one step. Blue shoots past zero. Green barely moves. They started at
          one and used the same learning rate. What made blue travel a hundred times as far?
        hold: 1.8
        caption_starts:
          - Blue shoots past zero
          - Green barely moves
          - What made blue travel
        visual_cues:
          - id: opening-step
            phrase: take one step
            targets:
              - opening-tracks
            linger: 0.24
          - id: opening-wall
            phrase: Blue shoots past zero
            targets:
              - opening-wall
            linger: 0.24
          - id: opening-floor
            phrase: Green barely moves
            targets:
              - opening-floor
            linger: 0.24
          - id: opening-rate
            phrase: They started at one and used the same learning rate
            caption_boundary: true
            targets:
              - opening-question
            linger: 0.24
  - id: first-step
    title: One rate on two slopes
    visual: The opening curves rewind to show the slopes and replay the update. The picture then puts the
      two coordinates on one map and takes the second step.
    beats:
      - say: Back at one, the height of each curve shows its contribution to the loss. The yellow lines
          show the slopes. Blue has a slope of a hundred. Multiply by the learning rate, point zero one
          eight, and we subtract one point eight. Green has a slope of one, so we subtract just point
          zero one eight.
        hold: 0.35
        visual_cues:
          - id: multiply-gradient
            phrase: Multiply by the learning rate, point zero one eight, and we subtract one point eight
            targets:
              - sgd-transition
            linger: 0.24
          - id: multiply-shallow
            phrase: Green has a slope of one, so we subtract just point zero one eight
            targets:
              - sgd-transition
            linger: 0.24
        caption_starts:
          - Blue has a slope
          - and we subtract one point eight
          - Green has a slope
          - so we subtract just
      - say: Now move the dots. Only the first crosses zero. The total loss fell, but nearly all the second
          error is still there. Look at the heights. On the left we pay fifty times a squared. On the
          right we pay half of b squared. Differentiate each term to get the gradient. The slopes are a
          hundred times a, and just b. Their rates of change have a ratio of a hundred to one. That is
          the condition number of this quadratic.
        hold: 1
        caption_starts:
          - Only the first crosses zero
        visual_cues:
          - id: take-first-step
            phrase: Now move the dots
            targets:
              - sgd-transition
            linger: 0.24
          - id: build-loss
            phrase: Look at the heights. On the left we pay fifty times a squared. On the right we pay half of b
              squared
            targets:
              - loss-rule
            linger: 0.24
          - id: build-gradient
            phrase: Differentiate each term to get the gradient
            targets:
              - local-gradient
            linger: 0.24
      - say: Put both coordinates on one map. At the end of the first step, evaluate the gradient again.
          The steep slope was a hundred. Here it is minus eighty. Which way will the next step go?
          Subtracting it sends a back across zero. The slope for b is still positive, so b moves a little
          closer to zero again. Here we can compute the full gradient. With a random minibatch,
          stochastic gradient descent uses a noisy estimate.
        hold: 0.7
        visual_cues:
          - id: refresh-gradient
            phrase: Here it is minus eighty
            caption_boundary: true
            targets:
              - next-gradient
            linger: 0.24
          - id: take-second-step
            phrase: Subtracting it sends a back across zero
            targets:
              - next-gradient
            caption_boundary: true
            linger: 0.24
  - id: stability
    title: Judge the numbered endpoints
    visual: Discrete SGD iterates grow with a completed-update counter and held endpoint loss. A
      withheld larger-rate prediction precedes a genuinely diverging trace and its exact stability
      factor.
    beats:
      - say: Follow eight completed updates. The crossings shrink, while the shallow error moves slowly. A
          smaller rate would calm the steep direction and slow the other one too. We are seeing one
          global multiplier serve two very different curvatures.
        hold: 0.65
        visual_cues:
          - id: safe-trace
            phrase: Follow eight completed updates. The crossings shrink, while the shallow error moves slowly
            targets:
              - safe-path
            linger: 0.55
      - say: Suppose we raise the rate slightly to help the slow coordinate. Will the steep error settle or
          grow? Keep the starting point and objective fixed. Make the prediction before we run the
          second trace.
        hold: 1.7
        visual_cues:
          - id: unsafe-question
            phrase: Will the steep error settle or grow
            targets:
              - stability-question
            linger: 0.55
      - say: "Run the larger rate through eight completed updates. Each steep-coordinate crossing now grows.
          Substitute the gradient into the update: the old error is multiplied by negative one point
          one. Shrinking requires a multiplier whose magnitude is below one. That gives the
          displayed interval for this quadratic."
        hold: 0.65
        caption_starts:
          - Each steep-coordinate crossing now grows
          - the old error is multiplied
        visual_cues:
          - id: unsafe-trace
            phrase: Run the larger rate through eight completed updates. Each steep-coordinate crossing now
              grows
            targets:
              - unsafe-path
            linger: 0.55
          - id: stability-factor
            phrase: the old error is multiplied by negative one point one
            targets:
              - stability-rule
            linger: 0.55
  - id: momentum
    title: A stored direction can disagree with the slope
    visual: Actual EMA momentum iterates supply the displayed gradients and buffers. Weighted old and
      incoming pieces add on a signed number line before the fifth update moves uphill; later
      opposite signs turn the buffer.
    beats:
      - say: Momentum keeps a signed average of gradients. Most of the old average survives and one tenth of
          the new gradient enters. Start its buffer at zero. Store the first weighted gradient, then
          replay four parameter updates using this memory.
        hold: 0.65
        visual_cues:
          - id: first-memory
            phrase: Store the first weighted gradient
            targets:
              - momentum-memory
            linger: 0.55
          - id: momentum-first-four
            phrase: then replay four parameter updates using this memory
            targets:
              - momentum-path
            linger: 0.55
      - say: Now the steep error is negative. Its current gradient asks a fresh descent step to return
          toward zero. Retain the old positive memory, add the new negative contribution, and
          inspect the sum. The memory remains positive. Subtracting it takes the next update farther
          left, raising the loss.
        hold: 0.8
        visual_cues:
          - id: retain-memory
            phrase: Retain the old positive memory
            targets:
              - memory-carry
            linger: 0.55
          - id: incoming-memory
            phrase: add the new negative contribution
            targets:
              - memory-incoming
            linger: 0.55
          - id: sum-memory
            phrase: inspect the sum
            targets:
              - memory-result
            linger: 0.55
          - id: momentum-fifth
            phrase: Subtracting it takes the next update farther left
            targets:
              - momentum-fifth-step
            linger: 0.55
      - say: Continue until the steep buffer turns negative and the parameter starts returning. Meanwhile
          the small gradients in the second coordinate keep reinforcing the same sign. Each
          coordinate owns its own buffer. This memory changes both direction and scale, so its
          learning rate deserves a separate experiment.
        hold: 0.65
        visual_cues:
          - id: momentum-return
            phrase: Continue until the steep buffer turns negative and the parameter starts returning
            targets:
              - momentum-path
            linger: 0.55
  - id: momentum-conventions
    title: Translate the buffer before copying a learning rate
    visual: Four fixed gradients enter the same buffer one at a time. The signed contributions show
      how the buffer can stay positive when the incoming gradient turns negative.
    beats:
      - say: Feed the buffer four fixed gradients so we can follow the signs. In the top row they
          alternate. In the bottom row they all point the same way. Start with the top row. A tenth of
          a hundred gives us ten. Now the gradient flips to minus eighty. Keep nine from the old
          buffer and add minus eight. That leaves one. The gradient changed sign before the buffer did.
        hold: 0.7
        visual_cues:
          - id: history-inputs
            phrase: Feed the buffer four fixed gradients
            targets:
              - history-inputs
            color: cyan
            linger: 0.4
          - id: history-first
            phrase: A tenth of a hundred gives us ten
            targets:
              - history-first
            color: yellow
            linger: 0.4
          - id: history-second
            phrase: Keep nine from the old buffer and add minus eight
            targets:
              - history-second
            color: green
            linger: 0.4
      - say: Continue the same recurrence. The third steep buffer is seven point nine and the fourth is one
          point one one. Opposite signs partially cancel. The shallow buffer ends near zero point three
          three three because every input reinforces its positive sign. Here subtracting a positive
          buffer moves a farther left, even though a fresh descent step would move it right. Momentum
          changes the update scale, so try a separate rate sweep.
        hold: 0.7
        visual_cues:
          - id: history-continue
            phrase: Continue the same recurrence
            targets:
              - history-continue
            color: cyan
            linger: 0.4
          - id: history-fourth
            phrase: fourth is one point one one
            targets:
              - history-fourth
            color: yellow
            linger: 0.4
          - id: history-shallow
            phrase: shallow buffer ends near zero point three three three
            targets:
              - history-shallow
            color: green
            linger: 0.4
      - say: "Our buffer is a normalized exponential average: beta times old memory plus one minus beta times
          the new gradient. PyTorch SGD with default dampening starts its buffer at the first gradient,
          then uses beta times buffer plus gradient. Our memory is one minus beta times that library
          buffer. To reproduce our parameter updates, the library learning rate must be one minus beta
          times our rate. With beta point nine, point zero one eight becomes point zero zero one eight.
          Check initialization and dampening before transferring another implementation."
        hold: 0.7
        visual_cues:
          - id: library-buffer
            phrase: starts its buffer at the first gradient
            targets:
              - library-buffer
            color: cyan
            linger: 0.4
          - id: library-scale
            phrase: Our memory is one minus beta
            targets:
              - library-scale
            color: yellow
            linger: 0.4
          - id: library-rate
            phrase: point zero zero one eight
            targets:
              - library-rate
            color: green
            linger: 0.4
  - id: rmsprop
    title: How far does each gradient move the weight?
    visual: Both coordinates use the same signed update scale. First the markers coincide in value. One
      input then reverses sign and its update sweeps across zero while its squared memory grows.
    beats:
      - say: Feed the same first gradient into two empty buffers. The slope for a is a hundred. The slope for b
          is one. RMSProp squares each slope and stores a tenth of the square. It keeps nine tenths of
          the old buffer on later steps. Take the square root of each buffer. The divisor for a is a
          hundred times as large as the one for b. With the same learning rate, will a still take a
          hundred times the step?
        hold: 2.3
        visual_cues:
          - id: rms-input
            phrase: same first gradient
            targets:
              - rms-input
            linger: 0.24
          - id: rms-square
            phrase: squares each slope and stores a tenth of the square
            targets:
              - rms-square
            linger: 0.24
          - id: rms-root
            phrase: Take the square root of each buffer
            targets:
              - rms-root
            linger: 0.24
          - id: rms-predict
            phrase: will a still take a hundred times the step
            targets:
              - rms-predict
            linger: 0.24
      - say: Divide each slope by its own divisor, with a small epsilon added, and multiply by point zero one.
          The two marks line up at about three hundredths. A hundred times the slope met a hundred times
          the scale. Now feed in minus eighty for a and point nine eight for b. Squaring that minus
          eighty adds to the first buffer. Watch the amounts we subtract. The first switches sign. The
          second stays positive. That sends a to the right and b to the left.
        hold: 1
        visual_cues:
          - id: rms-first
            phrase: The two marks line up at about three hundredths
            targets:
              - rms-update
            caption_boundary: true
            linger: 0.24
          - id: rms-second
            phrase: Now feed in minus eighty for a and point nine eight for b
            targets:
              - rms-input
            linger: 0.24
          - id: rms-store-second
            phrase: Squaring that minus eighty adds to the first buffer
            targets:
              - rms-square
            linger: 0.24
          - id: rms-second-result
            phrase: The first switches sign. The second stays positive
            targets:
              - rms-update
            caption_boundary: true
            linger: 0.24
      - say: Look at the negative amount on the top ruler. Its sign comes straight from the current gradient.
          The stored square supplies the size of the divisor. Basic RMSProp uses that raw buffer without
          startup correction. Here epsilon goes after the square root, as it does in PyTorch. If another
          implementation puts epsilon inside the root, copying its numerical value changes the divisor.
          Now give the numerator a memory of its own.
        hold: 0.8
        visual_cues:
          - id: rms-sign
            phrase: Its sign comes straight from the current gradient
            targets:
              - rms-update
            linger: 0.24
          - id: rms-no-correction
            phrase: uses that raw buffer without startup correction
            targets:
              - rms-no-correction
            linger: 0.24
          - id: rms-epsilon
            phrase: epsilon goes after the square root
            targets:
              - rms-epsilon
            linger: 0.24
  - id: adam-buffers
    title: Keep signs and squared sizes separately
    visual: The retained initial gradient fills Adam’s first and uncentered second moments.
      Provider-word cues build each correction denominator. Three real zero-rate updates hold
      parameters fixed while raw buffers and their total observed weight grow.
    beats:
      - say: Adam combines a signed memory with a memory of squared gradient size. Reset at our original
          point. Store a weighted gradient in the first buffer. Store a weighted square in the
          second. Squaring keeps magnitude even when a gradient changes sign.
        hold: 0.65
        visual_cues:
          - id: adam-raw-mean
            phrase: Store a weighted gradient in the first buffer
            targets:
              - adam-mean
            linger: 0.55
          - id: adam-raw-square
            phrase: Store a weighted square in the second
            targets:
              - adam-square
            linger: 0.55
      - say: Both buffers started at zero. The observed gradient has received only part of the total weight.
          Divide the signed buffer by its observed weight, then correct the squared buffer the same
          way. On this first update, the corrected estimates recover the gradient and its square.
        hold: 0.65
        visual_cues:
          - id: correct-mean
            phrase: Divide the signed buffer by its observed weight
            targets:
              - corrected-mean
            linger: 0.55
          - id: correct-square
            phrase: then correct the squared buffer the same way
            targets:
              - corrected-square
            linger: 0.55
      - say: Check that bookkeeping with three zero-rate updates. The parameters stay fixed, so the gradient
          repeats. The raw buffers fill and the step counter advances. Their corrected estimates
          keep the same values because we divide by the weight actually assigned to observations.
          Changing gradients still carry their history and lag.
        hold: 0.65
        visual_cues:
          - id: cold-start-check
            phrase: Check that bookkeeping with three zero-rate updates. The parameters stay fixed, so the
              gradient repeats. The raw buffers fill and the step counter advances
            targets:
              - cold-start-growth
            linger: 0.55
  - id: adam-step
    title: Turn those memories into a displacement
    visual: Corrected squared moments become square-root denominators. Two normalized coordinate ratios
      are built before a nearly equal-sized first displacement moves the same parameters diagonally.
    beats:
      - say: Reset the buffers for one fresh Adam step. Keep the corrected estimates visible. Which
          coordinate will receive the larger move at our chosen learning rate? Calculate before we
          build the denominator.
        hold: 1.7
        visual_cues:
          - id: adam-normalization-prediction
            phrase: Which coordinate will receive the larger move at our chosen learning rate
            targets:
              - adam-denominator
            linger: 0.55
      - say: Take the square root of each corrected squared estimate. Divide the signed estimate by that
          scale. The hundred-to-one gradient difference nearly cancels. Multiply both ratios by the
          learning rate and take the step. Both errors move by about the same amount. A small
          epsilon guards each denominator; gradients near that scale receive different
          normalization.
        hold: 0.65
        caption_starts:
          - The hundred-to-one gradient difference nearly cancels
          - Both errors move by about the same amount
        visual_cues:
          - id: root-scale
            phrase: Take the square root of each corrected squared estimate
            targets:
              - adam-denominator
            linger: 0.55
          - id: normalized-ratio
            phrase: Divide the signed estimate by that scale
            targets:
              - adam-ratio
            linger: 0.55
          - id: adam-first-move
            phrase: Multiply both ratios by the learning rate and take the step
            targets:
              - adam-displacement
            linger: 0.55
  - id: adam-history
    title: One negative gradient, two optimizers
    visual: The same negative input reaches both methods. Two computed displacements start at the same zero
      and extend in opposite directions. The four-input replay then compares the two Adam coordinates and
      accounts for the observed weights.
    beats:
      - say: Replay those four supplied gradients from empty Adam buffers. For the signed average, keep ninety
          percent of the old value. For the squares, keep ninety-nine point nine percent. The learning
          rate is point zero one. After the first hundred, both buffers read ten. Now send in minus
          eighty. Nine minus eight leaves one in the signed buffer. The square of minus eighty pushes the
          other buffer up to sixteen point three nine. RMSProp turned on that input. Which way will Adam
          move the weight?
        hold: 2.4
        visual_cues:
          - id: hist-first
            phrase: After the first hundred, both buffers read ten
            targets:
              - hist-first
            linger: 0.24
          - id: hist-second
            phrase: Now send in minus eighty
            targets:
              - hist-second
            linger: 0.24
          - id: hist-second-sum
            phrase: Nine minus eight leaves one in the signed buffer. The square of minus eighty pushes the other
              buffer up to sixteen point three nine
            targets:
              - hist-second-sum
            linger: 0.24
      - say: Start both parameter moves at zero on this ruler. RMSProp moves right. Adam moves a little to the
          left. Adam is still subtracting a positive signed average, even though the latest slope is
          negative. Feed in seventy and then minus sixty. Again the signs partly cancel for a. After bias
          correction and division by the root, the subtracted step for a is only about four
          ten-thousandths. The gradients for b all pointed the same way. Its step is about twenty-four
          times as large. The square buffer measures uncentered magnitude. To calculate a variance you
          would have to subtract the mean before squaring.
        hold: 0.9
        visual_cues:
          - id: hist-rms-direction
            phrase: RMSProp moves right
            targets:
              - hist-directions
            caption_boundary: true
            linger: 0.24
          - id: hist-directions
            phrase: Adam moves a little to the left
            targets:
              - hist-directions
            caption_boundary: true
            linger: 0.24
          - id: hist-four
            phrase: Feed in seventy and then minus sixty
            targets:
              - hist-four
            linger: 0.24
          - id: hist-update
            phrase: the subtracted step for a is only about four ten-thousandths
            targets:
              - hist-update
            linger: 0.24
          - id: hist-shallow
            phrase: Its step is about twenty-four times as large
            targets:
              - hist-shallow
            linger: 0.24
          - id: hist-variance
            phrase: To calculate a variance you would have to subtract the mean before squaring
            targets:
              - hist-variance
            linger: 0.24
      - say: Where do the correction factors come from? Suppose the signed gradient repeats. With a repeated
          gradient, the first observation enters with weight one minus beta. After two updates the
          observations carry one minus beta squared. After three, the three colored pieces still fill
          only part of a whole unit. After t updates their total is one minus beta to the power t. Divide
          by that total to give the observed gradients their full weight. For a first gradient of four
          and a rate of point zero one, the raw buffers would give a step near point zero three one six.
          With correction the step is point zero one. That fixes the zero start. An old observation still
          takes time to fade.
        hold: 0.8
        caption_starts:
          - After two updates
          - After t updates
          - With correction the step is point zero one
        visual_cues:
          - id: observed-weights
            phrase: After three, the three colored pieces
            targets:
              - observed-weights
            linger: 0.24
          - id: weight-denominator
            phrase: one minus beta to the power t
            targets:
              - weight-denominator
            linger: 0.24
          - id: uncorrected-step
            phrase: the raw buffers would give a step near point zero three one six
            targets:
              - uncorrected-step
            linger: 0.24
          - id: corrected-step
            phrase: With correction the step is point zero one
            targets:
              - corrected-step
            linger: 0.24
  - id: objective-scale
    title: Find the limit of Adam scale cancellation
    visual: A positive multiplier is applied to the entire retained history,then epsilon alone changes
      the tiny-gradient denominator.
    beats:
      - say: Changing an objective from a mean to a sum multiplies its gradient by the number of averaged
          items. At a fixed rate, SGD multiplies its step by that same factor. If one fixed positive
          factor multiplies Adam’s entire gradient history, the signed estimate scales by that
          factor and the squared estimate by its square. Its square root therefore scales by the
          original factor. Numerator and denominator cancel exactly when epsilon is zero and the
          denominator is nonzero.
        hold: 0.7
        visual_cues:
          - id: scale-objective
            phrase: Changing an objective from a mean to a sum
            targets:
              - scale-objective
            color: cyan
            linger: 0.4
          - id: scale-signed
            phrase: the signed estimate scales by that factor
            targets:
              - scale-signed
            color: yellow
            linger: 0.4
          - id: scale-square
            phrase: squared estimate by its square
            targets:
              - scale-square
            color: green
            linger: 0.4
          - id: scale-root
            phrase: square root therefore scales
            targets:
              - scale-root
            color: pink
            linger: 0.4
          - id: scale-cancel
            phrase: cancel exactly when epsilon is zero
            targets:
              - scale-cancel
            color: cyan
            linger: 0.4
      - say: Watch what happens as the gradient gets smaller. The learning rate is one hundredth. Start
          with a gradient of one. The step uses almost the whole learning rate. When the gradient
          equals epsilon, the denominator is twice the gradient and the step uses half the rate.
          Shrink the gradient to a hundredth of epsilon. Now the step uses about one percent of the
          rate.
        hold: 0.7
        caption_starts:
          - When the gradient equals epsilon
          - Shrink the gradient
          - Now the step uses
        visual_cues:
          - id: eps-large
            phrase: The step uses almost the whole learning rate
            targets:
              - eps-large
            color: cyan
            linger: 0.4
          - id: eps-equal
            phrase: the denominator is twice the gradient and the step uses half the rate
            targets:
              - eps-equal
            color: yellow
            linger: 0.4
          - id: eps-tiny
            phrase: Now the step uses about one percent of the rate
            targets:
              - eps-tiny
            color: green
            linger: 0.4
      - say: Now change the scale halfway through. Both buffers receive minus eight hundred. Look at
          what they carry in. The top buffer kept nine from its first gradient. Add minus eighty and it
          lands at minus seventy-one. The bottom run used the larger scale from the start. It kept
          ninety. The same minus eighty leaves it at plus ten. Adam will move these weights in
          opposite directions. Record how you average the loss. Clipping, a penalty added to the loss,
          or changing an item's share can also change the gradient that reaches the buffers.
        hold: 0.7
        caption_starts:
          - Add minus eighty and it lands
          - The same minus eighty leaves it
        visual_cues:
          - id: scale-past
            phrase: Add minus eighty and it lands at minus seventy-one
            targets:
              - scale-past
            color: cyan
            linger: 0.4
          - id: scale-break
            phrase: The same minus eighty leaves it at plus ten
            targets:
              - scale-break
            color: yellow
            linger: 0.4
          - id: scale-record
            phrase: Record how you average the loss
            targets:
              - scale-record
            color: green
            linger: 0.4
  - id: comparison
    title: Compare complete recipes at one budget
    visual: All three trajectories recompute gradients at their own positions on the same quadratic,
      starting from the same errors. A shared completed-update count drives endpoint coordinates and
      loss, with explicit per-method rates.
    beats:
      - say: Return every method to the same starting point and reset its buffers. Give each forty gradient
          evaluations. The listed learning rates belong to the recipes we are testing. Predict which
          recipe will reduce the shallow error most, then compare both coordinates and the loss.
        hold: 1.5
        visual_cues:
          - id: comparison-prediction
            phrase: Predict which recipe will reduce the shallow error most
            targets:
              - comparison-question
            linger: 0.55
      - say: Advance each run through the same forty updates, using its own current point for each gradient,
          then keep the completed paths beside their two remaining coordinate errors. At the shared
