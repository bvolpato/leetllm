            phrase: A zero gradient cuts it to four
            targets: [square-history]
          - id: square-third
            phrase: A gradient of three brings it back to six and a half
            targets: [square-history]
          - id: amsgrad-max
            phrase: AMSGrad also keeps the largest buffer value seen so far
            targets:
              - amsgrad-max
            color: yellow
            linger: 0.4
  - id: diagnostic-trace
    title: Which run would you keep?
    visual: Two computed warmup traces stay on one loss plot as the budget extends from eight updates to
      twelve. Separate forty-update trials then put training and held-out scores on the same ruler.
    beats:
      - say: Watch the pink run climb out of the valley. Its loss jumps on the first update at the peak rate.
          Was the peak too high? Check the rate and the gradient norm at that update. Keep the start,
          data and optimizer fixed. Halve just the peak rate and replay the two runs through update
          eight. At this point the lower peak has the lower training loss. Would you expect it still to
          be ahead four updates later?
        hold: 2.45
        caption_starts:
          - At this point the lower peak
          - Would you expect it still to be ahead
        visual_cues:
          - id: diagnostic-boundary
            phrase: Watch the pink run climb out of the valley. Its loss jumps on the first update at the peak rate
            targets:
              - rate-probe
            linger: 0.24
          - id: diagnostic-measure
            phrase: Check the rate and the gradient norm at that update
            targets:
              - boundary-reading
            linger: 0.24
          - id: diagnostic-compare
            phrase: Halve just the peak rate and replay the two runs through update eight
            targets:
              - rate-probe
            linger: 0.24
      - say: Keep both rates and give both runs the extra four updates. Follow the dots to twelve. Now the
          higher peak has the lower loss. Lowering the peak softened the spike, but the answer to which
          run was ahead depended on when we stopped. And both curves measured only the loss we trained
          on. What if the decision is about data the model has never seen?
        hold: 1.3
        caption_starts:
          - Now the higher peak has the lower loss
          - Lowering the peak softened the spike
          - What if the decision is about data
        visual_cues:
          - id: diagnostic-record
            phrase: Keep both rates and give both runs the extra four updates. Follow the dots to twelve
            targets:
              - rate-probe
            linger: 0.24
      - say: Take two separate trials with forty updates each. Their data split is fixed. Look at the training
          scores first. AdamW gets closer to zero. Now uncover the scores on the held-out examples. SGD
          has the lower held-out loss. If that is your selection metric, keep this SGD recipe at this
          budget. The rates differ, so this comparison evaluates whole recipes. If training keeps
          improving while validation worsens, check for leakage and try a decay sweep. Fix the split and
          other settings, and compare held-out loss.
        hold: 0.85
        visual_cues:
          - id: trial-train
            phrase: Look at the training scores first
            targets:
              - trial-train
            linger: 0.24
          - id: trial-held
            phrase: Now uncover the scores on the held-out examples
            targets:
              - trial-held
            linger: 0.24
          - id: diagnostic-validation
            phrase: SGD has the lower held-out loss
            targets:
              - diagnostic-validation
            caption_boundary: true
            linger: 0.24
      - say: A different symptom needs a different measurement. For a nonfinite batch, inspect its contents,
          the gradient norm and the mixed-precision scale. If one group stalls while another oscillates,
          measure their update norms and gradient scales separately. If clipping fires almost every
          update, record the pre-clipping norms across batches and investigate the threshold or the data.
          If the run does not fit, measure optimizer-state bytes and activation peaks. Each of those
          measurements gives you one change to test on the same data slice.
        hold: 0.8
        visual_cues:
          - id: diagnostic-data
            phrase: For a nonfinite batch, inspect its contents, the gradient norm and the mixed-precision scale
            targets:
              - diagnostic-data
            linger: 0.24
          - id: diagnostic-groups
            phrase: measure their update norms and gradient scales separately
            targets:
              - diagnostic-groups
            linger: 0.24
          - id: diagnostic-frequency
            phrase: record the pre-clipping norms across batches
            targets:
              - diagnostic-frequency
            linger: 0.24
          - id: diagnostic-bytes
            phrase: measure optimizer-state bytes and activation peaks
            targets:
              - diagnostic-bytes
            linger: 0.24
  - id: transfer
    title: Start on the other side of zero
    visual: Three rulers share a starting tick and a vertical zero line. Each method moves its own copy of the steep error. The companion coordinate and displacement appear when that update lands.
    beats:
      - say: Bring back the two errors from the opening. This time a starts at minus one half and b at plus one
          half. Reset the buffers. Keep the rates on the screen. Which methods will cross zero in the
          first coordinate after one update?
        hold: 2.8
        visual_cues:
          - id: transfer-prediction
            phrase: Which methods will cross zero in the first coordinate after one update
            targets:
              - transfer-question
            linger: 0.55
      - say: Plain descent subtracts the full scaled gradient. Momentum first stores one tenth of that
          gradient. Adam corrects and normalizes its two fresh buffers. Build each displacement in that
          order, carrying the original starting point into every calculation.
        hold: 0.65
        visual_cues:
          - id: transfer-sgd
            phrase: Plain descent subtracts the full scaled gradient
            targets:
              - transfer-sgd
            linger: 0.55
          - id: transfer-momentum
            phrase: Momentum first stores one tenth of that gradient
            caption_boundary: true
            targets:
              - transfer-momentum
            linger: 0.55
          - id: transfer-adam
            phrase: Adam corrects and normalizes its two fresh buffers
            caption_boundary: true
            targets:
              - transfer-adam
            linger: 0.55
      - say: Only plain descent crosses zero here. It subtracts a negative gradient, so it moves right.
          Momentum moves right too, but its empty buffer took in just a tenth of that first gradient.
          Adam moves about one learning rate to the right. Knowing the sign told us which way. The buffer
          and the rate told us how far.
        hold: 0.9
        visual_cues:
          - id: transfer-receipts
            phrase: Knowing the sign told us which way
            targets:
              - transfer-receipts
            linger: 0.55
