            color: yellow
            linger: 0.4
          - id: recipe-symmetry
            phrase: Adam's divisor grew in the same proportion
            targets:
              - recipe-symmetry
            color: green
            linger: 0.4
      - say: What happens when a large gradient fades from memory? Start the squared-gradient buffer
          at zero and keep half the old value each time. A gradient of four has a square of sixteen,
          so the buffer starts at eight. A zero gradient cuts it to four. A gradient of three brings
          it back to six and a half. AMSGrad also keeps the largest buffer value seen so far.
          Its line stays at eight. Researchers found convex problems where the original Adam update
          fails to converge. Keeping that maximum is the change they studied in AMSGrad.
        hold: 0.7
        caption_starts:
          - A zero gradient cuts it to four
          - A gradient of three brings it back
          - Its line stays at eight
        visual_cues:
