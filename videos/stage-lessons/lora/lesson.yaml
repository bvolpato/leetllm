version: 1
id: lora
title: "LoRA: From Low-Rank Geometry to a Tested Adapter"
source: training/lora-parameter-efficient-fine-tuning/content.md
voice: af_heart
rate: +12%
sources:
  - title: "Hu et al. LoRA: Low-Rank Adaptation of Large Language Models"
    url: https://arxiv.org/abs/2106.09685
  - title: "Hugging Face PEFT: LoRA developer guide"
    url: https://huggingface.co/docs/peft/developer_guides/lora
  - title: "Dettmers et al. QLoRA: Efficient Finetuning of Quantized LLMs"
    url: https://arxiv.org/abs/2305.14314
  - title: Aghajanyan et al. Intrinsic Dimensionality Explains the Effectiveness of Language Model Fine-Tuning
    url: https://arxiv.org/abs/2012.13255
  - title: Kalajdzievski. A Rank Stabilization Scaling Factor for Fine-Tuning with LoRA
    url: https://arxiv.org/abs/2312.03732
  - title: "Liu et al. DoRA: Weight-Decomposed Low-Rank Adaptation"
    url: https://arxiv.org/abs/2402.09353
  - title: "Punica: Multi-Tenant LoRA Serving"
    url: https://arxiv.org/abs/2310.18547
  - title: "S-LoRA: Serving Thousands of Concurrent LoRA Adapters"
    url: https://arxiv.org/abs/2311.03285
  - title: PEFT adapter dtype troubleshooting
    url: https://huggingface.co/docs/peft/developer_guides/troubleshooting
  - title: TRL1.17.1 SFTTrainer source
    url: https://github.com/huggingface/trl/blob/v1.17.1/trl/trainer/sft_trainer.py
  - title: bitsandbytes0.50.2 four-bit autograd
    url: https://github.com/bitsandbytes-foundation/bitsandbytes/blob/0.50.2/bitsandbytes/autograd/_functions.py
scenes:
  - id: policy-task
    title: "Which reply should the adapter change?"
    visual: "Two key reviews arrive with the same base reply. Keep both ages and the retrieved 90-day rule visible while the viewer picks a reply. Show the desired route beside the original reply, then set the release rule for both held-out sets."
    beats:
      - say: "The assistant sends both keys to routine review. One is twelve days old. The other is ninety-two. Our team sends keys to the rotation owner at ninety days. Which reply needs to change?"
        caption_starts: ["Our team sends keys", "Which reply needs to change"]
        hold: 2.3
        visual_cues:
          - id: ticket-young
            phrase: "One is twelve days old"
            targets: [routine-ticket]
            linger: 0.2
          - id: ticket-old
            phrase: "The other is ninety-two"
            targets: [overdue-ticket]
            linger: 0.2
          - id: rotation-rule
            phrase: "Our team sends keys to the rotation owner at ninety days"
            targets: [rule-marker]
            linger: 0.2
      - say: "Ticket four needs the rotation owner. Ticket seven stays in routine review. LoRA keeps the base weights fixed. We train two small matrices on five thousand labeled tickets to change how the model uses the rule. The assistant looks up the current rule when a ticket arrives."
        caption_starts: ["Ticket seven stays in routine review", "LoRA keeps the base weights fixed", "The assistant looks up the current rule"]
        hold: 0.7
        visual_cues:
          - id: ticket-route
            phrase: "Ticket four needs the rotation owner"
            targets: [ticket-actions]
            caption_boundary: true
            linger: 0.2
          - id: ticket-keep
            phrase: "Ticket seven stays in routine review"
            targets: [ticket-actions]
            linger: 0.2
          - id: ticket-train
            phrase: "We train two small matrices"
            targets: [training-pair]
            linger: 0.2
      - say: "We’ll test both kinds of reply. Set aside twenty policy tickets and twenty routine reviews before training. The adapter needs nineteen correct in each set. Save the expected replies, the ticket format, and the base model revision so we can run the same test after training."
        caption_starts: ["The adapter needs nineteen correct"]
        hold: 0.8
        visual_cues:
          - id: ticket-sets
            phrase: "nineteen correct in each set"
            targets: [ticket-ledgers]
            linger: 0.2
  - id: intro
    title: "One ticket, two paths through a layer"
    visual: "Follow P04 through the blue base layer. Select the policy factors from three task-specific pairs, then send the same input into the selected pair and combine its correction with the base output."
    beats:
      - say: "Bring that overdue ticket back to the assistant. The blue block is one of its trained layers. We keep its weights fixed. It still computes its usual response to this input."
        hold: 0.65
        visual_cues:
          - id: intro-b1-1
            phrase: "keep its weights fixed"
            targets: [frozen-base]
            linger: 0.2
      - say: "Attach two small trainable matrices beside that layer. Together they contribute a correction. This is low-rank adaptation, or LoRA. A code reviewer and a science tutor can each have a pair of their own and share the same base. The optimizer updates just the selected factors."
        hold: 0.65
        visual_cues:
          - id: intro-b2-1
            phrase: "Attach two small trainable matrices"
            targets: [adapter-factors]
            linger: 0.2
      - say: "For ticket four, select the policy pair. Send the same input down this second path. Add its correction to the base output. To see how two little matrices can change that output, let's open the layer and follow one input by hand."
        hold: 0.8
        visual_cues:
          - id: intro-select
            phrase: "select the policy pair"
            targets: [adapter-factors]
            linger: 0.2
          - id: intro-send
            phrase: "Send the same input down this second path"
            targets: [adapter-factors]
            linger: 0.2
          - id: intro-b3-1
            phrase: "Add its correction to the base output"
            targets: [new-response]
            linger: 0.2
  - id: linear-layer
    title: A matrix mixes input directions
    visual: Two input coordinates weight the two columns of a matrix. Scaled basis vectors form a head-to-tail
      sum, producing the exact output vector.
    beats:
      - say: A linear layer takes an input vector and multiplies it by a matrix of learned weights. Each input
          coordinate controls how much of one matrix column enters the output.
        hold: 0.6
        visual_cues:
          - id: linear-layer-b1-1
            phrase: matrix of learned weights
            targets:
              - weight-matrix
            linger: 0.45
      - say: Here the first coordinate stretches the blue column vector. The second contributes the other column.
          Place the contributions head to tail, and their sum is the layer's response.
        hold: 0.7
        visual_cues:
          - id: linear-layer-b2-1
            phrase: blue column vector
            targets:
              - first-column
            linger: 0.45
          - id: linear-layer-b2-2
            phrase: other column
            targets:
              - second-column
            linger: 0.45
          - id: linear-layer-b2-3
            phrase: their sum
            targets:
              - column-sum
            linger: 0.45
      - say: Fine-tuning changes these weights using examples and their errors. If every entry can change
          independently, the update has the same large rectangular shape as the original matrix.
        hold: 0.65
        visual_cues:
          - id: linear-layer-b3-1
            phrase: every entry
            targets:
              - weight-matrix
            linger: 0.45
  - id: dense-update
    title: Keep the base, learn a correction
    visual: A dense update grid separates from a frozen base. The two output vectors are added, then the dense
      update is replaced by two thin factors.
    beats:
      - say: We can describe any weight change as an additive correction. The adapted layer applies the original
          matrix and the correction to the very same input, then adds their outputs.
        hold: 0.7
        visual_cues:
          - id: dense-update-b1-1
            phrase: original matrix
            targets:
              - frozen-base
            linger: 0.45
          - id: dense-update-b1-2
            phrase: correction. The
            targets:
              - trainable-correction
            linger: 0.45
          - id: dense-base-output
            phrase: original matrix
            targets:
              - frozen-base
              - dense-base-vector
            linger: 0.35
          - id: dense-correction-output
            phrase: the correction to the very same input
            targets:
              - trainable-correction
              - dense-correction-vector
            linger: 0.35
          - id: dense-output-sum
            phrase: adds their outputs
            targets:
              - dense-output
            linger: 0.35
      - say: LoRA freezes the original matrix and learns a structured correction beside it. The base still contributes
          its pretrained transformation on every pass. Only the added factors receive parameter updates.
        hold: 0.6
        visual_cues:
          - id: dense-update-b2-1
            phrase: base still contributes
            targets:
              - frozen-base
            linger: 0.45
          - id: dense-update-b2-2
            phrase: added factors
            targets:
              - trainable-correction
            linger: 0.45
      - say: The key constraint is rank. To understand what that buys, start with a correction whose outputs all point
          along one direction. A single direction can still affect every output coordinate.
        hold: 0.8
        visual_cues:
          - id: dense-update-b3-1
            phrase: rank
            targets:
              - sum-identity
            linger: 0.45
  - id: intrinsic-rank
    title: One free scalar can still change every direction
    visual: "On persistent 3D axes compare theta times identity with rank-one BA: count one optimization scalar
      versus three independent output axes. Keep distinction labeled as counterexample."
    beats:
      - say: "Watch the three diagonal entries move together. One number, theta, controls all three. This is a small version of the distinction behind LoRA. Aghajanyan and colleagues studied how few coordinates training needed in a randomly projected parameter space. To find the rank of a matrix, follow its outputs."
        hold: 0.65
        visual_cues:
          - id: intrinsic-rank-1
            phrase: "three diagonal entries move together"
            targets:
              - intrinsic-rank-mechanism
            linger: 0.35
      - say: "Each basis input sends an arrow along a different axis. Three independent directions give rank three, even though we turned just one knob. Set theta to zero and all three arrows disappear. Now switch to a LoRA update of width one. All three outputs lie on the same line. In general, B times A has rank at most the width of the factors."
        hold: 0.65
        visual_cues:
          - id: intrinsic-rank-2
            phrase: "Each basis input sends an arrow"
            targets:
              - intrinsic-rank-mechanism
            linger: 0.35
          - id: intrinsic-zero
            phrase: "Set theta to zero"
            targets:
              - intrinsic-rank-mechanism
            linger: 0.25
          - id: intrinsic-ba
            phrase: "switch to a LoRA update of width one"
            targets:
              - intrinsic-rank-mechanism
            linger: 0.25
      - say: "One line may be enough for a particular task. A wider adapter can learn more directions. Compare them on the same held-out examples. If the task needs changes beyond the adapter’s reach, full fine-tuning lets you update every eligible entry."
        hold: 0.8
        visual_cues:
          - id: intrinsic-rank-3
            phrase: "A wider adapter can learn more directions"
            targets:
              - intrinsic-rank-mechanism
            linger: 0.35
  - id: rank-one
    title: One direction, many possible corrections
    visual: A row vector measures a moving three-dimensional input. A column vector expands the resulting scalar
      along one fixed line. Its outer product fills a genuine three-by-three matrix.
    beats:
      - say: The first factor measures the input with a dot product. It compresses the input into one scalar. The
          second factor multiplies a fixed output direction by that scalar.
        hold: 0.7
        visual_cues:
          - id: rank-one-b1-1
            phrase: one scalar
            targets:
              - scalar-measurement
            linger: 0.45
      - say: As the input moves, the correction slides forward or backward on this line. Its length and sign change,
          while its available direction stays fixed. That is a rank-one transformation.
        hold: 0.85
        visual_cues:
          - id: rank-one-b2-1
            phrase: slides forward or backward
            targets:
              - correction-vector
            linger: 0.45
      - say: Multiplying the column by the row gives an outer product. Every column of this update matrix is a scaled
          copy of the same vector, so all its outputs remain on that line.
        hold: 0.75
        visual_cues:
          - id: rank-one-b3-1
            phrase: outer product
            targets:
              - outer-product
            linger: 0.45
  - id: rank-two
    title: Two directions open a plane
    visual: A second independent rank-one component enters a stable projected three-dimensional coordinate system.
      Their weighted sums sweep a plane while a target outside the plane remains unreachable.
    beats:
      - say: Add a second independent direction. Now the input supplies two coefficients, and the correction combines
          two output vectors. Their possible sums fill a plane inside this three-dimensional output space.
        hold: 0.8
        visual_cues:
          - id: rank-two-b1-1
            phrase: two output vectors
            targets:
              - first-basis
              - second-basis
            linger: 0.45
      - say: Watch the two contributions move head to tail. The tip can reach different places across the plane, but a
          target outside it requires another independent direction or a different learned plane.
        hold: 0.85
        visual_cues:
          - id: rank-two-b2-1
            phrase: head to tail
            targets:
              - first-contribution
              - second-contribution
            linger: 0.45
          - id: rank-two-b2-2
            phrase: tip
            targets:
              - resultant-vector
            linger: 0.45
      - say: Rank counts independent directions in this linear correction. A rank-two adapter has room for at most
          two. Training can rotate its plane, and redundant factors can make its actual rank smaller.
        hold: 0.75
        visual_cues:
          - id: rank-two-b3-1
            phrase: at most two
            targets:
              - rank-limit
            linger: 0.45
          - id: rank-two-rotation
            phrase: Training can rotate its plane
            targets:
              - first-basis
              - second-basis
              - rank-limit
            linger: 0.25
  - id: factorization
    title: Build the update from thin factors
    visual: A two-by-three A and three-by-two B multiply. Each selected output entry accumulates two displayed
      products before the next entry fills. The completed update matches the sum of two outer products.
    beats:
      - say: Collect the measuring rows into A and the output directions into B. Their product has the full update's
          shape. Its inner dimension is the adapter's rank, the narrow passage between them.
        hold: 0.7
        visual_cues:
          - id: factorization-b1-1
            phrase: measuring rows into A
            targets:
              - a-factor
            linger: 0.45
          - id: factorization-b1-2
            phrase: output directions into B
            targets:
              - b-factor
            linger: 0.45
      - say: Each update entry is a dot product between a row of B and a column of A. Follow the highlighted pair of
          products as they accumulate into one matrix entry.
        hold: 0.8
        visual_cues:
          - id: factorization-b2-1
            phrase: accumulate into one matrix entry
            targets:
              - entry-calculation
              - a-factor
              - b-factor
              - factor-product
            linger: 0.45
      - say: Repeat across the matrix, and the entire correction appears. Equivalently, we're adding two rank-one
          outer products. The dense matrix is useful for understanding, while training can keep only the
          factors.
        hold: 0.75
        visual_cues:
          - id: factorization-b3-1
            phrase: entire correction appears
            targets:
              - factor-product
            linger: 0.45
  - id: thin-forward
    title: "What does this input send through the adapter?"
    visual: "For the article’s two-by-two merge example, compute the two base coordinates and slide the same scale-two correction onto both rulers. Change only the first input coordinate. Keep the weights, rulers and scale fixed for the null-space prediction."
    beats:
      - say: "Take the input two, one. The frozen matrix has two rows. In the first row, twice one plus two gives four. In the second, twice three plus four gives ten. Put a blue mark at each base output."
        hold: 0.65
        visual_cues:
          - id: forward-base
            phrase: "four gives ten"
            targets: [forward-rails]
            linger: 0.2
      - say: "Now follow the same input through the narrow path. A subtracts the second coordinate from the first. Two minus one leaves one. B sends half that amount to the first output and the whole amount to the second. Our scale is two, so the correction is one and two."
        hold: 0.55
        visual_cues:
          - id: forward-difference
            phrase: "Two minus one leaves one"
            targets: [forward-factors]
            linger: 0.2
          - id: forward-scale
            phrase: "the correction is one and two"
            targets: [forward-factors]
            linger: 0.2
      - say: "Start at each blue mark and add its yellow correction. Four becomes five. Ten becomes twelve. Those are the two coordinates we would get by merging the scaled product into the base. Here we used just the two thin multiplications."
        hold: 0.85
        visual_cues:
          - id: forward-add
            phrase: "Start at each blue mark and add its yellow correction"
            targets: [forward-rails]
            linger: 0.2
          - id: forward-sum
            phrase: "Ten becomes twelve"
            targets: [forward-answer]
            linger: 0.2
      - say: "Keep every weight. Change the first input from two to one. The blue marks move because the base also reads the new input. With two equal input coordinates, how far will the adapter move either mark?"
        hold: 2.2
        visual_cues:
          - id: forward-new-input
            phrase: "Change the first input from two to one"
            targets: [forward-input]
            linger: 0.2
      - say: "One minus one is zero. B has nothing to expand. Both marks stay at their new base values. The adapted output stays at three, seven. These same factors can change both outputs on one request and leave them alone on another."
        caption_starts: ["Both marks stay", "The adapted output stays at three, seven"]
        hold: 0.88
        visual_cues:
          - id: forward-zero
            phrase: "One minus one is zero"
            targets: [forward-factors]
            caption_boundary: true
            linger: 0.2
          - id: forward-unchanged
            phrase: "stays at three, seven"
            targets: [forward-answer]
            linger: 0.2
  - id: parameter-count
    title: A narrow passage changes the budget
    visual: A 4096-square weight grid unfolds into thin rank-16 strips. Areas show their true ratio with a
      magnified adapter inset. Counts and the general formula assemble.
    beats:
      - say: Now enlarge the layer. A square projection with width four thousand ninety-six contains nearly seventeen
          million weights. Full fine-tuning can train every one, along with the training state they require.
        hold: 0.7
        visual_cues:
          - id: parameter-count-b1-1
            phrase: seventeen million weights
            targets:
              - base-count
            linger: 0.45
          - id: parameter-base-result
            phrase: nearly seventeen million weights
            targets:
              - base-count
            linger: 0.25
      - say: At rank sixteen, the two factors contain about one hundred thirty-one thousand trainable values
          altogether. That's less than one percent of the original matrix. The inset magnifies their narrow
          width.
        hold: 0.8
        visual_cues:
          - id: parameter-count-b2-1
            phrase: one hundred thirty-one thousand
            targets:
              - adapter-count
            linger: 0.45
          - id: parameter-adapter-result
            phrase: about one hundred thirty-one thousand trainable values altogether
            targets:
              - adapter-count
            linger: 0.25
          - id: parameter-percent-result
            phrase: That's less than one percent of the original matrix
            targets:
              - adapter-ratio
            linger: 0.25
      - say: "For any rectangular layer, count the two thin rectangles: rank times input width, plus output width
          times rank. Increase rank and adapter parameters grow linearly, along with the available update
          capacity."
        hold: 0.7
        visual_cues:
          - id: parameter-count-b3-1
            phrase: rank times input width
            targets:
              - parameter-equation
            linger: 0.45
  - id: initialization
    title: "Which factor can learn on the first pass?"
    visual: "Keep a scalar input, target and both loss-gradient formulas in view. Trace the error back to B with A nonzero. At B = 0 the path to A stops. Apply the SGD update to B, then follow the next error back through both factors."
    beats:
      - say: "We want the first pass to reproduce the checkpoint's response. The usual recipe gives A small random values and sets B to zero. Take a scalar example where A is one. The input is one, and the target is one. The frozen base outputs zero. So does the adapter. Look at the two derivatives below. Which factor can learn on this first pass?"
        hold: 2.05
        visual_cues:
          - id: initialization-b1-1
            phrase: "gives A small random values"
            targets: [a-initial]
            linger: 0.2
          - id: initialization-b1-2
            phrase: "sets B to zero"
            targets: [b-initial]
            linger: 0.2
      - say: "Follow the error back to B. The output is one below the target, and A sent a one forward. Multiply those together. B gets a gradient of minus one. To reach A, that error has to go through B. With B still at zero, A gets a gradient of zero."
        hold: 0.75
        visual_cues:
          - id: init-error-to-b
            phrase: "Follow the error back to B"
            targets: [b-initial]
            linger: 0.2
          - id: initialization-b2-1
            phrase: "B gets a gradient of minus one"
            targets: [b-gradient]
            caption_boundary: true
            linger: 0.2
          - id: initialization-b2-2
            phrase: "A gets a gradient of zero"
            targets: [a-gradient]
            caption_boundary: true
            linger: 0.2
      - say: "Take one gradient step. At a learning rate of one tenth, B moves to one tenth. Now follow the next error back through B. This time it reaches A too. If both factors start at zero, ordinary gradient descent gets stuck. And even a nonzero A can measure zero on a particular input, just as it did for those two equal coordinates. Check the gradients on your actual examples."
        hold: 0.8
        visual_cues:
          - id: initialization-b3-1
            phrase: "B moves to one tenth"
            targets: [b-initial]
            linger: 0.2
          - id: init-through-b
            phrase: "follow the next error back through B"
            targets: [a-gradient]
            linger: 0.2
  - id: gradient-contract
    title: Derive which factor moves first
    visual: Keep actual A/B/x/z/g tensors, backpropagate outer products and perform scalar SGD updates from the
      existing initialization trace; failure input Ax=0 and both-zero factors then repair one factor.
    beats:
      - say: Write z equals A x and let g be the loss gradient with respect to the layer output. With scale s, B
          receives s times the outer product of g and z. A receives s times the outer product of B transpose g
          and x. These are loss gradients; separate optimizer decay can add another update. The original paper
          uses Gaussian A; PEFT’s ordinary linear initialization uses Kaiming-uniform A and zero B. These
          choices preserve the same zero-correction invariant.
        hold: 0.65
        visual_cues:
          - id: gradient-contract-1
            phrase: Write z equals A x and let
            targets:
              - gradient-contract-mechanism
            linger: 0.35
          - id: gradient-z
            phrase: Write z equals A x
            targets:
              - gradient-contract-mechanism
            linger: 0.25
          - id: gradient-b-outer
            phrase: B receives s times the outer product of g and z
            targets:
              - gradient-contract-mechanism
            linger: 0.25
          - id: gradient-a-outer
            phrase: A receives s times the outer product of B transpose g and x
            targets:
              - gradient-contract-mechanism
            linger: 0.25
      - say: At B zero, the A loss gradient is zero. B can move if the scale, incoming gradient and measured
          intermediate make their outer product nonzero. In our scalar trace, A is one, B is zero, x is one
          and the target is one. Half squared error gives B gradient minus one. An SGD rate of zero point one
          makes B zero point one.
        hold: 0.65
        visual_cues:
          - id: gradient-contract-2
            phrase: At B zero, the A loss gradient
            targets:
              - gradient-contract-mechanism
            linger: 0.35
          - id: gradient-first-b
            phrase: B gradient minus one
            targets:
              - gradient-contract-mechanism
            linger: 0.25
          - id: gradient-first-step
            phrase: makes B zero point one
            targets:
              - gradient-contract-mechanism
            linger: 0.25
      - say: The next output is zero point one, so the error is minus zero point nine. Now B gradient is minus zero
          point nine and A gradient is minus zero point zero nine; both can move. If A x is zero, B waits for
          that example. If both factors are zero, both loss gradients vanish. Reversing the no-op
          initialization can make A move first instead, and batch contributions can cancel. Starting both factors nonzero usually changes the checkpoint’s first output.
        hold: 0.8
        visual_cues:
          - id: gradient-contract-3
            phrase: The next output is zero point one,
            targets:
              - gradient-contract-mechanism
            linger: 0.35
          - id: gradient-next-error
            phrase: error is minus zero point nine
            targets:
              - gradient-contract-mechanism
            linger: 0.25
          - id: gradient-next-a
            phrase: A gradient is minus zero point zero nine
            targets:
              - gradient-contract-mechanism
            linger: 0.25
          - id: gradient-null-cases
            phrase: If A x is zero
            targets:
              - gradient-contract-mechanism
            linger: 0.25
  - id: strength
    title: Capacity and strength are separate choices
    visual: A computed rank-one vector is scaled by alpha/r while its line stays fixed. Rank rises and a second
      direction appears, with the scaling multiplier explicitly changing and then held constant.
    beats:
      - say: Ordinary LoRA multiplies the correction by alpha divided by rank. Alpha supplies an explicit strength
          control. Turning it changes the correction's length without creating new directions for this fixed
          pair of factors.
        hold: 0.7
        visual_cues:
          - id: strength-b1-1
            phrase: correction's length
            targets:
              - scaled-vector
            linger: 0.45
      - say: Increasing rank changes capacity, but keeping alpha fixed also changes this multiplier. A rank comparison
          becomes easier to interpret when the explicit scale is held constant and recorded beside the result.
        hold: 0.7
        visual_cues:
          - id: strength-b2-1
            phrase: rank changes
            targets:
              - rank-setting
            linger: 0.45
          - id: strength-b2-2
            phrase: explicit scale
            targets:
              - explicit-scale
            linger: 0.45
      - say: The learned correction also depends on initialization, data, and optimization. Rank and scale are
          connected experimental choices. Compare actual update norms and held-out quality instead of
          inferring strength from rank alone.
        hold: 0.75
        visual_cues:
          - id: strength-b3-1
            phrase: actual update norms
            targets:
              - scaled-vector
            linger: 0.45
  - id: rank-scaling
    title: The multiplier changes with the chosen rank
    visual: Display the same factor-output vector with ordinary scales 2/.5/2 then rsLoRA5.657/2.828/11.314; hold
      learned norm unknown separately from explicit multiplier.
    beats:
      - say: "Compute the multiplier before interpreting a rank sweep. Ordinary LoRA uses alpha divided by r. Alpha
          sixteen with rank eight gives two. Keep alpha sixteen and raise rank to thirty-two: the multiplier
