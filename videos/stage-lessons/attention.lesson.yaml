        visual_cues:
          - { id: dont-store, phrase: "don't store it", targets: [picture], color: yellow }
          - { id: simple-point, phrase: "simple point", targets: [picture], color: yellow }
          - { id: hold-block, phrase: "Hold a block", targets: [picture], color: yellow }
          - { id: stream, phrase: "stream small blocks", targets: [picture], color: yellow }
          - { id: called-tiles, phrase: "called tiles", targets: [picture], color: yellow }
      - say: But subtracting the largest score from every score needs the largest score in the row, and we haven't seen the whole row yet. Online softmax handles that with two running numbers, the largest score so far and the running sum of exponentials. FlashAttention adds one more running total, the weighted sum of values. When a larger score arrives, multiply both sums by e to the old maximum minus the new maximum, and carry on.
