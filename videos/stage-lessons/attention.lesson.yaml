scenes:
  - id: hook
    title: What comes back to sing?
    visual: A reading mark travels under “Birds in the garden.” The view widens as it reaches sing. After the viewer identifies the subject, an arrow points back to Birds and a count shows the distance. The two words move onto a common ruler to compare their first value coordinates and shares.
    beats:
      - say: Birds in the garden sing softly at dawn. When you reach the verb, who sings?
        hold: 2.2
        caption_starts: ["When you reach the verb"]
        visual_cues:
          - { id: sentence, phrase: "Birds in the garden", targets: [words] }
          - { id: reaches-sing, phrase: "sing", targets: [sing] }
          - { id: after-verb, phrase: "softly at dawn", targets: [words] }
          - { id: subject-question, phrase: "who sings", targets: [subject-question] }
      - say: The birds are singing. Count back from sing. Four positions take you from the verb to its subject. Let's keep just two tokens for the calculation, one for Birds and one for sing.
        hold: 0.6
        caption_starts: ["Let's keep just two tokens"]
        visual_cues:
          - { id: subject, phrase: "The birds are singing", targets: [subject-arc] }
          - { id: count-back, phrase: "Count back from sing", targets: [word-positions], caption_boundary: true }
          - { id: four-back, phrase: "Four positions", targets: [subject-position], caption_boundary: true }
          - { id: two-tokens, phrase: "keep just two tokens", targets: [sources] }
      - say: Look at the first number each word carries. Birds carries two. Sing carries one. For this read, sing takes about forty two percent of what Birds carries, and about fifty eight percent of what sing carries. Which word supplies more of the first output number?
        hold: 3.0
        caption_starts: ["Which word supplies more"]
        visual_cues:
          - { id: first-number, phrase: "the first number each word carries", targets: [ruler] }
          - { id: birds-input, phrase: "Birds carries two", targets: [birds-value] }
          - { id: sing-input, phrase: "Sing carries one", targets: [sing-value] }
          - { id: birds-share, phrase: "forty two percent", targets: [birds-value] }
          - { id: sing-share, phrase: "fifty eight percent", targets: [sing-value] }
          - { id: contribution-question, phrase: "Which word supplies more", targets: [ruler] }
      - say: Birds supplies about point eight four. Sing supplies about point five eight. The smaller share of two gives the longer piece. Add those pieces. The first number that comes back to sing is about one point four two. Where did sing get those shares? Follow its query.
        hold: 0.8
        caption_starts: ["Where did sing get those shares"]
        visual_cues:
          - { id: birds-piece, phrase: "Birds supplies about point eight four", targets: [birds-contribution] }
          - { id: sing-piece, phrase: "Sing supplies about point five eight", targets: [sing-contribution], caption_boundary: true }
          - { id: add-pieces, phrase: "Add those pieces", targets: [coordinate-sum], caption_boundary: true }
          - { id: first-total, phrase: "The first number that comes back to sing is about one point four two", targets: [coordinate-sum], caption_boundary: true }

  - id: vectors
    title: Every word asks, answers, and carries
    visual: One token state splits three ways through three learned matrices, then the query and key arrows draw themselves on a plane.
    beats:
      - say: Each word gets three vectors, each with its own job. A query says what this word is looking for. A key says what this word can be found by. And a value is what it actually hands over when someone picks it.
        hold: 0.4
        visual_cues:
          - { id: query, phrase: A query says, targets: [roles], color: yellow }
          - { id: key, phrase: A key says, targets: [roles], color: blue }
          - { id: value, phrase: a value is, targets: [roles], color: green }
      - say: Where do they come from? Each word starts with a state, which is just a list of numbers. In our toy example, birds is one, zero, and sing is zero, one. Three learned matrices project that one state three different ways. We call them W Q, W K, and W V, and training sets their numbers.
        hold: 0.8
        visual_cues:
          - { id: state, phrase: "starts with a state", targets: [picture], color: yellow }
          - { id: project, phrase: "project that one state", targets: [picture], color: yellow }
          - { id: training, phrase: "training sets their numbers", targets: [picture], color: yellow }
      - say: Why three? If we scored the states directly, the same numbers would have to ask and answer, and the raw score from birds to sing would always equal the score from sing to birds. Separate matrices let what a word wants differ from what it offers, and let what it hands over differ from both.
        hold: 0.8
        visual_cues:
          - { id: why-three, phrase: "Why three", targets: [picture], color: yellow }
          - { id: same-both, phrase: "the raw score from birds", targets: [picture], color: yellow }
          - { id: separate, phrase: "Separate matrices", targets: [picture], color: yellow }
          - { id: hands-over, phrase: "what it hands over", targets: [picture], color: yellow }
      - say: Each arrow has two coordinates. The query for sing points up and to the right. The key for birds lies low. The key for sing stands tall.
        hold: 0.7
        visual_cues:
          - { id: query-arrow, phrase: The query for sing, targets: [plane], color: yellow }
          - { id: birds-key, phrase: The key for birds, targets: [plane], color: blue }
          - { id: sing-key, phrase: The key for sing, targets: [plane], color: cyan }
          - { id: numbers, phrase: "Each arrow has two coordinates", targets: [picture], color: yellow }

  - id: score
    title: A match is a dot product
    visual: The query rotates and a live score rises and falls. The query then stays fixed while the key changes from Birds to sing. Each dot product stays open until its answer is spoken.
    beats:
      - say: How well does a query match a key? Multiply them, piece by piece, and add. That's a dot product. Watch what that number does as the query turns. Pointing the same way, it's high. Pointing apart, it falls.
        hold: 0.4
        visual_cues:
          - { id: same-way, phrase: "Pointing the same way", targets: [picture], color: yellow }
          - { id: apart, phrase: "Pointing apart", targets: [picture], color: yellow }
          - { id: falls, phrase: "it falls", targets: [picture], color: yellow }
          - { id: multiply, phrase: Multiply them, targets: [formula], color: yellow }
          - { id: turns, phrase: as the query turns, targets: [plane], color: yellow }
      - say: Length counts too. A longer key can beat a shorter key that points closer to the query, because a dot product measures length as well as angle.
        hold: 0.4
        visual_cues:
          - { id: length, phrase: "Length counts too", targets: [picture], color: yellow }
          - { id: longer, phrase: "A longer key", targets: [picture], color: yellow }
          - { id: length-angle, phrase: "length as well as angle", targets: [picture], color: yellow }
      - say: Hold the query for sing still. Against the birds key, point five times point eight, plus one times point two, gives point six. Keep that query. Now try the sing key. What score do you get?
        hold: 2.0
        caption_starts: ["gives point six", "Keep that query"]
        visual_cues:
          - { id: birds-score, phrase: "Against the birds key point five times point eight plus one times point two gives point six", targets: [formula], color: blue }
          - { id: real-ones, phrase: "Hold the query for sing still", targets: [picture], color: yellow }
          - { id: try-sing, phrase: "Now try the sing key", targets: [key, dot-product], color: cyan }
      - say: One point oh five. So sing matches itself better than it matches birds, but birds isn't zero. Remember that.
        hold: 1.6
        visual_cues:
          - { id: sing-result, phrase: "One point oh five", targets: [dot-product], color: cyan }
          - { id: sing-score, phrase: "So sing matches itself better", targets: [formula], color: cyan }
          - { id: not-zero, phrase: birds isn't zero, targets: [formula], color: yellow }

  - id: softmax
    title: Scores become shares
    visual: Score bars shrink when scaled, then become one bar split into shares, and raising one score takes share from the other.
    beats:
      - say: Before we use these scores, we divide by the square root of the key width, which is how many numbers each key holds. We'll earn that step in a few minutes. With a width of two, that's root two. Point four two, and point seven four.
        hold: 0.7
        visual_cues:
          - { id: divide, phrase: divide by the square root, targets: [equation], color: yellow }
          - { id: scaled, phrase: "Point four two and point seven four", targets: [bars], color: yellow }
      - say: Softmax turns those into shares that add up to exactly one. Papers call the scaled scores logits, and the shares attention weights. Raise e to each score, then divide by the total. Forty two percent for birds, and fifty eight percent for sing.
        hold: 1.6
        visual_cues:
          - { id: softmax, phrase: Softmax turns those, targets: [equation], color: yellow }
          - { id: shares, phrase: "Forty two percent for birds and fifty eight percent for sing", targets: [share-bar], color: blue }
          - { id: names, phrase: "Papers call", targets: [picture], color: yellow }
          - { id: exp, phrase: "Raise e to each score then divide by the total", targets: [picture], color: yellow }
      - say: These shares compete. Turn the sing score up, and its share grows by taking share from birds. The total stays at one.
        hold: 0.4
        visual_cues:
          - { id: compete, phrase: "These shares compete", targets: [picture], color: yellow }
          - { id: turn-up, phrase: "Turn the sing score up", targets: [picture], color: yellow }
          - { id: total, phrase: "The total stays", targets: [picture], color: yellow }

  - id: mix
    title: The answer is a mixture
    visual: Two value arrows are scaled by their shares and added tip to tail, and a point slides to the output for sing.
    beats:
      - say: We're back at the opening split. The query and the keys gave us the shares. Now bring in the two values. Each has two coordinates, so each source has two numbers to contribute.
        hold: 0.4
        visual_cues:
          - { id: values-appear, phrase: "bring in the two values", targets: [plane], color: green }
      - say: Birds hands over two, one. Sing hands over one, two. Take forty two percent of the first, and fifty eight percent of the second, and add them, tip to tail.
        hold: 0.3
        visual_cues:
          - { id: birds-value, phrase: Birds hands over, targets: [plane], color: blue }
          - { id: sing-value, phrase: Sing hands over, targets: [plane], color: cyan }
          - { id: scale-values, phrase: "Take forty two percent of the first and fifty eight percent of the second and add them tip to tail", targets: [plane], color: yellow }
          - { id: tip-to-tail, phrase: tip to tail, targets: [plane], color: yellow }
      - say: One point four two, one point five eight. That's the vector attention hands back to sing. Follow the blue arrow sideways and you can see the piece we measured at the start. Birds supplied more of that first coordinate. Now look up. The green arrow supplies more of the second. Both contributions belong to the same blend.
        hold: 1.8
        visual_cues:
          - { id: result, phrase: "One point four two one point five eight", targets: [plane], color: yellow }
          - { id: new-meaning, phrase: hands back to sing, targets: [plane], color: yellow }
          - { id: blended, phrase: "the same blend", targets: [picture], color: yellow }
      - say: And because the shares are positive and add to one, the point lands on the line between the two values. That holds as long as training isn't randomly dropping shares, a trick called attention dropout. With it on, the shares may not add to one. And later steps in the model can move the point elsewhere.
        hold: 0.4
        visual_cues:
          - { id: on-line, phrase: "lands on the line", targets: [picture], color: yellow }
          - { id: dropout, phrase: "attention dropout", targets: [picture], color: yellow }
          - { id: later, phrase: "later steps", targets: [picture], color: yellow }

  - id: matrix
    title: One line for every word
    visual: A real matrix moves through each operation as the attention formula assembles itself term by term, with the shape written under each step.
    beats:
      - say: In one pass over a sentence, every word does this together, so stack the vectors into matrices. Q, K, and V.
        hold: 0.3
        visual_cues:
          - { id: stack, phrase: stack the vectors, targets: [matrices], color: blue }
      - say: Q times K transposed gives every score at once. Divide by root d, where d is the key width. Softmax each row, so every word gets its own shares. Multiply by V. That's scaled dot product attention, in one line.
        hold: 0.5
        visual_cues:
          - { id: qk, phrase: "Q times K transposed gives every score at once", targets: [equation], color: yellow }
          - { id: root-d, phrase: "Divide by root d where d is the key width", targets: [equation], color: yellow }
          - { id: softmax-rows, phrase: "Softmax each row so every word gets its own shares", targets: [equation], color: yellow }
          - { id: times-v, phrase: "Multiply by V", targets: [equation], color: green }
          - { id: one-line, phrase: in one line, targets: [equation], color: yellow }
      - say: Run both rows through it. Birds gives fifty three percent to itself and forty seven to sing, and lands at one point five three, one point four seven. Sing gets the shares we just worked out.
        hold: 1.4
        visual_cues:
          - { id: both-rows, phrase: "Run both rows", targets: [picture], color: yellow }
          - { id: birds-row, phrase: "Birds gives fifty three", targets: [picture], color: yellow }
          - { id: sing-row, phrase: "Sing gets the shares", targets: [picture], color: yellow }
      - say: Now watch the shapes, because this is where code goes wrong. Q has one row per query, and K has one row per key, and their widths must match. Transposing K turns its rows into columns, so every query meets every key. The score grid gets one row per query and one column per key. Forget the transpose, and you usually get a crash. But if the number of keys happens to equal the key width, it runs and computes the wrong thing. So test with unequal sizes.
        hold: 1.0
        visual_cues:
          - { id: widths, phrase: "their widths must match", targets: [picture], color: yellow }
          - { id: rows-cols, phrase: "turns its rows into columns", targets: [picture], color: yellow }
          - { id: every-key, phrase: "every query meets every key", targets: [picture], color: yellow }
          - { id: shapes, phrase: "watch the shapes", targets: [picture], color: yellow }
          - { id: q-rows, phrase: "Q has one row per query", targets: [picture], color: yellow }
          - { id: k-rows, phrase: "K has one row per key", targets: [picture], color: yellow }
          - { id: transpose, phrase: "Transposing K", targets: [picture], color: yellow }
          - { id: score-grid, phrase: "The score grid", targets: [picture], color: yellow }
          - { id: crash, phrase: "Forget the transpose", targets: [picture], color: yellow }
          - { id: same-size, phrase: "happens to equal", targets: [picture], color: yellow }
          - { id: unequal, phrase: "test with unequal", targets: [picture], color: yellow }
      - say: Softmax runs across each row, over the keys, so each query gets its own budget of one. Run it over the queries instead, and you silently get a different operation. Rows add to one. Columns don't have to. Here they're about point nine five and one point oh five, because one source can feed many readers.
        hold: 0.4
        visual_cues:
          - { id: across, phrase: "across each row", targets: [picture], color: yellow }
          - { id: wrong-axis, phrase: "over the queries", targets: [picture], color: yellow }
          - { id: rows-one, phrase: "Rows add to one", targets: [picture], color: yellow }
          - { id: columns, phrase: "Here they're about point nine five and one point oh five", targets: [picture], color: yellow }
      - say: Then multiply by V. The key axis is replaced by the width of a value, so you get one output row per query, as wide as a value. That width doesn't have to match the key width.
        hold: 0.8
        visual_cues:
          - { id: multiply-v, phrase: "Then multiply by V", targets: [picture], color: yellow }
          - { id: one-output, phrase: "one output row", targets: [picture], color: yellow }
          - { id: width-note, phrase: "doesn't have to match", targets: [picture], color: yellow }

  - id: mask
    title: "Masks: the future and the padding"
    visual: A blocked score becomes negative infinity and its share becomes zero, a triangle of allowed reads grows across a sentence, and a padded row is left with nothing to read.
    beats:
      - say: One more rule. Scores say what's relevant. A mask says what's allowed. While a model generates text, a word can't read words that don't exist yet. In training those words do exist, so without a mask the model can read the very answer it's meant to predict. Its loss looks good, and then generation fails.
        hold: 0.4
        visual_cues:
          - { id: relevant, phrase: "Scores say", targets: [picture], color: yellow }
          - { id: allowed, phrase: "A mask says", targets: [picture], color: yellow }
          - { id: not-yet, phrase: "don't exist yet", targets: [picture], color: yellow }
          - { id: in-training, phrase: "In training", targets: [picture], color: yellow }
          - { id: answer, phrase: "the very answer", targets: [picture], color: yellow }
          - { id: loss, phrase: "loss looks good", targets: [picture], color: yellow }
          - { id: fails, phrase: "generation fails", targets: [picture], color: yellow }
      - say: So after scaling and before softmax, we set the blocked scores to negative infinity, and softmax turns that into exactly zero. Because the mask comes first, the allowed keys share the whole budget among themselves. Zero the shares after softmax instead, and the row no longer adds to one.
        hold: 0.4
        visual_cues:
          - { id: negative-infinity, phrase: negative infinity, targets: [weights], color: red }
          - { id: exactly-zero, phrase: exactly zero, targets: [weights], color: yellow }
          - { id: after-scaling, phrase: "after scaling", targets: [picture], color: yellow }
          - { id: budget, phrase: "Because the mask comes first the allowed keys share the whole budget among themselves", targets: [picture], color: yellow }
          - { id: zero-after, phrase: "Zero the shares after softmax instead and the row no longer adds to one", targets: [picture], color: yellow }
      - say: Birds can only read itself, so it keeps its own value. Sing can read both. Do that for a whole sentence, and the allowed reads form a triangle. Each word can read itself and everything before it, and nothing after.
        hold: 0.9
        visual_cues:
          - { id: birds-alone, phrase: Birds can only read itself, targets: [weights], color: blue }
          - { id: triangle, phrase: form a triangle, targets: [triangle], color: yellow }
      - say: Padding needs its own care. A batch fills short sentences with fake tokens, and a padding mask stops every query from reading them. But a fake token can also be a query. With left padding, where the fake tokens come first, the triangle and the padding mask together can leave it with no key it's allowed to read.
        hold: 0.4
        visual_cues:
          - { id: padding, phrase: "Padding needs", targets: [picture], color: yellow }
          - { id: fake, phrase: "fills short sentences", targets: [picture], color: yellow }
          - { id: pad-mask, phrase: "padding mask stops", targets: [picture], color: yellow }
          - { id: as-query, phrase: "can also be a query", targets: [picture], color: yellow }
          - { id: left-pad, phrase: "With left padding", targets: [picture], color: yellow }
          - { id: both-masks, phrase: "padding mask together", targets: [picture], color: yellow }
          - { id: no-key, phrase: "no key it's allowed", targets: [picture], color: yellow }
      - say: Softmax has no answer for a row with nothing allowed. The textbook formula gives not a number, and some fast implementations, called kernels, quietly return zeros. And don't paper over it with a large negative number. Overwrite every score in the row with that number, and they all tie, so softmax invents an even split over keys that were supposed to be blocked. So make sure every real query has a key to read, and zero out padded queries on purpose.
        hold: 0.8
        visual_cues:
          - { id: no-answer, phrase: "Softmax has no answer", targets: [picture], color: yellow }
          - { id: nan, phrase: "The textbook formula gives not a number", targets: [picture], color: yellow }
          - { id: kernels, phrase: "called kernels", targets: [picture], color: yellow }
          - { id: overwrite, phrase: "Overwrite every score", targets: [picture], color: yellow }
          - { id: even-split, phrase: "Overwrite every score in the row with that number and they all tie so softmax invents an even split over keys that were supposed to be blocked", targets: [picture], color: yellow }
          - { id: real-query, phrase: "every real query", targets: [picture], color: yellow }
          - { id: zero-out, phrase: "zero out padded", targets: [picture], color: yellow }

  - id: why-scale
    title: Why divide by the square root?
    visual: A bell curve of raw scores widens as the width grows, softmax collapses onto one key, then dividing snaps the curve back to the same width.
    beats:
      - say: Now, that division. In our toy example it barely changes anything. So why is it in the formula? Watch what happens as the vectors get wider.
        hold: 0.4
        visual_cues:
          - { id: barely, phrase: "barely changes", targets: [picture], color: yellow }
      - say: Take a simple model. Every number in the query and the key is random and independent, with average zero and variance one. Each product in the dot product then has variance one as well. Add up d of those products, and their variances add, so the total variance is d, and the standard deviation is root d.
        hold: 1.0
        visual_cues:
          - { id: simple-model, phrase: "Take a simple model", targets: [picture], color: yellow }
          - { id: each-product, phrase: "Each product", targets: [picture], color: yellow }
          - { id: add-up, phrase: "their variances add", targets: [picture], color: yellow }
          - { id: root-d, phrase: "standard deviation is root d", targets: [picture], color: yellow }
      - say: At width sixty four, that's a standard deviation of eight. At five hundred twelve, about twenty three. The raw scores spread out as the vectors get wider.
        hold: 0.4
        visual_cues:
          - { id: w64, phrase: "At width sixty four that's a standard deviation of eight", targets: [picture], color: yellow }
          - { id: w512, phrase: "At five hundred twelve about twenty three", targets: [picture], color: yellow }
      - say: And softmax cares about gaps, not sizes. Add a thousand to every score, and the shares don't change at all. But a gap of ten makes one share about twenty two thousand times bigger than another. If one key leads all the others by that much, and there are only a few keys, nearly all the share lands on it.
        hold: 0.9
        visual_cues:
          - { id: gaps, phrase: "cares about gaps", targets: [picture], color: yellow }
          - { id: add-thousand, phrase: "Add a thousand", targets: [picture], color: yellow }
          - { id: gap-ten, phrase: "But a gap of ten makes one share about twenty two thousand times bigger than another", targets: [picture], color: yellow }
          - { id: leader, phrase: "one key leads", targets: [picture], color: yellow }
      - say: Why does that hurt? Learning depends on how much the output changes when a score changes. With three tied keys, nudging one score moves its share by about point two two per unit of score. With a twenty point lead, the same nudge moves the leader's share by about four billionths. So the gradient through the scores nearly vanishes, and that row can barely learn to look somewhere else. The leading key's value can still learn, because changing it still moves the output.
        hold: 0.5
        visual_cues:
          - { id: hurt, phrase: "Why does that hurt", targets: [picture], color: yellow }
          - { id: tied, phrase: "With three tied keys nudging one score moves its share by about point two two per unit of score", targets: [picture], color: yellow }
          - { id: lead, phrase: "With a twenty point lead the same nudge moves the leader's share by about four billionths", targets: [picture], color: yellow }
          - { id: gradient, phrase: "gradient through the scores", targets: [picture], color: yellow }
          - { id: value-learns, phrase: "value can still learn", targets: [picture], color: yellow }
      - say: So divide by root d. Dividing a number by root d divides its variance by d, so the variance returns to one at every width. Eight shrinks back to one. Why not divide by d? Because the spread grows like root d, so dividing by d would shrink the scores more and more as the vectors widen.
        hold: 0.9
        visual_cues:
          - { id: divide-back, phrase: "So divide by root d", targets: [picture], color: yellow }
          - { id: eight, phrase: "Eight shrinks", targets: [picture], color: yellow }
          - { id: not-d, phrase: "Why not divide", targets: [picture], color: yellow }
      - say: We got that spread of one by drawing each coordinate independently. A trained head builds queries and keys from shared states, so their coordinates can be correlated. To see the spread that head actually uses, measure its scores across inputs.
        hold: 0.5
        visual_cues:
          - { id: limits, phrase: "We got that spread of one", targets: [picture], color: yellow }
          - { id: shared, phrase: "shared states", targets: [picture], color: yellow }
          - { id: measure, phrase: "measure its scores", targets: [picture], color: yellow }

  - id: types
    title: Who may read whom
    visual: Three grids sit side by side, a full square, a lower triangle, and a rectangle whose rows and columns come from two different sequences.
    beats:
      - say: The formula doesn't decide who may read whom. The mask and the sources of Q, K, and V do. That gives three common patterns.
        hold: 0.3
      - say: First, bidirectional self attention. Q, K, and V all come from one sequence, and each real token can read all the others, before and after it. Encoders are models that read a complete input, such as BERT and the original Vision Transformer. They work this way because the whole input is already there. If there's any padding, that's all you mask.
        hold: 0.4
        visual_cues:
          - { id: first, phrase: "First, bidirectional", targets: [picture], color: yellow }
          - { id: before-after, phrase: "before and after it", targets: [picture], color: yellow }
          - { id: encoders, phrase: "Encoders are models", targets: [picture], color: yellow }
          - { id: pad-only, phrase: "any padding", targets: [picture], color: yellow }
      - say: Second, causal self attention. It's the same single sequence, with the triangle you just saw. Decoders generate output one token at a time. Decoder only models, such as GPT style models, use it to predict the next token.
        hold: 0.4
        visual_cues:
          - { id: second, phrase: "Second, causal", targets: [picture], color: yellow }
          - { id: decoder-only, phrase: "Decoder only models", targets: [picture], color: yellow }
