        visual_cues:
          - { id: need-largest, phrase: "needs the largest score", targets: [picture], color: yellow }
          - { id: two-running, phrase: "two running numbers", targets: [picture], color: yellow }
          - { id: adds-one, phrase: "adds one more", targets: [picture], color: yellow }
          - { id: rescale, phrase: "When a larger score", targets: [picture], color: yellow }
          - { id: shrink-carry, phrase: "multiply both sums", targets: [picture], color: yellow }
      - say: Try it with one number in each value. The first tile has score one thousand and value two. Subtract that score from itself and the exponent is zero. So the running sum is one, and the weighted sum is two.
