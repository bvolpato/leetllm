        visual_cues:
          - { id: try-it, phrase: "Try it with", targets: [picture], color: yellow }
          - { id: first-tile, phrase: "The first tile", targets: [picture], color: yellow }
          - { id: first-state, phrase: "So the running sum is one and the weighted sum is two", targets: [running-sums], caption_boundary: true }
      - say: The next tile brings two pairs. The score one thousand and one carries value one. Nine hundred ninety nine carries four. Look at the old maximum and the new high score. What factor should we apply to both sums from the first tile?
        hold: 3.0
        visual_cues:
          - { id: next-tile, phrase: "The next tile", targets: [picture], color: yellow }
          - { id: paired-inputs, phrase: "Nine hundred ninety nine carries four", targets: [score-ruler] }
          - { id: carry-question, phrase: "What factor should we apply", targets: [running-sums] }
      - say: The maximum moved up by one, so multiply both old sums by e to the minus one. One unit of mass becomes about point three seven. Two units in the weighted sum become about point seven four. Now add the new terms. The new high score sits at zero on the shifted ruler. It adds one unit of mass and one unit of value. The low score sits two below the maximum. Its contribution to the weighted sum is four times its mass. We've counted three values. To get their weighted average, do we divide by the total mass or by three?
        hold: 3.0
        visual_cues:
          - { id: rises, phrase: "The maximum moved up by one so multiply both old sums by e to the minus one", targets: [score-ruler, running-sums] }
          - { id: add-new, phrase: "Now add the new terms. The new high score sits at zero on the shifted ruler. It adds one unit of mass and one unit of value. The low score sits two below the maximum. Its contribution to the weighted sum is four times its mass", targets: [running-sums] }
          - { id: high-term, phrase: "The new high score sits", targets: [score-ruler] }
          - { id: low-term, phrase: "The low score sits", targets: [score-ruler] }
          - { id: choose-divisor, phrase: "To get their weighted average", targets: [divisor-choices], caption_boundary: true }
      - say: Divide the weighted sum by the mass. Only the highest score contributes a full unit to the mass. The other two contribute fractions. The output is about one point five one. A single softmax over all three scores gives the same answer.
        hold: 1.4
        visual_cues:
          - { id: use-mass, phrase: "Divide the weighted sum by the mass", targets: [divisor-choices] }
          - { id: divide-end, phrase: "The output is about one point five one", targets: [output], caption_boundary: true }
          - { id: full-row, phrase: "the same answer", targets: [output] }
      - say: FlashAttention computes exact attention. It visits every query and key pair the mask allows. Once a tile has contributed to the output, its scores can go. Saving row statistics takes space proportional to the number of queries. On the backward pass the kernel recomputes the tiles. That extra arithmetic saves trips to main memory. To see what that trade buys on your GPU, time a training step at your sequence length.
        hold: 0.5
        visual_cues:
          - { id: exact, phrase: "exact attention", targets: [picture], color: yellow }
          - { id: allowed-pairs, phrase: "the mask allows", targets: [picture], color: yellow }
          - { id: goes-away, phrase: "Once a tile has contributed", targets: [picture], color: yellow }
          - { id: row-stats, phrase: "row statistics", targets: [picture], color: yellow }
          - { id: backward, phrase: "backward pass", targets: [picture], color: yellow }
          - { id: trade, phrase: "extra arithmetic", targets: [picture], color: yellow }
          - { id: measure-it, phrase: "time a training step", targets: [picture], color: yellow }
      - say: Keep the two fixes apart. If training is limited by storing and moving score grids, that's temporary data, and FlashAttention targets it. If generation is limited by storing and reading the cache, that's persistent data, and multi query or grouped query attention targets it.
        hold: 0.5
        visual_cues:
          - { id: apart, phrase: "Keep the two fixes", targets: [picture], color: yellow }
          - { id: fix-train, phrase: "If training is limited", targets: [picture], color: yellow }
          - { id: fix-generate, phrase: "If generation is limited", targets: [picture], color: yellow }

  - id: mistakes
    title: Reading the symptoms
    visual: Each symptom appears beside the step of the formula that causes it, until the whole formula is annotated.
    beats:
      - say: When attention misbehaves, the symptom usually points to the step. A shape error, or wrong scores when the sizes happen to match, points to a missing transpose. With attention dropout off, a real query's row that doesn't add to one points to softmax on the wrong axis, or to a mask applied after softmax. Shares that pile onto one key as the width grows point to missing scaling.
        hold: 0.8
        visual_cues:
          - { id: after-softmax, phrase: "a mask applied after softmax", targets: [picture], color: yellow }
          - { id: shape, phrase: "A shape error", targets: [picture], color: yellow }
          - { id: wrong-axis, phrase: "softmax on the wrong axis", targets: [picture], color: yellow }
          - { id: scaling, phrase: "missing scaling", targets: [picture], color: yellow }
      - say: If you see not a number, check in order. Are the inputs finite? Did the scores overflow before masking? Does each row have a key it may read? Only then look at softmax.
        hold: 0.4
        visual_cues:
          - { id: nan, phrase: "see not a number", targets: [picture], color: yellow }
          - { id: finite, phrase: "inputs finite", targets: [picture], color: yellow }
          - { id: overflowed, phrase: "scores overflow", targets: [picture], color: yellow }
          - { id: row-key, phrase: "key it may read", targets: [picture], color: yellow }
          - { id: only-then, phrase: "Only then", targets: [picture], color: yellow }
      - say: A new token that seems to forget its history points to local positions in a cached mask. A decoder reading fake tokens points to a missing padding mask. And a bad long context estimate often comes from mixing up three separate costs. Score memory, cache memory, and the work itself.
        hold: 0.5
        visual_cues:
          - { id: forgets, phrase: "forget its history", targets: [picture], color: yellow }
          - { id: fake-tokens, phrase: "reading fake tokens", targets: [picture], color: yellow }
          - { id: estimate, phrase: "long context estimate", targets: [picture], color: yellow }
          - { id: c-score, phrase: "Score memory", targets: [picture], color: yellow }
          - { id: c-cache, phrase: "cache memory", targets: [picture], color: yellow }
          - { id: c-work, phrase: "the work itself", targets: [picture], color: yellow }

  - id: your-turn
    title: Change the reader
    visual: The reader state multiplies the query matrix above the two source columns. The four dot products stay visible while two bars compare how far sing leads Birds with each query. Each new share scales its source's two coordinates. The viewer adds the labeled pieces in each stack before the two totals appear.
    beats:
      - say: Here are the same two source tokens. Keep their keys and values fixed. Give a separate reader the state one, three. Multiply that row by the same query matrix. The new query is two point five, three point five. Compare its two dot products with the old ones. Which source gains share?
        hold: 5.0
        caption_starts: ["Give a separate reader", "The new query is", "Compare its two dot products"]
        visual_cues:
          - { id: reader, phrase: "Give a separate reader the state one three", targets: [reader, query-matrix] }
          - { id: new-query, phrase: "The new query is two point five three point five", targets: [query, products] }
          - { id: predict, phrase: "Which source gains share", targets: [products] }
      - say: Multiply across each key. Birds scores two point seven. Sing scores three point nine. Both scores rose. Subtract the Birds score from the sing score. With the old query, sing led by point four five. Now it leads by one point two. Divide both scores by root two and run softmax over the pair.
        hold: 0.6
        visual_cues:
          - { id: score-it, phrase: "Multiply across each key", targets: [products] }
          - { id: birds-score, phrase: "Birds scores two point seven", targets: [birds-score], caption_boundary: true }
          - { id: sing-score, phrase: "Sing scores three point nine", targets: [sing-score], caption_boundary: true }
          - { id: compare-leads, phrase: "Subtract the Birds score from the sing score", targets: [score-gaps] }
          - { id: old-lead, phrase: "With the old query sing led by point four five", targets: [old-gap], caption_boundary: true }
          - { id: new-lead, phrase: "Now it leads by one point two", targets: [new-gap], caption_boundary: true }
          - { id: scale, phrase: "Divide both scores by root two", targets: [scaled-scores] }
      - say: Birds gets about thirty percent and sing gets about seventy. Sing gains. Keep those shares and bring the values back. Take thirty percent of the Birds value and seventy percent of the sing value. Add the pieces in each stack. What are the two totals, from left to right?
        hold: 2.0
        caption_starts: ["Add the pieces in each stack"]
        visual_cues:
          - { id: new-shares, phrase: "Birds gets about thirty percent and sing gets about seventy", targets: [shares] }
          - { id: gains, phrase: "Sing gains", targets: [shares], caption_boundary: true }
          - { id: mix, phrase: "bring the values back", targets: [values] }
          - { id: stack, phrase: "Take thirty percent of the Birds value and seventy percent of the sing value", targets: [coordinate-sums] }
          - { id: predict-sums, phrase: "What are the two totals from left to right", targets: [output], caption_boundary: true }
      - say: About one point three, one point seven.
        hold: 1.6
        visual_cues:
          - { id: sum, phrase: "about one point three one point seven", targets: [output] }

  - id: close
    title: Keep the shares
    visual: The previous read stays on screen. Only the second coordinate of the Birds value changes. Its blue contribution grows under the green contribution, while the first stack stays at its old height. One bird image splits into four patch tokens for the next read.
    beats:
      - say: Leave the reader and both keys alone. Now change just the second number in the Birds value, from one to three. The shares stay where they are. Which output number changes, and by how much?
        hold: 3.5
        visual_cues:
          - { id: edit, phrase: "change just the second number", targets: [birds-value] }
          - { id: predict-edit, phrase: "Which output number changes", targets: [coordinate-sums] }
      - say: The second number rises by about point six. Birds carries two extra units there, and this reader takes thirty percent of them. The green piece rides up with the blue one underneath. Its own size stays the same. The first coordinate is still one point three. The second is now two point three.
        hold: 1.4
        caption_starts: ["The first coordinate is still"]
        visual_cues:
          - { id: answer, phrase: "The second number rises by about point six", targets: [coordinate-sums] }
      - say: The output projection mixes this blend with the other heads' outputs. The residual connection adds the result to the reader's state. The next block can read from states that already carry context.
        hold: 0.5
      - say: Now take an image of a bird. Cut it into four patches. In a vision transformer's image encoder, each patch has a token. Which patches may the top left patch read?
        hold: 2.0
        caption_starts: ["Cut it into four patches", "Which patches may the top left patch read"]
        visual_cues:
          - { id: image, phrase: "take an image", targets: [bird-image] }
          - { id: cut, phrase: "Cut it into four patches", targets: [patches] }
          - { id: patch-query, phrase: "Which patches may", targets: [patch-query] }
      - say: In full bidirectional attention it can read all four patches, including itself. The whole image is already there. That's the read we'll build in the next lesson.
        hold: 1.6
        caption_starts: ["it can read all four patches", "The whole image is already there"]
        visual_cues:
          - { id: all-patches, phrase: "it can read all four patches", targets: [patch-reads] }
