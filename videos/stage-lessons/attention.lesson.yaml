  - id: learn
    title: Follow the output point
    visual: The same one-unit increase in the Birds logit moves a gold point between distinct values. When the value endpoints coincide, the shares change by exactly as much and the point stays put. A mask then isolates the sing value.
    beats:
      - say: Find the gold point. That's the output of our original read. The blue ring marks the Birds value and the green ring marks the sing value. Dropout is off. Raise the Birds logit by one and leave the sing logit alone. More of the row goes to Birds. The point travels toward its blue ring.
        hold: 0.7
        visual_cues:
          - { id: raise-first, phrase: "Raise the Birds logit by one", targets: [scores, output] }
      - say: How strong is that pull? For a small increase in one logit, the change per unit is its share times the difference between its value and the current output. A training loss can use that movement to adjust the query and key projections through backpropagation.
        hold: 0.7
        visual_cues:
          - { id: pull, phrase: "How strong is that pull", targets: [derivative] }
      - say: Put the score back. Here the slope is about point two four in the first coordinate and minus point two four in the second. Now move both values to three, minus one. The two rings meet. Birds has forty two percent again. Raise its logit by one, just as before. Its share climbs to sixty six percent. Where will the gold output point land?
        hold: 2.0
        visual_cues:
          - { id: restore, phrase: "Put the score back", targets: [scores] }
          - { id: meet, phrase: "move both values", targets: [value-endpoints] }
          - { id: raise-again, phrase: "Raise its logit by one", targets: [scores, shares], caption_boundary: true }
          - { id: predict, phrase: "Where will the gold output point land", targets: [output], caption_boundary: true }
      - say: The gold point lands where the rings meet, at three, minus one. Give Birds its old logit back. Its share drops to forty two percent and the point stays put. Both routes deliver the same vector, and together the shares still add to one. The gradient through either score is zero. The values can still learn. If the loss changes when this output moves, each value receives its share of that gradient.
        hold: 1.2
        visual_cues:
          - { id: fixed-output, phrase: "The gold point lands where the rings meet at three minus one", targets: [output] }
          - { id: lower-again, phrase: "Give Birds its old logit back", targets: [scores, shares, output], caption_boundary: true }
          - { id: zero-grad, phrase: "The gradient through either score is zero", targets: [derivative], caption_boundary: true }
      - say: Keep those scores. Bring back the two distinct values. This time block Birds before softmax. Sing gets the whole read. Raise the sing logit by one. Its share stays at one because it's the only allowed key. Once again the routing gradient for this row is zero.
        hold: 0.8
        visual_cues:
          - { id: distinct, phrase: "Bring back the two distinct values", targets: [value-endpoints] }
          - { id: block, phrase: "block Birds before softmax", targets: [scores, output] }
          - { id: single-score, phrase: "Raise the sing logit by one", targets: [scores, shares] }
      - say: Let Birds back in. Now push the sing logit further up. Birds still has a share, just over one percent. The output nearly reaches the sing value. A large gap can leave very little gradient through the scores even when both keys are legal. Scaling helps control those gaps. To trace what reaches the rest of the model, follow the weighted values through the output projection and the later layers.
        hold: 0.9
        visual_cues:
          - { id: unblock, phrase: "Let Birds back in", targets: [scores, shares] }
          - { id: concentrate, phrase: "push the sing logit further up", targets: [scores, output] }

