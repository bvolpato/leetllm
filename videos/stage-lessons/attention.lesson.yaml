  - id: paper-reference
    title: Read the paper through the mechanism
    visual: The actual v7 title and Equation 1 connect to our computed two-word row. Measured highlights then trace Figure 2 from Q and K through score, scale, mask, softmax and value mixing, before following the separate per-head projections, Concat and output Linear on its right. The paper remains attributed, and the established Birds and sing context stays visible.
    beats:
      - say: Let's read the source through the mechanism we have built. Attention Is All You Need is the 2017 Transformer paper by Vaswani and colleagues. Equation one writes the unmasked calculation we just followed.
        hold: 0.8
        visual_cues:
          - { id: paper-title, phrase: "Attention Is All You Need", targets: [paper-title], color: blue }
          - { id: paper-equation, phrase: "Equation one", targets: [paper-equation], color: yellow }
      - say: Here, Q holds the queries and K the keys. Q times K transpose makes the grid of query key dot products. The denominator is the square root of d k, the key width. Softmax runs across the keys for each query. Multiplying those shares by V gives a weighted blend of values. Our two word row is one row of this equation.
        hold: 1.2
        visual_cues:
          - { id: equation-query-key, phrase: "Q times K transpose", targets: [equation-query-key], color: yellow }
          - { id: equation-scale, phrase: "square root of d k", targets: [equation-scale], color: yellow }
          - { id: equation-softmax, phrase: "Softmax runs across the keys for each query", targets: [equation-softmax], color: green }
          - { id: equation-values, phrase: "Multiplying those shares by V", targets: [equation-values], color: blue }
          - { id: equation-toy-row, phrase: "Our two word row", targets: [toy-row], color: cyan }
      - say: The left half of Figure two draws the same data path from the bottom upward. Q and K enter the lower matrix multiply. Scale divides its scores, the optional mask excludes disallowed keys, and softmax forms the shares. V joins at the upper matrix multiply, where those shares mix the value rows. Follow the arrows. The weights choose the route, and the values carry what moves along it.
        hold: 1.0
        visual_cues:
          - { id: figure-left, phrase: "left half of Figure two", targets: [figure-left], color: yellow }
          - { id: figure-scores, phrase: "lower matrix multiply", targets: [figure-scores], color: yellow }
          - { id: figure-scale, phrase: "Scale divides its scores", targets: [figure-scale], color: yellow }
          - { id: figure-mask, phrase: "optional mask excludes disallowed keys", targets: [figure-mask], color: pink }
          - { id: figure-softmax, phrase: "softmax forms the shares", targets: [figure-softmax], color: green }
          - { id: figure-mix, phrase: "upper matrix multiply", targets: [figure-mix], color: blue }
          - { id: figure-route-content, phrase: "The weights choose the route", targets: [figure-route-content], color: cyan }
      - say: On the right, the stacked Linear blocks are learned projections, one set for each head. For self attention, their inputs come from the same token states, while the projection parameters differ between heads. The paper writes each head as attention of Q W i Q, K W i K, and V W i V. Its outer Q, K, and V name the inputs to those projections. Each head then runs the left hand calculation. The h marks the number of heads. Our drawing used two.
        hold: 1.2
        visual_cues:
          - { id: figure-projections, phrase: "stacked Linear blocks", targets: [figure-projections], color: blue }
          - { id: figure-own-parameters, phrase: "projection parameters differ between heads", targets: [figure-own-parameters], color: yellow }
          - { id: figure-head-notation, phrase: "The paper writes each head", targets: [head-notation], color: yellow }
          - { id: figure-input-notation, phrase: "name the inputs to those projections", targets: [input-notation], color: cyan }
          - { id: figure-head-core, phrase: "Each head then runs", targets: [figure-head-core], color: green }
          - { id: figure-head-count, phrase: "h marks the number of heads", targets: [figure-head-count], color: yellow }
      - say: Concat joins the head outputs side by side. The last Linear is the learned output projection, W O. This diagram stops at attention's projected result. The residual addition we showed belongs to the surrounding Transformer block. The paper's equation, its arrows, and our moving vectors describe the same score, share, and mix mechanism.
        hold: 1.5
        visual_cues:
          - { id: figure-concat, phrase: "Concat joins the head outputs side by side", targets: [figure-concat], color: yellow }
          - { id: figure-output, phrase: "learned output projection, W O", targets: [figure-output], color: green }
