    title: Why long sequences get expensive
    visual: A grid of query and key pairs doubles along both axes and quadruples in area, then a sheet of stored score grids adds up to a size in gigabytes.
    beats:
      - say: Now the bill. Each query meets each key. Four tokens make sixteen scores. Double to eight tokens, and you get sixty four. Doubling the length makes the grid four times bigger.
        hold: 0.4
        visual_cues:
          - { id: four, phrase: "Four tokens make sixteen scores", targets: [picture], color: yellow }
          - { id: eight, phrase: "Double to eight tokens and you get sixty four", targets: [picture], color: yellow }
          - { id: four-times, phrase: "four times bigger", targets: [picture], color: yellow }
      - say: At real sizes, that hurts. Take a batch of eight, thirty two heads, eight thousand one hundred ninety two tokens, and two bytes per score. Multiply them, with the token count squared. That's about thirty four gigabytes for one temporary stack of score grids, before the model's weights or anything else.
        hold: 1.5
        visual_cues:
          - { id: real-size, phrase: "At real sizes", targets: [picture], color: yellow }
          - { id: sizes, phrase: "Take a batch", targets: [picture], color: yellow }
          - { id: total, phrase: "That's about thirty four gigabytes for one temporary stack of score grids", targets: [picture], color: yellow }
      - say: Notice when this happens. In training and prompt processing, all the tokens run together, and a naive implementation stores that whole grid in the GPU's main memory. Generating text is a different problem.
        hold: 0.4
        visual_cues:
          - { id: when, phrase: "Notice when", targets: [picture], color: yellow }
          - { id: stores, phrase: "stores that whole grid", targets: [picture], color: yellow }
          - { id: different, phrase: "different problem", targets: [picture], color: yellow }

  - id: decode
    title: One new token at a time
    visual: The grid shrinks to a single row that reads a growing cache of keys and values, the cache shrinks as heads share it, and a position label fixes a broken mask.
    beats:
      - say: When a model generates, it adds one token at a time, so there's one new query, and the grid shrinks to a single row. Earlier keys and values are saved in the K V cache. In ordinary full attention, that new query scores against every cached key, and mixes every cached value.
        hold: 0.4
        visual_cues:
          - { id: one-query, phrase: "one new query", targets: [picture], color: yellow }
          - { id: saved, phrase: "Earlier keys and values", targets: [picture], color: yellow }
          - { id: reads-all, phrase: "scores against every cached key", targets: [picture], color: yellow }
          - { id: mixes-all, phrase: "mixes every cached value", targets: [picture], color: yellow }
      - say: This is where a small mistake breaks things. Say the new query sits at position four, counting from zero. In this one row batch, it's row zero. Build a triangle from local row numbers, and it can read only key zero. Most of its history is gone. It should read all five keys, because none of them is in the future. So build cached masks from absolute positions. A key is allowed if its position is at or before the query's, and it isn't padding.
        hold: 0.8
        visual_cues:
          - { id: position, phrase: "position four", targets: [picture], color: yellow }
          - { id: local, phrase: "local row numbers", targets: [picture], color: yellow }
          - { id: all-five, phrase: "all five keys", targets: [picture], color: yellow }
          - { id: rule, phrase: "A key is allowed", targets: [picture], color: yellow }
      - say: In decoding, the score grid usually isn't the problem, because each new query makes only one row. The cache is. It has to fit in the GPU's main memory, and for each new token it's read again onto the chip, so memory capacity or bandwidth can become the limit.
        hold: 0.4
        visual_cues:
          - { id: score-fine, phrase: "score grid usually", targets: [picture], color: yellow }
          - { id: one-score-row, phrase: "makes only one row", targets: [picture], color: yellow }
          - { id: fit, phrase: "It has to fit", targets: [picture], color: yellow }
          - { id: read-again, phrase: "read again onto the chip", targets: [picture], color: yellow }
          - { id: limit, phrase: "capacity or bandwidth", targets: [picture], color: yellow }
      - say: One answer is to store fewer key and value heads. In multi query attention, all the query heads share one key head and one value head. Grouped query attention sits in between, and each group of query heads shares one.
        hold: 0.4
        visual_cues:
          - { id: fewer, phrase: "fewer key and value heads", targets: [picture], color: yellow }
          - { id: mqa, phrase: "multi query attention", targets: [picture], color: yellow }
          - { id: gqa, phrase: "Grouped query attention", targets: [picture], color: yellow }
      - say: Here's a hypothetical layout. Eighty layers, sixty four query heads of width one hundred twenty eight, sixteen requests of eight thousand one hundred ninety two tokens, keys and values stored separately, and two bytes per number. With sixty four key and value heads, the cache holds about three hundred forty four gigabytes. With eight, about forty three. With one, about five.
        hold: 1.6
        visual_cues:
          - { id: hypothetical, phrase: "hypothetical layout", targets: [picture], color: yellow }
          - { id: sixty-four, phrase: "With sixty four key and value heads the cache holds about three hundred forty four gigabytes", targets: [picture], color: yellow }
          - { id: with-eight, phrase: "With eight about forty three", targets: [picture], color: yellow }
          - { id: with-one, phrase: "With one about five", targets: [picture], color: yellow }
      - say: There are limits. Each query head still computes its own scores, so sharing shrinks the cache, not a stored score grid. And you can't just reshape a trained model's cache. The saved model has to be trained for the new layout, or converted from an existing model and then trained further, and you still need to measure quality on your own task.
        hold: 0.5
        visual_cues:
          - { id: own-scores, phrase: "computes its own scores", targets: [picture], color: yellow }
          - { id: shrinks, phrase: "shrinks the cache", targets: [picture], color: yellow }
          - { id: limits, phrase: "There are limits", targets: [picture], color: yellow }
          - { id: reshape, phrase: "can't just reshape", targets: [picture], color: yellow }
          - { id: train-new, phrase: "trained for the new layout", targets: [picture], color: yellow }
          - { id: measure, phrase: "measure quality", targets: [picture], color: yellow }

  - id: stable
    title: When the numbers overflow
    visual: A huge exponent overflows to infinity, then subtracting the largest score slides the whole row down to safe values while the share bars stay still.
    beats:
      - say: Softmax has one more practical trap. It raises e to each score, and e to the one thousand is too big for standard floating point. It becomes infinity, and infinity over infinity is not a number.
        hold: 0.4
        visual_cues:
          - { id: too-big, phrase: "too big", targets: [picture], color: yellow }
          - { id: infinity, phrase: "becomes infinity", targets: [picture], color: yellow }
          - { id: nan, phrase: "not a number", targets: [picture], color: yellow }
      - say: The fix uses what we just learned. Only gaps matter, so subtract the largest score from every score first. A thousand, a thousand and one, and nine hundred ninety nine become minus one, zero, and minus two. The same factor cancels from the top and the bottom, so the shares don't change. Twenty four, sixty seven, and nine percent. For finite scores, the largest term is now e to the zero, which is one.
        hold: 0.9
        visual_cues:
          - { id: gaps, phrase: "Only gaps matter", targets: [picture], color: yellow }
          - { id: becomes, phrase: "minus one, zero, and minus two", targets: [picture], color: yellow }
          - { id: cancels, phrase: "same factor cancels", targets: [picture], color: yellow }
          - { id: stable-shares, phrase: "Twenty four sixty seven and nine percent", targets: [picture], color: yellow }
          - { id: largest-term, phrase: "the largest term", targets: [picture], color: yellow }
      - say: That can't rescue a score that has already broken. In the common sixteen bit format called F P sixteen, which takes two bytes per number, the largest number is about sixty five thousand. So three hundred times three hundred overflows to infinity during the matrix multiply, even though both inputs are fine. Casting to thirty two bits afterward keeps the infinity. You have to recompute the product in the wider type.
        hold: 0.5
        visual_cues:
          - { id: broken, phrase: "already broken", targets: [picture], color: yellow }
          - { id: fp16, phrase: "F P sixteen", targets: [picture], color: yellow }
          - { id: largest, phrase: "about sixty five thousand", targets: [picture], color: yellow }
          - { id: product, phrase: "three hundred times three hundred", targets: [picture], color: yellow }
          - { id: overflows, phrase: "So three hundred times three hundred overflows to infinity during the matrix multiply", targets: [picture], color: yellow }
          - { id: cast, phrase: "Casting to thirty two", targets: [picture], color: yellow }
          - { id: recompute, phrase: "recompute the product", targets: [picture], color: yellow }

  - id: flash
    title: Exact attention, with or without the grid
    visual: Blocks of keys and values stream past the queries. A table tracks the running maximum, mass and weighted sum. The last two totals stay in view while the viewer chooses a divisor.
    beats:
      - say: Back to that temporary grid. A data center GPU has a large main memory, called H B M, and much smaller, faster memory on the chip. A naive kernel writes the whole score grid to main memory, reads it back for softmax, writes the result, and reads that back to mix the values. Those trips can take more time than the arithmetic.
        hold: 0.4
        visual_cues:
          - { id: write-grid, phrase: "writes the whole score grid", targets: [picture], color: yellow }
          - { id: read-softmax, phrase: "reads it back for softmax", targets: [picture], color: yellow }
          - { id: write-result, phrase: "writes the result", targets: [picture], color: yellow }
          - { id: read-mix, phrase: "reads that back", targets: [picture], color: yellow }
          - { id: naive, phrase: "A naive kernel", targets: [picture], color: yellow }
          - { id: trips, phrase: "Those trips", targets: [picture], color: yellow }
      - say: FlashAttention starts from a simple point. The grid is only a step on the way to the output, so don't store it. Hold a block of queries on the chip, and stream small blocks of keys and values past it. These blocks are called tiles.
