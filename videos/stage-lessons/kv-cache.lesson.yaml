        visual_cues:
          - { id: size, phrase: "two thousand mebibytes to recover", targets: [recovery-cost] }
      - say: "The GPU can replay eight thousand positions a second. Rebuilding sixty four hundred takes eight tenths of a second. Once those pairs are back, the request can continue decoding."
        hold: 0.6
        visual_cues:
          - { id: compute-rate, phrase: "eight thousand positions a second", targets: [recovery-cost] }
          - { id: replay, phrase: "takes eight tenths of a second", targets: [recovery-cost] }
      - say: "Alternatively, save the state on the CPU and bring it back. At ten thousand mebibytes a second, the trip out takes two tenths of a second. Bring those same bytes back for another two tenths. That's four tenths of a second of transfer across both trips."
        hold: 0.7
        visual_cues:
          - { id: link, phrase: "ten thousand mebibytes a second", targets: [recovery-cost] }
          - { id: out, phrase: "trip out takes two tenths of a second", targets: [recovery-cost] }
          - { id: back, phrase: "back for another two tenths", targets: [recovery-cost] }
          - { id: round-trip, phrase: "four tenths of a second of transfer across both trips", targets: [recovery-cost] }
      - say: "Keep the request and the GPU rate fixed. This time the link moves four thousand mebibytes a second in each direction. Which takes less recovery time now, transferring the cache or replaying the tokens?"
        hold: 2.7
        visual_cues:
          - { id: slow, phrase: "four thousand mebibytes a second in each direction", targets: [recovery-cost] }
          - { id: predict, phrase: "Which takes less recovery time now", targets: [recovery-cost] }
      - say: "Half a second out. Half a second back. Replay wins here at eight tenths of a second against one second of transfer. If the request also waits in the queue, that wait adds to its recovery time before decoding can resume."
