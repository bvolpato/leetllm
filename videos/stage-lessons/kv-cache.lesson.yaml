  - id: shrink
    title: How much room can packing recover?
    visual: Three live requests exceed one budget. Tail trimming and reordering leave the total too large. Head count, precision, retained positions, and sharding then change distinct parts of the memory bill.
    beats:
      - say: Three requests need their whole histories in memory at once. Together they occupy sixteen hundred units against a budget of nine hundred sixty. Scan for unused space. Each request has just twenty four empty units at its tail. Trim all three tails and you recover seventy two units. The live pairs alone still take fifteen hundred twenty eight. Reordering the requests leaves that number where it was. To keep the same histories in this pool, we have to store fewer bytes per position.
        hold: 1.0
        visual_cues:
          - { id: full, phrase: Three requests need their whole histories, targets: [shrink], color: yellow }
          - { id: no-slot, phrase: twenty four empty units at its tail, targets: [shrink], color: yellow }
          - { id: smaller, phrase: Trim all three tails, targets: [shrink], color: yellow }
          - { id: batching, phrase: Reordering the requests, targets: [shrink], color: yellow }
          - { id: fewer, phrase: store fewer bytes, targets: [shrink], color: yellow }
          - { id: too-small, phrase: "sixteen hundred units against a budget of nine hundred sixty", targets: [shrink], color: yellow }
          - { id: paging-try, phrase: "Scan for unused space", targets: [shrink], color: yellow }
      - say: Go back to the formula. The number to change is the key value heads. Llama 3's seventy billion model has sixty four query heads, but only eight key value heads. If each query head had its own, the bill would be two thousand five hundred sixty kibibytes a token. Grouped query attention, where query heads share key value heads, brings it down to three hundred twenty. Multi query attention, with a single key value head, gets to forty.
        hold: 1.3
        visual_cues:
          - { id: formula, phrase: Go back to the formula, targets: [shrink], color: yellow }
          - { id: sixty-four, phrase: sixty four query heads, targets: [shrink], color: yellow }
          - { id: mha, phrase: "the bill would be two thousand five hundred sixty kibibytes a token", targets: [shrink], color: yellow }
          - { id: gqa, phrase: Grouped query attention, targets: [shrink], color: yellow }
          - { id: three-twenty, phrase: three hundred twenty, targets: [shrink], color: yellow, caption_boundary: true }
          - { id: mqa, phrase: Multi query attention, targets: [shrink], color: yellow }
          - { id: forty, phrase: "Multi query attention with a single key value head gets to forty", targets: [shrink], color: yellow }
          - { id: number, phrase: "number to change", targets: [shrink], color: yellow }
          - { id: eight-kv, phrase: "only eight key value heads", targets: [shrink], color: yellow }
          - { id: own, phrase: "If each query head had its own", targets: [shrink], color: yellow }
      - say: That isn't a switch you flip at serving time. The weights have to change. You train the model that way, or you convert an existing model and usually train it a little more, which is called uptraining. In the original tests, a converted grouped query model already did reasonably well, while a multi query model needed that extra training. Either way, check the quality on your task. Lower precision is another lever. Eight bit values store half the raw bytes of sixteen bit ones, if your kernels support them and your quality holds.
        hold: 0.8
        visual_cues:
          - { id: switch, phrase: a switch you flip, targets: [shrink], color: yellow }
          - { id: weights, phrase: weights have to change, targets: [shrink], color: yellow }
          - { id: convert, phrase: convert an existing model, targets: [shrink], color: yellow }
          - { id: tests, phrase: In the original tests, targets: [shrink], color: yellow }
          - { id: quality, phrase: check the quality, targets: [shrink], color: yellow }
          - { id: precision, phrase: Lower precision, targets: [shrink], color: yellow }
          - { id: half, phrase: "Eight bit values store half the raw bytes of sixteen bit ones if your kernels support them and your quality holds", targets: [shrink], color: yellow }
          - { id: train, phrase: "You train the model that way", targets: [shrink], color: yellow }
          - { id: uptrain, phrase: "called uptraining", targets: [shrink], color: yellow }
          - { id: multi-needs, phrase: "multi query model needed", targets: [shrink], color: yellow }
      - say: Other methods keep fewer positions, evicting the tokens they judge least useful. That saves memory, but it's approximate, so a later token may need what was dropped. Long contexts make all of this urgent. At about one hundred thirty one thousand tokens, the limit of the later Llama 3.1 version, that seventy billion shape's cache reaches forty gibibytes.
        hold: 0.9
        visual_cues:
          - { id: positions, phrase: keep fewer positions, targets: [shrink], color: yellow }
          - { id: approx, phrase: approximate, targets: [shrink], color: yellow }
          - { id: long, phrase: Long contexts, targets: [shrink], color: yellow }
          - { id: reach, phrase: "that seventy billion shape's cache reaches forty gibibytes", targets: [shrink], color: yellow }
          - { id: evicting, phrase: "evicting the tokens", targets: [shrink], color: yellow }
          - { id: later, phrase: "a later token may need", targets: [shrink], color: yellow }
          - { id: at-131, phrase: "about one hundred thirty one thousand", targets: [shrink], color: yellow }
      - say: Several GPUs can split the load. Tensor parallelism may give each one a slice of the key value heads, so eight heads on two GPUs can become four each, if the model and the runtime allow it. Logical blocks have to stay aligned across GPUs. In the original vLLM design, every GPU even uses the same physical block numbers, and each one stores only its own share of the heads. Some layouts replicate the state instead, so check what each GPU really holds.
        hold: 0.8
        visual_cues:
          - { id: split, phrase: Several GPUs, targets: [shrink], color: yellow }
          - { id: four-each, phrase: "so eight heads on two GPUs can become four each if the model and the runtime allow it", targets: [shrink], color: yellow }
          - { id: aligned, phrase: stay aligned, targets: [shrink], color: yellow }
          - { id: same-numbers, phrase: same physical block numbers, targets: [shrink], color: yellow }
          - { id: replicate, phrase: replicate the state, targets: [shrink], color: yellow }
          - { id: own-share, phrase: "stores only its own share", targets: [shrink], color: yellow }
      - say: And keep two names apart. Paged attention decides where the cache lives. Flash attention is a kernel that makes the calculation itself move less data. They solve different problems, and serving stacks often use both, or close variants.
        hold: 0.5
        visual_cues:
          - { id: names, phrase: keep two names apart, targets: [shrink], color: yellow }
          - { id: paged, phrase: Paged attention, targets: [shrink], color: yellow }
          - { id: flash, phrase: Flash attention, targets: [shrink], color: yellow }
          - { id: both, phrase: often use both, targets: [shrink], color: yellow }

