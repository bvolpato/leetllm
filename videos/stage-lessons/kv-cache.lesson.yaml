scenes:
  - id: hook
    title: What does the next token need?
    visual: The first frame shows The and fox above their saved keys and values, with a blank for the next token below. The model picks ran. That word moves into the input row, where its two slots stay empty through the question. Once its pair is filled, its query scores all three keys and mixes all three values.
    beats:
      - say: "After The fox, the model picks ran. Look under those first two tokens. This attention head has already saved a key and a value for each."
        hold: 0.5
        caption_starts: ["ran"]
        visual_cues:
          - { id: ran, phrase: "the model picks ran", targets: [hook] }
      - say: "Feed ran back in. Which tokens need a fresh key and value on this step?"
        hold: 2.8
        visual_cues:
          - { id: feed-back, phrase: "feed ran back in", targets: [hook] }
          - { id: ask, phrase: "Which tokens need a fresh key and value on this step", targets: [hook] }
      - say: "Only ran needs a new pair. The first two pairs stay where they are. Later words can't change what those earlier positions could see."
        hold: 0.65
        visual_cues:
          - { id: new-pair, phrase: "Only ran needs a new pair", targets: [hook] }
      - say: "Follow the query from ran. It scores all three keys, including its own. Those scores set the weights for mixing all three values. Each position can use its own pair and every earlier pair. That's full causal attention. The mix helps the model predict the token after ran."
        hold: 0.6
        visual_cues:
          - { id: query, phrase: "Follow the query from ran", targets: [hook] }
          - { id: keys, phrase: "scores all three keys", targets: [hook] }
          - { id: mix, phrase: "mixing all three values", targets: [hook] }
      - say: "These saved pairs are the key value cache. The next token can read all three."
        hold: 0.85
        visual_cues:
          - { id: cache, phrase: "the key value cache", targets: [hook] }

  - id: waste
    title: Replay the same input
    visual: Two runs process ran, first with an empty cache and then with the first two pairs saved. A six-step trace counts projected positions separately from positions attended.
    beats:
      - say: "Run that last step again. Same three tokens, same attention head. This time start with an empty cache. To process ran, rebuild the pairs for The and fox, then compute the pair for ran."
        hold: 0.6
        visual_cues:
          - { id: cold, phrase: "start with an empty cache", targets: [waste] }
          - { id: rebuild, phrase: "rebuild the pairs for The and fox", targets: [waste] }
          - { id: third, phrase: "compute the pair for ran", targets: [waste] }
      - say: "Now start with those first two pairs saved. Only ran needs projecting. Trace the read along each row. Both queries still score three keys and mix three values."
        hold: 0.6
        visual_cues:
          - { id: warm, phrase: "first two pairs saved", targets: [waste] }
          - { id: one, phrase: "Only ran needs projecting", targets: [waste] }
          - { id: same-read, phrase: "Trace the read along each row", targets: [waste] }
      - say: "A token can be a word, a piece of a word, or punctuation. Here we'll use one word at each of six successive steps, starting with The. Each filled square marks a position where we compute a key and value. On the left we discard the pairs after every step. On the right we keep them."
        hold: 0.4
        visual_cues:
          - { id: six-steps, phrase: "six successive steps", targets: [waste] }
      - say: "Feed in The, then fox, then ran. Look down the first column on the left. That's the same pair for The, calculated three times already. Causal attention lets us keep its first copy."
        hold: 0.5
        visual_cues:
          - { id: r1, phrase: "Feed in The", targets: [waste] }
          - { id: r2, phrase: "then fox", targets: [waste] }
          - { id: r3, phrase: "then ran", targets: [waste] }
          - { id: column, phrase: "first column on the left", targets: [waste] }
      - say: "Finish with straight, past, us. Add up the rows. Replaying each prefix projects twenty one positions. Keeping each pair projects six. Each run attends to the same positions on every step. Those history reads can grow even when we write just one new pair."
        hold: 0.9
        visual_cues:
          - { id: r4, phrase: "Finish with straight", targets: [waste] }
          - { id: r5, phrase: "past", targets: [waste] }
          - { id: r6, phrase: "us", targets: [waste] }
          - { id: total, phrase: "Keeping each pair projects six", targets: [waste] }
          - { id: read-row, phrase: "the same positions on every step", targets: [waste] }

  - id: phases
    title: Prefill builds. Decode extends.
    visual: The whole prompt fills the cache in one wide pass, then answer tokens extend it one narrow step at a time.
    beats:
      - say: Generation has two phases, and they behave differently. The prompt is known in advance, so prefill processes all of its positions together, with a mask so that each one reads only itself and earlier positions. That fills the cache. The last prompt position then produces the scores for the first answer token.
        hold: 0.7
        visual_cues:
          - { id: prefill, phrase: prefill processes all of its positions together, targets: [phases], color: yellow }
          - { id: mask, phrase: with a mask, targets: [phases], color: yellow }
          - { id: fills, phrase: fills the cache, targets: [phases], color: yellow }
          - { id: first-scores, phrase: scores for the first answer token, targets: [phases], color: yellow }
      - say: Then decode takes over. It feeds in that first answer token, appends its key and value, and produces the next one. Each choice becomes the next step's input, so one response is generated in order, one token at a time, even though the GPU does plenty of parallel work inside each step.
        hold: 0.7
        visual_cues:
          - { id: decode, phrase: decode takes over, targets: [phases], color: yellow }
          - { id: appends, phrase: appends its key and value, targets: [phases], color: yellow }
          - { id: in-order, phrase: one token at a time, targets: [phases], color: yellow }
          - { id: parallel, phrase: plenty of parallel work, targets: [phases], color: yellow }
      - say: The two phases stress different things. With a large prompt, prefill is usually heavy on computation, and it runs well in parallel. At common batch sizes, decode is often limited by memory bandwidth, the speed at which data moves out of GPU memory, because every step reloads the weights and a growing cache.
        hold: 0.3
        visual_cues:
          - { id: stress, phrase: stress different things, targets: [phases], color: yellow }
          - { id: compute, phrase: heavy on computation, targets: [phases], color: yellow }
          - { id: bandwidth, phrase: limited by memory bandwidth, targets: [phases], color: yellow }
          - { id: reload, phrase: reloads the weights, targets: [phases], color: yellow }
      - say: So the wait for the first token and the gap between later tokens are two separate numbers. Time to first token also includes queueing and transport. Inter token latency reflects decode and scheduling. Measure both.
        hold: 1.3
        visual_cues:
          - { id: two-numbers, phrase: two separate numbers, targets: [phases], color: yellow }
          - { id: ttft, phrase: Time to first token, targets: [phases], color: yellow }
          - { id: itl, phrase: Inter token latency, targets: [phases], color: yellow }
          - { id: both, phrase: Measure both, targets: [phases], color: yellow }

  - id: size
    title: So how big is it?
    visual: A three dimensional block of memory grows along its length as tokens arrive, and the formula assembles from its axes.
    beats:
      - say: Here's the bill, using the shape of Llama 3's eight billion parameter model. For one token, you keep a key and a value. That's two. In every layer, thirty two of them here. For every key value head, eight. Attention splits into several heads, and in this model the query heads share eight sets of keys and values, called key value heads. Only those get stored. Each head holds one hundred twenty eight numbers, at two bytes each, the sixteen bit format called F P sixteen.
        hold: 0.3
        visual_cues:
          - { id: key-and-value, phrase: a key and a value, targets: [size], color: yellow }
          - { id: layers, phrase: In every layer, targets: [size], color: yellow }
          - { id: heads, phrase: every key value head, targets: [size], color: yellow }
          - { id: share-heads, phrase: query heads share eight sets, targets: [size], color: yellow }
          - { id: stored, phrase: Only those get stored, targets: [size], color: yellow }
          - { id: numbers, phrase: one hundred twenty eight numbers, targets: [size], color: yellow }
          - { id: two-bytes, phrase: two bytes each, targets: [size], color: yellow }
          - { id: shape, phrase: "eight billion parameter model", targets: [size], color: yellow }
      - say: Multiply it out, and you get one hundred thirty one thousand and seventy two bytes. A kibibyte is one thousand twenty four bytes, and a mebibyte and a gibibyte each step up by another factor of one thousand twenty four. So that's exactly one hundred twenty eight kibibytes, for every single token. Those bytes hold the keys and values. Set aside memory for bookkeeping tables, buffers, and spare room when you size the cache.
        hold: 0.9
        visual_cues:
          - { id: bytes, phrase: "Multiply it out and you get one hundred thirty one thousand and seventy two bytes", targets: [size], color: yellow }
          - { id: kibi, phrase: A kibibyte is, targets: [size], color: yellow }
          - { id: per-token, phrase: "So that's exactly one hundred twenty eight kibibytes for every single token", targets: [size], color: yellow }
          - { id: extra, phrase: bookkeeping tables, targets: [size], color: yellow }
      - say: And it grows with every token. A conversation of four thousand ninety six tokens holds five hundred twelve mebibytes, half a gibibyte, of GPU memory. Give the cache forty gibibytes, and at best you can hold eighty of those.
        hold: 0.9
        visual_cues:
          - { id: grows, phrase: it grows with every token, targets: [size], color: yellow }
          - { id: conversation-bytes, phrase: five hundred twelve mebibytes, targets: [size], color: yellow, caption_boundary: true }
          - { id: half-gig, phrase: half a gibibyte, targets: [size], color: yellow }
          - { id: budget, phrase: forty gibibytes, targets: [size], color: yellow }
          - { id: eighty, phrase: eighty of those, targets: [size], color: yellow, caption_boundary: true }
      - say: Now try one yourself. Llama 3's seventy billion parameter model has eighty layers, with the same eight key value heads, the same one hundred twenty eight numbers per head, and the same two bytes per number. Before I answer, what does one token cost?
        hold: 5
        visual_cues:
          - { id: try, phrase: Now try one yourself, targets: [size], color: yellow }
          - { id: eighty-layers, phrase: eighty layers, targets: [size], color: yellow }
          - { id: ask, phrase: what does one token cost, targets: [size], color: yellow }
      - say: Two, times eighty, times eight, times one hundred twenty eight, times two. That's three hundred twenty kibibytes a token, and one and a quarter gibibytes for those same four thousand ninety six tokens. One hundred twenty eight such conversations would need one hundred sixty gibibytes. So memory can cap how many people you serve before raw compute does.
        hold: 0.9
        visual_cues:
          - { id: multiply, phrase: Two times eighty, targets: [size], color: yellow }
          - { id: answer, phrase: "That's three hundred twenty kibibytes a token", targets: [size], color: yellow }
          - { id: quarter, phrase: "and one and a quarter gibibytes for those same four thousand ninety six tokens", targets: [size], color: yellow }
          - { id: fleet, phrase: "One hundred twenty eight such conversations would need one hundred sixty gibibytes", targets: [size], color: yellow }
          - { id: cap, phrase: memory can cap, targets: [size], color: yellow }

  - id: reserve
    title: Empty space that belongs to somebody
    visual: Two conversations reserve the whole memory pool in advance, a third is locked out despite all the blank space, and the three kinds of waste light up in turn.
    beats:
      - say: So where does all this memory go? The simplest way to manage it is to give each conversation its maximum length up front, in one continuous piece, because growing a continuous buffer later can mean allocating a bigger one and copying everything across. In this small example pool, these two requests only need two blocks each, but their reservations take the whole pool.
        hold: 0.3
        visual_cues:
          - { id: reserve-max, phrase: its maximum length up front, targets: [reserve], color: yellow }
          - { id: copy, phrase: copying everything across, targets: [reserve], color: yellow }
          - { id: need-two, phrase: only need two blocks each, targets: [reserve], color: yellow }
      - say: Now a third request arrives. The pool looks mostly empty, and it still has nowhere to go. Every blank block already belongs to somebody.
        hold: 0.8
        visual_cues:
          - { id: third, phrase: a third request arrives, targets: [reserve], color: yellow }
          - { id: blank, phrase: Every blank block, targets: [reserve], color: yellow }
      - say: That waste comes in three kinds. Say a request reserves four thousand ninety six slots, one slot for each token, and stops at three hundred. The other three thousand seven hundred ninety six were trapped inside its reservation, and it never used them. That's internal fragmentation.
        hold: 0.3
        visual_cues:
          - { id: kinds, phrase: three kinds, targets: [reserve], color: yellow }
          - { id: reserves, phrase: reserves four thousand ninety six slots, targets: [reserve], color: yellow }
          - { id: stops, phrase: stops at three hundred, targets: [reserve], color: yellow }
          - { id: trapped, phrase: "The other three thousand seven hundred ninety six were trapped inside its reservation and it never used them", targets: [reserve], color: yellow }
          - { id: internal, phrase: internal fragmentation, targets: [reserve], color: yellow }
      - say: Slots it will use eventually still sit idle from the very first step, locked away from everyone else. That's reservation waste. And when requests of different sizes finish, they leave holes between the live buffers. Add up the holes and there may be plenty of space, yet no single hole fits a new reservation. That's external fragmentation.
        hold: 1.3
        visual_cues:
          - { id: idle, phrase: sit idle from the very first step, targets: [reserve], color: yellow }
          - { id: res-waste, phrase: reservation waste, targets: [reserve], color: yellow }
          - { id: holes, phrase: leave holes, targets: [reserve], color: yellow }
          - { id: add-up, phrase: Add up the holes, targets: [reserve], color: yellow }
          - { id: no-hole, phrase: no single hole fits, targets: [reserve], color: yellow }
          - { id: external, phrase: external fragmentation, targets: [reserve], color: yellow }
      - say: How much reserved memory went unused? In twenty twenty three, the vLLM team reported sixty to eighty percent waste in the systems it studied. To measure your own pool, compare the bytes reserved with the bytes holding live pairs.
        hold: 1.0
        visual_cues:
          - { id: how-bad, phrase: How much reserved memory went unused, targets: [reserve], color: yellow }
          - { id: sixty, phrase: sixty to eighty percent, targets: [reserve], color: yellow }
          - { id: historical, phrase: To measure your own pool, targets: [reserve], color: yellow }

  - id: paged
    title: Logical order, scattered storage
    visual: Requests take small blocks wherever space exists, and a table maps each one back into order.
    beats:
      - say: So borrow an old trick from operating systems. Cut memory into small, fixed blocks, and hand one out only when a conversation actually needs it. A request's blocks can land anywhere.
        hold: 0.3
        visual_cues:
          - { id: small-blocks, phrase: small fixed blocks, targets: [paged], color: yellow }
          - { id: anywhere, phrase: can land anywhere, targets: [paged], color: yellow }
          - { id: hand-one, phrase: "hand one out", targets: [paged], color: yellow }
      - say: A small table keeps the order. Each request counts its positions from zero and groups them into logical blocks. Our example blocks hold four positions each. Want position five? Five divided by four is one, remainder one. So that's logical block one, slot one, and the table says logical block one lives in physical block two.
        hold: 0.4
        visual_cues:
          - { id: table, phrase: A small table, targets: [paged], color: yellow }
          - { id: logical, phrase: groups them into logical blocks, targets: [paged], color: yellow }
          - { id: four-each, phrase: hold four positions each, targets: [paged], color: yellow }
          - { id: divide, phrase: "Five divided by four is one remainder one", targets: [paged], color: yellow }
          - { id: physical, phrase: "the table says logical block one lives in physical block two", targets: [paged], color: yellow }
      - say: A request first takes only the blocks its prompt needs. In our small example, say that's one. Each new token takes the next slot, and a new block is taken only when the current one is full. So the first four tokens fill slots zero through three, and the fifth token claims a second block, at slot zero.
        hold: 0.7
        visual_cues:
          - { id: first-takes, phrase: takes only the blocks its prompt needs, targets: [paged], color: yellow }
          - { id: next-slot, phrase: takes the next slot, targets: [paged], color: yellow }
          - { id: fifth, phrase: the fifth token claims a second block, targets: [paged], color: yellow }
          - { id: say-one, phrase: "say that's one", targets: [paged], color: yellow }
          - { id: first-four, phrase: "first four tokens fill", targets: [paged], color: yellow }
      - say: The third request fits now, and it fits in the holes. This is called paged attention, introduced with the vLLM serving engine. Inside one pool of same sized blocks, any free block will do, so variable sized holes stop being a problem there.
        hold: 0.7
        visual_cues:
          - { id: third-fits, phrase: third request fits, targets: [paged], color: yellow }
          - { id: paged-name, phrase: paged attention, targets: [paged], color: yellow }
          - { id: any-free, phrase: any free block will do, targets: [paged], color: yellow }
      - say: Some waste remains. In this basic layout, a request's last block can be partly empty, by less than one block. With sixteen token blocks, a single token still takes a whole block, leaving fifteen slots unused. Smaller blocks waste less and share more finely, but they need bigger tables. Larger blocks do the reverse. Block size can also change how fast the attention code runs, in either direction, depending on how that code is written. So block size is a choice you measure on your own workload.
        hold: 0.9
        visual_cues:
          - { id: waste-remains, phrase: Some waste remains, targets: [paged], color: yellow }
          - { id: sixteen, phrase: sixteen token blocks, targets: [paged], color: yellow }
          - { id: smaller, phrase: Smaller blocks waste less, targets: [paged], color: yellow }
          - { id: larger, phrase: Larger blocks do the reverse, targets: [paged], color: yellow }
          - { id: speed, phrase: how fast the attention code runs, targets: [paged], color: yellow }
          - { id: measure, phrase: a choice you measure, targets: [paged], color: yellow }

  - id: kernel
    title: The kernel has to follow the table
    visual: A query walks the block table and gathers exactly the valid positions, and reading one slot past the valid length visibly changes the answer.
    beats:
      - say: A's history continues in block two. Watch the address after block seven. An attention kernel that expects one continuous buffer reads straight ahead. You could copy the history back into one piece first. If you start at seven and just keep reading, you land in block eight.
        hold: 0.4
        visual_cues:
          - { id: easy-miss, phrase: A's history continues, targets: [kernel], color: yellow }
          - { id: must-change, phrase: expects one continuous buffer, targets: [kernel], color: yellow }
          - { id: copy-back, phrase: copy the history back into one piece, targets: [kernel], color: yellow }
          - { id: cant-point, phrase: start at seven and just keep reading, targets: [kernel], color: yellow }
      - say: Follow A's table from left to right. Load four pairs from block seven, then two from block two. That's the same six pairs, in the same order, as our contiguous reference. For this query, both outputs round to one point nine one and one point five three.
        hold: 0.7
        caption_starts: ["For this query"]
        visual_cues:
          - { id: finds, phrase: "Follow A's table", targets: [kernel], color: yellow }
          - { id: load, phrase: Load four pairs, targets: [kernel], color: yellow }
          - { id: same, phrase: "both outputs round to one point nine one and one point five three", targets: [kernel], color: yellow }
      - say: Keep the table fixed. The valid length is six. The two empty slots in block two still belong to A. We've planted a large test key in the first unused slot, with a value of nine hundred ninety nine in each coordinate. Read one position too far. That extra key takes almost all the weight. Both output coordinates round to nine hundred ninety nine. If a partial block fails this comparison, check the valid length passed to the kernel along with the table. Then rerun the six-position comparison.
        hold: 0.8
        caption_starts: ["Read one position too far", "Both output coordinates"]
        visual_cues:
          - { id: valid, phrase: The valid length is six, targets: [kernel], color: yellow }
          - { id: empty, phrase: The two empty slots, targets: [kernel], color: yellow }
          - { id: garbage, phrase: "Read one position too far. That extra key takes almost all the weight. Both output coordinates round to nine hundred ninety nine", targets: [kernel], color: yellow }
          - { id: two-inputs, phrase: check the valid length passed to the kernel along with the table, targets: [kernel], color: yellow }
      - say: Walking a table takes time. In the original twenty twenty three study, the paged attention kernel took about twenty to twenty six percent longer than a continuous one. In that paper's serving tests, overall throughput still rose about two to four times against its rebuilt version of an earlier system called Orca, because the recovered memory fit larger batches. That's why you measure the allocator and the kernel together.
        hold: 0.9
        visual_cues:
          - { id: not-free, phrase: Walking a table, targets: [kernel], color: yellow }
          - { id: slower, phrase: twenty to twenty six percent, targets: [kernel], color: yellow }
          - { id: throughput, phrase: two to four times, targets: [kernel], color: yellow }
          - { id: together, phrase: the allocator and the kernel together, targets: [kernel], color: yellow }
      - say: Watch the upper row of addresses. In a design called vAttention, that row stays continuous. The system maps physical pages behind it on demand. Existing continuous kernels can read straight along the upper row. To compare the two designs, run the same mix of requests through each.
        hold: 0.5
        visual_cues:
          - { id: only-answer, phrase: Watch the upper row, targets: [kernel], color: yellow }
          - { id: v-attention, phrase: called vAttention, targets: [kernel], color: yellow }
          - { id: on-demand, phrase: on demand, targets: [kernel], color: yellow }
          - { id: existing, phrase: Existing continuous kernels, targets: [kernel], color: yellow }
          - { id: compare, phrase: To compare the two designs, targets: [kernel], color: yellow }

  - id: lifetime
    title: A block has a lifetime
    visual: A response fills slots and claims new blocks, then finishes, and its blocks return to the pool only after the last pending read clears.
    beats:
      - say: Blocks also come back. When a request finishes, those blocks can return to the pool, and a new request can use them while the others keep running, without moving anyone's data.
        hold: 0.9
        visual_cues:
          - { id: come-back, phrase: Blocks also come back, targets: [lifetime], color: yellow }
          - { id: finishes, phrase: When a request finishes, targets: [lifetime], color: yellow }
          - { id: new-uses, phrase: a new request can use them, targets: [lifetime], color: yellow }
          - { id: no-move, phrase: without moving, targets: [lifetime], color: yellow }
      - say: There's a safety rule. The GPU may still have work in flight that reads those blocks, so they can be reused only after that work is done, and only once no other request still owns them. Some engines also keep finished blocks around on purpose, in case a later request can reuse them. We'll get to that.
        hold: 1.3
        visual_cues:
          - { id: safety, phrase: safety rule, targets: [lifetime], color: yellow }
          - { id: in-flight, phrase: work in flight, targets: [lifetime], color: yellow }
          - { id: done, phrase: only after that work is done, targets: [lifetime], color: yellow }
          - { id: owners, phrase: no other request still owns them, targets: [lifetime], color: yellow }
          - { id: retained, phrase: keep finished blocks around, targets: [lifetime], color: yellow }

  - id: batching
    title: When can the next request start?
    visual: Two six-iteration schedules share the same short and long requests. C takes A's lane at the next iteration and reuses a returned block. A second example fits a six-token prefill around a running decode.
    beats:
      - say: "A needs two more decode steps. B needs six. C is waiting. In this static batch, A finishes at step two. Its lane stays empty for the four steps B has left."
        hold: 0.5
        visual_cues:
          - { id: waits, phrase: "C is waiting", targets: [batching] }
          - { id: idle, phrase: "Its lane stays empty", targets: [batching] }
      - say: "Run the same requests with continuous batching. The scheduler checks the batch after every iteration. A has just finished step two. When can C start?"
        hold: 2.2
        visual_cues:
          - { id: continuous, phrase: "continuous batching", targets: [batching] }
          - { id: boundary, phrase: "A has just finished step two", targets: [batching] }
          - { id: ask, phrase: "When can C start", targets: [batching] }
      - say: "Step three. C takes the open lane while B keeps going. Orca used this kind of iteration-level scheduling."
        hold: 0.65
        caption_starts: ["C takes the open lane"]
        visual_cues:
          - { id: join, phrase: "Step three", targets: [batching] }
      - say: "Look at the cache at the end of step two. Each block holds four tokens. A has eight tokens in two blocks. B has five, so we round up to two blocks. That's four blocks in use."
        hold: 0.55
        visual_cues:
          - { id: pool, phrase: "Look at the cache", targets: [batching] }
          - { id: a, phrase: "A has eight tokens", targets: [batching] }
          - { id: b, phrase: "B has five", targets: [batching] }
          - { id: four, phrase: "four blocks in use", targets: [batching] }
      - say: "A finishes and releases both blocks. At step three, C puts its three prompt tokens into one of them. B adds its sixth token inside a block it already owns. That's three blocks in use. Continuous batching chose when C ran. Paging let C use any free block."
