  - id: prefix
    title: Reusable state depends on the full prefix
    visual: Many requests with the same prompt collapse onto one run of shared full blocks, each keeping one private partial tail.
    beats:
      - say: Those branches came from one request. Separate requests can share too, when they begin with the same text, such as a long system prompt. That's prefix caching. The engine keeps finished blocks, looks up each incoming prompt, and points the new request's table at the blocks that match.
        hold: 0.4
        visual_cues:
          - { id: branches, phrase: Those branches came from one request, targets: [prefix], color: yellow }
          - { id: separate, phrase: Separate requests can share, targets: [prefix], color: yellow }
          - { id: keeps, phrase: keeps finished blocks, targets: [prefix], color: yellow }
          - { id: looks-up, phrase: looks up each incoming prompt, targets: [prefix], color: yellow }
          - { id: points, phrase: points the new request, targets: [prefix], color: yellow }
          - { id: same-text, phrase: "begin with the same text", targets: [prefix], color: yellow }
          - { id: prefix-name, phrase: "That's prefix caching", targets: [prefix], color: yellow }
      - say: Matching one sentence on its own isn't enough. A token's key and value depend on everything before it, so the lookup has to include all the earlier context, along with anything else that changes the result, such as the model. Engines can also mix a value for each customer into that lookup, so that different customers can't match each other's blocks.
        hold: 0.7
        visual_cues:
          - { id: sentence, phrase: Matching one sentence, targets: [prefix], color: yellow }
          - { id: before, phrase: depend on everything before it, targets: [prefix], color: yellow }
          - { id: lookup, phrase: include all the earlier context, targets: [prefix], color: yellow }
          - { id: model, phrase: such as the model, targets: [prefix], color: yellow }
          - { id: customer, phrase: a value for each customer, targets: [prefix], color: yellow }
      - say: In our example, only complete blocks are shared. Take two hundred requests with the same five hundred token prompt, and sixteen token blocks. Thirty one full blocks hold four hundred ninety six tokens. The last four tokens need one private partial block per request. With no sharing, that's six thousand four hundred blocks. With a warm cache, thirty one shared plus two hundred private is two hundred thirty one, about ninety six percent fewer in this snapshot.
        hold: 1.3
        visual_cues:
          - { id: complete, phrase: only complete blocks are shared, targets: [prefix], color: yellow }
          - { id: two-hundred, phrase: two hundred requests, targets: [prefix], color: yellow }
          - { id: full, phrase: "Thirty one full blocks hold four hundred ninety six tokens", targets: [prefix], color: yellow }
          - { id: tail, phrase: "The last four tokens need one private partial block per request", targets: [prefix], color: yellow }
          - { id: none, phrase: "With no sharing that's six thousand four hundred blocks", targets: [prefix], color: yellow }
          - { id: warm, phrase: "With a warm cache thirty one shared plus two hundred private is two hundred thirty one", targets: [prefix], color: yellow }
          - { id: fewer, phrase: "about ninety six percent fewer in this snapshot", targets: [prefix], color: yellow }
      - say: A hit skips prefill for the matching part. The part that doesn't match still runs, and an engine typically still computes at least the last token, so that it has scores for the next one. Cached blocks can also be evicted when space runs short, so a cold cache changes the numbers.
        hold: 0.5
        visual_cues:
          - { id: hit, phrase: A hit skips prefill, targets: [prefix], color: yellow }
          - { id: rest, phrase: still runs, targets: [prefix], color: yellow }
          - { id: last, phrase: at least the last token, targets: [prefix], color: yellow }
          - { id: evict, phrase: Cached blocks can also be evicted, targets: [prefix], color: yellow }

  - id: preempt
    title: When the pool runs out anyway
    visual: The free list empties, a running request cannot take its next block, and the scheduler evicts one request and later restores it two different ways.
    beats:
      - say: Every block in this pool is occupied. A running request needs a block, and the free list is empty. Now allocation becomes a scheduling decision. Delay this request, or evict another one and recover its work later. Either way, the failed allocation should leave every table exactly as it was, so that a retry starts clean.
        hold: 0.4
        visual_cues:
          - { id: ceiling, phrase: Every block in this pool, targets: [preempt], color: yellow }
          - { id: empty, phrase: the free list is empty, targets: [preempt], color: yellow }
          - { id: decision, phrase: scheduling decision, targets: [preempt], color: yellow }
          - { id: delay, phrase: Delay this request, targets: [preempt], color: yellow }
          - { id: evict, phrase: evict another one, targets: [preempt], color: yellow }
          - { id: unchanged, phrase: leave every table exactly as it was, targets: [preempt], color: yellow }
          - { id: needs-block, phrase: "running request needs a block", targets: [preempt], color: yellow }
          - { id: retry, phrase: "retry starts clean", targets: [preempt], color: yellow }
      - say: One recovery is to recompute. The evicted request gives up its blocks, goes back to wait, and rebuilds the missing cache when it resumes. That spends extra compute. Blocks that are shared, or kept for prefixes, don't all have to disappear.
        hold: 0.8
        visual_cues:
          - { id: recompute, phrase: to recompute, targets: [preempt], color: yellow }
          - { id: gives-up, phrase: gives up its blocks, targets: [preempt], color: yellow }
          - { id: rebuilds, phrase: rebuilds the missing cache, targets: [preempt], color: yellow }
          - { id: compute, phrase: extra compute, targets: [preempt], color: yellow }
          - { id: shared, phrase: Blocks that are shared, targets: [preempt], color: yellow }
          - { id: to-wait, phrase: "goes back to wait", targets: [preempt], color: yellow }
      - say: The other is to swap. Blocks move to CPU memory and come back later. That keeps the work, but it spends bandwidth on the link between the CPU and the GPU. Engines differ in which they use, and the choice changes between versions, so check yours. Either way, the evicted request pays before it can continue, so frequent eviction, which engines call preemption, belongs in your capacity plan.
        hold: 0.9
        visual_cues:
          - { id: swap, phrase: to swap, targets: [preempt], color: yellow }
          - { id: move, phrase: move to CPU memory, targets: [preempt], color: yellow }
          - { id: link, phrase: link between the CPU and the GPU, targets: [preempt], color: yellow }
          - { id: differ, phrase: Engines differ, targets: [preempt], color: yellow }
          - { id: plan, phrase: capacity plan, targets: [preempt], color: yellow }
          - { id: keeps-work, phrase: "keeps the work", targets: [preempt], color: yellow }
          - { id: pays, phrase: "pays before it can continue", targets: [preempt], color: yellow }
          - { id: either-way, phrase: "Either way", targets: [preempt], color: yellow }
          - { id: continue, phrase: "continue", targets: [preempt], color: yellow }
          - { id: call-preempt, phrase: "engines call preemption", targets: [preempt], color: yellow }

  - id: recovery-cost
    title: What does each recovery cost?
    visual: Swap and replay share a time axis. The swap trace has an outbound and a return leg. Changing the link rate stretches both legs past the unchanged compute time.
    beats:
      - say: "A request has to give up its GPU blocks. All its state is private. It has sixty four hundred positions at three hundred twenty kibibytes each. That's two thousand mebibytes to recover. Compare two ways to get that same history back."
