scenes:
  - id: intro
    title: Can GPU 0 hold these weights?
    visual: A single 70 GB weight block drops against the reserved space on GPU 0 and sticks past its limit.
      The block splits in two, and its right half moves to GPU 1.
    beats:
      - say: Drop seventy gigabytes of weights into GPU zero. The gray block reserves sixteen gigabytes. How far
          do the weights stick past the eighty-gigabyte limit?
        hold: 2.2
        visual_cues:
          - id: reserved-space
            phrase: The gray block reserves sixteen gigabytes
            targets:
              - device-memory
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: load-weights
            phrase: Drop seventy gigabytes of weights into GPU zero
            targets:
              - device-memory
            color: cyan
            linger: 0.25
            caption_boundary: true
      - say: Six gigabytes spill past the limit. A full copy would overflow GPU one by just as much.
          Split the weights in half. Slide the right half into GPU one.
        hold: 1
        visual_cues:
          - id: spill
            phrase: Six gigabytes spill past the limit
            targets:
              - device-memory
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: split-weights
            phrase: Split the weights in half
            targets: [device-memory]
            color: blue
          - id: place-half
            phrase: Slide the right half into GPU one
            targets:
              - device-memory
            color: cyan
            linger: 0.25
            caption_boundary: true
      - say: One model now lives in two memories. That's model parallelism. To run a token through a split layer,
          each GPU uses the weights it holds. How do their results fit together?
        hold: 0.8
        visual_cues:
          - id: same-model
            phrase: One model now lives in two memories
            targets:
              - device-memory
            color: cyan
            linger: 0.25
            caption_boundary: true
  - id: weight-budget
    title: What room is left for a request?
    visual: The same two weight shards stay on their memory bars. A representative four-way shard uses the
      same scale. A separate parameter inventory distinguishes stored weights from weights active for one
      token.
    beats:
      - say: Those two halves represent roughly thirty-five billion parameters at two bytes each in BF sixteen.
          That's seventy decimal gigabytes. One gigabyte here is a billion bytes. Subtract the sixteen
          reserved from eighty and each GPU can hold sixty-four gigabytes of weights. Divide seventy by
          sixty-four and round up. We need at least two GPUs for the weights. How much room does that leave
          on each?
        hold: 1.8
        visual_cues:
          - id: lower-bound
            phrase: We need at least two GPUs for the weights
            targets:
              - weight-ledger
            color: cyan
            linger: 0.25
            caption_boundary: true
      - say: Each GPU has twenty-nine gigabytes left. Now divide that same checkpoint across four GPUs. Each holds
          seventeen and a half gigabytes of weights and still reserves sixteen. That leaves forty-six and a
          half gigabytes per GPU. Actual request capacity depends on what the runtime puts in that space.
        hold: 0.85
        visual_cues:
          - id: two-room
            phrase: Each GPU has twenty-nine gigabytes left
            targets:
              - weight-ledger
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: four-devices
            phrase: divide that same checkpoint across four GPUs
            targets:
              - weight-ledger
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: four-room
            phrase: That leaves forty-six and a half gigabytes per GPU
            targets:
              - weight-ledger
            color: cyan
            linger: 0.25
            caption_boundary: true
      - say: Where did the seventy come from? This Qwen model stores about thirty-five billion language-model
          parameters. A token activates about three billion. The smaller count helps estimate work for that
          token. We still need space for every resident expert. At four bits per parameter, the raw codes
          would take seventeen and a half gigabytes. Scales, packing, higher-precision tensors and any
          separate encoders belong in the actual checkpoint budget.
        hold: 0.75
        visual_cues:
          - id: resident-count
            phrase: stores about thirty-five billion language-model parameters
            targets:
              - weight-ledger
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: raw-codes
            phrase: the raw codes would take seventeen and a half gigabytes
            targets:
              - weight-ledger
            color: cyan
            linger: 0.25
            caption_boundary: true
  - id: inference-contract
    title: What does one request wait for?
    visual: Two ranks compute partial results for the same batch. The faster rank waits at the exchange. A request
      clock follows the first two tokens.
    beats:
      - say: Two GPU processes work on one batch. Each process is a rank. GPU zero finishes its multiply first.
          It waits for GPU one. Once both partial results are ready, a collective combines them. Both ranks
          can use the sum.
        hold: 0.7
        visual_cues:
          - id: mp-inference-contract-0
            phrase: Each process is a rank
            targets:
              - mp-inference-contract-mechanism
            color: cyan
            linger: 0.4
          - id: mp-inference-contract-workers
            phrase: GPU zero finishes its multiply first
            targets:
              - mp-inference-contract-mechanism
            color: yellow
            linger: 0.4
          - id: mp-inference-contract-wait
            phrase: It waits for GPU one
            targets: [mp-inference-contract-mechanism]
            color: yellow
          - id: mp-inference-contract-sum
            phrase: Once both partial results are ready, a collective combines them
            targets: [mp-inference-contract-mechanism]
            color: cyan
      - say: Training adds backward passes, gradients and optimizer states. Follow one request during serving.
          Start the clock at the prompt. Mark the first token, then the next. That second token depends on
          the first. Under load, track how many histories fit and how many useful tokens the service
          delivers.
        hold: 0.7
        visual_cues:
          - id: mp-inference-contract-1
            phrase: Training adds backward passes, gradients and optimizer states
            targets:
              - mp-inference-contract-mechanism
            color: yellow
            linger: 0.4
          - id: mp-inference-contract-clocks
            phrase: Start the clock at the prompt. Mark the first token
            targets:
              - mp-inference-contract-mechanism
            color: yellow
            linger: 0.4
          - id: mp-inference-contract-next
            phrase: then the next
            targets: [mp-inference-contract-mechanism]
            color: cyan
      - say: Look back at the two ranks. A faster link can shorten their exchange. It still takes GPU one just
          as long to finish its multiply. Trace the kernels and the links the ranks share to see which wait
          reaches the request. Changing the order of floating-point additions can change the last few bits
          of the sum, enough to change which token gets sampled.
        hold: 0.7
        visual_cues:
          - id: mp-inference-contract-2
            phrase: Look back at the two ranks
            targets:
              - mp-inference-contract-mechanism
            color: green
            linger: 0.4
          - id: mp-inference-contract-faster
            phrase: A faster link can shorten their exchange
            targets: [mp-inference-contract-mechanism]
            color: cyan
          - id: mp-inference-contract-paths
            phrase: "Trace the kernels and the links the ranks share"
            targets:
              - mp-inference-contract-mechanism
            color: yellow
            linger: 0.4
          - id: mp-inference-contract-rounding
            phrase: "Changing the order of floating-point additions can change the last few bits of the sum"
            targets:
              - mp-inference-contract-mechanism
            color: yellow
            linger: 0.4
  - id: linear
    title: One input multiplies several output columns
    visual: A row input [1,2] weights a two-by-four matrix; four column dot products reveal [1,4,6,5].
    beats:
      - say: Begin with a linear layer in row-vector convention. The input multiplies a weight matrix, and each matrix
          column produces one output coordinate. Our input has two coordinates and the matrix has four output
          columns, so the result has four coordinates.
        visual_cues:
          - id: linear-input
            phrase: input multiplies a weight matrix
            targets:
              - linear-readout
              - linear-readout-2
            color: blue
          - id: output-coordinates
            phrase: result has four coordinates
            targets:
              - linear-readout-3
            color: yellow
        hold: 0.6
      - say: Follow the highlighted column. Multiply each input coordinate by the matching weight, then add. Repeat
          across the columns to assemble the complete output. This gives us a reference result that every
          distributed version must reproduce in exact arithmetic.
        visual_cues:
          - id: column-products
            phrase: Multiply each input coordinate by the matching weight, then add
            targets:
              - linear-equation
            color: yellow
          - id: repeat-columns
            phrase: Repeat across the columns
            targets:
              - linear-readout-2
              - linear-readout-3
            color: yellow
          - id: reference-output
            phrase: assemble the complete output
            targets:
              - linear-readout-3
            color: green
        hold: 0.6
      - say: Notice two different ways to divide the work. Different output columns can be computed independently from
          the full input. Alternatively, contributions from different input coordinates can be computed
          separately, but they still need to be combined for each output coordinate.
        visual_cues:
          - id: output-slices
            phrase: Different output columns
            targets:
              - linear-readout-2
            color: blue
          - id: input-contributions
            phrase: different input coordinates
            targets:
              - linear-readout
            color: cyan
        hold: 0.8
  - id: column
    title: Column shards produce complete output slices
    visual: The matrix divides by output columns; replicated input reaches two GPUs and their complete output
      slices concatenate.
    beats:
      - say: Split the weight matrix by columns. Each device keeps a different set of output columns and receives the
          full input. Its local matrix multiplication produces the final values for its own output slice, with
          every input-coordinate contribution already included.
        visual_cues:
          - id: column-split
            phrase: Split the weight matrix by columns
            targets:
              - column-readout
              - column-readout-2
            color: blue
          - id: complete-slices
            phrase: final values for its own output slice
            targets:
              - column-readout-3
              - column-readout-4
            color: green
        hold: 0.6
      - say: The first device produces the first half of our reference output and the second produces the other half.
          Concatenating those slices reconstructs the full vector. Whether the program actually gathers that
          vector depends on what representation the next operation needs.
        visual_cues:
          - id: local-halves
            phrase: first half of our reference output
            targets:
              - column-readout-3
            color: blue
          - id: concatenate-slices
            phrase: Concatenating those slices reconstructs the full vector
            targets:
              - column-equation
            color: yellow
        hold: 0.6
      - say: If a following elementwise activation can operate locally on each slice, it can run before gathering.
          Keeping those slices distributed may avoid an unnecessary transfer. This is why the useful unit of
          design is often a sequence of layers rather than an isolated matrix multiply.
        visual_cues:
          - id: local-activation
            phrase: elementwise activation can operate locally
            targets:
              - column-equation-2
            color: green
          - id: distributed-slices
            phrase: Keeping those slices distributed
            targets:
              - column-readout-3
              - column-readout-4
            color: blue
        hold: 0.8
  - id: row
    title: Row shards produce contributions that must sum
    visual: Local input slices meet matching matrix row shards; two equal-width partial outputs add through a
      collective to the full result.
    beats:
      - say: Now split by input rows of the weight matrix, with matching slices of the input. Each device computes
          contributions to every output coordinate from its assigned input coordinates. A local output is
          therefore incomplete until the other devices’ contributions arrive.
        visual_cues:
          - id: row-split
            phrase: split by input rows
            targets:
              - row-readout-5
              - row-readout-6
            color: blue
          - id: incomplete-output
            phrase: local output is therefore incomplete
            targets:
              - row-readout-5
              - row-readout-6
            color: yellow
        hold: 0.6
      - say: Add the partial vectors coordinate by coordinate. An all-reduce can make that sum available to every
          participating device. A reduce-scatter can leave different pieces of the summed result on different
          devices when the next operation expects a sharded layout.
        visual_cues:
          - id: sum-contributions
            phrase: Add the partial vectors coordinate by coordinate
            targets:
              - row-readout-2
            color: yellow
          - id: all-reduce-result
            phrase: sum available to every participating device
            targets:
              - row-readout-4
            color: green
        hold: 0.6
      - say: Look at the first coordinate. One GPU contributes three and the other contributes minus one. Add
          first and you get two. ReLU keeps that two. Apply ReLU separately and the minus one becomes zero.
          Now the sum is three. The order changes what the next layer receives.
        visual_cues:
          - id: sum-before-relu
            phrase: Apply ReLU separately and the minus one becomes zero
            targets:
              - row-equation-2
            color: pink
          - id: complete-relu
            phrase: ReLU keeps that two
            targets:
              - row-equation
            color: green
        hold: 0.8
  - id: pair
    title: Follow one output through both GPUs
    visual: Each GPU keeps its own activated features. The second projection aligns its two local dot products
      under their output coordinates. The summed coordinates travel back to both devices.
    beats:
      - say: Come back to the four hidden features we got by cutting the first matrix into columns. One and four
          live on GPU zero. Six and five live on GPU one. All four are positive, so our rectifier leaves
          them alone. For the second projection, multiply each slice by its own two rows of weights. Look at
          the bottom right. What does GPU one contribute to the second output?
        hold: 2.35
        visual_cues:
          - id: complete-features
            phrase: One and four live on GPU zero
            targets:
              - projection
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: matching-rows
            phrase: multiply each slice by its own two rows of weights
            targets:
              - projection
            color: cyan
            linger: 0.25
            caption_boundary: true
      - say: Start at zero. The six counts forward. The negative weight sends five back, leaving one. Look up that same column. GPU zero
          contributes four. Read the other column the same way. GPU zero contributes one and GPU one
          contributes sixteen. That gives seventeen in the first output and five in the second. Add down
          each column to reconstruct the vector.
        hold: 1
        caption_starts: [leaving one]
        visual_cues:
          - id: positive-term
            phrase: The six counts forward
            targets: [projection]
            color: yellow
          - id: signed-one
            phrase: The negative weight sends five back, leaving one
            targets:
              - projection
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: contracted-contributions
            phrase: GPU zero contributes four
            targets:
              - projection
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: sum-contraction
            phrase: Add down each column to reconstruct the vector
            targets:
              - projection
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: other-column
            phrase: GPU zero contributes one and GPU one contributes sixteen
            targets:
              - projection
            color: cyan
            linger: 0.25
            caption_boundary: true
      - say: The next operation needs both coordinates on each GPU. Return the summed vector to both GPUs. That's
          a sum all-reduce. The four hidden features stayed where they were, right through the activation.
          Only the two contributions per GPU had to meet at the end of this block.
        hold: 0.85
        visual_cues:
          - id: both-receive
            phrase: Return the summed vector to both GPUs
            targets:
              - projection
            color: cyan
            linger: 0.25
            caption_boundary: true
  - id: gelu-reference
    title: Check the layer against a dense multiply
    visual: Two copies of the input meet separate columns of A, then the local GeLU outputs meet matching rows
      of B. Both local signed contributions, one bias and two faulty reducers are compared with a dense
      float64 reference.
    beats:
      - say: Keep the input one, two. This time we'll use the article's weights and a smooth activation called
          GeLU. Each GPU gets two columns of A. On the far right, one times zero plus two times two makes
          four. Across both GPUs the four features are one, one, zero and four. Each GPU can apply GeLU to
          its two complete features. A one becomes roughly point eight four. The four stays very close to
          four.
        hold: 0.85
        visual_cues:
          - id: expansion-columns
            phrase: Each GPU gets two columns of A
            targets:
              - gelu-work
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: expanded
            phrase: the four features are one, one, zero and four
            targets:
              - gelu-work
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: activated
            phrase: Each GPU can apply GeLU to its two complete features
            targets:
              - gelu-work
            color: cyan
            linger: 0.25
            caption_boundary: true
      - say: Keep those hidden features on their GPUs. For the return projection, use the matching rows of B. The
          left matrix just copies its two numbers. On the right, zero multiplies the first row and nearly
          four multiplies the second. Which weight gives GPU one's contribution to the first output its
          sign?
        hold: 2
        visual_cues:
          - id: projection-rows
            phrase: use the matching rows of B
            targets:
              - gelu-work
            color: cyan
            linger: 0.25
            caption_boundary: true
      - say: Minus one. The last feature contributes nearly minus four in the first column and nearly eight in the
          second. Add the GPU zero row to the GPU one row. Now add the output bias once. The first
          coordinate is about minus two point six six and the second is about eight point three four. Those
          are the two numbers the next layer receives.
        hold: 0.85
        visual_cues:
          - id: signed-partial
            phrase: nearly minus four in the first column and nearly eight in the second
            targets:
              - gelu-work
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: add-bias
            phrase: add the output bias once
            targets:
              - gelu-work
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: gelu-output
            phrase: The first coordinate is about minus two point six six and the second is about eight point three
              four
            targets:
              - gelu-work
            color: cyan
            linger: 0.25
            caption_boundary: true
      - say: Run those weights as one dense layer in float sixty-four. Both coordinates agree with the sharded
          sum. Try averaging the partials. That halves the contribution from each GPU. Try adding the whole
          bias on both GPUs. The first output gets an extra half and the second loses another half. The
          article's check also rejects an invalid rank count or a mismatch between the hidden dimensions of
          the two matrices.
        hold: 0.8
        visual_cues:
          - id: test-mean
            phrase: Try averaging the partials
            targets:
