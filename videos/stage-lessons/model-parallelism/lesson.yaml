            caption_boundary: true
      - say: Switch the reducer to a sum. Keep the same partials and the same bias. Run the same comparison on
          both output coordinates. This time it returns true. We've checked the value that crosses the layer
          boundary for this input. The serving run still has to establish peak memory, token latency and
          useful throughput at the intended concurrency.
        hold: 0.9
        visual_cues:
          - id: switch-reducer
            phrase: Switch the reducer to a sum
            targets:
              - reference-check
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: sum-check
            phrase: This time it returns true
            targets:
              - reference-check
            color: cyan
            linger: 0.25
            caption_boundary: true
  - id: fresh-layout
    title: Will this request fit on both GPUs?
    visual: A new input produces two new signed local vectors. After the dense comparison agrees, a 46 GB
      placement is checked per GPU. An 8 GB part of the proposed reservation moves to the second GPU.
    beats:
      - say: Change just the layer input to minus one, three. Keep the article's two matrices and its bias. These
          are the two new partial vectors. Look at the second coordinate. Nearly four on one GPU and nearly
          twelve on the other both belong to that same output. Should we take their sum or their mean before
          adding the bias?
        hold: 2.2
        visual_cues:
          - id: mp-fresh-layout-input
            phrase: Change just the layer input to minus one, three
            targets:
              - fresh-case
            color: cyan
            linger: 0.25
            caption_boundary: true
      - say: Take their sum and add the bias once. Both coordinates match the dense reference. The second comes to
          about fifteen and a half. Now check a separate constraint on the same pair. The request needs
          forty-six gigabytes of history. Its proposed placement puts thirty-one on GPU zero and fifteen on
          GPU one. With twenty-nine available on each, which GPU is short, and by how much?
        hold: 2.2
        visual_cues:
          - id: mp-fresh-layout-sum
            phrase: Take their sum and add the bias once
            targets:
              - fresh-case
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: mp-fresh-layout-result
            phrase: Both coordinates match the dense reference
            targets:
              - fresh-case
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: mp-fresh-layout-placement
            phrase: The request needs forty-six gigabytes of history
            targets:
              - fresh-case
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: mp-fresh-layout-rank-zero
            phrase: puts thirty-one on GPU zero
            targets: [fresh-case]
            color: blue
          - id: mp-fresh-layout-rank-one
            phrase: and fifteen on GPU one
            targets: [fresh-case]
            color: cyan
      - say: GPU zero is two gigabytes short. GPU one has fourteen to spare. Suppose the backend supports
          splitting this history evenly. On the placement plan, move an eight-gigabyte block from GPU zero
          to GPU one. The request still needs forty-six gigabytes in total. How much room is left on each
          GPU?
        hold: 2
        visual_cues:
          - id: mp-fresh-layout-deficit
            phrase: GPU zero is two gigabytes short
            targets:
              - fresh-case
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: mp-fresh-layout-repair
            phrase: move an eight-gigabyte block from GPU zero to GPU one
            targets:
              - fresh-case
            color: cyan
            linger: 0.25
            caption_boundary: true
      - say: Six gigabytes remain on each GPU. Each now holds twenty-three of the twenty-nine available. This
          request fits on both. At the expected load, time the first token and the tokens that follow. Among
          the layouts that meet both latency targets, choose the one with the lowest cost per useful token.
        hold: 1.2
        visual_cues:
          - id: mp-fresh-layout-six
            phrase: Six gigabytes remain on each GPU
            targets:
              - fresh-case
            color: cyan
            linger: 0.25
            caption_boundary: true
