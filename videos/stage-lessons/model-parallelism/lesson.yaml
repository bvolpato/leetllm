  - id: collective
    title: A collective has a specific output layout
    visual: All-reduce and all-gather contracts appear first, followed by reduce-scatter ownership and authored
      compute-versus-communication costs.
    beats:
      - say: Communication names describe different contracts. All-reduce sums corresponding values and returns the
          complete sum to every participant. All-gather concatenates shards so every participant receives the
          full concatenated tensor. Confusing those operations changes both values and ownership.
        visual_cues:
          - id: all-reduce-contract
            phrase: All-reduce sums corresponding values
            targets:
              - collective-all-reduce-1-4-16-1
            color: blue
          - id: all-gather-contract
            phrase: All-gather concatenates shards
            targets:
              - collective-all-gather-1-4-6-5
            color: cyan
          - id: distinct-ownership
            phrase: values and ownership
            targets:
              - collective-readout
              - collective-readout-2
            color: yellow
        hold: 0.6
      - say: Reduce-scatter combines a reduction with a partitioned result. The diagram first forms the same global
          sum, then gives each participant its assigned slice. An optimized implementation need not
          materialize the full result on every device, but it must satisfy that output contract.
        visual_cues:
          - id: global-reduction
            phrase: same global sum
            targets:
              - collective-1-4-16-1-17-5
            color: blue
          - id: partition-result
            phrase: gives each participant its assigned slice
            targets:
              - collective-readout-3
              - collective-readout-4
            color: green
        hold: 0.6
      - say: Collectives cost latency and bandwidth according to tensor size, device count, topology, and
          implementation. Splitting a layer into more pieces can make its local computation smaller while
          leaving communication on the critical path. Measure the actual topology instead of assuming total
          GPU count determines speed.
        visual_cues:
          - id: communication-cost
            phrase: Collectives cost latency and bandwidth
            targets:
              - collective-costs
            color: pink
          - id: local-compute
            phrase: local computation smaller
            targets:
              - collective-costs
            color: blue
        hold: 0.8
  - id: head-replication
    title: A KV head can be replicated after query heads divide
    visual: Sixteen query-head owners split across eight ranks while two KV-head owners each repeat on four ranks.
    beats:
      - say: Pure nonduplicating head sharding needs TP to divide both query and KV head counts. The inspected Qwen
          text configuration has sixteen query heads, two KV heads and head dimension two hundred fifty-six in
          ten full-attention layers. Thirty other layers use gated recurrent-style state, which a full-history
          KV formula does not describe.
        hold: 0.7
        visual_cues:
          - id: mp-head-replication-0
            phrase: Pure nonduplicating head sharding needs TP to divide both query and KV head counts
            targets:
              - mp-head-replication-mechanism
            color: cyan
            linger: 0.4
          - id: mp-head-replication-premises
            phrase: "sixteen query heads, two KV heads and head dimension two hundred fifty-six in ten full-attention layers"
            targets:
              - mp-head-replication-mechanism
            color: yellow
            linger: 0.4
          - id: mp-head-replication-hybrid
            phrase: "Thirty other layers use gated recurrent-style state"
            targets:
              - mp-head-replication-mechanism
            color: yellow
            linger: 0.4
      - say: "TP two divides both counts. At TP eight, every rank gets two of the sixteen query heads. There
          are only two KV heads to go around. In this vLLM layout, four ranks carry each head's projection
          at TP eight. This replication works when the number of ranks is a multiple of the KV head count."
