  - id: mass-merge
    title: How much attention weight goes to the nine?
    visual: Three keys retain their device and value. A single attention strip measures each key's global
      share. Raising only the last score changes its exponential weight and the common denominator.
    beats:
      - say: One query can see three keys. GPU zero holds two keys, both with value zero. GPU one holds a single
          key with value nine. Every score is one thousand. Subtract that maximum before taking the
          exponential, so each shifted weight is one. That also avoids overflow. What fraction of the
          attention weight goes to the nine?
        hold: 2.3
        visual_cues:
          - id: two-keys
            phrase: GPU zero holds two keys
            targets:
              - attention-mass
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: one-key
            phrase: GPU one holds a single key with value nine
            targets:
              - attention-mass
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: shifted
            phrase: each shifted weight is one
            targets:
              - attention-mass
            color: cyan
            linger: 0.25
            caption_boundary: true
      - say: One third. Each key gets one of three equal shares. Only the nine contributes to the weighted sum, so
          nine divided by three gives three. Watch what we lose if we average the local answers. Zero and
          nine get equal votes and give four and a half. That gives one key on GPU one as much say as both
          keys on GPU zero.
        hold: 1
        visual_cues:
          - id: three-shares
            phrase: One third. Each key gets one of three equal shares
            targets:
              - attention-mass
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: weighted-output
            phrase: nine divided by three gives three
            targets:
              - attention-mass
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: wrong-mean
            phrase: Zero and nine get equal votes and give four and a half
            targets:
              - attention-mass
            color: cyan
            linger: 0.25
            caption_boundary: true
      - say: Keep the keys and their values. Raise only the last score by the natural log of two. Its exponential
          weight doubles relative to either neighbor. Use the new maximum as the shared reference. The two
          old weights each shrink to one half and the last weight is one. What fraction of the attention
          weight goes to the nine now?
        hold: 2.2
        visual_cues:
          - id: raise-score
            phrase: Raise only the last score by the natural log of two
            targets:
              - attention-mass
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: rescale
            phrase: The two old weights each shrink to one half and the last weight is one
            targets:
              - attention-mass
            color: cyan
            linger: 0.25
            caption_boundary: true
      - say: One half. The nine now has as much mass as the other two keys together. Look at where its share
          begins on the thin strip from the first run. Divide its weighted
          contribution of nine by the new total mass of two. The output is four and a half. The local
          answers stayed at zero and nine through both runs. Their shares changed.
        hold: 1
        visual_cues:
          - id: new-share
            phrase: One half. The nine now has as much mass as the other two keys together
            targets:
              - attention-mass
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: new-output
            phrase: The output is four and a half
            targets:
              - attention-mass
            color: cyan
            linger: 0.25
            caption_boundary: true
      - say: For each shard, keep its maximum score, the sum of shifted weights, and the sum of weighted values.
          To combine shards, multiply both sums by the exponential of the local maximum minus the shared
          maximum. Then add the weighted sums and divide by the combined mass. An empty or fully masked
          shard adds zero to both sums. Its rank still participates in the collective with matching counts
          and data types. If every shard is empty, the runtime needs an explicit policy for that query.
        hold: 0.85
        visual_cues:
          - id: empty-rank
            phrase: An empty or fully masked shard adds zero to both sums
            targets:
              - attention-mass
            color: cyan
            linger: 0.25
            caption_boundary: true
