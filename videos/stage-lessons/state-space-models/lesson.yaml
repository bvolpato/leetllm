scenes:
  - id: intro
    title: "What happens to the retry limit?"
    visual: "A marker moves halfway from the stored state toward each incoming setting. The configuration stays in view when an attention query returns to the retry limit."
    beats:
      - say: "Three retries pull the green marker halfway from zero to three. One and a half is now the reader's whole memory. The timeout is one second. The marker moves halfway toward each new number. Where will it land this time?"
        hold: 2.25
        caption_starts: ["One and a half is now", "The timeout is one second", "Where will it land this time"]
        visual_cues:
          - id: retry-line
            phrase: "Three retries"
            targets: [retry-setting]
            color: blue
          - id: write-retries
            phrase: "pull the green marker halfway from zero to three"
            targets: [state-slot]
            color: green
          - id: timeout-line
            phrase: "The timeout is one second"
            targets: [timeout-setting]
            color: pink
      - say: "One and a quarter. The marker moved back toward one. The file still says three retries, but the state now holds a blend of both settings."
        hold: 0.7
        visual_cues:
          - id: write-timeout
            phrase: "One and a quarter"
            targets: [state-slot]
            color: green
      - say: "Now ask for the retry limit thirty thousand tokens later. A full attention head keeps a key and a value for every intervening token. Trace the query back to the three. Its key can draw the query's attention, and its value contributes to the answer in proportion to that weight."
        hold: 1.6
        visual_cues:
          - id: later-question
            phrase: "thirty thousand tokens later"
            targets: [token-positions]
            color: yellow
          - id: kv-entries
            phrase: "a key and a value for every intervening token"
            targets: [token-positions]
            color: blue
          - id: look-back
            phrase: "Trace the query back to the three"
            targets: [token-positions]
            color: blue
  - id: collision
    title: "Read the same two settings in a second file"
    visual: "Two labeled paths start from distinct first states, meet after the timeout, and carry the same suffix along one path. The files still require different retry counts."
    beats:
      - say: "Keep file A. File B allows one retry and gives each try two seconds. Start both readers at zero. After the retry limit, A holds one and a half. B holds a half. Average each state with its own timeout. What goes in the two slots?"
        hold: 2.4
        visual_cues:
          - id: second-file
            phrase: "File B allows one retry and gives each try two seconds"
            targets: [file-inputs]
            color: pink
          - id: two-slots
            phrase: "What goes in the two slots"
            targets: [state-paths]
            color: yellow
      - say: "Both slots hold one and a quarter. In A, one and a half plus one gives two and a half before you divide. In B, a half plus two gives the same sum. Give both readers a four, then give both a two. Once the paths meet, identical inputs keep them together."
        hold: 0.8
        visual_cues:
          - id: ssm-collision-equality
            phrase: "Both slots hold one and a quarter"
            targets: [state-paths]
            color: green
          - id: common-four
            phrase: "Give both readers a four"
            targets: [state-paths]
            color: green
          - id: common-two
            phrase: "then give both a two"
            targets: [state-paths]
            color: green
      - say: "Ask for the retry limit. File A needs three. File B needs one. A readout that gets the same state and the same question has no way to tell which file it read. A trained state-space model can use more coordinates and learn its writes. This pair tells us what to test for."
        hold: 0.85
        visual_cues:
          - id: two-answers
            phrase: "File A needs three. File B needs one"
            targets: [lookup-consequence]
            color: yellow
  - id: recurrence
    title: "What gets into the state?"
    visual: "Four writes build a common-scale trace. Each state bar consists of retained old state and the new input contribution."
    beats:
      - say: "Change the rule. This time keep nine tenths of the old state and write one fifth of each input. Start at zero. Three puts point six in the slot. On input one, point five four survives and point two comes in. That leaves point seven four. What will the four add?"
        hold: 1.8
        visual_cues:
          - id: first-update
            phrase: "Three puts point six in the slot"
            targets: [state-bars]
            color: pink
          - id: second-update
            phrase: "point five four survives and point two comes in"
            targets: [state-bars]
            color: blue
      - say: "Carry nine tenths of point seven four. The four writes eight tenths. Together they give one point four six six. On the last input, keep nine tenths of that and add point four. The final state is one point seven one nine four. All four rows are snapshots of one slot."
        hold: 0.9
        visual_cues:
          - id: third-update
            phrase: "Carry nine tenths of point seven four. The four writes eight tenths"
            targets: [state-bars]
            color: pink
          - id: fourth-update
            phrase: "keep nine tenths of that and add point four"
            targets: [state-bars]
            color: blue
      - say: "Here the output reads the whole state, so this last number is also the fourth output. In a wider model, A carries the state, B writes the input, and C reads the updated state. D can send some current input straight to the output. We'll change that readout in a moment."
        hold: 0.65
        visual_cues:
          - id: read-slot
            phrase: "this last number is also the fourth output"
            targets: [state-equation]
            color: green
  - id: kernel
    title: "Read the same four inputs by lag"
    visual: "Contributions at fixed lags reproduce the recurrent output. Increasing only the write for input four changes one bar and breaks the single-kernel rule."
    beats:
      - say: Expand the last state by substituting each earlier update. Every input now has a weight determined by how
          many transitions separate it from the output. Older writes receive more decay. The sum of those
          weighted contributions exactly reproduces our recurrent calculation from a zero initial state.
        visual_cues:
          - id: lag-contributions
            phrase: Every input now has a weight
            targets:
              - lag-contributions
            color: cyan
          - id: decayed-sum
            phrase: sum of those weighted contributions
            targets:
              - kernel-readout-6
            color: green
        hold: 0.6
      - say: Slide the readout across the sequence. The same lag weights apply at every position because the
          coefficients stay fixed. This is a causal convolution. Structured state-space models such as S4 can
          use a convolution view for full sequences and a recurrent view when generating one position at a
          time.
        visual_cues:
          - id: fixed-kernel
            phrase: same lag weights apply at every position
            targets:
              - kernel-equation-4
            color: yellow
          - id: causal-convolution
            phrase: causal convolution
            targets:
              - lag-contributions
            color: cyan
        hold: 0.65
      - say: "Keep all four inputs. Change just the write for a value above three. Raise its coefficient from one fifth to one half. Only the four qualifies. One step later its contribution rises from point seven two to one point eight. All the other bars keep their heights. At the same lag, a one and a four now have different write coefficients. A single lag kernel can't supply both."
        hold: 0.9
        visual_cues:
          - id: content-rule
            phrase: "Raise its coefficient from one fifth to one half"
            targets: [content-contributions]
            color: green
          - id: fixed-kernel-limit
            phrase: "At the same lag, a one and a four now have different write coefficients"
            targets: [kernel-equation-2]
            color: yellow
  - id: delta
    title: Step size controls how much old state survives
    visual: A moving step-size probe follows exponential retention and compares exact held-input writes with the
      implemented Mamba input coefficient.
    beats:
      - say: State-space equations often begin with continuous dynamics, then convert them into discrete steps. For a
          scalar decay rate of minus one, the carryover becomes the exponential of negative step size. A small
          step preserves most of the previous state. A larger step lets much more of it decay.
        visual_cues:
          - id: discrete-decay
            phrase: exponential of negative step size
            targets:
              - retention-curve
            color: green
          - id: large-step
            phrase: A larger step lets much more of it decay
            targets:
              - retention-probe
            color: yellow
        hold: 0.6
      - say: Watch the probe move while its retention fraction changes. Input writing needs a discretization rule too.
          With a constant held input, the exact contribution integrates that input over the interval. Mamba's
          reference update uses the step size times the input map instead, so these coefficients differ for
          finite steps.
        visual_cues:
          - id: probe-retention
            phrase: Watch the probe move while its retention fraction changes
            targets:
              - retention-probe
            color: yellow
          - id: exact-write
            phrase: exact contribution integrates that input
            targets:
              - delta-readout-3
            color: blue
          - id: mamba-write
            phrase: Mamba's reference update uses the step size times the input map
            targets:
              - delta-readout-4
            color: pink
          - id: ssm-delta-exact
            phrase: With a constant held input, the exact contribution integrates that input over the interval
            targets:
              - delta-readout-3
            color: cyan
            linger: 0.35
          - id: ssm-delta-mamba
            phrase: Mamba's reference update uses the step size times the input map instead
            targets:
              - delta-readout-4
            color: cyan
            linger: 0.35
        hold: 0.65
      - say: "At a unit step, both rules carry about thirty-seven percent of the old state. The held input writes about point six three two. The Mamba rule writes one. Shrink the step to a tenth. The write coefficients move closer together. Which rule to use depends on which system you're reproducing."
        hold: 0.8
        visual_cues:
          - id: unit-step
            phrase: "At a unit step"
            targets: [delta-readout-3, delta-readout-4]
            color: yellow
          - id: small-step-limit
            phrase: "Shrink the step to a tenth"
            targets: [retention-probe]
            color: yellow
  - id: held-input
    title: "How much of a held input survives?"
    visual: "Integrate decay over one interval, build the four half-carry states, then change the readout and skip while the final state stays fixed."
    beats:
      - say: For a held input, the exact discrete transition is the matrix exponential of step size times A. The input
          coefficient integrates exponential of u times A, multiplied by B, from zero to the step size. For
          invertible A and a positive step, this equals inverse A times the exponential transition minus
          identity, then B. A singular matrix still has the integral form.
        hold: 1.1
        visual_cues:
          - id: held-input-b1
            phrase: For a held input, the exact discrete transition is the matrix exponential of step size times A
            targets:
              - held-input-mechanism
            linger: 0.5
          - id: ssm-held-integral
            phrase: The input coefficient integrates exponential of u times A, multiplied by B, from zero to the step size
            targets:
              - held-input-mechanism
            color: cyan
            linger: 0.35
          - id: ssm-held-inverse
            phrase: For invertible A and a positive step, this equals inverse A times the exponential transition minus
              identity, then B
            targets:
              - held-input-mechanism
            color: cyan
            linger: 0.35
      - say: At scalar A equal to minus one, B equal to one and unit step, old state retains about point three six
          eight. A unit held input contributes one minus that retention, about point six three two. The
          official Mamba-one-style write uses step size times B, giving one here. Both agree approximately for
          small steps; they are different finite-step models.
        hold: 0.7
        visual_cues:
          - id: held-input-b2
            phrase: At scalar A equal to minus one, B equal to one and unit step, old state retains about point three six
              eight
            targets:
              - held-input-mechanism
            linger: 0.5
          - id: ssm-held-retention
            phrase: old state retains about point three six eight
            targets:
              - held-input-mechanism
            color: cyan
            linger: 0.35
          - id: ssm-held-exact
            phrase: A unit held input contributes one minus that retention, about point six three two
            targets:
              - held-input-mechanism
            color: cyan
            linger: 0.35
          - id: ssm-held-euler
            phrase: The official Mamba-one-style write uses step size times B, giving one here
            targets:
              - held-input-mechanism
            color: cyan
            linger: 0.35
      - say: Keep the state and readout distinct. In a second hand calculation, use half carry and half write on
          inputs three, one, four, two. Starting from zero, the successive states are one point five, one
          point two five, two point six two five and two point three one two five. Readout C selects the state
          contribution, while D supplies a direct current-input skip.
        hold: 0.7
        visual_cues:
          - id: held-input-b3
            phrase: Keep the state and readout distinct
            targets:
              - held-input-mechanism
            linger: 0.5
          - id: ssm-half-first
            phrase: the successive states are one point five
            targets:
              - held-input-mechanism
            color: cyan
            linger: 0.35
          - id: ssm-half-second
            phrase: one point two five
            targets:
              - held-input-mechanism
            color: cyan
            linger: 0.35
          - id: ssm-half-third
            phrase: two point six two five
            targets:
              - held-input-mechanism
            color: cyan
            linger: 0.35
          - id: ssm-half-fourth
            phrase: two point three one two five
            targets:
              - held-input-mechanism
            color: cyan
            linger: 0.35
      - say: "Keep the final state on the screen. The readout coefficient starts at one, so the output equals the state. Double only the readout coefficient. The output doubles and the stored number stays put. Now add half the current input through D. That adds one more to the output. The next token still starts from exactly the same state."
        hold: 0.8
        visual_cues:
          - id: change-readout
            phrase: "Double only the readout coefficient"
            targets: [readout-trial]
            color: blue
          - id: add-skip
            phrase: "Now add half the current input through D"
            targets: [readout-trial]
            color: pink
  - id: structured-block
    title: "What can different coordinates remember?"
    visual: "Two histories have equal means and opposite trends. A structured transition and fixed lag kernel illustrate S4 before two projection lanes build a selective Mamba block."
    beats:
      - say: "One history rises from one to three. The other falls from three to one. Across the whole window they have the same average height. Time runs from minus one to plus one. What sign goes on each trend?"
        hold: 2.1
        visual_cues:
          - id: draw-ramps
            phrase: "One history rises from one to three. The other falls from three to one"
            targets: [structured-block-mechanism]
            color: blue
          - id: average-height
            phrase: "they have the same average height"
            targets: [structured-block-mechanism]
            color: yellow
      - say: "Look at their slopes. On this time scale the trend is plus one in the first history and minus one in the second. A constant and a linear term capture these ramps exactly. HiPPO represents history with coefficients of orthogonal polynomials. S4 uses that framework to initialize its continuous transition. The state now has coordinates with different jobs."
        hold: 0.85
        visual_cues:
          - id: trend-signs
            phrase: "the trend is plus one in the first history and minus one in the second"
            targets: [structured-block-mechanism]
            color: pink
      - say: Original S4 uses bilinear discretization, rather than the exact zero-order hold example we computed. Its
          diagonal-plus-low-rank transition structure is doing real computational work. An efficient
          structured transition can process L positions with order L times state-width work for one channel,
          while a generic dense state-width by state-width matrix costs quadratic work per step.
        hold: 0.8
        visual_cues:
          - id: structured-block-extension-4
            phrase: Original S4 uses bilinear discretization, rather than the exact zero-order hold example we computed
            targets:
              - structured-block-extension-4
            linger: 0.5
          - id: ssm-structured-work
            phrase: An efficient structured transition can process L positions with order L times state-width work for one
              channel
            targets:
              - structured-block-extension-4
            color: cyan
            linger: 0.35
      - say: For zero initial state and fixed coefficients, an FFT can apply the prepared convolution kernel in order
          L log L work. Kernel construction has a separate cost, and the direct Python convolution in the
          article is intentionally quadratic. With a nonzero initial state, add its separately propagated
          readout contribution. These conditions explain when the two execution views implement the same
          dynamics.
        hold: 0.8
        visual_cues:
          - id: structured-block-extension-5
            phrase: For zero initial state and fixed coefficients, an FFT can apply the prepared convolution kernel in
              order L log L work
            targets:
              - structured-block-extension-5
            linger: 0.5
          - id: ssm-fft-application
            phrase: an FFT can apply the prepared convolution kernel in order L log L work
            targets:
              - structured-block-extension-5
            color: cyan
            linger: 0.35
      - say: The Mamba-one core sits inside a larger block. Project the input into a main lane and a gate lane. The
          main lane passes through a causal convolution and SiLU activation. That activation determines B, C
          and a positive step size, then enters the selective recurrence and a D-times-input skip. The learned
          A and D remain input-independent in this version.
        hold: 0.7
        visual_cues:
          - id: structured-block-b2
            phrase: The Mamba-one core sits inside a larger block
            targets:
              - structured-block-mechanism
            linger: 0.5
          - id: ssm-block-project
            phrase: Project the input into a main lane and a gate lane
            targets:
              - structured-block-mechanism
            color: cyan
            linger: 0.35
          - id: ssm-block-convolution
            phrase: The main lane passes through a causal convolution
            targets:
              - structured-block-mechanism
            color: cyan
            linger: 0.35
          - id: ssm-block-activation
            phrase: SiLU activation
            targets:
              - structured-block-mechanism
            color: cyan
            linger: 0.35
          - id: ssm-block-select
            phrase: That activation determines B, C and a positive step size
            targets:
              - structured-block-mechanism
            color: cyan
            linger: 0.35
          - id: ssm-block-recurrence
            phrase: then enters the selective recurrence and a D-times-input skip
            targets:
              - structured-block-mechanism
            color: cyan
            linger: 0.35
      - say: "The separate lane applies SiLU to z and multiplies the readout before output projection. SiLU is z times sigmoid z. Its multiplier can be negative or greater than one. Softplus makes the step size positive. Before you switch to a fused kernel, check the discretization and coefficient shapes. Compare each output and state with the reference at the precision you're using."
        hold: 0.7
        visual_cues:
          - id: structured-block-b3
            phrase: The separate lane applies SiLU to z and multiplies the readout before output projection
            targets:
              - structured-block-mechanism
            linger: 0.5
          - id: ssm-block-gate
            phrase: The separate lane applies SiLU to z
            targets:
              - structured-block-mechanism
            color: cyan
            linger: 0.35
          - id: ssm-block-readout
            phrase: the readout
            targets:
              - structured-block-mechanism
            color: cyan
            linger: 0.35
          - id: ssm-block-multiply
            phrase: multiplies the readout
            targets:
              - structured-block-mechanism
            color: cyan
            linger: 0.35
          - id: ssm-block-output
            phrase: before output projection
            targets:
              - structured-block-mechanism
            color: cyan
            linger: 0.35
  - id: selection
    title: Let the input choose the update
    visual: Each activation produces its own step size, write, and read coefficients, and those values drive the
      actual selective state trace.
    beats:
      - say: "Follow the yellow input through the block. In Mamba one, the activation after the convolution and SiLU sets the step size, the write map B and the read map C. A stays fixed. We'll use simple maps to trace four inputs."
        visual_cues:
          - id: selective-coefficients
            phrase: "sets the step size, the write map B and the read map C"
            targets:
              - selection-readout-2
            color: yellow
          - id: input-activation
            phrase: "Follow the yellow input"
            targets:
              - selection-activation
            color: yellow
        hold: 0.6
      - say: "Compare inputs one and four. At one, about two thirds of the old state survives. At four, less than half survives. But look at the pink write. It jumps from about four hundredths to one point two eight. Add that write to the blue carry. The state reaches one point four seven. Now read it out. Four sets C to one point two, so the output is about one point seven six."
        caption_starts: ["The state reaches one point four seven", "the output is about one point seven six"]
        visual_cues:
          - id: selective-carry
            phrase: "At one, about two thirds of the old state survives"
            targets:
              - selection-carry
              - selection-retention-comparison
            color: blue
          - id: selective-write
            phrase: "But look at the pink write"
            targets:
              - selection-write
              - selection-write-comparison
            color: pink
          - id: selective-readout
            phrase: "Now read it out"
            targets:
              - selection-readout-4
            color: cyan
          - id: ssm-selective-state
            phrase: "Add that write to the blue carry"
            targets:
              - selection-result
            color: cyan
            linger: 0.35
          - id: ssm-selective-readout
            phrase: "the output is about one point seven six"
            targets:
              - selection-readout-4
            color: cyan
            linger: 0.35
        hold: 0.65
      - say: "The last input is two. Start with the state the four left behind. About six tenths survives, and the new write adds about a fifth. Together they bring the state down to about one point zero nine. A model can learn a strong write for a retry setting and a light one for the words that follow."
        visual_cues:
          - id: preserve-evidence
            phrase: "Start with the state the four left behind"
            targets:
              - selection-old
            color: green
          - id: decay-and-replace
            phrase: "Together they bring the state down to about one point zero nine"
            targets:
              - selection-result
            color: yellow
        hold: 0.7
      - say: "Start both trials at one. Send a zero. Its write vanishes, so the blue carry stops short of one. If it grows, check the sign of A and the step size. Reset to one and send a four. Blue still falls short. The pink write takes the state past one. If two inputs give identical coefficients, try more inputs to check the maps. Once the states match the reference, profile the loop and memory copies."
        hold: 0.85
        visual_cues:
          - id: probe-zero
            phrase: Send a zero
            targets: [zero-input-check]
            color: blue
          - id: probe-four
            phrase: Reset to one and send a four
            targets: [zero-input-check]
            color: pink
          - id: probe-write
            phrase: "The pink write takes the state past one"
            targets: [zero-input-check]
            color: pink
  - id: scan
    title: Compose updates without changing their order
    visual: Ordered affine pairs combine into subtree summaries and then all inclusive prefix states,
      demonstrating an associative scan.
    beats:
      - say: "For a known sequence, the inputs determine these coefficients before the states are evaluated. Treat
          each update as an affine function: multiply the incoming state, then add a write. Two updates can be
          composed into one affine pair, using the second transition to scale the first write."
        visual_cues:
          - id: affine-updates
            phrase: multiply the incoming state, then add a write
            targets:
              - affine-input-pairs
            color: blue
          - id: compose-two
            phrase: Two updates can be composed into one affine pair
            targets:
              - composed-affine-pairs
            color: yellow
        hold: 0.6
      - say: Composition is associative in exact arithmetic. We can group adjacent updates into a tree while
          preserving their order. Parallel prefix scan uses this property to recover the state after every
          prefix. A single reduction would give only the final composition, leaving the earlier outputs
          unavailable.
        visual_cues:
          - id: ordered-tree
            phrase: group adjacent updates into a tree
            targets:
              - composed-affine-pairs
            color: yellow
          - id: all-prefix-states
            phrase: recover the state after every prefix
            targets:
              - scan-readout-2
            color: green
        hold: 0.65
      - say: Fused implementations also control memory traffic so expanded state needn't be written to device memory
          after every elementary operation. Regrouping can change floating-point rounding, so compare a
          suitable reference with meaningful tolerances. An arbitrary hidden-state-dependent nonlinear
          recurrence may lack these precomputable affine pairs.
        visual_cues:
          - id: fused-scan
            phrase: expanded state needn't be written to device memory
            targets:
              - affine-input-pairs
            color: blue
          - id: scan-reference
            phrase: compare a suitable reference
            targets:
              - scan-readout-2
            color: yellow
        hold: 0.7
  - id: prefix-construction
    title: Recover every prefix, not only the reduction
    visual: Retain ordered affine pairs, join adjacent ranges, then distribute earlier-prefix contributions into
      every leaf output.
    beats:
      - say: Construct a tiny inclusive scan from two affine updates. The first maps h to point five h plus two. The
          second maps h to point two h plus one. From zero, the first prefix gives two. The second applies its
          decay to that first write, giving point two times two plus one, or one point four.
        hold: 1.1
        visual_cues:
          - id: prefix-construction-b1
            phrase: Construct a tiny inclusive scan from two affine updates
            targets:
              - prefix-construction-mechanism
            linger: 0.5
          - id: ssm-prefix-first
            phrase: From zero, the first prefix gives two
