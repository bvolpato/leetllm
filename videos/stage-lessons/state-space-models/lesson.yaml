  - id: ssd-and-refinement
    title: How Mamba-2 and Mamba-3 use the state
    visual: Chunk-local outputs and end states combine with propagated boundary state; then a previous-write
      buffer separates Mamba3 from SSD.
    beats:
      - say: "Mamba-two uses structured state space duality, or SSD. Its transition within a head is a scalar times the identity. Pick a cell in the triangle. Its weight combines an earlier write, the decay on the way to this position, and the current read. That factorization gives the green block its low rank and connects the recurrence to a structured form of masked kernel attention."
        hold: 1.1
        visual_cues:
          - id: ssd-and-refinement-b1
            phrase: Mamba-two uses structured state space duality, or SSD
            targets:
              - ssd-and-refinement-mechanism
            linger: 0.5
          - id: ssm-ssd-factor
            phrase: "an earlier write, the decay on the way to this position, and the current read"
            targets:
              - ssd-and-refinement-mechanism
            color: cyan
            linger: 0.35
      - say: "Cut the four inputs in half. Start each chunk at zero and compute its two local outputs. The right chunk starts with a four, so its first local result is point eight. What is missing?"
        hold: 2.25
        caption_starts: ["What is missing"]
        visual_cues:
          - id: ssd-and-refinement-b2
            phrase: "Cut the four inputs in half"
            targets: [ssd-and-refinement-mechanism]
            color: cyan
          - id: ssm-ssd-local
            phrase: "Start each chunk at zero and compute its two local outputs"
            targets: [ssd-and-refinement-mechanism]
            color: blue
      - say: "Take the point seven four at the left boundary. Carry it one step to the right. Adding that contribution brings point eight up to one point four six six. Carry it twice for the last position. The four outputs now match the original recurrence. SSD uses batched matrix products inside chunks and propagates state along the shorter chain of boundaries. At width two hundred fifty-six, sixteen thousand three hundred eighty-four inputs fill sixty-four chunks. One extra input opens chunk sixty-five."
        hold: 0.85
        caption_starts: ["Take the point seven four at the left boundary", "Adding that contribution"]
        visual_cues:
          - id: ssd-incoming
            phrase: "Take the point seven four at the left boundary"
            targets: [ssd-and-refinement-mechanism]
            color: yellow
          - id: ssd-first-carry
            phrase: "Carry it one step to the right"
            targets: [ssd-and-refinement-mechanism]
            color: yellow
          - id: ssm-ssd-boundary
            phrase: "Carry it twice for the last position"
            targets: [ssd-and-refinement-mechanism]
            color: green
          - id: ssm-chunks64
            phrase: "sixteen thousand three hundred eighty-four inputs fill sixty-four chunks"
            targets: [ssd-and-refinement-mechanism]
            color: blue
          - id: ssm-chunk65
            phrase: "One extra input opens chunk sixty-five"
            targets: [ssd-and-refinement-mechanism]
            color: yellow
      - say: "Start with the two writes on the left. The Mamba-three block drops the short convolution and saves the previous write. Its exponential-trapezoidal rule mixes the two endpoints. At weight one, the real-coordinate update uses the current endpoint, as in exponential Euler. At one half, both interval endpoints contribute. For second-order accuracy the weight must stay within order delta of one half, and the signal and dynamics must meet the smoothness and stability conditions. Now watch the arrow. In this example a one turns it halfway around, and a zero leaves it pointing the same way. The direction tracks whether the number of ones is odd or even. That's one use for a complex state rotation. On the right, two input directions write two and three into the same state. One read adds them to get five. The other subtracts them to get minus one. Multiple input and output directions let Mamba three do more arithmetic each time it reads the state from memory. To measure generation speed, count the tokens it emits per second."
        hold: 0.7
        visual_cues:
          - id: ssd-and-refinement-b3
            phrase: "Start with the two writes on the left"
            targets:
              - ssd-and-refinement-mechanism
            linger: 0.5
          - id: ssm-rotation
            phrase: "a one turns it halfway around, and a zero leaves it pointing the same way"
            targets:
              - ssd-and-refinement-mechanism
            color: cyan
            linger: 0.35
          - id: ssm-mimo
            phrase: "One read adds them to get five"
            targets:
              - ssd-and-refinement-mechanism
            color: cyan
            linger: 0.35
          - id: difference-read
            phrase: "The other subtracts them to get minus one"
            targets: [ssd-and-refinement-mechanism]
            color: pink
          - id: ssm-trapezoid-half
            phrase: At one half, both interval endpoints contribute
            targets:
              - ssd-and-refinement-mechanism
            color: cyan
            linger: 0.35
  - id: checkpoint
    title: A rejected branch needs a valid state to return to
    visual: Provisional inputs overwrite a state, then restoration to the accepted checkpoint precedes the
      corrected continuation and avoids contamination.
    beats:
      - say: Streaming also gives us a state-management responsibility. Suppose two provisional inputs update the
          summary, and only the first is accepted. The last state already contains the rejected input.
          Processing a correction from that state would carry rejected evidence into the continued sequence.
        visual_cues:
          - id: accepted-state
            phrase: only the first is accepted
            targets:
              - checkpoint-readout
            color: green
          - id: rejected-input
            phrase: last state already contains the rejected input
            targets:
              - checkpoint-live
            color: pink
        hold: 0.6
      - say: Restore the accepted checkpoint, then process the correction. The result matches a direct reference run.
          A full Mamba-one block also needs its convolution buffer restored. Extra snapshots and speculative
          branches consume memory, even though one live recurrent state stays fixed with respect to processed
          length.
        visual_cues:
          - id: restore-checkpoint
            phrase: Restore the accepted checkpoint
            targets:
              - checkpoint-live
            color: green
          - id: apply-correction
            phrase: then process the correction
            targets:
              - checkpoint-input
            color: pink
          - id: reference-state
            phrase: result matches a direct reference run
            targets:
              - checkpoint-readout-3
            color: green
          - id: ssm-checkpoint-reference
            phrase: The result matches a direct reference run
            targets:
              - checkpoint-live
            color: cyan
            linger: 0.35
        hold: 0.65
      - say: "Try the other boundary. Start the correction from the state after the rejected seventy-seven. That gives thirty-three point seven eight one two five. Compare it with the direct run below. Undoing the last step by division can amplify rounding, and a carry that underflows to zero has already erased the old state. Keep an accepted checkpoint or replay from one."
        hold: 0.9
        visual_cues:
          - id: wrong-branch
            phrase: "That gives thirty-three point seven eight one two five"
            targets: [boundary-comparison]
            color: pink
