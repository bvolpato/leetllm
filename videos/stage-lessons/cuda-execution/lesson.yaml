  - id: precision-controls
    title: Which precision change touched the result?
    visual: >-
      Scale a tiny gradient, trace two different causes of a NaN, then switch the input precision of
      one illustrative matrix-product term while keeping the tensor storage visible.
    beats:
      - say: >-
          Keep the master weight in full precision. PyTorch autocast can still choose lower precision
          for individual operations. Look at this tiny gradient. Storing it directly in FP16 rounds it
          to zero. Scale the loss, carry that scale through backward, then unscale the gradients in
          full precision before the update. At this scale the intermediate gradient fits. We still
          need finite loss, finite gradients and a check on the task itself.
        hold: 0.75
        visual_cues:
          - id: amp-unscale
            phrase: "Scale the loss, carry that scale through backward, then unscale the gradients in full precision"
            targets: [precision-controls-construction]
            color: yellow
            linger: 0.35
      - say: >-
          Both calculations end in NaN. Trace the first value that goes wrong in each run.
          On the left, a product overflows and we subtract infinity from itself. On the right, a tiny
          value rounds to zero and we divide zero by zero. Both examples recover in full precision. If
          turning off mixed precision fixes a run, check the actual dtypes, scaling, kernels and
          reductions to find which operation failed.
        hold: 0.8
        visual_cues:
          - id: amp-diagnosis
            phrase: "Trace the first value that goes wrong in each run"
            targets: [precision-controls-construction]
            color: pink
            linger: 0.35
      - say: >-
          Look at one output of a matrix multiply. Only this weight times one contributes to it.
          The other products are zero. The input and output tensors both use float32 storage.
          Switch the multiply inputs to TF32. Watch the bits in the middle. That small fraction
          rounds away, even though the accumulator and output still use FP32. On a supported NVIDIA
          GPU you can choose this TensorFloat mode for eligible operations. Record the matmul
          precision setting, use a consistent set of PyTorch controls, and compare the result to
          your tolerance before accepting a faster run.
        hold: 0.8
        visual_cues:
          - id: tf32-storage
            phrase: "Switch the multiply inputs to TF32"
            targets: [precision-controls-construction]
            color: yellow
            linger: 0.35
  - id: allocator-ledger
    title: Which memory can the allocator give back?
    visual: >-
      Keep live tensors in place as two cached blocks leave. Keep the memory count visible while the
      compute lane waits for another batch.
    beats:
      - say: >-
          Your GPU tool reports eleven gibibytes. Follow the owners in this example. Eight belong to
          live tensors. Two empty blocks still belong to PyTorch's cache. Count those ten together for
          reserved memory. The last block is the CUDA context, outside that pool. On a real device the
          driver can also see other allocations.
        hold: 0.7
        visual_cues:
          - id: allocator-counts
            phrase: "Count those ten together for reserved memory"
            targets: [allocator-ledger-construction]
            color: blue
            linger: 0.35
      - say: >-
          Call empty cache. Watch which blocks leave. Allocated memory stays at eight because the job
          still holds those tensors. Reserved memory falls to eight, and the driver sees nine
          including the context. The job could already reuse the cached blocks. Clearing them after
          each layer can't free an activation that backward still needs.
        hold: 0.75
        visual_cues:
          - id: allocator-return
            phrase: "Watch which blocks leave"
            targets: [allocator-ledger-construction]
            color: yellow
            linger: 0.35
      - say: >-
          Leave the weights in place and wait for the CPU to prepare the next batch. Watch the idle
          interval and the short burst that follows. The memory count barely budges. A utilization
          sample can miss that burst entirely. Check the timeline for late batches, copies or a host
          wait before tuning the kernel.
        hold: 0.7
        visual_cues:
          - id: allocator-idle
            phrase: "Watch the idle interval and the short burst that follows"
            targets: [allocator-ledger-construction]
            color: cyan
            linger: 0.35
  - id: copy-dependencies
    title: When can the second batch start?
    visual: >-
      Use a common clock for the copy and compute streams. Give each batch a separate device input
      buffer. Connect each copy-complete event to its own kernel and distinguish host refill from
      device reuse.
    beats:
      - say: >-
          Batch A and batch B are ready in pinned host memory. Pinning keeps those pages in place for
          the transfer. A nonblocking copy lets Python continue when the hardware and runtime support
          it. Follow both batches through one stream. Each copy takes three milliseconds and each
          kernel takes seven in this example. Where could we put the second copy while the first
          kernel is running?
        hold: 2.15
        visual_cues:
          - id: copy-serial
            phrase: "Follow both batches through one stream"
            targets: [copy-schedule]
            color: blue
            linger: 0.35
      - say: >-
          Give each batch its own device input buffer. Put the copies on a separate stream with a
          free copy engine. Record an event after each copy. Have the compute stream wait for A's
          event before launching A, and for B's event before launching B. Start copying B as soon as
          A's copy finishes. Stop at six milliseconds. Both inputs have arrived. Can B's kernel start
          here?
        hold: 2.4
        visual_cues:
          - id: copy-buffers
            phrase: "Give each batch its own device input buffer"
            targets: [device-inputs]
            color: cyan
            linger: 0.35
          - id: copy-start-a
            phrase: "wait for A's event before launching A"
            targets: [copy-schedule]
            color: blue
            linger: 0.35
          - id: copy-overlap
            phrase: "Start copying B as soon as A's copy finishes"
            targets: [copy-schedule, device-inputs]
            color: cyan
            linger: 0.35
      - say: >-
          Look at the compute lane. A still owns it. Let A finish, then run B. A finishes at ten
          milliseconds and B at seventeen. We saved three milliseconds against the serial schedule.
          Check the timeline on your GPU to see whether the copy engine and compute actually
          overlapped.
        hold: 0.85
        caption_starts:
          - "A finishes at ten milliseconds"
        visual_cues:
          - id: copy-finish
            phrase: "Let A finish, then run B"
            targets: [copy-schedule, device-inputs]
            color: yellow
            linger: 0.35
      - say: >-
          Replay just the first two copies. Release each pinned source when its copy finishes. If the
          CPU refills either buffer too soon, the GPU can receive part of the next batch. The input
          on the device has a different lifetime. Keep it until its kernel finishes reading.
        hold: 0.8
        visual_cues:
          - id: copy-ownership
            phrase: "Release each pinned source when its copy finishes"
            targets: [batch-ready, copy-schedule]
            color: green
            linger: 0.35
      - say: >-
          Reverse the direction. This time the CPU wants to read the copied feature. Wait for the
          device-to-host transfer to finish. Now the host buffer is ready to read.
        hold: 0.8
        visual_cues:
          - id: copy-readiness
            phrase: "Wait for the device-to-host transfer to finish"
            targets: [host-destination]
            color: blue
            linger: 0.35
  - id: synthesis
    title: Can fewer bytes raise the upper bound?
    visual: >-
      Hold the operation count and both hardware ceilings fixed. Move a kernel along the sloped
      bandwidth limit until fewer bytes stop raising its upper bound.
    beats:
      - say: >-
          Our kernel does a thousand floating-point operations and moves four thousand bytes beyond
          the caches. Divide operations by bytes. That's a quarter of an operation per byte, its
          arithmetic intensity. Multiply by the device's forty gigabytes per second. Even with perfect
          use of that bandwidth, the work tops out at ten gigaflops per second. The lower of this
          limit and the compute ceiling is the Roofline bound.
        hold: 0.75
        caption_starts:
          - "That's a quarter of an operation per byte"
        visual_cues:
          - id: build-intensity
            phrase: "Divide operations by bytes"
            targets: [byte-ledger, roofline-point]
            color: yellow
            linger: 0.35
      - say: >-
          Reuse each load and reduce the bytes moved. Keep the thousand operations. At a thousand
          bytes the point has climbed to forty gigaflops per second. If we could get all the way down
          to two hundred fifty bytes, would this line keep climbing at the same rate?
        hold: 2.1
        visual_cues:
          - id: reuse-bytes
            phrase: "reduce the bytes moved"
            targets: [byte-ledger, roofline-point]
            color: cyan
            linger: 0.35
      - say: >-
          Follow the point until it reaches the arithmetic ceiling. The last part of the trip is
          horizontal. Once compute sets the bound, saving another byte can't raise that roof. A real
          kernel can still run well below it. Check the output, then measure the whole step to see
          what the reuse bought you.
        hold: 0.8
        caption_starts:
          - "The last part of the trip is horizontal"
        visual_cues:
          - id: reach-compute
            phrase: "Follow the point until it reaches the arithmetic ceiling"
            targets: [byte-ledger, roofline-point]
            color: yellow
            linger: 0.35
  - id: occupancy-resources
    title: How many warps fit on one SM?
    visual: >-
      Fill warp slots on a hypothetical SM. Double the per-block shared tile, leave fewer blocks
      resident and reuse eight global values for two passes.
    beats:
      - say: >-
          Each square is a place for a warp on one hypothetical streaming multiprocessor. There are
          sixty-four places, sixty-four kibibytes of shared memory and sixty-five thousand five
          hundred thirty-six registers. Put one block of two hundred fifty-six threads on it. That
          fills eight warp slots. At thirty-two registers per thread, the block also takes eight
          thousand one hundred ninety-two registers.
        hold: 0.65
        visual_cues:
          - id: occupancy-block
            phrase: "Put one block of two hundred fifty-six threads on it"
            targets: [occupancy-resources-construction]
            color: blue
            linger: 0.35
      - say: >-
          Give each block a sixteen-kibibyte tile. Fill the SM until the shared memory runs out. Four
          blocks fit, so thirty-two of the sixty-four warp slots are occupied. That fraction is called
          occupancy. Now double the tile size while keeping the same threads. Two blocks fit.
          Occupancy drops from one half to one quarter. Real hardware has allocation granularity and
          other limits to check as well.
        hold: 0.75
        caption_starts:
          - "Four blocks fit"
          - "Two blocks fit"
        visual_cues:
          - id: occupancy-four
            phrase: "Fill the SM until the shared memory runs out"
            targets: [occupancy-resources-construction]
            color: blue
            linger: 0.35
          - id: occupancy-two
            phrase: "double the tile size while keeping the same threads"
            targets: [occupancy-resources-construction]
            color: yellow
            linger: 0.35
      - say: >-
          Would you throw out the larger tile? Load our eight values once and read the shared copy
          twice. Both passes got their inputs from the same eight global loads. Fewer resident warps
          can make it harder to hide a stall, while reuse can save traffic. Check the answer and time
          the whole step. The lower occupancy alone can't tell you which version wins.
        hold: 0.8
        visual_cues:
          - id: occupancy-reuse
            phrase: "Load our eight values once and read the shared copy twice"
            targets: [occupancy-resources-construction]
            color: cyan
            linger: 0.35
  - id: profile-choice
    title: Where would you look first?
    visual: >-
      Select the kernel on a host and device timeline. Check a wrong sum against the reference. For
      the repaired eight-value sum, line up two physical layouts beneath the same logical values.
    beats:
      - say: >-
          Look at the gap before this GPU copy. Was the CPU still preparing the batch? Nsight Systems
          puts host work, copies and streams on one timeline. Now select the kernel itself. Nsight
          Compute can show which instructions stalled, how many warps were resident and how much data
          moved. For a device-memory Roofline, use bytes beyond the caches and bandwidth at that same
          level.
        hold: 0.7
        visual_cues:
          - id: profile-kernel
            phrase: "Now select the kernel itself"
            targets: [profile-choice-construction]
            color: yellow
            linger: 0.35
      - say: >-
          All eight loads in our teaching kernel are in bounds. Compare its sum with a trusted result.
          Even legally addressed values can add up to the wrong answer if the code adds a one twice.
          For a custom kernel, Compute Sanitizer also checks memory access, shared-memory races and
          synchronization. Use both checks before you interpret a timing improvement.
        hold: 0.75
        visual_cues:
          - id: profile-correctness
            phrase: "Compare its sum with a trusted result"
            targets: [profile-choice-construction]
            color: pink
            linger: 0.35
      - say: >-
          Now use the corrected sum. Keep the eight logical values and the lanes that read them. In
          the first layout, consecutive lanes read words thirty-two positions apart. Pack the words
          side by side in a second layout. Both start on a thirty-two-byte boundary. How many
          segments does the warp load touch in the second layout?
        hold: 2.15
        visual_cues:
          - id: profile-one-variable
            phrase: "Pack the words side by side in a second layout"
            targets: [profile-packed]
            color: cyan
            linger: 0.35
      - say: >-
          Trace the segment boundaries. All eight packed words fit in one segment. The strided layout
          needed eight. Try the layout on your GPU. If you have to repack every batch, include that
          time. In NVIDIA's assess, parallelize, optimize and deploy cycle, measure a representative
          step, change one thing and check the output and whole-step time. Record the shape, device,
          dtype, precision setting, warmup and timer endpoints.
        hold: 0.85
        caption_starts:
          - "All eight packed words fit in one segment"
        visual_cues:
          - id: profile-segment-count
            phrase: "Trace the segment boundaries"
            targets: [profile-packed, profile-footprint]
            color: yellow
            linger: 0.35
  - id: full-step-contract
    title: What is the logging line waiting for?
    visual: >-
      Keep the kernel fixed and compare scalar reads starting at 2 and 32 milliseconds on the same
      ruler. Mark the time spent waiting and the time spent reading. Then time a complete step.
    beats:
      - say: >-
          Put all four tickets through one update. Check placement and shapes, take the forward loss
          through backward, then update the weights. Try the longest input as well as a typical one.
          Our small classifier used plain SGD. Switch it to Adam and the first update can allocate two
          moments per weight. That extra allocation can fail even after backward succeeded.
        hold: 0.75
        visual_cues:
          - id: full-step-checks
            phrase: "Check placement and shapes, take the forward loss through backward, then update the weights"
            targets: [full-step-contract-construction]
            color: blue
            linger: 0.35
          - id: full-step-moments
            phrase: "the first update can allocate two moments per weight"
            targets: [full-step-contract-construction]
            color: pink
            linger: 0.35
      - say: >-
          A profile puts forty milliseconds on the call that reads the loss. Python asks at two.
          The kernel finishes at forty-one, and the scalar takes one more millisecond to reach Python.
          This time let Python do other work until thirty-two milliseconds, then read the same loss.
          Look at how much of the kernel is left. Nine milliseconds of waiting and one to read.
          That's ten milliseconds in the call. Python can also queue another operation on the same
          CUDA stream. The GPU runs that operation after the loss is ready while Python continues.
          A kernel error can surface at a later host wait. For debugging, launch blocking can reveal
          the Python line that submitted the failing work. Turn it off before timing.
        hold: 0.75
        caption_starts:
          - "Nine milliseconds of waiting"
          - "That's ten milliseconds"
        visual_cues:
          - id: full-step-wait
            phrase: "let Python do other work until thirty-two milliseconds"
            targets: [later-read]
            color: blue
            linger: 0.25
          - id: full-step-remaining
            phrase: "Nine milliseconds of waiting and one to read"
            targets: [later-read]
            color: yellow
            linger: 0.35
          - id: full-step-read-time
            phrase: "That's ten milliseconds in the call"
            targets: [later-read]
            color: yellow
            linger: 0.25
          - id: full-step-stream-use
            phrase: "queue another operation on the same CUDA stream"
            targets: [stream-consumer]
            color: cyan
            linger: 0.25
      - say: >-
          One more trap. There are five milliseconds of older work ahead of the step we want. Drain
          the old work, start the host clock, and stop it after the target finishes. With CUDA events,
          count the interval between the two recorded timestamps on the stream, including any gaps.
          Decide whether the question includes copies and reporting, then keep those boundaries fixed.
        hold: 0.85
        visual_cues:
          - id: full-step-boundary
            phrase: "Drain the old work, start the host clock, and stop it after the target finishes"
            targets: [full-step-contract-construction]
            color: cyan
            linger: 0.35
  - id: transfer
    title: Ten inputs go to twelve workers
    visual: >-
      Close the divisor bracket under the real zero at T9. Keep the exact fraction visible as Python
      reads the stored FP32 value. Format the log separately.
    beats:
      - say: >-
          Add six and zero to the original row. Three blocks of four threads now cover ten inputs. The
          extra workers skip the array, publish neutral zeros, and still reach the barrier. Look at
          the last block. Three of its contributions are zero. How many of those came from the ticket?
          Predict the pooled feature.
        hold: 2.6
        visual_cues:
          - id: final-tail
            phrase: "extra workers skip the array, publish neutral zeros"
            targets: [final-ownership]
            color: yellow
            linger: 0.35
          - id: final-predict
            phrase: "Predict the pooled feature"
            targets: [final-result]
            color: blue
            linger: 0.35
      - say: >-
          Combine the three completed subtotals. Token nine really was zero, so it counts in the
          average. The two workers beyond it have no token to count. Divide by ten valid values. The
          exact mean is two point seven. Is that the number Python will get when it reads this FP32
          tensor?
        hold: 2
        caption_starts:
          - "Token nine really was zero"
        visual_cues:
          - id: final-sums
            phrase: "Combine the three completed subtotals"
            targets: [final-ownership, final-result]
            color: cyan
            linger: 0.35
          - id: final-divide
            phrase: "Divide by ten valid values"
            targets: [final-result, final-ownership]
            color: cyan
            linger: 0.35
          - id: final-numeric-result
            phrase: "The exact mean is two point seven"
            targets: [final-result]
            color: green
            linger: 0.35
            caption_boundary: true
      - say: >-
          Call item and wait for the device result. Python gets the stored float. It's a little above
          the exact mean. Format the number to one decimal place for the log. That's where the short
          spelling comes from.
        hold: 1.1
        visual_cues:
          - id: final-report
            phrase: "Call item and wait for the device result"
            targets: [final-report]
            color: cyan
            linger: 0.35
          - id: final-format
            phrase: "Format the number to one decimal place"
            targets: [final-report]
            color: green
            linger: 0.35
  - id: fresh-runtime
    title: Ticket 104
    visual: >-
      Ask which threads read and what mean they produce above thirteen inputs and sixteen worker
      slots. Switch to the timing question as the clock appears. Enter the caller's latency beside
      the formatted feature after the timing prediction.
    beats:
      - say: >-
          Take one last ticket. Keep the original eight numbers and append the five on the right. Each
          block now gets eight threads. Picture what goes into the empty slots below the input. Which
          threads can read a value? Which have to reach the barrier? What number should eventually
          appear in Python?
        hold: 3.4
        visual_cues:
          - id: fresh-append
            phrase: "append the five"
            targets: [fresh-input]
            color: cyan
            linger: 0.35
          - id: fresh-predict
            phrase: "Which threads can read a value"
            targets: [fresh-input, fresh-block-1]
            color: cyan
            linger: 0.35
      - say: >-
          Copy each real input into its thread's slot. See the zero at token nine? It has a source.
          For the last three threads, write a zero locally. Their indexes fall past the end of the
          array. Bring all eight threads in each block to its barrier. Each block can now read its
          complete row.
        hold: 0.9
        visual_cues:
          - id: fresh-reads
            phrase: "Copy each real input into its thread's slot"
            targets: [fresh-input, fresh-block-1]
            color: cyan
            linger: 0.35
          - id: fresh-guards
            phrase: "For the last three threads, write a zero locally"
            targets: [fresh-block-1]
            color: yellow
            linger: 0.35
          - id: fresh-arrivals
            phrase: "Bring all eight threads in each block to its barrier"
            targets: [fresh-block-0, fresh-block-1]
            color: blue
            linger: 0.35
      - say: >-
          Gather the first block's sum. That's the original twenty-one. Gather the second block's sum.
          Those five new inputs add fourteen. For the divisor, count the positions in the input row.
          Divide thirty-five by thirteen. The device result rounds to about two point six nine two
          three. Keep that number for the log.
        hold: 1.1
        caption_starts:
          - "That's the original twenty-one"
          - "Those five new inputs add fourteen"
          - "The device result rounds"
          - "two point six nine two three"
        visual_cues:
          - id: fresh-subtotal-0
            phrase: "Gather the first block's sum"
            targets: [fresh-block-0]
            color: cyan
            linger: 0.35
          - id: fresh-subtotal-1
            phrase: "Gather the second block's sum"
            targets: [fresh-block-1]
            color: blue
            linger: 0.35
          - id: fresh-count
            phrase: "count the positions in the input row"
            targets: [fresh-input]
            color: yellow
            linger: 0.35
          - id: fresh-mean
            phrase: "The device result rounds to about two point six nine two three"
            targets: [fresh-quotient]
            color: green
            linger: 0.35
      - say: >-
          Now put that launch on a fresh clock. The caller logs four decimal places. The host starts
          at four milliseconds. The call returns at six. If you stop here, your log will say two
          milliseconds again. Python asks for the scalar.
        hold: 0.75
        visual_cues:
          - id: fresh-return
            phrase: "The call returns at six"
            targets: [host-receipt, event-receipt]
            color: blue
            linger: 0.35
      - say: >-
          Watch the end event on the GPU stream. Now follow the number back to Python. We have both
          end marks. How much time belongs beside this ticket if we care about the whole trip, from
          calling mean to having a number to log?
        hold: 2.8
        visual_cues:
          - id: fresh-device-end
            phrase: "Watch the end event on the GPU stream"
            targets: [event-receipt]
            color: cyan
            linger: 0.35
          - id: fresh-report
            phrase: "follow the number back to Python"
            targets: [host-receipt, host-scalar]
            color: green
            linger: 0.35
      - say: >-
          Twenty milliseconds. Subtract the host start from the time the number came back. The GPU
          events ran from five to twenty-three. That's eighteen milliseconds. Use that interval when
          you're comparing the same work on the stream. This log is for the person waiting for a
          number. Enter the caller's time beside the feature. Now the next ticket can be compared on
          the same terms.
        hold: 1.8
        caption_starts:
          - "That's eighteen milliseconds"
        visual_cues:
          - id: fresh-intervals
            phrase: "Twenty milliseconds"
            targets: [host-receipt]
            color: yellow
            linger: 0.35
          - id: fresh-stream-interval
            phrase: "That's eighteen milliseconds"
            targets: [event-receipt]
            color: cyan
            linger: 0.35
          - id: fresh-log
            phrase: "Enter the caller's time beside the feature"
            targets: [ticket-log]
            color: green
            linger: 0.35
