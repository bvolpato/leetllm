            color: blue
            linger: 0.35
      - say: >-
          Add a gradient for every weight. The bar crosses the line during backward, even if the
          activations cost nothing. Now add Adam's two running averages. That's fifty-six gigabytes of
          parameter state under this generous assumption that all four arrays use two bytes per value.
        hold: 1
        caption_starts:
          - "That's fifty-six gigabytes"
          - "The bar crosses the line during backward"
        visual_cues:
          - id: large-gradients
            phrase: "Add a gradient for every weight"
            targets: [budget-stack, budget-total]
            color: cyan
            linger: 0.35
          - id: large-moments
            phrase: "add Adam's two running averages"
            targets: [budget-stack, budget-total]
            color: pink
            linger: 0.35
      - say: >-
          What if autocast chooses half precision for a matrix multiply but keeps the weights in full
          precision? Give each weight, gradient and moment four bytes. The bar doubles to one hundred
          twelve gigabytes. To budget your own run, inspect the optimizer and the dtypes of the
