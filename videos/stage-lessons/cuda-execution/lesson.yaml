            phrase: "Cut those activations in half"
            targets: [budget-stack, budget-total]
            color: green
            linger: 0.35
      - say: >-
          Now take a model whose fixed state fits. We can accumulate gradients over smaller batches,
          then update once. For our ticket mean, each ticket counts once. Switch to a loss that
          averages valid tokens. Split two tickets into separate microbatches. The first has one
