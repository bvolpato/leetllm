            phrase: "three, each with loss three"
            targets: [loss-tokens]
            color: cyan
            linger: 0.35
      - say: >-
          Count all four valid tokens. Add the losses on each ticket. The first sums to one and the
          second sums to nine. Divide each sum by four before backward. The two contributions add
          up to two and a half, the mean loss per token. Accumulate their gradients and take one
          optimizer step.
        hold: 1
        caption_starts:
          - "The two contributions add up"
        visual_cues:
          - id: micro-denominator
            phrase: "Count all four valid tokens"
            targets: [loss-tokens]
            color: yellow
            linger: 0.35
          - id: micro-sums
            phrase: "The first sums to one and the second sums to nine"
            targets: [loss-sums]
            color: blue
            linger: 0.35
          - id: micro-divide
            phrase: "Divide each sum by four before backward"
            targets: [loss-sums, combined-loss]
            color: yellow
            linger: 0.35
          - id: micro-mean
            phrase: "add up to two and a half"
            targets: [combined-loss]
            color: green
            linger: 0.35
      - say: >-
          Now give each ticket one integer class label. We're using class-weighted cross-entropy.
          Both tickets get two equal scores, so each target has probability one half. Its loss
          before weighting is the natural log of two. Give the first ticket's class weight zero
          and the second one's weight one. What does the first ticket contribute to backward?
        hold: 2.6
        visual_cues:
          - id: equal-scores
            phrase: "Both tickets get two equal scores"
            targets: [ticket-scores]
            color: blue
            linger: 0.35
          - id: base-loss
            phrase: "Its loss before weighting is the natural log of two"
            targets: [raw-loss]
            color: cyan
            linger: 0.35
          - id: micro-weight-units
            phrase: "Give the first ticket's class weight zero and the second one's weight one"
            targets: [target-weights]
            color: cyan
            linger: 0.35
      - say: >-
          Ticket A's weighted loss sum is zero. Try its own mean and you get zero divided by zero.
          Now add the weights of all the targets we keep across the full batch. Here the total
          weight is one. Divide each microbatch's weighted loss sum by
          that same total before backward. Watch the divisor on ticket A. Zero divided by one gives
          zero. Only the second ticket contributes a gradient. Together the tickets give a mean
          loss of about point six nine three.
        hold: 1.2
        caption_starts:
          - "Here the total weight is one"
          - "Zero divided by one gives zero"
          - "Together the tickets"
        visual_cues:
          - id: weighted-sums
            phrase: "Ticket A's weighted loss sum is zero"
            targets: [weighted-losses]
            color: blue
            linger: 0.35
          - id: local-mean
            phrase: "Try its own mean and you get zero divided by zero"
            targets: [ticket-a-division]
            color: pink
            linger: 0.35
          - id: weighted-total
            phrase: "add the weights of all the targets we keep"
            targets: [target-weights, full-weight]
            color: yellow
            linger: 0.35
          - id: weighted-backward
            phrase: "Divide each microbatch's weighted loss sum by that same total before backward"
