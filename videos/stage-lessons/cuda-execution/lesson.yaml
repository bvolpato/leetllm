            targets: [budget-stack, budget-total]
            color: blue
            linger: 0.35
      - say: >-
          Go back to two-byte storage. Suppose the batch keeps eight gigabytes of activations. Cut
          those activations in half. The fixed state still crosses the line. For this model we need
          room for that state first. If we shorten the sequences, we may also lose context the task
          needs.
        hold: 0.85
        visual_cues:
