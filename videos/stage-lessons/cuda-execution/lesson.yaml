  - id: precision-slots
    title: Which copy keeps the update?
    visual: >-
      Compare two stored copies on one fixed ruler near one. At the far end of the FP16 range, move
      the input one unit across the nearest-even overflow threshold, then try 70,000 in three
      formats. Bring back the small weight update beside those three results.
    beats:
      - say: >-
          The optimizer has a new value to write. Take two copies of a weight at one. The upper copy
          uses single precision, FP32. The lower one uses half precision, FP16. Subtract one
          ten-thousandth from each. The yellow mark is where we want to land. Which stored weight will
          move?
        hold: 2.6
        visual_cues:
          - id: precision-small-update
            phrase: "Subtract one ten-thousandth from each"
            targets: [candidate]
            color: yellow
            linger: 0.35
      - say: >-
          Write the candidate into both copies. Now read them back.
        hold: 1.35
        visual_cues:
          - id: precision-write
            phrase: "Write the candidate into both copies"
            targets: [stored-weights, candidate]
            color: cyan
            linger: 0.35
      - say: >-
          The upper dot moved. The FP32 copy kept almost the whole update. The FP16 copy still reads
          one. Find the next FP16 value below one. The yellow mark didn't even get halfway there, so
          rounding picked one again. BF16 has a wider gap here and loses this update too. A
          full-precision master weight can keep the change for the next step.
        hold: 0.85
        caption_starts:
          - "The FP16 copy still reads one"
        visual_cues:
          - id: precision-spacing
            phrase: "Find the next FP16 value below one"
            targets: [half-neighbors, candidate]
            color: blue
            linger: 0.35
      - say: >-
          Where do those gaps come from? Each square is a bit. Set aside one bit for the sign, then
          divide the rest between exponent and fraction. The exponent sets the range. The fraction
          sets the spacing at that scale. Look just above one this time. FP16 has ten fraction bits
          and BF16 has seven, so BF16's step there is eight times as wide. Both take two bytes.
        hold: 0.85
        visual_cues:
          - id: precision-bits
            phrase: "divide the rest between exponent and fraction"
            targets: [bit-layout, format-results]
            color: cyan
            linger: 0.35
      - say: >-
          Now look at the other end of the FP16 range. The last finite value is sixty-five thousand
          five hundred four. Put the input fifteen units past that mark. With round-to-nearest-even,
          it still rounds back to the last finite value. Move the input one unit farther. At
          sixty-five thousand five hundred twenty, we're halfway to the next power of two. The tie
          rounds up, and that power needs an exponent FP16 can't store. The result is infinity. Every
          larger positive input overflows too.
        hold: 1
        caption_starts:
          - "it still rounds back"
          - "The result is infinity"
        visual_cues:
          - id: precision-last-finite
            phrase: "Put the input fifteen units past that mark"
            targets: [range-probe]
            color: blue
            linger: 0.35
          - id: precision-overflow-tie
            phrase: "Move the input one unit farther"
            targets: [range-probe]
            color: yellow
            linger: 0.35
      - say: >-
          Store seventy thousand in each format. FP16 overflows. BF16 has the range to hold a
          nearby value. Now compare the small update beside it. Both sixteen-bit weights rounded
          back to one. Only the FP32 weight moved.
        hold: 1.4
        caption_starts:
          - "Now compare the small update"
        visual_cues:
          - id: precision-range
            phrase: "Store seventy thousand in each format"
            targets: [format-results]
            color: yellow
            linger: 0.35
          - id: precision-compare-update
            phrase: "Now compare the small update beside it"
            targets: [update-results]
            color: cyan
            linger: 0.35
  - id: large-model-budget
    title: What changes when we split the batch?
    visual: >-
      Keep a 24 GB limit fixed as the parameter and activation bars grow. For a model whose fixed
      state fits, split two tickets into two microbatches. Divide both loss sums by the full token
      count. Repeat with class weights, then ignore one target and decide whether to update.
    beats:
      - say: >-
          Now put a price on those two bytes. Your GPU has twenty-four gigabytes. Load seven billion
