version: 1
id: cuda-execution
title: When Is a CUDA Result Ready?
source: foundations/cuda-gpu-computing-for-ml/content.md
sources:
  - title: NVIDIA CUDA Programming Guide, Writing SIMT Kernels
    url: https://docs.nvidia.com/cuda/cuda-programming-guide/02-basics/writing-cuda-kernels.html
  - title: NVIDIA CUDA Programming Guide, Asynchronous Execution
    url: https://docs.nvidia.com/cuda/cuda-programming-guide/02-basics/asynchronous-execution.html
  - title: NVIDIA CUDA Best Practices Guide
    url: https://docs.nvidia.com/cuda/cuda-c-best-practices-guide/index.html
  - title: PyTorch CUDA semantics
    url: https://docs.pytorch.org/docs/stable/notes/cuda.html
  - title: PyTorch Adam
    url: https://docs.pytorch.org/docs/2.14/generated/torch.optim.Adam.html
  - title: NVIDIA nvidia-smi field definitions
    url: https://docs.nvidia.com/deploy/nvidia-smi/index.html
  - title: PyTorch AMP
    url: https://docs.pytorch.org/docs/2.15/amp.html
  - title: PyTorch floating-point type information
    url: https://docs.pytorch.org/docs/2.15/type_info.html
  - title: PyTorch CrossEntropyLoss, integer targets and mean reduction
    url: https://docs.pytorch.org/docs/2.14/generated/torch.nn.CrossEntropyLoss.html
  - title: PyTorch pinned memory and nonblocking copy contracts
    url: https://docs.pytorch.org/tutorials/intermediate/pinmem_nonblock.html
  - title: Nsight Compute Roofline and resource profiling
    url: https://docs.nvidia.com/nsight-compute/ProfilingGuide/index.html
  - title: Compute Sanitizer
    url: https://docs.nvidia.com/compute-sanitizer/ComputeSanitizer/index.html
scenes:
  - id: intro
    title: When can Python print the mean?
    visual: >-
      Start the mean on a row already on the GPU. The first call returns a CUDA tensor at two
      milliseconds. Hold the clock there, then follow the scalar read until the number reaches Python.
    beats:
      - say: >-
          Run mean on these eight GPU values. Two milliseconds later, Python has a CUDA tensor.
          Can Python print the number yet?
        hold: 2.5
        visual_cues:
          - id: start-clock
            phrase: "Run mean on these eight GPU values"
            targets: [gpu-input, mean-call]
            color: cyan
            linger: 0.25
          - id: host-return
            phrase: "Two milliseconds later"
            targets: [host-receipt]
            color: blue
            linger: 0.35
          - id: opening-prediction
            phrase: "Can Python print the number yet"
            targets: [print-value]
            color: yellow
            linger: 0.35
      - say: >-
          The next operation on the same GPU stream can use the tensor when its turn comes.
          For a Python number, call item. Watch the GPU finish the mean while Python waits.
          Now the number comes back. Two point six two five.
        hold: 1.4
        caption_starts:
          - "For a Python number"
          - "Now the number comes back"
        visual_cues:
          - id: read-call
            phrase: "For a Python number, call item"
            targets: [print-value]
            color: yellow
            linger: 0.35
          - id: stream-advances
            phrase: "Watch the GPU finish the mean while Python waits"
            targets: [event-receipt, host-receipt]
            color: cyan
            linger: 0.35
          - id: number-returns
            phrase: "Now the number comes back"
            targets: [print-value]
            color: green
            linger: 0.35
  - id: residence
    title: Where are the eight values?
    visual: >-
      Rewind to the CPU row. The eight payloads cross into a separate CUDA allocation before Python
      queues the mean.
    beats:
      - say: >-
          Rewind to the copy that put those values on the GPU. Python has the row in CPU memory. Copy
          the row into device memory and look at token six on both sides. Its value is still one. Its
          residence changes. On this discrete GPU there are now two allocations, each with the same
          eight numbers.
        hold: 0.55
        visual_cues:
          - id: copy-row
            phrase: "Copy the row into device memory"
            targets: [copy-payloads]
            color: cyan
            linger: 0.35
          - id: device-residence
            phrase: "Its residence changes"
            targets: [device-row]
            color: green
            linger: 0.35
      - say: >-
          The last line asks for the mean of the floating-point copy. Python queues device work.
          PyTorch launches a function across threads on the NVIDIA GPU. A function launched this
          way is called a CUDA kernel. Before we give this GPU the
          whole classifier, check the PyTorch build and CUDA availability where the program actually
          runs.
        hold: 0.7
        visual_cues:
          - id: queue-mean
            phrase: "Python queues device work"
            targets: [placement-code]
            color: yellow
            linger: 0.35
          - id: process-check
            phrase: "check the PyTorch build and CUDA availability"
            targets: [process-checks]
            color: blue
            linger: 0.35
  - id: stack-contract
    title: Which CUDA version did you check?
    visual: >-
      Read three fields on one host. Compare two Python environments with the same failed availability
      test. Follow physical GPU 3 into the process that sees it as cuda:0.
    beats:
      - say: >-
          Suppose the driver lists your GPU. Read the CUDA version in the driver header. That's the
          newest CUDA version the driver supports. Its name in the documentation is CUDA UMD Version.
          Ask the compiler for its version if you're building an extension or compiling from source.
          For a prebuilt package, ask PyTorch what it was built with. Those three answers can differ
          on the same machine.
        hold: 0.6
        visual_cues:
          - id: stack-driver
            phrase: "Read the CUDA version in the driver header"
            targets: [stack-contract-construction]
            color: blue
            linger: 0.35
          - id: stack-compiler
            phrase: "Ask the compiler for its version"
            targets: [stack-contract-construction]
            color: blue
            linger: 0.35
          - id: stack-build
            phrase: "ask PyTorch what it was built with"
            targets: [stack-contract-construction]
            color: blue
            linger: 0.35
      - say: >-
          Now the driver sees the GPU, but Python says CUDA is unavailable. Read the package's build
          field. None means this copy of PyTorch was built without CUDA. Try the other Python
          environment. It has a CUDA build and the same failed availability test. Here you'd check
          driver compatibility, container access and which devices this process can see.
        hold: 0.7
        caption_starts:
          - "None means"
          - "It has a CUDA build"
        visual_cues:
          - id: stack-no-build
            phrase: "Read the package's build field"
            targets: [stack-contract-construction]
            color: blue
            linger: 0.35
          - id: stack-unavailable
            phrase: "Try the other Python environment"
            targets: [stack-contract-construction]
            color: yellow
            linger: 0.35
      - say: >-
          Say the process gets just the fourth card on this host. Follow physical GPU three inside.
          The first device the process can see is called CUDA zero. Check the device name there. If a
          kernel still fails on that card, compare its compute capability with the hardware targets in
          the package and any extension. Then run the operation and check its output.
        hold: 0.7
        visual_cues:
          - id: stack-logical
            phrase: "Follow physical GPU three inside"
            targets: [stack-contract-construction]
            color: green
            linger: 0.35
  - id: ticket-step
    title: Which tensor does the loss still need?
    visual: >-
      Pool one column of the four-ticket batch. Try the loss with CPU labels, then move the labels
      across the device boundary and finish the SGD step.
    beats:
      - say: >-
          That row was one feature of one ticket. Here it is down the first column. Average the eight
          positions in each column. One ticket now has sixteen features, and there are four tickets.
          The linear layer gives each ticket three scores, called logits. Each score takes sixteen
          weights and a bias. That's fifty-one parameters for the layer.
        hold: 0.65
        visual_cues:
          - id: ticket-pool
            phrase: "Average the eight positions in each column"
            targets: [ticket-step-construction]
            color: cyan
            linger: 0.35
          - id: ticket-logits
            phrase: "Each score takes sixteen weights and a bias"
            targets: [ticket-step-construction]
            color: yellow
            linger: 0.35
      - say: >-
          These three tensors use FP32. Count four bytes for each input value, each pooled feature
          and each logit. Look at the labels below. Each of those four class numbers is an eight-byte
          integer. Together they take thirty-two bytes. Now try the loss. It needs one label for each
          row of scores. The shapes match. Which tensor would you move?
        hold: 2.2
        visual_cues:
          - id: ticket-byte-count
            phrase: "Count four bytes for each input value, each pooled feature and each logit"
            targets: [tensor-sizes]
            color: cyan
            linger: 0.35
          - id: ticket-label-bytes
            phrase: "Each of those four class numbers is an eight-byte integer"
            targets: [ticket-labels]
            color: blue
            linger: 0.35
          - id: ticket-label-failure
            phrase: "Now try the loss"
            targets: [loss-input, ticket-labels]
            color: pink
            linger: 0.35
      - say: >-
          Copy the four labels to the device holding the scores. Cross-entropy can now use each
          integer label to pick out its ticket's class. If the features had stayed on the CPU, the
          forward pass would have failed one operation earlier. A wait can't move either tensor.
        hold: 0.8
        visual_cues:
          - id: ticket-move-labels
            phrase: "Copy the four labels to the device holding the scores"
            targets: [ticket-labels, loss-input]
            color: cyan
            linger: 0.35
      - say: >-
          Run the loss, work backward, check that the loss and gradients are finite, then take one
          stochastic gradient descent step. These random features let us test the code through a weight update.
          To find out whether the classifier routes tickets correctly, we'd need real labeled
          examples. Keep the finite checks outside a throughput measurement. Reading their results in
          Python can make it wait.
        hold: 0.75
        visual_cues:
          - id: ticket-complete
            phrase: "Run the loss, work backward, check that the loss and gradients are finite, then take one stochastic gradient descent step"
            targets: [ticket-step-construction]
            color: green
            linger: 0.35
  - id: mapping
    title: Who owns token six?
    visual: >-
      Eight token identities stay in order as the row separates into two blocks. A larger launch
      leaves two workers beyond the last input.
    beats:
      - say: >-
          Let's build a small kernel for the ticket. Give each token one thread. Put four threads in a
          block, and call the set of blocks in the launch a grid. Watch token six as the row separates
          into two blocks. Which local thread owns it?
        hold: 2.1
        visual_cues:
          - id: split-blocks
            phrase: "row separates into two blocks"
            targets: [owned-tokens]
            color: cyan
            linger: 0.35
          - id: predict-owner
            phrase: "Which local thread owns it"
            targets: [owner-calculation]
            color: yellow
            linger: 0.35
      - say: >-
          Block one starts after four positions. Add local thread two and you reach position six. The
          same rule works across this one-dimensional grid. Multiply the block index by its width,
          then add the local thread index. A whole block runs on one streaming multiprocessor, where
          its threads can cooperate. Either block might run first.
        hold: 0.7
        visual_cues:
          - id: owner-base
            phrase: "Block one starts after four positions"
            targets: [owner-calculation]
            color: blue
            linger: 0.35
          - id: owner-answer
            phrase: "Add local thread two and you reach position six"
            targets: [owner-calculation, owned-tokens]
            color: yellow
            linger: 0.35
            caption_boundary: true
      - say: >-
          Give the ticket two more tokens. Now three four-thread blocks cover the row. Workers ten and
          eleven have no input address. A bounds check protects those accesses. Keep those threads in
          mind when we ask them to cooperate with the rest of their block.
        hold: 0.7
        visual_cues:
          - id: extend-launch
            phrase: "three four-thread blocks"
            targets: [owned-tokens]
            color: blue
            linger: 0.35
          - id: guard-tail
            phrase: "bounds check protects those accesses"
            targets: [guarded-workers]
            color: pink
            linger: 0.35
  - id: warps
    title: Where does a new warp start?
    visual: >-
      Pack threads into 32-lane warps without crossing block boundaries. With 36 threads, four spill
      into a second warp.
    beats:
      - say: >-
          A warp is a group of threads the GPU schedules together. Each row has thirty-two lanes,
          all for one block. Put the first four threads in the top row. Where does thread zero of
          the next block go? It starts a new warp. Each block uses four lanes in its own row.
        hold: 0.7
        visual_cues:
          - id: populate-warps
            phrase: "Put the first four threads in the top row"
            targets: [warp-membership]
            color: cyan
            linger: 0.35
          - id: next-block-warp
            phrase: "It starts a new warp"
            targets: [warp-membership]
            color: pink
            linger: 0.35
      - say: >-
          Try one block of thirty-six threads. The first thirty-two fill one warp. The remaining four
          enter the next. Threads thirty-one and thirty-two are neighbors in the block but sit on
          opposite sides of that boundary. Even in a full warp, different branches can leave some
          lanes inactive while the others execute a path.
        hold: 0.8
        visual_cues:
          - id: larger-block
            phrase: "first thirty-two fill one warp"
            targets: [warp-membership]
            color: blue
            linger: 0.35
          - id: warp-remainder
            phrase: "remaining four enter the next"
            targets: [warp-membership]
            color: yellow
            linger: 0.35
  - id: coalescing
    title: How many segments does one warp load touch?
    visual: >-
      Trace one warp load from eight logical values to their byte addresses. Change the spacing
      between words and count the aligned segments the load touches in each layout.
    beats:
      - say: >-
          Take eight active lanes in one warp on a GPU with compute capability six or newer. In one
          load instruction they read eight consecutive four-byte words. Start the first word on a
          thirty-two-byte boundary. Follow the addresses from zero to twenty-eight. They fit in a
          single segment. That's coalescing. Suppose we lay out the same values thirty-two words
          apart. Predict the footprint.
        hold: 2.2
        visual_cues:
          - id: collect-adjacent
            phrase: "Follow the addresses from zero to twenty-eight"
            targets: [memory-routes, segment-receipt]
            color: cyan
            linger: 0.35
          - id: predict-segments
            phrase: "Predict the footprint"
            targets: [segment-receipt]
            color: yellow
            linger: 0.35
      - say: >-
          Spread the same eight values down a column. Lane zero still reads byte zero. Lane one used
          to read byte four. Now it reads byte one hundred twenty-eight, a stride of one hundred
          twenty-eight bytes from lane zero. Each lane now touches its own segment. The lanes use
          thirty-two bytes across two hundred fifty-six bytes of segments. Caches affect how much
          traffic goes farther.
        hold: 0.7
        caption_starts:
          - "Each lane now touches its own segment"
        visual_cues:
          - id: fan-segments
            phrase: "Spread the same eight values down a column"
            targets: [memory-routes, segment-receipt]
            color: pink
            linger: 0.35
      - say: >-
          Restore adjacent requests and the routes converge. A kernel that needs a column can first
          load convenient rows into a tile, then read the column locally. The useful values survive
          the rearrangement. Now check the addresses inside the tile.
        hold: 0.7
        visual_cues:
          - id: restore-segments
            phrase: "Restore adjacent requests and the routes converge"
            targets: [memory-routes, segment-receipt]
            color: cyan
            linger: 0.35
  - id: banks
    title: Which requests can a bank serve together?
    visual: >-
      Route distinct words to one bank, then pad the tile. Replay the fan-in with eight requests for
      exactly the same word.
    beats:
      - say: >-
          Shared memory is split into banks. In the standard layout here, successive four-byte words
          go to successive banks, then wrap at thirty-two. Send these different words to bank zero.
          Every lane wants a different address from that one bank, so it takes turns serving them.
          What would one extra column do to the routes?
        hold: 2
        visual_cues:
          - id: bank-conflict
            phrase: "Send these different words to bank zero"
            targets: [bank-routes, bank-receipt]
            color: yellow
            linger: 0.35
      - say: >-
          Add one padding column to each row. The stride is now thirty-three words. Move each request
          to its new bank. The lanes still read the same logical column, but now different banks can
          serve them together. Suppose instead that all eight lanes read exactly the same word.
        hold: 1.4
        caption_starts:
          - "but now different banks can serve them together"
        visual_cues:
          - id: pad-banks
            phrase: "Move each request to its new bank"
            targets: [bank-routes, bank-receipt]
            color: cyan
            linger: 0.35
      - say: >-
          Trace eight requests for word zero. They meet at a single address. Those requests can
          broadcast one value to every lane. That's why we counted different words inside each bank.
          The number of arrows pointing at the bank alone couldn't distinguish the two cases.
        hold: 0.8
        visual_cues:
          - id: broadcast-word
            phrase: "Trace eight requests for word zero"
            targets: [bank-routes, bank-receipt]
            color: yellow
            linger: 0.35
  - id: storage-scope
    title: Which addresses share the work?
    visual: >-
      Load four words into a block tile. Use a new eight-word tile to trace word seven to its bank.
      Slide a full warp of reads across global segments, then group distinct shared words by bank.
    beats:
      - say: >-
          Here's the original feature row again, in device global memory where all the streaming
          multiprocessors can reach it. Load the first four words into a tile. Threads in this block
          share that copy. A single thread can keep its running sum in registers. The hardware manages
          the caches. Moving the tensor to CUDA gave the kernel a global allocation. The kernel
          chooses which words to bring closer.
        hold: 0.75
        visual_cues:
          - id: storage-working-set
            phrase: "Load the first four words into a tile"
            targets: [storage-scope-construction]
            color: cyan
            linger: 0.35
      - say: >-
          Follow lane seven in the global row, starting the row at byte zero. Each word is four bytes
          wide, so word seven starts at byte twenty-eight. Divide the byte address by thirty-two and
          round down. That's segment zero. Now load all eight words into a new shared tile, with word
          zero in bank zero. To find the bank for word seven, take the word index modulo thirty-two.
          Seven modulo thirty-two is seven. Lane seven reads bank seven.
        hold: 0.7
        visual_cues:
          - id: storage-segment
            phrase: "Divide the byte address by thirty-two and round down"
            targets: [storage-scope-construction]
            color: blue
            linger: 0.35
          - id: storage-eight-words
            phrase: "load all eight words into a new shared tile"
            targets: [storage-eight-word-tile]
            color: cyan
            linger: 0.25
          - id: storage-bank
            phrase: "Seven modulo thirty-two is seven"
            targets: [storage-eight-word-tile]
            color: yellow
            linger: 0.35
      - say: >-
          Try a full warp. Each of the thirty-two lanes reads one consecutive word. Starting at byte
          zero, those words fill four segments. Keep all the lanes together and start the row at byte
          twenty-eight instead. Before we slide it, how many segments will the warp touch?
        hold: 2.4
        visual_cues:
          - id: storage-stride
            phrase: "how many segments will the warp touch"
            targets: [global-window]
            color: cyan
            linger: 0.35
      - say: >-
          Slide the window seven words to the right. Now the first segment supplies only its last
          word, and the row spills into a fifth segment. The lanes still use a hundred twenty-eight
          bytes. The segments cover a hundred sixty. A cache hit can change how many bytes actually
          travel to device memory.
        hold: 0.85
        caption_starts:
          - "a fifth segment"
        visual_cues:
          - id: storage-offset
            phrase: "Slide the window seven words to the right"
            targets: [global-window]
            color: yellow
            linger: 0.35
      - say: >-
          Try one more column in shared memory, this time with a stride of thirty-four words. Send the
          lanes to their banks in order. Each jump advances two banks after wrapping around. Lane
          sixteen comes back to bank zero carrying a different word from lane zero. The even banks
          each have two distinct words to serve, and the odd banks are empty. That's a two-way
          conflict.
        hold: 0.85
        visual_cues:
          - id: storage-bank-pairs
            phrase: "Send the lanes to their banks in order"
            targets: [bank-stacks]
            color: yellow
            linger: 0.35
  - id: barrier
    title: Can thread zero trust the sum?
    visual: >-
      Show four stores and the instant thread zero tries to read. Leave the unsynchronized result
      unknown. Replay with every thread at the block barrier before revealing the four readable
      values.
    beats:
      - say: >-
          Come back to the first four tokens. The threads publish their shared slots at different
          times. Let thread zero read early. The pink mark is its read. Look at the writes still in
          flight. What can that thread count on when it adds the four slots?
        hold: 2.3
        visual_cues:
          - id: early-writes
            phrase: "publish their shared slots at different times"
            targets: [shared-writes]
            color: blue
            linger: 0.35
          - id: early-reader
            phrase: "Let thread zero read early"
            targets: [reader-result]
            color: pink
            linger: 0.35
      - say: >-
          There's no defined sum. Thread zero's reads race with the other threads' writes, even
          inside one warp. The question mark means the result is unreliable. A run might even print
          the right number. Replay those same writes. Each thread publishes its value and reaches the
          block barrier. Once all four arrive, let the reader through. Now it can safely add the four
          values.
        hold: 0.9
        visual_cues:
          - id: barrier-replay
            phrase: "Replay those same writes"
            targets: [shared-writes]
            color: blue
            linger: 0.35
          - id: barrier-publish
            phrase: "Each thread publishes its value and reaches the block barrier"
            targets: [shared-writes, barrier-arrivals]
            color: cyan
            linger: 0.35
          - id: barrier-read
            phrase: "let the reader through"
            targets: [reader-result]
            color: green
            linger: 0.35
      - say: >-
          The second block produces its own subtotal. Its threads have their own shared memory and
          their own barrier. Put a second kernel after the first in the same stream. It reads both
          completed outputs, adds them, and divides by eight. The average now has an address on the
          GPU. How soon can Python put it in the log?
        hold: 1.1
        visual_cues:
          - id: second-subtotal
            phrase: "second block produces its own subtotal"
            targets: [block-subtotals]
            color: cyan
            linger: 0.35
          - id: join-subtotals
            phrase: "reads both completed outputs, adds them"
            targets: [block-subtotals, device-pooled]
            color: blue
            linger: 0.35
          - id: pool-device
            phrase: "divides by eight"
            targets: [device-pooled]
            color: green
            linger: 0.35
  - id: clocks
    title: Which clock can we stop?
    visual: >-
      Replay ticket 102 on the opening clock. The submission stays fixed while the stream and host
      reach their distinct endpoints. A separate warmup run supplies two completed samples.
    beats:
      - say: >-
          Here's the opening run again. Python finishes queueing at two milliseconds. The GPU
          continues along the lower track. We could queue the next layer on that stream right now. Its
          place in line keeps it behind the mean.
        hold: 0.7
        visual_cues:
          - id: advance-enqueue
            phrase: "finishes queueing at two milliseconds"
            targets: [host-receipt]
            color: blue
            linger: 0.35
          - id: continue-device
            phrase: "The GPU continues along the lower track"
            targets: [event-receipt, host-receipt]
            color: cyan
            linger: 0.35
      - say: >-
          Suppose Python asked for the number as soon as the call returned. Let the device finish. The
          two dots on the stream are CUDA events. Forty milliseconds passed between them. Now read the
          scalar. The host clock includes submitting, waiting and getting the number back. That's
          forty-two milliseconds from its own start.
        hold: 0.9
        caption_starts:
          - "Forty milliseconds"
          - "That's forty-two milliseconds"
        visual_cues:
          - id: finish-device
            phrase: "Let the device finish"
            targets: [event-receipt]
            color: cyan
            linger: 0.35
          - id: report-scalar
            phrase: "Now read the scalar"
            targets: [host-scalar, host-receipt]
            color: green
            linger: 0.35
      - say: >-
          Here's a fresh series of calls. For a steady-state timing, exclude the setup-heavy first
          call. Count only completed warmed samples in the mean. Both samples take eight milliseconds
          here. Use representative shapes on the actual machine, and keep the warmup and the
          measurement boundaries the same when you compare runs.
        hold: 0.7
        visual_cues:
          - id: warmup-complete
            phrase: "exclude the setup-heavy first call"
            targets: [warmup-trace]
            color: blue
            linger: 0.35
          - id: warmed-samples
            phrase: "Count only completed warmed samples in the mean"
            targets: [warmup-trace, warmed-mean]
            color: cyan
            linger: 0.35
  - id: budget
    title: What stays in memory for one Adam weight?
    visual: >-
      Build the parameter-state budget from a weight, its gradient and two Adam moments. Scale the
      same accounting to a billion parameters.
    beats:
      - say: >-
          We got one feature out of the device. What would the GPU have to hold to train the
          classifier? Follow one full-precision Adam parameter. Four bytes for its weight, four for
          its gradient, and eight for two moments. Adam keeps a running average of gradients and
          another of squared gradients. When all four values are present, they've used sixteen bytes
          for one parameter.
        hold: 0.7
        visual_cues:
          - id: weight-bytes
            phrase: "Four bytes for its weight"
            targets: [parameter-budget]
            color: blue
            linger: 0.35
          - id: gradient-bytes
            phrase: "four for its gradient"
            targets: [parameter-budget]
            color: cyan
