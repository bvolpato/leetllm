    beats:
      - say: Our successful seeds covered three visible areas. Put two seeds on the billing pair and the third at one
          hundred, one hundred instead. The same nearest-center rule assigns one point to the first seed, five
          to the second and none to the third. There is no arithmetic mean for an empty group. The article's
          teaching loop raises rather than propagating a not-a-number center.
        hold: 0.5
        visual_cues:
