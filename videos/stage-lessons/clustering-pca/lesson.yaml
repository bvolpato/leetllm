  - id: metric-choice
    title: Which arrow points closer to the query?
    visual: The raw dot products compare two support documents with a unit query. Normalize both arrows, then magnify them on the same scale to inspect their angles. Compare the resulting cosine scores.
    beats:
      - say: The yellow query points straight to the right. One document is about a duplicate charge. The other is a much longer arrow for a release page. The dot product multiplies matching coordinates and adds them. Here it reads off each arrow's horizontal reach. The release page wins eight to one.
        hold: 0.6
        visual_cues:
          - {id: dot, phrase: "each arrow's horizontal reach", targets: [picture]}
      - say: Now compare directions. Check for zero length or nonfinite coordinates before normalizing. Divide each arrow by its length. Both documents now have unit length, and the query already did. Their dot products in this view are their cosines. Which document points closer to the query?
        hold: 1.7
        visual_cues:
          - {id: invalid, phrase: "Check for zero length", targets: [picture]}
          - {id: cosine, phrase: "Divide each arrow by its length", targets: [picture]}
          - {id: ask, phrase: "Which document points closer to the query", targets: [picture]}
      - say: The duplicate-charge document wins. For unit vectors, squared Euclidean distance is two minus twice the dot product. As cosine rises, distance falls, so the rankings agree. Use the same metric and normalization for index construction, query routing and evaluation. Mixing in raw metadata changes the vectors that comparison uses.
        hold: 0.6
        visual_cues:
          - {id: winner, phrase: "The duplicate-charge document wins", caption_boundary: true, targets: [picture]}
          - {id: identity, phrase: "squared Euclidean distance is two minus twice the dot product", targets: [picture]}
