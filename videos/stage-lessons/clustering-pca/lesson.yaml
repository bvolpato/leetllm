  - id: pca
    title: Find a direction that keeps the cloud wide
    visual: The original cloud translates by its computed mean, a candidate axis rotates with actual projections
      and energy, and one named point gains a scalar score.
    beats:
      - say: Return to our six message vectors. Principal component analysis gives the cloud fewer continuous
          coordinates. First subtract the same coordinate-wise mean from every point. The cloud moves together
          around zero; distances between its points stay unchanged.
        hold: 0.65
        visual_cues:
          - id: center
            phrase: First subtract the same coordinate-wise mean
            targets:
              - picture
      - say: Pass a line through this centered cloud. Project each point onto it at a right angle. Rotate the line and
          compare the sum of squared scores. The first principal component chooses a unit direction with the
          largest total. Our almost-horizontal direction keeps the widest spread.
        hold: 0.65
        visual_cues:
          - id: project
            phrase: Project each point onto it at a right angle
            targets:
              - picture
          - id: rotate
            phrase: Rotate the line and compare the sum of squared scores
            targets:
              - picture
          - id: best
            phrase: Our almost-horizontal direction keeps the widest spread
            targets:
              - picture
      - say: For point C, take the dot product with that unit direction. Its scalar score locates the foot on the
          line. A covariance eigendecomposition or a singular-value decomposition finds these directions.
          Reversing the direction flips every score while preserving the represented line.
        hold: 0.65
        visual_cues:
          - id: score
            phrase: Its scalar score locates the foot on the line
            targets:
