  - id: spherical-centers
    title: Which center gets the query?
    visual: Two unit input arrows average to a shorter center. Separate declared groups create C0[.1,0] and
      unitC1[.8,.6], changing Euclidean versus cosine routing. Normalize an actual sum for spherical update;
      opposite inputs yield zero and explicit fallback.
    beats:
      - say: Both arrows have length one. One points right and the other points up. Their mean lands halfway
          between the tips, inside the unit circle. Its length is about zero point seven. Euclidean k-means
          uses that mean as the center. A query's distance to it depends on the center's length as well as its direction.
        hold: 0.5
        visual_cues:
          - id: mean
            phrase: Their mean lands halfway between the tips
            targets:
              - picture
          - id: norm
            phrase: Its length is about zero point seven
            targets:
              - picture
      - say: Try two group means with the yellow query. Start at the tip of the query arrow.
          The shorter trip is to center one. Now look from the origin. Center zero points in exactly
          the same direction as the query, so cosine picks center zero. If we file messages by distance
          and choose a list by direction, we can open a different list.
        hold: 0.5
        visual_cues:
          - id: groups
            phrase: Try two group means
            targets:
              - picture
          - id: euclidean
            phrase: Start at the tip of the query arrow
            targets:
              - picture
          - {id: near, phrase: "The shorter trip is to center one", targets: [picture]}
          - id: cosine
            phrase: Now look from the origin
            targets:
              - picture
          - {id: aligned, phrase: "so cosine picks center zero", targets: [picture]}
      - say: Spherical k-means uses unit centers. Normalize each nonzero input and assign it to the center
          with the largest dot product. Add the arrows in the group. Divide their sum by its length and the
          new center lands on the unit circle. Now point the arrows in opposite directions. They cancel.
          A zero sum has no direction, and an empty group has no arrows to average. In either case we need a
          fallback, such as choosing a new seed.
        hold: 0.5
        visual_cues:
          - id: normalize
            phrase: Add the arrows in the group
            targets:
              - picture
          - {id: unit, phrase: "Divide their sum by its length", targets: [picture]}
          - id: zero
            phrase: Now point the arrows in opposite directions
            targets:
              - picture
          - {id: fallback, phrase: "such as choosing a new seed", targets: [picture]}
