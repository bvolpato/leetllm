  - id: kmeans
    title: Assign points, then move their centers
    visual: Neutral points attach one at a time to fixed seeds, one coordinate mean is derived, then centers move
      with live squared-error totals.
    beats:
      - say: K-means asks for a number of groups. Choose three centers here, with one seed in each visible area. Hold
          them still. Compare each point with the centers and connect it to the nearest one. The colors now
          record assignments, rather than supplied topic labels.
        hold: 0.65
        visual_cues:
          - id: seed
            phrase: Choose three centers here
            targets:
              - picture
          - id: assign
            phrase: connect it to the nearest one
            targets:
              - picture
      - say: Keep those memberships fixed. Where should the left center move? Average its two horizontal coordinates,
          then its two vertical coordinates. That midpoint minimizes the sum of squared distances to these
          members. Move all three centers to their own means and watch the objective fall.
        hold: 0.65
        visual_cues:
          - id: predict
            phrase: Where should the left center move
            targets:
              - picture
          - id: meanx
            phrase: Average its two horizontal coordinates
            targets:
              - picture
          - id: meany
            phrase: then its two vertical coordinates
            targets:
              - picture
          - id: update
            phrase: Move all three centers to their own means
            targets:
              - picture
      - say: Assign again around the new centers. The same pairs remain, so this run has settled. Lloyd's algorithm
          alternates these two steps. Exact assignments and means preserve or reduce inertia. Different seeds
          can find different solutions; compare restarts, and repair an empty group before averaging it.
        hold: 0.65
        visual_cues:
          - id: again
            phrase: Assign again around the new centers
            targets:
              - picture
          - id: settled
            phrase: The same pairs remain
            targets:
              - picture
          - id: restarts
            phrase: Different seeds can find different solutions
            targets:
              - picture
