  - id: silhouette-ledger
    title: What does the fourth center buy?
    visual: Actual pointA within/other-cluster distances construct a,b and normalized silhouette. Collect all six
      actual scores, show singleton zeros for k4, then compare full means and inertia under stable partition
      IDs.
    beats:
      - say: Start at A. Average its distances to the other members of its own group to get a. Here, that's one
          link to B. For each other group, average the distances from A to its members. The smallest of
          those averages is b. Subtract a from b and divide by the larger of a and b. That's A's silhouette.
        hold: 0.5
