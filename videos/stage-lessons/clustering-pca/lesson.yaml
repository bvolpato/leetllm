  - id: seeding-mass
    title: Where does the next seed land?
    visual: The six messages share a probability strip. The distance from A to B buys a sliver. The longer reach to F buys a much larger interval. Place a supplied draw on the strip, then rebuild it after F becomes a seed.
    beats:
      - say: Start this run with A. In the original k-means-plus-plus rule, every message had the same chance to be the first seed. The next seed is a different draw. Look at the short link to B, then the long link to F. Square those distances. A long link buys more room on this strip.
        hold: 0.5
        visual_cues:
          - {id: first, phrase: "Start this run with A", targets: [picture]}
          - {id: small, phrase: "the short link to B", targets: [picture]}
          - {id: large, phrase: "the long link to F", targets: [picture]}
          - {id: weights, phrase: "Square those distances", targets: [picture]}
      - say: Add the squared distances for all six messages. Divide each one by that total to get its share. A gets zero. B gets less than half of one percent. E and F together take up more than seventy-two percent. Put a supplied draw of zero point eight on the strip. Which interval contains it?
        hold: 2.0
        visual_cues:
          - {id: normalize, phrase: "Divide each one by that total", targets: [picture]}
          - {id: draw, phrase: "a supplied draw of zero point eight", targets: [picture]}
          - {id: predict, phrase: "Which interval contains it", targets: [picture]}
      - say: F gets the seed. Watch E now. Measure to the nearer of A and F. E is close to F, so its share shrinks on the next draw. F's share falls to zero. If every point sits on a selected seed, the total is zero. We've run out of distinct locations.
        hold: 0.65
        visual_cues:
          - {id: selected, phrase: "F gets the seed", caption_boundary: true, targets: [picture]}
          - {id: recompute, phrase: "Measure to the nearer of A and F", targets: [picture]}
          - {id: zero, phrase: "the total is zero", targets: [picture]}
      - say: For this single-candidate rule, the theorem bounds the expected starting inertia by eight times the quantity natural log k plus two, times the best possible inertia. That's an average over random starts. An individual run can still settle at a poor solution. The scikit-learn version in the article tries several candidates at each draw. Its automatic setting makes one run with k-means-plus-plus. Set the restart count explicitly if you want several.
        hold: 0.65
        visual_cues:
          - {id: bound, phrase: "bounds the expected starting inertia", targets: [picture]}
          - {id: greedy, phrase: "tries several candidates at each draw", targets: [picture]}
