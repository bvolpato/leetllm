  - id: solver-contract
    title: "How much spread runs along each axis?"
    visual: "Six centered rows supply two principal directions. Squared singular values give two lengths of squared spread. Partition each length into five equal pieces to read sample variance. Compare the storage shapes for a second matrix."
    beats:
      - say: "Look along the two perpendicular axes of our six centered messages. Along each axis, square the six scores and add them. The lengths of these strips show how much squared spread each axis carries."
        hold: 0.6
        visual_cues:
          - id: energy
            phrase: "The lengths of these strips"
            targets: [picture]
      - say: "There are two ways to get those lengths. Direct singular value decomposition, or SVD, works on the centered rows. Its right singular vectors give the axes. Square the singular value for each axis and you get the length of its strip."
        hold: 0.5
        visual_cues:
          - id: svd
            phrase: "Direct singular value decomposition"
            targets: [picture]
          - id: square
            phrase: "Square the singular value for each axis"
            targets: [picture]
      - say: "For sample variance, the divisor is the number of rows minus one. We subtracted the mean, so the six deviations along each axis sum to zero. Once you know five, the sixth is fixed. How many equal pieces should we cut each strip into?"
        hold: 1.8
        visual_cues:
          - id: predict
            phrase: "How many equal pieces should we cut each strip into"
            targets: [picture]
      - say: "Five pieces. Take one piece from each strip. Those are the two sample variances. You get the same pair by forming the sample covariance matrix and finding its eigenvalues. Its eigenvectors give the principal axes."
        hold: 0.65
        visual_cues:
          - id: split
            phrase: "Five pieces"
            caption_boundary: true
            targets: [picture]
          - id: piece
            phrase: "Take one piece from each strip"
            targets: [picture]
          - id: cov
            phrase: "forming the sample covariance matrix"
            targets: [picture]
      - say: "Both strips used the same divisor. The first still accounts for about eighty-five percent of their combined length. That's its explained variance ratio. If every row is identical, both lengths are zero and the ratio is undefined."
        hold: 0.65
        visual_cues:
          - id: share
            phrase: "about eighty-five percent of their combined length"
            targets: [picture]
          - id: zero
            phrase: "both lengths are zero and the ratio is undefined"
            targets: [picture]
      - say: "Now suppose we have a hundred documents with fifteen hundred thirty-six features each. The centered input is this thin rectangle. To form covariance, we need a square with one row and one column per feature. Its rank is at most ninety-nine. Its ordinary condition number is infinite."
        hold: 0.6
        visual_cues:
          - id: wide
            phrase: "The centered input is this thin rectangle"
            targets: [picture]
          - id: gram
            phrase: "we need a square"
