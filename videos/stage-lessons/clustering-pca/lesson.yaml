          - id: score
            phrase: Subtract a from b and divide by the larger
            targets:
              - picture
      - say: A singleton gets silhouette zero by the convention used here, and the score is also zero when both
          distances vanish. Mean silhouette requires at least two and fewer than n nonempty groups. Collect
          all six point contributions before taking their arithmetic average. Our tested two-, three- and
          four-group partitions give about zero point five six, zero point seven six and zero point five one.
        hold: 0.5
        visual_cues:
