      covariance/sample-divisor units separate.
    beats:
      - say: For a unit principal direction, the squared length of a centered point equals its squared scalar score
          plus its squared perpendicular residual. The two contributions add because the projection and
          residual are orthogonal. Summing over points keeps total centered energy fixed. Maximizing retained
          squared scores therefore minimizes the discarded squared error.
