scenes:
  - id: intro
    title: "Which past message will the circle reach first?"
    visual: "A distance ring grows from a customer's chat bubble. The two nearest messages sit at their relative positions. A magnified ruler shows the last part of the race, then the view widens to all six messages."
    beats:
      - say: "“Why was I charged twice?” The circle grows from that request toward the two closest messages."
        hold: 0.5
      - say: "Look at the last stretch on the ruler. The yellow dot tracks the radius. Which message will the circle touch first?"
        hold: 2.2
        visual_cues:
          - id: ruler
            phrase: "Look at the last stretch on the ruler"
            targets: [picture]
          - id: predict
            phrase: "Which message will the circle touch first"
            targets: [picture]
      - say: "B, the duplicate payment. The reset link is about seven hundredths of a unit farther away. Here's the full map. Each message has two coordinates. Searching all six gives us B. We'll try two shortcuts on this request. PCA gives each message fewer coordinates. Clustering lets us search one group at a time."
        hold: 0.7
        visual_cues:
          - id: answer
            phrase: "B, the duplicate payment"
            caption_boundary: true
            targets: [picture]
          - id: all
            phrase: "Here's the full map"
            targets: [picture]
