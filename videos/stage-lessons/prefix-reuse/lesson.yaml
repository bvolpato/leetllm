version: 1
id: prefix-reuse
title: Reusing the Beginning of a Conversation
source: fundamentals/prefix-caching-prompt-caching/content.md
voice: en-US-AndrewNeural
rate: +0%
sources:
  - title: vLLM automatic prefix caching design
    url: https://docs.vllm.ai/en/latest/design/prefix_caching/
  - title: SGLang and RadixAttention
    url: https://arxiv.org/abs/2312.07104
  - title: OpenAI prompt caching contract
    url: https://developers.openai.com/api/docs/guides/prompt-caching
  - title: OpenAI prompt cache diagnostics
    url: https://developers.openai.com/api/docs/guides/prompt-caching/diagnostics
  - title: Claude prompt caching contract
    url: https://platform.claude.com/docs/en/build-with-claude/prompt-caching
  - title: Mooncake KVCache-centric scheduling
    url: https://arxiv.org/abs/2407.00079
  - title: Consistent Hashing with Bounded Loads
    url: https://arxiv.org/abs/1608.01350
scenes:
  - id: intro
    title: Does the guide need a second pass?
    visual: >-
      Squares travel from the folded repository guide into the worker's cache. Each square represents
      500 guide positions. The login question arrives below the filled strip and reuses its state.
    beats:
      - say: >-
          This question about a failed test comes with a six-thousand-token repository guide.
          Follow one square into the worker. It stands for five hundred guide tokens.
          As the worker processes those tokens, each attention layer saves their keys and values.
          This first pass over the input is called prefill.
        caption_starts:
          - "Follow one square into the worker."
          - "As the worker processes those tokens"
          - "This first pass"
        hold: 0.65
        visual_cues:
          - { id: store-guide, phrase: "saves their keys and values", targets: [picture] }
          - { id: entry-ready, phrase: "is called prefill", targets: [picture] }
      - say: >-
          Which tests cover login? The team sends the guide back to the worker that cached it.
          The new question adds thirty-seven tokens. How many input tokens need fresh prefill?
        caption_starts:
          - "How many input tokens"
        hold: 2.2
        visual_cues:
          - { id: second-request, phrase: "Which tests cover login", targets: [picture] }
          - { id: new-tail, phrase: "adds thirty-seven tokens", targets: [picture] }
          - { id: predict-prefill, phrase: "How many input tokens", targets: [picture] }
      - say: >-
          Just the thirty-seven question tokens. They can attend to all six thousand guide positions using
          the keys and values that the first request left behind. Carrying that state from one request to
          the next is prefix caching.
        caption_starts:
          - "They can attend"
          - "Carrying that state"
        hold: 0.6
        visual_cues:
          - { id: fresh-tail, phrase: "Just the thirty-seven question tokens", targets: [picture], caption_boundary: true }
          - { id: read-guide, phrase: "using the keys and values", targets: [picture] }
      - say: >-
          The assistant generates its own answer to the login question. That adds sixty-four output tokens.
          What happens to the saved state if we change one word in the guide?
        caption_starts:
          - "What happens to the saved state"
        hold: 0.7
        visual_cues:
          - { id: generate-answer, phrase: "generates its own answer", targets: [picture] }
          - { id: output-count, phrase: "sixty-four output tokens", targets: [picture], caption_boundary: true }
  - id: causal-keys
    title: Each block inherits its history
    visual: Actual SHA-256 chained keys connect three named blocks. Editing the guide changes its key
      and the unchanged tools block's descendant key while preserving the system key.
    beats:
      - say: >
          Consider three blocks: instructions, a guide, and a tool description. In causal attention,
          later positions can depend on everything before them. A useful cache identity therefore
          includes both the current block and a key representing its preceding history. Follow the
          chain from left to right.
        hold: 0.65
        visual_cues:
          - id: history-chain
            phrase: "both the current block and a key representing its preceding history"
            targets:
              - causal-keys-readout-2
            color: blue
          - id: chained-hash
            phrase: "chain from left to right"
            targets:
              - causal-keys-equation
            color: yellow
      - say: >
          Now change the guide version. The instruction block keeps the same key. The guide receives
          a different key, and that change flows into the tools block. Its visible text stayed
          fixed, yet the context that produced its deeper attention state has changed.
        hold: 0.7
        visual_cues:
          - id: edit-guide
            phrase: "change the guide version"
            targets:
              - causal-keys-readout-2
            color: pink
          - id: instruction-survives
            phrase: "The instruction block keeps the same key"
            targets:
              - picture
          - id: guide-digest
            phrase: "receives a different key"
            targets:
              - picture
          - id: propagated-key
            phrase: "change flows into the tools block"
            targets:
              - causal-keys-readout-3
            color: pink
      - say: >
          The hash combines each block with its parent key. That's how the tools block remembers which
          guide came before it. The cache namespace also identifies the model, adapter, positions and
          other inputs that shape attention. Switching adapters can change the keys and values even
          when every token stays the same.
        hold: 0.55
        visual_cues:
          - id: actual-digest
            phrase: "The hash combines each block with its parent key"
            targets:
              - causal-keys-readout-3
            color: yellow
          - id: computation-contract
            phrase: "The cache namespace"
            targets:
              - causal-keys-equation
            color: blue
  - id: radix-split
    title: Split the history without losing its identity
    visual: One concrete token edge splits at the actual divergence. A bracketed 6005-position match is
      rounded only for the separate sixteen-token block cache.
    beats:
      - say: "Keep the original chain beside a second index. A stored edge contains token IDs eleven,
          twelve, thirteen, fourteen. A new request begins eleven, twelve, ninety-nine. Compare from
          the root: two tokens match. Split the edge after twelve. Both branches retain the shared
          ancestor; their different suffixes acquire separate state."
        hold: 0.7
        visual_cues:
          - id: radix-match
            phrase: "two tokens match"
            targets:
              - radix-match-mark
            color: cyan
            linger: 0.55
          - id: radix-branch
            phrase: "Split the edge after twelve"
            targets:
              - radix-split-geometry
            color: cyan
            linger: 0.55
          - id: radix-query
            phrase: "A new request begins eleven, twelve, ninety-nine"
            targets:
              - picture
      - say: "This is a compressed radix tree: an edge can hold several token IDs, and a divergence creates
          a branch inside that edge. The original SGLang paper retains prompt and generated state,
          searches the longest shared prefix, and protects running paths with reference counts. Its
          least-recently-used eviction removes eligible leaves before their shared ancestors."
        hold: 0.7
        visual_cues:
          - id: radix-protect
            phrase: "protects running paths"
            targets:
              - radix-protect-mark
            color: cyan
            linger: 0.55
          - id: radix-evict
            phrase: "eviction removes eligible leaves"
            targets:
              - radix-evict-mark
            color: cyan
            linger: 0.55
      - say: Compare a larger match of six thousand and five tokens. A tree that indexes individual tokens
          can branch right there. A full-block cache with sixteen tokens per block reuses six
          thousand. Divide the common-prefix length by the block size, discard the fraction, then
          multiply by block size. Five shared tokens remain outside its reusable boundary. The index
          and backend decide which boundaries actually exist.
        hold: 0.7
        visual_cues:
          - id: radix-scale
            phrase: "larger match of six thousand and five tokens"
            targets:
              - radix-scale-mark
            color: cyan
            linger: 0.55
          - id: radix-round
            phrase: "reuses six thousand"
            targets:
              - radix-round-mark
            color: cyan
            linger: 0.55
          - id: radix-remainder
            phrase: "Five shared tokens remain outside its reusable boundary"
            targets:
              - radix-round-mark
            color: cyan
            linger: 0.55
  - id: block-boundaries
    title: Reuse stops at an eligible boundary
    visual: Two literal token-ID rows share nine positions. A four-token block fixture reuses eight,
      then an early token edit removes the first block and all downstream hits.
    beats:
      - say: >
          Our small block cache stores four tokens per block. These two requests share their first
          nine token IDs. Look at the stored row, then at the incoming row. Which matching token
          will still need fresh computation?
        caption_starts:
          - "Which matching token"
        visual_cues:
          - id: four-token-block
            phrase: four tokens per block
            targets:
              - block-boundaries-readout-2
            color: blue
        hold: 1.8
      - say: >
          The ninth token matches, but its block does not. Two complete blocks account for eight
          reusable positions. The highlighted prefix ends after the second block. The remaining
          input takes the fresh path. A compressed token trie can split at a divergence. This
          cache can reuse only entire blocks.
        caption_starts:
          - "Two complete blocks account for eight reusable positions."
        visual_cues:
          - id: ninth-match
            phrase: The ninth token matches, but its block does not
            targets:
              - block-boundaries-readout-2
            color: yellow
          - id: complete-boundaries
            phrase: Two complete blocks account for eight reusable positions
            targets:
              - block-boundaries-readout-5
            color: green
          - id: matched-boundary
            phrase: highlighted prefix ends after the second block
            targets:
              - block-boundaries-readout-2
            color: green
          - id: fresh-input
            phrase: remaining input takes the fresh path
            targets:
              - block-boundaries-readout-2
            color: yellow
        hold: 0.65
      - say: >
          Edit the third token and compare again. The first complete block now differs, so the old
          chain offers no reusable starting block. Even matching words later in the row inherit the
          changed history. Exact token identity and the boundary together determine this lookup
          result.
        visual_cues:
          - id: early-edit
            phrase: Edit the third token
            targets:
              - block-boundaries-readout-2
            color: pink
          - id: miss-chain
            phrase: no reusable starting block
            targets:
              - block-boundaries-readout-5
            color: pink
        hold: 0.65
  - id: prompt-order
    title: Put stable context before changing detail
    visual: The same named sections move between a changing-ID-first layout and a stable-first layout. A
      longest-prefix comparison computes zero versus three matching section units.
    beats:
      - say: >
          Read the two prompts from left to right. Each box is one section. The top request starts
          with ID A. The bottom one starts with ID B. How many sections match before the first difference?
        caption_starts:
          - "The top request starts"
          - "How many sections match"
        visual_cues:
          - id: variable-first
            phrase: The top request starts with ID A
            targets:
              - prompt-order-readout-4
            color: pink
        hold: 2
      - say: >
          Zero. The IDs differ in the very first box. Move the IDs to the end of both prompts.
          Now the instructions, guide and tools share their starting history. Three sections match.
          Only the IDs change between requests. Keep each message in its proper role when you
          arrange the shared material first.
        caption_starts:
          - "The IDs differ"
          - "Move the IDs"
          - "Three sections match."
        visual_cues:
          - { id: immediate-divergence, phrase: "Zero", targets: [picture], caption_boundary: true }
          - id: stable-first
            phrase: Move the IDs to the end of both prompts
            targets:
              - prompt-order-readout-3
            color: blue
          - id: shared-history
            phrase: "Three sections match"
            targets:
              - picture
          - id: retained-identities
            phrase: Only the IDs change between requests
            targets:
              - prompt-order-readout-4
            color: pink
        hold: 0.7
      - say: >
          Deterministic rendering matters here. A timestamp, changed line ending, or reordered JSON
          field can change token IDs. Inspect the request that actually reached the model. A
          template file and a similar-looking sentence give weaker evidence than the final
          serialized token sequence.
        visual_cues:
          - id: serialized-order
            phrase: timestamp, changed line ending, or reordered JSON field
            targets:
              - prompt-order-readout-4
            color: yellow
          - id: final-input
            phrase: final serialized token sequence
            targets:
              - prompt-order-readout-3
            color: blue
        hold: 0.6
  - id: rendered-identity
    title: The actual serialization chooses the branch
    visual: The stored and incoming requests differ by a line ending. Two message lists show how
      reversing the same words changes a conversation. Identical image placeholders then reveal
      different pictures.
    beats:
      - say: >-
          These two rows show what the tokenizer receives. The renderer wraps the guide in a message
          role and adds whitespace, tools and documents. To find a cache miss, compare the rendered
          requests and record which renderer produced each one.
        hold: 0.7
        visual_cues:
          - id: render-pipeline
            phrase: "The renderer wraps the guide in a message role"
            targets:
              - render-pipeline-mark
            color: cyan
            linger: 0.55
      - say: >-
          Both guides say policy on one line and retain on the next. Change the incoming line ending
          to carriage return followed by newline. That extra character can change the token IDs right
          here. Restore the original line ending. If the worker still holds the entry, it can reuse
          that prefix again.
        caption_starts:
          - "Change the incoming line ending"
          - "Restore the original line ending."
        hold: 0.7
        visual_cues:
          - id: render-edit
            phrase: "carriage return followed by newline"
            targets:
              - render-edit-mark
            color: cyan
            linger: 0.55
          - id: render-repair
            phrase: "Restore the original line ending"
            targets:
              - render-repair-mark
            color: green
            linger: 0.55
          - id: render-eligible
            phrase: "it can reuse that prefix again"
            targets:
              - picture
      - say: >-
          When the order of JSON object keys carries no meaning, sort the keys for a consistent
          rendering. Now look at these two message lists. The user asks which test failed. The
          assistant answers, checkout. Reverse the messages in the lower row. Now the answer comes
          before the question. Keep each message in place with its role. Both requests say image
          here. One shows a server. The other shows a database. Include the image content when
          matching the prefix.
        caption_starts:
          - "Now look at these two message lists."
          - "Reverse the messages in the lower row."
          - "Both requests say image here."
          - "One shows a server."
          - "The other shows a database."
        hold: 0.7
        visual_cues:
          - { id: render-object, phrase: "When the order of JSON object keys", targets: [picture] }
          - { id: render-sort, phrase: "sort the keys", targets: [picture] }
          - id: render-array
            phrase: "look at these two message lists"
            targets:
              - render-array-mark
            color: cyan
            linger: 0.55
          - { id: render-reverse, phrase: "Reverse the messages in the lower row", targets: [picture] }
          - id: render-placeholder
            phrase: "Both requests say image here"
            targets:
              - picture
          - id: render-image
            phrase: "One shows a server"
            targets:
              - render-image-mark
            color: cyan
            linger: 0.55
          - { id: render-database, phrase: "The other shows a database", targets: [picture] }
  - id: publication
    title: Which endpoint did the worker store?
    visual: >-
      Two requests align at the end of their common 6,000-token guide. The first write is in flight and
      then completes at 6,048. The second request tests its two candidate endpoints before and after a
      separate guide-only write.
    beats:
      - say: >-
          Both test questions start with the same guide. We've enlarged the
          question tails so you can see where each request ends. This cache looks up exact entries at
          selected endpoints. On this worker the first request is still writing. The second arrives now.
          With no completed entry, it computes its own input.
        hold: 0.65
        visual_cues:
          - { id: tail-zoom, phrase: "enlarged the question tails", targets: [picture] }
          - { id: pending-write, phrase: "still writing", targets: [picture] }
          - { id: early-arrival, phrase: "The second arrives now", targets: [picture] }
          - { id: early-miss, phrase: "it computes its own input", targets: [picture], caption_boundary: true }
      - say: >-
          Let the first write finish. There's one entry, right at the end of the first question. Replay the
          second request against this snapshot. Its lookup checks the end of its own question and the end of
          the guide. Which of those two endpoints has a stored entry?
        caption_starts:
          - "Which of those two endpoints"
        hold: 2.2
        visual_cues:
          - { id: publish-full, phrase: "first write finish", targets: [picture] }
          - { id: find-candidates, phrase: "Replay the second request", targets: [picture] }
          - { id: try-request, phrase: "end of its own question", targets: [picture] }
          - { id: try-guide, phrase: "and the end of the guide", targets: [picture] }
          - { id: predict-entry, phrase: "Which of those two endpoints", targets: [picture] }
      - say: >-
          Neither one. The only entry ends at six thousand forty-eight. The second request ends at six thousand
          thirty-seven. It shares the guide, but the worker has no entry at six thousand either. A
          completed write can still leave this request cold.
        caption_starts:
          - "The only entry ends"
          - "The second request ends"
        hold: 0.8
        visual_cues:
          - { id: no-entry, phrase: "Neither one", targets: [picture], caption_boundary: true }
          - { id: full-receipt, phrase: "entry ends at six thousand forty-eight", targets: [picture] }
          - { id: absent-guide, phrase: "no entry at six thousand either", targets: [picture] }
      - say: >-
          Keep the second request exactly as it was. This time a warmup writes a second entry right at the
          end of the guide. Replay the same lookup. It finds six thousand reusable tokens. Only the
          thirty-seven question tokens need fresh prefill. On a service with explicit markers, mark the
          stable endpoint on the warmup and select it again on the read.
        hold: 0.8
        visual_cues:
          - { id: reset-lookup, phrase: "Keep the second request exactly as it was", targets: [picture] }
          - { id: write-guide, phrase: "writes a second entry right at the end of the guide", targets: [picture] }
          - { id: repeat-lookup, phrase: "Replay the same lookup", targets: [picture] }
          - { id: available-guide, phrase: "It finds six thousand reusable tokens", targets: [picture], caption_boundary: true }
          - { id: tail-only, phrase: "thirty-seven question tokens need fresh prefill", targets: [picture], caption_boundary: true }
  - id: hosted-boundaries
    title: What does the marker qualify for?
    visual: >-
      The same marker selects an endpoint for a write and a later read. A magnifier compares a
      1,023-token selection with the 1,024-token minimum. A clock compares the existing midnight expiry
      with a 9:30 p.m. candidate after a read.
    beats:
      - say: >-
          Here's the same guide on a hosted service. In the OpenAI contract the article checked in October
          twenty twenty-six, eligible developer text can carry an explicit marker. Mark the guide on the
          warmup. Select the same endpoint on the next request. The changing question stays outside that
          write. Remove both markers in explicit-only mode and these requests select nothing to read or
          write.
        hold: 0.65
        visual_cues:
          - { id: host-marker, phrase: "Mark the guide on the warmup", targets: [picture] }
          - { id: host-endpoint, phrase: "Select the same endpoint", targets: [picture] }
          - { id: host-none, phrase: "Remove both markers", targets: [picture] }
          - { id: host-unmarked, phrase: "nothing to read or write", targets: [picture] }
      - say: >-
          Try the markers farther left. Now they select one thousand twenty-three visible tokens. The
          minimum for this model is one thousand twenty-four visible tokens. The question takes the total
          request length well past the minimum. Can adding more to the question make this marked prefix
          eligible?
        hold: 1.9
        visual_cues:
          - { id: host-min, phrase: "select one thousand twenty-three visible tokens", targets: [picture] }
          - { id: host-minimum, phrase: "one thousand twenty-four visible tokens", targets: [picture] }
          - { id: host-ask, phrase: "Can adding more to the question make this marked prefix eligible", targets: [picture], caption_boundary: true }
      - say: >-
          No. The marker still ends one token short. Move it back to the end of the full guide. On supported
          models, prewarming can write the selected prefix without generating an answer. That write carries
          a charge. Check eligibility and reporting for the model and API version you actually use.
        hold: 0.65
        visual_cues:
          - { id: host-short, phrase: "The marker still ends one token short", targets: [picture], caption_boundary: true }
          - { id: host-prewarm, phrase: "Move it back to the end of the full guide", targets: [picture] }
          - { id: host-write, phrase: "prewarming can write the selected prefix without generating an answer", targets: [picture] }
      - say: >-
          One more decision. A write at noon buys twelve hours of coverage, through midnight. At nine that
          evening, a read requests thirty minutes of coverage. The service keeps the later of the existing
          expiry and the end of those thirty minutes. When does coverage end?
        hold: 1.9
        visual_cues:
          - { id: host-lifetime, phrase: "A write at noon buys twelve hours of coverage", targets: [picture] }
          - { id: host-refresh, phrase: "a read requests thirty minutes of coverage", targets: [picture] }
          - { id: host-clock-question, phrase: "When does coverage end", targets: [picture], caption_boundary: true }
      - say: >-
          Midnight. The half hour from the read runs out at nine thirty. The original write already covers
          those last two and a half hours. A requested cache lifetime tells you about reuse. The service's
          data retention policy governs deletion.
        hold: 0.75
        visual_cues:
          - { id: host-expiry, phrase: "Midnight", targets: [picture], caption_boundary: true }
          - { id: host-half, phrase: "runs out at nine thirty", targets: [picture] }
  - id: lookup-window
    title: How far back can one marker look?
    visual: >-
      A stored endpoint stays at position 15. Moving a marker from 34 to 35 puts that entry one place
      outside its 20-position window. A direct marker restores access.
    beats:
      - say: >-
          Claude's API accepts automatic placement or explicit markers on content blocks. The service orders
          tools, system content and messages before lookup. In the contract checked for this lesson, one
          marker searches twenty eligible positions, counting the marker itself. Consecutive tool-use blocks
          count as one position. The same grouping applies to consecutive tool results. Each endpoint must
          also meet the model and platform minimum.
        hold: 0.7
        visual_cues:
          - { id: window-twenty, phrase: "twenty eligible positions", targets: [picture] }
      - say: >-
          There's a stored entry at fifteen. A breakpoint at thirty-four can reach it. Count back from the
          highlighted endpoint, including thirty-four. Fifteen is the twentieth place. Now move only the
          breakpoint to thirty-five. Can this marker still find the entry at fifteen?
        hold: 2.1
        visual_cues:
          - { id: window-34, phrase: "A breakpoint at thirty-four", targets: [picture], caption_boundary: true }
          - { id: window-35, phrase: "move only the breakpoint to thirty-five", targets: [picture], caption_boundary: true }
          - { id: window-question, phrase: "Can this marker still find the entry at fifteen", targets: [picture], caption_boundary: true }
      - say: >-
          Slide the window one place. Its left edge now lands on sixteen. The entry at fifteen is still
          there, just outside the search. A marker at fifteen supplies a direct lookup. With several
          markers, take the longest compatible available prefix reached. The shorter prefix already sits
          inside it.
        hold: 0.7
        visual_cues:
          - { id: window-slide, phrase: "Slide the window one place", targets: [picture] }
          - { id: window-miss, phrase: "Its left edge now lands on sixteen", targets: [picture], caption_boundary: true }
          - { id: window-repair, phrase: "A marker at fifteen supplies a direct lookup", targets: [picture] }
          - { id: window-longest, phrase: "take the longest compatible available prefix reached", targets: [picture] }
      - say: >-
          There are four breakpoint slots on this API, with automatic placement consuming one. A concurrent
          reader can use the first write after the first response starts. The ordinary lifetime is five
          minutes, with a supported one-hour option. Reads refresh it. The clock starts with the request, so
          generation uses part of that interval. Other providers and platforms have their own readiness and
          isolation rules.
        hold: 0.7
        visual_cues:
          - { id: window-slots, phrase: "four breakpoint slots", targets: [picture] }
          - { id: window-auto, phrase: "automatic placement consuming one", targets: [picture] }
          - { id: window-ready, phrase: "after the first response starts", targets: [picture] }
          - { id: window-life, phrase: "five minutes, with a supported one-hour option", targets: [picture] }
  - id: usage-buckets
    title: Conserve the prompt tokens across billing buckets
    visual: The same 2600-token input is partitioned into read 2000, write 400 and ordinary 200. OpenAI
      total and Claude ordinary-input schemas assemble the identical conserved bar.
    beats:
      - say: Build one input ledger with two thousand six hundred tokens. Two thousand are read from cache,
          four hundred are written, and two hundred are processed as ordinary input. These are
          disjoint portions. Their sum must recover the complete prompt. Retain output tokens in a
          separate ledger because generating the answer still costs work.
        hold: 0.7
        visual_cues:
          - id: usage-read
            phrase: "Two thousand are read from cache"
            targets:
              - usage-read-mark
            color: cyan
            linger: 0.55
          - id: usage-write
            phrase: "four hundred are written"
            targets:
              - usage-write-mark
            color: cyan
            linger: 0.55
          - id: usage-ordinary
            phrase: "two hundred are processed as ordinary input"
            targets:
              - usage-ordinary-mark
            color: cyan
            linger: 0.55
          - id: usage-total
            phrase: "sum must recover the complete prompt"
            targets:
              - picture
      - say: In the current OpenAI Responses usage schema, input tokens is the whole two thousand six
          hundred. Its detail fields supply cached tokens for reads and cache-write tokens for
          writes. Subtract both from the total to recover two hundred ordinary input tokens. If you use another OpenAI API, map its usage fields before doing this subtraction.
        hold: 0.7
        visual_cues:
          - id: usage-openai
            phrase: "input tokens is the whole two thousand six hundred"
            targets:
              - picture
          - id: usage-cached
            phrase: "cached tokens for reads"
            targets:
              - picture
          - id: usage-cache-write
            phrase: "cache-write tokens for writes"
            targets:
              - picture
          - id: usage-subtract
            phrase: "Subtract both from the total to recover two hundred ordinary input tokens"
