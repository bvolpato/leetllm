  - id: isolation
    title: Choose the sharing scope from verified identity
    visual: Two authenticated sessions produce distinct structured cache keys for identical guide
      tokens. A forged client tenant label remains visible but cannot select another tenant's lookup
      scope.
    beats:
      - say: >
          Suppose two tenants submit the same private guide. Reuse can reveal information through
          content handling or timing, so the service needs an explicit sharing policy. Our gateway
          derives the scope from a verified session and combines it with model revision, guide
          version, and token identity.
        visual_cues:
