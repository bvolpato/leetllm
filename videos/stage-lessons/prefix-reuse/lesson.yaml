  - id: savings
    title: Three requests on one worker
    visual: >-
      A ledger fills from the three request rows. It holds input and output lengths fixed while an
      eviction before the third request moves 6,000 positions from reused to fresh prefill.
    beats:
      - say: >-
          Here are all three repository questions in arrival order. Their tails have forty-eight,
          thirty-seven and fifty-one tokens. Follow the guide down these rows. Request one processes
          the guide and its question. The next two read the guide and process only their own questions. Each
          row keeps its generated answer on a separate count.
        hold: 0.8
        visual_cues:
          - { id: ledger-first, phrase: "Request one processes the guide and its question", targets: [picture] }
          - { id: ledger-second, phrase: "The next two read the guide", targets: [picture] }
          - { id: ledger-third, phrase: "process only their own questions", targets: [picture] }
          - { id: ledger-output, phrase: "its generated answer on a separate count", targets: [picture] }
      - say: >-
          Add the rows. The worker processed six thousand one hundred thirty-six fresh input positions. Two
          guide reads saved twelve thousand positions compared with three cold requests. The three output
          lengths still add to two hundred forty tokens.
        hold: 0.8
        visual_cues:
          - { id: ledger-fresh, phrase: "six thousand one hundred thirty-six fresh input positions", targets: [picture], caption_boundary: true }
          - { id: ledger-read, phrase: "saved twelve thousand positions", targets: [picture], caption_boundary: true }
          - { id: ledger-generated, phrase: "two hundred forty tokens", targets: [picture], caption_boundary: true }
      - say: >-
          Replay just the third row. Its prompt is identical and we hold the answer length fixed. This time
          the worker evicts the guide before that request arrives. Where do its six thousand guide tokens go
          in the ledger?
        hold: 2
        visual_cues:
          - { id: ledger-rewind, phrase: "Replay just the third row", targets: [picture] }
          - { id: ledger-evict, phrase: "evicts the guide", targets: [picture] }
          - { id: ledger-predict, phrase: "Where do its six thousand guide tokens go", targets: [picture] }
      - say: >-
          They move into fresh prefill. Request three now processes six thousand fifty-one positions. Across
          all three requests, fresh input rises to twelve thousand one hundred thirty-six. Generation still
          accounts for two hundred forty output tokens in this comparison. To learn what the extra work
          cost, compare phase times and the provider's read and write charges.
        hold: 0.8
        visual_cues:
          - { id: ledger-move, phrase: "They move into fresh prefill", targets: [picture], caption_boundary: true }
          - { id: ledger-rerun, phrase: "six thousand fifty-one positions", targets: [picture], caption_boundary: true }
          - { id: ledger-total, phrase: "fresh input rises to twelve thousand one hundred thirty-six", targets: [picture], caption_boundary: true }
  - id: diagnose-replay
    title: Follow the first boundary that actually changed
    visual: A versioned guide statement is edited in source, renderer, retrieval and final token lanes.
      Cache counters remain independent of answer text; a second run changes only cache availability
      to demonstrate a correct cold result.
    beats:
      - say: >-
          The new policy says to rotate keys every thirty days. The assistant still says ninety.
          Read the rendered input. It says ninety too. Trace that line back through the renderer,
          the retrieved document and the deployed revision. Once the new line reaches the model,
          its changed tokens invalidate the old block and everything that depends on it.
        caption_starts:
          - "Read the rendered input."
          - "It says ninety too."
          - "Once the new line reaches the model"
        hold: 0.7
        visual_cues:
          - id: diagnose-input
            phrase: Read the rendered input
            targets:
              - diagnose-input-mark
            color: cyan
            linger: 0.55
          - id: diagnose-change
            phrase: changed tokens invalidate the old block
            targets:
              - diagnose-change-mark
            color: cyan
            linger: 0.55
      - say: >-
          Repair the renderer and replay the request. Now the input says thirty days. Check the model,
          adapter and cache identity, then run with zero prefix reads. The reply still says ninety.
          An answer cache can return a saved reply. Bypass that cache and generate from the same input
          with the same model. If the new answer still says ninety, inspect how the model follows the policy.
        caption_starts:
          - "Now the input says thirty days."
          - "The reply still says ninety."
          - "Bypass that cache"
        hold: 0.7
        visual_cues:
          - id: diagnose-render
            phrase: Repair the renderer
            targets:
              - diagnose-replay-geometry
            color: cyan
            linger: 0.55
          - id: diagnose-cold
            phrase: run with zero prefix reads
            targets:
              - diagnose-cold-mark
            color: cyan
            linger: 0.55
          - id: diagnose-bypass
            phrase: Bypass that cache
            targets:
              - diagnose-bypass-mark
            color: cyan
            linger: 0.55
      - say: >-
          Now investigate a missing read. The original request shows zero read tokens. Was the entry
          written at an eligible boundary, within lookup range and still available to this worker
          and team? Replay with the entry present. The worker reads six thousand tokens. Evict the guide,
          then repeat the same request. Reads fall to zero. The worker has to rebuild the same guide.
          Compare the prefill times to see what that cost.
        caption_starts:
          - "Was the entry written"
          - "Replay with the entry present."
          - "The worker reads six thousand tokens."
          - "Evict the guide"
          - "Reads fall to zero."
        hold: 0.7
        visual_cues:
          - id: diagnose-miss
            phrase: investigate a missing read
            targets:
              - diagnose-miss-mark
            color: pink
            linger: 0.55
          - id: diagnose-control
            phrase: "Replay with the entry present"
            targets:
              - picture
          - id: diagnose-repeat
            phrase: "repeat the same request"
            targets:
              - picture
          - id: diagnose-eviction
            phrase: Evict the guide
            targets:
              - diagnose-eviction-mark
            color: cyan
            linger: 0.55
  - id: fresh-budget
    title: Can this request start?
    visual: >-
      A two-block magnifier shows a one-token edit move from the last slot of a sixteen-token block to
      the first slot of the next. A fixed 700-token allowance crosses a common fresh-work scale for both
      attempts. The question tail and the authorized allowance remain fixed.
    beats:
      - say: >-
          One token changed in a guide that's forty-eight hundred tokens long. This worker has the
          original in cache for the same team, model and adapter. Add a sixty-four-token question.
          The scheduler has room for seven hundred fresh input tokens.
        hold: 0.65
        visual_cues:
          - { id: budget-guide, phrase: "forty-eight hundred tokens long", targets: [picture] }
          - { id: budget-question, phrase: "sixty-four-token question", targets: [picture] }
          - { id: budget-cap, phrase: "seven hundred fresh input tokens", targets: [picture] }
      - say: >-
          Look at the seam between these two blocks. Each holds sixteen tokens. The first change is at position four thousand
          one hundred seventy-six, counting from one. It's the last token in the left block. Can the
          scheduler start this request under the limit?
        caption_starts:
          - "Can the scheduler start this request under the limit?"
        hold: 4.5
        visual_cues:
          - { id: budget-zoom, phrase: "the seam between these two blocks", targets: [picture] }
          - { id: edit-left, phrase: "first change is at position four thousand one hundred seventy-six", targets: [picture] }
          - { id: ask-left, phrase: "Can the scheduler start this request under the limit", targets: [picture] }
      - say: >-
          That whole block needs fresh work. The last reusable position is four thousand one hundred sixty.
          Subtract it from the guide length. That leaves six hundred forty guide tokens. Add the sixty-four
          question tokens and you get seven hundred four fresh positions. Defer this request. It's four
          tokens over budget.
        caption_starts:
          - "The last reusable position"
          - "That leaves six hundred forty guide tokens."
        hold: 1
        visual_cues:
          - { id: left-block, phrase: "That whole block needs fresh work", targets: [picture] }
          - { id: left-end, phrase: "last reusable position is four thousand one hundred sixty", targets: [picture] }
          - { id: left-guide, phrase: "six hundred forty guide tokens", targets: [picture] }
          - { id: left-work, phrase: "seven hundred four fresh positions", targets: [picture], caption_boundary: true }
          - { id: left-verdict, phrase: "Defer this request", targets: [picture], caption_boundary: true }
      - say: >-
          Rewind. Restore that token and move the edit one place to the right. Now the first difference is
          at four thousand one hundred seventy-seven. Same stored guide, same question, same allowance. Does
          this version fit?
        caption_starts:
          - "Does this version fit?"
        hold: 4
        visual_cues:
          - { id: budget-reset, phrase: "Rewind", targets: [picture] }
          - { id: edit-right, phrase: "move the edit one place to the right", targets: [picture] }
          - { id: ask-right, phrase: "Does this version fit", targets: [picture] }
      - say: >-
          The left block now matches all the way through position four thousand one hundred seventy-six.
          Those sixteen positions can rejoin the cached prefix. That leaves six hundred twenty-four guide
          tokens plus the question, or six hundred eighty-eight fresh positions. Admit this version.
          Moving the edit one place saved a whole block of prefill. Now we have twelve tokens to spare.
        caption_starts:
          - "Those sixteen positions can rejoin the cached prefix."
          - "That leaves six hundred twenty-four guide tokens"
          - "Now we have twelve tokens to spare."
        hold: 1.1
        visual_cues:
          - { id: right-end, phrase: "through position four thousand one hundred seventy-six", targets: [picture] }
          - { id: right-block, phrase: "Those sixteen positions can rejoin the cached prefix", targets: [picture] }
          - { id: right-guide, phrase: "six hundred twenty-four guide tokens", targets: [picture] }
          - { id: right-work, phrase: "six hundred eighty-eight fresh positions", targets: [picture], caption_boundary: true }
          - { id: right-verdict, phrase: "Admit this version", targets: [picture], caption_boundary: true }
          - { id: right-margin, phrase: "twelve", targets: [picture] }
