            targets:
              - isolation-readout-2
            color: yellow
        hold: 0.65
      - say: >
          The label on the second request says A. Watch where it stops. The gateway recognizes session
          B and uses B's scope to build the key. The two digests differ, so this request misses A's
          private entry.
        visual_cues:
          - id: untrusted-label
            phrase: The label on the second request
            targets:
              - isolation-readout
            color: pink
