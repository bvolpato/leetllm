            phrase: "the cold worker also finishes first"
            targets:
              - clock-total-mark
            color: cyan
            linger: 0.55
          - id: clock-saving
            phrase: "one thousand and fifty milliseconds"
            targets:
              - picture
      - say: >-
          Measure both routes from arrival to first token. Include time spent waiting, moving cached
          state and processing the question. Even on the warm route, the new tokens attend to the guide.
          FlashAttention can run that attention with less memory traffic. The light blue segment is
          still there on both routes. Both workers spend the same eight hundred and eighty milliseconds
