            phrase: The two digests differ
            targets:
              - isolation-readout-2
            color: pink
        hold: 0.7
      - say: >
          A changed model or guide version also gives B a new key. The hash records those differences.
          Authentication decides who may share. On a hosted service, use the sharing scope its settings enforce.
        visual_cues:
          - id: version-key
            phrase: changed model or guide version
            targets:
              - isolation-readout-2
            color: pink
          - id: sharing-authority
            phrase: Authentication decides who may share
            targets:
              - isolation-scope
            color: blue
        hold: 0.6
  - id: isolation-probes
    title: Whose entry did the worker read?
    visual: >-
      The worker holds a test guide in namespace A. The same synthetic input runs under two verified
      sessions. A reads its own entry, B builds its own, and a later B request can read from B. The
      audit record includes the owner as well as the read count.
    beats:
      - say: >-
          Both test teams send the same guide to the same worker and model. Only team A has a completed
          entry. Which session is allowed to read the stored copy?
        caption_starts:
          - "Only team A has a completed entry."
          - "Which session is allowed"
        hold: 1.8
        visual_cues:
          - { id: both-guides, phrase: "Both test teams send the same guide", targets: [picture] }
          - { id: scope-snapshot, phrase: "only team A has a completed entry", targets: [picture] }
          - { id: scope-question, phrase: "Which session is allowed", targets: [picture] }
      - say: >-
          A can read its own copy. The gateway looks up the entry under A's verified identity. For B the
          lookup is empty, so the worker builds the guide inside B's namespace. Once that write finishes,
          send the same request as B again. This time B reads its own entry. The two reads have the same
          token count. Look at the owner beside each one.
        hold: 0.7
        visual_cues:
          - { id: a-read, phrase: "A can read its own copy", targets: [picture], caption_boundary: true }
          - { id: b-miss, phrase: "For B the lookup is empty", targets: [picture] }
          - { id: b-write, phrase: "Once that write finishes", targets: [picture] }
          - { id: b-repeat, phrase: "send the same request as B again", targets: [picture] }
          - { id: b-read, phrase: "This time B reads its own entry", targets: [picture], caption_boundary: true }
          - { id: audit-owner, phrase: "owner beside each one", targets: [picture] }
      - say: >-
          Read the owner on each lookup record. A read from A's session used A's entry. B's repeat used
          B's. That's evidence you can check even when queueing or network time changes. Routing, stored
          answers and logs each need their own access rules. On a hosted service, check which sharing
          scope the provider enforces.
        hold: 0.7
        visual_cues:
          - { id: scope-evidence, phrase: "Read the owner on each lookup record", targets: [picture] }
          - { id: scope-policy, phrase: "their own access rules", targets: [picture] }
  - id: pool
    title: Cached blocks can also be available
    visual: A twenty-block pool distinguishes referenced, cached unreferenced, and uncached free blocks.
      Allocating five preserves all nine referenced identities and replaces two unreferenced cached
      blocks after using three uncached blocks.
    beats:
      - say: >
          Keeping a prefix consumes storage, but its ownership can change. This pool contains
          referenced blocks, cached blocks with no current owner, and uncached free blocks. An
          unreferenced cached block may still hold useful content while also being available for a
          future allocation or eviction.
