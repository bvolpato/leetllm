            targets:
              - picture
          - id: clock-first
            phrase: "the warm worker delivers the first token sooner"
            targets:
              - picture
      - say: >-
          Stretch just the warm queue to twelve hundred milliseconds. Watch it push the blue segment to
          the right. The warm worker's first token now arrives at thirteen hundred and seventy milliseconds.
          The cold worker wins by a hundred and thirty. Reuse saved one thousand and fifty milliseconds
          of computation, but waiting for the warm worker cost even more. With equal time left to
          generate, the cold worker also finishes first.
