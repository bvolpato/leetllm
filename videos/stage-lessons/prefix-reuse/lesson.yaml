            color: yellow
      - say: >
          A new request needs five blocks. Our chosen allocator consumes the three uncached blocks
          first, then replaces two cached entries. Follow their physical identities in the grid.
          Referenced blocks stay protected, and the total resident pool size stays fixed throughout
          this allocation.
        hold: 0.7
        visual_cues:
          - id: allocate-five
            phrase: "new request needs five blocks"
            targets:
              - pool-readout-3
            color: green
