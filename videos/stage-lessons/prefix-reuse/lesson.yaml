  - id: write-economics
    title: When does writing the guide pay?
    visual: >-
      Two running bills price the same guide. The first write costs more than an ordinary pass. A full
      read adds a small green segment while the ordinary bill doubles. Raising the write price changes
      how many reads it takes to break even.
    beats:
      - say: >-
          The first request pays more to write the guide. At one unit per token, an ordinary pass costs
          six thousand. At one and a quarter, writing the guide costs seven thousand five hundred.
          That's fifteen hundred extra.
        caption_starts:
          - "At one and a quarter"
          - "That's fifteen hundred extra."
        hold: 0.7
        visual_cues:
          - { id: cost-premium, phrase: "fifteen hundred extra", targets: [picture] }
      - say: >-
          A second request needs the guide. Another ordinary pass adds six thousand. At a tenth of a unit
          per token, the green read segment adds just six hundred. The read saves fifty-four hundred.
          That one read pays back the write premium.
        caption_starts:
          - "At a tenth of a unit"
          - "The read saves fifty-four hundred."
        hold: 0.7
        visual_cues:
          - { id: cost-second-cold, phrase: "Another ordinary pass adds six thousand", targets: [picture] }
          - { id: cost-read, phrase: "adds just six hundred", targets: [picture] }
          - { id: cost-saving, phrase: "The read saves fifty-four hundred", targets: [picture] }
      - say: >-
          How many full reads pay for a write? Divide the extra write cost by the saving on one read.
          Fifteen hundred divided by fifty-four hundred comes to about a quarter of a read. Round up
          to one full read.
        caption_starts:
          - "Divide the extra write cost"
          - "Fifteen hundred divided by fifty-four hundred"
          - "Round up to one full read."
        hold: 0.7
        visual_cues:
          - { id: cost-rule, phrase: "Divide the extra write cost by the saving on one read", targets: [picture] }
          - { id: cost-quotient, phrase: "about a quarter of a read", targets: [picture] }
          - { id: cost-whole-read, phrase: "Round up to one full read", targets: [picture] }
      - say: >-
          Raise just the write price to two units per token. One read leaves us six hundred units behind.
          Each full read still saves fifty-four hundred. Will a second full read cover the difference?
        caption_starts:
          - "Will a second full read"
        hold: 2.2
        visual_cues:
          - { id: cost-higher, phrase: "two units per token", targets: [picture] }
          - { id: cost-shortfall, phrase: "six hundred units behind", targets: [picture] }
          - { id: cost-predict, phrase: "Will a second full read", targets: [picture] }
      - say: >-
          Yes. A second read adds six hundred to the cached bill. Another ordinary pass adds six thousand.
          The cached bill is now forty-eight hundred units cheaper. Those two reads paid for the higher
          write price while the guide was still in cache.
        caption_starts:
          - "A second read adds"
          - "Another ordinary pass adds"
          - "The cached bill is now"
        hold: 0.7
        visual_cues:
          - { id: cost-answer, phrase: "Yes", targets: [picture] }
          - { id: cost-long, phrase: "adds six hundred to the cached bill", targets: [picture] }
          - { id: cost-last-cold, phrase: "Another ordinary pass adds six thousand", targets: [picture] }
          - { id: cost-paid, phrase: "forty-eight hundred units cheaper", targets: [picture] }
  - id: partial-writes
    title: Where should the write stop?
    visual: >-
      Four requests retain identical 1,024-token fronts and distinct 4,976-token tails. The write
      markers move from the request ends to the stable boundary. All three reads stay fixed while the
      input bill changes.
    beats:
      - say: >-
          Return to the short write at one and a quarter units per token. Four requests each contain six
          thousand input tokens. Only the first thousand and twenty-four repeat. Each question and its
          supporting material fill the changing tail. For this example the provider can write the entire
          request.
        hold: 0.55
        visual_cues:
          - { id: partial-rate, phrase: "short write at one and a quarter", targets: [picture] }
          - { id: partial-rows, phrase: "Four requests each contain six thousand input tokens", targets: [picture] }
          - { id: partial-share, phrase: "Only the first thousand and twenty-four repeat", targets: [picture] }
          - { id: partial-end, phrase: "write the entire request", targets: [picture] }
      - say: >-
          The first request writes all six thousand tokens. Each later one reads the shared front and writes
          its own tail. Three requests get a hit. At ordinary prices the four inputs would cost twenty-four
          thousand units. With all those hits, would you expect a smaller bill?
        hold: 2.1
        visual_cues:
          - { id: partial-full-write, phrase: "first request writes all six thousand tokens", targets: [picture] }
          - { id: partial-read-front, phrase: "reads the shared front", targets: [picture] }
          - { id: partial-tail, phrase: "writes its own tail", targets: [picture] }
          - { id: partial-hits, phrase: "Three requests get a hit", targets: [picture] }
          - { id: partial-cold, phrase: "twenty-four thousand units", targets: [picture] }
          - { id: partial-ask, phrase: "would you expect a smaller bill", targets: [picture], caption_boundary: true }
      - say: >-
          Look at request two. Reading the shared front costs just over a hundred units. Writing the rest
          costs six thousand two hundred twenty. The other two hits carry the same charges. Add those three
          rows to the first write. The total is ten point three percent above the cold bill. We paid a
          premium to write thousands of tokens nobody read again.
        hold: 0.9
        visual_cues:
          - { id: partial-read, phrase: "costs just over a hundred units", targets: [picture] }
          - { id: partial-write, phrase: "Writing the rest costs six thousand two hundred twenty", targets: [picture] }
          - { id: partial-later-total, phrase: "same charges", targets: [picture] }
          - { id: partial-first, phrase: "the first write", targets: [picture] }
          - { id: partial-increase, phrase: "ten point three percent above the cold bill", targets: [picture], caption_boundary: true }
      - say: >-
          Move the write marker back to the end of the shared front. Assume that endpoint meets the model's
          minimum. Replay all four requests. Every changing tail is now ordinary input. The first row still
          pays to write the shared part. The next three still read exactly the same tokens. This time the
          input bill falls below twenty-four thousand units. The hit count stayed put. The saving came from
          paying the ordinary rate on the tails.
        hold: 0.8
        visual_cues:
          - { id: partial-repair, phrase: "Move the write marker back to the end of the shared front", targets: [picture] }
          - { id: partial-ordinary, phrase: "Every changing tail is now ordinary input", targets: [picture] }
          - { id: partial-repaired-first, phrase: "first row still pays to write the shared part", targets: [picture] }
          - { id: partial-repaired-later, phrase: "next three still read exactly the same tokens", targets: [picture] }
          - { id: partial-repaired-total, phrase: "the input bill falls below twenty-four thousand units", targets: [picture], caption_boundary: true }
  - id: worker-locality
    title: Route to state that exists without trapping work in a queue
    visual: Four sequential identified requests travel to three separate cache inventories. Round-robin
      creates three cold writes; stable affinity creates one, then a capacity guard sends an
      overloaded request elsewhere.
    beats:
      - say: >-
          Four requests arrive one at a time, each with the same guide. Three workers start empty.
          Round robin sends the first three requests to separate workers. Each builds its own copy.
          The fourth request returns to worker zero and reads its copy. Replay with prefix affinity.
          All four go to worker zero. It writes once and serves three reads.
        caption_starts:
          - "Round robin sends"
          - "The fourth request returns"
          - "Replay with prefix affinity."
          - "It writes once and serves three reads."
        hold: 0.7
        visual_cues:
          - id: route-round
            phrase: "Round robin sends the first three requests to separate workers"
            targets:
              - worker-locality-geometry
            color: cyan
            linger: 0.55
          - id: route-hit
            phrase: The fourth request returns to worker zero
            targets:
              - worker-locality-geometry
            color: cyan
            linger: 0.55
          - id: route-affinity
            phrase: Replay with prefix affinity
            targets:
              - worker-locality-geometry
            color: cyan
            linger: 0.55
          - { id: route-tally, phrase: "It writes once and serves three reads", targets: [picture] }
      - say: >-
          The router combines the verified sharing scope with the guide's prefix identity to pick a
          worker. At lookup, the worker checks which entries that team may read. The SGLang paper
          describes a distributed meta-tree that tracks where prefixes live. When a worker evicts
          the guide, the routing index needs that update.
        hold: 0.7
        visual_cues:
          - id: route-scope
            phrase: verified sharing scope
            targets:
              - route-scope-mark
            color: cyan
            linger: 0.55
          - id: route-inventory
            phrase: distributed meta-tree
            targets:
              - route-inventory-mark
            color: cyan
            linger: 0.55
      - say: >-
          Worker zero is at capacity when request five arrives. With bounded-load hashing, it spills
          to worker one. There's room there to build a copy. Another option is to estimate how soon
          each worker can serve the request. Mooncake weighs queue time and remaining prefill.
          Include transfer time if the guide has to move. Add a fourth worker and its cache starts empty.
        caption_starts:
          - "With bounded-load hashing"
          - "Another option"
          - "Add a fourth worker"
        hold: 0.7
        visual_cues:
          - id: route-spill
            phrase: "it spills to worker one"
            targets:
              - picture
          - id: route-overload
            phrase: Worker zero is at capacity
            targets:
              - route-overload-mark
            color: cyan
            linger: 0.55
          - id: route-transfer
            phrase: Include transfer time
            targets:
              - route-transfer-mark
            color: cyan
            linger: 0.55
          - id: route-new
            phrase: Add a fourth worker
            targets:
              - route-new-mark
            color: cyan
            linger: 0.55
  - id: latency-path
    title: Compare the whole first-token path
    visual: Same-scale stacked clocks construct cold 1220ms and warm 170ms first-token work. Queue
      lengths then change independently to reveal a 1370ms warm arrival losing to a 1240ms cold
      arrival; equal 880ms generation remains.
    beats:
      - say: >-
          Send the same prompt to two workers. The cold worker needs twelve hundred and twenty milliseconds
          of computation to produce its first token. The warm worker has the guide ready. Its first token
          takes just a hundred and seventy milliseconds of computation. Both spend eight hundred and eighty
          milliseconds finishing the answer. Give them equal twenty-millisecond queues and the warm worker
          delivers the first token sooner.
