scenes:
  - id: opening
    title: "Where did .env go?"
    visual: >-
      A folded settings file sits beside the laptop’s script. Only the script travels to
      the clone. The ignore rule and Git’s status explain the empty outline across from .env.
      Then the script reports a different missing file and both terminals check their paths.
    beats:
      - say: >-
          Watch the dot env file as Git clones the project. The script comes across.
          Your settings stay on the laptop.
        hold: 0.85
        caption_starts: ["The script comes across", "Your settings stay on the laptop"]
        visual_cues:
          - id: clone-project
            phrase: "Watch the dot env file"
            targets: [tracked-script]
      - say: >-
          Ask Git to show ignored files. Two exclamation marks flag dot env. This rule
          matches its name, so Git skipped the new file when we staged the project. Look
          in the commit. It contains the script. That’s the file the clone checks out.
        hold: 0.85
        caption_starts: ["Two exclamation marks", "Look in the commit", "It contains the script"]
        visual_cues:
          - id: inspect-ignore
            phrase: "Ask Git to show ignored files"
            targets: [ignore-rule]
          - id: ignored-status
            phrase: "Two exclamation marks"
            targets: [ignored-file]
          - id: matching-rule
            phrase: "This rule matches its name"
            targets: [ignore-rule]
          - id: inspect-commit
            phrase: "Look in the commit"
            targets: [commit-contents]
          - id: committed-script
            phrase: "It contains the script"
            targets: [commit-contents]
      - say: >-
          Run the script in the clone. It exits with status one. This time the missing file
          holds the saved predictions. The shell runs the commands you type in a terminal.
          Compare its current directory with the root Git reports. In each window, the two
          paths match.
        hold: 1.1
        caption_starts: ["It exits with status one", "In each window"]
        visual_cues:
          - id: run-script
            phrase: "Run the script in the clone"
            targets: [clone-terminal]
          - id: fixture-error
            phrase: "It exits with status one"
            targets: [clone-terminal]
          - id: check-directories
            phrase: "Compare its current directory"
            targets: [paths]
          - id: check-roots
            phrase: "the root Git reports"
            targets: [paths]
  - id: navigation-contract
    title: "Where does this path start?"
    visual: >-
      The directory cursor moves while the relative input name stays the same. The two lookups
      reach different locations.
    beats:
      - say: >-
          Start at the top of access-rag. The command P W D prints the current directory. A
          relative path starts there. An absolute path starts at the filesystem root. From
          here, the relative name on the left reaches the fixture. Move into scripts with the
          command C D. The same name now points somewhere else. That alone could explain a
          missing file.
        hold: 0.8
        visual_cues:
          - id: relative-base
            phrase: "Move into scripts"
            targets: [path-resolution]
            color: cyan
            linger: 0.5
          - id: path-miss
            phrase: "points somewhere else"
            targets: [path-resolution]
            color: cyan
            linger: 0.4
      - say: >-
          Quote the input variable. The shell then passes a name containing a space as one
          argument. If you need to change directories in a script, check that you got there
          before launching the next command. The guard on screen exits on failure. In our
          opening both shells were already at the project root.
        hold: 0.7
        visual_cues:
          - id: quoted-argument
            phrase: "one argument"
            targets: [path-arguments]
            color: cyan
            linger: 0.5
          - id: guarded-directory
            phrase: "before launching the next command"
            targets: [directory-gate]
            color: cyan
            linger: 0.5
      - say: >-
          So check what Git could have supplied. Init creates a local repository. Add selects
          file contents. Commit records them locally. A clone checks out the files recorded in
          a commit. Sharing that commit with a remote takes a separate push.
        hold: 0.8
        visual_cues:
          - id: git-operation-chain
            phrase: "Commit records them locally"
            targets: [directory-gate]
            color: cyan
            linger: 0.4
  - id: find-file
    title: "Did Git receive the fixture?"
    visual: >-
      The original checkout reports an untracked fixture. A lookup in the clone’s HEAD returns to
      the prompt with no matching path. Open the local file and follow each field into its table
      cell.
    beats:
      - say: >-
          On the original machine, ask Git for its short status, including individual untracked
          files. The two question marks mean this file is untracked here. In the teammate’s clone,
          look up that exact path in the tree recorded at HEAD. The prompt comes back without a
          filename. That commit omitted the fixture. The local file is the one we need to inspect.
        hold: 0.8
        visual_cues:
          - id: untracked-fixture
            phrase: "two question marks"
            targets: [status-output]
            color: pink
            linger: 0.5
          - id: missing-answer
            phrase: "The prompt comes back without a filename"
            targets: [file-membership]
            color: yellow
            linger: 0.6
          - id: check-head
            phrase: "look up that exact path"
            targets: [picture]
      - say: >-
          Read it as one JSON object per line, with a request, an expected label, and a saved
          prediction. Track this small test input. It lets your teammate run the same
          comparison without a live model. Keep the real secret, the virtual environment and
          generated caches local. An example environment file can carry the names a program
          expects.
        hold: 0.8
        visual_cues:
          - id: fixture-rows
            phrase: "one JSON object per line"
            targets: [jsonl-rows]
            color: cyan
            linger: 0.5
          - id: fixture-fields
            phrase: "with a request, an expected label, and a saved prediction"
            targets: [picture]
          - id: track-fixture
            phrase: "Track this small test input"
            targets: [picture]
          - id: local-files
            phrase: "real secret"
            targets: [local-residue]
            color: yellow
            linger: 0.5
  - id: ignore-contract
    title: "Which paths should travel?"
    visual: >-
      Ordinary add reveals the selection for each path. In a second example, the working file
      and an older commit stay in place when the placeholder is removed from the index.
    beats:
      - say: >-
          We want a teammate to receive the test data. The real environment file, virtual
          environment and generated runs can stay untracked. The pattern at the top covers
          names beginning with dot env. The negated example pattern makes an exception for the
          file that holds a variable name with its value left blank. The small evaluation fixture
          matches no ignore rule.
        hold: 0.7
        visual_cues:
          - id: ignore-local
            phrase: "stay untracked"
            targets: [paths]
          - id: ignore-patterns
            phrase: "negated example pattern"
            targets: [ignore-membership]
            color: cyan
            linger: 0.5
          - id: ignore-fixture
            phrase: "small evaluation fixture"
            targets: [paths]
      - say: >-
          Try an already tracked placeholder. There’s a working copy, a selected copy, and an
          older commit that contains it. Add its name to the ignore file. Which of those
          copies did that pattern remove?
        hold: 2
        visual_cues:
          - id: existing-file
            phrase: "already tracked placeholder"
            targets: [history]
      - say: >-
          All three remain. The new rule leaves it in the index. Git remove cached removes
          that selection while preserving the working file. Commit the removal. This still
          leaves old history available. Rotate an exposed active credential if a real one
          entered that history. A force add can also select an ignored path. Inspect what
          you’re about to share.
        hold: 0.9
        visual_cues:
          - id: tracked-ignore
            phrase: "leaves it in the index"
            targets: [ignore-history]
            color: cyan
            linger: 0.5
          - id: untrack-current
            phrase: "preserving the working file"
            targets: [untrack-effect]
            color: cyan
            linger: 0.5
          - id: old-history-remains
            phrase: "still leaves old history"
            targets: [untrack-effect]
            color: cyan
            linger: 0.4
          - id: rotate-exposed
            phrase: "Rotate an exposed active credential"
            targets: [untrack-effect]
            color: cyan
            linger: 0.4
  - id: git-states
    title: "What happens to request 102?"
    visual: >-
      The expected label stays fixed. Stage the saved prediction, edit the working word, and
      carry the selected word into a plain commit.
    beats:
      - say: >-
          Zoom in on request one hundred two. The expected answer is blocked. Our saved
          prediction says escalated. Watch what moves when I stage the file. Git copies its
          current contents into the index. That’s the selection a plain commit will record.
        hold: 0.7
        visual_cues:
          - id: stage-row
            phrase: "copies its current contents into the index"
            targets: [index-row]
            color: yellow
            linger: 0.5
      - say: >-
          Now change the working prediction to blocked. Look across at the selected copy. Git
          diff compares these two views. You can see the word you changed and the word it
          replaced. A second git add would select the edit too.
        hold: 0.7
        visual_cues:
          - id: edit-row
            phrase: "change the working prediction to blocked"
            targets: [working-row]
            color: pink
            linger: 0.6
          - id: working-diff
            phrase: "Git diff compares these two views"
            targets: [diff-output]
            color: cyan
            linger: 0.6
      - say: >-
          Leave that edit on the laptop. Git diff cached compares the index with the current
          commit. This fixture is new, so the selected difference includes the whole row.
          Which prediction will a teammate receive?
        hold: 2.2
        visual_cues:
          - id: cached-diff
            phrase: "compares the index with the current commit"
            targets: [diff-output]
            color: cyan
            linger: 0.5
      - say: >-
          Make the commit. Escalated travels from the index. Your editor still says blocked.
          Put those two copies side by side whenever a local check and a teammate’s run
          disagree.
        caption_starts: ["Escalated travels from the index"]
        hold: 0.9
        visual_cues:
          - id: commit-row
            phrase: "Make the commit"
            targets: [history-row]
            color: green
            linger: 0.6
  - id: score
    title: "What does one more miss cost?"
    visual: >-
      The scorer reads the committed fixture in order. The two tallies separate at request
      102, then only the total moves when request 104 arrives.
    beats:
      - say: >-
          Run the committed copy. The approved request matches, so mark one correct and one
          seen. On the next row, blocked and escalated disagree. Only the total grows. The
          restored request matches too. Those bars now describe everything the scorer has
          read.
        hold: 0.7
        visual_cues:
          - id: compare-first
            phrase: "approved request matches"
            targets: [comparison-rows]
            color: green
            linger: 0.3
          - id: compare-second
            phrase: "Only the total grows"
            targets: [comparison-rows]
            color: pink
            linger: 0.3
          - id: compare-third
            phrase: "restored request matches too"
            targets: [comparison-rows]
            color: green
            linger: 0.4
      - say: >-
          The terminal prints accuracy to three decimal places. For the decision, three times
          correct must be at least twice total. Here the two sides are equal, so the gate
          opens. Suppose the next request is another miss. Will the gate still open?
        hold: 2.1
        visual_cues:
          - id: rounded-score
            phrase: "three decimal places"
            targets: [rounded-rate]
          - id: integer-gate
            phrase: "three times correct must be at least twice total"
            targets: [count-gate]
            color: yellow
            linger: 0.6
      - say: >-
          Look at the end of the downloaded fixture. It ends at a closing brace. Insert a newline
          there so the next object starts on its own line. Now append request one hundred four.
          Watch the total bar. This extra miss raises the right side to eight and leaves the left
          at six. The scorer returns failure. The earlier missing file also gave exit one. This
          time we have a score to explain.
        caption_starts: ["Now append request one hundred four", "This extra miss raises", "The scorer returns failure"]
        hold: 1
        visual_cues:
          - id: append-wrong
            phrase: "Now append request one hundred four"
            targets: [comparison-rows]
            color: pink
            linger: 0.5
          - id: failed-gate
            phrase: "scorer returns failure"
            targets: [count-gate]
            color: pink
            linger: 0.5
          - id: join-records
            phrase: "Insert a newline there"
            targets: [picture]
  - id: input-contract
    title: "What does the file actually contain?"
    visual: >-
      Inspect the parser, compare the stored and normalized labels, then enlarge the last
      bytes of all three records. The last newline disappears while each closing brace stays
      put.
    beats:
      - say: >-
          What qualifies as a row? The article’s scorer skips blank lines and reads one JSON
          object per remaining line. Require prompt, expected and prediction. All three must contain
          nonempty text. The empty array is legal JSON, but it fails this object contract. A
          missing required field, a record the decoder rejects, or an empty dataset stops the run
          before it prints a score.
        hold: 0.8
        visual_cues:
          - id: record-valid
            phrase: "Require prompt, expected and prediction"
            targets: [input-validation]
            color: cyan
            linger: 0.4
          - id: record-validation
            phrase: "fails this object contract"
            targets: [input-validation]
            color: cyan
            linger: 0.5
          - id: record-invalid
            phrase: "A missing required field"
            targets: [validation]
      - say: >-
          Look inside this prompt. A Unicode line separator sits between two words in the
          quoted string. The article’s splitlines can cut that prompt in two. For a
          strict JSON Lines reader, open the UTF-eight file with the newline set to line feed.
          Decode every physical line. One line feed ends request one hundred one. Add a second
          line feed. Now line two is blank. It has no JSON value, so the reader reports line two and stops.
        hold: 0.8
        visual_cues:
          - id: strict-reader
            phrase: "Look inside this prompt"
            targets: [reader]
          - id: split-prompt
            phrase: "cut that prompt in two"
            targets: [reader]
          - id: use-line-feed
            phrase: "newline set to line feed"
            targets: [reader]
          - id: final-lf
            phrase: "One line feed ends request one hundred one"
            targets: [line-ends]
          - id: blank-line
            phrase: "Add a second line feed"
            targets: [line-ends]
          - id: blank-error
            phrase: "the reader reports line two and stops"
            targets: [reader]
      - say: >-
          Try a different input. The extra cost field here holds NaN, which means not a
          number. Python accepts that bare constant by default. Reject those constants during
          decoding to enforce strict JSON, and report the line if decoding fails. Then check the
          required fields as before.
        hold: 0.8
        visual_cues:
          - id: bare-constant
            phrase: "extra cost field"
            targets: [reader]
          - id: strict-constant
            phrase: "Reject those constants during decoding"
            targets: [reader]
      - say: >-
          Compare these two stored labels. Python applies strip and then lower to each label. For
          this pair, ordinary spaces come off the ends and the capital letters become lowercase.
          Both sides now hold the word blocked. If the prediction changes to escalated, the
          words differ even after that cleanup.
        hold: 0.7
        visual_cues:
          - id: stored-labels
            phrase: "two stored labels"
            targets: [stored-values]
          - id: normalize-labels
            phrase: "ordinary spaces come off the ends"
            targets: [normalized-labels]
            color: cyan
            linger: 0.5
          - id: normalization-miss
            phrase: "changes to escalated"
            targets: [normalized-labels]
            color: cyan
            linger: 0.4
      - say: >-
          Back to the original three requests. Here are the ends of the lines. Each closing
          brace finishes an object. Each blue zero A is a newline byte. Remove only its final
          newline. How many newlines will word count find? How many requests can Python still
          read?
        hold: 2.2
        visual_cues:
          - id: original-bytes
            phrase: "original three requests"
            targets: [line-ends]
          - id: remove-final-newline
            phrase: "Remove only its final newline"
            targets: [fixture-bytes]
            color: cyan
            linger: 0.5
      - say: >-
          Two blue marks remain. Word count reports two. Follow the braces, though. Python
          still parses three JSON objects and keeps two matches. The last prediction is
          intact. Use a line count to inspect a file. Use the parser and the label comparison
          to decide the gate.
        caption_starts: ["Python still parses three JSON objects", "and keeps two matches"]
        hold: 1
        visual_cues:
          - id: newline-count-reveal
            phrase: "Two blue marks remain"
            targets: [newline-counts]
            color: cyan
            linger: 0.5
          - id: record-count-reveal
            phrase: "still parses three JSON objects"
            targets: [record-counts]
            color: cyan
            linger: 0.5
          - id: match-count-reveal
            phrase: "keeps two matches"
            targets: [record-counts]
            color: cyan
            linger: 0.4
  - id: local-hook
    title: "What stops a commit?"
    visual: >-
      The tracked hook source goes to the private hooks directory. A four-row fixture reaches
      the scorer, and its nonzero exit stops Git before recording.
    beats:
      - say: >-
          Your teammate can run the tracked repro script by its path. A shortcut in your shell
          stays on your machine. To check a commit automatically, track the hook source and
          its installer too. The installer places an executable copy in this checkout’s
          private hooks directory. Repeat that installation in each clone.
        hold: 0.8
        visual_cues:
          - id: install-hook
            phrase: "places an executable copy"
            targets: [hook-installation]
            color: yellow
            linger: 0.6
      - say: >-
          Start with the original three requests again. Add the wrong fourth request on its own
          line in the working file and stage all four rows. Try to commit them. Git runs the installed
          hook. It calls the same scorer through the evaluation script. The score fails and
          the commit stops. The four rows are still staged.
        hold: 1
        visual_cues:
          - id: hook-input
            phrase: "stage all four rows"
            targets: [staged-fixture]
          - id: hook-runs
            phrase: "Git runs the installed hook"
            targets: [commit-route]
          - id: hook-scorer
            phrase: "calls the same scorer"
            targets: [commit-route]
          - id: hook-failure
            phrase: "score fails and the commit stops"
            targets: [hook-terminal]
            color: pink
            linger: 0.6
      - say: >-
          If a different hook already occupies that path, the installer stops too. Check for a
          configured hooks path and merge the checks deliberately. A teammate can keep the
          checks they already depend on.
        hold: 0.6
  - id: commit-boundary
    title: "Which copy did the hook read?"
    visual: >-
      Working and staged strips start with the same four requests. A local deletion changes
      one strip. After the local hook finishes, the staged strip travels intact to CI.
    beats:
      - say: >-
          The extra request is still in the index from that blocked commit. Remove the trial row
          only from the working copy. Before committing, look at both diffs. The working diff
          shows a deletion. The staged diff still shows the addition. Try the plain commit again.
          Watch the hook read across the top strip. It finds two matches in three rows, and the
          local hook passes. Which strip will the clean checkout get?
        hold: 2.3
        visual_cues:
          - id: unstaged-repair
            phrase: "Remove the trial row only from the working copy"
            targets: [snapshot-counts]
            color: cyan
            linger: 0.5
          - id: hook-read
            phrase: "read across the top strip"
            targets: [hook-scan]
          - id: local-pass
            phrase: "the local hook passes"
            targets: [snapshot-counts]
            color: green
            linger: 0.5
          - id: compare-diffs
            phrase: "look at both diffs"
            targets: [picture]
      - say: >-
          Git records the index. Follow that file into a clean checkout in continuous
          integration, or C I. Run the same check there. Request one hundred four came along.
          Two matches in four rows fall below two thirds. The hook read the three working
          rows. C I read the four rows in the commit.
        caption_starts: ["Request one hundred four came along", "Two matches in four rows"]
        hold: 0.9
        visual_cues:
          - id: plain-commit
            phrase: "Git records the index"
            targets: [commit]
          - id: committed-check
            phrase: "Follow that file into a clean checkout"
            targets: [ci-terminal]
            color: pink
            linger: 0.6
          - id: ci-read
            phrase: "Run the same check there"
            targets: [checkout-scan]
          - id: ci-result
            phrase: "fall below two thirds"
            targets: [clone-receipt]
      - say: >-
          Once the commit exists, use git show HEAD to see the change it recorded. There’s the
          extra row. A local hook can be skipped. Have C I run the tracked command on the
          commit your teammate will receive.
        hold: 0.9
        visual_cues:
          - id: ci-command
            phrase: "Have C I run the tracked command"
            targets: [ci-terminal]
            color: yellow
            linger: 0.5
          - id: recorded-diff
            phrase: "use git show HEAD"
            targets: [picture]
  - id: history
    title: "When did request 104 enter history?"
    visual: >-
      A bisect marker probes the same scorer on each revision. The interval shrinks after each
      result and the evidence table gains only the rows actually tested.
    beats:
      - say: >-
          Suppose yesterday’s commit passed this check. Today’s fails with a score. Save the
          output and exit status before changing any files. Start Git bisect in a clean
          working tree. Mark a known passing commit good and the failing one bad. Now Git can
          check out a revision between them.
        hold: 0.7
      - say: >-
          Run the same command in the middle. Commit three passes. We can move the good end of
          the interval there. Commit five fails with the extra miss. That moves the bad end
          back. Which revision is left to check?
        hold: 2.1
        visual_cues:
          - id: bisect-three
            phrase: "Commit three passes"
            targets: [history-interval]
            color: green
            linger: 0.5
          - id: bisect-five
            phrase: "Commit five fails"
            targets: [history-interval]
            color: pink
            linger: 0.4
      - say: >-
          Commit four passes. Good and bad sit side by side. Five introduced the extra wrong
          row. Inspect that commit’s diff, then use bisect reset to return to your branch. If
          a candidate can’t run the scorer because setup is broken, skip it. Calling a setup
          failure bad would answer a different question.
        caption_starts: ["Five introduced the extra wrong row"]
        hold: 1
        visual_cues:
          - id: bisect-four
            phrase: "Commit four passes"
            targets: [history-interval]
            color: green
            linger: 0.4
          - id: first-bad
            phrase: "Five introduced the extra wrong row"
            targets: [history-receipt]
            color: yellow
            linger: 0.5
  - id: shell-inspection
    title: "What does a zero count tell you?"
    visual: >-
      Head selects the first request. Word count returns the newline count for the whole file.
      Keep the completed search in view while a second grep opens a missing path.
    beats:
      - say: >-
          Over S S H, ask head for one line. The first request shows the fields you’ll find
          in this file. Now count the newlines. This copy has one at the end of each request,
          so word count prints three.
        hold: 0.7
        visual_cues:
          - id: inspect-head
            phrase: "ask head for one line"
            targets: [inspection-terminal]
          - id: inspect-count
            phrase: "count the newlines"
            targets: [inspection-terminal]
          - id: newline-result
            phrase: "word count prints three"
            targets: [inspection-terminal]
      - say: >-
          Search the fixture for the word denied. Grep prints zero on standard output. It
          read the file and found no matching line, so it returns status one. Change only
          the filename. What will grep print this time?
        hold: 1.8
        caption_starts: ["Grep prints zero", "Change only the filename"]
        visual_cues:
          - id: grep-search
            phrase: "Search the fixture"
            targets: [search-terminal]
          - id: grep-empty
            phrase: "Grep prints zero"
            targets: [search-terminal]
          - id: no-match-status
            phrase: "returns status one"
            targets: [search-terminal]
          - id: grep-change-file
            phrase: "Change only the filename"
            targets: [search-terminal]
