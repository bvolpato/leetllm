scenes:
  - id: intro
    title: Which pixel trips the alert?
    visual: Magnify the badge on a notification bell so its four readings and the strict cutoff are
      visible together. Mark the winning corner on the answer. Show the four readings converging
      to the center average as the encoder packs the crop.
    beats:
      - say: Four pixels make up this badge. Flag any pixel brighter than point nine. Which corner
          gets a flag?
        hold: 2.2
        visual_cues:
          - id: badge-readings
            phrase: Four pixels make up this badge
            targets:
              - badge-crop
            color: cyan
            linger: 0.25
          - id: badge-cutoff
            phrase: brighter than point nine
            targets:
              - badge-rule
            color: yellow
            linger: 0.25
      - say: The bottom right. The bottom left sits exactly on the line. Keep your eye on those two
          corners as we pack this crop into two numbers.
        hold: 0.5
        visual_cues:
          - id: badge-answer
            phrase: The bottom right
            targets:
              - badge-crop
            color: pink
            linger: 0.25
            caption_boundary: true
      - say: Our hand-built encoder takes the average of the four badge pixels. Its second number averages
          the two pixels just below them. This pair is the latent code. The decoder has to rebuild
          the picture from that pair. Together these two maps form an autoencoder. Will the rebuilt
          badge still tell us which corner to flag?
        hold: 1.8
        visual_cues:
          - id: pool-center
            phrase: takes the average of the four badge pixels
            targets:
              - badge-ruler
            color: yellow
            linger: 0.25
          - id: pool-lower
            phrase: averages the two pixels just below them
            targets:
              - badge-crop
            color: cyan
            linger: 0.25
          - id: badge-code
            phrase: This pair is the latent code
            targets:
              - badge-ruler
            color: yellow
            linger: 0.25
  - id: bottleneck
    title: Two averages remember regions
    visual: Four center-pixel contributions accumulate into the first average, then two lower pixels
      build the second. A pixel exchange withholds its candidate code until a later equal-code
      reveal.
    beats:
      - say: Brightness runs from zero to one. Our first coordinate watches these four center pixels. Add
          their brightness values, then divide the sum by four. That average is the first dial. A
          learned encoder would discover its own weights across many crops.
        visual_cues:
          - id: center-add
            phrase: Add their brightness values
            targets:
              - selected-encoder-pixels
              - encoder-average
            color: yellow
          - id: center-mean
            phrase: divide the sum by four
            targets:
              - encoder-average
            color: yellow
        hold: 0.5
      - say: The second dial averages these two lower pixels. Add them and divide by two. Now the decoder
          receives this pair. Its weights turn the regional brightness values into the reconstructed
          badge. The code is the only path carrying information about this particular input.
        visual_cues:
          - id: lower-add
            phrase: Add them and divide by two
            targets:
              - lower-encoder-pixels
              - regional-code
            color: cyan
          - id: badge-decode
            phrase: turn the regional brightness values into the reconstructed badge
            targets:
              - decoded-picture
            color: green
        hold: 0.5
      - say: Exchange the brightest and dimmest selected center pixels. We have changed their arrangement.
          Predict the new code before I uncover it. Will either dial change?
        visual_cues:
          - id: pixel-exchange
            phrase: Exchange the brightest and dimmest selected center pixels
            targets:
              - selected-encoder-pixels
            color: pink
          - id: candidate-code
            phrase: Predict the new code
            targets:
              - candidate-code
            color: yellow
        hold: 1.5
      - say: The pair stays the same. The sum is unchanged, so both averages survive the exchange. The
          decoder therefore produces the same reconstruction for two different inputs. We have found
          a precise detail that this bottleneck loses.
        visual_cues:
          - id: equal-code
            phrase: The pair stays the same
            targets:
              - candidate-code
            color: green
          - id: same-reconstruction
            phrase: produces the same reconstruction
            targets:
              - decoded-picture
            color: green
        hold: 0.5
  - id: decoder-pixel
    title: Paint the badge from two numbers
    visual: Fill the four badge positions with the decoder’s center value on a fixed scale. Compare
      the original and decoded cutoff counts, then follow the lower coordinate to one neighboring
      pixel and magnify the squared errors.
    beats:
      - say: Start with the original badge on the left. The fixed decoder gives each of its four center
          pixels the same weight on the first number. Take the center average and add the background
          brightness, point zero eight. Each center pixel comes out just under point nine seven. How
          many would our rule flag now?
        hold: 1.9
        visual_cues:
          - id: paint-center
            phrase: add the background brightness, point zero eight
            targets:
              - vae-decoder-pixel-trace
            color: yellow
            linger: 0.25
          - id: show-center
            phrase: just under point nine seven
            targets:
              - vae-decoder-pixel-trace
            color: green
            linger: 0.25
      - say: All four. Only the bottom right crossed the line in the original. The reconstruction puts a
          badge in the right place, but it would give us three extra flags. Its four values are
          inside the allowed brightness range, so clipping changes none of them.
        hold: 0.8
        visual_cues:
          - id: flag-four
            phrase: All four
            targets:
              - vae-decoder-pixel-trace
            color: pink
            linger: 0.25
            caption_boundary: true
      - say: Now follow the lower number to the pixel just left of the lower strip. This neighbor receives
          thirty-five percent of that number, on top of the same background. That gives a much
          dimmer pixel. The weight tells us how far the lower strip brightens its surroundings.
        hold: 0.6
        visual_cues:
          - id: paint-neighbor
            phrase: receives thirty-five percent of that number
            targets:
              - vae-decoder-pixel-trace
            color: cyan
            linger: 0.25
          - id: show-neighbor
            phrase: a much dimmer pixel
            targets:
              - vae-decoder-pixel-trace
            color: green
            linger: 0.25
      - say: Here are the squared misses for all twenty-five pixels. They’re hard to see at this scale.
          Turn up the display gain by a factor of thirty-five. Now you can see where the misses are,
          while the measured mean squared error stays put.
        hold: 0.8
        visual_cues:
          - id: error-gain
            phrase: Turn up the display gain by a factor of thirty-five
            targets:
              - vae-decoder-pixel-trace
            color: pink
            linger: 0.25
  - id: reconstruction
    title: Build the error one pixel at a time
    visual: One matched input/decoded pixel is subtracted and squared. The actual 25 squared errors then
      accumulate into a sum, and division earns the mean.
    beats:
      - say: Let's measure that reconstruction. Select the same pixel in both grids. Subtract its decoded
          value from its input value. Then square the difference. Opposite signs now contribute
          positive errors, and larger misses receive a larger penalty.
        visual_cues:
          - id: pixel-subtract
            phrase: Subtract its decoded value from its input value
            targets:
              - pixel-difference
            color: yellow
          - id: pixel-square
            phrase: square the difference
            targets:
              - pixel-square
            color: pink
        hold: 0.5
      - say: Repeat this for every pixel and add the squared errors. Finally, divide the total by
          twenty-five. That is mean squared error, or MSE. Training adjusts both functions to reduce
          it. This score describes our one reconstruction; let's also test what changing the code
          actually does.
        visual_cues:
          - id: error-sum
            phrase: Repeat this for every pixel and add the squared errors
            targets:
              - pixel-squared-errors
              - error-ledger
            color: pink
          - id: error-mean
            phrase: divide the total by twenty-five
            targets:
              - error-ledger
            color: green
        hold: 0.5
  - id: code-test
    title: Change the message, then inspect the picture
    visual: A constructed lower-highlight crop receives a different code. Swapping that code into the
      original badge's decoder changes the output and increases its measured error.
    beats:
      - say: Here is a second constructed crop with its brightness lower down. Our encoder gives it a
          different pair. Keep the original badge on the left, and replace its code with this
          lower-region code. Predict where the decoder will put the bright region.
        visual_cues:
          - id: probe-crop
            phrase: second constructed crop with its brightness lower down
            targets:
              - probe-crop
            color: cyan
          - id: code-swap
            phrase: replace its code with this lower-region code
            targets:
              - swapped-code
            color: yellow
        hold: 1.2
      - say: The output moves downward, and its error against the original badge rises. The decoder uses the
          message we send. Plain reconstruction training evaluates the codes reached by training
          inputs. A random draw asks it to work elsewhere too. A VAE connects those jobs by defining
          a distribution over codes.
        visual_cues:
          - id: swapped-decode
            phrase: The output moves downward
            targets:
              - swapped-output
            color: green
          - id: swap-error
            phrase: error against the original badge rises
            targets:
              - swap-error
            color: pink
        hold: 0.5
  - id: training-baseline
    title: Compare a learned bottleneck with the constant baseline
    visual: Replace supplied weights with the actual CPU25→8→2→8→25 network and48noisy input rows. Carry
      exact before/after MSE and a same-data constant mean-crop comparator, then exchange codes
      between distinctly identified crop families rather than declaring representation quality from
      loss.
    beats:
      - say: "The first actual training exercise replaces the hand-built maps with learned layers:
          twenty-five inputs, eight hidden units, a two-number code, then eight units and
          twenty-five reconstructed pixels. Tanh hidden layers and a sigmoid output keep the decoded
          brightness in range. Adam updates both encoder and decoder from mean squared error."
        hold: 0.6
        visual_cues:
          - id: vae-training-baseline-0-build
            phrase: "The first actual training exercise replaces the hand-built maps with learned layers:
              twenty-five inputs, eight hidden units, a two-number code, then eight units and
              twenty-five reconstructed pixels. Tanh hidden layers and a sigmoid output keep the
              decoded brightness in range. Adam updates both encoder and decoder from mean squared
              error."
            targets:
              - vae-training-baseline-trace
            color: cyan
            linger: 0.25
      - say: The supplied data are forty-eight noisy versions of one crop. On the executed CPU run, two
          hundred fifty updates reduce training MSE from about point one five three seven to point
          zero zero zero six. A constant predictor that repeats the mean crop also obtains about
          point zero zero zero six on those same rows.
        hold: 0.6
        visual_cues:
          - id: vae-training-baseline-1-build
            phrase: The supplied data are forty-eight noisy versions of one crop. On the executed CPU run, two
              hundred fifty updates reduce training MSE from about point one five three seven to
              point zero zero zero six. A constant predictor that repeats the mean crop also obtains
              about point zero zero zero six on those same rows.
            targets:
              - vae-training-baseline-trace
            color: cyan
            linger: 0.25
          - id: vae-training-baseline-trained
            phrase: two hundred fifty updates reduce training MSE from about point one five three seven to point
              zero zero zero six.
            targets:
              - vae-training-baseline-trace
            color: cyan
            linger: 0.25
          - id: vae-training-baseline-constant
            phrase: A constant predictor that repeats the mean crop also obtains about point zero zero zero six
              on those same rows.
            targets:
              - vae-training-baseline-trace
            color: cyan
            linger: 0.25
      - say: Both predictors can paint the badge in the same place every time. To see what the code
          carries, try a held-out crop with the bright patch lower down. Swap its code with the
          badge code and watch where the decoder puts the patch. For generation, we also need to
          know where to draw a new code.
        hold: 0.6
        visual_cues:
          - id: vae-training-baseline-2-build
            phrase: Swap its code with the badge code
            targets:
              - vae-training-baseline-trace
            color: cyan
            linger: 0.25
  - id: posterior
    title: The crop selects a cloud
    visual: The original and lower crops visibly select different Gaussian means. A return to the badge
      constructs a log-variance-to-scale calculation and changes one actual cloud width.
    beats:
      - say: "A variational autoencoder begins with a generative model: draw a code from a prior, then draw
          a picture from the decoder distribution. Given an observed crop, its encoder selects an
          approximate posterior: a distribution of possible codes for that crop. Here we use
          supplied Gaussian parameters."
        visual_cues:
          - id: posterior-select
            phrase: encoder selects an approximate posterior
            targets:
              - posterior-input
              - latent-posterior-cloud
            color: cyan
        hold: 0.5
      - say: Change the input to the lower crop. Its mean moves, while the gray standard-normal prior stays
          fixed at zero with unit variance. Our diagonal Gaussian treats its coordinates as
          independent for this input.
        visual_cues:
          - id: posterior-other
            phrase: Change the input to the lower crop. Its mean moves
            targets:
              - posterior-input
              - latent-posterior-cloud
            color: pink
        hold: 0.5
      - say: Return to the badge and start the first width at one. The encoder predicts log variance. Halve
          that value and exponentiate to get standard deviation. Watch the first axis narrow. This
          positive standard deviation is the scale we will use to sample.
        visual_cues:
          - id: posterior-return
            phrase: Return to the badge and start the first width at one
            targets:
              - posterior-input
              - latent-posterior-cloud
            color: cyan
          - id: posterior-scale
            phrase: Halve that value and exponentiate to get standard deviation
            targets:
              - standard-deviation-transform
              - latent-posterior-cloud
            color: yellow
        hold: 0.5
  - id: posterior-contract
    title: Separate the posterior for one crop from the mixture
    visual: Build forward prior→latent→decoder and backward observedcrop→sharedencoder→mean/logvariance.
      Two diagonal ellipses centered±[1,1] each have independent coordinates; their mixture yields
      covariance[[2,1],[1,2]]. Keep variance and standard-deviation rulers distinct and flag
      exponent overflow/underflow.
    beats:
      - say: "A VAE declares a generative model: draw a latent from a prior, then an image from a decoder
          distribution. Given an observed crop, its true posterior asks which latent values could
          have produced that crop. The encoder predicts a tractable approximate posterior instead.
          One shared encoder amortizes this inference across inputs rather than solving a separate
          optimization for every crop."
        hold: 0.6
        visual_cues:
          - id: vae-posterior-contract-0-build
            phrase: "A VAE declares a generative model: draw a latent from a prior, then an image from a decoder
              distribution. Given an observed crop, its true posterior asks which latent values
              could have produced that crop. The encoder predicts a tractable approximate posterior
              instead. One shared encoder amortizes this inference across inputs rather than solving
              a separate optimization for every crop."
            targets:
              - vae-posterior-contract-trace
            color: cyan
            linger: 0.25
      - say: A diagonal Gaussian has independent coordinates conditional on this crop. That does not make
          the codes independent after mixing crops. For a separate supplied example, equally mix
          Gaussians centered at one, one and minus one, minus one, each with identity covariance.
          Within either crop the coordinates are independent. The combined covariance has diagonal
          two and off-diagonal one.
        hold: 0.6
        visual_cues:
          - id: vae-posterior-contract-1-build
            phrase: A diagonal Gaussian has independent coordinates conditional on this crop. That does not make
              the codes independent after mixing crops. For a separate supplied example, equally mix
              Gaussians centered at one, one and minus one, minus one, each with identity
              covariance. Within either crop the coordinates are independent. The combined
              covariance has diagonal two and off-diagonal one.
            targets:
              - vae-posterior-contract-trace
            color: cyan
            linger: 0.25
          - id: vae-posterior-contract-mixture
            phrase: The combined covariance has diagonal two and off-diagonal one.
            targets:
              - vae-posterior-contract-trace
            color: cyan
            linger: 0.25
      - say: "The encoder emits means and log variances. Exponentiate half a log variance for standard
          deviation; exponentiating the full value gives variance. Finite log variance does not
          guarantee a usable floating-point scale: exponentiation can underflow to zero or overflow
          to infinity. Check numerical values and gradients. Softplus is another positive
          parameterization, with its own finite-precision limits."
        hold: 0.6
        visual_cues:
          - id: vae-posterior-contract-2-build
            phrase: "The encoder emits means and log variances. Exponentiate half a log variance for standard
              deviation; exponentiating the full value gives variance. Finite log variance does not
              guarantee a usable floating-point scale: exponentiation can underflow to zero or
              overflow to infinity. Check numerical values and gradients. Softplus is another
              positive parameterization, with its own finite-precision limits."
            targets:
              - vae-posterior-contract-trace
            color: cyan
            linger: 0.25
  - id: kl-ledger
    title: Compute what prior mismatch charges
    visual: Retain mu[.4,-.2]/logvar[-.7,.1]. Construct each half(mu²+variance−1−logvariance) term
      independently and sum .17829265+.02258546=.20087811. Move mean-only and variance-only
      contributions against the same standard-normal reference; contrast nearzero terms and expm1
      stability.
    beats:
      - say: Kullback-Leibler divergence, or KL, measures how much this crop’s posterior differs
          from the prior. Each row compares one Gaussian coordinate with a standard normal.
          Square its mean, add its variance, subtract one, then subtract its log variance.
          Halve each row and add the rows together. That sum is the KL for one crop.
          For a batch, average the crop totals.
        hold: 0.6
        visual_cues:
          - id: vae-kl-ledger-0-build
            phrase: Square its mean, add its variance, subtract one, then subtract its log variance
            targets:
              - vae-kl-ledger-trace
            color: cyan
            linger: 0.25
      - say: Our two coordinate contributions are about point one seven eight three and point zero two two
          six, totaling point two zero zero nine nats. A mean of zero and variance one contributes
          zero. Moving a mean or changing a variance can increase the charge. For log variance near
          zero, the equivalent expression uses expm1 of log variance minus log variance to reduce
          cancellation.
        hold: 0.6
        visual_cues:
          - id: vae-kl-ledger-1-build
            phrase: Our two coordinate contributions are about point one seven eight three and point zero two
              two six, totaling point two zero zero nine nats. A mean of zero and variance one
              contributes zero. Moving a mean or changing a variance can increase the charge. For
              log variance near zero, the equivalent expression uses expm1 of log variance minus log
              variance to reduce cancellation.
            targets:
              - vae-kl-ledger-trace
            color: cyan
            linger: 0.25
          - id: vae-kl-ledger-sum
            phrase: Our two coordinate contributions are about point one seven eight three and point zero two
              two six, totaling point two zero zero nine nats.
            targets:
              - vae-kl-ledger-trace
            color: cyan
            linger: 0.25
      - say: The derivative of this analytic KL with respect to a mean is that mean. Its derivative with
          respect to log variance is one-half times the quantity variance minus one. Those analytic
          gradients are separate from reconstruction gradients flowing through a sampled code. Log
          both terms and check the reductions rather than interpreting a small total in isolation.
        hold: 0.6
        visual_cues:
          - id: vae-kl-ledger-2-build
            phrase: The derivative of this analytic KL with respect to a mean is that mean. Its derivative with
              respect to log variance is one-half times the quantity variance minus one. Those
              analytic gradients are separate from reconstruction gradients flowing through a
              sampled code. Log both terms and check the reductions rather than interpreting a small
              total in isolation.
            targets:
              - vae-kl-ledger-trace
            color: cyan
            linger: 0.25
  - id: sampling
    title: Freeze the noise and move the sample
    visual: A fixed noise point is scaled and shifted using measured word windows. Mean/scale
      interventions preserve the noise. A separate fixed prior point retains identity through the
      decoder and pixel construction.
    beats:
      - say: Draw independent standard-normal noise. Scale this fixed noise by the standard deviation, then
          add the mean. The resulting point is a posterior sample. The randomness entered through
          the noise; the transformation is differentiable in the encoder's outputs.
        visual_cues:
          - id: noise-scale
            phrase: Scale this fixed noise by the standard deviation
            targets:
              - reparameterized-point
            color: yellow
          - id: noise-shift
            phrase: then add the mean
            targets:
              - reparameterized-point
            color: yellow
        hold: 0.5
      - say: Keep the noise fixed and move the mean. The sample follows by the same amount. Change the scale
          and the fixed noise sets that movement. These derivatives let reconstruction gradients
          reach the encoder. That is reparameterization.
        visual_cues:
          - id: encoder-mean-b2-1
            phrase: move the mean
            targets:
              - encoder-mean
            color: cyan
          - id: encoder-scale-b2-2
            phrase: Change the scale
            targets:
              - encoder-scale
            color: green
        hold: 0.5
      - say: For generation, draw directly from the prior. Our fixed prior draw goes into the same
          hand-built decoder. Watch that exact point produce the displayed pattern. In a trained
          VAE, we inspect many prior draws to see whether this sampling route produces useful
          pictures.
        visual_cues:
          - id: prior-sample-point-b3-1
            phrase: Our fixed prior draw
            targets:
              - prior-sample-point
              - reparameterization-rule
            color: yellow
          - id: prior-decoded-output-b3-2
            phrase: Watch that exact point produce the displayed pattern
            targets:
              - prior-decoder
              - prior-decoded-output
            color: green
        hold: 0.5
  - id: gradient-path
    title: Keep the reconstruction gradient attached to the encoder
    visual: Use fixed epsilon as a stationary source. Route mean and exp(.5logvar) through scale/add
      into the decoder; annotate derivative1 and.5(z−mu). Flip only Normal.sample versus rsample to
      cut/reconnect reconstruction backward path while analyticKL branch remains. Separate identity
      toy z.8,w1.5,target.2 computes decodergradient.8.
    beats:
      - say: Reparameterization writes a draw as mean plus standard deviation times a parameter-free
          standard-normal noise value. Hold that noise fixed while differentiating. The sample’s
          derivative with respect to its mean is one. Its derivative with respect to log variance is
          one-half times standard deviation times noise, equivalently one-half times the quantity
          sample minus mean.
        hold: 0.6
        visual_cues:
          - id: vae-gradient-path-0-build
            phrase: Reparameterization writes a draw as mean plus standard deviation times a parameter-free
              standard-normal noise value. Hold that noise fixed while differentiating. The sample’s
              derivative with respect to its mean is one. Its derivative with respect to log
              variance is one-half times standard deviation times noise, equivalently one-half times
              the quantity sample minus mean.
            targets:
              - vae-gradient-path-trace
            color: cyan
            linger: 0.25
      - say: The actual PyTorch exercise compares Normal sample and rsample. Sample returns a detached draw;
          rsample keeps the reparameterized path. Detaching the draw blocks the reconstruction
          gradient into the encoder, while decoder weights can still receive gradients. An
          independently calculated analytic KL can still update the encoder. The exercise checks
          those separate routes on CPU.
        hold: 0.6
        visual_cues:
          - id: vae-gradient-path-1-build
            phrase: The actual PyTorch exercise compares Normal sample and rsample. Sample returns a detached
              draw; rsample keeps the reparameterized path. Detaching the draw blocks the
              reconstruction gradient into the encoder, while decoder weights can still receive
              gradients. An independently calculated analytic KL can still update the encoder. The
              exercise checks those separate routes on CPU.
            targets:
              - vae-gradient-path-trace
            color: cyan
            linger: 0.25
      - say: For a separate scalar decoder, let the output be weight times a supplied draw, and use half the
          squared difference from a target. The weight derivative is output minus target, multiplied
          by the draw. With draw point eight, weight one point five and target point two, the output
          is one point two and the weight gradient is point eight, even if the draw was detached.
        hold: 0.6
        visual_cues:
          - id: vae-gradient-path-2-build
            phrase: For a separate scalar decoder, let the output be weight times a supplied draw, and use half
              the squared difference from a target. The weight derivative is output minus target,
              multiplied by the draw. With draw point eight, weight one point five and target point
              two, the output is one point two and the weight gradient is point eight, even if the
              draw was detached.
            targets:
              - vae-gradient-path-trace
            color: cyan
            linger: 0.25
          - id: vae-gradient-path-decoder
            phrase: With draw point eight, weight one point five and target point two, the output is one point
              two and the weight gradient is point eight, even if the draw was detached.
            targets:
              - vae-gradient-path-trace
            color: cyan
            linger: 0.25
  - id: objective
    title: Give both jobs a place in the loss
    visual: Posterior mismatch constructs KL, a coefficient changes its actual ledger contribution, and
      the final reduction compares computed summed error with mean error before the Gaussian
      likelihood formula.
    beats:
      - say: Reconstruction asks the code to preserve the crop. Kullback-Leibler divergence, or KL,
          penalizes posterior mismatch from the prior. Match the means and variances and KL is zero.
          Move them away and the penalty grows. Its closed form sums the contributions from our two
          latent coordinates.
        visual_cues:
          - id: kl-mismatch
            phrase: Move them away and the penalty grows
            targets:
              - kl-ledger
            color: cyan
        hold: 0.5
      - say: Hold reconstruction fixed. Increase the KL coefficient and its contribution grows. During
          training, both terms can change. Log them separately so you can see the compromise.
        visual_cues:
          - id: beta-weight
            phrase: Increase the KL coefficient
            targets:
              - weighted-vae-objective
            color: yellow
        hold: 0.5
      - say: Our mean error divides the squared-error sum by the pixel count. For a Gaussian pixel
          likelihood, use the summed error divided by twice the observation variance, plus its
