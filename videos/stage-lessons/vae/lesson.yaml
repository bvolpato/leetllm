  - id: code-prior
    title: Learn how valid code sequences fit together
    visual: Carry selectedIDintoaspatiotemporalIDgrid,uniformpriortrainingcharge
      constantlogKandseparatelearnedautoregressiveprioroverIDs.
      ConstructvalidneighborpatternsversusrandomindependentIDs;displaycodeusagecountswithunusedentrywithoutclaimingposteriorKLcollapse.
    beats:
      - say: In the original VQ-VAE training formulation, the code prior is uniform and the discrete
          posterior selects one entry. Its KL contribution is a constant log K, so it does not drive
          the code assignment. After learning the representation, a separate autoregressive prior
          models the code patterns for generation. Independent random code IDs need not form
          combinations the decoder learned to use.
