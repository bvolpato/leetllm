  - id: contamination
    title: Changing a manifest leaves trained weights intact
    visual: A copied evaluation record enters a checkpoint, then a manifest deletion fails to remove its memorized response; a new independent source repairs the claim.
    beats:
      - say: Follow the article’s shared ticket one zero three. It appears in training and validation, so an identifier intersection catches direct reuse. A new identifier on copied text bypasses that exact check. Compare normalized text, near-duplicates and source provenance too, while keeping the original content for review.
        hold: 0.8
        visual_cues:
          - id: new-copy-id
            phrase: A new identifier on copied text
            targets:
              - copied-record
            linger: 0.5
      - say: Deleting the training-manifest row after training leaves the learned checkpoint unchanged. A new evaluation claim needs independent held-out material, or retraining without the exposure. Keep checkpoint-selection cases separate from the final test. Repeatedly choosing models from final-test feedback also weakens the intended generalization evidence.
        hold: 0.8
        visual_cues:
          - id: manifest-delete
            phrase: leaves the learned checkpoint unchanged
            targets:
              - trained-state
            linger: 0.5
      - say: Keep the same private tickets to track regressions. Add fresh challenge sources to test how the model handles unfamiliar text. A public test set can turn up in later training. Save its revision and release date alongside the checkpoint’s training history so you know which records to check for overlap.
        hold: 0.8
        visual_cues:
          - id: fresh-challenges
            phrase: fresh challenge sources
            targets:
              - source-holdout
            linger: 0.5
  - id: report
    title: A report carries the evidence behind its score
    visual: Loss/count ledger, domain rows and an audit link assemble a reproducible result; invalid rows visibly fail their own conditions.
    beats:
      - say: Could a teammate recover our cat sentence’s score from this report? Start with its total loss and the three words we scored. Divide, then exponentiate. There’s our two point nine two. To repeat the run, your teammate also needs the checkpoint, the corpus revision and the scoring settings. Link the overlap audit so they can inspect which text you checked.
        hold: 0.8
        visual_cues:
          - id: report-loss
            phrase: total loss and the three words we scored
            targets:
              - report-ledger
            linger: 0.5
          - id: report-recover
            phrase: our two point nine two
            caption_boundary: true
            targets: [report-ledger]
      - say: Check the count first. It takes a positive whole number of targets to form a mean. A flag, a fraction or a negative count signals a bad report. Zero targets leaves the mean undefined. A NaN flags a broken calculation. If the model gave the observed word zero probability, its loss really is infinite. If the loss is finite and only the exponential overflows, keep the loss. You can still compare it.
        hold: 0.8
        visual_cues:
          - id: runtime-values
            phrase: Check the count first
            targets:
              - bad-reports
            linger: 0.5
      - say: Report each domain separately. For a close race, score both checkpoints on each document and keep the loss totals and target counts together. To estimate uncertainty, resample independent documents. Here two documents share source A. Draw that source and both documents come along. That keeps related observations together each time you recompute the difference.
        hold: 0.8
        visual_cues:
          - id: resample-documents
            phrase: Draw that source and both documents come along
            targets:
              - group-sample
            linger: 0.5
      - say: A program can check an exact status or a source ID. To judge what a sentence claims, read it against the source. This job is queued. Answer A says it’s waiting. Answer B says it finished. Now swap the answers. A still agrees with the record. Does your judge still pick it? Try the same check with a wordier version, and compare the judge’s choices with independent human ratings.
        hold: 0.8
        visual_cues:
          - id: judge-order
            phrase: Now swap the answers
            targets:
              - judge-controls
            linger: 0.5
