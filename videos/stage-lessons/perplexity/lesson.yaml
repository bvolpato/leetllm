  - id: tokenizers
    title: Which model spent fewer bits on this line?
    visual: Two model rows hold the same fourteen bytes and their original total losses. Token boundaries give way to a common byte ruler. Converting both totals to bits reverses the order of the two displayed scores.
    beats:
      - say: Read “Rain falls now” with me. The first tokenizer cuts it into four pieces. The second cuts after every character, spaces included. That gives it fourteen targets. Both models get a beginning marker, so every byte on this short line counts. And every prefix fits.
        hold: 0.7
        visual_cues:
          - id: tokenizers-subword-cut
            phrase: the first tokenizer cuts it into four pieces
            targets: [tokenizers-subwords]
          - id: tokenizers-character-cut
            phrase: The second cuts after every character, spaces included
            targets: [tokenizers-characters]
      - say: To get a cost per token, divide each total loss by its own target count. Look how little one character seems to cost. Exponentiate those means. The scores come out to eight point one seven and one point nine zero. Your colleague circles the smaller number. Which model would you put first if both had to pay by the byte?
        hold: 2.2
        visual_cues:
          - id: token-means
            phrase: divide each total loss by its own target count
            targets: [comparison-values]
          - id: token-ppl
            phrase: The scores come out to eight point one seven and one point nine zero
            targets: [comparison-values]
            caption_boundary: true
      - say: Keep both loss totals. Use the same fourteen bytes for both rows. Divide each total by the natural log of two to get bits. Now divide both by fourteen. The subword model spent about point eight six six bits per byte. The character model spent about point nine two seven.
        hold: 1.2
        visual_cues:
          - id: shared-bytes
            phrase: Use the same fourteen bytes for both rows
            targets: [tokenizers-subwords, tokenizers-characters]
          - id: convert-bits
            phrase: Divide each total by the natural log of two to get bits
            targets: [comparison-totals]
          - id: subword-bpb
            phrase: The subword model spent about point eight six six bits per byte
            targets: [subword-value]
            caption_boundary: true
          - id: tokenizers-bpb
            phrase: The character model spent about point nine two seven
            targets: [comparison-values]
            caption_boundary: true
      - say: Fourteen small predictions made the character model look cheaper per token. Now both rows pay for the same letters and spaces. The subword model spent fewer bits on this line.
        hold: 3.5
        visual_cues:
