version: 1
id: perplexity
opening: lesson
title: Measuring a Model's Surprise
source: fundamentals/perplexity-language-model-evaluation/content.md
sources:
  - title: Hugging Face, Perplexity of fixed-length models
    url: https://huggingface.co/docs/transformers/en/perplexity
  - title: PyTorch CrossEntropyLoss target masking and reductions
    url: https://docs.pytorch.org/docs/stable/generated/torch.nn.CrossEntropyLoss.html
  - title: Salazar et al., Masked Language Model Scoring (ACL2020)
