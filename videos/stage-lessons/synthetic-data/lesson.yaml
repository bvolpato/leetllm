  - id: safe-preferences
    title: "What should the assistant learn to write?"
    visual: "Two one-line answers to the same support request differ in the field they log. Carry the verified answer into the chosen field and the supervised target."
    beats:
      - say: "To test a privacy boundary, generate a support request that asks to put a customer's email in a failed search log. The approved logging policy allows the request ID and keeps customer email addresses out of the log. Two proposed answers pick one field each. Which answer belongs in the training target?"
        hold: 2.2
        visual_cues:
          - id: log-policy
            phrase: "allows the request ID"
            targets: [policy]
            linger: 0.35
          - id: log-options
            phrase: "pick one field each"
            targets: [log-a, log-b]
            linger: 0.35
          - id: log-question
            phrase: "Which answer belongs in the training target"
            targets: [log-a, log-b]
            linger: 0.35
      - say: "Choose the request ID. Run each logging example on the same support event. A trusted check reads the field each one recorded. The first uses the permitted field. The second selects the customer email. Keep the same prompt with both answers in a preference record. The chosen answer rejects the request to bypass the logging rule. The rejected answer returns success after logging the email."
        hold: 0.8
        visual_cues:
          - id: log-winner
            phrase: "Choose the request ID"
            targets: [log-a]
            linger: 0.35
            caption_boundary: true
          - id: checked-fields
            phrase: "second selects the customer email"
            targets: [log-b]
            linger: 0.35
          - id: pair-fields
            phrase: "both answers in a preference record"
            targets: [log-a, log-b]
            linger: 0.35
          - id: safe-target
            phrase: "The chosen answer rejects the request to bypass the logging rule"
            targets: [log-a]
            caption_boundary: true
          - id: rejected-function-result
            phrase: "The rejected answer returns success after logging the email"
            targets: [log-b]
            caption_boundary: true
      - say: "For supervised fine-tuning, copy the chosen answer into the assistant's target. Leave the other answer in the rejected field of the comparison. A safe refusal can also be a desired answer. Create pairs by ranking samples or by changing one behavior in a verified answer. Here the lines have the same length in words, so a preference for longer prose can't explain the choice. Calibrate on human-reviewed boundary cases. A red-team tag helps count those cases. Isolate untrusted code before executing it."
        hold: 0.85
        visual_cues:
          - id: sft-copy
            phrase: "copy the chosen answer into the assistant's target"
            targets: [log-a, sft-output]
            linger: 0.35
          - id: keep-rejected
