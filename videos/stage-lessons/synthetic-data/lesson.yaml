  - id: recursive-tail
    title: "Can a rare search disappear in one round?"
    visual: A probability interval and eight explicit draws form a new pool; replacement fitted to that pool
      removes the rare interval.
    beats:
      - say: "Imagine drawing eight searches. In recursive training, one round generates examples for the next. On each independent draw, the chance of a retry case is five percent. That's the pink tip of the strip. What's the chance that all eight draws miss it?"
        hold: 2.4
        caption_starts: ["What's the chance"]
        visual_cues:
          - id: tail-predict
            phrase: "all eight draws miss it"
            targets:
              - recursive-tail-mechanism
            linger: 0.5
          - id: tail-premise
            phrase: "five percent"
            targets:
              - recursive-tail-mechanism
            linger: 0.5
      - say: "One draw misses the retry case with probability zero point nine five. For eight independent misses, multiply eight copies of that probability. That's about sixty-six percent, roughly two batches out of three."
        hold: 0.7
        caption_starts: ["For eight independent misses", "That's about sixty-six percent"]
        visual_cues:
          - id: miss-rule
            phrase: "One draw misses the retry case"
            targets:
              - recursive-tail-mechanism
            linger: 0.5
          - id: omission-answer
            phrase: "about sixty-six percent"
            targets:
              - recursive-tail-mechanism
            linger: 0.5
      - say: "Watch one batch fill. Each dot marks a draw on the strip. Follow it down into its slot. All eight landed in blue."
        hold: 1.5
        caption_starts: ["All eight landed in blue"]
        visual_cues:
          - id: sample-eight
            phrase: "Each dot marks a draw on the strip. Follow it down into its slot"
            targets:
              - recursive-tail-mechanism
            linger: 0.5
      - say: "This batch has zero retry cases. Replace the training data with this batch and fit its frequencies exactly. The new probability of a retry is zero. Every draw in the next round will be an ordinary search."
        hold: 0.7
        caption_starts: ["Replace the training data", "The new probability of a retry is zero"]
        visual_cues:
          - id: empirical-zero
            phrase: "zero retry cases"
            targets:
              - recursive-tail-mechanism
            linger: 0.5
          - id: replacement-zero
            phrase: "new probability of a retry is zero"
            targets:
              - recursive-tail-mechanism
            linger: 0.5
      - say: "Take a draw at point nine nine. In the original model it lands in pink. Follow it down to the new model. The same draw now lands in blue. Shumailov and colleagues studied this loss of rare cases across generations. Test retries separately. A high score on ordinary searches can hide the missing skill."
        hold: 0.7
        visual_cues:
          - id: tail-limit
            phrase: "Follow it down to the new model"
            targets:
              - recursive-tail-mechanism
            linger: 0.5
          - id: tail-toy-limit
            phrase: "Test retries separately"
            targets:
              - recursive-tail-mechanism
            linger: 0.5
