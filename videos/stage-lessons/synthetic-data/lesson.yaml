version: 1
id: synthetic-data
title: Build, Verify and Evaluate Synthetic Training Data
source: training/synthetic-data-generation-pipelines-llms/content.md
sources:
  - title: Wang et al. Self-Instruct
    url: https://arxiv.org/abs/2212.10560
  - title: Xu et al. WizardLM Evol-Instruct
    url: https://arxiv.org/abs/2304.12244
  - title: Shumailov et al. The Curse of Recursion
    url: https://arxiv.org/abs/2305.17493
  - title: Gerstgrasser et al. Accumulating Real and Synthetic Data
    url: https://arxiv.org/abs/2404.01413
  - title: Gunasekar et al. Textbooks Are All You Need
    url: https://arxiv.org/abs/2306.11644
  - title: The Llama 3 Herd of Models
    url: https://arxiv.org/abs/2407.21783
  - title: Orca explanation traces
    url: https://arxiv.org/abs/2306.02707
  - title: NeMo Data Designer September 2026 preprint
    url: https://arxiv.org/abs/2609.17699
  - title: Epoch conditional June 2024 data forecast
    url: https://arxiv.org/abs/2211.04325v2
scenes:
  - id: intro
    title: "Would you train on this answer?"
    visual: "A generated client prints names beside the search result. Follow the yellow cursor to page two and compare the missing name with the stopped output."
    beats:
      - say: "Ada and Grace. The generated client stops there. We asked it to fetch every name. See the yellow tab on the search result? That's a cursor for another page. Would you train on this answer?"
        hold: 2.5
        caption_starts: ["We asked it to fetch every name", "See the yellow tab", "Would you train on this answer"]
        visual_cues:
          - id: client-output
            phrase: "Ada and Grace"
            targets: [printed-names]
            linger: 0.35
          - id: client-stops
            phrase: "The generated client stops there"
            targets: [printed-names]
            linger: 0.35
          - id: page-token
            phrase: "yellow tab"
            targets: [returned-token]
            linger: 0.35
          - id: keep-question
            phrase: "Would you train on this answer"
            targets: [printed-names, returned-token]
            linger: 0.35
      - say: "Follow that cursor. There's Linus. His page has an empty cursor, so the list ends here. The client missed Linus. Keep its answer out of training."
        hold: 1.1
        caption_starts: ["His page has an empty cursor", "The client missed Linus"]
        visual_cues:
          - id: follow-token
            phrase: "Follow that cursor"
            targets: [next-page]
            linger: 0.35
          - id: last-name
            phrase: "There's Linus"
            targets: [next-page]
            linger: 0.35
            caption_boundary: true
          - id: end-token
            phrase: "an empty cursor"
            targets: [next-page]
            linger: 0.35
          - id: withhold-incomplete
            phrase: "Keep its answer out of training"
            targets: [printed-names]
            linger: 0.35
            caption_boundary: true
      - say: "Most of our reviewed searches end on the first page. Give a language model one reviewed search task and ask it to write a variation. This time the client must retry a request, then fetch another page. That new task and its answer are synthetic training data. How do we decide whether to use them?"
        hold: 0.8
        caption_starts: ["This time the client must retry", "That new task and its answer"]
        visual_cues:
          - id: missing-case
            phrase: "retry a request, then fetch another page"
            targets: [new-task]
            linger: 0.35
  - id: seed
    title: Keep the search task with its source
    visual: The reviewed search contract travels under one seed ID. Its generated descendants stay on the training side of a split made by seed family.
    beats:
      - say: "Keep the team's reviewed starting task. We'll call it seed S twelve. Its source is the search API documentation. Read the rule that would have caught the missing name. Follow each returned cursor until the service sends an empty one."
        hold: 0.8
        visual_cues:
          - { id: seed-name, phrase: "seed S twelve", targets: [seed-record] }
          - { id: seed-source, phrase: "the search API documentation", targets: [seed-record] }
          - { id: seed-cursor, phrase: "Follow each returned cursor", targets: [seed-rules] }
      - say: "The same contract caps each request at a hundred names. For a temporary rate limit, our fixture allows two retries of the same cursor. Put those rules beside the source, the pagination family and the specific behavior we want to practice. If a rule is wrong here, a generator can repeat it across a whole batch."
        hold: 0.8
        visual_cues:
          - { id: seed-limit, phrase: "a hundred names", targets: [seed-rules] }
          - { id: seed-retry, phrase: "two retries of the same cursor", targets: [seed-rules] }
          - { id: seed-slice, phrase: "specific behavior we want to practice", targets: [seed-record] }
      - say: "Assign the seed family to a split before generating variations. Here the family means S twelve and everything derived from it. This family goes into training. Its descendants keep the S twelve ID even if we change the prompt or the generator. Keep the reserved families separate. They can test the same skill with independently written searches. Later we'll check for copied wording across families."
        hold: 0.9
        visual_cues:
          - { id: family-split, phrase: "Assign the seed family to a split", targets: [training-family, reserved-family] }
          - { id: keep-lineage, phrase: "descendants keep the S twelve ID", targets: [training-family] }
          - { id: private-families, phrase: "Keep the reserved families separate", targets: [reserved-family] }
  - id: generate
    title: Ask for coverage that matters
    visual: One seed branches into distinct candidates for cursor termination, rate-limit recovery, and a tempting
      oversized page request.
    beats:
      - say: Prompt a generator with the reviewed seed and ask for a distinct edge case. Here it proposes empty-cursor
          termination, bounded retries after a rate limit, and a request for an oversized page. Ask the
          generator to state the expected behavior so reviewers can compare the candidate with the seed
          contract.
        hold: 0.55
        visual_cues:
          - id: generate-b1-1
            phrase: distinct edge case
            targets:
              - candidate-rows
            linger: 0.45
          - id: generate-b1-2
            phrase: expected behavior
            targets:
              - expected-behavior
            linger: 0.45
      - say: These candidates exercise different parts of the same client contract. A new sentence can still repeat an
          old task, so track coverage by behavior and difficulty alongside row counts.
        hold: 0.55
        visual_cues:
          - id: generate-b2-1
            phrase: coverage by behavior
            targets:
              - behavior-coverage
            linger: 0.45
      - say: Self-Instruct demonstrated instruction generation from a small human seed pool, followed by filtering for
          near-duplicates. Its recipe inspires this workflow; use its findings as context, then set scale and
          thresholds from our coverage tests. Measure coverage by task family; repetitive paraphrases inflate
          row counts without adding new skills.
        hold: 0.75
        visual_cues:
          - id: generate-b3-1
            phrase: task family
            targets:
              - behavior-coverage
            linger: 0.45
  - id: task-growth
    title: Construct a task pool from reviewed seeds
    visual: A persistent S12 seed expands into named task families; output-first class generation balances the
      requested classes.
    beats:
      - say: "Self-Instruct started with one hundred seventy-five human-authored tasks. Its prompts showed the generator eight existing tasks, typically six human-written and two model-generated. With repeated rounds of generation and filtering, the pool grew to fifty-two thousand four hundred forty-five instructions."
        hold: 0.7
        visual_cues:
          - id: task-demos
            phrase: eight existing tasks
            targets:
              - task-growth-mechanism
            linger: 0.5
          - id: task-total
            phrase: fifty-two thousand four hundred forty-five
            targets:
              - task-growth-mechanism
            linger: 0.5
          - id: task-demo-count
            phrase: six human-written and two model-generated
            targets:
              - task-growth-mechanism
            linger: 0.5
      - say: "A new instruction still needs examples. For a classification task, choose the class labels first. Ask the generator for an input belonging to each label. That gives a rare class a turn even when most of the obvious examples are positive. For other tasks, Self-Instruct generated the input first."
        hold: 0.7
        visual_cues:
          - id: output-first
            phrase: class labels first
            targets:
              - task-growth-mechanism
            linger: 0.5
          - id: labels-first
            phrase: class labels first
            targets:
              - task-growth-mechanism
            linger: 0.5
          - id: class-inputs
            phrase: an input belonging to each label
            targets:
              - task-growth-mechanism
            linger: 0.5
      - say: "How close is the new instruction to one already in the pool? Self-Instruct kept it only if its highest ROUGE-L similarity was below zero point seven. The authors also checked the generated instances. These filters helped keep repeated wording out of the growing pool."
        hold: 0.7
        caption_starts: ["Self-Instruct kept it"]
        visual_cues:
          - id: rouge-rule
            phrase: below zero point seven
            targets:
              - task-growth-mechanism
            linger: 0.5
          - id: rouge-cutoff
            phrase: below zero point seven
            targets:
              - task-growth-mechanism
            linger: 0.5
  - id: evolution
    title: Change the work a task requires
    visual: Keep the same API seed and progressively add an explicit retry clock, cursor recovery and verifiable
      ordering constraint.
    beats:
      - say: An in-depth Evol-Instruct rewrite makes an existing task more demanding. Its five styles add constraints,
          deepen a question, replace general concepts with concrete ones, add reasoning steps, or complicate
          the input. In-breadth evolution instead proposes another task. A synonym change may leave the
          required behavior identical.
        hold: 0.7
        visual_cues:
          - id: evolution-styles
            phrase: five styles
            targets:
              - evolution-mechanism
            linger: 0.5
          - id: depth-five
            phrase: five styles
            targets:
              - evolution-mechanism
            linger: 0.5
      - say: "Give the search client a deterministic clock so we can check how long it waits. Add a bounded retry schedule so we can count the attempts. Now require it to preserve the returned cursor after a rate limit. We can run a client against each of those requirements."
        hold: 0.7
        visual_cues:
          - id: evolution-task
            phrase: preserve the returned cursor
            targets:
              - evolution-mechanism
            linger: 0.5
          - id: clock-constraint
            phrase: deterministic clock
            targets:
              - evolution-mechanism
            linger: 0.5
          - id: retry-constraint
            phrase: bounded retry schedule
            targets:
              - evolution-mechanism
            linger: 0.5
          - id: cursor-constraint
            phrase: preserve the returned cursor
            targets:
              - evolution-mechanism
            linger: 0.5
      - say: "WizardLM screened rewrites for information gain, copied instructions, punctuation-only output, and short answers containing the word sorry. A correct safety refusal can also contain that word. Keep a valid refusal when it follows the policy for the request."
        hold: 0.7
        visual_cues:
          - id: refusal-keep
            phrase: correct safety refusal
            targets:
              - evolution-mechanism
            linger: 0.5
          - id: valid-refusal
            phrase: Keep a valid refusal
            targets:
              - evolution-mechanism
            linger: 0.5
  - id: verifier
    title: "What did each client collect?"
    visual: "Run both client functions on fresh copies of the fixture. Carry the returned cursor into the next request and accumulate the names actually delivered."
    beats:
      - say: "Run the retry client on our two-page search. The service allows up to a hundred names per request. The client may retry a rate-limited request twice. This time the first request gets a four twenty-nine. Watch what the client sends next."
        hold: 0.8
        visual_cues:
          - id: fixture-limit
            phrase: "a hundred names per request"
            targets: [contract]
            linger: 0.35
          - id: throttle-reply
            phrase: "gets a four twenty-nine"
            targets: [first-call]
            linger: 0.35
            caption_boundary: true
      - say: "It asks for the same page again. Ada and Grace come back. The service also sends page two as the next cursor. Which cursor belongs in the third request?"
        hold: 2.2
        visual_cues:
          - id: same-request
            phrase: "asks for the same page again"
            targets: [retry-call]
            linger: 0.35
          - id: page-one-names
            phrase: "Ada and Grace come back"
            targets: [retry-call]
            linger: 0.35
          - id: next-value
            phrase: "page two as the next cursor"
            targets: [retry-call]
            linger: 0.35
          - id: third-prediction
            phrase: "Which cursor belongs in the third request"
            targets: [third-call, retry-call]
            linger: 0.35
      - say: "It sends page two. Linus comes back with an empty next cursor. The client stops with all three names. It retried once, and each request stayed within the limit."
        hold: 0.95
        visual_cues:
          - id: third-input
            phrase: "It sends page two"
            targets: [third-call]
            linger: 0.35
            caption_boundary: true
          - id: third-response
            phrase: "Linus comes back with an empty next cursor"
            targets: [third-call]
            linger: 0.35
          - id: complete-client
            phrase: "stops with all three names"
            targets: [receipt]
            linger: 0.35
            caption_boundary: true
      - say: "Now run the other proposal on a fresh copy of that fixture. It asks for ten thousand names in one request. The service rejects that request at the page limit. The client collects zero names. Save this failing case. Before using generated code in production, isolate its execution and add trusted cases for timeouts and malformed replies."
        hold: 0.9
        visual_cues:
          - id: other-proposal
            phrase: "the other proposal"
            targets: [oversize-call]
            linger: 0.35
          - id: oversize-limit
            phrase: "ten thousand names in one request"
            targets: [oversize-call]
            linger: 0.35
          - id: oversize-status
            phrase: "rejects that request at the page limit"
            targets: [oversize-call]
            linger: 0.35
            caption_boundary: true
          - id: empty-result
            phrase: "collects zero names"
            targets: [receipt]
            linger: 0.35
            caption_boundary: true
  - id: execution-boundaries
    title: Keep the verifier independent of the candidate
    visual: A candidate changes its own assertion; trusted external pagination tests still reject the oversized
      request.
    beats:
      - say: A schema check establishes field shape, a static check inspects code, and a runtime test executes
          specified cases. A symbolic check can establish a property inside its formal model. Each has a different scope. The article checks a three-field JSON configuration for the exact page size, retry limit and cursor setting. A working client needs a different test. Our two-page search checks which cursor the client actually sends, how it retries and which names come back.
        hold: 0.7
        visual_cues:
          - id: verifier-scopes
            phrase: different scope
            targets:
              - execution-boundaries-mechanism
            linger: 0.5
          - id: scope-schema
            phrase: A schema check
            targets:
              - execution-boundaries-mechanism
            linger: 0.5
          - id: scope-static
            phrase: a static check
            targets:
              - execution-boundaries-mechanism
            linger: 0.5
          - id: scope-runtime
            phrase: a runtime test
            targets:
              - execution-boundaries-mechanism
            linger: 0.5
          - id: scope-symbolic
            phrase: A symbolic check
            targets:
              - execution-boundaries-mechanism
            linger: 0.5
      - say: If the generator weakens its own test from a page limit of one hundred to ten thousand, the rewritten
          test can pass the bad client. Preserve the independent contract and rerun trusted checks. Llama
          Three’s historical execution-feedback pipeline produced about one million coding dialogues; about
          twenty percent of solutions initially failed and were self-corrected. The model could revise the
          solution or its tests, and the report explicitly did not ensure complete correctness.
        hold: 0.7
        visual_cues:
          - id: independent-test
            phrase: independent contract
            targets:
              - execution-boundaries-mechanism
            linger: 0.5
          - id: edited-test
            phrase: weakens its own test
            targets:
              - execution-boundaries-mechanism
            linger: 0.5
          - id: edited-test-result
            phrase: "the rewritten test can pass the bad client"
            targets:
              - execution-boundaries-mechanism
            color: cyan
            linger: 0.5
          - id: trusted-failure
            phrase: "Preserve the independent contract and rerun trusted checks"
            targets:
              - execution-boundaries-mechanism
            linger: 0.5
          - id: llama-historical
            phrase: one million coding dialogues
            targets:
              - execution-boundaries-mechanism
            linger: 0.5
      - say: Phi One’s 2023 recipe combined about six billion filtered code-language tokens, under one billion
          synthetic textbook tokens and roughly one hundred eighty million exercise tokens. Its one point
          three billion parameter model reported HumanEval pass at one of fifty point six percent. Inventory
          differs from repeated training exposure, and the result does not isolate testing’s causal effect.
          Orca’s explanation-trace experiments likewise measured task outcomes; a long explanation is neither
          proof of validity nor a throughput result.
        hold: 0.7
        visual_cues:
          - id: historical-outcomes
            phrase: task outcomes
            targets:
              - execution-boundaries-mechanism
            linger: 0.5
          - id: phi-recipe
            phrase: six billion
            targets:
              - execution-boundaries-mechanism
            linger: 0.5
          - id: phi-score
            phrase: fifty point six percent
            targets:
              - execution-boundaries-mechanism
            linger: 0.5
          - id: orca-scope
            phrase: task outcomes
            targets:
              - execution-boundaries-mechanism
            linger: 0.5
  - id: overlap
    title: "Screen the wording of C5"
    visual: "Slide a five-word window over a generated instruction and a private evaluation task, then run the same screen on a paraphrase."
    beats:
      - say: "Suppose the client works. Could we train on its task if the same question is waiting on the exam? Here are the words a private screening service can see. It lowercases them and ignores punctuation. It looks up five consecutive words at a time. Start at the word please. If the window moves one word to the right, which word will be at its right edge?"
        hold: 2.3
        visual_cues:
          - id: window-start
            phrase: "Start at the word please"
            targets: [candidate-window]
            linger: 0.35
          - id: window-slide
            phrase: "moves one word to the right"
            targets: [candidate-window]
            linger: 0.35
          - id: span-question
            phrase: "which word will be at its right edge"
            targets: [reference-window, candidate-window]
            linger: 0.35
      - say: "Slide past please. The window starts at fetch and ends at the word the. That's five matching words. Slide it twice more. Both windows match as well. C five repeats the reserved task, so keep it out of training. Send the decision to the admission process. Keep the exam text out of generator prompts and feedback."
        hold: 0.85
        visual_cues:
          - { id: align-windows, phrase: "Slide past please", targets: [reference-window, candidate-window] }
          - { id: following-windows, phrase: "Slide it twice more", targets: [reference-window, candidate-window] }
          - id: span-hit
            phrase: "ends at the word the"
            targets: [reference-window, candidate-window]
            linger: 0.35
            caption_boundary: true
          - id: copy-outcome
            phrase: "keep it out of training"
            targets: [screen-receipt]
            linger: 0.35
            caption_boundary: true
      - say: "Read the next candidate. Use the cursor to read all remaining results. The same five-word screen finds zero matches. Both instructions still ask for every page. Use semantic retrieval to find paraphrases like this for review. Routine wording can also produce a match. Inspect it in context and record which index and rule you used."
        hold: 1
        visual_cues:
          - id: paraphrase-start
            phrase: "Read the next candidate"
            targets: [candidate-window]
            linger: 0.35
          - id: paraphrase-scan
            phrase: "Use the cursor to read all remaining results"
            targets: [candidate-window]
            linger: 0.35
          - id: no-shared-span
            phrase: "finds zero matches"
            targets: [screen-receipt]
            linger: 0.35
            caption_boundary: true
  - id: diversity
    title: Make the accepted set cover different tasks
    visual: Candidate embedding points enter a two-dimensional teaching map; a near-duplicate sits beside an
      accepted instruction while a distinct case remains separated.
    beats:
      - say: Duplicate wording is only one kind of repetition. Embeddings can flag candidates that occupy a crowded
          semantic neighborhood, leaving reviewers to judge whether the tasks truly add different coverage.
          The embedding model defines what counts as near; a new encoder version can move all candidates in
          the space. Compute cosine as the dot product divided by the product of both vector norms. Reject
          zero or nonfinite vectors before normalization.
        hold: 0.55
        visual_cues:
          - id: diversity-b1-1
            phrase: crowded semantic neighborhood
            targets:
              - seed-vector
            linger: 0.45
      - say: In this toy map, the new point nearly overlaps the existing pagination cluster, so the chosen threshold
          sends it to review. A distant point represents another task family and remains eligible.
        hold: 0.55
        visual_cues:
          - id: diversity-b2-1
            phrase: nearly overlaps
            targets:
              - seed-point
              - candidate-point
            linger: 0.45
      - say: "The vectors form a constructed teaching map. Cosine similarity measures their angle: the near copy
          points almost along the seed, while the new family points in a different direction. A reviewer still
          checks task meaning. Choose thresholds on reviewed examples and measure utility after training."
        hold: 0.75
        visual_cues:
          - id: diversity-b3-1
            phrase: Cosine similarity
            targets:
              - cosine-near
            linger: 0.45
          - id: diversity-b3-2
            phrase: different direction
            targets:
              - cosine-new
            linger: 0.45
  - id: judge
    title: Calibrate semantic review
    visual: Two candidate answers swap screen positions; the evaluator's probabilities are remapped to response
      identity before a preference is accepted.
    beats:
      - say: Some useful answers need semantic judgment after deterministic checks. A reviewer can compare which
          candidate follows the documentation and explains the pagination behavior clearly. Randomize
          candidate order during labeling and retain the original order to diagnose position effects.
        hold: 0.55
        visual_cues:
          - id: judge-b1-1
            phrase: candidate follows the documentation
            targets:
              - answer-a
            linger: 0.45
      - say: Now reverse the display order. If the judge follows the left position, remapping its choice reveals
          disagreement about the response itself and sends the pair to audit.
        hold: 0.55
        visual_cues:
          - id: judge-b2-1
            phrase: reverse the display order
            targets:
              - answer-a
              - answer-b
            linger: 0.45
          - id: judge-remap-result
            phrase: "remapping its choice reveals disagreement about the response itself and sends the pair to audit"
            targets:
              - remapped-probability
            color: cyan
            linger: 0.5
      - say: Agreement across orders measures stability, while independent references and human review test
          correctness. Use the task contract as the correctness reference alongside explanation quality and
          judge scores.
        hold: 0.75
        visual_cues:
          - id: judge-b3-1
            phrase: Agreement across orders
            targets:
              - remapped-probability
            linger: 0.45
  - id: evaluate
    title: "Which examples reach the training shard?"
    visual: "Six labeled rows cross five gates. Each stops on its first failure. The surviving row earns a training experiment."
    beats:
      - say: "Keep your eye on the six row IDs. First check the seed on each one. C six has no seed. Now screen the remaining tasks against the private index. C five repeats an exam question. Leave each row where it stopped so we can account for it."
        hold: 0.75
        visual_cues:
          - id: check-seed
            phrase: "First check the seed on each one. C six has no seed"
            targets: [candidate-admission]
            linger: 0.35
          - id: check-index
            phrase: "Now screen the remaining tasks against the private index. C five repeats an exam question"
            targets: [candidate-admission]
            linger: 0.35
      - say: "Run the four remaining clients. C four asks for ten thousand names and fails the page limit. Compare the survivors with the reference direction. C three is close enough to need duplicate review. Which two rows still need a judge?"
        hold: 2.15
        visual_cues:
          - id: check-client
            phrase: "Run the four remaining clients. C four asks for ten thousand names and fails the page limit"
            targets: [candidate-admission]
            linger: 0.35
          - id: check-novelty
            phrase: "Compare the survivors with the reference direction. C three is close enough to need duplicate review"
            targets: [candidate-admission]
            linger: 0.35
          - id: judge-queue
            phrase: "Which two rows still need a judge"
            targets: [admission-count]
            linger: 0.35
      - say: "C one and C two. Compare their answers in both display orders using the supplied votes. C two's winner changes when the order flips. C one's answer wins in both orders and passes the last gate. Put its retry example in the proposed training shard."
        hold: 0.95
        caption_starts: ["C one's answer wins", "Put its retry example"]
        visual_cues:
          - id: compare-orders
            phrase: "Compare their answers in both display orders using the supplied votes"
            targets: [candidate-admission]
            linger: 0.35
          - id: unstable-winner
            phrase: "C two's winner changes when the order flips"
            targets: [candidate-admission]
            linger: 0.35
            caption_boundary: true
          - id: accept-retry
            phrase: "passes the last gate"
            targets: [candidate-admission]
            linger: 0.35
            caption_boundary: true
          - id: enter-shard
            phrase: "proposed training shard"
            targets: [admission-count]
            linger: 0.35
  - id: admission-economics
    title: Which rows reach the next check?
    visual: Count two-order judge requests and compare overall agreement with false admissions. Replay the same novelty decision after the judge withholds its blocking reference.
    beats:
      - say: The first four checks send just two candidates to the judge. Each comparison uses two display orders. That would take four requests. Sending all six would take twelve before retries. That would save two thirds of the judge requests. These votes are supplied. Four real calls can still cost different amounts if the answers are longer or a request needs a retry. Measure the work each gate costs and how many rows it stops.
        hold: 0.7
        visual_cues:
          - id: gate-cost
            phrase: four requests
            targets:
              - admission-economics-mechanism
            linger: 0.5
          - id: two-judged
            phrase: two candidates to the judge
            targets:
              - admission-economics-mechanism
            linger: 0.5
          - id: four-calls
            phrase: four requests
            targets:
              - admission-economics-mechanism
            linger: 0.5
          - id: twelve-calls
            phrase: twelve
            targets:
              - admission-economics-mechanism
            linger: 0.5
      - say: A judge that approves all ninety-eight good and two bad reviewed rows agrees with reviewers on
          ninety-eight percent, yet admits both bad rows. Its observed false-admission rate within the bad
          class is two out of two. Report class and slice denominators with uncertainty. Order stability
          measures whether the named winner survives reversal, not whether that winner is correct.
        hold: 0.7
        visual_cues:
          - id: bad-class
            phrase: two out of two
            targets:
              - admission-economics-mechanism
            linger: 0.5
          - id: bad-denominator
            phrase: two out of two
            targets:
              - admission-economics-mechanism
            linger: 0.5
      - say: "Does C add a distinct task? Compare its direction with the directions already in the accepted pool. In this example the cutoff is point eight two. B clears the cutoff against the two original references. Its other checks pass, so B joins the pool. Now compare C with B. Their directions almost coincide. Under this rule C stops at the diversity check. Two workers checking yesterday's pool could miss that match. Coordinate their updates or check for duplicates again at the end."
        hold: 1
        visual_cues:
          - { id: pool-rule, phrase: "the cutoff is point eight two", targets: [pool-scale] }
          - { id: pool-b-admitted, phrase: "B joins the pool", targets: [pool-members], caption_boundary: true }
          - { id: pool-c, phrase: "compare C with B", targets: [pool-scale] }
          - { id: pool-c-rejected, phrase: "C stops at the diversity check", targets: [pool-decision], caption_boundary: true }
      - say: "Replay those same two proposals. Change just the judge decision for B. Its winner flips when the answers swap places, so B is withheld. The policy lets only finally accepted rows serve as references. C was set aside solely for looking like B. Which references should decide C's next comparison?"
        hold: 2.5
        visual_cues:
          - { id: pool-replay, phrase: "Replay those same two proposals", targets: [pool-members] }
          - { id: pool-vote-change, phrase: "Its winner flips when the answers swap places", targets: [pool-members] }
          - { id: pool-withhold, phrase: "B is withheld", targets: [pool-members], caption_boundary: true }
          - { id: pool-question, phrase: "Which references should decide", targets: [pool-members, pool-scale] }
      - say: "Use the two original references. With B out of the pool, C's closest match drops below the cutoff. Now C reaches the judge. Its own winner stays the same in both orders, so this time C joins the pool. Rechecking novelty gave C another chance. It still had to pass its own remaining check."
        hold: 1.2
        visual_cues:
          - { id: pool-recheck, phrase: "Use the two original references", targets: [pool-members], caption_boundary: true }
