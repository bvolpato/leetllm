            color: yellow
      - say: Time preprocessing, queueing and accelerator execution separately. In this second trace one
          worker prepares the next request while the accelerator runs the first. A worker pool can
          give us that overlap, at the cost of scheduling, transfers and memory. Look at the slow
          requests as well as the median. Long-running pauses can also come from allocation or
          cyclic garbage collection. Measure those pauses before changing policy. In CPython,
          disabling automatic cyclic collection leaves reference counting active. Unreachable
          objects that still refer to each other can accumulate.
        hold: 0.7
        visual_cues:
