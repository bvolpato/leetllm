  - id: top-k
    title: Which score sets the cutoff?
    visual: The exact scan feeds two heap slots. In a seven-slot example the first replacement travels down two levels. The next replacement stays at the root. The original matrix and its memory bill return.
    beats:
      - say: Run the four-note scan again, keeping two citation slots beside it. Let the first two arrive.
          Each finished row supplies a score. Put the weaker winner at the root, where the next note
          can reach it. A bounded min-heap keeps the strongest entries seen so far that way. Score
          the issuer note. Its row is paid for now. Which entry should give up its slot?
        hold: 1.9
        visual_cues:
          - id: heap-first
            phrase: Let the first two arrive
            targets:
              - heap-work
            color: cyan
            linger: 0.2
          - id: heap-third
            targets:
              - heap-third
            color: yellow
            phrase: Score the issuer note
      - say: The issuer note reaches the root and replaces the runner-clock note. The fixture stays. Score
          the release checklist. A tenth is below the new cutoff, so the heap stays unchanged. The
          two survivors are the same ones a full sort would return. A full sort would also order the
          two we threw away.
        hold: 0.65
        visual_cues:
          - id: heap-replace
            phrase: The issuer note reaches the root and replaces the runner-clock note
            targets:
              - heap-work
            color: yellow
            linger: 0.2
          - id: heap-fourth
            targets:
              - heap-fourth
            color: yellow
            phrase: Score the release checklist
          - id: heap-reject
            phrase: the heap stays unchanged
            targets:
              - heap-work
            color: pink
            linger: 0.2
      - say: Try a seven-slot heap. The cutoff is one tenth. A score of point eight takes the root.
          Look at its children. The weaker child belongs above point eight, so swap those two. Compare
          again one level down. Swap with the weaker child there too. At a leaf, the repair stops. It
          followed one parent-child path.
        hold: 0.6
        visual_cues:
          - id: heap-larger
            phrase: Try a seven-slot heap
            targets: [heap-larger]
          - id: heap-new-root
            phrase: A score of point eight takes the root
            targets: [heap-repair]
          - id: heap-children
            phrase: Look at its children
            targets: [heap-repair]
          - id: heap-swap
            phrase: swap those two
            targets: [heap-repair]
          - id: heap-lower
            phrase: Swap with the weaker child there too
            targets: [heap-repair]
          - id: heap-path
            phrase: one parent-child path
            targets: [heap-path]
      - say: Keep that tree. Here comes a score of point two five. It beats the new cutoff, so put it
          at the root. Does this replacement have to move?
        hold: 2
        visual_cues:
          - id: heap-next
            phrase: Here comes a score of point two five
            targets: [heap-repair]
          - id: heap-next-root
            phrase: put it at the root
            targets: [heap-repair]
      - say: It can stay. Even its weaker child, point three, scores higher. After a replacement,
          compare with the weakest child that exists. Swap only if that child is weaker than the
          replacement. With one child, check that one. Stop as soon as the order holds or you reach a
          leaf. The height grows logarithmically with k. For k between two and n, selection takes at
          most order n log k work, including ordering the final winners. For one winner, keep a
          running maximum.
        hold: 0.65
        visual_cues:
          - id: heap-stays
            phrase: Even its weaker child, point three, scores higher
            targets: [heap-repair]
          - id: heap-height
            phrase: The height grows logarithmically with k
            targets: [heap-storage]
      - say: Return to our four scores. The coordinate counter remains unchanged by selection. At fifty
          thousand notes with seven hundred sixty-eight coordinates each, that's thirty-eight point
          four million multiplies, even if we keep only two citations. The resident matrix also
          holds that many values. Beyond the resident matrix, a streaming scan keeps a query, the
          score-and-ID winners, a running sum and indices. With fixed-size IDs and scores, that is O
          of d plus k extra storage. The heap holds k entries when full. We can discard every other
          score as it arrives.
        hold: 0.8
        visual_cues:
          - id: heap-bill
            phrase: coordinate counter remains unchanged
