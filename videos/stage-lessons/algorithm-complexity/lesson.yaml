    title: When can this request start?
    visual: One request waits on a millisecond ruler. Replaying its first ten milliseconds opens a
      partial batch. A busy executor moves its start to thirty. A separate trace shows preparation
      overlapping another request's execution.
    beats:
      - say: The arithmetic may fit while the engineer is still waiting. On this example clock, request one
          arrives at zero. Request two arrives forty milliseconds later. A worker waiting for eight
          arrivals still has no full batch. Replay the same arrivals with a ten-millisecond batch
          timer. When can the first request leave batch formation?
