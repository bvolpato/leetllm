scenes:
  - id: opening
    title: Why did the login test fail?
    visual: A stack of four authorized notes opens on the sentence in note A. Each search word is checked
      against the printed sentence. The stack gives way to the four-row word table as the scan continues.
    beats:
      - say: Find login on the top note. Test sits right beside it. Does the note say fail?
        hold: 1.5
        visual_cues:
          - id: opening-terms
            phrase: Find login
            targets: [passage-work]
          - id: opening-test
            phrase: Test sits right beside it
            targets: [passage-work]
          - id: opening-fail
            phrase: Does the note say fail
            targets: [passage-work]
        caption_starts:
          - Test sits right beside it
          - Does the note say fail
      - say: It's missing. Two of the three search words match. Could another note match all three?
        hold: 1.8
        visual_cues:
          - id: opening-missing
            phrase: It's missing
            targets: [passage-work]
          - id: opening-match
            phrase: Two of the three search words match
            targets: [comparison]
        caption_starts:
          - Could another note match all three
      - say: Read the remaining notes. The runner clock matches test. The last two notes match none of the
          words. Even a row of zeros costs one visit. Four notes, four visits. Counting word matches is
          our search algorithm. Its complexity tells us how the work or memory it needs grows as we add
          notes.
        hold: 0.7
        visual_cues:
          - id: opening-rest
            phrase: Read the remaining notes
            targets: [scan-work]
          - id: opening-clock
            phrase: The runner clock matches test
            targets: [scan-work]
          - id: opening-zero
            phrase: The last two notes match none of the words
            targets: [scan-work]
          - id: opening-result
            phrase: Four notes, four visits
            targets: [scan-work]
        caption_starts:
          - The runner clock matches test
          - The last two notes match none of the words
  - id: scan
    title: What does one more note cost?
    visual: The scan visits both copies of the four-row table. Only four notes have a hit. Two pairs become sorted runs, and the leading note of each run competes for the next output slot.
    beats:
      - say: Keep those rows and add four more, copies of the first four. Same question, same three words.
          How many notes will the next scan visit?
        hold: 1.8
        visual_cues:
          - id: scan-double
            phrase: add four more
            targets:
              - scan-work
            color: cyan
            linger: 0.1
      - say: Let the second scan visit the rows one at a time. A row of zeros still took a visit. Here twice
          the input produces twice this work. Call the number of notes n. Theta of n names that
          tight growth shape. Big O gives an upper bound on growth, ignoring constant factors. O of
          n fits this scan too.
        hold: 0.5
        visual_cues:
          - id: scan-visits
            phrase: Let the second scan visit the rows one at a time
            targets:
              - scan-work
            color: yellow
            linger: 0.2
          - id: scan-linear
            phrase: twice the input produces twice this work
            targets:
              - scan-bound
            color: green
            linger: 0.2
          - id: scan-notation
            phrase: Theta of n names that tight growth shape
            targets:
              - scan-bound
            color: yellow
            linger: 0.2
      - say: With passage length bounded, each note takes bounded work. Sixteen notes give sixteen visits.
          Thirty-two give thirty-two. You could write the three word tests as a loop inside the
          scan, but a fixed inner loop adds the same strip of work to every row. If passage length
          can grow, count the words you read as well.
        hold: 0.45
        visual_cues:
          - id: scan-growth16
            phrase: With passage length bounded
            targets:
              - growth
            color: yellow
          - id: scan-growth32
            phrase: Thirty-two give thirty-two
            targets:
              - growth
            color: yellow
          - id: scan-inner
            phrase: a fixed inner loop adds the same strip of work to every row
            targets:
              - scan-inner-work
            color: cyan
            linger: 0.3
      - say: Sorting the matching notes is another job. Keep the four notes with at least one hit.
          Compare the scores in each pair and put the higher score first. Now merge the two pairs.
          Take the higher score at the front of either row. On a tie, take the earlier note. Which
          note comes after A?
        hold: 2
        visual_cues:
          - id: scan-sort
            phrase: Sorting the matching notes
            targets: [growth]
          - id: scan-runs
            phrase: Compare the scores in each pair
            targets: [growth]
          - id: scan-first-winner
            phrase: On a tie, take the earlier note
            targets: [growth]
      - say: The other fixture note has two hits. It goes ahead of both runner notes. Finish the
          merge. This is merge sort. Call the number of matches r. Each level handles all r notes
          once, and the run length doubles at each level. That gives at most order r log r score
          comparisons. With bounded comparison cost, the sort takes at most order r log r time. If
          every note matches, r equals n. Scanning and sorting together can then take order n log n
          time.
        hold: 0.7
        visual_cues:
          - id: scan-next-winner
            phrase: The other fixture note has two hits
            targets: [growth]
          - id: scan-finish-merge
            phrase: Finish the merge
            targets: [growth]
          - id: scan-levels
            phrase: Each level handles all r notes once
            targets: [growth]
          - id: scan-sort-bound
            phrase: at most order r log r time
            targets: [scan-bound]
  - id: ordered-search
    title: Where is issuer-check in the catalog?
    visual: A midpoint dot narrows a half-open interval. A second search pauses with index zero still
      unread. Inserting a new key then shifts the five references above its insertion point.
    beats:
      - say: Suppose the engineer already knows the note's ID, issuer-check. The catalog is in alphabetical
          order. Number the slots from zero. The lower bound includes its slot. The upper bound sits
          just past the last possible slot. Inspect the middle key. Add the two bounds, divide by
          two, and round down. At four we find release-guide. Issuer comes earlier, so four becomes
          the upper bound.
        hold: 0.4
        visual_cues:
          - id: binary-first
            phrase: Inspect the middle key
            targets:
              - binary-work
            color: yellow
            linger: 0.1
      - say: Repeat on the smaller range. Docs-index comes too early. The next lower bound is its index plus
          one. Check the surviving key. There's issuer-check. Return when the keys are equal. If the
          bounds meet while we're still searching, the key is missing.
        hold: 0.45
        visual_cues:
          - id: binary-rest
            phrase: Repeat on the smaller range
            targets:
              - binary-work
            color: cyan
            linger: 0.3
          - id: binary-last
            targets:
              - binary-last
            color: yellow
            phrase: Check the surviving key
      - say: Discarding about half the range each time gives logarithmic lookup work with random access and
          bounded key comparisons. To find index zero in eight items, the first three midpoints are
          four, two, one. Now there's only one possible slot. Have we read its key?
        hold: 1.8
        visual_cues:
          - id: binary-bound
            phrase: logarithmic lookup work
            targets:
              - binary-bound
            color: green
            linger: 0.2
          - id: binary-replay
            phrase: To find index zero in eight items
            targets:
              - catalog
            color: yellow
          - id: binary-narrow
            phrase: Now there's only one possible slot
            targets:
              - catalog
            color: yellow
      - say: Read slot zero. That's the fourth midpoint check. A catalog twice as large adds just one check
          on that path. Applying both equality and ordering at one slot still counts as one visited
          midpoint. Keep the catalog sorted between requests. If an identity-provider guide arrives,
          later references must move to make room. Slip the new key into slot three. A middle
          insertion into this array can move a linear number of references.
        hold: 0.7
        visual_cues:
          - id: binary-final-key
            targets:
              - binary-final-key
            color: yellow
            phrase: Read slot zero
          - id: binary-insert
            phrase: later references must move to make room
            targets:
              - binary-work
            color: yellow
            linger: 0.3
          - id: binary-new
            phrase: Slip the new key into slot three
            targets:
              - catalog
            color: yellow
        caption_starts:
          - That's the fourth midpoint check
  - id: hash-lookup
    title: Where does an exact key land?
    visual: The issuer key travels to its bucket. In a second table every key lands in the same chain,
      and a missing lookup checks all four.
    beats:
      - say: We still have the ID in hand. Here the table adds up the character codes and takes the
          remainder after division by eight. Follow issuer-check to its bucket, then compare the
          stored key for equality. That's a hash lookup. With a good spread and a controlled load,
          the expected number of probes stays constant.
        hold: 0.5
        visual_cues:
          - id: hash-route
            phrase: Follow issuer-check to its bucket
            targets:
              - hash-work
            color: cyan
            linger: 0.2
          - id: hash-equality
            phrase: compare the stored key for equality
            targets:
              - hash-work
            color: yellow
            linger: 0.2
      - say: Force every key into one bucket, then look up missing-login-note. A bucket address got us to
          the chain. To rule out a match, the search checks each stored key. In this worst case the
          probe count grows linearly with n. The hash function also reads each character in the key, so longer keys take more work.
        hold: 0.65
        visual_cues:
          - id: hash-collide
            phrase: Force every key into one bucket
            targets:
              - hash-work
            color: pink
            linger: 0.1
          - id: hash-missing
