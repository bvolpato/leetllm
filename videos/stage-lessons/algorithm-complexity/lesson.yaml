            color: yellow
  - id: unique-pairs
    title: How many partners does the next note have?
    visual: One side of the grid accumulates unordered pairs. A replay follows two indices through the first row of that grid, reuses a distance sum and sends a flagged pair downstream. A separate exact-text pass remembers the keys it has seen.
    beats:
      - say: To find similar notes, compare A with B. Comparing B with A checks the same unordered pair.
          Each note also matches itself, so skip the diagonal. Count each pair once. Four notes make six
          pairs. Here comes E. How many new pairs does it add?
        hold: 2
        visual_cues:
