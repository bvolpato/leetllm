            phrase: still has no full batch
            targets:
              - batch-wait
            color: yellow
      - say: The timer releases the partial batch ten milliseconds after the first arrival. Now watch the
          execution lane. If the executor is already busy until thirty, request one waits another
          twenty milliseconds after the timer fires. The timer controls how long this scheduler
          tries to fill the batch. It's only one part of the user's wait.
        hold: 0.7
        visual_cues:
          - id: batch-timeout
            phrase: The timer releases the partial batch ten milliseconds after the first arrival
            targets:
              - batch-formation
            color: yellow
