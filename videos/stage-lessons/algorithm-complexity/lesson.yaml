            phrase: Compute fresh keys and values for eight
            targets: [prefix-state]
  - id: amortized-append
    title: Who pays when the array fills?
    visual: Two occupied slots lead to a new block. The old references move before the new reference
      arrives. The write ledger charges each copy and each insertion to the arrival that caused it.
    beats:
      - say: Another note arrives. We keep references to the notes in an array, and both slots are
          occupied. Allocate four slots. In this trace we copy the two old references first, then
          write the third reference into the new block. Three writes for one arrival. Look at the next
          free slot. How many writes will reference four need?
        hold: 1.8
        visual_cues:
          - id: append-resize
            phrase: Allocate four slots
            targets: [append-work]
          - id: append-copy
            phrase: copy the two old references first
            targets: [append-work]
          - id: append-write
            phrase: write the third reference into the new block
            targets: [append-write]
      - say: Write reference four. It fits in the same block, so one write finishes the job.
        hold: 0.65
        visual_cues:
          - id: append-fourth
            targets:
              - append-fourth
            color: yellow
            phrase: Write reference four
      - say: Reference five needs a bigger block again. Continue the same doubling rule until the array
          holds eight references. Add every write to the running total. Eight were for the arrivals
          themselves. The rest were copies, first of two old references, then of four. Over a long
          run those powers of two add up to linear total work. That's constant amortized cost per
          append. A single resize can still cost linear work. The doubling rule gives that bound for any sequence of arrivals. The hash table's expected cost depends on how the keys spread.
        hold: 0.8
        visual_cues:
          - id: append-sequence
            phrase: Continue the same doubling rule until the array holds eight references
            targets:
              - append-work
            color: cyan
            linger: 0.2
          - id: append-total
            phrase: Add every write to the running total
            targets:
              - append-total
            color: yellow
            linger: 0.2
          - id: append-bound
            phrase: constant amortized cost per append
            targets:
              - append-total
            color: green
            linger: 0.3
