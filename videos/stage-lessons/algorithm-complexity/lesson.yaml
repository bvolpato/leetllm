            color: pink
            linger: 0.2
  - id: radix-prefix
    title: How often do we read the same prefix?
    visual: After the four-word scan, the first p selects the compressed edge. Its three letters light up
      as the lookup checks the label. The four suffixes appear after the match. The example transfers
      to three equal token IDs and one different suffix.
    beats:
      - say: Try a different lookup. We'd like all the words here that start with the letters p, l, a. They
          share the prefix pla. Starting over at p for each word costs three letter checks per word.
          Follow those repeated comparisons from the first letter to the last letter of the prefix.
          Twelve checks, just to read the same beginning four times.
        hold: 0.6
        visual_cues:
          - id: prefix-query
            phrase: They share the prefix pla
            targets:
              - prefix-query
            color: cyan
            linger: 0.1
          - id: prefix-scan
            phrase: Follow those repeated comparisons
            targets:
              - prefix-words
              - prefix-scan
            color: yellow
            linger: 0.2
          - id: prefix-total
            phrase: Twelve checks
            targets:
              - prefix-scan
            color: yellow
      - say: A trie shares the path for those letters. A radix tree keeps the shared run pla once in a
          compressed edge. One check on p selects the edge. Now compare its label with the query,
          starting again at p, then l, then a. That's three more checks. From here, take y, ce, net,
          or za to finish each word. Returning those four completions has its own output cost.
          With expected constant-time child lookups, reaching a matched prefix of length p takes
          order p plus one work, including the check for a missing branch.
        hold: 0.6
        visual_cues:
          - id: prefix-edge
            phrase: shared run pla once in a compressed edge
            targets:
              - prefix-tree
            color: cyan
            linger: 0.1
          - id: prefix-select
            phrase: One check on p selects the edge
            targets: [prefix-tree, prefix-count]
            color: cyan
          - id: prefix-walk-p
            phrase: starting again at p
            targets: [prefix-tree, prefix-count]
            color: yellow
          - id: prefix-walk-l
            phrase: then l
            targets: [prefix-tree, prefix-count]
            color: yellow
          - id: prefix-walk-a
            phrase: then a
            targets:
              - prefix-tree
              - prefix-count
            color: yellow
          - id: prefix-branch
            phrase: take y, ce, net, or za
            targets:
              - prefix-tree
            color: green
            linger: 0.1
          - id: prefix-count
            phrase: Returning those four completions
            targets:
              - prefix-count
            color: yellow
            linger: 0.2
          - id: prefix-output
            phrase: With expected constant-time child lookups
            targets:
              - prefix-state
            color: yellow
      - say: Say we wanted similar meaning instead. An HNSW index follows a graph to find approximate
          nearest neighbors among embedding vectors. Watch where the search starts and where the
          query sits. Each hop uses distance in that space. A prefix lookup needs something we can
          check symbol by symbol.
        hold: 0.5
        visual_cues:
          - id: prefix-neighbors
            phrase: follows a graph to find approximate nearest neighbors among embedding vectors
            targets:
              - prefix-state
      - say: Try the same lookup on token IDs. The first three match. At the fourth token, the stored
          request has ninety-nine and the new one has eight. Here the model, adapter, positions, other
          inputs, and cache scope all match. Reuse the cached keys and values for the first three tokens.
          Compute fresh keys and values for eight.
        hold: 0.7
        visual_cues:
          - id: prefix-token
            phrase: Try the same lookup on token IDs
            targets: [prefix-state]
          - id: prefix-matches
            phrase: The first three match
            targets: [prefix-state]
          - id: prefix-diverges
            phrase: At the fourth token
            targets: [prefix-state]
          - id: prefix-compatible
            phrase: Here the model, adapter, positions, other inputs, and cache scope all match
            targets: [prefix-state]
          - id: prefix-reuse
            phrase: Reuse the cached keys and values for the first three tokens
            targets: [prefix-state]
