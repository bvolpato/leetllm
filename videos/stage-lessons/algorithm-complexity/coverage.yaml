version: 1
lesson: algorithm-complexity
promise: Count the growing work and memory of scans, exact and prefix lookup, vector
  scoring, selection, pairs and attention, then choose a measured retrieval shortcut
  without losing authority or required evidence.
framing: []
objectives:
  - id: opening
    can: Count the notes inspected and decide what two word matches establish about an expired session.
    scenes:
      - opening
  - id: scan
    can: Count visits to bounded-length notes, then trace the separate merge sort over the matching notes.
    scenes:
      - scan
  - id: ordered-search
    can: Trace midpoint comparisons and array insertion shifts.
    scenes:
      - ordered-search
  - id: hash-lookup
    can: Compute a hash bucket and distinguish collisions from normal lookup.
    scenes:
      - hash-lookup
  - id: radix-prefix
    can: Count the checks that select an edge and match its label, then account for the completions returned.
    scenes:
      - radix-prefix
  - id: amortized-append
    can: Distinguish copies from new writes and predict the next append cost from the free slots.
    scenes:
      - amortized-append
  - id: vector-score
    can: Count coordinate products before scaling n and d.
    scenes:
      - vector-score
  - id: top-k
    can: Decide whether an incoming score displaces the weakest winner, where its heap repair stops, and which scoring costs remain.
    scenes:
      - top-k
  - id: unique-pairs
    can: Count unordered pairs, distinguish streamed flags from retained pairs, and choose a hash set when the task requires exact equality.
    scenes:
      - unique-pairs
  - id: attention
    can: Count dense prefill positions and consumed-input decode reads.
    scenes:
      - attention
  - id: cache-volume
    can: Compute raw key/value storage and grouped query sharing.
    scenes:
      - cache-volume
  - id: queue-measurement
    can: Separate batch formation, executor queueing and execution time.
    scenes:
      - queue-measurement
  - id: work-budget
    can: Count the rows in the requested project that the caller can read, then decide whether scoring them fits the product budget.
    scenes:
      - work-budget
  - id: shortlist-payoff
    can: Trace which note the third read displaces, use the offline top two to decide whether a fourth read improves recall, and identify what evidence would confirm the proposed cause.
    scenes:
      - shortlist-payoff
