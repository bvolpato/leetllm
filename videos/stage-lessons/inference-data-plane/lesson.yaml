  - id: route-compatible
    title: Choose a compatible destination
    visual: Three workers publish their layout and available capacity. Two eligible routes then race on one clock with different link rates and amounts of reusable state.
    beats:
      - say: |
          The router needs more than a free worker address. The destination must understand the model revision, tensor layout, data type, parallel partition, and cache-block representation carried by the source.
        visual_cues:
          - id: route-address
            phrase: "more than a free worker address"
            targets:
              - picture
          - id: route-model
            phrase: "the model revision"
            targets:
              - picture
          - id: route-layout
            phrase: "tensor layout"
            targets:
              - picture
          - id: route-dtype
            phrase: "data type"
            targets:
              - picture
          - id: route-partition
            phrase: "parallel partition"
            targets:
              - picture
          - id: route-blocks
            phrase: "cache-block representation"
            targets:
              - picture
        hold: 0.55
      - say: |
          Compare the prefill receipt with each worker's published runtime metadata. Worker A matches the model and layout and has room for the request. Worker B has a different layout, so the router leaves it out of this handoff.
        caption_starts:
          - "matches the model and layout"
          - "has room for the request"
          - "different layout"
        visual_cues:
          - id: route-compare
            phrase: "Compare the prefill receipt"
