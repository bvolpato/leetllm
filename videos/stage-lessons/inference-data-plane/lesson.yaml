      - say: Ideal two-rank KV-head sharding gives one point two five gibibytes per rank. The two shards together still contain two point five gibibytes. At sixteen tokens per block, the prompt occupies five hundred twelve model-wide blocks, each five mebibytes. Reserving one hundred twenty-eight future output positions adds eight blocks, or forty mebibytes, for two thousand six hundred mebibytes. Those eight empty blocks will hold keys and values for the generated tokens. One extra prompt token raises rounded capacity to five hundred twenty-one blocks, though real payload rises by only three hundred twenty kibibytes.
