      - say: At an assumed aggregate twenty-five decimal gigabytes per second, two point five gibibytes takes about one hundred seven point four milliseconds before overhead. Two independent links each at that rate can finish the two shards in fifty-three point seven milliseconds. On one shared link, both streams divide the same twenty-five gigabytes per second. Forty such requests per second require about one hundred seven point four gigabytes per second, but the shared path can carry only twenty-five gigabytes per second. Divide the path rate by the bytes per request and you get an ideal service rate of nine point three one transfers per second.
