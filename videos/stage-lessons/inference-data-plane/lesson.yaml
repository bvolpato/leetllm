        hold: 0.55
      - say: |
          Return to the small request with forty-eight blocks. Suppose either compatible worker is allowed. A is nearby and needs all forty-eight blocks. Its link carries twelve blocks per time unit after setup. C is across the rack boundary. It already has thirty-six usable blocks. It needs twelve more, and its link carries six per unit. The setup costs are on screen. Which worker gets the whole cache first?
