            phrase: "Cancelling on one rank"
            targets:
              - picture
          - id: collective-repaired
            caption_boundary: true
            phrase: "Coordinate the group"
            targets:
              - picture
      - say: A grouped call can return to the host while the result cells are still empty. Wait for the group to end. If the call reports work in progress, check that issuing succeeds before using CUDA synchronization. Once the GPU completes the reduction, a consumer on another stream can read the result after it waits on the completion event.
