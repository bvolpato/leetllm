scenes:
  - id: subject-intro
    title: "When can the first token appear?"
    visual: "Four groups of eight cache blocks have reached the decoder. A fifth crosses the link. The received count, both rank maps and the waiting reply stay in view until the final group arrives and the owner commits."
    beats:
      - say: |
          Watch eight cache blocks cross to the decoder. It now has forty of the forty-eight blocks it needs for its first token. The prefill worker read the prompt and saved the keys and values that attention will use.
        hold: 0.6
        caption_starts:
          - "It now has forty"
          - "The prefill worker read the prompt"
        visual_cues:
          - id: intro-ship
            phrase: "Watch eight cache blocks cross to the decoder"
            targets: [picture]
          - id: intro-read
            phrase: "The prefill worker read the prompt"
            targets: [picture]
      - say: |
          Read the decoder's map. Each row is one process, called a rank. The two ranks hold different attention heads for the same prompt positions. Each group spans eight blocks. Which rank and block range is the decoder waiting for?
        hold: 2.5
        caption_starts:
          - "Which rank and block range"
        visual_cues:
          - id: intro-question
            phrase: "Which rank and block range is the decoder waiting for"
            targets: [picture]
      - say: |
          Rank one still needs blocks sixteen through twenty-three. Here comes that last group. All forty-eight blocks now have a place and a matching identity. The transfer has stopped, the contents match, and the GPU can read them. The request owner commits the cache. Now decode can produce the word “At.”
        hold: 0.9
        caption_starts:
          - "Here comes that last group"
          - "All forty-eight blocks"
          - "The request owner commits"
          - "Now decode"
        visual_cues:
          - id: intro-answer
            phrase: "Rank one still needs blocks sixteen through twenty-three"
            targets: [picture]
          - id: intro-last
            phrase: "Here comes that last group"
            targets: [picture]
          - id: intro-verify
            phrase: "the contents match, and the GPU can read them"
            targets: [picture]
          - id: intro-commit
            phrase: "The request owner commits the cache"
            targets: [picture]
          - id: intro-output
            phrase: "produce the word “At”"
            targets: [picture]
      - say: |
          The decoder finishes its reply while the next prompt waits at prefill. Separate pools let you size and schedule each one independently. The cost depends on how many blocks still have to cross.
        hold: 0.85
        visual_cues:
          - id: intro-next
            phrase: "the next prompt waits at prefill"
            targets: [picture]
          - id: intro-time
            phrase: "The decoder finishes its reply"
            targets: [picture]
  - id: collective-contracts
    title: The ranks must combine the same meaning
    visual: Indexed tensor cells combine across two persistent rank lanes; a layer-order swap creates a same-shaped wrong sum before repair.
    beats:
      - say: The control plane authorizes the request, places it, reserves memory and assigns one request owner. The data plane runs the model and carries tensors and output. A router can do both jobs when it chooses a worker and forwards the prompt. Collectives inside a tensor-parallel group combine partial model results. Transfers between prefill and decode groups move the prompt's cache.
        hold: 1
        visual_cues:
          - id: control-authorizes
            phrase: "The control plane authorizes"
            targets:
              - picture
          - id: control-places
            phrase: "places"
            targets:
              - picture
          - id: control-reserves
            phrase: "reserves"
            targets:
              - picture
          - id: control-assigns
            phrase: "assigns one request owner"
            targets:
              - picture
          - id: data-carries
            phrase: "The data plane runs the model and carries tensors and output"
            targets:
              - picture
          - id: data-responsibilities
            phrase: "A router can do both jobs"
            targets:
              - picture
          - id: collective-inside
            phrase: "Collectives inside a tensor-parallel group"
            targets:
              - picture
          - id: collective-between
            phrase: "transfers between prefill and decode groups"
            targets:
              - picture
      - say: For rank inputs one and two, and ten and twenty, sum all-reduce gives eleven and twenty-two to both ranks. All-gather instead concatenates contributions in rank order. Reduce-scatter sums corresponding elements and gives each rank only its assigned chunk. Gathering those reduced chunks reconstructs the complete sum.
        hold: 1
        caption_starts:
          - "eleven and twenty-two to both ranks"
          - "twenty-two to both ranks"
          - "All-gather instead"
          - "concatenates contributions in rank order"
          - "only its assigned chunk"
          - "reconstructs the complete sum"
        visual_cues:
          - id: collective-inputs-0
            phrase: "For rank inputs one and two"
            targets:
              - picture
          - id: collective-inputs-1
            phrase: "ten and twenty"
            targets:
              - picture
          - id: collective-all-reduce
            phrase: "sum all-reduce gives eleven and twenty-two to both ranks"
            targets:
              - picture
          - id: collective-all-gather
            phrase: "All-gather instead concatenates contributions in rank order"
            targets:
              - picture
          - id: collective-reduce-scatter
            phrase: "Reduce-scatter sums corresponding elements and gives each rank only its assigned chunk"
            targets:
              - picture
          - id: collective-gather-reduced
            phrase: "Gathering those reduced chunks reconstructs the complete sum"
            targets:
              - picture
      - say: Ranks must agree on operation, count, dtype and collective sequence. Swap two same-shaped layer reductions and matching shapes can still combine the wrong layer values. Cancelling on one rank must not make it skip a call its peers still execute. Coordinate the group; failed communicators need their backend recovery procedure.
        hold: 1
        caption_starts:
