  - id: trusted-manifest
    title: Check the receiver’s reservation
    visual: A delayed manifest and a trusted reservation agree in every field except the attempt. The authorized transfer maps logical block 31 to a different physical address. Overlapping writers test the buffer lifetime.
    beats:
      - say: |
          A sender asks to write into this decoder's buffer. Read its manifest beside the decoder's reservation. Both name the same request and the same buffer lease. Which field would stop the transfer?
        hold: 2.3
        visual_cues:
          - id: manifest-ask
            phrase: "Which field would stop the transfer"
            targets: [picture]
      - say: |
          The sender named attempt three. The reservation belongs to attempt four. The receiver leaves the buffer untouched. Now attempt four arrives from the current owner. Check the tenant, model, tokenizer and adapter. The token digest and positions identify the prompt. The cache layout, block size and required shards match too. The receiver can start the transfer. Both workers use the same canonical token IDs so they agree on the prompt.
        hold: 0.85
        caption_starts:
          - "The reservation belongs to attempt four"
          - "Now attempt four arrives"
          - "The receiver can start the transfer"
        visual_cues:
