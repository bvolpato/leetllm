        hold: 0.7
      - say: |
          Cache overlap can reduce the bytes to move. A required topology policy excludes decode workers outside the selected prefill worker’s transfer domain. A preferred domain match favors workers in that domain while other eligible workers can still win. In the next example, locality affects cost. The example router checks layout and free blocks. Separately, the request orchestrator must enforce ownership of the current attempt.
