      - say: Follow logical block thirty-one. It lives at source physical block nine hundred four. The receiver puts it at destination block one hundred eighteen. Both addresses refer to the same prompt positions and head shard. If the connector supports repartitioning or conversion, budget and check that work. To resume generation, the decoder may also need the last token or hidden state, the sampling state and first-token ownership.
