version: 1
lesson: inference-data-plane
promise: Use the size, identity and lifetime of a request's cache to choose a route, decide when decode may start and determine when its memory can serve another request.
objectives:
  - id: collective-completion
    can: Distinguish a same-layer collective inside a replica from a cache transfer between replicas, and identify the completion each consumer needs.
    scenes: [subject-intro, collective-contracts, lifecycle-events]
  - id: size-and-place
    can: Calculate unique payload, rounded capacity and shared-link time, then compare eligible routes using the blocks each still needs.
    scenes: [kv-state, real-payload, route-compatible, reserve-and-transfer]
  - id: authorize-decode
    can: Compare the received manifest with the trusted reservation and locate a missing rank and block even when the receipt count looks complete.
    scenes: [subject-intro, trusted-manifest, lifecycle-events, transfer]
  - id: recover-and-reclaim
    can: Determine whether a retry has separate capacity and when transport and GPU access permit reuse of the retired buffer.
    scenes: [uncertain-transfer, retry-boundaries, transfer]
  - id: trace-the-request
    can: Trace the first token, client-visible output and failed handoff to the request owner and measure latency and attainment against offered work.
    scenes: [retry-boundaries, critical-path, transfer]
