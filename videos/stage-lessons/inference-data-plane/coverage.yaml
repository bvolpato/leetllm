      - route-compatible
      - trusted-manifest
      - lifecycle-events
  - heading: Timeout revokes ownership, not physical access
    status: taught
    note: The small example retains the full 48-slot charge at destination tick 10. A late block changes the received count from 32 to 33 while the free count stays at 16.
    scenes:
