            color: cyan
            linger: 0.35
      - say: CUDA, NCCL, legacy NVSHMEM, model checkpoints, datasets and firmware retain their own terms. The
          historical image can still need NVSHMEM for legacy methods even while its V two EP uses Gin; the
          later migration removes that legacy dependency. Keep the source pin, dependency inventory and actual
          target image together when reproducing an old integration.
        hold: 0.7
        visual_cues:
          - id: de-ownership-license-b1
            phrase: CUDA, NCCL, legacy NVSHMEM, model checkpoints, datasets and firmware retain their own terms.
            targets:
              - de-ownership-license-mechanism
            color: cyan
            linger: 0.35
  - id: source-diagnosis
    title: Two returns from expert three
    visual: >-
      Exchange the two weighted rows from expert three. Moving slot and value together restores a.
      Leaving the slot labels in place as the values cross changes a's second coordinate.
    beats:
      - say: >-
          Here's another way to get a plausible wrong row. Use a's original route again. Look at
          expert three. Slot zero holds a's weighted result. Slot one holds a result for token c.
          Reverse the two pairs, keeping each value with its slot number. Combine uses slot zero
          for a even though it arrived second. Add a's other contribution and a gets one point nine,
          zero.
        hold: 0.9
        visual_cues:
          - id: de-swap-pairs
            phrase: "Reverse the two pairs, keeping each value with its slot number"
            targets: [de-slot-pairs]
            linger: 0.3
          - id: de-paired-result
            phrase: "a gets one point nine, zero"
            targets: [de-source-sum]
            caption_boundary: true
            linger: 0.3
      - say: >-
          This time leave both slot numbers in place. Swap just the two values. Every expected slot
          still occurs exactly once. Follow the value under slot zero. What lands in the second
          coordinate of a?
        hold: 2.5
        visual_cues:
          - id: de-swap-values
            phrase: "Swap just the two values"
            targets: [de-slot-pairs]
            linger: 0.3
          - id: de-detached-ask
            phrase: "What lands in the second coordinate of a"
            targets: [de-slot-pairs, de-source-sum]
            linger: 0.3
      - say: >-
          One point eight came from c. So row a reads two point five, one point eight.
          Put the values back with their slots. In an integration, check the saved
          source-to-slot mapping across the permutation. For a count mismatch, inspect the valid
          expert ranges. A Gin initialization error points to the communicator and topology.
          A first-use compilation failure points to the target, compiler or cache. The CPU comparison
          checks the restored rows. The stream waits and the physical links need a run on the device.
        hold: 1.0
        visual_cues:
          - id: de-detached-result
            phrase: "two point five, one point eight"
            targets: [de-source-sum]
            caption_boundary: true
            linger: 0.3
          - id: de-repair-pair
            phrase: "Put the values back with their slots"
            targets: [de-slot-pairs, de-source-sum]
            linger: 0.3
          - id: de-diagnose-count
            phrase: "For a count mismatch"
            targets: [de-source-sum]
          - id: de-diagnose-gin
            phrase: "A Gin initialization error"
            targets: [de-source-sum]
          - id: de-diagnose-jit
            phrase: "A first-use compilation failure"
            targets: [de-source-sum]
          - id: de-diagnose-device
            phrase: "The stream waits and the physical links"
            targets: [de-source-sum]
  - id: earned-return
    title: Another token comes home
    visual: >-
      Token z keeps both coordinates in view as one expert pair replaces another. After comparing
      cached and rebuilt dispatch, trace two reverse arrivals into z and place its first expert
      read on the consumer stream.
    beats:
      - say: >-
          Here's a new row for token z, two and minus one. Keep the same expert rule. Multiply
          both coordinates by the expert number plus one. The saved route uses zero and three. Now
          the router chooses one and two. The first gate is point two and the second is point
          eight. Both routes touch both GPUs. Which handle would you use, and what row should come
          back?
        hold: 3
        visual_cues:
          - id: de-fresh-change
            phrase: "Now the router chooses one and two"
            targets: [de-fresh-route-result]
            caption_boundary: true
            linger: 0.3
          - id: de-earned-return-b0
            phrase: "Which handle would you use, and what row should come back"
            targets: [de-fresh-vector-result, de-fresh-route-result]
            linger: 0.3
      - say: >-
          Rebuild the handle for one and two before dispatch. Expert one doubles the input. Keep
          one fifth of that row and you have point eight, minus point four. Expert two triples the
          input. Keep four fifths and you have four point eight, minus two point four. Add each
          column. Five point six, minus two point eight comes back to z.
        hold: 1.4
        visual_cues:
          - id: de-fresh-route
            phrase: "Rebuild the handle for one and two"
            targets: [de-fresh-route-result]
            caption_boundary: true
            linger: 0.3
          - id: de-fresh-raw-one
            phrase: "Expert one doubles the input"
            targets: [de-fresh-vector-result]
            caption_boundary: true
            linger: 0.3
          - id: de-fresh-first
            phrase: "you have point eight, minus point four"
            targets: [de-fresh-vector-result]
            caption_boundary: true
            linger: 0.3
          - id: de-fresh-raw-two
            phrase: "Expert two triples the input"
            targets: [de-fresh-vector-result]
            caption_boundary: true
            linger: 0.3
          - id: de-fresh-second
            phrase: "you have four point eight, minus two point four"
            targets: [de-fresh-vector-result]
            caption_boundary: true
            linger: 0.3
          - id: de-fresh-result
            phrase: "Five point six, minus two point eight comes back to z"
            targets: [de-fresh-vector-result]
            caption_boundary: true
            linger: 0.3
      - say: >-
          Replay the old choices with the same gates and z gets six point eight, minus three point
          four. The count of destination GPUs missed that error. On the rebuilt route, let expert
          two come home first. Its slot puts the first contribution in z. Now expert one's slot
          adds the rest. Reversing arrival order works because each value kept its identity.
        hold: 1.1
        visual_cues:
          - id: de-stale-result
            phrase: "six point eight, minus three point four"
            targets: [de-fresh-stale-result]
            linger: 0.3
          - id: de-fresh-arrive
            phrase: "let expert two come home first"
            targets: [de-fresh-vector-result]
            caption_boundary: true
            linger: 0.3
          - id: de-fresh-inverse
            phrase: "expert one's slot adds the rest"
            targets: [de-fresh-vector-result]
            caption_boundary: true
            linger: 0.3
      - say: >-
          Keep that rebuilt route and run the historical asynchronous dispatch. Python has
          returned. The expert stream can do independent work while the communication stream
          writes the rows. Now remove the wait before the first activation read. The read could
          start while the write is still in flight. Which event must the expert stream wait for?
        hold: 2.5
        visual_cues:
          - id: de-fresh-remove-wait
            phrase: "remove the wait before the first activation read"
            targets: [de-fresh-wait-result]
            caption_boundary: true
            linger: 0.3
      - say: >-
          Make the expert stream wait for the dispatch event. Its first read now follows the
          writes, and the independent work can still overlap them. Keep the received rows and the
          handle alive through their consumers. On your GPUs, check z against the reference and
          inspect that dependency in the stream trace. Once both checks pass, time the whole layer
          from dispatch through combine.
        hold: 1.4
        visual_cues:
          - id: de-fresh-wait
            phrase: "Make the expert stream wait for the dispatch event"
            targets: [de-fresh-wait-result]
            caption_boundary: true
            linger: 0.3
