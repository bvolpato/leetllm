scenes:
  - id: intro
    title: Where does this copy of token a go?
    visual: >-
      One copy of row a stays on GPU 0 as its twin crosses to GPU 1. The router changes one expert.
      Compare it with the saved handle, then follow one fresh delivery to two expert slots on GPU 1.
    beats:
      - say: >-
          Watch this copy of token a cross to GPU one. Another copy stays on GPU zero. The router picked
          expert zero on the left and expert three on the right. Each expert is a neural network block.
          Its weights stay on its GPU, so DeepEP brings the row to it.
        hold: 0.7
        caption_starts: ["Another copy stays on GPU zero", "The router picked expert zero"]
        visual_cues:
          - id: de-intro-choices
            phrase: >-
              The router picked expert zero on the left and expert three on the right
            targets: [de-intro-choices]
            linger: 0.3
          - id: de-intro-dispatch
            phrase: >-
              Watch this copy of token a cross to GPU one
            targets: [de-intro-ranks]
            linger: 0.3
      - say: >-
          Dispatch saved those choices in a route handle. Run the same row again. This time the router
          replaces expert zero with expert two. Compare the new pair with the saved pair. Which expert
          would the cached route visit by mistake?
        hold: 2.5
        caption_starts: ["This time the router replaces", "Which expert would the cached route visit"]
        visual_cues:
          - id: de-intro-change
            phrase: "replaces expert zero with expert two"
            targets: [de-intro-choices]
            linger: 0.3
          - id: de-intro-question
            phrase: "Which expert would the cached route visit by mistake"
            targets: [de-intro-decision, de-intro-choices]
            linger: 0.3
      - say: >-
          Expert zero. Build a fresh handle from the new choices. Now one copy goes to GPU one. There it
          splits into slots for experts two and three. The caller weights each expert’s output. DeepEP
          uses the handle to bring both contributions back to a.
        hold: 0.9
        caption_starts: ["Build a fresh handle", "Now one copy goes to GPU one", "There it splits"]
        visual_cues:
          - id: de-intro-wrong
            phrase: "Expert zero"
            targets: [de-intro-ranks, de-intro-choices]
            linger: 0.3
          - id: de-intro-rebuild
            phrase: "Build a fresh handle from the new choices"
            targets: [de-intro-choices]
            linger: 0.3
          - id: de-intro-deliver
            phrase: "one copy goes to GPU one"
            targets: [de-intro-ranks]
            linger: 0.3
          - id: de-intro-expand
            phrase: "splits into slots for experts two and three"
            targets: [de-intro-ranks]
            linger: 0.3
  - id: version-boundary
    title: >-
      Which buffer runs the dispatch?
    visual: >-
      Token a keeps its identity and its two expert choices as the API changes from ElasticBuffer to
      EPBuffer.
    beats:
      - say: >-
          Keep row a and its two expert choices. In the historical V two API, one ElasticBuffer
          dispatches the row and combines the outputs. Our four-token CPU example traces which slot each
          row visits and what value comes back.
        hold: 0.7
        visual_cues:
          - id: de-version-boundary-b0
            phrase: >-
              one ElasticBuffer dispatches the row and combines the outputs
            targets:
              - de-version-boundary-mechanism
            color: cyan
            linger: 0.35
      - say: >-
          In the V two point five snapshot, expert dispatch moves to E P Buffer. Bucket, pipeline and
          Engram each get a dedicated buffer too. They share allocation and lifetime management.
          Installation builds the host extension. DeepJIT compiles the GPU kernels at runtime. This
          release also removes V one and its NVSHMEM dependency.
        hold: 0.7
        visual_cues:
          - id: de-version-boundary-b1
            phrase: >-
              expert dispatch moves to E P Buffer
            targets:
              - de-version-boundary-mechanism
            color: cyan
            linger: 0.35
  - id: dispatch
    title: Destination copies and expert assignments count different work
    visual: The article's four-token routing table computes eight expert assignments and eight token-destination
      rows. Moving one selection to the same rank reduces destination rows to seven; the final beat preserves
      that first selection and disables only the second, removing one expert assignment.
    beats:
      - say: >
          Two source ranks own two tokens each. Each token chooses two of four experts, with two experts per
          rank. In the first route, every token touches both destination ranks. Count eight expert assignments
          and eight distinct token-destination rows, including local work that crosses no remote link.
        hold: 0.6
        visual_cues:
          - id: dispatch-beat-1-focus-1
            phrase: Two source ranks own two tokens each
            targets:
              - dispatch-grid-token-source-rank-selection-0-selection-1-rows-250-390-1420-400
            color: cyan
            linger: 0.65
          - id: dep-result-dispatch-eight
            phrase: Count eight expert assignments and eight distinct token-destination rows, including local work that crosses no remote link
            targets:
              - dep-dispatch-summary
            color: cyan
            linger: 0.35
      - say: >-
          Change only a's first choice, from expert zero to expert two. The receiver on rank one
          owns both selected experts. Send one row to rank one. Copy it to expert two's slot with
          the first gate, then to expert three's slot with the second. Look at both counts. Eight
          assignments still feed the experts, while seven destination rows suffice for transport.
          Dispatch used fresh metadata for those choices.
        hold: 0.8
        visual_cues:
          - id: de-dispatch-send
            phrase: "Send one row to rank one"
            targets: [dispatch-ex-delivered-a-one-row-at-rank-1-rank-1-receive-pending]
            linger: 0.3
          - id: de-dispatch-e2
            phrase: "Copy it to expert two's slot with the first gate"
            targets: [dispatch-ex-expertrows-includes-expert-a-e-expert-gate-7-3-i-e-expert-slot-pe]
            linger: 0.3
          - id: de-dispatch-e3
            phrase: "then to expert three's slot with the second"
            targets: [dispatch-ex-expertrows-includes-expert-a-e-expert-gate-7-3-i-e-expert-slot-pe]
            linger: 0.3
          - id: dep-result-dispatch-seven
            phrase: "seven destination rows suffice for transport"
            targets: [dep-dispatch-summary]
            caption_boundary: true
            linger: 0.3
      - say: >
          Disable a's second selection with the unused-slot marker. The reference skips it explicitly, leaving
          seven expert assignments. The remaining gate keeps its supplied weight. Masking a selection,
          deduplicating a destination and padding an allocation are three different operations with different
          effects on the ledger.
        hold: 0.6
        visual_cues:
          - id: dispatch-beat-3-focus-1
            phrase: Disable a's second selection with the unused-slot marker
            targets:
              - dispatch-grid-token-source-rank-selection-0-selection-1-rows-250-390-1420-400
            color: cyan
            linger: 0.65
          - id: dep-result-dispatch-mask
            phrase: leaving seven expert assignments
            targets:
              - dep-dispatch-summary
            color: cyan
            linger: 0.35
  - id: layout
    title: Aligned storage contains gaps that have no source token
    visual: Counts three and one create aligned expert starts zero and four, valid endpoints three and five, and
      eight allocated slots. The displayed slot-to-source inverse map restores every valid row and actually
      rejects a lookup for displayed padding slot three.
    beats:
      - say: >
          Expert computation wants rows grouped into segments. Our local example has three real rows for one
          expert and one for another. Without alignment, four slots hold all four rows. The inverse map
          assigns each real expert slot its source identity.
        hold: 0.6
        visual_cues:
          - id: layout-beat-1-focus-1
            phrase: Without alignment, four slots hold all four rows
            targets:
              - layout-labels
            color: cyan
            linger: 0.65
      - say: >
          Align each segment to four slots. The second expert starts at four, and its one real row ends at
          five. Allocated capacity is eight, while only four slots are valid. The displayed starts, endpoints
          and row counts come from the same segment calculation.
        hold: 0.6
        visual_cues:
          - id: layout-beat-2-focus-1
            phrase: The displayed starts, endpoints and row counts come from the same segment calculation
            targets:
              - layout-labels
            color: cyan
            linger: 0.65
          - id: dep-result-layout-eight
            phrase: Allocated capacity is eight, while only four slots are valid
            targets:
              - dep-layout-summary
            color: cyan
            linger: 0.35
      - say: >
          Return an output from an alignment gap and the reference rejects it: that slot has no source
          identity. Zeroing padding can make kernel inputs convenient, but it cannot turn capacity into a real
          token. No-CPU-sync integrations must consume valid device ranges rather than treating the entire
          receive allocation as populated data.
        hold: 0.6
        visual_cues:
          - id: layout-beat-3-focus-1
            phrase: Zeroing padding can make kernel inputs convenient
            targets:
              - layout-labels
            color: cyan
            linger: 0.65
          - id: dep-result-layout-reject
            phrase: Return an output from an alignment gap and the reference rejects it
            targets:
              - dep-layout-summary
            color: cyan
            linger: 0.35
  - id: layout-boundaries
    title: Construct valid endpoints separately from allocated segments
    visual: The existing three-and-one row fixture keeps source identities while aligned regions are constructed.
    beats:
      - say: For an alignment A, divide the actual row count by A, take the ceiling, then multiply by A to get the
          allocated segment size. The next segment starts after that allocation. Its valid endpoint is its
          start plus its actual count. Our three-and-one fixture therefore has two four-slot allocations, but
          only four valid rows. Capacity and population use different counts.
        hold: 0.7
        visual_cues:
          - id: de-layout-boundaries-b0
            phrase: For an alignment A, divide the actual row count by A, take the ceiling, then multiply by A
              to get the allocated segment size.
            targets:
              - de-layout-boundaries-mechanism
            color: cyan
            linger: 0.35
          - id: de-layout-four
            phrase: only four valid rows
            targets:
              - de-layout-boundaries-mechanism
            color: cyan
            linger: 0.35
      - say: Expanded layout creates an expert slot for each valid selection. Non-expanded layout retains one
          destination row with its expert metadata. An unused selection has no contribution; an alignment gap
          has no source identity. In a no-CPU-sync path, a large receive tensor can represent capacity rather
          than a completely populated batch. Use the valid device counts and ranges.
        hold: 0.7
        visual_cues:
          - id: de-layout-boundaries-b1
            phrase: Expanded layout creates an expert slot for each valid selection.
            targets:
              - de-layout-boundaries-mechanism
            color: cyan
            linger: 0.35
  - id: handle-lifetime
    title: What comes back to row a?
    visual: >-
      Two runs share an input and gates. Only the first expert changes. Compare the first
      coordinate from a cached dispatch with the value required by the new router choices.
    beats:
      - say: >-
          Put a back on the route to experts two and three. Here's a way to catch an accidental
          replay. Give each expert a simple job. Expert k multiplies both coordinates by k plus
          one. The old handle visits zero and three, so the first coordinate comes back as one
          point nine. What first coordinate should a get on the new route?
        hold: 2.5
        visual_cues:
          - id: de-handle-old
            phrase: "comes back as one point nine"
            targets: [de-handle-old-row]
            caption_boundary: true
            linger: 0.3
          - id: de-handle-ask
            phrase: "What first coordinate should a get on the new route"
            targets: [de-handle-new-row]
            linger: 0.3
      - say: >-
          Only the first term changes. Expert two triples the one, and its gate keeps seventy
          percent. That's two point one. Expert three still contributes one point two. Together
          they give three point three. If this fixture returns one point nine, check which route
          dispatch actually used. Both results fit the same row.
        hold: 1.1
        visual_cues:
          - id: de-handle-first
            phrase: "Expert two triples the one"
            targets: [de-handle-new-row]
            linger: 0.3
          - id: de-handle-new
            phrase: "Together they give three point three"
            targets: [de-handle-new-row]
            caption_boundary: true
            linger: 0.3
      - say: >-
          Dispatch saves the source identities, expert slots and segment offsets in the handle. A
          hybrid route also needs its forwarding information. The gates accompany the received
          rows separately. Reuse a handle only while its route and layout still match. Historical
          V two can copy its indices. The V two point five snapshot retains them by reference.
          Keep those indices unmodified and the referenced storage alive until the last consumer
          finishes. A compatible buffer can serve a fresh dispatch.
        hold: 0.8
        visual_cues:
          - id: de-handle-storage
            phrase: "retains them by reference"
            targets: [de-handle-storage]
            linger: 0.3
  - id: combine
    title: What does combine receive?
    visual: >-
      Start with the original E0/E3 route. Scale each raw output on its own bar before addition,
      then deliver all eight weighted results in reverse order using their expert-slot identities.
    beats:
      - say: >-
          Go back to a's original pair, experts zero and three. Expert k multiplies its input by k
          plus one. The first coordinates on these two bars are one and four. Add them raw and you
          get five. Each expert also received a gate from the router. What should the caller send
          into combine?
        hold: 2
        visual_cues:
          - id: combine-beat-1-focus-1
            phrase: "experts zero and three"
            targets: [combine-a-e-row-expert-saved-slot-row-key]
            linger: 0.3
          - id: dep-result-combine-five
            phrase: "Add them raw and you get five"
            targets: [dep-combine-summary]
            caption_boundary: true
            linger: 0.3
      - say: >-
          Take seventy percent of the one. Now take thirty percent of the four. Combine receives
          point seven and one point two for a. Their sum is one point nine. Here's a second
          failure with the same shape. If the caller applied the gates again, a would get point
          eight five.
        hold: 1
        visual_cues:
          - id: de-combine-e0
            phrase: "Take seventy percent of the one"
            targets: [combine-weighted-contributions]
            linger: 0.3
          - id: de-combine-e3
            phrase: "take thirty percent of the four"
            targets: [combine-weighted-contributions]
            linger: 0.3
          - id: dep-result-combine-once
            phrase: "Their sum is one point nine"
            targets: [dep-combine-summary]
            caption_boundary: true
            linger: 0.3
          - id: dep-result-combine-twice
            phrase: "a would get point eight five"
            targets: [dep-combine-summary]
            caption_boundary: true
            linger: 0.3
      - say: >-
          Now return all eight results in reverse order. Follow each expert and slot number to the
          source row that dispatch saved for it. Even though a's contributions arrive last, a
          still gets one point nine. Try omitting a's slot from expert zero. The reference rejects
          the missing return. Send that slot twice and it rejects the duplicate. On the device,
          compare the restored rows with this small reference.
        hold: 1
        visual_cues:
          - id: de-combine-reverse
            phrase: "Follow each expert and slot number to the source row that dispatch saved for it"
            targets: [combine-source-token-accumulator]
            linger: 0.3
          - id: dep-result-combine-missing
            phrase: "rejects the missing return"
            targets: [combine-source-token-accumulator]
            caption_boundary: true
            linger: 0.3
          - id: dep-result-combine-duplicate
            phrase: "rejects the duplicate"
            targets: [combine-source-token-accumulator]
            caption_boundary: true
            linger: 0.3
  - id: backward-operators
    title: Separate reverse communication from differentiation through the experts
    visual: Fixed routing is represented as an expansion matrix and its reverse sum, with gate derivatives on a
      separate path.
    beats:
      - say: With routing fixed, unweighted dispatch is a linear copy-and-expansion operator D. Its transpose sums
          matching returned contributions into their source rows. That explains the communication relationship
          used by backward wrappers. The full MoE layer also contains expert computation and gate
          multiplication. Transposing communication alone does not compute their derivatives, and discrete
          expert selection is another boundary.
        hold: 0.7
        visual_cues:
          - id: de-backward-operators-b0
            phrase: With routing fixed, unweighted dispatch is a linear copy-and-expansion operator D.
            targets:
              - de-backward-operators-mechanism
            color: cyan
            linger: 0.35
      - say: "In our original token a example, expert gains are one and four with gates point seven and point three.
          The combined gain is one point nine. For an upstream vector two, one, the input gradient is three
          point eight, one point nine. The two gate derivatives are the upstream dot products with the raw
          expert outputs: two and eight. Reusing route metadata does not justify applying those gates twice."
        hold: 0.7
        visual_cues:
          - id: de-backward-operators-b1
            phrase: In our original token a example, expert gains are one and four with gates point seven and
              point three.
            targets:
              - de-backward-operators-mechanism
            color: cyan
            linger: 0.35
          - id: de-backward-input
            phrase: the input gradient is three point eight, one point nine
            targets:
              - de-backward-input-result
            color: cyan
            linger: 0.35
          - id: de-backward-gates
            phrase: two and eight
            targets:
              - de-backward-gate-result
            color: cyan
            linger: 0.35
  - id: rounding
    title: Where is the subtotal stored?
    visual: >-
      Two rulers carry the same subtotal from 256 to 257. Only the BF16 marker snaps back when the
      intermediate result is stored. Subtracting 256 exposes the unit that survived on the FP32
      path.
    beats:
      - say: >-
          Even the right expert values can change on the way home. A rank can sum contributions
          locally and forward the subtotal to save traffic. Here one source row gets three already
          weighted values. Start at two hundred fifty-six on both rulers. Add one. The subtotal
          is halfway between two bfloat sixteen marks. At a tie, the last retained bit must be zero.
          Look at the bit under each neighbor. Which neighbor gets stored?
        hold: 2.4
        visual_cues:
          - id: de-round-add
            phrase: "Add one"
            targets: [rounding-bf16-operation, rounding-fp32-operation]
            linger: 0.3
          - id: de-round-question
            phrase: "At a tie, the last retained bit must be zero"
            targets: [rounding-bf16-operation]
            linger: 0.3
      - say: >-
          Here that's two hundred fifty-six. The left marker moves back one unit. Now the negative
          contribution arrives. Subtract two hundred fifty-six from the stored value and zero
          comes home.
        hold: 1
        visual_cues:
          - id: dep-result-round-cast
            phrase: "Here that's two hundred fifty-six"
            targets: [rounding-bf16-operation]
            caption_boundary: true
            linger: 0.3
          - id: dep-result-round-zero
            phrase: "zero comes home"
            targets: [rounding-bf16-operation]
            caption_boundary: true
            linger: 0.3
      - say: >-
          On the right, float thirty-two keeps the subtotal at two hundred fifty-seven. Make the
          same subtraction before the final cast, and one comes home. All three inputs fit in
          bfloat sixteen. The difference came from storing the subtotal between additions. Check
          where your kernel stores intermediate results before choosing an error tolerance.
        hold: 1.1
        visual_cues:
          - id: dep-result-round-one
            phrase: "one comes home"
            targets: [rounding-fp32-operation]
            caption_boundary: true
            linger: 0.3
  - id: deterministic-order
    title: Sort the data and the coordinates that identify it
    visual: The same reversed arrivals are sorted while source-to-slot links update coherently.
    beats:
      - say: >-
          Watch each arriving value move with its source identity. If the sorter moves a value alone,
          combine credits the wrong token. Historical V two sorts non-expanded rows together with their
          scales, expert indices, weights and source metadata. In expanded mode it sorts within each
          expert segment and updates the slot pointers in the source metadata.
        hold: 0.7
        visual_cues:
          - id: de-deterministic-order-b0
            phrase: >-
              each arriving value move with its source identity
            targets:
              - de-deterministic-order-mechanism
            color: cyan
            linger: 0.35
      - say: >-
          The sort uses source-global identity and expert grouping, with padding kept outside valid data.
          You can now compare the same expert slots across runs. Later reductions still depend on their
          own order and precision. Time the sorted path separately because sorting adds work and can add
          an epilogue on the waiting stream.
        hold: 0.7
        visual_cues:
          - id: de-deterministic-order-b1
            phrase: The sort uses source-global identity and expert grouping, with padding kept outside valid data.
            targets:
              - de-deterministic-order-mechanism
            color: cyan
            linger: 0.35
  - id: topology
    title: Logical payload and physical links use different ledgers
    visual: A direct rank-zero-to-rank-three route contrasts with a hybrid RDMA rail followed by an NVLink hop. A
      supplied byte ledger calculates logical and remote bandwidth from their explicit payloads and interval.
    beats:
      - say: >
          Place two ranks in each of two nodes. Direct mode represents a flat logical domain, while hybrid
          mode models scale-out traffic and local forwarding separately. Our highlighted hybrid route crosses
          the network to a rail peer, then travels inside the destination node to its final rank.
        hold: 0.6
        visual_cues:
          - id: topology-direct-domain
            phrase: Direct mode represents a flat logical domain
            targets:
              - topology-direct-link
              - topology-rank-3
            color: blue
            linger: 0.15
          - id: topology-rail-hop
            phrase: Our highlighted hybrid route crosses the network to a rail peer
            targets:
              - topology-rail-link
              - topology-rank-2
            color: blue
            linger: 0.65
          - id: topology-beat-1-focus-1
            phrase: then travels inside the destination node to its final rank
            targets:
              - topology-local-link
              - topology-rank-3
            color: cyan
            linger: 0.65
          - id: topology-beat-1-focus-2
            phrase: while hybrid mode models scale-out traffic and local forwarding separately
            targets:
              - topology-rail-link
              - topology-local-link
            color: yellow
            linger: 0.65
      - say: >-
          The route carries the original global source and destination through both hops. Before the
          consumer reads the row, the writes must be visible on the destination GPU. Check that ordering
          on the links your deployment actually uses.
        hold: 0.6
        visual_cues:
          - id: topology-beat-2-focus-1
            phrase: The route carries the original global source and destination through both hops
            targets:
              - topology-rail-link
              - topology-local-link
              - topology-rank-3
            color: cyan
            linger: 0.65
          - id: topology-beat-2-focus-2
            phrase: the writes must be visible on the destination GPU
            targets:
              - topology-rank-3
            color: yellow
            linger: 0.65
      - say: >
          One hundred mebibytes of logical payload includes fifty that stay local. Over the same
          millisecond, the logical byte rate is twice the remote payload rate. Check which rows crossed
          the network when reading a NIC counter.
        hold: 0.6
        visual_cues:
          - id: topology-beat-3-focus-1
            phrase: the logical byte rate is twice the remote payload rate
            targets:
              - topology-byte-ledger
            color: cyan
            linger: 0.65
          - id: topology-beat-3-focus-2
            phrase: Check which rows crossed the network when reading a NIC counter
            targets:
              - topology-byte-ledger
            color: yellow
            linger: 0.65
          - id: dep-result-topology-rates
            phrase: is twice the remote payload rate
            targets:
              - topology-byte-ledger
            color: cyan
            linger: 0.35
  - id: visibility-fence
    title: >-
      Make the row visible before signaling
    visual: The same mixed-fabric route separates a data write, a visibility boundary and a published barrier.
    beats:
      - say: >-
          Follow the write from left to right. On this mixed-fabric path, the bytes travel over NVLink
          and the barrier uses a Gin signal. The repair after the historical V two pin adds a
          system-scope fence. It orders the earlier writes before the barrier is published.
        hold: 0.7
        visual_cues:
          - id: de-visibility-fence-b0
            phrase: >-
              adds a system-scope fence
            targets:
              - de-visibility-fence-mechanism
            color: cyan
            linger: 0.35
      - say: >-
          A row can have the right address while its data is still in flight. Trace three steps on the
          deployed links. The sender submits the write, the peer can see the data, and the consumer
          stream waits before reading it. Check which revision both peers run when you test that
          sequence.
        hold: 0.7
        visual_cues:
          - id: de-visibility-fence-b1
            phrase: >-
              the consumer stream waits before reading it
            targets:
              - de-visibility-fence-mechanism
            color: cyan
            linger: 0.35
  - id: backend-ownership
    title: Follow the communicator into a registered device window
    visual: Host communicator, Gin contexts, symmetric allocation and device window have distinct owners and
      lifetimes.
    beats:
      - say: The V two backend receives or creates a host NCCL communicator, queries its physical domains and Gin
          capability, requests queue contexts and signals, allocates symmetric memory, registers a window and
