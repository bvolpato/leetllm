        visual_cues:
          - id: events-beat-1-focus-1
            phrase: With deferred epilogues, dispatch returns an event wrapper, and its first wait returns the four
              dispatch results
            targets:
              - events-id-comm-label-dispatch-id-independent-label-independent-work-id-expe
            color: cyan
            linger: 0.65
      - say: >
          In our executable wrapper, the first wait delivers the results once. On the GPU, waiting establishes
          a consumer-stream dependency; it does not mean the CPU has synchronized with completed device work.
          Independent computation can overlap dispatch, while the expert consumer begins only after its
          required data is ready.
        hold: 0.6
        visual_cues:
          - id: events-beat-2-focus-1
            phrase: Independent computation can overlap dispatch, while the expert consumer begins only after its required
              data is ready
            targets:
              - events-id-comm-label-dispatch-id-independent-label-independent-work-id-expe
            color: cyan
            linger: 0.65
      - say: >
          A second wait returns no second copy of the epilogue results. Retain the tensors and route handle
          from the first result, and keep their storage alive through every consumer. Pin the actual buffer
          and event contract used by the deployment before reusing an integration written for an older
          release.
        hold: 0.6
