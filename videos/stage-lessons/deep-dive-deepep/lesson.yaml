          symmetric memory. The pinned V two and migration snapshots have different software floors. The
          migration names CUDA toolkit thirteen point one, PyTorch two point ten and NCCL two point thirty-two
          point three, with Hopper or newer GPUs and a suitable C plus plus twenty toolchain.
        hold: 0.7
        visual_cues:
          - id: de-runtime-identity-b1
            phrase: Also verify GPU capability, the NVLink peer map, usable RDMA rails, Gin properties, queue
              allocation and symmetric memory.
            targets:
              - de-runtime-identity-mechanism
            color: cyan
            linger: 0.35
  - id: legacy-experimental
    title: Keep different communication products in separate contracts
    visual: V1, historical V2 and V2.5 remain separate while experimental primitives retain their own consumers.
    beats:
      - say: >-
          Archived V one uses Buffer, separate NVLink and RDMA sizing, NVSHMEM and distinct normal or
          low-latency paths. Its low-latency RDMA path can use zero SMs. V two budgets SMs for expert
          communication, and V two point five removes the legacy path. When porting, trace one weighted
          row back to its source before timing the new transport.
        hold: 0.7
        visual_cues:
          - id: de-legacy-experimental-b0
            phrase: Archived V one uses Buffer, separate NVLink and RDMA sizing, NVSHMEM and distinct normal or
              low-latency paths.
            targets:
              - de-legacy-experimental-mechanism
            color: cyan
            linger: 0.35
      - say: >-
          A pipeline send carries activations between stages. The application schedules those stages and
          defines how attention uses any transferred context. Engram takes an integer index. Follow index
          two to entry C. The entry can come from a remote peer while its scale comes from a local copy.
          Bucket transfers and indexed lookups each have their own consumer.
        hold: 0.7
        visual_cues:
          - id: de-engram-entry
            phrase: "Follow index two to entry C"
            targets: [de-legacy-experimental-mechanism]
          - id: de-legacy-experimental-b1
            phrase: >-
              Engram takes an integer index
            targets:
              - de-legacy-experimental-mechanism
            color: cyan
            linger: 0.35
  - id: engram-doorbell
    title: >-
      Submit the last fetch for each peer
    visual: Queued remote gets retain their requested entry identities while the final per-peer submission is made
      explicit.
    beats:
      - say: >-
          Look at the last fetch in each queue. An older experimental Engram path could queue those
          requests and miss the NIC doorbell that submits them. The repair saves one get per peer, issues
          that deferred get without aggregation, then records the asynchronous flush.
        hold: 0.7
        visual_cues:
          - id: de-engram-doorbell-b0
            phrase: >-
              the last fetch in each queue
            targets:
              - de-engram-doorbell-mechanism
            color: cyan
            linger: 0.35
          - id: de-doorbell-final
            phrase: issues that deferred get without aggregation
            targets:
              - de-engram-doorbell-mechanism
            color: cyan
            linger: 0.35
          - id: de-doorbell-flush
            phrase: records the asynchronous flush
            targets:
              - de-engram-doorbell-mechanism
            color: cyan
            linger: 0.35
      - say: >-
          Check the tail entry on each peer. Run the fetch on the deployed links and wait for completion
          before comparing what arrived. If Engram runs alongside pipeline or expert traffic, all three
          can compete for the same queues, memory and streams.
        hold: 0.7
        visual_cues:
          - id: de-engram-doorbell-b1
            phrase: >-
              Check the tail entry on each peer
            targets:
              - de-engram-doorbell-mechanism
            color: cyan
            linger: 0.35
  - id: post-training-receipt
    title: Keep transport changes separate from rollout and training changes
    visual: The same expert route is attached to actor, teacher and trainer receipts with distinct model versions
      and timing boundaries.
    beats:
      - say: An MoE rollout can repeat this exchange for every generated token. A trainer needs its corresponding
          route metadata and gradients; a teacher needs its own valid output and precision contract. Separate
          rollout and trainer clusters own separate groups. Alternating colocated phases may reuse compatible
          resources only after prior consumers finish. Record pause and synchronization costs as well as layer
          throughput.
        hold: 0.7
        visual_cues:
          - id: de-post-training-receipt-b0
            phrase: An MoE rollout can repeat this exchange for every generated token.
            targets:
              - de-post-training-receipt-mechanism
            color: cyan
            linger: 0.35
      - say: Keep model and rollout weight versions, routes, prompt/output mix, dtypes, scales and quality fixed when
          changing one communication lever. Report dispatch, expert and combine times plus the end-to-end
          critical path. Overlapped phases cannot generally be added as though they were serial. A reward drop
          after a topology or dtype change needs separate checks for delay, numerics and the learning
          algorithm.
        hold: 0.7
        visual_cues:
          - id: de-post-training-receipt-b1
            phrase: Keep model and rollout weight versions, routes, prompt/output mix, dtypes, scales and
              quality fixed when changing one communication lever.
            targets:
              - de-post-training-receipt-mechanism
            color: cyan
            linger: 0.35
  - id: ownership-license
    title: Keep the source license and dependency inventory separate
    visual: Pinned project identity is retained while the software image’s separately governed assets are enumerated.
    beats:
      - say: >-
          DeepSeek publishes the source under the MIT license. Keep its copyright and license notice when
          distributing the source. The pinned README credits the project contributors and their NCCL
          collaborators. When packaging a deployment, check each component in the image.
        hold: 0.7
