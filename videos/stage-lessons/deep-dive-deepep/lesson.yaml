    title: Deferred results and stream readiness have separate lifetimes
    visual: A one-shot deferred-result object returns a handle on its first wait and none on its second. A
      supplied stream timeline delays expert consumption until dispatch completes while independent work
      overlaps.
    beats:
      - say: >
          DeepEP's API generation matters at integration time. Historical V2 used ElasticBuffer. The V2.5
          boundary splits dedicated buffers, including EPBuffer. With deferred epilogues, dispatch returns an
          event wrapper, and its first wait returns the four dispatch results. Code expecting an immediate
          five-value tuple must change.
