version: 1
lesson: contrastive-learning
promise: Decide which passages should compete for a query, trace the effect of that choice through the loss, and check whether the resulting retriever finds the required evidence.
objectives:
  - id: derive-comparison
    can: Compute masked means, normalized similarities, stable InfoNCE and triplet losses. Predict how adding a competitor changes the target share at fixed scores and how an angular gradient step changes those scores.
    scenes:
      - order-collision
      - pooling-tensor
      - scores
      - objective
      - loss-numerics
      - triplet-margin
      - temperature-gradient
      - geometry
  - id: audit-supervision
    can: Count the comparisons in separate or shared pools, check what NLI and dropout pairs teach, and choose a mask or a multi-positive loss based on whether two entries are copies or distinct valid answers. Check mined labels and teacher margins against relevance.
    scenes:
      - intro
      - alignment-uniformity
      - pair-supervision
      - dropout-views
      - negatives
      - batch-identity
      - false-negatives
      - multiple-positives
      - mining-loop
      - teacher-margin
      - transfer
      - fresh-embedding
  - id: serve-and-evaluate
    can: Compute late-interaction scores, raw storage and the affordable shortlist size. Check input formatting and supported widths, then decide whether a shortlist meets its recall floor even when its first relevant result moves up.
    scenes:
      - architectures
      - maxsim-readout
      - task-format
      - prefix-failure
      - nested-loss
      - retrieval
      - shortlist-budget
      - evaluation-scope
      - release-metrics
      - fresh-embedding
