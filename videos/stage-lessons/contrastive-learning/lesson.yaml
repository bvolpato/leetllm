  - id: multiple-positives
    title: What if both guides must be found?
    visual: The duplicate’s half-share limit gives way to two distinct verified answers. A shared
      probability strip then feeds a sum-before-log calculation and two separate negative logs before
      averaging.
    beats:
      - say: If two identical copies stay tied in a single-target row, even eliminating all other competition
          gives the target at most half the probability. Its loss bottoms out at the natural log of two.
          Deduplicating or masking the extra copy fixes that bookkeeping.
        hold: 0.6
      - say: Now suppose these are different guides. One explains rotation. The other explains how to replace
          an old key. Reviewers have verified that each answers the query. Look at their probabilities.
          Almost the entire strip belongs to A. B gets just five ten-thousandths.
        hold: 0.6
        visual_cues:
          - id: positives-distinct
            phrase: these are different guides
            targets:
              - distinct-positive-guides
          - id: positives-shares
            phrase: Look at their probabilities
            targets:
              - positive-shares
          - id: positives-tail
            phrase: B gets just five ten-thousandths
            targets:
              - magnified-tail
      - say: Compare two rules. One gives credit for finding either guide. The other scores each guide before
          averaging. Which loss still charges for missing B?
        hold: 2
        visual_cues:
          - id: positives-rules
            phrase: Compare two rules
            targets:
              - objective-choices
          - id: positives-predict
            phrase: Which loss still charges for missing B
            targets:
              - aggregation-question
      - say: Pool the positive shares first and the sum is nearly one. Its negative log is about five
          ten-thousandths of a nat. Nearly all that credit came from A.
        hold: 0.45
        visual_cues:
          - id: positives-pool
            phrase: Pool the positive shares first
            targets:
              - mass-calculation
          - id: positives-mass
            phrase: about five ten-thousandths of a nat
            targets:
              - mass-loss
      - say: Take each negative log separately. The cost for A is about one thousandth of a nat. The cost for
          B is about seven point six. Their mean is about three point eight nats. That second rule, the
          supervised contrastive mean over positives, still charges for the neglected answer. Choose the
          rule that fits what a successful search must find.
        hold: 0.7
        visual_cues:
          - id: positives-logs
            phrase: The cost for B is about seven point six
            targets:
              - individual-costs
          - id: positives-mean
            phrase: Their mean is about three point eight nats
            targets:
              - mean-log-loss
        caption_starts:
          - Their mean is about three point eight nats
      - say: Keep those shares. At a temperature of point two, compare the upward pressure on B’s score. Both
          rules try to raise it. With summed positive mass, B gets barely more than a millionth of a
          unit. With the mean of the two log losses, it gets nearly two and a half. The dots use the
          same scale. A shared encoder still has to combine these derivatives with the signals from
          other examples.
        hold: 0.7
        visual_cues:
          - id: positives-descent
            phrase: compare the upward pressure on B’s score
            targets:
              - positive-score-derivatives
  - id: mining-loop
    title: Audit the competitor before teaching it as wrong
    beats:
      - say: A word-based retriever like B M twenty-five can find lookalikes for
          this API key question. We want guides that share words but answer a
          different question. The replacement guide answers it. Set that guide
          aside. The other three cover different tasks.
        visual_cues:
          - id: cl-mining-loop-audit
            phrase: The replacement guide answers it
            targets:
              - mining-loop-mechanism
            color: cyan
            linger: 0.5
      - say: Count the words each guide shares with the query. The GPU guide shares
          none, so this mining rule drops it. Read the supplied teacher scores for
          the two that remain. The service signing key guide ranks first, followed
          by the KMS guide. Now watch what one hard negative does to the training
          row. Give it a cosine of point seven two. It competes with the target at
          point nine. The loss rises from less than a millionth of a nat to about
          point zero two seven.
        visual_cues:
          - id: cl-mining-loop-lexical
            phrase: Count the words each guide shares with the query
            targets:
              - mining-loop-mechanism
            color: cyan
            linger: 0.5
          - id: cl-mining-loop-teacher
            phrase: Read the supplied teacher scores
            targets:
              - mining-loop-mechanism
            color: cyan
            linger: 0.5
          - id: cl-mining-loop-mass
            phrase: about point zero two seven
            targets:
              - mining-loop-mechanism
            color: cyan
            linger: 0.5
          - id: repair-mining-sorted
            phrase: the two that remain
            targets:
              - picture
          - id: repair-mining-inputs
            phrase: Give it a cosine of point seven two
            targets:
              - picture
      - say: An iterative mining round re-encodes and indexes with a newer checkpoint,
          retrieves confusing passages and audits them before the next round.
          Keep evaluation queries and near-duplicate groups outside training and
          mining. A teacher threshold can remove suspicious positives but can
          also miss them or delete useful negatives. Measure those errors on
          independently labeled samples.
        visual_cues:
          - id: cl-mining-loop-round
            phrase: re-encodes and indexes with a newer checkpoint
            targets:
              - mining-loop-mechanism
            color: cyan
            linger: 0.5
          - id: cl-mining-loop-holdout
            phrase: Keep evaluation queries and near-duplicate groups outside training and
              mining
            targets:
              - mining-loop-mechanism
            color: cyan
            linger: 0.5
    visual: A fixed query retrieves lexical candidates, receives supplied teacher
      labels and commits verified negatives into the comparison row. The .72
      competitor adds exponential mass while the positive stays .90; hold-out
      queries remain outside mining.
  - id: teacher-margin
    title: What did the student copy?
    beats:
      - say: A teacher model scores the approved passage at point two and the non-match at point eight.
          Subtract the non-match score from the approved score. The teacher’s margin is minus point six.
          Now let the student copy that margin. Margin M S E squares the difference between their
          margins and averages those errors across training triples. On this triple the error is zero.
          The non-match is still ranked first.
        visual_cues:
          - id: cl-teacher-margin-difference
            phrase: scores the approved passage at point two and the non-match at point eight
            targets:
              - teacher-margin-mechanism
            color: cyan
            linger: 0.5
          - id: cl-teacher-margin-result
            phrase: let the student copy that margin
            targets:
              - teacher-margin-mechanism
            color: cyan
            linger: 0.5
          - id: cl-teacher-margin-wrong
            phrase: The non-match is still ranked first
            targets:
              - teacher-margin-mechanism
            color: pink
            linger: 0.5
      - say: There’s a second check. Look at the student’s possible margins. Each raw cosine lies between
          minus one and one. Even at opposite extremes, the approved score can lead by only two. Suppose
          a teacher using a different scoring scale asks for a margin of three and a half. The gap is at
          least one and a half. The smallest possible squared error here is two and a quarter. A lower
          temperature leaves the raw cosine range unchanged. Evaluate a compatible target scale, then
          check the actual ordering against relevance judgments.
        visual_cues:
          - id: cl-teacher-margin-range
            phrase: Look at the student’s possible margins
            targets:
              - teacher-margin-mechanism
            color: cyan
            linger: 0.5
          - id: cl-teacher-margin-scale
            phrase: two and a quarter
            targets:
              - teacher-margin-mechanism
            color: cyan
            linger: 0.5
          - id: teacher-target
            phrase: asks for a margin of three and a half
            targets:
              - teacher-target-ruler
    visual: Teacher scores .2/.8 construct a negative margin and a zero-MSE but reversed student order. A
      cosine score ruler bounds possible student gaps to [-2,2] while an unbounded teacher gap needs a
      declared mapping.
  - id: architectures
    title: Choose where the query and document are allowed to interact
    beats:
      - say: A bi-encoder gives each document its own vector. Documents can
          be encoded and indexed before a query arrives. At search time, encode
          the query once and compare it with those stored vectors. A cross-encoder
          jointly processes the query-document pair. A word in the query can
          attend to a word in the document. Each new pair needs its own pass.
        visual_cues:
          - id: cl-architectures-bi
            phrase: documents can be encoded and indexed before a query arrives
            targets:
              - architectures-mechanism
            color: cyan
            linger: 0.5
          - id: cl-architectures-cross
            phrase: jointly processes the query-document pair
            targets:
              - architectures-mechanism
            color: cyan
            linger: 0.5
      - say: Late interaction takes a third route. Encode and retain document token
          vectors independently, then perform a cheaper query-token to
          document-token comparison at search time. Each stored vector can carry
          context from the surrounding words. The search can now match individual
          query tokens against individual document tokens.
        visual_cues:
          - id: cl-architectures-late
            phrase: query-token to document-token comparison at search time
            targets:
              - architectures-mechanism
            color: cyan
            linger: 0.5
    visual: Retain one query and three document token sets across independent vector
      encoding, joint pair attention and stored token-level interaction. Move
      only the actual interaction stage; preserve what can be precomputed in
      each architecture.
  - id: maxsim-readout
    title: Each query token selects its best document-token match
    beats:
      - say: Read the row for API. Its closest match is the second document token,
          at point nine three. In the row for key, the third token wins with
          point nine one. MaxSim adds those two winning scores. Point nine three
          plus point nine one equals one point eight four. Swap the last two
          numbers in the key row. Both query tokens now choose the second document
          token. Their winning scores stay the same.
        visual_cues:
          - id: cl-maxsim-readout-api
            phrase: Its closest match is the second document token
            targets:
              - maxsim-readout-mechanism
            color: cyan
            linger: 0.5
          - id: cl-maxsim-readout-key
            phrase: the third token wins
            targets:
              - maxsim-readout-mechanism
            color: cyan
            linger: 0.5
          - id: cl-maxsim-readout-sum
            phrase: point nine three plus point nine one equals one point eight four
            targets:
              - maxsim-readout-mechanism
            color: cyan
            linger: 0.5
          - id: cl-maxsim-readout-reuse
            phrase: Swap the last two numbers
            targets:
              - maxsim-readout-mechanism
            color: cyan
            linger: 0.5
      - say: Those independent choices can match words in a different order.
          Raw storage depends on both count and width. One hundred token vectors of
          width one hundred twenty-eight contain about sixteen point seven times
          the coordinates of one width-seven-hundred-sixty-eight vector at equal
          precision.
        visual_cues:
          - id: cl-maxsim-readout-bytes
            phrase: about sixteen point seven times the coordinates
            targets:
              - maxsim-readout-mechanism
            color: cyan
            linger: 0.5
          - id: repair-maxsim-payload
            phrase: Raw storage depends on both count and width
            targets:
              - picture
      - say: ColBERT version two reduces storage using a nearest centroid ID and a one-
          or two-bit quantized residual per coordinate, reconstructing an
          approximate vector for scoring. Count the codebook and index structures
          when measuring storage. Test the reconstructed vectors on held-out
          searches to see which matches survive compression.
        visual_cues:
          - id: cl-maxsim-readout-compress
            phrase: a nearest centroid ID and a one- or two-bit quantized residual per
              coordinate
            targets:
              - maxsim-readout-mechanism
            color: cyan
            linger: 0.5
          - id: repair-maxsim-reconstruct
            phrase: reconstructing an approximate vector for scoring
            targets:
              - picture
    visual: Two query rows compare against three retained document-token columns.
      Highlight each row maximum and accumulate .93 plus .91 into 1.84; allow
      the same document column to win twice in a separate controlled row.
  - id: task-format
    title: The checkpoint decides which input format is meaningful
    beats:
      - say: The question asks how to rotate a key. The passage gives the steps.
          The input format tells the encoder which role each text plays. E five
          base version two prepends query colon to the query and passage colon
          to the document. It uses masked mean pooling and normalized vectors.
        visual_cues:
