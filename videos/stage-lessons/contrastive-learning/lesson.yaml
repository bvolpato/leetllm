scenes:
  - id: intro
    title: Find the running dog
    visual: A puppy bounds across one clip while a dog sleeps in the next. The three captions
      stay under their clips as exact-word counts give way to training labels.
    beats:
      - say: Search for a dog running. Count the exact words dog and running in these captions.
          Only the sleeping dog gets a hit.
        hold: 0.5
        visual_cues:
          - id: intro-words
            phrase: Count the exact words
            targets:
              - word-rule
          - id: intro-word-hit
            phrase: Only the sleeping dog gets a hit
            targets:
              - word-counts
      - say: Watch the clips. Which one would you put first?
        hold: 2.2
        visual_cues:
          - id: intro-choose
            phrase: Watch the clips
            targets:
              - caption-choice
      - say: The running puppy. Its caption uses different words for the action we want.
          The sleeping dog matches one word and misses the action.
        hold: 0.5
        visual_cues:
          - id: intro-puppy
            phrase: The running puppy
            targets:
              - puppy-label
          - id: intro-sleeper
            phrase: The sleeping dog matches one word
            targets:
              - sleeper-role
        caption_starts:
          - The running puppy
      - say: Pair the search with the puppy’s caption. In contrastive learning, we train a sentence
          encoder to score that caption higher than the sleeping dog’s. We can train on images and
          their captions with the same comparison.
        hold: 0.55
        visual_cues:
          - id: intro-train
            phrase: score that caption higher than the sleeping dog’s
            targets:
              - training-pair
  - id: order-collision
    title: An average cannot recover the order it discarded
    beats:
      - say: Read the first row. The compiler calls the linker. Swap those two words
          in the second row. Now the linker makes the call. Give each word a fixed
          vector and average the three. Both rows add the same numbers and divide
          by three. Both produce point eight, point one three three, point one.
          A search index sees exactly the same point for two different calls.
        visual_cues:
          - id: cl-order-collision-tokens
            phrase: Swap those two words
            targets:
              - order-collision-mechanism
            color: cyan
            linger: 0.5
          - id: cl-order-collision-mean
            phrase: Both produce point eight, point one three three, point one
            targets:
              - order-collision-mechanism
            color: cyan
            linger: 0.5
      - say: Now let the encoder read the whole sentence before pooling. The word
          compiler can get one vector as the caller and another as the callee.
          The two averages can finally differ. Another choice is to use BERT’s
          first token. Test how well that vector ranks passages against a model
          trained for sentence retrieval. If almost every cosine looks the same,
          check for repeated embeddings, a bad padding mask or an error in the
          score matrix.
        visual_cues:
          - id: cl-order-collision-context
            phrase: read the whole sentence before pooling
            targets:
              - order-collision-mechanism
            color: cyan
            linger: 0.5
          - id: cl-order-collision-diagnose
            phrase: The two averages can finally differ
            targets:
              - order-collision-mechanism
            color: cyan
            linger: 0.5
    visual: Two reordered compiler/calls/linker token rows carry identical supplied
      static vectors into the same mean. Contextual token states then split the
      sentence representations; raw CLS remains a separately tested pooling
      choice.
  - id: encode
    title: Use the same encoder contract for every item
    visual: Four independent text paths share an encoder, pooling rule and normalization. When the passage
      prefixes change, the old plot gives way to a request to re-encode and evaluate.
    beats:
      - say: A sentence encoder maps a variable-length text to a fixed-length vector using a specified pooling
          rule. A dual-encoder system can encode queries and documents separately, then compare their
          vectors. Shared or compatible training makes those representations belong to the intended
          scoring space.
        hold: 0.6
        visual_cues:
          - id: encode-candidate-vector-3-b1-1
            phrase: compare their vectors
            targets:
              - candidate-vector-3
            color: yellow
            linger: 0.6
          - id: repair-encode-pooling
            phrase: using a specified pooling rule
            targets:
              - picture
      - say: Our anchor sentence is a dog is running. Its positive partner is a puppy runs. The other
          candidates describe a sleeping dog and a blue sky. We normalize the supplied vectors to unit
          length, so each dot product is also a cosine similarity.
        hold: 0.6
        visual_cues:
          - id: encode-candidate-vector-0-b2-1
            phrase: positive partner
            targets:
              - candidate-vector-0
            color: green
            linger: 0.6
          - id: encode-unit-vector-contract-b2-2
            phrase: unit length
            targets:
              - unit-vector-contract
            color: cyan
            linger: 0.6
      - say: Now change the text that reaches the encoder. Some checkpoints expect different query and passage
          prefixes. Others take an instruction paired with the text. If you change the passage format
          after indexing, encode the passages again and check the resulting vectors and rankings on
          held-out queries. Keep the tested format in training, indexing and search.
        hold: 0.8
        visual_cues:
          - id: encode-candidate-vector-3-b3-1
            phrase: resulting vectors and rankings
            targets:
              - candidate-vector-3
            color: yellow
            linger: 0.6
          - id: repair-encode-format
            phrase: different query and passage prefixes
            targets:
              - picture
  - id: pooling-tensor
    title: Which tokens enter the mean?
    beats:
      - say: Look at the ninety-nines in the last row of each grid. Those are padding. Exclude the masked
          states before adding anything. For A, sum the two valid token vectors and divide by two. B has
          just one valid token. Its mean is that token itself. A lands halfway along each axis, while B
          points straight up. Normalize each mean to unit length. Now a dot product gives the cosine,
          because both vector norms are one. An empty mask has no mean, and a zero or nonfinite vector
          has no valid unit direction.
        visual_cues:
          - id: cl-pooling-tensor-mask
            phrase: Exclude the masked states
            targets:
              - pooling-tensor-mechanism
            color: cyan
            linger: 0.5
          - id: cl-pooling-tensor-sum
            phrase: sum the two valid token vectors
            targets:
              - pooling-tensor-mechanism
            color: cyan
            linger: 0.5
          - id: cl-pooling-tensor-mean
            phrase: A lands halfway along each axis
            targets:
              - pooling-tensor-mechanism
            color: cyan
            linger: 0.5
          - id: cl-pooling-tensor-norm
            phrase: Normalize each mean to unit length
            targets:
              - pooling-tensor-mechanism
            color: cyan
            linger: 0.5
      - say: Multiply the query matrix by the transposed passage matrix. Each row now compares one query with
          both passages. A targets the first column and B the second because that’s where we put their
          paired passages. At temperature point two, the average loss is about point three five. Follow
          the gradient back to A’s first token. One coordinate has a negative derivative and the other a
          positive one. The masked padding gets zero on both. These are derivatives with respect to the
          supplied token states.
        visual_cues:
          - id: cl-pooling-tensor-matrix
            phrase: Multiply the query matrix by the transposed passage matrix
            targets:
              - pooling-tensor-mechanism
            color: cyan
            linger: 0.5
          - id: cl-pooling-tensor-loss
            phrase: the average loss is about point three five
            targets:
              - pooling-tensor-mechanism
            color: cyan
            linger: 0.5
          - id: cl-pooling-tensor-gradient
            phrase: The masked padding gets zero on both
            targets:
              - pooling-tensor-mechanism
            color: cyan
            linger: 0.5
    visual: Masked token-state cells feed two coordinate accumulators; padding is crossed out before
      normalization. The resulting query/passage vectors build the computed 2-by-2 score matrix and its
      row losses, with zero padding gradient.
  - id: scores
    title: Who shares the denominator?
    visual: The three cosine scores stay fixed. Two equal-scale strips show how admitting the sleeper
      changes the total exponential mass and the puppy’s share.
    beats:
      - say: Back to the archive. We’ve given each caption a unit vector, so its dot product with the query is
          its cosine score. The puppy scores a little higher than the sleeping dog. How much that gap
          matters depends on who else is in the comparison.
        hold: 0.4
      - say: Start with the highest score. Subtract it from each score, divide by a positive temperature, then
          exponentiate. The highest score now contributes one unit of mass. Subtracting the same value
          from every score leaves the shares unchanged. We’re using a temperature of point two.
        hold: 0.4
        visual_cues:
          - id: scores-mass
            phrase: one unit of mass
            targets:
              - candidate-weights
      - say: Let only the puppy and the sky compete. The sky adds about three thousandths of a unit. Divide
          the puppy’s one unit by the total and its share is about ninety-nine point seven percent.
          That’s its softmax probability among these two captions.
        hold: 0.55
        visual_cues:
          - id: scores-two
            phrase: only the puppy and the sky
            targets:
              - two-candidate-strip
          - id: scores-initial-share
            phrase: about ninety-nine point seven percent
            targets:
              - two-candidate-share
      - say: Now admit the sleeping dog to the lower row. Keep every vector and the temperature fixed. What
          happens to the puppy’s share?
        hold: 2
        visual_cues:
          - id: scores-admit
            phrase: admit the sleeping dog
            targets:
              - full-pool-track
          - id: scores-predict
            phrase: What happens to the puppy’s share
            targets:
              - share-question
      - say: The sleeper adds nearly three quarters of a unit. The puppy still brings one unit, but now it
          gets only fifty-seven point four percent. That probability belongs to this pool. A lower
          temperature would favor the leader more strongly here because it magnifies the score gaps
          before exponentiation.
        hold: 0.8
        visual_cues:
          - id: scores-new-mass
            phrase: The sleeper adds
            targets:
              - full-pool-mass
          - id: scores-answer
            phrase: only fifty-seven point four percent
            targets:
              - full-pool-share
        caption_starts:
          - The puppy still brings one unit
  - id: objective
    title: What does one competitor cost?
    visual: The full three-caption strip stays in place. Below it, removing the sky and then removing the
      sleeping dog changes the denominator, share and loss. The full row supplies all three raw-score
      derivatives.
    beats:
      - say: The upper strip keeps all three captions. The puppy is our designated match. Its exponential
          weight is the numerator, and all three weights make up the denominator. To get the InfoNCE
          loss, take the negative natural log of the puppy’s share. Here that costs about point five
          five five nats.
        hold: 0.5
        visual_cues:
          - id: objective-log
            phrase: about point five five five nats
            targets:
              - full-pool-loss
      - say: Leave the full row on top for comparison. Down below, omit the sky. Its sliver was so small that
          the loss barely moves. Put the sky back and omit the sleeping dog instead. Now the puppy gets
          nearly the entire pool, and the loss drops almost to zero. The vectors never moved. We made
          the task easier.
        hold: 0.7
        visual_cues:
          - id: objective-sky
            phrase: omit the sky
            targets:
              - sky-omitted
          - id: objective-sleeper
            phrase: omit the sleeping dog instead
            targets:
              - sleeper-omitted
      - say: Return to all three captions. To see which scores training will try to change, subtract the
          target from each share, then divide by temperature. The target is one for the puppy and zero
          for each competitor. The puppy gets a negative derivative. Both competitors get positive
          derivatives.
        hold: 0.5
        visual_cues:
          - id: objective-all
            phrase: Return to all three captions
            targets:
              - full-pool-strip
          - id: objective-gradient
            phrase: subtract the target from each share
            targets:
              - score-gradient
          - id: objective-directions
            phrase: Both competitors get positive derivatives
            targets:
              - candidate-derivatives
      - say: Descent goes against the derivative. It tries to raise the puppy’s score and lower the sleeper’s.
          The sky barely contributes. In an encoder those signals pass through shared weights, so the
          three scores can’t be adjusted independently.
        hold: 0.6
  - id: loss-numerics
    title: One score row, worked both ways
    beats:
      - say: Take the first query in the article’s two-query matrix. A is its target. A scores point nine and
          B scores point two. At temperature point zero five those logits are eighteen and four.
          Subtract their maximum and you have zero and minus fourteen. Exponentiate them. A contributes
          one unit and B contributes less than one millionth. A gets almost all the probability. The
          loss is less than one millionth of a nat.
        visual_cues:
          - id: cl-loss-numerics-scores
            phrase: A scores point nine and B scores point two
            targets:
              - loss-numerics-mechanism
            color: cyan
            linger: 0.5
          - id: cl-loss-numerics-logits
            phrase: those logits are eighteen and four
            targets:
              - loss-numerics-mechanism
            color: cyan
            linger: 0.5
          - id: cl-loss-numerics-center
            phrase: you have zero and minus fourteen
            targets:
              - loss-numerics-mechanism
            color: cyan
            linger: 0.5
          - id: cl-loss-numerics-mass
            phrase: B contributes less than one millionth
            targets:
              - loss-numerics-mechanism
            color: cyan
            linger: 0.5
          - id: cl-loss-numerics-prob
            phrase: A gets almost all the probability
            targets:
              - loss-numerics-mechanism
            color: cyan
            linger: 0.5
          - id: cl-loss-numerics-loss
            phrase: The loss is less than one millionth of a nat
            targets:
              - loss-numerics-mechanism
            color: cyan
            linger: 0.5
        hold: 1.4
      - say: Swap the scores while keeping A as the target. Now almost all the probability goes to B, and the
          loss is about fourteen nats.
        hold: 0.7
        visual_cues:
          - id: cl-loss-numerics-swap
            phrase: the loss is about fourteen nats
            targets:
              - loss-numerics-mechanism
            color: cyan
            linger: 0.5
          - id: numerics-swap-input
            phrase: Swap the scores while keeping A as the target
            targets:
              - swapped-logits
      - say: For a one-positive row, loss can be written as log-sum-exp of candidate logits minus the positive
          logit. Our implementation first divides scores by temperature and requires finite logits. It
          subtracts the maximum from those logits before exponentiation, then adds the
          maximum-minus-positive gap separately. That avoids subtracting two huge nearly equal
          log-sum-exp values; two tied logits of ten to the three hundred eight still give log two.
          Temperature division can itself overflow, so reject nonfinite logits, nonpositive temperature
          and mismatched widths. Stable vector normalization first scales a finite vector by its maximum
          absolute coordinate, so a tiny nonzero vector around ten to the negative three hundred can
          still normalize. Zero vectors remain invalid.
        visual_cues:
          - id: cl-loss-numerics-finite
            phrase: requires finite logits
            targets:
              - loss-numerics-mechanism
            color: cyan
            linger: 0.5
          - id: cl-loss-numerics-gap
            phrase: adds the maximum-minus-positive gap separately
            targets:
              - loss-numerics-mechanism
            color: cyan
            linger: 0.5
          - id: cl-loss-numerics-tied
            phrase: two tied logits of ten to the three hundred eight still give log two
            targets:
              - loss-numerics-mechanism
            color: cyan
            linger: 0.5
          - id: cl-loss-numerics-tiny
            phrase: a tiny nonzero vector around ten to the negative three hundred can still normalize
            targets:
              - loss-numerics-mechanism
            color: cyan
            linger: 0.5
      - say: Here we average the loss over queries. To train in the reverse direction too, each passage
          needs a label for the query that goes with it. With one target per row, each score has a
          derivative equal to its row probability minus one for the positive, or minus zero for a
          negative, all divided by temperature. The encoder combines those signals when it updates its
          shared weights.
        visual_cues:
          - id: cl-loss-numerics-gradient
            phrase: its row probability minus one for the positive, or minus zero for a negative, all divided by
              temperature
            targets:
              - loss-numerics-mechanism
            color: cyan
            linger: 0.5
    visual: The same first score row becomes temperature-scaled logits, centered logits, exponential
      masses and a normalized probability. Keep every candidate column aligned while separate
      max-minus-positive arithmetic avoids catastrophic cancellation.
  - id: triplet-margin
    title: A distance gap must meet the declared margin
    beats:
      - say: Triplet loss compares distances rather than a candidate softmax. Take the
          maximum of zero and positive distance minus negative distance plus the
          required margin. With positive distance point two, negative point five
          and margin point one, the expression is negative point two, so loss is
          zero. If positive distance becomes point five and negative point three
          with the same margin, loss is point three.
        visual_cues:
          - id: cl-triplet-margin-rule
            phrase: positive distance minus negative distance plus the required margin
            targets:
              - triplet-margin-mechanism
            color: cyan
            linger: 0.5
          - id: cl-triplet-margin-zero
            phrase: the expression is negative point two, so loss is zero
            targets:
              - triplet-margin-mechanism
            color: pink
            linger: 0.5
          - id: cl-triplet-margin-active
            phrase: the same margin, loss is point three
            targets:
              - triplet-margin-mechanism
            color: cyan
            linger: 0.5
          - id: repair-triplet-inputs
            phrase: If positive distance becomes point five and negative point three
            targets:
              - picture
      - say: On the ruler, a smaller distance means a closer match. Choose a distance
          and set the margin on that scale. Euclidean distance and squared Euclidean
          distance give different gaps. With cosine scores, one minus cosine gives a
          distance that shrinks as the match improves. A triplet stops contributing
          once its gap meets the margin. With InfoNCE, every candidate in the row
          still contributes to the denominator.
        visual_cues:
          - id: cl-triplet-margin-contract
            phrase: a smaller distance means a closer match
            targets:
              - triplet-margin-mechanism
            color: cyan
            linger: 0.5
    visual: Retain anchor, positive and negative points on an explicit distance
      ruler. Construct d-positive minus d-negative plus margin, clip at zero,
      then move the supplied distances to activate the hinge.
  - id: temperature-gradient
    title: How much pressure does the score get?
    beats:
      - say: For the supplied positive point nine and negative point two, the gap is point seven. Positive
          probability is one divided by one plus the exponential of negative gap divided by temperature.
          Its raw-score gradient magnitude is one minus that probability, divided by temperature. This
          combines sharpening and the explicit inverse-temperature factor.
        visual_cues:
          - id: cl-temperature-gradient-gap
            phrase: the gap is point seven
            targets:
              - temperature-gradient-mechanism
            color: cyan
            linger: 0.5
          - id: cl-temperature-gradient-rule
            phrase: one minus that probability, divided by temperature
            targets:
              - temperature-gradient-mechanism
            color: cyan
            linger: 0.5
      - say: Start at temperature one. The gradient magnitude is about a third. Lower the temperature to one
          tenth. The winner now takes so much of the probability that the gradient falls below one
          hundredth. Halve the temperature again and the gradient drops to about seventeen millionths.
          At one hundredth it is effectively zero. The explicit inverse-temperature factor grew, but the
          probability left over for the loser shrank much faster. A mislabeled candidate that still
          holds a large share can get a large unwanted update.
        visual_cues:
          - id: cl-temperature-gradient-one
            phrase: Start at temperature one
            targets:
              - temperature-gradient-mechanism
            color: cyan
            linger: 0.5
          - id: cl-temperature-gradient-tenth
            phrase: Lower the temperature to one tenth
            targets:
              - temperature-gradient-mechanism
            color: cyan
            linger: 0.5
          - id: cl-temperature-gradient-fifth
            phrase: Halve the temperature again
            targets:
              - temperature-gradient-mechanism
            color: cyan
            linger: 0.5
          - id: cl-temperature-gradient-tiny
            phrase: At one hundredth
            targets:
              - temperature-gradient-mechanism
            color: cyan
            linger: 0.5
      - say: Now compare two negatives in the same row. Give them scores of point seven two and point two at
          temperature point zero five. The common denominator cancels in the ratio of their gradients.
          Exponentiate the score gap divided by temperature. The higher-scoring negative gets about
          thirty-three thousand times as much pressure. Before acting on that signal, check whether its
          negative label is correct.
        visual_cues:
          - id: cl-temperature-gradient-ratio
            phrase: about thirty-three thousand times as much pressure
            targets:
              - temperature-gradient-mechanism
            color: cyan
            linger: 0.5
          - id: repair-ratio-inputs
            phrase: Give them scores of point seven two and point two at temperature point zero five
            targets:
              - picture
    visual: A fixed-score gap drives a computed probability curve and a separate raw-score-gradient curve
      over temperature. Four marked temperatures expose saturation; a second pair of negative masses
      yields their exponential gradient ratio.
  - id: geometry
    title: Turn the query on the unit circle
    visual: Three fixed tips and a dashed starting ray make one angular gradient step readable. A fixed
      start column stays beside the changing angle, positive share and loss through all thirty steps.
    beats:
      - say: Put our three captions back on the circle. Each tip is a fixed candidate. The cyan query arrow
          can turn, but its length stays one. Its angle to each caption determines that caption’s
          cosine. The start column records what the puppy gets before we move.
        hold: 0.6
      - say: We can calculate the slope of the loss with respect to the query angle. Each cosine depends on
          that one angle, so all three score derivatives contribute. Subtract three hundredths of that
          slope from the angle in radians. Take one step.
        hold: 1.2
        visual_cues:
          - id: geometry-slope
            phrase: slope of the loss
            targets:
              - angular-update
          - id: geometry-first
            phrase: Take one step
            targets:
              - anchor-angle
      - say: The dashed ray marks where the query started. It turned toward the puppy and away from the
          sleeping dog. The puppy’s share went from about fifty-seven percent to sixty-eight percent in
          that one step.
        hold: 0.55
      - say: Take the next twenty-nine steps. Each one uses the slope at the new angle. You can see the
          movement slow as the puppy pulls ahead. After thirty updates, it gets about ninety-six percent
          of this row. In a real encoder, both sides can move. We still have to check whether other
          sentences remain distinguishable.
        hold: 0.8
        visual_cues:
          - id: geometry-continue
            phrase: Take the next twenty-nine steps
            targets:
              - gradient-steps
  - id: alignment-uniformity
    title: Separate a close positive pair from a collapsed space
    beats:
      - say: Follow the cyan dot on the right. Its green partner is close by. That’s
          alignment. Now slide every pair onto the same spot. The partners are as
          close as they can get. Can the query’s score still pick out its partner?
        hold: 1.8
        visual_cues:
          - id: cl-alignment-uniformity-align
            phrase: Its green partner is close by
            targets:
              - alignment-uniformity-mechanism
            color: cyan
            linger: 0.5
          - id: cl-alignment-uniformity-collapse
            phrase: slide every pair onto the same spot
            targets:
              - alignment-uniformity-mechanism
            color: cyan
            linger: 0.5
      - say: All four tie. The query gives its partner one quarter of the probability.
          With N tied candidates and one target, the loss is the natural log of N.
          Now spread the pairs around the circle. Each query still has its partner
          nearby, and the other three are farther away. Uniformity describes how
          the whole collection spreads across the unit sphere. Alignment measures
          closeness within pairs.
        caption_starts:
          - All four tie
        visual_cues:
          - id: cl-alignment-uniformity-loss
            phrase: one quarter of the probability
            targets:
              - alignment-uniformity-mechanism
          - id: cl-alignment-uniformity-spread
            phrase: spread the pairs around the circle
            targets:
              - alignment-uniformity-mechanism
            color: cyan
            linger: 0.5
    visual: Four query-partner pairs collapse to one point. All four candidates
      get the same share. The pairs spread around the circle while each partner
      stays close to its query.
  - id: pair-supervision
    title: A positive label comes from a stated relation
    beats:
      - say: A puppy is running, so an animal is running. That’s entailment. Try
          going the other way. A running animal could be a horse. Natural
          language inference labels sentence pairs as entailment, contradiction
          or neutral. An entailment pair can be a positive training example
          when that direction fits the task.
        visual_cues:
          - id: cl-pair-supervision-entail
            phrase: so an animal is running
            targets:
              - pair-supervision-mechanism
            color: cyan
            linger: 0.5
          - id: cl-pair-supervision-reverse
            phrase: A running animal could be a horse
            targets:
              - pair-supervision-mechanism
            color: cyan
            linger: 0.5
      - say: Original Sentence-BERT shares encoder weights, pools each sentence and
          trains a classifier on the two embeddings plus their elementwise
          absolute difference for its NLI objective. It also studies regression
          and triplet objectives. Supervised SimCSE instead uses entailment
          pairs as positives and the corresponding contradictions as hard
          negatives in its contrastive setup. After training, both methods let
          you encode each document once and reuse its vector for many queries.
        visual_cues:
          - id: cl-pair-supervision-sbert
            phrase: two embeddings plus their elementwise absolute difference
            targets:
              - pair-supervision-mechanism
            color: cyan
            linger: 0.5
          - id: cl-pair-supervision-simcse
            phrase: entailment pairs as positives and the corresponding contradictions as
              hard negatives
            targets:
              - pair-supervision-mechanism
            color: cyan
            linger: 0.5
    visual: Premise, entailment and contradiction sentence identities retain
      directional relation arrows. Three vector strips build the original SBERT
      u/v/absolute-difference classifier separately from the contrastive labeled
      pool.
  - id: dropout-views
    title: Two stochastic views preserve one sentence identity
    beats:
      - say: Unsupervised SimCSE feeds the same sentence through the encoder twice with
          different dropout masks. The two text identities stay equal while
          different hidden units are zeroed. Other batch sentences supply
          competitors and still need a false-negative audit. Use training mode
          for these stochastic views; ordinary repeatable embedding inference
          disables dropout.
        visual_cues:
          - id: cl-dropout-views-masks
            phrase: different dropout masks
            targets:
              - dropout-views-mechanism
            color: cyan
            linger: 0.5
          - id: cl-dropout-views-off
            phrase: ordinary repeatable embedding inference disables dropout
            targets:
              - dropout-views-mechanism
            color: cyan
            linger: 0.5
      - say: In the revised SimCSE paper’s BERT-base STS evaluation, the unsupervised
          and supervised variants report seventy-six point three and eighty-one
          point six average Spearman correlation multiplied by one hundred.
          In that experiment, removing dropout or using the same mask twice
          lowered the scores.
        visual_cues:
          - id: cl-dropout-views-historical
            phrase: seventy-six point three and eighty-one point six
            targets:
              - dropout-views-mechanism
            color: cyan
            linger: 0.5
      - say: Augmentations are hypotheses about meaning. Verify paraphrases,
          translations and same-approved-document domain pairs. Deleting not, a
          version condition or an authorization requirement can turn a false
          statement into a mislabeled positive. A cross-encoder can help score
          candidates, but its label needs independent evidence too.
        visual_cues:
          - id: cl-dropout-views-not
            phrase: Deleting not, a version condition or an authorization requirement
            targets:
              - dropout-views-mechanism
            color: cyan
            linger: 0.5
    visual: One retained sentence enters two supplied dropout masks over distinct
      encoder passes. Two masked state grids become paired views; switch to
      evaluation with dropout off and keep augmentation meaning checks visible.
  - id: negatives
    title: Which caption belongs in the negative pool?
    visual: Two mined captions tie on cosine below the puppy. The viewer audits the action in each caption
      before assigning the sleeping dog to the negative pool and protecting the running hound.
    beats:
      - say: The puppy is still our target. The sky is an easy negative. If every other caption were that far
          away, a low loss would tell us little about whether we could distinguish running from
          sleeping.
        hold: 0.45
        visual_cues:
          - id: mine-easy
            phrase: The sky is an easy negative
            targets:
              - sky-role
      - say: Suppose mining brings back two more captions from the archive. Both have the same high cosine in
          this example. Read the action in each caption. Which high scorer can you use as a negative for
          this query?
        hold: 2
        visual_cues:
          - id: mine-pair
            phrase: two more captions
            targets:
              - mined-captions
          - id: mine-choose
            phrase: Which high scorer can you use as a negative
            targets:
              - label-choice
      - say: Keep the sleeping dog as a hard negative. It shares the animal and changes the action. The hound
          is sprinting. That’s another valid answer. A high model score put both captions on the review
          list. Checking the action decided which one belonged in the denominator as a negative. In a
          document collection, that check may take a reviewer who knows what the query asks.
        hold: 0.7
        visual_cues:
          - id: mine-sleeper
            phrase: Keep the sleeping dog as a hard negative
            targets:
              - sleeper-role
          - id: mine-sprinter
            phrase: another valid answer
            targets:
              - hound-role
  - id: batch-identity
    title: Which passages did the query see?
    visual: Six queries and six passages stay on fixed axes. Two three-pair microbatches fill the diagonal
      blocks. Only a shared denominator fills the two gaps of cross-batch competitors.
    beats:
      - say: Read across a query’s row to see which passages it competes over. Start with A alone. Its only
          passage takes all the probability, so the loss is zero for any score. Add pairs B and C to
          that batch. Three query encodings and three passage encodings give six off-diagonal
          comparisons. Each query sees two competing passages.
        hold: 0.6
        visual_cues:
          - id: batch-alone
            phrase: Start with A alone
            targets:
              - single-pair
          - id: batch-three
            phrase: Add pairs B and C
            targets:
              - first-microbatch
      - say: Now process a second batch of three. Count both squares. Twelve texts went through an encoder,
          and the pink cells represent twelve directed off-diagonal scores. The texts can be encoded in
          batches. Does accumulating the two batches’ gradients fill the empty corners?
        hold: 2
        visual_cues:
          - id: batch-second
            phrase: a second batch of three
            targets:
              - second-microbatch
          - id: batch-predict
            phrase: Does accumulating
            targets:
              - cross-batch-gaps
      - say: The corners stay empty. The gradients add after each batch has already used its own denominator.
          Now gather all six passage embeddings and use one pool for each of the six queries. Each query
          sees five other passages. That makes thirty off-diagonal scores from the same twelve text
          encodings. The full score matrix grows quadratically with the number of pairs.
        hold: 0.55
        visual_cues:
          - id: batch-separate
            phrase: The corners stay empty
            targets:
              - cross-batch-gaps
          - id: batch-gather
            phrase: use one pool for each
            targets:
              - cross-batch-scores
          - id: batch-total
            phrase: thirty off-diagonal scores
            targets:
              - comparison-count
        caption_starts:
          - The corners stay empty
          - That makes thirty off-diagonal scores
      - say: If you gather across devices or reuse cached embeddings, check where gradients flow and which
          candidates belong in each row. Pink means the loss treats a passage as a competitor. Two of
          those entries can be copies of the very same guide. Even different passage IDs can answer the
          same question.
        hold: 0.65
        visual_cues:
          - id: batch-audit
            phrase: Pink means the loss treats a passage as a competitor
            targets:
              - assigned-labels
  - id: false-negatives
    title: One guide in two batch columns
    visual: Two copies of an approved rotation guide contribute equal masses. The original denominator
      stays as a reference while a second denominator excludes only the copy, with its cosine and
      identity still visible.
    beats:
      - say: Two people asked how to rotate an API key. Both answers point to the same approved rotation
          guide. In the first query’s row, A and B are copies of that guide. C is about a different kind
          of key. The supplied cosine scores for A and B are identical.
        hold: 0.4
      - say: The diagonal label picks A alone. A and B each put one unit into the denominator, so each gets
          just under half the probability. Look at copy B. Will a step of gradient descent try to raise
          or lower its score?
        hold: 2.1
        visual_cues:
          - id: duplicate-columns
            phrase: diagonal label picks A alone
            targets:
              - duplicate-denominator
          - id: duplicate-predict
            phrase: Will a step of gradient descent
            targets:
              - score-direction-question
      - say: It tries to lower B. B has a target of zero, so its raw-score derivative is its probability
          divided by temperature, about plus two point four six. Descent subtracts that positive
          derivative. The text is a correct answer. Its position in this batch made it a false negative.
        hold: 0.8
        visual_cues:
          - id: duplicate-lower
            phrase: It tries to lower B
            targets:
              - score-direction
          - id: duplicate-direction
            phrase: about plus two point four six
            targets:
              - copy-gradient
        caption_starts:
          - It tries to lower B
      - say: Mask copy B for this query. You can still see its cosine. Its unit of mass drops out of the lower
          denominator. A now receives about ninety-seven percent. The direct derivative for the masked
          score is zero. That’s the repair. The lower loss tells us we changed the comparison. Shared
          encoder weights can still change B through other scores.
        hold: 0.8
        visual_cues:
          - id: duplicate-mask
            phrase: Mask copy B for this query
            targets:
              - masked-denominator
          - id: duplicate-new-share
            phrase: about ninety-seven percent
            targets:
              - surviving-share
          - id: duplicate-zero
            phrase: masked score is zero
            targets:
              - masked-gradient
        caption_starts:
