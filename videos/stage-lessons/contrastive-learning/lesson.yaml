            phrase: prepends query colon to the query and passage colon to the document
            targets:
              - task-format-mechanism
            color: cyan
            linger: 0.5
      - say: The recommended instructed B G E version-one-point-five retrieval setting
          adds its retrieval instruction to short queries and keeps passages
          plain. You can also evaluate B G E with plain queries. Original
          INSTRUCTOR takes an instruction and text pair for each input.
        visual_cues:
          - id: cl-task-format-bge
            phrase: adds its retrieval instruction to short queries and keeps passages plain
            targets:
              - task-format-mechanism
            color: cyan
            linger: 0.5
          - id: cl-task-format-instructor
            phrase: takes an instruction and text pair
            targets:
              - task-format-mechanism
            color: cyan
            linger: 0.5
      - say: Bind checkpoint revision, tokenizer, pooling, normalization, input
          prefixes, corpus version and index score function together. Changing
          query formatting while leaving old document embeddings fixed changes
          the comparison. Test the new queries against the stored passages to
          see which answers still rank first.
        visual_cues:
          - id: cl-task-format-bind
            phrase: Bind checkpoint revision, tokenizer, pooling, normalization, input
              prefixes, corpus version and index score function together
            targets:
              - task-format-mechanism
            color: cyan
            linger: 0.5
    visual: Persistent query and passage strings receive checkpoint-specific E5
      prefixes, BGE query instruction or INSTRUCTOR instruction/text pairing.
      Keep formatting operations separate from unexecuted neural inference.
  - id: prefix-failure
    title: A shorter vector can erase the deciding coordinate
    beats:
      - say: Look down the second column. The query and its match both have
          positive point eight there. The distractor has negative point eight.
          Full cosines are one and negative point two eight. Keep only the first
          coordinate and normalize. Every row had point six in that column.
          All three become one, so both scores tie at one. We just cut away
          the coordinate that told the passages apart.
        visual_cues:
          - id: cl-prefix-failure-full
            phrase: Full cosines are one and negative point two eight
            targets:
              - prefix-failure-mechanism
            color: cyan
            linger: 0.5
          - id: cl-prefix-failure-cut
            phrase: Keep only the first coordinate and normalize
            targets:
              - prefix-failure-mechanism
            color: cyan
            linger: 0.5
          - id: cl-prefix-failure-tie
            phrase: both scores tie at one
            targets:
              - prefix-failure-mechanism
            color: cyan
            linger: 0.5
      - say: A prefix of a unit vector has norm at most one. It can equal one when
          discarded coordinates are zero, or become zero when retained
          coordinates are zero. Reject or explicitly handle a zero prefix before
          cosine normalization. Arbitrarily slicing an ordinary embedding has no
          trained quality guarantee. Use a supported shortening contract and
          measure each target width.
        visual_cues:
          - id: cl-prefix-failure-zero
            phrase: Reject or explicitly handle a zero prefix
            targets:
              - prefix-failure-mechanism
            color: pink
            linger: 0.5
    visual: A supplied full-width query and documents have distinct cosine scores.
      Cut the same coordinate strips to one dimension and renormalize; both
      positive prefixes collide at one while a zero prefix is rejected.
  - id: nested-loss
    title: Train the selected prefixes rather than merely cutting them
    beats:
      - say: Matryoshka representation learning applies objectives to selected nested
          prefix widths of one representation. The original method includes
          classification and other objectives. In this cosine-contrastive
          application, slice both sides at each chosen width, normalize valid
          nonzero prefixes, compute their InfoNCE losses and combine them with
          declared nonnegative weights.
        visual_cues:
          - id: cl-nested-loss-slice
            phrase: slice both sides at each chosen width
            targets:
              - nested-loss-mechanism
            color: cyan
            linger: 0.5
          - id: cl-nested-loss-loss
            phrase: compute their InfoNCE losses
            targets:
              - nested-loss-mechanism
            color: cyan
            linger: 0.5
          - id: repair-nested-normalize
            phrase: normalize valid nonzero prefixes
            targets:
              - picture
      - say: Take prefixes of width two, four and six from the same example vectors. Their
          losses round to point zero zero eight eight, point zero one four seven
          and point zero two two five. Equal weighting gives about point zero
          one five three. If the short index matters most, giving its loss more
          weight makes errors at that width count more during training. Check
          retrieval at each width on held-out queries.
        visual_cues:
          - id: cl-nested-loss-two
            phrase: point zero zero eight eight
            targets:
              - nested-loss-mechanism
            color: cyan
            linger: 0.5
          - id: cl-nested-loss-four
            phrase: point zero one four seven
            targets:
              - nested-loss-mechanism
            color: cyan
            linger: 0.5
          - id: cl-nested-loss-six
            phrase: point zero two two five
            targets:
              - nested-loss-mechanism
            color: cyan
            linger: 0.5
          - id: cl-nested-loss-mean
            phrase: Equal weighting gives about point zero one five three
            targets:
              - nested-loss-mechanism
            color: cyan
            linger: 0.5
      - say: A hierarchical search can index short prefixes, retrieve a shortlist and
          rescore those candidates at full width. Ten million width-sixty-four
          float32 vectors have two point five six decimal gigabytes of raw
          payload, versus thirty point seven two at width seven hundred
          sixty-eight. IDs, graph links, metadata and full-vector storage add
          costs. Full width cannot rescore an omitted passage, and vector width
          is distinct from numerical precision.
        visual_cues:
          - id: cl-nested-loss-bytes
            phrase: two point five six decimal gigabytes of raw payload, versus thirty point
              seven two
            targets:
              - nested-loss-mechanism
            color: cyan
            linger: 0.5
          - id: cl-nested-loss-missing
            phrase: Full width cannot rescore an omitted passage
            targets:
              - nested-loss-mechanism
            color: pink
            linger: 0.5
          - id: repair-nested-search
            phrase: A hierarchical search can index short prefixes
            targets:
              - picture
    visual: One coordinate strip exposes nested widths 2,4,6. Normalize each
      retained prefix, compute its own comparison loss and average the three
      objectives. Separate raw vector bytes from index overhead and duplicate
      full-vector storage.
  - id: retrieval
    title: Training comparisons become an independent search index
    visual: Candidate document vectors are computed once and stored. A new query
      vector scores the fixed index, then retrieved results receive held-out
      relevance checks.
    beats:
      - say: After training, encode documents and store their vectors. A query can then
          be encoded once and compared with many stored candidates, which is the
          practical attraction of a dual encoder. The retrieval index
          accelerates that search while the encoder defines its geometry.
        hold: 0.6
        visual_cues:
          - id: retrieval-ranked-document-0-b1-1
            phrase: store their vectors
            targets:
              - ranked-document-0
            color: blue
            linger: 0.6
          - id: cl-retrieval-rank
            phrase: compared with many stored candidates
            targets:
              - retrieval-mechanism
            color: cyan
            linger: 0.5
      - say: Evaluate whether relevant passages enter the shortlist, then whether the
          ranking orders them usefully. A reranker can improve ordering among
          retrieved candidates, but evidence missing from the shortlist remains
          missing. Separate those measurements when deciding whether an
          embedding change helped.
        hold: 0.6
        visual_cues:
          - id: retrieval-ranked-document-0-b2-1
            phrase: enter the shortlist
            targets:
              - ranked-document-0
            color: green
            linger: 0.6
          - id: cl-retrieval-missing
            phrase: evidence missing from the shortlist remains missing
            targets:
              - retrieval-mechanism
            color: pink
            linger: 0.5
      - say: Also measure latency, storage, and performance on important languages or
          query types. A lower training loss can come from easier negatives or
          changed batches. Held-out relevance judgments under a stable retrieval
          setup tell us whether the learned comparisons transfer to the intended
          use.
        hold: 0.8
        visual_cues:
          - id: retrieval-ranked-document-0-b3-1
            phrase: relevance judgments
            targets:
              - ranked-document-0
            color: green
            linger: 0.6
  - id: shortlist-budget
    title: Which passages reach the reranker?
    beats:
      - say: Look at the left-hand ranking for the rotation query. The first stage puts KMS above both API
          guides. Admit the first three passages. The reranker gets to read each of those passages
          alongside the query. In this example its scores are supplied. It returns API rotation first,
          then token replacement. The lower joint score for KMS keeps it out of the top two.
        hold: 0.6
        visual_cues:
          - id: budget-rerank
            phrase: The reranker gets to read
            targets:
              - reranked-list
          - id: budget-rotation
            phrase: API rotation first
            targets:
              - first-result
          - id: budget-replacement
            phrase: then token replacement
            targets:
              - second-result
      - say: Now admit just the first passage from the original ranking. Which guide can the reranker return?
        hold: 2
        visual_cues:
          - id: budget-one
            phrase: admit just the first passage
            targets:
              - one-candidate-cut
      - say: Only KMS can come back. Neither approved API guide made it across the cutoff. A perfect reranker
          would face exactly the same limit.
        hold: 0.55
        visual_cues:
          - id: budget-kms
            phrase: Only KMS can come back
            targets:
              - single-return
        caption_starts:
          - Only KMS can come back
      - say: How wide a shortlist can we afford? At fifteen milliseconds per pair, scoring two million
          passages sequentially takes about eight point three hours. The request deadline is two hundred
          milliseconds. Query encoding takes ten milliseconds. Scoring ten pairs uses another hundred
          and fifty. That leaves forty milliseconds for lookup and everything else.
        hold: 0.6
        visual_cues:
          - id: budget-time
            phrase: takes about eight point three hours
            targets:
              - corpus-time
          - id: budget-query
            phrase: Query encoding takes ten milliseconds
            targets:
              - query-time
          - id: budget-pairs
            phrase: Scoring ten pairs uses another hundred and fifty
            targets:
              - pair-time
          - id: budget-remaining
            phrase: forty milliseconds for lookup and everything else
            targets:
              - remaining-time
      - say: For a sequential service, subtract query time, lookup and overhead from the deadline. Divide what
          remains by the measured time per pair and round down. Check recall at the affordable cutoff.
          If it misses required passages, improve the first stage, measure a faster or batched reranker,
          or revisit the budget. Measure the deployed path under realistic concurrency.
        hold: 0.7
        visual_cues:
          - id: budget-recall
            phrase: Check recall at the affordable cutoff
            targets:
              - recall-test
    visual: The supplied first-stage scores rank KMS, API rotation, replacement and GPU notes. With three
      admissions the top two returned passages are API rotation and replacement. With one admission only
      KMS can be returned. A separate sequential budget accounts for the ten shortlisted pairs.
  - id: evaluation-scope
    title: A benchmark name needs its task and version scope
    beats:
      - say: Semantic textual similarity compares sentence-pair similarity rankings with human relatedness
          ratings, often using Spearman correlation. A relatedness score is not automatically evidence
          that one passage answers an operational question. The original M T E B paper compared
          thirty-three models on fifty-eight datasets in eight task categories and found no model
          dominating every category.
        visual_cues:
          - id: cl-evaluation-scope-sts
            phrase: similarity rankings with human relatedness ratings
            targets:
              - evaluation-scope-mechanism
            color: cyan
            linger: 0.5
          - id: cl-evaluation-scope-mteb
            phrase: thirty-three models on fifty-eight datasets in eight task categories
            targets:
              - evaluation-scope-mechanism
            color: cyan
            linger: 0.5
      - say: Fifteen datasets in that original comparison measured retrieval. Look across the other bars. A
          high overall average can come from classification or clustering even when a retriever misses
          answers. The four reranking datasets used embedding similarity to order supplied lists. Our
          joint cross-encoder service needs its own evaluation. The twenty twenty-five M M T E B paper
          expanded the collection to over five hundred tasks across more than two hundred fifty
          languages. A selected benchmark may cover a subset.
        visual_cues:
          - id: cl-evaluation-scope-categories
            phrase: Fifteen datasets in that original comparison measured retrieval
            targets:
              - evaluation-scope-mechanism
            color: cyan
            linger: 0.5
          - id: cl-evaluation-scope-languages
            phrase: over five hundred tasks across more than two hundred fifty languages
            targets:
              - evaluation-scope-mechanism
            color: cyan
            linger: 0.5
      - say: Record the exact benchmark, dataset revisions, splits, language/domain slices, checkpoint and
          input formatting. Use its average to screen candidates, then evaluate your own query lengths,
          jargon, truncation, latency and storage. A passage cut off before encoding cannot be rescued
          by a better pooling rule. Sentence-Transformers provides embedding models, pooling and
          training losses; F A I S S searches dense vectors. Their roles do not replace relevance
          judgments.
        visual_cues:
          - id: cl-evaluation-scope-truncate
            phrase: A passage cut off before encoding cannot be rescued by a better pooling rule
            targets:
              - evaluation-scope-mechanism
            color: cyan
            linger: 0.5
    visual: Separate a graded STS pair ranking from judged retrieval queries. Build original MTEB
      task-category counts and a scoped multilingual task universe without turning benchmark means into
      a universal deployment decision.
  - id: release-metrics
    title: A first relevant result and all relevant results use different denominators
    beats:
      - say: Recall at K is the number of relevant judged passages in the first K
          divided by all relevant judgments for that query. Reciprocal rank is
          one divided by the first relevant position inside the cutoff, or zero
          if none appears. Average reciprocal ranks across query instances for M
          R R. Keep the corpus, judgment universe, cutoff and grouping fixed.
        visual_cues:
          - id: cl-release-metrics-recall
            phrase: divided by all relevant judgments for that query
            targets:
              - release-metrics-mechanism
            color: cyan
            linger: 0.5
          - id: cl-release-metrics-rr
            phrase: one divided by the first relevant position
            targets:
              - release-metrics-mechanism
            color: cyan
            linger: 0.5
      - say: The actual three-query cell at cutoff two gives recall and reciprocal-rank
          pairs one half/one half, one/one and zero/zero. Both means happen to
          equal one half. Moving the first query’s one retrieved relevant
          passage from second to first raises reciprocal rank to one while
          leaving its recall at one half. Adding its other relevant passage
          changes recall. Neither operation recovers the third query’s missing
          evidence.
        visual_cues:
          - id: cl-release-metrics-base
            phrase: Both means happen to equal one half
            targets:
              - release-metrics-mechanism
            color: cyan
            linger: 0.5
          - id: cl-release-metrics-move
            phrase: raises reciprocal rank to one while leaving its recall at one half
            targets:
              - release-metrics-mechanism
            color: cyan
            linger: 0.5
          - id: cl-release-metrics-add
            phrase: Adding its other relevant passage changes recall
            targets:
              - release-metrics-mechanism
            color: cyan
            linger: 0.5
      - say: Hold out queries and related source groups from training and mining.
          Inspect masks, vector diversity and score-matrix shapes before
          diagnosing high cosine as anisotropy. Compare easier versus harder
          pools before celebrating a lower loss. Accept a new checkpoint only
          when its fixed held-out retrieval, important slices and serving
          constraints pass their declared gates.
        visual_cues:
          - id: cl-release-metrics-heldout
            phrase: Hold out queries and related source groups from training and mining
            targets:
              - release-metrics-mechanism
            color: cyan
            linger: 0.5
    visual: A fixed relevant-document universe stays beside ranked results as
      Recall@K and reciprocal rank are computed independently. Move the first
      relevant result while conserving shortlist membership, then hold the
      candidate at its separate recall floor.
  - id: transfer
    title: Back at the caption archive
    visual: The opening query and all three captions return to their original positions. A change in the
      archive’s purpose adds a second relevant clip. The sleeping dog’s derivative reverses under a
      mean-log loss over both dog clips.
    beats:
      - say: Here’s the archive again. Same query, same three captions, same scores. The original request was
          for a dog running, and the puppy was our target. Look at the sleeping dog. It still has about
          forty-two percent of the row.
        hold: 0.45
      - say: This editor wants to index by animal. Every clip with a dog in it should be findable, whatever
          the dog is doing. Which other caption should now count as an answer?
        hold: 2
        visual_cues:
          - id: transfer-purpose
            phrase: index by animal
            targets:
              - requested-relation
          - id: transfer-which
            phrase: Which other caption should now count
            targets:
              - second-answer-question
      - say: The sleeping dog belongs too. With the old single target, its score derivative is still positive,
          about two point one two. Training would try to hide a clip this editor wants.
        hold: 0.65
        visual_cues:
          - id: transfer-sleeper
            phrase: The sleeping dog belongs too
            targets:
              - second-match
          - id: transfer-old
            phrase: about two point one two
            targets:
              - old-derivative
        caption_starts:
          - The sleeping dog belongs too
      - say: These are two different clips. Give each one equal weight in the mean of their negative log
          probabilities. The sleeping dog now has a target of one half. Subtract that from its share and
          divide by point two. Its derivative becomes about minus point three eight. Descent now tries
          to raise its score. Only the relevance rule and its targets changed.
        hold: 0.85
        visual_cues:
          - id: transfer-new
            phrase: about minus point three eight
            targets:
              - new-derivative
        caption_starts:
          - Its derivative becomes about minus point three eight
  - id: fresh-embedding
    title: Two decisions for a repair manual
    visual: A mirror of the same wheel guide occupies a second column in a fresh training row. In a
      separate held-out ranking, the recall cutoff stays fixed as the first relevant result moves up and
      the lift diagram stays out.
    beats:
      - say: Try the same audit on a repair manual. The query asks how to change a flat tire. Only A is marked
          positive. B is a verified mirror of the very same wheel guide. Both score point six five. A
          route planner scores point zero five. At this temperature the two copies take nearly equal
          halves of the row. Should B compete with A?
        hold: 2.1
        visual_cues:
          - id: fresh-competition
            phrase: At this temperature
            targets:
              - wheel-guide-row
          - id: fresh-ask
            phrase: Should B compete with A
            targets:
              - mirror-choice
      - say: Exclude the mirror from this row. Under the old label, its derivative is about plus three point
          three, so descent tries to lower it. Mask B and keep the scores fixed. The target now competes
          only against the route planner. B’s direct score derivative is zero and the loss falls to
          about point zero one eight nats. Two distinct verified answers could instead train a
          multi-positive loss.
        hold: 0.7
        visual_cues:
