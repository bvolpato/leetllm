          - id: fresh-mask
            phrase: Mask B and keep the scores fixed
            targets:
              - fixed-score-mask
          - id: fresh-solved
            phrase: about point zero one eight nats
            targets:
              - repaired-mirror-row
        caption_starts:
          - Exclude the mirror from this row
      - say: Now test a shorter index on a separate, held-out query. Where can I safely lift this car? Two
          passages answer it. Read up to the yellow cutoff. The control puts the jack points second and
          leaves the lift diagram outside. The short index moves the jack points first. We require
          recall of at least three quarters on this example. Does the short index clear that floor?
        hold: 2.2
        visual_cues:
          - id: fresh-road-test
            phrase: on a separate held-out query
            targets:
              - held-out-query
          - id: fresh-candidate
            phrase: The short index moves the jack points first
            targets:
              - short-index-ranking
          - id: fresh-gate
            phrase: Does the short index clear that floor
            targets:
              - release-question
      - say: The first relevant passage moved from second to first. Reciprocal rank doubled, from one half to
          one. But each shortlist contains just one of the two relevant passages. Recall is one half.
          Hold the short index. Even full-width rescoring can only reorder the two passages inside the
          cutoff.
        hold: 0.75
        visual_cues:
          - id: fresh-ranks
            phrase: Recall is one half
            targets:
              - recall-and-rank
          - id: fresh-hold
            phrase: Hold the short index
            targets:
