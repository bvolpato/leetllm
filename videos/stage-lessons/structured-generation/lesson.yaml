  - id: transfer
    title: Which request has time for a retry?
    visual: Plot two projected retries against one twelve-second deadline. Extend their elapsed time first by the
      proposed call, then by validation. Check accumulated cost and output capacity as well.
    beats:
      - say: Two requests stopped at the token limit. Both qualify for one same-schema retry if it fits. Each needs
          five hundred tokens, within the six hundred allowed. Each has spent four cost units and needs three
          more, within the limit of eight. Look at the time left. With a three-second call and a second for
          validation, which request fits?
        hold: 3.4
        visual_cues:
          - id: retry-facts
            phrase: Look at the time left
            targets:
              - retry-clock
            linger: 0.35
      - say: Lay the three-second call after the time each request has already spent. Now add one second for
          validation to both. The deadline is twelve seconds from the original start.
        hold: 0.9
        visual_cues:
          - id: retry-call
            phrase: Lay the three-second call after the time each request has already spent
            targets:
              - retry-clock
            linger: 0.35
          - id: retry-validate
            phrase: add one second for validation to both
            targets:
              - retry-clock
            linger: 0.35
      - say: Only A fits. Seven plus four is eleven seconds. B has already spent eight and a half, so its validation
          would finish half a second late. Keep B incomplete. If the original result had been a refusal, even
          A's spare second wouldn't buy a retry.
        hold: 1.1
        visual_cues:
          - id: retry-outcome
            phrase: Only A fits
            targets:
              - retry-clock
            linger: 0.35
