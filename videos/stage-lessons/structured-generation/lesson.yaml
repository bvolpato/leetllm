version: 1
id: structured-generation
title: "Structured generation: which status can the dashboard show?"
source: agents/structured-output-constrained-generation/content.md
sources:
  - title: Efficient Guided Generation for Large Language Models
    url: https://arxiv.org/abs/2307.09702
  - title: XGrammar
    url: https://arxiv.org/abs/2411.15100
  - title: JSON Schema validation specification
    url: https://json-schema.org/draft/2020-12/json-schema-validation
  - title: Outlines Generator API
    url: https://dottxt-ai.github.io/outlines/latest/features/core/generator/
  - title: Outlines backends
    url: https://dottxt-ai.github.io/outlines/latest/features/advanced/backends/
  - title: llguidance implementation
    url: https://github.com/guidance-ai/llguidance
  - title: llama.cpp grammar documentation
    url: https://github.com/ggml-org/llama.cpp/blob/master/grammars/README.md
  - title: SGLang structured outputs
    url: https://docs.sglang.io/docs/advanced_features/structured_outputs
  - title: SGLang original compressed FSM paper
    url: https://arxiv.org/abs/2312.07104
  - title: vLLM structured outputs
    url: https://docs.vllm.ai/en/latest/features/structured_outputs/
  - title: OpenAI structured outputs
    url: https://developers.openai.com/api/docs/guides/structured-outputs
  - title: Claude structured outputs
    url: https://platform.claude.com/docs/en/build-with-claude/structured-outputs
