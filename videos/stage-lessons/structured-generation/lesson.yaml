        hold: 0.65
        visual_cues:
          - id: sg-mask-schedule-2
            phrase: Make the mask take ten milliseconds. Look at the GPU lane. It waits from eight to ten, and sampling
              finishes at eleven. The next mask needs the token just sampled. Measure that wait under your
              real batch sizes, separately from the time spent compiling a new schema.
            targets:
              - sg-mask-schedule-mechanism
            color: cyan
            linger: 0.35
          - id: sg-schedule-change
            phrase: Make the mask take ten milliseconds
            targets:
              - sg-mask-schedule-mechanism
            color: cyan
            linger: 0.35
