scenes:
  - id: subject-intro
    title: Which reply can Python read?
    visual: Start a cursor on the first character of each one-field reply. Stop at the greeting in A and scan B
      to its closing brace. Bring the runner log beside the parsed status.
    beats:
      - say: Start at the first character. Which reply can Python read as JSON?
        hold: 2.8
        visual_cues:
          - id: intro-ask
            phrase: Which reply can Python read as JSON
            targets:
              - run-replies
            linger: 0.35
      - say: Python stops at the S in “Sure!” In B, it reads from the opening brace to the closing brace. Now look
          at the runner log. Should the dashboard show passed?
        hold: 2.4
        visual_cues:
          - id: intro-byte
            phrase: Python stops at the S in “Sure!”
            targets:
              - run-replies
            linger: 0.35
          - id: intro-parse
            phrase: it reads from the opening brace to the closing brace
            targets:
              - run-replies
            linger: 0.35
          - id: intro-log
            phrase: look at the runner log
            targets:
              - run-replies
            linger: 0.35
      - say: The run failed. B says passed. Send B to review. A grammar for these status records can rule out the
          greeting while the model writes. It allows both status words. The log tells us which one belongs
          here.
        hold: 1.2
        visual_cues:
          - id: intro-compare
            phrase: Send B to review
            targets:
              - run-replies
            linger: 0.35
  - id: interface-contract
    title: What does the parser check?
    visual: Add the run ID to the reply, then remove its greeting. Replace the object with one lacking both
      required fields. Trace a named lookup and the result the host returns.
    beats:
      - say: Give the reply a run ID so the dashboard knows which row to update. Remove the preamble. Now Python can
          read both fields. A prompt asking for JSON still leaves the model free to add that greeting.
        hold: 0.75
        visual_cues:
          - id: interface-trim
            phrase: remove the preamble
            targets:
              - reply-contract
            linger: 0.35
      - say: Suppose JSON mode gives you this object instead. Python reads it. Look for the run ID and the status.
          Both keys are missing. A supported strict schema can require those keys and their types while the
          model writes.
        hold: 0.8
        visual_cues:
          - id: interface-fields
            phrase: Both keys are missing
            targets:
              - reply-contract
            linger: 0.35
      - say: For a dashboard, ask for a record. To find out what happened, the model can instead ask for a tool by
          name and supply the run ID. If the caller can read this run, the host can perform the lookup and
          return the snapshot to the model.
        hold: 0.8
        visual_cues:
          - id: interface-lookup
            phrase: return the snapshot
            targets:
              - reply-contract
            linger: 0.35
  - id: prefix-language
    title: Two ways to finish the same prefix
    visual: Keep both full status records aligned below one accepted buffer. Underline their common characters as
      the key is written. The first f rules out passed.
    beats:
      - say: For the decoding experiment, keep just the status field. These are the only two complete strings we'll
          allow. This tiny grammar allows no spaces.
        hold: 0.6
        visual_cues: []
      - say: Watch the opening brace, the key and the opening quote of the value go into the buffer. Both records
          begin with all of those characters. The text already in the buffer is called the prefix.
        hold: 0.75
        visual_cues:
          - id: prefix-key
            phrase: the opening brace, the key and the opening quote of the value
            targets:
              - prefix-paths
            linger: 0.35
      - say: Now append the letters F A. Only the failed record still starts with everything in the buffer. To test a
          candidate token, extend the prefix on a trial copy. Keep the token eligible if some allowed record
          still starts that way.
        hold: 1.2
        visual_cues:
          - id: prefix-fa
            phrase: append the letters F A
            targets:
              - prefix-paths
            linger: 0.35
  - id: logit-mask
    title: The first draw
    visual: Use the article’s four hand-set logits. Keep the raw softmax probabilities visible as the three
      impossible logits become negative infinity, then compute the final probabilities.
    beats:
      - say: Go back to the empty buffer. Here are four possible first tokens and four scores we chose for the
          example. These scores are called logits. At temperature one, softmax gives the word “The” the
          largest share of the draw. Only one of these four tokens starts either record.
        hold: 1.5
        visual_cues:
          - id: mask-inputs
            phrase: four possible first tokens
            targets:
              - first-mask
            linger: 0.35
      - say: Keep the brace's score. Set the other three to negative infinity. Softmax exponentiates each score. Those
          three now have zero weight. Divide by the surviving weight and the brace gets the entire draw.
        hold: 1
        visual_cues:
          - id: mask-first
            phrase: Set the other three to negative infinity
            targets:
              - first-mask
            linger: 0.35
          - id: mask-normalize
            phrase: the brace gets the entire draw
            targets:
              - first-mask
            linger: 0.35
      - say: This filter on the next draw is the grammar mask. A larger vocabulary might also contain a token for the
          brace and the whole key together. The same prefix test decides whether that token gets a chance.
        hold: 0.8
        visual_cues: []
  - id: conditional-mask
    title: What share of the next draw goes to fa?
    visual: At the value prefix, keep passed, fa and chatty in separate rows. Show one block per unit of weight.
      Remove the five chatty units from the denominator.
    beats:
      - say: Now the value is about to start. The token passed would spell the whole word. The token F A would start
          the word failed. The third token says chatty. We chose these logits so their exponentials are two,
          three and five. Each square is one unit of weight, ten units in all.
        hold: 0.75
        visual_cues:
          - id: weights-exp
            phrase: their exponentials are two, three and five
            targets:
              - status-weights
            linger: 0.35
      - say: Which squares go into the new denominator? Chatty can't start either status. Cross out its five squares.
          The first two rows still have two squares and three squares. What share of the next draw goes to F
          A?
        hold: 3
        visual_cues:
          - id: weights-remove
            phrase: Cross out its five squares
            targets:
              - status-weights
            linger: 0.35
      - say: Three out of five, or sixty percent. Passed gets the remaining forty percent. The filter changed the
          denominator from ten to five. It kept the ratio between the two legal weights. In code you can
          subtract the largest finite logit before exponentiating. That keeps the same ratios and avoids
          overflow.
        hold: 1.1
        visual_cues:
          - id: weights-result
            phrase: sixty percent
            targets:
              - status-weights
            linger: 0.35
  - id: value-branch
    title: A legal choice can still be the wrong choice
    visual: Keep the same two surviving token IDs and their shares on one fixed-width strip. Double only the
      weight of fa, then bring back the source.
    beats:
      - say: Those are probabilities for the next token. Here, either surviving token commits the spelling to one
          branch of our two-record language. In a larger grammar several token paths can spell the same value.
        hold: 0.6
        visual_cues:
          - id: branch-weights
            phrase: probabilities for the next token
            targets:
              - branch-share
            linger: 0.35
      - say: Leave passed at two and double the weight on F A. Watch the boundary move. Now six of the eight units
          lead toward failed. Passed still gets a quarter of the strip.
        hold: 0.85
        visual_cues:
          - id: branch-double
            phrase: double the weight on F A
            targets:
              - branch-share
            linger: 0.35
      - say: The runner reported a failure. A good prompt tells the model what the status field means and where to
          find the evidence. Both values still fit the grammar, so the host needs the run log when it checks
          the answer.
        hold: 0.9
        visual_cues:
          - id: branch-source
            phrase: The runner reported a failure
            targets:
              - branch-share
            linger: 0.35
  - id: whole-token
    title: Which whole token can the decoder append?
    visual: Hold the shop prefix above two aligned spellings. Check A through the brace. Start B from the
      same prefix and point to its extra character. Compare both verdicts before copying A into the buffer.
      Return to the CI prefix and look up its two scored candidates.
    beats:
      - say: The grammar is about strings, while the model emits vocabulary tokens. A token may contain part of a word
          or several punctuation marks together. Its first character can be legal even when its last character
          makes the entire continuation impossible.
        hold: 0.55
        visual_cues:
          - id: whole-token-b1-1
            phrase: part of a word
            targets: [token-letters]
          - id: token-punctuation
            phrase: several punctuation marks together
            targets: [token-punctuation]
      - say: Our accepted prefix ends with clo. A token containing the rest of closed and the closing punctuation
          completes the record. Another token adds an exclamation mark after the object. That longer token
          must be rejected even though most of it follows the same valid route.
        hold: 0.75
        visual_cues:
          - id: shop-prefix
            phrase: Our accepted prefix ends with clo
            targets: [candidate-characters]
          - id: shop-scan-a
            phrase: the rest of closed
            targets: [candidate-accepted]
          - id: shop-close-a
            phrase: the closing punctuation
            targets: [candidate-accepted]
          - id: whole-token-b2-1
            phrase: completes the record
            targets: [candidate-accepted]
            linger: 0.45
            caption_boundary: true
          - id: shop-scan-b
            phrase: Another token adds
            targets: [candidate-rejected]
            caption_boundary: true
          - id: whole-token-b2-2
            phrase: exclamation mark
            targets: [candidate-rejected, character-cursor]
            linger: 0.45
          - id: shop-reject
            phrase: That longer token must be rejected
            targets: [candidate-rejected]
            caption_boundary: true
      - say: The engine checks the whole token against the current parser state, then advances that state only after
          accepting it. Efficient implementations index or precompute many of these checks and handle
          context-dependent parser work dynamically. Measure the actual backend's compilation and per-token
          costs.
        hold: 0.55
        visual_cues:
          - id: whole-token-b3-1
            phrase: whole token
            targets: [candidate-accepted, candidate-rejected]
            linger: 0.45
          - id: shop-commit
            phrase: then advances that state only after accepting it
            targets: [candidate-characters, candidate-accepted]
            caption_boundary: true
          - id: ci-lookup
            phrase: index or precompute many of these checks
            targets: [candidate-characters, candidate-accepted, candidate-rejected]
  - id: complete-record
    title: Will this call return a record?
    visual: Keep one text buffer and four token slots. Compare the article decoder at max_steps=3 and max_steps=4.
      Only the fourth slot contains EOS.
    beats:
      - say: Run that decoder with a budget of three draws. It picks the shared prefix, F A, and the token that closes
          the object. The text looks finished. Will this call return a record?
        hold: 3
        visual_cues:
          - id: stop-three
            phrase: the shared prefix, F A, and the token that closes the object
            targets:
              - stop-trace
            linger: 0.35
      - say: It raises a budget error. This decoder returns only after sampling its end token. Even legal whitespace
          or characters inside a string can use up a budget when a grammar permits them. A grammar can keep
          every step legal without bringing a request to a finish.
        hold: 0.8
        visual_cues:
          - id: stop-budget
            phrase: It raises a budget error
            targets:
              - stop-trace
            linger: 0.35
      - say: Give the same run one more draw. The decoder picks the end token. Now it returns the record. The text in
          the buffer is identical in both runs. On a real response, read the provider's completion and refusal
          state before sending the text to your parser.
        hold: 1.15
        visual_cues:
          - id: stop-extra
            phrase: one more draw
            targets:
              - stop-trace
            linger: 0.35
          - id: stop-eos
            phrase: The decoder picks the end token
            targets:
              - stop-trace
            linger: 0.35
  - id: recursive-stack
    title: Follow each unresolved object
    visual: Contrast a flat list of empty objects with nested children. Trace the three pending braces on a trial
      stack. Start the competing token from the same accepted prefix.
    beats:
      - say: One fixed set of states was enough for our two status records. You could even allow a flat list with any
          number of empty objects. Each comma takes you around the same loop again. Now put a child inside a
          child. Every opening brace leaves another object to come back to. The parser remembers those
          unfinished objects on a stack.
        hold: 0.65
        visual_cues:
          - id: sg-recursive-stack-0
            phrase: One fixed set of states was enough for our two status records. You could even allow a flat list with
              any number of empty objects. Each comma takes you around the same loop again. Now put a child
              inside a child. Every opening brace leaves another object to come back to. The parser remembers
              those unfinished objects on a stack.
            targets:
              - sg-recursive-stack-mechanism
            color: cyan
            linger: 0.35
      - say: Try a tiny grammar. A node can be empty, or it can have one child that is another node. Our prefix opens
          three objects. Follow A through three closing braces. Each one pops a frame, and the last one closes
          the root.
        hold: 0.65
        visual_cues:
          - id: sg-recursive-stack-1
            phrase: Try a tiny grammar. A node can be empty, or it can have one child that is another node. Our prefix
              opens three objects. Follow A through three closing braces. Each one pops a frame, and the last
              one closes the root.
            targets:
              - sg-recursive-stack-mechanism
            color: cyan
            linger: 0.35
          - id: sg-stack-three
            phrase: Follow A through three closing braces
            targets:
              - sg-recursive-stack-mechanism
            color: cyan
            linger: 0.35
      - say: Start B from the original three frames. Two braces fit. The square bracket fails on the third character.
          The trial pops belong to B alone. Rejecting B leaves the original prefix intact. A stack handles
          unbounded nesting. Checking that two records name the same run still takes an application check.
        hold: 0.65
        visual_cues:
          - id: sg-recursive-stack-2
            phrase: Start B from the original three frames. Two braces fit. The square bracket fails on the third
              character. The trial pops belong to B alone. Rejecting B leaves the original prefix intact. A
              stack handles unbounded nesting. Checking that two records name the same run still takes an
              application check.
            targets:
              - sg-recursive-stack-mechanism
            color: cyan
            linger: 0.35
          - id: sg-stack-reject
            phrase: Two braces fit. The square bracket fails on the third character
            targets:
              - sg-recursive-stack-mechanism
            color: cyan
            linger: 0.35
  - id: token-index
    title: Where the two token paths split
    visual: Trace the shared six bytes in the tokens iled"} and iled"}!. Branch at the extra exclamation mark,
      then compare a compiled local-rule mask with two requests’ independent parser stacks.
    beats:
      - say: Our two tokens share six bytes. Trace those bytes once to the brace. One token ends there. The other
          takes one more edge to the exclamation mark. A tokenizer trie stores token spellings along paths
          that can share edges like these. For a finite grammar, Willard and Louf index legal token IDs by
          state. Building and storing the index costs work, but the next lookup can reuse it.
        hold: 0.65
        visual_cues:
          - id: sg-token-index-0
            phrase: Our two tokens share six bytes. Trace those bytes once to the brace. One token ends there. The other
              takes one more edge to the exclamation mark. A tokenizer trie stores token spellings along paths
              that can share edges like these. For a finite grammar, Willard and Louf index legal token IDs by
              state. Building and storing the index costs work, but the next lookup can reuse it.
            targets:
              - sg-token-index-mechanism
            color: cyan
            linger: 0.35
          - id: sg-trie-shared
            phrase: Trace those bytes once to the brace
            targets:
              - sg-token-index-mechanism
            color: cyan
            linger: 0.35
      - say: XGrammar can precheck tokens whose legality follows from the local rule. For a token that closes a
          parent, consult this request's stack. Start a second request. It gets its own stack even when both
          requests use the same compiled grammar.
        hold: 0.65
        visual_cues:
          - id: sg-token-index-1
            phrase: XGrammar can precheck tokens whose legality follows from the local rule. For a token that closes a
              parent, consult this request's stack. Start a second request. It gets its own stack even when
              both requests use the same compiled grammar.
            targets:
              - sg-token-index-mechanism
            color: cyan
            linger: 0.35
          - id: sg-index-local
            phrase: consult this request's stack
            targets:
              - sg-token-index-mechanism
            color: cyan
            linger: 0.35
          - id: sg-index-new-request
            phrase: It gets its own stack
            targets:
              - sg-token-index-mechanism
            color: cyan
            linger: 0.35
      - say: Another engine, llguidance, combines an Earley parser, a regular-expression lexer and a tokenizer trie.
          Our example used ASCII, where each character occupies one byte. A tokenizer may split one Unicode
          character across tokens. Its parser must carry those partial bytes forward.
        hold: 0.65
        visual_cues:
          - id: sg-token-index-2
            phrase: Another engine, llguidance, combines an Earley parser, a regular-expression lexer and a tokenizer
              trie. Our example used ASCII, where each character occupies one byte. A tokenizer may split one
              Unicode character across tokens. Its parser must carry those partial bytes forward.
            targets:
              - sg-token-index-mechanism
            color: cyan
            linger: 0.35
  - id: prefix-jump
    title: Separate a shared prefix from a forced continuation
    visual: Change the first prompt token while keeping the compiled grammar fixed. Compare sampling a three-token
      forced literal with appending the same literal and aligning the join with the tokenizer.
    beats:
      - say: These two requests have the same grammar. They also start with some of the same prompt tokens. The model
          may reuse cached keys and values for that matching prefix. Change the first prompt token in B. The
          compiled grammar can still be reused, even though those cached model states no longer match.
        hold: 0.65
        visual_cues:
          - id: sg-prefix-jump-0
            phrase: These two requests have the same grammar. They also start with some of the same prompt tokens. The
              model may reuse cached keys and values for that matching prefix. Change the first prompt token
              in B. The compiled grammar can still be reused, even though those cached model states no longer
              match.
            targets:
              - sg-prefix-jump-mechanism
            color: cyan
            linger: 0.35
          - id: sg-cache-prompt-change
            phrase: Change the first prompt token in B
            targets:
              - sg-prefix-jump-mechanism
            color: cyan
            linger: 0.35
      - say: Sometimes the grammar determines the next stretch of text completely. Take the literal key here. With
          this illustrative tokenization it takes three sampling steps. The original S G Lang design could
          append the forced text together, then let the model process it. The model still needs state for
          those tokens.
        hold: 0.65
        visual_cues:
          - id: sg-prefix-jump-1
            phrase: Sometimes the grammar determines the next stretch of text completely. Take the literal key here. With
              this illustrative tokenization it takes three sampling steps. The original S G Lang design could
              append the forced text together, then let the model process it. The model still needs state for
              those tokens.
            targets:
              - sg-prefix-jump-mechanism
            color: cyan
            linger: 0.35
          - id: sg-forced-append
            phrase: append the forced text together
            targets:
              - sg-prefix-jump-mechanism
            color: cyan
            linger: 0.35
          - id: sg-forced-steps
            phrase: it takes three sampling steps
            targets:
              - sg-prefix-jump-mechanism
            color: cyan
            linger: 0.35
      - say: Retokenize across the join. The end of the old prefix and the start of the forced text can form one
          token. The historical shortcut needs the original tokenizer there. It solves a different problem
          from RadixAttention's reuse of cached prompt tokens. The November twenty twenty-six article lists
          XGrammar as S G Lang's default grammar backend.
        hold: 0.65
        visual_cues:
          - id: sg-prefix-jump-2
            phrase: Retokenize across the join. The end of the old prefix and the start of the forced text can form one
              token. The historical shortcut needs the original tokenizer there. It solves a different problem
              from RadixAttention's reuse of cached prompt tokens. The November twenty twenty-six article
              lists XGrammar as S G Lang's default grammar backend.
            targets:
              - sg-prefix-jump-mechanism
            color: cyan
            linger: 0.35
          - id: sg-join-retokenize
            phrase: Retokenize across the join
            targets:
              - sg-prefix-jump-mechanism
            color: cyan
            linger: 0.35
  - id: mask-schedule
    title: Wait for both the logits and the mask
    visual: Place the GPU, mask and sample on one worksheet. Compare serial work with overlap. Change the mask
      from 3 to 10 ms while the GPU stays at 8 ms.
    beats:
      - say: The mask and the next model scores both start from tokens already accepted. Time one step on this
          worksheet. The GPU takes eight milliseconds. The CPU mask takes three. Sampling takes one more. Run
          them in series and sampling finishes at twelve.
        hold: 0.65
        visual_cues:
          - id: sg-mask-schedule-0
            phrase: The mask and the next model scores both start from tokens already accepted. Time one step on this
              worksheet. The GPU takes eight milliseconds. The CPU mask takes three. Sampling takes one more.
              Run them in series and sampling finishes at twelve.
            targets:
              - sg-mask-schedule-mechanism
            color: cyan
            linger: 0.35
          - id: sg-schedule-serial
            phrase: Run them in series and sampling finishes at twelve
            targets:
              - sg-mask-schedule-mechanism
            color: cyan
            linger: 0.35
      - say: Now start the GPU and the mask together. The mask finishes at three. The GPU finishes at eight. Only then
          can sampling start. It finishes at nine. With ideal overlap, take the longer of the two jobs, then
          add sampling.
        hold: 0.65
        visual_cues:
          - id: sg-mask-schedule-1
