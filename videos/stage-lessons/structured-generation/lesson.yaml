  - id: backend-contracts
    title: What does the backend enforce?
    visual: Follow raw Outlines text into local validation, inspect an illustrative grammar conversion and
      locate the structured_outputs field in the vLLM request.
    beats:
      - say: In Outlines version one, the caller gives Generator a Pydantic type and gets raw text back. Parse that
          text with the local model. Now the dashboard has a typed record and can read its status.
        hold: 0.65
        visual_cues:
          - id: sg-backend-contracts-0
            phrase: In Outlines version one, the caller gives Generator a Pydantic type and gets raw text back. Parse
              that text with the local model. Now the dashboard has a typed record and can read its status.
            targets:
              - sg-backend-contracts-mechanism
            color: cyan
            linger: 0.35
          - id: sg-outlines-raw
            phrase: gets raw text back
            targets:
              - sg-backend-contracts-mechanism
