<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#11161f">
    <title>Background study | LeetLLM</title><link rel="icon" href="leetllm-mark.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css">
    <style>
      .study-hero{padding:46px 0 24px}.study-hero h1{font-size:clamp(36px,5vw,55px)}.study-hero>p:last-child{max-width:820px;color:#bac5d5;font-size:17px}
      .theme-lesson{padding:22px 0 42px;border-top:1px solid #ffffff19}.theme-lesson h2{font:700 23px Manrope,sans-serif;margin:0 0 4px}.theme-lesson>div:first-child>p:last-child{color:var(--muted);font-size:14px;margin:0 0 18px}
      .theme-frames{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.theme-frame{margin:0;min-width:0;border:1px solid #39465a;border-radius:12px;overflow:hidden;background:#171f2a}.theme-frame img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover}.theme-frame figcaption{display:flex;flex-direction:column;gap:2px;padding:10px 12px}.theme-frame figcaption strong{font-size:13px}.theme-frame figcaption span{color:var(--muted);font:10px 'DM Mono',monospace}
      .theme-takeaway{margin:4px 0 38px}.theme-takeaway>div:last-child>p{margin:0 0 15px}.theme-pros{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:18px 0}.theme-pros>div{background:#111923;border:1px solid #344154;border-radius:10px;padding:13px}.theme-pros strong{color:var(--text);font-size:13px}.theme-pros p{margin:6px 0 0;color:var(--muted);font-size:12px}.study-limit{font-size:12px!important;color:#b3bdcb!important}.table-scroll{max-width:100%;overflow-x:auto}.theme-takeaway table{border-collapse:collapse;width:100%;font-size:12px}.theme-takeaway th,.theme-takeaway td{border-bottom:1px solid #344154;padding:8px;text-align:left}.theme-takeaway th{color:#dde4ed}.theme-takeaway td{color:#b4c2d5;font-family:'DM Mono',monospace}
      @media(max-width:760px){.theme-frames{grid-template-columns:1fr}.theme-frame{max-width:620px}.theme-pros{grid-template-columns:1fr}}
    </style>
  </head>
  <body>
    <header class="site-header"><a class="brand" href="index.html#kept" aria-label="Back to LeetLLM video lessons"><img src="leetllm-mark.svg" width="32" height="32" alt=""><span>Leet<span>LLM</span></span></a><a class="header-link" href="index.html">← Back to video collection</a></header>
    <main>
      <section class="study-hero"><p class="eyebrow">Palette study</p><h1>Which background helps an idea <span>stand out?</span></h1><p>{{THEME_SCOPE}}</p></section>
      {{THEME_DETAILS}}
      {{THEME_SECTIONS}}
      <footer><span>LeetLLM · Background palette comparison</span><a href="index.html">Return to selected lessons</a></footer>
    </main>
  </body>
</html>
