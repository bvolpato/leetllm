<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Workflow checkpoint</title>
  <desc id="desc">A durable snapshot of execution position and pending-operation identity used to resume after interruption and reconcile external effects.</desc>
  <path data-part="workflow-path" d="M7 21H22V42H42V24H54" fill="none" stroke="#63DEEC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="workflow-node" cx="10" cy="21" r="4" fill="#111D34" stroke="#63DEEC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="paused-node" cx="22" cy="21" r="4" fill="#F4D477" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="durable-disk" x="27" y="36" width="15" height="15" rx="4" fill="#111D34" stroke="#79AAFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="disk-lines" d="M31 41H38M31 45H38" fill="none" stroke="#79AAFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="operation-id" x="45" y="13" width="14" height="8" rx="2" fill="#111D34" stroke="#8D9CB9" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="id-mark" x1="48" y1="17" x2="55" y2="17" fill="none" stroke="#8D9CB9" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="state-version" x="45" y="26" width="14" height="8" rx="2" fill="#111D34" stroke="#EF9AC8" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="version-mark" x1="48" y1="30" x2="54" y2="30" fill="none" stroke="#EF9AC8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="receipt-check" d="M49 41V48H57" fill="none" stroke="#8CDEB5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="external-receipt" cx="57" cy="48" r="3" fill="#8CDEB5" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
