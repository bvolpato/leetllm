<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Classification confusion matrix</title>
  <desc id="desc">Four labeled cells separate correct predictions from the two error directions.</desc>
  <path data-part="truth-axis" d="M8 13L8 55" fill="none" stroke="#8D9CB9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="prediction-axis" d="M13 8L55 8" fill="none" stroke="#8D9CB9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="true-negative-cell" x="16" y="15" width="17" height="17" rx="2" fill="#111D34" stroke="#79AAFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="false-positive-cell" x="35" y="15" width="17" height="17" rx="2" fill="#FF988D" stroke="none"/>
  <rect data-part="false-negative-cell" x="16" y="34" width="17" height="17" rx="2" fill="#F4D477" stroke="none"/>
  <rect data-part="true-positive-cell" x="35" y="34" width="17" height="17" rx="2" fill="#111D34" stroke="#8CDEB5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="cell-diagonal-a" d="M20 27L28 19" fill="none" stroke="#79AAFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="cell-diagonal-b" d="M39 46L48 38" fill="none" stroke="#8CDEB5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="false-positive-mark" cx="43" cy="23" r="2.2" fill="#0A1020" stroke="none"/>
  <circle data-part="false-negative-mark" cx="24" cy="42" r="2.2" fill="#0A1020" stroke="none"/>
</svg>
