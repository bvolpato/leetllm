<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Context window budget</title>
  <desc id="desc">A finite window is divided among system, history, evidence, request, and output space.</desc>
  <rect data-part="window-frame" x="6" y="14" width="52" height="36" rx="5" fill="#111D34" stroke="#E9EFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="system-budget" x="10" y="20" width="9" height="24" rx="2" fill="#79AAFF" stroke="none"/>
  <rect data-part="history-budget" x="20" y="20" width="10" height="24" rx="2" fill="#63DEEC" stroke="none"/>
  <rect data-part="evidence-budget" x="31" y="20" width="12" height="24" rx="2" fill="#F4D477" stroke="none"/>
  <rect data-part="request-budget" x="44" y="20" width="6" height="24" rx="2" fill="#EF9AC8" stroke="none"/>
  <rect data-part="output-reserve" x="51" y="20" width="4" height="24" rx="2" fill="#8CDEB5" stroke="none"/>
  <path data-part="limit-marker" d="M57 8V12M53 9H61" fill="none" stroke="#F4D477" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
