  <rect data-part="mask-cell-0-3" x="40" y="13" width="7" height="7" rx="1" fill="none" stroke="#8D9CB9" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="mask-cell-1-0" x="13" y="22" width="7" height="7" rx="1" fill="#79AAFF" stroke="#79AAFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
