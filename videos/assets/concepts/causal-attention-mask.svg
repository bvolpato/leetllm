<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Causal attention mask</title>
  <desc id="desc">A causal mask lets each position attend to itself and earlier positions while blocking future tokens.</desc>
  <rect data-part="mask-cell-0-0" x="13" y="13" width="7" height="7" rx="1" fill="#F4D477" stroke="#F4D477" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
