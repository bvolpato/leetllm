<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Bounded request queue</title>
  <desc id="desc">A finite waiting area for admitted work with visible age, deadline, and caller ownership.</desc>
  <path data-part="queue-boundary" d="M8 8V55H49V8" fill="none" stroke="#63DEEC" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="waiting-1" x="14" y="12" width="29" height="8" rx="2" fill="#111D34" stroke="#79AAFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="deadline-1" x1="19" y1="16" x2="31" y2="16" fill="none" stroke="#79AAFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="age-1" x1="39" y1="14" x2="39" y2="18" fill="none" stroke="#F4D477" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="waiting-2" x="14" y="24" width="29" height="8" rx="2" fill="#111D34" stroke="#63DEEC" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="deadline-2" x1="19" y1="28" x2="29" y2="28" fill="none" stroke="#63DEEC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="age-2" x1="39" y1="26" x2="39" y2="30" fill="none" stroke="#F4D477" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="waiting-3" x="14" y="36" width="29" height="8" rx="2" fill="#111D34" stroke="#EF9AC8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="deadline-3" x1="19" y1="40" x2="28" y2="40" fill="none" stroke="#EF9AC8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="age-3" x1="39" y1="38" x2="39" y2="42" fill="none" stroke="#F4D477" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="worker-exit" d="M49 49H58V35" fill="none" stroke="#8CDEB5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="worker-slot" x="52" y="27" width="10" height="11" rx="3" fill="#111D34" stroke="#8CDEB5" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="retry-after" x="43" y="48" width="17" height="9" rx="3" fill="#111D34" stroke="#FF988D" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="retry-badge" x1="47" y1="52" x2="55" y2="52" fill="none" stroke="#FF988D" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
