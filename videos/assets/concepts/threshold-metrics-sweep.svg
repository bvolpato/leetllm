<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Classification threshold sweep</title>
  <desc id="desc">A moving score cutoff reassigns examples and changes the precision-recall trade-off.</desc>
  <path data-part="score-axis" d="M7 34L57 34" fill="none" stroke="#8D9CB9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="score-positive-a" cx="12" cy="34" r="2.4" fill="#8CDEB5" stroke="none"/>
  <circle data-part="score-positive-b" cx="19" cy="34" r="2.4" fill="#8CDEB5" stroke="none"/>
  <circle data-part="score-positive-c" cx="27" cy="34" r="2.4" fill="#8CDEB5" stroke="none"/>
  <circle data-part="score-negative-a" cx="35" cy="34" r="2.4" fill="#FF988D" stroke="none"/>
  <circle data-part="score-negative-b" cx="43" cy="34" r="2.4" fill="#FF988D" stroke="none"/>
  <circle data-part="score-negative-c" cx="51" cy="34" r="2.4" fill="#FF988D" stroke="none"/>
  <path data-part="threshold-cut" d="M31 16L31 48" fill="none" stroke="#F4D477" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="precision-recall-axes" d="M9 57L9 48L25 48" fill="none" stroke="#8D9CB9" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="precision-recall-trace" d="M11 54C15 49 18 51 21 49C24 47 26 51 29 49" fill="none" stroke="#63DEEC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="operating-point" cx="23" cy="49" r="2" fill="#F4D477" stroke="#E9EFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
