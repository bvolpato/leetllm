<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Tensor axes</title>
  <desc id="desc">Coordinate axes and a tensor slice reveal how dimensions extend beyond a flat matrix.</desc>
  <line data-part="axis-x" x1="14" y1="53" x2="55" y2="53" stroke="#63DEEC" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="axis-y" x1="14" y1="53" x2="14" y2="10" stroke="#63DEEC" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="axis-depth" x1="14" y1="53" x2="37" y2="35" stroke="#79AAFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon data-part="arrow-x" points="55,53 49,50 49,56" fill="#63DEEC" stroke="#63DEEC" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon data-part="arrow-y" points="14,10 11,16 17,16" fill="#63DEEC" stroke="#63DEEC" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon data-part="arrow-depth" points="37,35 30,36 34,41" fill="#79AAFF" stroke="#79AAFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon data-part="matrix-slice" points="21,31 36,23 51,31 36,39" fill="#111D34" stroke="#F4D477" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="slice-cell-one" x1="29" y1="27" x2="44" y2="35" stroke="#8D9CB9" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="slice-cell-two" x1="36" y1="23" x2="36" y2="39" stroke="#8D9CB9" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon data-part="depth-slice" points="21,31 21,42 36,50 36,39" fill="#111D34" stroke="#79AAFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon data-part="side-slice" points="36,39 51,31 51,42 36,50" fill="#111D34" stroke="#63DEEC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
