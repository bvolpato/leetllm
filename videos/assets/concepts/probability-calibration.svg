<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Probability calibration</title>
  <desc id="desc">Predicted probabilities align with observed frequencies when reliability bins follow the diagonal.</desc>
  <path data-part="plot-axes" d="M10 51V12M10 51H55" fill="none" stroke="#8D9CB9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="ideal-calibration" d="M13 47L49 15" fill="none" stroke="#79AAFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="observed-frequency" d="M14 45L22 40L29 37L36 30L43 25L50 18" fill="none" stroke="#F4D477" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="reliability-bin-1" cx="14" cy="45" r="2.2" fill="#111D34" stroke="#F4D477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="reliability-bin-2" cx="22" cy="40" r="2.2" fill="#111D34" stroke="#F4D477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="reliability-bin-3" cx="29" cy="37" r="2.2" fill="#111D34" stroke="#F4D477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="reliability-bin-4" cx="36" cy="30" r="2.2" fill="#111D34" stroke="#F4D477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="reliability-bin-5" cx="43" cy="25" r="2.2" fill="#111D34" stroke="#F4D477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="reliability-bin-6" cx="50" cy="18" r="2.2" fill="#111D34" stroke="#F4D477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="axis-origin" d="M7 51H10V54" fill="none" stroke="#8D9CB9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
