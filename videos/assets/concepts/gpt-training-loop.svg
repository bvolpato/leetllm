<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">GPT training loop</title>
  <desc id="desc">A causal decoder predicts the next token, updates weights from loss and samples from the checkpoint.</desc>
  <rect data-part="token-context" x="5" y="12" width="22" height="10" rx="2" fill="#111D34" stroke="#79AAFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="causal-mask" d="M10 13V21M16 13V21M22 13V21M6 17H26" fill="none" stroke="#8D9CB9" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="context-to-decoder" d="M27 17H30M28 15L30 17L28 19" fill="none" stroke="#8D9CB9" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="decoder-block" d="M30 13H40L45 17L40 21H30Z" fill="#63DEEC" stroke="#E9EFFF" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
  <rect data-part="next-token-logits" x="48" y="12" width="11" height="10" rx="2" fill="#111D34" stroke="#F4D477" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="decoder-to-logits" d="M45 17H48" fill="none" stroke="#8D9CB9" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="target-shift" d="M11 30H51M47 27L51 30L47 33" fill="none" stroke="#EF9AC8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="loss-node" cx="15" cy="43" r="5" fill="#FF988D" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="gradient-update" d="M20 43H34M31 40L34 43L31 46" fill="none" stroke="#8CDEB5" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="checkpoint" x="38" y="37" width="18" height="13" rx="3" fill="#111D34" stroke="#79AAFF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="sample-feedback" d="M48 52V58H10V50" fill="none" stroke="#F4D477" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
