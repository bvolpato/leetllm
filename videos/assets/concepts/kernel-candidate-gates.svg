<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Kernel candidate gates</title>
  <desc id="desc">A candidate earns a performance claim only after correctness, safety, comparable timing and traffic checks.</desc>
  <path data-part="gate-rail" d="M7 14H57M7 50H57" fill="none" stroke="#8D9CB9" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="reference-gate" d="M13 14V50" fill="none" stroke="#79AAFF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="compile-gate" d="M23 14V50" fill="none" stroke="#63DEEC" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="safety-gate" d="M33 14V50" fill="none" stroke="#F4D477" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="timing-gate" d="M43 14V50" fill="none" stroke="#EF9AC8" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="traffic-gate" d="M53 14V50" fill="none" stroke="#8CDEB5" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="candidate-pass" cx="52" cy="32" r="4" fill="#8CDEB5" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="reject-receipt" d="M14 55H27L31 59H10Z" fill="#FF988D" stroke="#E9EFFF" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
