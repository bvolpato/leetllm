<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">LLM lifecycle</title>
  <desc id="desc">A model moves from pre-training through post-training, evaluation, compression and deployment.</desc>
  <path data-part="lifecycle-path" d="M14 16H30H47V31V48H30H14V31Z" fill="none" stroke="#8D9CB9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="pretraining" cx="14" cy="16" r="5" fill="#79AAFF" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="posttraining" cx="30" cy="16" r="5" fill="#63DEEC" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="evaluation-gate" cx="47" cy="31" r="5" fill="#F4D477" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="compression" cx="30" cy="48" r="5" fill="#EF9AC8" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="deployment" cx="14" cy="31" r="5" fill="#8CDEB5" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="evaluation-feedback" d="M47 36V53H8V36" fill="none" stroke="#FF988D" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
