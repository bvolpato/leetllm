  <circle data-part="shared-prefix-two" cx="42" cy="31" r="4" fill="#111D34" stroke="#63DEEC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="shared-prefix-trunk" d="M15 31H23M31 31H38" fill="none" stroke="#79AAFF" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="branch-upper" d="M46 29C50 29 49 16 54 16" fill="none" stroke="#F4D477" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="branch-lower" d="M46 33C50 33 49 47 54 47" fill="none" stroke="#EF9AC8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="suffix-a" cx="56" cy="15" r="2.8" fill="#111D34" stroke="#F4D477" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="suffix-b" cx="56" cy="48" r="2.8" fill="#111D34" stroke="#EF9AC8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="shared-cache-brace" d="M14 40V45H42V40" fill="none" stroke="#8CDEB5" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="reuse-pulse" d="M24 39V34" fill="none" stroke="#8CDEB5" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="reuse-pulse-two" d="M37 39V34" fill="none" stroke="#8CDEB5" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="prefix-token-a" cx="27" cy="31" r="1.2" fill="#63DEEC" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="prefix-token-b" cx="42" cy="31" r="1.2" fill="#63DEEC" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
