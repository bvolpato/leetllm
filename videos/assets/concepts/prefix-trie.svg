<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Prefix trie</title>
  <desc id="desc">A prefix trie shares common token branches, then separates requests where their suffixes diverge.</desc>
