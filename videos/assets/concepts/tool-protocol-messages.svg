  <path data-part="correlation-link" d="M32 16V18" fill="none" stroke="#F4D477" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="capability-lines" d="M50 47H58M50 51H58M50 55H56" fill="none" stroke="#8CDEB5" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
