<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Tool protocol messages</title>
  <desc id="desc">A host and server exchange correlated request and response messages through a client.</desc>
  <rect data-part="protocol-host" x="4" y="18" width="15" height="24" rx="4" fill="#111D34" stroke="#79AAFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="protocol-client" x="25" y="18" width="15" height="24" rx="4" fill="#111D34" stroke="#F4D477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="protocol-server" x="46" y="18" width="15" height="24" rx="4" fill="#111D34" stroke="#63DEEC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="request-flow" d="M19 24H45M41 21L45 24L41 27" fill="none" stroke="#63DEEC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="response-flow" d="M46 36H20M24 33L20 36L24 39" fill="none" stroke="#79AAFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
