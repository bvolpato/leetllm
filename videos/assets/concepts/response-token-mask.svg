<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Response token mask</title>
  <desc id="desc">Prompt tokens remain contextual input while selected response tokens receive training loss.</desc>
  <rect data-part="user-token-one" x="4" y="15" width="10" height="13" rx="2.5" fill="#111D34" stroke="#8D9CB9" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="user-token-two" x="16" y="15" width="10" height="13" rx="2.5" fill="#111D34" stroke="#8D9CB9" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="role-boundary" x="29" y="13" width="4" height="17" rx="2" fill="#F4D477" stroke="none"/>
  <rect data-part="response-token-one" x="36" y="15" width="10" height="13" rx="2.5" fill="#63DEEC" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="response-token-two" x="48" y="15" width="10" height="13" rx="2.5" fill="#63DEEC" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="eos-token" x="48" y="32" width="10" height="13" rx="2.5" fill="#8CDEB5" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="input-shift" d="M8 11H54" fill="none" stroke="#79AAFF" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="loss-mask" d="M4 52H27M36 52H58" fill="none" stroke="#8D9CB9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="active-loss-region" d="M36 52H58" fill="none" stroke="#63DEEC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="masked-indicator" cx="16" cy="52" r="2.2" fill="#8D9CB9" stroke="none"/>
  <circle data-part="active-indicator" cx="47" cy="52" r="2.2" fill="#63DEEC" stroke="none"/>
</svg>
