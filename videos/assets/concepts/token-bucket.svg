  <path data-part="admission-lane" d="M42 45H55" fill="none" stroke="#63DEEC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="admission-arrow" d="M52 42L55 45L52 48" fill="none" stroke="#63DEEC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
