<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Contrastive pair</title>
  <desc id="desc">Contrastive learning pulls matching examples together in embedding space and separates mismatched examples.</desc>
  <line data-part="positive-pair" x1="19" y1="34" x2="31" y2="25" stroke="#8CDEB5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="negative-push" x1="22" y1="39" x2="11" y2="48" stroke="#EF9AC8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="negative-push-two" x1="38" y1="22" x2="50" y2="13" stroke="#EF9AC8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="anchor" cx="19" cy="34" r="5" fill="#63DEEC" stroke="#E9EFFF" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="positive" cx="31" cy="25" r="5" fill="#8CDEB5" stroke="#E9EFFF" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="negative-one" cx="10" cy="49" r="4" fill="#111D34" stroke="#EF9AC8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="negative-two" cx="52" cy="11" r="4" fill="#111D34" stroke="#EF9AC8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="negative-three" cx="50" cy="48" r="4" fill="#111D34" stroke="#EF9AC8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
