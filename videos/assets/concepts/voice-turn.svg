<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Voice turn</title>
  <desc id="desc">Incoming speech interrupts outgoing audio and resets the current playback turn.</desc>
  <path data-part="outgoing-wave" d="M5 16H11L15 10L20 22L25 13L29 18H35" fill="none" stroke="#79AAFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="playback-line" d="M35 18H53" fill="none" stroke="#79AAFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="interrupt-mark" d="M45 11V25M51 11V25" fill="none" stroke="#FF988D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="incoming-wave" d="M5 46H13L17 39L22 53L27 42L32 49H40" fill="none" stroke="#63DEEC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="cancel-route" d="M39 46H49L55 40" fill="none" stroke="#F4D477" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="cancel-ack" cx="55" cy="40" r="5" fill="#111D34" stroke="#F4D477" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>