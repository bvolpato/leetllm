<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Canary rollout</title>
  <desc id="desc">A time-limited, partial exposure of a new release with predeclared metrics and stop rules before wider promotion.</desc>
  <path data-part="stable-rail" d="M6 18H47" fill="none" stroke="#79AAFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="candidate-rail" d="M6 48H47" fill="none" stroke="#EF9AC8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="stable-release" cx="13" cy="18" r="4" fill="#79AAFF" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="candidate-release" cx="13" cy="48" r="4" fill="#EF9AC8" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="eligible-traffic" d="M19 32H33" fill="none" stroke="#63DEEC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="stable-route" d="M33 32V18H46" fill="none" stroke="#79AAFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="canary-route" d="M33 32V48H43" fill="none" stroke="#EF9AC8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="sticky-assignment" cx="33" cy="32" r="4" fill="#F4D477" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="candidate-users" x="46" y="42" width="12" height="12" rx="4" fill="#111D34" stroke="#EF9AC8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="user-1" cx="50" cy="47" r="1.5" fill="#EF9AC8" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="user-2" cx="55" cy="47" r="1.5" fill="#EF9AC8" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="stop-rule-return" d="M44 51H39V57H6" fill="none" stroke="#FF988D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
