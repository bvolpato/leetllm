<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Neuron signal</title>
  <desc id="desc">A neuron combines weighted inputs, applies an activation function, and sends an output signal.</desc>
  <line data-part="input-a" x1="8" y1="17" x2="25" y2="28" stroke="#79AAFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="input-b" x1="8" y1="32" x2="24" y2="32" stroke="#F4D477" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="input-c" x1="8" y1="47" x2="25" y2="36" stroke="#EF9AC8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="cell-body" cx="31" cy="32" r="9" fill="#111D34" stroke="#63DEEC" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="cell-nucleus" cx="31" cy="32" r="3" fill="#79AAFF" stroke="#79AAFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="axon" x1="40" y1="32" x2="55" y2="32" stroke="#63DEEC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon data-part="output-tip" points="55,32 49,28 49,36" fill="#63DEEC" stroke="#63DEEC" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="signal-pulse" cx="48" cy="32" r="2.4" fill="#F4D477" stroke="#F4D477" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
