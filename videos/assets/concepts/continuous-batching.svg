<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Continuous batching</title>
  <desc id="desc">A serving schedule that admits new sequences into freed decode slots between generation steps.</desc>
  <line data-part="step-1" x1="17" y1="10" x2="17" y2="54" fill="none" stroke="#8D9CB9" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="step-2" x1="31" y1="10" x2="31" y2="54" fill="none" stroke="#8D9CB9" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="step-3" x1="45" y1="10" x2="45" y2="54" fill="none" stroke="#8D9CB9" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="sequence-a" d="M7 18H54" fill="none" stroke="#63DEEC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="slot-a-1" x="12" y="14" width="9" height="8" rx="2" fill="#63DEEC" stroke="#63DEEC" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="slot-a-2" x="26" y="14" width="9" height="8" rx="2" fill="#63DEEC" stroke="#63DEEC" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="slot-a-3" x="40" y="14" width="9" height="8" rx="2" fill="#63DEEC" stroke="#63DEEC" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="sequence-b" d="M7 34H40" fill="none" stroke="#79AAFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="slot-b-1" x="12" y="30" width="9" height="8" rx="2" fill="#79AAFF" stroke="#79AAFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="slot-b-2" x="26" y="30" width="9" height="8" rx="2" fill="#79AAFF" stroke="#79AAFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="sequence-c" d="M31 50H54" fill="none" stroke="#EF9AC8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="slot-c-2" x="26" y="46" width="9" height="8" rx="2" fill="#EF9AC8" stroke="#EF9AC8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="slot-c-3" x="40" y="46" width="9" height="8" rx="2" fill="#EF9AC8" stroke="#EF9AC8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="admit-at-freed-slot" d="M31 42V46" fill="none" stroke="#F4D477" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="cache-capacity" cx="56" cy="50" r="4" fill="#111D34" stroke="#F4D477" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
