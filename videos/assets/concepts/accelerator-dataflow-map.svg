<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Accelerator dataflow map</title>
  <desc id="desc">Data moves from device memory into local tiles, through compute, and across peer links when needed.</desc>
  <path data-part="device-memory" d="M6 13L18 8L30 13L18 18Z" fill="#79AAFF" stroke="#E9EFFF" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
  <path data-part="memory-depth" d="M6 13V39L18 45L30 39V13M6 26L18 32L30 26" fill="none" stroke="#79AAFF" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/>
  <path data-part="tile-load" d="M31 25H37M34 22L37 25L34 28" fill="none" stroke="#8D9CB9" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="local-tile" x="38" y="18" width="12" height="14" rx="2" fill="#111D34" stroke="#63DEEC" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="compute-route" d="M50 25H54M52 22L55 25L52 28" fill="none" stroke="#8D9CB9" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
