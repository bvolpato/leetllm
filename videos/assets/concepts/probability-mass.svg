<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Probability mass</title>
  <desc id="desc">A discrete distribution assigns probability mass to outcomes, with the masses summing to one.</desc>
  <line data-part="outcome-axis" x1="9" y1="52" x2="56" y2="52" stroke="#8D9CB9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="mass-axis" x1="11" y1="54" x2="11" y2="10" stroke="#8D9CB9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="mass-low" x="16" y="40" width="6" height="12" rx="1" fill="#79AAFF" stroke="#79AAFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="mass-mid" x="26" y="28" width="6" height="24" rx="1" fill="#63DEEC" stroke="#63DEEC" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="mass-mode" x="36" y="16" width="6" height="36" rx="1" fill="#F4D477" stroke="#F4D477" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="mass-tail" x="46" y="34" width="6" height="18" rx="1" fill="#EF9AC8" stroke="#EF9AC8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="sum-left" x1="14" y1="11" x2="14" y2="15" stroke="#E9EFFF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="sum-top" x1="14" y1="11" x2="54" y2="11" stroke="#E9EFFF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="sum-right" x1="54" y1="11" x2="54" y2="15" stroke="#E9EFFF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
