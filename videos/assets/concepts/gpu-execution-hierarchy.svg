<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">GPU execution hierarchy</title>
  <desc id="desc">A host launch maps work into GPU blocks, then threads execute inside a multiprocessor.</desc>
  <rect data-part="host-region" x="6" y="15" width="15" height="31" rx="4" fill="#111D34" stroke="#79AAFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="host-core" x="10" y="20" width="7" height="8" rx="2" fill="#79AAFF" stroke="none"/>
  <path data-part="host-pins" d="M8 32L8 40M12 32L12 40M16 32L16 40" fill="none" stroke="#79AAFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="kernel-launch-shaft" d="M22 30L25.5 30" fill="none" stroke="#F4D477" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="kernel-launch-head" d="M30 30L25.5 32.8L25.5 27.2Z" fill="#F4D477" stroke="none"/>
  <rect data-part="device-region" x="32" y="8" width="26" height="47" rx="5" fill="#111D34" stroke="#8D9CB9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="block-a" x="36" y="13" width="8" height="8" rx="2" fill="#79AAFF" stroke="none"/>
  <rect data-part="block-b" x="47" y="13" width="8" height="8" rx="2" fill="#111D34" stroke="#8D9CB9" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="block-c" x="36" y="24" width="8" height="8" rx="2" fill="#111D34" stroke="#8D9CB9" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="block-d" x="47" y="24" width="8" height="8" rx="2" fill="#111D34" stroke="#8D9CB9" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="expanded-block" x="36" y="35" width="19" height="15" rx="3" fill="#111D34" stroke="#F4D477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="thread-a" cx="41" cy="40" r="1.7" fill="#63DEEC" stroke="none"/>
  <circle data-part="thread-b" cx="49" cy="40" r="1.7" fill="#63DEEC" stroke="none"/>
  <circle data-part="thread-c" cx="41" cy="46" r="1.7" fill="#63DEEC" stroke="none"/>
  <circle data-part="thread-d" cx="49" cy="46" r="1.7" fill="#63DEEC" stroke="none"/>
</svg>
