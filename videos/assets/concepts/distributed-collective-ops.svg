<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Distributed collective operations</title>
  <desc id="desc">Four ranks exchange tensor shards around a ring and synchronize a reduced result.</desc>
