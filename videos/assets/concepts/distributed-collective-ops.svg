  <circle data-part="rank-right" cx="55" cy="32" r="4" fill="#111D34" stroke="#E9EFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="rank-bottom" cx="32" cy="55" r="4" fill="#111D34" stroke="#E9EFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="rank-left" cx="9" cy="32" r="4" fill="#111D34" stroke="#E9EFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="collective-result" cx="32" cy="32" r="5" fill="#8CDEB5" stroke="#E9EFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
