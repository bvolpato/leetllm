  <path data-part="ring-bottom" d="M32 56C18 59 8 49 9 37" fill="none" stroke="#F4D477" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="ring-left" d="M9 30C9 19 13 14 19 11" fill="none" stroke="#EF9AC8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="ring-arrow-top" d="M51 22L51 28L56 25Z" fill="#79AAFF" stroke="none"/>
  <path data-part="ring-arrow-right" d="M40 52L35 57L42 58Z" fill="#63DEEC" stroke="none"/>
