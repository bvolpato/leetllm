<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Inference latency clocks</title>
  <desc id="desc">A long initial processing segment is followed by repeated token intervals.</desc>
  <path data-part="latency-timeline" d="M5 46H60" fill="none" stroke="#8D9CB9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="initial-wait" x="7" y="30" width="23" height="11" rx="3" fill="#79AAFF" stroke="none"/>
  <path data-part="first-token-mark" d="M31 25V50" fill="none" stroke="#F4D477" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="output-token-one" cx="37" cy="46" r="3.2" fill="#63DEEC" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="output-token-two" cx="46" cy="46" r="3.2" fill="#63DEEC" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="output-token-three" cx="55" cy="46" r="3.2" fill="#63DEEC" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="decode-gaps" d="M37 36H46M46 36H55" fill="none" stroke="#8CDEB5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="clock-face" cx="18" cy="16" r="8" fill="#111D34" stroke="#F4D477" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="clock-hands" d="M18 11V16L22 18" fill="none" stroke="#F4D477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
