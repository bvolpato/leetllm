<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Embedding neighborhood map</title>
  <desc id="desc">A query vector sits in learned space among nearby items ranked by geometric proximity.</desc>
  <path data-part="x-axis" d="M9 52L54 52" fill="none" stroke="#8D9CB9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="y-axis" d="M11 54L11 11" fill="none" stroke="#8D9CB9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="neighborhood-radius" cx="31" cy="32" r="19" fill="none" stroke="#8D9CB9" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="query-vector" d="M12 51L26 38" fill="none" stroke="#F4D477" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="query-tip" d="M26 38L22 39L25 42Z" fill="#F4D477" stroke="none"/>
  <circle data-part="query-point" cx="12" cy="51" r="3" fill="#F4D477" stroke="#E9EFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="nearest-point-a" cx="27" cy="36" r="3" fill="#63DEEC" stroke="#E9EFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="nearest-point-b" cx="35" cy="29" r="2.8" fill="#8CDEB5" stroke="#E9EFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="nearest-point-c" cx="40" cy="39" r="2.5" fill="#79AAFF" stroke="#E9EFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="far-point-a" cx="47" cy="17" r="2" fill="#8D9CB9" stroke="none"/>
  <circle data-part="far-point-b" cx="20" cy="18" r="2" fill="#8D9CB9" stroke="none"/>
  <circle data-part="far-point-c" cx="49" cy="47" r="2" fill="#8D9CB9" stroke="none"/>
</svg>
