<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Causal intervention</title>
  <desc id="desc">An intervention sets a treatment value and removes its usual incoming causes from the causal graph.</desc>
  <line data-part="observed-cause" x1="9" y1="31" x2="25" y2="31" stroke="#8D9CB9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon data-part="observed-arrow" points="25,31 20,28 20,34" fill="#8D9CB9" stroke="#8D9CB9" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="treatment-node" cx="30" cy="31" r="6" fill="#111D34" stroke="#F4D477" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="causal-effect" x1="36" y1="31" x2="52" y2="31" stroke="#63DEEC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon data-part="effect-arrow" points="52,31 46,27 46,35" fill="#63DEEC" stroke="#63DEEC" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="outcome-node" cx="55" cy="31" r="4" fill="#111D34" stroke="#63DEEC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="do-input" x1="30" y1="10" x2="30" y2="22" stroke="#EF9AC8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon data-part="do-arrow" points="30,22 26,16 34,16" fill="#EF9AC8" stroke="#EF9AC8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="intervention-ring" cx="30" cy="31" r="10" fill="none" stroke="#F4D477" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
