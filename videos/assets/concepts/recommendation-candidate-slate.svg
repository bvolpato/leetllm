  <rect data-part="candidate-two" x="27" y="27" width="21" height="8" rx="3" fill="#79AAFF" stroke="none" stroke-width="1"/>
  <rect data-part="candidate-three" x="27" y="38" width="13" height="8" rx="3" fill="#EF9AC8" stroke="none" stroke-width="1"/>
