<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Sandbox</title>
  <desc id="desc">A sandbox constrains an untrusted process with explicit resource and authority limits.</desc>
  <rect data-part="sandbox-enclosure" x="9" y="12" width="46" height="40" rx="6" fill="#111D34" stroke="#79AAFF" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="resource-ceiling" d="M13 19H51" fill="none" stroke="#F4D477" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="ceiling-stops" d="M13 16V22M51 16V22" fill="none" stroke="#F4D477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="untrusted-process" x="20" y="25" width="24" height="18" rx="4" fill="#111D34" stroke="#63DEEC" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="process-core" cx="32" cy="34" r="4" fill="#63DEEC" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="cpu-resource" d="M14 30H19M14 36H19" fill="none" stroke="#8D9CB9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="time-resource" d="M45 30H50M45 36H50" fill="none" stroke="#8D9CB9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="filesystem-boundary" d="M16 47H25" fill="none" stroke="#EF9AC8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="network-boundary" d="M39 47H48" fill="none" stroke="#EF9AC8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="fs-stop" d="M25 44V50M39 44V50" fill="none" stroke="#EF9AC8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="network-stop" d="M48 44L51 47L48 50" fill="none" stroke="#EF9AC8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
