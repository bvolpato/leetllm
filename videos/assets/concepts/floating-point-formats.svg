<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Floating-point formats</title>
  <desc id="desc">Bit fields divide a floating-point value into sign, exponent, and fraction regions.</desc>
  <rect data-part="sign-field" x="7" y="12" width="8" height="11" rx="2" fill="#EF9AC8" stroke="none"/>
  <rect data-part="exponent-field" x="17" y="12" width="19" height="11" rx="2" fill="#F4D477" stroke="none"/>
  <rect data-part="fraction-field" x="38" y="12" width="19" height="11" rx="2" fill="#63DEEC" stroke="none"/>
  <path data-part="sign-divider" d="M16 10L16 25" fill="none" stroke="#E9EFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="exponent-divider-a" d="M37 10L37 25" fill="none" stroke="#E9EFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="short-exponent" x="17" y="29" width="13" height="8" rx="2" fill="#F4D477" stroke="none"/>
  <rect data-part="short-fraction" x="32" y="29" width="25" height="8" rx="2" fill="#63DEEC" stroke="none"/>
  <rect data-part="wide-exponent" x="17" y="41" width="22" height="8" rx="2" fill="#F4D477" stroke="none"/>
  <rect data-part="wide-fraction" x="41" y="41" width="16" height="8" rx="2" fill="#63DEEC" stroke="none"/>
  <path data-part="number-line" d="M8 56L56 56" fill="none" stroke="#8D9CB9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="number-tick-a" d="M17 53L17 59" fill="none" stroke="#8D9CB9" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="number-tick-b" d="M29 53L29 59" fill="none" stroke="#8D9CB9" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="number-tick-c" d="M41 53L41 59" fill="none" stroke="#8D9CB9" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="number-tick-d" d="M53 53L53 59" fill="none" stroke="#8D9CB9" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
