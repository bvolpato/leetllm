<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Kernel fusion traffic</title>
  <desc id="desc">Fusion keeps intermediate values local so adjacent operations avoid writing and rereading temporary tensors.</desc>
  <rect data-part="global-input-a" x="5" y="12" width="12" height="10" rx="2" fill="#111D34" stroke="#79AAFF" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="global-input-b" x="5" y="39" width="12" height="10" rx="2" fill="#111D34" stroke="#63DEEC" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="read-a" d="M18 17H23M20 14L23 17L20 20" fill="none" stroke="#8D9CB9" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="read-b" d="M18 44H23M20 41L23 44L20 47" fill="none" stroke="#8D9CB9" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="temporary-tensor" x="25" y="9" width="12" height="10" rx="2" fill="#EF9AC8" stroke="#E9EFFF" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="second-temporary" x="25" y="25" width="12" height="10" rx="2" fill="#F4D477" stroke="#E9EFFF" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="fused-register-tile" x="25" y="41" width="12" height="10" rx="2" fill="#8CDEB5" stroke="#E9EFFF" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="fusion-boundary" d="M23 7V53M39 7V53" fill="none" stroke="#63DEEC" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="single-output-write" d="M38 46H47M44 43L47 46L44 49" fill="none" stroke="#8CDEB5" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="global-output" x="49" y="39" width="11" height="14" rx="2" fill="#111D34" stroke="#8CDEB5" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
