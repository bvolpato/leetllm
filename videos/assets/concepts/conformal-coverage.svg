  <circle data-part="test-sample-a" cx="47" cy="40" r="1.5" fill="#8CDEB5" stroke="none"/>
  <circle data-part="test-sample-b" cx="53" cy="40" r="1.5" fill="#8CDEB5" stroke="none"/>
