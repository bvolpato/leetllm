<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Provider fallback route</title>
  <desc id="desc">A route selector that first removes lanes violating hard requirements, then ranks compatible providers and revalidates fallback output.</desc>
  <rect data-part="primary-provider" x="5" y="8" width="22" height="13" rx="4" fill="#111D34" stroke="#63DEEC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="primary-mark" x1="10" y1="14" x2="21" y2="14" fill="none" stroke="#63DEEC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="secondary-provider" x="5" y="27" width="22" height="13" rx="4" fill="#111D34" stroke="#8CDEB5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="secondary-mark" x1="10" y1="33" x2="21" y2="33" fill="none" stroke="#8CDEB5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="incompatible-provider" x="5" y="46" width="22" height="11" rx="4" fill="#111D34" stroke="#FF988D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="incompatible-mark" x1="10" y1="51" x2="21" y2="51" fill="none" stroke="#FF988D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="eligible-lanes" d="M27 14H34V32H40M27 33H40" fill="none" stroke="#8CDEB5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="excluded-lane" d="M27 51H34V41" fill="none" stroke="#FF988D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="exclusion-cap" x1="31" y1="47" x2="37" y2="53" fill="none" stroke="#FF988D" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="route-selector" x="39" y="20" width="17" height="24" rx="5" fill="#111D34" stroke="#F4D477" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="selected-route" d="M43 27H51M43 32H49M43 37H51" fill="none" stroke="#F4D477" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="fallback-check" d="M56 32H59V14" fill="none" stroke="#8CDEB5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="validated-result" x="52" y="7" width="9" height="12" rx="3" fill="#111D34" stroke="#8CDEB5" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="result-check" cx="56.5" cy="13" r="2" fill="#8CDEB5" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
