<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Classification boundary</title>
  <desc id="desc">A decision boundary separates regions where a classifier predicts different classes.</desc>
  <line data-part="horizontal-feature" x1="9" y1="53" x2="55" y2="53" stroke="#8D9CB9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="vertical-feature" x1="11" y1="55" x2="11" y2="10" stroke="#8D9CB9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="decision-boundary" x1="16" y1="51" x2="51" y2="17" stroke="#F4D477" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="class-a-one" cx="20" cy="40" r="3" fill="#79AAFF" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="class-a-two" cx="26" cy="46" r="3" fill="#79AAFF" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="class-a-three" cx="17" cy="29" r="3" fill="#79AAFF" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="class-b-one" cx="43" cy="24" r="3" fill="#EF9AC8" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="class-b-two" cx="47" cy="34" r="3" fill="#EF9AC8" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="class-b-three" cx="36" cy="19" r="3" fill="#EF9AC8" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
