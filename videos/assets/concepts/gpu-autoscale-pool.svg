<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">GPU autoscale pool</title>
  <desc id="desc">Queue pressure triggers new GPU replicas that become ready after warmup.</desc>
  <path data-part="queue-base" d="M5 50H25" fill="none" stroke="#8D9CB9" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="queued-request-one" x="6" y="39" width="5" height="9" rx="1.5" fill="#F4D477" stroke="none"/>
  <rect data-part="queued-request-two" x="13" y="34" width="5" height="14" rx="1.5" fill="#F4D477" stroke="none"/>
  <rect data-part="queued-request-three" x="20" y="29" width="5" height="19" rx="1.5" fill="#EF9AC8" stroke="none"/>
  <path data-part="scale-arrow" d="M28 38H34L38 30" fill="none" stroke="#8CDEB5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="gpu-replica-one" x="38" y="9" width="10" height="17" rx="3" fill="#111D34" stroke="#63DEEC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="gpu-replica-two" x="50" y="9" width="10" height="17" rx="3" fill="#111D34" stroke="#63DEEC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="gpu-replica-three" x="38" y="31" width="10" height="17" rx="3" fill="#111D34" stroke="#79AAFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="ready-light-one" cx="43" cy="14" r="1.8" fill="#8CDEB5" stroke="none"/>
  <circle data-part="ready-light-two" cx="55" cy="14" r="1.8" fill="#8CDEB5" stroke="none"/>
  <circle data-part="warm-light" cx="43" cy="36" r="1.8" fill="#F4D477" stroke="none"/>
</svg>
