<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Query rewrite</title>
  <desc id="desc">A transformation of a user's search wording into one or more retrieval keys that preserve the original request and its constraints.</desc>
  <rect data-part="original-question" x="4" y="25" width="18" height="15" rx="5" fill="#111D34" stroke="#63DEEC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="question-line-1" x1="8" y1="30" x2="18" y2="30" fill="none" stroke="#63DEEC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="question-line-2" x1="8" y1="35" x2="15" y2="35" fill="none" stroke="#8D9CB9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="rewrite-arrow" d="M23 32H30M27 29L30 32L27 35" fill="none" stroke="#F4D477" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="clarified-query" x="32" y="8" width="27" height="13" rx="4" fill="#111D34" stroke="#79AAFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="clarified-mark" x1="37" y1="14" x2="53" y2="14" fill="none" stroke="#79AAFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="subquery-a" x="32" y="27" width="24" height="11" rx="4" fill="#111D34" stroke="#63DEEC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="subquery-mark-a" x1="37" y1="32" x2="50" y2="32" fill="none" stroke="#63DEEC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="subquery-b" x="32" y="44" width="24" height="11" rx="4" fill="#111D34" stroke="#EF9AC8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="subquery-mark-b" x1="37" y1="49" x2="50" y2="49" fill="none" stroke="#EF9AC8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="branch-a" d="M30 32V14H32" fill="none" stroke="#79AAFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="branch-b" d="M30 32H32" fill="none" stroke="#63DEEC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="branch-c" d="M30 32V49H32" fill="none" stroke="#EF9AC8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="trusted-filter" cx="57" cy="50" r="3" fill="#F4D477" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
