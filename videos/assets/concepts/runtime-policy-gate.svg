<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Runtime policy gate</title>
  <desc id="desc">A trusted decision point that checks caller identity, action, arguments, resource scope, and required approval before a side effect.</desc>
  <rect data-part="untrusted-request" x="4" y="20" width="17" height="24" rx="4" fill="#111D34" stroke="#8D9CB9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="request-line" x1="8" y1="27" x2="16" y2="27" fill="none" stroke="#8D9CB9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="request-line-2" x1="8" y1="33" x2="18" y2="33" fill="none" stroke="#8D9CB9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="request-path" d="M21 32H27" fill="none" stroke="#63DEEC" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="policy-core" x="27" y="10" width="20" height="44" rx="5" fill="#111D34" stroke="#F4D477" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="principal-check" cx="33" cy="19" r="2.5" fill="#8CDEB5" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="action-check" cx="41" cy="19" r="2.5" fill="#8CDEB5" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="scope-check" cx="33" cy="28" r="2.5" fill="#8CDEB5" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="approval-check" cx="41" cy="28" r="2.5" fill="#F4D477" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="gate-separator" x1="31" y1="35" x2="43" y2="35" fill="none" stroke="#8D9CB9" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="allow-path" d="M47 22H53V14" fill="none" stroke="#8CDEB5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="deny-path" d="M47 42H53V50" fill="none" stroke="#FF988D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="effect" x="51" y="7" width="9" height="12" rx="3" fill="#111D34" stroke="#8CDEB5" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="effect-dot" cx="55" cy="13" r="1.8" fill="#8CDEB5" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="deny-receipt" x="49" y="46" width="12" height="11" rx="3" fill="#111D34" stroke="#FF988D" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="deny-mark" x1="52" y1="51" x2="58" y2="51" fill="none" stroke="#FF988D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
