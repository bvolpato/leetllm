<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Cross-encoder reranker</title>
  <desc id="desc">A second-stage model that jointly scores query and candidate text to improve ordering within an already retrieved shortlist.</desc>
  <rect data-part="query-strip" x="5" y="10" width="25" height="12" rx="4" fill="#111D34" stroke="#63DEEC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="query-mark" x1="10" y1="16" x2="23" y2="16" fill="none" stroke="#63DEEC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="candidate-strip" x="5" y="28" width="25" height="14" rx="4" fill="#111D34" stroke="#79AAFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="candidate-mark" x1="10" y1="34" x2="24" y2="34" fill="none" stroke="#79AAFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="candidate-mark-2" x1="10" y1="38" x2="19" y2="38" fill="none" stroke="#8D9CB9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="joint-scoring-core" x="35" y="16" width="12" height="21" rx="4" fill="#F4D477" stroke="#E9EFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="joint-point" cx="41" cy="22" r="2" fill="#111D34" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="joint-point-2" cx="41" cy="31" r="2" fill="#111D34" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="joint-input" d="M30 16H35M30 35H35" fill="none" stroke="#E9EFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="ranked-route" d="M47 27H53" fill="none" stroke="#8CDEB5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="ranked-candidate" x="51" y="13" width="9" height="10" rx="2" fill="#111D34" stroke="#8CDEB5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="ranked-top" x1="54" y1="18" x2="58" y2="18" fill="none" stroke="#8CDEB5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="shortlist-2" x="52" y="28" width="8" height="8" rx="2" fill="#111D34" stroke="#8D9CB9" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="shortlist-3" x="52" y="41" width="8" height="8" rx="2" fill="#111D34" stroke="#8D9CB9" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
