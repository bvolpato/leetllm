<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Sandbox execution boundary</title>
  <desc id="desc">Generated code runs inside a bounded workspace separated from secrets and network paths.</desc>
  <rect data-part="sandbox-frame" x="15" y="9" width="35" height="45" rx="5" fill="#111D34" stroke="#63DEEC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="generated-code" x="23" y="19" width="19" height="15" rx="3" fill="#0A1020" stroke="#79AAFF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="code-lines" d="M27 24L31 27L27 30M35 30H39" fill="none" stroke="#79AAFF" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="resource-limit" d="M21 40H44" fill="none" stroke="#F4D477" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="resource-cap" cx="32" cy="40" r="2.6" fill="#F4D477" stroke="none"/>
  <path data-part="blocked-secret-path" d="M5 20H12M5 44H12M52 20H59M52 44H59" fill="none" stroke="#EF9AC8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="boundary-lock" d="M29 58V55C29 50 35 50 35 55V58M27 58H37" fill="none" stroke="#8CDEB5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
