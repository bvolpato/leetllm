  <circle data-part="sample-three" cx="36" cy="15" r="2" fill="#F4D477" stroke="none"/>
  <circle data-part="sample-four" cx="49" cy="15" r="2" fill="#EF9AC8" stroke="none"/>
  <path data-part="resample-one" d="M12 29L18 29M23 29L29 29M34 29L40 29M45 29L51 29" fill="none" stroke="#8D9CB9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="bootstrap-a1" cx="15" cy="29" r="2" fill="#79AAFF" stroke="none"/>
