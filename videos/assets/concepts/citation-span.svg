<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Citation span</title>
  <desc id="desc">A traceable link from a specific answer claim to the source text and version that support it.</desc>
  <rect data-part="source-card" x="5" y="12" width="27" height="39" rx="4" fill="#111D34" stroke="#E9EFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="source-context" x1="10" y1="20" x2="26" y2="20" fill="none" stroke="#8D9CB9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="cited-span" x="10" y="25" width="17" height="8" rx="2" fill="#F4D477" stroke="#E9EFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="source-lower-context" x1="10" y1="38" x2="24" y2="38" fill="none" stroke="#8D9CB9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="version-dot" cx="27" cy="45" r="2.7" fill="#79AAFF" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="evidence-link" d="M29 29C37 25 39 20 44 19" fill="none" stroke="#63DEEC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="claim-card" x="40" y="12" width="19" height="17" rx="4" fill="#111D34" stroke="#E9EFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="claim-line-1" x1="45" y1="19" x2="54" y2="19" fill="none" stroke="#E9EFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="claim-line-2" x1="45" y1="24" x2="51" y2="24" fill="none" stroke="#8D9CB9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="locator-pin" cx="47" cy="44" r="6" fill="#F4D477" stroke="#E9EFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="locator-center" cx="47" cy="44" r="1.7" fill="#111D34" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
