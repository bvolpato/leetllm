<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Reward feedback loop</title>
  <desc id="desc">An agent chooses an action, the environment changes state, and a reward guides later choices.</desc>
  <rect data-part="agent" x="7" y="23" width="17" height="18" rx="5" fill="#111D34" stroke="#79AAFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="environment" x="40" y="23" width="17" height="18" rx="5" fill="#111D34" stroke="#EF9AC8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="action" d="M24 27h15l-4-4m4 4-4 4" fill="none" stroke="#63DEEC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="state" d="M40 37H25l4 4m-4-4 4-4" fill="none" stroke="#8CDEB5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="reward" cx="32" cy="50" r="5" fill="#F4D477" stroke="#0A1020" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="reward-path" d="M48 42v8H37" fill="none" stroke="#F4D477" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>