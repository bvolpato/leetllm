<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Semantic cache eligibility</title>
  <desc id="desc">A reuse layer that returns a prior answer only after access, release, freshness, and similarity requirements all hold.</desc>
  <rect data-part="new-query" x="4" y="26" width="13" height="13" rx="4" fill="#111D34" stroke="#63DEEC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="query-mark" x1="7" y1="32" x2="13" y2="32" fill="none" stroke="#63DEEC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="eligibility-route" d="M17 32H21" fill="none" stroke="#8CDEB5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="caller-access-gate" cx="24" cy="32" r="3.1" fill="#8CDEB5" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="freshness-gate" cx="31" cy="32" r="3.1" fill="#79AAFF" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="release-gate" cx="38" cy="32" r="3.1" fill="#F4D477" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="similarity-check" d="M41 32H45" fill="none" stroke="#EF9AC8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="similarity-lens" cx="49" cy="32" r="6" fill="#111D34" stroke="#EF9AC8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="lens-handle" x1="53" y1="36" x2="58" y2="41" fill="none" stroke="#EF9AC8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="cached-pair" x="44" y="8" width="16" height="12" rx="3" fill="#111D34" stroke="#8D9CB9" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="cached-query" x1="47" y1="13" x2="56" y2="13" fill="none" stroke="#63DEEC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="cached-answer" x="44" y="45" width="16" height="11" rx="3" fill="#111D34" stroke="#8CDEB5" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="answer-mark" x1="47" y1="50" x2="56" y2="50" fill="none" stroke="#8CDEB5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="bypass" d="M24 36V53H39" fill="none" stroke="#FF988D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="bypass-stop" cx="40" cy="53" r="2.4" fill="#FF988D" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
