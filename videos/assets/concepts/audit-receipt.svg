  <circle data-part="actor-identity" cx="23" cy="24" r="4" fill="#63DEEC" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="actor-shoulders" d="M16 35C17 30 29 30 30 35" fill="none" stroke="#63DEEC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="version-chain" d="M34 22H46M34 28H43M34 34H46" fill="none" stroke="#8D9CB9" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
