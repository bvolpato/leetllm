  <path data-part="decision-rule" d="M18 42H45" fill="none" stroke="#8D9CB9" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="outcome-check" d="M23 48L28 52L37 43" fill="none" stroke="#8CDEB5" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="audit-seal" d="M45 41L49 43V48L45 51L41 48V43Z" fill="none" stroke="#F4D477" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
