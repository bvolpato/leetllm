<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Audit receipt</title>
  <desc id="desc">A compact audit record links the responsible actor, time, policy and model versions, evidence, and outcome.</desc>
  <path data-part="receipt-outline" d="M13 7H43L52 16V55H13Z" fill="#111D34" stroke="#79AAFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
