<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Request latency waterfall</title>
  <desc id="desc">A timeline that places each request stage on one declared clock and distinguishes serial work from overlapped work.</desc>
  <line data-part="clock-axis" x1="6" y1="52" x2="59" y2="52" fill="none" stroke="#8D9CB9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="admission-stage" x="8" y="12" width="8" height="9" rx="2" fill="#63DEEC" stroke="#E9EFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="retrieval-stage" x="17" y="12" width="13" height="9" rx="2" fill="#79AAFF" stroke="#E9EFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="prefill-stage" x="31" y="12" width="12" height="9" rx="2" fill="#F4D477" stroke="#E9EFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="decode-stage" x="44" y="12" width="10" height="9" rx="2" fill="#EF9AC8" stroke="#E9EFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="serial-clock" d="M8 27H24V34H37V42H51" fill="none" stroke="#E9EFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="ttft-stop" x1="37" y1="24" x2="37" y2="49" fill="none" stroke="#8CDEB5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="completion-stop" x1="53" y1="24" x2="53" y2="49" fill="none" stroke="#FF988D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="first-token" cx="37" cy="42" r="3" fill="#8CDEB5" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="response-end" cx="53" cy="42" r="3" fill="#FF988D" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="overlap-a" d="M18 34H30" fill="none" stroke="#63DEEC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="overlap-b" d="M18 39H27" fill="none" stroke="#79AAFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="token-gap-1" x1="44" y1="39" x2="44" y2="47" fill="none" stroke="#F4D477" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="token-gap-2" x1="48" y1="39" x2="48" y2="47" fill="none" stroke="#F4D477" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="token-gap-3" x1="52" y1="39" x2="52" y2="47" fill="none" stroke="#F4D477" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
