<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Backpressure</title>
  <desc id="desc">A capacity signal that slows, pauses, or rejects new work while downstream workers drain admitted work.</desc>
  <path data-part="producer-flow" d="M6 15H19" fill="none" stroke="#63DEEC" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="producer-arrow" d="M15 12L19 15L15 18" fill="none" stroke="#63DEEC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="bounded-queue" x="20" y="8" width="24" height="31" rx="4" fill="#111D34" stroke="#F4D477" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="queued-a" x="25" y="13" width="14" height="6" rx="2" fill="#111D34" stroke="#63DEEC" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="queued-b" x="25" y="21" width="14" height="6" rx="2" fill="#111D34" stroke="#79AAFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="queued-c" x="25" y="29" width="14" height="6" rx="2" fill="#111D34" stroke="#EF9AC8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="drain-flow" d="M44 24H57" fill="none" stroke="#8CDEB5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="worker" cx="57" cy="24" r="4" fill="#111D34" stroke="#8CDEB5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="retry-signal" d="M32 40V53H10V32" fill="none" stroke="#FF988D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="retry-arrow" d="M7 36L10 32L13 36" fill="none" stroke="#FF988D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="admitted-count" cx="22" cy="50" r="2.1" fill="#8CDEB5" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="queued-count" cx="29" cy="50" r="2.1" fill="#F4D477" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="rejected-count" cx="36" cy="50" r="2.1" fill="#FF988D" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="capacity-cap" x1="20" y1="39" x2="44" y2="39" fill="none" stroke="#F4D477" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
