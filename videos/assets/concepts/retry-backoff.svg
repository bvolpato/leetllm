<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Retry with backoff and jitter</title>
  <desc id="desc">A bounded retry schedule that spreads attempts over time while preserving one operation identity and an absolute deadline.</desc>
  <line data-part="timeline" x1="7" y1="49" x2="57" y2="49" fill="none" stroke="#8D9CB9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="attempt-1-stem" x1="13" y1="49" x2="13" y2="36" fill="none" stroke="#63DEEC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="attempt-1" cx="13" cy="34" r="4" fill="#63DEEC" stroke="#E9EFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="attempt-2-stem" x1="28" y1="49" x2="28" y2="30" fill="none" stroke="#79AAFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="attempt-2" cx="28" cy="28" r="4" fill="#79AAFF" stroke="#E9EFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="attempt-3-stem" x1="46" y1="49" x2="46" y2="22" fill="none" stroke="#EF9AC8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="attempt-3" cx="46" cy="20" r="4" fill="#EF9AC8" stroke="#E9EFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="backoff-arc" d="M13 27Q24 15 36 19T49 13" fill="none" stroke="#F4D477" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="operation-identity" cx="12" cy="12" r="4" fill="#111D34" stroke="#F4D477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="identity-stem" x1="12" y1="12" x2="12" y2="13" fill="none" stroke="#111D34" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="deadline" x1="57" y1="10" x2="57" y2="53" fill="none" stroke="#FF988D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="deadline-cap" d="M53 10H60M53 53H60" fill="none" stroke="#FF988D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="jitter-a" cx="34" cy="35" r="1.5" fill="#F4D477" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="jitter-b" cx="38" cy="32" r="1.3" fill="#F4D477" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
