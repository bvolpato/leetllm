<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Model drift and delayed labels</title>
  <desc id="desc">A shifted live-feature distribution appears before outcomes mature for model scoring.</desc>
