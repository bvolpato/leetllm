  <path data-part="live-distribution" d="M22 26C31 25 32 9 42 10C51 11 52 24 57 25" fill="none" stroke="#F4D477" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="event-timeline" d="M8 47L56 47" fill="none" stroke="#8D9CB9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="prediction-event" cx="13" cy="47" r="3" fill="#63DEEC" stroke="none"/>
  <circle data-part="label-arrival" cx="38" cy="47" r="3" fill="#EF9AC8" stroke="none"/>
  <circle data-part="score-update" cx="52" cy="47" r="3" fill="#8CDEB5" stroke="none"/>
