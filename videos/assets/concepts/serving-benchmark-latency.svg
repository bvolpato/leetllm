<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Serving benchmark latency</title>
  <desc id="desc">A measured request trace shows median and tail latency across a defined load interval.</desc>
  <path data-part="latency-axes" d="M9 9V53H58" fill="none" stroke="#8D9CB9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="median-latency" d="M12 42L20 40L28 39L36 37L44 35L53 34" fill="none" stroke="#63DEEC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="tail-latency" d="M12 28L20 26L28 25L36 20L44 23L53 12" fill="none" stroke="#EF9AC8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="measured-median" cx="44" cy="35" r="3" fill="#63DEEC" stroke="none" stroke-width="1"/>
  <circle data-part="measured-tail" cx="53" cy="12" r="3.6" fill="#F4D477" stroke="none" stroke-width="1"/>
  <path data-part="load-window" d="M12 57H53M12 55V59M53 55V59" fill="none" stroke="#79AAFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>