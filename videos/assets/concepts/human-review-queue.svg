<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Human review queue</title>
  <desc id="desc">A work queue that presents bounded, attributable decisions to reviewers while preserving hard policy gates and escalation rules.</desc>
  <rect data-part="queued-card-back" x="7" y="9" width="25" height="17" rx="4" fill="#111D34" stroke="#8D9CB9" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="queued-card-mid" x="7" y="23" width="25" height="17" rx="4" fill="#111D34" stroke="#79AAFF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="selected-evidence-packet" x="10" y="34" width="33" height="22" rx="4" fill="#111D34" stroke="#63DEEC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="source-dot" cx="16" cy="41" r="2.3" fill="#63DEEC" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="cited-evidence" x1="21" y1="41" x2="36" y2="41" fill="none" stroke="#F4D477" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="action-line" x1="15" y1="48" x2="37" y2="48" fill="none" stroke="#E9EFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="risk-priority" cx="30" cy="16" r="3" fill="#F4D477" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="deadline-marker" cx="30" cy="30" r="3" fill="#EF9AC8" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="review-route" d="M43 45H49" fill="none" stroke="#8CDEB5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="review-decision" cx="54" cy="45" r="5" fill="#111D34" stroke="#8CDEB5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="decision-check" d="M51 45L53 47L57 42" fill="none" stroke="#8CDEB5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="hard-deny-route" d="M30 57V60H54V51" fill="none" stroke="#FF988D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="hard-deny-cap" x1="50" y1="53" x2="57" y2="53" fill="none" stroke="#FF988D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
