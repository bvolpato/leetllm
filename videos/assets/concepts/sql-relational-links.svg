<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">SQL relational links</title>
  <desc id="desc">Foreign keys connect rows across tables so a join can recover each chunk’s source.</desc>
  <rect data-part="chunk-table" x="5" y="10" width="23" height="43" rx="3" fill="#111D34" stroke="#79AAFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="source-table" x="36" y="10" width="23" height="43" rx="3" fill="#111D34" stroke="#63DEEC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="chunk-table-rows" d="M8 19H25M8 29H25M8 39H25M8 49H25" fill="none" stroke="#8D9CB9" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="source-table-rows" d="M39 19H56M39 29H56M39 39H56M39 49H56" fill="none" stroke="#8D9CB9" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="foreign-key" cx="22" cy="29" r="2.7" fill="#F4D477" stroke="#E9EFFF" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="primary-key" cx="42" cy="29" r="2.7" fill="#8CDEB5" stroke="#E9EFFF" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="join-link" d="M25 29H39" fill="none" stroke="#EF9AC8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
