<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Bounded queue</title>
  <desc id="desc">A finite queue applies backpressure when arrivals exceed the rate that consumers can drain.</desc>
  <path data-part="queue-frame" d="M12 18H45V44H12Z" fill="none" stroke="#79AAFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="queue-slot-one" x="17" y="24" width="7" height="14" rx="2" fill="#111D34" stroke="#63DEEC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="queue-slot-two" x="26" y="24" width="7" height="14" rx="2" fill="#111D34" stroke="#63DEEC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="queue-slot-three" x="35" y="24" width="7" height="14" rx="2" fill="#111D34" stroke="#F4D477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="arrival-lane" d="M7 31H11" fill="none" stroke="#8D9CB9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="arrival-tip" d="M9 29L11 31L9 33" fill="none" stroke="#8D9CB9" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="capacity-wall" d="M47 16V47" fill="none" stroke="#FF988D" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="blocked-arrival" d="M50 31H55" fill="none" stroke="#FF988D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="blocked-mark" d="M54 28L57 31L54 34" fill="none" stroke="#FF988D" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="consumer-drain" d="M28 45V53H45" fill="none" stroke="#8CDEB5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="drain-arrow" d="M42 50L45 53L42 56" fill="none" stroke="#8CDEB5" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="consumer" cx="51" cy="53" r="4" fill="#111D34" stroke="#8CDEB5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
