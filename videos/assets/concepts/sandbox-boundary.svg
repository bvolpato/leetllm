<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Agent sandbox boundary</title>
  <desc id="desc">An operating-system-enforced boundary that limits an agent's filesystem, process, network, credentials, and runtime resources.</desc>
  <rect data-part="sandbox-wall" x="10" y="7" width="42" height="50" rx="7" fill="#111D34" stroke="#63DEEC" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="worker-process" x="19" y="23" width="23" height="19" rx="5" fill="#111D34" stroke="#79AAFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="worker-core" cx="30.5" cy="32" r="5" fill="#79AAFF" stroke="#E9EFFF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="allowed-path" x="16" y="12" width="13" height="7" rx="2" fill="#111D34" stroke="#8CDEB5" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="path-mark" x1="19" y1="16" x2="26" y2="16" fill="none" stroke="#8CDEB5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="bounded-compute" x="34" y="12" width="13" height="7" rx="2" fill="#111D34" stroke="#F4D477" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="compute-mark" x1="37" y1="16" x2="44" y2="16" fill="none" stroke="#F4D477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="allowed-network" d="M30 42V49H57" fill="none" stroke="#8CDEB5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="policy-proxy" cx="56" cy="49" r="4" fill="#F4D477" stroke="#E9EFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="blocked-credential" d="M10 48H4V56H16" fill="none" stroke="#FF988D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="deny-slash" x1="7" y1="47" x2="13" y2="55" fill="none" stroke="#FF988D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="blocked-host-link" d="M52 17H59V9" fill="none" stroke="#FF988D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="host-deny-slash" x1="55" y1="12" x2="61" y2="18" fill="none" stroke="#FF988D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
