<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Agent recovery state</title>
  <desc id="desc">A timed-out action is verified before a safe retry or operator handoff.</desc>
  <circle data-part="proposal-state" cx="10" cy="17" r="4" fill="#79AAFF" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="dispatch-state" cx="28" cy="17" r="4" fill="#63DEEC" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="dispatch-path" d="M14 17H24" fill="none" stroke="#8D9CB9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="timeout-state" cx="45" cy="17" r="4" fill="#F4D477" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="timeout-path" d="M32 17H41M45 22V33H31" fill="none" stroke="#8D9CB9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="verify-state" x="21" y="30" width="18" height="10" rx="3" fill="#111D34" stroke="#63DEEC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="verify-check" d="M26 35L29 38L35 32" fill="none" stroke="#8CDEB5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="safe-retry-loop" d="M21 35H12V26M12 26L9 30M12 26L15 30" fill="none" stroke="#79AAFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="operation-key" cx="51" cy="43" r="7" fill="#111D34" stroke="#F4D477" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="key-hole" cx="51" cy="43" r="2" fill="#F4D477" stroke="none"/>
  <path data-part="handoff-path" d="M39 35H56V49" fill="none" stroke="#EF9AC8" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
