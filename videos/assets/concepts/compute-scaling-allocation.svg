<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Compute-optimal training allocation</title>
  <desc id="desc">A shared compute budget is divided across model parameters, training data, and serving.</desc>
  <rect data-part="budget-total" x="7" y="12" width="50" height="10" rx="4" fill="#111D34" stroke="#E9EFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="budget-model" x="9" y="14" width="15" height="6" rx="2" fill="#63DEEC" stroke="none"/>
  <rect data-part="budget-data" x="25" y="14" width="17" height="6" rx="2" fill="#F4D477" stroke="none"/>
  <rect data-part="budget-serving" x="43" y="14" width="12" height="6" rx="2" fill="#EF9AC8" stroke="none"/>
  <path data-part="allocation-links" d="M16 24L16 31M33 24L33 31M49 24L49 31" fill="none" stroke="#8D9CB9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="parameter-block" x="9" y="33" width="14" height="19" rx="3" fill="#111D34" stroke="#63DEEC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
