  <circle data-part="parameter-mark-b" cx="19" cy="45" r="1.6" fill="#63DEEC" stroke="none"/>
  <rect data-part="training-data-block" x="25" y="33" width="16" height="19" rx="3" fill="#111D34" stroke="#F4D477" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="data-mark-a" d="M29 39L37 39" fill="none" stroke="#F4D477" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="data-mark-b" d="M29 45L37 45" fill="none" stroke="#F4D477" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="serving-block" x="43" y="33" width="12" height="19" rx="3" fill="#111D34" stroke="#EF9AC8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="serving-trace" d="M46 45L49 40L52 43" fill="none" stroke="#EF9AC8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
