<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Training step loop</title>
  <desc id="desc">A minibatch cycles through forward, loss, backward, and parameter update.</desc>
  <rect data-part="batch-node" x="4" y="25" width="12" height="14" rx="3" fill="#111D34" stroke="#79AAFF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="forward-node" x="22" y="12" width="13" height="14" rx="3" fill="#111D34" stroke="#63DEEC" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="loss-node" x="43" y="12" width="13" height="14" rx="3" fill="#111D34" stroke="#F4D477" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="backward-node" x="43" y="39" width="13" height="14" rx="3" fill="#111D34" stroke="#EF9AC8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="update-node" x="22" y="39" width="13" height="14" rx="3" fill="#111D34" stroke="#8CDEB5" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
