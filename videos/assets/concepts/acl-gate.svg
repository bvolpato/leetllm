<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Authorization gate</title>
  <desc id="desc">A principal's permitted route reaches a document while a denied route stops at a trusted gate.</desc>
  <circle data-part="principal-head" cx="10" cy="24" r="4.5" fill="#79AAFF" stroke="none" stroke-width="1"/>
  <path data-part="principal" d="M3 40C3 33 6 30 10 30S17 33 17 40" fill="none" stroke="#79AAFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="allowed-route" d="M18 23H29L37 15H45" fill="none" stroke="#8CDEB5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="denied-route" d="M18 43H29" fill="none" stroke="#FF988D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="gate" d="M31 31V51M36 31V51" fill="none" stroke="#E9EFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="gate-cap" d="M28 31H39" fill="none" stroke="#63DEEC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="document" d="M45 8H54L60 14V27H45Z" fill="#111D34" stroke="#8CDEB5" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <path data-part="document-lines" d="M49 17H56M49 22H56" fill="none" stroke="#8CDEB5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="deny-stop" d="M25 39L30 47M30 39L25 47" fill="none" stroke="#FF988D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>