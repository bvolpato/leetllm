<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Autoregressive generation loop</title>
  <desc id="desc">Prompt context feeds a token sampler, and each selected token returns to the growing sequence.</desc>
  <rect data-part="prompt-token-a" x="7" y="28" width="10" height="12" rx="3" fill="#111D34" stroke="#79AAFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="prompt-token-b" x="19" y="28" width="10" height="12" rx="3" fill="#111D34" stroke="#79AAFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="generated-token-a" x="35" y="28" width="9" height="12" rx="2" fill="#63DEEC" stroke="none"/>
  <rect data-part="generated-token-b" x="46" y="28" width="9" height="12" rx="2" fill="#F4D477" stroke="none"/>
  <circle data-part="sampler-core" cx="32" cy="16" r="5" fill="#111D34" stroke="#EF9AC8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="sample-path-shaft" d="M31 22L32.18887228600509 23.486090357506363" fill="none" stroke="#EF9AC8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
