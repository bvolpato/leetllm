  <line data-part="policy-mark" x1="35" y1="15" x2="39" y2="15" fill="none" stroke="#FF988D" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="quality-check" x="25" y="26" width="17" height="12" rx="3" fill="#111D34" stroke="#8CDEB5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
