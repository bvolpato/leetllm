  <rect data-part="active-compute-tile" x="17" y="21" width="10" height="10" rx="1.5" fill="#111D34" stroke="#F4D477" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="tile-value-a" cx="20" cy="24" r="1" fill="#F4D477" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="tile-value-b" cx="24" cy="28" r="1" fill="#F4D477" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
