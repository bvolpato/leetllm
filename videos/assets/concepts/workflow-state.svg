<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Workflow state machine</title>
  <desc id="desc">A workflow state machine permits only guarded transitions and records checkpoints for recovery.</desc>
  <circle data-part="state-ready" cx="12" cy="31" r="6" fill="#111D34" stroke="#63DEEC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="state-running" cx="32" cy="31" r="7" fill="#111D34" stroke="#F4D477" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="state-complete" cx="52" cy="31" r="6" fill="#111D34" stroke="#8CDEB5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="ready-transition" d="M18 28H25" fill="none" stroke="#8D9CB9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="ready-arrow" d="M23 26L25 28L23 30" fill="none" stroke="#8D9CB9" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="running-transition" d="M39 28H45" fill="none" stroke="#8D9CB9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="complete-arrow" d="M43 26L45 28L43 30" fill="none" stroke="#8D9CB9" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="guard-one" d="M21 21L25 24" fill="none" stroke="#EF9AC8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="guard-one-lock" cx="20" cy="20" r="2.2" fill="#111D34" stroke="#EF9AC8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="guard-two" d="M41 40L45 37" fill="none" stroke="#79AAFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="guard-two-checkpoint" cx="47" cy="38" r="2.1" fill="#111D34" stroke="#79AAFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="recovery-loop" d="M32 39C22 51 13 48 11 39" fill="none" stroke="#79AAFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="recovery-tip" d="M10 42L11 39L14 39" fill="none" stroke="#79AAFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="checkpoint-pin" d="M32 13V19" fill="none" stroke="#F4D477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="checkpoint-dot" cx="32" cy="11" r="2" fill="#F4D477" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
