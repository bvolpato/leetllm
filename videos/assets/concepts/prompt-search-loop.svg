<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Prompt search loop</title>
  <desc id="desc">Prompt candidates are scored on validation examples and then checked against a separate holdout.</desc>
  <rect data-part="prompt-candidate-one" x="4" y="8" width="18" height="12" rx="3" fill="#111D34" stroke="#79AAFF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="prompt-candidate-two" x="4" y="26" width="18" height="12" rx="3" fill="#111D34" stroke="#63DEEC" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="prompt-candidate-three" x="4" y="44" width="18" height="12" rx="3" fill="#111D34" stroke="#8D9CB9" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="candidate-scores" d="M23 14H31M23 32H31M23 50H31" fill="none" stroke="#8D9CB9" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="validation-score-bars" d="M33 19V14H38V19M41 19V10H46V19M49 19V6H54V19" fill="none" stroke="#F4D477" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="selected-prompt" d="M46 24V33H55" fill="none" stroke="#8CDEB5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="holdout-gate" x="48" y="37" width="12" height="17" rx="3" fill="#111D34" stroke="#8CDEB5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="holdout-check" d="M51 45L54 48L58 42" fill="none" stroke="#8CDEB5" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
