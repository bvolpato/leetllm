<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Safety policy gate</title>
  <desc id="desc">Input, action, and output checks protect different stages of a model interaction.</desc>
  <path data-part="policy-path" d="M5 32H59" fill="none" stroke="#8D9CB9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="input-gate" x="12" y="19" width="9" height="26" rx="3" fill="#111D34" stroke="#63DEEC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="input-check" d="M15 28L17 30L19 26" fill="none" stroke="#63DEEC" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="action-gate" x="28" y="19" width="9" height="26" rx="3" fill="#111D34" stroke="#F4D477" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="action-lock" d="M30 30H35M31 30V27C31 24 34 24 34 27V30" fill="none" stroke="#F4D477" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="output-gate" x="44" y="19" width="9" height="26" rx="3" fill="#111D34" stroke="#EF9AC8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="output-check" d="M46 32L48 34L51 29" fill="none" stroke="#EF9AC8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="safe-output" cx="59" cy="32" r="3" fill="#8CDEB5" stroke="none"/>
</svg>
