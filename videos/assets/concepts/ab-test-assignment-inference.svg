<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">A/B experiment assignment and inference</title>
  <desc id="desc">Two randomized arms carry separate outcomes beside a shared confidence interval.</desc>
  <path data-part="assign-stem" d="M9 32L19 32" fill="none" stroke="#E9EFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="assign-split" d="M19 25L26 32L19 39Z" fill="#F4D477" stroke="none"/>
  <path data-part="upper-arm" d="M26 32L31 18" fill="none" stroke="#63DEEC" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="lower-arm" d="M26 32L31 46" fill="none" stroke="#F4D477" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="control-arm" x="31" y="9" width="19" height="18" rx="5" fill="#111D34" stroke="#63DEEC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="treatment-arm" x="31" y="37" width="19" height="18" rx="5" fill="#111D34" stroke="#F4D477" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="control-observation-a" cx="37" cy="18" r="2" fill="#63DEEC" stroke="none"/>
  <circle data-part="control-observation-b" cx="43" cy="18" r="2" fill="#79AAFF" stroke="none"/>
  <circle data-part="treatment-observation-a" cx="37" cy="46" r="2" fill="#F4D477" stroke="none"/>
  <circle data-part="treatment-observation-b" cx="43" cy="46" r="2" fill="#EF9AC8" stroke="none"/>
  <path data-part="difference-estimate" d="M52 21L58 21" fill="none" stroke="#E9EFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="difference-low" d="M52 43L52 49" fill="none" stroke="#8D9CB9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="difference-high" d="M58 40L58 46" fill="none" stroke="#8D9CB9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="interval" d="M55 40L55 49" fill="none" stroke="#8CDEB5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
