<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Statistical power</title>
  <desc id="desc">Power is the probability that a test detects a specified effect under an assumed alternative and design.</desc>
  <path data-part="density-baseline" d="M8 49H56" fill="none" stroke="#8D9CB9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="null-distribution" d="M10 48C17 47 18 20 29 18C40 20 41 47 49 48" fill="none" stroke="#79AAFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="alternative-distribution" d="M17 48C24 47 26 27 38 26C49 27 49 47 56 48" fill="none" stroke="#63DEEC" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="critical-region" d="M45 39V49H55V39" fill="none" stroke="#F4D477" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="critical-cutoff" d="M45 34V51" fill="none" stroke="#F4D477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="effect-separation" d="M29 13H38" fill="none" stroke="#EF9AC8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="separation-left" d="M29 11V15" fill="none" stroke="#EF9AC8" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="separation-right" d="M38 11V15" fill="none" stroke="#EF9AC8" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="alpha-marker" cx="47" cy="44" r="1.7" fill="#FF988D" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="power-area-marker" cx="52" cy="44" r="1.7" fill="#8CDEB5" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
