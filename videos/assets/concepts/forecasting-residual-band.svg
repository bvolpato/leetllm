<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Forecast residual band</title>
  <desc id="desc">Observed values meet a forecast with an uncertainty band, while the latest error is measured as a residual.</desc>
  <path data-part="axes" d="M8 8V55H59" fill="none" stroke="#8D9CB9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="uncertainty-band" d="M34 21L42 14L50 12L57 10L57 35L50 34L42 31L34 28Z" fill="#111D34" stroke="#79AAFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="observed-series" d="M10 39L17 33L24 36L31 27L38 31" fill="none" stroke="#63DEEC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="forecast-center" d="M34 25L42 23L50 22L57 22" fill="none" stroke="#F4D477" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="latest-observation" cx="38" cy="31" r="3.5" fill="#EF9AC8" stroke="none" stroke-width="1"/>
  <line data-part="residual" x1="38" y1="27" x2="38" y2="31" stroke="#FF988D" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>