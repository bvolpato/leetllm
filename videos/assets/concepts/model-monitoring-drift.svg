<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Model monitoring drift</title>
  <desc id="desc">Two feature distributions shift across a stable reference, and a separate alert marks a monitored change for investigation.</desc>
  <path data-part="baseline" d="M7 50H56" fill="none" stroke="#8D9CB9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="reference-density" d="M10 49C15 47 16 25 22 20C28 15 32 38 37 49" fill="none" stroke="#63DEEC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="current-density" d="M24 49C30 47 33 32 39 27C46 21 50 39 55 49" fill="none" stroke="#EF9AC8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="reference-center" x1="23" y1="17" x2="23" y2="53" stroke="#63DEEC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <line data-part="current-center" x1="41" y1="24" x2="41" y2="53" stroke="#EF9AC8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle data-part="drift-alert" cx="51" cy="12" r="7" fill="#FF988D" stroke="none" stroke-width="1"/>
  <line data-part="alert-stem" x1="51" y1="8.5" x2="51" y2="12.5" stroke="#0A1020" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle data-part="alert-point" cx="51" cy="15.5" r="0.9" fill="#0A1020" stroke="none" stroke-width="1"/>
</svg>