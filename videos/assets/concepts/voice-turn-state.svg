<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Voice turn and playback state</title>
  <desc id="desc">The live voice-session state that distinguishes detected speech, committed turns, generated audio, confirmed playback, and interruption.</desc>
