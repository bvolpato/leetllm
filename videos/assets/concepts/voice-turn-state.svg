  <line data-part="clause-mark" x1="43" y1="19" x2="48" y2="19" fill="none" stroke="#79AAFF" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="tts-chunk" d="M50 19H55" fill="none" stroke="#EF9AC8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
