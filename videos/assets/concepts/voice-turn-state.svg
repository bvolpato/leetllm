  <rect data-part="vad" x="16" y="12" width="10" height="14" rx="3" fill="#111D34" stroke="#63DEEC" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="vad-pulse" d="M19 19L21 16L23 19" fill="none" stroke="#63DEEC" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="commit-route" d="M26 19H31" fill="none" stroke="#8CDEB5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
