<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Secret broker</title>
  <desc id="desc">A host-controlled service that performs a narrowly scoped authenticated request for an untrusted worker without exposing its credential.</desc>
  <rect data-part="worker-sandbox" x="4" y="18" width="17" height="29" rx="4" fill="#111D34" stroke="#111D34" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="worker" cx="12.5" cy="28" r="3.5" fill="#79AAFF" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="worker-request" x1="8" y1="37" x2="17" y2="37" fill="none" stroke="#63DEEC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="scoped-request" d="M21 32H28" fill="none" stroke="#63DEEC" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="broker" x="28" y="12" width="17" height="40" rx="5" fill="#111D34" stroke="#F4D477" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="broker-core" cx="36.5" cy="22" r="4" fill="#F4D477" stroke="#E9EFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="broker-check" d="M34 22L36 24L40 19" fill="none" stroke="#111D34" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="short-lived-credential" d="M37 27V34" fill="none" stroke="#EF9AC8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="credential-token" cx="37" cy="36" r="2.4" fill="#EF9AC8" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="sanitized-upstream" d="M45 24H54" fill="none" stroke="#8CDEB5" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="upstream-service" x="53" y="16" width="8" height="17" rx="3" fill="#111D34" stroke="#79AAFF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="safe-json-return" d="M53 39H46V44H21" fill="none" stroke="#8CDEB5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="safe-response" x="7" y="48" width="20" height="9" rx="3" fill="#111D34" stroke="#8CDEB5" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="safe-field" x1="11" y1="52" x2="22" y2="52" fill="none" stroke="#8CDEB5" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="blocked-direct-path" x1="21" y1="15" x2="54" y2="14" fill="none" stroke="#FF988D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="direct-denial-slash" x1="36" y1="8" x2="43" y2="20" fill="none" stroke="#FF988D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
