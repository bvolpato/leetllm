<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Regression residual</title>
  <desc id="desc">A residual is the vertical gap between an observed value and its fitted prediction at the same input.</desc>
  <line data-part="x-axis" x1="9" y1="53" x2="56" y2="53" stroke="#8D9CB9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="y-axis" x1="11" y1="55" x2="11" y2="11" stroke="#8D9CB9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="fit-line" x1="13" y1="45" x2="54" y2="18" stroke="#79AAFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="observation-one" cx="20" cy="41" r="2.5" fill="#E9EFFF" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="observation-two" cx="32" cy="25" r="2.5" fill="#F4D477" stroke="#F4D477" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="observation-three" cx="45" cy="23" r="2.5" fill="#E9EFFF" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="residual-gap" x1="32" y1="25" x2="32" y2="32" stroke="#FF988D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="prediction" cx="32" cy="32" r="2" fill="#63DEEC" stroke="#63DEEC" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
