<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">IVF centroid probing</title>
  <desc id="desc">An approximate search that assigns vectors to centroid lists and scans only a chosen number of nearest lists.</desc>
  <polygon data-part="left-cell" points="5,8 30,8 25,29 5,35" fill="#111D34" stroke="#8D9CB9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon data-part="right-cell" points="30,8 59,8 59,31 40,29 25,29" fill="#111D34" stroke="#8D9CB9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon data-part="lower-left-cell" points="5,35 25,29 34,56 5,56" fill="#111D34" stroke="#8D9CB9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon data-part="lower-right-cell" points="25,29 40,29 59,31 59,56 34,56" fill="#111D34" stroke="#8D9CB9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="centroid-probed-1" cx="18" cy="20" r="3.4" fill="#63DEEC" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="centroid-probed-2" cx="47" cy="20" r="3.4" fill="#79AAFF" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="centroid-idle-1" cx="16" cy="45" r="3" fill="#8D9CB9" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="centroid-idle-2" cx="47" cy="44" r="3" fill="#8D9CB9" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="query" cx="34" cy="35" r="3.7" fill="#F4D477" stroke="#E9EFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="query-probe-left" x1="32" y1="34" x2="20" y2="22" fill="none" stroke="#63DEEC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="query-probe-right" x1="36" y1="33" x2="45" y2="22" fill="none" stroke="#79AAFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="posting-dot-1" cx="12" cy="27" r="1.4" fill="#63DEEC" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="posting-dot-2" cx="26" cy="14" r="1.4" fill="#63DEEC" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="posting-dot-3" cx="53" cy="26" r="1.4" fill="#79AAFF" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="unprobed-relevant" cx="48" cy="49" r="2.5" fill="#8CDEB5" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
