<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">KV cache handoff</title>
  <desc id="desc">A key-value cache moves from a prompt-processing worker to a token-generation worker.</desc>
  <rect data-part="source-worker" x="4" y="13" width="18" height="38" rx="4" fill="#111D34" stroke="#79AAFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="source-memory" d="M9 20H17M9 26H17M9 32H17M9 38H17" fill="none" stroke="#79AAFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="transfer-route" d="M24 32H40" fill="none" stroke="#F4D477" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="transfer-arrow" d="M35 27L41 32L35 37" fill="none" stroke="#F4D477" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="cache-block" x="27" y="25" width="9" height="14" rx="2" fill="#EF9AC8" stroke="#0A1020" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="destination-worker" x="43" y="13" width="18" height="38" rx="4" fill="#111D34" stroke="#63DEEC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="destination-memory" d="M48 20H56M48 26H56M48 32H56M48 38H56" fill="none" stroke="#63DEEC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="worker-base" d="M8 55H18M47 55H57" fill="none" stroke="#8D9CB9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>