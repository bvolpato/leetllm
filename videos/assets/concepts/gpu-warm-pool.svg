<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Warm GPU capacity</title>
  <desc id="desc">The staged path from scheduled hardware through model load and warmup to replicas that can safely receive traffic.</desc>
  <rect data-part="pending-gpu" x="5" y="13" width="15" height="19" rx="4" fill="#111D34" stroke="#8D9CB9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="gpu-chip-1" d="M9 18H16M9 22H16M9 26H13" fill="none" stroke="#8D9CB9" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="scheduled-load" d="M21 22H27" fill="none" stroke="#F4D477" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="loading-model" x="27" y="13" width="15" height="19" rx="4" fill="#111D34" stroke="#79AAFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="loading-lines" d="M31 19H38M31 24H38M31 28H35" fill="none" stroke="#79AAFF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="warm-ready" d="M43 22H48" fill="none" stroke="#8CDEB5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="ready-gpu" x="48" y="13" width="12" height="19" rx="4" fill="#111D34" stroke="#8CDEB5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="ready-lamp" cx="54" cy="18" r="2.2" fill="#8CDEB5" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="ready-chip" d="M51 24H57M51 28H55" fill="none" stroke="#8CDEB5" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="traffic-only-ready" d="M54 32V47H59" fill="none" stroke="#8CDEB5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="cold-start-clock" cx="20" cy="45" r="7" fill="#111D34" stroke="#F4D477" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="clock-hands" d="M20 41V45L23 47" fill="none" stroke="#F4D477" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="warm-pool-base" d="M6 55H58" fill="none" stroke="#8D9CB9" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
