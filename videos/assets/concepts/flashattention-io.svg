<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">FlashAttention tile dataflow</title>
  <desc id="desc">FlashAttention reuses query, key, and value tiles in fast memory to reduce high-bandwidth memory traffic.</desc>
  <rect data-part="global-memory" x="7" y="12" width="16" height="40" rx="3" fill="#111D34" stroke="#79AAFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="global-tile-one" x="11" y="18" width="8" height="6" rx="1" fill="#79AAFF" stroke="#79AAFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="global-tile-two" x="11" y="28" width="8" height="6" rx="1" fill="#63DEEC" stroke="#63DEEC" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="global-tile-three" x="11" y="38" width="8" height="6" rx="1" fill="#EF9AC8" stroke="#EF9AC8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="load-path" x1="24" y1="32" x2="32" y2="32" stroke="#F4D477" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon data-part="load-arrow" points="32,32 26,28 26,36" fill="#F4D477" stroke="#F4D477" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="on-chip" x="32" y="17" width="23" height="30" rx="4" fill="#111D34" stroke="#63DEEC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="query-tile" x="37" y="22" width="6" height="6" rx="1" fill="#79AAFF" stroke="#79AAFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="key-tile" x="45" y="22" width="6" height="6" rx="1" fill="#63DEEC" stroke="#63DEEC" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="value-tile" x="37" y="31" width="6" height="6" rx="1" fill="#EF9AC8" stroke="#EF9AC8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="output-tile" x="45" y="31" width="6" height="12" rx="1" fill="#8CDEB5" stroke="#8CDEB5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="reuse-loop" x1="43" y1="52" x2="43" y2="48" stroke="#F4D477" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
