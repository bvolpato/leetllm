<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Scaling frontier</title>
  <desc id="desc">A scaling frontier compares achievable model quality with compute and exposes diminishing returns.</desc>
  <line data-part="compute-axis" x1="9" y1="52" x2="56" y2="52" stroke="#8D9CB9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="quality-axis" x1="11" y1="54" x2="11" y2="10" stroke="#8D9CB9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline data-part="scaling-curve" points="13,47 20,38 28,30 36,24 44,20 52,18" fill="none" stroke="#79AAFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="frontier-knee" cx="36" cy="24" r="3.5" fill="#F4D477" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="knee-projection" x1="36" y1="24" x2="36" y2="52" stroke="#8D9CB9" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="quality-projection" x1="11" y1="24" x2="36" y2="24" stroke="#8D9CB9" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
