<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Traffic split</title>
  <desc id="desc">A weighted routing rule that sends eligible requests to different live destinations while preserving assignment identity.</desc>
  <path data-part="eligible-request" d="M6 32H21" fill="none" stroke="#63DEEC" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="upper-arm" d="M21 32Q28 32 31 18H49" fill="none" stroke="#79AAFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="lower-arm" d="M21 32Q28 32 31 46H49" fill="none" stroke="#EF9AC8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="sticky-session" cx="21" cy="32" r="4" fill="#F4D477" stroke="#E9EFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="version-a" x="49" y="11" width="11" height="13" rx="3" fill="#111D34" stroke="#79AAFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="version-a-mark" x1="52" y1="18" x2="57" y2="18" fill="none" stroke="#79AAFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="version-b" x="49" y="40" width="11" height="13" rx="3" fill="#111D34" stroke="#EF9AC8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="version-b-mark" x1="52" y1="47" x2="57" y2="47" fill="none" stroke="#EF9AC8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="weight-upper" cx="34" cy="16" r="2.4" fill="#79AAFF" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="weight-lower" cx="34" cy="48" r="2.4" fill="#EF9AC8" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
