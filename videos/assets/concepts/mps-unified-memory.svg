<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Apple unified memory</title>
  <desc id="desc">CPU and GPU share physical system memory while a device change can still create a distinct buffer.</desc>
  <rect data-part="unified-pool" x="8" y="30" width="48" height="25" rx="5" fill="#111D34" stroke="#63DEEC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="cpu-engine" x="10" y="8" width="18" height="14" rx="3" fill="#79AAFF" stroke="#E9EFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="gpu-engine" x="36" y="8" width="18" height="14" rx="3" fill="#F4D477" stroke="#E9EFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="cpu-memory-path" d="M19 22V30M45 22V30" fill="none" stroke="#8D9CB9" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="cpu-allocation" x="13" y="37" width="16" height="11" rx="2" fill="#79AAFF" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="mps-buffer" x="35" y="37" width="16" height="11" rx="2" fill="#8CDEB5" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="in-pool-copy" d="M29 42H34M32 39L35 42L32 45" fill="none" stroke="#EF9AC8" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
