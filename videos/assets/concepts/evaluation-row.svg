<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Evaluation row</title>
  <desc id="desc">A replayable graded case joins fixed input, observed output, grader evidence, and version pins in one record.</desc>
  <rect data-part="case-record" x="8" y="11" width="48" height="42" rx="6" fill="#111D34" stroke="#79AAFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="input-output-lane" d="M14 22H50" fill="none" stroke="#8D9CB9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="input-pin" d="M18 18V22" fill="none" stroke="#63DEEC" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="output-pin" d="M29 18V22" fill="none" stroke="#F4D477" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="grader-pin" d="M40 18V22" fill="none" stroke="#EF9AC8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="version-pin" d="M50 18V22" fill="none" stroke="#8CDEB5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="fixed-input" x="13" y="27" width="10" height="12" rx="2" fill="#111D34" stroke="#63DEEC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="input-glyph" d="M16 30H20M16 33H20M16 36H19" fill="none" stroke="#63DEEC" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="observed-transition" d="M24 33H28" fill="none" stroke="#8D9CB9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="transition-tip" d="M27 31L29 33L27 35" fill="none" stroke="#8D9CB9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="observed-output" x="30" y="27" width="10" height="12" rx="2" fill="#111D34" stroke="#F4D477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="output-glyph" d="M33 30H37M33 33H37M33 36H36" fill="none" stroke="#F4D477" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="grader-link" d="M41 33H44" fill="none" stroke="#8D9CB9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="grader-mark" cx="48" cy="33" r="4" fill="#111D34" stroke="#EF9AC8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="grader-check" d="M46 33L47.5 34.5L50 31.5" fill="none" stroke="#EF9AC8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="version-footer" d="M14 45H50" fill="none" stroke="#8D9CB9" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="version-model" cx="17" cy="45" r="1.6" fill="#8CDEB5" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="version-harness" cx="25" cy="45" r="1.6" fill="#79AAFF" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="version-fixture" cx="33" cy="45" r="1.6" fill="#F4D477" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="version-seal" cx="49" cy="45" r="2.1" fill="#8CDEB5" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
