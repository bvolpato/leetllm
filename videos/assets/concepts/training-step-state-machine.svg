<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Training step state machine</title>
  <desc id="desc">A training cycle resets gradients, computes loss, backpropagates, and updates parameters.</desc>
  <path data-part="cycle-top" d="M18 11C27 6 39 8 46 15" fill="none" stroke="#79AAFF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="cycle-top-tip" d="M46 15L41 14L44 11Z" fill="#79AAFF" stroke="none"/>
  <path data-part="cycle-right" d="M50 20C58 28 55 39 48 46" fill="none" stroke="#63DEEC" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="cycle-right-tip" d="M48 46L49 41L52 44Z" fill="#63DEEC" stroke="none"/>
  <path data-part="cycle-bottom" d="M43 51C33 58 22 55 16 49" fill="none" stroke="#8CDEB5" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="cycle-bottom-tip" d="M16 49L21 50L18 53Z" fill="#8CDEB5" stroke="none"/>
  <path data-part="cycle-left" d="M11 43C5 34 8 23 15 17" fill="none" stroke="#EF9AC8" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="cycle-left-tip" d="M15 17L14 22L11 19Z" fill="#EF9AC8" stroke="none"/>
  <circle data-part="reset-state" cx="16" cy="13" r="4" fill="#111D34" stroke="#79AAFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="forward-state" cx="49" cy="18" r="4" fill="#111D34" stroke="#63DEEC" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="loss-state" cx="52" cy="49" r="4" fill="#111D34" stroke="#F4D477" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="backward-state" cx="13" cy="48" r="4" fill="#111D34" stroke="#EF9AC8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="gradient-state" cx="32" cy="32" r="5" fill="#F4D477" stroke="#E9EFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
