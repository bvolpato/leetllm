<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Release gate</title>
  <desc id="desc">A predeclared set of quality, safety, latency, and rollback checks controls promotion to release.</desc>
  <path data-part="gate-frame" d="M14 8V56M50 8V56M12 12H52" fill="none" stroke="#79AAFF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="promotion-path" d="M7 32H56" fill="none" stroke="#8D9CB9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="promotion-arrow" d="M52 28L56 32L52 36" fill="none" stroke="#8D9CB9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="quality-check" cx="24" cy="22" r="3.1" fill="#111D34" stroke="#8CDEB5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="quality-tick" d="M22 22L23.5 23.5L26 20.5" fill="none" stroke="#8CDEB5" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="safety-check" cx="34" cy="22" r="3.1" fill="#111D34" stroke="#63DEEC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="safety-tick" d="M32 22L33.5 23.5L36 20.5" fill="none" stroke="#63DEEC" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="latency-check" cx="24" cy="42" r="3.1" fill="#111D34" stroke="#F4D477" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="latency-tick" d="M22 42L23.5 43.5L26 40.5" fill="none" stroke="#F4D477" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="rollback-check" cx="34" cy="42" r="3.1" fill="#111D34" stroke="#EF9AC8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="rollback-tick" d="M32 42L33.5 43.5L36 40.5" fill="none" stroke="#EF9AC8" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="owner-path" d="M14 53H10L7 50" fill="none" stroke="#8D9CB9" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="gate-owner" cx="7" cy="48" r="2" fill="#8D9CB9" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
