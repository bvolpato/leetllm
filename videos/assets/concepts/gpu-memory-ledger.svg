<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">GPU memory ledger</title>
  <desc id="desc">Memory accounting tracks weights, runtime state, cache, workspace, and reserve against device capacity.</desc>
  <rect data-part="device-capacity" x="8" y="10" width="30" height="44" rx="5" fill="#111D34" stroke="#79AAFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="weights-allocation" x="13" y="16" width="20" height="8" rx="2" fill="#111D34" stroke="#63DEEC" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="runtime-allocation" x="13" y="26" width="13" height="8" rx="2" fill="#111D34" stroke="#F4D477" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="cache-allocation" x="13" y="36" width="17" height="8" rx="2" fill="#111D34" stroke="#EF9AC8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="workspace-allocation" x="13" y="46" width="9" height="4" rx="1.5" fill="#111D34" stroke="#8CDEB5" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="weights-glyph" d="M16 20H30" fill="none" stroke="#63DEEC" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="runtime-glyph" d="M16 30H22" fill="none" stroke="#F4D477" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="cache-glyph" d="M16 40H27" fill="none" stroke="#EF9AC8" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="capacity-fill-level" d="M11 13H35" fill="none" stroke="#E9EFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="reserve-connector" d="M38 50H45V43" fill="none" stroke="#8D9CB9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="safety-reserve" x="43" y="35" width="12" height="15" rx="3" fill="#111D34" stroke="#8CDEB5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="reserve-mark" d="M46 42H52M46 45H50" fill="none" stroke="#8CDEB5" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="device-ports" d="M15 57V60M20 57V60M26 57V60M31 57V60" fill="none" stroke="#79AAFF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
