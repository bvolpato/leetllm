<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Differential privacy adjacency</title>
  <desc id="desc">A visual comparison of datasets that differ by one stated protected unit and the bounded output distributions a randomized mechanism should produce.</desc>
  <rect data-part="dataset-a" x="5" y="14" width="21" height="34" rx="4" fill="#111D34" stroke="#E9EFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="dataset-b" x="38" y="14" width="21" height="34" rx="4" fill="#111D34" stroke="#E9EFFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="unit-a" cx="11" cy="22" r="3" fill="#63DEEC" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="unit-b" cx="19" cy="22" r="3" fill="#79AAFF" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="shared-a" cx="11" cy="32" r="2.5" fill="#8D9CB9" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="shared-b" cx="19" cy="32" r="2.5" fill="#8D9CB9" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="protected-added-unit" cx="45" cy="22" r="3.5" fill="#EF9AC8" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="shared-c" cx="45" cy="32" r="2.5" fill="#8D9CB9" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="shared-d" cx="53" cy="32" r="2.5" fill="#8D9CB9" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="same-randomized-mechanism" d="M26 30H31M33 30H38" fill="none" stroke="#F4D477" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="mechanism" cx="32" cy="30" r="4" fill="#F4D477" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="output-distribution-a" d="M7 57Q12 50 17 57T27 57" fill="none" stroke="#63DEEC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="output-distribution-b" d="M37 57Q42 50 47 57T57 57" fill="none" stroke="#79AAFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="epsilon-label" cx="32" cy="50" r="2.1" fill="#F4D477" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="delta-label" x1="32" y1="54" x2="32" y2="58" fill="none" stroke="#EF9AC8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
