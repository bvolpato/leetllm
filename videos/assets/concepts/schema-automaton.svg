<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Schema automaton</title>
  <desc id="desc">A schema automaton tracks valid output states and blocks tokens that cannot lead to a valid structure.</desc>
  <circle data-part="state-start" cx="10" cy="32" r="5" fill="#111D34" stroke="#79AAFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="state-open" cx="27" cy="18" r="5" fill="#111D34" stroke="#63DEEC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="state-value" cx="43" cy="32" r="5" fill="#111D34" stroke="#F4D477" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="state-accept" cx="55" cy="49" r="5" fill="#111D34" stroke="#8CDEB5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="state-reject" cx="27" cy="49" r="5" fill="#111D34" stroke="#FF988D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="transition-open" x1="14" y1="29" x2="23" y2="21" stroke="#79AAFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon data-part="open-arrow" points="23,21 17,21 20,26" fill="#79AAFF" stroke="#79AAFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="transition-value" x1="32" y1="21" x2="39" y2="29" stroke="#63DEEC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon data-part="value-arrow" points="39,29 33,27 37,24" fill="#63DEEC" stroke="#63DEEC" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="transition-close" x1="46" y1="36" x2="52" y2="44" stroke="#8CDEB5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon data-part="close-arrow" points="52,44 46,41 50,38" fill="#8CDEB5" stroke="#8CDEB5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="invalid-transition" x1="27" y1="24" x2="27" y2="43" stroke="#FF988D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon data-part="invalid-arrow" points="27,43 24,37 30,37" fill="#FF988D" stroke="#FF988D" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
