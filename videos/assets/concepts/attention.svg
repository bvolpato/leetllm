  <path data-part="strong-link" d="M16 32L46 32" fill="none" stroke="#F4D477" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="weak-link-two" d="M16 50L47 35" fill="none" stroke="#8D9CB9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
