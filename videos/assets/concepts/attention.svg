  <circle data-part="context-two" cx="13" cy="32" r="6" fill="#F4D477" stroke="#E9EFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="context-three" cx="13" cy="50" r="6" fill="#111D34" stroke="#8D9CB9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
