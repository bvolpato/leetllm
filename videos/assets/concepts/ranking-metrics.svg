<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Ranking metrics</title>
  <desc id="desc">A ranked result list distinguishes relevant hits by position, reciprocal rank, and cumulative precision.</desc>
  <rect data-part="ranked-list" x="11" y="9" width="43" height="46" rx="5" fill="#111D34" stroke="#79AAFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="rank-one" x="17" y="15" width="31" height="6" rx="2" fill="#111D34" stroke="#63DEEC" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="rank-one-hit" cx="21" cy="18" r="1.6" fill="#63DEEC" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="rank-two" x="17" y="24" width="31" height="6" rx="2" fill="#111D34" stroke="#8D9CB9" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="rank-two-miss" cx="21" cy="27" r="1.6" fill="#8D9CB9" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="rank-three" x="17" y="33" width="31" height="6" rx="2" fill="#111D34" stroke="#F4D477" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="rank-three-hit" cx="21" cy="36" r="1.6" fill="#F4D477" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="rank-four" x="17" y="42" width="31" height="6" rx="2" fill="#111D34" stroke="#8D9CB9" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="rank-four-miss" cx="21" cy="45" r="1.6" fill="#8D9CB9" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="rank-order-rail" d="M13 17V45" fill="none" stroke="#8D9CB9" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="rank-one-marker" d="M13 18H15" fill="none" stroke="#63DEEC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="rank-three-marker" d="M13 36H15" fill="none" stroke="#F4D477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="cutoff-bracket" d="M51 23V39M49 23H53M49 39H53" fill="none" stroke="#EF9AC8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
