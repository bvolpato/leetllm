<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Idempotency fence</title>
  <desc id="desc">Repeated attempts sharing one stable key produce one effect, while a stale lease cannot write.</desc>
  <path data-part="attempt-lanes" d="M7 17H18M7 31H18M7 45H18" fill="none" stroke="#8D9CB9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="attempt-one" cx="9" cy="17" r="2.1" fill="#63DEEC" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="attempt-two" cx="9" cy="31" r="2.1" fill="#63DEEC" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="attempt-three" cx="9" cy="45" r="2.1" fill="#63DEEC" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="shared-key-brace" d="M20 15H23V47H20" fill="none" stroke="#F4D477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="idempotency-key" x="25" y="24" width="13" height="14" rx="3" fill="#111D34" stroke="#F4D477" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="stable-key-glyph" d="M29 28H34M29 31H34M29 34H32" fill="none" stroke="#F4D477" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="atomic-fence" d="M41 13V51" fill="none" stroke="#79AAFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="allowed-write" d="M38 31H46" fill="none" stroke="#8CDEB5" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="stale-write-stop" d="M38 45H43" fill="none" stroke="#FF988D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="stale-denied" d="M42 42L47 47M47 42L42 47" fill="none" stroke="#FF988D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="single-side-effect" x="49" y="24" width="9" height="14" rx="3" fill="#111D34" stroke="#8CDEB5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="one-effect-mark" d="M51 31L53 33L56 28" fill="none" stroke="#8CDEB5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
