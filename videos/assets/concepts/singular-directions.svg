<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Singular directions</title>
  <desc id="desc">Orthogonal directions show which input variations survive a linear transformation most strongly.</desc>
  <ellipse data-part="input-cloud" cx="21" cy="34" rx="10" ry="10" fill="#111D34" stroke="#8D9CB9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon data-part="output-cloud" points="31,18 53,25 49,43 27,36" fill="#111D34" stroke="#79AAFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="major-direction" x1="12" y1="50" x2="55" y2="14" stroke="#F4D477" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="minor-direction" x1="23" y1="15" x2="43" y2="55" stroke="#63DEEC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="axis-origin" cx="33" cy="34" r="2.5" fill="#E9EFFF" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="input-sample" cx="18" cy="31" r="1.7" fill="#8D9CB9" stroke="#8D9CB9" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="output-sample" cx="47" cy="28" r="1.7" fill="#63DEEC" stroke="#63DEEC" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
