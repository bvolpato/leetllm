<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Speculative draft and verify</title>
  <desc id="desc">A draft model proposes several tokens that a larger model verifies in one parallel pass.</desc>
  <rect data-part="draft-one" x="7" y="17" width="10" height="10" rx="3" fill="#111D34" stroke="#79AAFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="draft-two" x="19" y="17" width="10" height="10" rx="3" fill="#111D34" stroke="#79AAFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="draft-three" x="31" y="17" width="10" height="10" rx="3" fill="#111D34" stroke="#79AAFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="verify-one" x="14" y="37" width="10" height="10" rx="3" fill="#111D34" stroke="#8CDEB5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="verify-two" x="26" y="37" width="10" height="10" rx="3" fill="#111D34" stroke="#8CDEB5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="verify-reject" x="38" y="37" width="10" height="10" rx="3" fill="#111D34" stroke="#FF988D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="draft-route" x1="12" y1="30" x2="20" y2="35" stroke="#63DEEC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="verify-route" x1="24" y1="30" x2="31" y2="35" stroke="#63DEEC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="reject-route" x1="36" y1="30" x2="43" y2="35" stroke="#FF988D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="accepted-output" x="20" y="53" width="11" height="5" rx="2" fill="#8CDEB5" stroke="#8CDEB5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="replacement-output" x="39" y="53" width="11" height="5" rx="2" fill="#F4D477" stroke="#F4D477" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
