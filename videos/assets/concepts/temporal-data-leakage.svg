  <circle data-part="available-time" cx="23" cy="35" r="3" fill="#63DEEC" stroke="#E9EFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="prediction-time" cx="31" cy="35" r="3" fill="#F4D477" stroke="#E9EFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
