<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Autoscaling control loop</title>
  <desc id="desc">A controller that converts measured demand into desired replicas and admits only capacity that is scheduled, loaded, and healthy.</desc>
  <circle data-part="demand-gauge" cx="14" cy="17" r="7" fill="#111D34" stroke="#63DEEC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="gauge-needle" d="M14 17L18 13" fill="none" stroke="#63DEEC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="controller" x="27" y="9" width="13" height="17" rx="4" fill="#111D34" stroke="#F4D477" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="controller-core" cx="33.5" cy="17.5" r="2.3" fill="#F4D477" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="measure-to-control" d="M21 17H27" fill="none" stroke="#63DEEC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="control-to-replicas" d="M40 17H48" fill="none" stroke="#8CDEB5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="replica-one" x="48" y="9" width="8" height="11" rx="2" fill="#111D34" stroke="#79AAFF" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="replica-two" x="48" y="23" width="8" height="11" rx="2" fill="#111D34" stroke="#79AAFF" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="provision-branch" d="M33 26V39H43" fill="none" stroke="#8D9CB9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="pending-node" cx="46" cy="39" r="3.2" fill="#111D34" stroke="#8D9CB9" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="ready-traffic" d="M52 34V47H59" fill="none" stroke="#8CDEB5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="healthy-ready" cx="52" cy="47" r="3.2" fill="#8CDEB5" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="control-loop-back" x1="14" y1="24" x2="14" y2="43" fill="none" stroke="#8D9CB9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="control-return" d="M14 43H27V26" fill="none" stroke="#8D9CB9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
