<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Request trace</title>
  <desc id="desc">A parent request span connected to retrieval, model, tool, safety, and response spans with timestamps and stable identities.</desc>
  <rect data-part="parent-span" x="6" y="8" width="52" height="9" rx="3" fill="#111D34" stroke="#63DEEC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="retrieval-span" x="14" y="23" width="19" height="8" rx="2" fill="#111D34" stroke="#79AAFF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="model-span" x="29" y="34" width="22" height="8" rx="2" fill="#111D34" stroke="#F4D477" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="tool-span" x="15" y="45" width="16" height="8" rx="2" fill="#111D34" stroke="#EF9AC8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="safety-span" x="39" y="45" width="15" height="8" rx="2" fill="#111D34" stroke="#8CDEB5" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="parent-child-links" d="M14 17V23M33 17V34M22 17V45M48 17V45" fill="none" stroke="#8D9CB9" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="span-start" cx="7" cy="27" r="2.2" fill="#63DEEC" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="span-start-model" cx="29" cy="38" r="2.2" fill="#F4D477" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="span-start-tool" cx="15" cy="49" r="2.2" fill="#EF9AC8" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="trace-id" x="7" y="56" width="27" height="5" rx="2" fill="#111D34" stroke="#8D9CB9" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="trace-id-mark" x1="11" y1="58" x2="29" y2="58" fill="none" stroke="#8D9CB9" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="source-version" cx="51" cy="58" r="2.4" fill="#8CDEB5" stroke="#E9EFFF" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/>
