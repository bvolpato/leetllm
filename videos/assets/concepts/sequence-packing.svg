<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Sequence packing</title>
  <desc id="desc">Packing short training sequences into one block reduces padding while keeping boundaries visible.</desc>
  <rect data-part="padded-a" x="8" y="12" width="9" height="9" rx="1" fill="#79AAFF" stroke="#79AAFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="padded-b" x="18" y="12" width="9" height="9" rx="1" fill="#79AAFF" stroke="#79AAFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="padding-a" x="28" y="12" width="23" height="9" rx="1" fill="#111D34" stroke="#8D9CB9" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="padded-c" x="8" y="25" width="9" height="9" rx="1" fill="#EF9AC8" stroke="#EF9AC8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="padding-b" x="18" y="25" width="33" height="9" rx="1" fill="#111D34" stroke="#8D9CB9" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="packed-a" x="8" y="43" width="9" height="9" rx="1" fill="#79AAFF" stroke="#79AAFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="packed-b" x="18" y="43" width="9" height="9" rx="1" fill="#79AAFF" stroke="#79AAFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="packed-c" x="29" y="43" width="9" height="9" rx="1" fill="#EF9AC8" stroke="#EF9AC8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="packed-d" x="39" y="43" width="12" height="9" rx="1" fill="#8CDEB5" stroke="#8CDEB5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="boundary-a" x1="28" y1="41" x2="28" y2="54" stroke="#F4D477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="boundary-b" x1="38" y1="41" x2="38" y2="54" stroke="#F4D477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
