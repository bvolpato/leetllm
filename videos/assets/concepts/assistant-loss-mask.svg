<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Assistant loss mask</title>
  <desc id="desc">Supervised fine-tuning can score assistant targets while keeping user prompts as conditioning context.</desc>
  <rect data-part="prompt-token-one" x="8" y="23" width="10" height="15" rx="2" fill="#111D34" stroke="#79AAFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="prompt-token-two" x="20" y="23" width="10" height="15" rx="2" fill="#111D34" stroke="#79AAFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="assistant-token-one" x="32" y="23" width="10" height="15" rx="2" fill="#111D34" stroke="#8CDEB5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="assistant-token-two" x="44" y="23" width="10" height="15" rx="2" fill="#111D34" stroke="#8CDEB5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="prompt-boundary" x1="31" y1="17" x2="31" y2="42" stroke="#F4D477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="loss-marker-one" x1="37" y1="43" x2="37" y2="48" stroke="#8CDEB5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="loss-marker-two" x1="49" y1="43" x2="49" y2="48" stroke="#8CDEB5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon data-part="loss-one" points="37,50 34,46 40,46" fill="#8CDEB5" stroke="#8CDEB5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon data-part="loss-two" points="49,50 46,46 52,46" fill="#8CDEB5" stroke="#8CDEB5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
