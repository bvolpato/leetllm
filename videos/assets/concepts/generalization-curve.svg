<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Generalization curve</title>
  <desc id="desc">Training error falls as a model gains capacity, while held-out error eventually rises.</desc>
  <line data-part="axis-1" x1="8" y1="8" x2="8" y2="55" fill="none" stroke="#8D9CB9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="axis-2" x1="8" y1="55" x2="57" y2="55" fill="none" stroke="#8D9CB9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="training-error" d="M11 18C23 31 37 42 55 49" fill="none" stroke="#79AAFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="heldout-error" d="M11 24C22 34 31 43 38 44C45 45 51 37 55 20" fill="none" stroke="#EF9AC8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="best-complexity" cx="38" cy="44" r="4" fill="#F4D477" stroke="#0A1020" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>