<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Retrieval pipeline</title>
  <desc id="desc">Candidate generation, access filtering, ranking, packing, and citation checks form separate retrieval stages.</desc>
  <rect data-part="lexical-source" x="7" y="10" width="13" height="12" rx="3" fill="#111D34" stroke="#63DEEC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="dense-source" x="7" y="42" width="13" height="12" rx="3" fill="#111D34" stroke="#79AAFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="lexical-candidates" d="M11 14H16M11 17H14" fill="none" stroke="#63DEEC" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="dense-candidates" d="M11 46H16M11 49H14" fill="none" stroke="#79AAFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
