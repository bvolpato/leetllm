  <path data-part="citation-return" d="M55 41V52H46" fill="none" stroke="#79AAFF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="evidence-anchor" cx="44" cy="52" r="2" fill="#79AAFF" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
