  <circle data-part="rejected-candidate" cx="31" cy="35" r="1.2" fill="#FF988D" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="ranking-stage-link" d="M35 32H39" fill="none" stroke="#8D9CB9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="ranking-stage" x="39" y="25" width="9" height="14" rx="3" fill="#111D34" stroke="#EF9AC8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
