<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Permission filter</title>
  <desc id="desc">Caller identity and query scope filter retrieved documents before any candidate reaches context packing.</desc>
  <circle data-part="caller-identity" cx="10" cy="18" r="4" fill="#111D34" stroke="#63DEEC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
