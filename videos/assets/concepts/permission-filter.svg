  <path data-part="identity-query" d="M14 18H21V31H27" fill="none" stroke="#63DEEC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="acl-enclosure" d="M26 10H43L48 15V45L43 50H26L21 45V15Z" fill="none" stroke="#F4D477" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="acl-check-lines" d="M29 20H39M29 27H39M29 34H36" fill="none" stroke="#F4D477" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="policy-match" cx="40" cy="20" r="2" fill="#8CDEB5" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
