<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Learning-rate schedule</title>
  <desc id="desc">Training progress maps to a changing step scale with warmup and a smooth decay.</desc>
  <path data-part="step-axis" d="M8 52L57 52" fill="none" stroke="#8D9CB9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="rate-axis" d="M9 53L9 10" fill="none" stroke="#8D9CB9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="warmup-curve" d="M12 46L23 20" fill="none" stroke="#F4D477" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="cosine-decay" d="M23 20C28 23 29 34 35 39C41 45 48 47 55 48" fill="none" stroke="#63DEEC" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="warmup-boundary" d="M23 16L23 52" fill="none" stroke="#8D9CB9" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="current-step" cx="37" cy="40" r="3" fill="#EF9AC8" stroke="#E9EFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="current-rate" d="M37 40L37 51" fill="none" stroke="#EF9AC8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
