<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Runtime buffer lifetime</title>
  <desc id="desc">A copy-stream event orders a consumer stream, and the buffer remains alive through consumption and completion.</desc>
  <path data-part="copy-stream" d="M8 15H56" fill="none" stroke="#79AAFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="compute-stream" d="M8 43H56" fill="none" stroke="#63DEEC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="copy-buffer" x="13" y="9" width="14" height="12" rx="2" fill="#111D34" stroke="#79AAFF" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="event-record" d="M29 15V43M26 40L29 43L32 40" fill="none" stroke="#F4D477" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="consumer-kernel" x="34" y="37" width="15" height="12" rx="3" fill="#111D34" stroke="#8CDEB5" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="ready-event" cx="29" cy="29" r="3.2" fill="#F4D477" stroke="#E9EFFF" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="buffer-live-interval" d="M13 54H50M13 54L17 51M13 54L17 57M50 54L46 51M50 54L46 57" fill="none" stroke="#EF9AC8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="completion-fence" d="M52 35V51" fill="none" stroke="#FF988D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
