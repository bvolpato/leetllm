<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Chat template and training data flow</title>
  <desc id="desc">Role-marked messages serialize into token pieces, with assistant targets carrying the training signal.</desc>
  <rect data-part="user-message" x="6" y="10" width="22" height="12" rx="4" fill="#111D34" stroke="#79AAFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="user-message-mark" d="M10 16L23 16" fill="none" stroke="#79AAFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="assistant-message" x="6" y="27" width="22" height="14" rx="4" fill="#111D34" stroke="#EF9AC8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="assistant-message-mark" d="M10 34L23 34" fill="none" stroke="#EF9AC8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="serialization-shaft" d="M29 32L30.5 32" fill="none" stroke="#8D9CB9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="serialization-head" d="M35 32L30.5 34.8L30.5 29.2Z" fill="#8D9CB9" stroke="none"/>
  <rect data-part="role-token" x="37" y="13" width="7" height="9" rx="2" fill="#79AAFF" stroke="none"/>
  <rect data-part="boundary-token" x="46" y="13" width="6" height="9" rx="1.6" fill="#111D34" stroke="#E9EFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="prompt-piece" x="37" y="27" width="7" height="9" rx="2" fill="#111D34" stroke="#79AAFF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="target-piece-a" x="46" y="27" width="6" height="9" rx="2" fill="#F4D477" stroke="none"/>
  <rect data-part="target-piece-b" x="54" y="27" width="6" height="9" rx="2" fill="#F4D477" stroke="none"/>
  <path data-part="loss-mask-span" d="M45 40L60 40" fill="none" stroke="#8CDEB5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="loss-mask-dot-a" cx="47" cy="46" r="1.5" fill="#8CDEB5" stroke="none"/>
  <circle data-part="loss-mask-dot-b" cx="56" cy="46" r="1.5" fill="#8CDEB5" stroke="none"/>
</svg>
