  <circle data-part="check-b" cx="33" cy="32" r="4" fill="#111D34" stroke="#79AAFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="check-c" cx="33" cy="49" r="4" fill="#111D34" stroke="#79AAFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
