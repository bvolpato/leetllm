<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Circuit breaker</title>
  <desc id="desc">A dependency guard that admits calls while healthy, fails fast while open, and allows a limited recovery probe.</desc>
  <circle data-part="closed-state" cx="16" cy="32" r="8" fill="#111D34" stroke="#8CDEB5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="closed-indicator" cx="16" cy="32" r="3" fill="#8CDEB5" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="open-state" cx="47" cy="15" r="8" fill="#111D34" stroke="#FF988D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="open-indicator" cx="47" cy="15" r="3" fill="#FF988D" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="half-open-state" cx="47" cy="49" r="8" fill="#111D34" stroke="#F4D477" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="probe-indicator" cx="47" cy="49" r="3" fill="#F4D477" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="healthy-transition" d="M23 28L39 19" fill="none" stroke="#8CDEB5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="failure-transition" d="M43 23V40" fill="none" stroke="#FF988D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="recovery-transition" d="M39 46L23 36" fill="none" stroke="#F4D477" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="single-probe" d="M55 49H60V39" fill="none" stroke="#F4D477" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="probe-tip" cx="60" cy="38" r="1.7" fill="#F4D477" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="failure-counter" cx="30" cy="14" r="3" fill="#F4D477" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="counter-tick" x1="29" y1="14" x2="31" y2="14" fill="none" stroke="#111D34" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
