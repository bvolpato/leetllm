<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Causal graph patterns</title>
  <desc id="desc">Three directed motifs show a chain, a shared cause, and two causes meeting at an outcome.</desc>
  <path data-part="chain-edge-a" d="M8 13L19 13" fill="none" stroke="#79AAFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="chain-arrow-a" d="M18.5 13L15.3 10.8L15.3 15.2Z" fill="#79AAFF" stroke="none"/>
  <path data-part="chain-edge-b" d="M22 13L33 13" fill="none" stroke="#79AAFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="chain-arrow-b" d="M32.5 13L29.3 10.8L29.3 15.2Z" fill="#79AAFF" stroke="none"/>
  <circle data-part="chain-source" cx="7" cy="13" r="3" fill="#63DEEC" stroke="#E9EFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="chain-middle" cx="21" cy="13" r="3" fill="#111D34" stroke="#E9EFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="chain-outcome" cx="35" cy="13" r="3" fill="#F4D477" stroke="#E9EFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="fork-edge-a" d="M21 31L10 31" fill="none" stroke="#EF9AC8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
