  <path data-part="collider-arrow-b" d="M24.6 50L27.8 47.8L27.8 52.2Z" fill="#8CDEB5" stroke="none"/>
  <circle data-part="collider-left" cx="8" cy="50" r="3" fill="#111D34" stroke="#E9EFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
