  <path data-part="fork-arrow-b" d="M31 31L27.8 28.8L27.8 33.2Z" fill="#EF9AC8" stroke="none"/>
  <circle data-part="fork-cause" cx="21" cy="31" r="3.2" fill="#F4D477" stroke="#E9EFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="fork-effect-left" cx="8" cy="31" r="3" fill="#111D34" stroke="#E9EFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="fork-effect-right" cx="34" cy="31" r="3" fill="#111D34" stroke="#E9EFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="collider-edge-a" d="M9 50L21 50" fill="none" stroke="#8CDEB5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
