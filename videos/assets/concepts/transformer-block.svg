<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Transformer block</title>
  <desc id="desc">A transformer block combines attention and a feed-forward layer with residual paths.</desc>
  <rect data-part="block-outline" x="20" y="9" width="27" height="46" rx="4" fill="#111D34" stroke="#8D9CB9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="attention-sublayer" x="24" y="17" width="19" height="10" rx="2" fill="#79AAFF" stroke="#79AAFF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="feedforward-sublayer" x="24" y="35" width="19" height="10" rx="2" fill="#EF9AC8" stroke="#EF9AC8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="token-input" x1="33.5" y1="57" x2="33.5" y2="55" stroke="#63DEEC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon data-part="input-arrow" points="33.5,55 30.5,50 36.5,50" fill="#63DEEC" stroke="#63DEEC" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="attention-flow" x1="33.5" y1="27" x2="33.5" y2="35" stroke="#63DEEC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="residual-route" d="M15 52 L15 13 Q15 10 18 10 L49 10" fill="none" stroke="#F4D477" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon data-part="residual-arrow" points="49,10 44,7 44,13" fill="#F4D477" stroke="#F4D477" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="output-flow" x1="33.5" y1="9" x2="33.5" y2="5" stroke="#63DEEC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
