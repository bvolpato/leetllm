<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Sigmoid threshold</title>
  <desc id="desc">A probability threshold converts a logistic model score into a class decision.</desc>
  <line data-part="probability-axis" x1="10" y1="52" x2="55" y2="52" stroke="#8D9CB9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="score-axis" x1="12" y1="54" x2="12" y2="10" stroke="#8D9CB9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="threshold" x1="13" y1="32" x2="54" y2="32" stroke="#F4D477" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline data-part="sigmoid-curve" points="14,48 20,47 25,45 29,41 32,35 35,27 39,20 44,16 52,15" fill="none" stroke="#63DEEC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="threshold-crossing" cx="33" cy="32" r="3" fill="#EF9AC8" stroke="#E9EFFF" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
