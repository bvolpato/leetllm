<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Decision-tree split</title>
  <desc id="desc">A root test partitions examples, and one branch receives a further split into leaves.</desc>
  <path data-part="root-left-branch" d="M31 16L16 29" fill="none" stroke="#79AAFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="root-right-branch" d="M33 16L48 29" fill="none" stroke="#F4D477" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="left-leaf-branch" d="M16 36L9 48" fill="none" stroke="#8CDEB5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="left-leaf-branch-b" d="M16 36L23 48" fill="none" stroke="#EF9AC8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="right-leaf-branch" d="M48 36L48 49" fill="none" stroke="#F4D477" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="root-test" cx="32" cy="13" r="5" fill="#111D34" stroke="#E9EFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="left-subtest" cx="16" cy="32" r="4" fill="#111D34" stroke="#79AAFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="right-leaf" cx="48" cy="32" r="4" fill="#F4D477" stroke="#E9EFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="left-leaf-a" cx="9" cy="52" r="3.3" fill="#8CDEB5" stroke="none"/>
  <circle data-part="left-leaf-b" cx="23" cy="52" r="3.3" fill="#EF9AC8" stroke="none"/>
  <circle data-part="right-leaf-output" cx="48" cy="52" r="3.3" fill="#F4D477" stroke="none"/>
</svg>
