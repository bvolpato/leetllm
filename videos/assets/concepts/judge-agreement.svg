<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Judge agreement</title>
  <desc id="desc">Two evaluators apply a shared rubric to the same cases, exposing both matches and disagreements.</desc>
  <rect data-part="judge-left-card" x="7" y="12" width="21" height="39" rx="5" fill="#111D34" stroke="#63DEEC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="judge-right-card" x="36" y="12" width="21" height="39" rx="5" fill="#111D34" stroke="#EF9AC8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="shared-rubric-link" d="M28 17H36" fill="none" stroke="#F4D477" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="shared-rubric" cx="32" cy="17" r="2.1" fill="#F4D477" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="case-one-link" d="M29 27H35" fill="none" stroke="#8D9CB9" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="case-two-link" d="M29 38H35" fill="none" stroke="#8D9CB9" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="case-three-link" d="M29 48H35" fill="none" stroke="#8D9CB9" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="left-match-one" cx="13" cy="27" r="2.8" fill="#8CDEB5" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="right-match-one" cx="51" cy="27" r="2.8" fill="#8CDEB5" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="left-match-two" cx="13" cy="38" r="2.8" fill="#8CDEB5" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="right-disagree-two" cx="51" cy="38" r="2.8" fill="#F4D477" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="left-match-three" cx="13" cy="48" r="2.8" fill="#8CDEB5" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="right-match-three" cx="51" cy="48" r="2.8" fill="#8CDEB5" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="left-rubric-score" d="M19 27H24M19 38H23M19 48H24" fill="none" stroke="#63DEEC" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
