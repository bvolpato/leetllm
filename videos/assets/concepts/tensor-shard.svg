<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Tensor shard</title>
  <desc id="desc">Tensor parallelism partitions a weight matrix across devices and combines partial results at communication boundaries.</desc>
  <rect data-part="shard-left" x="8" y="14" width="14" height="34" rx="2" fill="#111D34" stroke="#79AAFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="shard-middle" x="25" y="14" width="14" height="34" rx="2" fill="#111D34" stroke="#63DEEC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="shard-right" x="42" y="14" width="14" height="34" rx="2" fill="#111D34" stroke="#EF9AC8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="left-row-a" x1="11" y1="24" x2="19" y2="24" stroke="#79AAFF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="left-row-b" x1="11" y1="34" x2="19" y2="34" stroke="#79AAFF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="mid-row-a" x1="28" y1="24" x2="36" y2="24" stroke="#63DEEC" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="mid-row-b" x1="28" y1="34" x2="36" y2="34" stroke="#63DEEC" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="right-row-a" x1="45" y1="24" x2="53" y2="24" stroke="#EF9AC8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="right-row-b" x1="45" y1="34" x2="53" y2="34" stroke="#EF9AC8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="collective-line" x1="12" y1="54" x2="52" y2="54" stroke="#F4D477" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="device-left" cx="15" cy="56" r="2" fill="#79AAFF" stroke="#79AAFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="device-middle" cx="32" cy="56" r="2" fill="#63DEEC" stroke="#63DEEC" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="device-right" cx="49" cy="56" r="2" fill="#EF9AC8" stroke="#EF9AC8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
