<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Streaming feature watermark</title>
  <desc id="desc">Events arrive on a timeline while a watermark marks progress and one late event waits outside the completed window.</desc>
  <path data-part="event-lane" d="M5 45H59" fill="none" stroke="#8D9CB9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="arrival-wave" d="M7 22C14 14 20 30 27 22S40 14 47 22" fill="none" stroke="#63DEEC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="on-time-event" cx="16" cy="45" r="4" fill="#63DEEC" stroke="none" stroke-width="1"/>
  <circle data-part="window-event" cx="29" cy="45" r="4" fill="#79AAFF" stroke="none" stroke-width="1"/>
  <line data-part="watermark" x1="37" y1="10" x2="37" y2="53" stroke="#F4D477" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path data-part="watermark-cap" d="M32 10H42" fill="none" stroke="#F4D477" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="late-event" cx="51" cy="45" r="4" fill="#FF988D" stroke="none" stroke-width="1"/>
  <path data-part="late-arrival" d="M51 37V30H43" fill="none" stroke="#FF988D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>