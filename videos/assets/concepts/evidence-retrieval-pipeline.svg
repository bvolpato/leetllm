  <path data-part="retrieval-flow" d="M17 32H23M33 32H38M48 32H53" fill="none" stroke="#8D9CB9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="authorization-gate" x="23" y="24" width="10" height="16" rx="3" fill="#111D34" stroke="#F4D477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
