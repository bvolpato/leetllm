<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Online softmax</title>
  <desc id="desc">Online softmax updates a running maximum and normalizer as attention scores arrive tile by tile.</desc>
  <rect data-part="score-tile-one" x="7" y="13" width="14" height="13" rx="2" fill="#111D34" stroke="#79AAFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="score-tile-two" x="7" y="30" width="14" height="13" rx="2" fill="#111D34" stroke="#63DEEC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="score-tile-three" x="7" y="47" width="14" height="9" rx="2" fill="#111D34" stroke="#EF9AC8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="tile-flow-one" x1="22" y1="20" x2="31" y2="20" stroke="#79AAFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="tile-flow-two" x1="22" y1="37" x2="31" y2="29" stroke="#63DEEC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="tile-flow-three" x1="22" y1="51" x2="31" y2="38" stroke="#EF9AC8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="running-state" x="31" y="14" width="23" height="31" rx="4" fill="#111D34" stroke="#F4D477" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="running-max" x1="36" y1="23" x2="49" y2="23" stroke="#F4D477" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="running-sum-a" x1="36" y1="31" x2="48" y2="31" stroke="#63DEEC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="running-sum-b" x1="36" y1="37" x2="44" y2="37" stroke="#63DEEC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="state-marker" cx="52" cy="49" r="3" fill="#8CDEB5" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
