<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Persistent memory tiers</title>
  <desc id="desc">Working context can write to and recall from several durable memory layers.</desc>
  <rect data-part="working-memory" x="9" y="7" width="46" height="12" rx="4" fill="#111D34" stroke="#63DEEC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="episodic-memory" x="9" y="25" width="21" height="14" rx="4" fill="#111D34" stroke="#79AAFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="semantic-memory" x="34" y="25" width="21" height="14" rx="4" fill="#111D34" stroke="#F4D477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="archive-memory" x="9" y="45" width="46" height="11" rx="4" fill="#111D34" stroke="#8CDEB5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="memory-write" d="M20 19V24M44 39V44" fill="none" stroke="#63DEEC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="memory-recall" d="M51 45V42M51 42L48 45M51 42L54 45" fill="none" stroke="#F4D477" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="provenance-dot-one" cx="18" cy="31" r="2" fill="#79AAFF" stroke="none"/>
  <circle data-part="provenance-dot-two" cx="43" cy="31" r="2" fill="#F4D477" stroke="none"/>
</svg>
