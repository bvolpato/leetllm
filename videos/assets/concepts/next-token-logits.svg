<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Next-token logits</title>
  <desc id="desc">Logits score candidate next tokens before softmax converts them into probabilities.</desc>
  <line data-part="logit-baseline" x1="9" y1="36" x2="55" y2="36" stroke="#8D9CB9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="negative-logit" x="15" y="36" width="6" height="10" rx="1" fill="#EF9AC8" stroke="#EF9AC8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="small-logit" x="25" y="28" width="6" height="8" rx="1" fill="#79AAFF" stroke="#79AAFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="largest-logit" x="35" y="14" width="7" height="22" rx="1" fill="#F4D477" stroke="#F4D477" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="other-logit" x="47" y="30" width="6" height="6" rx="1" fill="#63DEEC" stroke="#63DEEC" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="candidate-link" x1="13" y1="53" x2="51" y2="53" stroke="#8D9CB9" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon data-part="selected-candidate" points="38.5,51 34,46 43,46" fill="#F4D477" stroke="#F4D477" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
