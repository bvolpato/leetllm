<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Trust boundary</title>
  <desc id="desc">A trust-zone crossing needs an explicit enforcement point before data or authority reaches another component.</desc>
  <rect data-part="untrusted-zone" x="7" y="13" width="20" height="38" rx="5" fill="#111D34" stroke="#EF9AC8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="trusted-zone" x="37" y="13" width="20" height="38" rx="5" fill="#111D34" stroke="#8CDEB5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="untrusted-component" cx="17" cy="25" r="4" fill="#111D34" stroke="#EF9AC8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="untrusted-node" d="M14 25H20M17 22V28" fill="none" stroke="#EF9AC8" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="trusted-component" cx="47" cy="25" r="4" fill="#111D34" stroke="#63DEEC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="trusted-node" d="M45 25H49" fill="none" stroke="#63DEEC" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="boundary-barrier" d="M32 10V54" fill="none" stroke="#F4D477" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="crossing-attempt" d="M22 37H29" fill="none" stroke="#EF9AC8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="enforced-crossing" d="M35 37H42" fill="none" stroke="#8CDEB5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="enforcement-lock" d="M29 34V32A3 3 0 0 1 35 32V34" fill="none" stroke="#F4D477" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="lock-body" x="28" y="34" width="8" height="7" rx="1.5" fill="#111D34" stroke="#F4D477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="untrusted-result-return" d="M42 44H36" fill="none" stroke="#8D9CB9" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="result-check" d="M36 42L34 44L36 46" fill="none" stroke="#8D9CB9" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
