<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">AI app contract</title>
  <desc id="desc">A request passes input validation and trusted-fact checks before an uncertain model answer can affect a decision.</desc>
  <rect data-part="request-input" x="5" y="22" width="12" height="20" rx="3" fill="#111D34" stroke="#79AAFF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="input-check" d="M17 32H23M20 29L23 32L20 35" fill="none" stroke="#8D9CB9" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="contract-gate" d="M25 15V49M25 20H31M25 44H31" fill="none" stroke="#F4D477" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="trusted-facts" x="31" y="13" width="15" height="13" rx="2" fill="#111D34" stroke="#63DEEC" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="model-candidate" d="M31 38C34 31 42 31 46 38V47H31Z" fill="#EF9AC8" stroke="#E9EFFF" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="verified-decision" d="M47 31H56V43H47M49 37L52 40L57 33" fill="none" stroke="#8CDEB5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
