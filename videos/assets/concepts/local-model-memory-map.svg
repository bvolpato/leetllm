<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Local model memory map</title>
  <desc id="desc">Model weights and active state occupy separate device and host memory pools.</desc>
  <rect data-part="gpu-memory-pool" x="5" y="8" width="24" height="47" rx="5" fill="#111D34" stroke="#63DEEC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="host-memory-pool" x="35" y="8" width="24" height="47" rx="5" fill="#111D34" stroke="#79AAFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="gpu-weights" x="10" y="14" width="14" height="11" rx="2.5" fill="#63DEEC" stroke="none"/>
  <rect data-part="gpu-kv-cache" x="10" y="28" width="14" height="8" rx="2.5" fill="#F4D477" stroke="none"/>
  <rect data-part="gpu-workspace" x="10" y="39" width="14" height="6" rx="2.5" fill="#EF9AC8" stroke="none"/>
  <rect data-part="host-offloaded-block" x="40" y="16" width="14" height="12" rx="2.5" fill="#79AAFF" stroke="none"/>
  <rect data-part="host-remaining" x="40" y="32" width="14" height="13" rx="2.5" fill="#111D34" stroke="#8D9CB9" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="offload-link" d="M24 20H39" fill="none" stroke="#F4D477" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="pool-base" d="M8 50H26M38 50H56" fill="none" stroke="#8D9CB9" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
