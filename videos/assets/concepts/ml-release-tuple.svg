<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">ML release tuple</title>
  <desc id="desc">A release binds data, features, model, policy, monitor and rollback artifact before promotion.</desc>
  <path data-part="release-spine" d="M15 11V52" fill="none" stroke="#8D9CB9" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="data-snapshot" x="8" y="9" width="15" height="8" rx="2" fill="#79AAFF" stroke="#E9EFFF" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="feature-version" x="8" y="18" width="15" height="8" rx="2" fill="#63DEEC" stroke="#E9EFFF" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="model-artifact" x="8" y="27" width="15" height="8" rx="2" fill="#F4D477" stroke="#E9EFFF" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="action-policy" x="8" y="36" width="15" height="8" rx="2" fill="#EF9AC8" stroke="#E9EFFF" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="monitor" x="8" y="45" width="15" height="8" rx="2" fill="#8CDEB5" stroke="#E9EFFF" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="tuple-to-candidate" d="M23 31H26" fill="none" stroke="#8D9CB9" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="candidate-route" d="M26 31H40L45 26H55" fill="none" stroke="#63DEEC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="canary-node" d="M40 31L45 36H55" fill="none" stroke="#F4D477" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="rollback-artifact" cx="53" cy="45" r="5" fill="#111D34" stroke="#FF988D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="rollback-arrow" d="M48 45H42V39" fill="none" stroke="#FF988D" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
