<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Git history bisect</title>
  <desc id="desc">Commit snapshots narrow a regression to the change that introduced it.</desc>
  <path data-part="history-spine" d="M9 17H55M9 17V39H35V17" fill="none" stroke="#8D9CB9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="known-good" cx="9" cy="17" r="4" fill="#8CDEB5" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="midpoint" cx="35" cy="17" r="4.5" fill="#F4D477" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="known-bad" cx="55" cy="17" r="4" fill="#FF988D" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="tested-snapshot" cx="22" cy="17" r="3.2" fill="#79AAFF" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="narrowing-bracket" d="M14 47H50M14 43L18 47L14 51M50 43L46 47L50 51" fill="none" stroke="#63DEEC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
