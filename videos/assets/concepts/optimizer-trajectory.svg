<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Optimizer trajectory</title>
  <desc id="desc">Momentum combines a gradient with running velocity that carries updates through a curved loss surface.</desc>
  <ellipse data-part="outer-contour" cx="33" cy="31" rx="23" ry="17" fill="none" stroke="#79AAFF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse data-part="middle-contour" cx="33" cy="31" rx="16" ry="11" fill="none" stroke="#8D9CB9" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse data-part="inner-contour" cx="33" cy="31" rx="8" ry="5" fill="none" stroke="#63DEEC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline data-part="momentum-path" points="11,15 23,22 17,39 31,43 39,34 35,30" fill="none" stroke="#F4D477" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="minimum" cx="35" cy="30" r="2.8" fill="#8CDEB5" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
