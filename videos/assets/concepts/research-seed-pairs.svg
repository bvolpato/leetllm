  <title id="title">Paired seed trial</title>
  <desc id="desc">Each random seed runs both arms, so the comparison uses matched within-seed differences.</desc>
  <path data-part="seed-axis" d="M12 12V52M30 12V52M48 12V52" fill="none" stroke="#8D9CB9" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
