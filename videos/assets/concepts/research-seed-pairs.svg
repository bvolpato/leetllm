  <circle data-part="candidate-seed-1" cx="12" cy="28" r="3.2" fill="#F4D477" stroke="#E9EFFF" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="baseline-seed-2" cx="30" cy="34" r="3.2" fill="#79AAFF" stroke="#E9EFFF" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="candidate-seed-2" cx="30" cy="22" r="3.2" fill="#F4D477" stroke="#E9EFFF" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="baseline-seed-3" cx="48" cy="43" r="3.2" fill="#79AAFF" stroke="#E9EFFF" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="candidate-seed-3" cx="48" cy="31" r="3.2" fill="#F4D477" stroke="#E9EFFF" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="within-seed-differences" d="M12 35V32M30 30V26M48 39V35" fill="none" stroke="#8CDEB5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="paired-effect" d="M8 57H52" fill="none" stroke="#EF9AC8" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
