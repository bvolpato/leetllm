  <circle data-part="stored-value" cx="12" cy="22" r="5" fill="#79AAFF" stroke="none" stroke-width="1"/>
  <circle data-part="merged-value" cx="52" cy="22" r="5" fill="#8CDEB5" stroke="none" stroke-width="1"/>
