<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Conformal quantile</title>
  <desc id="desc">A calibration quantile sets a prediction interval whose empirical coverage can be checked on held-out examples.</desc>
  <line data-part="score-axis" x1="9" y1="47" x2="55" y2="47" stroke="#8D9CB9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="score-1" x="13" y="39" width="3" height="8" rx="1" fill="#79AAFF" stroke="#79AAFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="score-2" x="19" y="35" width="3" height="12" rx="1" fill="#79AAFF" stroke="#79AAFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="score-3" x="25" y="30" width="3" height="17" rx="1" fill="#79AAFF" stroke="#79AAFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="score-4" x="31" y="25" width="3" height="22" rx="1" fill="#79AAFF" stroke="#79AAFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="score-5" x="37" y="20" width="3" height="27" rx="1" fill="#79AAFF" stroke="#79AAFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="quantile-score" x="43" y="14" width="4" height="33" rx="1" fill="#F4D477" stroke="#F4D477" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="quantile-marker" x1="45" y1="11" x2="45" y2="51" stroke="#EF9AC8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="prediction-center" x1="18" y1="57" x2="54" y2="57" stroke="#63DEEC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="lower-bound" cx="18" cy="57" r="2.4" fill="#63DEEC" stroke="#63DEEC" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="upper-bound" cx="54" cy="57" r="2.4" fill="#63DEEC" stroke="#63DEEC" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="predicted-value" cx="36" cy="57" r="2.4" fill="#E9EFFF" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
