<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Risk-coverage curve</title>
  <desc id="desc">Selective prediction trades accepted-case coverage against error among accepted cases.</desc>
  <path data-part="coverage-axes" d="M10 51V12M10 51H55" fill="none" stroke="#8D9CB9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="risk-trajectory" d="M14 17C21 18 23 23 29 28C35 34 40 42 51 47" fill="none" stroke="#EF9AC8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="high-confidence-region" cx="17" cy="18" r="2.4" fill="#8CDEB5" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="threshold-point" cx="34" cy="34" r="3.1" fill="#F4D477" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="low-coverage-region" cx="49" cy="46" r="2.4" fill="#FF988D" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="threshold-guide" d="M34 34V51" fill="none" stroke="#F4D477" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="coverage-brace" d="M16 55H34" fill="none" stroke="#8CDEB5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="coverage-cap-a" d="M16 53V57" fill="none" stroke="#8CDEB5" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="coverage-cap-b" d="M34 53V57" fill="none" stroke="#8CDEB5" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="accept-window" d="M13 14H29" fill="none" stroke="#8CDEB5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="reject-window" d="M40 14H52" fill="none" stroke="#FF988D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
