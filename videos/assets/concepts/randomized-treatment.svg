<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Randomized treatment</title>
  <desc id="desc">Random assignment sends comparable participants to control and treatment groups.</desc>
  <circle data-part="participant" cx="11" cy="32" r="6" fill="#111D34" stroke="#8D9CB9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="randomizer" cx="27" cy="32" r="7" fill="#F4D477" stroke="#0A1020" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="assignment" d="M17 32h3M34 32h5M39 32V17h7M39 32v15h7" fill="none" stroke="#8D9CB9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="control" x="46" y="9" width="12" height="16" rx="4" fill="#111D34" stroke="#79AAFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="treatment" x="46" y="39" width="12" height="16" rx="4" fill="#111D34" stroke="#EF9AC8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="outcome-1" cx="52" cy="17" r="2.5" fill="#79AAFF" stroke="none" stroke-width="1"/>
  <circle data-part="outcome-2" cx="52" cy="47" r="2.5" fill="#8CDEB5" stroke="none" stroke-width="1"/>
</svg>