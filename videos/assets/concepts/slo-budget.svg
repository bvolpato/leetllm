<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">SLO and error budget</title>
  <desc id="desc">A measurement window and explicit good-event rule that determine how much service behavior may miss a user-facing target.</desc>
  <circle data-part="window-ring" cx="19" cy="26" r="13" fill="none" stroke="#63DEEC" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="window-arc" d="M19 13A13 13 0 0 1 31 22" fill="none" stroke="#79AAFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="window-tick-1" x1="19" y1="10" x2="19" y2="14" fill="none" stroke="#F4D477" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="window-tick-2" x1="34" y1="26" x2="30" y2="26" fill="none" stroke="#F4D477" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="good-event-counter" x="39" y="10" width="19" height="16" rx="4" fill="#111D34" stroke="#8CDEB5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="good-event-dot" cx="45" cy="18" r="3" fill="#8CDEB5" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="eligible-denominator" x1="50" y1="15" x2="55" y2="15" fill="none" stroke="#E9EFFF" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="good-numerator" x1="50" y1="20" x2="54" y2="20" fill="none" stroke="#8CDEB5" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="budget-gauge" d="M12 51A12 12 0 0 1 36 51" fill="none" stroke="#8D9CB9" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="budget-remaining" d="M14 49A10 10 0 0 1 28 42" fill="none" stroke="#F4D477" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="gauge-needle" x1="24" y1="51" x2="28" y2="45" fill="none" stroke="#F4D477" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="criterion-tag" x="40" y="39" width="18" height="13" rx="3" fill="#111D34" stroke="#79AAFF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="criterion-ttft" x1="44" y1="45" x2="54" y2="45" fill="none" stroke="#79AAFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="criterion-cap" x1="44" y1="49" x2="50" y2="49" fill="none" stroke="#8D9CB9" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
