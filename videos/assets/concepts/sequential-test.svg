<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Sequential test</title>
  <desc id="desc">Evidence accumulates over planned looks until a stopping boundary is crossed or the study ends.</desc>
