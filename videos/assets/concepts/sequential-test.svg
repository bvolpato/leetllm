  <path data-part="lower-stopping-boundary" d="M13 44C24 45 36 45 52 44" fill="none" stroke="#79AAFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="evidence-trajectory" d="M14 40L22 37L29 34L37 30L43 23L50 16" fill="none" stroke="#F4D477" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="look-one" cx="14" cy="40" r="1.7" fill="#F4D477" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="look-two" cx="22" cy="37" r="1.7" fill="#F4D477" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="look-three" cx="29" cy="34" r="1.7" fill="#F4D477" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="look-four" cx="37" cy="30" r="1.7" fill="#F4D477" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="stopping-look" cx="50" cy="16" r="2.6" fill="#FF988D" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="planned-look-ticks" d="M22 52V55M37 52V55" fill="none" stroke="#8D9CB9" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
