<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Evaluation slices</title>
  <desc id="desc">A suite-level score and per-slice results expose a safety failure hidden by an aggregate.</desc>
  <rect data-part="aggregate-score" x="8" y="8" width="48" height="10" rx="3" fill="#111D34" stroke="#79AAFF" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="aggregate-bar" d="M13 13H44" fill="none" stroke="#8CDEB5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="capability-slice" x="8" y="23" width="20" height="10" rx="2" fill="#111D34" stroke="#8CDEB5" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="retrieval-slice" x="36" y="23" width="20" height="10" rx="2" fill="#111D34" stroke="#63DEEC" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="abstention-slice" x="8" y="39" width="20" height="10" rx="2" fill="#111D34" stroke="#F4D477" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="safety-slice" x="36" y="39" width="20" height="10" rx="2" fill="#FF988D" stroke="#E9EFFF" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="slice-grid" d="M13 28H23M41 28H51M13 44H23M41 44H51" fill="none" stroke="#E9EFFF" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="hold-marker" d="M45 53V58M50 53V58" fill="none" stroke="#FF988D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
