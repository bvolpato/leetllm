  <path data-part="eligible-route" d="M19 15H29L33 32" fill="none" stroke="#8CDEB5" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="blocked-route-1" d="M18 32H25" fill="none" stroke="#FF988D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="blocked-route-2" d="M18 49H25" fill="none" stroke="#FF988D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="filter-bar" x1="28" y1="22" x2="28" y2="42" fill="none" stroke="#F4D477" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="filter-check" cx="28" cy="32" r="3.6" fill="#8CDEB5" stroke="#E9EFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="search-lens" cx="44" cy="32" r="10" fill="#111D34" stroke="#63DEEC" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
