<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Retrieval access filter</title>
  <desc id="desc">A trusted predicate that limits retrieval candidates by caller, tenant, version, or other product rules before evidence reaches later stages.</desc>
  <rect data-part="candidate-allowed" x="5" y="9" width="13" height="12" rx="3" fill="#111D34" stroke="#8D9CB9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
