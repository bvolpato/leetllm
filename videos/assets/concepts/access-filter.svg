  <rect data-part="candidate-denied-1" x="5" y="26" width="13" height="12" rx="3" fill="#111D34" stroke="#8D9CB9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="denied-lines-1" x1="8" y1="31" x2="14" y2="31" fill="none" stroke="#FF988D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="candidate-denied-2" x="5" y="43" width="13" height="12" rx="3" fill="#111D34" stroke="#8D9CB9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
