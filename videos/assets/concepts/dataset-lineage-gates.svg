<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Dataset lineage gates</title>
  <desc id="desc">A source record passes through schema, identity, and group checks before a versioned dataset is released.</desc>
  <path data-part="data-stream" d="M8 32H55" fill="none" stroke="#8D9CB9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="source-row" x="5" y="23" width="12" height="18" rx="3" fill="#111D34" stroke="#63DEEC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="source-fields" d="M8 28H14M8 32H13M8 36H11" fill="none" stroke="#63DEEC" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="schema-gate" d="M23 18V46M27 18V46" fill="none" stroke="#F4D477" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="identity-check" cx="35" cy="32" r="7" fill="#111D34" stroke="#79AAFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="identity-hash" d="M32 29H38M32 32H38M32 35H38M34 27L33 37M37 27L36 37" fill="none" stroke="#79AAFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="group-boundary" d="M46 20V44" fill="none" stroke="#EF9AC8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="released-dataset" x="51" y="23" width="10" height="18" rx="3" fill="#111D34" stroke="#8CDEB5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="release-mark" d="M53.5 32L56 34.5L59 29.5" fill="none" stroke="#8CDEB5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="quarantine-route" cx="35" cy="52" r="4" fill="#111D34" stroke="#FF988D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="quarantine-branch" d="M35 39V48" fill="none" stroke="#FF988D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>