  <path data-part="observation-return" d="M49 42H37V50H23" fill="none" stroke="#EF9AC8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="observation" x="8" y="48" width="17" height="9" rx="3" fill="#111D34" stroke="#EF9AC8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
