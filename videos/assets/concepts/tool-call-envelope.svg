<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Tool call envelope</title>
  <desc id="desc">A structured operation proposed by a model and executed only by a host that validates and authorizes its name and arguments.</desc>
  <rect data-part="request-envelope" x="4" y="9" width="27" height="36" rx="5" fill="#111D34" stroke="#111D34" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="tool-name" x="8" y="14" width="18" height="8" rx="2" fill="#111D34" stroke="#63DEEC" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="tool-name-mark" x1="12" y1="18" x2="21" y2="18" fill="none" stroke="#63DEEC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="argument-row-1" x="8" y="27" width="18" height="6" rx="2" fill="#111D34" stroke="#8D9CB9" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="argument-mark-1" x1="12" y1="30" x2="22" y2="30" fill="none" stroke="#8D9CB9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="argument-row-2" x="8" y="36" width="18" height="6" rx="2" fill="#111D34" stroke="#8D9CB9" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="argument-mark-2" x1="12" y1="39" x2="19" y2="39" fill="none" stroke="#8D9CB9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="host-boundary" d="M37 8V48" fill="none" stroke="#F4D477" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="request-through-gate" d="M31 26H40" fill="none" stroke="#63DEEC" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="validation-gate" cx="37" cy="26" r="3.6" fill="#8CDEB5" stroke="#E9EFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="authorized-tool" d="M41 26H49" fill="none" stroke="#8CDEB5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="tool-effect" x="49" y="16" width="11" height="20" rx="4" fill="#111D34" stroke="#79AAFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
