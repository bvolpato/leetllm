<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Typed workflow state</title>
  <desc id="desc">A shared, versioned record whose fields and identities let workflow nodes exchange validated evidence without relying on free-form summaries.</desc>
  <rect data-part="state-card" x="8" y="7" width="48" height="50" rx="5" fill="#111D34" stroke="#E9EFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="stable-id-row" x="13" y="13" width="38" height="10" rx="3" fill="#111D34" stroke="#63DEEC" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="id-badge" cx="18" cy="18" r="2.2" fill="#63DEEC" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="id-value" x1="24" y1="18" x2="44" y2="18" fill="none" stroke="#63DEEC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="version-row" x="13" y="27" width="38" height="10" rx="3" fill="#111D34" stroke="#79AAFF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="version-badge" cx="18" cy="32" r="2.2" fill="#79AAFF" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="version-value" x1="24" y1="32" x2="36" y2="32" fill="none" stroke="#79AAFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="status-row" x="13" y="41" width="38" height="10" rx="3" fill="#111D34" stroke="#8CDEB5" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="status-badge" cx="18" cy="46" r="2.2" fill="#8CDEB5" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="status-value" x1="24" y1="46" x2="41" y2="46" fill="none" stroke="#8CDEB5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="source-owner" cx="52" cy="50" r="3.2" fill="#F4D477" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
