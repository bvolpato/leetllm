<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Query expansion paths</title>
  <desc id="desc">One question becomes several focused retrieval paths whose results are combined.</desc>
  <rect data-part="original-question" x="4" y="25" width="15" height="14" rx="4" fill="#111D34" stroke="#F4D477" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="expansion-stem" d="M19 32H25V13H30M25 32H30M25 32V51H30" fill="none" stroke="#8D9CB9" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="rewrite-query" x="30" y="7" width="14" height="11" rx="3" fill="#111D34" stroke="#63DEEC" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="decompose-query" x="30" y="26" width="14" height="11" rx="3" fill="#111D34" stroke="#79AAFF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="hypothetical-query" x="30" y="45" width="14" height="11" rx="3" fill="#111D34" stroke="#EF9AC8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="retrieval-fanout" d="M44 13H50V32M44 32H50M44 51H50V32H58" fill="none" stroke="#8D9CB9" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="fused-results" cx="59" cy="32" r="3" fill="#8CDEB5" stroke="none"/>
</svg>
