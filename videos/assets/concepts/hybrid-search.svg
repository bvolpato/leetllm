<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Hybrid search lanes</title>
  <desc id="desc">Parallel lexical and dense retrieval paths whose ranked candidates are fused into one eligible result set.</desc>
  <rect data-part="query" x="4" y="25" width="14" height="14" rx="5" fill="#111D34" stroke="#63DEEC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="query-core" cx="11" cy="32" r="3" fill="#63DEEC" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="authorization-check" d="M19 32H25Q28 32 28 29V17H34" fill="none" stroke="#F4D477" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="lexical-lane" d="M28 32V20Q28 18 33 18H40" fill="none" stroke="#63DEEC" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="dense-lane" d="M28 32V44Q28 46 33 46H40" fill="none" stroke="#79AAFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="lexical-ranks" x="40" y="10" width="13" height="18" rx="3" fill="#111D34" stroke="#63DEEC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="lexical-match-1" x1="44" y1="15" x2="50" y2="15" fill="none" stroke="#63DEEC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="lexical-match-2" x1="44" y1="20" x2="49" y2="20" fill="none" stroke="#8D9CB9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="dense-ranks" x="40" y="36" width="13" height="18" rx="3" fill="#111D34" stroke="#79AAFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="dense-match-1" x1="44" y1="41" x2="50" y2="41" fill="none" stroke="#79AAFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="dense-match-2" x1="44" y1="46" x2="49" y2="46" fill="none" stroke="#8D9CB9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="rank-fusion" d="M54 19H57V28L53 32M54 45H57V36L53 32" fill="none" stroke="#F4D477" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="fused-result" d="M53 32H58" fill="none" stroke="#8CDEB5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="eligible-result" cx="59" cy="32" r="2.5" fill="#8CDEB5" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
