<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Estimation interval</title>
  <desc id="desc">Repeated sample estimates gather around a central estimate inside a bounded interval.</desc>
  <line data-part="interval" x1="9" y1="48" x2="55" y2="48" stroke="#79AAFF" stroke-width="5" stroke-linecap="round" fill="none" stroke-linejoin="round"/>
  <line data-part="interval-cap-1" x1="9" y1="42" x2="9" y2="54" stroke="#79AAFF" stroke-width="4" stroke-linecap="round" fill="none" stroke-linejoin="round"/>
  <line data-part="interval-cap-2" x1="55" y1="42" x2="55" y2="54" stroke="#79AAFF" stroke-width="4" stroke-linecap="round" fill="none" stroke-linejoin="round"/>
  <line data-part="estimate-1" x1="34" y1="17" x2="34" y2="54" stroke="#F4D477" stroke-width="3" stroke-linecap="round" fill="none" stroke-linejoin="round"/>
  <circle data-part="sample-1" cx="18" cy="22" r="4" fill="#63DEEC" stroke="none" stroke-width="1"/>
  <circle data-part="sample-2" cx="26" cy="31" r="4" fill="#63DEEC" stroke="none" stroke-width="1"/>
  <circle data-part="sample-3" cx="43" cy="25" r="4" fill="#63DEEC" stroke="none" stroke-width="1"/>
  <circle data-part="sample-4" cx="49" cy="34" r="4" fill="#63DEEC" stroke="none" stroke-width="1"/>
  <circle data-part="estimate-2" cx="34" cy="35" r="6" fill="#F4D477" stroke="none" stroke-width="1"/>
</svg>