<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Token economics meter</title>
  <desc id="desc">Input, cached context, and generated output occupy separate token meters with different cost weights.</desc>
  <path data-part="meter-track" d="M9 14H54M9 31H54M9 48H54" fill="none" stroke="#8D9CB9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="input-usage" d="M11 14H35" fill="none" stroke="#63DEEC" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="cached-usage" d="M11 31H25" fill="none" stroke="#79AAFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="output-usage" d="M11 48H43" fill="none" stroke="#EF9AC8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="input-unit" cx="39" cy="14" r="3.5" fill="#F4D477" stroke="none" stroke-width="1"/>
  <circle data-part="cache-unit" cx="29" cy="31" r="3.5" fill="#F4D477" stroke="none" stroke-width="1"/>
  <circle data-part="output-unit" cx="47" cy="48" r="3.5" fill="#F4D477" stroke="none" stroke-width="1"/>
  <path data-part="cost-bracket" d="M57 10V52M54 10H59M54 52H59" fill="none" stroke="#8CDEB5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>