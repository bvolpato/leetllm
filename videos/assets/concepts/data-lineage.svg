<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Data lineage</title>
  <desc id="desc">A directed record links source data through transformations to a dataset, run, and evaluation artifact.</desc>
  <path data-part="lineage-spine" d="M12 30H52" fill="none" stroke="#8D9CB9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="source-node" cx="11" cy="30" r="5" fill="#111D34" stroke="#63DEEC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="source-record" d="M9 28H13M9 31H12" fill="none" stroke="#63DEEC" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="transform-node" cx="25" cy="30" r="5" fill="#111D34" stroke="#F4D477" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="transform-arrows" d="M23 28L27 30L23 32M27 28L23 30L27 32" fill="none" stroke="#F4D477" stroke-width="1.05" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="dataset-node" cx="39" cy="30" r="5" fill="#111D34" stroke="#79AAFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="dataset-layers" d="M36 28H42M36 30H42M36 32H42" fill="none" stroke="#79AAFF" stroke-width="1.05" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="artifact-node" cx="53" cy="30" r="5" fill="#111D34" stroke="#8CDEB5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="artifact-mark" d="M51 30L52.5 31.5L55 28.5" fill="none" stroke="#8CDEB5" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="source-label-branch" d="M11 25V16H17" fill="none" stroke="#63DEEC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="source-owner" cx="19" cy="16" r="2" fill="#63DEEC" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="run-version-branch" d="M39 35V47H45" fill="none" stroke="#79AAFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="run-version" cx="48" cy="47" r="2.2" fill="#79AAFF" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="evaluation-branch" d="M53 25V16H47" fill="none" stroke="#8CDEB5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="evaluation-result" cx="45" cy="16" r="2" fill="#8CDEB5" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
