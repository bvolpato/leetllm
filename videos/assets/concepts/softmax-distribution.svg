<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Softmax distribution</title>
  <desc id="desc">Raw score bars become a normalized probability distribution over competing outcomes.</desc>
  <path data-part="logit-baseline" d="M7 28L27 28" fill="none" stroke="#8D9CB9" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="logit-bar-a" x="9" y="18" width="4" height="10" rx="1" fill="#79AAFF" stroke="none"/>
  <rect data-part="logit-bar-b" x="16" y="12" width="4" height="16" rx="1" fill="#F4D477" stroke="none"/>
  <rect data-part="logit-bar-c" x="23" y="21" width="3" height="7" rx="1" fill="#EF9AC8" stroke="none"/>
  <path data-part="normalize-flow-shaft" d="M29 21L31.5 21" fill="none" stroke="#E9EFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="normalize-flow-head" d="M36 21L31.5 23.8L31.5 18.2Z" fill="#E9EFFF" stroke="none"/>
  <path data-part="probability-baseline" d="M38 28L58 28" fill="none" stroke="#8D9CB9" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="probability-bar-a" x="40" y="24" width="4" height="4" rx="1" fill="#79AAFF" stroke="none"/>
  <rect data-part="probability-bar-b" x="47" y="10" width="5" height="18" rx="1" fill="#F4D477" stroke="none"/>
  <rect data-part="probability-bar-c" x="55" y="24" width="3" height="4" rx="1" fill="#EF9AC8" stroke="none"/>
  <path data-part="probability-cap" d="M46 10L53 10" fill="none" stroke="#F4D477" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="most-likely-token" cx="49.5" cy="34" r="2" fill="#F4D477" stroke="#E9EFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
