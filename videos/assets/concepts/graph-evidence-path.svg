<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Graph evidence path</title>
  <desc id="desc">A multi-hop chain through source-linked entities and relationships that supplies a broader evidence set for a query.</desc>
  <line data-part="relation-1" x1="17" y1="17" x2="32" y2="32" fill="none" stroke="#63DEEC" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="relation-2" x1="32" y1="32" x2="49" y2="18" fill="none" stroke="#79AAFF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="relation-3" x1="32" y1="32" x2="49" y2="49" fill="none" stroke="#F4D477" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="entity-start" cx="15" cy="15" r="7" fill="#111D34" stroke="#63DEEC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="entity-middle" cx="32" cy="32" r="7" fill="#111D34" stroke="#79AAFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="entity-right" cx="51" cy="16" r="6" fill="#111D34" stroke="#EF9AC8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="entity-lower" cx="51" cy="50" r="6" fill="#111D34" stroke="#F4D477" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="source-locator-1" cx="24" cy="24" r="2.1" fill="#8CDEB5" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="source-locator-2" cx="41" cy="23" r="2.1" fill="#8CDEB5" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="source-locator-3" cx="41" cy="41" r="2.1" fill="#8CDEB5" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="query-to-path" d="M7 15H4V32" fill="none" stroke="#E9EFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="path-to-evidence" d="M32 40V56H44" fill="none" stroke="#8CDEB5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="passage" x="44" y="52" width="15" height="8" rx="2" fill="#111D34" stroke="#8CDEB5" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
