<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Adapter residency</title>
  <desc id="desc">A capacity hierarchy that moves task adapters among GPU, CPU, and storage tiers while a shared base model stays loaded.</desc>
  <rect data-part="resident-base-model" x="5" y="15" width="26" height="34" rx="5" fill="#111D34" stroke="#111D34" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="base-model-mark-1" x1="11" y1="24" x2="25" y2="24" fill="none" stroke="#E9EFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="base-model-mark-2" x1="11" y1="31" x2="23" y2="31" fill="none" stroke="#8D9CB9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="base-model-mark-3" x1="11" y1="38" x2="25" y2="38" fill="none" stroke="#E9EFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="hot-gpu-slot" x="37" y="9" width="22" height="12" rx="3" fill="#111D34" stroke="#8CDEB5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="hot-adapter" cx="42" cy="15" r="2.5" fill="#8CDEB5" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="hot-mark" x1="48" y1="15" x2="55" y2="15" fill="none" stroke="#8CDEB5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="warm-cpu-slot" x="37" y="26" width="22" height="12" rx="3" fill="#111D34" stroke="#F4D477" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="warm-adapter" cx="42" cy="32" r="2.5" fill="#F4D477" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="warm-mark" x1="48" y1="32" x2="55" y2="32" fill="none" stroke="#F4D477" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="cold-store-slot" x="37" y="43" width="22" height="12" rx="3" fill="#111D34" stroke="#79AAFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="cold-adapter" cx="42" cy="49" r="2.5" fill="#79AAFF" stroke="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="cold-mark" x1="48" y1="49" x2="55" y2="49" fill="none" stroke="#79AAFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="promotion-path" d="M36 49H33V15H32" fill="none" stroke="#63DEEC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="base-stays-loaded" d="M31 32H35" fill="none" stroke="#E9EFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
