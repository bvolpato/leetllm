<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Training-data mixture</title>
  <desc id="desc">A training mixture assigns sampling weights to datasets before examples enter the training stream.</desc>
  <rect data-part="source-general" x="8" y="13" width="11" height="31" rx="3" fill="#111D34" stroke="#79AAFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="source-code" x="26" y="22" width="11" height="22" rx="3" fill="#111D34" stroke="#63DEEC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="source-domain" x="44" y="30" width="11" height="14" rx="3" fill="#111D34" stroke="#EF9AC8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="mixture-general" x1="13.5" y1="45" x2="27" y2="53" stroke="#79AAFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="mixture-code" x1="31.5" y1="45" x2="31.5" y2="53" stroke="#63DEEC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <line data-part="mixture-domain" x1="49.5" y1="45" x2="36" y2="53" stroke="#EF9AC8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="sampled-stream" x="23" y="53" width="18" height="6" rx="2" fill="#F4D477" stroke="#F4D477" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
