<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Semantic cache gate</title>
  <desc id="desc">A nearby question reaches a candidate answer that must pass three reuse checks.</desc>
  <circle data-part="incoming-query" cx="9" cy="19" r="4" fill="#F4D477" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="stored-query" cx="22" cy="19" r="4" fill="#63DEEC" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="similarity-link" d="M13 19H18M9 24V31H28M22 24V31" fill="none" stroke="#79AAFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect data-part="candidate-answer" x="27" y="27" width="15" height="11" rx="3" fill="#111D34" stroke="#79AAFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="check-rail" d="M42 32H47V12M47 32V52M47 12H56M47 32H56M47 52H56" fill="none" stroke="#8D9CB9" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="access-check" cx="57" cy="12" r="3" fill="#63DEEC" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="release-check" cx="57" cy="32" r="3" fill="#F4D477" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="freshness-check" cx="57" cy="52" r="3" fill="#8CDEB5" stroke="#E9EFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
