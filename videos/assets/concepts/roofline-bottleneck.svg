<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Roofline performance model</title>
  <desc id="desc">A bandwidth slope meets a compute ceiling, placing kernels at a hardware-dependent bound.</desc>
  <path data-part="intensity-axis" d="M8 52L57 52" fill="none" stroke="#8D9CB9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="performance-axis" d="M9 53L9 10" fill="none" stroke="#8D9CB9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="bandwidth-roof" d="M12 47L33 19" fill="none" stroke="#63DEEC" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="compute-ceiling" d="M33 19L56 19" fill="none" stroke="#F4D477" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="ridge-guide" d="M33 19L33 52" fill="none" stroke="#8D9CB9" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="kernel-memory-bound" cx="21" cy="35" r="3" fill="#79AAFF" stroke="#E9EFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle data-part="kernel-compute-bound" cx="46" cy="19" r="3" fill="#EF9AC8" stroke="#E9EFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path data-part="attainable-region" d="M12 47L33 19L56 19" fill="none" stroke="#8CDEB5" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
