  - id: optimizer-restart
    title: What happens to the first update?
    visual: A new optimizer is a distinct continuation experiment.
    beats:
      - say: A released checkpoint might give us just the weights. Restoring a full training run also restores optimizer
          moments and the scheduler position. Record which state you start from. A tiny learning rate can leave
          the domain poorly fitted. A large step may damage general performance. The loss curve alone cannot tell
          you which circuit changed.
        hold: 0.6
        visual_cues:
          - id: optimizer-restart-b1
            phrase: A released checkpoint might give us just the weights
            targets:
              - optimizer-restart-construction
            color: cyan
            linger: 0.5
      - say: With ordinary gradient descent, multiply the gradient by the learning rate and reverse its sign. Adam W
          also keeps two moving averages, one for the gradient and one for its square. Start them at zero. After
          the first gradient, bias correction gives back the gradient and its square. Here those are minus a half
          and a quarter.
        hold: 0.6
        visual_cues:
          - id: optimizer-restart-b2
            phrase: With ordinary gradient descent
            targets:
              - optimizer-restart-construction
            color: cyan
            linger: 0.5
          - id: cpt-optimizer-moments
            phrase: keeps two moving averages
            targets:
              - cpt-optimizer-moments
            color: cyan
            linger: 0.45
          - id: cpt-optimizer-corrected
            phrase: bias correction gives back the gradient and its square
            targets:
              - cpt-optimizer-corrected
            color: cyan
            linger: 0.45
      - say: Divide the corrected gradient by the square root of its corrected square, plus epsilon. Ignoring weight
          decay, this first coordinate moves up by almost one learning rate. Ordinary gradient descent would move
          it up by half a learning rate. Zero-initialized moments alone don’t make the step explode. Later updates
          depend on the history and precision. That makes warmup a choice to test on the new data.
        hold: 0.85
        visual_cues:
          - id: optimizer-restart-b3
            phrase: Divide the corrected gradient
            targets:
              - optimizer-restart-construction
            color: cyan
            linger: 0.5
          - id: cpt-optimizer-update
            phrase: moves up by almost one learning rate
            targets:
              - cpt-optimizer-step
            color: cyan
            linger: 0.45
  - id: schedule
    title: Choose a learning rate for the new starting point
    visual: A checkpoint begins at a low residual learning rate, warms to an authored peak, and follows a measured
      decay while its parameter path remains visible.
    beats:
      - say: The base model has already made many updates, so resuming at a tiny final learning rate may adapt too
          slowly. Teams often test a short warm-up followed by a decay from a selected peak. Warm-up lets
          optimizer state settle before the largest updates are applied.
        hold: 0.55
        visual_cues:
          - id: schedule-b1-1
            phrase: short warm-up
            targets:
              - learning-rate-curve
            linger: 0.45
      - say: The curve here is one authored schedule. Compare peak rates and warm-up lengths while keeping the data
          and evaluation protocol controlled.
        hold: 0.55
        visual_cues:
          - id: schedule-b2-1
            phrase: one authored schedule
            targets:
              - learning-rate-curve
            linger: 0.45
      - say: Larger steps can improve domain fit and also move the model farther from its broad starting behavior. The
          best checkpoint comes from measured task outcomes and declared regression limits.
        hold: 0.75
        visual_cues:
          - id: schedule-b3-1
            phrase: Larger steps
            targets:
              - schedule-position
            linger: 0.45
  - id: exact-schedule
    title: What rate applies at step nine?
    visual: Magnify the first fifty updates on the article’s learning-rate schedule. Evaluate step nine, reach the
      shared peak, then zoom out for the cosine decay.
    beats:
      - say: The last curve used display units. This schedule runs for a thousand updates. Zoom in on the first fifty.
          The scale is in millionths, with a floor of three and a peak of thirty. During warmup we add a fraction
          of the distance from floor to peak. Step zero takes the first fiftieth. At step nine, what fraction have
          we used, and what rate does that give?
        hold: 2.1
        visual_cues:
          - id: schedule-numerator
            phrase: At step nine
            targets:
              - rate-formula
            linger: 0.35
            caption_boundary: true
      - say: Step nine takes ten fiftieths of the rise. A fifth of twenty-seven is five point four. Add the floor of
          three and the rate is eight point four millionths. Step zero used three point five four millionths. By
          step forty-nine all fifty warmup increments are in, so we reach thirty millionths.
        hold: 0.85
        caption_starts:
          - A fifth of twenty-seven is five point four
          - Step zero used three point five four millionths
        visual_cues:
          - id: schedule-nine
            phrase: Step nine takes ten fiftieths
            targets:
              - rate-curve
            linger: 0.35
            caption_boundary: true
          - id: schedule-nine-result
            phrase: the rate is eight point four millionths
            targets:
              - rate-formula
            linger: 0.35
            caption_boundary: true
          - id: schedule-fifty
            phrase: By step forty-nine
            targets:
              - rate-curve
            linger: 0.35
            caption_boundary: true
      - say: Pull back to the full run. Step fifty starts the cosine decay at the same peak. Follow the curve down to
          the floor. Its progress runs from zero to one over nine hundred forty-nine step intervals. That puts the
          final update, step nine hundred ninety-nine, at three millionths.
        hold: 0.8
        visual_cues:
          - id: schedule-decay
            phrase: Follow the curve down to the floor
            targets:
              - rate-curve
            linger: 0.35
            caption_boundary: true
      - say: This five-percent warmup is a worked example. In a small-model study, Ibrahim and colleagues tested half,
          equal and double the original peak rate with several warmup lengths. The schedules showed different
          early behavior and similar later losses in those settings. Use matched data to sweep rates for your
          checkpoint, then compare downstream gain and general regression.
        hold: 0.8
        visual_cues:
          - id: schedule-sweep
            phrase: half, equal and double
            targets:
              - rate-formula
            linger: 0.35
            caption_boundary: true
