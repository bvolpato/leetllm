              - retained-outcomes-construction
            color: cyan
            linger: 0.5
          - id: cpt-retained-fail
            phrase: The last checkpoint misses both requirements
            targets:
              - cpt-retained-cases
            color: cyan
            linger: 0.45
      - say: General text perplexity is a separate signal from those tasks. Freeze the evaluation texts, tokenizer,
          masks, available context, prompt format and scoring protocol. Historical benchmarks can supply anchors,
          but inspect contamination, ceilings and the private tasks required by this product. Safety must be
          checked by its actual specified suite.
        hold: 0.6
        visual_cues:
          - id: retained-outcomes-b2
            phrase: General text perplexity is a separate signal from those tasks.
            targets:
              - retained-outcomes-construction
            color: cyan
            linger: 0.5
      - say: An accuracy move from seventy percent to sixty-eight percent is two percentage points. The relative
          reduction is two divided by seventy, about two point eight six percent. Declare the unit when setting a
          regression budget. Otherwise two thresholds that look numerically similar can select different
          checkpoints.
        hold: 0.85
        visual_cues:
          - id: retained-outcomes-b3
            phrase: An accuracy move from seventy percent to sixty-eight percent is two percentage points.
            targets:
              - retained-outcomes-construction
            color: cyan
            linger: 0.5
          - id: cpt-retained-pp
            phrase: two percentage points
            targets:
              - cpt-retained-units
            color: cyan
            linger: 0.45
          - id: cpt-retained-relative
            phrase: about two point eight six percent
            targets:
              - cpt-retained-units
            color: cyan
            linger: 0.45
  - id: select
    title: Choosing a checkpoint under a retention budget
    visual: Put the base, 1k, 4k and 12k on aligned general-perplexity rulers. Apply the ceiling, rank the surviving
      task scores and check 4k on a reserved set.
    beats:
      - say: Use a different example run for checkpoint selection. Its base general perplexity is nineteen point two. Before looking at candidates we
          allow a rise of at most one and a half points. Put the ceiling at twenty point seven. A reading right on
          the line passes.
        hold: 0.7
        visual_cues:
          - id: select-budget
            phrase: Put the ceiling at twenty point seven
            targets:
              - retention-rule
            color: yellow
            linger: 0.35
            caption_boundary: true
      - say: Here are the three training checkpoints. Each dot shows general perplexity on the same scale. Beside it you
          can read task accuracy and domain perplexity for that very checkpoint. Which checkpoint exceeds our
          ceiling?
        hold: 2.1
        visual_cues:
          - id: select-measure
            phrase: Here are the three training checkpoints
            targets:
              - candidate-readings
            linger: 0.35
            caption_boundary: true
      - say: Twelve thousand steps is too far. It has the lowest domain perplexity in the table, but its general
          perplexity rose by four point seven. Set that row aside. If we want the best task accuracy among the
          remaining rows, which one do we keep?
        hold: 2
        visual_cues:
          - id: select-gate
            phrase: Twelve thousand steps is too far
            targets:
              - candidate-readings
            color: pink
            linger: 0.35
            caption_boundary: true
      - say: Keep the four-thousand-step checkpoint. Seventy-two percent beats both earlier task scores, and its general
          perplexity rose by only point nine. We would consult domain perplexity to break a tie. These scores
          chose the checkpoint, so we need fresh cases to check it.
        hold: 0.8
        visual_cues:
          - id: select-rank
            phrase: Keep the four-thousand-step checkpoint
            targets:
              - rank-scores
            color: green
            linger: 0.35
            caption_boundary: true
      - say: Open the reserved set for that one checkpoint. In this example it gets fourteen of twenty cases right. On
          the reserved general text its perplexity rises by point nine against the base model on that same text.
          Save the weights with the tokenizer, corpus manifest and hash, token counts, optimizer state and
          evaluation protocol so another run can reproduce the comparison.
        hold: 0.85
        visual_cues:
          - id: select-reserved
            phrase: Open the reserved set
            targets:
              - reserved-check
            linger: 0.35
            caption_boundary: true
          - id: select-save
            phrase: Save the weights
            targets:
              - checkpoint-record
            linger: 0.35
            caption_boundary: true
  - id: selection-and-stopping
    title: Has another training step earned its cost?
    visual: Compare the four selection points on two axes, then count the effect of changing one outcome in a fixed
      cohort of 500.
    beats:
      - say: Plot those same four checkpoints. Moving right means the model fits domain text better. Moving up means it
          fits general text worse. The horizontal line is our budget. The dot farthest right belongs to the
          twelve-thousand-step checkpoint. It buys its extra domain gain at a price the team already ruled out.
        hold: 0.6
        visual_cues:
          - id: selection-and-stopping-b1
            phrase: Plot those same four checkpoints
            targets:
              - selection-and-stopping-construction
            color: cyan
            linger: 0.5
      - say: Moving along these four dots always improves one measure at the expense of the other. They form a Pareto
          frontier. To dominate a dot, another would need to do at least as well on both axes and strictly better
          on one. Our task-first ranking supplies a decision the frontier alone cannot make. Before ranking, the
          picker checks for finite perplexities of at least one and accuracy between zero and one.
        hold: 0.6
        visual_cues:
          - id: selection-and-stopping-b2
            phrase: Moving along these four dots
            targets:
              - selection-and-stopping-construction
            color: cyan
            linger: 0.5
          - id: cpt-selection-frontier
            phrase: They form a Pareto frontier
            targets:
              - cpt-selection-frontier
            color: cyan
            linger: 0.45
      - say: Choosing among saved checkpoints is one decision. Deciding to spend another hour training is another.
          Suppose one more answer turns correct on the same five hundred cases. That moves accuracy by two tenths
          of a percentage point. Is it worth another hour? Apply the minimum worthwhile gain, patience window and
          regression limits set before the run. Allow for uncertainty and evaluation cost, then confirm the
          selected recipe on reserved cases.
        hold: 0.85
        visual_cues:
          - id: selection-and-stopping-b3
            phrase: Choosing among saved checkpoints
            targets:
              - selection-and-stopping-construction
            color: cyan
            linger: 0.5
          - id: cpt-selection-noise
            phrase: two tenths of a percentage point
            targets:
              - cpt-selection-noise
            color: cyan
            linger: 0.45
  - id: objective-and-parameters
    title: Which weights are allowed to change?
    visual: An adapter changes the trainable coordinates rather than the teaching signal.
    beats:
      - say: LoRA can train on domain next-token text or on supervised prompt-response data. QLoRA additionally stores a
          frozen quantized base and propagates derivatives into trainable low-rank adapters. Those are parameter
          and storage choices, while continued pretraining and S F T identify supervision and data choices. Frozen
          base embeddings stay fixed even when their representations influence a scored prediction.
        hold: 0.6
        visual_cues:
          - id: objective-and-parameters-b1
            phrase: LoRA can train on domain next-token text or on supervised prompt-response data.
            targets:
              - objective-and-parameters-construction
            color: cyan
            linger: 0.5
          - id: cpt-parameters-frozen
            phrase: a frozen quantized base
            targets:
              - cpt-parameter-path
            color: cyan
            linger: 0.45
      - say: Choose the objective from the observed failure, then choose full-weight or parameter-efficient training
          under the budget and deployment constraints. Code Llama Instruct combined code pretraining with
          instruction tuning. Llama three’s code expert used continued pretraining, S F T and D P O before helping
          produce annotations and synthetic data.
        hold: 0.6
        visual_cues:
          - id: objective-and-parameters-b2
            phrase: Choose the objective from the observed failure, then choose full-weight or parameter-efficient training
              under the budget and deployment constraints.
            targets:
              - objective-and-parameters-construction
            color: cyan
            linger: 0.5
      - say: Save the selected weights with their tokenizer, configuration, corpus manifest and evaluation protocol. To
          resume exactly, also keep optimizer and scheduler state, random-number state and both loader cursors.
          In our twenty-block window we used fifteen domain blocks and five replay blocks. Those two cursors
          tell the loader exactly where to pick up each stream.
        hold: 0.85
        visual_cues:
          - id: objective-and-parameters-b3
            phrase: Save the selected weights
            targets:
              - objective-and-parameters-construction
            color: cyan
            linger: 0.5
          - id: cpt-parameters-resume
            phrase: random-number state and both loader cursors
            targets:
              - cpt-resume-state
            color: cyan
            linger: 0.45
  - id: earned-adaptation
    title: A fresh run for the on-call assistant
    visual: First change the reduction on fourteen fixed targets. Then apply the same retention ruler to a fresh set
      of three candidates and take the eligible tie-break winner to a matched assistant test.
    beats:
      - say: Try a smaller training window. Four field blocks each score three targets. Two replay blocks each score
          one. We start at logit zero again, with gradients of minus a half for field targets and plus a half for
          replay. Pool the targets. What share belongs to replay, and what mean gradient reaches the logit?
        hold: 2.2
        visual_cues:
          - id: fresh-count
            phrase: Pool the targets
            targets:
              - fresh-window
            linger: 0.35
            caption_boundary: true
      - say: Count the two yellow targets among all fourteen. Replay gets one seventh. Twelve negative halves and two
          positive halves sum to minus five. Divide by fourteen for the mean gradient. Now average the six block
          means equally. Each yellow target gets a whole block’s vote. Replay jumps to a third, and the gradient
          shrinks to minus one sixth. Restore equal weight per target to recover the pooled update.
        hold: 0.9
        visual_cues:
          - id: cpt-fresh-share
            phrase: Count the two yellow targets
            targets:
              - fresh-window
            linger: 0.35
            caption_boundary: true
          - id: cpt-fresh-pooled
            phrase: Divide by fourteen
            targets:
              - fresh-window
            linger: 0.35
            caption_boundary: true
          - id: cpt-fresh-block
            phrase: Now average the six block means equally
            targets:
              - fresh-window
            linger: 0.35
            caption_boundary: true
          - id: cpt-fresh-repair
            phrase: Restore equal weight per target
            targets:
              - fresh-window
            linger: 0.35
            caption_boundary: true
      - say: That calculation tells us how we trained. To choose a checkpoint, we need measurements. For this new run
          the base general perplexity is eighteen and the allowed rise is one. Here are three candidates. Apply
          the ceiling, compare task accuracy, and break a tie with lower domain perplexity. Which candidate would
          you take to the reserved incidents?
        hold: 2.4
        visual_cues:
          - id: fresh-ledger
            phrase: Here are three candidates
            targets:
              - candidate-readings
              - rank-scores
            linger: 0.35
            caption_boundary: true
      - say: B crosses the ceiling. Its eighty-two percent is tempting, but nineteen point two exceeds the limit of
          nineteen. A and C both score seventy-eight percent on the task. Which of those two has the lower domain
          perplexity?
        hold: 2
        visual_cues:
          - id: fresh-gate
            phrase: B crosses the ceiling
            targets:
              - candidate-readings
            color: pink
            linger: 0.35
            caption_boundary: true
      - say: Choose C. Its domain perplexity is twenty-one against A’s twenty-two. We only needed that column because
          the eligible task scores tied.
        hold: 1
        visual_cues:
          - id: fresh-winner
            phrase: Choose C
            targets:
              - rank-scores
            color: green
            linger: 0.35
            caption_boundary: true
      - say: Give the base model and checkpoint C the same supervised tuning, then the same reserved incident and
          runbook. The runbook calls for jitter and an idempotency token. Here’s a practice reply. “Wait exactly
          one second. Retry with the same idempotency token.” Which requirement does it meet?
        hold: 2.1
        caption_starts:
          - Here’s a practice reply
          - Which requirement does it meet
        visual_cues:
          - id: fresh-reserved
            phrase: the same supervised tuning
            targets:
              - reserved-assistants
            linger: 0.35
            caption_boundary: true
          - id: reserved-example
            phrase: Here’s a practice reply
            targets:
              - sample-reply
            linger: 0.35
      - say: It keeps the idempotency token. The fixed delay misses jitter. Score both assistants this way across
          the reserved incidents. Keep the extra pretraining if the adapted assistant handles incidents better
          and still passes the required general checks.
        hold: 1.4
        caption_starts:
          - The fixed delay misses jitter
          - Score both assistants this way
          - Keep the extra pretraining
        visual_cues:
          - id: reserved-token
            phrase: It keeps the idempotency token
            targets:
              - token-check
            linger: 0.35
          - id: reserved-delay
            phrase: The fixed delay misses jitter
            targets:
              - jitter-check
            linger: 0.35
          - id: reserved-decision
            phrase: Keep the extra pretraining if
            targets:
              - deployment-check
            linger: 0.35
