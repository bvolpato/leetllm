            linger: 0.35
            caption_boundary: true
      - say: Turn the reef score up by a quarter. The same probability moves in both notes. Read the loss under each
          one. The field note gets cheaper because it ends in reef. The park note gets more expensive because it
          ends in tree. A single parameter has to serve them both. On a real checkpoint, test that trade on unseen
          text and on the work people need it to do.
