    title: How much replay reaches the update?
    visual: Keep twenty blocks in place. Cross out masked replay targets, then give each block a width proportional
      to its contribution under the chosen average.
    beats:
      - say: Keep the same twenty blocks. Five come from replay. Each block starts with six targets after the usual
          shift. Now mask four targets in every replay block. Each colored cell still counts and each dash is
          skipped. If you pool the losses from all the colored cells, what fraction comes from replay?
        hold: 2.2
        visual_cues:
          - id: weight-mask
            phrase: mask four targets in every replay block
            targets:
              - scored-blocks
            linger: 0.35
            caption_boundary: true
          - id: weight-count
            phrase: all the colored cells
            targets:
              - scored-blocks
            linger: 0.35
            caption_boundary: true
      - say: Give every colored cell equal weight. The fifteen field blocks contain ninety targets. The five replay
          blocks have just ten between them. That gives replay one tenth of the weight in the pooled mean. At logit zero the field
          gradient is minus a half and replay’s is plus a half. Ninety votes one way and ten the other give a mean
          gradient of minus point four.
        hold: 0.9
        visual_cues:
          - id: weight-pool
            phrase: Give every colored cell equal weight
            targets:
              - scored-blocks
              - replay-weight
            linger: 0.35
            caption_boundary: true
          - id: weight-gradient
            phrase: mean gradient of minus point four
            targets:
              - replay-weight
            linger: 0.35
            caption_boundary: true
      - say: Suppose we meant replay to have a quarter of the weight. Take the mean within each source, then give replay
          a quarter and the field notes three quarters. Each target still belongs to the same block. Their influence
          changes, and the gradient returns to minus a quarter. Giving every block equal weight happens to agree
          here because blocks within each source have equal target counts. You can also change sampling to deliver
          the target mix. Check what the trainer averages after masks, including when it accumulates microbatches.
