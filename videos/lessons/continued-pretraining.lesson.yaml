          - id: objective-prefix
            phrase: has read up to the word
            targets:
              - token-stream
            linger: 0.35
            caption_boundary: true
      - say: First it predicts the piece spelled R E. Score the probability it gave that piece, then add the observed
          piece to the context. Now it predicts E F. The period gets its own turn. Each scored position
          contributes the negative log probability of the piece that actually came next.
        hold: 0.8
        visual_cues:
          - id: objective-re
            phrase: the piece spelled R E
            targets:
              - token-stream
            linger: 0.35
            caption_boundary: true
