scenes:
  - id: intro
    title: What changes when a model learns from one field note?
    visual: A pencil marks the missing word in a diver’s notebook. Reveal the observed ending, then follow the shared odds as one training update shifts the split on both notes.
    beats:
      - say: The tide rises near the ... Reef and tree each get half the probability. Which word did the diver write?
        hold: 2.1
        caption_starts:
          - Which word did the diver write
        visual_cues:
          - id: intro-odds
            phrase: Reef and tree each get half the probability
            targets:
              - word-odds
            linger: 0.35
            caption_boundary: true
      - say: The diver wrote reef. The park note ends in tree. In this little model, both notes share one pair of
          scores. If training on the diver’s note raises the score for reef, what happens to tree in the park note?
        hold: 2.1
        visual_cues:
          - id: intro-open
            phrase: The diver wrote reef
            targets:
              - field-note
            linger: 0.35
            caption_boundary: true
          - id: intro-park
            phrase: The park note ends in tree
            targets:
              - park-note
            linger: 0.35
            caption_boundary: true
      - say: Tree loses some of its share. Raise the reef score by a quarter and keep the tree score at zero.
          These scores are called logits. Reef now gets about fifty-six percent on either note. A language model
          can also use the words around the gap. When a pretrained model keeps learning to predict the next token
          from field notes like these, that’s continued pretraining. How would we tell whether it helped someone
          do their job?
        hold: 0.9
        caption_starts:
          - Reef now gets about fifty-six percent
        visual_cues:
          - id: intro-update
            phrase: Tree loses some of its share
            targets:
              - word-odds
            linger: 0.35
            caption_boundary: true
  - id: incident-controls
    title: What would fix the incident reply?
    visual: Add the runbook to the same request. Compare its conditional effect with two matched training recipes.
    beats:
      - say: At three in the morning an incident assistant tells the on-call engineer to check the Wi-Fi. This is our
          fictional payment service. The runbook says the worker pool runs out of connections when the gateway
          retries. The retry needs jitter, and token reissue needs an idempotency token. What could we change
          before spending a single training step?
        hold: 1.9
        visual_cues:
          - id: incident-answer
            phrase: check the Wi-Fi
            targets:
              - incident-answer
            linger: 0.35
            caption_boundary: true
          - id: incident-evidence
            phrase: The runbook says
            targets:
              - runbook-excerpt
            linger: 0.35
            caption_boundary: true
      - say: Put the excerpt in the prompt and leave the weights alone. Suppose the answer now follows the runbook. That
          gives us a retrieval baseline. If it still fails, compare two training paths. One starts supervised
          fine-tuning immediately. The other first reads unlabeled domain text, then gets the same supervised
          recipe. Use the same held-out incidents, context and scoring for both. Supervised examples can teach
          facts and procedures as well as answer format.
        hold: 0.8
        visual_cues:
          - id: incident-supply
            phrase: Put the excerpt in the prompt
            targets:
              - runbook-excerpt
            linger: 0.35
            caption_boundary: true
          - id: incident-reply
            phrase: the answer now follows the runbook
            targets:
              - incident-answer
            linger: 0.35
            caption_boundary: true
          - id: incident-pair
            phrase: compare two training paths
            targets:
              - training-pair
            linger: 0.35
            caption_boundary: true
      - say: Supplying evidence takes context. Triple the prompt length and this square of full-attention pairs grows
          ninefold at fixed model width. Other work, including projections, feed-forward layers, retrieval and
          cache reuse, affects the actual latency. Time the supported answer and score its accuracy. Even a name
          that takes several tokens can make sense in context.
        hold: 0.85
        visual_cues:
          - id: incident-length
            phrase: Triple the prompt length
            targets:
              - attention-pairs
            linger: 0.35
            caption_boundary: true
  - id: diagnose
    title: Match the training method to the failure
    visual: A task symptom branches to retrieval, continued pretraining, supervised fine-tuning, and preference
      optimization with distinct input signals.
    beats:
      - say: First identify what fails. Missing current facts may call for retrieval, while trouble modeling domain
          documents can justify another stretch of next-token training. Retrieval supplies outside evidence at
          answer time; continued pretraining changes patterns stored in model weights.
        hold: 0.55
        visual_cues:
          - id: diagnose-b1-1
            phrase: retrieval, while
            targets:
              - retrieve-path
            linger: 0.45
          - id: diagnose-b1-2
            phrase: changes patterns stored in model weights
            targets:
              - domain-path
            linger: 0.45
      - say: When output format fails, supervised fine-tuning provides prompt and response demonstrations. Preference
          methods address comparisons between acceptable replies.
        hold: 0.55
        visual_cues:
          - id: diagnose-b2-1
            phrase: supervised fine-tuning
            targets:
              - supervised-path
            linger: 0.45
          - id: diagnose-preference-comparison
            phrase: Preference methods address comparisons between acceptable replies
            targets:
              - preference-path
            color: yellow
            linger: 0.65
      - say: Each training stage uses a different learning signal. Field notes supply the next word, a supervised
          example supplies an answer, and a reviewer can tell us which of two answers they prefer.
        hold: 0.75
        visual_cues:
          - id: diagnose-b3-1
            phrase: different learning signal
            targets:
              - domain-path
              - supervised-path
              - preference-path
            color: cyan
            linger: 0.45
  - id: prompt-gradient
    title: Which prompt rows receive a gradient?
    visual: Follow two prompt embeddings into the one scored response, then trace its derivative back to the input rows.
    beats:
      - say: Follow the two blue prompt rows into the sum. They make the hidden vector that the fixed output head uses
          to predict the response. The head gives the third class the lowest score. That class is our observed
          response. We score only that response and skip the earlier prompt target. Which input rows will its loss
          reach?
        hold: 2
        visual_cues:
          - id: prompt-gradient-b1
            phrase: Follow the two blue prompt rows
            targets:
              - prompt-gradient-construction
            color: cyan
            linger: 0.5
      - say: Trace the response gradient back through the sum. Both blue rows feed the prediction, so both receive a
          gradient. The loss is about one point eight six two nats. The third row was never looked up. Its input
          gradient is zero here. If we tied the input and output weights, there would be another path through the
          head.
        hold: 0.6
        caption_starts:
          - Both blue rows feed the prediction
          - The third row was never looked up
        visual_cues:
          - id: prompt-gradient-b2
            phrase: Trace the response gradient
            targets:
              - prompt-gradient-construction
            color: cyan
            linger: 0.5
          - id: cpt-dependency-backward
            phrase: back through the sum
            targets:
              - cpt-dependency-rows
            color: cyan
            linger: 0.45
          - id: cpt-dependency-loss
            phrase: The loss is about one point eight six two nats
            targets:
              - cpt-dependency-loss
            color: cyan
            linger: 0.45
          - id: cpt-dependency-unused
            phrase: The third row was never looked up
            targets:
              - cpt-dependency-unused
            color: cyan
            linger: 0.45
      - say: The mask tells us which predictions to score. The sum tells us which inputs influenced that score. A
          separate choice tells the optimizer which parameters it may change. This small model uses a sum and a
          fixed head so we can check those paths directly.
        hold: 0.85
        visual_cues:
          - id: prompt-gradient-b3
            phrase: The mask tells us which predictions to score
            targets:
              - prompt-gradient-construction
            color: cyan
            linger: 0.5
  - id: scored-objective
    title: How many targets count?
    visual: Count the positions the chosen causal loss can score.
    beats:
      - say: Take a block of seven tokens. With no earlier context, the first token gives us something to read. From
          there we can score the next six. In general, a block of n tokens scores n minus one positions before
          padding or boundary masks. Add up the negative log probabilities on the positions you actually score,
          and divide by their count. You need at least one.
        hold: 0.6
        visual_cues:
          - id: scored-objective-b1
            phrase: Take a block of seven tokens
            targets:
              - scored-objective-construction
            color: cyan
            linger: 0.5
          - id: cpt-objective-shift
            phrase: scores n minus one positions
            targets:
              - cpt-objective-pairs
            color: cyan
            linger: 0.45
      - say: Exponentiate that mean loss and you get perplexity. Compare the same target positions with the same
          available context. All six are eligible in our continued-pretraining example. A response-only mask
          leaves four direct targets. The other tokens can still supply context to those predictions.
        hold: 0.6
        visual_cues:
          - id: scored-objective-b2
            phrase: Exponentiate that mean loss
            targets:
              - scored-objective-construction
            color: cyan
            linger: 0.5
          - id: cpt-objective-four
            phrase: A response-only mask leaves four direct targets
            targets:
              - cpt-objective-pairs
            color: cyan
            linger: 0.45
      - say: Runbook text teaches the model which pieces follow each other in a runbook. Supervised replies teach it
          what to say to the engineer. Their serializer and mask specify which reply positions count. Either
          objective can update the full model or just an adapter, depending on which parameters you leave
          trainable.
        hold: 0.85
        visual_cues:
          - id: scored-objective-b3
            phrase: Runbook text teaches the model
            targets:
              - scored-objective-construction
            color: cyan
            linger: 0.5
          - id: cpt-objective-source
            phrase: Supervised replies teach it what to say
            targets:
              - cpt-objective-source
            color: cyan
            linger: 0.45
  - id: fertility-cost
    title: How many pieces does the timeout code use?
    visual: A tokenizer inspection measures pieces rather than competence.
    beats:
      - say: Try the payment service’s timeout code in this small longest-match tokenizer. It knows lowercase timeout as
          one piece. In the uppercase identifier it recognizes AUTH, then the underscore. It spells out the rest
          one letter at a time. That makes nine pieces in this vocabulary. A production tokenizer has its own
          vocabulary and splitting rules.
        hold: 0.6
        visual_cues:
          - id: fertility-cost-b1
            phrase: Try the payment service’s timeout code
            targets:
              - fertility-cost-construction
            color: cyan
            linger: 0.5
          - id: cpt-fertility-pieces
            phrase: It spells out the rest one letter at a time
            targets:
              - cpt-fertility-pieces
            color: cyan
            linger: 0.45
      - say: Those nine pieces spend more context than one. Measure corpus-wide token lengths with the actual checkpoint
          tokenizer before assigning a multiplier to all documents. If a whole sequence triples in length, its
          full-attention pair component grows ninefold at fixed width. Total forward work and measured latency
          include other operations.
        hold: 0.6
        visual_cues:
          - id: fertility-cost-b2
            phrase: Those nine pieces spend more context than one.
            targets:
              - fertility-cost-construction
            color: cyan
            linger: 0.5
          - id: cpt-fertility-pairs
            phrase: its full-attention pair component grows ninefold
            targets:
              - cpt-fertility-work
            color: cyan
            linger: 0.45
      - say: Keep the tokenizer fixed and the model reads the same nine pieces throughout training. Their IDs and
          the size of the embedding table stay the same. The model can still learn what that sequence means from
          the surrounding reports. Check it on unseen text and incident questions.
        hold: 0.85
        visual_cues:
          - id: fertility-cost-b3
            phrase: the same nine pieces throughout training
            targets:
              - fertility-cost-construction
            color: cyan
            linger: 0.5
  - id: vocabulary-shapes
    title: What changes when we add a token?
    visual: Adding a row changes both lookup and output support.
    beats:
      - say: What would it take to give that identifier its own token? Look at the two tables. The input table needs a
          row to read the token. The output head needs a row to predict it. Add the new row to both tables and
          keep the old IDs in place. Update the tokenizer and configuration too. For K new tokens each table gains
          K rows of the same width. If the tables share weights, preserve that tie. If they are separate,
          initialize both.
        hold: 0.6
        caption_starts:
          - Look at the two tables
        visual_cues:
          - id: vocabulary-shapes-b1
            phrase: Look at the two tables
            targets:
              - vocabulary-shapes-construction
            color: cyan
            linger: 0.5
          - id: cpt-vocab-resize
            phrase: Add the new row to both tables
            targets:
              - cpt-vocab-tables
            color: cyan
            linger: 0.45
      - say: Here the input table has five rows of eight numbers. Build its sixth row from auth, time and out. In each
          column, average the three old values. Those eight averages form the new input embedding. If the output
          table is separate, choose its starting row too.
        hold: 0.6
        visual_cues:
          - id: vocabulary-shapes-b2
            phrase: Build its sixth row from auth, time and out
            targets:
              - vocabulary-shapes-construction
            color: cyan
            linger: 0.5
          - id: cpt-vocab-centroid
            phrase: In each column, average the three old values
            targets:
              - cpt-vocab-centroid
            color: cyan
            linger: 0.45
      - say: How should those new rows start? In one Hindi adaptation study with Nemotron, different methods
          worked well for the input and output rows. The scale of the vectors mattered too. Ranking the methods
          by starting loss could give a different winner from ranking them on the final task. Try a short run
          and compare both task performance and retained abilities.
        hold: 0.85
        visual_cues:
          - id: vocabulary-shapes-b3
            phrase: How should those new rows start
            targets:
              - vocabulary-shapes-construction
            color: cyan
            linger: 0.5
          - id: cpt-vocab-evidence
            phrase: ranking them on the final task
            targets:
              - cpt-vocab-evidence
            color: cyan
            linger: 0.45
  - id: vocabulary-denominator
    title: What happens to an old word’s probability?
    visual: An unchanged old logit can lose probability after expansion.
    beats:
      - say: Keep the two old output rows and the hidden vector fixed. Both dot products are zero. Each old word
          contributes one unit to the softmax denominator, so the words split the probability evenly. The proposed
          new row is their mean. Its dot product is also zero. When we add it, what probability will the first
          word get?
        hold: 2
        visual_cues:
          - id: vocabulary-denominator-b1
            phrase: Keep the two old output rows
            targets:
              - vocabulary-denominator-construction
            color: cyan
            linger: 0.5
      - say: The denominator gains a third unit mass while the old logits remain zero. The old target probability
          becomes one third. Its negative log probability rises from about zero point six nine three to one point
          zero nine nine, an increase of natural log three halves, about zero point four zero five.
        hold: 0.6
        visual_cues:
          - id: vocabulary-denominator-b2
            phrase: The denominator gains a third unit mass while the old logits remain zero.
            targets:
              - vocabulary-denominator-construction
            color: cyan
            linger: 0.5
          - id: cpt-vocab-third
            phrase: The old target probability becomes one third.
            targets:
              - cpt-vocab-mass
            color: cyan
            linger: 0.45
            caption_boundary: true
          - id: cpt-vocab-nll
            phrase: an increase of natural log three halves
            targets:
              - cpt-vocab-loss
            color: cyan
            linger: 0.45
      - say: The new row takes a share of every prediction, even when both old scores stay fixed. That gives us
          something to measure when we add tokens. Check the initial loss, then train and score both new and
          familiar tasks. Code Llama kept the existing tokenizer for most of its work and added four markers
          for a specific job, filling gaps in code.
        hold: 0.85
        visual_cues:
          - id: vocabulary-denominator-b3
            phrase: The new row takes a share of every prediction
            targets:
              - vocabulary-denominator-construction
            color: cyan
            linger: 0.5
  - id: corpus
    title: Prepare domain text before training
    visual: Candidate field guides, duplicate pages, contaminated evaluation examples, and clean held-out
      documents move through separate corpus gates.
    beats:
      - say: Start with the documents the model should learn from. Remove boilerplate, corrupted extraction,
          near-duplicates, and text that the team has no right to use. Keep licensing, provenance, language,
          and date metadata beside each source so stale material can be removed later.
        hold: 0.55
        visual_cues:
          - id: corpus-b1-1
            phrase: documents the model should learn from
            targets:
              - source-records
            linger: 0.45
          - id: corpus-b1-2
            phrase: near-duplicates
            targets:
              - corpus-decisions
            linger: 0.45
      - say: Split evaluation material before training and check for overlap with source documents. Deduplication
          reduces repeated passages, while careful lineage keeps the held-out measurement meaningful.
        hold: 0.55
        visual_cues:
          - id: corpus-b2-1
            phrase: Split evaluation material
            targets:
              - held-out-source
            linger: 0.45
          - id: corpus-b2-2
            phrase: lineage
            targets:
              - training-manifest
            linger: 0.45
      - say: Tokenize with the checkpoint's tokenizer, inspect how important terms break into pieces, and record the
          tokenizer version. A vocabulary extension changes embeddings and makes perplexity comparisons more
          delicate.
        hold: 0.75
        visual_cues:
          - id: corpus-b3-1
            phrase: terms break into pieces
            targets:
              - tokenizer-pieces
            linger: 0.45
  - id: grouped-holdout
    title: Which revisions must stay together?
    visual: Keep source revisions in one split before tokenization.
    beats:
      - say: Two revisions of a runbook can have different file names and almost the same text. Give them one group name
          before splitting. Hash each group name with SHA two fifty-six and take the remainder after division by
          four. Bucket zero goes to validation. The other buckets go to training. Every revision carrying that name
          travels together.
        hold: 0.6
        visual_cues:
          - id: grouped-holdout-b1
            phrase: Two revisions of a runbook
            targets:
              - grouped-holdout-construction
            color: cyan
            linger: 0.5
          - id: cpt-groups-buckets
            phrase: Hash each group name with SHA two fifty-six
            targets:
              - cpt-groups
            color: cyan
            linger: 0.45
      - say: On these inputs the auth and S D K groups go to training. Payments and webhooks go to validation. No group
          name appears in both. But give two copies different names and this check can pass even when their text
          leaks across the split. Someone has to identify the revision families first.
        hold: 0.6
        visual_cues:
          - id: grouped-holdout-b2
            phrase: On these inputs
            targets:
              - grouped-holdout-construction
            color: cyan
            linger: 0.5
          - id: cpt-groups-route
            phrase: the auth and S D K groups go to training
            targets:
              - cpt-groups
            color: cyan
            linger: 0.45
          - id: cpt-groups-gap
            phrase: give two copies different names
            targets:
              - cpt-group-leak
            color: cyan
            linger: 0.45
      - say: Hash bucketing targets a fraction across many groups, not exactly one quarter of tokens in a small corpus.
          Check sizes, topic coverage and residual overlap. A common source, revision family or deduplication
          group can carry leakage across otherwise distinct filenames. Grouping and content screening protect
          different evidence paths.
        hold: 0.85
        visual_cues:
          - id: grouped-holdout-b3
            phrase: Hash bucketing targets a fraction across many groups, not exactly one quarter of tokens in a small
              corpus.
            targets:
              - grouped-holdout-construction
            color: cyan
            linger: 0.5
  - id: manifest-gate
    title: Which sources can enter training?
    visual: A clean-looking document still needs every approval flag.
    beats:
      - say: Each row describes one possible source. The on-call notes still contain private information. The clean
          probes are reserved for evaluation. The vendor export lacks training rights. Only the public A P I docs
          clear all three checks. That leaves eight hundred thousand tokens available for training.
        hold: 0.6
        visual_cues:
          - id: manifest-gate-b1
            phrase: Each row describes one possible source
            targets:
              - manifest-gate-construction
            color: cyan
            linger: 0.5
          - id: cpt-manifest-admit
            phrase: Only the public A P I docs clear all three checks
            targets:
              - cpt-manifest-rows
            color: cyan
            linger: 0.45
      - say: The flags record review decisions someone already made. This function checks their types and values. Put
          quotation marks around false and you get a string, so the flag is invalid. A token count must be a
          nonnegative integer. The boolean true also fails that check. License verification and privacy review
          happen upstream.
        hold: 0.6
        visual_cues:
          - id: manifest-gate-b2
            phrase: The flags record review decisions
            targets:
              - manifest-gate-construction
            color: cyan
            linger: 0.5
          - id: cpt-manifest-type
            phrase: a string, so the flag is invalid
            targets:
              - cpt-manifest-types
            color: cyan
            linger: 0.45
      - say: Preserve access restrictions and a removal path alongside provenance, language, date and source revision. A
          sensitive domain source may need stronger controls than public text. Quality, rights, privacy and
          evaluation isolation are separate decisions on the same document owner, before its tokens enter the
          training stream.
        hold: 0.85
        visual_cues:
          - id: manifest-gate-b3
            phrase: Preserve access restrictions and a removal path alongside provenance, language, date and source
              revision.
            targets:
              - manifest-gate-construction
            color: cyan
            linger: 0.5
          - id: cpt-manifest-remove
            phrase: a removal path alongside provenance
            targets:
              - cpt-manifest-owner
            color: cyan
            linger: 0.45
  - id: normalized-overlap
    title: Would this screen catch a copied runbook?
    visual: A normalized hash screen has a precise comparison policy.
    beats:
      - say: For this screen, lowercase each text and collapse its whitespace. Hash the result for comparison. The
          timeout candidate matches a held-out runbook even though its case and spaces changed. Drop that
          candidate. Keep the two other original texts, with their original spelling and spacing, for training.
        hold: 0.6
        visual_cues:
          - id: normalized-overlap-b1
            phrase: lowercase each text and collapse its whitespace
            targets:
              - normalized-overlap-construction
            color: cyan
            linger: 0.5
          - id: cpt-normalize-screen
            phrase: Drop that candidate
            targets:
              - cpt-overlap-rows
            color: cyan
            linger: 0.45
      - say: If case distinguishes two service names, normalization can merge different identifiers. Code indentation
          can carry meaning too. Conversely, a partial copy or paraphrase can escape a whole-document hash. Choose
          a comparison policy for the source, group near-duplicates and audit what remains.
        hold: 0.6
        visual_cues:
          - id: normalized-overlap-b2
            phrase: If case distinguishes two service names
            targets:
              - normalized-overlap-construction
            color: cyan
            linger: 0.5
          - id: cpt-normalize-collision
            phrase: normalization can merge different identifiers
            targets:
              - cpt-overlap-limits
            color: cyan
            linger: 0.45
      - say: Go back to the field notes. D one survived and will supply the sentence about the tide. D six matches a
          held-out example, so it stays out of training. That decision belongs with the source record all the way
          through tokenization.
        hold: 0.85
        visual_cues:
          - id: normalized-overlap-b3
            phrase: D one survived
            targets:
              - normalized-overlap-construction
            color: cyan
            linger: 0.5
          - id: cpt-normalize-lineage
            phrase: D six matches a held-out example
            targets:
              - cpt-overlap-lineage
            color: cyan
            linger: 0.45
  - id: packed-remainder
    title: Where does the last document go?
    visual: Move named document tokens and their end markers into six-token blocks. Keep the final document intact
      as a returned remainder.
    beats:
      - say: Each row is one document. Read left to right, then continue on the next row. Append a zero to mark the end
          of each document. That gives fourteen positions. The packer returns full blocks of six. Will the last
          document fit into a full block on this call?
        hold: 2
        visual_cues:
          - id: packed-remainder-b1
            phrase: Each row is one document
            targets:
              - packed-remainder-construction
            color: cyan
            linger: 0.5
          - id: cpt-pack-concatenate
            phrase: Append a zero to mark the end of each document
            targets:
              - cpt-pack-stream
            color: cyan
            linger: 0.45
      - say: Fill the first six slots. They take all of the first document, including its end marker, and the first two
