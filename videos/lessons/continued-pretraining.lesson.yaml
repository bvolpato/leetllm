            linger: 0.35
            caption_boundary: true
          - id: objective-period
            phrase: The period gets its own turn
            targets:
              - token-stream
            linger: 0.35
            caption_boundary: true
      - say: Return to the two-word model from the opening. Here reef is one outcome and tree is the other. At even
          odds, each observed word costs about point six nine three nats. If we raise the score for reef again,
          which note will cost more?
        hold: 2
        visual_cues:
