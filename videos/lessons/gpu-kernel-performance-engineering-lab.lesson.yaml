            phrase: "Warp zero can now read sixty-five"
            targets: [barrier-register]
            linger: 0.15
          - id: ordered-store
            phrase: "Its store sends sixty-five to the output"
            targets: [barrier-output]
            linger: 0.15
  - id: race-recovery
