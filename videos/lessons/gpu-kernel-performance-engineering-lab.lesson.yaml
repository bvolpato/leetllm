  - id: primitives
    title: Let the output dependency choose the primitive
    visual: A mismatch bit vector yields a scalar reduction, then exclusive prefix offsets and a
      compacted index list, all computed from one shared input.
    beats:
      - say: Tiling is one implementation technique. The required output decides the broader algorithm. A
          transpose preserves values in a new layout. A reduction combines many inputs into a few
          summaries. For example, total mismatch count and maximum error naturally use reductions
          because the checker needs only those aggregate results.
        hold: 0.65
        visual_cues:
          - id: primitives-beat-1-focus-1
            phrase: A reduction combines many inputs into a few summaries
            targets:
              - primitives-b-0-reduction-count-s-count-scan-written-lanes-s-visible-s-bits-leng
            color: cyan
            linger: 0.65
      - say: Now collect the locations of mismatches in stable order. Each failing element needs the number
          of failures before it. An exclusive prefix scan supplies that destination. Watch the same
          mismatch bits produce offsets and then the compacted index list. A total count alone
          cannot assign each element its individual output slot.
        hold: 0.65
        visual_cues:
          - id: primitives-beat-2-focus-1
            phrase: Watch the same mismatch bits produce offsets and then the compacted index list
            targets:
              - primitives-b-0-offsets-locate-each-selected-item-compacted-s-indexes-join
            color: cyan
            linger: 0.65
          - id: primitives-beat-2-focus-2
            phrase: A total count alone cannot assign each element its individual output slot
            targets:
              - primitives-b-0-reduction-count-s-count-scan-written-lanes-s-visible-s-bits-leng
            color: yellow
            linger: 0.65
  - id: synthesis
    title: "What did the extra column buy?"
    visual: >-
      Plot all five observed batch averages for each correct transpose. Magnify the difference between
      padded and tiled within each round on a zero-centered microsecond axis.
    beats:
      - say: >-
          These three kernels passed the recorded output checks. Plot the five rounds for each kernel.
          Each dot is a batch average from a separate process on the same GPU, with the same shape and one
          hundred timed launches. The order alternated between rounds. Even the slowest tiled batch took
          less time than the fastest naive batch. Keep the tiled version for this setup. The medians for
          tiled and padded are close enough to round to neighboring thousandths of a millisecond.
        hold: 0.65
        visual_cues:
          - id: plot-times
            phrase: "Plot the five rounds for each kernel"
            targets: [timing-overview]
            linger: 0.15
          - id: tile-gap
            phrase: "the slowest tiled batch took less time than the fastest naive batch"
            targets: [timing-overview]
            linger: 0.15
          - id: medians
            phrase: "The medians for tiled and padded"
            targets: [timing-overview]
            linger: 0.15
      - say: >-
          Compare tiled and padded within each round. Subtract tiled time from padded time and plot the
          difference in microseconds. Left of zero, padding saved time. Look at round one, then round
          four. The same extra column moved the time in opposite directions. Do these five rounds
          establish a speedup from padding?
        hold: 2.2
        visual_cues:
          - id: pair-rounds
            phrase: "Compare tiled and padded within each round"
            targets: [timing-pairs]
            linger: 0.15
          - id: pair-marks
            phrase: "plot the difference in microseconds"
            targets: [timing-pairs]
            linger: 0.15
      - say: >-
          The padding benefit is still unresolved. Padded was faster in three rounds and slower in two.
          Its lower median sits inside the variation across runs. The address calculation established
          where the words go. A permitted profile of this kernel and launch could identify which memory
          stage limits it. Keep the raw times with the source hash, device, build resources, exact checks
          and sanitizer logs, so the next run can test the same change.
        hold: 0.8
        visual_cues:
          - id: padding-verdict
            phrase: "The padding benefit is still unresolved"
            targets: [timing-question]
            caption_boundary: true
            linger: 0.15
          - id: profile-open
            phrase: "A permitted profile of this kernel and launch"
            targets: [timing-question]
            linger: 0.15
  - id: fresh-trial
    title: "Which run would you make next?"
    visual: >-
      Count the admitted values and block arrivals at N=67. Then use a baseline, a two-edit trial and
      one missing configuration to design the next timing comparison.
    beats:
      - say: >-
          Try the edge on a different square, sixty-seven on a side. Block two, zero starts at column
          sixty-four. There are thirty-two rows in the tile and three input columns left. The block still
          has thirty-two threads across and eight down. How many values get loaded? How many threads reach
          the barrier?
        hold: 2.25
        caption_starts:
          - "How many values get loaded"
        visual_cues:
          - id: gpu-fresh-trial-premises
            phrase: "three input columns left"
            targets: [fresh-tile]
            linger: 0.15
      - say: >-
          Ninety-six values get loaded. The first three threads in each of eight warp rows load four
          values apiece. All two hundred fifty-six threads reach the barrier. An input guard decides who
          loads. Everyone must take part in the handoff.
        hold: 0.7
        visual_cues:
          - id: gpu-fresh-trial-values
            phrase: "Ninety-six values get loaded"
            targets: [fresh-answer]
            caption_boundary: true
            linger: 0.15
          - id: gpu-fresh-trial-barrier
            phrase: "All two hundred fifty-six threads reach the barrier"
            targets: [fresh-threads]
            caption_boundary: true
            linger: 0.15
      - say: >-
          The value at row one, column sixty-four is one hundred thirty-one. Warp one writes it into
          shared row one, column zero. Warp zero takes it to output row sixty-four, column one. At this
          width the output index is four thousand two hundred eighty-nine. This is the coordinate check we
          can do on the CPU.
        hold: 0.7
        visual_cues:
          - id: gpu-fresh-trial-value
            phrase: "one hundred thirty-one"
            targets: [fresh-tile]
            linger: 0.15
          - id: gpu-fresh-trial-index
            phrase: "four thousand two hundred eighty-nine"
            targets: [fresh-answer]
            linger: 0.15
      - say: >-
          One more decision. In this hypothetical trial we give the baseline a time of one hundred. A
          second kernel adds padding and doubles the block rows. Its time drops to ninety-four. To test
          padding first, which shared stride and block shape belong in the middle?
        hold: 2.25
        caption_starts:
          - "Its time drops to ninety-four"
          - "To test padding first"
        visual_cues:
          - id: gpu-fresh-trial-geometry
            phrase: "adds padding and doubles the block rows"
            targets: [trial-combined]
            linger: 0.15
          - id: gpu-fresh-trial-compound
            phrase: "Its time drops to ninety-four"
            targets: [trial-combined]
            linger: 0.15
      - say: >-
          Use stride thirty-three. Keep the block at thirty-two by eight. Compare left to
          middle to measure the effect of padding at eight rows. Hold that padded stride fixed.
          Compare middle to right to see what changes when you double the block rows. Check exact
          outputs and races for each version, then repeat the timing rounds. The next kernel to run
          is the one in the middle.
        hold: 1
        caption_starts:
          - "Keep the block at thirty-two by eight"
          - "Compare left to middle"
          - "Hold that padded stride fixed"
          - "The next kernel to run"
        visual_cues:
          - id: gpu-fresh-trial-stride
            phrase: "Use stride thirty-three"
            targets: [trial-control]
            linger: 0.15
          - id: gpu-fresh-trial-split
            phrase: "Keep the block at thirty-two by eight"
            targets: [trial-control]
            linger: 0.15
          - id: gpu-fresh-trial-decision
            phrase: "Hold that padded stride fixed"
            targets: [trial-decision]
            linger: 0.15
          - id: gpu-fresh-trial-next
            phrase: "The next kernel to run is the one in the middle"
            targets: [trial-control]
            linger: 0.15
      - say: >-
          In the next lab, the lanes combine eight values. A reduction gives you one sum. A scan
          gives you a running total at each position.
        hold: 0.8
