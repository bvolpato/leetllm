scenes:
  - id: intro
    title: "Who wrote the six?"
    visual: >-
      Open on the final write of a four-by-four transpose. Follow the six from input row one into
      the empty square. Replay the kernel on the same output and light each of its fifteen new
      writes.
    beats:
      - say: >-
          Watch the six land. Row one, column two becomes row two, column one. That last write
          completes the transpose.
        hold: 0.65
        caption_starts:
          - "Row one, column two"
        visual_cues:
          - id: copy-six
            phrase: "Watch the six land"
            targets: [copy-input, copy-transfer, copy-output]
            linger: 0.15
      - say: >-
          Run it again with the same output buffer. The GPU rewrites fifteen squares and skips the
          six. How many bit mismatches will the checker find?
        hold: 2.25
        caption_starts:
          - "How many bit mismatches"
        motion_check:
          region: [1152, 348, 544, 408]
          minimumChangedFraction: 0.002
        visual_cues:
          - id: skip-store
            phrase: "The GPU rewrites fifteen squares"
            targets: [copy-output]
            linger: 0.15
      - say: >-
          Zero mismatches. That six survived from the previous launch. What could we put there before the
          next run to make the missed store show up?
        hold: 1.7
        caption_starts:
          - "What could we put there"
        visual_cues:
          - id: stale-match
            phrase: "Zero mismatches"
            targets: [copy-status]
            caption_boundary: true
            linger: 0.15
          - id: stale-retest
            phrase: "What could we put there"
            targets: [copy-status]
            linger: 0.15
  - id: bit-contract
    title: "Checking all 32 bits"
    visual: >-
      Replay the same omitted store with the entire output poisoned. Repair it and run again. Compare
      the sign bits of two zeros to explain the exact-copy check.
    beats:
      - say: >-
          Fill every output byte with hexadecimal F F. Now every square holds a NaN. Run those same
          fifteen stores again. Look at the destination of the six. What will the checker find there?
        hold: 1.7
        visual_cues:
          - id: fresh-poison
            phrase: "Fill every output byte with hexadecimal F F"
            targets: [copy-output]
            linger: 0.15
          - id: repeat-stores
            phrase: "Run those same fifteen stores again"
            targets: [copy-output]
            linger: 0.15
      - say: >-
          The poison is still there. One word differs from the reference. A transpose swaps row and
          column between two separate arrays. To find a word in row-major order, multiply its row by
          the width and add its column. Here the value six goes from input word six to output word nine.
          Every bit has to survive that trip.
        hold: 0.6
        visual_cues:
          - id: poison-verdict
            phrase: "One word differs from the reference"
            targets: [copy-status]
            caption_boundary: true
            linger: 0.15
          - id: copy-index
            phrase: "multiply its row by the width and add its column"
            targets: [copy-input, copy-output]
            linger: 0.15
      - say: >-
          Restore the skipped store and start from fresh poison. Write the fifteen other squares, then
          write the six. This time all sixteen words match. A checksum could miss two swapped values.
          Comparing each destination with its own source catches that mistake.
        hold: 0.65
        visual_cues:
          - id: repair-reset
            phrase: "start from fresh poison"
            targets: [copy-output]
            linger: 0.15
          - id: repaired-stores
            phrase: "Write the fifteen other squares, then write the six"
            targets: [copy-output]
            linger: 0.15
          - id: repair-verdict
            phrase: "all sixteen words match"
            targets: [copy-status]
            caption_boundary: true
            linger: 0.15
      - say: >-
          An absolute error can hide a change too. Positive zero and negative zero are the same distance
          from zero. Their sign bits differ. The mismatch count rejects that copy even though its absolute
          error is zero. The GPU harness uses distinct finite integers, up to the largest value on screen.
          They all fit exactly in a float at the largest shape, four thousand ninety-six on a side.
          Testing other bit patterns, such as NaN payloads, takes other inputs.
        hold: 0.7
        visual_cues:
          - id: zero-bits
            phrase: "Their sign bits differ"
            targets: [zero-words]
            caption_boundary: true
            linger: 0.15
  - id: target-build
    title: Bind every result to the actual target
    visual: Construct a run identity from source/header hashes, target and tool versions. Attach actual
      compiler resource cells to the instantiated kernels, then mark the concrete exercised shapes.
    beats:
      - say: >-
          Build the CUDA source alongside its host checker. With pipefail enabled, a failed compile
          still fails the pipeline that writes the log. Save the source hashes with that log. Here the
          compiler built native code for an RTX fifty-seventy Ti. The driver and Toolkit versions are on
          the right. The build uses optimized C plus plus seventeen, line information for the profiler,
          and a verbose compiler resource report.
        hold: 0.65
        visual_cues:
          - id: gpu-target-build-source
            phrase: Save the source hashes
            targets:
              - gpu-target-build-source
            color: cyan
            linger: 0.45
          - id: gpu-target-build-target
            phrase: RTX fifty-seventy Ti
            targets:
              - gpu-target-build-target
            color: cyan
            linger: 0.45
      - say: >-
          Read across the tiled and padded rows. The compiler used twenty registers for naive and thirty
          for tiled and padded, with zero spill loads or stores for all three. Their static shared
          allocations show what the extra column costs. The two tiled builds each report one barrier.
          The deliberately broken build uses thirty-two registers and has no barrier. These are
          allocations per kernel. To find how many warps were resident during a launch, use a profile.
        hold: 0.65
        visual_cues:
          - id: gpu-target-build-registers
            phrase: twenty registers for naive
            targets:
              - gpu-target-build-registers
            color: cyan
            linger: 0.45
          - id: gpu-target-build-shared
            phrase: Their static shared allocations
            targets:
              - gpu-target-build-shared
            color: cyan
            linger: 0.45
          - id: gpu-target-build-barriers
            phrase: each report one barrier
            targets:
              - gpu-target-build-barriers
            color: green
            linger: 0.45
          - id: gpu-target-build-registers30
            phrase: thirty for tiled and padded
            targets:
              - gpu-target-build-registers30
            color: cyan
            linger: 0.45
          - id: gpu-target-build-registers32
            phrase: broken build uses thirty-two registers
            targets:
              - gpu-target-build-registers32
            color: cyan
            linger: 0.45
      - say: >-
          Start with the boundary shapes on screen. Thirty-one stops just short of a full tile.
          Thirty-two fills it, and thirty-three adds an edge. The four normal kernels returned zero bit
          mismatches on every listed shape, including the large timed shape. Copy moves just as many
          bytes but keeps each value at its original index. A CPU coordinate exercise can check which
          thread writes each value. Actual GPU runs supply the timing.
        hold: 0.65
        visual_cues:
          - id: gpu-target-build-shapes
            phrase: "Thirty-one stops just short of a full tile"
            targets:
              - gpu-target-build-shapes
            color: cyan
            linger: 0.45
          - id: gpu-target-build-checked
            phrase: zero bit mismatches
            targets:
              - gpu-target-build-checked
            color: cyan
            linger: 0.45
          - id: gpu-target-build-cpu
            phrase: "CPU coordinate exercise"
            targets:
              - gpu-target-build-cpu
            color: cyan
            linger: 0.45
  - id: timing-window
    title: "Which launches are on the clock?"
    visual: >-
      Show the two fresh-poison checks on either side of five warmups and the timed batch. Bracket
      the hundred timed launches with CUDA events, then alternate the order of the three kernels
      across five rounds.
    beats:
      - say: >-
          First, check one transpose on freshly poisoned output. Run five warmup launches. Start the
          CUDA timer, run one hundred launches, then record the stop event and wait for it. Check
          another transpose on fresh poison. Only those two launches get a bit check. If either
          fails, the harness leaves the timing blank and exits with code two.
        hold: 0.65
        visual_cues:
          - id: gpu-timing-window-check
            phrase: "check one transpose on freshly poisoned output"
            targets:
              - gpu-timing-window-check
            color: cyan
            linger: 0.45
          - id: gpu-timing-window-warm
            phrase: five warmup launches
            targets:
              - gpu-timing-window-warm
            color: cyan
            linger: 0.45
          - id: gpu-timing-window-batch
            phrase: "run one hundred launches"
            targets:
              - gpu-timing-window-batch
            color: cyan
            linger: 0.45
          - id: gpu-timing-window-post
            phrase: "Check another transpose on fresh poison"
            targets:
              - gpu-timing-window-post
            color: cyan
            linger: 0.45
          - id: gpu-timing-window-unchecked
            phrase: "Only those two launches get a bit check"
            targets:
              - gpu-timing-window-unchecked
            color: cyan
            linger: 0.45
      - say: >-
          Divide the event interval by one hundred for the average time per launch. Allocation,
          transfers and validation fall outside the timer. Gaps between launches fall inside and can
          dominate for a tiny matrix. For a per-call percentile, time individual launches. These
          runs reuse warm buffers. To study cold streaming, rotate through a working set larger than
          the cache.
        hold: 0.65
        visual_cues:
          - id: gpu-timing-window-mean
            phrase: "Divide the event interval by one hundred"
            targets:
              - gpu-timing-window-mean
            color: cyan
            linger: 0.45
          - id: gpu-timing-window-outside
            phrase: Allocation, transfers and validation
            targets:
              - gpu-timing-window-outside
            color: cyan
            linger: 0.45
          - id: gpu-timing-window-gaps
            phrase: "Gaps between launches"
            targets:
              - gpu-timing-window-gaps
            color: cyan
            linger: 0.45
          - id: gpu-timing-window-tail
            phrase: "time individual launches"
            targets:
              - gpu-timing-window-tail
            color: cyan
            linger: 0.45
      - say: >-
          Start a separate unprofiled process for each timing run. Alternate candidate order across
          rounds so a different kernel goes first. Save every row to see how much the times vary.
          Keep the shape, precision, block, launch count and output check fixed. Record clocks,
          temperature and competing work. On this GPU the clocks could change, and browser and
          remote-desktop processes shared the device.
        hold: 0.65
        visual_cues:
          - id: gpu-timing-window-rounds
            phrase: alternate candidate order
            targets:
              - gpu-timing-window-rounds
            color: cyan
            linger: 0.45
          - id: gpu-timing-window-allrows
            phrase: Save every row
            targets:
              - gpu-timing-window-allrows
            color: cyan
            linger: 0.45
          - id: gpu-timing-window-environment
            phrase: browser and remote-desktop processes
            targets:
              - gpu-timing-window-environment
            color: cyan
            linger: 0.45
  - id: sectors
    title: A warp can carry the same payload across more sectors
    visual: Thirty-two lane addresses generate either four adjacent or thirty-two scattered 32-byte
      sectors. A computed payload fraction changes with the mapping.
    beats:
      - say: GPU memory combines neighboring lane accesses into regions. For this scalar float model, a full
          aligned warp reads adjacent words across four thirty-two-byte sectors. The naive transpose
          reads that way, then writes with a whole matrix row between neighboring lanes. Its output
          payload becomes scattered.
        hold: 0.65
        visual_cues:
          - id: sectors-beat-1-focus-1
            phrase: For this scalar float model, a full aligned warp reads adjacent words across four
              thirty-two-byte sectors
            targets:
              - sectors-array-from-length-4-r-array-from-length-8-c-s-sectors-r-8-c
            color: cyan
            linger: 0.65
          - id: sectors-beat-1-focus-2
            phrase: a full aligned warp reads adjacent words across four thirty-two-byte sectors
            targets:
              - sectors-array-from-length-4-r-array-from-length-8-c-s-sectors-r-8-c
            color: yellow
            linger: 0.65
          - id: sectors-naive-store
            phrase: then writes with a whole matrix row between neighboring lanes
            targets:
              - sectors-s-addresses-slice-0-16-map-i-string-i-s-addresses-slice-16-map-i-str
              - sectors-array-from-length-4-r-array-from-length-8-c-s-sectors-r-8-c
            color: yellow
            linger: 0.65
      - say: Keep the useful payload fixed as we switch to adjacent output addresses. The sector footprint
          shrinks even though the operation still reads and writes the same values. This predicts a
          change at the access stage. Cache policy, merging, and write behavior determine the
          downstream device-memory traffic, so inspect counters before naming the actual bottleneck.
        hold: 0.65
        motion_check:
          region:
            - 150
            - 330
            - 1610
            - 610
          minimumChangedFraction: 0.002
        visual_cues:
          - id: sectors-beat-2-focus-1
            phrase: Keep the useful payload fixed as we switch to adjacent output addresses
            targets:
              - sectors-s-addresses-slice-0-16-map-i-string-i-s-addresses-slice-16-map-i-str
            color: cyan
            linger: 0.65
          - id: sectors-beat-2-focus-2
            phrase: The sector footprint shrinks even though the operation still reads and writes the same
              values
            targets:
              - sectors-array-from-length-4-r-array-from-length-8-c-s-sectors-r-8-c
            color: yellow
            linger: 0.65
  - id: edge-sectors
    title: Which sectors does this warp touch?
    visual: Place the same 32 lanes on a byte-address ruler. Move the starting word from 0 to 33,
      show the sector boundaries, then mask 31 lanes for an edge request.
    beats:
      - say: Move the warp to a row that begins partway through a sector. On compute capability six
          and newer, count the thirty-two-byte sectors touched by the active lanes. For
          row one at N equal to thirty-three, consecutive input words run from thirty-three through
          sixty-four. Divide the byte addresses by thirty-two and take the integer sector IDs. The
          first word is in sector four and the last in sector eight.
        hold: 0.65
        visual_cues:
          - id: gpu-edge-sectors-lanes
            phrase: consecutive input words run from thirty-three through sixty-four
            targets:
              - gpu-edge-sectors-lanes
            color: cyan
            linger: 0.45
          - id: gpu-edge-sectors-first
            phrase: first word is in sector four
            targets:
              - gpu-edge-sectors-first
            color: cyan
            linger: 0.45
          - id: gpu-edge-sectors-last
            phrase: last in sector eight
            targets:
              - gpu-edge-sectors-last
            color: cyan
            linger: 0.45
      - say: That is five sectors holding one hundred twenty-eight useful bytes, so the payload fraction is
          one hundred twenty-eight divided by one hundred sixty, or eighty percent. At a one-lane
          edge with a four-byte request, one touched sector gives twelve point five percent. Masked
          lanes make no request. Alignment and active lanes belong in the address calculation before
          comparing a counter with an ideal full-warp prediction.
        hold: 0.65
        visual_cues:
          - id: gpu-edge-sectors-five
            phrase: five sectors holding one hundred twenty-eight useful bytes
            targets:
              - gpu-edge-sectors-five
            color: cyan
            linger: 0.45
          - id: gpu-edge-sectors-ratio
            phrase: eighty percent
            targets:
              - gpu-edge-sectors-ratio
            color: cyan
            linger: 0.45
          - id: gpu-edge-sectors-one
            phrase: one-lane edge
            targets:
              - gpu-edge-sectors-one
            color: cyan
            linger: 0.45
          - id: gpu-edge-sectors-edge
            phrase: twelve point five percent
            targets:
              - gpu-edge-sectors-edge
            color: cyan
            linger: 0.45
      - say: >-
          Now scatter the stores. With a row width of four thousand ninety-six, neighboring lanes
          write sixteen thousand three hundred eighty-four bytes apart. Thirty-two distinct sectors
          carry the same one hundred twenty-eight useful bytes. That uses twelve point five percent
          of their capacity. Cache hits, merging and write policies affect how many bytes reach
          device memory. Hardware counters let us follow that traffic.
        hold: 0.65
        visual_cues:
          - id: gpu-edge-sectors-stride
            phrase: sixteen thousand three hundred eighty-four bytes
            targets:
              - gpu-edge-sectors-stride
            color: cyan
            linger: 0.45
          - id: gpu-edge-sectors-scatter
            phrase: Thirty-two distinct sectors
            targets:
              - gpu-edge-sectors-scatter
            color: cyan
            linger: 0.45
          - id: gpu-edge-sectors-fraction
            phrase: twelve point five percent
            targets:
              - gpu-edge-sectors-fraction
            color: green
            linger: 0.45
          - id: gpu-edge-sectors-scope
            phrase: Hardware counters let us follow that traffic
            targets:
              - gpu-edge-sectors-scope
            color: cyan
            linger: 0.45
  - id: logical-rate
    title: Normalize time by the unchanged work
    visual: Construct two N×N byte planes for one read and one write, sum them, divide by a supplied
      elapsed time, and keep the effective-rate label separate from an empty physical-traffic
      counter.
    beats:
      - say: >-
          One logical read and one logical write per float add up to eight bytes per value. At four
          thousand ninety-six on a side, add the size of the input and the size of the output. Together
          they come to one hundred twenty-eight mebibytes. Suppose a launch averages a quarter of a
          millisecond. Convert that time to seconds before you divide. Using decimal gigabytes, the
          effective rate is five hundred thirty-six point nine gigabytes per second.
        hold: 0.65
        caption_starts:
          - "Together they come to"
          - "Suppose a launch averages"
          - "Using decimal gigabytes"
        visual_cues:
          - id: gpu-logical-rate-readwrite
            phrase: One logical read and one logical write per float
            targets:
              - gpu-logical-rate-readwrite
            color: cyan
            linger: 0.45
          - id: gpu-logical-rate-bytes
            phrase: "add the size of the input and the size of the output"
            targets:
              - gpu-logical-rate-bytes
            color: cyan
            linger: 0.45
          - id: gpu-logical-rate-mebibytes
            phrase: "one hundred twenty-eight mebibytes"
            targets:
              - gpu-logical-rate-bytes
            color: cyan
            linger: 0.45
          - id: gpu-logical-rate-time
            phrase: "a quarter of a millisecond"
            targets:
              - gpu-logical-rate-time
            color: cyan
            linger: 0.45
          - id: gpu-logical-rate-seconds
            phrase: "Convert that time to seconds"
            targets:
              - gpu-logical-rate-time
            color: cyan
            linger: 0.45
          - id: gpu-logical-rate-rate
            phrase: five hundred thirty-six point nine
            targets:
              - gpu-logical-rate-rate
            color: green
            linger: 0.45
      - say: >-
          That quarter of a millisecond is a worksheet input. Use each measured batch average when you
          compare kernels. The logical byte count stays fixed even when a cache hit saves a trip to
          device memory or scattered stores touch extra sectors. Read the relevant hardware counters to
          estimate physical traffic or a fraction of peak bandwidth. Copy moves the same number of
          logical bytes and computes a different output.
        hold: 0.65
        visual_cues:
          - id: gpu-logical-rate-worksheet
            phrase: "worksheet input"
            targets:
              - gpu-logical-rate-worksheet
            color: cyan
            linger: 0.45
          - id: gpu-logical-rate-counter
            phrase: "hardware counters"
            targets:
              - gpu-logical-rate-counter
            color: cyan
            linger: 0.45
          - id: gpu-logical-rate-copy
            phrase: "same number of logical bytes"
            targets:
              - gpu-logical-rate-copy
            color: cyan
            linger: 0.45
  - id: profile-boundary
    title: Ask whether the profile measures this kernel
    visual: Select the intended kernel, skip its validation/warmups and trace named report sections to
      the corresponding launch. Replace the hypothetical report with the actual permission failure
      while preserving the address hypothesis.
    beats:
      - say: "Before editing, profile the intended naive kernel and confirm its name, N, block thirty-two by
          eight and selected launch. The supplied command skips six launches: one validation plus
          five warmups. It collects one matching measured launch. Changed warmup counts require
          changed selection. Full metric sets can replay work and alter timing, so profiler-run time
          stays separate from clean unprofiled timing."
        hold: 0.65
        visual_cues:
          - id: gpu-profile-boundary-target
            phrase: confirm its name, N, block thirty-two by eight
            targets:
              - gpu-profile-boundary-target
            color: cyan
            linger: 0.45
          - id: gpu-profile-boundary-skip
            phrase: skips six launches
            targets:
              - gpu-profile-boundary-skip
            color: pink
            linger: 0.45
          - id: gpu-profile-boundary-select
            phrase: one matching measured launch
            targets:
              - gpu-profile-boundary-select
            color: cyan
            linger: 0.45
          - id: gpu-profile-boundary-replay
            phrase: replay work and alter timing
            targets:
              - gpu-profile-boundary-replay
            color: cyan
            linger: 0.45
      - say: >-
          LaunchStats reports launch geometry and resources. MemoryWorkloadAnalysis separates
          requests, sectors and memory levels. SpeedOfLight compares throughput with target
          ceilings, and Occupancy reports capacity and limiters. Predict four aligned load sectors
          and thirty-two naive store sectors per full warp. To compare that prediction with a
          measurement, match the source, kernel, shape and launch in the report.
        hold: 0.65
        visual_cues:
          - id: gpu-profile-boundary-launch
            phrase: LaunchStats reports launch geometry
            targets:
              - gpu-profile-boundary-launch
            color: cyan
            linger: 0.45
          - id: gpu-profile-boundary-memory
            phrase: MemoryWorkloadAnalysis separates requests
            targets:
              - gpu-profile-boundary-memory
            color: cyan
            linger: 0.45
          - id: gpu-profile-boundary-occupancy
            phrase: Occupancy reports capacity and limiters
            targets:
              - gpu-profile-boundary-occupancy
            color: cyan
            linger: 0.45
          - id: gpu-profile-boundary-predictions
            phrase: Predict four aligned load sectors and thirty-two naive store sectors
            targets:
              - gpu-profile-boundary-predictions
            color: cyan
            linger: 0.45
          - id: gpu-profile-boundary-wrong
            phrase: "match the source, kernel, shape and launch"
            targets:
              - gpu-profile-boundary-wrong
            color: cyan
            linger: 0.45
      - say: >-
          The profiler stopped at this permission error. The account could run the kernel, but
          reading its counters required extra permission. The four counter fields are empty. With
          access, we could compare load and store sectors for this launch and follow the extra
          traffic through the memory hierarchy to find where it costs time.
        hold: 0.65
        visual_cues:
          - id: gpu-profile-boundary-error
            phrase: "this permission error"
            targets:
              - gpu-profile-boundary-error
            color: pink
            linger: 0.45
          - id: gpu-profile-boundary-none
            phrase: "The four counter fields are empty"
            targets:
              - gpu-profile-boundary-none
            color: cyan
            linger: 0.45
          - id: gpu-profile-boundary-unestablished
            phrase: "find where it costs time"
            targets:
              - gpu-profile-boundary-unestablished
            color: cyan
            linger: 0.45
  - id: tiles
    title: Use shared storage to exchange the access order
    visual: Input rows enter a shared four-by-four tile. After producer completion, output columns read
      that same tile into transposed destination positions.
    beats:
      - say: A shared-memory tile lets threads exchange positions. First load adjacent input words into
          local tile rows. Then wait for the required producers. Finally read the tile with swapped
          indexes so global output stores can also be adjacent. The same tile supports both access
          orientations without changing the mathematical output.
        hold: 0.65
        visual_cues:
          - id: tile-load-rows
            phrase: First load adjacent input words into local tile rows
            targets:
              - tile-global-input
              - tile-shared-storage
            color: cyan
            linger: 0.6
          - id: tile-wait-producers
            phrase: Then wait for the required producers
            targets:
              - tile-shared-storage
            color: yellow
            linger: 0.6
          - id: tile-transposed-reads
            phrase: Finally read the tile with swapped indexes
            targets:
              - tile-shared-storage
              - tile-global-output
            color: yellow
            linger: 0.6
      - say: Our four-by-four view compresses the larger lab tile. Every output read must have a matching
          producer, including partial boundary tiles. Bounds checks protect valid data accesses,
          while the block barrier remains outside those checks so every thread in the block reaches
          the required synchronization.
        hold: 0.65
        visual_cues:
          - id: tile-matched-producers
            phrase: Every output read must have a matching producer
            targets:
              - tile-shared-storage
              - tile-global-output
            color: cyan
            linger: 0.6
          - id: tile-all-threads-arrive
            phrase: every thread in the block reaches the required synchronization
            targets:
