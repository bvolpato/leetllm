  - id: edge-ownership
    title: "How does 65 reach the output?"
    visual: >-
      Show the single input column that fits at the right edge. Zoom in on the word 65 as warp one
      writes the shared slot and warp zero reads it. Then pair each input row with its transposed
      output column.
    beats:
      - say: >-
          On a matrix thirty-three words wide, the last tile starts at column thirty-two. Look down
          that last column. Eight rows of threads cover it in four passes, at offsets zero, eight,
          sixteen and twenty-four. They load thirty-two words into one shared column. All two
          hundred fifty-six threads reach the barrier, including the ones that skipped the load.
        hold: 0.65
        visual_cues:
          - id: gpu-edge-ownership-block
            phrase: "the last tile starts at column thirty-two"
            targets:
              - edge-column
            color: cyan
            linger: 0.45
          - id: gpu-edge-ownership-offsets
            phrase: offsets zero, eight, sixteen and twenty-four
            targets:
              - edge-column
            color: cyan
            linger: 0.45
          - id: gpu-edge-ownership-writes
            phrase: "load thirty-two words into one shared column"
            targets:
              - edge-column
            color: cyan
            linger: 0.45
          - id: gpu-edge-ownership-barrier
            phrase: All two hundred fifty-six threads
            targets:
              - edge-barrier
            color: green
            linger: 0.45
      - say: >-
          Zoom in on row one. Its last word is sixty-five. Warp one loads it and writes it into
          shared row one, column zero. After the barrier, warp zero reads that slot and carries the
          same word to output row thirty-two, column one.
        hold: 0.65
        caption_starts:
          - "Warp one loads it"
          - "After the barrier"
        visual_cues:
          - id: gpu-edge-ownership-value
            phrase: "Its last word is sixty-five"
            targets:
              - handoff-input
            color: cyan
            linger: 0.45
          - id: gpu-edge-ownership-producer
            phrase: "writes it into shared row one, column zero"
            targets: [handoff-write, handoff-shared]
            color: cyan
            linger: 0.45
          - id: gpu-edge-ownership-warp
            phrase: "Warp one loads it"
            targets: [handoff-input, handoff-write]
            color: cyan
            linger: 0.45
          - id: gpu-edge-ownership-consumer
            phrase: "warp zero reads that slot"
            targets: [handoff-shared, handoff-read]
            color: cyan
            linger: 0.45
          - id: gpu-edge-ownership-output
            phrase: carries the same word to output row thirty-two, column one
            targets: [handoff-read, handoff-output]
            color: cyan
            linger: 0.45
      - say: >-
          Now follow the whole column. Each input row becomes an output column. The same bound that
          admits an output word admits its input partner when we swap the coordinates. Check each
          pair and count one write per destination. The bounds test guards the loads and stores.
          Keep the barrier outside that test so every thread reaches it.
        hold: 0.65
        visual_cues:
          - id: gpu-edge-ownership-pair
            phrase: "Each input row becomes an output column"
            targets:
              - edge-output
            color: cyan
            linger: 0.45
          - id: gpu-edge-ownership-unique
            phrase: "Check each pair and count one write per destination"
            targets: [edge-column, edge-output]
            color: cyan
            linger: 0.45
          - id: gpu-edge-ownership-outside
            phrase: "Keep the barrier outside that test"
            targets: [edge-summary]
            color: cyan
            linger: 0.45
  - id: banks
    title: "Where does lane one find 65?"
    visual: >-
      Keep the 32 physical bank columns fixed. Route the edge warp’s distinct shared words into the
      bank below each address. Insert one padding word per row and repeat the same column read.
    beats:
      - say: >-
          Stay with the warp that writes output row thirty-two. Lane one needs the value sixty-five from
          shared row one, column zero. Each column across this strip is a bank. After thirty-two words the
          addresses wrap to the next line. Follow the first three lanes. They ask for words zero,
          thirty-two and sixty-four. Count the other lanes in the same warp. All thirty-two different
          words land in bank zero. That bank has to serve them in separate groups.
        hold: 0.8
        caption_starts:
          - "Follow the first three lanes"
          - "Count the other lanes"
          - "All thirty-two different words land in bank zero"
        visual_cues:
          - id: first-three
            phrase: "They ask for words zero, thirty-two and sixty-four"
            targets: [bank-addresses]
            linger: 0.15
          - id: other-lanes
            phrase: "Count the other lanes in the same warp"
            targets: [bank-rack]
            linger: 0.15
          - id: old-collision
            phrase: "All thirty-two different words land in bank zero"
            targets: [bank-rack]
            linger: 0.15
      - say: >-
          Insert one spare word at the end of every shared row. The stride is now thirty-three words. Keep
          lane one and its value fixed. Which bank gets that same value when the row begins one word
          later?
        hold: 2.15
        visual_cues:
          - id: new-stride
            phrase: "The stride is now thirty-three words"
            targets: [bank-addresses]
            linger: 0.15
      - say: >-
          Bank one gets word thirty-three. The next row starts one bank farther along again. Follow all
          thirty-two requests across the strip. Now each bank serves one word. The spare word in each of
          thirty-two rows costs one hundred twenty-eight extra bytes per block. The global output is
          identical. Whether that trade buys time is a question for the timer.
        hold: 0.8
        visual_cues:
          - id: new-word
            phrase: "Bank one gets word thirty-three"
            targets: [bank-addresses]
            caption_boundary: true
            linger: 0.15
          - id: padded-walk
            phrase: "Follow all thirty-two requests across the strip"
            targets: [bank-rack]
            linger: 0.15
          - id: padded-result
            phrase: "costs one hundred twenty-eight extra bytes per block"
            targets: [bank-detail]
            linger: 0.15
  - id: stride-transfer
    title: "Where does lane sixteen land?"
    visual: >-
      Change the shared stride to 34 words. Place the first sixteen requests, hold the second half,
      then place word 544 at bank zero and finish counting distinct words in all banks.
    beats:
      - say: >-
          You can make the same prediction for any column. Multiply the lane number by the stride and add
          the column. The remainder after division by thirty-two is the bank. Two lanes reading the very
          same word can share a broadcast. Here each lane needs a different word. Try a thirty-four-word
          stride, still in column zero. Count the first sixteen requests. They advance two banks at a
          time. Lane sixteen needs word five hundred forty-four. Which bank gets it?
        hold: 2.2
        visual_cues:
          - id: stride-34
            phrase: "Try a thirty-four-word stride"
            targets: [bank-addresses]
            linger: 0.15
          - id: even-banks
            phrase: "Count the first sixteen requests"
            targets: [bank-rack]
            linger: 0.15
      - say: >-
          It comes back to bank zero. Five hundred forty-four is exactly seventeen groups of thirty-two.
          Lane zero already needs word zero there. Send the remaining requests to their banks. Each used
          bank now holds two distinct requests. For a full warp the greatest common divisor of stride and
          bank count gives that multiplicity. It is two here and one for stride thirty-three. The wider
          tile spends another hundred twenty-eight bytes and still leaves a conflict.
        hold: 0.8
        visual_cues:
          - id: wrap-back
            phrase: "It comes back to bank zero"
            targets: [bank-addresses]
            caption_boundary: true
            linger: 0.15
          - id: second-half
            phrase: "Send the remaining requests to their banks"
            targets: [bank-rack]
            linger: 0.15
          - id: two-words
            phrase: "Each used bank now holds two distinct requests"
            targets: [bank-detail]
            linger: 0.15
  - id: unroll-issue
    title: What changes when you unroll the loop?
    visual: Expand the same one-thread loop into four explicit offsets. Show independent loads becoming
      ready ahead of their dependent stores, then compare authored issue schedules and compiler
      resource use for the two builds.
    beats:
      - say: Two hundred fifty-six threads cover one thousand twenty-four tile values, so each thread
          handles four rows at offsets zero, eight, sixteen and twenty-four. Independent operations
          within one thread can help hide latency, alongside work from other resident warps.
          Expanding a loop can reduce loop control and make independent loads visible before
          dependent shared stores. The timing of overlap depends on the compiled schedule and
          target.
        hold: 0.65
        visual_cues:
          - id: gpu-unroll-issue-offsets
            phrase: offsets zero, eight, sixteen and twenty-four
            targets:
              - gpu-unroll-issue-offsets
            color: cyan
            linger: 0.45
          - id: gpu-unroll-issue-loads
            phrase: independent loads visible before dependent shared stores
            targets:
              - gpu-unroll-issue-loads
            color: cyan
            linger: 0.45
      - say: >-
          Compare these two example builds. On the left the compiler unrolled the four loads on its
          own. On the right we add an unroll pragma to the same loop. Read down the two columns.
          Both have the same four loads in the same order. To test an unroll change on your GPU,
          compare the generated instructions and see whether an independent load can start earlier.
        hold: 0.65
        caption_starts:
          - "On the right"
          - "Both have the same four loads"
        visual_cues:
          - id: gpu-unroll-issue-pragma
            phrase: "the compiler unrolled the four loads on its own"
            targets:
              - gpu-unroll-issue-pragma
            color: cyan
            linger: 0.45
          - id: gpu-unroll-issue-compiler
            phrase: "we add an unroll pragma"
            targets:
              - gpu-unroll-issue-compiler
            color: cyan
            linger: 0.45
          - id: gpu-unroll-issue-assembly
            phrase: "the same four loads in the same order"
            targets:
              - gpu-unroll-issue-assembly
            color: cyan
            linger: 0.45
          - id: gpu-unroll-issue-request
            phrase: "whether an independent load can start earlier"
            targets:
              - gpu-unroll-issue-request
            color: cyan
            linger: 0.45
      - say: >-
          If a load moves earlier and its store stays put, the value stays live longer. More live values can take more
          registers, leaving room for fewer resident blocks. If a value spills, local memory holds
          it in device-backed storage, where it may hit the cache. Keep the edge guards in place.
          For a new build, compare the register and spill reports, check exact output and time the
          kernel. The timing tells you whether to keep that build.
        hold: 0.65
        visual_cues:
          - id: gpu-unroll-issue-live
            phrase: "More live values can take more registers"
            targets:
              - gpu-unroll-issue-live
            color: cyan
            linger: 0.45
          - id: gpu-unroll-issue-spills
            phrase: "If a value spills"
            targets:
              - gpu-unroll-issue-spills
            color: pink
            linger: 0.45
          - id: gpu-unroll-issue-measure
            phrase: "check exact output and time the kernel"
            targets:
              - gpu-unroll-issue-measure
            color: cyan
            linger: 0.45
          - id: gpu-unroll-issue-notrun
            phrase: "compare the register and spill reports"
            targets:
              - gpu-unroll-issue-notrun
            color: cyan
            linger: 0.45
  - id: resource-budget
    title: How many blocks fit?
    visual: Pack whole blocks against register, shared-memory and warp limits. Raise the example
      register count from 40 to 56 per thread and show which limit changes.
    beats:
      - say: >-
          Occupancy tells us what fraction of a streaming multiprocessor’s warp slots are in use. A
          block needs room for all its threads, registers, shared memory and barriers at once. The
          GPU allocates resources in chunks. An extra hundred twenty-eight shared bytes can push a
          block into the next chunk. If that crowds out a block, fewer warps can run together.
        hold: 0.65
        visual_cues:
          - id: gpu-resource-budget-limits
            phrase: "threads, registers, shared memory and barriers"
            targets:
              - gpu-resource-budget-limits
            color: cyan
            linger: 0.45
          - id: gpu-resource-budget-granularity
            phrase: "allocates resources in chunks"
            targets:
              - gpu-resource-budget-granularity
            color: cyan
            linger: 0.45
      - say: >-
          Try the three budgets on screen. Our example has sixty-five thousand five hundred
          thirty-six registers, sixty-four kibibytes of shared memory and room for sixty-four
          warps. Count whole blocks of two hundred fifty-six threads, before allocation rounding.
          At forty registers per thread, each block needs ten thousand two hundred forty registers.
          Six blocks fit. The padded tile fits fifteen blocks by shared storage, and the warp
          ceiling permits eight. Take the smallest count. Six blocks give us forty-eight warps, or
          seventy-five percent of the available warp slots.
        hold: 0.65
        caption_starts:
          - "Six blocks fit"
          - "Six blocks give us"
        visual_cues:
          - id: gpu-resource-budget-worksheet
            phrase: three budgets on screen
            targets:
              - gpu-resource-budget-worksheet
            color: cyan
            linger: 0.45
          - id: gpu-resource-budget-registers
            phrase: forty registers per thread
            targets:
              - gpu-resource-budget-registers
            color: cyan
            linger: 0.45
          - id: gpu-resource-budget-regblocks
            phrase: Six blocks fit
            targets:
              - gpu-resource-budget-regblocks
            color: cyan
            linger: 0.45
          - id: gpu-resource-budget-shared
            phrase: fifteen blocks by shared storage
            targets:
              - gpu-resource-budget-shared
            color: cyan
            linger: 0.45
          - id: gpu-resource-budget-warps
            phrase: warp ceiling permits eight
            targets:
              - gpu-resource-budget-warps
            color: cyan
            linger: 0.45
          - id: gpu-resource-budget-minimum
            phrase: forty-eight warps
            targets:
              - gpu-resource-budget-minimum
            color: cyan
            linger: 0.45
          - id: gpu-resource-budget-fraction
            phrase: seventy-five percent
            targets:
              - gpu-resource-budget-fraction
            color: green
            linger: 0.45
      - say: >-
          Raise the register count to fifty-six per thread. Now the register budget fits four
          blocks, or thirty-two warps and fifty percent of the worksheet’s capacity. On the actual
          GPU, read the occupancy limiter. If shared storage fills first, try a smaller tile. If
          registers fill first and values spill, shorten their lifetimes. If there are too few
          blocks, split the work into more blocks. Time each change on its own.
        hold: 0.65
        visual_cues:
          - id: gpu-resource-budget-registers2
            phrase: fifty-six per thread
            targets:
              - gpu-resource-budget-registers2
            color: cyan
            linger: 0.45
          - id: gpu-resource-budget-blocks2
            phrase: fits four blocks
            targets:
              - gpu-resource-budget-blocks2
            color: cyan
            linger: 0.45
          - id: gpu-resource-budget-fraction2
            phrase: fifty percent
            targets:
              - gpu-resource-budget-fraction2
            color: green
            linger: 0.45
          - id: gpu-resource-budget-scope
            phrase: "read the occupancy limiter"
            targets:
              - gpu-resource-budget-scope
            color: cyan
            linger: 0.45
  - id: barrier
    title: "One shared word, two warps"
    visual: >-
      Follow the value 65 in shared slot [1,0], the consuming thread’s register and B[32,1]. Replay the
      same transfer with the block barrier restored.
    beats:
      - say: >-
          Take the barrier out of the padded kernel. Here is one possible order for the two warps we
          followed at the edge. Warp zero reads the shared slot first. Its thread keeps whatever it found
          in a register. Now warp one writes sixty-five into the slot. Look at the register. What value
          will warp zero store?
