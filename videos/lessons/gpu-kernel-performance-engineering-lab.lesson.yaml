        visual_cues:
          - id: early-read
            phrase: "Warp zero reads the shared slot first"
            targets: [barrier-register]
            linger: 0.15
          - id: late-write
            phrase: "warp one writes sixty-five into the slot"
            targets: [barrier-shared]
            linger: 0.15
      - say: >-
          It stores the value it read earlier. The question mark means we cannot predict those bits. A
          later write to shared memory cannot update a register. Another schedule might produce the right
          matrix by chance.
        hold: 0.8
        visual_cues:
          - id: early-store
            phrase: "It stores the value it read earlier"
            targets: [barrier-output]
            caption_boundary: true
            linger: 0.15
      - say: >-
          Start the tile again with the barrier restored. Warp one writes sixty-five. All two hundred
          fifty-six threads reach the barrier, including the threads whose input loads were masked. Warp
          zero can now read sixty-five. Its store sends sixty-five to the output. Both schedules used
          valid addresses. To check this repair, inspect shared-memory race reports as well as exact
          outputs and memory errors.
        hold: 0.8
        visual_cues:
          - id: restart-slot
            phrase: "Start the tile again with the barrier restored"
            targets: [barrier-events]
            linger: 0.15
