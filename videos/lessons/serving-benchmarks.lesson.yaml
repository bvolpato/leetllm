scenes:
  - id: intro
    title: When can the next question leave?
    visual: A help desk reply releases the client's next message. Follow the same handoff on a clock,
      then replay the service times against six independent sends.
    beats:
      - say: Is checkout down? This test client has its next question ready. When the reply comes back,
          it sends “Since when?” Now slow the replies. Question three goes out at one second. Its answer
          takes another second. Can question four leave before the two-second window closes?
        hold: 2.4
        caption_starts:
          - When the reply comes back
          - Now slow the replies
          - Can question four leave
        visual_cues:
          - id: desk-client
            phrase: When the reply comes back
            targets:
              - desk-client
            color: cyan
            linger: 0.35
          - id: desk-follow-up
            phrase: it sends
            targets:
              - desk-client
            color: cyan
            linger: 0.35
          - id: desk-slowdown
            phrase: Now slow the replies
            targets:
              - desk-client
            color: yellow
            linger: 0.35
      - say: Right at the cutoff. Only three sends count. Now replay the same
          slow replies and send three questions a second on the desk’s clock. Six go out before the
          cutoff. Look at how many are still waiting for a reply when the next one leaves.
        hold: 1.1
        caption_starts:
          - Six go out before the cutoff
        visual_cues:
          - id: desk-cutoff
            phrase: Right at the cutoff
            targets:
              - desk-client
            color: cyan
            linger: 0.35
          - id: desk-count
            phrase: Only three sends count
            targets:
              - desk-client
            color: cyan
            linger: 0.35
            caption_boundary: true
          - id: desk-schedule
            phrase: send three questions a second on the desk’s clock
            targets:
              - desk-clock
            color: cyan
            linger: 0.35
          - id: desk-six
            phrase: Six go out before the cutoff
            targets:
              - desk-clock
            color: cyan
            linger: 0.35
      - say: To size the server, replay the desk’s arrivals. One waiting client tells you what one person
          experiences. The desk’s own clock tests whether the server can keep up as more people arrive.
        hold: 0.7
        visual_cues:
          - id: desk-replay
            phrase: Replay the desk’s arrivals
            targets:
              - desk-clock
            color: cyan
            linger: 0.35
            caption_boundary: true
  - id: workload-freeze
    title: Which questions arrive together?
    visual: The six synthetic request IDs retain their due times. Prompt lengths share a linear scale,
      with class, prefix and the natural-stop output cap on each row.
    beats:
      - say: Keep six questions in two seconds. This time they’re for an incident assistant, and three
          arrive in a burst. These are synthetic records for the local scorer. Look at the lengths of
          the prompts the assistant has to read. Which question arrives right behind the longest prompt?
        hold: 1.8
        visual_cues:
          - id: workload-lengths
            phrase: Look at the lengths of the prompts the assistant has to read
            targets:
              - workload-pair
            color: cyan
            linger: 0.35
      - say: Request three brings over four thousand tokens. Just sixty milliseconds later, a short question
          is due. Those two can compete for service. Request five brings background work. One, two and
          six share a runbook prefix that a compatible warm cache could reuse.
        hold: 0.7
        caption_starts:
          - Just sixty milliseconds later
        visual_cues:
          - id: workload-neighbors
            phrase: Just sixty milliseconds later, a short question is due
            targets:
              - workload-pair
            color: yellow
            linger: 0.35
      - say: Keep the prompts the application actually sends, including retrieved context and conversation
          history. Pin the tokenizer and chat template. The cap tells you how long an answer may grow.
          Save the length it actually reached as well. Forcing every answer to its cap tests scheduler
          behavior and changes the task.
        hold: 0.6
        visual_cues:
          - id: workload-cap
            phrase: The cap tells you how long an answer may grow
            targets:
              - workload-rows
            color: cyan
            linger: 0.35
      - say: Save the realized trace and hash its bytes. A new library version can produce different rows from
          the same seed. The download here has schedules and classes. To replay against a server, you
          also need the prompt content. Compare length tails, output lengths, traffic classes and
          conversation dependencies with your own traffic. BurstGPT and ServeGen offer other workload
          patterns to test.
        hold: 0.6
        visual_cues:
          - id: workload-file
            phrase: The download here has schedules and classes
            targets:
              - workload-rows
            color: cyan
            linger: 0.35
  - id: arrival-schedule
    title: When does the next request go out?
    visual: Request three occupies a client slot through 1220 ms. The stored schedule sends request four
      at 765 ms while a single user waits for completion and another 80 ms of think time.
    beats:
      - say: Follow those two neighboring questions. The long request is still open when the clock calls for
          request four. With a free client slot, four goes out almost exactly on schedule. The long
          question can finish whenever it finishes. That’s an open-loop test.
        hold: 0.8
        visual_cues:
          - id: arrival-independent
            phrase: four goes out almost exactly on schedule
            targets:
              - arrival-due
            color: cyan
            linger: 0.35
      - say: Give one virtual user those same questions. This user waits for the answer, then thinks for
          eighty milliseconds. The next send moves all the way to thirteen hundred. In this closed-loop
          test, a slow answer changes when the next question arrives.
        hold: 0.8
        visual_cues:
          - id: arrival-think
            phrase: then thinks for eighty milliseconds
            targets:
              - arrival-client
            color: yellow
            linger: 0.35
      - say: Use the independent schedule to test an offered rate. Keep its due time even if the client falls
          behind. That gives us two marks for request four, when it was due and when it actually left.
        hold: 0.6
        visual_cues:
          - id: arrival-replay
            phrase: when it was due and when it actually left
            targets:
              - arrival-due
            color: cyan
            linger: 0.35
  - id: generator-clock
    title: Where did the wait go?
    visual: Fix the scheduled time and first token. Slide only the send mark, then read the growing
      schedule lag and shrinking send-relative first-token wait.
    beats:
      - say: Zoom in on request four. The client sent it five milliseconds late. From there it waited two
          hundred eighty-five milliseconds for the first token. All three marks come from the same
          monotonic client clock.
        hold: 0.8
        visual_cues:
          - id: generator-base
            phrase: five milliseconds late
            targets:
              - generator-ruler
            color: cyan
            linger: 0.35
      - say: Hold the first token and the due time still. Move just the send to eight hundred. The first-token
          wait now looks shorter. With a twenty-millisecond lag budget, would you accept this run as a
          test of the scheduled load?
        hold: 2.4
        visual_cues:
          - id: generator-send-delay
            phrase: Move just the send to eight hundred
            targets:
              - generator-ruler
            color: yellow
            linger: 0.35
      - say: The token arrived at the same instant. Starting later shortens the measured wait to two hundred
          fifty milliseconds. The client sent the request forty milliseconds late, twice its budget.
          Keep the request in the report and rerun the load test.
        hold: 0.9
        visual_cues:
          - id: generator-verdict
            phrase: forty milliseconds late, twice its budget
            targets:
              - generator-ruler
            color: yellow
            linger: 0.35
            caption_boundary: true
      - say: When late or missing requests hide part of the intended wait, you have coordinated omission. Keep
          delayed and unsent requests in the offered count. Check the generator’s CPU, connections,
          memory and event loop. A wait in the client queue tells you about client backpressure. To
          locate a server queue, use server-local spans. Joining absolute times across machines takes
          measured clock synchronization.
        hold: 0.7
        visual_cues:
          - id: generator-backpressure
            phrase: client backpressure
            targets:
              - generator-ruler
            color: cyan
            linger: 0.35
  - id: rate-and-concurrency
    title: Read arrival rate beside in-flight work
    visual: A three-second timed cohort shows requests enter every third of a second and exit 900 milliseconds
      later. The highlighted live count changes over time; integrating those intervals gives a 2.7-request
      average.
    beats:
      - say: Requests per second describes arrivals. Concurrency describes requests in flight. Burstiness describes
          how arrivals cluster. A benchmark needs all three to resemble the traffic it aims to represent.
        hold: 0.55
        visual_cues:
          - id: rate-and-concurrency-beat-1-focus-1
            phrase: Concurrency describes requests in flight
            targets:
              - rate-and-concurrency-time-s-in-flight
            color: cyan
            linger: 0.65
      - say: In a stable system, Little’s law relates average in-flight work to admitted arrival rate times average
          time in the same system. Our supplied periodic example averages two point seven active requests over
          three seconds, matching three requests per second times zero point nine seconds. A cap of two cannot
          contain that mean; a cap of three may still bind bursts.
        hold: 0.65
        visual_cues:
          - id: rate-and-concurrency-beat-2-focus-1
            phrase: Little’s law relates average in-flight work to admitted arrival rate times average time in the same
              system
            targets:
              - rate-active-intervals
              - rate-average-calculation
            color: cyan
            linger: 0.65
      - say: That relationship is a consistency check across a steady observation window. A growing queue shows
          arrivals outpacing service; measure stable performance after the backlog stops growing. Report
          scheduled, sent, completed, and still-pending requests separately. A bursty arrival pattern or
          accumulating work changes what the average can tell us.
        hold: 0.65
        visual_cues:
          - id: rate-and-concurrency-beat-3-focus-1
            phrase: Report scheduled, sent, completed, and still-pending requests separately
            targets:
              - rate-and-concurrency-time-s-in-flight
            color: cyan
            linger: 0.65
  - id: arrival-families
    title: How closely do arrivals bunch together?
    visual: Transform equal-rate regular gaps into exponential and Gamma gaps, retain the sampled timestamps, then
      compress the exact trace and expose the changed duration.
    beats:
      - say: At the same mean rate, regular spacing has gap coefficient of variation zero; a Poisson process has
          exponential gaps with coefficient one. Gamma shape k has coefficient one divided by the square root
          of k. Shape one quarter gives coefficient two, while shape four gives one half. Real correlated
          bursts can differ from every one of these models.
        hold: 0.65
        visual_cues:
          - id: arrival-families-beat-0
            phrase: At the same mean rate, regular spacing has gap coefficient of variation zero; a Poisson process has
              exponential gaps with coefficient one
            targets:
              - arrival-families-mechanism
            color: cyan
            linger: 0.65
      - say: The last of these six requests lands at one point six nine seconds. Watch this constant-rate vLLM run
          stretch the sampled Gamma gaps. At three requests a second, it puts the last arrival at exactly
          two seconds, six divided by three. Even with exponential gaps, that final time is now fixed.
          In self-timed replay, the saved timestamps set every arrival.
        hold: 0.65
        visual_cues:
          - id: arrival-families-beat-1
            phrase: stretch the sampled Gamma gaps
            targets:
              - arrival-families-mechanism
            color: yellow
            linger: 0.65
      - say: Halve the gaps in this saved trace. The same requests arrive in the same order, twice as
          fast. Extend the trace to test for the same duration, or report the shorter window. At infinite
          rate, everything goes out together, up to the client’s concurrency cap. MLPerf makes a similar
          choice of clocks. Single Stream waits for completion. Server uses Poisson arrivals.
        hold: 0.65
        visual_cues:
          - id: arrival-families-beat-2
            phrase: Halve the gaps in this saved trace
            targets:
              - arrival-families-mechanism
            color: cyan
            linger: 0.65
          - id: family-time-scale
            phrase: Halve the gaps in this saved trace
            targets:
              - arrival-families-mechanism
            color: yellow
            linger: 0.6
  - id: run-window
    title: The arrival window closes before the last outcome
    visual: Build readiness→warmup→[0,2000)arrival window→2500drain clock while every offered request retains its
      identity; compare a separate completion interval population.
    beats:
      - say: "Give the run four explicit phases: readiness, warmup, measurement and drain. Warmup can include
          connections, compilation, graph capture and scheduler initialization. Warm prefix entries only when
          the scenario is supposed to begin with them warm."
        hold: 0.65
        visual_cues:
          - id: run-window-beat-0
            phrase: "Give the run four explicit phases: readiness, warmup, measurement and drain"
            targets:
              - run-window-mechanism
            color: cyan
            linger: 0.65
      - say: Our arrival cohort includes requests scheduled in the half-open interval from zero through, but
          excluding, two thousand milliseconds. Stop new arrivals there, then retain every request through
          terminal success, rejection, cancellation, error or its predeclared timeout. Request six times out
          at twenty-five hundred. A later answer does not undo that client timeout.
        hold: 0.65
        visual_cues:
          - id: run-window-beat-1
            phrase: Our arrival cohort includes requests scheduled in the half-open interval from zero through, but
              excluding, two thousand milliseconds
            targets:
              - run-window-mechanism
            color: yellow
            linger: 0.65
      - say: "The finite cohort horizon runs from the window start through the later of window end and last terminal
          outcome: here two point five seconds. A completion-interval report instead counts outcomes inside
          its interval, including earlier arrivals. Keep its starting and ending outstanding work. Mixing
          those populations and elapsed times changes the rate. Finite cohort rates including drain are not
          sustainable-capacity estimates."
        hold: 0.65
        visual_cues:
          - id: run-window-beat-2
            phrase: "The finite cohort horizon runs from the window start through the later of window end and last
              terminal outcome: here two point five seconds"
            targets:
              - run-window-mechanism
            color: cyan
            linger: 0.65
      - say: For sustained load, compare admitted, completed, rejected and timed-out rates and outstanding work over
          time. A flat server queue can result from aggressive rejection while users fail. Repeat long enough
          to expose relevant warmup, cache, thermal and traffic cycles.
        hold: 0.65
        visual_cues:
          - id: run-window-beat-3
            phrase: For sustained load, compare admitted, completed, rejected and timed-out rates and outstanding work
              over time
            targets:
              - run-window-mechanism
            color: yellow
            linger: 0.65
  - id: stream-timing
    title: Follow one answer to its last event
    visual: The send starts one clock. Five client-observed token marks expose a long middle gap. The
      clock continues after the fifth token until the terminal event.
    beats:
      - say: Take request one. The clock starts when the client sends it. Now run the clock to the first
          token. The client spent two hundred forty milliseconds waiting for output to begin.
        hold: 0.7
        visual_cues:
          - id: stream-first
            phrase: run the clock to the first token
            targets:
              - stream-start
            color: cyan
            linger: 0.35
      - say: Let the other four tokens arrive. Look at the space between tokens three and four. That gap lasts
          three times as long as its neighbors. Spread the same elapsed time across all four gaps and
          the mean is sixty milliseconds. Keep the gaps in order if you want to know what the reader
          experienced.
        hold: 0.9
        visual_cues:
          - id: stream-rest
            phrase: Let the other four tokens arrive
            targets:
              - stream-arrivals
            color: cyan
            linger: 0.35
          - id: stream-mean
            phrase: the mean is sixty milliseconds
            targets:
              - stream-arrivals
            color: yellow
            linger: 0.35
      - say: The text is complete, but the request is still open. Wait for the terminal event. The last token
          came at four eighty. The client finished at five hundred milliseconds. Use that last mark for
          terminal end-to-end latency.
        hold: 0.7
        visual_cues:
          - id: stream-done
            phrase: Wait for the terminal event
            targets:
              - stream-arrivals
            color: cyan
            linger: 0.35
  - id: single-token
    title: One token has no pacing interval
    visual: Preserve the same clock and add r02 send125/token295/terminal310; remove the absent denominator term
      without substituting zero.
    beats:
      - say: For n output tokens, request-mean time per output token is final-token time minus first-token time,
          divided by n minus one. End-to-end terminal latency is terminal time minus send. Inter-token latency
          retains each consecutive gap separately.
        hold: 0.65
        visual_cues:
          - id: single-token-beat-0
            phrase: For n output tokens, request-mean time per output token is final-token time minus first-token time,
              divided by n minus one
            targets:
              - single-token-mechanism
            color: cyan
            linger: 0.65
      - say: Request two is sent at one hundred twenty-five, emits its one observed token at two hundred ninety-five,
          and completes at three hundred ten. Its first-token wait is one hundred seventy milliseconds. There
          are zero inter-token intervals, so its TPOT is undefined. This scorer records null, excludes it from
          TPOT percentiles, and declares that criterion not applicable while still checking success,
          first-token wait and quality.
        hold: 0.65
        visual_cues:
          - id: single-token-beat-1
            phrase: Request two is sent at one hundred twenty-five, emits its one observed token at two hundred
              ninety-five, and completes at three hundred ten
            targets:
              - single-token-mechanism
            color: yellow
            linger: 0.65
          - id: single-null
            phrase: There are zero inter-token intervals
            targets:
              - single-token-mechanism
            color: yellow
            linger: 0.6
      - say: An empty successful stream is invalid under this lesson’s text-response contract; another endpoint can
          define a different contract. Equal token timestamps are allowed when the clock has finite
          resolution. These rules must be chosen before outcomes are scored.
        hold: 0.65
        visual_cues:
          - id: single-token-beat-2
            phrase: An empty successful stream is invalid under this lesson’s text-response contract; another endpoint can
              define a different contract
            targets:
              - single-token-mechanism
            color: cyan
            linger: 0.65
  - id: chunk-boundaries
    title: What did the client actually receive?
    visual: Two aligned observation tracks build a single visible reply. Three real token events precede
      or coincide with the first text chunk. A separate terminal event leaves the reply text intact.
    beats:
      - say: Replay that answer with two instruments. The upper trace can see individual tokens. Watch the
          first three tokens reach the first text chunk. Down below, the screen fills in three words at
          once. The client has one timestamp for that piece of text.
        hold: 0.85
        visual_cues:
          - id: chunk-first
            phrase: Watch the first three tokens reach the first text chunk
            targets:
              - chunk-client
            color: cyan
            linger: 0.35
      - say: Now the answer and its period arrive together in the next chunk. The client saw a hundred and
          sixty milliseconds between chunks. If you had only those two deliveries, you could report the
          visible pause. Splitting it into token-sized pieces would invent times that the client never
          observed.
        hold: 0.85
        visual_cues:
          - id: chunk-next
            phrase: the answer and its period arrive together in the next chunk
            targets:
              - chunk-client
            color: cyan
            linger: 0.35
      - say: The terminal message arrives last. The request closes and the words on screen stay exactly as
          they were. Pick the instrument that can see the event your metric names.
        hold: 0.7
        visual_cues:
          - id: chunk-end
            phrase: The terminal message arrives last
            targets:
              - chunk-client
            color: cyan
            linger: 0.35
  - id: adapter-contract
    title: A metric name does not identify its end event
    visual: Retain aligned token/chunk/metadata lanes, inspect a pinned choices-bearing emptycontent event and a
      separate Responsesreasoningdelta; show clientqueue addition as a separate span.
    beats:
      - say: TCP reads, server-sent events and text chunks are different boundaries. An adapter reconstructs the
          protocol, retains timestamps and recognizes terminal and error events. A content chunk with several
          tokens gives one observed arrival; dividing its delay by a token count invents internal token times.
          First byte, first content chunk, server token emission and client token arrival answer different
          questions.
        hold: 0.65
        visual_cues:
          - id: adapter-contract-beat-0
            phrase: TCP reads, server-sent events and text chunks are different boundaries
            targets:
              - adapter-contract-mechanism
            color: cyan
            linger: 0.65
      - say: The pinned October source inspection found vLLM completion and chat clients timestamping nonempty choices
          lists, even if their content is empty. Their reported latency ends at the last such event; later
          usage-only events and the done marker do not extend it. The Responses client instead timestamps text
          and reasoning deltas. A metric named ITL or end-to-end latency therefore need not mean individual
          visible-token gaps or terminal completion.
        hold: 0.65
        visual_cues:
          - id: adapter-contract-beat-1
            phrase: The pinned October source inspection found vLLM completion and chat clients timestamping nonempty
              choices lists, even if their content is empty
            targets:
              - adapter-contract-mechanism
            color: yellow
            linger: 0.65
          - id: adapter-choices
            phrase: even if their content is empty
            targets:
              - adapter-contract-mechanism
            color: yellow
            linger: 0.6
          - id: adapter-end
            phrase: later usage-only events and the done marker do not extend it
            targets:
              - adapter-contract-mechanism
            color: yellow
            linger: 0.6
      - say: With a client concurrency cap and finite rate, the inspected benchmark adds client queue time to that
          adapter latency for its including-client-queue summary. This does not independently measure
          scheduling lateness or change the adapter’s terminal boundary. The summary uses successful requests
          and is omitted at infinite rate. Preserve the endpoint, event rules, token-count source and exact
          installed adapter version alongside each comparison.
        hold: 0.65
        visual_cues:
          - id: adapter-contract-beat-2
            phrase: With a client concurrency cap and finite rate, the inspected benchmark adds client queue time to that
              adapter latency for its including-client-queue summary
            targets:
              - adapter-contract-mechanism
            color: cyan
            linger: 0.65
  - id: playback-deadlines
    title: Which stream can the reader follow?
    visual: Two token streams advance on a single clock. Stop both at token four’s deadline. Resume to
      expose the missing arrival, with all three timestamp series left in view.
    beats:
      - say: Play two recordings for the same reader. The reader wants token one at three hundred
          milliseconds, then one more token every eighty. Each gold tick marks when a particular token
          is due. The two rows underneath show when each client actually has it.
        hold: 0.7
        visual_cues:
          - id: reader-cadence
            phrase: then one more token every eighty
            targets:
              - reader-grid
            color: yellow
            linger: 0.35
      - say: Start both recordings and stop when the reader needs token four. Look for the fourth dot in each
          row. Which reader can keep going?
        hold: 2.7
        visual_cues:
          - id: reader-to-four
            phrase: Start both recordings and stop when the reader needs token four
            targets:
              - reader-grid
            color: yellow
            linger: 0.35
      - say: Run A already has token four. The gap after token three lasted a hundred and twenty milliseconds.
          Even so, the fourth token arrived a hundred milliseconds before the reader needed it. Those
          early arrivals bought some slack. All five tokens in A make their deadlines.
        hold: 1
        caption_starts:
          - The gap after token three
          - Even so, the fourth token
          - Those early arrivals
        visual_cues:
          - id: reader-gap
            phrase: The gap after token three lasted a hundred and twenty milliseconds
            targets:
              - reader-run-a
            color: cyan
            linger: 0.35
          - id: reader-slack
            phrase: a hundred milliseconds before the reader needed it
            targets:
              - reader-run-a
            color: cyan
            linger: 0.35
      - say: Let the clock finish. In run B, token four was due at five forty. It arrived at five eighty,
          forty milliseconds late. Token five catches up. That last short gap brings the mean back to
          eighty milliseconds per token. The average loses the wait the reader just felt.
        hold: 1.3
        visual_cues:
          - id: reader-finish
            phrase: Let the clock finish
            targets:
              - reader-run-b
            color: pink
            linger: 0.35
          - id: reader-late
            phrase: forty milliseconds late
            targets:
              - reader-run-b
            color: pink
            linger: 0.35
            caption_boundary: true
          - id: reader-mean
            phrase: eighty milliseconds per token
            targets:
              - reader-run-b
            color: pink
            linger: 0.35
        caption_starts:
          - In run B, token four was due
          - It arrived at five eighty
          - Token five catches up
          - That last short gap
      - say: We kept the gold ticks fixed so you could compare the recordings. Etalon’s fluidity index counts
          how many deadlines a stall crosses. One stall can cross several. It then restarts the clock
          from the late arrival. With our reading speed, the next token would be due at six sixty.
          Etalon can also set the first-token deadline from the prompt length. Use the declared algorithm
          to score fluidity.
        hold: 0.8
        visual_cues:
          - id: reader-fixed
            phrase: We kept the gold ticks fixed
            targets:
              - reader-grid
            color: yellow
            linger: 0.35
          - id: reader-reset
            phrase: With our reading speed, the next token would be due at six sixty
            targets:
              - reader-policy
            color: yellow
            linger: 0.35
  - id: request-denominator
    title: Keep failures in the offered cohort
