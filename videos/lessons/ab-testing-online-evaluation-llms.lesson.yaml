      identities.
    beats:
      - say: Independent null tests each at five percent produce family error one minus the quantity point nine five
          raised to the number of tests. With twenty tests that is about sixty-four percent. Correlation
          changes that number. Predeclare the primary claim and choose the exploratory-family criterion before
          reading wins.
