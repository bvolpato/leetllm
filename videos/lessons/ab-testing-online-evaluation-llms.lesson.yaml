  - id: looks
    title: Four scheduled chances to stop
    visual: Each look receives one share of the error budget. Observed p-values arrive in order. The held
      second and third receipts ask whether to stop. The fourth stays empty.
    beats:
      - say: Suppose the prompts really work equally well. Each time we check for a difference, ordinary
          sampling noise gets another chance to look convincing. Before enrollment the team schedules four
          looks and splits a five percent false-alarm budget equally among them. Each look gets one and a
          quarter percent. Its p-value must be at most point zero one two five to stop. The first p-value
          is point two three. We keep collecting.
        hold: 0.8
        visual_cues:
          - id: looks-planned-budget
            phrase: splits a five percent false-alarm budget equally among them
            targets:
              - look-1
              - look-2
              - look-3
              - look-4
            color: yellow
            linger: 0.32
          - id: looks-first-receipt
            phrase: The first p-value is point two three
            targets:
              - look-1-calculation
            color: cyan
            linger: 0.32
      - say: The second p-value is point zero three six. That's small enough to catch your eye if you usually
          look for point zero five. Under the plan on the screen, do we stop here or keep collecting?
        hold: 2.3
        visual_cues:
          - id: looks-second-receipt
            phrase: The second p-value is point zero three six
            targets:
              - look-2-calculation
            color: cyan
            linger: 0.32
      - say: Keep collecting. Point zero three six clears the ordinary five percent threshold and misses the
          smaller share we actually set aside. At the third look the p-value is point zero zero eight. Do
          we stop here?
        hold: 2.2
        visual_cues:
          - id: looks-second-crossing
            phrase: Keep collecting
            targets:
              - look-2-calculation
            color: yellow
            linger: 0.32
          - id: looks-third-receipt
            phrase: At the third look the p-value is point zero zero eight
            targets:
              - look-3-calculation
            color: cyan
            linger: 0.32
            caption_boundary: true
      - say: Stop at look three. Its p-value fits inside the registered share. The fourth slot stays empty
          because the experiment just stopped. A crossing supports a difference under this design. To
          decide on release, we still need its direction and size, along with the guardrails. Exploratory
          metrics have their own planned correction.
        hold: 1
        visual_cues:
          - id: looks-third-crossing
            phrase: Stop at look three
            targets:
              - planned-stop
            color: yellow
            linger: 0.32
  - id: valid-looking
    title: When can the experiment stop?
    visual: A second replay fixes the observed p-value on a ruler. Replacing the planned four with the
      observed two moves a proposed boundary past the same observation.
    beats:
      - say: Try the rule on a different second look. The plan still allows four looks. The first came in high
          again. This time the second p-value is point zero one six. Keep your eye on that dot.
        hold: 0.65
        visual_cues:
          - id: divisor-value
            phrase: the second p-value is point zero one six
            targets:
              - divisor-ruler
            color: cyan
            linger: 0.32
      - say: We've collected data twice. Someone pencils in two as the divisor. That moves the boundary to point
          zero two five, beyond the dot. With that dot at point zero one six, should the team stop or keep
          collecting?
        hold: 2.4
        visual_cues:
          - id: divisor-two
            phrase: pencils in two as the divisor
            targets:
              - divisor-ruler
            color: yellow
            linger: 0.32
      - say: Use the registered boundary and keep collecting. Four opportunities were in the plan when the first
          user arrived. With a valid null p-value at every scheduled look, the chance of any false alarm
          is at most the sum of those four shares. That's the union bound. It holds even when the looks
          use overlapping users.
        hold: 0.8
        visual_cues:
          - id: divisor-keep
            phrase: Use the registered boundary and keep collecting
            targets:
              - divisor-ruler
            color: yellow
            linger: 0.32
      - say: The team could instead choose one final sample size or enrollment period with time for follow-up.
          For a few interim decisions, an O'Brien-Fleming design spends more of its error budget late. Its
          boundaries depend on the design. Always-valid methods can support continuous monitoring. Choose
          the method before traffic starts. Adding unscheduled looks changes the chance of a false alarm
          by an amount that depends on the test and the looks.
        hold: 0.8
        visual_cues:
