      - say: Watch the imbalance grow under the same total enrollment. The chi-square statistic compares observed and
          expected arm counts. A diagnostic crossing means investigate before promotion; it does not identify
          the cause. Passing this check also cannot detect symmetric data loss or every bias, so keep the full
          path from assignment to mature outcome inspectable.
        hold: 0.65
        visual_cues:
          - id: ratio-beat-2-focus-1
            phrase: The chi-square statistic compares observed and expected arm counts
            targets:
              - ratio-arm-counts
            color: cyan
            linger: 0.65
