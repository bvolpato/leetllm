            phrase: With twenty tests that is about sixty-four percent
            targets:
              - oa-metric-family-mechanism
            color: cyan
            linger: 0.4
      - say: Bonferroni multiplies each p-value by the family size and caps at one. It controls any-false-rejection
          probability under arbitrary dependence when each test is valid. Benjamini-Hochberg sorts p-values,
          multiplies by family size divided by rank, then takes cumulative minima from the largest rank back
          to the smallest.
