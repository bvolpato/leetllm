version: 1
id: ab-testing-online-evaluation-llms
title: Find Out Whether an AI Change Helps Users
source: llmops/ab-testing-online-evaluation-llms/content.md
voice: en-US-AndrewNeural
rate: +0%
sources:
  - title: Microsoft trustworthy experimentation guidance
    url: https://www.microsoft.com/en-us/research/group/experimentation-platform-exp/
  - title: Always valid inference
    url: https://arxiv.org/abs/1512.04922
  - title: Judging LLMs with MT-Bench and Chatbot Arena
    url: https://arxiv.org/abs/2306.05685
scenes:
  - id: intro
    title: Did the citation help?
    visual: A developer opens the cited API guide. Their confirmation and a full day without escalation
      turn the thread into one resolved question. The two groups supply resolution counts and rates.
    beats:
      - say: The developer opens the citation. Would you count this question as resolved?
        hold: 2.0
        caption_starts:
          - Would you count
        visual_cues:
          - id: intro-open-guide
            phrase: opens the citation
            targets: [intro-thread]
            color: cyan
      - say: Wait for the outcome. The developer confirms the fix. A full day passes without a human
          escalation. Now count one resolved question.
        hold: 1.0
        caption_starts:
          - The developer confirms
          - Now count
        visual_cues:
          - id: intro-confirmed
            phrase: The developer confirms the fix
            targets: [intro-follow-up]
            color: cyan
          - id: intro-follow-up-day
            phrase: A full day passes without a human escalation
            targets: [intro-follow-up]
            color: cyan
          - id: intro-resolved
            phrase: Now count one resolved question
            targets: [intro-follow-up]
            color: green
      - say: Try that count with four thousand simulated users. Each brings one question. We randomly
          assign each user to A, the control, or B, the treatment that asks for citations. B resolved
          more questions and also had more users. Which prompt resolved the larger share?
        hold: 2.2
        caption_starts:
          - B resolved more questions
          - Which prompt resolved the larger share
        visual_cues:
          - id: intro-enroll-b
            phrase: B, the treatment that asks for citations
            targets:
              - intro-outcomes
            color: cyan
            linger: 0.32
          - id: intro-denominator
            phrase: Which prompt resolved the larger share
            targets:
              - intro-outcomes
            color: yellow
            linger: 0.32
      - say: B did. Divide each count by the users assigned that prompt. About sixty-four percent of B's users
          resolved their question, compared with sixty-one percent of A's. The gap is a little over three
          and a half percentage points. Everyone finished follow-up in a separate conversation, so the
          difference between the randomly assigned groups estimates the effect of switching prompts. The team
          allows B to add at most three hundred milliseconds to the ninety-fifth percentile response time.
          Do the resolution counts tell us where B lands on that ruler?
        hold: 2.25
        caption_starts:
          - About sixty-four percent
          - Do the resolution counts
        visual_cues:
          - id: intro-rates
            phrase: Divide each count by the users assigned that prompt
            targets:
              - intro-outcomes
            color: cyan
            linger: 0.32
          - id: intro-lift
            phrase: The gap is a little over three and a half percentage points
            targets:
              - intro-outcomes
            color: cyan
            linger: 0.32
          - id: intro-time-limit
            phrase: The team allows B to add at most three hundred milliseconds to the ninety-fifth percentile
              response time
            targets:
              - intro-time
            color: yellow
            linger: 0.32
            caption_boundary: true
      - say: We need response times from both groups. For each prompt, find the time by which ninety-five
          percent of responses have finished. Then subtract A's time from B's. Safety and cost each
          need their own measurements too.
        hold: 0.8
        visual_cues:
          - id: intro-missing
            phrase: We need response times from both groups
            targets:
              - intro-time
            color: yellow
            linger: 0.32
  - id: point-estimate
    title: Can the citation prompt clear its limits?
    visual: A second worksheet supplies rates and the missing time difference. The 410 ms span crosses the
      300 ms marker. The final three comparisons share a limit line and retain their own units.
    beats:
      - say: This example has timing data too. Sixty percent of
          questions resolve with A and sixty-three point two percent with B. The gap is three point two
          percentage points. How large is that gain compared with where A started?
        hold: 2.0
        caption_starts:
          - How large is that gain
        visual_cues:
          - id: point-new-rates
            phrase: Sixty percent of questions resolve with A and sixty-three point two percent with B
            targets:
              - point-rates
            color: cyan
            linger: 0.32
          - id: point-difference
            phrase: The gap is three point two percentage points
            targets:
              - point-rates
            color: cyan
            linger: 0.32
      - say: Divide the gap by sixty. That's about five and a third percent relative to A.
        hold: 0.7
        caption_starts:
          - That's about five and a third percent
        visual_cues:
          - id: point-relative
            phrase: That's about five and a third percent relative to A
            targets:
              - point-rates
            color: cyan
            linger: 0.32
      - say: Now we can fill in the time ruler. The limit is the same three hundred milliseconds. Moving from A
          to B added four hundred ten milliseconds at the ninety-fifth percentile. How far past the time
          limit is that?
        hold: 2.15
        visual_cues:
          - id: point-time
            phrase: added four hundred ten milliseconds at the ninety-fifth percentile
            targets:
              - point-time
            color: cyan
            linger: 0.32
      - say: One hundred ten milliseconds over. The extra length beyond the yellow mark is the part the team
          hadn't agreed to spend.
        hold: 1
        visual_cues:
          - id: point-excess
            phrase: One hundred ten milliseconds over
            targets:
              - point-time
            color: yellow
            linger: 0.32
      - say: Check the other two limits the same way. Start with safety. The pass rate lost a tenth of a
          percentage point, twice the allowed drop. For cost, one extra cent per session was the most the
          team would accept. The mean rose by one point eight cents. Hold the citation prompt. Even fixing
          the time overrun would leave safety and cost outside their limits. These point estimates let us
          practice the policy. Estimating a live effect also takes independent observations and an
          uncertainty interval.
        hold: 0.9
        visual_cues:
          - id: point-safety
            phrase: The pass rate lost a tenth of a percentage point
            targets:
              - point-safety-row
            color: cyan
            linger: 0.32
          - id: point-cost
            phrase: The mean rose by one point eight cents
            targets:
              - point-cost-row
            color: cyan
            linger: 0.32
          - id: point-verdict
            phrase: Hold the citation prompt
            targets:
              - point-safety-row
              - point-time-row
              - point-cost-row
            color: yellow
            linger: 0.32
            caption_boundary: true
  - id: measurement-contract
    title: Which check catches a wrong API limit?
    visual: The reply cites the right guide and gives the wrong limit. Compare the JSON fields with the
      guide, then choose a check for each property of the reply.
    beats:
      - say: The reply says two hundred requests per minute. The version two guide says one hundred.
          Parsing checks syntax and a schema checks its declared fields and types. Both checks pass
          here. To catch the wrong number, compare the claim with the cited passage.
        hold: 0.7
        visual_cues:
          - id: oa-measurement-contract-0
            phrase: The reply says two hundred requests per minute
            targets:
              - oa-measurement-contract-mechanism
            color: cyan
            linger: 0.4
          - id: oa-measurement-contract-parse
            phrase: Parsing checks syntax and a schema checks its declared fields and types
            targets:
              - oa-measurement-contract-mechanism
            color: cyan
            linger: 0.4
          - id: oa-measurement-contract-source
            phrase: compare the claim with the cited passage
            targets:
              - oa-measurement-contract-mechanism
            color: cyan
            linger: 0.4
      - say: BLEU and ROUGE measure lexical overlap. BERTScore uses contextual token embeddings, and
          cosine compares vector directions. These scores tell us how closely a reply resembles a
          reference. Changing one hundred to two hundred leaves almost all the words intact. For the
          format check, the schema itself supplies the specification.
        hold: 0.7
        visual_cues:
          - id: oa-measurement-contract-1
            phrase: BLEU and ROUGE measure lexical overlap
            targets:
              - oa-measurement-contract-mechanism
            color: yellow
            linger: 0.4
          - id: oa-measurement-contract-overlap
            phrase: BLEU and ROUGE measure lexical overlap
            targets:
              - oa-measurement-contract-mechanism
            color: cyan
            linger: 0.4
          - id: oa-measurement-contract-embedding
            phrase: BERTScore uses contextual token embeddings, and cosine compares vector directions
            targets:
              - oa-measurement-contract-mechanism
            color: cyan
            linger: 0.4
      - say: A source-grounded rubric or calibrated judge can assess clarity, accuracy and citation use
          when acceptable wording varies. Choose the evidence for each question you ask about the
          answer. For generated code, run the test cases in a constrained sandbox.
        hold: 0.7
        visual_cues:
          - id: oa-measurement-contract-2
            phrase: A source-grounded rubric or calibrated judge can assess clarity, accuracy and citation use when
              acceptable wording varies
            targets:
              - oa-measurement-contract-mechanism
            color: green
            linger: 0.4
          - id: oa-measurement-contract-rubric
            phrase: A source-grounded rubric or calibrated judge can assess clarity, accuracy and citation use when
              acceptable wording varies
            targets:
              - oa-measurement-contract-mechanism
            color: cyan
            linger: 0.4
  - id: treatment-identity
    title: Bind the treatment and the estimand before enrollment
    visual: A singleimmutable experiment receipt pins prompt/model/retrieval/runtime and one24hour outcome; an
      attempted bundle edit changes the identified treatment.
    beats:
      - say: Randomization can estimate the combined effect of a new model plus prompt, provided that bundle is the
          registered treatment. It cannot identify which component caused the change or separate their
          interaction. Change one component or preplan a factorial design when that attribution matters.
        hold: 0.7
        visual_cues:
          - id: oa-treatment-identity-0
            phrase: Randomization can estimate the combined effect of a new model plus prompt, provided that bundle is the
              registered treatment
            targets:
              - oa-treatment-identity-mechanism
            color: cyan
            linger: 0.4
          - id: oa-treatment-identity-bundle
            phrase: provided that bundle is the registered treatment
            targets:
              - oa-treatment-identity-mechanism
            color: cyan
            linger: 0.4
          - id: oa-treatment-identity-factorial
            phrase: preplan a factorial design when that attribution matters
            targets:
              - oa-treatment-identity-mechanism
            color: cyan
            linger: 0.4
      - say: Pin model weights and quantization, prompt, sampler, output budget, engine, scheduler, retrieval and
          tools. A seed or temperature zero does not guarantee identical output across serving changes. Hidden
          treatment versions, cold workers or changed context can otherwise masquerade as a prompt effect.
        hold: 0.7
        visual_cues:
          - id: oa-treatment-identity-1
            phrase: Pin model weights and quantization, prompt, sampler, output budget, engine, scheduler, retrieval and
              tools
            targets:
              - oa-treatment-identity-mechanism
            color: yellow
            linger: 0.4
          - id: oa-treatment-identity-pins
            phrase: Pin model weights and quantization, prompt, sampler, output budget, engine, scheduler, retrieval and
              tools
            targets:
              - oa-treatment-identity-mechanism
            color: cyan
            linger: 0.4
      - say: "Name the estimand explicitly: here it is the difference in probability that an eligible conversation
          resolves without escalation inside its declared twenty-four-hour window. A copied citation is a
          secondary action, not that outcome. Hard and high-risk cases also need declared guardrails; a good
          median can hide a harmful tail."
        hold: 0.7
        visual_cues:
          - id: oa-treatment-identity-2
            phrase: "Name the estimand explicitly: here it is the difference in probability that an eligible conversation
              resolves without escalation inside its declared twenty-four-hour window"
            targets:
              - oa-treatment-identity-mechanism
            color: green
            linger: 0.4
          - id: oa-treatment-identity-outcome
            phrase: difference in probability that an eligible conversation resolves without escalation inside its
              declared twenty-four-hour window
            targets:
              - oa-treatment-identity-mechanism
            color: cyan
            linger: 0.4
  - id: screen
    title: Use a rubric to decide what deserves live exposure
    visual: Four treatment wins and one tie enter a curated screen. The current observed comparisons determine the
      tie-adjusted score.
    beats:
      - say: "Begin offline with questions that can reveal important failures and representative routine cases. Keep
          model, sampling, retrieval, and tools fixed when isolating a prompt edit. A rubric names the
          properties to score: clarity, accuracy, and useful source citation. Factual judgments need approved
          evidence, and acceptable wording can vary."
        hold: 0.65
        visual_cues:
          - id: screen-beat-1-focus-1
            phrase: Begin offline with questions that can reveal important failures and representative routine cases
            targets:
              - screen-value-5-tie-t-wins
            color: cyan
            linger: 0.65
      - say: These five supplied comparisons favor the candidate. The preference score includes half a point for the
          tie and describes this curated screen. Balance answer order, calibrate the judge against held-out
          human labels, and inspect verbosity effects. Shadow traffic adds operational evidence while control
          supplies responses; user impact requires a live exposure design.
        hold: 0.65
        visual_cues:
          - id: screen-beat-2-focus-1
            phrase: The preference score includes half a point for the tie and describes this curated screen
            targets:
              - screen-value-5-tie-t-wins
            color: cyan
            linger: 0.65
  - id: rubric-evidence
    title: Which prompt did the five comparisons favor?
    visual: Five selected questions have illustrative scores for clarity, accuracy and citation. Four wins
      and one tie give the citation prompt a separate preference score.
    beats:
      - say: Read across the five questions. Each has a pair of example scores. Add each axis over its
          five cases, then divide by five. Clarity averages three point four for A and four point
          two for B. Accuracy is three point two versus four point two. Citation shows the biggest
          gap, one versus four point six.
        hold: 0.7
        visual_cues:
          - id: oa-rubric-evidence-0
            phrase: Read across the five questions
            targets:
              - oa-rubric-evidence-mechanism
            color: cyan
            linger: 0.4
          - id: oa-rubric-evidence-rows
            phrase: Add each axis over its five cases, then divide by five
            targets:
              - oa-rubric-evidence-mechanism
            color: cyan
            linger: 0.4
          - id: oa-rubric-evidence-clarity
            phrase: Clarity averages three point four for A and four point two for B
            targets:
              - oa-rubric-evidence-mechanism
            color: cyan
            linger: 0.4
          - id: oa-rubric-evidence-accuracy
            phrase: accuracy is three point two versus four point two
            targets:
              - oa-rubric-evidence-mechanism
            color: cyan
            linger: 0.4
          - id: oa-rubric-evidence-citation
            phrase: Citation shows the biggest gap, one versus four point six
            targets:
              - oa-rubric-evidence-mechanism
            color: cyan
            linger: 0.4
      - say: For pairwise preference, add wins plus half the ties, then divide by all comparisons. Four
          B wins and one tie give four point five divided by five, or ninety percent. That ranks the
          answers to these five questions. To find out whether more users resolve their questions,
          plan a live test with enough users to detect a useful gain.
        hold: 0.7
        visual_cues:
          - id: oa-rubric-evidence-1
            phrase: For pairwise preference, add wins plus half the ties, then divide by all comparisons
            targets:
              - oa-rubric-evidence-mechanism
            color: yellow
            linger: 0.4
          - id: oa-rubric-evidence-ties
            phrase: Four B wins and one tie give four point five divided by five, or ninety percent
            targets:
              - oa-rubric-evidence-mechanism
            color: cyan
            linger: 0.4
      - say: Give reviewers the question, both candidate responses, rubric and approved source excerpts. Hide variant
          identity, balance presentation order and calibrate against held-out human labels. The source-free
          judge might repeat a remembered obsolete API limit. Include routine and unseen cases alongside the
          deliberately hard screen.
        hold: 0.7
        visual_cues:
          - id: oa-rubric-evidence-2
            phrase: Give reviewers the question, both candidate responses, rubric and approved source excerpts
            targets:
              - oa-rubric-evidence-mechanism
            color: green
            linger: 0.4
          - id: oa-rubric-evidence-blind
            phrase: Hide variant identity, balance presentation order and calibrate against held-out human labels
            targets:
              - oa-rubric-evidence-mechanism
            color: cyan
            linger: 0.4
  - id: token-clock
    title: Name the exact latency observation surface
    visual: A supplied four-token arrival trace buildsTTFT,gaps,meanTPOT and closure as separate measured events.
    beats:
      - say: Time to first token runs from the declared request start to first output. Inter-token latency or time
          between tokens measures consecutive token gaps. First-to-last-token time per output token divides
          that interval by the quantity output-token count minus one. It is undefined below two output tokens.
        hold: 0.7
        visual_cues:
          - id: oa-token-clock-0
            phrase: Time to first token runs from the declared request start to first output
            targets:
              - oa-token-clock-mechanism
            color: cyan
            linger: 0.4
          - id: oa-token-clock-first
            phrase: Time to first token runs from the declared request start to first output
            targets:
              - oa-token-clock-mechanism
            color: cyan
            linger: 0.4
          - id: oa-token-clock-gaps
            phrase: Inter-token latency or time between tokens measures consecutive token gaps
            targets:
              - oa-token-clock-mechanism
            color: cyan
            linger: 0.4
          - id: oa-token-clock-mean
            phrase: First-to-last-token time per output token divides that interval by the quantity output-token count
              minus one
            targets:
              - oa-token-clock-mechanism
            color: cyan
            linger: 0.4
      - say: An endpoint client may observe chunks containing multiple tokens or empty content, so chunk gaps need not
          equal visible token gaps. The inspected vLLM clients also choose particular terminal content events;
          a field named end-to-end latency does not itself prove stream-closure timing. Pin client, endpoint
          and formula in both arms.
        hold: 0.7
        visual_cues:
          - id: oa-token-clock-1
            phrase: An endpoint client may observe chunks containing multiple tokens or empty content, so chunk gaps need
              not equal visible token gaps
            targets:
              - oa-token-clock-mechanism
            color: yellow
            linger: 0.4
          - id: oa-token-clock-chunks
            phrase: chunks containing multiple tokens or empty content
            targets:
              - oa-token-clock-mechanism
            color: cyan
            linger: 0.4
          - id: oa-token-clock-closure
            phrase: a field named end-to-end latency does not itself prove stream-closure timing
            targets:
              - oa-token-clock-mechanism
            color: cyan
            linger: 0.4
      - say: For serving changes, register useful goodput or separate first-token and decode attainment rather than
          one blended latency number. A healthy request-mean decode interval can still hide a long individual
          stall. Record whether the guardrail refers to first token, per-token tail, request mean or full
          response closure.
        hold: 0.7
        visual_cues:
          - id: oa-token-clock-2
            phrase: For serving changes, register useful goodput or separate first-token and decode attainment rather than
              one blended latency number
            targets:
              - oa-token-clock-mechanism
            color: green
            linger: 0.4
          - id: oa-token-clock-stall
            phrase: A healthy request-mean decode interval can still hide a long individual stall
            targets:
              - oa-token-clock-mechanism
            color: cyan
            linger: 0.4
  - id: feedback-join
    title: Join delayed feedback to its original conversation
    visual: Three request IDs keepturn-levelclicks while one immutable conversation receipt receives a late
      escalation after followup matures.
    beats:
      - say: A copy, citation click or regeneration belongs to a particular request and prompt version. A resolved
          conversation belongs to the full conversation identity. An error introduced on turn one can cause a
          downvote on turn three, so the final clicked turn does not alone identify the causal source.
        hold: 0.7
        visual_cues:
          - id: oa-feedback-join-0
            phrase: A copy, citation click or regeneration belongs to a particular request and prompt version
            targets:
              - oa-feedback-join-mechanism
            color: cyan
            linger: 0.4
          - id: oa-feedback-join-turns
            phrase: An error introduced on turn one can cause a downvote on turn three
            targets:
              - oa-feedback-join-mechanism
            color: cyan
            linger: 0.4
      - say: Define resolution positively, for example an explicit resolution event with no escalation during the
          declared follow-up. Silence is not automatic success. Join delayed tickets or survey responses back
          through immutable conversation, assigned variant and model identities.
        hold: 0.7
        visual_cues:
          - id: oa-feedback-join-1
            phrase: Define resolution positively, for example an explicit resolution event with no escalation during the
              declared follow-up
            targets:
              - oa-feedback-join-mechanism
            color: yellow
            linger: 0.4
          - id: oa-feedback-join-join
            phrase: Join delayed tickets or survey responses back through immutable conversation, assigned variant and
              model identities
            targets:
              - oa-feedback-join-mechanism
            color: cyan
            linger: 0.4
      - say: Wait for the outcome window to mature and deduplicate event retries. A confirmed timeout can be an
          observed failure under the chosen outcome definition. An immature window or absent survey instead
          remains missing evidence. Report response rates by assigned arm and investigate differential
          missingness.
        hold: 0.7
        visual_cues:
          - id: oa-feedback-join-2
            phrase: Wait for the outcome window to mature and deduplicate event retries
            targets:
              - oa-feedback-join-mechanism
            color: green
            linger: 0.4
          - id: oa-feedback-join-retry
            phrase: Wait for the outcome window to mature and deduplicate event retries
            targets:
              - oa-feedback-join-mechanism
            color: cyan
            linger: 0.4
          - id: oa-feedback-join-missing
            phrase: An immature window or absent survey instead remains missing evidence
            targets:
              - oa-feedback-join-mechanism
            color: cyan
            linger: 0.4
  - id: power
    title: Smaller useful effects need more independent units
    visual: The same two-proportion variance formula determines independent-unit budgets for three minimum
      detectable effects.
    beats:
      - say: Before enrollment, choose the smallest useful effect and plan traffic for it. Statistical power describes
          the chance of detecting that specified true effect under the design. These calculations use a binary
          outcome, equal allocation, independent units, a fixed horizon, and the normal approximation. Other
          metrics or clusters require a matching design.
        hold: 0.65
        visual_cues:
          - id: power-beat-1-focus-1
            phrase: These calculations use a binary outcome, equal allocation, independent units, a fixed horizon, and the
              normal approximation
            targets:
              - power-sample-size-bars
            color: cyan
            linger: 0.65
      - say: As the targeted improvement shrinks, the required sample grows rapidly. The displayed budgets come from
          the same variance formula, rather than a guessed traffic multiplier. Plan required critical slices
          and multiple claims before launch. The target effect sizes the experiment; a post-hoc search for a
          significant slice changes the question.
        hold: 0.65
        visual_cues:
          - id: power-beat-2-focus-1
            phrase: As the targeted improvement shrinks, the required sample grows rapidly
            targets:
              - power-sample-size-bars
            color: cyan
            linger: 0.65
  - id: power-construction
    title: What does a smaller lift cost in users?
    visual: The two variance terms determine a side length. Its square gives users per arm. Halving the
      target lift increases the side from about 38 to 77 and the total area by about four.
    beats:
      - say: Let's build the five-point traffic budget. We're planning for a stable population, equal groups and
          a fixed end to enrollment. Each independent user gives us one yes or no. Suppose A resolves
          sixty percent of questions. We want eighty percent power if B really resolves sixty-five
          percent. First pool the two planned rates. Their average sets the variance in the no-difference
          part of the calculation. The factor of one point nine six comes from our two-sided five percent
          false-positive rate.
        hold: 0.7
        visual_cues:
          - id: budget-pooled
            phrase: First pool the two planned rates
            targets:
              - budget-inputs
            color: cyan
            linger: 0.32
      - say: For the other part, keep the two planned rates separate. Each rate times its failure rate
          contributes to the variance when the five-point effect is real. The second weight, about point
          eight four, comes from the power we chose. Add the two weighted terms and divide by the target
          lift. Think of that number as the side of a square. Its area is the estimated number of users in
          one arm. Round up to fourteen hundred seventy-one per arm, or twenty-nine hundred forty-two
          users altogether.
        hold: 0.8
        visual_cues:
          - id: budget-separate
            phrase: keep the two planned rates separate
            targets:
              - budget-inputs
            color: cyan
            linger: 0.32
          - id: budget-side
            phrase: Add the two weighted terms and divide by the target lift
            targets:
              - budget-square
            color: cyan
            linger: 0.32
          - id: budget-total
            phrase: Round up to fourteen hundred seventy-one per arm
            targets:
              - budget-square
            color: cyan
            linger: 0.32
            caption_boundary: true
      - say: Suppose a gain of just two and a half points would be worth finding. Keep the baseline and the
          error rates fixed. Halving the divisor takes the side of our square from about thirty-eight to
          seventy-seven. Roughly how many times as many users does the area represent now?
        hold: 2.25
        visual_cues:
          - id: budget-smaller
            phrase: a gain of just two and a half points
            targets:
              - budget-inputs
            color: cyan
            linger: 0.32
      - say: About four times as many. The new square holds almost six thousand users per arm. The exact total
          is eleven thousand nine hundred twenty-two. The variance terms changed a little with the target
          rate, so the factor is a little over four. The calculator rejects impossible rates, nonnumeric
          or nonfinite inputs, booleans and changes too small to represent. For continuous outcomes,
          estimate their variance separately. If you have predictive measurements from before enrollment,
          a planned adjustment such as CUPED can reduce noise.
        hold: 0.9
        visual_cues:
          - id: budget-area
            phrase: About four times as many
            targets:
              - budget-square
            color: yellow
            linger: 0.32
  - id: assignment
    title: Keep the assigned group through fallbacks and failures
