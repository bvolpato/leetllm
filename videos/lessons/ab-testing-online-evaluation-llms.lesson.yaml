    visual: Observed arm counts change under fixed enrollment. The current counts determine chi-square and the
      diagnostic hold.
    beats:
      - say: First verify that assigned units reached the groups in the planned proportions. A sample ratio mismatch
          is a count alarm. Routing races, asymmetric logging, filtering, or dropped requests can produce one.
          Count unique assignments before reconciling exposure and outcome joins. Extra treatment turns can be
          an outcome rather than an assignment defect.
