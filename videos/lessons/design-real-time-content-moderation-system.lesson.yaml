  - id: appeal-labels
    title: Preserve why an action changed before learning from it
    visual: Original decision and three distinct correction reasons remain linked;only adjudicated
      same-policy wrongful blocks enter the candidate hard-negative lane after governance.
    beats:
      - say: An appeal begins from the original action, content reference, evidence, policy version, scope,
          and reason shown to the user. Re-evaluate under that governing policy, or record an
          intentional policy change. A larger judge does not justify silently using a more lenient
          rulebook. Restricted cases stay inside their authorized safety process.
        hold: 0.75
        visual_cues:
          - id: appeal-original
            phrase: original action, content reference, evidence, policy version
            targets:
              - appeal-labels-mechanism
            color: cyan
            linger: 0.5
          - id: appeal-policy
            phrase: record an intentional policy change
            targets:
              - appeal-labels-mechanism
            color: yellow
            linger: 0.5
      - say: Keep the original event immutable and append a linked correction. An authorized remedy can
          reverse restrictions, invalidate cached enforcement, update account penalties and indexes
          where appropriate, and notify the user. Distinguish a same-policy error from a new policy,
          new evidence, or a procedural correction. Each changes the record for a different reason.
        hold: 0.75
        visual_cues:
          - id: appeal-link
            phrase: append a linked correction
            targets:
              - appeal-labels-mechanism
            color: cyan
            linger: 0.5
          - id: appeal-reasons
            phrase: Each changes the record for a different reason
            targets:
              - appeal-labels-mechanism
            color: yellow
            linger: 0.5
      - say: Only an adjudicated wrongful block under the same policy is a candidate hard negative after
          label-quality and data-governance checks. An allow caused by a new rule does not establish
          that the old rule was applied incorrectly. Confirmed violations and genuinely novel cases
          can likewise inform evaluated training or policy candidates. Appeals are self-selected;
          evaluate authorized random samples of allowed and blocked items too, group near-duplicates
          and related conversations, and hold out time for drift.
        hold: 0.75
        visual_cues:
