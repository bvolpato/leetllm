scenes:
  - id: intro
    title: Testing the class feed
    visual: A folded handout slides through the filter beside a profile. The read head stops on “official
      tutorial.” A yellow underline shrinks from the whole blocked phrase to one word. Both posts keep their
      current decisions while the viewer predicts the draft decisions.
    beats:
      - say: Could one word hide this class handout? The teacher calls it the official tutorial. The
          profile beside it claims private access. The current filter blocks the whole phrase on the
          profile. The handout goes through. Shorten the rule to just official. Which decision changes?
        hold: 2.3
        caption_starts:
          - The current filter blocks
          - Shorten the rule to just official
        visual_cues:
          - id: intro-profile
            phrase: The profile beside it claims private access
            targets:
              - profile
            color: cyan
            linger: 0.3
          - id: intro-tutorial
            phrase: The teacher calls it the official tutorial
            targets:
              - tutorial
            color: cyan
            linger: 0.3
          - id: intro-specific
            phrase: The current filter blocks the whole phrase on the profile. The handout goes through
            targets:
              - profile
              - tutorial
            color: cyan
            linger: 0.3
          - id: intro-draft
            phrase: Shorten the rule to just official
            targets:
              - rule
            color: yellow
            linger: 0.3
          - id: intro-question
            phrase: Which decision changes
            targets:
              - profile
              - tutorial
              - decision
            color: yellow
            linger: 0.3
      - say: The handout flips from allow to block. On the handout, official describes the tutorial. On the
          profile, it describes the account. Both posts now match the shorter rule.
        hold: 1.15
        visual_cues:
          - id: intro-change
            phrase: The handout flips from allow to block
            targets:
              - tutorial
              - decision
            color: pink
            linger: 0.3
            caption_boundary: true
          - id: intro-context
            phrase: On the handout, official describes the tutorial
            targets:
              - tutorial
            color: cyan
            linger: 0.3
      - say: Now two people claim the same profile. Neither keyword rule matches the caption. Who controls
          the account? Hold the upload while a reviewer checks the ownership records.
        hold: 0.75
        caption_starts:
          - Hold the upload
        visual_cues:
          - id: intro-ownership
            phrase: Neither keyword rule matches the caption
            targets:
              - profile
              - decision
            color: yellow
            linger: 0.3
          - id: intro-review
            phrase: Hold the upload while a reviewer checks the ownership records
            targets:
              - decision
              - profile
            color: yellow
            linger: 0.3
  - id: surfaces
    title: Choose the user-visible deadline first
    visual: A live chat message and an upload follow synchronous and pending lanes under separate clocks.
    beats:
      - say: A live chat message needs a decision before it sends. For this platform, the target is a chat
          decision in under two hundred milliseconds at the ninety-fifth percentile. An uploaded profile
          image can remain pending while slower checks finish. Within one second, tell the uploader whether
          the image is public or its review work has been saved.
        hold: 0.75
        visual_cues:
          - id: surfaces-beat-1-focus-1
            phrase: A live chat message needs a decision before it sends
            targets:
              - surfaces-live-chat-before-send
            color: cyan
            linger: 0.65
          - id: surfaces-beat-1-focus-2
            phrase: An uploaded profile image can remain pending while slower checks finish
            targets:
              - surfaces-upload-pending-allowed
            color: yellow
            linger: 0.65
      - say: A timeout still needs a defined action. Hold or suppress under the surface policy rather than bypass
          a required check. Sensitive reports can require a separate authorized review path. Its admission
          should follow trusted intake signals and the governing workflow instead of waiting for a model to
          agree.
        hold: 0.85
        visual_cues:
          - id: surfaces-beat-2-focus-1
            phrase: Hold or suppress under the surface policy rather than bypass a required check
            targets:
              - surfaces-send-or-suppress
            color: cyan
            linger: 0.65
          - id: surfaces-beat-2-focus-2
            phrase: Sensitive reports can require a separate authorized review path
            targets:
              - sensitive-report
              - sensitive-intake-gate
            color: yellow
            linger: 0.65
          - id: trusted-report-intake
            phrase: trusted intake signals and the governing workflow
            targets:
              - sensitive-intake-gate
              - sensitive-review-receipt
            color: green
            linger: 0.65
          - id: model-independent-review
            phrase: instead of waiting for a model to agree
            targets:
              - sensitive-review-receipt
            color: green
            linger: 0.65
  - id: review-intake
    title: Keep restricted and urgent ownership independent of model confidence
    visual: Three identified neutral cases enter separate owned queues;trusted flags retain restricted
      precedence even when judge agreement is absent.
    beats:
      - say: Build three review paths. An ordinary impersonation dispute enters standard review. A credible
          urgent safety signal enters urgent review. A trusted apparent-prohibited-material signal
          enters the restricted workflow. These flags come from authorized intake and governing
          safety rules. An uploader cannot choose their own authority by placing a boolean in a
          payload.
        hold: 0.75
        visual_cues:
          - id: intake-build
            phrase: Build three review paths
            targets:
              - review-intake-mechanism
            color: cyan
            linger: 0.5
          - id: intake-trust
            phrase: An uploader cannot choose their own authority
            targets:
              - review-intake-mechanism
            color: yellow
            linger: 0.5
      - say: The local router checks restricted evidence first, then urgency, then standard handling. If
          both trusted flags are present, restricted takes precedence. A low model confidence does
          not demote an imminent-harm report, and these routes do not wait for a judge to agree.
          Reserve capacity and assigned ownership for each queue; monitor oldest case age as well as
          depth and ordinary-appeal starvation.
        hold: 0.75
        visual_cues:
          - id: intake-priority
            phrase: restricted takes precedence
            targets:
              - review-intake-mechanism
            color: cyan
            linger: 0.5
          - id: intake-reserve
            phrase: Reserve capacity and assigned ownership
            targets:
              - review-intake-mechanism
            color: yellow
            linger: 0.5
      - say: Access is part of the workflow. Restrict sensitive evidence to assigned authorized specialists,
          use protected playback and blurring where appropriate, and provide rotation and support
          for reviewers. A publication block and a restricted handoff do not authorize arbitrary
          deletion or external reporting. Those consequential actions follow their separately
          approved process. Quality-controlled outcomes can later inform evaluation under governed
          data handling.
        hold: 0.75
        visual_cues:
          - id: intake-access
            phrase: Restrict sensitive evidence to assigned authorized specialists
            targets:
              - review-intake-mechanism
            color: cyan
            linger: 0.5
          - id: intake-learning
            phrase: Quality-controlled outcomes can later inform evaluation
            targets:
              - review-intake-mechanism
            color: yellow
            linger: 0.5
  - id: cascade
    title: Spend context where it can change the answer
    visual: Full incoming rates decrease through deterministic checks, a classifier, a contextual judge
      and human review.
    beats:
      - say: A cascade gives each stage a job. Compatible exact decisions and trusted rules can finish
          cheaply. A classifier handles evaluated categories. Ambiguous cases can receive contextual
          review when the deadline permits it. A later stage must earn its extra cost through
          measured quality.
        hold: 0.75
        visual_cues:
          - id: cascade-rules
            phrase: Compatible exact decisions and trusted rules can finish cheaply
            targets:
              - cascade-stage-0
            color: cyan
            linger: 0.65
          - id: cascade-classifier
            phrase: A classifier handles evaluated categories
            targets:
              - cascade-stage-1
            color: cyan
            linger: 0.65
          - id: cascade-judge
            phrase: Ambiguous cases can receive contextual review when the deadline permits it
            targets:
              - cascade-stage-2
            color: cyan
            linger: 0.65
          - id: cascade-human
            phrase: A later stage must earn its extra cost through measured quality
            targets:
              - cascade-stage-3
            color: yellow
            linger: 0.65
      - say: Calculate the incoming work at every stage. Our classifier handles all the requests reaching
          it, including those it later escalates. The human remainder also has a staffing
          consequence. At the supplied review rate and handling time, this scenario would need a
          very large concurrent review workforce.
        hold: 0.85
        visual_cues:
          - id: cascade-incoming
            phrase: Calculate the incoming work at every stage
            targets:
              - cascade-incoming-0
              - cascade-incoming-1
              - cascade-incoming-2
              - cascade-incoming-3
            color: cyan
            linger: 0.65
          - id: cascade-classifier-work
            phrase: Our classifier handles all the requests reaching it, including those it later escalates
            targets:
              - cascade-stage-1
              - cascade-classifier-work
            color: yellow
            linger: 0.65
          - id: cascade-human-work
            phrase: The human remainder also has a staffing consequence
            targets:
              - cascade-stage-3
              - cascade-human-inputs
            color: cyan
            linger: 0.65
          - id: cascade-review-work
            phrase: At the supplied review rate and handling time
            targets:
              - cascade-review-work
            color: yellow
            linger: 0.65
          - id: cascade-staffing
            phrase: a very large concurrent review workforce
            targets:
              - cascade-staffing
            color: pink
            linger: 0.65
  - id: capacity-ledger
    title: Conserve incoming work through the cascade
    visual: The original10000/s cascade receives its full stage input before each exit;daily posts,judge
      residence and reviewer occupancy retain separate dimensions.
    beats:
      - say: The platform’s two point four million posts per day average about twenty-seven point eight per
          second. That asynchronous average does not size a ten-thousand-per-second synchronous
          burst. In the supplied chat mix, cache and rules receive ten thousand, resolve eight
          thousand, and send two thousand to the classifier. The classifier resolves fifteen hundred
          but processes all two thousand; five hundred reach the judge.
        hold: 0.75
        visual_cues:
          - id: capacity-daily
            phrase: average about twenty-seven point eight per second
            targets:
              - capacity-ledger-mechanism
            color: cyan
            linger: 0.5
          - id: capacity-flow
            phrase: cache and rules receive ten thousand
            targets:
              - capacity-ledger-mechanism
            color: yellow
            linger: 0.5
      - say: The judge resolves four hundred and passes one hundred cases per second to review. Each case
          takes two minutes. That requires twelve thousand simultaneously busy reviewers. At seventy percent
          productive occupancy, divide twelve thousand by point seven and round up. That gives seventeen
          thousand one hundred forty-three staff. If the team is smaller, the review queue grows even at
          this steady arrival rate.
        hold: 0.75
        visual_cues:
          - id: capacity-busy
            phrase: twelve thousand simultaneously busy reviewers
            targets:
              - capacity-ledger-mechanism
            color: cyan
            linger: 0.5
          - id: capacity-staff
            phrase: seventeen thousand one hundred forty-three staff
            targets:
              - capacity-ledger-mechanism
            color: yellow
            linger: 0.5
      - say: A batch of thirty-two completed in eight milliseconds implies four thousand items per second
          arithmetically. Two thousand classifier requests per second would then suggest at least
          one replica, before underfill, redundancy, variable lengths, and regional traffic. Measure
          usable service capacity. Separately, five hundred judge arrivals per second times mean
          residence point four seconds gives two hundred in flight in a stable system. First-token
          time is not time to a complete validated moderation decision.
        hold: 0.75
        visual_cues:
          - id: capacity-batch
            phrase: "A batch of thirty-two completed in eight milliseconds implies four thousand items per second arithmetically"
            targets:
              - capacity-ledger-mechanism
            color: cyan
            linger: 0.5
          - id: capacity-flight
            phrase: "two hundred in flight in a stable system"
            targets:
              - capacity-ledger-mechanism
            color: yellow
            linger: 0.5
  - id: categories
    title: Inspect every required category before choosing an action
    visual: Six category scores meet their own review and block limits, preserving violence-block
      precedence over spam review.
    beats:
      - say: A post can trigger several policy categories at once. Our supplied scores include a violence
          block and a spam review. Evaluate all categories and retain both reasons before applying
          the controller’s action precedence. Returning after the first review result could miss the
          more severe triggered decision. For each category, a score at or above its block cutoff
          blocks; otherwise a score at or above its review cutoff reviews. Any triggered block takes
          precedence over review, while every triggered category stays in the record.
        hold: 0.75
        visual_cues:
          - id: categories-beat-1-focus-1
            phrase: Evaluate all categories and retain both reasons before applying the controller’s action
              precedence
            targets:
              - categories-names-reason-index-reason-action
            color: cyan
            linger: 0.65
          - id: category-controller-precedence
            phrase: applying the controller’s action precedence
            targets:
              - categories-names-reason-index-reason-action
              - category-controller-decision
            color: pink
            linger: 0.65
      - say: Validate that the complete score set is present, finite and in range. Malformed or unavailable
          scores need an explicit review disposition. Thresholds belong to evaluated category and
          surface policies. A number inside the unit interval still needs reliability evidence
          before being shown as a probability.
        hold: 0.85
        visual_cues:
          - id: categories-beat-2-focus-1
            phrase: A number inside the unit interval still needs reliability evidence before being shown as a
              probability
            targets:
              - category-score-set
              - category-calibration
            color: cyan
            linger: 0.65
          - id: categories-beat-2-focus-2
            phrase: Validate that the complete score set is present, finite and in range
            targets:
              - categories-data-checks-index-pass-label-label-pending
            color: yellow
            linger: 0.65
  - id: judge-contract
    title: Separate a shaped recommendation from enforcement authority
    visual: A concrete four-field judge payload passes structural checks,then loses an unauthorized
      enforcement edge;changing a boolean confidence rejects before policy evaluation.
    beats:
      - say: A profile caption calls its owner an official club representative. The service supplies
          profile policy version forty-four. The caption and O C R text enter as serialized untrusted data.
          The judge checks the claim against the policy. The controller decides what action it can take.
        hold: 0.75
        visual_cues:
          - id: judge-input
            phrase: caption and O C R text enter as serialized untrusted data
            targets:
              - judge-contract-mechanism
            color: cyan
            linger: 0.5
          - id: judge-policy
            phrase: The judge checks the claim against the policy
            targets:
              - judge-contract-mechanism
            color: yellow
            linger: 0.5
      - say: The returned object has exactly action, category, confidence, and rationale. The local
          validator accepts allow, block, or escalate; it requires a known category, a finite
          numeric confidence between zero and one, and a nonempty rationale no longer than eight
          hundred characters. Boolean confidence is rejected even though Python treats booleans as
          integers. Block with category none is also rejected. The trusted caller supplies the
          policy version.
        hold: 0.75
        visual_cues:
          - id: judge-schema
            phrase: exactly action, category, confidence, and rationale
            targets:
              - judge-contract-mechanism
            color: cyan
            linger: 0.5
          - id: judge-boolean
            phrase: Boolean confidence is rejected
            targets:
              - judge-contract-mechanism
            color: yellow
            linger: 0.5
      - say: Passing that schema establishes shape. The controller still checks policy evidence, tenant,
          revision, scope, permitted actions, and any required approval. A valid allow can still be
          mistaken or induced by an injection. Keep enforcement credentials outside the judge, and
          generate user explanations from approved reason codes. In O W A S P’s twenty twenty-six
          edition, prompt injection is L L M zero one and excessive agency is zero three; record the
          edition because the earlier numbering differs.
        hold: 0.75
        visual_cues:
          - id: judge-shape
            phrase: Passing that schema establishes shape
            targets:
              - judge-contract-mechanism
            color: cyan
            linger: 0.5
          - id: judge-authority
            phrase: Keep enforcement credentials outside the judge
            targets:
              - judge-contract-mechanism
            color: yellow
            linger: 0.5
  - id: modality-contract
    title: A zero is meaningful only for an assessed input
    visual: An image-only response preserves its applied-input-type evidence;unsupported text categories
      stay unknown instead of becoming low-risk allow signals.
    beats:
      - say: Look at the harassment row for an image uploaded without text. The OpenAI moderation contract
          in this example supports images for six harm families. Harassment requires text. The returned
          score is zero and the list of assessed inputs is empty. Record harassment as unassessed.
        hold: 0.75
        visual_cues:
          - id: modality-six
            phrase: supports images for six harm families
            targets:
              - modality-contract-mechanism
            color: cyan
            linger: 0.5
          - id: modality-zero
            phrase: The returned score is zero and the list of assessed inputs is empty
            targets:
              - modality-contract-mechanism
            color: yellow
            linger: 0.5
      - say: Llama Guard four is a twelve-billion-parameter multimodal classifier supporting text and
          multiple images. ShieldGemma two is a four-billion-parameter image classifier evaluated for
          sexually explicit, dangerous, and violent content. To check a copied profile photo for
          impersonation, a reviewer also needs the account holder’s claim and evidence of who owns it.
        hold: 0.75
        visual_cues:
          - id: modality-guard
            phrase: Llama Guard four is a twelve-billion-parameter
            targets:
              - modality-contract-mechanism
            color: cyan
            linger: 0.5
          - id: modality-gemma
            phrase: ShieldGemma two is a four-billion-parameter
            targets:
              - modality-contract-mechanism
            color: yellow
            linger: 0.5
      - say: Retain each modality’s coverage and uncertainty through the adapter. O C R can miss a small
          overlay; speech recognition can omit or alter words, while non-speech audio can matter. A
          model update may require recalibration. If a required category or modality is unavailable,
          preserve that missing assessment and take the approved hold or review path rather than
          inventing a zero score.
        hold: 0.75
        visual_cues:
          - id: modality-missing
            phrase: O C R can miss a small overlay
            targets:
              - modality-contract-mechanism
            color: cyan
            linger: 0.5
          - id: modality-hold
            phrase: preserve that missing assessment
            targets:
              - modality-contract-mechanism
            color: yellow
            linger: 0.5
  - id: video-evidence
    title: Which frames should the reviewer see?
    visual: A filmstrip keeps all twelve brightness readings in place. A one-second clock and differences
      between neighbors select frames. Two tiles then swap their halves while their mean stays fixed.
    beats:
      - say: This clip has twelve frames. Each tile shows one frame’s average brightness. At four frames a second,
          taking one frame each second picks zero, four, and eight. There’s another way to catch a short
          change. Compare each number with the one just before it. Which two jumps, up or down, are greater
          than thirty?
        hold: 2.25
        visual_cues:
          - id: video-all
            phrase: Each tile shows one frame’s average brightness
            targets:
              - video-strip
            color: cyan
            linger: 0.3
          - id: video-regular
            phrase: picks zero, four, and eight
            targets:
              - video-strip
            color: cyan
            linger: 0.3
          - id: video-ask
            phrase: Which two jumps, up or down, are greater than thirty
            targets:
              - video-strip
              - video-pair
            color: yellow
            linger: 0.3
      - say: Frame six jumps from sixteen to eighty-two. That adds frame six at one and a half seconds. Look
          toward the other end of the strip. Eighty-six drops to eighteen, a difference of sixty-eight. Add
          frame ten at two and a half seconds. The reviewer gets five frames, each with its own timestamp.
        hold: 1
        caption_starts:
          - Eighty-six drops to eighteen
        visual_cues:
          - id: video-rise
            phrase: That adds frame six at one and a half seconds
            targets:
              - video-strip
              - video-pair
            color: cyan
            linger: 0.3
            caption_boundary: true
          - id: video-drop
            phrase: Add frame ten at two and a half seconds
            targets:
              - video-strip
              - video-pair
            color: cyan
            linger: 0.3
            caption_boundary: true
      - say: Now look at the two tiles below the strip. The light and dark halves switch places. Their average
          brightness stays exactly the same. A detector that watches only that number misses the change.
          Test stronger sampling signals against missed cuts and brief overlays. Text recognition can miss
          an overlay even on a selected frame. A live service can stop the next segment, but viewers have
          already seen the previous one. An upload can wait for those checks before anybody sees it.
        hold: 0.85
        visual_cues:
          - id: video-limit
            phrase: Their average brightness stays exactly the same
            targets:
              - video-pair
            color: yellow
            linger: 0.3
            caption_boundary: true
          - id: video-live
            phrase: A live service can stop the next segment
            targets:
              - video-pair
            color: cyan
            linger: 0.3
  - id: fusion-boundary
    title: Evidence for a profile decision
    visual: Two full-length contributions start on separate tracks and join on the same score ruler. A fixed
      mark shows the inclusive review threshold. An approved signature takes a separate route.
    beats:
      - say: For these two uploads the approved signature lookup found no match. The upper strip measures the
          caption’s contribution. Multiply its score by point four five. The lower strip measures the
          image’s contribution. Multiply by point five five. Both strips use the same ruler. Compare the
          study group photo with the official-account claim. Imagine sliding each image strip onto the end
          of its caption. At point six five we send the upload for review. Which upload needs someone to
          check who owns the account?
        hold: 2.4
        visual_cues:
          - id: fusion-weights
            phrase: Both strips use the same ruler
            targets:
              - fusion-scale
              - fusion-study
            color: cyan
            linger: 0.3
          - id: fusion-claim-input
            phrase: Compare the study group photo with the official-account claim
            targets:
              - fusion-claim
            color: cyan
            linger: 0.3
          - id: fusion-question
            phrase: Which upload needs someone to check who owns the account
            targets:
              - fusion-study
              - fusion-claim
              - fusion-scale
              - fusion-prompt
            color: yellow
            linger: 0.3
      - say: Start with the study group. Its weighted sum is point one zero two, below review. For the account
          claim, the caption contributes point three one nine five. The image adds point three seven four,
          totaling point six nine three five. That crosses review. The reviewer needs evidence of who speaks
          for the account. Even the highest combined score on this rule only asks for review. The point with
          both scores point six five lies exactly on the inclusive review boundary. Equality sends that
          upload to review too.
        hold: 0.9
        visual_cues:
          - id: fusion-low
            phrase: Its weighted sum is point one zero two, below review
            targets:
              - fusion-study
            color: cyan
            linger: 0.3
            caption_boundary: true
          - id: fusion-high
            phrase: totaling point six nine three five. That crosses review
            targets:
              - fusion-claim
            color: yellow
            linger: 0.3
            caption_boundary: true
          - id: fusion-edge-complete
            phrase: The point with both scores point six five lies exactly on the inclusive review boundary
            targets:
              - fusion-edge
            color: yellow
            linger: 0.3
            caption_boundary: true
      - say: Take away the caption score. This time an authorized service confirms a known prohibited signature.
          That match blocks publication. Route the case to the restricted workflow. The signature check
          already gave the controller its policy basis.
        hold: 0.95
        visual_cues:
          - id: fusion-signature
            phrase: That match blocks publication
            targets:
              - signature-input
              - signature-route
            color: pink
            linger: 0.3
            caption_boundary: true
      - say: Run the same missing-caption case with no match. Now the combined score is unavailable, so hold the
          upload for review. If the signature flag itself has an unknown type, send that case for review
          too. These scores illustrate a routing rule. To decide whether a profile is authentic, a reviewer
          still needs account evidence.
        hold: 0.75
        visual_cues:
          - id: fusion-invalid
            phrase: hold the upload for review
            targets:
              - signature-input
              - signature-route
            color: yellow
            linger: 0.3
            caption_boundary: true
          - id: fusion-unknown
            phrase: the signature flag itself has an unknown type
            targets:
              - signature-input
              - signature-route
            color: yellow
            linger: 0.3
  - id: policy-release
    title: Would you promote the draft rule?
    visual: The same three labeled strings run through both candidate rules. A single mismatched row holds the
      draft and leaves the active version in place.
    beats:
      - say: Return to the two posts from the opening and add ordinary study notes as a control. Each case has a
          decision a reviewer expects. With the full phrase in version forty-three, all three decisions match
          what the reviewer expects. Run the one-word draft on exactly the same text. It catches the claim, but the
          classroom row flips to block. One failed case keeps version forty-three active.
        hold: 1
        visual_cues:
          - id: release-specific
            phrase: all three decisions match what the reviewer expects
            targets:
              - release-records
            color: cyan
            linger: 0.3
          - id: release-broad
            phrase: the classroom row flips to block
            targets:
              - release-records
              - release-switch
            color: pink
            linger: 0.3
            caption_boundary: true
      - say: Passing three examples tells us those three cases behaved as expected. A policy pack or exact
