  - id: exchangeability
    title: Let every score take its turn as the future one
    visual: Enumerate ten distinct score identities and actually remove each held-out identity before calibrating
      the remaining nine.
    beats:
      - say: "The rank argument needs exchangeability: the joint distribution of calibration examples and the future
          example is unchanged by permuting their positions. Independent draws from one distribution are
          sufficient, but exchangeability is broader. A permutation of one observed list does not establish
          that distributional property."
        hold: 0.8
        visual_cues:
          - id: exchangeability-b1
            phrase: "The rank argument needs exchangeability: the joint distribution of calibration examples and the
              future example is unchanged by permuting their positions"
            targets:
              - exchangeability-mechanism
            linger: 0.65
      - say: To see the counting argument, use a separate rank-only fixture with ten distinct scores, one through ten.
          Hold out each score in turn as the future one and calibrate on the remaining nine. The eighth
          calibration score is nine when the held-out score is among one through eight. Each of those eight is
          covered.
        hold: 0.8
        visual_cues:
          - id: exchangeability-b2
            phrase: To see the counting argument, use a separate rank-only fixture with ten distinct scores, one through
              ten
            targets:
              - exchangeability-mechanism
            linger: 0.65
          - id: rank-enumerate
            phrase: Hold out each score in turn as the future one and calibrate on the remaining nine. The eighth
              calibration score is nine when the held-out score is among one through eight. Each of those
              eight is covered
            targets:
