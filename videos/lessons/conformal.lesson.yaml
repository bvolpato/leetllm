  - id: aps-crossing
    title: Including the first crossing label enlarges the set
    visual: Carry the same cumulative staircase past the threshold and distinguish direct inversion from its
      conservative superset.
    beats:
      - say: A simple conservative variant includes labels through the first cumulative sum strictly greater than q.
          If no crossing exists, keep all labels. Since it contains the direct-inversion set, it preserves the
          lower marginal coverage guarantee, potentially at a larger set size.
        hold: 0.8
        visual_cues:
          - id: aps-crossing-b1
            phrase: A simple conservative variant includes labels through the first cumulative sum strictly greater than q
            targets:
              - aps-crossing-mechanism
            linger: 0.65
          - id: cf-cross-build
            phrase: A simple conservative variant includes labels through the first cumulative sum strictly greater than q
            targets:
              - aps-crossing-mechanism
            color: cyan
            linger: 0.35
      - say: For the confident row, the first label already crosses point nine, so this variant keeps class zero. For
          the uniform row, the fourth label crosses and all four remain. If a cumulative sum equals the
          threshold exactly, direct inversion includes that label and the conservative construction continues
