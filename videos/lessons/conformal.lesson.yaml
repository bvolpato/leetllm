  - id: ties-bound
    title: A repeated boundary can make coverage conservative
    visual: Retain duplicate scores at the same threshold, then compare distinct ranks with an all-zero
      counterexample.
    beats:
      - say: Our latency fixture has two errors of three milliseconds. Keep both rows and include outcomes at the
          threshold. Ties can make the basic rule conservative, but do not invalidate its lower coverage
          bound. If every score is zero, the inclusive set can cover one hundred percent rather than exactly
          eighty.
        hold: 0.8
        visual_cues:
          - id: ties-bound-b1
            phrase: Our latency fixture has two errors of three milliseconds
            targets:
              - ties-bound-mechanism
            linger: 0.65
          - id: ties-all-zero
            phrase: the inclusive set can cover one hundred percent rather than exactly eighty
            targets:
              - ties-bound-mechanism
            color: green
            linger: 0.6
          - id: cf-zero-ties
            phrase: the inclusive set can cover one hundred percent rather than exactly eighty
            targets:
              - ties-bound-mechanism
            color: cyan
            linger: 0.35
      - say: With almost surely distinct scores, the unmodified corrected-rank rule has coverage exactly k divided by
          n plus one. A common looser bound is one minus alpha through one minus alpha plus one over n plus
          one. Here that bound is eighty through ninety percent while the exact distinct-rank coverage is
          eighty.
        hold: 0.8
        visual_cues:
          - id: ties-bound-b2
            phrase: With almost surely distinct scores, the unmodified corrected-rank rule has coverage exactly k divided
              by n plus one
            targets:
              - ties-bound-mechanism
            linger: 0.65
          - id: cf-distinct-ranks
            phrase: the unmodified corrected-rank rule has coverage exactly k divided by n plus one
            targets:
              - ties-bound-mechanism
            color: cyan
            linger: 0.35
          - id: cf-looser-bound
            phrase: Here that bound is eighty through ninety percent while the exact distinct-rank coverage is eighty
            targets:
              - ties-bound-mechanism
            color: cyan
            linger: 0.35
      - say: These statements average over calibration and the next outcome. For a single fixed calibration sample,
          even a very large test set can have a different coverage rate. That does not turn the marginal
          theorem into an individual-request probability or a guarantee for every tenant.
        hold: 0.8
        visual_cues:
          - id: ties-bound-b3
            phrase: These statements average over calibration and the next outcome
            targets:
              - ties-bound-mechanism
            linger: 0.65
  - id: coverage
    title: Four new outcomes measure a different quantity
    visual: Four actual prediction intervals retain their centers and observed outcomes, accumulating three hits
      and one miss.
    beats:
      - say: Now freeze the radius at eight. Our four new predictions are forty, forty-two, thirty-eight and
          forty-four. Their outcomes are forty-four, forty-eight, thirty-five and fifty-five. The first three
          lie inside their respective intervals; the last misses its upper endpoint of fifty-two.
        hold: 0.8
        visual_cues:
          - id: coverage-b1
            phrase: Now freeze the radius at eight
            targets:
              - coverage-mechanism
            linger: 0.65
      - say: "Three of four is seventy-five percent observed coverage. It does not contradict an eighty-percent
          marginal guarantee: the calibration sample selected one radius and the four test outcomes add
          another source of variation. This tiny synthetic evaluation is neither a population estimate with
          precision nor a comparison of deployed models."
        hold: 0.8
        visual_cues:
          - id: coverage-b2
            phrase: Three of four is seventy-five percent observed coverage
            targets:
              - coverage-mechanism
            linger: 0.65
          - id: cf-observed-coverage
            phrase: Three of four is seventy-five percent observed coverage
            targets:
              - coverage-mechanism
            color: cyan
            linger: 0.35
      - say: Report interval width alongside coverage. An unbounded set can maximize coverage while providing little
          decision value. Keep counts, model and calibration versions, group identity, prediction set and
          observed outcome. Small subgroup counts need uncertainty, and no finite monitoring log proves future
          exchangeability.
        hold: 0.8
        visual_cues:
          - id: coverage-b3
            phrase: Report interval width alongside coverage
            targets:
              - coverage-mechanism
            linger: 0.65
  - id: classifier-score
    title: A candidate label needs its own nonconformity score
    visual: Convert label probabilities into individual one-minus-probability scores, then invert the calibrated
      cutoff.
    beats:
      - say: A classifier returns labels rather than milliseconds. One possible nonconformity score for a candidate
          label is one minus that label’s model probability. Calibrate the true labels’ scores, then include
          each candidate whose score is at most q. Equivalently its probability must be at least one minus q.
        hold: 0.8
        visual_cues:
          - id: classifier-score-b1
            phrase: A classifier returns labels rather than milliseconds
            targets:
              - classifier-score-mechanism
            linger: 0.65
      - say: The article supplies nine calibration rows whose true class is zero, with class-zero probabilities point
          five five through point nine five. Their separately calibrated softmax-score threshold is point
          four, so the probability cutoff is point six. A new confident row point nine eight, point zero one,
          point zero zero five, point zero zero five keeps class zero.
        hold: 0.8
        visual_cues:
          - id: classifier-score-b2
            phrase: The article supplies nine calibration rows whose true class is zero, with class-zero probabilities
              point five five through point nine five
            targets:
              - classifier-score-mechanism
            linger: 0.65
          - id: softmax-set
            phrase: keeps class zero
            targets:
              - classifier-score-mechanism
            color: green
            linger: 0.6
          - id: cf-softmax-threshold
            phrase: Their separately calibrated softmax-score threshold is point four, so the probability cutoff is point
              six
            targets:
              - classifier-score-mechanism
            color: cyan
            linger: 0.35
          - id: cf-softmax-set
            phrase: keeps class zero
            targets:
              - classifier-score-mechanism
            color: cyan
            linger: 0.35
      - say: For four equal class probabilities of point two five, no label reaches point six, so this rule returns an
          empty set. Model probabilities need not be calibrated for conformal validity under the data
          assumptions, but poor scores can produce inefficient sets. Empty, singleton and large sets each need
          an explicit downstream policy.
        hold: 0.8
        visual_cues:
          - id: classifier-score-b3
            phrase: For four equal class probabilities of point two five, no label reaches point six, so this rule returns
              an empty set
            targets:
              - classifier-score-mechanism
            linger: 0.65
