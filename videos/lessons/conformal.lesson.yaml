  - id: shift
    title: A changed stream needs a new statistical argument
    visual: Hold the original radius fixed while long-request weight and observed misses change, preserving the
      subgroup counters.
    beats:
      - say: A heavy-tailed but exchangeable outcome distribution can still support split conformal. A changing queue,
          time trend or dependent traffic stream can instead break the needed relation. A frozen model alone
          does not keep new residuals exchangeable with an old calibration sample.
        hold: 0.8
        visual_cues:
          - id: shift-b1
            phrase: A heavy-tailed but exchangeable outcome distribution can still support split conformal
            targets:
              - shift-mechanism
            linger: 0.65
      - say: Monitor current labeled outcomes and the process that obtains them. Fresh calibration after a model or
          process change helps only if its collection and the subsequent stream satisfy the chosen method’s
          assumptions. Shift-aware and time-aware methods add their own weighting, assumptions and guarantees;
          a shuffle is not a substitute.
        hold: 0.8
        visual_cues:
          - id: shift-b2
            phrase: Monitor current labeled outcomes and the process that obtains them
            targets:
              - shift-mechanism
            linger: 0.65
      - say: "Keep the question precise: is the model biased, is error size input-dependent, did a group mixture
          change, or did fitting contaminate calibration? These failures call for different repairs. Preserve
          both counts and interval widths before attributing a lower coverage rate to the quantile algebra."
        hold: 0.8
        visual_cues:
          - id: shift-b3
            phrase: "Keep the question precise: is the model biased, is error size input-dependent, did a group mixture
              change, or did fitting contaminate calibration"
            targets:
              - shift-mechanism
            linger: 0.65
  - id: crc-loss
    title: Define the costly event before choosing a threshold
    visual: Retain accepted and wrong indicators on each request, separating joint error over arrivals from error
      among selected answers.
    beats:
      - say: For an automated-answer router, latency coverage is not the costly event. One target is an incorrect
          answer that was accepted, measured per incoming request. Another is the error rate among accepted
          answers. The second divides by acceptance probability and can behave differently as the router
          becomes stricter.
        hold: 0.8
        visual_cues:
          - id: crc-loss-b1
            phrase: For an automated-answer router, latency coverage is not the costly event
            targets:
              - crc-loss-mechanism
            linger: 0.65
      - say: Conformal risk control can bound expected future loss for exchangeable loss curves that are bounded,
          non-increasing as a conservativeness parameter increases, and right-continuous, with a maximally
          conservative fallback whose loss meets the target. For losses in zero through one, multiply the
          empirical mean loss by n, add one, then divide that entire sum by n plus one.
        hold: 0.8
        visual_cues:
          - id: crc-loss-b2
            phrase: Conformal risk control can bound expected future loss for exchangeable loss curves that are bounded,
              non-increasing as a conservativeness parameter increases, and right-continuous, with a maximally
              conservative fallback whose loss meets the target
            targets:
              - crc-loss-mechanism
            linger: 0.65
      - say: The theorem controls expected loss over calibration and a new example, not a high-probability certificate
          conditional on this realized calibration sample. An arbitrary non-monotone loss or changing
          selective-error ratio does not receive the same basic guarantee. Reliable labels and a fixed
          generation and verifier procedure remain necessary.
        hold: 0.8
        visual_cues:
          - id: crc-loss-b3
            phrase: The theorem controls expected loss over calibration and a new example, not a high-probability
              certificate conditional on this realized calibration sample
            targets:
              - crc-loss-mechanism
            linger: 0.65
