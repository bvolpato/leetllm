    title: One extra mistake changes the admitted threshold
    visual: Nine score/wrong records move through a strict threshold; corrected risk counts determine the first
      passing threshold.
    beats:
      - say: Our separate nine-row router accepts only scores strictly greater than lambda. Wrong answers have scores
          point one, point six and point nine; the six correct answers occupy point two through point eight
          excluding point six. These verifier scores are arbitrary outputs, not truth probabilities. When
          lambda reaches a score, that request stops being accepted, giving the required right-continuous
          drop.
        hold: 0.8
        visual_cues:
          - id: crc-threshold-b1
            phrase: Our separate nine-row router accepts only scores strictly greater than lambda
            targets:
              - crc-threshold-mechanism
            linger: 0.65
      - say: At lambda point one, two mistakes remain accepted. Their empirical joint rate is two ninths, about
          twenty-two point two percent, which looks below the twenty-five-percent target. For the corrected
          criterion, add one to those two mistakes, then divide by ten, giving thirty percent, so this
          threshold fails. For a binary joint-error loss the general criterion is accepted mistakes plus one,
          all divided by n plus one.
        hold: 0.8
        visual_cues:
          - id: crc-threshold-b2
            phrase: At lambda point one, two mistakes remain accepted
            targets:
              - crc-threshold-mechanism
            linger: 0.65
          - id: cf-crc-fail
            phrase: giving thirty percent, so this threshold fails
            targets:
              - crc-threshold-mechanism
            color: cyan
            linger: 0.35
      - say: Lambda point six leaves one mistake among three accepted answers. The corrected criterion is two tenths,
          twenty percent, so it passes. The observed calibration joint error is one ninth, about eleven point
          one percent; selective error is one third, thirty-three point three percent. If no candidate passes,
          threshold one accepts none and provides the zero-loss fallback. These calibration counts are not
          future error measurements.
        hold: 0.8
        visual_cues:
          - id: crc-threshold-b3
            phrase: Lambda point six leaves one mistake among three accepted answers
            targets:
              - crc-threshold-mechanism
            linger: 0.65
