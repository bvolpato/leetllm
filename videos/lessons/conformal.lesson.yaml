            color: cyan
            linger: 0.6
          - id: cf-enumerate-eight
            phrase: Each of those eight is covered
            targets:
              - exchangeability-mechanism
            color: cyan
            linger: 0.35
      - say: When nine is held out, the eighth remaining score is eight, so nine misses. Holding out ten also gives
          threshold eight and a miss. Eight of ten possible future ranks are covered. Under exchangeability
          these distinct ranks are equally likely, so the corrected construction earns eighty percent; this is
          enumeration, not new latency data.
        hold: 0.8
        visual_cues:
