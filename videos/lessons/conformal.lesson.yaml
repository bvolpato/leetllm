scenes:
  - id: intro
    title: Does a 40 ms prediction support a 50 ms deadline?
    visual: Retain a 40 ms point, a 50 ms deadline and later the calibrated interval; distinguish a new outcome
      from a population mean.
    beats:
      - say: A latency model predicts forty milliseconds. The caller needs fifty. A point prediction alone does not
          show how large the next miss might be. We will construct an interval from held-out errors, then ask
          what its coverage statement actually permits us to conclude about that deadline.
        hold: 0.8
        visual_cues:
          - id: intro-b1
            phrase: A latency model predicts forty milliseconds
            targets:
              - intro-mechanism
            linger: 0.65
      - say: A prediction interval covers a new outcome. A confidence interval instead estimates a population
          quantity, such as mean latency. Split conformal prediction wraps a frozen predictor with a held-out
          score threshold. It does not need Gaussian errors, but it does need an appropriate relationship
          between calibration and future examples.
        hold: 0.8
        visual_cues:
          - id: intro-b2
            phrase: A prediction interval covers a new outcome
            targets:
              - intro-mechanism
            linger: 0.65
      - say: Every latency, probability and router count in this film is supplied teaching data. The article’s nine
          runnable programs check arithmetic and set construction, not a fitted production latency model. We
          will keep the same nine request identities through residuals, sorting and a new interval, then
          extend the score idea to classification and expected risk.
        hold: 0.8
        visual_cues:
          - id: intro-b3
            phrase: Every latency, probability and router count in this film is supplied teaching data
            targets:
              - intro-mechanism
            linger: 0.65
  - id: split
    title: Freeze the procedure before calibration
    visual: Three disjoint data roles retain incident IDs; a feedback arrow from calibration to fitting is rejected.
    beats:
      - say: Fit the predictor using training data, and use separate validation evidence for model selection. Freeze
          preprocessing, predictor and score rule before reading calibration outcomes. Calibration measures
          that procedure’s errors; a separate test set then measures its sets on new examples.
        hold: 0.8
        visual_cues:
          - id: split-b1
            phrase: Fit the predictor using training data, and use separate validation evidence for model selection
            targets:
              - split-mechanism
            linger: 0.65
      - say: Repeatedly tuning the model against the calibration errors makes those outcomes part of fitting. Choosing
          only the easiest calibration requests after seeing their errors also changes the intended sampling
          law. A filename called calibration does not establish either independence from fitting or
          exchangeability with deployment.
        hold: 0.8
        visual_cues:
          - id: split-b2
            phrase: Repeatedly tuning the model against the calibration errors makes those outcomes part of fitting
            targets:
              - split-mechanism
            linger: 0.65
      - say: Condition on the independently fitted procedure. The usual coverage probability averages over the
          calibration sample and the new outcome together. It does not condition on one particular realized
          calibration sample. Keep the actual predictions and observations so the score threshold remains
          auditable.
        hold: 0.8
        visual_cues:
          - id: split-b3
            phrase: Condition on the independently fitted procedure
            targets:
              - split-mechanism
            linger: 0.65
  - id: scores
    title: The same request becomes one absolute residual
    visual: Connect each actual frozen prediction and outcome to its absolute difference, preserving C1 through C9.
    beats:
      - say: Our nine frozen predictions are thirty through seventy milliseconds in steps of five. Their supplied
          outcomes are thirty-two, thirty-two, forty-three, forty-one, fifty-five, forty-nine, sixty-seven,
          fifty-seven and eighty-two. For each request, subtract its prediction from its outcome and take the
          absolute value.
        hold: 0.8
        visual_cues:
          - id: scores-b1
            phrase: Our nine frozen predictions are thirty through seventy milliseconds in steps of five
            targets:
              - scores-mechanism
            linger: 0.65
      - say: The absolute residuals are two, three, three, four, five, six, seven, eight and twelve milliseconds. Each
          measures distance from its predicted center, not whether the model overestimated or underestimated.
          We can display the records in a different order while keeping each value attached to its request
          identity.
        hold: 0.8
        visual_cues:
          - id: scores-b2
            phrase: The absolute residuals are two, three, three, four, five, six, seven, eight and twelve milliseconds
            targets:
              - scores-mechanism
            linger: 0.65
      - say: This absolute-error score gives the same radius around every new prediction. A different fixed score can
          produce different set shapes. If a separate frozen scale model predicts larger error sizes for some
          inputs, normalized scores can adapt the width; we will calibrate that rule separately.
        hold: 0.8
        visual_cues:
          - id: scores-b3
            phrase: This absolute-error score gives the same radius around every new prediction
            targets:
              - scores-mechanism
            linger: 0.65
  - id: quantile
    title: Choose the corrected rank before its value
    visual: Identified residual records travel into stable sorted slots; a separate future slot earns the extra
      one in n+1.
    beats:
      - say: For a desired eighty-percent marginal coverage, alpha is twenty percent. With n calibration scores,
          multiply n plus one by one minus alpha, then take the ceiling of that entire product to obtain k.
          Round upward. Nine calibration scores plus the future position give ten times point eight, so k is
          eight.
        hold: 0.8
        visual_cues:
          - id: quantile-b1
            phrase: For a desired eighty-percent marginal coverage, alpha is twenty percent
            targets:
              - quantile-mechanism
            linger: 0.65
          - id: rank-eight
            phrase: so k is eight
            targets:
              - quantile-mechanism
            color: yellow
            linger: 0.6
          - id: cf-rank-eight
            phrase: so k is eight
            targets:
              - quantile-mechanism
            color: cyan
            linger: 0.35
      - say: Sort the nine residuals and select the eighth observed value. The rank is eight and its value is eight
          milliseconds; those are different quantities. At an eighty-five-percent target, ten times point
          eight five rounds upward to rank nine instead.
        hold: 0.8
        visual_cues:
          - id: quantile-b2
            phrase: Sort the nine residuals and select the eighth observed value
            targets:
              - quantile-mechanism
            linger: 0.65
          - id: rank-sort
            phrase: Sort the nine residuals and select the eighth observed value
            targets:
              - quantile-mechanism
            color: yellow
            linger: 0.6
          - id: rank-value
            phrase: its value is eight milliseconds
            targets:
              - quantile-mechanism
            color: yellow
            linger: 0.6
          - id: cf-rank-value
            phrase: its value is eight milliseconds
            targets:
              - quantile-mechanism
            color: cyan
            linger: 0.35
      - say: The future position is why multiplying the calibration count alone by coverage gives the wrong rule.
          Pause and predict the interval around forty milliseconds using the selected eight-millisecond
          radius. Keep that center and radius visible; the next construction will place both endpoints.
        hold: 0.8
        visual_cues:
          - id: quantile-b3
            phrase: The future position is why multiplying the calibration count alone by coverage gives the wrong rule
            targets:
              - quantile-mechanism
            linger: 0.65
  - id: index-contract
    title: A library percentile need not select the desired order statistic
    visual: Separate the one-based rank, zero-based index and NumPy higher-position calculation on the same sorted
      scores.
    beats:
      - say: A numbered order statistic must be translated into the library’s actual convention. Rank eight uses
          zero-based index seven in the sorted list. The article selects that observed value directly, or uses
          partition at that index, rather than interpolating between residuals.
        hold: 0.8
        visual_cues:
          - id: index-contract-b1
            phrase: A numbered order statistic must be translated into the library’s actual convention
            targets:
              - index-contract-mechanism
            linger: 0.65
          - id: cf-zero-index
            phrase: Rank eight uses zero-based index seven in the sorted list
            targets:
              - index-contract-mechanism
            color: cyan
            linger: 0.35
      - say: NumPy’s higher quantile method uses a different position formula. On these same nine scores, asking for
          level eight ninths returns the ninth score, twelve, rather than the desired eighth score, eight.
          That answer is conservative in this example but is a different threshold. The executed NumPy check
          makes the mismatch visible.
        hold: 0.8
        visual_cues:
          - id: index-contract-b2
            phrase: NumPy’s higher quantile method uses a different position formula
            targets:
              - index-contract-mechanism
            linger: 0.65
          - id: cf-numpy-higher
            phrase: returns the ninth score, twelve, rather than the desired eighth score, eight
            targets:
              - index-contract-mechanism
            color: cyan
            linger: 0.35
      - say: For ninety-percent coverage the corrected rank is nine and the radius is twelve. At ninety-five percent
          it is ten, beyond the nine observations, so this ordinary residual rule uses positive infinity. Do
          not clip the rank or invent another error. Nineteen calibration scores first allow a finite observed
          ninety-five-percent threshold, though that mathematical minimum may be statistically unstable.
        hold: 0.8
        visual_cues:
          - id: index-contract-b3
            phrase: For ninety-percent coverage the corrected rank is nine and the radius is twelve
            targets:
              - index-contract-mechanism
            linger: 0.65
          - id: rank-infinite
            phrase: uses positive infinity
            targets:
              - index-contract-mechanism
            color: pink
            linger: 0.6
          - id: cf-ninety-percent
            phrase: For ninety-percent coverage the corrected rank is nine and the radius is twelve
            targets:
              - index-contract-mechanism
            color: cyan
            linger: 0.35
          - id: cf-infinity
            phrase: so this ordinary residual rule uses positive infinity
            targets:
              - index-contract-mechanism
            color: cyan
            linger: 0.35
          - id: cf-minimum-n
