            phrase: When nine is held out, the eighth remaining score is eight, so nine misses
            targets:
              - exchangeability-mechanism
            linger: 0.65
          - id: rank-last-two
            phrase: When nine is held out, the eighth remaining score is eight, so nine misses. Holding out ten also gives
