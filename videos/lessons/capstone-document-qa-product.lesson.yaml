version: 1
id: capstone-document-qa-product
title: When Can a Document Answer for Policy?
source: foundations/capstone-document-qa-product/content.md
sources:
  - title: "Lewis et al.: retrieval-augmented generation"
    url: https://arxiv.org/abs/2005.11401
  - title: FActScore
    url: https://aclanthology.org/2023.emnlp-main.741/
  - title: TRUE factual consistency
    url: https://aclanthology.org/2022.naacl-main.287/
  - title: Ragas
    url: https://arxiv.org/abs/2309.15217
  - title: Lost in the Middle
    url: https://arxiv.org/abs/2307.03172
  - title: BERT passage reranking
    url: https://arxiv.org/abs/1901.04085
  - title: FastAPI TestClient
    url: https://fastapi.tiangolo.com/tutorial/testing/
  - title: Google Deep Research
    url: https://ai.google.dev/gemini-api/docs/deep-research
scenes:
  - id: intro
    title: "When can support restore an API key?"
    visual: "A folded policy page and a sticky note slide together. An underline follows the policy’s timing. Compare both pages with the publisher’s register, then reveal which page enters the index."
    beats:
      - say: >-
          The policy says support can restore an API key after identity verification. The note beside it suggests immediate access. Check the publisher’s register. The policy has an active grant, and its text matches the approved copy. The note has no entry. Which page belongs in the policy index?
        hold: 2.4
        caption_starts:
          - "The note beside it"
          - "Check the publisher’s register"
          - "Which page belongs in the policy index"
        visual_cues:
          - id: intro-timing
            phrase: "after identity verification"
            targets: [policy-page]
          - id: intro-note
            phrase: "The note beside it suggests immediate access"
            targets: [workspace-page]
          - id: intro-register
            phrase: "Check the publisher’s register"
            targets: [registry-entries]
          - id: intro-choice
            phrase: "Which page belongs in the policy index"
            targets: [index-question]
      - say: >-
          Only the access policy goes in. A caller who can read it can now find it in a search. Before quoting it, the service needs a review that ties this passage to the caller’s exact question.
        hold: 0.9
        caption_starts:
          - "A caller who can read it"
        visual_cues:
          - id: intro-verdict
            phrase: "Only the access policy goes in"
            targets: [index-decision]
            caption_boundary: true
  - id: admission
    title: "Which copy did the publisher approve?"
    visual: "Three parser records line up with their registry entries and admission decisions. Editing only the access policy changes its digest and prevents the edited copy from entering the index."
    beats:
      - say: >-
          The parser gives us three records. Here are their document names and the first few digits of each text fingerprint. The registry holds the fingerprint the publisher expects. The access policy and the incident policy both match an active US grant. Admit those two and exclude the note. The incident policy belongs in the collection even though this particular question is about access.
        hold: 0.85
        visual_cues:
          - id: admission-parse
            phrase: "three records"
            targets: [parsed-records]
          - id: admission-registry
            phrase: "The registry holds the fingerprint"
            targets: [registry-records]
          - id: admission-initial
            phrase: "Admit those two and exclude the note"
            targets: [index-rows]
      - say: >-
          Try a new build. In the first file, change “may be restored” to “may not be restored.” Its document ID stays the same. Compare the two fingerprints. Reject the edited copy. Keep the approved version so a reviewer can recover the passage a caller actually saw. Limit who can change the registry. Anyone who can replace the expected hash can change what passes this comparison.
        hold: 1.1
        visual_cues:
          - id: admission-edit
            phrase: "change “may be restored” to “may not be restored”"
            targets: [source-edit]
          - id: admission-reject
            phrase: "Reject the edited copy"
            targets: [index-rows]
            caption_boundary: true
  - id: strict-corpus
    title: "What else can invalidate a source?"
    visual: "Follow a duplicated identifier, a mistaken grant and an edit made after the app loads its snapshot."
    beats:
      - say: >-
          Suppose two input records share a document ID. Even identical text leaves two records competing for one identity. Reject both and keep one decision per input. For a unique ID, check the registry flag types. The string “false” and the number one are invalid Boolean flags. Admission requires an active grant for a published policy, the expected scope and an exact text digest.
        hold: 0.9
        visual_cues:
          - id: corpus-id-pair
            phrase: "two input records share a document ID"
            targets: [strict-corpus-mechanism]
          - id: corpus-duplicates
            phrase: "Reject both"
            targets: [strict-corpus-mechanism]
            caption_boundary: true
          - id: corpus-typed-flags
            phrase: "check the registry flag types"
            targets: [strict-corpus-mechanism]
          - id: corpus-admit-checks
            phrase: "an active grant for a published policy, the expected scope and an exact text digest"
            targets: [strict-corpus-mechanism]
      - say: >-
          What if the mistake is in the registry itself? A publisher mistakenly grants the private note active policy status with a matching digest. Admission accepts the note. Repair the grant and control who can write to the registry. Ranking cannot repair that authority decision. Even an admitted document supplies text to read. Any downstream access change needs separate authorization.
        hold: 0.9
        visual_cues:
          - id: registry-authority
            phrase: "the mistake is in the registry itself"
            targets: [strict-corpus-mechanism]
          - id: bad-registry-grant
            phrase: "Admission accepts the note"
            targets: [strict-corpus-mechanism]
            caption_boundary: true
          - id: document-data-only
            phrase: "Any downstream access change needs separate authorization"
            targets: [strict-corpus-mechanism]
      - say: >-
          When the app starts, it fingerprints the registry, admitted records and parser identity. Edit a file on disk. The running app still holds the snapshot it loaded. Decide how to reload a revocation, and retain versioned sources for replay. The example takes the effective flag from its fixture. A live policy service would also have to resolve the effective date.
        hold: 0.85
        visual_cues:
          - id: snapshot-components
            phrase: "the registry, admitted records and parser identity"
            targets: [strict-corpus-mechanism]
          - id: snapshot-file-edit
            phrase: "Edit a file on disk"
            targets: [strict-corpus-mechanism]
          - id: snapshot-held
            phrase: "The running app still holds the snapshot it loaded"
            targets: [strict-corpus-mechanism]
            caption_boundary: true
          - id: snapshot-lifetime
            phrase: "retain versioned sources for replay"
            targets: [strict-corpus-mechanism]
  - id: access
    title: "Where does the search begin?"
    visual: "Compare the demo principal’s readable policies with a top-one example in which globally truncating the list removes the only slot for an EU result."
    beats:
      - say: >-
          The support agent signs in. The server resolves the caller’s identity and finds a US region grant. On this snapshot, the caller may read both published policies. An EU caller can read neither. Build that readable set before scoring any passage. The same access rules apply when fetching a source, serving a cached result or returning a citation.
        hold: 0.8
        visual_cues:
          - id: access-b1-1
            phrase: "resolves the caller’s identity"
            targets: [authenticated-caller]
          - id: access-b1-2
            phrase: "may read both published policies"
            targets: [readable-corpus]
          - id: access-b1-3
            phrase: "before scoring any passage"
            targets: [search-candidates]
      - say: >-
          Try the ordering on a different collection. This caller can read EU documents and wants one result. The global top result is a restricted US passage with a score of nine. The best readable alternative scores eight. Taking one first and discarding it leaves zero results. Filtering first returns EU A. Test which order your index actually uses. Let the server resolve permissions. A caller-supplied region field has no authority here.
        hold: 1
        visual_cues:
          - id: access-global
            phrase: "The global top result"
            targets: [access-mechanism]
          - id: access-b2-1
            phrase: "restricted US passage"
            targets: [readable-corpus]
          - id: access-alternative
            phrase: "The best readable alternative"
            targets: [access-mechanism]
          - id: access-result-complete
            phrase: "Taking one first and discarding it leaves zero results. Filtering first returns EU A"
            targets: [access-mechanism]
            caption_boundary: true
          - id: access-b2-2
            phrase: "caller-supplied region"
            targets: [principal]
  - id: retrieval
    title: "Which passage comes back?"
    visual: "A single policy sentence stays pinned. Both question wordings are scanned across its normalized terms. The count is compared with the same two-term threshold."
    beats:
      - say: >-
          Return to the US caller. Here is the first sentence of the approved passage. Lowercase the words, drop common words, and count each shared term once. The analyzer also folds word forms together. “Restored” becomes “restore.” Run across the eight terms that remain in this sentence. All eight match the question. The minimum is two, so we keep this passage as a candidate.
        hold: 0.8
        visual_cues:
          - id: retrieval-count
            phrase: "Run across the eight terms that remain in this sentence"
            targets: [term-scan]
          - id: retrieval-hit
            phrase: "we keep this passage as a candidate"
            targets: [candidate-count]
      - say: >-
          Keep the passage fixed and change the wording of the question. A reviewer uses “live-service credential” for the production API key, and “proves who they are” for identity verification. Scan the new words against the passage. Zero matches. The lexical search returns no candidate. A dense retriever might recover it. If it does, someone still has to review the new question against the passage.
        hold: 0.8
        caption_starts:
          - "Scan the new words against the passage"
          - "Zero matches"
          - "The lexical search returns no candidate"
        visual_cues:
          - id: retrieval-reword
            phrase: "change the wording of the question"
            targets: [query-text]
          - id: retrieval-rescan
            phrase: "Scan the new words against the passage"
            targets: [term-scan]
          - id: retrieval-zero
            phrase: "Zero matches"
            targets: [candidate-count]
          - id: retrieval-miss
            phrase: "The lexical search returns no candidate"
            targets: [candidate-count]
  - id: support
    title: "What does the extra word change?"
    visual: "One word drops into a copy of the policy sentence. Two counters track the intersection and union. The proposed threshold and the edited sentence stay visible during the prediction. A separate lookup checks five fixture review variants."
    beats:
      - say: >-
          Try a shortcut for checking a claim. Start with two copies of the policy sentence. Call their word overlap J. Divide the number of distinct terms they share by the number of distinct terms that appear in at least one of the two sentences. That fraction is called Jaccard similarity. With identical copies, eight over eight is one. A perfect match clears the cutoff. Now slip the word “not” into the lower sentence. Count again. Eight terms still match, and there are now nine distinct terms between the two sentences. The shortcut accepts a claim when J is above point eight. Will it accept this edited claim?
        hold: 2.5
        motion_check:
          region: [105, 455, 1730, 370]
          minimumChangedFraction: 0.002
        visual_cues:
          - id: support-original
            phrase: "eight over eight is one"
            targets: [shortcut-verdict]
            caption_boundary: true
          - id: support-insert
            phrase: "slip the word “not” into the lower sentence"
            targets: [claim-sentence]
          - id: support-count
            phrase: "Count again"
            targets: [word-fraction]
          - id: support-guess
            phrase: "Will it accept this edited claim"
            targets: [shortcut-verdict]
      - say: >-
          The shortcut accepts it. Eight divided by nine is about point eight eight nine. Read the claim it just accepted. The policy permits restoration after verification. The extra word reverses that permission. On the real request, look up the review for this exact question and passage. A matching review labeled entailed permits the answer. A contradicted review says the claim conflicts with the evidence. An unknown judgment leaves support unsettled. A missing receipt gives us nothing to check. A stale receipt names the wrong version. For those four cases, abstain. These are supplied judgments. A real service needs a controlled reviewer or a verifier whose judgments have been evaluated.
        hold: 1.1
        visual_cues:
          - id: support-accept
            phrase: "The shortcut accepts it"
            targets: [shortcut-verdict]
            caption_boundary: true
          - id: support-fraction
            phrase: "Eight divided by nine is about point eight eight nine"
            targets: [word-fraction]
            caption_boundary: true
          - id: support-ledger
            phrase: "look up the review for this exact question and passage"
            targets: [review-ledger]
          - id: receipt-entailed
            phrase: "A matching review labeled entailed permits the answer"
            targets: [review-ledger]
            caption_boundary: true
          - id: receipt-contradicted
            phrase: "A contradicted review"
            targets: [review-ledger]
          - id: receipt-unknown
            phrase: "An unknown judgment"
            targets: [review-ledger]
          - id: receipt-missing
            phrase: "A missing receipt"
            targets: [review-ledger]
          - id: receipt-stale
            phrase: "A stale receipt"
            targets: [review-ledger]
          - id: receipt-refusals-complete
            phrase: "For those four cases, abstain"
            targets: [review-ledger]
            caption_boundary: true
  - id: responses
    title: "One passage, three questions"
    visual: "Three US queries retrieve the same policy with eight, four and two shared terms. Add each review and response to the corresponding query. Keep a missing receipt visibly distinct from a bound unknown judgment."
    beats:
      - say: >-
          Run the original question through the lookup. Eight shared terms brought back this document. Its matching review lets the service return the passage with one citation. Now ask about permanent admin access. Four terms still match. The passage allows restoration after identity verification. It says nothing about permanent admin access. The review says unknown. Abstain and return no citations.
        hold: 0.9
        visual_cues:
          - id: responses-first
            phrase: "return the passage with one citation"
            targets: [restore-case]
            caption_boundary: true
          - id: responses-admin
            phrase: "Now ask about permanent admin access"
            targets: [admin-case]
          - id: responses-second
            phrase: "Abstain and return no citations"
            targets: [admin-case]
            caption_boundary: true
      - say: >-
          For the third request, use words from the private note as the query. Two terms still retrieve the published access policy. The note itself never entered the index. There is no review for this query and the retrieved passage, so this request also gets an abstention. Save both refusals alongside the successful lookup. If you refused every question, the first row would catch the loss of a useful answer.
        hold: 1
        visual_cues:
          - id: responses-note
            phrase: "third request"
            targets: [note-case]
          - id: responses-third
            phrase: "this request also gets an abstention"
            targets: [note-case]
            caption_boundary: true
  - id: typed-http
    title: "What reaches the caller?"
    visual: "Inspect the in-process US response, its exact end-exclusive span and the access and validation failures for other requests."
    beats:
      - say: >-
          Look at the successful response through FastAPI’s in-process test client. The downloadable runner pins three direct dependencies and exercises the endpoint without a network server. The body contains the exact policy passage, its grounded status and a reason. Follow its citation to the document, chunk, section and text hash. The character offsets locate the passage within that snapshot. The support label and receipt identify the judgment that allowed delivery.
        hold: 0.9
        visual_cues:
          - id: http-local
            phrase: "in-process test client"
            targets: [typed-http-mechanism]
          - id: http-answer-body
            phrase: "the exact policy passage"
            targets: [typed-http-mechanism]
          - id: http-source-fields
            phrase: "the document, chunk, section and text hash"
            targets: [typed-http-mechanism]
          - id: http-response
            phrase: "character offsets"
            targets: [typed-http-mechanism]
          - id: http-support-fields
            phrase: "The support label and receipt"
            targets: [typed-http-mechanism]
      - say: >-
          Start at character zero and stop just before character one hundred thirty-eight. That selects both sentences, including the manager approval requirement. Compare the exact text and its hash with the retained source. A document name could stay the same through an edit. Keep the rejected records’ IDs out of the public payload, including debug fields. These credentials and review identities are synthetic fixtures.
        hold: 0.85
        visual_cues:
          - id: span-exact-text
            phrase: "Start at character zero"
            targets: [typed-http-mechanism]
          - id: exact-span
            phrase: "stop just before character one hundred thirty-eight"
            targets: [typed-http-mechanism]
          - id: span-digest
            phrase: "Compare the exact text and its hash"
            targets: [typed-http-mechanism]
          - id: http-private
            phrase: "Keep the rejected records’ IDs out of the public payload"
            targets: [typed-http-mechanism]
      - say: >-
          Now omit the credential. The adapter returns four oh one. A blank question or an extra region field returns four twenty-two. The demo EU reader can authenticate, but it has no readable policy in this snapshot. It receives an abstention with empty citations. A real deployment still needs a verified identity provider, a server-side access policy, and checks against the packaged service.
        hold: 0.85
        visual_cues:
          - id: http-boundaries
            phrase: "four oh one"
            targets: [typed-http-mechanism]
          - id: http-validation
            phrase: "four twenty-two"
            targets: [typed-http-mechanism]
          - id: http-eu
            phrase: "It receives an abstention with empty citations"
            targets: [typed-http-mechanism]
  - id: retrieval-upgrade
    title: "How could search recover the paraphrase?"
    visual: "Compare retrieval alternatives on the frozen paraphrase. Fuse two explicit rank lists, then contrast joint query-passage scoring with separate encodings."
    beats:
      - say: >-
          Remember the live-service credential question. Our lexical search returned no candidate. First have a reviewer check that the rewording preserves the question. Adding a condition would change the test. BM twenty-five weights term frequency, rarity and document length. A bi-encoder compares separate vectors for the question and the passage. Test whether either method recovers this miss. A retrieved passage still needs a matching support review for the new wording.
        hold: 0.85
        visual_cues:
          - id: known-miss
            phrase: "returned no candidate"
            targets: [retrieval-upgrade-mechanism]
          - id: retrieval-bm25
            phrase: "BM twenty-five"
            targets: [retrieval-upgrade-mechanism]
          - id: retrieval-dual
            phrase: "separate vectors for the question and the passage"
            targets: [retrieval-upgrade-mechanism]
      - say: >-
          The two search methods may use different score scales. Combine their ranks instead. Here A comes first in one list and second in the other. For each appearance, add k to the rank, then take one divided by that sum. Add the two contributions. Ranks start at one. With k set to sixty, A gets one over sixty-one plus one over sixty-two. B gets the same terms in reverse order, so they tie. C is absent from both lists and gets zero. This is reciprocal rank fusion. Evaluate the choice of k on your own queries.
        hold: 1.1
        visual_cues:
          - id: rrf-add
            phrase: "add k to the rank, then take one divided by that sum"
            targets: [retrieval-upgrade-mechanism]
          - id: rrf-k
            phrase: "With k set to sixty"
            targets: [retrieval-upgrade-mechanism]
          - id: rrf-param
            phrase: "B gets the same terms in reverse order, so they tie"
            targets: [retrieval-upgrade-mechanism]
            caption_boundary: true
          - id: rrf-rule
            phrase: "C is absent from both lists and gets zero"
            targets: [retrieval-upgrade-mechanism]
            caption_boundary: true
      - say: >-
          A cross-encoder reads each candidate together with the question. Tokens from the two sides can interact while the pair is scored. That joint pass adds computation for every candidate you rerank. Placement matters too. In the Lost in the Middle experiments, moving the same evidence within the context changed how well the models answered. To test that in your service, vary the evidence position and packing budget. Keep the questions fixed and measure answer quality and latency.
        hold: 0.85
        visual_cues:
          - id: cross-token
            phrase: "Tokens from the two sides can interact"
            targets: [retrieval-upgrade-mechanism]
          - id: rerank-scope
            phrase: "adds computation for every candidate"
            targets: [retrieval-upgrade-mechanism]
          - id: position-move
            phrase: "moving the same evidence within the context"
            targets: [retrieval-upgrade-mechanism]
          - id: position-experiment
            phrase: "vary the evidence position and packing budget"
            targets: [retrieval-upgrade-mechanism]
  - id: claim-scope
    title: "Who needs manager approval?"
    visual: "Keep the source sentence in view as a bracket extends from privileged to ordinary access. Check two claims in a draft, remove the unsupported one and compare the survivor with the caller’s question."
    beats:
      - say: >-
          The policy says, “Privileged scopes require manager approval before access is queued.” The short bracket covers privileged access. A draft says, “All restores require manager approval.” Follow its bracket. It reaches ordinary access too. The policy leaves those cases open. When you split a draft into atomic claims, keep the word “privileged” with its rule. Review each claim against the exact words that support it.
        hold: 1
        caption_starts:
          - "A draft says"
          - "The policy leaves those cases open"
        visual_cues:
          - id: claim-source-scope
            phrase: "Privileged scopes require manager approval"
            targets: [claim-scope-mechanism]
          - id: claim-broaden
            phrase: "All restores require manager approval"
            targets: [claim-scope-mechanism]
          - id: scope-broadening
            phrase: "The policy leaves those cases open"
            targets: [claim-scope-mechanism]
          - id: claim-atomic
            phrase: "atomic claims"
            targets: [claim-scope-mechanism]
      - say: >-
          Our caller asks about ordinary access. The draft makes two claims. Privileged access needs approval. The policy supports that one. Ordinary access needs it too. The policy never says that. One of the two claims has support. FActScore measures that fraction across atomic facts. Remove the unsupported claim. Now read the caller’s question again. The remaining claim covers privileged access. For ordinary access, the service abstains.
        hold: 0.9
        caption_starts:
          - "The policy supports that one"
          - "The policy never says that"
          - "One of the two claims has support"
          - "Remove the unsupported claim"
          - "The remaining claim covers privileged access"
        visual_cues:
          - id: claim-supported
            phrase: "The policy supports that one"
            targets: [claim-scope-mechanism]
          - id: claim-unsupported
            phrase: "The policy never says that"
            targets: [claim-scope-mechanism]
          - id: claim-factscore
            phrase: "One of the two claims has support"
            targets: [claim-scope-mechanism]
          - id: claim-drop-advice
            phrase: "Remove the unsupported claim"
            targets: [claim-scope-mechanism]
          - id: claim-repair
            phrase: "Now read the caller’s question again"
            targets: [claim-scope-mechanism]
          - id: claim-abstain
            phrase: "For ordinary access, the service abstains"
            targets: [claim-scope-mechanism]
            caption_boundary: true
  - id: replay-rows
    title: "What would a passing row hide?"
    visual: "Replay the three distinct fixtures, inspect the recall denominator, and check coverage, field types, answer content and review identity before release."
    beats:
      - say: >-
          Export the three requests as three rows. The restoration question supplies the useful grounded answer. The admin question and the request echoing the private note both abstain. Look at their review fields. One has a bound unknown judgment. The other has no receipt at all. Save each question with its expected and actual result, answer, citations, source snapshot and receipt. Keep the fixture ID, slice and grader version so another run can replay the same decision.
        hold: 1
        visual_cues:
          - id: row-evidence
            phrase: "three requests as three rows"
            targets: [replay-rows-mechanism]
          - id: row-useful
            phrase: "useful grounded answer"
            targets: [replay-rows-mechanism]
          - id: row-safety
            phrase: "The admin question and the request echoing the private note"
            targets: [replay-rows-mechanism]
          - id: row-lineage
            phrase: "fixture ID, slice and grader version"
            targets: [replay-rows-mechanism]
      - say: >-
          Only the first fixture names a document that should answer the question. At rank one the retriever found that document, giving one out of one. The two refusal fixtures have no expected supporting document. Their recall is undefined, so store null. Check their refusal text and empty citations separately. For a grounded row, resolve the cited chunk and compare its exact text with the answer. A generated answer needs a different grader.
        hold: 0.9
        visual_cues:
          - id: row-one-denominator
            phrase: "one out of one"
            targets: [replay-rows-mechanism]
          - id: recall-denominator
            phrase: "Their recall is undefined"
            targets: [replay-rows-mechanism]
          - id: row-null
            phrase: "store null"
            targets: [replay-rows-mechanism]
      - say: >-
          Count fixture identities before trusting a pass flag. Replace the private-note row with another copy of the success. Now one required row is missing and another is duplicated. Block the release. Replay each remaining field with its type intact. Integer one is a different value from Boolean true in this contract. An abstention carrying unsafe advice fails the content check. A grounded answer carrying a fabricated receipt fails the support check. Keeping those failure reasons lets the dashboard show which decision broke.
        hold: 1
        visual_cues:
          - id: row-replace
            phrase: "Replace the private-note row with another copy of the success"
            targets: [replay-rows-mechanism]
          - id: row-missing
            phrase: "one required row is missing and another is duplicated. Block the release"
            targets: [replay-rows-mechanism]
            caption_boundary: true
          - id: row-mutations
            phrase: "with its type intact"
            targets: [replay-rows-mechanism]
          - id: row-typed
            phrase: "Integer one is a different value from Boolean true"
            targets: [replay-rows-mechanism]
          - id: row-unsafe
            phrase: "unsafe advice fails the content check"
            targets: [replay-rows-mechanism]
          - id: row-fabricated
            phrase: "a fabricated receipt fails the support check"
            targets: [replay-rows-mechanism]
  - id: synthesis
    title: "Replay the support desk request"
    visual: "Rebuild with a one-word edit and the original registry. Follow the mismatch to an empty candidate list for the required fixture, then rebuild with the original bytes and recover the cited answer."
    beats:
      - say: >-
          Before expanding to research, replay the request that started this lookup. Rebuild the collection with our one-word edit to the access policy. Keep the registry, US caller, question and review fixed. This row expects a citation to the original policy. What will the rebuilt lookup return?
        hold: 2.2
        visual_cues:
          - id: synthesis-edit
            phrase: "our one-word edit"
            targets: [snapshot-comparison]
          - id: synthesis-predict
            phrase: "What will the rebuilt lookup return"
            targets: [rebuild-result]
      - say: >-
          It abstains. The rebuild excluded the changed bytes, and the incident policy falls below the retrieval threshold. This time an abstention fails the test. Check the admission log before you tune retrieval. Restore the original file and rebuild. The matching grant admits the passage again, the existing review still applies, and the useful answer returns. You can trace that change in the row all the way back to the file.
        hold: 1.2
