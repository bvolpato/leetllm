            color: yellow
            linger: 0.5
      - say: Pack complete source-labeled sections within the generation budget and deduplicate repeated
          parents. Measure the rendered request with the target model’s tokenizer, including
          instructions and the question.
        hold: 0.55
        visual_cues:
          - id: pack-sections
            phrase: Pack complete source-labeled sections within the generation budget
            targets:
              - parent-section
              - evidence-record
            color: green
            linger: 0.5
          - id: deduplicate
            phrase: deduplicate repeated parents
            targets:
              - matched-child
              - packed-count
            color: cyan
            linger: 0.5
          - id: count-complete-request
            phrase: Measure the rendered request with the target model’s tokenizer, including instructions and
              the question
            targets:
              - complete-token-budget
              - parent-section
            color: cyan
            linger: 0.5
  - id: context-budget
    title: Copy the complete rule once into the measured request
    visual: Expand one child into the exact two-clause parent, deduplicate parent identity, and measure
      labels plus instructions without cutting a condition.
    beats:
      - say: "The search unit and reading unit can differ. A child hit points to a parent containing the
          rule’s required conditions. Sentence-window retrieval offers another construction: select
          one sentence and fetch a configured number of neighboring sentences on either side. That
          local window still misses a definition farther away. Inspect what the selected boundary
          actually excludes."
        hold: 0.65
        visual_cues:
          - id: pr-window
            phrase: select one sentence and fetch a configured number of neighboring sentences on either side
            targets:
              - context-budget-mechanism
            color: cyan
            linger: 0.5
      - say: The executable reference packer caps the source-labeled context at four hundred characters,
          including labels and separators. It skips a parent that will not fit and tries a smaller
          complete parent; it never truncates the rule mid-condition. It deduplicates several
          children of one parent. E one is a request-local label mapped to exact parent bytes,
          locator and digest, not an authority granted by the model.
        hold: 0.65
        visual_cues:
          - id: pr-characters
            phrase: four hundred characters, including labels and separators
            targets:
              - context-budget-mechanism
            color: cyan
            linger: 0.5
          - id: pr-skip
            phrase: it never truncates the rule mid-condition
            targets:
              - context-budget-mechanism
            color: cyan
            linger: 0.5
          - id: pr-dedup
            phrase: It deduplicates several children of one parent
            targets:
              - context-budget-mechanism
            color: cyan
            linger: 0.5
      - say: That character limit is not a model-token limit. A serving packer measures the entire formatted
          request with the target tokenizer and reserves instructions, question and output space.
          Extra permitted passages can add distraction and cost. The Lost in the Middle experiments
          found position sensitivity on examined long-context tasks; they do not prescribe a
          universal best order. Measure packing and required-condition coverage on the actual
          target.
        hold: 0.65
        visual_cues:
          - id: pr-tokens
            phrase: measures the entire formatted request with the target tokenizer
            targets:
              - context-budget-mechanism
            color: cyan
            linger: 0.5
          - id: pr-position
            phrase: position sensitivity on examined long-context tasks
            targets:
              - context-budget-mechanism
            color: cyan
            linger: 0.5
  - id: answer-from-evidence
    title: Check the requested values against the cited rule
    visual: Typed requests and outcomes appear as the narration reaches each policy check; eligibility,
