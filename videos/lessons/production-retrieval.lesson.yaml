scenes:
  - id: subject-intro
    title: A citation label can point to the wrong rule
    visual: A support answer says “30 days” and cites E1; opening E1 reveals the exact browser-session
      rule, beside a question about key rotation.
    beats:
      - say: A support specialist asks whether a stale service key can be rotated automatically. The service
          answers with a confident thirty-day limit and a tidy citation, E1.
        hold: 0.55
        visual_cues:
          - id: question
            phrase: whether a stale service key can be rotated automatically
            targets:
              - question
            color: blue
            linger: 0.5
          - id: service-answer
            phrase: confident thirty-day limit and a tidy citation, E1
            targets:
              - answer
            color: yellow
            linger: 0.5
      - say: A reviewer opens E1. It describes browser sessions, while the question concerns service keys.
          The response looked grounded because it carried a source label.
        hold: 0.75
        visual_cues:
          - id: open-source
            phrase: A reviewer opens E1
            targets:
              - source
            color: pink
            linger: 0.5
          - id: wrong-domain
            phrase: browser sessions, while the question concerns service keys
            targets:
              - source
              - question
            color: pink
            linger: 0.5
      - say: Retrieval-augmented generation connects an outside document store to a language model at answer
          time. We’ll follow one question through the records, access checks, context, and release
          tests that make that connection inspectable.
        hold: 0.55
        visual_cues:
          - id: follow-request
            phrase: one question through the records, access checks, context, and release tests
            targets:
              - question
              - answer
            color: cyan
            linger: 0.5
  - id: three-paths
    title: Keep one promise across three lifetimes
    visual: Carry the actual rule page from background ingestion to a pinned request and a separate
      candidate release replay.
    beats:
      - say: "Our policy and timings are invented fixtures. The current rule has two conditions: stale age
          at most fourteen days and risk-signal age at most forty-eight hours. Ten days with a
          forty-eight-hour signal qualifies. A fluent sentence, a successful HTTP response and a
          resolvable citation each leave important parts of this promise unchecked."
        hold: 0.65
        visual_cues:
          - id: pr-rule
            phrase: stale age at most fourteen days and risk-signal age at most forty-eight hours
            targets:
              - three-paths-mechanism
            color: cyan
            linger: 0.5
          - id: pr-qualifies
            phrase: Ten days with a forty-eight-hour signal qualifies
            targets:
              - three-paths-mechanism
            color: cyan
            linger: 0.5
      - say: The service has three paths. Background ingestion parses sources and builds versioned records.
          The request path determines what this caller may read, retrieves and packs evidence, then
          answers or abstains. The release path replays frozen questions against a candidate index,
          prompt, model and retrieval configuration before promotion. Keep each path’s evidence and
          lifetime explicit.
        hold: 0.65
        visual_cues:
          - id: pr-lifetimes
            phrase: Background ingestion parses sources and builds versioned records
            targets:
              - three-paths-mechanism
            color: cyan
            linger: 0.5
          - id: pr-request
            phrase: The request path determines what this caller may read
            targets:
              - three-paths-mechanism
            color: cyan
            linger: 0.5
          - id: pr-release
            phrase: The release path replays frozen questions
            targets:
              - three-paths-mechanism
            color: cyan
            linger: 0.5
      - say: The original RAG work combined a pretrained generator with a searchable non-parametric document
          memory. Updating indexed documents can change available knowledge without changing
          generator weights. That ability does not enforce authority, freshness or claim support.
          Those require the records, checks and measurements we will construct around the same
          source passage.
        hold: 0.65
        visual_cues:
          - id: pr-memory
            phrase: Updating indexed documents can change available knowledge without changing generator weights
            targets:
              - three-paths-mechanism
            color: cyan
            linger: 0.5
  - id: versioned-evidence
    title: Make each evidence record traceable
    visual: A policy page becomes located child and parent records with source hash, region, access tag,
      effective dates, and version; the current revision is selected for the fixture date.
    beats:
      - say: Start during ingestion. Parse a source into searchable spans, then preserve the document,
          parent section, page locator, version, region, access tag, and effective dates with each
          span.
        hold: 0.55
        visual_cues:
          - id: parse-spans
            phrase: Parse a source into searchable spans
            targets:
              - source-page
              - search-child
            color: cyan
            linger: 0.5
          - id: preserve-lineage
            phrase: preserve the document, parent section, page locator, version, region, access tag, and
              effective dates
            targets:
              - lineage-fields
            color: yellow
            linger: 0.5
      - say: In our policy fixture, the current EU key rule allows rotation within fourteen days when the
          risk signal is at most forty-eight hours old. Its older thirty-day rule remains available
          for historical review.
        hold: 0.75
        visual_cues:
          - id: current-rule
            phrase: current EU key rule allows rotation within fourteen days
            targets:
              - current-record
            color: green
            linger: 0.5
          - id: historical-rule
            phrase: older thirty-day rule remains available for historical review
            targets:
              - historical-record
            color: yellow
            linger: 0.5
      - say: For the request date, the current-version filter admits the new record and leaves the expired
          one out. A content hash helps check exact bytes; source authority still comes from the
          trusted source process.
        hold: 0.55
        visual_cues:
          - id: filter-current
            phrase: current-version filter admits the new record
            targets:
              - request-date
              - current-record
            color: green
            linger: 0.5
          - id: exclude-expired
            phrase: leaves the expired one out
            targets:
              - historical-record
            color: pink
            linger: 0.5
          - id: verify-bytes
            phrase: content hash helps check exact bytes
            targets:
              - source-digest
            color: cyan
            linger: 0.5
  - id: validity-invariants
    title: Attach validity to the exact source revision
    visual: Build inclusive calendar ranges beside the reader example’s half-open logical interval, then
      reject two active revisions under one scope.
    beats:
      - say: Our reference fixture uses inclusive calendar dates. The old EU revision ends March
          thirty-first, and the replacement begins April first. It rejects duplicate chunk IDs,
          reversed date ranges and more than one active version for the same region and document.
          Several chunks of one active version are valid. A product or jurisdiction variant needs
          its own scope dimension.
        hold: 0.65
        visual_cues:
          - id: pr-dates
            phrase: The old EU revision ends March thirty-first, and the replacement begins April first
            targets:
              - validity-invariants-mechanism
            color: cyan
            linger: 0.5
          - id: pr-invalid
            phrase: duplicate chunk IDs, reversed date ranges and more than one active version
            targets:
              - validity-invariants-mechanism
            color: cyan
            linger: 0.5
      - say: "The shorter reader implementation uses half-open logical intervals instead: a record is
          current from its start, including that start, until its end, excluding that end. If one
          ends at time twenty and another begins at twenty, only the replacement is current at that
          instant. Do not copy an endpoint comparison without preserving its time unit and
          contract."
        hold: 0.65
        visual_cues:
          - id: pr-halfopen
            phrase: only the replacement is current at that instant
            targets:
              - validity-invariants-mechanism
            color: cyan
            linger: 0.5
      - say: "A policy’s effective time can differ from when an update reached the index. Preserve both when
          replay needs them. A digest verifies supplied bytes, while trusted ingestion establishes
          source authority. Keep content revision and authorization revision separate: an unchanged
          page can lose its grant. Malformed required scope metadata must stay out of serving until
          resolved."
        hold: 0.65
        visual_cues:
          - id: pr-authority-revision
            phrase: an unchanged page can lose its grant
            targets:
              - validity-invariants-mechanism
            color: cyan
            linger: 0.5
  - id: authorized-retrieval
    title: Filter the corpus before ranking candidates
    visual: Trusted caller, region, date, and ACL select permitted records before similarity ranking; a
      restricted near-match is held outside the caller’s search lane.
    beats:
      - say: At request time, the application supplies the caller’s trusted identity, region, access tags,
          and request date. The retrieval path uses those values to form its allowed evidence set.
        hold: 0.55
        visual_cues:
          - id: trusted-request
            phrase: caller’s trusted identity, region, access tags, and request date
            targets:
              - trusted-caller
            color: blue
            linger: 0.5
          - id: form-evidence-set
            phrase: retrieval path uses those values to form its allowed evidence set
            targets:
              - permitted-set
              - access-decisions
            color: green
            linger: 0.5
        motion_check:
          region:
            - 90
            - 650
            - 1730
            - 150
          minimumChangedFraction: 0.002
      - say: Now search inside that set. Our small lexical fixture ranks permitted text by shared terms; a
          dense or hybrid scorer can replace the ranking while the permission boundary stays in
          place.
        hold: 0.75
        visual_cues:
          - id: rank-allowed
            phrase: Our small lexical fixture ranks permitted text by shared terms
            targets:
              - ranked-hits
            color: cyan
            linger: 0.5
          - id: preserve-permission
            phrase: permission boundary stays in place
            targets:
              - permitted-set
            color: green
            linger: 0.5
      - say: A restricted admin page can share more words with the question and still stay outside the
          caller’s search lane. Only permitted candidate text moves toward reranking, context
          packing, or generation.
        hold: 0.55
        visual_cues:
          - id: deny-near-match
            phrase: restricted admin page can share more words with the question
            targets:
              - access-decisions
            color: pink
            linger: 0.5
          - id: permitted-only
            phrase: Only permitted candidate text moves toward reranking, context packing, or generation
            targets:
              - ranked-hits
            color: green
            linger: 0.5
  - id: filtering-contract
    title: A trusted search algorithm and its returned payloads have different boundaries
    visual: Remove disallowed payloads before the external worker while replaying a global-top-k
      false-negative trap inside trusted search.
    beats:
      - say: Our transparent lexical fixture filters allowed rows before scoring. A real trusted vector
          service can enforce the returned-payload boundary using different internal search
          schedules. Its HNSW graph may traverse nonmatching nodes to reach matching ones. Do not
          claim that every safe engine computes distances only for permitted records.
        hold: 0.65
        visual_cues:
          - id: pr-graph
            phrase: Its HNSW graph may traverse nonmatching nodes to reach matching ones
            targets:
              - filtering-contract-mechanism
            color: cyan
            linger: 0.5
      - say: Filtering an unfiltered global top-k can leave too few permitted hits. Imagine three selected
          neighbors, two restricted and one permitted, while useful permitted neighbors sit just
          below that cut. Redacting the selected list returns one, not the best three allowed
          records. Compare filtered recall and latency under the engine’s actual contract.
        hold: 0.65
        visual_cues:
          - id: pr-globalcut
            phrase: three selected neighbors, two restricted and one permitted
            targets:
              - filtering-contract-mechanism
            color: cyan
            linger: 0.5
          - id: pr-allowedcut
            phrase: Redacting the selected list returns one, not the best three allowed records
            targets:
              - filtering-contract-mechanism
            color: cyan
            linger: 0.5
      - say: This internal search tradeoff differs from sending protected text to an external reranker and
          filtering afterward. The disclosure has already occurred then. Keep caller identity
          trusted, enforce tenant and access scope at the payload boundary, and allow a reranker to
          reorder or discard permitted candidates without expanding that set. An empty allowed set
          should reveal no protected document’s existence.
        hold: 0.65
        visual_cues:
          - id: pr-disclosure
            phrase: The disclosure has already occurred then
            targets:
              - filtering-contract-mechanism
            color: cyan
            linger: 0.5
  - id: lexical-counterexample
    title: A full result list can carry zero evidence of a match
    visual: Replay the reader retriever’s zero-score alphabetical tie against the reference two-term
      threshold, preserving the same source IDs.
    beats:
      - say: The reference retriever counts distinct shared terms, breaks ties by chunk ID, and requires at
          least two matching terms. The permitted key rule scores seven for the worked query; the
          browser-session distractor scores two. Neither score is a probability or proof that the
          policy answers the question. This scorer is a test double, not a measured semantic
          retriever.
        hold: 0.65
        visual_cues:
          - id: pr-scores
            phrase: The permitted key rule scores seven for the worked query; the browser-session distractor
              scores two
            targets:
              - lexical-counterexample-mechanism
            color: cyan
            linger: 0.5
      - say: "The shorter reader program has a different boundary: it sorts and returns two records without
          a minimum score. Ask to refresh an expired machine credential. No words match, yet it
          still returns the key and session records through alphabetical tie-breaking. Its numerical
          answerer then gives a confident eligibility answer from the first rule. The printed output
          exposes that failure."
        hold: 0.65
        visual_cues:
          - id: pr-zero
            phrase: No words match, yet it still returns the key and session records through alphabetical
              tie-breaking
            targets:
              - lexical-counterexample-mechanism
            color: cyan
            linger: 0.5
          - id: pr-false-answer
            phrase: then gives a confident eligibility answer from the first rule
            targets:
              - lexical-counterexample-mechanism
            color: cyan
            linger: 0.5
      - say: A longer context or a higher top-k does not make a zero-score tie into evidence of relevance.
          Use a locally calibrated retrieval gate, improve paraphrase recall and measure false
          refusals as well as unsupported answers. Cross-encoder logits and cosine scores have
          different ranges. A threshold belongs to a specified model, index and question
          distribution, and cannot restore an omitted condition.
        hold: 0.65
        visual_cues:
          - id: pr-gate
            phrase: Use a locally calibrated retrieval gate
            targets:
              - lexical-counterexample-mechanism
            color: cyan
            linger: 0.5
  - id: pinned-bundle
    title: Pin child, parent and configuration together
    visual: Flip the serving pointer from bundle A to B after a child lookup, expose the mixed parent,
      then replay with the held A handle.
    beats:
      - say: "Build a candidate snapshot and validate it before an atomic serving-pointer switch. That
          pointer must select a coherent bundle: child index, parent store, source manifest and
          retrieval configuration. Each request holds the chosen bundle for its whole lifetime.
          Atomic switching of one index does not make a later unrelated parent-store read atomic."
        hold: 0.65
        visual_cues:
          - id: pr-snapshot
            phrase: Build a candidate snapshot and validate it before an atomic serving-pointer switch
            targets:
              - pinned-bundle-mechanism
            color: cyan
            linger: 0.5
          - id: pr-pin
            phrase: Each request holds the chosen bundle for its whole lifetime
            targets:
              - pinned-bundle-mechanism
            color: cyan
            linger: 0.5
      - say: Follow a request that retrieved a child from bundle A. The global serving pointer changes to B
          before context packing. If the packer rereads that pointer, it may attach B’s parent to
          A’s child. Hold the A bundle instead, resolve its parent identifier and verify document,
          version, region, date and permission together. A matching document name alone cannot
          repair the revision mismatch.
        hold: 0.65
        visual_cues:
          - id: pr-mixed
            phrase: it may attach B’s parent to A’s child
            targets:
              - pinned-bundle-mechanism
            color: cyan
            linger: 0.5
          - id: pr-repair
            phrase: Hold the A bundle instead
            targets:
              - pinned-bundle-mechanism
            color: cyan
            linger: 0.5
      - say: For an embedding change, use a compatible query/document encoder pair with the specified
          preprocessing, dimensions and metric. Equal dimensions do not establish compatibility.
          Build the new index alongside the old one, replay versioned source-span expectations,
          compare authorized shadow queries and catch up source changes made during rebuilding.
          Switch query routing, parents and caches with the same evaluated bundle.
        hold: 0.65
        visual_cues:
          - id: pr-migration
            phrase: Build the new index alongside the old one
            targets:
              - pinned-bundle-mechanism
            color: cyan
            linger: 0.5
          - id: pr-switch
            phrase: Switch query routing, parents and caches with the same evaluated bundle
            targets:
              - pinned-bundle-mechanism
            color: cyan
            linger: 0.5
  - id: child-to-parent
    title: Expand a focused match to its checked parent
    visual: A small matching child points to a parent section; version and ACL checks admit the full
      rule, then the packer deduplicates parents and enforces a complete-context budget.
    beats:
      - say: A child span can match the requested window, such as automated rotation within fourteen days.
          The surrounding key-rotation section supplies the separate risk-signal condition.
        hold: 0.55
        visual_cues:
          - id: child-match
            phrase: A child span can match the requested window
            targets:
              - matched-child
            color: cyan
            linger: 0.5
          - id: parent-condition
            phrase: surrounding key-rotation section supplies the separate risk-signal condition
            targets:
              - parent-section
            color: green
            linger: 0.5
      - say: Resolve the child’s parent under the same pinned index bundle. Check the parent identifier,
          document, version, effective date, region, and access tag before packing its text.
        hold: 0.75
        visual_cues:
          - id: resolve-parent
            phrase: Resolve the child’s parent under the same pinned index bundle
            targets:
