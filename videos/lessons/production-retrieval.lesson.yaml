  - id: prompt-contract
    title: Build the model request and check the returned labels
    visual: Copy E1 and E2 into the actual reader prompt, bind the question ages, then distinguish an
      unknown citation from a known but unsupported one.
    beats:
      - say: The reader’s real prompt asks for at most two sentences from the supplied sources, labels
          retrieved text as data, requests a citation and permits abstention. It inserts the
          complete rotation rule as E one and the session policy as E two, followed by the question.
          A prompt requests this behavior; it cannot enforce it by itself.
        hold: 0.65
        visual_cues:
          - id: pr-prompt
            phrase: It inserts the complete rotation rule as E one and the session policy as E two
            targets:
              - prompt-contract-mechanism
            color: cyan
            linger: 0.5
      - say: The application builds a source map while assigning those labels. Its unknown-label check
          extracts bracketed E identifiers from a reply and subtracts the map’s keys. A hand-written
          answer citing E seven is rejected when only E one and E two exist. A reply citing the
          actual E two passes that identity check even when the browser-session passage cannot
          support a key-rotation claim.
        hold: 0.65
        visual_cues:
          - id: pr-source-map
            phrase: The application builds a source map while assigning those labels
            targets:
              - prompt-contract-mechanism
            color: cyan
            linger: 0.5
          - id: pr-unknown
            phrase: A hand-written answer citing E seven is rejected
            targets:
              - prompt-contract-mechanism
            color: cyan
            linger: 0.5
          - id: pr-known
            phrase: A reply citing the actual E two passes that identity check
            targets:
              - prompt-contract-mechanism
            color: cyan
            linger: 0.5
      - say: "Keep three tests separate: the label exists, the mapped source is currently permitted, and the
          exact passage supports each material claim for this question. A valid label does not
          establish the other two. Buffer an answer if a synchronous support check must block it
          before release; an asynchronous judge can report a failure after delivery but cannot
          recall streamed text."
        hold: 0.65
        visual_cues:
          - id: pr-support
            phrase: the exact passage supports each material claim for this question
            targets:
              - prompt-contract-mechanism
            color: cyan
            linger: 0.5
          - id: pr-buffer
            phrase: Buffer an answer if a synchronous support check must block it before release
            targets:
              - prompt-contract-mechanism
            color: cyan
            linger: 0.5
  - id: recorded-model-failure
    title: A real model can pass the citation check and violate the rule
    visual: Replay the article’s recorded Qwen replies beside unchanged source clauses, exposing the
      day-15 comparison and session-policy substitution.
    beats:
      - say: The article also records a small Qwen three one-point-seven-billion chat model using its chat
          template, thinking disabled, sampling off and an eighty-token output cap. These are the
          published example’s observed replies, not a new model run in this film or a guarantee for
          every machine. Runtime, weights and execution details can affect exact text even when
          sampling is disabled.
        hold: 0.65
        visual_cues:
          - id: pr-scope
            phrase: not a new model run in this film
            targets:
              - recorded-model-failure-mechanism
            color: cyan
            linger: 0.5
      - say: With the ten-day question and both sources, the recorded reply correctly allows rotation. At
          fifteen days, it wrongly says the key is stale for less than fourteen days, then also says
          the sources do not settle the question. With only the session policy, it compares a
          forty-eight-hour risk signal with thirty idle days and still allows rotation. Every output
          has an empty unknown-label set because E one exists in each request.
        hold: 0.65
        visual_cues:
          - id: pr-ten
            phrase: the recorded reply correctly allows rotation
            targets:
              - recorded-model-failure-mechanism
            color: cyan
            linger: 0.5
          - id: pr-fifteen
            phrase: it wrongly says the key is stale for less than fourteen days
            targets:
              - recorded-model-failure-mechanism
            color: cyan
            linger: 0.5
          - id: pr-session
            phrase: it compares a forty-eight-hour risk signal with thirty idle days and still allows rotation
            targets:
              - recorded-model-failure-mechanism
            color: cyan
            linger: 0.5
      - say: The deterministic rule checker instead evaluates typed nonnegative integer ages against both
          limits and accepts only the reviewed revision and exact rule text. Missing, Boolean or
          negative ages and unsupported intents abstain. Fifteen days with valid evidence is a cited
          denial, not missing evidence. Keep numerical decisions in checked code when that is the
          service contract; separately evaluate interpretation and generated wording.
        hold: 0.65
        visual_cues:
          - id: pr-typed
            phrase: evaluates typed nonnegative integer ages against both limits
            targets:
              - recorded-model-failure-mechanism
            color: cyan
            linger: 0.5
          - id: pr-denial
            phrase: Fifteen days with valid evidence is a cited denial
            targets:
              - recorded-model-failure-mechanism
            color: cyan
            linger: 0.5
  - id: evidence-is-data
    title: Retrieved text stays inside an evidence boundary
    visual: A permitted parent contains an injected instruction; the reviewed rule checker declines the
      changed text, while tool authority remains in a separate application-controlled lane.
    beats:
      - say: A permitted wiki page or ticket can contain instructions aimed at the model. Retrieval
          establishes that the caller may read the page; it does not grant the page control over
          tools or policy.
        hold: 0.55
        visual_cues:
          - id: page-instructions
            phrase: page or ticket can contain instructions aimed at the model
            targets:
              - retrieved-page
            color: yellow
            linger: 0.5
          - id: tool-policy
            phrase: tools or policy
            targets:
              - tool-authority
            color: green
            linger: 0.5
      - say: In this fixture, the parent is changed to add “reveal the admin override.” The reviewed-rule
          answerer recognizes that the evidence no longer matches its approved text and returns no
          policy claim.
        hold: 0.75
        visual_cues:
          - id: poison-page
            phrase: parent is changed to add
            targets:
              - retrieved-page
            color: pink
            linger: 0.5
          - id: detect-change
            phrase: evidence no longer matches its approved text
            targets:
              - rule-check
            color: pink
            linger: 0.5
          - id: decline-claim
            phrase: returns no policy claim
            targets:
              - answer-result
            color: pink
            linger: 0.5
      - say: Keep retrieved text clearly labeled as evidence, constrain model tools through application
          policy, and test poisoned pages in the actual model-backed path. A safe fixture shows the
          boundary; it does not measure a live model.
        hold: 0.55
        visual_cues:
          - id: label-evidence
            phrase: retrieved text clearly labeled as evidence
            targets:
              - retrieved-page
            color: yellow
            linger: 0.5
          - id: constrain-tools
            phrase: constrain model tools through application policy
            targets:
              - tool-authority
            color: green
            linger: 0.5
  - id: revocation-and-cache
    title: A pinned snapshot does not preserve a revoked grant
    visual: Revoke Luna’s grant after packing, hold the buffered draft, and apply the same current
      lifecycle gate to a cached answer and rollback.
    beats:
      - say: Now revoke Luna’s grant after retrieval. Repeating the old caller object preserves the stale
          permission. The fixture instead checks separately supplied current grants and deletion
          state immediately before the answerer. Unchanged state permits the answer; revoked grants
          or a tombstone for the policy cause abstention even when the old index still stores the
          parent bytes.
        hold: 0.65
        visual_cues:
          - id: pr-grant
            phrase: Now revoke Luna’s grant after retrieval
            targets:
              - revocation-and-cache-mechanism
            color: cyan
            linger: 0.5
          - id: pr-tombstone
            phrase: revoked grants or a tombstone for the policy cause abstention
            targets:
              - revocation-and-cache-mechanism
            color: cyan
            linger: 0.5
      - say: Rollback can restore an old retrieval configuration, but it must not erase current revocations
          or deletion tombstones. Superseded evidence may remain for an authorized historical audit;
          deleted evidence must stop serving according to its deletion policy. Invalidate derived
          answer caches too. A digest that still matches establishes byte identity, not current
          authority.
        hold: 0.65
        visual_cues:
          - id: pr-rollback
            phrase: Rollback can restore an old retrieval configuration, but it must not erase current
              revocations or deletion tombstones
            targets:
              - revocation-and-cache-mechanism
            color: cyan
            linger: 0.5
      - say: The fixture has no concurrent identity service. A real request needs an explicit consistency
          policy, such as bounded authorization leases or cancellation when an authorization
          revision changes. Recheck before releasing a buffered answer and discard the whole draft
          if any supplied source is no longer permitted, including uncited context. This limits
          future disclosure and cannot undo text already sent to the model or caller.
        hold: 0.65
        visual_cues:
          - id: pr-discard
            phrase: discard the whole draft if any supplied source is no longer permitted
            targets:
              - revocation-and-cache-mechanism
            color: cyan
            linger: 0.5
  - id: cache-identity
    title: A similar question can cross the decision boundary
    visual: Replay one semantic cache entry with changed age and changed grant, then require both
      answer-critical values and authority dimensions.
    beats:
      - say: An answer cache is another evidence path. Partition by principal or proven-equivalent
          authorization scope, ACL revision, region, effective date and index, prompt and model
          versions. Check those dimensions before a hit becomes a response. Store evidence
          dependencies so a deletion or permission change can invalidate the entry.
        hold: 0.65
        visual_cues:
          - id: pr-key
            phrase: Partition by principal or proven-equivalent authorization scope, ACL revision, region,
              effective date and index, prompt and model versions
            targets:
              - cache-identity-mechanism
            color: cyan
            linger: 0.5
      - say: Semantic similarity does not establish equivalent policy inputs. A cached yes for ten stale
          days cannot answer fifteen stale days merely because the wording is close. Bind the
          requested ages, intent and relevant conditions before reuse. Otherwise the cache bypasses
          the exact comparison we just taught, even if retrieval and generation are individually
          correct.
        hold: 0.65
        visual_cues:
          - id: pr-ages
            phrase: A cached yes for ten stale days cannot answer fifteen stale days
            targets:
              - cache-identity-mechanism
            color: cyan
            linger: 0.5
      - say: Protect traces as well. Record versions, permitted candidate IDs, source maps, decisions and
          stage timings without making general logs a second private corpus. Store exact inputs and
          outputs in a separately controlled audit store when retention allows, since temperature
          zero does not promise byte-identical replay. Sensitive IDs and scope metadata still
          require access control.
        hold: 0.65
        visual_cues:
          - id: pr-audit
            phrase: Store exact inputs and outputs in a separately controlled audit store
            targets:
              - cache-identity-mechanism
            color: cyan
            linger: 0.5
  - id: trace-and-diagnose
    title: Keep a trace that locates a failed promise
    visual: One request trace links caller scope, index bundle, candidate IDs, packed parent, answer
      decision, and stage timings; a broken link highlights the stage to inspect.
    beats:
      - say: "Record enough request state to explain how the answer was formed: a request ID, pinned index
          revision, permitted candidate identifiers, parent versions, decision, and stage timings."
        hold: 0.55
        visual_cues:
          - id: trace-request
            phrase: request ID, pinned index revision, permitted candidate identifiers, parent versions,
              decision, and stage timings
            targets:
              - request-trace
            color: cyan
            linger: 0.5
      - say: If the rule never appears among candidates, inspect ingestion and ranking. If the child is
          right but its parent is missing, inspect version matching, permission checks, and context
          budget.
        hold: 0.75
        visual_cues:
          - id: candidate-miss
            phrase: rule never appears among candidates
            targets:
              - request-trace
            color: yellow
            linger: 0.5
          - id: parent-miss
            phrase: child is right but its parent is missing
            targets:
              - mismatch-result
            color: pink
            linger: 0.5
      - say: If complete evidence reaches the answerer and the response still invents a limit, replay that
          same context against generation and claim checks. Keep sensitive text out of
          caller-visible errors and traces.
        hold: 0.55
        visual_cues:
          - id: replay-context
            phrase: replay that same context against generation and claim checks
            targets:
              - source-version
              - request-trace
            color: cyan
            linger: 0.5
  - id: recall-contracts
    title: Count nearest-neighbor agreement and governing evidence separately
    visual: Remove the governing-rule tile from the approximate top ten while preserving eight other
      exact neighbors, then trace the missing condition to context and answer.
    beats:
      - say: Use the same eligible corpus, metric and normalization to compare exact and approximate search.
          ANN recall asks how many approximate results are also in the exact top-k. Candidate recall
          instead asks whether the returned set contains the task’s required evidence. Neither score
          measures whether a generated assertion follows from the prompt.
        hold: 0.65
        visual_cues:
          - id: pr-ann
            phrase: ANN recall asks how many approximate results are also in the exact top-k
            targets:
              - recall-contracts-mechanism
            color: cyan
            linger: 0.5
          - id: pr-task
            phrase: Candidate recall instead asks whether the returned set contains the task’s required evidence
            targets:
              - recall-contracts-mechanism
            color: cyan
            linger: 0.5
      - say: In the article’s example, the governing rule sits ninth in the exact top ten. Approximate
          search recovers eight of those ten but omits that rule. ANN recall is eight tenths, while
          governing-passage recall for this one required rule is zero. Exact search already found
          it, so inspect approximate-search effort before blaming the encoder. Perfect ANN recall
          can also miss the governing policy when exact semantic ranking itself misses it.
        hold: 0.65
        visual_cues:
          - id: pr-eight
            phrase: ANN recall is eight tenths
            targets:
              - recall-contracts-mechanism
            color: cyan
            linger: 0.5
          - id: pr-missing
            phrase: governing-passage recall for this one required rule is zero
            targets:
              - recall-contracts-mechanism
            color: cyan
            linger: 0.5
      - say: "Then check context recall: did the required source survive packing? Check faithfulness: do the
          answer’s assertions follow from the packed evidence? Context relevance measures useful
          versus distracting material, while answer relevance asks whether the response addresses
          the question. Ragas and the RAG triad provide useful signals, but a grader needs
          calibration and none of those scores establishes permission or current policy authority."
        hold: 0.65
        visual_cues:
          - id: pr-context
            phrase: did the required source survive packing
            targets:
              - recall-contracts-mechanism
            color: cyan
            linger: 0.5
          - id: pr-faithful
            phrase: do the answer’s assertions follow from the packed evidence
            targets:
              - recall-contracts-mechanism
            color: cyan
            linger: 0.5
  - id: serial-latency
    title: Follow one clock from admission to first token and completion
    visual: Construct the synthetic 2+18+1+320 timeline, move token one at 341 ms, then buffer through
      generation and compare the aggregate deadline.
    beats:
      - say: The supplied serial trace uses two milliseconds for authorization, eighteen for retrieval, one
          for packing and three hundred twenty for model startup. Assume immediate streaming and no
          extra transport delay. The caller sees token one after three hundred forty-one
          milliseconds. Model TTFT measures only the three-hundred-twenty-millisecond startup
          interval. The following four hundred ten milliseconds of generation finish the answer at
          seven hundred fifty-one.
        hold: 0.65
        visual_cues:
          - id: pr-startup
            phrase: two milliseconds for authorization, eighteen for retrieval, one for packing and three
              hundred twenty for model startup
            targets:
              - serial-latency-mechanism
            color: cyan
            linger: 0.5
          - id: pr-first
            phrase: The caller sees token one after three hundred forty-one milliseconds
            targets:
              - serial-latency-mechanism
            color: cyan
            linger: 0.5
          - id: pr-complete
            phrase: finish the answer at seven hundred fifty-one
            targets:
              - serial-latency-mechanism
            color: cyan
            linger: 0.5
      - say: A nonblocking trace write finishes three milliseconds later, at seven hundred fifty-four, off
          this response path. If policy requires durable audit acknowledgment before returning,
          include that delay instead. If full-answer validation buffers delivery, the caller waits
          for generation and validation rather than seeing the earlier first-token milestone.
          Measure the contract the user actually experiences.
        hold: 0.65
        visual_cues:
          - id: pr-trace
            phrase: at seven hundred fifty-four
            targets:
              - serial-latency-mechanism
            color: cyan
            linger: 0.5
          - id: pr-buffer
            phrase: the caller waits for generation and validation
            targets:
              - serial-latency-mechanism
            color: cyan
            linger: 0.5
      - say: Component budgets do not replace one deadline. The supplied ten, eighty, ten, five hundred and
          four hundred fifty milliseconds each pass their stage caps but sum to one thousand fifty,
          missing the one-second response limit. The article checker diagnoses supplied timings
          after the fact; runtime enforcement needs a propagated remaining deadline and tested
          cancellation or fallback.
        hold: 0.65
        visual_cues:
          - id: pr-deadline
            phrase: sum to one thousand fifty, missing the one-second response limit
            targets:
              - serial-latency-mechanism
            color: cyan
            linger: 0.5
  - id: release-gates
    title: Release against frozen evidence cases
    visual: Frozen support cases check required and forbidden record IDs, eligibility boundaries,
      citations, abstentions, and a deliberate wrong-limit mutation before the serving bundle is
      promoted.
    beats:
      - say: Build frozen cases for supported questions, expired policies, restricted records, missing
          evidence, and values just inside or outside the rule. Check both the records that should
          appear and the ones that must stay hidden.
        hold: 0.55
        visual_cues:
          - id: frozen-cases
            phrase: supported questions, expired policies, restricted records, missing evidence, and values just
              inside or outside the rule
            targets:
              - fixture-cases
            color: blue
            linger: 0.5
      - say: Score retrieval, evidence coverage, claim support, and answer relevance separately. A relevant
          passage can still omit a required condition; a correct citation can still accompany an
          unsupported claim.
        hold: 0.75
        visual_cues:
          - id: separate-scores
            phrase: retrieval, evidence coverage, claim support, and answer relevance separately
            targets:
              - case-verdicts
              - fixture-cases
            color: yellow
            linger: 0.5
      - say: Run the suite against a candidate index and serving configuration before promotion. Passing a
          small fixture verifies those contracts; representative questions and live integration
          measurements establish broader readiness.
        hold: 0.55
        visual_cues:
          - id: candidate-release
            phrase: candidate index and serving configuration before promotion
            targets:
              - candidate-contract
            color: green
            linger: 0.5
          - id: fixture-boundary
            phrase: small fixture verifies those contracts
            targets:
              - case-verdicts
            color: cyan
            linger: 0.5
  - id: tails-and-gates
    title: A release contract combines complete records and the right denominator
    visual: Construct per-request tail combinations, then reveal the missing hard gate and the
      wrong-limit mutation against the same source record.
    beats:
      - say: Measure the percentile of complete request durations under representative load. Adding
          component p ninety-fives does not compute request p ninety-five. Even if five independent
          stages each stay below their own bound ninety-five percent of the time, all five meet
          those bounds together with probability point nine five raised to five, about point seven
          seven four. That probability alone does not determine the percentile of their sum.
        hold: 0.65
        visual_cues:
          - id: pr-joint
            phrase: point nine five raised to five, about point seven seven four
            targets:
              - tails-and-gates-mechanism
            color: cyan
            linger: 0.5
      - say: The seven exposed fixture cases test specific IDs, forbidden records, numerical decisions,
          abstentions and citations. The deliberate wrong-limit candidate keeps its decision and
          citation but replaces fourteen with thirty in its answer; the gate blocks it. Equivalent
          supported wording and stable source spans are better release targets for a model-backed
          service than one brittle exact sentence.
        hold: 0.65
        visual_cues:
          - id: pr-mutation
            phrase: replaces fourteen with thirty in its answer; the gate blocks it
            targets:
              - tails-and-gates-mechanism
            color: cyan
            linger: 0.5
      - say: "The report requires six named gates: authorization, freshness, latency, cases, injection and
          lifecycle. Each required value must be exactly true; a missing field or an empty report
          blocks promotion. Passing these deterministic local fixtures is not a production accuracy
          estimate. Add untouched representative slices, calibrated graders, actual model and
          identity integrations, loaded latency and a canary with rollback criteria. Track false
          refusals alongside unsupported answers."
        hold: 0.65
        visual_cues:
          - id: pr-required
            phrase: authorization, freshness, latency, cases, injection and lifecycle
            targets:
              - tails-and-gates-mechanism
            color: cyan
            linger: 0.5
          - id: pr-alltrue
            phrase: Each required value must be exactly true
            targets:
              - tails-and-gates-mechanism
            color: cyan
            linger: 0.5
  - id: fresh-evidence
    title: Predict the answer after one authority change
    visual: Hold a new 13-day/47-hour cached answer while a source is tombstoned and the serving bundle
      rolls back, then resolve current evidence before any wording.
    beats:
      - say: Try a fresh incident. A request asks about thirteen stale days and a forty-seven-hour risk
          signal. Bundle C supplies the complete permitted rule, and an answer cache holds a
          qualifying draft from that same request. Before release, the authoritative state
          tombstones its policy document. Operations then rolls the serving pointer back to bundle
          B, where the bytes still exist. Predict whether the draft can be released. Pause.
        hold: 1.5
        visual_cues:
          - id: pr-inputs
            phrase: thirteen stale days and a forty-seven-hour risk signal
            targets:
              - fresh-evidence-mechanism
            color: cyan
            linger: 0.5
          - id: pr-deletion
            phrase: the authoritative state tombstones its policy document
            targets:
              - fresh-evidence-mechanism
            color: cyan
            linger: 0.5
          - id: pr-freshrollback
            phrase: rolls the serving pointer back to bundle B
            targets:
              - fresh-evidence-mechanism
            color: blue
            linger: 0.5
      - say: It cannot. The current tombstone excludes that policy independently of the serving pointer,
          invalidates its dependent cache entry and removes support for the draft. The safe response
          abstains or escalates without disclosing protected source details. If the source were
          still permitted but stale age changed to sixteen instead, complete evidence would support
          an ineligible answer. Those are different failures and different API states.
        hold: 0.65
        visual_cues:
          - id: pr-discard
            phrase: invalidates its dependent cache entry and removes support for the draft
            targets:
              - fresh-evidence-mechanism
            color: cyan
            linger: 0.5
          - id: pr-counterfactual-input
            phrase: If the source were still permitted but stale age changed to sixteen instead
            targets:
              - fresh-evidence-mechanism
            color: yellow
            linger: 0.5
          - id: pr-newage
            phrase: complete evidence would support an ineligible answer
            targets:
              - fresh-evidence-mechanism
            color: cyan
            linger: 0.5
      - say: Trace the same request from trusted identity through a pinned child and parent, complete
          source-labeled context, exact claim checks and the release decision. You can now locate a
          missing rule, a broken parent, a false numerical promise, a revoked grant or a slow stage
          before changing the generator. Hybrid retrieval can improve paraphrase recall while
          preserving this evidence contract.
        hold: 0.65
        visual_cues:
          - id: pr-trace
            phrase: trusted identity through a pinned child and parent, complete source-labeled context, exact
              claim checks and the release decision
            targets:
              - fresh-evidence-mechanism
            color: cyan
            linger: 0.5
