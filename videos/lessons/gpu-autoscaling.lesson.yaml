    title: Remove a worker without abandoning its ownership
    visual: An actual worker disables local admission while retaining two active IDs. One completion removes only
      its own ID; the last completion makes termination safe. The model keeps readiness and active ownership
      separate throughout.
    beats:
      - say: >
          Scale-down begins by closing local admission and withdrawing readiness. Endpoint updates take time,
          so the worker must reject new arrivals itself. The two active request identities remain owned here.
          Changing a desired count does not transfer their attention state or finish their responses.
        visual_cues:
