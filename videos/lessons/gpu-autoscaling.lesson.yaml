scenes:
  - id: intro
    title: Will your summary start in time?
    visual: Put queue ticket 21 beside the five slots on the warm GPU. Follow the same five slots across the
      ten-second refills. Keep the ticket pinned and the thirty-second start deadline in view.
    beats:
      - say: Your incident summary is number twenty-one in the queue. It has thirty seconds to start. The first
          five requests take the five slots on the only warm GPU. Each holds a slot for ten seconds. The next
          GPU will be ready in two hundred seven seconds.
        hold: 0.7
        caption_starts:
          - The first five requests
          - The next GPU
        visual_cues:
          - id: find-request
            phrase: Your incident summary is number twenty-one in the queue
            targets:
              - arrival-order
            color: yellow
            linger: 0.25
          - id: first-five
            phrase: The first five requests take the five slots on the only warm GPU
            targets:
              - start-grid
            color: cyan
            linger: 0.25
          - id: cold-clock
            phrase: The next GPU will be ready in two hundred seven seconds
            targets:
              - cold-worker
            color: cyan
            linger: 0.25
      - say: Everyone arrived together. The slots refill in queue order at ten seconds and again at twenty. A
          request can still start on the thirty-second tick. Does request twenty-one get a slot in time?
        hold: 2.6
        visual_cues:
          - id: two-refills
            phrase: refill in queue order at ten seconds and again at twenty
            targets:
              - start-grid
            color: cyan
            linger: 0.25
          - id: last-tick-question
            phrase: Does request twenty-one get a slot in time
            targets:
              - arrival-order
              - start-gate
              - queue-decision
              - start-grid
            color: yellow
            linger: 0.25
      - say: At thirty seconds, requests sixteen through twenty take the last five starts. Your first chance
          would be at forty seconds. Your request expires ten seconds before a slot opens. To serve you in
          time, another worker would have to be ready by the thirty-second deadline.
        caption_starts:
          - Your request expires ten seconds before a slot opens
        hold: 1.1
        visual_cues:
          - id: last-five
            phrase: requests sixteen through twenty take the last five starts
            targets:
              - start-grid
              - start-gate
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: turn-too-late
            phrase: Your first chance would be at forty seconds
            targets:
              - arrival-order
              - queue-decision
            color: pink
            linger: 0.25
            caption_boundary: true
  - id: token-clocks
    title: What an admitted caller waits for
    visual: Draw an admitted request's queue and prompt intervals, then mark the four
      individual token deliveries on one millisecond scale. Measure the long last gap alongside the mean.
    beats:
      - say: Here's a caller who did get a slot. Start the server clock when the request arrives. It spends
          a hundred eighty milliseconds in the queue. The worker reads the prompt and sends the first token
          at three hundred milliseconds. That whole wait is the time to first token.
        hold: 0.8
        visual_cues:
          - id: first-delivery
            phrase: It spends a hundred eighty milliseconds in the queue. The worker reads the prompt and sends the
              first token at three hundred milliseconds
            targets:
              - request-clock
            color: cyan
            linger: 0.25
      - say: Watch the next three tokens arrive. The first two come close together, then the caller waits a hundred
          twenty milliseconds for the last one. Those marks are the times the server recorded each token. A
          client can see a different pattern if the network buffers the stream.
        hold: 0.8
        visual_cues:
          - id: later-deliveries
            phrase: Watch the next three tokens arrive
            targets:
              - request-clock
            color: cyan
            linger: 0.25
      - say: After the first token we have two hundred milliseconds spread across three gaps. The mean time per
          output token is about sixty-six point seven milliseconds. With a single token there is no gap to
          average. For this caller the mean hides that last stall. If the first token is slow instead,
          separate queueing, cold starts and prompt processing before asking for another GPU.
        hold: 0.9
        visual_cues:
          - id: mean-gap
            phrase: The mean time per output token is about sixty-six point seven milliseconds
            targets:
              - request-clock
              - clock-result
            color: cyan
            linger: 0.25
            caption_boundary: true
  - id: event-units
    title: Two timestamps for four tokens
    visual: Show one event carrying one token and the next carrying three in a separate trace. Connect the two
      event timestamps while keeping the three bundled tokens inside the same boundary.
    beats:
      - say: Here is a different trace. This recorder stamps an entire output event. The first event carries one
          token at three hundred milliseconds. The next event carries three tokens at three hundred forty.
          There are four tokens on screen. How many gaps did the recorder actually time?
        hold: 1.8
        visual_cues:
          - id: second-packet
            phrase: The next event carries three tokens at three hundred forty
            targets:
              - output-events
            color: cyan
            linger: 0.25
      - say: One gap between events, forty milliseconds. The request average divides those forty milliseconds by
          four tokens minus one. That gives about thirteen point three milliseconds per output token. We have
          no timestamp for each token inside the second event. Draft verification or network buffering can
          produce bundles like this.
        hold: 0.9
        visual_cues:
          - id: event-gap
            phrase: One gap between events, forty milliseconds
            targets:
              - output-events
            color: yellow
            linger: 0.25
            caption_boundary: true
          - id: bundle-mean
            phrase: That gives about thirteen point three milliseconds per output token
            targets:
              - event-result
            color: cyan
            linger: 0.25
            caption_boundary: true
      - say: Read the instrument before setting an alert. In the vLLM definitions used here, the gap histogram gets
          one entry per interval between output events. The pacing histogram gets one mean per finished
          request. Its Prometheus metric records zero for completions with at most one token. The benchmark
          leaves them out of its pacing sample. Even the cache gauge needs a unit check. A reading of point
          eight five means eighty-five percent.
        hold: 0.8
        visual_cues: []
  - id: two-loops
    title: Trace current admission separately from future capacity
    visual: CarryR21 through boundedqueue/batch/stream while a linked controlpath requestsreplicas and
      unschedulableGPU nodes; retainoriginaldeadline.
    beats:
      - say: "The data path handles work available now: authenticated gateway, bounded admission and queue, scheduler,
          loaded model and streamed output. The control loop watches demand and asks for future replicas. If a
          pod cannot fit available GPU nodes, a node controller must obtain suitable hardware. Only loaded,
          warm and healthy engines contribute new serving capacity."
        hold: 0.7
        visual_cues:
          - id: ga-two-loops-b0
            phrase: "The data path handles work available now: authenticated gateway, bounded admission and queue,
              scheduler, loaded model and streamed output."
            targets:
              - two-loops-mechanism
            color: cyan
            linger: 0.3
      - say: A fast overload response can bound current waste while signaling that control loop. Retry keeps the
          original deadline and uses one of a limited number of attempts. Keep the queue bounded while the
          replicas load. Before routing a request, check the serving engine itself. Its sidecar can answer
          a health check even while the model is still loading.
        hold: 0.7
        visual_cues:
          - id: ga-two-loops-b1
            phrase: A fast overload response can bound current waste while signaling that control loop.
            targets:
              - two-loops-mechanism
            color: yellow
            linger: 0.3
  - id: readiness
    title: Loaded, warmed and healthy must all agree
    visual: An executable worker state machine rejects before loading, rejects before warmup, then admits two
      requests and rejects a third at capacity while remaining healthy and ready.
    beats:
      - say: >
          A scheduled worker has a place to run, but this first worker has no loaded weights. Its readiness
          predicate fails and admission returns unavailable. A sidecar responding to a health check would miss
          this condition if the actual engine had failed to initialize.
        visual_cues:
          - id: weights-missing
            phrase: no loaded weights
            targets:
              - readiness-readout
            color: pink
          - id: not-ready
            phrase: readiness predicate fails
            targets:
              - readiness-readout-2
            color: yellow
        hold: 0.65
      - say: >
          Finish loading and check again. Warmup is still incomplete, so the worker remains outside new
          traffic. Startup checks should allow a measured initialization period while still exposing a real
          failure. Readiness should represent the serving engine's ability to take the intended work.
        visual_cues:
          - id: warmup-pending
            phrase: Warmup is still incomplete
            targets:
              - readiness-readout
            color: yellow
          - id: engine-readiness
            phrase: ability to take the intended work
            targets:
              - readiness-readout-2
            color: yellow
        hold: 0.65
      - say: >
          Complete warmup and admit two requests. A third exceeds the local slot budget and receives an
          overload response. The engine remains healthy. Separating admission capacity from liveness prevents
          a full but useful worker from being restarted precisely when users need its active streams
          preserved.
        visual_cues:
          - id: admit-two
            phrase: admit two requests
            targets:
              - readiness-request-r1
              - readiness-request-r2
            color: green
          - id: overload-third
            phrase: third exceeds the local slot budget
            targets:
              - readiness-request-r3
            color: pink
        hold: 0.65
  - id: probe-contract
    title: Keep full capacity separate from failed initialization
    visual: Use actualWorker two slots and status codes503/200/409/429; closeadmissionondrain
      withoutreleasingactiveR1/R2.
    beats:
      - say: This worker returns five-oh-three while it loads and warms up. Once ready, two request IDs receive
          two hundred. A duplicate ID receives four-oh-nine. A third independent request receives
          four-twenty-nine because both slots are busy. Restarting this healthy worker would cut off both
          callers in midstream.
        hold: 0.7
        visual_cues:
          - id: ga-probe-contract-b0
            phrase: This worker returns five-oh-three while it loads and warms up.
            targets:
              - probe-contract-mechanism
            color: cyan
            linger: 0.3
          - id: ga-probe-ready
            phrase: two request IDs receive two hundred
            targets:
              - probe-contract-mechanism
            color: yellow
            linger: 0.3
          - id: ga-probe-duplicate
            phrase: A duplicate ID receives four-oh-nine
            targets:
              - probe-contract-mechanism
            color: yellow
            linger: 0.3
          - id: ga-probe-full
            phrase: a third independent request receives four-twenty-nine
            targets:
              - probe-contract-mechanism
            color: yellow
            linger: 0.3
      - say: Give startup enough time to load the model. Readiness tells the router where to send new traffic.
          Liveness tells Kubernetes when a restart can help. When you drain a worker, close local intake
          immediately. The router takes time to see the change. If two requests race for the last slot,
          admission has to check and claim it in one operation.
        hold: 0.7
        visual_cues:
          - id: ga-probe-contract-b1
            phrase: Give startup enough time to load the model.
            targets:
              - probe-contract-mechanism
            color: yellow
            linger: 0.3
  - id: static-refill
    title: Who gets the short reply's slot?
    visual: Follow two slots through the same four replies. Color one cell per decode step and mark elapsed
      empty slots. Keep the static schedule visible while the second scheduler refills at step two.
    beats:
      - say: Four replies are ready to generate. Two slots take the first pair. One reply needs eight steps,
          the other just two. In a static batch the short reply finishes, but the next caller waits for the
          eight-step reply to finish too. Then the five-step and three-step replies start together.
        hold: 0.7
        visual_cues:
          - id: ga-static-refill-b0
            phrase: One reply needs eight steps, the other just two.
            targets:
              - static-refill-mechanism
            color: cyan
            linger: 0.3
          - id: static-wait
            phrase: the next caller waits for the eight-step reply to finish too
            targets: [static-refill-mechanism]
            color: yellow
          - id: static-last-pair
            phrase: Then the five-step and three-step replies start together
            targets: [static-refill-mechanism]
            color: cyan
      - say: Now refill the short reply's slot as soon as it opens. Count the empty spaces on the two schedules.
          Static needs thirteen steps with eight empty slot-steps. Continuous needs ten with two empty
          slot-steps. Each column here is one decode step. On a GPU its duration depends on the shape of
          the batch.
        hold: 0.7
        caption_starts:
          - Static needs thirteen steps
          - Continuous needs ten
        visual_cues:
          - id: ga-static-refill-b1
            phrase: Now refill the short reply's slot as soon as it opens.
            targets:
              - static-refill-mechanism
            color: yellow
            linger: 0.3
          - id: ga-static-count
            phrase: static needs thirteen steps with eight empty slot-steps
            targets:
              - static-refill-mechanism
            color: green
            linger: 0.3
          - id: ga-continuous-count
            phrase: continuous needs ten with two empty slot-steps
            targets:
              - static-refill-mechanism
            color: green
            linger: 0.3
      - say: Orca developed iteration-level scheduling; modern serving engines combine it with admission and KV
          budgets. Before filling an empty slot with a long prompt, check its token budget, cache space and
          admission policy. Track how long callers wait as you increase the batch size.
        hold: 0.7
        visual_cues:
          - id: ga-static-refill-b2
            phrase: Orca developed iteration-level scheduling; modern serving engines combine it with admission and KV
              budgets.
            targets:
              - static-refill-mechanism
            color: cyan
            linger: 0.3
  - id: logical-pages
    title: Follow logical token order through scattered physical blocks
    visual: BuildL0/L1/L2toP5/P2/P8table with16slotblocks
      andanindependentlyfreeP1;moveactualKVreferencesratherthanreorderinglogicaltokens.
    beats:
      - say: PagedAttention separates logical token pages from their physical storage. The model reads logical L zero,
          L one and L two in order, while the block table points to physical five, two and eight. Another free
          block can supply the next page. The block table keeps the tokens in order even when their
          storage is scattered.
        hold: 0.7
        visual_cues:
          - id: ga-logical-pages-b0
            phrase: PagedAttention separates logical token pages from their physical storage.
            targets:
              - logical-pages-mechanism
            color: cyan
            linger: 0.3
      - say: The systems in the PagedAttention paper's comparison reserved a contiguous region for each
          request's maximum length. A short reply left much of it empty. Scattered free space could leave
          no single region large enough for the next request. Paging grows the allocation one block at a
          time. Only the last block of a sequence can be partly empty. Reusing a computed
          prefix takes one more step, finding a compatible cached prefix.
        hold: 0.7
        visual_cues:
          - id: ga-logical-pages-b1
            phrase: A short reply left much of it empty.
            targets:
              - logical-pages-mechanism
            color: yellow
            linger: 0.3
  - id: allocation-slack
    title: Compute reserved slots from each current sequence
    visual: Construct320/75/900/250tokens into20/5/57/16blocks;sum98blocks1568slots1545used23slack
      againstfixed512blocks.
    beats:
      - say: For the article’s four sequences, three hundred twenty tokens need twenty sixteen-slot blocks;
          seventy-five need five; nine hundred need fifty-seven; two hundred fifty need sixteen. Add
          ninety-eight blocks, or one thousand five hundred sixty-eight slots, for one thousand five hundred
          forty-five stored tokens. Twenty-three slots remain empty at the ends.
        hold: 0.7
        visual_cues:
          - id: ga-allocation-slack-b0
            phrase: For the article’s four sequences, three hundred twenty tokens need twenty sixteen-slot blocks;
              seventy-five need five; nine hundred need fifty-seven; two hundred fifty need sixteen.
            targets:
              - allocation-slack-mechanism
            color: cyan
            linger: 0.3
          - id: ga-slack-total
            phrase: Twenty-three slots remain empty at the ends
            targets:
              - allocation-slack-mechanism
            color: green
            linger: 0.3
      - say: Four fixed two-thousand-forty-eight-token reservations would allocate five hundred twelve blocks, or
          eight thousand one hundred ninety-two slots. Paging avoids six thousand six hundred twenty-four
          reserved slots in this worksheet. Generally sum each request’s ceiling of stored tokens divided by
          block size; shared prefixes and speculative lookahead require separate accounting.
        hold: 0.7
        visual_cues:
          - id: ga-allocation-slack-b1
            phrase: Four fixed two-thousand-forty-eight-token reservations would allocate five hundred twelve blocks, or
              eight thousand one hundred ninety-two slots.
            targets:
              - allocation-slack-mechanism
            color: yellow
            linger: 0.3
          - id: ga-fixed-saving
            phrase: Paging avoids six thousand six hundred twenty-four reserved slots
            targets:
              - allocation-slack-mechanism
            color: green
            linger: 0.3
  - id: prefix-state
    title: Keep cache residency, active references and exact reuse distinct
    visual: Retainphysicalpagesthenquery sameprefix/currenttenant,earlyedit,coldreplica and wrongsalt
      asseparatecontrolled cases.
    beats:
      - say: Prefix caching reuses already computed full blocks for exact leading token IDs under compatible model,
          adapter, tokenizer and isolation scope. Paging alone does not skip prefill. Active references
          protect current readers; unreferenced cached contents may be evictable. A large warm cache therefore
          differs from an exhausted live allocation budget.
        hold: 0.7
        visual_cues:
          - id: ga-prefix-state-b0
            phrase: Prefix caching reuses already computed full blocks for exact leading token IDs under compatible model,
              adapter, tokenizer and isolation scope.
            targets:
              - prefix-state-mechanism
            color: cyan
            linger: 0.3
      - say: Scale-out can route requests from hot replicas onto cold ones and initially increase first-token latency.
          Compare both queue wait and cache hits before declaring a regression. Approved warmup must use the
          eventual model, template, adapter and trusted sharing identity. Different early tokens or a
          different tenant salt do not warm the intended compatible entry.
        hold: 0.7
        visual_cues:
          - id: ga-prefix-state-b1
            phrase: Scale-out can route requests from hot replicas onto cold ones and initially increase first-token
              latency.
            targets:
              - prefix-state-mechanism
            color: yellow
            linger: 0.3
  - id: engine-contract
    title: Compare one request trace under an installed engine contract
    visual: Keepone incidentprompt/schema andfiveengine boundaries; isolatecurrentTensorRTbackend/TGIstatus
      frommeasuredserviceevidence.
    beats:
      - say: Hold request shape, objectives, hardware, precision and correctness fixed before choosing an engine. vLLM
          offers continuous scheduling, paged KV and prefix reuse; SGLang combines prefix-tree reuse with its
          scheduler. llama dot cpp has GGUF and multiple hardware paths whose actual model layout and
          target-machine latency still need checking.
        hold: 0.7
        visual_cues:
          - id: ga-engine-contract-b0
            phrase: Hold request shape, objectives, hardware, precision and correctness fixed before choosing an engine.
            targets:
              - engine-contract-mechanism
            color: cyan
            linger: 0.3
      - say: The current TensorRT-LLM migration guide removes its TensorRT engine backend and makes PyTorch the sole
          execution backend; old separate engine-build instructions no longer describe that API. Hugging Face
          labels TGI maintenance mode. Record the installed release rather than combining current names with
          legacy deployment steps.
        hold: 0.7
        visual_cues:
          - id: ga-engine-contract-b1
            phrase: The current TensorRT-LLM migration guide removes its TensorRT engine backend and makes PyTorch the
              sole execution backend; old separate engine-build instructions no longer describe that API.
            targets:
              - engine-contract-mechanism
            color: yellow
            linger: 0.3
      - say: Take this example vLLM configuration. One GPU rank handles requests up to eight thousand one
          hundred ninety-two tokens long. Chunked prefill and prefix reuse are on. The scheduler can batch
          up to sixteen thousand three hundred eighty-four tokens per iteration. Use the checkpoint's chat
          template, replay your prompts and check both latency and answer quality as you tune.
        hold: 0.7
        visual_cues:
          - id: ga-engine-contract-b2
            phrase: Take this example vLLM configuration
            targets:
              - engine-contract-mechanism
            color: cyan
            linger: 0.3
  - id: request-benchmark
    title: Freeze arrivals, lengths and quality before measuring capacity
    visual: Constructversionedinteractive60/long25/background15requesttrace;holdhardware/release/cachebaseline
      andboundclientqueuebeforecurves.
    beats:
      - say: A representative incident trace includes arrival times, prompt-token counts, output limits, shared-prefix
          IDs, tenant or priority class and streaming flags. The article supplies sixty-percent interactive
          summaries, twenty-five-percent long reviews and fifteen-percent background work as a scenario.
          Identical short prompts cannot expose the same prefill contention, prefix misses and streaming
          tails.
        hold: 0.7
        visual_cues:
          - id: ga-request-benchmark-b0
            phrase: A representative incident trace includes arrival times, prompt-token counts, output limits,
              shared-prefix IDs, tenant or priority class and streaming flags.
            targets:
              - request-benchmark-mechanism
            color: cyan
            linger: 0.3
      - say: Warm the model, tokenizer, cache and scheduler under a declared rule. Sweep concurrency and then bounded
          offered request rates while preserving arrivals and stop conditions. If offered work outruns
          completion, bound the client queue and retain send lag, rejection and timeout evidence. An
          accumulating unbounded harness queue changes later latency measurements.
        hold: 0.7
        visual_cues:
          - id: ga-request-benchmark-b1
            phrase: Warm the model, tokenizer, cache and scheduler under a declared rule.
            targets:
              - request-benchmark-mechanism
            color: yellow
            linger: 0.3
      - say: Bind GPU count and topology, engine/model/tokenizer/driver revisions, precision, quantization, batch and
          parallelism settings, exact baseline and correctness results. Give the baseline the same tuning
          effort. Preserve citations, tools, refusal and schema checks as applicable. A faster configuration
          that changes what counts as a correct incident summary has changed the comparison.
        hold: 0.7
        visual_cues:
          - id: ga-request-benchmark-b2
            phrase: Bind GPU count and topology, engine/model/tokenizer/driver revisions, precision, quantization, batch
              and parallelism settings, exact baseline and correctness results.
            targets:
              - request-benchmark-mechanism
            color: cyan
            linger: 0.3
  - id: goodput-curve
    title: Which load can this service promise?
    visual: Place two ten-second trials on the same fraction axis. Align each workload, its exact numerator and
      denominator, and its qualified rate against a fixed ninety-percent attainment mark.
    beats:
      - say: Before we call a GPU worker a five-slot worker, measure the experience its callers get. In these two
          ten-second trials, a request qualifies only if it meets both the first-token and decode targets. Our
          rule is ninety percent of everyone who tried. In the first trial, ninety-two of a hundred qualify.
          That is nine point two qualified requests per second.
        hold: 0.8
        visual_cues:
          - id: first-trial
            phrase: In the first trial, ninety-two of a hundred qualify
            targets:
              - service-trials
            color: cyan
            linger: 0.25
      - say: Increase the load to twelve requests a second. This time a hundred five of a hundred twenty qualify.
          More requests finished within both targets per second. Look where the second bar ends relative to
          ninety percent. Which offered rate would you use for planning?
        hold: 2.1
        visual_cues:
          - id: higher-load
            phrase: This time a hundred five of a hundred twenty qualify
            targets:
              - service-trials
            color: cyan
            linger: 0.25
      - say: Use ten offered requests per second. The higher rate qualifies only eighty-seven and a half percent.
          Ten is the highest passing rate we tested here. If that load is sustainable, it is our goodput
          point. Keep failed, rejected and late requests in the denominator. DistServe uses mean time per
          output token for its decode target. If your promise covers long stream gaps, measure those gaps too.
          Compare that whole curve and the cost per successful request.
        hold: 1.1
        visual_cues:
          - id: tested-capacity
            phrase: Use ten offered requests per second
            targets:
              - service-trials
              - trial-decision
            color: cyan
            linger: 0.25
            caption_boundary: true
  - id: workload
    title: Can the fifth request still fit?
    visual: Place five adjacent per-request KV allocations on a byte scale. Lengthen every history while the
      eight-GiB pool boundary stays fixed. The fifth allocation moves beyond the pool.
    beats:
