            color: cyan
        hold: 0.65
      - say: >
          One request completes and releases only its own slot. The other stays active. Wait within the
          earliest shutdown deadline and reserve cleanup time. Remaining generation duration is an estimate,
          so a drain policy also needs explicit interruption behavior when completion cannot fit.
