  - id: rare-budget
    title: How many draws would expose a rare failure?
    visual: The zero-failure curve stops at the first budget. It extends until it crosses the five-percent miss line.
      The expected count and the empty-run probability follow the same integer budget.
    beats:
      - say: The launch team has one more question. Suppose a rare failure strikes independently once in ten thousand
          requests on average. For a sample rate, the standard error comes from multiplying p by one minus p,
          dividing by the draw count, then taking the square root. Start with five thousand draws. Would a run with
          no failures surprise you?
        hold: 2
        visual_cues:
          - id: sp-rare-budget-0
            phrase: Start with five thousand draws
            targets:
              - sp-rare-budget-visual
            color: yellow
            linger: 0.45
            caption_boundary: true
      - say: For a run to stay empty, every request must avoid the failure. Multiply that chance by itself five thousand
          times. It comes to about point six zero seven. More than half the runs can be quiet even though the
          expected count is half a failure per run.
        hold: 0.8
        caption_starts:
          - It comes to about point six zero seven
        visual_cues:
          - id: sp-rare-budget-1
            phrase: Multiply that chance by itself five thousand times
            targets:
              - sp-rare-budget-visual
            color: cyan
            linger: 0.45
            caption_boundary: true
      - say: Suppose we want a ninety-five percent chance of seeing at least one. The chance of an empty run must drop to
          five percent. Extend the run until the curve reaches that line. Divide the log of point zero five by the
          log of one minus the failure probability, then round up to a whole request. It takes twenty-nine thousand
          nine hundred fifty-six. Even there we expect only about three failures. That budget buys a good chance to
          detect one. Estimating a tiny rate precisely takes more.
        hold: 0.8
        caption_starts:
          - It takes twenty-nine thousand nine hundred fifty-six
        visual_cues:
          - id: sp-rare-budget-2
            phrase: Extend the run until the curve reaches that line
            targets:
              - sp-rare-budget-visual
            color: yellow
            linger: 0.45
            caption_boundary: true
