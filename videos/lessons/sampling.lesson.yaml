      - say: Continue the same stream to twenty requests. The first five stay. Divide the pink count by all twenty to
          estimate the chance of a late reply. Each late flag is zero or one, a Bernoulli outcome. With
          independent requests sharing one probability, their total count has a binomial distribution.
