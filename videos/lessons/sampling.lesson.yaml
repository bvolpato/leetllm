  - id: monte-carlo
    title: Extend the experiment, keep its past
    visual: The same batch identities move to their actual nested-prefix late rates as each seeded stream grows
      from 100 to 10000 draws, rather than crossfading unrelated point clouds.
    beats:
      - say: Monte Carlo uses repeated draws to approximate a model's consequences. Here each dot is a separate
          hundred-request experiment. Its height is the fraction that missed the timer. The dots differ even
          though every experiment uses the same duration model. The horizontal line is its exact late
          probability.
