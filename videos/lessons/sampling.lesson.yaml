  - id: chain-diagnostics
    title: Where did the chains spend their time?
    visual: Within-chain and between-chain traces feed split rank diagnostics; an exact two-coordinate conditional
      sweep visibly changes one variable while holding the other fixed.
    beats:
      - say: Each color starts from a different resolution rate. Split each trace in half. If the early half
          stays low and the late half stays high, the chain has drifted. Rank-normalized split R-hat compares
          variation within and between those half chains. Nearby steps can carry similar information across
          many lags. Bulk effective sample size measures how much independent information the chain carries
          about its center. For a high percentile, check tail effective sample size and the Monte Carlo error
          of that percentile.
        hold: 0.55
        visual_cues:
          - id: sp-chain-diagnostics-0
            phrase: Split each trace in half
            targets:
              - sp-chain-diagnostics-visual
            color: cyan
            linger: 0.5
      - say: Gibbs sampling updates one coordinate at a time. Hold y fixed and draw x from its conditional
          distribution. Then use the new x to draw y. In this tilted normal cloud, each coordinate has mean
          zero and variance one. Their correlation is point eight. Each conditional mean is point eight times
          the coordinate you held fixed. The conditional standard deviation is point six.
