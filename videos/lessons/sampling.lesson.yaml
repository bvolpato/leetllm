  - id: temperature
    title: Move probability mass while preserving the logit order
    visual: The same four tokens retain their identities while temperature rescales gaps and reshapes the
      normalized mass; deterministic and random choices remain distinct.
    beats:
      - say: For positive temperature T, divide each logit by T before softmax. Below one, positive logit gaps become
          larger; above one, they become smaller. This changes relative probabilities while preserving the
          ordering of finite logits. With T equal to point three, blue gets about point nine one one and clear
          about point zero eight eight. Sampling is still random.
        hold: 0.55
        visual_cues:
          - id: sp-temperature-0
            phrase: divide each logit by T
            targets:
              - sp-temperature-visual
            color: cyan
            linger: 0.5
      - say: At temperature two, blue falls to about forty-five percent and green rises to seven percent.
          Turn the temperature higher and the four bars approach equal heights. Turn it toward zero and
          probability concentrates on the highest score. If two scores tie for first, a greedy decoder needs
          a rule for choosing between them.
        hold: 0.55
        visual_cues:
          - id: sp-temperature-1
            phrase: temperature two
            targets:
              - sp-temperature-visual
            color: cyan
            linger: 0.5
      - say: Keep the temperature at two. For nucleus sampling, start with the likeliest word and keep adding
          words until they cover at least ninety percent of the probability. Blue, clear and cloudy get us
          there. Green drops out. Divide the remaining shares by their sum and draw from those three words.
        caption_starts:
          - Blue, clear and cloudy get us there
        hold: 0.55
        visual_cues:
          - id: sp-temperature-2
            phrase: Blue, clear and cloudy get us there
            targets:
              - sp-temperature-visual
            color: cyan
            linger: 0.5
  - id: gumbel-race
    title: Make one perturbed argmax implement a categorical sample
    visual: Independent open-uniform values become checked Gumbel offsets on named token logits; a perturbed
      maximum chooses a sample before implementation-specific costs are compared.
    beats:
      - say: Draw one independent open-uniform value for each candidate and compute negative log of negative log of
          that value. These are standard Gumbel offsets. Add each offset to its logit divided by the decoding
          temperature, then take the largest perturbed score. In the ideal mathematical model this hard
          Gumbel-Max operation draws exactly from the softmax categorical probabilities.
        hold: 0.55
        visual_cues:
          - id: sp-gumbel-race-0
            phrase: Add each offset to its logit
            targets:
              - sp-gumbel-race-visual
            color: cyan
            linger: 0.5
      - say: Blue starts ahead. Add point seven seven to blue and two point two five to clear. Their temperature-one
          scores become two point nine seven and three point seven five, so clear wins. Repeat with fresh noise
          and each word wins in proportion to its softmax probability. This hard choice returns one token.
          Gumbel-Softmax uses a smooth relaxation when we need derivatives.
        caption_starts:
          - so clear wins
        hold: 0.55
        visual_cues:
          - id: sp-gumbel-race-1
            phrase: Their temperature-one scores become
            targets:
              - sp-gumbel-race-visual
            color: cyan
            linger: 0.5
          - id: sp-gumbel-winner
            phrase: so clear wins
            targets:
              - sp-gumbel-race-visual
            color: yellow
            linger: 0.6
      - say: A GPU can perturb many scores in parallel, then find the largest. The version of vLLM in the
          article uses an equivalent exponential-noise race in its native sampler. Some filtered CUDA calls
          use rejection sampling. Both paths can give each word the same odds while drawing different words
          from a given seed. To compare speed, time the whole draw, including random numbers and the final
          selection.
        hold: 0.55
        visual_cues:
          - id: sp-gumbel-race-2
            phrase: equivalent exponential-noise race
            targets:
              - sp-gumbel-race-visual
            color: cyan
            linger: 0.5
  - id: launch-report
    title: What came back from 5,000 simulated requests?
    visual: One actual five-thousand-request baseline fills supported fields and report denominators; missing
      arrival and worker state leave queue capacity explicitly uncomputed.
    beats:
      - say: This run builds five thousand requests. For each one, draw a resolution, a route, a tool count and
          a duration independently. About seventy-two percent resolved. Read the two tool rows together.
          Requests averaged about two point two calls, and two point four percent went over five. That's close
          to the two and a half percent our Poisson model predicts.
        hold: 0.55
        visual_cues:
          - id: sp-launch-report-0
            phrase: About seventy-two percent resolved
            targets:
              - sp-launch-report-visual
            color: cyan
            linger: 0.5
      - say: Every duration in this run was positive. The median was just over six seconds and the interpolated
          ninety-fifth percentile was about fifteen point seven. The model puts that percentile at fourteen
          point eight. The sample percentile moves from run to run. To estimate how many workers you'd need,
          give those requests arrival times and let them compete for workers.
        hold: 0.55
        visual_cues:
          - id: sp-launch-report-1
            phrase: interpolated ninety-fifth percentile
            targets:
              - sp-launch-report-visual
            color: cyan
            linger: 0.5
      - say: To replay the report, save the settings, seed, generator and draw order with the code. Then compare
          its rows with requests from a separate log. Did the slow ones also use more tools? If rollbacks
          behave differently from other routes, draw route first. Then sample counts and durations together
          using requests from that route.
        hold: 0.55
        visual_cues:
          - id: sp-launch-report-2
            phrase: draw route first
            targets:
              - sp-launch-report-visual
            color: cyan
            linger: 0.5
  - id: joint-relationship
    title: Which replies are both costly and slow?
    visual: Four count slips and four duration slips stay fixed. Their wires are disconnected and reattached. Only a
      wire joining both threshold crossings counts toward joint risk.
    beats:
      - say: An incident can be expensive and slow on the very same request. Here are four receipts with their durations
          detached. Pink marks either a count above five or a time above fifteen seconds. Pair the large counts with
          long durations. Trace each wire end to end. How many requests would trigger both alarms?
        hold: 1.3
        visual_cues:
          - id: sp-joint-relationship-0
            phrase: Pair the large counts with long durations
            targets:
              - sp-joint-relationship-visual
            color: pink
            linger: 0.45
            caption_boundary: true
      - say: Two requests trigger both alarms. Now reverse the duration pairing. Leave every count and every duration just
          where it is. Would the two separate histograms detect that edit? Follow a wire from either six.
        hold: 1.8
        visual_cues:
          - id: joint-first-total
            phrase: Two requests trigger both alarms
            targets:
              - sp-joint-relationship-visual
            color: pink
            linger: 0.4
            caption_boundary: true
          - id: sp-joint-relationship-1
            phrase: reverse the duration pairing
            targets:
              - sp-joint-relationship-visual
            color: cyan
            linger: 0.45
            caption_boundary: true
      - say: Each six now leads to two seconds. The joint share becomes zero. The count histogram would still pass, and so
          would the duration histogram. To test joint risk, keep the original request IDs when you examine real
          traces.
        hold: 0.7
        visual_cues:
          - id: sp-joint-zero
            phrase: The joint share becomes zero
            targets:
              - sp-joint-relationship-visual
            color: pink
            linger: 0.45
            caption_boundary: true
      - say: Try exchanging only the two middle connections. Which request would you investigate now?
        hold: 1.9
        visual_cues:
          - id: sp-joint-relationship-2
            phrase: exchanging only the two middle connections
            targets:
              - sp-joint-relationship-visual
            color: cyan
            linger: 0.45
            caption_boundary: true
      - say: Trace request three. Its six tools and twenty seconds belong to one request. One of four now triggers both
          alarms. Sampling more rows from any one of these pairings would stabilize its own answer. To decide which
          pairing belongs in the simulator, look at count and duration together within each route.
        hold: 0.7
        visual_cues:
          - id: joint-last
            phrase: Trace request three
            targets:
              - sp-joint-relationship-visual
            color: pink
            linger: 0.45
            caption_boundary: true
  - id: ks-geometry
    title: Which side of the step counts?
    visual: Four complete observations build a staircase against a uniform candidate. Its first jump admits two
      different gaps. Two candidate CDFs are then checked against the same 200 complete held-out durations.
    beats:
      - say: Here are four fully observed finishes, at two, three, four and five seconds. Each finish lifts the observed
          fraction by a quarter. The yellow model spreads replies uniformly over the first five seconds. At two
          seconds it expects forty percent to have finished. On the step, check both the empirical height just
          before the first finish and the height just after. Which side gives the bigger gap?
        hold: 2.1
        visual_cues:
          - id: ks-steps
            phrase: four fully observed finishes, at two, three, four and five seconds
            targets:
              - sp-ks-geometry-visual
            color: cyan
            linger: 0.45
            caption_boundary: true
          - id: sp-ks-geometry-0
            phrase: check both the empirical height just before the first finish and the height just after
            targets:
              - sp-ks-geometry-visual
            color: yellow
            linger: 0.45
            caption_boundary: true
      - say: Just before two seconds, nobody has finished. That's a gap of forty percentage points. Just after the jump,
          the gap is only fifteen points. Repeat that comparison at every finish. The largest absolute vertical gap
          anywhere is the Kolmogorov-Smirnov distance, often called the K S distance.
        hold: 0.8
        caption_starts:
          - That's a gap of forty percentage points
          - Just after the jump
        visual_cues:
          - id: ks-left
            phrase: Just before two seconds, nobody has finished
            targets:
              - sp-ks-geometry-visual
            color: pink
            linger: 0.45
            caption_boundary: true
      - say: Now use two hundred fully observed durations drawn from our lognormal model. Both candidates were specified
          in advance. A normal curve with the same mean and variance has distance about point one three five.
          Compare the lognormal curve on those same rows. Its gap is smaller here. Another finite sample could give
          a different ordering. Check the high quantiles and the actual deadline as well. A rare, costly tail can
          barely move an overall distance.
        hold: 0.8
        visual_cues:
          - id: sp-ks-geometry-1
            phrase: Compare the lognormal curve on those same rows
            targets:
              - sp-ks-geometry-visual
            color: yellow
            linger: 0.45
            caption_boundary: true
      - say: The ordinary one-sample K S p-value assumes independent, continuous observations and a candidate fixed before
          seeing them. If you fit the parameters on these rows, the distance still describes them. For a calibrated
          test, a parametric bootstrap can refit each replication. In a log that ends while people are still
          waiting, their finish times need censoring-aware analysis. A timeout records the end of the wait you
          observed.
        hold: 0.8
        visual_cues:
          - id: sp-ks-geometry-2
            phrase: refit each replication
            targets:
              - sp-ks-geometry-visual
            color: cyan
            linger: 0.45
            caption_boundary: true
  - id: tail
    title: Same median, different slow experience
    visual: A fixed median, moving p95, shaded late area and fixed rank expose exactly what a log-spread
      intervention changes.
    beats:
      - say: Keep the median at six seconds, but increase the log-space spread. Keep this inspected random rank fixed
          too. Watch the high-percentile duration move right as the curve spreads. The middle stays put while
          the slow experience changes. Predict what happens to the area beyond our ten-second timer.
        hold: 0.65
        visual_cues:
          - id: tail-spread
            phrase: increase the log-space spread
            targets:
              - tail-density
              - tail-percentile
            color: pink
            linger: 0.5
      - say: That late area grows. A repeatable simulation can measure either supplied model very precisely. Choosing
          the shape requires representative observations. Positive support and a plausible median are useful
          checks; compare the actual deadline fraction and the slow tail as well. Our next cohort will make
          that distinction concrete.
        hold: 0.65
        visual_cues:
          - id: tail-area
            phrase: That late area grows
            targets:
              - tail-density
              - tail-result
            color: pink
            linger: 0.5
  - id: audit
    title: Who belongs in the ten-second report?
    visual: Fifty hollow marks slide aside as the report counts the 200 completed requests. They rejoin the bracket
      before the denominator changes to 250. The numerator stays at 160.
    beats:
      - say: Set the spread back to the original point five five. Now put that model aside and open a separate,
          constructed log. Everyone started together. One hundred sixty finish by ten seconds. Forty finish later,
          by fifteen. Fifty are still unfinished when recording stops. Their completion times are right-censored. We
          know they exceed fifteen seconds.
        hold: 0.75
        visual_cues:
          - id: audit-timely
            phrase: One hundred sixty finish by ten seconds
            targets:
              - audit-cohort
            color: cyan
            linger: 0.45
            caption_boundary: true
          - id: audit-later
            phrase: Forty finish later, by fifteen
            targets:
              - audit-cohort
            color: blue
            linger: 0.45
            caption_boundary: true
          - id: audit-unfinished
            phrase: Fifty are still unfinished
            targets:
              - audit-cohort
            color: pink
            linger: 0.45
            caption_boundary: true
      - say: The report divides the timely count by two hundred. Its bracket takes in every request with a recorded
          finish. Eighty percent looks close to our model. Is that the fraction of arrivals who got a reply by ten
          seconds?
        hold: 2.05
        visual_cues:
          - id: audit-completed-only
            phrase: divides the timely count by two hundred
            targets:
              - audit-fraction
              - audit-cohort
            color: yellow
            linger: 0.45
            caption_boundary: true
      - say: Bring back the fifty unfinished requests. Each of those people was already waiting at ten. The numerator
          stays where it was. Now the bracket covers all two hundred fifty arrivals. Only sixty-four percent got a
          reply in time.
        hold: 0.9
        caption_starts:
          - Only sixty-four percent got a reply in time
        visual_cues:
          - id: audit-denominator
            phrase: Bring back the fifty unfinished requests
            targets:
              - audit-fraction
              - audit-cohort
            color: cyan
            linger: 0.45
            caption_boundary: true
      - say: This cohort gives sixty-four percent where the original model gives about eighty-two. Those extra simulation
          runs can pin down the model's answer as tightly as you like. To explain the gap, check the mixture of
          requests and the time they spent waiting in representative logs.
        hold: 0.8
        visual_cues:
          - id: audit-compare
            phrase: This cohort gives sixty-four percent
            targets:
              - audit-comparison
            color: pink
            linger: 0.45
            caption_boundary: true
  - id: takeaway
    title: Would fifteen seconds cover 95%?
    visual: The same 250 slots stay in view. An ordered count ruler shows the completions needed for 95 percent. Only
      the forty known later completions change status when the timer moves. The target rank is still in the censored
      group.
    beats:
      - say: The original model puts its ninety-fifth percentile just under fifteen seconds. Someone wants to set the
          timer there and promise that nineteen out of twenty people get a reply. Use the same log. For ninety-five
          percent of two hundred fifty arrivals, you'd need at least two hundred thirty-eight finishes. Would a
          fifteen-second timer have reached that mark?
        hold: 2.2
        visual_cues:
          - id: transfer-rank
            phrase: you'd need at least two hundred thirty-eight finishes
            targets:
              - transfer-fraction
            color: yellow
            linger: 0.45
            caption_boundary: true
      - say: Move the deadline and include the forty later completions. Two hundred finished by fifteen seconds. The other
          fifty still have open clocks. We're thirty-eight finishes short of the mark.
        hold: 1.35
        caption_starts:
          - Two hundred finished by fifteen seconds
          - We're thirty-eight finishes short of the mark
        visual_cues:
          - id: transfer-deadline
            phrase: Move the deadline and include the forty later completions
            targets:
              - transfer-fraction
              - transfer-cohort
            color: cyan
            linger: 0.45
            caption_boundary: true
      - say: The two hundred thirty-eighth finish lies beyond fifteen seconds. The log ends before we can put a time on
          it. I'd decline the fifteen-second promise on this evidence and follow those open requests to completion.
          In the next lesson, we'll give two systems the same tasks and ask how much of the difference between them
          could come from sampling.
        hold: 1.2
        caption_starts:
          - I'd decline the fifteen-second promise
          - In the next lesson
        visual_cues:
          - id: transfer-p95
            phrase: lies beyond fifteen seconds
            targets:
              - transfer-tail
            color: yellow
            linger: 0.45
            caption_boundary: true
