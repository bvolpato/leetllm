  - id: queue-stationary
    title: What happens as the worker fills up?
    visual: A birth-death occupancy construction earns utilization and steady-state means; the denominator visibly
      shrinks as arrivals approach service capacity.
    beats:
      - say: In a stable system, multiply the arrival rate by the average time spent inside. You get the average
          number of requests in the system. That's Little's Law. For this curve we also need a model of the
          queue. Requests arrive as a Poisson process and have independent exponential service times. One
          worker takes them in order. Everyone waits as long as it takes, with room for any queue length.
          That's the M M one model. The arrival rate must be smaller than the service rate for the queue
          to settle.
        hold: 0.55
        visual_cues:
          - id: sp-queue-stationary-0
            phrase: The arrival rate must be smaller
            targets:
              - sp-queue-stationary-visual
            color: cyan
            linger: 0.5
      - say: Utilization is lambda divided by mu. Mean total time is one divided by the quantity mu minus lambda. Mean
          queue time is that total minus one divided by mu. With fifteen arrivals and twenty services per
          second, utilization is point seven five, total mean point two seconds and queue mean point one five.
          The service mean remains point zero five.
        hold: 0.55
        visual_cues:
          - id: sp-queue-stationary-1
            phrase: total mean point two seconds
            targets:
              - sp-queue-stationary-visual
            color: cyan
            linger: 0.5
      - say: Raise arrivals to nineteen per second while service stays at twenty. The worker is busy ninety-five
          percent of the time. Requests average a full second from arrival to finish. Nine hundred fifty
          milliseconds of that second are spent waiting. At or above twenty arrivals per second, this queue
          has no finite steady-state mean wait.
        hold: 0.55
        visual_cues:
