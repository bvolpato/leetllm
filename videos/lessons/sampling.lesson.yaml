  - id: metropolis-decision
    title: What goes into the next chain slot?
    visual: A dot on a posterior density supplies a forward and a reverse move. A comparison draw lands on a
      probability ruler, and each decision earns one new slot in the state history. A changed proposal shrinks the
      ruler again.
    beats:
      - say: The assistant resolved eight of ten requests. Which resolution rates fit that record? Start with a
          Beta two, two prior. Add eight resolutions to the first number and two escalations to the second.
          That gives a Beta ten, four posterior. The height at each rate is proportional to p to the ninth
          power times the cube of one minus p. We know this curve, so we can check our sampler against it.
          Start the chain at one half.
        hold: 0.7
        visual_cues:
          - id: sp-metropolis-decision-0
            phrase: That gives a Beta ten, four posterior
            targets:
              - sp-metropolis-decision-visual
            color: cyan
            linger: 0.45
            caption_boundary: true
      - say: Propose a step to point six. For now the proposal is equally likely in either direction. Divide the height at
          the new point by the old height. Any common normalizing constant cancels. The new point is about two point
          six four times as high, so acceptance is one. Move the dot and record point six.
        hold: 0.7
        visual_cues:
          - id: sp-mh-accept
            phrase: so acceptance is one. Move the dot and record point six
            targets:
              - sp-metropolis-decision-visual
            color: cyan
            linger: 0.45
            caption_boundary: true
      - say: Try stepping back. Reversing gives about point three seven nine for the ratio. Keep the smaller of that ratio
          and one as the acceptance probability. Put a uniform draw at point four. Does that draw fall inside the
          blue stretch? What goes into the next slot?
        hold: 2.1
        visual_cues:
          - id: sp-mh-reverse
            phrase: Reversing gives about point three seven nine for the ratio
            targets:
              - sp-metropolis-decision-visual
            color: cyan
            linger: 0.45
            caption_boundary: true
          - id: mh-uniform
            phrase: Put a uniform draw at point four
            targets:
              - sp-metropolis-decision-visual
            color: yellow
            linger: 0.45
            caption_boundary: true
      - say: The uniform draw of point four rejects the step. Write point six again. If we dropped that slot, we'd lose
          how long the chain spent here. This move-or-stay rule is the Metropolis step. A sampler draws a fresh
          uniform value for each decision.
        hold: 0.85
        visual_cues:
          - id: sp-metropolis-decision-1
            phrase: Write point six again
            targets:
              - sp-metropolis-decision-visual
            color: yellow
            linger: 0.45
            caption_boundary: true
      - say: Try the same downhill step with a different proposal rule. Suppose it proposes the return direction half as
          often as the direction we're trying. Multiply by reverse-proposal density divided by forward-proposal
          density before capping at one. The blue stretch shrinks by half. This time the draw is one quarter. Which
          state do you keep?
        hold: 2
        visual_cues:
          - id: sp-metropolis-decision-2
            phrase: The blue stretch shrinks by half
            targets:
              - sp-metropolis-decision-visual
            color: cyan
            linger: 0.45
            caption_boundary: true
          - id: mh-fresh-draw
            phrase: This time the draw is one quarter
            targets:
              - sp-metropolis-decision-visual
            color: yellow
            linger: 0.45
            caption_boundary: true
      - say: Record point six once more. A quarter would have fitted inside the old stretch. It falls outside the
          corrected one. That direction correction gives the Metropolis-Hastings rule. Reject proposals outside the
          target's support. In code, subtract log weights to handle tiny densities and use an inclusive log
          comparison when the generator can return a comparison value of one. An acceptance probability of one must
          always move.
        hold: 0.75
        visual_cues:
          - id: mh-record-last
            phrase: Record point six once more
            targets:
              - sp-metropolis-decision-visual
            color: yellow
            linger: 0.45
            caption_boundary: true
