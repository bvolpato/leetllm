        visual_cues:
          - id: batch-hundred
            phrase: each dot is a separate hundred-request experiment
            targets:
              - batch-points
            color: blue
            linger: 0.5
      - say: Extend every experiment to ten thousand requests. Keep its original hundred and append new draws. Each
          dot moves to its own newly computed rate. The cloud usually tightens as more outcomes contribute; a
          particular dot can briefly move farther from the line. More samples steady the estimate without
          changing the model.
        hold: 0.65
        visual_cues:
          - id: batch-extend
            phrase: Extend every experiment to ten thousand requests. Keep its original hundred and append new draws. Each
              dot moves to its own newly computed rate
            targets:
              - batch-points
              - batch-denominator
            color: cyan
            linger: 0.5
      - say: For independent, identically distributed observations with finite variance, the sample mean's standard
          error scales as one over the square root of the draw count. A hundred times as many draws gives a
          tenfold smaller scale. Our binary flags have finite variance. Record the seed, draw order, code, and
          sampler version so this experiment can be replayed.
