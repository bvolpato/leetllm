scenes:
  - id: intro
    title: Would ten seconds cover every reply?
    visual: A stopwatch sits beside two rows of five chat bubbles in finish order. The middle replies match. The
      last two bubbles in the second row keep their times hidden until the prediction lands.
    beats:
      - say: The top row shows five replies from an incident assistant, fastest first. The middle reply took six seconds.
          Even the slowest, at nine seconds, beat the ten-second timer.
        hold: 0.65
        visual_cues:
          - id: median-half
            phrase: The middle reply took six seconds
            targets:
              - first-median
            color: cyan
            linger: 0.45
            caption_boundary: true
          - id: intro-last-a
            phrase: Even the slowest, at nine seconds, beat the ten-second timer
            targets:
              - first-slowest
            color: cyan
            linger: 0.45
            caption_boundary: true
      - say: Now look at the bottom row. The first three times match, so both runs have a six-second median.
          How many replies in this second run could still miss the timer?
        hold: 2.2
        caption_starts:
          - How many replies in this second run
        visual_cues:
          - id: intro-first-three
            phrase: The first three times match
            targets:
              - second-median
            color: cyan
            linger: 0.45
      - say: Two people were still waiting. One reply took twelve seconds. The other took sixteen. To choose a
          timeout, we need the share of replies that take longer than ten seconds.
        hold: 0.75
        visual_cues:
          - id: intro-last-b
            phrase: One reply took twelve seconds
            targets:
              - fourth-reply
            color: pink
            linger: 0.45
            caption_boundary: true
          - id: intro-fifth
            phrase: The other took sixteen
            targets:
              - fifth-reply
            color: pink
            linger: 0.45
            caption_boundary: true
  - id: request-fields
    title: Follow one rollback request
    visual: One synthetic rollback request acquires its route, three tool calls and a completion mark on a clock. Its
      receipt fills from those events and keeps all four fields on the same row.
    beats:
      - say: The launch team wants five thousand synthetic requests. Follow just this one. An engineer asks to roll back a
          deploy. We route it to rollback. The assistant calls three tools, then replies in eight point four
          seconds. It resolved the request without a human. Those events give us one row we can sample.
        hold: 0.7
        visual_cues:
          - id: sp-request-fields-0
            phrase: route it to rollback
            targets:
              - sp-request-fields-visual
            color: cyan
            linger: 0.45
            caption_boundary: true
          - id: request-tools
            phrase: calls three tools
            targets:
              - sp-request-fields-visual
            color: cyan
            linger: 0.45
            caption_boundary: true
          - id: request-finish
            phrase: then replies in eight point four seconds
            targets:
              - sp-request-fields-visual
            color: cyan
            linger: 0.45
            caption_boundary: true
      - say: A resolution is zero or one. A route is one of four labels. The others are CI failure, access request and log
          triage. Tool calls come in whole numbers, including zero. Elapsed time can fall between clock ticks. These
          are the allowed values, or support. To find out whether expensive rollbacks also run late, keep the count
          and duration on this same row.
        hold: 0.6
        visual_cues:
          - id: sp-request-fields-1
            phrase: A resolution is zero or one. A route is one of four labels
            targets:
              - sp-request-fields-visual
            color: cyan
            linger: 0.45
            caption_boundary: true
          - id: request-count-support
            phrase: Tool calls come in whole numbers
            targets:
              - sp-request-fields-visual
            color: cyan
            linger: 0.45
          - id: request-time-support
            phrase: Elapsed time can fall between clock ticks
            targets:
              - sp-request-fields-visual
            color: cyan
            linger: 0.45
  - id: mass-and-support
    title: Build mass, density and cumulative probability separately
    visual: A binary mass plot, a unit-area uniform rectangle and a cumulative staircase share aligned probability
      accounting without confusing height with area.
    beats:
      - say: Give the assistant a seventy-two percent chance of resolving a request. One means resolved and
          zero means escalated. The masses at zero and one are the heights of these two bars, point two eight
          and point seven two. Together they add to one. A probability mass function assigns each possible
          outcome its share.
        hold: 0.55
        visual_cues:
          - id: sp-mass-and-support-0
            phrase: masses at zero and one
            targets:
              - sp-mass-and-support-visual
            color: cyan
            linger: 0.5
      - say: A continuous density instead integrates over intervals. A uniform duration between zero and one half
          second has height two per second, yet total area one. Between point one and point three seconds,
          width point two times height two gives probability point four. An exact point has zero area.
          A rounded clock reading collects the times in a small interval around the displayed value.
        hold: 0.55
        visual_cues:
          - id: sp-mass-and-support-1
            phrase: Between point one and point three seconds
            targets:
              - sp-mass-and-support-visual
            color: cyan
            linger: 0.5
          - id: sp-uniform-area
            phrase: gives probability point four
            targets:
              - sp-mass-and-support-visual
            color: yellow
            linger: 0.6
      - say: Now add the probabilities as you move from left to right. At zero, the running total jumps to
          point two eight. At one, it reaches one. This staircase is a cumulative distribution function,
          or CDF. Each height is the probability of an outcome at or below that value. For a duration,
          add up the area under the density as you go. In either case, the running total never falls
          and approaches one as you include the whole distribution.
        hold: 0.55
        visual_cues:
          - id: sp-mass-and-support-2
            phrase: the running total jumps to point two eight
            targets:
              - sp-mass-and-support-visual
            color: cyan
            linger: 0.5
  - id: shape
    title: Build a positive duration
    visual: A signed normal coordinate moves through an exponential transformation into positive seconds, with one
      retained dot and a fixed median.
    beats:
      - say: "A random variable describes a quantity whose value will be drawn. Here that quantity is a duration in
          seconds, so choose positive outcomes. Our supplied lognormal model starts with standard normal
          noise: a bell-shaped variable centered at zero with standard deviation one."
        hold: 0.55
        visual_cues:
          - id: normal-noise
            phrase: standard normal noise
            targets:
              - normal-axis
            color: blue
            linger: 0.5
      - say: Multiply that noise by the log-space spread, then exponentiate and multiply by six. Watch a negative
          noise value become a shorter positive time. Zero becomes six seconds. A positive noise value becomes
          a longer time. Exponentiation stretches the upper side.
        hold: 0.6
        visual_cues:
          - id: duration-low
            phrase: a negative noise value become a shorter positive time
            targets:
              - transform-pair
            color: blue
            linger: 0.4
          - id: duration-center
            phrase: Zero becomes six seconds
            targets:
              - transform-pair
            color: cyan
            linger: 0.4
          - id: duration-high
            phrase: A positive noise value becomes a longer time
            targets:
              - transform-pair
            color: pink
            linger: 0.5
        motion_check:
          region:
            - 220
            - 460
            - 1440
            - 330
          minimumChangedFraction: 0.002
      - say: This recipe fixes the median at six and uses a log-space spread of point five five. Its mean is about
          seven seconds because long waits pull the average upward. These are planning assumptions. We will
          challenge them against a separate constructed request cohort.
        hold: 0.6
        visual_cues:
          - id: shape-mean
            phrase: Its mean is about seven seconds
            targets:
              - duration-density
            color: pink
            linger: 0.4
          - id: shape-density
            phrase: long waits pull the average upward
            targets:
              - duration-density
            color: pink
            linger: 0.5
  - id: area
    title: Probability is the shaded area
    visual: A large density plot accumulates area between two movable boundaries before the ten-second completion
      area is earned.
    beats:
      - say: This curve is a probability density. Its horizontal axis is seconds; its height is density per second.
          Shade the interval from five to seven seconds. The area gives the chance of a reply in that range.
          The height of the curve alone gives a different quantity.
        hold: 0.6
        visual_cues:
          - id: area-band
            phrase: Shade the interval from five to seven seconds
            targets:
              - density-area
            color: cyan
            linger: 0.5
      - say: Bring the two boundaries together at six. The interval gets narrower, and its probability approaches
          zero, although the density stays positive. A continuous model assigns probability to ranges. A
          duration rounded to six seconds represents a small interval determined by the clock's precision.
        hold: 0.6
        visual_cues:
          - id: area-narrow
            phrase: Bring the two boundaries together at six
            targets:
              - density-area
            color: yellow
            linger: 0.5
      - say: "Now sweep from zero to our ten-second deadline. This cumulative area is about eighty-two percent. The
          remaining area is about eighteen percent: the model's chance that the timer wins. We have an answer
          under the model. Next, generate individual replies from it."
        hold: 0.7
        visual_cues:
          - id: area-deadline
            phrase: sweep from zero to our ten-second deadline
            targets:
              - density-area
            color: green
            linger: 0.5
          - id: area-result
            phrase: the model's chance that the timer wins
            targets:
              - deadline-probability
            color: pink
            linger: 0.5
  - id: inverse
    title: Turn a random rank into a duration
    visual: A uniform rank travels horizontally to the CDF and vertically to a duration, with the endpoint and
      numerical result withheld until the construction arrives.
    beats:
      - say: The cumulative distribution function, or CDF, records the area up to each time. Its height already is a
          probability. A pseudo-random generator gives us a uniform rank between zero and one. Every
          equal-width rank interval has equal probability. Use one quarter for our first inspected draw.
        hold: 0.6
        visual_cues:
          - id: rank-quarter
            phrase: Use one quarter for our first inspected draw
            targets:
              - inverse-guide
            color: yellow
            linger: 0.5
      - say: Move horizontally from that rank to the curve, then down to the time axis. The inverse CDF turns the
          quarter-rank into about four seconds. For this lognormal model, we find a standard normal quantile,
          scale it, then exponentiate. The displayed value comes from that actual calculation.
        hold: 0.6
        visual_cues:
          - id: inverse-quarter
            phrase: Move horizontally from that rank to the curve, then down to the time axis
            targets:
              - inverse-guide
            color: cyan
            linger: 0.5
          - id: inverse-recipe
            phrase: find a standard normal quantile, scale it, then exponentiate
            targets:
              - inverse-formula
            color: blue
            linger: 0.5
        motion_check:
          region:
            - 225
            - 350
            - 1000
            - 470
          minimumChangedFraction: 0.002
      - say: "Try a rank of point nine five. Predict a longer or shorter wait. Follow the same route: it reaches about
          fifteen seconds. The upper five percent of ranks maps into the whole tail beyond this point.
          Finite-precision generators and quantile calculations approximate this ideal transformation."
        hold: 0.75
        caption_starts:
          - Follow the same route
          - it reaches about fifteen seconds
          - The upper five percent
        visual_cues:
          - id: rank-tail
            phrase: Try a rank of point nine five
            targets:
              - inverse-guide
            color: pink
            linger: 0.4
          - id: inverse-tail
            phrase: "Follow the same route: it reaches about fifteen seconds"
            targets:
              - inverse-guide
            color: pink
            linger: 0.5
  - id: inverse-contract
    title: Use the generalized inverse and check the random endpoints
    visual: A flat-and-jumping CDF reveals the first value reaching a retained uniform rank; an open-uniform guard
      repairs finite-generator endpoints before logarithms.
    beats:
      - say: The general quantile is the smallest value whose cumulative probability reaches the selected rank. This
          generalized inverse also works when a CDF has flat regions or jumps. In the ideal model, a uniform
          rank passed through the exact quantile has the target distribution. Going the other way, a
          continuous draw passed through its own continuous CDF is uniform. These are different directions of
          the transform.
        hold: 0.55
        visual_cues:
          - id: sp-inverse-contract-0
            phrase: smallest value whose cumulative probability reaches
            targets:
              - sp-inverse-contract-visual
            color: cyan
            linger: 0.5
      - say: For exponential service with rate mu, the quantile is negative log of one minus the rank, divided by mu.
          Negative log of the rank divided by mu gives the same distribution with a reflected uniform stream.
          For our lognormal duration, exponentiate the sum of log six and point five five times the standard
          normal quantile. Its median is six; its ninety-fifth percentile is about fourteen point eight three
          seconds.
        hold: 0.55
        visual_cues:
          - id: sp-inverse-contract-1
            phrase: the quantile is negative log
            targets:
              - sp-inverse-contract-visual
            color: cyan
            linger: 0.5
      - say: Python random returns finite-precision values from zero inclusive to one exclusive. A logarithm or
          inverse normal may require a rank strictly inside both endpoints, so the article redraws endpoints
          where necessary. Numerical quantiles and tail cutoffs approximate the ideal law. In its seeded
          five-thousand-draw example, the lognormal sample median is six point zero three and the sample
          ninety-fifth percentile fourteen point eight five; finite samples need not equal the model
          quantiles.
        hold: 0.55
        visual_cues:
          - id: sp-inverse-contract-2
            phrase: redraws endpoints
            targets:
              - sp-inverse-contract-visual
            color: cyan
            linger: 0.5
  - id: resolution-count
    title: How many did the assistant resolve?
    visual: An identified 100-request draw accumulates flags and a running count. A binomial mass plot and six batch
      totals from the article's separate seeded run show the distinction between a parameter and one realization.
    beats:
      - say: Say each request has a seventy-two percent chance of resolving. Draw the first four. Three escalate. Only the
          fourth adds one to the resolved count. Each zero or one is a Bernoulli draw, with mean p and variance p
          times one minus p. Fill the rest of the batch. With independent requests and the same chance on every
          draw, the number resolved in n requests is binomial.
        hold: 0.75
        visual_cues:
          - id: resolution-first-four
            phrase: Draw the first four. Three escalate. Only the fourth adds one
            targets:
              - sp-resolution-count-visual
            color: cyan
            linger: 0.45
            caption_boundary: true
          - id: sp-resolution-count-0
            phrase: Fill the rest of the batch. With independent requests and the same chance on every draw
            targets:
              - sp-resolution-count-visual
            color: cyan
            linger: 0.45
            caption_boundary: true
      - say: We got seventy-one. Over repeated batches of a hundred, the expected count is seventy-two. Multiply n by p
          for the mean, and by one minus p again for the variance. Here the variance is twenty point one six. How
          likely is exactly seventy-two? Multiply seventy-two factors of p and twenty-eight factors of one minus p.
          That's the probability of one particular arrangement. The binomial coefficient counts all arrangements
          with that total. Together they give about a nine percent chance.
        hold: 0.8
        caption_starts:
          - How likely is exactly seventy-two
          - Multiply seventy-two factors
          - Together they give about a nine percent chance
        visual_cues:
          - id: sp-resolution-count-1
            phrase: the expected count is seventy-two. Multiply n by p for the mean
            targets:
              - sp-resolution-count-visual
            color: cyan
            linger: 0.45
            caption_boundary: true
      - say: Compare six more batches drawn with a separate recorded seed. Their counts range from sixty-nine to
          seventy-eight. The line stayed put when the dots moved. Seventy-two percent was supplied to the simulator.
          A batch measures what happened on that run. If requests arrive in related incident waves, or differ in
          their chance of resolution, reconsider the binomial model before interpreting the scatter.
        hold: 0.7
        visual_cues:
          - id: sp-resolution-count-2
            phrase: Compare six more batches drawn with a separate recorded seed
            targets:
              - sp-resolution-count-visual
            color: cyan
            linger: 0.45
            caption_boundary: true
  - id: route-count
    title: Which route takes the next request?
    visual: Four probability widths divide one strip. The rank for R18 lands before its label is filled. The same
      widths supply expected counts for a recorded 500-request run.
    beats:
      - say: R seventeen's receipt already had a route. For the next request, R eighteen, we'll draw one. Cumulative
          widths partition the unit interval. CI failure takes the first forty-five percent. Rollback takes the next
          twenty, access another twenty, and log triage the rest. Put a uniform rank of point five seven on that
          strip. Which route will the sampler assign?
        hold: 2.05
        visual_cues:
          - id: sp-route-count-0
            phrase: Cumulative widths partition the unit interval. CI failure takes the first forty-five percent
            targets:
              - sp-route-count-visual
            color: cyan
            linger: 0.45
            caption_boundary: true
          - id: route-rank
            phrase: Put a uniform rank of point five seven on that strip
            targets:
              - sp-route-count-visual
            color: yellow
            linger: 0.45
            caption_boundary: true
      - say: Point five seven lies between point four five and point six five. R eighteen gets rollback. That's one
          categorical draw. Relative weights of forty-five, twenty, twenty and fifteen give the same widths once you
          divide by their sum. An unfamiliar route coming out of this sampler would be grounds to check its label
          set.
        hold: 0.75
        visual_cues:
          - id: route-landed
            phrase: R eighteen gets rollback
            targets:
              - sp-route-count-visual
            color: cyan
            linger: 0.45
            caption_boundary: true
      - say: Repeat the draw independently five hundred times with the same weights. Rollback should get about a hundred
          requests. The actual article run gives it a few more. Read across both rows. Each still totals five
          hundred, because moving a request into one route takes it out of another. Those counts together follow a
          multinomial distribution.
        hold: 0.7
        visual_cues:
          - id: sp-route-count-1
            phrase: The actual article run gives it a few more
            targets:
              - sp-route-count-visual
            color: cyan
            linger: 0.45
            caption_boundary: true
  - id: poisson-count
    title: How many tool calls go on one request?
    visual: Bars show the probability of each tool count. A second plot follows a product through five
      uniform draws. The first point below the cutoff stops the sampler.
    beats:
      - say: Suppose a request takes two point two tool calls on average. Try a Poisson model with that mean.
          Each bar gives the chance of a whole number of calls. Two calls is the likeliest count, at about
          twenty-seven percent. Even zero calls gets a bar, at about eleven percent.
        hold: 0.55
        visual_cues:
          - id: sp-poisson-count-0
            phrase: Each bar gives the chance of a whole number of calls
            targets:
              - sp-poisson-count-visual
            color: cyan
            linger: 0.5
      - say: A sixth call costs extra. Add up the bars from six onward. About two and a half percent of requests
          cross that threshold. A single Poisson rate also predicts a variance equal to the mean. Check both
          predictions against the tool counts in the log. Retries can send one request back for several more calls.
        hold: 0.55
        visual_cues:
          - id: sp-poisson-count-1
            phrase: Add up the bars from six onward
            targets:
              - sp-poisson-count-visual
            color: cyan
            linger: 0.5
      - say: Let's draw one count. Start at one and multiply by a fresh uniform draw each time. Count each
          product that stays above the cutoff. The cutoff is e to the minus two point two, about point one one one.
          Four draws leave the product at point one six eight. The next draw is point four. Will it add a fifth call?
        hold: 2
        caption_starts:
          - The next draw is point four
        visual_cues:
          - id: sp-poisson-count-2
            phrase: Four draws leave the product at point one six eight
            targets:
              - sp-poisson-count-visual
            color: cyan
            linger: 0.5
      - say: The product drops to about point zero six seven, below the cutoff. The sampler stops and returns four
          calls. At rate zero the cutoff is one, so the first draw stops the count at zero. The article uses
          this loop for rates up to twenty.
        hold: 0.75
        caption_starts:
          - The sampler stops and returns four calls
        visual_cues:
          - id: poisson-crossing
            phrase: The product drops to about point zero six seven, below the cutoff
            targets:
              - sp-poisson-count-visual
            color: pink
          - id: poisson-return
            phrase: returns four calls
            targets:
              - sp-poisson-count-visual
            color: yellow
  - id: bursty-mixture
    title: Who crosses the five-call budget?
    visual: Two measured count histograms use identical scales. A sweep collects frequencies above five calls into two
      running numerators while the sample means stay in place.
    beats:
      - say: Finance pays extra when a request needs more than five tool calls. The upper run uses one Poisson rate of two
          point two. For the lower run, choose a rate of one point two for eighty-eight percent of requests and ten
          for the rest. Draw the count from the chosen rate each time. That puts the average at two point two five
          six before sampling. Looking at the two runs, would you give them the same budget?
        hold: 2
        visual_cues:
          - id: sp-bursty-mixture-0
            phrase: choose a rate of one point two for eighty-eight percent of requests and ten for the rest
            targets:
              - sp-bursty-mixture-visual
            color: cyan
            linger: 0.45
            caption_boundary: true
      - say: Start at six calls and collect every bar to its right as well. Each bar counts whole requests. Mean tool use
          barely changed. But the lower run sends more than four times as many requests over budget. If you priced
          these two runs from their means, you'd miss that charge.
        hold: 0.85
        caption_starts:
          - But the lower run sends more than four times
        visual_cues:
          - id: sp-bursty-mixture-1
            phrase: Start at six calls and collect every bar to its right as well
            targets:
              - sp-bursty-mixture-visual
            color: pink
            linger: 0.45
            caption_boundary: true
      - say: Compare the variances. A single Poisson rate ties the variance to the mean. The ratio here goes from about
          one to four point six five. The changing rate adds variation between request types. Excess variance does
          not identify a unique replacement. In this example we picked the type afresh on every request. To test a
          story about retries clustering in time, look for them in the ordered request history.
        hold: 0.65
        visual_cues:
          - id: sp-bursty-mixture-2
            phrase: Compare the variances
            targets:
              - sp-bursty-mixture-visual
            color: yellow
            linger: 0.45
            caption_boundary: true
  - id: normal-failure
    title: Let the proposed normal duration reveal impossible values
    visual: A signed normal draw falls below the zero-second support boundary; clipping visibly deposits mass at
      zero while a positive-family repair changes the model honestly.
    beats:
      - say: A proposed normal duration with mean eight seconds and standard deviation six assigns some probability
          below zero. In the article’s five thousand draws, roughly nine point five percent are negative, and
          the smallest is about negative fifteen point seven seconds. A reasonable-looking sample mean of
          eight point zero nine has not rescued impossible completion times.
        hold: 0.55
        visual_cues:
          - id: sp-normal-failure-0
            phrase: roughly nine point five percent are negative
            targets:
              - sp-normal-failure-visual
            color: cyan
            linger: 0.5
      - say: Clipping negatives to zero puts an extra probability mass at zero and changes the distribution. A
          justified truncation, positive family or empirical duration model is a different proposal with its
          own consequences. Our lognormal median is exponential of its log-space center, and its mean is
          exponential of that center plus half the squared log-space spread. Passing six as the log-space
          center would give a median near four hundred three seconds, not six.
        hold: 0.55
        visual_cues:
          - id: sp-normal-failure-1
            phrase: Clipping negatives to zero
            targets:
              - sp-normal-failure-visual
            color: cyan
            linger: 0.5
  - id: service-rate
    title: How much longer will this worker be busy?
    visual: On an exponential survival curve, a hundred-millisecond bracket slides forward fifty milliseconds.
      The remaining fraction is measured from the requests still in service.
    beats:
      - say: Start the clock when a worker picks up a request. Give service time an exponential distribution with
          a rate of twenty per second. Mean service time is the reciprocal, fifty milliseconds. The chance service
          lasts longer than a tenth of a second is e to the minus two, about thirteen and a half percent.
