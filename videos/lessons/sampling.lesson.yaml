            color: cyan
            linger: 0.5
      - say: Start at two, negative two. Let's trace the centers by taking the conditional median on each move.
          Hold y still. Eight tenths of negative two puts x at negative one point six. Now hold that x still.
          Eight tenths of it puts y at negative one point two eight. When you sample, draw around each center.
          The first draw sets the center for the next.
        hold: 0.55
        visual_cues:
          - id: sp-chain-diagnostics-2
            phrase: Eight tenths of negative two puts x at negative one point six
            targets:
