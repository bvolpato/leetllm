          factor-of-two error rule. Squared distance to reconstructed PQ vectors does not automatically
          equal cosine distance between unit vectors. The executed forty-row toy uses two one-byte
          identifiers with four centroids each: sixteen raw float bytes become two code bytes, plus a
          sixty-four-byte shared codebook. Four centroids could be bit-packed further; this worksheet
