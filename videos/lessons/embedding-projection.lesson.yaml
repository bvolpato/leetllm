      - say: "A Johnson-Lindenstrauss existence bound for a fixed set of N points uses k at least four natural
          log N divided by the quantity epsilon squared over two minus epsilon cubed over three, for
          epsilon between zero and one. It bounds squared Euclidean distortion between one minus epsilon
          and one plus epsilon. This conservative sufficient bound can exceed the original dimension: ten
          million points at epsilon point one five require about six thousand three hundred sixty-eight
          dimensions. It is not a useful compression promise for fifteen thirty-six dimensions, nor a
          statement that every arbitrary draw succeeds."
