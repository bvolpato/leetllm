    title: A useful picture and a useful index solve different problems
    visual: A high-dimensional policy vector divides into a two-dimensional inspection map and a smaller
      candidate serving representation, each with a separate quality check.
    beats:
      - say: A policy assistant receives the right question but retrieves the wrong clause. An engineer opens a
          two-dimensional map to see how the policy embeddings are arranged. The picture can help locate
          confusing neighbors, while the serving index still needs its own test.
        hold: 0.6
        visual_cues:
          - id: opening-beat-1-focus-1
            phrase: An engineer opens a two-dimensional map to see
            targets:
              - opening-mechanism
            color: blue
            linger: 0.6
          - id: opening-beat-1-focus-2
            phrase: A policy assistant receives the right question but retrieves the wrong clause
            targets:
              - opening-mechanism
            color: blue
            linger: 0.6
      - say: Dimensionality reduction maps a long vector into fewer coordinates. One goal is easier inspection on
          a screen. Another is cheaper storage and search. The transformations may look similar in a
          diagram, but they preserve different properties.
        hold: 0.65
        visual_cues:
          - id: opening-beat-2-focus-1
            phrase: Dimensionality reduction maps a long vector into fewer coordinates
            targets:
              - opening-mechanism
            color: blue
            linger: 0.6
      - say: We will watch a projection collapse a real distance, compare linear and neighborhood maps, and
          measure whether the nearest neighbors survive. Then we will separate a diagnostic picture from
