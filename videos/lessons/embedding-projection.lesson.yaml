  - id: tsne
    title: t-SNE pulls a pair whose neighbor probability is lost
    visual: A local pair receives probability 0.10 in the original space and 0.01 in the map. Bringing it
      closer raises its map probability and reduces its illustrative KL term.
    beats:
      - say: t-SNE turns high-dimensional distances into probabilities of neighboring pairs. It adjusts points in
          the map to make its pair probabilities agree with those original neighborhoods.
