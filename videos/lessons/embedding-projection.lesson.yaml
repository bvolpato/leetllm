  - id: geometry-budget
    title: Count vector bytes and state the geometry assumption
    visual: A progressive numerical construction retains the policy vectors, fitted artifacts and measured
      distinctions through this chapter.
    beats:
      - say: High dimension can make intuition unreliable. For two independent isotropic Gaussian vectors with
          coordinate variance sigma squared, their squared distance has mean two d sigma squared and
          variance eight d sigma to the fourth. Its standard deviation divided by its mean is the square
          root of two divided by d. Relative squared-distance variation therefore shrinks as dimension
          grows in this model. Learned embeddings need not satisfy its independence or isotropy
          assumptions.
        hold: 0.75
        visual_cues:
          - id: gaussian-mean
            phrase: mean two d sigma squared
            targets:
              - geometry-budget-mechanism
            linger: 0.5
          - id: gaussian-var
            phrase: variance eight d sigma to the fourth
            targets:
              - geometry-budget-mechanism
            linger: 0.5
          - id: gaussian-ratio
            phrase: square root of two divided by d
            targets:
              - geometry-budget-mechanism
            linger: 0.5
      - say: The raw vector ledger excludes document text, identifiers, graph links, levels and allocator
          overhead. HNSW connection and search parameters also affect recall, memory and work. Reducing
          dimension lowers coordinate storage and arithmetic, but it does not determine end-to-end
          latency or graph quality. Measure the full index and serving request after the exact
          representation, metric and search settings are fixed.
        hold: 0.75
        visual_cues:
          - id: index-overhead
            phrase: raw vector ledger excludes
            targets:
              - geometry-budget-mechanism
            linger: 0.5
          - id: index-settings
            phrase: HNSW connection and search parameters
            targets:
              - geometry-budget-mechanism
            linger: 0.5
  - id: pca-fit
    title: Construct a fitted coordinate system
    visual: A progressive numerical construction retains the policy vectors, fitted artifacts and measured
      distinctions through this chapter.
    beats:
      - say: "Start with points one comma one, two comma two and three comma three. Their mean is two comma two.
          Subtract that same mean from every row: the centered points are minus one comma minus one, zero
          comma zero, and one comma one. Project onto the unit direction one comma one divided by the
          square root of two. The coordinates become minus square root of two, zero and positive square
          root of two."
        hold: 0.75
        visual_cues:
          - id: pca-mean
            phrase: Their mean is two comma two
            targets:
              - pca-fit-mechanism
            linger: 0.5
          - id: pca-center
            phrase: Subtract that same mean
            targets:
              - pca-fit-mechanism
            linger: 0.5
          - id: pca-axis
            phrase: Project onto the unit direction
            targets:
              - pca-fit-mechanism
            linger: 0.5
          - id: pca-scores
            phrase: "The coordinates become minus square root of two, zero and positive square root of two"
            targets:
              - pca-fit-mechanism
            linger: 0.5
      - say: For an N by d centered data matrix, thin singular value decomposition writes X as U Sigma V
          transpose. With r equal to the smaller of N and d, U is N by r and V is d by r. Centering
          limits rank to at most the smaller of N minus one and d. The leading columns of V give the
          retained directions. Covariance eigenvalues are the squared singular values divided by N minus
          one when N exceeds one. Explained variance retained is the retained sum of squared singular
          values divided by the total.
        hold: 0.75
        visual_cues:
          - id: svd-shapes
            phrase: thin singular value decomposition
            targets:
              - pca-fit-mechanism
            linger: 0.5
          - id: centered-rank
            phrase: Centering limits rank
            targets:
              - pca-fit-mechanism
            linger: 0.5
          - id: pca-covariance
            phrase: Covariance eigenvalues
            targets:
              - pca-fit-mechanism
            linger: 0.5
          - id: pca-energy
            phrase: Explained variance retained
            targets:
              - pca-fit-mechanism
            linger: 0.5
      - say: Forming X transpose X squares the matrix condition number and can worsen numerical sensitivity;
          direct SVD avoids that explicit product. Some PCA solvers use covariance, so record the actual
          solver. PCA centers features without automatically standardizing them. Scaling and whitening
          change the geometry and need their own validation. Fit supervised preprocessing inside each
          training fold; select dimensions on development queries and reserve fresh test queries.
        hold: 0.75
        visual_cues:
          - id: pca-condition
            phrase: squares the matrix condition number
            targets:
              - pca-fit-mechanism
            linger: 0.5
          - id: pca-whiten
            phrase: Scaling and whitening
            targets:
              - pca-fit-mechanism
            linger: 0.5
          - id: pca-fold
            phrase: inside each training fold
            targets:
              - pca-fit-mechanism
            linger: 0.5
  - id: pca-query
    title: Reuse the saved mean and basis
    visual: A progressive numerical construction retains the policy vectors, fitted artifacts and measured
      distinctions through this chapter.
    beats:
      - say: A fitted serving artifact contains one mean, one ordered basis, the encoder version and the
          normalization policy. Apply the same artifact to indexed documents and later queries. Fitting a
          new PCA separately for each query creates incomparable coordinates. Even a sign change in a
          basis axis is harmless only if both sides use it consistently.
        hold: 0.75
        visual_cues:
          - id: saved-artifact
            phrase: one mean, one ordered basis
            targets:
              - pca-query-mechanism
            linger: 0.5
          - id: shared-transform
            phrase: same artifact to indexed documents
            targets:
              - pca-query-mechanism
            linger: 0.5
          - id: query-sign
            phrase: a sign change in a basis axis
            targets:
              - pca-query-mechanism
            linger: 0.5
      - say: Centering can change cosine similarity even when every principal component is kept. Renormalize
          transformed vectors when cosine is implemented as a dot product. Reject zero or nonfinite
          inputs and zero projected vectors; there is no defined cosine direction for them. Scale by the
          largest absolute coordinate before computing a norm when necessary to avoid overflow. A strong
          mean direction or large component is not automatically nuisance information; inspect its effect
          on the policy task.
        hold: 0.75
        visual_cues:
          - id: centering-cosine
            phrase: Centering can change cosine similarity
            targets:
              - pca-query-mechanism
            linger: 0.5
          - id: renormalize
            phrase: Renormalize transformed vectors
            targets:
              - pca-query-mechanism
            linger: 0.5
          - id: reject-zero
            phrase: Reject zero or nonfinite inputs
            targets:
              - pca-query-mechanism
            linger: 0.5
          - id: safe-norm
            phrase: Scale by the largest absolute coordinate
            targets:
              - pca-query-mechanism
            linger: 0.5
  - id: recall-sweep
    title: Sweep dimensions against the judged task
    visual: A progressive numerical construction retains the policy vectors, fitted artifacts and measured
      distinctions through this chapter.
    beats:
      - say: The executed sixty-row, six-coordinate synthetic PCA example retains about ninety-nine point two
