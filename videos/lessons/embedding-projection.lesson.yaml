  - id: methods
    title: Linear variance and local neighbors are different targets
    visual: A centered point cloud rotates onto its leading variance direction beside a separate
      local-neighbor graph whose edge list remains explicit.
    beats:
      - say: Principal component analysis, or PCA, is a linear projection. It finds directions with large
          variation across the fitted data, then maps points onto the leading directions. Its objective
          measures how much overall variance remains.
        hold: 0.6
        visual_cues:
          - id: methods-beat-1-focus-1
            phrase: It finds directions with large variation across the fitted data
            targets:
              - methods-mechanism
            color: blue
