            linger: 0.5
  - id: umap-contract
    title: Separate graph memberships from map forces
    visual: A progressive numerical construction retains the policy vectors, fitted artifacts and measured
      distinctions through this chapter.
    beats:
      - say: UMAP builds local directed memberships using an offset rho and scale sigma. For a selected neighbor,
          the weight is the exponential of minus the nonnegative distance beyond rho divided by sigma; an
          absent direction has weight zero. These memberships are not a probability distribution summing
          to one. Combine opposing weights p and q with p plus q minus p times q. Neighborhood size
          changes graph construction, while minimum distance influences the layout.
        hold: 0.75
        visual_cues:
          - id: umap-local
            phrase: offset rho and scale sigma
            targets:
              - umap-contract-mechanism
            linger: 0.5
          - id: umap-memberships
            phrase: not a probability distribution summing to one
            targets:
              - umap-contract-mechanism
            linger: 0.5
          - id: umap-combine
            phrase: p plus q minus p times q
            targets:
              - umap-contract-mechanism
            linger: 0.5
      - say: The low-dimensional membership is one divided by one plus a times distance to the power two b. The
          theoretical binary cross-entropy has attraction from graph edges and repulsion from nonedges;
          practical negative sampling changes the effective weighting. A graph layout therefore cannot
          promise calibrated global distances. UMAP can transform new points using its fitted machinery,
          but that operation is not the saved linear PCA multiplication. Check actual neighbors and task
          performance before using either map as a serving representation.
        hold: 0.75
        visual_cues:
