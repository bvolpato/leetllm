  - id: random-projection
    title: Test a fixed no-fit transform
    visual: A progressive numerical construction retains the policy vectors, fitted artifacts and measured
      distinctions through this chapter.
    beats:
      - say: A random projection draws one matrix and reuses it for every document and query. A Gaussian
          construction uses entries with mean zero and variance one over the output dimension. A sparse
          Achlioptas construction uses positive and negative square root of three over k with probability
          one sixth each, and zero with probability two thirds. Save the matrix or a reproducible
          generation contract; do not draw a new space per request.
