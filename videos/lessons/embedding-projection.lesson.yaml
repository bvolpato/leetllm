  - id: tsne-contract
    title: Normalize a complete neighborhood distribution
    visual: A progressive numerical construction retains the policy vectors, fitted artifacts and measured
      distinctions through this chapter.
    beats:
      - say: t-SNE first makes conditional neighbor probabilities from Gaussian distance weights, with a local
          bandwidth. Perplexity is the exponential of entropy in matching log units, a smooth
          effective-neighbor count rather than a cluster count. Symmetrize the two directed probabilities
          and divide by two times the number of points. Set self-pairs to zero. In the map, each ordered
          nonself pair receives weight one divided by one plus squared distance; divide by the sum of all
          those weights.
        hold: 0.75
        visual_cues:
          - id: tsne-gaussian
            phrase: Gaussian distance weights
            targets:
              - tsne-contract-mechanism
            linger: 0.5
          - id: tsne-perplexity
            phrase: Perplexity is the exponential of entropy
            targets:
              - tsne-contract-mechanism
            linger: 0.5
          - id: tsne-symmetry
            phrase: Symmetrize the two directed probabilities
            targets:
              - tsne-contract-mechanism
            linger: 0.5
          - id: tsne-q-normalize
            phrase: divide by the sum of all those weights
            targets:
              - tsne-contract-mechanism
            linger: 0.5
      - say: "That denominator couples the whole map: moving one pair changes other normalized probabilities.
          Minimize the sum of p times log p over q over all pairs. An individual term can be negative
          although the full KL divergence is nonnegative. The heavy tail helps address crowding without
          preserving all global distances or cluster sizes. The original nonparametric method does not
          supply an encoder for a future query. Our earlier single-pair motion illustrates a
          contribution, not a complete fitted optimization."
        hold: 0.75
        visual_cues:
