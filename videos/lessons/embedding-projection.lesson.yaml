    beats:
      - say: UMAP begins from a nearest-neighbor graph. A point can assign one strength to another point, while
          the reverse direction can have its own strength. In this example, the two directions carry zero
          point eight zero and zero point six zero.
        hold: 0.65
        visual_cues:
          - id: umap-beat-1-focus-1
            phrase: UMAP begins from a nearest-neighbor graph
