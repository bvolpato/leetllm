    visual: A 1,536-coordinate vector folds into 256 coordinates. Repeated across ten million records, the
      exact raw-array memory falls from 61.44 to 10.24 decimal gigabytes.
    beats:
      - say: A vector with one thousand five hundred thirty-six float32 coordinates uses four bytes per
          coordinate. That is six thousand one hundred forty-four bytes for one raw vector, before its
          index graph or metadata.
        hold: 0.6
        visual_cues:
          - id: budget-beat-1-focus-1
            phrase: A vector with one thousand five hundred thirty-six
            targets:
