  - id: policy-baseline
    title: Keep the policy task beside its vectors
    visual: A progressive numerical construction retains the policy vectors, fitted artifacts and measured
      distinctions through this chapter.
    beats:
      - say: Our policy question asks when a secret must be rotated. The hand-authored baseline contains six
          six-coordinate document vectors. Normalize each finite nonzero vector, then rank cosine
          similarity, the dot product divided by both vector norms. The query retrieves two rotation
          clauses at approximately point nine nine nine and point nine nine seven; a failed-security-scan
          clause scores about point zero three six. These coordinates are a deterministic teaching
          fixture, not outputs from a language model.
        hold: 0.75
        visual_cues:
          - id: policy-normalize
            phrase: Normalize each finite nonzero vector
            targets:
              - policy-baseline-mechanism
            linger: 0.5
          - id: policy-scores
            phrase: query retrieves two rotation clauses
            targets:
              - policy-baseline-mechanism
            linger: 0.5
          - id: policy-control
            phrase: failed-security-scan clause
            targets:
              - policy-baseline-mechanism
            linger: 0.5
      - say: The two judged relevant clauses both appear in the top two, so Recall at two is two divided by two,
          or one. Preserve that task, its labels and its original vectors when testing a shorter
          representation. Agreement with old neighbors measures geometric fidelity; judged relevance
          measures whether the policy question was answered. Neither becomes representative production
