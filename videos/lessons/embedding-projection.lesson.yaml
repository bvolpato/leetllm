  - id: product-quantization
    title: Build subvector codes and query lookup tables
    visual: A progressive numerical construction retains the policy vectors, fitted artifacts and measured
      distinctions through this chapter.
    beats:
      - say: Product quantization splits a vector into m disjoint blocks, trains a centroid codebook per block
          and stores a centroid identifier for each block. With two hundred fifty-six centroids, each
          identifier fits one byte. A one hundred twenty-eight-coordinate float32 vector uses five
          hundred twelve bytes; eight block identifiers use eight bytes, a sixty-four-fold raw-code
          reduction. Shared codebooks and the index remain additional storage. Each centroid has its
          block’s coordinate width. Across all m codebooks there are m times K times d over m
          coordinates, which equals K times d; multiply by the bytes per float for shared codebook
          storage.
        hold: 0.75
        visual_cues:
          - id: pq-books
            phrase: centroid codebook per block
            targets:
              - product-quantization-mechanism
            linger: 0.5
          - id: pq-ids
            phrase: each identifier fits one byte
            targets:
              - product-quantization-mechanism
            linger: 0.5
          - id: pq-storage
            phrase: "eight block identifiers use eight bytes, a sixty-four-fold raw-code reduction"
            targets:
              - product-quantization-mechanism
            linger: 0.5
          - id: pq-shared
            phrase: equals K times d
            targets:
              - product-quantization-mechanism
            linger: 0.5
      - say: Asymmetric distance computation keeps the query unquantized. For every block and centroid, build a
          table containing the squared Euclidean distance from that query block to the centroid. A stored
          code selects one table entry per block; sum them. With ninety-six blocks and two hundred
          fifty-six centroids, float32 tables use ninety-six kibibytes per query. Whether those tables
          fit a relevant cache and whether table construction is worthwhile depend on the hardware and
          workload.
