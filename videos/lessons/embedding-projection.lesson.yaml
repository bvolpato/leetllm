    beats:
      - say: Dimension reduction changes the coordinate count. Quantization changes the bits used for those
          coordinates. Our symmetric scalar teaching codec uses integers from minus one hundred
          twenty-seven through one hundred twenty-seven. Fit a scale of one hundred twenty-seven divided
          by the document calibration maximum absolute value. Multiply, round and clip, then divide by
