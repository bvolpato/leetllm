              - event-bound
            color: cyan
            linger: 0.18
      - say: Put the record back before the wait. Copy, transform, square and sum have to run in that order. An
          independent request on another stream could use the GPU while the transform runs. Whether they
          actually overlap depends on resources. Check both lanes in a device trace.
        hold: 0.9
        visual_cues:
          - id: event-good-chain
            phrase: Copy, transform, square and sum have to run in that order
            targets:
              - event-lanes
            color: cyan
            linger: 0.18
          - id: event-independent
            phrase: An independent request on another stream could use the GPU while the transform runs
            targets:
              - event-lanes
            color: cyan
            linger: 0.18
  - id: event-generations
    title: A wait keeps the recorded event state it observed
