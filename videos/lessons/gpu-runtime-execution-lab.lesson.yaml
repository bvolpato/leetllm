  - id: default-streams
    title: Reconstruct the hidden legacy dependencies
    visual: One shared tick ruler carries blocking A, legacy L, blocking B and nonblocking N. Add actual
      earlier→legacy→later edges while N retains its independent lane. A separate per-thread label moves into
      the blocking relation.
    beats:
      - say: Under legacy default-stream semantics, an operation waits for earlier blocking-stream work in the same
          CUDA context. Later blocking-stream work then waits for that legacy operation. Those implicit edges
          can serialize work that appears to use separate streams. Separate processes do not acquire a shared
          context merely because they use one GPU.
        hold: 0.7
        visual_cues:
          - id: gr-default-streams-b0-operation
            phrase: Under legacy default-stream semantics, an operation waits for earlier blocking-stream work in the same
              CUDA context. Later blocking-stream work then waits for that legacy operation. Those implicit
              edges can serialize work that appears to use separate streams. Separate processes do not acquire
              a shared context merely because they use one GPU.
            targets:
              - gr-default-streams-mechanism
            color: cyan
            linger: 0.15
          - id: gr-default-streams-b0-s0
            phrase: Under legacy default-stream semantics, an operation waits for earlier blocking-stream work in the same
              CUDA context.
            targets:
              - gr-default-streams-mechanism
            color: yellow
            linger: 0.3
          - id: gr-default-streams-b0-s1
            phrase: Later blocking-stream work then waits for that legacy operation.
            targets:
              - gr-default-streams-mechanism
            color: yellow
            linger: 0.3
          - id: gr-default-streams-b0-s2
            phrase: Those implicit edges can serialize work that appears to use separate streams.
            targets:
              - gr-default-streams-mechanism
            color: yellow
            linger: 0.3
          - id: gr-default-streams-b0-s3
            phrase: Separate processes do not acquire a shared context merely because they use one GPU.
            targets:
              - gr-default-streams-mechanism
            color: yellow
            linger: 0.3
      - say: "A stream created with the nonblocking flag opts out of those legacy edges. A per-thread default stream
          is a different choice: it is local to the thread and context, but it is not a nonblocking stream. If
          the program also uses the legacy stream, the per-thread stream participates in legacy
          synchronization."
        hold: 0.7
