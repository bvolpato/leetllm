            linger: 0.3
      - say: An asynchronous copy can still keep the CPU busy. For example, the runtime may stage data from
          pageable host memory before a transfer. Look at the CPU call in the trace to see how long
          submission took. Then follow the GPU stream to the event that marks the result you need.
        hold: 0.7
        visual_cues:
          - id: gr-completion-scope-b2-operation
            phrase: An asynchronous copy can still keep the CPU busy. For example, the runtime may stage data
              from pageable host memory before a transfer. Look at the CPU call in the trace to see how
