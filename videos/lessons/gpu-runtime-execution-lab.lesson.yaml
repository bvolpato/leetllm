              synchronization."
            targets:
              - gr-default-streams-mechanism
            color: cyan
            linger: 0.15
          - id: gr-default-streams-b1-s0
            phrase: A stream created with the nonblocking flag opts out of those legacy edges.
            targets:
              - gr-default-streams-mechanism
            color: yellow
            linger: 0.3
          - id: gr-default-streams-b1-s1
            phrase: "A per-thread default stream is a different choice: it is local to the thread and context, but it is
