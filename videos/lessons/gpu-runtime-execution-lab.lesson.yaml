            color: yellow
            linger: 0.3
          - id: gr-default-streams-b1-s2
            phrase: If the program also uses the legacy stream, the per-thread stream participates in legacy
              synchronization.
            targets:
              - gr-default-streams-mechanism
            color: yellow
            linger: 0.3
      - say: For a logical example, blocking work A runs from zero to three. A legacy operation requested at one lasts
          two ticks, so it runs from three to five. Later blocking work B, requested at two for one tick, runs
          from five to six. An independent nonblocking operation requested at one may run from one to three if
