  - id: events
    title: Which copy does this wait observe?
    visual: Keep host call order separate from device ticks. Put a copy completion marker into an event, then
      bind a wait to that state. In a second run, swap the calls and leave the earlier wait pointing to empty
      work. Show an independent task beside the correctly ordered chain.
    beats:
      - say: The copy and its reader are on different streams. The CPU first asks the copy stream to record an event
          after the copy. Then it tells the compute stream to wait on that event. The wait picks up the copy
          that will finish at tick three. While the GPU enforces that edge, the host can keep submitting work.
        hold: 0.9
        visual_cues:
          - id: event-record
            phrase: record an event after the copy
            targets:
              - event-record
            color: cyan
            linger: 0.18
          - id: event-wait
            phrase: tells the compute stream to wait on that event
            targets:
              - event-wait
            color: cyan
            linger: 0.18
          - id: event-bound
            phrase: will finish at tick three
            targets:
              - event-bound
            color: green
            linger: 0.18
      - say: Start again with a fresh event handle. This time submit the wait first. Only afterward do we ask the
          copy stream to record the event. When the early wait was submitted, which producer work did it pick
          up?
        hold: 1.9
        visual_cues:
          - id: event-empty-wait
            phrase: submit the wait first
            targets:
              - event-wait
            color: cyan
            linger: 0.18
          - id: event-late-record
            phrase: ask the copy stream to record the event
            targets:
              - event-record
            color: cyan
            linger: 0.18
          - id: event-question
            phrase: which producer work did it pick up
            targets:
              - event-wait
              - event-bound
            color: yellow
            linger: 0.18
      - say: None. The first wait saw an empty event. The later record can order a new wait, but the one we already
          submitted keeps its empty dependency. Our reader can now get ahead of the copy. Keep the allocation
          alive until its readers finish as well.
        hold: 0.9
        visual_cues:
          - id: event-empty
            phrase: None
            targets:
