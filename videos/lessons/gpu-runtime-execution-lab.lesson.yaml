scenes:
  - id: intro
    title: When is the sum ready?
    visual: Open on the CPU submitting its fourth call. Fill that call to tick four while the GPU works on the transform below. Hold the two rows on the same ruler, then follow the GPU to the sum and the CPU read.
    beats:
      - say: The last CPU call submits the sum and returns at tick four. Look below it. The GPU is still doubling each input and adding one. At which tick will the sum be ready to copy back?
        hold: 2.1
        caption_starts:
          - Look below it
          - At which tick
        visual_cues:
          - id: intro-return
            phrase: The last CPU call submits the sum and returns at tick four
            targets: [intro-trace]
            color: blue
          - id: intro-running
            phrase: is still doubling each input and adding one
            targets: [intro-trace]
            color: cyan
          - id: intro-question
            phrase: At which tick will the sum be ready to copy back
            targets: [intro-trace, intro-output]
            color: yellow
      - say: Let the transform finish. Now the GPU squares those values and adds the squares. At tick ten, the sum is ready in the output buffer, O. In PyTorch, calling item on O waits for that write and copies the value back. The CPU gets one hundred sixty-four.
        hold: 1.15
        caption_starts:
          - Now the GPU squares those values
          - At tick ten, the sum is ready
          - In PyTorch
          - The CPU gets one hundred sixty-four
        visual_cues:
          - id: intro-transform
            phrase: Let the transform finish
            targets: [intro-trace]
            color: cyan
          - id: intro-square
            phrase: Now the GPU squares those values
            targets: [intro-trace]
            color: cyan
          - id: intro-write
            phrase: and adds the squares. At tick ten
            targets: [intro-trace, intro-output]
            color: green
          - id: intro-transfer
            phrase: and copies the value back
            targets: [intro-output]
            color: green
          - id: intro-read
            phrase: The CPU gets one hundred sixty-four
            targets: [intro-output]
            color: green
  - id: pipeline-values
    title: Following the transform
    visual: Keep each input above its contribution. Follow the second input down its column, fill the other
      columns, and accumulate the squares. Use the copy completion and issue time to choose the earliest
      affine start.
    beats:
      - say: Pick the second input, two. Double it and add one to get five. Squaring five gives twenty-five. That is
          how much this one input contributes to the answer. Apply the same two steps to its three neighbors.
          Add the four squares and you get one hundred sixty-four.
        hold: 0.85
        visual_cues:
          - id: value-two
            phrase: the second input, two
            targets:
              - value-columns
            color: cyan
            linger: 0.18
          - id: value-five
            phrase: Double it and add one to get five
            targets:
              - value-columns
            color: cyan
            linger: 0.18
          - id: value-square
            phrase: Squaring five gives twenty-five
            targets:
              - value-columns
            color: cyan
            linger: 0.18
          - id: value-rest
            phrase: Apply the same two steps to its three neighbors
            targets:
              - value-columns
            color: cyan
            linger: 0.18
          - id: value-total
            phrase: Add the four squares and you get one hundred sixty-four
            targets:
              - value-columns
              - value-total
            color: green
            linger: 0.18
      - say: Now put yourself in the transform’s place. You were issued at tick one. Your own stream was free at
          zero, and the copy you need finishes at three. Which of those times lets you start?
        hold: 1.8
        visual_cues:
          - id: value-gates
            phrase: Your own stream was free at zero, and the copy you need finishes at three
            targets:
              - start-gates
            color: cyan
            linger: 0.18
          - id: value-gate-question
            phrase: Which of those times lets you start
            targets:
              - start-gates
            color: yellow
            linger: 0.18
      - say: Take the latest of the three. That gives a start at three. Four ticks of work later, the transform
          finishes at seven. Apply that same rule to each operation, including every producer it has to wait
          for. These logical ticks leave out launch overhead and competition for hardware.
        hold: 0.85
        caption_starts:
          - That gives a start at three
          - Four ticks of work later
          - Apply that same rule
        visual_cues:
          - id: value-start
            phrase: That gives a start at three
            targets:
              - start-gates
            color: cyan
            linger: 0.18
          - id: value-end
            phrase: the transform finishes at seven
            targets:
              - start-result
            color: green
            linger: 0.18
  - id: schedule
    title: What moves when the copy wait is removed?
    visual: Keep the opening ruler. Compare the earliest ordered and unordered schedules at the same scale.
      Remove the edge at copy completion and expose the two ticks where the affine reader and copy writer can
      touch the same storage.
    beats:
      - say: Here is the same schedule. The copy fills a working buffer on one stream. The transform, square and sum run in order on
          another. The transform was submitted at tick one, but the copy’s ready event holds it until three.
          The four ticks the CPU spends submitting are already inside the ten ticks to completion.
        hold: 0.85
        visual_cues:
          - id: schedule-edge
            phrase: the copy’s ready event holds it until three
            targets:
              - request-trace
            color: cyan
            linger: 0.18
          - id: schedule-overlap
            phrase: already inside the ten ticks to completion
            targets:
              - request-trace
            color: yellow
            linger: 0.18
      - say: Keep both streams and the same four calls. Suppose we remove just the wait for the copy. How early
          could the transform start now?
        hold: 1.9
        visual_cues:
          - id: schedule-ask
            phrase: How early could the transform start now
            targets:
              - request-trace
            color: yellow
            linger: 0.18
      - say: It could start at tick one. From one to three the copy can write the very buffer the transform is
          reading. The shorter schedule gives us no trustworthy sum for this input. Restore the producer’s
          event and the consumer’s wait. Then check for launch errors and check again when the work completes.
        hold: 0.85
        caption_starts:
          - tick one
          - From one to three
          - Restore the producer’s event
        visual_cues:
          - id: schedule-remove
            phrase: It could start at tick one
            targets:
              - request-trace
            color: cyan
            linger: 0.18
          - id: schedule-hazard
            phrase: From one to three
            targets:
              - request-trace
              - request-output
            color: pink
            linger: 0.18
          - id: schedule-restore
            phrase: Restore the producer’s event and the consumer’s wait
            targets:
              - request-trace
            color: green
            linger: 0.18
  - id: completion-scope
    title: Choose the completion boundary you actually need
    visual: The same copy/transform chain crosses launch-return, event, stream and device boundaries. Each
      observation encloses only its actual work; an asynchronous error remains pending until the relevant
      check.
    beats:
      - say: The CPU finishes its four calls while both GPU streams are busy. Stream A holds our sum. Stream
          B is running a different job. Record an event after the sum and wait for that event, or
          synchronize stream A to wait for all its prior work. Synchronize the whole device and the CPU
          also waits for earlier work on B in the same context.
        hold: 0.7
        visual_cues:
          - id: gr-completion-scope-b0-operation
            phrase: The CPU finishes its four calls while both GPU streams are busy. Stream A holds our sum.
              Stream B is running a different job. Record an event after the sum and wait for that event,
              or synchronize stream A to wait for all its prior work. Synchronize the whole device and
              the CPU also waits for earlier work on B in the same context.
            targets:
              - gr-completion-scope-mechanism
            color: cyan
            linger: 0.15
          - id: gr-completion-scope-b0-s0
            phrase: The CPU finishes its four calls while both GPU streams are busy.
            targets:
              - gr-completion-scope-mechanism
            color: yellow
            linger: 0.3
          - id: gr-completion-scope-b0-s1
            phrase: Stream A holds our sum. Stream B is running a different job.
            targets:
              - gr-completion-scope-mechanism
            color: yellow
            linger: 0.3
          - id: gr-completion-scope-b0-s2
            phrase: Record an event after the sum and wait for that event, or synchronize stream A to wait for
              all its prior work.
            targets:
              - gr-completion-scope-mechanism
            color: yellow
            linger: 0.3
          - id: gr-completion-scope-b0-s3
            phrase: Synchronize the whole device and the CPU also waits for earlier work on B in the same
              context.
            targets:
              - gr-completion-scope-mechanism
            color: yellow
            linger: 0.3
      - say: An event query can report not ready while the host continues useful work. A stream synchronization waits;
          an event wait submitted to another stream constrains later device work without requiring the host to
          wait for that completion. Check errors at the API boundary and again when the required asynchronous
          work completes.
        hold: 0.7
        visual_cues:
          - id: gr-completion-scope-b1-operation
            phrase: An event query can report not ready while the host continues useful work. A stream synchronization
              waits; an event wait submitted to another stream constrains later device work without requiring
              the host to wait for that completion. Check errors at the API boundary and again when the
              required asynchronous work completes.
            targets:
              - gr-completion-scope-mechanism
            color: cyan
            linger: 0.15
          - id: gr-completion-scope-b1-s0
            phrase: An event query can report not ready while the host continues useful work.
            targets:
              - gr-completion-scope-mechanism
            color: yellow
            linger: 0.3
          - id: gr-completion-scope-b1-s1
            phrase: A stream synchronization waits; an event wait submitted to another stream constrains later device work
