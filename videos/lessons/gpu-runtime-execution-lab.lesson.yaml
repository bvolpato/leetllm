  - id: overlap-slots
    title: Use different live buffers for independent work
    visual: Two input/output slots alternate copy and compute; retained arrows forbid overwriting a still-read
      slot. Pinning and copy-engine capability remain conditions beside the actual intervals, not invented
      measured overlap.
    beats:
      - say: Overlap needs independent work and enough hardware resources. To overlap a host-to-device copy for the
          next batch with compute for the current batch, use separate live buffer slots, suitable asynchronous
          APIs and page-locked host memory. Check the device’s copy-engine capability. Distinct streams permit
          concurrency; they do not promise it.
        hold: 0.7
        visual_cues:
          - id: gr-overlap-slots-b0-operation
            phrase: Overlap needs independent work and enough hardware resources. To overlap a host-to-device copy for the
              next batch with compute for the current batch, use separate live buffer slots, suitable
              asynchronous APIs and page-locked host memory. Check the device’s copy-engine capability.
              Distinct streams permit concurrency; they do not promise it.
            targets:
