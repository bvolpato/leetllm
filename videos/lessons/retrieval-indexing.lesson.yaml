      - say: "A different encoder can put the same sentence somewhere else. If the query encoder changes, verify that it still works with the stored passage vectors or rebuild them. A new tokenizer, chunk boundary or normalization can change them too. Keep exact identifiers and source versions. Judge whether the extra search finds useful, current, eligible passages on real questions."
        hold: 0.8
        visual_cues:
          - id: embedding-version
            phrase: "If the query encoder changes"
            targets: [dense-encoding-construction]
  - id: similarity-contract
    title: Separate direction from magnitude
    visual: Equal-unit vectors expose a raw-dot reversal and an explicit zero-norm guard.
    beats:
      - say: A dot product sums coordinatewise products. Cosine divides that dot product by the product of the two
          Euclidean lengths, where each length is the square root of the sum of squared coordinates. With
          nonzero unit vectors, dot product equals cosine. Normalizing documents makes their norms equal; for
          one fixed query, its remaining positive length factor cannot change the rank. A zero vector has no
          cosine direction, so define a rejection or fallback rather than silently dividing by zero.
        hold: 0.75
        visual_cues:
          - id: cosine-denominator
            phrase: Cosine divides that dot product by the product of the two Euclidean lengths
            targets:
              - similarity-contract-construction
            color: cyan
            linger: 0.5
          - id: unit-dot
            phrase: With nonzero unit vectors, dot product equals cosine
            targets:
              - similarity-contract-construction
            color: cyan
            linger: 0.5
          - id: zero-vector
            phrase: A zero vector has no cosine direction
            targets:
              - similarity-contract-construction
            color: cyan
            linger: 0.5
      - say: Hold query one, point eight, zero fixed. Candidate A points exactly with it, so its dot product is one
          point six four and cosine one. Candidate B is six, zero, zero. Its dot product six wins, but its
          cosine is about point seven eight one and loses. Multiplying a document by a positive scale changes
          the raw dot but preserves its direction. If the embedding contract is directional similarity, that
