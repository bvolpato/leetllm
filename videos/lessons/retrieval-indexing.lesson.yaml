            phrase: Keep a keyword field when complete identifier identity matters
            targets:
              - analyzer-contract-construction
            color: cyan
            linger: 0.5
  - id: bm25-controls
    title: "How much weight do three mentions of “key” get?"
    visual: "The credential guide's term counts feed the reference BM25 formula. API and key build one score bar. A separate fixed-length example changes only frequency, then compares the resulting weights against the saturation limit."
    beats:
      - say: "The rotation guide says API once and key three times. Start with one term. Its count, f, appears on both sides of the fraction bar. That's where repeated mentions start to yield less. The length factor compares the guide with an average passage. The IDF multiplier looks across the whole collection and gives a rare term more weight. Add a contribution for each matching query term. A word missing from the passage contributes zero."
        hold: 0.7
        visual_cues:
          - id: bm25-tf-formula
            phrase: "Its count, f, appears on both sides of the fraction bar"
            targets: [bm25-controls-construction]
          - id: bm25-length-formula
            phrase: "The length factor compares the guide with an average passage"
            targets: [bm25-controls-construction]
          - id: bm25-idf-formula
            phrase: "The IDF multiplier looks across the whole collection"
            targets: [bm25-controls-construction]
      - say: "This guide has eleven analyzed words. The average is eight. API contributes about point six to the guide's score. Now add the three mentions of key. Together they add just over one point. The total puts the guide ahead of the quota page. To isolate repetition, use an average-length passage and hold IDF at one. Look across the pairs. One mention earns one point. Twenty mentions still earn less than two point one. With k one set to one point two, the weight approaches two point two."
        hold: 0.8
        visual_cues:
          - id: credential-api
            phrase: "API contributes about point six"
            targets: [bm25-controls-construction]
          - id: credential-key
            phrase: "Together they add just over one point"
            targets: [bm25-controls-construction]
          - id: credential-total
            phrase: "The total puts the guide ahead of the quota page"
            targets: [bm25-controls-construction]
          - id: frequency-weights
            phrase: "Look across the pairs"
            targets: [bm25-controls-construction]
          - id: frequency-limit
            phrase: "the weight approaches two point two"
            targets: [bm25-controls-construction]
      - say: "Lower k one and the curve flattens sooner. Bring k one all the way to zero. Now every present term gets weight one. The other knob, b, controls length. At zero it ignores length, and at one it uses the full length ratio. Our shifted IDF stays positive. The original unshifted form can be negative for very common words. If you check these numbers against Lucene ten point five point one, its defaults are the same, but its scorer drops the common numerator factor and encodes length norms. Compare scores using the same convention."
        hold: 0.8
        visual_cues:
          - id: k1-zero
            phrase: "Bring k one all the way to zero"
            targets: [bm25-controls-construction]
          - id: length-knobs
            phrase: "At zero it ignores length, and at one it uses the full length ratio"
            targets: [bm25-controls-construction]
          - id: lucene-scale
            phrase: "its scorer drops the common numerator factor and encodes length norms"
            targets: [bm25-controls-construction]
  - id: dense-encoding
    title: "Which guide points toward the query?"
    visual: "The query and passages are represented separately. Two passage arrows meet the query arrow at a common origin. Arcs measure each turn from the query, and the score table evaluates all three coordinates for all four passages."
    beats:
      - say: "The credential guide never used the words API or key. Let's try a search that can compare it anyway. Encode each passage once and store its vector. When the question arrives, encode just the question. A bi-encoder learns representations that can be compared this way. The two encoders can have different weights, as they do in Dense Passage Retrieval. For this example we chose the coordinates by hand."
        hold: 0.7
        visual_cues:
          - id: two-encoders
            phrase: "Encode each passage once and store its vector"
            targets: [dense-encoding-construction]
          - id: encoder-parameters
            phrase: "The two encoders can have different weights"
            targets: [dense-encoding-construction]
      - say: "The yellow arrow is the question. Put the rotation guide and the credential guide at the same origin. All three have zero in the third coordinate, so you can see their directions on this plane. Look at the two angles from yellow. If the score rewards pointing the same way, which of these guides should come first?"
        hold: 2.6
        visual_cues:
          - id: query-coordinates
            phrase: "The yellow arrow is the question"
            targets: [dense-encoding-construction]
          - id: source-coordinates
            phrase: "Put the rotation guide and the credential guide at the same origin"
            targets: [dense-encoding-construction]
          - id: dense-angles
            phrase: "Look at the two angles from yellow"
            targets: [dense-encoding-construction]
      - say: "The credential guide. It needs the smaller turn. Divide its dot product with the question by both vector lengths. That cosine score is about point nine nine four. The rotation guide scores about point nine five seven. The table uses all three coordinates for every passage, including the two off the plane."
        hold: 0.8
        visual_cues:
