            phrase: Take those two first and the version filter throws both away
            targets:
              - filter-scope-construction
            color: cyan
            linger: 0.5
          - id: filter-first
            phrase: Now filter all four pages before taking the top two
            targets:
              - filter-scope-construction
            color: cyan
            linger: 0.5
      - say: What if the search engine filters after retrieval? Read the first three rows and one page qualifies.
          Read all four and both qualify. A query with more old pages at the top would need a deeper scan.
          A filter-aware index can use the version as it searches. Test its cost and recall on the filters
          your readers use. Check permission before releasing a passage. Judge whether its instructions answer the question.
        hold: 0.75
        caption_starts: ["Read the first three rows", "Read all four and both qualify", "Check permission"]
        visual_cues:
          - id: filter-overfetch
            phrase: Read the first three rows
            targets:
              - filter-scope-construction
            color: cyan
            linger: 0.5
          - id: filter-four
            phrase: Read all four
            targets: [filter-scope-construction]
          - id: filter-authority
            phrase: Check permission before releasing a passage
            targets:
              - filter-scope-construction
            color: cyan
            linger: 0.5
      - say: To compare approximate and exact search, give both the same version-two pages. Use the same query,
          vectors, metric, normalization and tie rule. Compare the returned IDs. If fewer than K eligible
          items exist, decide how you'll score that case before averaging recall across queries.
        hold: 0.75
        visual_cues:
          - id: matched-universe
            phrase: give both the same version-two pages
            targets:
              - filter-scope-construction
            color: cyan
            linger: 0.5
          - id: few-eligible
            phrase: If fewer than K eligible items exist
            targets:
              - filter-scope-construction
            color: cyan
            linger: 0.5
  - id: ann-comparison
    title: "Which reference are you comparing with?"
    visual: "The same returned guide is compared with an exact neighbor and with the two judged guides. A second example holds four query IDs fixed and switches only the approximate result list."
    beats:
      - say: "Back to the rotation question. An exact scan of our example vectors puts the credential guide first. Suppose an approximate search returns the other useful guide, the rotation guide. At a cutoff of one, compare that returned ID with the exact ID. Now compare it with the two passages a human marked useful. What fraction did each comparison recover?"
        hold: 2.8
        visual_cues:
          - id: ann-pair
            phrase: "Suppose an approximate search returns the other useful guide"
            targets: [ann-reference]
          - id: ann-ask
            phrase: "What fraction did each comparison recover"
            targets: [ann-foot]
      - say: "Zero of one exact neighbors, but one of two useful passages. ANN recall counts shared IDs in the approximate and exact top K, divided by K when at least K passages are eligible. Task recall counts useful IDs out of the judged relevant set. A different ID can still answer the question. Use the same eligible corpus, metric and tie rule for the exact comparison. Equal-distance vectors can otherwise trade places."
        hold: 0.85
        visual_cues:
          - id: ann-result
            phrase: "Zero of one exact neighbors, but one of two useful passages"
            targets: [ann-reference]
            caption_boundary: true
      - say: "Now look at the article's four queries. Keep each exact neighbor fixed. The first supplied result list agrees on the middle two rows. Two matches out of four give a mean recall at one of one half. Try the second supplied list. All four IDs agree. This computes neighbor agreement from example results. To learn which setting is faster, run the actual searches and time them."
        hold: 1
        visual_cues:
          - id: ann-fast
            phrase: "agrees on the middle two rows"
            targets: [ann-array]
          - id: ann-fast-rate
            phrase: "mean recall at one of one half"
            targets: [ann-foot]
          - id: ann-tuned
            phrase: "Try the second supplied list"
            targets: [ann-array]
          - id: ann-all
            phrase: "All four IDs agree"
            targets: [ann-foot]
      - say: "Use development questions to choose the candidate depth, fusion weights and search budget. Freeze your choices and run them on held-out questions. Keep query IDs, filters, judgments, ranked results and request timings together. If the needed evidence made it all the way through, check how the answer used it."
        hold: 0.8
        visual_cues:
          - id: ann-freeze
            phrase: "Freeze your choices"
            targets: [ann-foot]
  - id: retrieval-review
    title: "Where did the credential guide disappear?"
    visual: "A query trace records dense and sparse results, fused candidates and reranked outputs. An audit follows d2 along the rows. A second trace changes only the candidate cutoff so the observer can locate the first changed membership."
    beats:
      - say: "A reader says the credential guide never made it into the answer. Here is the trace for that question. Look for passage two. Dense search found it. Word search didn't. Follow the guide forward from the lane that succeeded. At which stage would you try a change first?"
        hold: 3
        visual_cues:
          - id: review-lanes
            phrase: "Dense search found it"
            targets: [review-trace]
          - id: review-ask
            phrase: "At which stage would you try a change first"
            targets: [review-question]
      - say: "Try the fused cutoff. Both lanes together had the guide. The first two fused positions went to passages one and four. Keep the same rankings and scores and allow one more candidate. The guide now reaches the reranker and comes back first. If the guide had already reached the model, the next check would be whether truncation removed its instructions or the answer ignored them."
        hold: 1
        visual_cues:
          - id: review-cut
            phrase: "Try the fused cutoff"
            targets: [review-trace]
            caption_boundary: true
          - id: review-three
            phrase: "allow one more candidate"
            targets: [review-replay]
          - id: review-back
            phrase: "comes back first"
            targets: [review-replay]
            caption_boundary: true
      - say: "Save the ranked IDs alongside the query and its judgments. Record the source version, encoder, tokenizer, metric, normalization, index settings, filters and tie rule so you can replay the search. Run both cutoffs on the same eligible passages and time each request."
        hold: 0.9
        visual_cues:
          - id: review-save
            phrase: "Save the ranked IDs alongside the query"
            targets: [review-question]
  - id: fresh-probe
    title: "Spend a second probe?"
    visual: "The camera returns to the same full axis and boundary detail. The query crosses the fixed key-rotation mark. A pair of query receipts compares exact results with one and two probes and accounts for each distance check."
    beats:
      - say: "Back to our three passages. Earlier, one probe missed key rotation. Move only the query, from four point nine to five point two. You still get one probe. Which passage will it return, and how many distances will it check, including the centers?"
        hold: 4
        visual_cues:
          - id: fresh-move
            phrase: "from four point nine to five point two"
            targets: [probe-inset]
          - id: fresh-ask
            phrase: "Which passage will it return"
            targets: [probe-map, probe-inset, probe-caption]
      - say: "It returns key rotation in four checks. The distances to the centers are five point two and four point eight, so the right list opens. Two passages live there. Key rotation is a tenth away. Quota is three point eight away. That's two center checks and two passage checks. A flat scan would find the same passage in three."
        hold: 1
        visual_cues:
          - id: fresh-answer
            phrase: "It returns key rotation in four checks"
            targets: [probe-caption]
            caption_boundary: true
          - id: fresh-centers
            phrase: "so the right list opens"
            targets: [probe-map]
          - id: fresh-distances
            phrase: "Quota is three point eight away"
            targets: [probe-inset]
          - id: fresh-count
            phrase: "two center checks and two passage checks"
            targets: [probe-cost]
          - id: fresh-flat
            phrase: "A flat scan would find the same passage in three"
            targets: [probe-cost]
      - say: "Compare the two queries. For which one would opening a second list change the returned page?"
        hold: 3
        visual_cues:
          - id: fresh-compare
            phrase: "For which one would opening a second list change the returned page"
            targets: [receipt-run-0, receipt-run-1, receipt-question]
      - say: "Only the query at four point nine. There, the second probe buys back the missing guide. At five point two it adds one check and returns the same guide. When a search misses evidence, compare the returned IDs with an exact scan of the same eligible passages. Then use relevance judgments and measured latency on held-out questions to decide which setting to keep. The next lesson starts with those passages in hand and follows the model's choice of the next token."
        hold: 1.3
        caption_starts: ["At five point two it adds one check", "When a search misses evidence"]
        visual_cues:
          - id: fresh-spend
            phrase: "Only the query at four point nine"
            targets: [receipt-two-0]
            caption_boundary: true
          - id: fresh-extra
            phrase: "it adds one check and returns the same guide"
            targets: [receipt-two-1]
          - id: fresh-decision
            phrase: "compare the returned IDs with an exact scan"
            targets: [receipt-question]
