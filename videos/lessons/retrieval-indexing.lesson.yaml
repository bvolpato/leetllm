scenes:
  - id: opening
    title: "How do I make soup?"
    visual: "A mark runs under the word soup on a recipe card and a lunch menu. The two counts stay beside the pages. A third slip offers a cooking instruction that neither query word can find."
    beats:
      - say: "You want to make soup. Count the word soup on the recipe and the lunch menu. If search sends the page with the most matches, which one do you get?"
        hold: 3
        caption_starts: ["Count the word soup", "If search sends"]
        visual_cues:
          - id: open-count
            phrase: "Count the word soup on the recipe and the lunch menu"
            targets: [open-counts]
          - id: open-ask
            phrase: "which one do you get"
            targets: [open-question, open-counts, open-recipe, open-menu]
      - say: "The lunch menu wins. It says soup twice. The recipe says it once. Now read this cooking instruction. Cook beans and vegetables together until soft. Which words from “make soup” appear here?"
        hold: 2.5
        caption_starts: ["Now read this cooking instruction", "Which words from"]
        visual_cues:
          - id: open-menu
            phrase: "The lunch menu wins"
            targets: [open-menu]
            caption_boundary: true
          - id: open-read
            phrase: "Now read this cooking instruction"
            targets: [open-instruction]
          - id: open-match
            phrase: "Which words from “make soup” appear here"
            targets: [open-question, open-instruction]
      - say: "Neither word appears. Both the recipe and this instruction give the cook a step to follow. Let's see which pages the index can reach from the words make and soup."
        hold: 1
        visual_cues:
          - id: open-neither
            phrase: "Neither word appears"
            targets: [open-instruction]
            caption_boundary: true
          - id: open-judged
            phrase: "give the cook a step to follow"
            targets: [open-recipe, open-instruction]
  - id: postings
    title: Terms point to documents
    visual: Words from the recipe and menu are counted in a small grid, then the terms connect to sorted lists of
      document IDs.
    beats:
      - say: Begin with four document IDs and a simple analyzer that lowercases words, removes a small stopword list,
          and keeps alphabetic runs. In the recipe, soup and make each appear once. A posting list records
          which documents contain each term.
        hold: 0.55
        visual_cues:
          - id: postings-documents
            phrase: Begin with four document IDs
            targets:
              - postings-document-terms
            color: cyan
            linger: 0.6
          - id: postings-recipe-counts
            phrase: soup and make each appear once
            targets:
              - postings-document-terms
            color: cyan
            linger: 0.6
      - say: The index maps each term to an ordered list of document IDs. Here, make points to d1 and soup points to
          d1 and d4. The useful paraphrase d2 contains neither query word, so both lists leave it out.
        hold: 0.55
        visual_cues:
          - id: postings-ids
            phrase: make points to d1 and soup points to d1 and d4
            targets:
              - postings-simulation-7
            color: cyan
            linger: 0.6
      - say: The menu says soup twice, yet d4 appears once in soup's posting list. Counts and token positions can be
          stored alongside that ID when scoring or phrase search needs them. The term-to-documents direction
          is what makes the index inverted.
        hold: 0.7
        visual_cues:
          - id: postings-beat-3-focus-1
            phrase: The menu says soup twice
            targets:
              - postings-d4-occurrences
              - postings-simulation-7
            color: blue
            linger: 0.6
          - id: postings-position-metadata
            phrase: Counts and token positions can be stored alongside that ID
            targets:
              - postings-d4-occurrences
            color: yellow
            linger: 0.5
  - id: query
    title: Query terms traverse only their lists
    visual: The query terms make and soup address their own posting lists. The lists merge into candidate
      documents d1 and d4, while the paraphrased d2 remains outside the sparse route.
    beats:
      - say: "The analyzer turns the question into make and soup. Start with make: its posting list points to d1. The
          useful passage says “cook beans and vegetables,” so its words never enter that list."
        hold: 0.55
        visual_cues:
          - id: query-make
            phrase: "Start with make: its posting list points to d1"
            targets:
              - query-object-make-15
            color: cyan
            linger: 0.6
      - say: An OR query merges the lists and visits d1 and d4. An AND query intersects them and keeps d1, where both
          words appear. The useful cooking paraphrase d2 stays outside both routes.
        hold: 0.6
        visual_cues:
          - id: query-beat-2-focus-1
            phrase: The useful cooking paraphrase d2 stays outside both routes
            targets:
              - query-object-d2-useful-cooking-paraphrase-absent-from-both-rout-21
            color: blue
            linger: 0.6
      - say: The work follows the lists touched by the query, roughly the sum of their lengths before skipping and
          top-result selection. A common word may still point to most documents, so the index changes the work
          pattern without making every query equally cheap.
        hold: 0.7
        visual_cues:
          - id: query-beat-3-focus-1
            phrase: The work follows the lists touched by the query
            targets:
              - query-object-beat-0-candidate-snapshot-combined-join-or-union-u-16
            color: blue
            linger: 0.6
  - id: bm25
    title: BM25 turns matches into a score
    visual: A computed BM25 term contribution shows document frequency, word count, document length, and the
      recipe's score building term by term.
    beats:
      - say: Candidate generation answers which passages can be scored. BM25 then weights matching terms using
          document frequency, term frequency, and document length. A rare query term can carry more evidence
          than a word appearing in most passages.
        hold: 0.55
        visual_cues:
          - id: bm25-beat-1-focus-1
            phrase: BM25 then weights matching terms using document frequency
            targets:
              - bm25-simulation-24
            color: blue
            linger: 0.6
          - id: bm25-beat-1-focus-2
            phrase: BM25 then weights matching terms using document frequency
            targets:
              - bm25-equation-string-raw-mathrm-term-mathrm-idf-frac-f-1-2-1-f-1-27
            color: yellow
            linger: 0.6
      - say: In our four-document corpus, soup appears in two passages, so its Lucene-style IDF is about 0.693. The
          recipe has eleven analyzed terms, compared with an average of about 8.25. Its length factor is 1.25
          when b is 0.75.
        hold: 0.6
        visual_cues:
          - id: bm25-beat-2-focus-1
            phrase: In our four-document corpus
            targets:
              - bm25-simulation-24
            color: blue
            linger: 0.6
          - id: bm25-numeric-idf
            phrase: so its Lucene-style IDF is about 0.693
            targets:
              - bm25-numeric-idf
            color: cyan
            linger: 0.5
          - id: bm25-length-factor
            phrase: Its length factor is 1.25 when b is 0.75
            targets:
              - bm25-length-factor
            color: yellow
            linger: 0.5
      - say: Make contributes about 1.060 to d1 because it appears in one passage. Soup adds about 0.610. BM25's
          term-frequency effect saturates, so repeated soup in the menu adds evidence without multiplying the
          score in direct proportion to its count.
        hold: 0.65
        visual_cues:
          - id: bm25-beat-3-focus-1
            phrase: Make contributes about 1
            targets:
              - bm25-term-contributions
            color: blue
            linger: 0.6
          - id: bm25-saturation
            phrase: BM25's term-frequency effect saturates, so repeated soup in the menu adds evidence without multiplying
              the score in direct proportion to its count
            targets:
              - bm25-tf-saturation
            color: yellow
            linger: 0.5
  - id: ranking
    title: Ranking exposes the vocabulary mismatch
    visual: Live scores sort all four documents. The recipe leads, the soup menu follows, and the labeled useful
      cooking paraphrase d2 remains at zero.
    beats:
      - say: Scoring every passage gives d1 about 1.669 and the soup menu d4 about 0.899. Documents d2 and d3 receive
          zero because they share no analyzed query terms. The lexical ranking has done exactly what its
          representation permits.
        hold: 0.55
        visual_cues:
          - id: ranking-beat-1-focus-1
            phrase: The lexical ranking has done exactly what its representation permits
            targets:
              - ranking-object-distribution-ranking-31
            color: blue
            linger: 0.6
          - id: ranking-beat-1-focus-2
            phrase: Documents d2 and d3 receive zero because they
            targets:
              - ranking-object-distribution-ranking-31
            color: blue
            linger: 0.6
      - say: That result teaches two separate questions. Did the index find the matching documents efficiently, and
          did the representation connect the question to the passages a person needs? A correct posting
          traversal can still support an incomplete candidate set.
        hold: 0.6
        visual_cues:
          - id: ranking-beat-2-focus-1
            phrase: That result teaches two separate questions
            targets:
              - ranking-object-distribution-ranking-31
            color: blue
            linger: 0.6
          - id: ranking-beat-2-focus-2
            phrase: Did the index find the matching documents efficiently
            targets:
              - ranking-object-distribution-ranking-31
            color: blue
            linger: 0.6
      - say: A synonym map or query expansion could connect make soup with cook beans and vegetables. A dense
          retrieval lane can also represent paraphrases. Each option changes the candidate-generation path, so
          compare its judged results and cost on the same queries.
        hold: 0.7
        visual_cues:
          - id: ranking-beat-3-focus-1
            phrase: A synonym map or query expansion could connect
            targets:
              - ranking-object-distribution-ranking-31
            color: blue
            linger: 0.6
  - id: top-k
    title: Keep a small set of strong candidates
    visual: A bounded min-heap streams four computed scores, rejects a weaker tied result, and replaces its
      weakest retained item when d4 arrives.
    beats:
      - say: d1 arrives first with a score of about 1.669 and fills one slot. A bounded min-heap keeps the weakest
          retained candidate at its root, ready for the next score.
        hold: 0.55
        visual_cues:
          - id: top-k-beat-1-focus-1
            phrase: A bounded min-heap keeps the weakest retained candidate at its root
            targets:
              - top-k-simulation-35
            color: blue
            linger: 0.6
      - say: d2 arrives with a score of zero and fills the second slot. It becomes the weaker root, while d1 remains
          the stronger retained result.
        hold: 0.55
        visual_cues:
          - id: top-k-beat-2-focus-1
            phrase: It becomes the weaker root
            targets:
              - top-k-simulation-35
            color: blue
            linger: 0.6
      - say: Now d3 arrives with the same zero score. The lower-ID tie rule keeps d2 ahead of d3, so d3 leaves the
          retained set and d2 stays at the root.
        hold: 0.6
        visual_cues:
          - id: top-k-beat-3-focus-1
            phrase: so d3 leaves the retained set and d2 stays at the root
            targets:
              - top-k-simulation-35
            color: blue
            linger: 0.6
      - say: d4 scores about 0.899, so it replaces the zero-score root. The final two are the soup recipe d1 and the
          lunch menu d4. For a large candidate set and small k, bounded selection avoids sorting every score
          while preserving the chosen winners and tie rule.
        motion_check:
          region:
            - 160
            - 350
            - 1620
            - 455
          minimumChangedFraction: 0.002
        hold: 0.7
        visual_cues:
          - id: top-k-beat-4-focus-1
            phrase: so it replaces the zero-score root
            targets:
              - top-k-simulation-35
            color: blue
            linger: 0.6
  - id: storage
    title: Index layout shapes the cost
    visual: Sorted posting IDs become gap values and return to their document positions; a common term fans out
      across many IDs while a rare term stays compact.
    beats:
      - say: Real inverted indexes keep postings ordered and often store document frequency, term counts, or
          positions. Ordered IDs let query execution merge lists, skip ranges, and decode compressed blocks
          without scanning every stored passage.
        hold: 0.55
        visual_cues:
          - id: storage-ordered
            phrase: Ordered IDs let query execution merge lists
            targets:
              - storage-values
            color: cyan
            linger: 0.6
      - say: If a posting list contains IDs 12, 20, and 25, the gaps are 12, 8, and 5. Gap encoding preserves the
          order while making small differences compact for suitable integer codecs. Decoding restores the
          original IDs before candidates are scored.
        hold: 0.6
        visual_cues:
          - id: storage-id-values
            phrase: If a posting list contains IDs 12, 20, and 25
            targets:
              - storage-values
            color: cyan
            linger: 0.6
          - id: storage-gap-values
            phrase: the gaps are 12, 8, and 5
            targets:
              - storage-values
              - storage-equation
            color: yellow
            linger: 0.6
      - say: Indexes also have a build and update cost. New or changed documents must be analyzed and represented,
          then merged into searchable segments or another storage layout. Measure query latency together with
          freshness, storage, and indexing throughput.
        hold: 0.7
        visual_cues:
          - id: storage-decoding
            phrase: must be analyzed and represented
            targets:
              - storage-values
            color: cyan
            linger: 0.6
  - id: evaluation
    title: Judge the returned evidence
    visual: The top-two lexical result highlights useful d1 and distractor d4, then an illustrative paraphrase
      lane adds the missed d2 to the candidate set.
    beats:
      - say: Our relevance labels mark d1 and the paraphrased d2 as useful. The top-two lexical results contain d1 and
          d4, so recall at two is one useful passage out of two. The lunch menu consumed a slot that could
          have carried the cooking instructions.
        hold: 0.6
        visual_cues:
          - id: evaluation-relevant
            phrase: Our relevance labels mark d1 and the paraphrased d2 as useful
            targets:
              - evaluation-object-relevant-45
            color: cyan
            linger: 0.6
          - id: evaluation-recall
            phrase: recall at two is one useful passage out of two
            targets:
              - evaluation-equation-string-raw-mathrm-recall-k-frac-mathrm-relevant-ca-51
            color: yellow
            linger: 0.6
      - say: A second lane can retrieve d2 from its paraphrase. Add it to the candidates from word search.
          If the reranker picks the recipe and the cooking instruction, both useful passages reach the cook.
          For your own search, mark which pages answer each reader's question, then check how many the shortlist contains.
        hold: 0.6
        visual_cues:
          - id: evaluation-beat-2-focus-1
            phrase: A second lane can retrieve d2 from its paraphrase
            targets:
              - evaluation-object-cooking-paraphrase-d2-48
              - evaluation-candidate-union
            color: blue
            linger: 0.6
          - id: evaluation-fuse-results
            phrase: If the reranker picks the recipe and the cooking instruction
            targets:
              - evaluation-candidate-union
              - evaluation-reranker
              - evaluation-ranked-result
            color: green
            linger: 0.5
      - say: Trace the whole path when a retrieval result fails. Follow the analyzer, posting traversal, score, top-k
          selection, and evaluation. This separates a missed term from a weak score and from a shortlist that
          is too small for the next stage.
        hold: 0.75
        visual_cues:
          - id: evaluation-beat-3-focus-1
            phrase: Trace the whole path when a retrieval result fails
            targets:
              - evaluation-object-relevant-45
            color: blue
            linger: 0.6
  - id: analyzer-contract
    title: Change the question and retain exact term identity
    visual: The credential corpus preserves four named source passages while the analyzer constructs counts, IDs
      and a collision.
    beats:
      - say: "How do I rotate an API key? Document one calls it key rotation. Document two calls it replacing
          a credential. Both give the reader steps to follow. The other pages cover display names and API key
          quotas. Watch what happens to the two guides when we search by word."
        hold: 0.75
        visual_cues:
          - id: credential-records
            phrase: Document one calls it key rotation
            targets:
              - analyzer-contract-construction
            color: cyan
            linger: 0.5
          - id: credential-relevance
            phrase: Both give the reader steps to follow
            targets:
              - analyzer-contract-construction
            color: cyan
            linger: 0.5
      - say: The reference analyzer lowercases text and keeps runs of English letters. The question becomes rotate,
          API, key. Rotate has no exact match, while API and key each reach documents one and four. A posting
          records the matching document and frequency; optional positions can support phrase and proximity
          checks. Query and document analysis must use compatible rules. A fast lookup cannot invent the
          missing rotation synonym.
        hold: 0.75
        visual_cues:
          - id: analyzer-terms
            phrase: The question becomes rotate, API, key
            targets:
              - analyzer-contract-construction
            color: cyan
            linger: 0.5
          - id: analyzer-postings
            phrase: API and key each reach documents one and four
            targets:
              - analyzer-contract-construction
            color: cyan
            linger: 0.5
      - say: Watch an identifier failure. AUTH underscore four zero one and AUTH underscore four zero three both
          become auth, so distinct error codes collide. Rotate underscore API underscore key becomes three
          terms. Keep a keyword field when complete identifier identity matters, and a separate analyzed field
          for ordinary text. Changing case or punctuation rules also changes the index and the queries that
          can reach it.
        hold: 0.75
        visual_cues:
          - id: identifier-collision
            phrase: both become auth
            targets:
              - analyzer-contract-construction
            color: cyan
            linger: 0.5
