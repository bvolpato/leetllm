            phrase: Linux kernel comes from the Engine host
            targets:
              - host-kernel
            color: blue
            linger: 0.65
      - say: Run under the application account with a read-only root filesystem. Where can the report go? It
          goes to standard output. We've disabled Python's bytecode writes, and this scorer only reads
          its input. A later workload that writes a cache will need somewhere writable.
        hold: 0.65
        caption_starts:
          - It goes to standard output
        visual_cues:
          - id: runtime-user
            phrase: application account
            targets:
              - process-user
            color: green
            linger: 0.65
          - id: runtime-readonly
            phrase: read-only root filesystem
            targets:
