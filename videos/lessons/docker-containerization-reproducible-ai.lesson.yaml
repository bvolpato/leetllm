            phrase: The scorer reads all three rows
            targets: [opening-output]
            color: green
  - id: runtime-contract
    title: What travels with the scorer?
    visual: Place the runtime and program in the image, then connect the client to the Linux engine that
      will launch them.
    beats:
      - say: What else comes along with Python? The image holds the operating system libraries, the installed
          packages, our script, and its three test rows. For a different day's requests, supply the file
          when the container starts. This scorer compares labels locally. It needs no credential.
        hold: 0.6
        caption_starts:
          - The image holds
        visual_cues:
          - id: dk-runtime-contract-beat0
            phrase: The image holds the operating system libraries
            targets:
              - runtime-contract-construction
            color: blue
            linger: 0.5
          - id: dk-runtime-contract-data
            phrase: supply the file when the container starts
            targets:
              - runtime-contract-construction
            color: cyan
            linger: 0.45
          - id: dk-runtime-contract-secret
            phrase: It needs no credential
            targets:
              - runtime-contract-construction
            color: cyan
            linger: 0.45
      - say: Run docker version in that same shell. The client sends the request. Look for the server in the
          response. That's the engine that can start the process. Where does that engine run? Install
          the Engine directly on Linux and the container shares that host's kernel. With Docker
          Desktop on Linux or Mac, the Engine runs in a Linux virtual machine. The container shares
          the virtual machine's kernel.
        hold: 0.6
        caption_starts:
          - Install the Engine directly on Linux
          - With Docker Desktop
        visual_cues:
          - id: dk-runtime-contract-beat1
            phrase: The client sends the request
            targets:
              - runtime-contract-construction
            color: blue
            linger: 0.5
          - id: dk-runtime-contract-server
            phrase: Look for the server in the response
            targets:
              - runtime-contract-construction
            color: cyan
            linger: 0.45
          - id: dk-runtime-contract-vm
            phrase: the Engine runs in a Linux virtual machine
            targets:
              - runtime-contract-construction
            color: cyan
            linger: 0.45
  - id: context
    title: Which files may the builder read?
    visual: Follow each project path through eligibility and the explicit COPY instructions. The three local
      paths stop at their matching ignore rules.
    beats:
      - say: Here's the directory we've asked Docker to build from. Before we apply any ignore rules, even the
          local environment file is eligible for the builder to read. That set of eligible project files
          is the build context. BuildKit can skip sending a file that no instruction uses.
        hold: 0.65
        visual_cues:
          - id: context-files
            phrase: eligible for the builder to read
            targets:
              - project-files
            color: blue
            linger: 0.65
      - say: Apply the rules in dot docker ignore. Three paths stop here. Your local credentials, your virtual
          environment, and your downloaded weights have no job in this build. Even a file you've kept
          out of Git needs its own Docker exclusion.
        hold: 0.65
        visual_cues:
          - id: context-ignore
            phrase: Apply the rules in dot docker ignore
            targets:
              - ignored-paths
              - dockerignore-rules
            color: pink
            linger: 0.65
      - say: Now follow the three copy instructions that read from the project directory. Requirements go into
          the builder. The script and its test data go into the runtime. The Dockerfile supplies the recipe.
          There's a fourth copy. Follow it back to its source. The installed Python environment comes from
          the builder stage itself.
        hold: 0.65
        motion_check:
          region:
            - 150
            - 340
            - 1600
            - 560
          minimumChangedFraction: 0.002
        visual_cues:
          - id: context-copy
            phrase: follow the three copy instructions
            targets:
              - copy-inputs
            color: green
            linger: 0.65
          - id: context-stage-copy
            phrase: Follow it back to its source
            targets: [builder-copy]
            color: cyan
  - id: stages
    title: Build one Python environment
    visual: A virtual environment crosses from builder to runtime. The runtime receives the test data and
      selects the application account and command.
    beats:
      - say: Start both stages from the same Python base. In the first stage, the builder makes a virtual
          environment and installs the requirements there. Our scorer only uses the standard library. An
          empty requirements file is exactly what we expect today.
        hold: 0.65
        visual_cues:
          - id: stages-install
            phrase: installs the requirements there
            targets:
              - builder-install
            color: blue
            linger: 0.65
      - say: The runtime stage starts fresh. It copies the environment into the same location so that its
          installed scripts can still find Python. Set the runtime's search path to use it. Now copy the
          scorer and evaluation rows. A compiler needed to build a future package can stay behind.
        hold: 0.65
        motion_check:
          region:
            - 1260
            - 330
            - 500
            - 590
          minimumChangedFraction: 0.002
        visual_cues:
          - id: stages-environment
            phrase: copies the environment into the same location
            targets:
              - runtime-environment
            color: cyan
            linger: 0.65
          - id: stages-files
            phrase: copy the scorer and evaluation rows
            targets:
              - runtime-files
            color: green
            linger: 0.65
      - say: The USER instruction selects an application account. The entrypoint records the command to run. A
          teammate can now launch the scorer by naming the image. For a release we'll also fix the
          platform and the base image digest in both stages.
        hold: 0.65
        visual_cues:
          - id: stages-user
            phrase: selects an application account
            targets:
              - runtime-user
            color: yellow
            linger: 0.65
          - id: stages-command
            phrase: records the command to run
            targets:
              - runtime-command
            color: green
            linger: 0.65
  - id: stage-inheritance
    title: What gets into a second stage?
    visual: Track three concrete builder additions into two possible runtime stages. A second example
      follows a native extension to the missing runtime library.
    beats:
      - say: Suppose a future build adds a helper file and sets a variable called tool mode. Our runtime starts
          from the original Python base and copies just the virtual environment. Look down that column.
          The helper lives beside the copied directory, and the variable belongs to the builder's
          settings. Only the environment's files arrive. Now change the starting point to FROM builder.
          This time we inherit all three additions.
        hold: 0.6
        visual_cues:
          - id: dk-stage-inheritance-beat0
            phrase: a helper file
            targets:
              - stage-inheritance-construction
            color: blue
            linger: 0.5
          - id: dk-stage-inheritance-copy
            phrase: Only the environment's files arrive
            targets:
              - stage-inheritance-construction
            color: cyan
            linger: 0.45
          - id: dk-stage-inheritance-inherit
            phrase: This time we inherit all three additions
            targets:
              - stage-inheritance-construction
            color: cyan
            linger: 0.45
      - say: Take a database driver built from source. Its Python extension travels in the copied
          environment. It also uses the Postgres client library from the operating system. Try importing
          the driver. The loader can't find that library. Add the matching library to the runtime image.
          Start a fresh Python process and repeat the import. This time the import succeeds.
          The compiler can stay in the builder.
        hold: 0.6
        caption_starts:
          - The loader can't find that library
          - This time the import succeeds
        visual_cues:
          - id: dk-stage-inheritance-beat1
            phrase: Its Python extension travels in the copied environment
            targets:
              - stage-inheritance-construction
            color: blue
            linger: 0.5
          - id: dk-stage-inheritance-missing
            phrase: The loader can't find that library
            targets:
              - stage-inheritance-construction
            color: pink
            linger: 0.45
          - id: dk-stage-inheritance-repair
            phrase: Add the matching library to the runtime image
            targets:
              - stage-inheritance-construction
            color: cyan
            linger: 0.45
          - id: dk-stage-inheritance-retry
            phrase: Start a fresh Python process and repeat the import
            targets: [stage-inheritance-construction]
            color: blue
          - id: dk-stage-inheritance-result
            phrase: This time the import succeeds
            targets: [stage-inheritance-construction]
            color: green
      - say: Where does the script name resolve? WORKDIR puts us in the app directory. COPY with chown sets the
          owner of the copied files. Without that option, root usually owns the copy, though its
          permissions may still let our account read it. USER selects the account that launches Python.
          The entrypoint array passes the script name as a separate argument.
        hold: 0.6
        caption_starts:
          - WORKDIR puts us in the app directory
        visual_cues:
          - id: dk-stage-inheritance-beat2
            phrase: Where does the script name resolve
            targets:
              - stage-inheritance-construction
            color: blue
            linger: 0.5
          - id: dk-stage-inheritance-workdir
            phrase: WORKDIR puts us in the app directory
            targets:
              - stage-inheritance-construction
            color: cyan
            linger: 0.45
          - id: dk-stage-inheritance-owner
            phrase: sets the owner of the copied files
            targets:
              - stage-inheritance-construction
            color: cyan
            linger: 0.45
          - id: dk-stage-inheritance-user
            color: cyan
            linger: 0.45
            phrase: the account that launches Python
            targets:
              - stage-inheritance-construction
          - id: dk-stage-inheritance-entry
            phrase: passes the script name as a separate argument
            targets:
              - stage-inheritance-construction
            color: cyan
            linger: 0.45
