            color: yellow
            linger: 0.65
          - id: runtime-output
            phrase: It goes to standard output
            targets: [runtime-process]
            color: green
  - id: permission-boundary
    title: Whose permissions apply?
    visual: Run id and the scorer in separate containers. Pair each command with its own output, then
      trace file access to the numeric owner of a mounted directory.
    beats:
      - say: Inspect the image for its platform, its configured user, and its entrypoint. To see who actually
          runs, override the entrypoint with the id command. It reports the process user and its groups.
          Our application UID is ten thousand and one. Read the GID beside it. Here the numbers match.
          When useradd creates the user's group,
          it tries that same number. It can choose another if the number is taken or out of range.
          What would you run to find out whether Python can finish with a read-only root filesystem?
        hold: 1.8
        visual_cues:
          - id: dk-permission-boundary-beat0
            phrase: Inspect the image
            targets:
              - permission-boundary-construction
            color: blue
            linger: 0.5
          - id: dk-permission-boundary-uid
            phrase: Our application UID is ten thousand and one
            targets:
              - permission-boundary-construction
            color: cyan
            linger: 0.45
          - id: dk-permission-boundary-group
            phrase: Read the GID beside it
            targets:
              - permission-boundary-construction
            color: cyan
            linger: 0.45
      - say: Remove the entrypoint override. Keep the root filesystem read-only and run the normal
          entrypoint. Now we get a score and an exit status. This execution finished without writing
          to the root filesystem. The daemon launched Python as the application user. Permission to
          control that daemon is separate from the user's permissions inside the container.
          Access to a rootful daemon can carry host-level authority. Leave the Docker
          socket and unrelated host directories out of the scorer. A writable bind also lets the
          process change host files it has permission to write.
        hold: 0.6
        visual_cues:
          - id: dk-permission-boundary-scorer
            phrase: run the normal entrypoint
            targets:
              - permission-boundary-construction
            color: cyan
            linger: 0.45
          - id: dk-permission-boundary-output
            phrase: Now we get a score and an exit status
            targets:
              - permission-boundary-construction
            color: green
            linger: 0.45
          - id: dk-permission-boundary-beat1
            phrase: The daemon launched Python as the application user
            targets:
              - permission-boundary-construction
            color: blue
            linger: 0.5
          - id: dk-permission-boundary-daemon
            phrase: Access to a rootful daemon can carry host-level authority
            targets:
              - permission-boundary-construction
            color: cyan
            linger: 0.45
      - say: Take a mount on a Linux Engine with ordinary numeric IDs and no user namespace remapping. Here the
          host directory belongs to root and only its owner can enter. Our user can't reach the file,
          even though the file itself is readable. For this private scratch directory, give ownership to
          the application user on the host. Now that user can traverse the directory and read the file
          through the bind. An output directory needs write access too. An image-layer ownership change
          can't reach it. Rootless engines and Docker Desktop can map IDs differently.
        hold: 0.6
        visual_cues:
          - id: dk-permission-boundary-beat2
            phrase: the host directory belongs to root
            targets:
              - permission-boundary-construction
            color: blue
            linger: 0.5
          - id: dk-permission-boundary-mode
            phrase: give ownership to the application user on the host
            targets:
              - permission-boundary-construction
            color: cyan
            linger: 0.45
  - id: evaluation
    title: Read the three requests
    visual: The expected and predicted labels stay visible while each comparison mark and the running count
      appear. The printed fraction and integer gate arrive separately. Standard output and the image
      survive container removal.
    beats:
      - say: The scorer strips surrounding whitespace from both labels, lowercases them, and compares
          the results. Read the predictions with me. For request one oh one, the
          labels agree. Our count goes up. The middle pair differs. Blocked was expected, but the
          prediction was escalated. Keep that row in the denominator. The final pair agrees. All three
          rows have had a turn.
        hold: 0.65
        visual_cues:
          - id: eval-first
            phrase: the labels agree
            targets:
              - eval-row-101
            color: green
            linger: 0.65
            caption_boundary: true
          - id: eval-second
            phrase: The middle pair differs
            targets:
              - eval-row-102
            color: pink
            linger: 0.65
            caption_boundary: true
          - id: eval-third
            phrase: The final pair agrees
            targets:
              - eval-row-103
            color: green
            linger: 0.65
            caption_boundary: true
      - say: Two matches out of three give the printed score. Rounded to three places, that's point six six
          seven. If you used that rounded decimal as the minimum, the exact fraction would fall just
          below it. Use the counts. Multiply the matches by three and the total number of rows by
          two. The first number must reach or exceed the second. Here both sides are six. Equality passes.
