          Inspect the dependencies the install step read, then rebuild. Permission denied on a bind?
          Check the mounted owner and modes. Does every script edit rerun the install? Check whether the
          builder has a reusable cache. Then look at the Dockerfile. If it copies the scorer before the
          install, move that copy after the install. If config disappears only in production, look for a setting
          that used to come from your laptop.
