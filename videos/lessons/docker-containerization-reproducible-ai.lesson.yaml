    beats:
      - say: Both builders use the Python tag at the top. It gives us Python three twelve on Debian thirteen.
          Tomorrow that name could point to an updated build. Even today this tag offers more than one
          image. By default the x86 worker selects A and the Arm laptop selects B.
        hold: 0.6
        visual_cues:
          - id: dk-platform-identity-beat0
            phrase: Both builders use the Python tag
            targets:
              - platform-identity-construction
            color: blue
            linger: 0.5
          - id: dk-platform-identity-variants
            phrase: the x86 worker selects A and the Arm laptop selects B
            targets:
              - platform-identity-construction
            color: cyan
            linger: 0.45
            caption_boundary: true
      - say: Record the index digest in both FROM lines and you fix the set of members. A platform manifest
          digest identifies one member. For these two test runs, ask both builders for Linux on Arm.
          Assume the worker can emulate it. Follow the two lines. Both machines test a scorer built
          from member B.
        hold: 1.2
