  - id: dependency-artifacts
    title: Which package will pip accept?
    visual: A release has two wheels and a source archive. Compare the offered wheel's hash with the
      permitted hash and follow the file actually read by pip.
    beats:
      - say: Now suppose the scorer needs a package. One release offers two wheels and a source archive. A wheel
          is a prebuilt distribution. The version on both wheels matches. Compare their hashes. A hash
          lets pip check the actual download against the bytes you approved. With require hashes, pin
          and hash the dependencies of that package too. Our empty requirements file requests nothing.
        hold: 0.6
        visual_cues:
          - id: dk-dependency-artifacts-beat0
            phrase: One release offers two wheels
            targets:
              - dependency-artifacts-construction
            color: blue
            linger: 0.5
          - id: dk-dependency-artifacts-hash
            phrase: Compare their hashes
            targets:
              - dependency-artifacts-construction
            color: cyan
            linger: 0.45
          - id: dk-dependency-artifacts-closure
            phrase: pin and hash the dependencies of that package too
            targets:
              - dependency-artifacts-construction
            color: cyan
            linger: 0.45
      - say: Follow the file pip opens. It opens requirements dot txt. Edit a lockfile lying beside it and pip
          still reads the same requirements. Export the reviewed lock to that file or use the lock
          manager's frozen install. On a clean download, wheel B has the right version and an unapproved
          hash. Pip rejects the download. An already installed package can satisfy a requirement without
          a fresh hash check.
        hold: 0.6
        visual_cues:
          - id: dk-dependency-artifacts-beat1
            phrase: Follow the file pip opens
            targets:
              - dependency-artifacts-construction
            color: blue
            linger: 0.5
          - id: dk-dependency-artifacts-unused
            phrase: pip still reads the same requirements
            targets:
              - dependency-artifacts-construction
            color: cyan
            linger: 0.45
          - id: dk-dependency-artifacts-reject
            phrase: Pip rejects the download
            targets:
              - dependency-artifacts-construction
            color: pink
            linger: 0.45
      - say: A hash on the source archive fixes the source bytes. The compiler can still differ between
          builders. Suppose pip needs to download the package for a clean environment. For a wheel-only
          install, ask pip for binary packages only. If no compatible wheel has an approved hash for
          that platform, the install stops.
        hold: 0.6
        visual_cues:
          - id: dk-dependency-artifacts-beat2
            phrase: fixes the source bytes
            targets:
              - dependency-artifacts-construction
            color: blue
            linger: 0.5
          - id: dk-dependency-artifacts-wheel
            phrase: the install stops
            targets:
              - dependency-artifacts-construction
            color: cyan
            linger: 0.45
  - id: cache
    title: Which step has to run again?
    visual: Compare the inputs to the install step and the application copy after two independent edits.
      Assume a cold key for each changed input.
    beats:
      - say: This build is already in the cache. The installer used the base, the instruction, and the
          requirements file. The scorer hadn't been copied yet. These short keys stand for the inputs to
          each step.
        hold: 0.65
        visual_cues:
          - id: cache-contract
            phrase: the base, the instruction, and the requirements file
            targets:
              - installer-key
            color: blue
            linger: 0.65
      - say: Change only the scorer. Docker looks up a different key for the copy. The lookup misses, so
          Docker runs the copy again. Look one step earlier. The installer sees the same inputs, so Docker
          can reuse its result.
        hold: 0.65
        motion_check:
          region:
            - 160
            - 330
            - 1600
            - 570
          minimumChangedFraction: 0.002
        visual_cues:
          - id: cache-source-edit
            phrase: Docker looks up a different key for the copy
            targets:
              - source-input
              - application-key
            color: yellow
            linger: 0.65
          - id: cache-source-miss
            phrase: The lookup misses
            targets:
              - application-key
            color: yellow
            linger: 0.45
          - id: cache-reuse
            phrase: same inputs, so Docker can reuse its result
            targets:
              - installer-key
            color: green
            linger: 0.65
      - say: Put the scorer back. This time edit the requirements. The cache has no entry for the new key.
          Installation now has a different input and must run again. If the installed files change, the
          runtime receives a different environment. Restoring a previously built set of inputs can bring
          its cached result back.
        hold: 0.65
        visual_cues:
          - id: cache-dependency-edit
            phrase: Installation now has a different input and must run again
            targets:
              - dependency-input
              - installer-key
            color: yellow
            linger: 0.65
  - id: runtime
    title: Start the packaged Python
    visual: A stored image supplies the scorer's files. The container uses the engine's kernel, runs as
      appuser, and sends its report to standard output.
    beats:
      - say: Docker run creates a container from the stored image. Now our
          packaged Python can open the scorer. When it needs to read a file, the Linux kernel comes from
          the Engine host, or from the Linux virtual machine on Docker Desktop.
        hold: 0.65
        visual_cues:
          - id: runtime-start
            phrase: creates a container from the stored image
            targets:
              - runtime-image
              - runtime-process
            color: cyan
            linger: 0.65
