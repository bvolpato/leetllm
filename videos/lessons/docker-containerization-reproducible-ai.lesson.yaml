scenes:
  - id: opening
    title: Give the scorer its own Python
    visual: Open on the failed command in Bash. Match the highlighted word python to the
      Python base of the application image. Set the script and its input on that base.
      Keep the assembled image in view as its entrypoint runs and prints the first line.
    beats:
      - say: The shell can't find Python. It never gets to the scoring script.
        hold: 0.8
        visual_cues:
          - id: opening-missing
            phrase: can't find Python
            targets: [opening-command]
            color: pink
      - say: This base image comes with Python three twelve. Copy in the scoring script and its data file.
        hold: 0.7
        visual_cues:
          - id: opening-base
            phrase: This base image comes with Python three twelve
            targets: [opening-python]
            color: cyan
          - id: opening-script
            phrase: Copy in the scoring script
            targets: [opening-script]
            color: blue
          - id: opening-data
            phrase: and its data file
            targets: [opening-data]
            color: blue
      - say: Run the image. Inside the new container, Python opens the same script. The scorer reads all three rows.
        hold: 1.4
        caption_starts:
          - The scorer reads all three rows
        visual_cues:
          - id: opening-run
            phrase: Run the image
            targets: [opening-run]
            color: blue
