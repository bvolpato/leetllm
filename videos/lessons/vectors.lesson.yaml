version: 1
id: vectors
title: "Vectors, Matrices & Tensors: Follow the Coordinates"
source: preparation/vectors-matrices-tensors/content.md
voice: en-US-AndrewNeural
rate: +0%
sources:
  - title: "Deep Learning: Linear Algebra"
    url: https://www.deeplearningbook.org/contents/linear_algebra.html
  - title: NumPy matrix multiplication
    url: https://numpy.org/doc/stable/reference/generated/numpy.matmul.html
  - title: NumPy broadcasting
    url: https://numpy.org/doc/stable/user/basics.broadcasting.html
  - title: NumPy mean
    url: https://numpy.org/doc/stable/reference/generated/numpy.mean.html
  - title: NumPy transpose
    url: https://numpy.org/doc/stable/reference/generated/numpy.transpose.html
  - title: PyTorch Linear
    url: https://docs.pytorch.org/docs/stable/generated/torch.nn.Linear.html
scenes:
  - id: intro
    title: Which words should change?
    visual: Two ordinary requests retain six labeled word positions. Password's two-number
      state moves out for inspection; transformed results stay covered.
    beats:
      - say: "A model reads two requests: reset my password, and change the address. Each word
          owns a vector. Change the numbers attached to password. Which other words
          should change? Hold that prediction."
        hold: 0.65
        visual_cues:
          - id: choose-password
            phrase: the numbers attached to password
            targets:
              - password-word
              - selected-state
            color: yellow
            linger: 0.5
      - say: Start with that one word. Two coordinates will become three. Keep its identity
          attached as we follow these supplied states and weights through the
          calculation.
        hold: 0.5
        visual_cues:
          - id: carry-password
            phrase: Start with that one word
            targets:
              - selected-state
            color: cyan
            linger: 0.5
      - say: These word states and matrices are handpicked teaching data. Each written word
          occupies one demonstration token position; a real tokenizer can split words.
          We will keep coordinate meaning attached as we extend this construction to
          request predictions, score grids and masked summaries.
        hold: 0.7
  - id: coordinates
    title: An ordered pair becomes a place
    visual: Two scalar coordinates build a vector on equal-unit axes. A second real row
      supplies a visible coordinate-swap counterexample.
    beats:
      - say: One number is a scalar. An ordered list of numbers is a vector. Password's state
          has two coordinates, both one half. Draw the first coordinate horizontally. It
          tells us how far to travel along the first axis.
        hold: 0.55
        visual_cues:
          - id: first-coordinate
            phrase: Draw the first coordinate horizontally
            targets:
              - horizontal-component
              - coordinate-row
            color: blue
            linger: 0.5
      - say: Now add the second coordinate vertically. The two moves meet at one point, and an
          arrow from the origin describes the same vector. These are dimensionless toy
          features. Their positions are fixed conventions; the words keep their own
          labels.
        hold: 0.55
        visual_cues:
          - id: second-coordinate
            phrase: add the second coordinate vertically
            targets:
              - vertical-component
              - password-vector
            color: pink
            linger: 0.5
      - say: Look at reset, whose state is one, zero. Swap its coordinates. The point moves to
          the other axis even though the list still has two entries. Coordinate order
          carries information that a length check alone cannot recover.
        hold: 0.7
        visual_cues:
          - id: swap-coordinates
            phrase: Swap its coordinates
            targets:
              - swap-points
            color: yellow
            linger: 0.6
  - id: directions
    title: A matrix tells each input direction where to go
    visual: The two rows of the 2-to-3 map produce full output directions. A labeled
      first/third-coordinate view retains all three values in strips.
    beats:
      - say: "A matrix is a rectangular table. This one is also a rule: it turns two input
          coordinates into three outputs. We write a token vector as a row, so the
          matrix has two input rows and three output columns."
        hold: 0.55
        visual_cues:
          - id: map-shape
            phrase: two input rows and three output columns
            targets:
              - map-matrix
              - map-axes
            color: yellow
            linger: 0.5
      - say: Feed in one unit of the first coordinate. The first matrix row gives its whole
          output direction. The plot shows the first and third outputs; the strip below
          keeps all three. Follow that slanted direction as it grows.
        hold: 0.55
        visual_cues:
          - id: first-direction
            phrase: Follow that slanted direction as it grows
            targets:
              - first-map-direction
              - first-full-direction
            color: blue
            linger: 0.5
      - say: One unit of the second coordinate selects the second row. In our plotted view it
          moves straight upward. The full strip also shows its second output. Scaling
          and adding these directions defines a linear map for every two-coordinate
          input.
        hold: 0.7
        visual_cues:
          - id: second-direction
            phrase: it moves straight upward
            targets:
              - second-map-direction
              - second-full-direction
            color: pink
            linger: 0.5
  - id: mixture
    title: Scale the directions, then join them
    visual: Two half weights shrink the actual mapped directions. The second weighted vector
      travels to the first vector's tip; the completed join reveals the output.
    beats:
      - say: "Password asks for half of each direction. Take half of the first row. The blue
          arrow shrinks, and every coordinate in its full output shrinks with it. This
          is scalar multiplication: one number scales a whole vector."
        hold: 0.6
        visual_cues:
          - id: scale-first
            phrase: Take half of the first row
            targets:
              - first-contribution
              - first-weighted-row
            color: blue
            linger: 0.6
      - say: Take half of the second row as well. We now have two contributions, one from each
          input coordinate. Keep both whole vectors together, including the output
          coordinate that this two-dimensional view leaves off the plot.
        hold: 0.6
        visual_cues:
          - id: scale-second
            phrase: Take half of the second row
            targets:
              - second-contribution
              - second-weighted-row
            color: pink
            linger: 0.6
      - say: Where will their sum land? Move the pink arrow to the blue arrow's tip. Its length
          and direction stay fixed during that move. The final endpoint is their sum.
          The three-coordinate result now belongs to the same word, password.
        hold: 0.9
        motion_check:
          region:
            - 980
            - 310
            - 760
            - 560
          minimumChangedFraction: 0.002
        visual_cues:
          - id: join-vectors
            phrase: Move the pink arrow to the blue arrow's tip
            targets:
              - second-contribution
              - mixture-result
            color: yellow
            linger: 0.7
  - id: dot
    title: One column makes one scalar
    visual: The third matrix column pairs with the two inputs. Two quarter contributions
      accumulate on a common numeric scale; the full row preserves all three outputs.
    beats:
      - say: We can inspect one output at a time. Select the third column of the matrix and pair
          its entries with the input coordinates. Multiply the first matching pair. Half
          times half contributes one quarter to this output.
        hold: 0.55
        visual_cues:
          - id: dot-first
            phrase: Multiply the first matching pair
            targets:
              - dot-column
              - dot-first-product
            color: blue
            linger: 0.5
      - say: Multiply the second pair, then add that contribution. The accumulator reaches the
          third coordinate we already constructed geometrically. Multiplying matching
          positions and summing is a dot product. Two aligned vectors have produced one
          scalar.
        hold: 0.65
        visual_cues:
          - id: dot-second
            phrase: add that contribution
            targets:
              - dot-second-product
              - dot-accumulator
            color: pink
            linger: 0.6
      - say: Each matrix column makes another dot product. The input-feature axis is summed
          over, leaving three output slots. Here the third output is determined by the
          first two. Making a representation wider gives us more combinations of the
          same input information.
        hold: 0.7
        visual_cues:
          - id: output-relation
            phrase: the third output is determined by the first two
            targets:
              - full-output
              - dependent-output
            color: cyan
            linger: 0.6
  - id: composition
    title: Two maps can become one
    visual: A 3-to-2 map builds its result from three head-to-tail contributions. Matrix
      multiplication forms the combined map; its direct route lands at the same point.
    beats:
      - say: A model often puts one map after another. Keep password's three-coordinate output
          and apply this second matrix. The first coordinate moves right. The second
          moves up. The third contributes to both directions. Adding those three pieces
          constructs the new result.
        hold: 0.65
        visual_cues:
          - id: downstream-first
            phrase: The first coordinate moves right
            targets:
              - downstream-construction
            color: blue
            linger: 0.45
          - id: downstream-second
            phrase: The second moves up
            targets:
              - downstream-construction
            color: pink
            linger: 0.45
          - id: downstream-third
            phrase: The third contributes to both directions
            targets:
              - downstream-construction
              - downstream-result
            color: cyan
            linger: 0.55
      - say: Could we combine the rules before receiving a word? Multiply the first matrix by
          the second. Each resulting coefficient is itself a row-column dot product. The
          middle width of three is summed over, leaving one map from two inputs to two
          outputs.
        hold: 0.7
        visual_cues:
          - id: compose-matrices
            phrase: Multiply the first matrix by the second
            targets:
              - composed-matrix
              - composition-contract
            color: yellow
            linger: 0.6
      - say: Apply that combined map directly to password. Scale its two directions and add
          them. The direct route reaches the same point as the two-stage route. Both
          stages here are linear maps. Their matrix product preserves the result for
          every input vector.
        hold: 0.9
        motion_check:
          region:
            - 1040
            - 320
            - 720
            - 550
          minimumChangedFraction: 0.002
        visual_cues:
          - id: direct-first
            phrase: Scale its two directions
            targets:
              - direct-construction
            color: blue
            linger: 0.45
          - id: direct-second
            phrase: and add them
            targets:
              - direct-construction
              - direct-result
            color: green
            linger: 0.6
  - id: rows
    title: A matrix can hold the words
    visual: Three word states become labeled rows. A shared map visits each row and
      constructs its owned output, preserving the word axis.
    beats:
      - say: A matrix can also hold data. Stack the three word vectors from reset my password.
          Each row owns a word position, and each column owns a feature. The word labels
          stay beside their rows so every number has an address.
        hold: 0.55
        visual_cues:
          - id: stack-word-rows
            phrase: Stack the three word vectors
            targets:
              - word-inputs
            color: blue
            linger: 0.5
      - say: Apply the same matrix to reset. Then apply it to my. Finally, transform password.
          Each row makes its own three-coordinate output. We reuse the coefficients
          while keeping the computations and their owners separate.
        hold: 0.65
        visual_cues:
          - id: row-reset
            phrase: Apply the same matrix to reset
            targets:
              - row-reset-output
              - word-map
            color: blue
            linger: 0.45
          - id: row-my
            phrase: Then apply it to my
            targets:
              - row-my-output
              - word-map
            color: pink
            linger: 0.45
          - id: row-password
            phrase: Finally, transform password
            targets:
              - row-password-output
              - word-map
            color: cyan
            linger: 0.6
      - say: Three word rows enter and three word rows leave. Only the feature width changes.
          This shared map mixes features inside each row. To let one word read another
          word, a later operation must connect their positions.
        hold: 0.7
        visual_cues:
          - id: preserve-word-axis
            phrase: Three word rows enter and three word rows leave
            targets:
              - word-inputs
              - word-outputs
            color: green
            linger: 0.6
  - id: tensor
    title: Add a message axis
    visual: Two matrices become a tensor with message, word-position and feature axes. An
      index selects a scalar; the shared map transforms every owned row.
    beats:
      - say: "Bring back change the address. Its three word vectors form another matrix. Put the
          two matrices in a batch and we have a tensor with three axes: message, word
          position, and feature. Here each written word occupies one token position."
        hold: 0.6
        visual_cues:
          - id: add-message-axis
            phrase: Put the two matrices in a batch
            targets:
              - message-a
              - message-b
              - tensor-shape
            color: cyan
            linger: 0.6
      - say: "Shape tells us the length of each axis. Follow one address inward: choose message
          one, word position two, and feature zero. We count from zero. That selects the
          first coordinate of address, a single scalar. Fixing an index removes that
          axis. A colon keeps every position on its axis. Keeping batch and token with
          colons while selecting one feature retains a batch-by-token matrix."
        hold: 0.65
        visual_cues:
          - id: select-message
            phrase: choose message one
            targets:
              - message-b
            color: yellow
            linger: 0.4
          - id: select-word
            phrase: word position two
            targets:
              - address-row
            color: yellow
            linger: 0.4
          - id: select-feature
            phrase: and feature zero
            targets:
              - address-feature
              - tensor-index
            color: yellow
            linger: 0.6
          - id: tensor-slice-columns
            phrase: Keeping batch and token with colons while selecting one feature
            targets:
              - tensor-feature-slice
            color: cyan
            linger: 0.45
      - say: Predict the shape after our shared projection. Apply it to all six word states.
          Both messages and their three word positions survive. Each state now has three
          output features. The extra axes organize independent uses of the same small
          calculation.
        hold: 0.85
        visual_cues:
          - id: project-batch
            phrase: Apply it to all six word states
            targets:
              - message-a
              - message-b
              - tensor-shape
            color: green
            linger: 0.65
  - id: local-edit
    title: Return to the word we changed
    visual: A held prediction preserves six outputs. The chosen input moves horizontally and
      its mapped point moves diagonally. The final batch retains five unchanged
      controls.
    beats:
      - say: Return to our opening question. Keep the projection fixed and increase only
          password's first input coordinate by one. Before we make the edit, decide
          which output rows should move. Watch the word identities as carefully as the
          numbers.
        hold: 1.1
        visual_cues:
          - id: predict-local-edit
            phrase: decide which output rows should move
            targets:
              - password-output
              - local-question
            color: yellow
            linger: 0.6
      - say: Change that one coordinate now. The input point moves horizontally. Its output
          follows the matrix's first direction, so the first and third outputs rise
          together. The second output stays fixed. The full row below matches the point
          throughout the motion.
        hold: 0.75
        motion_check:
          region:
            - 190
            - 325
            - 1540
            - 500
          minimumChangedFraction: 0.002
        visual_cues:
          - id: change-password
            phrase: Change that one coordinate now. The input point moves horizontally. Its output
              follows the matrix's first direction, so the first and third outputs rise
              together
            targets:
              - local-input
              - local-output
            color: yellow
            linger: 0.7
      - say: Only password's row changed. The other five word states keep their outputs,
          including every word in the other message. A vector holds coordinates.
          Matrices transform or collect them. Tensor axes preserve who owns them as that
          same rule handles a whole batch.
        hold: 1.2
        visual_cues:
          - id: check-locality
            phrase: The other five word states keep their outputs
            targets:
              - batch-controls
              - password-output
            color: green
            linger: 0.8
  - id: latency-gradient
    title: A gradient moves parameter coordinates
    visual: Switch explicitly from dimensionless word states to the article’s named latency
      features. The gradient scales, reverses and translates the same two-weight point;
      preserve old/new weight identities.
    beats:
      - say: "We have followed one word through a shared map. Now use the same array operations
          for a different quantity: request latency. The feature positions mean prompt
          length in hundreds of tokens, then queue delay in seconds. The weight
          positions have matching units. These supplied coefficients and requests are
          teaching data."
        hold: 0.8
      - say: The previous gradients lesson starts from weights two, two and obtains loss slopes
          four, two. One slope per weight forms the gradient vector. A learning rate of
          one tenth scales it to point four, point two. Subtract both changes from the
          same parameter vector. The updated weights are one point six and one point
          eight.
        hold: 0.8
        visual_cues:
          - id: gradient-scale
            phrase: A learning rate of one tenth scales it to point four, point two
            targets:
              - gradient-scaled
            color: pink
            linger: 0.45
          - id: gradient-update
            phrase: Subtract both changes from the same parameter vector
            targets:
              - gradient-plane
            color: green
            linger: 0.45
          - id: gradient-result
            phrase: The updated weights are one point six and one point eight
            targets:
              - gradient-result
            color: green
            linger: 0.45
      - say: All three arrays have two coordinates, but features, parameters and loss slopes
          have different jobs and units. Shape reports their axis lengths. The
          coordinate names establish their meaning. A scalar array has shape empty
          parentheses; a vector has one axis. An ordinary Python float has no shape
          attribute.
        hold: 0.8
  - id: latency-dot
    title: Matching coordinates accumulate response seconds
    visual: Freeze a separately chosen rule L1=[2,1]. Each request feature multiplies its
      matching coefficient; two labeled duration segments accumulate to the same scalar,
      then a coordinate swap visibly changes the answer.
    beats:
      - say: "For the remaining latency examples, choose a separate fixed rule: two seconds per
          prompt block, plus one second per second of queue delay. Request B has two
          prompt blocks and one second in the queue. This rule is a new stated premise;
          it is separate from the earlier learning update."
        hold: 0.8
      - say: "Pair prompt with its coefficient: two times two contributes four seconds. Pair
          queue with its coefficient: one times one contributes one. Element-wise
          multiplication retains the contribution vector four, one. The dot product adds
          those contributions into the scalar five seconds. One output has no remaining
          feature axis."
        hold: 0.8
        visual_cues:
          - id: latency-prompt
            phrase: two times two contributes four seconds
            targets:
              - latency-contributions
            color: blue
            linger: 0.45
          - id: latency-queue
            phrase: one times one contributes one
            targets:
              - latency-contributions
            color: pink
            linger: 0.45
          - id: latency-sum
            phrase: the scalar five seconds
            targets:
              - latency-result
            color: green
            linger: 0.45
      - say: Swap only the feature positions, keeping the weights in their original order. The
          calculation becomes one times two plus two times one, or four. Both lengths
          still match, so the operation runs. Restoring the named order repairs the
          prediction. A shape assertion and a known-value check catch different
          mistakes.
        hold: 0.8
        visual_cues:
          - id: latency-swap
            phrase: Swap only the feature positions
            targets:
              - latency-input
            color: pink
            linger: 0.45
          - id: latency-swapped
            phrase: one times two plus two times one, or four
            targets:
              - latency-result
            color: pink
            linger: 0.45
          - id: latency-restore
            phrase: Restoring the named order repairs the prediction
            targets:
              - latency-input
              - latency-contributions
              - latency-result
            color: green
            linger: 0.45
  - id: request-batch
    title: One shared rule keeps three requests separate
    visual: Stack A/B/C feature rows, retain row ownership and pass the same coefficient
      vector down the rows. Release each prediction only after that row’s contraction.
    beats:
      - say: "Stack three request rows: A is one, zero; B is two, one; C is three, one. The
          first axis names requests and the second names their two features. Apply the
          same weight vector two, one to each row. Which axes should remain when the
          feature contributions have been summed?"
        hold: 0.8
      - say: A gives two seconds, B gives five and C gives seven. The result has three entries,
          one per request. Three by two multiplied by a length-two vector produces a
          length-three vector. Sharing the rule does not aggregate the requests or let
          one request contribute to another.
        hold: 0.8
        visual_cues:
          - id: request-a
            phrase: A gives two seconds
            targets:
              - request-predictions
            color: green
            linger: 0.45
          - id: request-b
            phrase: B gives five
            targets:
              - request-predictions
            color: green
            linger: 0.45
          - id: request-c
            phrase: C gives seven
            targets:
              - request-predictions
            color: green
            linger: 0.45
      - say: Drawing the weights vertically does not add an array axis. A one-dimensional NumPy
          vector still has shape two comma. An explicit two-by-one column matrix
          preserves its singleton output axis, producing three by one. The values agree
          while their shapes differ, which matters to the next operation.
        hold: 0.8
        visual_cues:
          - id: request-column
            phrase: producing three by one
            targets:
              - request-shape
            color: green
            linger: 0.45
  - id: many-outputs
    title: A second column creates a second output
    visual: Open X/W/Y matrices share feature identities. Follow B through the time column
      first, then priority, before filling the other request/output cells. Compute every
      shown value from X@W.
    beats:
      - say: Add an arbitrary priority score beside response seconds. The weight matrix has one
          column for each output. Its prompt row is two, point two; its queue row is
          one, one point five. Priority uses supplied score units rather than a
          probability or a trained decision boundary.
        hold: 0.8
      - say: Keep request B at two, one. Its time column gives five seconds. Its priority column
          gives two times point two plus one times one point five, or one point nine.
          The same input row now owns two outputs. The two input features contract
          separately for every output column.
        hold: 0.8
        visual_cues:
          - id: request-b-time
            phrase: Its time column gives five seconds
            targets:
              - two-output-result
            color: green
            linger: 0.45
          - id: priority-first
            phrase: two times point two
            targets:
              - priority-contributions
            color: blue
            linger: 0.45
          - id: priority-second
            phrase: one times one point five
            targets:
              - priority-contributions
            color: pink
            linger: 0.45
          - id: request-b-priority
            phrase: or one point nine
            targets:
              - two-output-result
            color: green
            linger: 0.45
      - say: For all requests, the output rows are two and point two, five and one point nine,
          seven and two point one. Three requests by two input features times two input
          features by two outputs leaves three by two. Our row-vector convention puts
          the input-feature axis first in the weight matrix.
        hold: 0.8
        visual_cues:
          - id: request-all-outputs
            phrase: two and point two, five and one point nine, seven and two point one
            targets:
              - two-output-result
            color: green
            linger: 0.45
  - id: shape-guard
    title: Count matching inputs before doing arithmetic
    visual: Expose an incompatible third weight row with no matching feature. Reject it,
      replace the mistaken contract with the compatible operator, and distinguish
      rank/ndim from matrix rank and memory layout.
    beats:
      - say: Suppose a replacement matrix expects three input features while every request still
          supplies two. Three by two times three by two has meeting sizes two and three.
          The unmatched third coefficient has no supplied input. The product is invalid;
          a transpose cannot manufacture a missing measurement.
        hold: 0.8
      - say: Name requests, input features and output features before choosing a repair. Restore
          the matrix that consumes these two documented features, or supply a genuinely
          defined third feature if the model requires one. Changing an array solely
          until its sizes fit can preserve the original semantic mistake.
        hold: 0.8
        visual_cues:
          - id: shape-repair
            phrase: Restore the matrix that consumes these two documented features
            targets:
              - shape-map
            color: yellow
            linger: 0.45
      - say: In array code, tensor rank often means number of axes, available as ndim. A matrix
          therefore has array rank two even when its rows repeat. Matrix rank instead
          counts independent directions. Shape also leaves storage strides and memory
          layout unspecified. Keep these meanings distinct when reading an error or a
          model description.
        hold: 0.8
        visual_cues:
          - id: shape-rank
            phrase: even when its rows repeat
            targets:
              - shape-guard-mechanism
            color: cyan
            linger: 0.45
  - id: broadcasting
    title: An offset must belong to the intended axis
    visual: Copy each feature bias down its own column, then run the wrong row-specific
      broadcast on the same output. Both shapes remain3×2 while B’s time differs; the
      correction keeps feature ownership.
    beats:
      - say: Add a time offset of point one and a priority offset of minus point one. A
          two-entry bias belongs to output features and repeats across request rows. For
          B, five and one point nine become five point one and one point eight. The
          feature order remains time, then priority.
        hold: 0.8
        visual_cues:
          - id: feature-bias
            phrase: For B, five and one point nine become five point one and one point eight
            targets:
              - bias-result
            color: green
            linger: 0.45
      - say: "Now try three row offsets: point one, minus point one and zero, stored as three by
          one. Each repeats across both features of its request. B becomes four point
          nine and one point eight. Both results still have shape three by two. Their
          equal shape hides a different meaning."
        hold: 0.8
        visual_cues:
          - id: row-bias
            phrase: B becomes four point nine and one point eight
            targets:
              - bias-result
            color: pink
            linger: 0.45
      - say: Broadcasting compares sizes from the right. Equal sizes match, and a size of one
          can expand; missing leading axes act as ones. For a strict feature-bias
          contract, require one dimension whose length equals output width, and check
          known values. Those checks still need the documented order of the bias
          entries.
        hold: 0.8
        visual_cues:
          - id: broadcast-diagnosis
            phrase: require one dimension whose length equals output width
            targets:
              - bias-contract
            color: green
            linger: 0.45
  - id: pairwise-scores
    title: A transpose turns owned token rows into score columns
    visual: Return to the original three word vectors. Physically exchange the token and
      feature axes, then form each dot-product cell with persistent row/column word
      labels; retain the diagonal self-scores.
    beats:
      - say: "Return to our original word states: reset is one, zero; my is zero, one; password
          is one half, one half. Compare every word with every word. Turn a copy of the
          token matrix so its token rows become columns. Three by two times two by three
          creates a three-by-three score grid."
        hold: 0.8
        visual_cues:
          - id: score-transpose
            phrase: Turn a copy of the token matrix so its token rows become columns
            targets:
              - score-transposed
            color: yellow
            linger: 0.45
      - say: Each row and column names a token position. Reset with itself gives one; reset with
          my gives zero; reset with password gives one half. Password with itself gives
          one quarter plus one quarter, or one half. These are raw dot products,
          computed from both direction and vector length.
        hold: 0.8
        visual_cues:
          - id: score-grid
            phrase: Reset with itself gives one; reset with my gives zero; reset with password gives
              one half. Password with itself gives one quarter plus one quarter, or one
              half
            targets:
              - score-result
            color: green
            linger: 0.45
      - say: Each diagonal entry is its token vector’s squared length. The grid is symmetric
          because we compared the same real vectors on both sides. Later attention can
          use different query and key projections, so that symmetry is specific to this
          self-comparison. Its raw scores will also need scaling, masking and
          normalization before becoming attention shares.
        hold: 0.8
        visual_cues:
          - id: score-diagonal
            phrase: Each diagonal entry is its token vector’s squared length
            targets:
              - score-result
            color: green
            linger: 0.45
  - id: normalized-scores
    title: Remove length before comparing directions
    visual: On equal-unit axes, double password’s arrow along the same ray and grow its
      projected shadow. Normalize nonzero arrows; the self-score becomes1. Keep
      zero-vector direction unavailable.
    beats:
      - say: "The Euclidean length of password’s vector is the square root of one half, about
          point seven zero seven. Its dot product with the unit horizontal direction is
          one half. Double the vector to one, one: the angle stays fixed, while that dot
          product doubles to one."
        hold: 0.8
        visual_cues:
          - id: length-double
            phrase: Double the vector to one, one
            targets:
              - length-scaled
            color: yellow
            linger: 0.45
      - say: For nonzero vectors, divide the dot product by both lengths to obtain cosine
          similarity. Both arrows have cosine one over square root of two with the
          horizontal reference. Normalizing every token vector to length one makes every
          self-score one. Positive rescaling preserves direction but changes the raw dot
          product.
        hold: 0.8
        visual_cues:
          - id: unit-normalize
            phrase: Normalizing every token vector to length one
            targets:
              - length-scaled
            color: yellow
            linger: 0.45
      - say: Perpendicular directions have cosine zero; opposite directions have cosine minus
          one. The zero vector has no direction, so dividing by its length is undefined.
          Our article program rejects zero-length rows before cosine normalization. A
          production system must choose and document its zero-vector policy rather than
          conceal an invalid denominator.
        hold: 0.8
        visual_cues:
          - id: cosine-perpendicular
            phrase: Perpendicular directions have cosine zero
            targets:
              - cosine-perpendicular
            color: blue
            linger: 0.45
          - id: cosine-opposite
            phrase: opposite directions have cosine minus one
            targets:
              - cosine-opposite
            color: pink
            linger: 0.45
          - id: zero-direction
            phrase: The zero vector has no direction
            targets:
              - zero-direction
            color: yellow
            linger: 0.45
  - id: batched-transpose
    title: Equal sizes can conceal the wrong axis swap
    visual: Show two labeled prompt-owned score grids. Reverse all axes in a separate wrong
      branch with equal sizes, compare actual diagonals against squared lengths, and
      repair by swapping only the final two axes.
    beats:
      - say: A batch has prompt, token and feature axes. To compare tokens within each prompt,
          swap only the last two axes on the right operand. Batch, tokens, features
          times batch, features, tokens produces a separate token-by-token score grid
          for each prompt. The prompt owner stays attached.
        hold: 0.8
      - say: NumPy dot-T reverses every axis. On a three-axis tensor it moves the prompt axis as
          well. When sizes differ, multiplication may fail. When all three sizes are
          two, both the wrong and correct expressions can run and return two by two by
          two. Matching the output shape is then insufficient.
        hold: 0.8
        visual_cues:
          - id: batch-reverse
            phrase: both the wrong and correct expressions can run and return two by two by two
            targets:
              - batch-score-0
            color: pink
            linger: 0.45
      - say: Check values as well as shapes. In the article’s two-token fixture, the first
          prompt’s expected self-scores are one and one half. Reversing every axis
          instead produces one and one quarter. Swapping only the feature and token axes
          restores the correct diagonal. Each token’s squared length provides an
          independent check.
        hold: 0.8
        visual_cues:
          - id: batch-diagonal
            phrase: Reversing every axis instead produces one and one quarter
            targets:
              - batch-diagonal-result
            color: pink
            linger: 0.45
          - id: batch-repair
            phrase: Swapping only the feature and token axes restores the correct diagonal
            targets:
              - batch-score-0
            color: green
            linger: 0.45
  - id: pooling
    title: A mean removes token positions and forgets their order
    visual: The same three projected word rows contribute into an accumulator one at a time.
      Divide by the actual count, then permute rows and retain the unchanged prompt
      summary.
    beats:
      - say: We have one projected vector per word. To construct one summary per prompt, add its
          token vectors and divide by its number of tokens. This mean removes the token
          axis. Batch and output-feature axes remain. In NumPy, mean along axis one
          performs that reduction for our batch-token-feature convention.
        hold: 0.8
      - say: For the first request, projected reset is one, zero, one half; my is zero, one, one
          half; password is one half, one half, one half. Their sum is one point five in
          each coordinate. Dividing by three gives one half, one half, one half.
        hold: 0.8
        visual_cues:
          - id: pool-reset
            phrase: projected reset is one, zero, one half
            targets:
              - pool-accumulation
            color: blue
            linger: 0.45
          - id: pool-my
            phrase: my is zero, one, one half
            targets:
              - pool-accumulation
            color: pink
            linger: 0.45
          - id: pool-password
            phrase: password is one half, one half, one half
            targets:
              - pool-accumulation
            color: cyan
            linger: 0.45
          - id: pool-sum
            phrase: Their sum is one point five in each coordinate
            targets:
              - pool-result
            color: green
            linger: 0.45
          - id: pool-result
            phrase: Dividing by three gives one half, one half, one half
            targets:
              - pool-result
            color: green
            linger: 0.45
      - say: Reorder those token rows and repeat the sum. Addition gives the same result, so a
          shared pointwise projection followed by this mean cannot distinguish
          permutations of the same token vectors. Position information and interactions
          between positions are separate modeling choices. Shape checks alone cannot
          make an order-insensitive summary understand word order.
        hold: 0.8
        visual_cues:
          - id: pool-permute
            phrase: Reorder those token rows and repeat the sum
            targets:
              - pool-owned-rows
            color: blue
            linger: 0.45
  - id: padding-mask
    title: Count real tokens when forming a mean
    visual: Retain two real positions and append two explicitly invalid zero rows. Contrast
      the diluted four-position divisor with the mask-selected two-position divisor,
      then expose the all-padding denominator failure.
    beats:
      - say: "Batches often add padding so prompts have equal length. Take two real vectors,
          one, zero and zero, one. Their mean is one half, one half. Append two zero
          rows and divide by the padded length four: the plain mean shrinks to one
          quarter, one quarter."
        hold: 0.8
        visual_cues:
          - id: padding-add
            phrase: Append two zero rows and divide by the padded length four
            targets:
              - padding-input
            color: pink
            linger: 0.45
      - say: A boolean validity mask keeps the two real positions. Give the mask a singleton
          feature axis so each validity bit governs its whole vector. Select real
          values, sum them and divide by the count of real tokens. The masked mean
          returns one half, one half even though four positions are stored.
        hold: 0.8
        visual_cues:
          - id: padding-select
            phrase: divide by the count of real tokens
            targets:
              - padding-divisor
            color: green
            linger: 0.45
      - say: An all-padding prompt has zero real tokens, so reject it before dividing. Require
          the boolean mask to match batch and token sizes. The article selects with
          where, which avoids keeping excluded padding values. Real-token numbers still
          need valid numeric data. Padding exclusion and sensitivity to word order are
          different properties.
        hold: 0.8
        visual_cues:
          - id: padding-empty
            phrase: reject it before dividing
            targets:
              - padding-empty
            color: pink
            linger: 0.45
  - id: input-guards
    title: Validate the array before trusting its contract
    visual: "Build the actual project_prompts decision path from nested values: numeric
      rectangular conversion, rank checks, feature agreement, nonempty axes, and the
      surviving projected tensor. Run each malformed input through its actual failed
      boundary."
    beats:
      - say: Our runnable helper first converts the nested inputs into rectangular numeric
          arrays. A ragged row with a missing feature must fail at conversion. Looking
          only at the first token would miss that defect. After conversion, require
          three hidden-state axes and two projection axes.
