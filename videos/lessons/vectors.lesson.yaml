            color: pink
            linger: 0.45
      - say: Compare the last hidden width with the first projection width, then reject empty
          axes for this exercise. Only after those checks perform the shared multiply.
          The same helper returns every projected token, so a later explicit mean can
          choose whether to keep or remove the sequence axis.
        hold: 0.8
        visual_cues:
