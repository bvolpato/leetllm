  - id: linear-api
    title: A library may store the same map transposed
    visual: Retain P’s numeric coefficients while placing their transposed arrangement into
      a real Linear weight. Multiply with weight.T, then repeat one bias across owned
      token rows. Keep input/output feature labels visible.
    beats:
      - say: PyTorch Linear stores its weight as output features by input features. Our
          row-vector map P has two input rows and three output columns. The library
          stores the transposed coefficients, three by two, and computes input times
          weight transpose plus bias. Adding a fixed bias to a linear map makes an
          affine map.
        hold: 0.8
        visual_cues:
          - id: linear-store
            phrase: The library stores the transposed coefficients, three by two
            targets:
              - linear-stored
            color: cyan
            linger: 0.45
      - say: Linear with two input features and three outputs accepts batch, token, two directly
          and returns batch, token, three. Its bias has three entries and repeats across
          the leading positions. You can preserve both prompt and token axes without
          flattening them. Inspect axis meanings before adding a transpose.
        hold: 0.8
        visual_cues:
          - id: linear-bias
            phrase: Its bias has three entries and repeats across the leading positions
            targets:
              - linear-bias
            color: pink
            linger: 0.45
      - say: Neural networks learn these coefficients through training. Our supplied matrix
          explains the arithmetic without a training claim. Making two input coordinates
          into three outputs still combines the same two inputs; the third output here
          equals half the sum of the first two. To measure independent directions, the
          next linear algebra lesson introduces matrix rank and singular values.
        hold: 0.8
