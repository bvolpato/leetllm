      - say: Look at the pieces we just used. A dictionary lets us ask for a named field. A list keeps the rows in
          visit order. A tuple lets a function return the matches, total and fraction together. The label is
          text, the counts are integers, division gives a float and each comparison gives a Boolean. None
          expresses an absent value.
        hold: 0.7
        visual_cues:
          - id: py-value-types-0
            phrase: A dictionary lets us ask for a named field. A list keeps the rows in visit order. A tuple lets a
              function return the matches, total and fraction together. The label is text, the counts are
              integers, division gives a float and each comparison gives a Boolean. None expresses an absent
              value.
            targets:
