          while the total fell. Open the input diff. That minus sign identifies the request B dropped.
          Restore the line before you compare models on this fixture.
        hold: 1.3
        visual_cues:
          - id: follow-request
            phrase: Read down the column for request one hundred two
            targets: [request-102, run-names]
            color: cyan
            linger: 1
          - id: fixture-fails
            phrase: The assertion fails
            targets:
              - fixture-assertion
            color: pink
            linger: 0.35
            caption_boundary: true
          - id: inspect-input-diff
            phrase: Open the input diff
            targets: [input-diff, request-102]
            color: yellow
            linger: 0.7
  - id: locked-replay
    title: Would the same command run on a clean machine?
    visual: An undeclared installation of six survives a locked run. Exact sync removes the installation, and a
      second import fails. The input file remains separate from the dependency lock.
    beats:
      - say: The dependency lock answers a different question. With uv run, an extra installed package can remain in
          the current environment. Uv sync, by default, removes packages that are not selected. Adding
          locked to a command makes it check that the lock agrees with the project. The choice between run
          and sync still matters.
        hold: 0.65
        visual_cues:
          - id: py-locked-replay-0
            phrase: The dependency lock answers a different question
            targets:
              - py-locked-replay-mechanism
            color: cyan
            linger: 0.35
          - id: py-locked-inexact
            phrase: an extra installed package can remain
            targets:
              - py-locked-replay-mechanism
            color: cyan
            linger: 0.35
          - id: py-locked-exact
            phrase: removes packages that are not selected
            targets:
              - py-locked-replay-mechanism
            color: cyan
            linger: 0.35
      - say: Try it in the lab's disposable environment. Someone manually installs an undeclared helper package.
          Locked run can import it from that environment. After locked sync removes the extra installation,
          the same import fails. If your program needs this helper, declare it, then review the change to
          the lock. A copy made before the sync would include that helper's files. On the other machine,
          rebuild the environment from the project files.
        hold: 0.7
        visual_cues:
          - id: py-locked-replay-1
            phrase: Try it in the lab's disposable environment
            targets:
              - py-locked-replay-mechanism
            color: cyan
            linger: 0.35
          - id: py-locked-install
            phrase: manually installs an undeclared helper package
            targets:
              - py-locked-replay-mechanism
            color: cyan
            linger: 0.35
          - id: py-locked-import
            phrase: Locked run can import it from that environment
            targets:
              - py-locked-replay-mechanism
            color: cyan
            linger: 0.35
          - id: py-locked-remove
            phrase: After locked sync removes the extra installation
            targets:
              - py-locked-replay-mechanism
            color: cyan
            linger: 0.35
          - id: py-locked-missing
            phrase: the same import fails
            targets:
              - py-locked-replay-mechanism
            color: cyan
            linger: 0.35
          - id: py-locked-declare
            phrase: declare it, then review the change to the lock
            targets:
              - py-locked-replay-mechanism
            color: cyan
            linger: 0.35
      - say: Replay the command from a clean checkout or sync the environment first. Keep the code, input file and
          command with the interpreter pin and dependency records. Our scorer has no randomness. When a
          later program draws random values, record which generator it uses and its seed. Hardware and
          library differences can still change the result. Let's try the scorer once more, with a file we
          haven't seen.
        hold: 0.85
        visual_cues:
          - id: py-locked-replay-2
            phrase: Replay the command from a clean checkout or sync the environment first
            targets:
              - py-locked-replay-mechanism
            color: cyan
            linger: 0.35
  - id: fresh-input-receipt
    title: What will this file print?
    visual: A blank line keeps its physical position. Four IDs enter the loader before it stops on line six.
      A producer record supplies the replacement. After a fresh load, five decisions stay above an empty
      output window while the viewer predicts the receipt. The metric and the gate message then appear on
      their respective output streams. After the gate fails, each False leads back to a request ID.
    beats:
      - say: This file starts with a blank line. Watch the loader take the next four requests. On the last
          line the expected label is in quotes. Look at the prediction beside it. When you run this file,
          what reaches standard output?
        hold: 2.45
        visual_cues:
          - id: py-fresh-scan
            phrase: Watch the loader take the next four requests
            targets:
              - load-list
            color: cyan
            linger: 0.35
      - say: JSON true decodes successfully to a Boolean. The parser asks for a string. On physical line six it
          raises TypeError. Look at those four IDs the loader already had. The function stopped before it
          could return that list. Main prints no metric. Where would you look to find out what the model
          actually said?
        hold: 2.1
        visual_cues:
          - id: py-fresh-decode
            phrase: JSON true decodes successfully to a Boolean
            targets:
              - load-list
            color: cyan
            linger: 0.35
            caption_boundary: true
          - id: py-fresh-error
            phrase: On physical line six it raises TypeError
            targets:
              - prediction-505
              - load-list
              - command-status
            color: pink
            linger: 0.35
            caption_boundary: true
          - id: py-fresh-no-metric
            phrase: Main prints no metric
            targets:
              - load-list
              - printed-receipt
            color: blue
            linger: 0.35
            caption_boundary: true
      - say: Open the producer's log for that same request. The saved label was the text open. Restore that
          word to the file. The expected label stays blocked. Start again and load all five requests. Now
          the scorer can compare the labels in order. You have every decision it will use. With the floor
          still at two thirds, what score will print, and will the command pass?
        hold: 3
        visual_cues:
          - id: py-fresh-open
            phrase: The saved label was the text open
            targets:
              - producer-record
            color: blue
            linger: 0.35
            caption_boundary: true
          - id: py-fresh-repair
            phrase: Restore that word to the file
            targets:
              - producer-record
              - prediction-505
            color: cyan
            linger: 0.35
          - id: py-fresh-reload
            phrase: Start again and load all five requests
            targets:
              - load-list
            color: cyan
            linger: 0.35
          - id: py-fresh-score
            phrase: Now the scorer can compare the labels in order
            targets:
              - load-list
            color: cyan
            linger: 0.35
      - say: Follow the five decisions back to the request IDs. Each False still takes a place. Three
          matches out of five. That score goes to standard output. For the floor, triple the matches and
          double the total. Nine is one short of ten. The two-thirds gate fails. This time you get a
          metric before the command exits. On the first run the loader never returned. Look back at the
          five decisions. Which two requests would you inspect to understand this score?
        hold: 2.5
        visual_cues:
          - id: py-fresh-count
            phrase: Three matches out of five
            targets:
              - load-list
              - printed-receipt
            color: cyan
            linger: 0.35
            caption_boundary: true
          - id: gate-products
            phrase: Nine is one short of ten
            targets: [gate-comparison]
            color: blue
            linger: 0.35
            caption_boundary: true
          - id: py-fresh-floor
            phrase: the two-thirds gate fails
            targets:
              - gate-comparison
              - command-status
            color: pink
            linger: 0.35
            caption_boundary: true
      - say: Follow each False back to its request. Five hundred two and five hundred five both had usable
          labels, and both comparisons failed. You can take those two records back to the model team.
          These decisions could form an array with one entry per request. In the NumPy lesson we'll use
          that same habit to trace which word each row of an array belongs to.
        hold: 1.45
        visual_cues:
          - id: trace-misses
            phrase: Follow each False back to its request
            targets: [load-list, request-502, request-505]
            color: pink
            linger: 0.5
          - id: request-axis
            phrase: one entry per request
            targets: [load-list]
            color: blue
            linger: 0.35
