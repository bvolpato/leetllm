            phrase: None expresses an absent value
            targets:
              - py-value-types-mechanism
            color: cyan
            linger: 0.35
      - say: Read the three sevens. The quotes are part of the evidence. The integer and float compare equal
          numerically, while text seven does not. Use a key to read a dictionary field and an index to read
          a position in a list. Python lets a name refer to another value on the next assignment. Rebinding
          the name leaves the saved field alone.
        hold: 0.7
        visual_cues:
          - id: py-value-types-1
            phrase: Read the three sevens
            targets:
              - py-value-types-mechanism
            color: cyan
            linger: 0.35
          - id: py-types-equal
