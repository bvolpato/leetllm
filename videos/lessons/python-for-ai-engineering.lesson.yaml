scenes:
  - id: opening
    title: What happened to request 102?
    visual: Three requests sit beside their score. Removing the mismatch changes two out of three to
      two out of two. The removed row returns in close-up with its two raw strings and an open comparison.
    beats:
      - say: Two of these three predictions match. Take out the middle row. Both matches are still there,
          and now Python gives them a perfect score.
        hold: 1.1
        visual_cues:
          - id: drop-middle
            phrase: Take out the middle row
            targets: [scored-rows, accuracy]
            color: pink
            linger: 0.3
      - say: Put that row back. The expected label is blocked. The model saved escalated, with capitals
          and a space at each end. Python trims both labels and compares them in lowercase. Will it record
          True or False for this row?
        hold: 2
        visual_cues:
          - id: expected-field
            phrase: The expected label is blocked
            targets: [row-comparison]
            color: blue
            linger: 0.25
          - id: saved-field
            phrase: The model saved escalated
            targets: [row-comparison]
            color: cyan
            linger: 0.25
          - id: opening-predict
            phrase: Will it record True or False for this row
            targets: [row-comparison]
            color: cyan
            linger: 1.4
            caption_boundary: true
  - id: row-values
    title: Follow line two into Python
    visual: Actual json.loads creates a dict. The original row remains visible while strip contracts a string
      box, lower changes its letters, and equality reveals the Boolean only at its spoken clause.
    beats:
      - say: The file gives us a line of text. The call to json dot loads decodes it into a Python dictionary. The
          equals sign binds that object to row. A dictionary lets you look up a value by name. The brackets
          around prediction take us straight to the saved label.
        hold: 0.55
        visual_cues:
          - id: decode-row
            phrase: decodes it into a Python dictionary
            targets:
              - python-row
            color: cyan
            linger: 0.45
          - id: loads-name
            phrase: binds that object to row
            targets:
              - loads-call
            color: blue
            linger: 0.45
      - say: Keep an eye on the saved field while we normalize its value under a new name. Strip removes the spaces
          at its two ends. Lower then changes the capitals to lowercase. These methods return strings. The
          capitals are still there in the dictionary. We apply both methods to the expected label too.
        hold: 0.65
        visual_cues:
          - id: strip-label
            phrase: Strip removes the spaces at its two ends
            targets:
              - raw-values
              - normalized-prediction
            color: yellow
            linger: 0.45
          - id: lower-label
            phrase: Lower then changes the capitals to lowercase
            targets:
              - raw-values
              - normalized-prediction
            color: green
            linger: 0.45
        motion_check:
          region:
            - 1150
            - 320
            - 630
            - 210
          minimumChangedFraction: 0.002
      - say: Read the two words Python has after stripping and lowercasing. In this expression the double
          equals sign compares two values. The single equals sign gives the answer a name. The Boolean
          is False. That adds zero to the number of matches. How many places should this request take in
          the list of results?
        hold: 1.6
        caption_starts:
          - The Boolean is False
        visual_cues:
          - id: compare-labels
            phrase: the Boolean is False
            targets:
              - comparison
            color: yellow
            linger: 0.45
          - id: compare-expression
            phrase: double equals sign compares two values
            targets:
              - equality-code
              - comparison
            color: cyan
            linger: 0.45
  - id: batch
    title: Where does False go?
    visual: The actual indented loop executes for each retained row. One result slot grows for each append; the
      owner remains selected until completion. Aggregation then evaluates sum, len and division in order.
    beats:
      - say: Here's the loop. On each visit, row refers to one dictionary. Python runs the indented lines for that
          row before moving on. The first pair matches, so append True. Request one hundred two differs, so
          append False. The final pair matches, so append True. Look where the middle result landed.
        hold: 0.75
        visual_cues:
          - id: append-first
            phrase: The first pair matches, so append True
            targets:
              - result-list
            color: green
            linger: 0.45
          - id: append-second
            phrase: Request one hundred two differs, so append False
            targets:
              - result-list
            color: pink
            linger: 0.45
          - id: append-third
            phrase: The final pair matches, so append True
            targets:
              - result-list
            color: green
            linger: 0.45
        motion_check:
          region:
            - 500
            - 750
            - 1120
            - 170
          minimumChangedFraction: 0.002
      - say: Adding those Booleans counts each True as one and False as zero, giving two matches. Len counts all
          three Booleans. The middle request takes up a place just like its neighbors. Divide the counts to
          get two thirds. Python prints the fraction to three decimal places. We'll need the two integers
          again.
        hold: 1.1
        visual_cues:
          - id: sum-results
            phrase: giving two matches
            targets:
              - count-receipt
            color: green
            linger: 0.45
          - id: count-results
            phrase: Len counts all three Booleans
            targets:
              - count-receipt
            color: blue
            linger: 0.45
          - id: divide-counts
            phrase: Divide the counts to get two thirds
            targets:
              - count-receipt
            color: yellow
            linger: 0.45
  - id: value-types
    title: What did Python receive?
