  - id: jsonl-boundary
    title: Where does line two stop?
    visual: Three versions of the same line share fixed columns for decoding, field checks and comparison. The
      original reaches False. A bare seven passes decoding. Deleting the seven leaves the decoder with no
      value.
    beats:
      - say: Yesterday's row made it all the way to a comparison. In a copy of the file, replace the prediction with
          a bare seven. Look at the quotes on the line above. Seven is legal JSON too. Decoding produces a
          dictionary with an integer value. Will that seven ever reach the comparison?
        hold: 2
        caption_starts:
          - Decoding produces a dictionary with an integer value
        visual_cues:
          - id: parse-number
            phrase: decoding produces a dictionary with an integer value
            targets:
              - decoded-number
            color: yellow
            linger: 0.45
      - say: Now look at the field check. Each of the three required fields must be a string with at least
          one character left after stripping whitespace. Python found the field. Its value is an integer,
          so the type check tells Python to raise TypeError. The message
          gives us line two and the name prediction. There’s no Boolean for this row because the loader
          stopped here.
        hold: 1.05
        caption_starts:
          - Raise TypeError
        visual_cues:
          - id: reject-number
            phrase: raise TypeError
            targets:
              - boundary-error
            color: pink
            linger: 0.45
      - say: Keep the rest of the line and erase the seven. The closing brace comes immediately after the colon.
          This time the line fails inside json dot loads. The loader adds line two to that error. Look
          across the three versions. The original gives the scorer two text labels to compare. The middle
          line tells us someone saved a seven. On the last line, decoding stopped before we even had a field
          to check.
        hold: 1.1
        caption_starts:
          - This time the line fails inside json dot loads
        visual_cues:
          - id: syntax-error
            phrase: fails inside json dot loads
            targets:
              - boundary-error
            color: pink
            linger: 0.45
  - id: decoder-policy
    title: What survives decoding?
    visual: A read head follows the two occurrences of prediction on one line. The default decoder writes
      twice to one value slot. Replaying the same pair order through a strict hook puts the incoming name
      beside an earlier occurrence and stops the handoff to the scorer. An edited copy drops just the
