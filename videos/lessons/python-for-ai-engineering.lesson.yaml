  - id: copies
    title: Which edit reaches the baseline?
    visual: Each experiment starts with a fresh normalized one-row baseline. Real aliasing, outer list copy and
      row copy determine which dictionary the actual mutation reaches.
    beats:
      - say: Start a fresh row with the two normalized labels from request one hundred two. The expected
          label is blocked and the prediction is escalated. Give the baseline list a second name, trial.
          Follow both arrows before you edit. Now set the trial
          prediction to blocked. Read it back through baseline. Both names lead to the dictionary you just
          changed.
        hold: 1
        visual_cues:
          - id: alias-list
            phrase: Give the baseline list a second name, trial
            targets:
              - reference-graph
            color: blue
            linger: 0.45
          - id: mutate-alias
            phrase: Now set the trial prediction to blocked
            targets:
              - shared-row
            color: yellow
            linger: 0.45
      - say: Reset to escalated and copy the outer list. You can see two lists now. Follow slot zero in either one.
          Run the same mutation through trial. Both arrows still end at the same dictionary, so baseline
          reads blocked again.
        hold: 0.8
        visual_cues:
          - id: copy-list
            phrase: copy the outer list
