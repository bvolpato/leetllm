            color: yellow
            linger: 0.45
      - say: Reset again. This comprehension copies each row into a new list. Now mutate the copied row. This time
          the baseline keeps escalated. Every value in this row is a string. What if one field held a list
          we could append to?
        hold: 1.25
        visual_cues:
