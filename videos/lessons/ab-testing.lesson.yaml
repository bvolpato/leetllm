scenes:
  - id: intro
    title: The rewrite sounds better. Did it help?
    visual: A recovery question becomes a measurable outcome. Two distinct incident objects then enter their
      hash-assigned experiment groups.
    beats:
      - say: An on-call engineer asks an incident assistant how to recover a payment service. A rewritten search query
          brings back a clearer runbook, and the answer reads well. The real question is whether the change
          helps engineers resolve more incidents while keeping evidence quality, speed, and escalation risk
          within their budgets. For a supplied miniature, the runbook says rollback requires owner
          acknowledgement. A candidate answer says acknowledgement alone authorizes rollback. The answer adds
          sufficiency that the cited sentence does not provide. This illustrates a grounding failure, not an
          actual service response or the later experiment counts.
        hold: 0.55
        visual_cues:
          - id: intro-beat-1-focus-1
            phrase: recover a payment service
            targets:
              - recovery-question
            color: yellow
            linger: 0.65
          - id: intro-beat-1-focus-2
            phrase: clearer runbook
            targets:
              - clearer-runbook
            color: cyan
            linger: 0.65
          - id: intro-beat-1-focus-3
            phrase: resolve more incidents
            targets:
              - resolution-outcome
            color: yellow
            linger: 0.65
          - id: intro-evidence
            phrase: the runbook says rollback requires owner acknowledgement
            targets:
              - intro-mechanism
            linger: 0.45
          - id: intro-overclaim
            phrase: The answer adds sufficiency
            targets:
              - intro-mechanism
            linger: 0.45
      - say: We can answer with an experiment. Eligible incidents are assigned to the current raw query or a rewrite.
          The model, index, decoder, and answer policy stay fixed, so the comparison has one intentional
          change.
        hold: 0.6
        motion_check:
          region:
            - 260
            - 390
            - 800
            - 380
          minimumChangedFraction: 0.002
        visual_cues:
          - id: intro-beat-2-focus-1
            phrase: Eligible incidents
            targets:
              - eligible-incidents
            color: yellow
            linger: 0.65
          - id: intro-beat-2-focus-2
            phrase: current raw query or a rewrite
            targets:
              - experiment-arms
            color: cyan
            linger: 0.65
      - say: A/B testing turns a product decision into a measurement plan. We’ll define who enters, what counts as a
          resolved incident, how uncertainty changes the result, and which guardrail could keep a promising
          treatment from launching.
        hold: 0.75
        visual_cues:
          - id: intro-beat-3-focus-1
            phrase: A/B testing turns a product decision
            targets:
              - experiment-arms
            color: yellow
            linger: 0.65
  - id: randomize
    title: Assign each incident once
    visual: An incident ID is randomized into a sticky arm; its later messages inherit that same policy.
    beats:
      - say: Make the incident ID the randomization unit. A hash or random assignment sends each eligible incident to
          control or treatment, then keeps the choice for its later messages. That gives each incident one
          well-defined policy to experience.
        hold: 0.55
        visual_cues:
          - id: randomize-unit
            phrase: incident ID
            targets:
              - incident-identity
            color: yellow
            linger: 0.65
          - id: randomize-hash
            phrase: A hash or random assignment
            targets:
              - experiment-hash
            color: cyan
            linger: 0.65
          - id: randomize-arm
            phrase: control or treatment
            targets:
              - stored-assignment
            color: yellow
            linger: 0.65
          - id: randomize-inherit
            phrase: later messages
            targets:
              - inherited-assignment
            color: cyan
            linger: 0.65
      - say: If messages changed arms mid-incident, an answer from one policy could affect the next message scored
          under the other. The outcomes would mix both experiences. Assigning the whole incident keeps the
          experimental contrast meaningful.
        hold: 0.6
        motion_check:
          region:
            - 170
            - 515
            - 1600
            - 390
          minimumChangedFraction: 0.002
        visual_cues:
          - id: randomize-beat-2-focus-1
            phrase: If messages changed arms mid-incident
            targets:
              - inherited-assignment
            color: yellow
            linger: 0.65
          - id: randomize-beat-2-focus-2
            phrase: Assigning the whole incident
            targets:
              - incident-unit
              - stored-assignment
            color: cyan
            linger: 0.65
      - say: Randomization supports a causal comparison when assignment is implemented correctly, outcomes are
          measured consistently, and each incident’s outcome is independent of other incidents’ assignments.
          Shared staff learning or overloaded compute can create interference, so monitor the setting as well
          as the assignment log.
        hold: 0.75
        visual_cues:
          - id: randomize-beat-3-focus-1
            phrase: assignment is implemented correctly
            targets:
              - experiment-hash
              - stored-assignment
            color: yellow
            linger: 0.65
          - id: randomize-beat-3-focus-2
            phrase: monitor the setting
            targets:
              - incident-unit
            color: cyan
            linger: 0.65
  - id: unit-and-interference
    title: Name the effect and the paths that mix exposure
    visual: The raw canary question and its supplied rewrite share one pinned generator receipt. Two incident
      identities then exchange learned procedure or compete for a shared worker.
    beats:
      - say: Keep the actual policy contrast visible. Control retrieves from the raw canary question. Treatment uses
          the query canary rollback error-rate policy owner acknowledgement. The rewrite policy forbids adding
          unsupported thresholds, but its outputs still need auditing. Both paths use the same runbook
          snapshot, generator prompt, model and greedy decoder schema. The estimand is the average effect of
          assignment to that rewrite policy among eligible incidents, including its delays and failures. A
          deliberate factorial experiment could study several changes; an unplanned decoder difference cannot
          isolate this one.
        hold: 0.55
        visual_cues:
          - id: unit-and-interference-step-1
            phrase: including its delays and failures
            targets:
              - unit-and-interference-mechanism
            linger: 0.4
      - say: "SUTVA names two requirements: no interference between randomized units and no consequential hidden
          treatment versions. A technician can learn a rollback procedure from a treatment incident and apply
          it to a later control incident. Extra rewrite work can also delay control through shared compute.
          Randomizing teams may contain within-team learning, but it does not remove shared-infrastructure
          interference. Choose the unit for the intended effect and actual spillover pattern."
        hold: 0.55
        visual_cues:
          - id: unit-and-interference-step-2
            phrase: no consequential hidden treatment versions
            targets:
              - unit-and-interference-mechanism
            linger: 0.4
          - id: unit-learning
            phrase: A technician can learn
            targets:
              - unit-and-interference-mechanism
            linger: 0.45
          - id: unit-compute
            phrase: Extra rewrite work
            targets:
              - unit-and-interference-mechanism
            linger: 0.45
      - say: For equal clusters of twenty incidents with common intracluster correlation zero point one, the planning
          design effect is one plus nineteen times zero point one, or two point nine. This approximation
          inflates variance relative to independent outcomes. Unequal clusters and different estimators need a
          specific calculation. Analyze team-randomized data with team-aware inference. More messages cannot
          substitute for more independent teams. Salt assignment with the locked experiment version, prevent
          callers choosing favorable IDs, and retain the assigned arm on events. A hash does not force exactly
          equal counts.
        hold: 0.75
        visual_cues:
          - id: unit-and-interference-step-3
            phrase: two point nine
            targets:
              - unit-and-interference-mechanism
            linger: 0.4
          - id: unit-deff
            phrase: or two point nine
            targets:
              - unit-and-interference-mechanism
            linger: 0.45
  - id: metric
    title: Decide what a resolved incident means
    visual: An incident counts as resolved after a usable answer arrives within ten minutes and no new human page
      occurs before the deadline.
    beats:
      - say: Pick one primary outcome before traffic arrives. In this plan, an incident counts as resolved if it gets
          a usable answer within ten minutes and receives no new human escalation page through that deadline.
          Every enrolled incident remains in the denominator in its assigned arm.
        hold: 0.55
        visual_cues:
          - id: metric-beat-1-focus-1
            phrase: usable answer within ten minutes
            targets:
              - outcome-answer
              - outcome-deadline
            color: yellow
            linger: 0.65
          - id: metric-beat-1-focus-2
            phrase: no new human escalation page
            targets:
              - outcome-page
            color: cyan
            linger: 0.65
          - id: metric-beat-1-focus-3
            phrase: Every enrolled incident
            targets:
              - outcome-denominator
            color: yellow
            linger: 0.65
      - say: The outcome window matters. A treatment answer that arrives late, a missing answer, or an escalation near
          the deadline needs a predeclared rule. Wait until every ten-minute window matures before the
          fixed-horizon analysis.
        hold: 0.6
        visual_cues:
          - id: metric-beat-2-focus-1
            phrase: every ten-minute window matures
            targets:
              - outcome-deadline
            color: yellow
            linger: 0.65
      - say: This metric is a proxy for service recovery. An engineer can mark an answer useful while the service
          remains down; an appropriate escalation can protect users while counting as a metric failure.
          Validate the proxy against operational recovery and keep grounding, latency, and human pages as
          separate guardrails.
        hold: 0.75
        visual_cues:
          - id: metric-beat-3-focus-1
            phrase: proxy for service recovery
            targets:
              - outcome-answer
            color: yellow
            linger: 0.65
          - id: metric-beat-3-focus-2
            phrase: counting as a metric failure
            targets:
              - resolution-rule
            color: cyan
            linger: 0.65
  - id: event-maturity
    title: Move the same incident through its outcome deadline
    visual: Stable incident timelines retain usable-answer and page events across the ten-minute boundary. A
      rewrite timeout remains in its originally assigned denominator.
    beats:
      - say: Follow three supplied incident clocks. A usable mark at minute eight with no new page through ten
          qualifies. The same mark with a new page exactly at minute ten fails. A page first arriving at
          minute eighteen does not disqualify this ten-minute metric. At minute nine the outcome is pending,
          even if the answer is already useful. Keep pending distinct from an observed failure.
        hold: 0.55
        visual_cues:
          - id: event-maturity-step-1
            phrase: At minute nine the outcome is pending
            targets:
              - event-maturity-mechanism
            linger: 0.4
          - id: maturity-eight
            phrase: usable mark at minute eight
            targets:
              - event-maturity-mechanism
            linger: 0.45
          - id: maturity-ten
            phrase: exactly at minute ten
            targets:
              - event-maturity-mechanism
            linger: 0.45
          - id: maturity-eighteen
            phrase: at minute eighteen
            targets:
              - event-maturity-mechanism
            linger: 0.45
          - id: maturity-nine
            phrase: At minute nine
            targets:
              - event-maturity-mechanism
            linger: 0.45
      - say: "A genuinely absent usable mark after full observation is unresolved. Missing telemetry is a measurement
          problem that needs investigation. Keep a timed-out rewrite in its treatment arm: intention to treat
          estimates the effect of assignment, rather than selecting successful executions. Dropping timeouts
          can select a treatment-affected subset. It does not matter whether difficulty or overload caused the
          timeout; the randomized assignment target includes it. Intention to treat alone cannot reconstruct
          missing outcomes."
        hold: 0.55
        visual_cues:
          - id: event-maturity-step-2
            phrase: intention to treat estimates the effect of assignment
            targets:
              - event-maturity-mechanism
            linger: 0.4
      - say: Grounding audits need their own denominator. The compact launch fixture supplies a completed answer and
          the same blinded audit for each incident. A sampled audit requires its declared sampling design and
          audit denominator, not sampled failures divided by every enrolled incident. Predeclare how timeouts
          enter first-request p95 latency. Omitting unfinished slow requests can make a failing treatment look
          faster. The original page before enrollment is not a new escalation.
        hold: 0.75
        visual_cues:
          - id: event-maturity-step-3
            phrase: their own denominator
            targets:
              - event-maturity-mechanism
            linger: 0.4
  - id: lift
    title: Read the rate difference in the right units
    visual: Counts of 760/2,000 and 840/2,000 become 38% and 42%, with a two-arm uncertainty interval around four
      percentage points.
    beats:
      - say: In a compact teaching fixture, the raw-query arm resolves 760 of 2,000 incidents, or thirty-eight
          percent. The rewrite arm resolves 840 of 2,000, or forty-two percent. Subtract the rates and the
          observed absolute lift is four percentage points.
        hold: 0.55
        motion_check:
          region:
            - 180
            - 350
            - 750
            - 600
          minimumChangedFraction: 0.002
        visual_cues:
          - id: lift-beat-1-focus-1
            phrase: 760 of 2,000 incidents
            targets:
              - control-outcomes
            color: yellow
            linger: 0.65
          - id: lift-beat-1-focus-2
            phrase: 840 of 2,000
            targets:
              - treatment-outcomes
            color: cyan
            linger: 0.65
          - id: lift-beat-1-focus-3
            phrase: four percentage points
            targets:
              - absolute-lift
            color: yellow
            linger: 0.65
      - say: Relative lift asks how large that increase is compared with the thirty-eight-percent baseline. Four
          points divided by thirty-eight percent is about ten and a half percent. Percentage points report
          additional successes per hundred; percent reports a proportional change.
        hold: 0.6
        visual_cues:
          - id: lift-beat-2-focus-1
            phrase: Relative lift
            targets:
              - relative-lift
            color: yellow
            linger: 0.65
      - say: Incidents differ, so another experiment would produce different counts. For two independent
          binary-outcome arms, an approximate standard error adds the sampling variances from both rates. Here
          it is about one point five five points, giving a rough ninety-five-percent interval from one to
          seven points.
        hold: 0.75
        visual_cues:
          - id: lift-beat-3-focus-1
            phrase: standard error
            targets:
              - lift-standard-error
            color: yellow
            linger: 0.65
          - id: lift-beat-3-focus-2
            phrase: ninety-five-percent interval
            targets:
              - lift-interval
            color: cyan
            linger: 0.65
  - id: independent-units
    title: A duplicated outcome cannot supply new precision
    visual: One incident tile is copied into four message rows. Rates stay fixed while a fictitious denominator
      wrongly compresses the confidence interval.
    beats:
      - say: Copy every incident outcome into four message rows. Both success counts and denominators multiply by
          four, so thirty-eight and forty-two percent remain unchanged. Substituting four times the sample
          size into the independence formula halves the standard error without adding evidence. The article’s
          interval shrinks falsely from one through seven points to about two point five through five point
          five. Aggregate once per randomized incident before applying that calculation.
        hold: 0.55
        visual_cues:
          - id: independent-units-step-1
            phrase: halves the standard error
            targets:
              - independent-units-mechanism
            linger: 0.4
          - id: dup-four
            phrase: four message rows
            targets:
              - independent-units-mechanism
            linger: 0.45
          - id: dup-false-se
            phrase: halves the standard error
            targets:
              - independent-units-mechanism
            linger: 0.45
      - say: Build the independent-arm standard error from each arm’s rate times one minus that rate divided by its
          own incident count, then add and take the square root. Multiplying that standard error by one point
          nine six makes the normal-approximation margin. Across repeated suitable experiments the procedure
          targets ninety-five-percent coverage of the defined effect. It does not assign ninety-five-percent
          probability to this fixed true effect or predict another experiment’s outcome. Rare events,
          clustering and multiple claims need their own methods.
        hold: 0.75
        visual_cues:
          - id: independent-units-step-2
            phrase: add and take the square root
            targets:
              - independent-units-mechanism
            linger: 0.4
  - id: power
    title: Plan traffic around an effect worth finding
    visual: Intervals narrow as the number of independent incidents grows; the planning target calls for a
      two-point effect and eighty-percent power.
    beats:
      - say: A small experiment can estimate a lift imprecisely. The chart keeps the same two teaching rates and
          compares projected interval widths at two hundred, five hundred, and two thousand incidents per arm.
          This lets us see how planned sample size changes precision.
        hold: 0.55
        motion_check:
          region:
            - 250
            - 350
            - 920
            - 460
          minimumChangedFraction: 0.002
        visual_cues:
          - id: power-beat-1-focus-1
            phrase: projected interval widths
            targets:
              - sample-size-intervals
            color: yellow
            linger: 0.65
          - id: power-beat-1-focus-2
            phrase: planned sample size changes precision
            targets:
              - sample-size-value
            color: cyan
            linger: 0.65
      - say: "Before launch, choose a minimum detectable effect: a true improvement you want a specified chance of
          detecting under the planning model. With a thirty-eight-percent baseline, a two-point target, a
          five-percent two-sided threshold, and eighty-percent power, a common shortcut gives about nine
          thousand two hundred forty-six incidents per arm."
        hold: 0.6
        visual_cues:
          - id: power-beat-2-focus-1
            phrase: minimum detectable effect
            targets:
              - planning-assumptions
            color: yellow
            linger: 0.65
          - id: power-beat-2-focus-2
            phrase: nine thousand two hundred forty-six
            targets:
              - planning-result
            color: cyan
            linger: 0.65
      - say: In this fixture, two thousand incidents per arm give an interval above zero for the observed four-point
          lift. Detecting the smaller two-point planning target reliably requires the larger sample we just
          calculated. Power changes with effect size, sample size, outcome variation, analysis, and the launch
          rule.
        hold: 0.75
        visual_cues:
          - id: power-beat-3-focus-1
            phrase: observed four-point lift
            targets:
              - sample-size-intervals
            color: yellow
            linger: 0.65
          - id: power-beat-3-focus-2
            phrase: smaller two-point planning target
            targets:
              - planning-assumptions
              - planning-result
            color: cyan
            linger: 0.65
  - id: power-and-decision
    title: Detection probability and launch probability differ
    visual: Repeated hypothetical effect estimates cross a zero-detection boundary and a separate observed-value
      threshold. The design MDE and two sample-size approximations stay distinct.
    beats:
      - say: Power is the probability of rejecting the no-effect null at a specified true alternative. Eighty percent
          power leaves twenty percent Type Two error under that planning model. Five percent two-sided alpha
          budgets apparent harms as well as benefits under no effect. A minimum detectable effect is the
          planning alternative, not a hard boundary below which detection is impossible. Holding the other
          assumptions fixed, sample size scales approximately with one divided by squared target effect.
          Halving the target requires about four times the enrollment.
        hold: 0.55
        visual_cues:
          - id: power-and-decision-step-1
            phrase: not a hard boundary
            targets:
              - power-and-decision-mechanism
            linger: 0.4
      - say: The shortcut uses twice the baseline Bernoulli variance times the squared sum of the alpha and power
          normal cutoffs, divided by the squared effect. At baseline thirty-eight percent and a two-point
          target it gives nine thousand two hundred forty-six per arm. The fuller independent-proportions
          calculation gives about seventy-nine point six percent power there and needs nine thousand three
          hundred thirty-six for eighty percent. Use an analysis suited to the actual allocation and design
          rather than treating the shortcut as an exact specification.
        hold: 0.55
        visual_cues:
          - id: power-and-decision-step-2
            phrase: nine thousand three hundred thirty-six
            targets:
              - power-and-decision-mechanism
            linger: 0.4
          - id: power-shortcut
            phrase: nine thousand two hundred forty-six
            targets:
              - power-and-decision-mechanism
            linger: 0.45
          - id: power-fuller
            phrase: seventy-nine point six percent
            targets:
              - power-and-decision-mechanism
            linger: 0.45
      - say: The launch rule also requires an observed effect of at least two points. If the true effect is exactly
          two points and estimates are approximately symmetric around it, only about half clear that observed
          threshold. Requiring guardrails reduces the chance further. Eighty-percent detection power therefore
          is not eighty-percent launch probability. Predeclare the calendar duration as well as enrollment
          when weekday mix, rotations or novelty matter. More rows improve precision; they do not make the
          treatment better.
        hold: 0.75
        visual_cues:
          - id: power-and-decision-step-3
            phrase: not eighty-percent launch probability
            targets:
              - power-and-decision-mechanism
            linger: 0.4
          - id: power-launch
            phrase: only about half
            targets:
              - power-and-decision-mechanism
            linger: 0.45
  - id: srm
    title: Check that assignment reached the analysis table
    visual: A planned 50/50 split is compared with 1,650 control and 2,350 treatment assignments before lift is
      interpreted.
    beats:
      - say: Suppose the experiment planned equal allocation but the analysis table contains one thousand six hundred
          fifty control incidents and two thousand three hundred fifty treatment incidents. That sample-ratio
          mismatch is a reason to pause before reading the outcome difference.
        hold: 0.55
        visual_cues:
          - id: srm-beat-1-focus-1
            phrase: analysis table contains
            targets:
              - assignment-counts
            color: yellow
            linger: 0.65
      - say: Against two thousand expected incidents per arm, subtract expected from observed, square that difference,
          divide by expected, and sum across both arms. The chi-square diagnostic is one hundred twenty-two
          point five. Inspect assignment code, eligibility filters, event joins, bots, and missing outcomes.
          The discrepancy points to a data path that needs explanation.
        hold: 0.6
        visual_cues:
          - id: srm-beat-2-focus-1
            phrase: two thousand expected incidents per arm
            targets:
              - expected-allocation
            color: yellow
            linger: 0.65
          - id: srm-diagnostic
            phrase: chi-square diagnostic
            targets:
              - assignment-diagnostic
            color: cyan
            linger: 0.65
      - say: A mismatch alert flags unexpected assignment counts, so inspect assignment code, eligibility, and event
          joins. Audit outcome fields separately even when the split is balanced. Check distinct incident IDs
          at the planned unit because treatment can change the number of messages.
        hold: 0.75
        visual_cues:
          - id: srm-beat-3-focus-1
            phrase: unexpected assignment counts
            targets:
              - assignment-counts
            color: yellow
            linger: 0.65
  - id: peeking
    title: Run the same null path through different stopping rules
    visual: A cumulative A/A z path briefly crosses and then returns. Five thousand actual seeded paths feed
      counts for one final versus5,10,20 repeated looks.
    beats:
      - say: Now both simulated arms have the same true forty-percent resolution rate. One ordinary final test can
          still flag a difference from noise. Watching a cumulative interval after each batch and stopping at
          its first crossing changes the procedure. Earlier observations occur in later looks, so the looks
          are correlated. Multiplying independent five-percent survival probabilities does not describe these
          repeated looks.
        hold: 0.55
        visual_cues:
          - id: peeking-step-1
            phrase: the looks are correlated
            targets:
              - peeking-mechanism
            linger: 0.4
      - say: The article actually simulates five thousand A A experiments with twenty batches of one hundred new
          incidents per arm. The single final look produces two hundred thirty-one false alarms, about four
          point six percent. First-crossing policies give seven hundred eight alarms at five looks, nine
          hundred sixty-one at ten, and one thousand two hundred forty-four at twenty. The last rate is
          twenty-four point nine percent. These are two-sided alarms, including apparent harms, under this
          exact simulation.
        hold: 0.55
        visual_cues:
          - id: peeking-step-2
            phrase: one thousand two hundred forty-four
            targets:
              - peeking-mechanism
            linger: 0.4
          - id: peek-final
            phrase: two hundred thirty-one false alarms
            targets:
              - peeking-mechanism
            linger: 0.45
          - id: peek-five
            phrase: seven hundred eight alarms
            targets:
              - peeking-mechanism
            linger: 0.45
          - id: peek-ten
            phrase: nine hundred sixty-one
            targets:
              - peeking-mechanism
            linger: 0.45
          - id: peek-twenty
            phrase: one thousand two hundred forty-four
            targets:
              - peeking-mechanism
            linger: 0.45
      - say: Choose one planned final analysis or a justified sequential design. Searching variants, metrics or
          subgroups for a crossing also multiplies claims. Predeclare the family and its error control, such
          as Bonferroni, or mark discovered subgroups exploratory and confirm on fresh data. A displayed
          dashboard may update operationally without making its ordinary interval valid for an
          outcome-triggered stopping decision.
        hold: 0.75
        visual_cues:
          - id: peeking-step-3
            phrase: confirm on fresh data
            targets:
              - peeking-mechanism
            linger: 0.4
  - id: alpha-spending
    title: Spend cumulative error without treating it as a p cutoff
    visual: A cumulative error-budget curve grows slowly early and reaches .05 at full information. Correlated
      crossing regions are separate from that budget.
    beats:
      - say: Group sequential alpha spending allocates total false-alarm probability over information time.
          Information fraction is accumulated statistical information divided by the planned maximum; it
          resembles enrollment fraction only when information grows proportionally. An O Brien Fleming-style
          spending function starts at zero, spends little early and reaches the chosen total alpha at full
          information. The displayed equation takes the two-sided normal cutoff, divides by square root
          information fraction, then converts the tail back to a cumulative budget.
        hold: 0.55
        visual_cues:
          - id: alpha-spending-step-1
            phrase: cumulative budget
            targets:
              - alpha-spending-mechanism
            linger: 0.4
      - say: That budget is not the p-value cutoff for each look. Boundaries must account for correlation and the
          probability of earlier crossings. The official six-look gsDesign example ends near z two point zero
          four five, rather than the ordinary one point nine six. Calibrate the look process and power;
          flexible look times still require the design’s monitoring assumptions. Comparing each ordinary
          p-value directly with cumulative spending does not implement the design.
        hold: 0.75
        visual_cues:
          - id: alpha-spending-step-2
            phrase: not the p-value cutoff
            targets:
              - alpha-spending-mechanism
            linger: 0.4
