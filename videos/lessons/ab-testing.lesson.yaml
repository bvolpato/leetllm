          retained calibration cases, and inspect position, verbosity and reasoning limitations. The article’s
          receipt function catches declared differences in index, generator, prompt and decoder. Its
          deliberate schema mismatch is rejected before lift is read. Matching those fields does not verify
          actual deployed bytes, truthful logs, random assignment or absence of interference. Keep source and
          run evidence behind the receipt.
        hold: 0.75
        visual_cues:
