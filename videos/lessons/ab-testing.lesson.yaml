version: 1
id: ab-testing
title: How to Tell Whether a Product Change Helped
source: foundations/experiment-design-ab-testing/content.md
voice: en-US-AndrewNeural
rate: +0%
sources:
  - title: Online Experimentation at Microsoft
    url: https://www.microsoft.com/en-us/research/publication/online-experimentation-at-microsoft/
  - title: Practical Guide to Controlled Experiments on the Web
    url: https://ai.stanford.edu/~ronnyk/GuideControlledExperiments.pdf
  - title: "Statsmodels: power for two independent proportions"
    url: https://www.statsmodels.org/stable/generated/statsmodels.stats.power.NormalIndPower.solve_power.html
  - title: "Deng et al.: CUPED variance reduction"
    url: https://exp-platform.com/Documents/2013-02-CUPED-ImprovingSensitivityOfControlledExperiments.pdf
  - title: gsDesign Lan-DeMets spending and actual sequential boundaries
    url: https://keaven.github.io/gsDesign/reference/sfLDOF.html
  - title: "Johari et al.: Always Valid Inference"
    url: https://arxiv.org/abs/1512.04922
  - title: "Russo et al.: A Tutorial on Thompson Sampling"
