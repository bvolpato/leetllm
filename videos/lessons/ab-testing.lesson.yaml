  - id: mixture-evidence
    title: Track current likelihood evidence and its running maximum
    visual: Two alternative likelihood products update from the same20 supplied outcomes. Their half-weighted mean
      crosses20, then falls while the retained maximum and anytime p stay.
    beats:
      - say: For a simpler sequential calculation, use one independent Bernoulli stream with a known null success rate
          of forty percent. Fix equal prior mass on alternatives twenty and sixty percent before outcomes
          arrive. Each alternative multiplies by its success probability divided by the null’s for a success,
          and by its failure probability divided by the null’s for a failure. Average the two products. Under
          the known null, each next multiplier has expected value one, so the nonnegative mixture likelihood
          ratio starts at one and is a null martingale.
        hold: 0.55
        visual_cues:
          - id: mixture-evidence-step-1
            phrase: expected value one
            targets:
              - mixture-evidence-mechanism
            linger: 0.4
      - say: The supplied fixture has ten successes followed by ten failures. After ten successes the current mixture
          ratio is about twenty-eight point eight three three, crossing the five-percent threshold of twenty.
          After ten failures it falls to about zero point five zero nine. Keep its running maximum at
          twenty-eight point eight three three. The anytime p-value is the smaller of one and the reciprocal
          of the running maximum, about zero point zero three four seven at both checkpoints. Falling current
          evidence does not erase a prior crossing.
        hold: 0.55
        visual_cues:
          - id: mixture-evidence-step-2
            phrase: does not erase a prior crossing
            targets:
              - mixture-evidence-mechanism
            linger: 0.4
          - id: mixture-ten
            phrase: After ten successes
            targets:
              - mixture-evidence-mechanism
            linger: 0.45
          - id: mixture-twenty
            phrase: After ten failures
            targets:
              - mixture-evidence-mechanism
            linger: 0.45
          - id: mixture-ten-value
            phrase: current mixture ratio is about twenty-eight point eight three three
            targets:
              - mixture-evidence-mechanism
            linger: 0.45
          - id: mixture-final-value
            phrase: zero point five zero nine
            targets:
              - mixture-evidence-mechanism
            linger: 0.45
          - id: mixture-max-value
            phrase: running maximum at twenty-eight point eight three three
            targets:
              - mixture-evidence-mechanism
            linger: 0.45
          - id: mixture-p-value
            phrase: about zero point zero three four seven
            targets:
              - mixture-evidence-mechanism
            linger: 0.45
      - say: Ville’s inequality bounds the probability of ever crossing one divided by alpha under the stated null.
          The simple density, common support, independent observations and fixed normalized mixing
          distribution matter. A two-arm null with an unknown shared baseline is composite; plugging in the
          observed control rate does not automatically preserve this martingale. Use a method derived for the
          actual observation model. Inverting valid tests can form a confidence sequence with simultaneous
          time coverage. It does not control unrelated metrics, and long likelihood products need stable
          numerical evaluation.
        hold: 0.75
        visual_cues:
          - id: mixture-evidence-step-3
            phrase: unknown shared baseline is composite
            targets:
              - mixture-evidence-mechanism
            linger: 0.4
  - id: cuped-adjustment
    title: Subtract predictable variation without conditioning on treatment
    visual: A pre-experiment X coordinate predicts the Y cloud. One common fitted line is subtracted to reveal
      residual scores, including values beyond0–1.
    beats:
      - say: CUPED uses a covariate unaffected by treatment, such as a frozen service-history summary collected before
          this experiment. A new incident has no previous outcome of its own. Adjust Y by subtracting theta
          times X minus one common center. With a common fixed coefficient and randomized assignment, the
          expected arm difference in the covariate is zero, so the adjustment preserves the expected treatment
          contrast. Treatment-period rewrite latency can be affected by assignment and is not a safe baseline
          merely because it predicts the outcome.
        hold: 0.55
        visual_cues:
          - id: cuped-adjustment-step-1
            phrase: one common center
            targets:
              - cuped-adjustment-mechanism
            linger: 0.4
      - say: The adjusted variance is variance Y plus theta squared times variance X minus twice theta times
          covariance. For positive finite variance X, minimizing gives theta equal to covariance divided by
          variance X. In a supplied numerical example, variance Y is nine, variance X is four and covariance
          is three. Theta is three quarters; residual variance becomes six point seven five, a
          twenty-five-percent reduction. Reversing the covariate’s sign reverses theta and leaves that
          reduction unchanged. The optimal factor is one minus squared correlation, not one minus correlation.
        hold: 0.55
        visual_cues:
          - id: cuped-adjustment-step-2
            phrase: six point seven five
            targets:
              - cuped-adjustment-mechanism
            linger: 0.4
          - id: cuped-theta
            phrase: Theta is three quarters
            targets:
              - cuped-adjustment-mechanism
            linger: 0.45
          - id: cuped-variance
            phrase: six point seven five
            targets:
              - cuped-adjustment-mechanism
            linger: 0.45
      - say: The article’s executed twenty-thousand-unit simulation has correlation about point four seven zero and
          pooled outcome variance reduction twenty-two point one percent. Its raw lift is four point six eight
          points and adjusted lift four point three nine; finite samples need not give identical estimates.
          Fitting theta on these same outcomes is not the fixed-coefficient finite-sample proof. Predeclare
          suitable adjusted inference, use regression or cross-fitting where appropriate, and check the actual
          standard error. Adjusted scores may lie outside zero and one; they are not new Bernoulli labels.
        hold: 0.75
        visual_cues:
          - id: cuped-adjustment-step-3
            phrase: not new Bernoulli labels
            targets:
              - cuped-adjustment-mechanism
            linger: 0.4
  - id: bandit-routing
    title: Adapt new-incident allocation without switching an existing incident
    visual: Two Beta posteriors supply competing draws. Only a matured chosen reward updates its posterior;
      follow-up messages retain the stored arm.
    beats:
      - say: A fixed-allocation test estimates the defined contrast under predeclared assignment probabilities; it
          need not be fifty fifty. A reward-seeking bandit instead trades exploration for cumulative reward.
          For a stationary Bernoulli arm, begin with a Beta prior, add a success to alpha or a failure to
          beta, draw one possible success rate for each arm and choose the largest. Thompson sampling draws
          from uncertainty, not simply from the largest posterior mean.
        hold: 0.55
        visual_cues:
          - id: bandit-routing-step-1
            phrase: add a success to alpha
            targets:
              - bandit-routing-mechanism
            linger: 0.4
          - id: bandit-sample
            phrase: draw one possible success rate
            targets:
              - bandit-routing-mechanism
            linger: 0.45
      - say: In the article’s seeded immediate-reward toy, control receives four hundred sixty-three of two thousand
          pulls and treatment fifteen hundred thirty-seven, about seventy-six point eight percent. Treatment’s
          true simulation rate is higher, but that allocation is not a measured counterfactual recovery gain
          over fixed routing. In our incident service, choose only for a new incident, keep its follow-ups
          fixed, and update after the outcome window matures. Delays and nonstationarity complicate the
          immediate-reward toy.
        hold: 0.55
        visual_cues:
          - id: bandit-routing-step-2
            phrase: after the outcome window matures
            targets:
              - bandit-routing-mechanism
            linger: 0.4
          - id: bandit-count
            phrase: fifteen hundred thirty-seven
            targets:
              - bandit-routing-mechanism
            linger: 0.45
      - say: Adaptive sample sizes depend on earlier rewards. Ordinary fixed-design inference is not automatically
          calibrated, and sampling, stopping and choosing which arm to report can create bias in different
          directions. Retain routing probabilities and use estimators and sequential methods designed for that
          policy with adequate exploration. A resolution reward does not encode grounding or latency
          constraints. A bandit can support scientific learning, but it answers a different operational
          objective and needs explicit guardrail design.
        hold: 0.75
        visual_cues:
          - id: bandit-routing-step-3
            phrase: bias in different directions
            targets:
              - bandit-routing-mechanism
            linger: 0.4
  - id: paired-prompts
    title: Subtract two outcomes before averaging away shared difficulty
    visual: The same prompt difficulty column feeds control and treatment scores. Subtraction cancels that shared
      column; independent prompt samples do not cancel.
    beats:
      - say: For offline paired answer evaluation, generate both candidates for the same prompt. In a simple additive
          score model, control is prompt difficulty plus its noise; treatment is the same difficulty plus
          effect and its noise. Subtraction cancels the shared difficulty exactly in that model. In general,
          variance of the difference is the two score variances minus twice their covariance. Positive
          covariance helps, zero gives no gain, and negative covariance can make pairing noisier.
        hold: 0.55
        visual_cues:
          - id: paired-prompts-step-1
            phrase: Subtraction cancels the shared difficulty
            targets:
              - paired-prompts-mechanism
            linger: 0.4
          - id: paired-cancel
            phrase: Subtraction cancels
            targets:
              - paired-prompts-mechanism
            linger: 0.45
      - say: The actual synthetic Gaussian lab scores two thousand answers in either design. Independent prompts give
          lift about point five seven zero with standard error point zero eight five. One thousand shared
          prompts give lift point four four three with standard error point zero two seven, about eighty-nine
          point five percent less variance for the contrast. These scores are unbounded numerical toys, not a
          one-to-ten rating scale or measured model performance. Estimate covariance before promising this
          gain for real answers.
        hold: 0.55
        visual_cues:
          - id: paired-prompts-step-2
            phrase: unbounded numerical toys
            targets:
              - paired-prompts-mechanism
            linger: 0.4
          - id: paired-se
            phrase: standard error point zero two seven
            targets:
              - paired-prompts-mechanism
            linger: 0.45
      - say: Search interleaving mixes ranked result lists and credits clicks under a specified rule. Two complete
          answers judged side by side are paired answer evaluation, not that list mechanism. Randomize answer
          order, blind identities, declare ties and calibrate the judge. A preference vote needs inference for
          its vote metric. Showing an engineer both answers changes their exposure, so later resolution is not
          the original one-answer incident effect. A preferred answer can still be ungrounded.
        hold: 0.75
        visual_cues:
          - id: paired-prompts-step-3
            phrase: changes their exposure
            targets:
              - paired-prompts-mechanism
            linger: 0.4
  - id: evaluation-stack
    title: Keep each evaluator and receipt inside its actual scope
    visual: Offline regression, online assigned outcomes, product guardrails and integrity artifacts inspect
      different parts of the same rewrite path. A decoder mismatch stops the comparison.
    beats:
      - say: Check unsupported rollback claims in an offline regression set before exposing live incidents. Online
          resolution measures the assigned product outcome; guardrails protect grounding, speed, human pages
          and cost. The integrity record binds assignment, eligible units, data snapshots, prompts, model and
          decoder policies. A passing offline score does not establish live task benefit, and a positive
          online metric does not excuse unsupported evidence.
