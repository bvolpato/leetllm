  - id: takeaway
    title: Treat the experiment as a measurement system
    visual: A four-stage path links the locked question, random assignment, mature outcome, and guardrail review
      to an auditable release decision.
    beats:
      - say: Start with a decision that matters to users, then choose a unit and an outcome that actually represent
          it. Random assignment handles many sources of baseline difference; careful instrumentation keeps the
          comparison tied to the policy each incident received.
        hold: 0.55
        visual_cues:
          - id: takeaway-beat-1-focus-1
            phrase: decision that matters to users
            targets:
              - recap-question
            color: yellow
            linger: 0.65
          - id: takeaway-beat-1-focus-2
            phrase: Random assignment
            targets:
              - recap-unit
            color: cyan
            linger: 0.65
      - say: Plan enough traffic for the improvement you care about, mature every outcome window, and use one
          predeclared analysis. Separate a metric’s estimate from its uncertainty, and inspect sample-ratio
          integrity before interpreting either.
        hold: 0.6
        visual_cues:
          - id: takeaway-beat-2-focus-1
            phrase: mature every outcome window
            targets:
              - recap-outcome
            color: yellow
            linger: 0.65
      - say: Finally, launch only when the primary lift and every declared guardrail meet their rules. A/B testing
          produces evidence for a defined population and period. Future traffic still deserves monitoring,
          because products and incidents change over time.
        hold: 0.75
        visual_cues:
          - id: takeaway-beat-3-focus-1
            phrase: every declared guardrail
            targets:
              - recap-guardrails
            color: yellow
            linger: 0.65
