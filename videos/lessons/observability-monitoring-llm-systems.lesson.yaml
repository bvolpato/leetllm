    visual: Four input strips grow100,120,140,160 and sum520; eight strips sum1360. A120-token cap changes the
      actual strips to100,120,120,120 and totals460; only model-call rows contribute.
    beats:
      - say: A repeated tool call and another model invocation are separate events. To count model input, suppose each
          of N calls resends its complete history. The first history contains L zero tokens, and each call
          adds a fixed positive g tokens. The input lengths are L zero, L zero plus g, through L zero plus the
          quantity N minus one times g. Add those actual lengths.
