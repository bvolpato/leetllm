scenes:
  - id: opening
    title: Which request should wake the on-call engineer?
    visual: Two Approved replies move toward the serving gate. Compare the deployment record with the reply that
      lands on each engineer’s screen.
    beats:
      - say: Both drafts say “Approved.” Both requests returned HTTP two hundred. Check the deployment record.
          Nobody signed off. Page on-call if an unsupported approval reaches an engineer. Watch what happens
          when the drafts reach the gate. Which request should wake the on-call engineer?
        hold: 3
        caption_starts:
          - "Nobody signed off."
        visual_cues:
          - id: two-drafts
            phrase: Both drafts say “Approved.”
            targets:
              - draft-202
              - draft-205
            color: cyan
            linger: 0.16
            caption_boundary: true
          - id: read-record
            phrase: Check the deployment record.
            targets:
              - policy-record
            color: blue
            linger: 0.16
            caption_boundary: true
          - id: page-rule
            phrase: Page on-call if an unsupported approval reaches an engineer.
            targets:
              - page-rule
            color: blue
            linger: 0.16
            caption_boundary: true
          - id: follow-delivery
            phrase: Watch what happens when the drafts reach the gate.
            targets:
              - gate-202
              - gate-205
              - draft-202
              - draft-205
            color: cyan
            linger: 0.16
            caption_boundary: true
          - id: choose-request
            phrase: Which request should wake the on-call engineer?
            targets:
              - policy-decision
              - output-202
              - output-205
              - draft-202
              - draft-205
            color: yellow
            linger: 0.16
            caption_boundary: true
      - say: Page on request two oh five. Its approval reached the engineer. On two oh two, the gate caught the
          same mistake. A reviewer checks what each engineer received against the deployment record. Count the
          unsafe deliveries across all six requests. Link the alert to request two oh five so the on-call
          engineer can open its trace.
        hold: 0.9
        caption_starts:
          - "On two oh two"
          - "A reviewer checks"
        visual_cues:
          - id: page-exemplar
            phrase: Page on request two oh five.
            targets:
              - policy-decision
              - output-205
            color: pink
            linger: 0.16
            caption_boundary: true
          - id: count-window
            phrase: Count the unsafe deliveries across all six requests.
            targets: [window-count]
            color: blue
            caption_boundary: true
          - id: link-trace
            phrase: Link the alert to request two oh five
            targets: [example-trace]
            color: cyan
            caption_boundary: true
  - id: event-contract
    title: Record the output that crossed the boundary
    visual: One concrete request carries a route proposal, an actual operator payload and a later review receipt.
      The abstain route label fails to erase the recorded substantive delivery; a pending verdict remains an
      empty field.
    beats:
      - say: The gate can serve, shorten, send for review, or abstain. For this request it chose abstain. Look at
          the message that reached the engineer anyway. It says “Deployment approved.” Record that an answer
          went out. Keep the gate’s decision beside the delivery so you can spot the mismatch.
        hold: 0.65
        visual_cues:
          - id: ob-event-contract-1-1
            phrase: The gate can serve, shorten, send for review, or abstain.
            targets:
              - payload
            color: blue
            linger: 0.35
          - id: ob-event-contract-1-2
            phrase: For this request it chose abstain.
            targets:
              - payload
            color: cyan
            linger: 0.35
          - id: ob-event-contract-1-3
            phrase: Look at the message that reached the engineer anyway.
            targets:
              - payload
            color: yellow
            linger: 0.35
          - id: ob-event-contract-1-4
            phrase: It says “Deployment approved.” Record that an answer went out.
            targets:
              - payload
            color: green
            linger: 0.35
          - id: ob-event-contract-1-5
            phrase: Keep the gate’s decision beside the delivery so you can spot the mismatch.
            targets:
              - payload
            color: blue
            linger: 0.35
      - say: Store two facts separately. Did an answer reach the engineer, and has anyone reviewed it? While
          review is pending, leave the unsafe verdict empty. After a reviewer checks a safe answer, record
          false. Validate those fields as they arrive. An unsafe delivery needs an actual delivery. Reject
          unknown routes, empty IDs and strings where the record expects a Boolean.
        hold: 0.65
        visual_cues:
          - id: ob-event-contract-2-1
            phrase: Store two facts separately. Did an answer reach the engineer, and has anyone reviewed it?
            targets:
              - typed-fields
            color: blue
            linger: 0.35
          - id: ob-event-contract-2-2
            phrase: While review is pending, leave the unsafe verdict empty.
            targets:
              - typed-fields
            color: cyan
            linger: 0.35
          - id: ob-event-contract-2-3
            phrase: After a reviewer checks a safe answer, record false.
            targets:
              - typed-fields
            color: yellow
            linger: 0.35
          - id: ob-event-contract-2-4
            phrase: Validate those fields as they arrive. An unsafe delivery needs an actual delivery. Reject unknown
              routes, empty IDs and strings where the record expects a Boolean.
            targets:
              - typed-fields
            color: green
            linger: 0.35
      - say: Record one final event per request identity and reconcile it with an independent ingress count for the
          same window. Final delivery events, duplicate messages, and review receipts are different objects.
          If eight requests entered but only seven final events arrived, preserve the missing-event count. The
          seven received events cannot establish the latency, cost, or safety of the absent request.
        hold: 0.65
        visual_cues:
          - id: ob-event-contract-3-1
            phrase: Record one final event per request identity and reconcile it with an independent ingress count for the
              same window.
            targets:
              - ingress-ledger
            color: blue
            linger: 0.35
          - id: ob-event-contract-3-2
            phrase: Final delivery events, duplicate messages, and review receipts are different objects.
            targets:
              - ingress-ledger
            color: cyan
            linger: 0.35
          - id: ob-event-contract-3-3
            phrase: If eight requests entered but only seven final events arrived, preserve the missing-event count.
            targets:
              - ingress-ledger
            color: yellow
            linger: 0.35
          - id: ob-event-contract-3-4
            phrase: The seven received events cannot establish the latency, cost, or safety of the absent request.
            targets:
              - ingress-ledger
            color: green
            linger: 0.35
  - id: join
    title: Join reviewed outcomes by request identity
    visual: Final serving events remain six rows while delayed supplied review receipts join by request ID and
      update the same rows.
    beats:
      - say: Begin with the serving events. Each row records its request identity, chosen route, and whether a
          substantive answer actually reached the operator. Separate supplied reviews join to the matching
          request before we count reviewed safety.
        hold: 0.65
        visual_cues:
          - id: serving-records
            phrase: request identity, chosen route
            targets:
              - request-identity
              - delivery-event
            color: blue
            linger: 0.5
          - id: join-reviews
            phrase: reviews join to the matching request
            targets:
              - review-counter
              - review-receipt
            color: cyan
            linger: 0.5
      - say: The first four supplied reviews identify one supported answer and three safe withholdings. Now the
          remaining receipts expose two unsupported approvals. Replaying a receipt updates its existing row;
          it cannot create another request in the denominator. A missing review stays unknown, and a receipt
          for an unrecognized request needs investigation.
        hold: 0.65
        visual_cues:
          - id: expose-approvals
            phrase: remaining receipts expose two unsupported approvals
            targets:
              - review-receipt
              - review-counter
            color: pink
            linger: 0.5
  - id: review-asof
    title: Update a review without adding a request
    visual: A delayed receipt enters request205’s existing row. Replaying its exact receipt keeps the row count at
      six. An as-of clock leaves later reviews outside the earlier snapshot and exposes pending verdicts.
    beats:
      - say: Freeze the request cohort, window cutoff, and evaluator version before taking a quality snapshot. A
          request can finish now and receive its independent review later. Store when the review became
          available so an earlier dashboard does not silently inherit future evidence. A pending review omits
          the unsafe verdict; it does not emit a false safety result.
        hold: 0.65
        visual_cues:
          - id: ob-review-asof-1-1
            phrase: Freeze the request cohort, window cutoff, and evaluator version before taking a quality snapshot.
            targets:
              - snapshot-clock
            color: blue
            linger: 0.35
          - id: ob-review-asof-1-2
            phrase: A request can finish now and receive its independent review later.
            targets:
              - snapshot-clock
            color: cyan
            linger: 0.35
          - id: ob-review-asof-1-3
            phrase: Store when the review became available so an earlier dashboard does not silently inherit future
              evidence.
            targets:
              - snapshot-clock
            color: yellow
            linger: 0.35
          - id: ob-review-asof-1-4
            phrase: A pending review omits the unsafe verdict; it does not emit a false safety result.
            targets:
              - snapshot-clock
            color: green
            linger: 0.35
      - say: Review two oh five. Its verdict goes in the row for request two oh five. Replaying the same receipt
          leaves the request count unchanged. Key each update by request ID and record which evaluator
          supplied it. If the evaluator changes later, decide which version belongs in the report. Each
          request still contributes one row.
        hold: 0.65
        visual_cues:
          - id: ob-review-asof-2-1
            phrase: Review two oh five. Its verdict goes in the row for request two oh five.
            targets:
              - receipt-upsert
            color: blue
            linger: 0.35
          - id: ob-review-asof-2-2
            phrase: Replaying the same receipt leaves the request count unchanged.
            targets:
              - receipt-upsert
            color: cyan
            linger: 0.35
          - id: ob-review-asof-2-3
            phrase: Key each update by request ID and record which evaluator supplied it.
            targets:
              - receipt-upsert
            color: yellow
            linger: 0.35
          - id: ob-review-asof-2-4
            phrase: If the evaluator changes later, decide which version belongs in the report. Each request still
              contributes one row.
            targets:
              - receipt-upsert
            color: green
            linger: 0.35
      - say: Review coverage is reviewed requests divided by the complete ingress cohort. Reviewed unsafe rate divides
          confirmed unsafe requests by reviewed requests. Conditional answer risk instead divides unsafe
          substantive deliveries by reviewed substantive deliveries. For a cohort of ten with eight reviews,
          five reviewed deliveries and one unsafe answer, those fractions are eight tenths, one eighth, and
          one fifth.
        hold: 0.65
        visual_cues:
          - id: ob-review-asof-3-1
            phrase: Review coverage is reviewed requests divided by the complete ingress cohort.
            targets:
              - review-coverage
            color: blue
            linger: 0.35
          - id: ob-review-asof-3-2
            phrase: Reviewed unsafe rate divides confirmed unsafe requests by reviewed requests.
            targets:
              - review-risk
            color: cyan
            linger: 0.35
          - id: ob-review-asof-3-3
            phrase: Conditional answer risk instead divides unsafe substantive deliveries by reviewed substantive
              deliveries.
            targets:
              - conditional-risk
            color: yellow
            linger: 0.35
          - id: ob-review-asof-3-4
            phrase: For a cohort of ten with eight reviews, five reviewed deliveries and one unsafe answer, those
              fractions are eight tenths, one eighth, and one fifth.
            targets:
              - conditional-risk
            color: green
            linger: 0.35
  - id: denominators
    title: Which requests belong in the denominator?
    visual: Six identities stay in view. Two masks select reviewed requests and reviewed deliveries. Three
      review receipts then disappear while their final delivery events stay in place.
    beats:
      - say: Here are all six delivery receipts with their reviews. The pink marks are the two unsupported
          approvals. To count risk per reviewed request, take both pink marks over the whole row of six. Now
          suppose an engineer tells you they received a substantive answer. Look only at the requests where an
          answer went out. What fraction of the delivered answers were unsafe?
        hold: 2.8
        visual_cues:
          - id: request-denominator
            phrase: both pink marks over the whole row of six
            targets:
              - reviewed-cohort
            color: cyan
            linger: 0.16
            caption_boundary: true
          - id: served-denominator
            phrase: Look only at the requests where an answer went out
            targets:
              - answer-cohort
            color: yellow
            linger: 0.16
            caption_boundary: true
      - say: Two out of three. Requests two oh five and two oh six still form the numerator. Two oh one is the only
          other request where someone received an answer. That’s why the same two failures give different rates.
          The three abstentions describe what the gate did. Four drafts had generation defects. Two made it
          through the gate.
        hold: 0.85
        visual_cues:
          - id: answer-risk
            phrase: Two out of three
            targets:
              - answer-cohort
            color: pink
            linger: 0.16
            caption_boundary: true
      - say: Now remove only the reviews for two oh two, two oh three and two oh four. The reviewed-request rate
          rises to two out of three. Review coverage falls to three out of six. Look one row above the missing
          reviews. The delivery records still say “withheld” in all three places. We know the unsafe delivery
          count for this entire window is still two. Whether those withholdings helped the engineers is a
          separate question.
        hold: 1
        visual_cues:
          - id: select-review-cohort
            phrase: remove only the reviews for two oh two, two oh three and two oh four
            targets:
              - review-strip
              - reviewed-cohort
            color: yellow
            linger: 0.16
            caption_boundary: true
          - id: known-withholdings
            phrase: delivery records still say “withheld”
            targets:
              - delivery-strip
              - window-bound
            color: cyan
            linger: 0.16
            caption_boundary: true
  - id: unknown-bounds
    title: How much can a missing review hide?
    visual: Keep seven ingress identities fixed. Mark each confirmed or possible unsafe delivery beneath its own
      request. Removing the last delivery receipt opens exactly one more possible unsafe outcome.
    beats:
      - say: Try a new window. Seven requests came in. Read across the first three columns. One unsafe answer, one
          answer with no unsafe claim, and one withholding. All three have reviews. For the other four, we still
          have the delivery records. Two answers went out, and two were withheld. With those reviews pending,
          what’s the smallest number of unsafe deliveries across all seven? What’s the largest?
        hold: 3.1
        visual_cues:
          - id: read-seven
            phrase: Read across the first three columns
            targets:
              - window-evidence
            color: cyan
            linger: 0.16
            caption_boundary: true
          - id: pending-deliveries
            phrase: Two answers went out, and two were withheld
            targets:
              - window-evidence
            color: blue
            linger: 0.16
            caption_boundary: true
      - say: One is certain. Look at the two unchecked deliveries in the middle. Each could add one. That brings the
          upper count to three. The last two columns can add nothing because an operator never received a
          substantive answer on either request. We can bound unsafe delivery even while the usefulness of those
          withholdings is still open. The rate for the whole window lies between one seventh and three sevenths.
        hold: 1.1
        visual_cues:
          - id: known-count
            phrase: One is certain
            targets:
              - bound-slots
            color: pink
            linger: 0.16
            caption_boundary: true
          - id: possible-count
            phrase: That brings the upper count to three
            targets:
              - bound-slots
            color: yellow
            linger: 0.16
            caption_boundary: true
      - say: Now take away the final event for request seven. Its place in the ingress count stays. We can no longer
          tell whether the operator received an answer. What’s the highest possible count now?
        hold: 2.6
        visual_cues:
          - id: ob-unknown-bounds-3-1
            phrase: take away the final event for request seven
            targets:
              - window-evidence
            color: yellow
            linger: 0.16
            caption_boundary: true
      - say: Four. Request seven can now hide one more unsafe delivery. The lower count stays at one, and the
          denominator stays at seven. Keep that missing event visible when you report the range. To report a
          rate among reviewed requests, you need at least one review. With none, that rate is undefined.
        hold: 1.2
        visual_cues:
          - id: expanded-count
            phrase: Four
            targets:
              - bound-slots
              - count-range
            color: yellow
            linger: 0.16
            caption_boundary: true
  - id: latency
    title: Separate first output from the remaining stream
    visual: A clock reaches the first visible token at 240 ms, then reveals 29 further tokens through 455 ms with
      throughput derived from observed arrivals.
    beats:
      - say: Latency has boundaries too. In our supplied stream, the same request clock starts at dispatch. The first
          visible token arrives at two hundred forty milliseconds. That delay can include retrieval, queueing,
          model prefill, and output handling. A model-server timer or a client chunk timer can cover a
          different interval.
        hold: 0.65
        visual_cues:
          - id: dispatch-clock
            phrase: clock starts at dispatch
            targets:
              - request-clock
            color: blue
            linger: 0.5
          - id: first-token
            phrase: first visible token arrives
            targets:
              - visible-token-arrivals
              - arrival-count
            color: cyan
            linger: 0.5
      - say: Continue the clock to the last visible token. Thirty tokens leave twenty-nine after the first, across the
          remaining interval. Their arrival timestamps produce the displayed throughput. Keep billed tokens,
          visible tokens, and chunks distinct. The full six-request reference has a fast first-token
          percentile, while its reviewed unsafe answers still require action.
        hold: 0.65
        visual_cues:
          - id: remaining-tokens
            phrase: Continue the clock to the last visible token
            targets:
              - request-clock
              - visible-token-arrivals
            color: cyan
            linger: 0.5
          - id: derive-throughput
            phrase: arrival timestamps produce the displayed throughput
            targets:
              - observed-throughput
            color: yellow
            linger: 0.5
        motion_check:
          region:
            - 170
            - 330
            - 1570
            - 570
          minimumChangedFraction: 0.002
  - id: stream-contract
    title: Match tokens and timestamps before dividing
    visual: A first-token timestamp fixes the common start. Six later visible token events are counted
      across300ms, then one multi-token chunk is substituted to show why chunk and billed-token counts cannot
      share that formula.
    beats:
      - say: For individual visible token arrivals, subtract one from the total visible-token count. Subtract the
          first-token timestamp from the last-token timestamp, convert milliseconds to seconds by dividing by
          one thousand, then divide the remaining tokens by that interval. Seven visible tokens with first
          output at one hundred fifty milliseconds and last output at four hundred fifty give six over point
          three, or twenty tokens per second.
        hold: 0.65
        visual_cues:
          - id: ob-stream-contract-1-1
            phrase: For individual visible token arrivals, subtract one from the total visible-token count.
            targets:
              - visible-count
            color: blue
            linger: 0.35
          - id: ob-stream-contract-1-2
            phrase: Subtract the first-token timestamp from the last-token timestamp, convert milliseconds to seconds by
              dividing by one thousand, then divide the remaining tokens by that interval.
            targets:
              - arrival-interval
            color: cyan
            linger: 0.35
          - id: ob-stream-contract-1-3
            phrase: Seven visible tokens with first output at one hundred fifty milliseconds and last output at four
              hundred fifty give six over point three, or twenty tokens per second.
            targets:
              - throughput-result
            color: yellow
            linger: 0.35
      - say: One visible token has no later-token throughput. Multiple tokens with equal first and last timestamps
          have no positive interval for this calculation. Reject malformed counters, negative or missing
          times, and impossible ordering rather than recording a plausible zero. Repair instrumentation or
          timer resolution. Preserve the invalid-channel finding beside whatever quality facts are
          independently valid.
        hold: 0.65
        visual_cues:
          - id: ob-stream-contract-2-1
            phrase: One visible token has no later-token throughput.
            targets:
              - timing-validation
            color: blue
            linger: 0.35
          - id: ob-stream-contract-2-2
            phrase: Multiple tokens with equal first and last timestamps have no positive interval for this calculation.
            targets:
              - timing-validation
            color: cyan
            linger: 0.35
          - id: ob-stream-contract-2-3
            phrase: Reject malformed counters, negative or missing times, and impossible ordering rather than recording a
              plausible zero.
            targets:
              - timing-validation
            color: yellow
            linger: 0.35
          - id: ob-stream-contract-2-4
            phrase: Repair instrumentation or timer resolution.
            targets:
              - timing-validation
            color: green
            linger: 0.35
          - id: ob-stream-contract-2-5
            phrase: Preserve the invalid-channel finding beside whatever quality facts are independently valid.
            targets:
              - timing-validation
            color: blue
            linger: 0.35
      - say: An API chunk can contain no text, one token, or several tokens. Billed output may include hidden
          reasoning. None of those counts is automatically the number of visible token arrivals. Measure first
          visible content and final visible content consistently, while retaining total duration through
          stream closure separately. A delayed client buffer can make visible delivery slow even when server
          decoding is fast.
        hold: 0.65
        visual_cues:
          - id: ob-stream-contract-3-1
            phrase: An API chunk can contain no text, one token, or several tokens.
            targets:
              - measurement-boundaries
            color: blue
            linger: 0.35
          - id: ob-stream-contract-3-2
            phrase: Billed output may include hidden reasoning.
            targets:
              - measurement-boundaries
            color: cyan
            linger: 0.35
          - id: ob-stream-contract-3-3
            phrase: None of those counts is automatically the number of visible token arrivals.
            targets:
              - measurement-boundaries
            color: yellow
            linger: 0.35
          - id: ob-stream-contract-3-4
            phrase: Measure first visible content and final visible content consistently, while retaining total duration
              through stream closure separately.
            targets:
              - measurement-boundaries
            color: green
            linger: 0.35
          - id: ob-stream-contract-3-5
            phrase: A delayed client buffer can make visible delivery slow even when server decoding is fast.
            targets:
              - measurement-boundaries
            color: blue
            linger: 0.35
  - id: percentile-contract
    title: Construct the percentile from its population
    visual: Eight timings sort into an ordered strip. A rank marker moves to ceil(.95×8)=8, selects the maximum,
      and a separate failed-request row remains visible outside the successful-output timing cohort.
    beats:
      - say: Sort these eight first-output times from fastest to slowest. For nearest-rank p ninety-five,
          multiply eight by point nine five. The rank is seven point six, so round up to position eight. That
          last tile reads two hundred sixty milliseconds. With only eight observations, the slowest request
          sets this percentile.
        hold: 0.65
        caption_starts:
          - "The rank is seven point six, so round up"
          - "That last tile reads"
        visual_cues:
          - id: ob-percentile-contract-1-1
            phrase: Sort these eight first-output times from fastest to slowest.
            targets:
              - sorted-timings
            color: blue
            linger: 0.35
          - id: ob-percentile-contract-1-2
            phrase: For nearest-rank p ninety-five, multiply eight by point nine five. The rank is seven point six, so
              round up to position eight.
            targets:
              - percentile-rank
            color: cyan
            linger: 0.35
          - id: ob-percentile-contract-1-3
            phrase: That last tile reads two hundred sixty milliseconds. With only eight observations, the slowest request
              sets this percentile.
            targets:
              - percentile-result
            color: yellow
            linger: 0.35
      - say: Report the time window, sample size, route and completion population with the percentile. A
          completed-response histogram can look excellent while failures and cancellations produce no output.
          Count and time those outcomes separately instead of silently discarding them. Compare like-for-like
          workloads and timer boundaries before attributing a percentile change to a model or infrastructure
          repair.
        hold: 0.65
        visual_cues:
          - id: ob-percentile-contract-2-1
            phrase: Report the time window, sample size, route and completion population with the percentile.
            targets:
              - latency-populations
            color: blue
            linger: 0.35
          - id: ob-percentile-contract-2-2
            phrase: A completed-response histogram can look excellent while failures and cancellations produce no output.
            targets:
              - latency-populations
            color: cyan
            linger: 0.35
          - id: ob-percentile-contract-2-3
            phrase: Count and time those outcomes separately instead of silently discarding them.
            targets:
              - latency-populations
            color: yellow
            linger: 0.35
          - id: ob-percentile-contract-2-4
            phrase: Compare like-for-like workloads and timer boundaries before attributing a percentile change to a model
              or infrastructure repair.
            targets:
              - latency-populations
            color: green
            linger: 0.35
  - id: signals-runtime
    title: Keep workload and runtime evidence beside quality
    visual: Arrival and departure counters feed a queue; active streams occupy actual KV slots. A separate
      prefill block processes prompt positions and a decode block repeatedly reads supplied weight/KV bars, with
      no invented hardware benchmark.
    beats:
      - say: Keep latency, traffic, errors and saturation. Traffic includes arrivals per second and active streams.
