            phrase: Start with N times L zero.
            targets:
              - history-sum
            color: blue
            linger: 0.35
          - id: ob-history-growth-2-2
            phrase: Add g times N times the quantity N minus one, divided by two.
            targets:
              - history-sum
            color: cyan
            linger: 0.35
