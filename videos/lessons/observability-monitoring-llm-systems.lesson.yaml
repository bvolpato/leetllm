              - history-sum
            color: yellow
            linger: 0.35
          - id: ob-history-growth-2-4
            phrase: Eight calls total one thousand three hundred sixty.
            targets:
              - history-sum
            color: green
            linger: 0.35
          - id: ob-history-growth-2-5
            phrase: Fixed positive growth makes the cumulative term quadratic in call count.
            targets:
              - history-sum
            color: blue
