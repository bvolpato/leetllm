            phrase: Both replay outcomes have now been reviewed
            targets:
              - replay-score
            color: cyan
            linger: 0.16
            caption_boundary: true
      - say: Run the untouched holdout. Zero unsafe deliveries out of two reviewed replays. Keep that count on the
          replay row. The holdout is waiting for its own reviews. Its unsafe rate is still unknown. Apply the
          same safety, coverage and usefulness thresholds there. Compare latency and cost on the same cases.
          Report how many cases you reviewed. A small holdout can miss a rare failure. Save the case IDs,
          candidate version, evaluator and results together.
