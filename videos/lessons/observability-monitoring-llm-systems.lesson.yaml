            phrase: The first history contains L zero tokens, and each call adds a fixed positive g tokens.
            targets:
              - history-inputs
            color: yellow
            linger: 0.35
          - id: ob-history-growth-1-4
            phrase: The input lengths are L zero, L zero plus g, through L zero plus the quantity N minus one times g.
            targets:
              - history-inputs
            color: green
            linger: 0.35
          - id: ob-history-growth-1-5
            phrase: Add those actual lengths.
            targets:
              - history-inputs
            color: blue
            linger: 0.35
      - say: Start with N times L zero. Add g times N times the quantity N minus one, divided by two. With starting
          length one hundred and growth twenty, four calls send one hundred plus one hundred twenty plus one
          hundred forty plus one hundred sixty, totaling five hundred twenty. Eight calls total one thousand
          three hundred sixty. Fixed positive growth makes the cumulative term quadratic in call count.
