            color: blue
            linger: 0.16
            caption_boundary: true
          - id: judge-first
            phrase: Would you promote this candidate
            targets:
              - release-decision
            color: yellow
            linger: 0.16
            caption_boundary: true
      - say: Hold it. Look at request two oh one. The policy had the answer and the operator got nothing. That’s
          zero useful answers on one answerable case. We could withhold everything in production and make the
          safety count look just as good.
        hold: 0.9
        visual_cues:
