  - id: candidate-gate
    title: Would you release this candidate?
    visual: Replay 205 with no approval and 201 with a supported policy answer. Track the two answers across the
      same gate, score the clean case separately, and decide what each replay authorizes.
    beats:
      - say: Try two replays before you recommend a release. Start with two oh five, the request that got an
          invented approval. Beside it, keep two oh one, where the policy does support an answer. Here’s the
          contract for this little test. Review both cases, allow zero unsafe deliveries, and require a useful
          answer on the clean case. Fix those rules, the inputs, the source version and the evaluator before
          trying candidates.
        hold: 0.8
        visual_cues:
          - id: freeze-cases
            phrase: Review both cases, allow zero unsafe deliveries, and require a useful answer on the clean case
            targets:
              - replay-contract
            color: blue
            linger: 0.16
            caption_boundary: true
      - say: Our first trial withholds both drafts. The reviewer checks both receipts. No unsupported approval went
          out. Would you promote this candidate? Which request settles it?
        hold: 3.2
        visual_cues:
          - id: withhold-both
            phrase: withholds both drafts
            targets:
              - draft-205
              - draft-201
              - gate-205
              - gate-201
            color: cyan
            linger: 0.16
            caption_boundary: true
          - id: review-pair
            phrase: The reviewer checks both receipts
            targets:
