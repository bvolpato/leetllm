scenes:
  - id: subject-intro
    title: What did the assistant read?
    visual: "Follow the assistant’s citation back to a two-rule runbook page. Align the archive line in the saved extract with its source. Restore the paging rule in a second extract and compare what search returned."
    beats:
      - say: |
          “Archive it within fourteen days.” You asked when to page on-call after a failed rollback. The assistant cites page seven. Which line on that page answers your question?
        hold: 2
        caption_starts:
          - "You asked when to page on-call"
          - "Which line on that page"
        visual_cues:
          - id: incident
            phrase: "when to page on-call after a failed rollback"
            targets: [incident]
            linger: 0.25
          - id: reply
            phrase: "Archive it within fourteen days"
            targets: [reply]
            linger: 0.25
          - id: open-page
            phrase: "The assistant cites page seven"
            targets: [open-page]
            linger: 0.25
      - say: |
          The first line gives you fifteen minutes to page on-call and says to include the deploy ID. The other line is for routine notes. Now open the text the parser saved. Line up the archive sentence on both sides. Where did the paging rule first go missing?
        hold: 2.4
        caption_starts:
          - "Now open the text"
          - "Where did the paging rule"
        visual_cues:
          - id: urgent
            phrase: "The first line gives you fifteen minutes"
            targets: [urgent]
            linger: 0.25
          - id: open-extract
            phrase: "open the text the parser saved"
            targets: [open-extract]
            linger: 0.25
          - id: register-rows
            phrase: "Line up the archive sentence on both sides"
            targets: [register-rows]
            linger: 0.25
      - say: |
          It’s already missing from the stored extract. Search can return the entire extract and still miss the paging rule. Now suppose the parser saved both lines. If search still returned only the archive note, inspect what was indexed and retrieved.
        hold: 0.8
        caption_starts:
          - "Now suppose"
          - "If search still returned"
        visual_cues:
          - id: first-loss
            phrase: "It’s already missing from the stored extract"
            targets: [first-loss]
            linger: 0.25
          - id: both-lines
            phrase: "the parser saved both lines"
            targets: [both-lines]
            linger: 0.25
          - id: archive-hit
            phrase: "If search still returned only the archive note"
            targets: [archive-hit]
            linger: 0.25
          - id: next-handoff
            phrase: "inspect what was indexed and retrieved"
            targets: [next-handoff]
            linger: 0.25
  - id: parser-fork
    title: Choose a parser from the source
    visual: PDF, scanned image, HTML, and Markdown follow format-specific paths into a common evidence record.
    beats:
      - say: |
          To repair a missing line, first find out how it was put on the page. This PDF draws letters at positions. A photographed note gives you pixels. A web page has a navigation bar around the rule. A Markdown file marks the section and fences off the command inside it. Those clues tell you what each parser has to preserve.
        hold: 0.55
        visual_cues:
          - id: parser-fork-beat-1-focus-1
            phrase: "This PDF draws letters at positions"
            targets:
              - parser-fork-simulation-12
            color: blue
            linger: 0.6
      - say: |
          For the PDF, reconstruct the reading order from the positioned text. For the photograph, ask the software to read the characters in the image. That’s optical character recognition, or OCR. For HTML, find the main content. In Markdown, keep the heading and the command fence. You’ll check each result against its source.
        hold: 0.7
        visual_cues:
          - id: parser-fork-beat-2-focus-1
            phrase: "reconstruct the reading order"
            targets:
              - parser-fork-simulation-12
            color: blue
            linger: 0.6
      - say: |
          Give each result a record you can trace. A reviewer needs the source and its version, a place to look, and the text that came out. Record which parser produced it. Keep the review decision and a checksum of the text. Now all four adapters can hand their work to the same index.
        hold: 0.55
        visual_cues:
          - id: parser-fork-beat-3-focus-1
            phrase: "which parser produced it"
            targets:
              - parser-fork-simulation-12
            color: blue
            linger: 0.6
          - id: parser-fork-beat-3-focus-2
            phrase: "the source and its version"
            targets:
              - parser-fork-object-source-13
            color: blue
            linger: 0.6
  - id: pdf-layout
    title: Test the actual text layer against the page
    visual: A real three-page PDF fixture places a correct rule, a blank page and an interleaved two-column page beside their actual extractor outputs. Glyph reading paths and a known header removal preserve page identity.
    beats:
      - say: |
          Start with three pages. Read the left column on page three from top to bottom. It gives a complete rollback rule. Now read straight across both columns. That’s how this native extractor read the page. The extractor returned sixty-four, zero and one hundred ten characters. Page three returned the most text. Both deadlines survived, but the actions sit next to each other and the windows have lost their conditions.
        hold: 0.7
        visual_cues:
          - id: pdf-fixture
            phrase: "three pages"
            targets:
              - pdf-fixture
            color: blue
            linger: 0.4
          - id: column-order
            phrase: "read straight across both columns"
            targets:
              - column-order
            color: pink
            linger: 0.4
          - id: pdf-lengths
            phrase: "sixty-four, zero and one hundred ten characters"
            targets:
              - pdf-lengths
            color: cyan
            linger: 0.4
      - say: |
          Page two is blank in this file. On a new source, zero characters could mean a blank, a scan or a parser failure. Inspect what a person can see. A photograph may even have an old OCR text layer behind it. You can copy that text and still get a letter where the page has a digit. Hold pages with encoding damage for review. PDF tags can identify the reading order, if the tags are right and the extractor uses them. Layout mode approximates the printed spacing. Test it on columns, tables and short valid notes.
        hold: 0.7
        visual_cues:
          - id: layer-types
            phrase: "old OCR text layer"
            targets:
              - layer-types
            color: yellow
            linger: 0.4
          - id: empty-page
            phrase: "a blank, a scan or a parser failure"
            targets:
              - empty-page
            color: yellow
            linger: 0.4
          - id: encoding-review
            phrase: "encoding damage"
            targets:
              - encoding-review
            color: pink
            linger: 0.4
          - id: pdf-tags
            phrase: "PDF tags can identify the reading order"
            targets:
              - pdf-tags
            color: cyan
            linger: 0.4
      - say: |
          The article uses thirty characters to help choose a parser and forty in a check for one known sentence. Those thresholds tell you which pages to inspect. For cleanup, match the exact header on the first line. Keep the safety warning even when it repeats on every page. If you also remove a printed footer, the page number must survive in the record. That’s how you’ll find this rule again.
        hold: 0.7
        visual_cues:
          - id: known-header
            phrase: "match the exact header on the first line"
            targets:
              - known-header
            color: cyan
            linger: 0.4
          - id: retain-warning
            phrase: "Keep the safety warning"
            targets:
              - retain-warning
            color: green
            linger: 0.4
          - id: footer-locator
            phrase: "page number must survive in the record"
            targets:
              - footer-locator
            color: cyan
            linger: 0.4
  - id: ocr-review
    title: "Can we release this transcription?"
    visual: "Compare the digit in the scan with the letter in OCR, then compare a complete approved sentence with the same sentence under an obsolete-rule prefix."
    beats:
      - say: |
          Here’s the line on the scan. The second digit of fifteen is a five. Look at the text made from those pixels. The five came back as the letter S. Everything else, right down to the deploy ID, survived. Would you release that deadline to search?
        hold: 2
        caption_starts:
          - "The five came back"
          - "Would you release that deadline"
        visual_cues:
          - id: scan-digit
            phrase: "second digit of fifteen"
            targets: [scan-digit]
            linger: 0.25
          - id: candidate-digit
            phrase: "Look at the text made from those pixels"
            targets: [candidate-digit]
            linger: 0.25
      - say: |
          Hold the candidate for review. Enlarge the same spot on the retained page and read the whole sentence around it. This page says fifteen minutes with the deploy ID. Save a reviewed correction alongside the original reading. A different runbook might really contain the part number one S.
        hold: 0.8
        visual_cues:
          - id: ocr-hold
            phrase: "Hold the candidate for review"
            targets: [ocr-hold]
            linger: 0.25
          - id: inspect-digit
            phrase: "Enlarge the same spot"
            targets: [inspect-digit]
            linger: 0.25
          - id: verified-digit
            phrase: "Save a reviewed correction"
            targets: [verified-digit]
            linger: 0.25
      - say: |
          Now test the surrounding words. On the left is the approved sentence. On the right, a new extract contains that sentence word for word. Read the extra line at the top. Would you accept this version as the current paging rule?
        hold: 2.2
        visual_cues:
          - id: context-input
            phrase: "contains that sentence word for word"
            targets: [context-input]
            linger: 0.25
          - id: context-prefix
            phrase: "Read the extra line at the top"
            targets: [context-prefix]
            linger: 0.25
      - say: |
          Hold it. The prefix calls the rule obsolete. In the article’s check, we collapse whitespace, then compare the whole candidate with the approved sentence. The clean copy passes. The prefixed copy goes to review. An extra rollback rule with a different deadline also needs review. Keep the original so someone can see why.
        hold: 0.8
        caption_starts:
          - "The clean copy passes"
          - "The prefixed copy"
        visual_cues:
          - id: context-compare
            phrase: "compare the whole candidate with the approved sentence"
            targets: [context-compare]
            linger: 0.25
          - id: clean-result
            phrase: "The clean copy passes"
            targets: [clean-result]
            linger: 0.25
          - id: context-results
            phrase: "The prefixed copy goes to review"
            targets: [context-results]
            linger: 0.25
      - say: |
          The next scan may need a better image. Skew, contrast, segmentation and resolution all change what the engine reads. Tesseract recommends an input target of at least three hundred dots per inch. Record the engine version, preprocessing and any confidence score. Use that score to choose what a person checks first. Even a vision parser can invent text on a blank page. The olmOCR project documented a fix for that failure and reports its own benchmark results. Test your critical fields on your own pages.
        hold: 0.7
        visual_cues:
          - id: scan-quality
            phrase: "Skew, contrast, segmentation and resolution"
            targets: [scan-quality]
            linger: 0.25
          - id: ocr-bench
            phrase: "its own benchmark results"
            targets: [ocr-bench]
            linger: 0.25
  - id: table-structure
    title: "Which window belongs to rollback?"
    visual: "Keep both source rows on screen. Trace a faulty join from the rollback event down to the adjacent window. Re-read one reviewed row at a time to serialize the two records and their row locators."
    beats:
      - say: |
          Suppose page seven prints the same two rules in a table. Find rollback failure on the first row. Follow it to the Window column. Now read what the parser saved below. It used a real window from this page. Which cell did it take that window from?
        hold: 2.4
        visual_cues:
          - id: table-row
            phrase: "Find rollback failure on the first row"
            targets: [table-row]
            linger: 0.25
          - id: bad-window
            phrase: "read what the parser saved below"
            targets: [bad-window]
            linger: 0.25
      - say: |
          Fourteen days came from the archive row. Watch the path drop one row at the window, then jump back for the deploy ID. Every character in that deadline is legible. To repair the association, read straight across the reviewed rollback row. Page on-call within fifteen minutes with the deploy ID. Save the row and its column headers alongside the sentence.
        hold: 0.8
        caption_starts:
          - "To repair the association"
          - "Page on-call within"
        visual_cues:
          - id: wrong-path
            phrase: "the path drop one row at the window"
            targets: [wrong-path]
            linger: 0.25
          - id: read-row
            phrase: "read straight across the reviewed rollback row"
            targets: [read-row]
            linger: 0.25
          - id: row-saved
            phrase: "Page on-call within fifteen minutes with the deploy ID"
            targets: [row-saved]
            linger: 0.25
      - say: |
          Move down one row. This time it’s routine deploy notes. Follow the cells across again. Archive within fourteen days. There’s no required ID on this row. A citation to table one, row two takes you back to those cells. Carry merged headers, footnotes and any cell coordinates with their units and origin so a reviewer can check the same association.
        hold: 0.8
        caption_starts:
          - "Archive within fourteen days"
        visual_cues:
          - id: second-row
            phrase: "Move down one row"
            targets: [second-row]
            linger: 0.25
          - id: read-second
            phrase: "Follow the cells across again"
            targets: [read-second]
            linger: 0.25
          - id: archive-saved
            phrase: "Archive within fourteen days"
            targets: [archive-saved]
            linger: 0.25
  - id: html-boundaries
    title: What survives HTML extraction?
    visual: An HTML page puts a bold tag inside a deadline. The digits close up while the paragraph break separates two sentences. A quoted marker in a training manual sends accurate text to trust review.
    beats:
      - say: |
          Look at the digits in the HTML. The one is plain text. The five is in bold. The emphasis tag ends, and the number is still fifteen. Join those two characters. Between paragraphs, insert a space so the next sentence starts cleanly. Finally, read just the main region. The archive instruction belongs to navigation and stays out of the extract.
        hold: 0.7
        visual_cues:
          - id: html-source
            phrase: "Look at the digits"
            targets:
              - html-source
            color: blue
            linger: 0.4
          - id: inline-number
            phrase: "Join those two characters"
            targets:
              - inline-number
            color: green
            linger: 0.4
          - id: block-separator
            phrase: "Between paragraphs, insert a space"
            targets:
              - block-separator
            color: cyan
            linger: 0.4
          - id: html-main-only
            phrase: "read just the main region"
            targets:
              - html-main-only
            color: cyan
            linger: 0.4
      - say: |
          Try those boundaries separately. The three extracts keep a number whole, separate two sentences, and leave navigation out. The next two inputs have a missing or empty main region. Send both to review. These are well-formed static pages. For a live site you also have to account for browser parsing, visibility and JavaScript. Preserve tables and preformatted blocks separately, since flattening their spaces can change a command.
        hold: 0.7
        visual_cues:
          - id: html-fixtures
            phrase: "The three extracts"
            targets:
              - html-fixtures
            color: green
            linger: 0.4
          - id: html-scope
            phrase: "For a live site"
            targets:
              - html-scope
            color: yellow
            linger: 0.4
      - say: |
          Both of these pages were transcribed correctly. The training manual quotes a phrase on the application’s marker list. The gate quarantines the quotation for review. The other page has no matching phrase. It stays untrusted source data. A literal match can flag a harmless example, and unfamiliar wording can pass through. The application controls tool permissions. A line on either page can only supply evidence.
        hold: 0.7
        visual_cues:
          - id: html-trust
            phrase: "quarantines the quotation"
            targets:
              - html-trust
            color: pink
            linger: 0.4
          - id: data-authority
            phrase: "untrusted source data"
            targets:
              - data-authority
            color: yellow
            linger: 0.4
  - id: markdown-slices
    title: Preserve repeated headings and exact fences
    visual: The parser starts separate records at lines 1, 2, 5 and 11. A fenced shell comment stays with its command while the two Agent command headings keep distinct locators.
    beats:
      - say: |
          Find both headings called Agent command. The first starts on line five and contains a shell command. The second starts on line eleven and tells you what to include in the report. Use the parser’s heading tokens to keep four ordered records, including the preamble at the top. A map keyed by heading would lose the first command. Inside the fence, the line starting with a hash is a shell comment. Keep it with its command.
        hold: 0.7
        visual_cues:
          - id: markdown-records
            phrase: "four ordered records"
            targets:
              - markdown-records
            color: blue
            linger: 0.4
          - id: fenced-comment
            phrase: "the line starting with a hash is a shell comment"
            targets:
              - fenced-comment
            color: yellow
            linger: 0.4
      - say: |
          Slice the original source at those boundaries. Compare the indentation and fence marks in the copy with the ones on the left. Keep the trailing spaces too. Markdown can use them to break a line. You can normalize line endings separately. The two sections have distinct line locators in this version. After an edit moves the lines, use the section identity and its heading path to find it again.
        hold: 0.7
        visual_cues:
          - id: source-slices
            phrase: "Slice the original source"
            targets:
              - source-slices
            color: green
            linger: 0.4
          - id: heading-locators
            phrase: "distinct line locators"
            targets:
              - heading-locators
            color: cyan
            linger: 0.4
  - id: provenance-record
    title: "Open the citation"
    visual: "An unchanged sentence points to the wrong revision. Follow the locator to the older page, then bind it to the reviewed revision and compare the actual page text. Independent source locators survive equal normalized hashes."
    beats:
      - say: |
          Here’s a citation someone wants to use. The record says revision seven, page seven. Its sentence gives the fifteen-minute deadline, and its text hash matches the reviewed extract. Follow the link to the original. Look at the revision it opened. Would you fix the saved words or the link?
        hold: 2
        visual_cues:
          - id: cite-record
            phrase: "The record says revision seven"
            targets: [cite-record]
            linger: 0.25
          - id: open-citation
            phrase: "Follow the link to the original"
            targets: [open-citation]
            linger: 0.25
      - say: |
          Repair the citation. It opened revision six, where the deadline was thirty minutes. The extract can pass its byte check while the citation opens the wrong edition. Bind the link to the immutable revision seven file and open page seven again. Now the condition, deadline and deploy ID agree. Keep the source file’s hash alongside the extract hash so you can check each one independently.
        hold: 0.8
        caption_starts:
          - "Bind the link"
          - "Now the condition"
        visual_cues:
          - id: wrong-edition
            phrase: "Revision six"
            targets: [wrong-edition]
            linger: 0.25
          - id: bind-source
            phrase: "Bind the link to the immutable revision seven file"
            targets: [bind-source]
            linger: 0.25
          - id: verify-source
            phrase: "open page seven again"
            targets: [verify-source]
            linger: 0.25
      - say: |
          Save the parser version and settings so you can repeat the extraction. Compare the deadline and deploy ID on both sides. The reviewer can approve this wording. To show the quote, check the reader’s access to page seven. To send a pager alert, check the application’s tool permissions.
        hold: 0.7
        caption_starts:
          - "Compare the deadline"
          - "To show the quote"
          - "To send a pager alert"
        visual_cues:
          - id: parser-settings
            phrase: "Save the parser version and settings"
            targets: [parser-settings]
            linger: 0.25
          - id: reviewed-words
            phrase: "Compare the deadline and deploy ID on both sides"
            targets: [reviewed-words]
            linger: 0.25
          - id: quote-policy
            phrase: "check the reader’s access to page seven"
            targets: [quote-policy]
            linger: 0.25
          - id: tool-policy
            phrase: "check the application’s tool permissions"
            targets: [tool-policy]
            linger: 0.25
      - say: |
          Two sources can even yield identical bytes. Take the shorter sentence here. Collapsing spaces in ordinary prose gives the same text hash for a PDF, a reviewed scan and an HTML page. Each citation still leads to its own source. For a Markdown command, normalize line endings and keep the original indentation, fences and trailing spaces. Changing those bytes can change the command.
        hold: 0.7
        visual_cues:
          - id: identity-contract
            phrase: "Two sources can even yield identical bytes"
            targets: [identity-contract]
            linger: 0.25
          - id: normalization-hash
            phrase: "the same text hash"
            targets: [normalization-hash]
            linger: 0.25
          - id: markdown-whitespace
            phrase: "For a Markdown command"
            targets: [markdown-whitespace]
            linger: 0.25
  - id: chunk-locators
    title: Chunking must preserve the locator
    visual: A source passage becomes overlapping chunks while its page and heading locators travel with each chunk.
    beats:
      - say: |
          Search works on shorter passages called chunks. Here’s our runbook again. Take the rollback sentence as one chunk. Keep the condition and action alongside the full window and the deploy ID requirement. Save the file version, heading and page with it so a reader can reopen the original.
        hold: 0.55
        visual_cues:
          - id: chunk-locators-beat-1-focus-1
            phrase: "Take the rollback sentence as one chunk"
            targets:
              - chunk-locators-object-rollback-failure-page-on-call-42
            color: blue
            linger: 0.6
      - say: |
          The second chunk starts just before the first one ends, at the ID requirement. That overlap means you can see the phrase in both passages. Follow the first chunk’s locator back to page seven. If an exception extends beyond a cut, include it or link the related passage. Someone reading just the number needs a way to recover what qualifies it.
        hold: 0.7
        visual_cues:
          - id: chunk-locators-beat-2-focus-1
            phrase: "The second chunk starts just before the first one ends"
            targets:
              - chunk-locators-object-rollback-failure-page-on-call-42
            color: blue
            linger: 0.6
          - id: chunk-locators-beat-2-focus-2
            phrase: "Follow the first chunk’s locator"
            targets:
              - chunk-locator-0
            color: blue
            linger: 0.6
      - say: |
          Make the cut in the units your source gives you. Two identical Markdown headings can have different line ranges and different commands. Keep the whole fence. In a PDF, retain the page in the record even when you remove the printed footer. The reader can then check exactly which revision supplied the passage.
        hold: 0.55
        visual_cues:
          - id: chunk-locators-beat-3-focus-1
            phrase: "retain the page in the record"
            targets:
              - chunk-locators-object-rollback-failure-page-on-call-42
            color: blue
            linger: 0.6
          - id: chunk-locators-beat-3-focus-2
            phrase: "Two identical Markdown headings"
            targets:
              - chunk-locators-object-rollback-failure-page-on-call-within-15-minutes-in-40
            color: blue
            linger: 0.6
  - id: version-publication
    title: Publish membership, content and access changes together
    visual: Two explicit source manifests compute additions, removals, changed text and permission-only changes. A staged release replaces the visible version coherently while the source page locator can move independently of the stable section ID.
    beats:
      - say: |
          Compare two editions of the same runbook. Read page seven on each side. Thirty minutes became fifteen. Page eight still gives the archive rule. Page nine is gone and page ten has appeared. Compare the page keys first, then the text on the pages they share. Page ten is added, page nine is removed, and page seven has changed. In a corpus, each of those keys also needs the document identity.
        hold: 0.7
        visual_cues:
          - id: version-inputs
            phrase: "Read page seven on each side"
            targets:
              - version-inputs
            color: blue
            linger: 0.4
          - id: version-diff
            phrase: "Page ten is added, page nine is removed, and page seven has changed"
            targets:
              - version-diff
            color: yellow
            linger: 0.4
      - say: |
          Now take an unchanged paragraph and move it from page seven to page nine. If page number is your only key, you’ll see a deletion and an addition. Give the paragraph a stable section identity, or record how the old section corresponds to the new one. Update its locator when it moves. Once all the new records are ready, switch the published version at once. A reader can now get a coherent edition, including its deletions.
        hold: 0.7
        visual_cues:
          - id: stable-section
            phrase: "stable section identity"
            targets:
              - stable-section
            color: cyan
            linger: 0.4
          - id: atomic-version
            phrase: "switch the published version at once"
            targets:
              - atomic-version
            color: green
            linger: 0.4
      - say: |
          Here the keys are section names. Freeze is new, pager-test is gone and the archive text changed. Look at rollback. Its text hash stays the same, but its owner removed the security group. Compare access separately. The next request from a security reader must be denied. Check cached evidence as well as the live index. A single section can change both its wording and its permissions in the same release.
        hold: 0.7
        visual_cues:
          - id: access-only
            phrase: "its owner removed the security group"
            targets:
              - access-only
            color: pink
            linger: 0.4
          - id: revoke-reader
            phrase: "The next request from a security reader must be denied"
            targets:
              - revoke-reader
            color: pink
            linger: 0.4
  - id: visual-retrieval
    title: "Searching a page image"
    visual: "Two page images earn the same sum of row maxima. On the second page, the number sits in a section header and the unit appears in a time log. A matching score can return a page for inspection without supporting a paging deadline."
    beats:
      - say: |
          Some pages carry meaning in where the words sit. A diagram or a dense table can fall apart when we try to read it as a paragraph. Try searching the page image instead. Here are three patches from one page. For each query word, compare its vector with each patch vector. These example dot products are the match scores. Which patch wins for each word?
        hold: 2.2
        visual_cues:
          - id: picture-patches
            phrase: "three patches from one page"
            targets: [picture-patches]
            linger: 0.25
          - id: patch-products
            phrase: "These example dot products are the match scores"
            targets: [patch-products]
            linger: 0.25
      - say: |
          The policy line wins both times. For fifteen, keep the largest score in the first row. For minutes, keep the largest in the second. Add those two numbers. The page scores one point seven nine. That’s late interaction. Each query vector picks its own best patch before we sum the matches.
        hold: 0.75
        caption_starts:
          - "The page scores"
        visual_cues:
          - id: patch-winners
            phrase: "The policy line wins both times"
            targets: [patch-winners]
            linger: 0.25
          - id: late-original-result
            phrase: "The page scores one point seven nine"
            targets: [late-original-result]
            linger: 0.25
      - say: |
          Now try a time log with the same query. On this page, fifteen is a section number in the header. Minutes is a unit in the log entry. Look at the scores again. Does moving the strongest match for fifteen into the header change the sum?
        hold: 2.25
        visual_cues:
          - id: other-page
            phrase: "On this page, fifteen is a section number"
            targets: [other-page]
            linger: 0.25
      - say: |
          The winners are on different parts of the page. Fifteen still gets point nine one. Minutes still gets point eight eight. The sum is still one point seven nine. Open the page and try to quote the deadline. The time log gives you no such rule. Retain the original image, version, locator and access scope. Compare this path with text search on page recall, answer grounding, latency and index size.
        hold: 0.85
        caption_starts:
          - "The sum is still"
          - "Open the page"
          - "The time log gives you"
        visual_cues:
          - id: late-maxima
            phrase: "The winners are on different parts of the page"
            targets: [late-maxima]
            linger: 0.25
          - id: late-sum
            phrase: "The sum is still one point seven nine"
            targets: [late-sum]
            linger: 0.25
      - say: |
          How much space do the vectors take for one page? Count one thousand twenty-four image vectors and six text vectors. Multiply by one hundred twenty-eight coordinates per vector and two bytes per coordinate. Two hundred fifty-seven and a half kibibytes per page. Images and the search index take additional space. The original ColPali paper reports its storage per page and compares search rankings on ViDoRe. On your own pages, compare the space each method takes and how often it finds the page you need. To try this with the Sentence Transformers multi-vector encoder, choose a checkpoint trained for page images. Encode the queries and pages separately, then compute their similarity.
        hold: 0.8
        caption_starts:
          - "Multiply by"
          - "Two hundred fifty-seven"
          - "The original ColPali paper"
          - "To try this"
        visual_cues:
          - id: storage-vectors
            phrase: "one thousand twenty-four image vectors"
            targets: [storage-vectors]
            linger: 0.25
          - id: storage-total
            phrase: "two hundred fifty-seven and a half kibibytes per page"
            targets: [storage-total]
            linger: 0.25
          - id: storage-factors
            phrase: "Multiply by one hundred twenty-eight coordinates per vector and two bytes per coordinate"
            targets: [storage-factors]
            linger: 0.25
          - id: paper-scope
            phrase: "The original ColPali paper"
            targets: [paper-scope]
            linger: 0.25
          - id: migration-api
            phrase: "Sentence Transformers multi-vector encoder"
            targets: [migration-api]
            linger: 0.25
  - id: evidence-gate
    title: Admit records only after their checks
    visual: Parser output, quality review, structure checks, and provenance converge at a visible index-admission gate.
    beats:
      - say: |
          Four versions of the rollback rule reach the index writer. The native PDF passed its source check. The scan still says one S. The HTML adapter kept the main passage and the Markdown adapter kept its section and code fence. Which records have the evidence they need?
        hold: 1.4
        visual_cues:
          - id: evidence-gate-beat-1-focus-1
            phrase: "The HTML adapter kept the main passage"
            targets:
              - evidence-gate-object-native-pdf-reviewed-scan-1s-needs-review-html-shel-57
            color: blue
            linger: 0.6
          - id: evidence-gate-beat-1-focus-2
            phrase: "The native PDF passed its source check"
            targets:
              - evidence-gate-object-native-pdf-reviewed-scan-1s-needs-review-html-shel-57
            color: blue
            linger: 0.6
      - say: |
          Send the three reviewed records to the index. Keep the suspect scan in the review queue. A reviewer can find it by source and page, inspect the critical character and release a corrected record. Until then, the index excludes that reading.
        hold: 0.7
        visual_cues:
          - id: evidence-gate-beat-2-focus-1
            phrase: "three reviewed records to the index"
            targets:
              - evidence-gate-simulation-60
            color: blue
            linger: 0.6
          - id: evidence-gate-beat-2-focus-2
            phrase: "Keep the suspect scan in the review queue"
            targets:
              - evidence-gate-simulation-58
            color: blue
            linger: 0.6
          - id: admit-indexed
            phrase: "Send the three reviewed records"
            targets:
              - admit-indexed
            color: green
            linger: 0.4
      - say: |
          Work backward from the next wrong answer. Compare the claim with the passage that reader actually received. If the two disagree, inspect generation. If the passage is missing the rule, open the indexed chunk, the saved extract and the original page. The first handoff that lost the sentence tells you where to investigate.
        hold: 0.55
        visual_cues:
          - id: evidence-gate-beat-3-focus-1
            phrase: "open the indexed chunk"
            targets:
              - evidence-gate-simulation-58
            color: blue
            linger: 0.6
          - id: evidence-gate-beat-3-focus-2
            phrase: "the passage that reader actually received"
            targets:
              - evidence-gate-simulation-60
            color: blue
            linger: 0.6
      - say: |
          Now give the HTML record a quarantine label. Its transcription is still accurate. In this manifest, the writer checks the supplied quality and trust labels. Two records pass and two wait. A production writer also checks for empty text, required fields, checksums and provenance. Preserve access scope and enforce it again for the reader. Before changing parsers, run the reviewed examples through the actual adapters. If more pages from one source start piling up in review, check whether its format changed.
        hold: 0.7
        visual_cues:
          - id: manifest-counts
            phrase: "Two records pass and two wait"
            targets:
              - manifest-counts
            color: cyan
            linger: 0.4
          - id: manifest-limits
            phrase: "A production writer also checks"
            targets:
              - manifest-limits
            color: yellow
            linger: 0.4
  - id: parser-boundary
    title: Protect the parser before reviewing its output
    visual: An uploaded source crosses type and resource admission, then runs inside an isolated worker. An apparently small compressed input expands beyond a declared limit and stops; a fetched URL is constrained separately from text trust.
    beats:
      - say: |
          Before opening an upload, check the allowed file type and size. Run the parser in an isolated worker with limits on pages, time and memory. Here the compressed file is four mebibytes. Its expanded contents could take a gibibyte. Count expanded bytes as the decoder produces them and stop at the cap of one hundred twenty-eight mebibytes. Keep the restricted original and the rejection reason. A later check on extracted text would come too late to protect the worker.
        hold: 0.7
        visual_cues:
          - id: parser-limits
            phrase: "isolated worker with limits on pages, time and memory"
            targets:
              - parser-limits
            color: blue
            linger: 0.4
          - id: expanded-size
            phrase: "Count expanded bytes as the decoder produces them"
            targets:
              - expanded-size
            color: pink
            linger: 0.4
          - id: parser-reject
            phrase: "the rejection reason"
            targets:
              - parser-reject
            color: pink
            linger: 0.4
      - say: |
          A web fetch has another boundary. The first address is allowed. A redirect proposes a different destination. Check the host and address you would actually contact before making that request. This destination is outside the allowed network policy, so stop here. For a page the worker can fetch, the later checks still apply. Verify the quality, trust label and current access before returning its evidence.
        hold: 0.7
        visual_cues:
          - id: fetch-boundary
            phrase: "A redirect proposes a different destination"
            targets:
              - fetch-boundary
            color: yellow
            linger: 0.4
          - id: separate-gates
            phrase: "Verify the quality, trust label and current access"
            targets:
              - separate-gates
            color: cyan
            linger: 0.4
  - id: fresh-case
    title: Can the reader use this restore rule?
    visual: "Reviewers compare 2S with the source pixels. The rejected reading is retained when the verified rule enters the index. Identical queries as ops and as an incident commander return different evidence. Apply the authorized rule to the incident clock."
    beats:
      - say: |
          A backup restore fails at three twelve. The restore ID is B forty-one. You’re reviewing page four of a different runbook. Read the deadline on the source, then read the same spot in its transcription. The ops reader already has access. Can you release this candidate to search?
        hold: 2.3
        visual_cues:
          - id: fresh-source
            phrase: "Read the deadline on the source"
            targets: [fresh-source]
            linger: 0.25
          - id: fresh-predict
            phrase: "Can you release this candidate to search"
            targets: [fresh-predict]
            linger: 0.25
      - say: |
          Keep it in review. The candidate says two S. Compare the whole rule with the scan. It says to notify storage on-call within twenty-five minutes of a restore failure and include the restore ID. Save that source-verified correction. Tie the new expectation to this revision of the backup runbook and keep the first reading for the audit. With the other writer checks passed, the corrected record can enter the index. The ops reader can now retrieve it.
        hold: 0.85
        caption_starts:
          - "Save that source-verified correction"
          - "With the other writer checks passed"
        visual_cues:
          - id: fresh-review
            phrase: "Keep it in review"
            targets: [fresh-review]
            linger: 0.25
          - id: fresh-correction
            phrase: "Save that source-verified correction"
            targets: [fresh-correction]
            linger: 0.25
          - id: fresh-index
            phrase: "the corrected record can enter the index"
            targets: [fresh-index]
            linger: 0.25
      - say: |
          Now the owner restricts this same page to incident commanders. The words, the text hash and the ops reader stay the same. On the next request, can that reader still receive the rule?
        hold: 2.2
        visual_cues:
          - id: fresh-access
            phrase: "restricts this same page to incident commanders"
            targets: [fresh-access]
            linger: 0.25
      - say: |
          No. Retrieval must withhold it from ops. An old search result needs the current access check too. Now an incident commander asks the same question. The rule can be returned to this reader. Look back at the failure time. By what time should the commander notify storage on-call, and which ID goes with the message?
        hold: 2.4
        caption_starts:
          - "Now an incident commander"
          - "The rule can be returned"
        visual_cues:
          - id: fresh-deny
            phrase: "Retrieval must withhold it from ops"
            targets: [fresh-deny]
            linger: 0.25
          - id: fresh-commander
            phrase: "an incident commander asks the same question"
            targets: [fresh-commander]
            linger: 0.25
          - id: fresh-return
            phrase: "The rule can be returned to this reader"
            targets: [fresh-return]
            linger: 0.25
          - id: fresh-clock
            phrase: "Look back at the failure time"
            targets: [fresh-clock]
            linger: 0.25
      - say: |
          Start at three twelve and add the twenty-five minutes on page four. Three thirty-seven is the deadline. Send restore ID B forty-one with the alert. Keep the whole rule in one chunk so a search for the deadline also brings back the contact and the ID requirement.
        hold: 1.3
        caption_starts:
          - "Three thirty-seven is the deadline"
          - "Send restore ID"
          - "Keep the whole rule"
        visual_cues:
          - id: fresh-count
            phrase: "add the twenty-five minutes on page four"
            targets: [fresh-count]
            linger: 0.25
          - id: fresh-deadline
            phrase: "Three thirty-seven is the deadline"
            targets: [fresh-deadline]
            linger: 0.25
          - id: fresh-id
            phrase: "Send restore ID B forty-one"
            targets: [fresh-id]
            linger: 0.25
          - id: fresh-chunk
            phrase: "Keep the whole rule in one chunk"
            targets: [fresh-chunk]
            linger: 0.25
