  - id: overlap
    title: When can the next chunk use the wire?
    visual: >-
      One clock tracks dispatch, compute and combine. The tape pauses after dispatch A with a free
      communication lane. Replaying it with two slots admits B. With only one slot, B waits for A to
      finish combining.
    beats:
      - say: >-
          Here are two chunks of expert work in Mega MoE. The upper lane sends the rows out and brings the
          results back. The lower lane runs the projections and activation.
          In these invented time units, each chunk takes one to dispatch, two to compute and one to combine.
          Send A through all three stages, then send B. Both results are back at time eight.
        hold: 0.8
        visual_cues:
          - id: dg-overlap-0-0
            phrase: >-
              Here are two chunks of expert work in Mega MoE. The upper lane sends the rows out and brings
              the results back. The lower lane runs the projections and activation.
            targets: [overlap-tape]
            caption_boundary: true
          - id: dg-overlap-0-1
            phrase: >-
              In these invented time units, each chunk takes one to dispatch, two to compute and one to
              combine.
            targets: [overlap-tape]
            caption_boundary: true
          - id: dg-overlap-0-2
            phrase: >-
              Send A through all three stages, then send B. Both results are back at time eight.
            targets: [overlap-tape]
            caption_boundary: true
      - say: >-
          Replay with two storage slots. Communication and compute can run at the same time, with one job on
          each lane.
          Stop at time one. Chunk A has its inputs and starts computing. B is ready to dispatch.
          Can B leave now, and which slot would hold its rows?
        hold: 2.2
        visual_cues:
          - id: dg-overlap-1-0
            phrase: >-
              Replay with two storage slots. Communication and compute can run at the same time, with one
              job on each lane.
            targets: [overlap-tape]
            caption_boundary: true
          - id: dg-overlap-1-1
            phrase: >-
              Stop at time one. Chunk A has its inputs and starts computing. B is ready to dispatch.
            targets: [overlap-tape]
            caption_boundary: true
          - id: dg-overlap-1-2
            phrase: >-
              Can B leave now, and which slot would hold its rows?
            targets: [overlap-tape]
            caption_boundary: true
      - say: >-
          B takes the free slot and dispatches while A computes.
          At time three, A can combine while B computes. Each chunk still waits for its own inputs.
          B finishes combining at time six. Keep each slot until its return has finished.
        hold: 1
        visual_cues:
          - id: dg-overlap-2-0
            phrase: >-
              B takes the free slot and dispatches while A computes.
            targets: [overlap-tape]
            caption_boundary: true
          - id: dg-overlap-2-1
            phrase: >-
              At time three, A can combine while B computes. Each chunk still waits for its own inputs.
            targets: [overlap-tape]
            caption_boundary: true
          - id: dg-overlap-2-2
            phrase: >-
              B finishes combining at time six. Keep each slot until its return has finished.
            targets: [overlap-tape]
            caption_boundary: true
      - say: >-
          Replay time one with a single slot. A still occupies it, even though the wire is free.
          B has to wait for A to finish combining at time four. Now the slot can change hands.
          The last return moves back to time eight. On hardware, a busy link or an empty queue can also
          prevent overlap.
        hold: 1
        visual_cues:
          - id: dg-overlap-3-0
            phrase: >-
              Replay time one with a single slot. A still occupies it, even though the wire is free.
            targets: [overlap-tape]
            caption_boundary: true
          - id: dg-overlap-3-1
            phrase: >-
