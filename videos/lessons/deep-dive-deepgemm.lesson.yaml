  - id: gemm-contract
    title: Earn the whole matrix shape and operation count
    visual: Construct every entry of the existing two-row example before expanding dimensions to the public
      benchmark-sized product.
    beats:
      - say: For the common NT interface, activation A has M rows and K columns. Stored weights B have N rows and K
          columns. Multiply A by the transpose of B, giving M by N output entries. Each entry multiplies
          matching coordinates and sums them; an optional C contributes an existing output. The two tiny rows
          produce eleven and minus four against the same stored weight row.
        hold: 0.6
        visual_cues:
          - id: gemm-contract-b0
            phrase: For the common NT interface, activation A has M rows and K columns.
            targets:
              - gemm-contract-construction
            color: cyan
            linger: 0.4
          - id: dg-gemm-contract-0-0
            phrase: For the common NT interface, activation A has M rows and K columns.
            targets:
              - gemm-contract-construction
            color: blue
            linger: 0.25
          - id: dg-gemm-contract-0-1
            phrase: Stored weights B have N rows and K columns.
            targets:
              - gemm-contract-construction
            color: blue
            linger: 0.25
          - id: dg-gemm-contract-0-2
            phrase: Multiply A by the transpose of B, giving M by N output entries.
            targets:
              - gemm-contract-construction
            color: blue
            linger: 0.25
          - id: dg-gemm-contract-0-3
            phrase: Each entry multiplies matching coordinates and sums them; an optional C contributes an existing
              output.
            targets:
              - gemm-contract-construction
            color: blue
            linger: 0.25
          - id: dg-gemm-contract-0-4
            phrase: The two tiny rows produce eleven and minus four against the same stored weight row.
            targets:
              - gemm-contract-construction
            color: green
            linger: 0.25
      - say: >-
          The whole product performs approximately two times M times N times K floating-point operations when a multiply and an add count separately.
          With M five hundred twelve and N and K both four thousand ninety-six, that is seventeen point one eight billion operations.
          Suppose that takes ten microseconds.
          Divide the operation count by those ten microseconds and you get about one thousand seven hundred eighteen tera-operations per second.
        caption_starts:
