  - id: scales
    title: What does each group contribute?
    visual: >-
      Pair activation and weight coordinates vertically. Scale only the second partial dot, then check the
      result by dequantizing the original coordinates in each group.
    beats:
      - say: >-
          These two rows store low-precision values. Each pair of columns shares an activation scale and a
          weight scale.
          Match each activation to the weight beneath it. The vertical pairs belong to the same coordinate.
          In the first group the two products add to four. In the second group, minus three plus eight gives
