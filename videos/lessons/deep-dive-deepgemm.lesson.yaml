  - id: project-boundary
    title: >-
      Who does the work for this row?
    visual: Keep the same routed row while model papers, kernel implementation and runtime policy occupy separate
      physical owners.
    beats:
      - say: >-
          DeepSeek publishes the DeepGEMM kernels under the MIT license.
          The model defines which experts a token can visit.
          Its router selects the experts for this token.
          DeepGEMM can multiply the token row by the selected expert’s weights.
          The serving runtime loads the model, admits and batches requests, and returns the output. Its clock includes all of that work.
        hold: 0.6
        visual_cues:
          - id: project-boundary-b0
            phrase: >-
              DeepSeek publishes the DeepGEMM kernels under the MIT license.
            targets:
              - project-boundary-construction
