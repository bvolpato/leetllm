scenes:
  - id: intro
    title: >-
      Where will token seven land?
    visual: >-
      A gold token row slides into the compact buffer. Two empty tails push its address from 256 to 384. The four-expert view then shows the total allocation.
    beats:
      - say: >-
          Watch token seven slide into the buffer.
          Each blue strip holds the rows going to one expert.
          Token seven is the first row for expert two.
          Sixty-four rows plus one hundred ninety-two puts it at row two hundred fifty-six, counting from zero.
          This kernel packs each expert into whole blocks of one hundred twenty-eight rows.
          Where will token seven land when we add the padding?
        caption_starts:
          - "at row two hundred fifty-six"
        hold: 2.5
        visual_cues:
          - id: dg-intro-0-0
            phrase: >-
              Watch token seven slide into the buffer.
            targets: [pack-pin]
            caption_boundary: true
          - id: dg-intro-0-1
            phrase: >-
              Each blue strip holds the rows going to one expert.
            targets: [expert-packed-rows]
            caption_boundary: true
          - id: dg-intro-0-2
            phrase: >-
              Token seven is the first row for expert two.
            targets: [expert-packed-rows]
            caption_boundary: true
          - id: dg-intro-0-3
            phrase: >-
              Sixty-four rows plus one hundred ninety-two puts it at row two hundred fifty-six, counting from zero.
            targets: [pack-pin]
            caption_boundary: true
          - id: dg-intro-0-4
            phrase: >-
              This kernel packs each expert into whole blocks of one hundred twenty-eight rows.
            targets: [expert-packed-rows]
            caption_boundary: true
          - id: dg-intro-0-5
            phrase: >-
              Where will token seven land when we add the padding?
            targets: [pack-pin]
            caption_boundary: true
      - say: >-
          Give the first expert one block. Its sixty-four rows fill half of it.
          The second expert has one full block and sixty-four rows left over. Give it a second block.
          Row three hundred eighty-four. The padding moved token seven, and expert two still owns that row.
          The thirty-two rows for expert two need a block of their own. The last expert fills its block exactly.
          Count the blocks from left to right. One, two, one, one.
          That makes six hundred forty reserved rows for four hundred sixteen assignments. The other two hundred twenty-four rows are padding.
        caption_starts:
          - "The padding moved token seven"
        hold: 1.2
        visual_cues:
          - id: dg-intro-1-0
            phrase: >-
              Give the first expert one block. Its sixty-four rows fill half of it.
            targets: [expert-packed-rows]
            caption_boundary: true
          - id: dg-intro-1-1
            phrase: >-
              The second expert has one full block and sixty-four rows left over. Give it a second block.
            targets: [expert-packed-rows]
            caption_boundary: true
          - id: dg-intro-1-2
            phrase: >-
              Row three hundred eighty-four.
            targets: [pack-pin]
            caption_boundary: true
          - id: dg-intro-1-3
            phrase: >-
              The thirty-two rows for expert two need a block of their own. The last expert fills its block
              exactly.
            targets: [expert-packed-rows]
            caption_boundary: true
          - id: dg-intro-1-4
            phrase: >-
              Count the blocks from left to right. One, two, one, one.
            targets: [expert-packed-rows]
            caption_boundary: true
          - id: dg-intro-1-5
            phrase: >-
              That makes six hundred forty reserved rows for four hundred sixteen assignments. The other two
              hundred twenty-four rows are padding.
            targets: [pack-result]
            caption_boundary: true
      - say: >-
          Four separate launches can each start at their own first row. Each multiply may still have a partly filled edge tile.
          DeepGEMM can run the same projection for all four experts in one launch.
          To compare the two paths, time the packing, the multiply and the return to source order.
        hold: 0.8
