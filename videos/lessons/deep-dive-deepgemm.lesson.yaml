  - id: dot
    title: One output element accumulates matching coordinates
    visual: Two stored rows reveal pairwise products in order. A running sum follows the highlighted K coordinate
      and completes at eleven; a second row then produces minus four.
    beats:
      - say: >
          Start with the smallest useful operation. An output element pairs one row from the activation matrix
          with one row from the stored weight matrix. Matching coordinates multiply, and their products add.
          Follow the highlighted coordinate as our first output accumulates.
        hold: 0.6
        visual_cues:
          - id: dot-beat-1-focus-1
            phrase: Matching coordinates multiply, and their products add
            targets:
              - dot-s-a
            color: cyan
            linger: 0.65
          - id: dg-dot-0-0
            phrase: Start with the smallest useful operation.
            targets:
              - dot-construction
            color: blue
            linger: 0.25
          - id: dg-dot-0-1
            phrase: An output element pairs one row from the activation matrix with one row from the stored weight matrix.
            targets:
              - dot-construction
            color: blue
            linger: 0.25
          - id: dg-dot-0-2
            phrase: Matching coordinates multiply, and their products add.
            targets:
              - dot-construction
            color: blue
            linger: 0.25
          - id: dg-dot-0-3
            phrase: Follow the highlighted coordinate as our first output accumulates.
            targets:
              - dot-construction
            color: green
            linger: 0.25
      - say: >
          The next activation row reuses the same weight row and produces a different output. A whole matrix
          multiplication repeats these row pairings. The common NT interface stores weights by rows and writes
          the formula with a transpose so the shared inner dimension meets correctly.
