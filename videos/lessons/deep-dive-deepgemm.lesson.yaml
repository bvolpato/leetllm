            color: blue
            linger: 0.25
          - id: dg-reuse-budget-0-5
            phrase: >-
              To see how many bytes reach GPU memory, measure traffic while this tile runs.
            targets:
              - reuse-budget-construction
            color: green
            linger: 0.25
      - say: Global memory supplies source tensors. Shared memory holds staged tiles for the block, and registers can
          retain a thread’s partial sums. Tensor cores replace the scalar inner arithmetic with matrix
          multiply-accumulate instructions using supported fragments. Larger tiles can improve reuse while
          consuming more shared memory and registers. Register spilling sends values into off-chip local
          memory, so a bigger tile can also remove the expected benefit.
        hold: 0.6
        visual_cues:
          - id: reuse-budget-b1
            phrase: Global memory supplies source tensors.
            targets:
              - reuse-budget-construction
            color: cyan
            linger: 0.4
          - id: dg-reuse-budget-1-0
            phrase: Global memory supplies source tensors.
            targets:
              - reuse-budget-construction
            color: blue
