  - id: reuse-budget
    title: Conserve the values reused by a tile
    visual: Show the same eight scalar operands feeding eight products, then retain staged copies while four
      outputs accumulate.
    beats:
      - say: >-
          Consider our two-by-two output with reduction width two.
          It needs eight scalar multiplies.
          A naive one-output thread requests two activation values and two weight values for each of four outputs: sixteen operand requests.
          The complete A and B tiles contain only eight distinct scalars.
          Staging those tiles can supply the repeated pairings from nearby storage.
          To see how many bytes reach GPU memory, measure traffic while this tile runs.
        hold: 0.6
        visual_cues:
          - id: reuse-budget-b0
            phrase: Consider our two-by-two output with reduction width two.
            targets:
              - reuse-budget-construction
            color: cyan
            linger: 0.4
          - id: dg-reuse-budget-0-0
