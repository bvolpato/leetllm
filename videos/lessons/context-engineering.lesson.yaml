    beats:
      - say: >-
          Suppose a worker inspects fifty commits for a change that might explain the callback failure. Each mark is a commit the worker inspected. The lead has its own conversation. All it needs from this search is a finding it can check. In this small example, the reply has just two fields, claim and source, and a two hundred byte limit.
