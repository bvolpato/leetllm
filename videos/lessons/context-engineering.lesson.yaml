            linger: 0.4
      - say: Progressive disclosure helps when most procedures are irrelevant to most calls. A few short instructions
          needed on every call may belong in the stable base instead. Measure activation errors, total
          rendered tokens and end-to-end work. Loading less is useful only if the required procedure and
          evidence still reach the decision that needs them.
        hold: 0.7
        visual_cues:
          - id: ce-skill-routing-and-safety-3
            phrase: Progressive disclosure helps when most procedures are irrelevant to most calls
            targets:
              - ce-skill-routing-and-safety-mechanism
            color: green
            linger: 0.4
  - id: resume
    title: Bind a resume receipt to its actual inputs
    visual: SHA-256 receipts verify artifact bytes and the exact input set. An unchanged checkpoint allows the
      next task, a changed input invalidates it, and altered artifact content also fails.
    beats:
      - say: >
          A later session needs to know which work remains valid. The trusted receipt in this fixture binds a
          checked artifact to its input revision. Recompute both hashes before resuming. An unchanged artifact
          and matching input set let the harness select the next dependent task.
        hold: 0.65
        visual_cues:
          - id: resume-beat-1-focus-1
            phrase: binds a checked artifact to its input revision
            targets:
              - resume-simulation-30
            color: blue
            linger: 0.6
          - id: resume-beat-1-focus-2
            phrase: An unchanged artifact and matching input set let
            targets:
              - resume-next-task
            color: blue
            linger: 0.6
      - say: >
          Change the deployment input while leaving the report untouched. The artifact hash still matches, but
          the input check fails. The old receipt certifies work against an earlier revision. Rechecking this
          boundary prevents a plausible progress summary from silently carrying stale evidence into the
          resumed investigation.
        hold: 0.7
        visual_cues:
          - id: resume-beat-2-focus-1
            phrase: The artifact hash still matches
            targets:
              - resume-simulation-30
            color: blue
            linger: 0.6
      - say: >
          Now restore the input and change the artifact itself. That hash fails instead. Hashes establish byte
          consistency under a trusted receipt and manifest. Evidence quality, evaluator identity, freshness,
          and permission to perform an external action each require the appropriate checks around that
          receipt.
        hold: 0.65
        visual_cues:
          - id: resume-beat-3-focus-1
            phrase: Now restore the input and change the artifact itself
            targets:
              - resume-simulation-30
            color: blue
            linger: 0.6
  - id: resume-artifacts
    title: Reconstruct five durable objects before choosing work
    visual: Lay out a task manifest, progress log, bootstrap check, exact work receipt and recovery rule around
      the same incident graph. Connect receipt validity to next-ready selection rather than a completion
      claim.
    beats:
      - say: This restart uses five artifacts. The task manifest lists unique IDs, dependencies
          and acceptance criteria. The progress log records attempts, errors and findings. A bootstrap command
          checks the environment. A work receipt binds results to artifact and input bytes, acceptance version
          and evaluator. The recovery rule defines timeouts, retries and escalation.
        hold: 0.7
        visual_cues:
          - id: ce-resume-artifacts-1
            phrase: This restart uses five artifacts
            targets:
              - ce-resume-artifacts-mechanism
            color: cyan
            linger: 0.4
      - say: >-
          After a restart, the progress log can tell you where the last shift stopped. The work receipt tells you which result you can reuse. A framework such as LangGraph can save a thread in a checkpoint and share records across threads through a store. Your application chooses which records to reload and checks the receipt before continuing.
        hold: 0.7
        visual_cues:
          - id: ce-resume-artifacts-2
            phrase: The work receipt tells you which result you can reuse
            targets:
              - ce-resume-artifacts-mechanism
            color: cyan
            linger: 0.4
      - say: Our graph collects traces, verifies cause, then writes a report. Only collect traces is initially done
          with a valid trusted receipt. The next ready task is verify cause. A progress note saying all done
          cannot advance the graph. Recompute acceptance evidence before choosing the next dependent task.
        hold: 0.7
        visual_cues:
          - id: ce-resume-artifacts-3
            phrase: Our graph collects traces, verifies cause, then writes a report
            targets:
              - ce-resume-artifacts-mechanism
            color: green
            linger: 0.4
          - id: ce-next-ready
            phrase: The next ready task is verify cause
            targets:
              - ce-resume-artifacts-mechanism
            color: cyan
            linger: 0.4
  - id: receipt-validation
    title: Validate the entire graph and exact receipt contract
    visual: Construct graph edges before evaluating done receipts, then test a cycle, unfinished dependency,
      changed input set, non-Boolean pass flag and outside-root path on the same durable graph.
    beats:
      - say: Validate the graph before trusting done labels. Reject empty or duplicate IDs, invalid status, missing or
          repeated dependency IDs and cycles, including cycles among tasks labeled done. A done task must have
          a receipt and every dependency must also be verified done. Among pending tasks, select the first
          whose dependencies are all in that verified set.
        hold: 0.7
        visual_cues:
          - id: ce-receipt-validation-1
            phrase: Validate the graph before trusting done labels
            targets:
              - ce-receipt-validation-mechanism
            color: cyan
            linger: 0.4
          - id: ce-graph-cycle
            phrase: including cycles among tasks labeled done
            targets:
              - ce-receipt-validation-mechanism
            color: cyan
            linger: 0.4
      - say: The receipt must name the same task, the expected evaluator and contract version, and passed must be the
          actual Boolean true. Recompute the artifact digest and every declared input digest. Require exact
          equality between the manifest input set and receipt input keys. Adding a required input without
          adding its hash fails even if all previously checked files match.
        hold: 0.7
        visual_cues:
          - id: ce-receipt-validation-2
            phrase: The receipt must name the same task, the expected evaluator and contract version, and passed must be
              the actual Boolean true
            targets:
              - ce-receipt-validation-mechanism
            color: cyan
            linger: 0.4
          - id: ce-input-set-error
            phrase: Adding a required input without adding its hash fails even if all previously checked files match
            targets:
              - ce-receipt-validation-mechanism
            color: cyan
            linger: 0.4
      - say: >-
          Use relative paths inside the checkpoint directory. Reject a path that resolves outside it. This check assumes the files stay in place while you read them. If other processes can change them, enforce that boundary when opening the file. With a trusted receipt, matching hashes tell you the files still hold the bytes the evaluator checked.
        hold: 0.7
        visual_cues:
          - id: ce-receipt-validation-3
            phrase: Reject a path that resolves outside it
            targets:
              - ce-receipt-validation-mechanism
            color: green
            linger: 0.4
  - id: recovery-and-evaluator
    title: A restart must preserve execution uncertainty and independent checks
    visual: Keep the generator’s cause proposal separate from the evaluator’s criteria. Apply duplicate operation
      keys and stale fencing tokens at the protected resource, then preserve an unresolved response state
      instead of marking success.
    beats:
      - say: For a cause-analysis task, agree that claims cite checked evidence and address alternatives, the
          disproven lock claim is absent, and rollback remains a proposal. A separate evaluator checks those
          criteria. Deterministic validation can enforce structure and forbidden actions, while semantic
          review examines support. An independent model can also be wrong; a citation alone does not establish
          causality.
        hold: 0.7
        visual_cues:
          - id: ce-recovery-and-evaluator-1
            phrase: For a cause-analysis task, agree that claims cite checked evidence and address alternatives, the
              disproven lock claim is absent, and rollback remains a proposal
            targets:
              - ce-recovery-and-evaluator-mechanism
            color: cyan
            linger: 0.4
      - say: Prevent duplicate effects with an operation key enforced at the tool boundary. Prevent an expired worker
          from continuing writes with a fencing token checked by the protected resource. A lease timestamp
          written only in a prompt cannot stop another process. Keep unknown outcomes explicit until the
          external system confirms their state.
        hold: 0.7
        visual_cues:
          - id: ce-recovery-and-evaluator-2
            phrase: Prevent duplicate effects with an operation key enforced at the tool boundary
            targets:
              - ce-recovery-and-evaluator-mechanism
            color: cyan
            linger: 0.4
          - id: ce-fenced-resource
            phrase: a fencing token checked by the protected resource
            targets:
              - ce-recovery-and-evaluator-mechanism
            color: cyan
            linger: 0.4
      - say: Restrict who can issue receipts and change task status. Append-only storage can retain history but still
          allow a forged new entry if writers are untrusted. Recheck live state when freshness matters. A
          resumable summary is useful orientation; trustworthy continuation requires the actual state,
          evidence and resource-bound execution rules.
        hold: 0.7
        visual_cues:
          - id: ce-recovery-and-evaluator-3
            phrase: Restrict who can issue receipts and change task status
            targets:
              - ce-recovery-and-evaluator-mechanism
            color: green
            linger: 0.4
  - id: evaluate
    title: Protect the cases that the average can hide
    visual: An executed source-lookup reader answers six source-bound questions from baseline and candidate
      packets. The candidate recovers more answers overall while omitting the critical authorization source,
      so a computed critical-case gate rejects it.
    beats:
      - say: >
          Test curation with paired tasks. Our deterministic reader can answer a question only when its
          required source is present. The baseline packet supplies four of the six answers. This miniature
          test makes evidence coverage inspectable while leaving language-model reasoning quality for a
          separate evaluation.
        hold: 0.65
        visual_cues:
          - id: evaluate-beat-1-focus-1
            phrase: Our deterministic reader can answer a question only
            targets:
              - evaluate-object-row-pass-answer-found-unknown-37
            color: blue
            linger: 0.6
          - id: evaluate-beat-1-focus-2
            phrase: The baseline packet supplies four of the six answers
            targets:
              - evaluate-object-baseline-tally
            color: blue
            linger: 0.6
      - say: >
          The candidate packet supplies five answers, improving the aggregate. Look at which row changed,
          though. It omitted the source that states who authorizes a rollback. A more successful average can
          coexist with losing a fact that the workflow must always preserve.
        hold: 0.7
        visual_cues:
          - id: evaluate-beat-2-focus-1
            phrase: The candidate packet supplies five answers
            targets:
              - evaluate-object-candidate-pass-answer-found-unknown-38
              - evaluate-object-candidate-tally
            color: blue
            linger: 0.6
      - say: >
          Apply the protected-case requirement and the candidate is rejected. The result follows from actual
          source lookup and comparison with expected answers. A production suite should also inspect claim
          support, malicious instructions, model variation, latency, and cost on the same cases before
          promoting a new curation policy.
        hold: 0.65
        visual_cues:
          - id: evaluate-beat-3-focus-1
            phrase: Apply the protected-case requirement and the candidate is rejected
            targets:
              - evaluate-object-candidate-pass-answer-found-unknown-38
            color: blue
            linger: 0.6
  - id: complete-release-gate
    title: "Would you ship the shorter request?"
    visual: >-
      Track ten paired case outcomes and the protected C2 column. Evaluate the first candidate. Change just the curated outcome on C2 and run the same release rule again.
    beats:
      - say: >-
          Now try ten paired incident cases. These are invented outcomes. Each column is the same case run with two inputs. The shorter input uses three thousand three hundred forty-six assigned units. Read the curated row. Two cases improve and one regresses. Correct answers rise from seven to eight. The yellow mark is a promise we made before testing. Case two has to pass. Would you ship this version?
        hold: 2.2
        caption_starts:
          - "Read the curated row"
          - "Two cases improve"
          - "Correct answers rise"
        visual_cues:
          - id: gate-outcomes
            phrase: "Read the curated row"
            targets: [paired-cases]
            linger: 0.25
          - id: gate-score
            phrase: "Correct answers rise from seven to eight"
            targets: [suite-decision]
            linger: 0.25
      - say: >-
          Hold it at case two. The gate requires fewer input units, at least as many successes overall, a pass on every protected case, and zero poisoning events. The other three conditions already hold. Suppose a retest changes just case two from fail to pass. Keep every other result and both input sizes fixed. Does the candidate pass this suite now?
        hold: 2
        caption_starts:
          - "Suppose a retest"
        visual_cues:
          - id: gate-hold
            phrase: "Hold it at case two"
            targets: [suite-decision]
            linger: 0.25
            caption_boundary: true
          - id: gate-repair
            phrase: "changes just case two from fail to pass"
            targets: [paired-cases]
            linger: 0.25
      - say: >-
          Yes. Nine cases pass, including the protected case. The release rule now accepts the candidate for this suite. The rule needs at least one case and positive integer token counts. The outcomes and protected flags must be Booleans. Poisoning counts must be nonnegative integers.
        hold: 0.75
        visual_cues:
          - id: gate-approve
            phrase: "The release rule now accepts the candidate for this suite"
            targets: [suite-decision]
            linger: 0.25
            caption_boundary: true
      - say: >-
          For a real policy change, repeat the comparison on matched tasks with recorded model and policy versions. Include buried clues, similar incident IDs, unsupported claims and unauthorized requests. Keep answer quality, worker usage, latency and total cost beside the input counts.
        hold: 0.65
  - id: synthesis
    title: "Can you get back to the trace?"
    visual: >-
      Remove the source field from a compacted note but leave the finding. Look up its exact status with the shortened note, then with its source restored.
    beats:
      - say: >-
          Here’s the note about the callback. Tomorrow’s investigator wants the exact HTTP status. Shorten the note by dropping its source ID. The sentence still reads perfectly well. Can you recover the status from what’s left?
        hold: 2
        visual_cues:
          - id: note-shorten
            phrase: "Shorten the note by dropping its source ID"
            targets: [saved-note]
            linger: 0.25
      - say: >-
          Try the lookup. The application has no key for the archive. Compacting that same sentence again won’t bring the key back. This is how an agent can spend several turns preparing its context without completing one investigation step. Cap those attempts and record the gap.
        hold: 0.6
        caption_starts:
          - "The application has no key"
        visual_cues:
          - id: note-read
            phrase: "Try the lookup"
            targets: [lookup-slot]
            linger: 0.25
      - say: >-
          Recover the original checked note and pin its source ID. Try the same lookup again. There’s the callback and its four oh three. The stored note bought us a way back to the evidence. We can leave the full export in the archive and use the next call to inspect the failing dependency.
        hold: 0.8
        caption_starts:
          - "Try the same lookup again"
          - "There’s the callback and its four oh three"
        visual_cues:
          - id: note-pin
            phrase: "pin its source ID"
            targets: [saved-note]
            linger: 0.25
          - id: note-reread
            phrase: "Try the same lookup again"
            targets: [lookup-slot]
            linger: 0.25
  - id: earned-context
    title: "What survives the restart?"
    visual: >-
      Pack the required records against a fixed 2,600-unit limit, test the two optional records in priority order, and inspect a receipt before and after changing one input revision. Restore the approval policy and identify the next task.
    beats:
      - say: >-
          One more shift takes over the investigation. After reserves, it has twenty-six hundred units for records. The task, trace and approval policy are all required. The old export ranks ahead of the current runbook. Use the sizes on screen. Which optional record fits alongside all three required records?
        hold: 2.5
      - say: >-
          Pack the required records first. Together they use one thousand units. Try the old export. That would take twenty-eight hundred. Skip it and keep going. The runbook brings the total to twenty-two hundred, leaving four hundred free.
        hold: 1
        visual_cues:
          - id: ce-earned-1000
            phrase: "Together they use one thousand units"
            targets: [packed-units]
            linger: 0.25
            caption_boundary: true
          - id: ce-earned-attempt
            phrase: "That would take twenty-eight hundred"
            targets: [packed-units]
            linger: 0.25
            caption_boundary: true
          - id: ce-earned-skip
            phrase: "Skip it and keep going"
            targets: [packed-units, packing-order]
            linger: 0.25
          - id: ce-earned-2200
            phrase: "The runbook brings the total to twenty-two hundred, leaving four hundred free"
            targets: [packed-units]
            linger: 0.25
            caption_boundary: true
      - say: >-
          Open the saved collection receipt. Under Saved are short prefixes of the hashes the evaluator checked. Under Current are the prefixes for the files on disk. The harness compares the full hashes. A new revision of the trace arrives. You can put that revision after the stable prefix to preserve cache reuse where the format allows. The report stays exactly as it was. Can the old receipt still certify collection?
        hold: 2.1
        visual_cues:
          - id: ce-earned-saved
            phrase: "Open the saved collection receipt"
            targets: [receipt-bytes]
            linger: 0.25
          - id: ce-earned-mutation
            phrase: "A new revision of the trace arrives"
            targets: [receipt-bytes]
            linger: 0.25
      - say: >-
          Stop. The trace fingerprint changed. Read the revised trace and check the report against it. Both still describe request R seventeen returning four oh three. The evaluator issues a fresh receipt for the report and both declared inputs. Now a summary leaves one required record out of the next call. The receipt still matches the files on disk. Which file would tell the model who can approve a rollback?
        hold: 2.05
        caption_starts:
          - "Both still describe request R seventeen"
          - "Now a summary leaves one required record out"
        visual_cues:
          - id: ce-earned-stale
            phrase: "The trace fingerprint changed"
            targets: [receipt-bytes]
            linger: 0.25
            caption_boundary: true
          - id: ce-earned-inspect
            phrase: "Read the revised trace and check the report against it"
            targets: [restart-input, receipt-bytes]
            linger: 0.25
          - id: ce-earned-receipt
            phrase: "The evaluator issues a fresh receipt for the report and both declared inputs"
            targets: [receipt-bytes]
            linger: 0.25
          - id: ce-earned-omit
            phrase: "a summary leaves one required record out of the next call"
            targets: [restart-input]
            linger: 0.25
      - say: >-
          Read the approval policy back into this call. It names the incident lead. Now we know who can approve a rollback. In the next lesson, we’ll decide what to do when a document gives the agent an instruction. The next ready task is to verify the cause. The revised trace and the checked report agree on the failure. Why did R seventeen return four oh three on the callback?
        hold: 1.5
        caption_starts:
          - "Why did R seventeen"
        visual_cues:
          - id: ce-earned-authorizer
            phrase: "Read the approval policy back into this call"
            targets: [restart-input]
            linger: 0.25
            caption_boundary: true
          - id: ce-earned-role
            phrase: "It names the incident lead"
            targets: [restart-input]
            linger: 0.25
            caption_boundary: true
          - id: ce-earned-next
            phrase: "The next ready task is to verify the cause"
            targets: [restart-action]
