scenes:
  - id: intro
    title: "What should the next call remember?"
    visual: >-
      Slide the failed callback trace beside the draft note. Add the lock observation underneath the trace so the request and time line up. Replace the draft with the checked finding and carry its source into the next call.
    beats:
      - say: >-
          This callback returned four oh three. The incident note blames a database lock. That’s the agent’s reason for proposing a rollback.
        hold: 0.5
        caption_starts:
          - "The incident note blames a database lock"
        visual_cues:
          - id: intro-trace
            phrase: "This callback"
            targets: [incident-records]
            linger: 0.15
          - id: intro-status
            phrase: "returned four oh three"
            targets: [incident-records]
            linger: 0.25
      - say: >-
          Slide the lock check under the trace. Same request, R seventeen. Same time, one hundred. Look at what the lock check found. Would you keep the lock explanation?
        hold: 2.25
        visual_cues:
          - id: intro-lock
            phrase: "Slide the lock check under the trace"
            targets: [incident-records]
            linger: 0.25
          - id: intro-question
            phrase: "Would you keep the lock explanation"
            targets: [incident-question, incident-records, incident-note]
            linger: 0.25
      - say: >-
          Erase the guess. No migration lock was present for this request at time one hundred. Keep the source ID beside that finding. Now we can investigate why the callback failed.
        hold: 0.8
        caption_starts:
          - "No migration lock was present"
        visual_cues:
          - id: intro-erase
            phrase: "Erase the guess"
            targets: [incident-note]
            linger: 0.15
          - id: intro-keep
            phrase: "No migration lock was present for this request at time one hundred"
            targets: [incident-note]
            linger: 0.25
            caption_boundary: true
      - say: >-
          Assemble the next call around that question. Send the investigation instructions, the trace lookup tool, the trace, and the checked note. Leave the old guess and the recaps that repeat it in the archive. The pieces you send are the model’s working set.
        hold: 0.8
        visual_cues:
          - id: intro-request
            phrase: "Assemble the next call around that question"
            targets: [incident-note]
            linger: 0.25
  - id: capacity-and-evidence
    title: "Where did the evidence land?"
    visual: >-
      Slide one fixed trace through a controlled input. Switch to a two-source question that needs both a callback failure and a deployment change, then compare the supplied retrieval scores.
    beats:
      - say: >-
          Suppose the input limit is a hundred and twenty-eight thousand tokens. This investigation fits. A trimmer that waits until the window is full has no reason to touch it. Yet a request can keep the old lock explanation or leave out the record that would correct it. Build for the question before the window fills.
        hold: 0.65
      - say: >-
          Even a record that makes it into the request can be hard to use. In Lost in the Middle, models answering multi-document questions or looking up a value often did better with the evidence near either end. Chroma’s twenty twenty-five study tested eighteen models. Longer inputs and similar distractors often made retrieval harder. Those experiments give us a reason to move our own evidence and test again.
        hold: 0.55
      - say: >-
          Ask for the status in trace seventeen. Move the same record from the beginning through the middle to the end. Keep the question, the text and the answer key fixed. Now ask a different question. Could a scope change explain the callback failure? One record shows where the request failed. The other shows what the deployment changed. We’d have to check which scope the callback needed before blaming that change. Score this two-source question separately. When reporting a needle benchmark, name the variant. Some require several facts.
        hold: 0.7
        visual_cues:
          - id: ce-position-move
            phrase: "Move the same record from the beginning through the middle to the end"
            targets: [ce-capacity-and-evidence-mechanism]
            linger: 0.25
          - id: probe-combine
            phrase: "Now ask a different question"
            targets: [ce-capacity-and-evidence-mechanism]
            linger: 0.25
          - id: probe-next
            phrase: "check which scope the callback needed"
            targets: [ce-capacity-and-evidence-mechanism]
            linger: 0.25
            caption_boundary: true
      - say: For a supplied twelve-case probe, ten successes at the beginning mean eighty-three and one third percent.
          Seven in the middle mean fifty-eight and one third percent. Subtract the success fractions and
          multiply by one hundred to obtain a twenty-five percentage-point change. Score the questions that
          need both records separately, using the number of those questions as the denominator.
        hold: 0.7
        caption_starts:
          - "Seven in the middle"
          - "a twenty-five percentage-point change"
        visual_cues:
          - id: ce-capacity-and-evidence-4
            phrase: Subtract the success fractions and multiply by one hundred to obtain a twenty-five percentage-point
              change
            targets:
              - ce-capacity-and-evidence-mechanism
            color: green
            linger: 0.4
          - id: ce-position-ten
            phrase: ten successes at the beginning mean eighty-three and one third percent
            targets:
              - ce-capacity-and-evidence-mechanism
            color: cyan
            linger: 0.4
          - id: ce-position-seven
            phrase: Seven in the middle mean fifty-eight and one third percent
            targets:
              - ce-capacity-and-evidence-mechanism
            color: cyan
            linger: 0.4
          - id: ce-position-difference
            phrase: obtain a twenty-five percentage-point change
            targets:
              - ce-capacity-and-evidence-mechanism
            color: cyan
            linger: 0.4
  - id: failure-interventions
    title: Different symptoms require different edits to the same packet
    visual: Fork one packet into four controlled interventions. Remove a disproven span and its derived summary,
      replace a repeated search trace, filter overlapping tool schemas, and demote retrieved formatting
      instructions to data.
    beats:
      - say: A wrong lock claim repeatedly cited as fact is poisoning. Re-running old failed searches instead of
          checking a new trace is distraction. Selecting an inappropriate administrative tool from overlapping
          descriptions is confusion. A retrieved instruction demanding XML while the application requires JSON
          is a clash. Each pattern points to a different part of the next request you can change.
        hold: 0.7
        visual_cues:
          - id: ce-failure-interventions-1
            phrase: A wrong lock claim repeatedly cited as fact is poisoning
            targets:
              - ce-failure-interventions-mechanism
            color: cyan
            linger: 0.4
      - say: For poisoning, remove the false claim and summaries derived from it before the next plan. Retain the
          checked negative finding with its source and observation window. For distraction, select the new
          evidence instead of replaying the same low-value search history. An added apology alone can leave
          the original false span inside the next request.
        hold: 0.7
        visual_cues:
          - id: ce-failure-interventions-2
            phrase: For poisoning, remove the false claim and summaries derived from it before the next plan
            targets:
              - ce-failure-interventions-mechanism
            color: cyan
            linger: 0.4
          - id: ce-remove-poison
            phrase: remove the false claim and summaries derived from it before the next plan
            targets:
              - ce-failure-interventions-mechanism
            color: cyan
            linger: 0.4
          - id: ce-keep-negative
            phrase: Retain the checked negative finding with its source and observation window
            targets:
              - ce-failure-interventions-mechanism
            color: cyan
            linger: 0.4
          - id: ce-new-evidence
            phrase: select the new evidence instead of replaying the same low-value search history
            targets:
              - ce-failure-interventions-mechanism
            color: cyan
            linger: 0.4
      - say: For confusion, narrow the tool schemas to the current phase. For clash, preserve the retrieved passage as
          untrusted evidence without promoting its formatting instruction into policy. An XML example quoted
          as data need not conflict with a JSON output contract. Change one assembly choice at a time, then
          compare matched tasks and the full resulting traces.
        hold: 0.7
        visual_cues:
          - id: ce-failure-interventions-3
            phrase: For confusion, narrow the tool schemas to the current phase
            targets:
              - ce-failure-interventions-mechanism
            color: green
            linger: 0.4
          - id: ce-demote-format
            phrase: preserve the retrieved passage as untrusted evidence without promoting its formatting instruction into
              policy
            targets:
              - ce-failure-interventions-mechanism
            color: cyan
            linger: 0.4
  - id: write
    title: Store a finding, then reload what is useful
    visual: Predicates execute against trace and lock records. Supported findings serialize into a note store,
      reload through JSON, and retain exact source IDs while bulky raw output remains archived outside the
      next packet.
    beats:
      - say: >
          Begin by checking the source records. The callback trace contains an authentication error. A lock
          observation tied to that same trace records no migration lock. These fields support two narrow
          findings. They also tell us to remove the old lock explanation from the next active packet.
        hold: 0.7
        visual_cues:
          - id: write-beat-1-focus-1
            phrase: Begin by checking the source records
            targets:
              - intro-object-b-0-scene-id-write-findings-checked-against-source-10
            color: blue
            linger: 0.6
          - id: write-beat-1-focus-2
            phrase: A lock observation tied to that same trace records no migration lock
            targets:
              - intro-object-lock-check-r17-locked-false-3
            color: blue
            linger: 0.6
          - id: ce-core-source-fields
            phrase: The callback trace contains an authentication error.
            targets:
              - ce-core-write
            color: cyan
            linger: 0.4
          - id: ce-core-lock-negative
            phrase: A lock observation tied to that same trace records no migration lock.
            targets:
              - ce-core-write
            color: cyan
            linger: 0.4
          - id: ce-core-drop-lock
            phrase: remove the old lock explanation from the next active packet.
            targets:
              - ce-core-write
            color: cyan
            linger: 0.4
      - say: >
          Write the checked findings with their source identities into a separate note store. Our simulation
          serializes and reloads the records, so their values can be compared after the round trip. The
          original trace stays in the archive for later questions that need more detail.
        hold: 0.65
        visual_cues:
          - id: write-beat-2-focus-1
            phrase: Write the checked findings with their source identities
            targets:
              - intro-object-b-0-scene-id-write-findings-checked-against-source-10
            color: blue
            linger: 0.6
          - id: write-beat-2-focus-2
            phrase: The original trace stays in the archive for
            targets:
              - intro-object-trace-17-callback-status-403-2
            color: blue
            linger: 0.6
          - id: ce-core-write-store
            phrase: Write the checked findings with their source identities into a separate note store.
            targets:
              - ce-core-write
            color: cyan
            linger: 0.4
          - id: ce-core-archive
            phrase: The original trace stays in the archive for later questions that need more detail.
            targets:
              - ce-core-write
            color: cyan
            linger: 0.4
      - say: >
          Reloading a note puts its tokens back into the model's input. External storage helps because the
          application chooses what to read, while the complete archive can remain outside this call. Preserve
          observation time, source revision, and uncertainty so a later session knows what must be rechecked.
        hold: 0.65
        visual_cues:
          - id: write-beat-3-focus-1
            phrase: Reloading a note puts its tokens back into the model's input
            targets:
              - intro-object-b-0-scene-id-write-findings-checked-against-source-10
            color: blue
            linger: 0.6
          - id: ce-core-reload
            phrase: Reloading a note puts its tokens back into the model's input.
            targets:
              - ce-core-write
            color: cyan
            linger: 0.4
  - id: verified-note-state
    title: A stored note carries scope and a verifier result
    visual: Construct a note from source R17 and its observation time. Attempt to promote a tool-supplied string
      flag, reject it, then retain a host-verified Boolean and reload only the requested finding.
    beats:
      - say: >-
          Look at the three values for confirmed. The first is text, the second is a number, and the third is a Boolean. The function rejects the first two. The host sets the Boolean to true after it checks the finding against the source.
        hold: 0.7
        visual_cues:
          - id: ce-verified-note-state-1
            phrase: Look at the three values for confirmed
            targets:
              - ce-verified-note-state-mechanism
            color: cyan
            linger: 0.4
          - id: ce-flag-rejected
            phrase: The function rejects the first two
            targets:
              - ce-verified-note-state-mechanism
            color: cyan
            linger: 0.4
      - say: Record the source revision, trace identity, observation time, status and uncertainty beside a finding. No
          lock during the inspected transaction is narrower than no lock ever. A later source revision can
          require a new check. Reload only the needed note, while keeping a path back to the complete archived
          observation.
        hold: 0.7
        visual_cues:
          - id: ce-verified-note-state-2
            phrase: Record the source revision, trace identity, observation time, status and uncertainty beside a finding
            targets:
              - ce-verified-note-state-mechanism
            color: cyan
            linger: 0.4
          - id: ce-note-revision
            phrase: A later source revision can require a new check
            targets:
              - ce-verified-note-state-mechanism
            color: cyan
            linger: 0.4
      - say: >-
          Writing saves information outside the active call. A file, a database or a thread checkpoint can hold the note for the next shift. Before loading it, check that the caller may read it, the source is current and the finding answers this question. The reloaded words count toward the next call’s input.
        hold: 0.7
        visual_cues:
          - id: ce-verified-note-state-3
            phrase: Writing saves information outside the active call
            targets:
              - ce-verified-note-state-mechanism
            color: green
            linger: 0.4
  - id: select
    title: Expose the tools for the current phase
    visual: An actual phase allowlist intersects with available tool IDs. Investigation selects deploy_lookup and
      trace_lookup, while proposal mode changes the visible set and unknown phases select nothing.
    beats:
      - say: >
          During investigation, the next useful actions read deployment records and trace spans. The phase
          policy intersects those tool identities with the tools actually available. Their schemas enter the
          prompt, while unrelated administrative choices remain outside this step's working set.
        hold: 0.65
        visual_cues:
          - id: select-beat-1-focus-1
            phrase: During investigation
            targets:
              - select-simulation-15
            color: blue
            linger: 0.6
          - id: ce-core-read-tools
            phrase: Their schemas enter the prompt
            targets:
              - ce-core-select
            color: cyan
            linger: 0.4
      - say: >
          A later proposal phase needs a different set. Watch the same tool identities change eligibility when
          the phase changes. Progressive disclosure reduces irrelevant choices and schema tokens. It also
          makes the intended workflow visible enough to test with concrete requests.
        hold: 0.65
        motion_check:
          region:
            - 130
            - 300
            - 1640
            - 580
          minimumChangedFraction: 0.002
        visual_cues:
          - id: select-proposal
            phrase: A later proposal phase needs a different set
            targets:
              - select-eligible-tools
            color: green
            linger: 0.6
          - id: select-beat-2-focus-1
            phrase: A later proposal phase needs a different set
            targets:
              - select-eligible-tools
            color: blue
            linger: 0.6
      - say: >
          An unknown phase exposes no tools in this fixture. Execution authorization still belongs at the tool
          boundary, where identity and permissions must be checked on every call. Hiding a schema organizes
          model context. The backend must also reject actions that the caller is not allowed to perform.
        hold: 0.65
        visual_cues:
          - id: select-beat-3-focus-1
            phrase: An unknown phase exposes no tools in this fixture
            targets:
              - select-simulation-15
            color: blue
            linger: 0.6
  - id: phase-intersection
    title: Construct the complete article tool intersection
    visual: Keep the five named tools in place while intersecting availability and the phase allowlist. Show the
      original two-tool miniature separately from the full article’s three-tool investigation set.
    beats:
      - say: The earlier two-tool picture is a deliberately smaller investigation policy. The complete article program
          allows deploy lookup, trace lookup and runbook search during investigation. It intersects that
          allowlist with the actual available tool identities, then sorts the result. With all five catalog
          tools available, those three investigation tools are exposed.
        hold: 0.7
        visual_cues:
          - id: ce-phase-intersection-1
            phrase: The earlier two-tool picture is a deliberately smaller investigation policy
            targets:
              - ce-phase-intersection-mechanism
            color: cyan
            linger: 0.4
          - id: ce-three-tools
            phrase: With all five catalog tools available, those three investigation tools are exposed
            targets:
              - ce-phase-intersection-mechanism
            color: cyan
            linger: 0.4
      - say: Switch to proposal mode on the same catalog. Runbook search and rollback advisor are eligible; the other
          schemas leave the prompt. An unknown phase maps to the empty set. If trace lookup is unavailable
          during investigation, intersection removes it without granting a replacement tool. The result
          follows identity membership, rather than a guessed tool count.
        hold: 0.7
        visual_cues:
          - id: ce-phase-intersection-2
            phrase: Switch to proposal mode on the same catalog
            targets:
              - ce-phase-intersection-mechanism
            color: cyan
            linger: 0.4
          - id: ce-two-tools
            phrase: Runbook search and rollback advisor are eligible
            targets:
              - ce-phase-intersection-mechanism
            color: cyan
            linger: 0.4
          - id: ce-no-tools
            phrase: An unknown phase maps to the empty set
            targets:
              - ce-phase-intersection-mechanism
            color: cyan
            linger: 0.4
          - id: ce-unavailable
            phrase: intersection removes it without granting a replacement tool
            targets:
              - ce-phase-intersection-mechanism
            color: cyan
            linger: 0.4
      - say: Prompt visibility and execution permission are separate tests. Even a tool omitted from the prompt can be
          named in a malformed or hostile attempted call. The backend checks caller identity, current scope
          and action permissions on every attempt. Selecting fewer schemas can reduce irrelevant choices and
          token use, but those effects still require task evaluation.
        hold: 0.7
        visual_cues:
          - id: ce-phase-intersection-3
            phrase: Prompt visibility and execution permission are separate tests
            targets:
              - ce-phase-intersection-mechanism
            color: green
            linger: 0.4
  - id: prefix-order
    title: Move the changing header behind the reusable prefix
    visual: Build two toy token sequences from a 96-unit root, a 12-unit changing header and 256-unit document.
      Preserve every token while moving the header; construct common-prefix length from aligned positions.
    beats:
      - say: Prefill processes input tokens into attention key and value states. A compatible cached prefix may reuse
          that computation, after which the new suffix is processed and decoding generates output. Reuse
          requires the same eligible rendered prefix and compatible serving state. A changed early timestamp
          can block reuse of stable material after it without deleting an older cache entry.
        hold: 0.7
        visual_cues:
          - id: ce-prefix-order-1
            phrase: Prefill processes input tokens into attention key and value states
            targets:
              - ce-prefix-order-mechanism
            color: cyan
            linger: 0.4
      - say: Use a supplied toy tokenizer with an eligible boundary at every token. The root contains ninety-six
          tokens, the changing header twelve, and the fixed document two hundred fifty-six. The first header
          token changes between requests while its length stays twelve. Root, header, document has only
          ninety-six common tokens across header changes. Move the header after the document. The common
          prefix becomes three hundred fifty-two tokens, while each complete input still contains three
          hundred sixty-four.
        hold: 0.7
        visual_cues:
          - id: ce-prefix-order-2
            phrase: Use a supplied toy tokenizer with an eligible boundary at every token
            targets:
              - ce-prefix-order-mechanism
            color: cyan
            linger: 0.4
          - id: ce-prefix-96
            phrase: has only ninety-six common tokens across header changes
            targets:
              - ce-prefix-order-mechanism
            color: cyan
            linger: 0.4
          - id: ce-prefix-move
            phrase: Move the header after the document
            targets:
              - ce-prefix-order-mechanism
            color: cyan
            linger: 0.4
          - id: ce-prefix-352
            phrase: The common prefix becomes three hundred fifty-two tokens
            targets:
              - ce-prefix-order-mechanism
            color: cyan
            linger: 0.4
          - id: ce-prefix-364
            phrase: each complete input still contains three hundred sixty-four
            targets:
              - ce-prefix-order-mechanism
            color: cyan
            linger: 0.4
      - say: >-
          The two prefixes now match. You can check their bytes locally with a hash. To see how much work the provider actually reused, read the cached input count in the response and measure latency. Routing and expiry can turn a match into a miss. Keep this phase’s tools first, the fixed document next, and the changing notes last. When the phase changes, update the tools too.
        hold: 0.7
        visual_cues:
          - id: ce-prefix-order-3
            phrase: The two prefixes now match
            targets:
              - ce-prefix-order-mechanism
            color: green
            linger: 0.4
  - id: cache-cost-scope
    title: Caching changes repeated work while the same input still occupies capacity
    visual: Reuse the stable segment in place and separately meter writes, reads, new suffix and output. Keep the
      authorization gate before packet construction and distinguish it from a cache-group key.
    beats:
      - say: Cached tokens still occupy logical input capacity and remain available to attention. A perfectly cached
          long history can still contain a misleading claim. Curation tests whether the retained evidence
          supports the decision; cache measurements test reuse and serving cost. Neither measurement replaces
          the other, and necessary evidence should not be discarded to improve a cache-hit percentage.
        hold: 0.7
        visual_cues:
          - id: ce-cache-cost-scope-1
            phrase: Cached tokens still occupy logical input capacity and remain available to attention
            targets:
              - ce-cache-cost-scope-mechanism
            color: cyan
            linger: 0.4
      - say: Use the selected provider’s actual accounting for cache writes, cache reads, uncached input and output,
          including applicable request modifiers. Some cache writes cost more than ordinary input. Separate
          cache groups can organize routing or billing and reduce cross-user cache-hit probing where
          supported. They do not authorize which user’s document enters the request.
        hold: 0.7
        visual_cues:
          - id: ce-cache-cost-scope-2
            phrase: Use the selected provider’s actual accounting for cache writes, cache reads, uncached input and
              output, including applicable request modifiers
            targets:
              - ce-cache-cost-scope-mechanism
            color: cyan
            linger: 0.4
      - say: Before constructing even a likely cache hit, check the caller’s identity and access scope. Pin the model,
          tokenizer, request serialization and relevant tool definitions when measuring reuse. Keep cache
          metrics beside task quality, input and output usage, end-to-end latency and total cost. A miss may
          reflect changed tokens, expiry, eviction or routing, rather than evidence quality.
        hold: 0.7
        visual_cues:
          - id: ce-cache-cost-scope-3
            phrase: Before constructing even a likely cache hit, check the caller’s identity and access scope
            targets:
              - ce-cache-cost-scope-mechanism
            color: green
            linger: 0.4
  - id: compress
    title: Remove bulk while retaining checked state
    visual: A source-bound allocation ledger begins at 12,436 units, removes the 8,200-unit raw trace export, then
      excludes unused tools and the disproven claim to reach 3,346 units. Totals and bars derive from selected
      entries.
    beats:
      - say: >
          The current allocation contains useful evidence alongside a large old trace export, unused tool
          schemas, and the old hypothesis. The sizes are assigned token units for this example. Inspect the
          categories before deciding what to keep. Shortening every category equally would also shrink the
          evidence we need.
        hold: 0.65
        visual_cues:
          - id: compress-beat-1-focus-1
            phrase: and the old hypothesis
            targets:
              - compress-simulation-18
            color: blue
            linger: 0.6
      - say: >
          Prune the bulky raw export after preserving its checked findings and source references. The active
          packet becomes much smaller. Keep valid call and result identities when reconstructing a real
          transcript, and retain recent output whose meaning has not yet been captured in a verified note.
        hold: 0.65
        visual_cues:
          - id: compress-beat-2-focus-1
            phrase: Keep valid call and result identities when reconstructing a real transcript
            targets:
              - compress-call-result-pair
            color: blue
            linger: 0.6
          - id: compress-beat-2-focus-2
            phrase: export after preserving its checked findings and source
            targets:
              - compress-object-auth-error-source-checked-source-24
            color: blue
            linger: 0.6
      - say: >
          Exclude tools outside the phase and remove the disproven claim. Reloaded findings still count in the
