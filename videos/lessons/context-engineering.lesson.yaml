      - say: >-
          The worker reports an authentication error and cites trace seventeen. In the archive, that callback returned four oh three. The record supports the finding. Copy those two fields into the lead’s request. The search stays behind. Each worker still needs permission to read its inputs, and both windows count toward the cost.
