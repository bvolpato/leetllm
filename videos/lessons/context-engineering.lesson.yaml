  - id: strict-handoff
    title: "What can the lead accept from the worker?"
    visual: >-
      Magnify the last byte positions of a 1,599-byte worker envelope. Add two trailing spaces and test the 1,600-byte limit. Undo the change, open the authorized source, and test a wrong and a corrected status against its contents.
    beats:
      - say: >-
          Let’s use the full handoff contract. The receiver allows sixteen hundred bytes. Here’s a JSON object with spaces after its closing brace. Every space counts on the wire. The last one is byte fifteen ninety-nine. Add two more spaces. Will the receiver open this copy?
        hold: 2.25
        caption_starts:
          - "Add two more spaces"
        visual_cues:
          - id: handoff-add
            phrase: "Add two more spaces"
            targets: [handoff-bytes]
            linger: 0.25
          - id: handoff-question
            phrase: "Will the receiver open this copy"
            targets: [handoff-bytes, handoff-decision]
            linger: 0.25
      - say: >-
          It stops at sixteen hundred and one bytes. The receiver checks length before it decodes UTF-eight or parses JSON. Bound the read at the transport too, so an oversized reply can’t consume unbounded memory before this check. A character can take several bytes.
        hold: 0.65
        visual_cues:
          - id: handoff-stop
            phrase: "It stops at sixteen hundred and one bytes"
            targets: [handoff-decision]
            linger: 0.25
            caption_boundary: true
      - say: >-
          Take the two spaces back off. Now the receiver can open the original. It rejects malformed UTF-eight and duplicate JSON keys. These three fields are the whole contract. The claim and next check each need nonempty text. The source list needs at least one ID, and every ID must belong to the caller’s authorized set. An extra field or a wrong type fails the check.
        hold: 0.65
        visual_cues:
          - id: handoff-undo
            phrase: "Take the two spaces back off"
            targets: [handoff-decision]
            linger: 0.25
      - say: >-
          The worker says HTTP two hundred. Its source ID passed. Open the cited trace. Compare the two status codes. Can the lead record two hundred for this request?
        hold: 2.25
        visual_cues:
          - id: handoff-open
            phrase: "Open the cited trace"
            targets: [handoff-record]
            linger: 0.25
          - id: handoff-compare
            phrase: "Can the lead record two hundred for this request"
            targets: [handoff-object, handoff-record, handoff-decision]
            linger: 0.25
      - say: >-
          Withhold that claim. The trace says four oh three. Change just the worker’s status to four oh three. The envelope is still fifteen ninety-nine bytes. This time the values match. Keep the status and the trace ID together. The lead can now open that trace to investigate the failed callback.
        hold: 1.05
        caption_starts:
          - "The trace says four oh three"
          - "Change just the worker’s status"
          - "This time the values match"
        visual_cues:
          - id: handoff-reject
            phrase: "Withhold that claim"
            targets: [handoff-object, handoff-record, handoff-decision]
            linger: 0.25
            caption_boundary: true
          - id: handoff-correct
            phrase: "Change just the worker’s status to four oh three"
            targets: [handoff-object]
            linger: 0.25
          - id: handoff-promote
            phrase: "This time the values match"
            targets: [handoff-object, handoff-record, handoff-decision]
            linger: 0.25
      - say: >-
          Count the worker’s input and output as well as the lead’s, and measure the time the lead waited. A smaller lead request can still mean more total work. Check which records each process or remote provider could see.
        hold: 0.55
