            color: cyan
            linger: 0.3
          - id: rsx-locked-contract-b2-s2
            phrase: A passing early result with an out-of-bounds final interval fails the full rule.
            targets:
              - rs-locked-contract-mechanism
            color: cyan
            linger: 0.3
          - id: rsx-locked-contract-b2-s3
            phrase: Establishing an effect of at least point one zero at that confidence level instead requires the early
