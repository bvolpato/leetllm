    visual: Sort the theorem, the corridor adaptation and an open assumption by what the source paper supports.
    beats:
      - say: "Why would a distance bonus help? The paper gives a formula for changing the reward while preserving the best policy under its assumptions. We borrowed that formula for a seven-square corridor and a learner with a table of action values. How quickly that learner finds the goal is our experiment."
        hold: 0.7
        visual_cues:
          - id: rs-paper-triage-0
            phrase: "Why would a distance bonus help?"
            targets:
