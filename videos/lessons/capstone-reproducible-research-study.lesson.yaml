version: 1
id: capstone-reproducible-research-study
title: What Makes a Learning Result Believable?
source: foundations/capstone-reproducible-research-study/content.md
sources:
  - title: "Ng, Harada and Russell: policy invariance under reward transformations"
    url: https://people.eecs.berkeley.edu/~russell/papers/icml99-shaping.pdf
  - title: "Henderson et al.: Deep Reinforcement Learning That Matters"
    url: https://arxiv.org/abs/1709.06560
scenes:
  - id: intro
    title: "Twelve moves to reach square six"
    visual: "Enter during the penultimate move of seed 14, training episode 3. Hold both pieces at squares two and five, play the last move, then count the goals."
    beats:
      - say: "One move left. Which learner can still reach the flag?"
        hold: 2.2
        caption_starts: ["Which learner"]
      - say: "The shaped learner can. Watch the last move. Cyan lands on six. Blue steps left and runs out of time."
        hold: 0.9
        caption_starts: ["Watch the last move.", "Cyan lands on six.", "Blue steps left"]
        visual_cues:
          - id: take-last-step
            phrase: "Watch the last move."
            targets: [episode-track]
            linger: 0.3
      - say: "Both learners had the same random draws. Blue earned a reward only at the goal. Cyan also got feedback from its distance to the goal before and after each move. Count the goals on the other trips to see how often that helped."
        hold: 0.75
        caption_starts: ["Blue earned a reward", "Cyan also got feedback", "Count the goals"]
        visual_cues:
          - id: goal-reward
            phrase: "Blue earned a reward only at the goal."
            targets: [episode-track]
          - id: distance-feedback
            phrase: "Cyan also got feedback from its distance to the goal before and after each move."
            targets: [episode-track]
