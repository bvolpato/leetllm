  - id: plan-history
    title: Keep known worked output outside a fresh confirmatory plan
    visual: Place observed pilot outcomes before the frozen plan. Keep invalid attempts when an amendment requires a complete corrected comparison.
    beats:
      - say: The article’s twenty-four worked seeds have already been observed. Rerunning them can test repeatability,
          but it cannot make their plan independently preregistered. Use pilot debugging first, freeze the new
          hypothesis, variables, decision and exclusion rules, then collect a reserved untouched confirmatory
          sample.
        hold: 0.7
        visual_cues:
          - id: rs-plan-history-0
            phrase: The article’s twenty-four worked seeds have already been observed
            targets:
              - rs-plan-history-mechanism
            color: cyan
            linger: 0.4
          - id: rsx-plan-history-b0-s0
