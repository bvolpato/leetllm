  - id: question
    title: "How much does one seed tell us?"
    visual: "Count goal-reaching episodes in the two arms on worked seed 14, then seed 6. The same 30-slot scale makes the gain and the regression comparable."
    beats:
      - say: "Go back to seed fourteen and count all thirty early training episodes for each learner. Blue reached the goal once. With shaping, it reached the goal twenty-one times. That's twenty extra goals on the seed we just watched."
        hold: 0.8
        visual_cues:
          - id: read-first-sparse
            phrase: "Blue reached the goal once."
            targets: [goal-counts]
            caption_boundary: true
            linger: 0.3
          - id: open-first-seed
            phrase: "With shaping, it reached the goal twenty-one times."
            targets: [goal-counts]
            caption_boundary: true
            linger: 0.3
      - say: "Change only the seed. On seed six, blue reached the goal eleven times and the shaped learner reached it twice. Same corridor, same scoring rule. Which seed belongs in the study average?"
        hold: 2
        visual_cues:
          - id: read-second-sparse
            phrase: "blue reached the goal eleven times"
            targets: [goal-counts]
            caption_boundary: true
            linger: 0.3
          - id: open-second-seed
            phrase: "the shaped learner reached it twice."
            targets: [goal-counts]
            caption_boundary: true
            linger: 0.3
      - say: "Both do. Subtract sparse from shaped within each seed. Average those differences over all twenty-four planned pairs. The question is whether shaping helps this tabular learner reach the goal early and leaves its final success close to baseline. Set both rules before collecting fresh seeds. These worked rows have already been seen."
        hold: 0.8
        visual_cues:
          - id: retain-both
            phrase: "Both do."
            targets: [goal-counts]
            caption_boundary: true
            linger: 0.3
  - id: locked-contract
    title: Construct each predicate of the research decision
    visual: Build a paired difference from each seed, then place the mean and interval thresholds for early and final success.
    beats:
      - say: The hypothesis names an agent, environment, intervention, metric, analysis unit and rejection rule. Here
          each independently generated simulator seed supplies a pair of first-thirty-episode success
          fractions. Subtract sparse from shaped within each seed, then average all planned differences.
        hold: 0.7
        visual_cues:
          - id: rs-locked-contract-0
            phrase: The hypothesis names an agent, environment, intervention, metric, analysis unit and rejection rule
            targets:
              - rs-locked-contract-mechanism
            color: cyan
            linger: 0.4
          - id: rsx-locked-contract-b0-s0
            phrase: The hypothesis names an agent, environment, intervention, metric, analysis unit and rejection rule.
            targets:
              - rs-locked-contract-mechanism
            color: cyan
            linger: 0.3
          - id: rsx-locked-contract-b0-s1
            phrase: Here each independently generated simulator seed supplies a pair of first-thirty-episode success fractions.
            targets:
              - rs-locked-contract-mechanism
            color: cyan
            linger: 0.3
          - id: rsx-locked-contract-b0-s2
            phrase: Subtract sparse from shaped within each seed, then average all planned differences.
            targets:
              - rs-locked-contract-mechanism
            color: cyan
            linger: 0.3
      - say: The declared early rule requires a mean at least plus point one zero and a ninety-percent interval whose
          lower bound is strictly above zero. The final guardrail separately requires its observed mean and
          entire ninety-percent paired interval within minus point zero two through plus point zero two.
        hold: 0.7
        visual_cues:
          - id: rs-locked-contract-1
            phrase: The declared early rule requires a mean at least plus point one zero and a ninety-percent interval
              whose lower bound is strictly above zero
            targets:
              - rs-locked-contract-mechanism
            color: yellow
            linger: 0.4
          - id: rsx-locked-contract-b1-s0
            phrase: The declared early rule requires a mean at least plus point one zero and a ninety-percent interval
              whose lower bound is strictly above zero.
            targets:
              - rs-locked-contract-mechanism
            color: cyan
            linger: 0.3
          - id: rsx-locked-contract-b1-s1
            phrase: The final guardrail separately requires its observed mean and entire ninety-percent paired interval
              within minus point zero two through plus point zero two.
            targets:
              - rs-locked-contract-mechanism
            color: cyan
            linger: 0.3
      - say: These are explicit illustrative decision criteria. A positive interval with mean below point one zero
          fails the practical condition. A passing early result with an out-of-bounds final interval fails the
          full rule. Establishing an effect of at least point one zero at that confidence level instead
          requires the early lower bound itself above point one zero.
        hold: 0.7
        visual_cues:
          - id: rs-locked-contract-2
            phrase: These are explicit illustrative decision criteria
            targets:
