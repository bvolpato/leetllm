  - id: synthesis
    title: "Would you sign off on this figure?"
    visual: "Audit a draft that averages only favorable seeds. Map the missing seed IDs back to their retained rows and rebuild both the numerator and the denominator before correcting the report."
    beats:
      - say: "A colleague sends you a draft figure. It claims a gain of almost twenty-four percentage points. You have the study plan and the original seed table. Before you sign off, count the rows behind the figure. Nineteen pairs made it into the calculation. The plan calls for twenty-four. Which rows would you look for?"
        hold: 1.8
        visual_cues:
          - id: inspect-draft
            phrase: "count the rows behind the figure"
            targets: [report-ledger]
            caption_boundary: true
            linger: 0.3
      - say: "Start with seed six. Its nine lost goals belong in the sum. Put back the other four regressions too. Together those five rows subtract thirty-three goals and add another hundred fifty early episodes per arm. The learners haven't changed. What gain should the figure report now?"
        hold: 1.8
        visual_cues:
          - id: restore-missing-rows
            phrase: "Its nine lost goals belong in the sum. Put back the other four regressions too."
            targets: [report-ledger]
            caption_boundary: true
            linger: 0.3
      - say: "A hundred three net goals across seven hundred twenty early episodes per arm gives fourteen point three percentage points. Rebuild the figure and its paired interval from all twenty-four rows. Hand over the plan, executed source, config, environment and clean rerun command with that table. Keep the reference outputs so the next researcher can compare the rerun. A checksum compares bytes. A recorded rerun shows whether the experiment repeats."
        hold: 0.95
        visual_cues:
          - id: correct-draft
            phrase: "gives fourteen point three percentage points."
            targets: [report-ledger]
            caption_boundary: true
            linger: 0.3
