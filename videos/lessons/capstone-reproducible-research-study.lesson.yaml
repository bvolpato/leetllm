  - id: shaping
    title: Turn a potential into a training signal
    visual: The distance potential along seven cells yields distinct forward, reverse and stationary shaping rewards.
    beats:
      - say: A sparse reward appears only when the learner reaches the goal. Define a potential that increases as the
          agent approaches it. The candidate adds discounted next potential minus current potential to its
          training reward, supplying feedback before the first successful journey.
        hold: 0.75
        visual_cues:
          - id: shaping-potential-difference-rule-b1-1
            phrase: discounted next potential minus current potential
            targets:
              - potential-difference-rule
            color: yellow
            linger: 0.6
      - say: Calculate the forward move, then the return move. They give different signals, and even staying at the
          start can produce a small positive term. The discounted sum and terminal conditions explain the
          construction. Final evaluation still uses the original environment reward for both learners.
        hold: 0.85
        visual_cues:
          - id: shaping-transition-shaping-signals-b2-1
            phrase: even staying at the start
            targets:
              - transition-shaping-signals
            color: green
            linger: 0.6
  - id: telescoping
    title: Cancel the interior potential terms across a whole path
    visual: Cancel interior potential terms on direct and detour paths. Retain the boundary term when a path ends at a collection cap.
    beats:
      - say: The potential is negative distance to the goal divided by six. For each transition, add discount times
          next potential minus current potential to the training reward. Discount each transition’s addition
          again by its time index when summing the return.
        hold: 0.7
        visual_cues:
          - id: rs-telescoping-0
            phrase: The potential is negative distance to the goal divided by six
            targets:
              - rs-telescoping-mechanism
            color: cyan
            linger: 0.4
          - id: rsx-telescoping-b0-s0
            phrase: The potential is negative distance to the goal divided by six.
            targets:
              - rs-telescoping-mechanism
            color: cyan
            linger: 0.3
          - id: rsx-telescoping-b0-s1
            phrase: For each transition, add discount times next potential minus current potential to the training reward.
            targets:
              - rs-telescoping-mechanism
            color: cyan
            linger: 0.3
          - id: rsx-telescoping-b0-s2
            phrase: Discount each transition’s addition again by its time index when summing the return.
            targets:
              - rs-telescoping-mechanism
            color: cyan
            linger: 0.3
      - say: "Adjacent interior potentials cancel: the positive discounted next potential from one step meets the
          negative current potential from the next. The remaining total is negative initial potential plus
          discount to the path length multiplied by final potential. Both a direct completed path and a longer
          detour from state zero end at zero potential, giving the same total addition, plus one."
        hold: 0.7
        visual_cues:
          - id: rs-telescoping-1
            phrase: "Adjacent interior potentials cancel: the positive discounted next potential from one step meets the
              negative current potential from the next"
            targets:
              - rs-telescoping-mechanism
            color: yellow
            linger: 0.4
          - id: rsx-telescoping-b1-s0
            phrase: "Adjacent interior potentials cancel: the positive discounted next potential from one step meets the
              negative current potential from the next."
            targets:
              - rs-telescoping-mechanism
            color: cyan
            linger: 0.3
          - id: rsx-telescoping-b1-s1
            phrase: The remaining total is negative initial potential plus discount to the path length multiplied by final
              potential.
            targets:
              - rs-telescoping-mechanism
            color: cyan
            linger: 0.3
          - id: rsx-telescoping-b1-s2
            phrase: Both a direct completed path and a longer detour from state zero end at zero potential, giving the
              same total addition, plus one.
            targets:
              - rs-telescoping-mechanism
            color: cyan
            linger: 0.3
      - say: A stationary start step can earn a positive local shaping term without making progress. It does not make
          its entire policy optimal. For a discounted infinite horizon, bounded potential makes the remaining
          term vanish in the limit. A finite artificial timeout generally leaves a nonzero remainder. The
          theorem’s assumptions and boundary handling matter.
        hold: 0.7
