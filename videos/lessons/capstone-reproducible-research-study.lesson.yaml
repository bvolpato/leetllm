  - id: outsider-terms
    title: Name the actual independent evidence layer
    visual: Classify reruns by team and by artifact origin, then distinguish access to an artifact from evidence that someone exercised it.
    beats:
      - say: Under ACM’s current terminology, repeatability uses the same team and setup. Reproducibility uses a
          different team with the authors’ artifacts. Replicability uses a different team and independently
          developed artifacts. Declare which was actually exercised; an author rerun does not establish either
          independent layer.
