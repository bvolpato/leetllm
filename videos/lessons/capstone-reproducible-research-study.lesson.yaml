            targets:
              - rs-plan-history-mechanism
            color: cyan
            linger: 0.3
          - id: rsx-plan-history-b0-s2
            phrase: Use pilot debugging first, freeze the new hypothesis, variables, decision and exclusion rules, then
              collect a reserved untouched confirmatory sample.
            targets:
              - rs-plan-history-mechanism
            color: cyan
            linger: 0.3
      - say: A retained commit identifies a plan version, while a timestamped read-only registration preserves the
          before-data commitment. Record amendments and their timing. If a terminal bug is discovered after
          several observed seeds, retain the invalid outputs, version the correction and rerun the complete
          corrected comparison rather than mixing old and new implementations.
        hold: 0.7
        visual_cues:
          - id: rs-plan-history-1
            phrase: A retained commit identifies a plan version, while a timestamped read-only registration preserves the
              before-data commitment
            targets:
              - rs-plan-history-mechanism
            color: yellow
            linger: 0.4
          - id: rsx-plan-history-b1-s0
            phrase: A retained commit identifies a plan version, while a timestamped read-only registration preserves the
              before-data commitment.
            targets:
              - rs-plan-history-mechanism
            color: cyan
            linger: 0.3
          - id: rsx-plan-history-b1-s1
            phrase: Record amendments and their timing.
            targets:
              - rs-plan-history-mechanism
            color: cyan
            linger: 0.3
          - id: rsx-plan-history-b1-s2
            phrase: If a terminal bug is discovered after several observed seeds, retain the invalid outputs, version the
              correction and rerun the complete corrected comparison rather than mixing old and new implementations.
            targets:
              - rs-plan-history-mechanism
            color: cyan
            linger: 0.3
      - say: Because the observed outcomes influenced development, label that corrected run amended evidence. A new
          untouched sample is needed for a fresh confirmatory claim. Run all planned pairs under the
