  - id: environment-runtime
    title: Reconstruct the actual transition contract
    visual: Follow an intended action through a slip, an endpoint clamp, a goal reward and a collection timeout.
    beats:
      - say: Every episode begins at state zero in a corridor from zero through six. Action zero intends left and
          action one intends right. A slip below probability point one five reverses the intended movement,
          then the environment clamps the new position to the endpoints.
        hold: 0.7
        visual_cues:
          - id: rs-environment-runtime-0
            phrase: Every episode begins at state zero in a corridor from zero through six
            targets:
              - rs-environment-runtime-mechanism
            color: cyan
            linger: 0.4
          - id: rsx-environment-runtime-b0-s0
            phrase: Every episode begins at state zero in a corridor from zero through six.
            targets:
              - rs-environment-runtime-mechanism
            color: cyan
            linger: 0.3
          - id: rsx-environment-runtime-b0-s1
            phrase: Action zero intends left and action one intends right.
            targets:
              - rs-environment-runtime-mechanism
            color: cyan
            linger: 0.3
          - id: rsx-environment-runtime-b0-s2
            phrase: A slip below probability point one five reverses the intended movement, then the environment clamps
              the new position to the endpoints.
            targets:
              - rs-environment-runtime-mechanism
            color: cyan
            linger: 0.3
      - say: The original environment reward is one on reaching state six, otherwise zero. Goal arrival terminates the
          episode. The collection loop also stops after twelve steps without success. Retain starting state,
          intended action, realized successor, original reward and ending reason as separate diagnostic facts.
        hold: 0.7
        visual_cues:
          - id: rs-environment-runtime-1
            phrase: The original environment reward is one on reaching state six, otherwise zero
            targets:
              - rs-environment-runtime-mechanism
            color: yellow
            linger: 0.4
          - id: rsx-environment-runtime-b1-s0
            phrase: The original environment reward is one on reaching state six, otherwise zero.
            targets:
              - rs-environment-runtime-mechanism
            color: cyan
            linger: 0.3
          - id: rsx-environment-runtime-b1-s1
            phrase: Goal arrival terminates the episode.
            targets:
              - rs-environment-runtime-mechanism
            color: cyan
            linger: 0.3
          - id: rsx-environment-runtime-b1-s2
            phrase: The collection loop also stops after twelve steps without success.
            targets:
              - rs-environment-runtime-mechanism
            color: cyan
            linger: 0.3
          - id: rsx-environment-runtime-b1-s3
            phrase: Retain starting state, intended action, realized successor, original reward and ending reason as
              separate diagnostic facts.
            targets:
              - rs-environment-runtime-mechanism
            color: cyan
            linger: 0.3
