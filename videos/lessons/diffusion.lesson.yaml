version: 1
id: diffusion
title: "Diffusion: How Noise Becomes an Image"
source: system-design/image-generation-diffusion-models/content.md
sources:
  - title: Denoising Diffusion Probabilistic Models
    url: https://arxiv.org/abs/2006.11239
  - title: Score-Based Generative Modeling through Stochastic Differential Equations
    url: https://arxiv.org/abs/2011.13456
  - title: Denoising Diffusion Implicit Models
    url: https://arxiv.org/abs/2010.02502
  - title: Classifier-Free Diffusion Guidance
    url: https://arxiv.org/abs/2207.12598
  - title: High-Resolution Image Synthesis with Latent Diffusion Models
    url: https://arxiv.org/abs/2112.10752
  - title: Progressive distillation and velocity parameterization
    url: https://arxiv.org/abs/2202.00512
  - title: DiT
    url: https://arxiv.org/abs/2212.09748
  - title: Rectified-flow multimodal transformer
    url: https://arxiv.org/abs/2403.03206
