  - id: latent-contract
    title: Compression changes representation and leaves a reconstruction limit
    visual: The same clean table is encoded into continuous latent coordinates, diffused without code-ID
      substitution and decoded after required scaling. A separate encode/decode-only text patch
      already loses a stroke before the denoiser runs. Actual512×512×3 versus64×64×4 scalar counts
      give48, spatialsites give64, and wall-clock remains unmeasured.
    beats:
      - say: During training, the denoiser learns from noisy copies of the encoder's continuous latents.
          To generate the table from text, start with a random latent. The denoiser predicts the noise
          in it, called epsilon. DDIM uses that prediction to estimate the clean latent. With eta set
          to zero, it mixes the clean estimate and the predicted noise using the
          weights for the next noise level. That mix becomes the denoiser's next input. After the last
          step, apply the checkpoint's scale and decode the final latent into pixels.
