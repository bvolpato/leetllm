  - title: Diffusers reproducibility
    url: https://huggingface.co/docs/diffusers/using-diffusers/reusing_seeds
scenes:
  - id: intro
    title: Can a sampler bring this pixel back?
    visual: Turn down a known noise mix until the table emerges. Track one pixel as its brightness
      changes. Save a lightly noisy exposure, add more noise, then jump back and compare the readings.
    beats:
      - say: Turn down the noise and a table comes into view. Follow the yellow square on the tabletop.
          On the clean image its brightness is one. Let's see if a sampler can bring back a reading we save.
        hold: 0.5
        visual_cues:
          - id: table-clear
            phrase: Turn down the noise and a table comes into view
            targets: [pixel-working, pixel-brightness]
            linger: 0.2
          - id: table-edge
            phrase: Follow the yellow square on the tabletop
            targets: [pixel-working, pixel-brightness]
            linger: 0.2
      - say: On the working copy, keep ninety percent of the signal variance and mix in a little noise. Each
          pixel gets its own draw. The draw at our square is negative four tenths, so the mark moves to the
          left.
        hold: 0.6
        visual_cues:
          - id: table-first-exposure
            phrase: keep ninety percent of the signal variance and mix in a little noise
            targets:
              - pixel-working
              - pixel-brightness
            linger: 0.2
      - say: Save this exposure on the left. Its marked pixel reads point eight two two. Keep the same noise
          pattern and take the retained variance down to one half. The working copy now reads point four
          two four. Jump back to ninety percent with the same noise and no fresh draw. Which reading should
          come back?
        caption_starts:
          - Which reading should come back
        hold: 2.4
        visual_cues:
          - id: table-save
            phrase: Save this exposure on the left
            targets:
              - pixel-reference
              - pixel-working
            linger: 0.2
          - id: table-second-exposure
            phrase: take the retained variance down to one half
            targets:
              - pixel-working
              - pixel-brightness
            linger: 0.2
          - id: table-question
            phrase: which reading should come back
            targets:
              - pixel-reference
              - pixel-working
              - pixel-brightness
            linger: 0.2
      - say: Use the noise we added to take one step back. The yellow dot lands at point eight two two,
          inside the blue ring. When generating a new picture, the denoiser has to estimate the noise.
        caption_starts:
          - point eight two two
        hold: 0.8
        visual_cues:
          - id: table-return
            phrase: The yellow dot lands at point eight two two
            targets:
              - pixel-working
              - pixel-reference
              - pixel-brightness
            linger: 0.2
            caption_boundary: true
  - id: forward
    title: Follow the edge into the noise
    visual: Keep the tabletop coordinate in view while its clean signal shrinks and the noise amplitude
      grows. Its live reading follows the same two coefficients as the whole image.
    beats:
      - say: Start again from the clean table. Each pixel is a number. Add a random number to every coordinate
          while shrinking the clean signal. As the noise grows, the table's edges fade into the surrounding
          variation.
        hold: 0.6
        motion_check:
          region:
            - 145
            - 330
            - 500
            - 500
          minimumChangedFraction: 0.002
        visual_cues:
          - id: forward-add-noise
            phrase: Add a random number to every coordinate while shrinking the clean signal
            targets:
              - forward-signal-strength
              - forward-noise-strength
            color: cyan
            linger: 0.65
          - id: forward-edges-fade
            phrase: As the noise grows, the table's edges fade into the surrounding variation
            targets:
              - forward-forward-tile
            color: yellow
            linger: 0.65
          - id: df-forward-0
            phrase: Each pixel is a number. Add a random number to every coordinate while shrinking the clean signal.
              As the noise grows, the table's edges fade into the surrounding variation.
            targets:
              - df-forward-operation
            linger: 0.35
      - say: The schedule controls how much signal remains at each noise level. Here we keep one noise draw fixed
          while changing its strength, so you can follow individual pixels. This sweep compares marginal
          samples at different levels.
        hold: 0.5
        visual_cues:
          - id: forward-sweep
            phrase: This sweep compares marginal samples at different levels
            targets:
              - forward-forward-tile
            color: cyan
            linger: 0.65
          - id: forward-retained-signal
            phrase: The schedule controls how much signal remains at each noise level
            targets:
              - forward-forward-tile
              - forward-signal-strength
            color: yellow
            linger: 0.65
          - id: df-forward-1
            phrase: The schedule controls how much signal remains at each noise level. Here we keep one noise draw
              fixed while changing its strength, so you can follow individual pixels. This sweep compares
              marginal samples at different levels.
            targets:
              - df-forward-operation
            linger: 0.35
      - say: Training can reach any level directly. One batch can contain lightly corrupted images and almost
          pure static, creating a family of related reconstruction tasks.
        hold: 0.5
        visual_cues:
          - id: forward-beat-3-focus-1
            phrase: Training can reach any level directly
            targets:
              - forward-forward-tile
            color: cyan
            linger: 0.65
          - id: forward-beat-3-focus-2
            phrase: One batch can contain lightly corrupted images and almost pure static
            targets:
              - forward-forward-tile
            color: yellow
            linger: 0.65
          - id: df-forward-2
            phrase: Training can reach any level directly. One batch can contain lightly corrupted images and almost
              pure static, creating a family of related reconstruction tasks.
            targets:
              - df-forward-operation
            linger: 0.35
  - id: coefficients
    title: Two coefficients control the mixture
    visual: A unit-circle coefficient probe constructs square-root signal and noise amplitudes, then a
      scalar number line adds the signed contributions for x0=1 and epsilon=-0.4. The probe reaches
      alpha-bar=0.5 and the numerical sum 0.424 remains readable.
    beats:
      - say: The formula combines a scaled clean value and scaled Gaussian noise. Alpha bar measures
          retained signal variance. Its square root gives the signal amplitude. The remaining
          variance determines the noise amplitude.
        hold: 0.5
        visual_cues:
          - id: coefficients-mixture
            phrase: The formula combines a scaled clean value and scaled Gaussian noise
            targets:
              - coefficients-mixture
            color: cyan
            linger: 0.65
          - id: coefficients-amplitude
            phrase: Its square root gives the signal amplitude. The remaining variance determines the noise
              amplitude
            targets:
              - coefficients-amplitudes
            color: yellow
            linger: 0.65
          - id: df-coefficients-0
            phrase: The formula combines a scaled clean value and scaled Gaussian noise. Alpha bar measures
              retained signal variance. Its square root gives the signal amplitude. The remaining
              variance determines the noise amplitude.
            targets:
              - df-coefficients-operation
            linger: 0.35
      - say: At the halfway setting, both amplitudes are about seven tenths. Our clean pixel is one; its
          sampled noise is negative. Their contributions partially cancel on the number line.
        hold: 0.7
        visual_cues:
          - id: coefficients-halfway
            phrase: At the halfway setting, both amplitudes are about seven tenths
            targets:
              - coefficients-amplitudes
            color: cyan
            linger: 0.65
          - id: coefficients-cancellation
            phrase: Their contributions partially cancel on the number line
            targets:
              - coefficients-number-line
            color: yellow
            linger: 0.65
          - id: df-coefficients-1
            phrase: At the halfway setting, both amplitudes are about seven tenths. Our clean pixel is one; its
              sampled noise is negative. Their contributions partially cancel on the number line.
            targets:
              - df-coefficients-operation
            linger: 0.35
      - say: The squared coefficients add to one. Their ratio describes the schedule's signal-to-noise ratio
          under unit-variance assumptions. Lower signal-to-noise means that many different clean
          images could plausibly explain the observed noisy input.
        hold: 0.6
        visual_cues:
          - id: coefficients-unit-variance
            phrase: The squared coefficients add to one
            targets:
              - coefficients-math-a-2-b-2-1
            color: cyan
            linger: 0.65
          - id: coefficients-snr
            phrase: Their ratio describes the schedule's signal-to-noise ratio under unit-variance assumptions
            targets:
              - coefficients-snr
            color: yellow
            linger: 0.65
          - id: df-coefficients-2
            phrase: The squared coefficients add to one. Their ratio describes the schedule's signal-to-noise
              ratio under unit-variance assumptions. Lower signal-to-noise means that many different
              clean images could plausibly explain the observed noisy input.
            targets:
              - df-coefficients-operation
            linger: 0.35
  - id: forward-schedule
    title: The product of retained fractions sets the noise level
    visual: Three beta cells .02/.03/.04 become alpha .98/.97/.96, multiply into .912576, and visibly
      retain the table. A separate original1000-step linear schedule ends near4.04e−5. The same
      x0=1/noise−.4 moves through .9/.5/.001 to .822/.424/−.368 with exact square-root amplitudes
      and SNR.
    beats:
      - say: At one discrete step, beta is the added noise variance and alpha is one minus beta. Alpha bar
          is the product of all retained alpha factors through that step. The closed-form marginal
          uses square root alpha bar times the clean value, plus square root one minus alpha bar
          times a unit Gaussian draw. That gives direct training samples at any chosen level without
          simulating every earlier corruption.
        hold: 0.7
        visual_cues:
          - id: df-forward-schedule-0
            phrase: At one discrete step, beta is the added noise variance and alpha is one minus beta. Alpha
              bar is the product of all retained alpha factors through that step. The closed-form
              marginal uses square root alpha bar times the clean value, plus square root one minus
              alpha bar times a unit Gaussian draw. That gives direct training samples at any chosen
              level without simulating every earlier corruption.
            targets:
              - df-forward-schedule-operation
            linger: 0.35
      - say: Multiply the three retained fractions on screen, point nine eight, point nine
          seven and point nine six. After three steps, about ninety-one percent of the signal
          variance remains. The original thousand-step schedule leaves only about four parts in a
          hundred thousand. At that end of the long schedule, Gaussian noise closely matches the
          starting state for generation.
        hold: 0.7
        visual_cues:
          - id: df-forward-schedule-1
            phrase: Multiply the three retained fractions on screen
            targets:
              - df-forward-schedule-operation
            linger: 0.35
          - id: df-schedule-product
            phrase: about ninety-one percent of the signal variance remains
            targets:
              - df-forward-schedule-result
            linger: 0.35
      - say: Keep the same pixel and the same noise draw. As the retained fraction falls from point
          nine to point five and then to point zero zero one, the pixel goes from bright to dark. At
          the lowest setting it reads negative point three six eight, close to the noise draw of
          negative point four. With unit signal and noise variances, the signal-to-noise ratio is
          the retained fraction divided by the fraction lost. The schedule and loss weights
          determine how strongly each level contributes to training.
        hold: 0.7
        visual_cues:
          - id: df-forward-schedule-2
            phrase: Keep the same pixel and the same noise draw
            targets:
              - df-forward-schedule-operation
            linger: 0.35
          - id: df-schedule-values
            phrase: the pixel goes from bright to dark
            targets:
              - df-forward-schedule-result
            linger: 0.35
  - id: training
    title: Training knows the noise it added
    visual: Clean image, sampled timestep, and seeded noise construct one noisy input. A compact
      denoiser receives only noisy input and timestep. Its illustrative prediction and the exact
      sampled noise travel to a loss panel, where three coordinate residuals shrink with a clearly
      labeled schematic training update.
    beats:
      - say: Choose a clean image, a noise level, and fresh Gaussian noise. Construct the noisy input with
          our equation. We know the target because we generated that noise ourselves.
        hold: 0.5
        visual_cues:
          - id: training-choose-input
            phrase: Choose a clean image, a noise level, and fresh Gaussian noise
            targets:
              - training-clean
              - training-noise
            color: cyan
            linger: 0.65
          - id: training-known-noise
            phrase: We know the target because we generated that noise ourselves
            targets:
              - training-noise
            color: yellow
            linger: 0.65
          - id: df-training-0
            phrase: Choose a clean image, a noise level, and fresh Gaussian noise. Construct the noisy input
              with our equation. We know the target because we generated that noise ourselves.
            targets:
              - df-training-operation
            linger: 0.35
      - say: The network receives the noisy input and timestep, then estimates the added noise. Compare its
          prediction with the target, square the errors, and average them. Gradient descent adjusts
          the parameters.
        hold: 0.6
        visual_cues:
          - id: training-network-input
            phrase: The network receives the noisy input and timestep, then estimates the added noise
            targets:
              - training-input
              - training-network
              - training-timestep
            color: cyan
            linger: 0.65
          - id: training-comparison
            phrase: Compare its prediction with the target, square the errors, and average them
            targets:
              - training-noise-error-center-coordinates-0-1-2-center-8d9cb944-mse-loss-tofixe
            color: yellow
            linger: 0.65
          - id: df-training-1
            phrase: The network receives the noisy input and timestep, then estimates the added noise. Compare
              its prediction with the target, square the errors, and average them. Gradient descent
              adjusts the parameters.
            targets:
              - df-training-operation
            linger: 0.35
      - say: These shrinking errors illustrate the objective. Real training repeats this calculation over
          many images and noise levels. A single denoiser learns shared patterns that remain useful
          even when individual images are heavily corrupted.
        hold: 0.6
        visual_cues:
          - id: training-errors
            phrase: These shrinking errors illustrate the objective
            targets:
              - training-noise-error-center-coordinates-0-1-2-center-8d9cb944-mse-loss-tofixe
            color: cyan
            linger: 0.65
          - id: training-shared-network
            phrase: A single denoiser learns shared patterns
            targets:
              - training-network
            color: yellow
            linger: 0.65
          - id: df-training-2
            phrase: These shrinking errors illustrate the objective. Real training repeats this calculation over
              many images and noise levels. A single denoiser learns shared patterns that remain
              useful even when individual images are heavily corrupted.
            targets:
              - df-training-operation
            linger: 0.35
  - id: reverse-posterior
    title: What distribution takes the gray pixel one step back?
    visual: A dark pixel and a light pixel can both produce the observed zero. Draw the two Gaussian
      distributions for the previous step when the clean pixel is known. Halve both densities, add their
      heights at each position, and account for the spread between their means.
    beats:
      - say: Suppose a clean pixel can be dark or light, with equal chances. We observe a noisy pixel right in
          the middle, at zero. The dark pixel could have moved up. The light one could have moved down.
          With just that observation, what distribution should we use for the step back?
        hold: 1.8
        visual_cues:
          - id: causes-observed
            phrase: The dark pixel could have moved up. The light one could have moved down
            targets:
              - posterior-density
              - posterior-causes
            linger: 0.2
      - say: Start with the dark pixel as the known cause. The previous level retained half the signal variance.
          This step keeps half of that, leaving one quarter. With the clean pixel given, we can calculate the whole bell
          curve for the previous state. Its center is a little below zero. Now use the light pixel as the
          known cause. Its bell has the same width, centered just as far above zero. Take the square root
          of two and divide by three. That's how far each center sits from zero. Each curve has variance one third.
        hold: 0.9
        visual_cues:
          - id: cause-dark
            phrase: we can calculate the whole bell curve for the previous state
            targets:
              - posterior-density
              - posterior-causes
            linger: 0.2
          - id: cause-light
            phrase: Now use the light pixel as the known cause
            targets:
              - posterior-density
              - posterior-causes
            linger: 0.2
      - say: A training example tells us which clean pixel we started with. During generation that label is
          missing. Both causes are equally plausible here, so halve the height of each curve. Add their
          heights at every position. The yellow curve is the distribution we need. Its mean is zero. Its
          variance includes the spread within each bell and the spread between their centers. One third
          plus two ninths gives five ninths. For a real image there are many more possible clean causes. A
          DDPM learns a Gaussian approximation to that reverse step.
        hold: 0.9
        visual_cues:
          - id: causes-half
            phrase: halve the height of each curve
            targets:
              - posterior-density
            linger: 0.2
          - id: causes-mix
            phrase: Add their heights at every position
            targets:
              - posterior-density
            linger: 0.2
          - id: causes-total
            phrase: One third plus two ninths gives five ninths
            targets:
              - posterior-variance
              - posterior-density
            linger: 0.2
            caption_boundary: true
  - id: training-targets
    title: What did the network predict?
    visual: Pair each predicted coordinate with its target and average its squared residual. Switch the
      tabletop example to a velocity output. Compare both inverse formulas on the same ruler against the
      known clean image.
    beats:
      - say: Here are two noise predictions. For each coordinate, subtract the prediction from the noise we put
          in. Square those three differences and take their mean. The losses are about six ten-thousandths
          and twenty-five thousandths. These two rows measure the supplied predictions. To compare learning
          difficulty, we'd need many rows per noise level.
        hold: 0.6
        visual_cues:
          - id: loss-residuals
            phrase: Square those three differences
            targets:
              - loss-pairs
            linger: 0.2
          - id: loss-mean
            phrase: The losses are about six ten-thousandths and twenty-five thousandths
            targets:
              - loss-pairs
            linger: 0.2
            caption_boundary: true
      - say: "The original denoiser learns from those errors. Its simple regression loss comes from reweighting a
          variational bound, and it needs no discriminator. Now change what the model predicts. At the
          marked pixel it returns velocity. Take signal amplitude times noise and subtract noise amplitude times clean
          brightness. Here that output is about negative point nine nine zero. The noisy input is still
          point four two four."
        hold: 0.7
        visual_cues:
          - id: target-rotation
            phrase: Here that output is about negative point nine nine zero
            targets:
              - pixel-method
              - pixel-working
            linger: 0.2
      - say: Suppose the sampler reads that output as noise. It subtracts the scaled prediction from the input
          and divides by the signal amplitude. It gets one point five nine zero. Look at the yellow mark.
          Our clean reference is one.
        hold: 1.6
        visual_cues:
          - id: target-failure
            phrase: It gets one point five nine zero
            targets:
              - pixel-reference
              - pixel-brightness
            linger: 0.2
            caption_boundary: true
      - say: Keep the output and change its interpretation. Multiply the noisy input by the signal amplitude and
          subtract the noise amplitude times velocity. That takes the mark back to one. If the scheduler
          needs epsilon instead, multiply the input by the noise amplitude and add the signal amplitude
          times velocity. The model and scheduler have to agree on the prediction type. A straight-path
          flow model will use a different meaning of velocity.
        hold: 0.8
        visual_cues:
          - id: target-convert
            phrase: That takes the mark back to one
            targets:
              - pixel-working
              - pixel-brightness
            linger: 0.2
            caption_boundary: true
  - id: reverse
    title: Sampling turns a prediction into an update
    visual: A persistent noisy-state tile passes to a denoiser and a separate scheduler, then returns on
      a routed loop. Timestep decreases as the update repeats. A DDPM mean-plus-variance equation
      separates the learned prediction from newly sampled noise, with a final-step noise term fading
      to zero.
    beats:
      - say: Generation starts with random noise. The network predicts, and a numerical sampler updates the
          current state. That state becomes the next input. Repetition produces a sample from the
          learned image distribution.
        hold: 0.5
        visual_cues:
          - id: reverse-sampler
            phrase: The network predicts, and a numerical sampler updates the current state
            targets:
              - reverse-network
              - reverse-sampler-center-prediction-state-update-center-reverse-sampler
            color: cyan
            linger: 0.65
          - id: reverse-sample
            phrase: Repetition produces a sample from the learned image distribution
            targets:
              - reverse-reverse-tile
            color: yellow
            linger: 0.65
          - id: df-reverse-0
            phrase: Generation starts with random noise. The network predicts, and a numerical sampler updates
              the current state. That state becomes the next input. Repetition produces a sample
              from the learned image distribution.
            targets:
              - df-reverse-operation
            linger: 0.35
      - say: A standard stochastic DDPM step combines a learned reverse mean with fresh Gaussian noise on
          intermediate steps. The sampler chooses the appropriate coefficients and variance. The
          final step omits that additional random draw.
        hold: 0.5
        visual_cues:
          - id: reverse-ddpm-update
            phrase: A standard stochastic DDPM step combines a learned reverse mean with fresh Gaussian noise on
              intermediate steps
            targets:
              - reverse-update
            color: cyan
            linger: 0.65
          - id: reverse-final-noise
            phrase: The final step omits that additional random draw
            targets:
              - reverse-noise-state
              - reverse-update
            color: yellow
            linger: 0.65
          - id: df-reverse-1
            phrase: A standard stochastic DDPM step combines a learned reverse mean with fresh Gaussian noise on
              intermediate steps. The sampler chooses the appropriate coefficients and variance. The
              final step omits that additional random draw.
            targets:
              - df-reverse-operation
            linger: 0.35
      - say: "The timestep identifies the noise regime. All network layers run during each evaluation.
          Network depth and sampling time are separate: a complete network prediction supports one
          update of the evolving state."
        hold: 0.6
        visual_cues:
          - id: reverse-time
            phrase: The timestep identifies the noise regime
            targets:
              - reverse-timestep
            color: cyan
            linger: 0.65
          - id: reverse-layers
            phrase: All network layers run during each evaluation
            targets:
              - reverse-network-layers
            color: yellow
            linger: 0.65
          - id: reverse-depth-time
            phrase: a complete network prediction supports one update of the evolving state
            targets:
              - reverse-network
              - reverse-sampler-center-prediction-state-update-center-reverse-sampler
            color: cyan
            linger: 0.65
          - id: df-reverse-2
            phrase: "The timestep identifies the noise regime. All network layers run during each evaluation.
              Network depth and sampling time are separate: a complete network prediction supports
              one update of the evolving state."
            targets:
              - df-reverse-operation
            linger: 0.35
  - id: reverse-trace
    title: Each completed state becomes the next step input
    visual: The actual stdlib scalar trace keeps x1.25 and beta3-step worksheet. It constructs
      predictednoise.603→mean1.193→draw−.256→state1.141, then .534/1.086/.511/1.174, finally
      .528/1.111/zero/1.111. Saving after firststep retains the consumed RNG state; reseeding
      visibly repeats the wrong draw and diverges.
    beats:
      - say: Start with one number, one point two five. A simple formula predicts the noise for each
          row. In the first row it predicts about point six zero three. The sampler uses that
          prediction to calculate its reverse mean, one point one nine three. The Gaussian draw is
          negative. Multiply the draw by the square root of beta and add it to the mean. The result
          is one point one four one. Follow that number into the next row.
        hold: 0.7
        visual_cues:
          - id: df-reverse-trace-0
            phrase: The sampler uses that prediction to calculate its reverse mean
            targets:
              - df-reverse-trace-operation
            linger: 0.35
          - id: df-trace-first
            phrase: The result is one point one four one
            targets:
              - df-reverse-trace-result
            linger: 0.35
      - say: In the next row the draw is positive. It pushes the state above the mean, to one point one
          seven four. On the final step the sampler skips the fresh draw and returns the mean, about
          one point one one one. Setting every draw to zero would follow the DDPM means. DDIM uses a
          different update, which we will build on the tabletop.
        hold: 0.7
        visual_cues:
          - id: df-reverse-trace-1
            phrase: In the next row the draw is positive
            targets:
              - df-reverse-trace-operation
            linger: 0.35
          - id: df-trace-second
            phrase: to one point one seven four
            targets:
              - df-reverse-trace-result
            linger: 0.35
          - id: df-trace-final
            phrase: about one point one one one
            targets:
              - df-reverse-trace-result
            linger: 0.35
      - say: Pause after the first row. To resume, restore the saved state and take the next Gaussian
          draw, point five one one. Resetting the seed repeats the first draw, negative point two
          five six. Now the same starting value lands somewhere else. Save the latent, the next
          timestep, the random generator state and any history the solver uses.
        hold: 0.7
        visual_cues:
          - id: df-reverse-trace-2
            phrase: Resetting the seed repeats the first draw
            targets:
              - df-reverse-trace-operation
            linger: 0.35
          - id: df-trace-resume
            phrase: the next Gaussian draw, point five one one
            targets:
              - df-reverse-trace-result
            linger: 0.35
  - id: score
    title: A map of promising directions
    visual: Three narrow Gaussian modes are convolved with Gaussian noise. Exact mixture-density
      contours widen as variance increases. On the same plot, an exact log-density-gradient vector
      field appears; a selected probe demonstrates the local score direction. During the component
      explanation, the probe's posterior-weighted local Gaussian score vectors build head to tail
      into that aggregate score.
    beats:
      - say: Replace an image's many coordinates with two. Our clean distribution has three clusters.
          Gaussian noise broadens them into an overlapping cloud whose density we can calculate
          exactly.
        hold: 0.5
        visual_cues:
          - id: score-beat-1-focus-1
