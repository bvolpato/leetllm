version: 1
id: logistic-regression
title: Logistic Regression at the Review Desk
source: foundations/logistic-regression-classification-metrics-from-scratch/content.md
sources:
  - title: "Stanford CS229: logistic regression"
    url: https://cs229.stanford.edu/notes_archive/cs229-notes-all/cs229-notes1.pdf
  - title: Scikit-learn calibration
    url: https://scikit-learn.org/stable/modules/calibration.html
  - title: Scikit-learn classification metrics
    url: https://scikit-learn.org/stable/modules/model_evaluation.html
  - title: "Scikit-learn: average precision with threshold groups"
    url: https://scikit-learn.org/stable/modules/generated/sklearn.metrics.average_precision_score.html
  - title: "Scikit-learn: support-vector objectives and kernel formulation"
    url: https://scikit-learn.org/stable/modules/svm.html#mathematical-formulation
  - title: "Rasmussen and Williams: Gaussian-process regression, equations 2.25–2.26"
    url: https://gaussianprocess.org/gpml/chapters/RW2.pdf
scenes:
  - id: intro
    title: Routing by score
    visual: A scored access badge drops straight onto its place on the ruler. Keep the badge pinned while the
      yellow review threshold slides underneath it.
    beats:
      - say: This access request lands at point six two four. The yellow cut is at point eight. Requests at or above
          it go to a reviewer. This one goes through automatically.
        hold: 0.5
        visual_cues:
          - id: opening-score
            phrase: This access request lands at point six two four
            targets:
              - request-ruler
            linger: 0.45
          - id: opening-auto
            phrase: This one goes through automatically
            targets:
              - request-ruler
              - request-record
            caption_boundary: true
            linger: 0.45
      - say: Suppose we lower the cut to one half. Keep your eye on the blue dot. Which route would this same request
          take?
        hold: 2.5
        visual_cues:
          - id: opening-proposal
            phrase: lower the cut to one half
            targets:
              - request-ruler
            linger: 0.45
      - say: Slide the yellow cut past the dot. Now the request goes to human review. The score stayed put.
          Where did that point six two four come from?
        hold: 0.85
        visual_cues:
          - id: opening-choice
            phrase: Slide the yellow cut past the dot
            targets:
              - request-ruler
            linger: 0.45
          - id: opening-review
            phrase: Now the request goes to human review
            targets:
              - request-record
            caption_boundary: true
            linger: 0.45
  - id: evidence-score
    title: Where did the score come from?
    visual: Three signed contributions travel end to end on a common logit scale. A vertical guide carries the end
      of each addition down to the start of the next.
    beats:
      - say: Here’s what the model knew about that request. Its ambiguity was three. The evidence that policy allowed
          automatic handling scored five. A positive label means that review was required. Use rounded fitted
          weights so we can follow the arithmetic. Start at the intercept, minus four point nine.
        hold: 0.45
        visual_cues:
          - id: score-intercept
            phrase: Start at the intercept, minus four point nine
            targets:
              - score-contributions
            linger: 0.45
      - say: Each point of ambiguity adds three point four. Move right by ten point two. Stronger policy support pulls
          the other way. Five times minus point nine six takes us left by four point eight. Where do we land?
        hold: 1.9
        visual_cues:
          - id: score-ambiguity
            phrase: Move right by ten point two
            targets:
              - score-contributions
            linger: 0.45
          - id: score-support
            phrase: takes us left by four point eight
            targets:
              - score-contributions
            linger: 0.45
      - say: Half a unit above zero. That signed sum is the logit. A larger logit favors the review-required label.
          How does half a unit turn into the number on our desk?
        hold: 0.6
        visual_cues:
          - id: score-total
            phrase: Half a unit above zero
            targets:
              - score-result
            caption_boundary: true
            linger: 0.45
  - id: sigmoid
    title: The same score step can have a different effect
    visual: Trace equal horizontal steps on the sigmoid and measure their vertical changes. For the waiting
      request, compare the score from the rounded weights with the score from the full fit.
    beats:
      - say: The sigmoid maps a zero logit to one half, negative scores toward zero, and positive scores toward one.
          Follow the moving point. Around the center, shifting the score from minus one to one makes a large
          vertical change. The bracket measures that change.
        hold: 0.7
        visual_cues:
          - id: sigmoid-center
            phrase: shifting the score from minus one to one
            targets:
              - sigmoid-center-probe
            linger: 0.7
      - say: Make the same two-unit move out in the tail, from four to six. The vertical change is much smaller. The
          curve is flattening. Our request's logit near one half maps to a score near point six two. The curve
          bounds the number; later outcomes must test its frequency meaning.
        hold: 0.7
        visual_cues:
          - id: sigmoid-tail
            phrase: from four to six
            targets:
              - sigmoid-tail-probe
            linger: 0.7
          - id: request-probability
            phrase: Our request's logit near one half
            targets:
              - request-probability
            linger: 0.7
          - id: full-fit-score
            phrase: maps to a score near point six two
            targets:
              - request-probability
            linger: 0.45
      - say: The logit is the logarithm of the positive-class odds. At a zero score the odds are one to one. Adding
          one to the logit multiplies the odds by e. Logistic regression assumes that these log odds are a
          linear combination of the evidence features.
        hold: 0.55
        visual_cues:
          - id: logit-definition
            phrase: logarithm of the positive-class odds
            targets:
              - log-odds-definition
            linger: 0.65
  - id: boundary-geometry
    title: Measure the score in the feature plane
    visual: Retain the request and its two feature coordinates. Construct the coefficient normal, project the
      point onto the equal-score line, then change only the threshold level. Treat the constant-score case
      separately.
    beats:
      - say: "A binary label does not force us to use logistic regression. Least squares can fit zero and one labels,
          but its linear prediction can leave the probability interval. Bernoulli conditional variance is p
          times one minus p, so it can change with features. Squared error on bounded probabilities is the
          legitimate Brier scoring loss. The sigmoid supplies a different model: linear log odds."
        hold: 0.65
        visual_cues:
          - id: lr-boundary-geometry-step-0
            phrase: "A binary label does not force us to use logistic regression. Least squares can fit zero and one
              labels, but its linear prediction can leave the probability interval. Bernoulli conditional
              variance is p times one minus p, so it can change with features. Squared error on bounded
              probabilities is the legitimate Brier scoring loss. The sigmoid supplies a different model:
              linear log odds."
            targets:
              - lr-boundary-geometry-mechanism
            linger: 0.35
      - say: Sigmoid divides one by the quantity one plus the exponential of the negative logit. Keep the intercept
          separate from the feature coefficients. For a nonzero vector beta of feature coefficients, the
          boundary at threshold one half satisfies beta dot x plus intercept equals zero. Beta is
          perpendicular to that line and points toward larger scores. The Euclidean norm of beta is the square
          root of the sum of its squared feature coefficients. The signed orthogonal distance in these feature
          units equals the logit divided by the Euclidean norm of beta.
        hold: 0.65
        visual_cues:
          - id: lr-boundary-geometry-step-1
            phrase: Sigmoid divides one by the quantity one plus the exponential of the negative logit. Keep the intercept
              separate from the feature coefficients. For a nonzero vector beta of feature coefficients, the
              boundary at threshold one half satisfies beta dot x plus intercept equals zero. Beta is
              perpendicular to that line and points toward larger scores. The Euclidean norm of beta is the
              square root of the sum of its squared feature coefficients. The signed orthogonal distance in
              these feature units equals the logit divided by the Euclidean norm of beta.
            targets:
              - lr-boundary-geometry-mechanism
            linger: 0.35
          - id: lr-boundary-normal
            phrase: The Euclidean norm of beta is the square root of the sum of its squared feature coefficients.
            targets:
              - lr-boundary-geometry-mechanism
            linger: 0.35
          - id: lr-boundary-distance
            phrase: The signed orthogonal distance in these feature units equals the logit divided by the Euclidean norm
              of beta.
            targets:
              - lr-boundary-geometry-mechanism
            linger: 0.35
      - say: A threshold t between zero and one changes the required logit to the natural logarithm of the ratio t
          over the quantity one minus t. It shifts a parallel boundary while holding the coefficients fixed. A
          zero second coefficient can produce a vertical line; if every feature coefficient is zero, the
          classifier is constant and has no separating hyperplane. Rescaling feature units changes this
          geometric distance.
        hold: 0.65
        visual_cues:
          - id: lr-boundary-geometry-step-2
            phrase: A threshold t between zero and one changes the required logit to the natural logarithm of the ratio t
              over the quantity one minus t. It shifts a parallel boundary while holding the coefficients
              fixed. A zero second coefficient can produce a vertical line; if every feature coefficient is
              zero, the classifier is constant and has no separating hyperplane. Rescaling feature units
              changes this geometric distance.
            targets:
              - lr-boundary-geometry-mechanism
            linger: 0.35
          - id: lr-boundary-level
            phrase: A threshold t between zero and one changes the required logit to the natural logarithm of the ratio t
              over the quantity one minus t.
            targets:
              - lr-boundary-geometry-mechanism
            linger: 0.35
          - id: lr-boundary-vertical
            phrase: A zero second coefficient can produce a vertical line; if every feature coefficient is zero, the
              classifier is constant and has no separating hyperplane.
            targets:
              - lr-boundary-geometry-mechanism
            linger: 0.35
          - id: lr-boundary-vertical-only
            phrase: A zero second coefficient can produce a vertical line
            targets:
              - lr-boundary-geometry-mechanism
            linger: 0.35
          - id: lr-boundary-constant
            phrase: if every feature coefficient is zero, the classifier is constant and has no separating hyperplane.
            targets:
              - lr-boundary-geometry-mechanism
            linger: 0.35
  - id: log-loss
    title: Which outcome did the model make unlikely?
    visual: A positive outcome selects p from a two-part probability bar. Moving the same prediction makes its
      negative-log penalty grow or shrink.
    beats:
      - say: Suppose this case required review. The model assigned probability p to that outcome. For a routine
          case, we'd use one minus p. Take the negative log of the probability assigned to what happened.
          These losses add across independent training cases. For the case that needed review, which prediction
          gets the bigger loss, one tenth or nine tenths?
        hold: 2.3
        caption_starts:
          - For the case that needed review
        visual_cues:
          - id: loss-select-outcome
            phrase: this case required review
            targets:
              - outcome-probability
            linger: 0.65
      - say: Move the prediction down toward one tenth. The model gave what happened just one chance in ten.
          The loss climbs to about two point three nats. Move up toward nine tenths. The loss falls to about
          a tenth of a nat.
        hold: 0.85
        caption_starts:
          - The loss climbs
          - Move up toward nine tenths
          - The loss falls
        visual_cues:
          - id: loss-wrong
            phrase: Move the prediction down toward one tenth
            targets:
              - loss-probe
            linger: 0.6
          - id: loss-correct
            phrase: Move up toward nine tenths
            targets:
              - loss-probe
            linger: 0.7
      - say: Extreme scores expose a numerical trap. A negative logit of a thousand can round the positive probability
          to zero. Taking its logarithm then fails. The stable softplus expression works directly from the
          finite logit and keeps the positive case's loss at about a thousand.
        hold: 0.7
        visual_cues:
          - id: stable-loss
            phrase: works directly from the finite logit
            targets:
              - stable-log-loss
            linger: 0.7
          - id: lr-stable-loss-result
            phrase: keeps the positive case's loss at about a thousand.
            targets:
              - stable-log-loss
            linger: 0.35
  - id: bernoulli-likelihood
    title: Select the probability of each actual label
    visual: The original completed training rows each select p or one-minus-p. Multiply their selected
      likelihoods, turn the product into a log sum, and distinguish per-row one-hot entropy from the
      population label distribution.
    beats:
      - say: For a Bernoulli row, the probability of its actual label is p raised to y, times the quantity one minus
          p, raised to the quantity one minus y. A positive label selects p; a negative label selects one
          minus p. Assuming conditional independence across the training rows, multiply those selected
          probabilities to obtain the likelihood of the complete observed label vector.
        hold: 0.65
        visual_cues:
          - id: lr-bernoulli-likelihood-step-0
            phrase: For a Bernoulli row, the probability of its actual label is p raised to y, times the quantity one
              minus p, raised to the quantity one minus y. A positive label selects p; a negative label
              selects one minus p. Assuming conditional independence across the training rows, multiply those
              selected probabilities to obtain the likelihood of the complete observed label vector.
            targets:
              - lr-bernoulli-likelihood-mechanism
            linger: 0.35
          - id: lr-label-selection
            phrase: A positive label selects p; a negative label selects one minus p.
            targets:
              - lr-bernoulli-likelihood-mechanism
            linger: 0.35
          - id: lr-complete-likelihood
            phrase: Assuming conditional independence across the training rows, multiply those selected probabilities to
              obtain the likelihood of the complete observed label vector.
            targets:
              - lr-bernoulli-likelihood-mechanism
            linger: 0.35
      - say: "Taking natural logs changes that product into a sum. Negate it and divide by the number of rows to
          obtain mean binary cross-entropy. That normalization matters: replacing the mean with a sum
          multiplies the gradient by the batch size. The linear-regression chapter used mean squared error,
          whose gradient has an additional factor of two; half-squared error removes that factor."
        hold: 0.65
        visual_cues:
          - id: lr-bernoulli-likelihood-step-1
            phrase: "Taking natural logs changes that product into a sum. Negate it and divide by the number of rows to
              obtain mean binary cross-entropy. That normalization matters: replacing the mean with a sum
              multiplies the gradient by the batch size. The linear-regression chapter used mean squared
              error, whose gradient has an additional factor of two; half-squared error removes that factor."
            targets:
              - lr-bernoulli-likelihood-mechanism
            linger: 0.35
          - id: lr-mean-likelihood
            phrase: Negate it and divide by the number of rows to obtain mean binary cross-entropy.
            targets:
              - lr-bernoulli-likelihood-mechanism
            linger: 0.35
      - say: For one observed hard label, the target distribution puts all its mass on that label. Its entropy is
          zero, so its cross-entropy equals the K L divergence with the target as its first argument and the
          prediction as its second. Our whole population can still have uncertain labels and positive marginal
          entropy. Expected log loss is minimized by the true conditional probability when the model family
          can represent it; one sampled label is not that entire distribution.
        hold: 0.65
        visual_cues:
          - id: lr-bernoulli-likelihood-step-2
            phrase: For one observed hard label, the target distribution puts all its mass on that label. Its entropy is
              zero, so its cross-entropy equals the K L divergence with the target as its first argument and
              the prediction as its second. Our whole population can still have uncertain labels and positive
              marginal entropy. Expected log loss is minimized by the true conditional probability when the
              model family can represent it; one sampled label is not that entire distribution.
            targets:
              - lr-bernoulli-likelihood-mechanism
            linger: 0.35
          - id: lr-zero-target-entropy
            phrase: Its entropy is zero, so its cross-entropy equals the K L divergence with the target as its first
              argument and the prediction as its second.
            targets:
              - lr-bernoulli-likelihood-mechanism
            linger: 0.35
  - id: loss-curvature
    title: Inspect the learning signal before trusting convexity
    visual: Compare BCE and squared-error score derivatives on the same confidently wrong positive row. Build the
      weighted design Hessian, retain a duplicate-feature flat direction, and keep separation distinct from
      curvature.
    beats:
      - say: Take a request that needed review. At a logit of minus eight, the model gives that outcome
          almost no chance. Binary cross-entropy has a slope of p minus y, nearly minus one. Look at the
          pink arrow. Now compare squared error after the sigmoid. Its slope has an extra factor of two p
          times one minus p. That shrinks the blue arrow to less than a thousandth of a unit. Using half
          the squared error drops the factor of two.
        hold: 0.65
        visual_cues:
          - id: lr-loss-curvature-step-0
            phrase: Take a request that needed review
            targets:
              - lr-loss-curvature-mechanism
            linger: 0.35
          - id: lr-bce-derivative
            phrase: Binary cross-entropy has a slope of p minus y, nearly minus one
            targets:
              - lr-loss-curvature-mechanism
            linger: 0.35
          - id: lr-mse-derivative
            phrase: Its slope has an extra factor of two p times one minus p
            targets:
              - lr-loss-curvature-mechanism
            linger: 0.35
      - say: For the mean linear-logit loss, the Hessian is X transpose, times a diagonal matrix of p times one minus
          p, times X, divided by the number of rows. Every diagonal factor is positive at finite real logits.
          The Hessian is positive definite when the design has full column rank; duplicate columns create
          directions that leave every training score unchanged.
        hold: 0.65
        visual_cues:
          - id: lr-loss-curvature-step-1
            phrase: For the mean linear-logit loss, the Hessian is X transpose, times a diagonal matrix of p times one
              minus p, times X, divided by the number of rows. Every diagonal factor is positive at finite
              real logits. The Hessian is positive definite when the design has full column rank; duplicate
              columns create directions that leave every training score unchanged.
            targets:
              - lr-loss-curvature-mechanism
            linger: 0.35
          - id: lr-design-hessian
            phrase: For the mean linear-logit loss, the Hessian is X transpose, times a diagonal matrix of p times one
              minus p, times X, divided by the number of rows.
            targets:
              - lr-loss-curvature-mechanism
            linger: 0.35
          - id: lr-duplicate-flat
            phrase: The Hessian is positive definite when the design has full column rank; duplicate columns create
              directions that leave every training score unchanged.
            targets:
              - lr-loss-curvature-mechanism
            linger: 0.35
      - say: These two training cases sit on opposite sides of zero. Turn up the coefficient. Both
          predictions move closer to their labels, and the loss keeps falling. Every finite coefficient
          leaves room for a larger one to do better. A squared-weight penalty gives that growth a cost. The
          step size and feature scale also matter during fitting. A large step can send the loss back up.
        hold: 0.65
        visual_cues:
          - id: lr-loss-curvature-step-2
            phrase: Turn up the coefficient. Both predictions move closer to their labels, and the loss
              keeps falling
            targets:
              - lr-loss-curvature-mechanism
            linger: 0.35
          - id: lr-no-finite-optimum
            phrase: Every finite coefficient leaves room for a larger one to do better
            targets:
              - lr-loss-curvature-mechanism
            linger: 0.35
  - id: gradient
    title: The chain rule leaves a residual
    visual: Three linked derivative factors appear, their matching terms cancel, and a concrete positive row
      produces three signed coefficient contributions.
    beats:
      - say: Follow the chain rule backward. The loss derivative contains prediction minus label, divided by p times
          one minus p. The sigmoid contributes that same product. Those factors cancel, leaving prediction
          minus label. Each coefficient then receives this residual times its own feature.
        hold: 0.7
        visual_cues:
          - id: gradient-chain
            phrase: The loss derivative contains prediction minus label
            targets:
              - gradient-factors
            linger: 0.6
          - id: gradient-cancel
            phrase: Those factors cancel
            targets:
              - gradient-cancellation
            linger: 0.7
      - say: Work one row. At zero weights, the probability is one half. This row needed review, so its residual is
          minus one half. Multiply by the intercept feature, ambiguity three point five, and support six.
          Subtracting these negative contributions raises the next score for similar cases.
        hold: 0.65
        visual_cues:
          - id: worked-row-gradient
            phrase: Multiply by the intercept feature, ambiguity three point five, and support six
            targets:
              - worked-row-gradient
            linger: 0.7
          - id: lr-gradient-local
            phrase: Subtracting these negative contributions raises the next score for similar cases.
            targets:
              - worked-row-gradient
            linger: 0.35
  - id: batch-gradient
    title: Collect every row before updating
    visual: Eight persistent request rows contribute to three column totals. Only the completed batch produces a
      mean and one coefficient update.
    beats:
      - say: One row gives a direction, but this update uses the whole batch. Every case starts at probability one
          half. Positive labels contribute a negative residual; routine labels contribute a positive one. The
          columns keep the intercept, ambiguity and support contributions separate.
        hold: 0.55
        visual_cues:
          - id: batch-columns
            phrase: The columns keep the intercept, ambiguity and support contributions separate
            targets:
              - batch-ledger
            linger: 0.65
      - say: Bring in all eight contributions, one request at a time. Keep each sign attached to its row while the
          column totals accumulate. Wait for the eighth row. Now divide the totals by eight to get the mean
          gradient.
        hold: 0.7
        visual_cues:
          - id: collect-batch
            phrase: Bring in all eight contributions, one request at a time
            targets:
              - batch-ledger
              - batch-totals
            linger: 0.65
          - id: average-batch
            phrase: Now divide the totals by eight
            targets:
              - batch-mean
            linger: 0.7
        motion_check:
          region:
            - 380
            - 340
            - 1170
            - 450
          minimumChangedFraction: 0.002
      - say: Subtract the mean gradient, scaled by a learning rate of point two. The intercept stays zero, while both
          feature weights rise on this first step. That initial direction reflects the batch averages. Later
          steps can separate the two features' conditional effects.
        hold: 0.65
        visual_cues:
          - id: first-update
            phrase: Subtract the mean gradient
            targets:
              - first-coefficient-update
            linger: 0.7
  - id: data-contract
    title: Keep one label paired with one logit
    visual: Use the actual eight-row design and target vector. Expand a mistaken column-shaped label array to
      expose its eight-by-eight broadcast, then restore rowwise loss and the completed-batch update.
    beats:
      - say: Our trainer uses a design of shape eight by three, weights of length three, and labels and logits both of
          length eight. Importing labels as eight by one can broadcast multiplication against eight logits
          into an eight-by-eight matrix. Its scalar mean can look plausible while pairing every label with
          every request score. Reject the mismatch before fitting.
        hold: 0.65
        visual_cues:
          - id: lr-data-contract-step-0
            phrase: Our trainer uses a design of shape eight by three, weights of length three, and labels and logits both
              of length eight. Importing labels as eight by one can broadcast multiplication against eight
              logits into an eight-by-eight matrix. Its scalar mean can look plausible while pairing every
              label with every request score. Reject the mismatch before fitting.
            targets:
              - lr-data-contract-mechanism
            linger: 0.35
          - id: lr-shape-broadcast
            phrase: Importing labels as eight by one can broadcast multiplication against eight logits into an
              eight-by-eight matrix.
            targets:
              - lr-data-contract-mechanism
            linger: 0.35
          - id: lr-shape-reject
            phrase: Reject the mismatch before fitting.
            targets:
              - lr-data-contract-mechanism
            linger: 0.35
      - say: The actual helper also rejects empty designs, nonfinite features and labels outside zero and one. Convert
          a known single target column deliberately; do not flatten an unexplained multi-target table. The
          first full-batch update raises both feature weights because both features have larger averages among
          positive rows. The eventual negative support coefficient concerns the conditional fit, rather than
          that first marginal direction.
        hold: 0.65
        visual_cues:
          - id: lr-data-contract-step-1
            phrase: The actual helper also rejects empty designs, nonfinite features and labels outside zero and one.
              Convert a known single target column deliberately; do not flatten an unexplained multi-target
              table. The first full-batch update raises both feature weights because both features have larger
              averages among positive rows. The eventual negative support coefficient concerns the conditional
              fit, rather than that first marginal direction.
            targets:
              - lr-data-contract-mechanism
            linger: 0.35
          - id: lr-sign-conditional
            phrase: The eventual negative support coefficient concerns the conditional fit, rather than that first
              marginal direction.
            targets:
              - lr-data-contract-mechanism
            linger: 0.35
      - say: Each printed loss is evaluated after the same update as its printed weights. Keep that boundary explicit
          when comparing trainers. Match the design, loss reduction, penalty, intercept handling and stopping
          rule. A row gradient, a batch mean and an already-updated coefficient vector are different states,
          even when they come from the same eight requests.
        hold: 0.65
        visual_cues:
          - id: lr-data-contract-step-2
            phrase: Each printed loss is evaluated after the same update as its printed weights. Keep that boundary
              explicit when comparing trainers. Match the design, loss reduction, penalty, intercept handling
              and stopping rule. A row gradient, a batch mean and an already-updated coefficient vector are
              different states, even when they come from the same eight requests.
            targets:
              - lr-data-contract-mechanism
            linger: 0.35
          - id: lr-snapshot-boundary
            phrase: Each printed loss is evaluated after the same update as its printed weights.
            targets:
              - lr-data-contract-mechanism
            linger: 0.35
  - id: learning
    title: Fit a compromise among the observed cases
    visual: The same eight training points remain as gradient descent rotates the boundary. Loss and coefficient
      values derive from the exact same iteration.
    beats:
      - say: Repeat the prediction, residual, average and update. Watch the boundary turn while training loss falls.
          The ambiguity coefficient settles positive and policy support settles negative. Both rose initially,
          yet their fitted roles differ once the model accounts for the features together.
        hold: 0.7
        visual_cues:
          - id: fit-boundary
            phrase: Watch the boundary turn while training loss falls
            targets:
              - training-loss
            linger: 0.7
          - id: lr-learning-trajectory
            phrase: Repeat the prediction, residual, average and update. Watch the boundary turn while training loss
              falls. The ambiguity coefficient settles positive and policy support settles negative. Both rose
              initially, yet their fitted roles differ once the model accounts for the features together.
            targets:
              - training-loss
            linger: 0.35
      - say: This required-review case still lies on the automatic side. A straight line cannot carve out every
          isolated exception. Check labels and missing features before reaching for a more flexible model. The
          training table explains how we fitted; new cases must test how the fit travels.
        hold: 0.65
        visual_cues:
          - id: training-exception
            phrase: still lies on the automatic side
            targets:
              - training-exception
