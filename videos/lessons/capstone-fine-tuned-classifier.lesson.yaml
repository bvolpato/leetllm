            phrase: "One of its two tickets needed a person"
            targets:
              - reliability
            color: cyan
            linger: 0.45
      - say: Fit a positive temperature on separate held-out development logits by minimizing their negative log
          likelihood, then evaluate the transformed scores and pinned threshold together on untouched
          evidence. Dividing logits by a positive temperature preserves their ordering in exact arithmetic. A
          route using a non-halfway cutoff can nevertheless change, as our supplied temperature-two example
          already showed. For a binary review score p, the logit difference is the natural logarithm of the
          ratio p over the quantity one minus p. Divide that difference by the positive temperature, then
          compute one divided by one plus the exponential of its negative.
