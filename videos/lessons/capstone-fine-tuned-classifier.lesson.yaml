            targets: [score-rows]
            linger: 0.4
          - id: selection-low
            phrase: "At point three five"
            targets: [score-rows]
            linger: 0.4
      - say: "Raise the cutoff to one half. The freeze request drops out. The guide question stays in review because its score still clears the line. Raise the cutoff again to point seven five. Now the takeover case drops out too, along with the guide question. We saved a routine review at the cost of a second missed escalation."
        hold: 1.15
        caption_starts: ["The freeze request drops out.","The guide question stays in review","Now the takeover case drops out too"]
        visual_cues:
          - id: selection-middle
            phrase: "Raise the cutoff to one half"
            targets: [score-rows]
            linger: 0.4
          - id: selection-high
            phrase: "Raise the cutoff again to point seven five"
            targets: [score-rows]
            caption_boundary: true
            linger: 0.4
      - say: "Look back across all three cutoffs. If we must catch every required case here and can afford one extra review, which cutoff would you take to an independent gate?"
        hold: 2.7
      - say: "Take point three five. It’s the only candidate shown that meets both limits. Freeze that choice with the model. Choosing a cutoff used these six labels, so we need different tickets to evaluate it."
        hold: 1.1
        visual_cues:
          - id: selection-choose
            phrase: "Take point three five"
            targets: [sweep-history]
            linger: 0.4
      - say: "What if we knew the chance that a ticket really needs a person? Here’s a separate cost calculation. Suppose a needless review costs two units, a missed escalation costs six, and a correct decision costs zero. Call the calibrated chance of escalation p. Reviewing costs two times the chance the ticket is routine. Passing it to the agent costs six times the chance it’s urgent."
        hold: 1
        visual_cues:
          - id: cost-review
            phrase: "Reviewing costs two times the chance the ticket is routine"
            targets: [loss-plot]
            linger: 0.4
          - id: cost-agent
            phrase: "Passing it to the agent costs six times the chance it’s urgent"
            targets: [loss-plot]
            caption_boundary: true
            linger: 0.4
      - say: "Find where the lines meet. Two times one minus p equals six times p. That gives p equal to one quarter. In general, divide the cost of an extra review by the sum of the two mistake costs. Try a ticket with a thirty percent chance. Which lane costs less on average?"
        hold: 2.8
        visual_cues:
          - id: cost-tie
            phrase: "p equal to one quarter"
            targets: [loss-plot]
            caption_boundary: true
            linger: 0.4
          - id: cost-ticket
            phrase: "a thirty percent chance"
            targets: [cost-ticket]
            linger: 0.4
      - say: "Choose human review. Its expected cost is one point four units, against one point eight for the guarded agent. That calculation assumes constant costs and calibrated probabilities. Our six selection scores came with labels and a queue limit. We chose their cutoff by counting the actual routing errors on those examples."
        hold: 1.1
        caption_starts: ["Its expected cost is one point four units"]
        visual_cues:
          - id: cost-answer
            phrase: "one point eight for the guarded agent"
            targets: [cost-ticket]
            caption_boundary: true
            linger: 0.4
