version: 1
id: capstone-fine-tuned-classifier
title: Train and Test an Access Ticket Classifier
source: foundations/capstone-fine-tuned-classifier/content.md
sources:
  - title: "Guo et al.: calibration of modern neural networks"
    url: https://arxiv.org/abs/1706.04599
  - title: "Devlin et al.: BERT"
    url: https://arxiv.org/abs/1810.04805
  - title: Hugging Face Transformers5.17 DistilBERT classification implementation
    url: https://raw.githubusercontent.com/huggingface/transformers/v5.17.0/src/transformers/models/distilbert/modeling_distilbert.py
  - title: Pinned DistilBERT base configuration
    url: https://huggingface.co/distilbert/distilbert-base-uncased/blob/12040accade4e8a0f71eabdb258fecc2e7e948be/config.json
  - title: Transformers5.17 Trainer
    url: https://huggingface.co/docs/transformers/v5.17.0/en/main_classes/trainer
  - title: Scikit-learn threshold tuning
    url: https://scikit-learn.org/stable/modules/classification_threshold.html
  - title: DeBERTaV3
    url: https://arxiv.org/abs/2111.09543
scenes:
  - id: intro
    title: "At the access desk"
    visual: "Two key-stamped tickets slide into view together. The guide request and the freeze request stay readable while the viewer chooses. Each drops into its tray after its route is spoken."
    beats:
      - say: "“I’m asking again. Where’s the key rotation guide?” The other writer asks, “Could you restore my key during the freeze?” Which ticket needs a person first?"
        hold: 3.2
        caption_starts: ["The other writer asks", "Which ticket needs a person first?"]
        visual_cues:
          - id: intro-a
            phrase: "Where’s the key rotation guide"
            targets: [ticket-a]
            linger: 0.4
          - id: intro-b
            phrase: "Could you restore my key during the freeze"
            targets: [ticket-b]
            linger: 0.4
      - say: "Send the freeze request to a person. Restoring the key during a freeze would take an exception. The other writer sounds frustrated and wants a document. Send that question to the guarded agent."
        hold: 1.2
        caption_starts: ["The other writer sounds frustrated"]
        visual_cues:
          - id: intro-human
            phrase: "Send the freeze request to a person"
            targets: [ticket-b]
            linger: 0.4
          - id: intro-guard
            phrase: "Send that question to the guarded agent"
            targets: [ticket-a]
            caption_boundary: true
            linger: 0.4
      - say: "The tickets are in their queues. We approved zero access changes. The classifier picks who sees a request first. When we test it, we’ll count missed exceptions and extra tickets in the human queue."
        hold: 1.2
        visual_cues:
          - id: intro-approval
            phrase: "We approved zero access changes"
            targets: [approval-record]
            caption_boundary: true
            linger: 0.4
  - id: labels
    title: "What should the classifier learn from these tickets?"
    visual: "Two reviewers independently mark both tickets. Their marks line up on the freeze exception and diverge on the guide. Support operations resolves that disagreement and retains the guide version."
    beats:
      - say: "Give the same two tickets to two reviewers. Each works alone with the same label guide. A one means someone must review the ticket now. A zero sends it to the guarded agent. In this example, the reviewers agree on the freeze request. Look at their marks on the guide question. How many tickets got the same label from both people?"
        hold: 2.8
        visual_cues:
          - id: labels-first
            phrase: "Each works alone"
            targets: [review-pair]
            linger: 0.4
          - id: labels-second
            phrase: "the reviewers agree on the freeze request"
            targets: [review-pair]
            linger: 0.4
          - id: labels-compare
            phrase: "Look at their marks"
            targets: [review-pair]
            linger: 0.4
      - say: "One of the two tickets got matching labels. Keep both original marks. For the guide question, ask support operations what in the request would require an exception. The writer wants a document. The reviewed label is zero. Save the reason and the label guide version so future reviewers can apply the same distinction."
        hold: 1
        visual_cues:
          - id: labels-agree
            phrase: "One of the two tickets got matching labels"
            targets: [review-pair]
            linger: 0.4
          - id: labels-resolve
            phrase: "The reviewed label is zero"
            targets: [review-pair]
            caption_boundary: true
            linger: 0.4
      - say: "Use those same labels and ticket texts for every candidate. Next, decide which accounts to keep for evaluation. An earlier message from the same account could give a model a preview of the incident, even if the wording changed."
        hold: 0.8
  - id: group-time-manifest
    title: Keep an account’s history on one side of the boundary
    visual: The actual eight-row manifest moves Acme/North to early training and Summit/Harbor to later holdouts.
      A separate account crossing the date boundary is quarantined before its earlier row enters training.
    beats:
      - say: The article’s eight-row manifest gives four training tickets to Acme and North in months one and two.
          Summit’s two validation tickets arrive in month three, and Harbor’s two test tickets in month four.
          Account sets are disjoint, ticket IDs are unique, and the latest training month precedes the
          earliest validation month. The same check separates validation from test.
        hold: 0.7
        visual_cues:
          - id: manifest-groups
            phrase: Account sets are disjoint
            targets:
              - account-manifest
            linger: 0.4
      - say: "Now construct a failure: account Delta has one January ticket and one April ticket, and April is
          reserved for later unseen accounts. A date-only split would place Delta on both sides. Reserve the
          evaluation account as a group and exclude its earlier ticket from training. Group isolation and
          chronological order enforce different conditions; neither automatically supplies the other."
        hold: 0.7
        visual_cues:
          - id: manifest-delta
            phrase: account Delta has one January ticket and one April ticket
            targets:
              - account-manifest
            linger: 0.4
          - id: manifest-quarantine
            phrase: exclude its earlier ticket from training
            targets:
              - account-manifest
            linger: 0.4
      - say: "Freeze the normalized text, account identity, timestamps and label version for every candidate. Use development data for features and checkpoints. Choose the threshold on a separate selection set, then open the untouched gate. Check for copied messages and shared incidents across accounts. Also check when the labels became available and which future accounts these tickets represent."
        hold: 0.7
        visual_cues:
          - id: manifest-freeze
            phrase: Freeze the normalized text
            targets:
              - account-manifest
            linger: 0.4
  - id: baseline-contract
    title: "A phrase rule reads two freeze requests"
    visual: "The literal phrase sits above two excerpts from the held-out tickets. Inserting was separates the same two words. The fitted baseline then scores both requests beside the two routine controls."
    beats:
      - say: "Start with a cheap rule. It looks for the exact phrase key disabled, along with two other phrases. Take the first freeze ticket. Its words key and disabled touch. On the next freeze ticket there’s one extra word between them. Will that ticket reach a person under this rule?"
        hold: 2.8
        visual_cues:
          - id: baseline-phrase
            phrase: "one extra word between them"
            targets: [phrase-match]
            linger: 0.4
      - say: "The rule misses the second freeze ticket. The word was breaks the exact match. Across all four examples it catches one of the two requests that needed a person. Try fitting a model before moving to a larger encoder."
        hold: 1
        visual_cues:
          - id: baseline-rule-result
            phrase: "The rule misses the second freeze ticket"
            targets: [phrase-match]
            linger: 0.4
      - say: "Fit a logistic regression on word and two-word TF-IDF features from six training tickets. Learn the vocabulary and the word weights from training only. Then predict on the same four held-out strings. Both freeze requests reach review. Both routine requests go to the agent. The held-out wording closely resembles training, so this checks the implementation."
        hold: 1
        visual_cues:
          - id: baseline-fit
            phrase: "six training tickets"
            targets: [baseline-table]
            linger: 0.4
          - id: baseline-fitted-result
            phrase: "Both routine requests go to the agent"
            targets: [baseline-table]
            caption_boundary: true
            linger: 0.4
      - say: "Keep this baseline. A pair of words can carry some order. A contextual encoder can use more of the sentence. Test both on negated requests, later accounts and the same label guide. Measure their latency, cost and review load. Sending every ticket to a person would catch all the exceptions while saving the team no work."
        hold: 1
  - id: representation
    title: Follow text into a decision score
    visual: Two token vectors pool into one representation before a linear head produces two logits and class scores.
    beats:
      - say: A text classifier converts tokens into vectors, combines their information and produces class logits. Our
          miniature averages supplied token vectors so we can inspect the head arithmetic. The two logits
          become normalized scores through softmax, and a later policy chooses the intake lane.
        hold: 0.75
        visual_cues:
          - id: representation-b1-1
            phrase: tokens into vectors
            targets:
              - token-vectors
            linger: 0.45
          - id: representation-b1-2
            phrase: averages supplied token vectors
            targets:
              - pooled-vector
            linger: 0.45
          - id: representation-b1-3
            phrase: head arithmetic
            targets:
              - head-logits
            linger: 0.45
          - id: representation-b1-4
            phrase: normalized scores through softmax
            targets:
              - softmax-probabilities
            linger: 0.45
      - say: "Averaging loses word order: swapping these tokens leaves the pooled representation unchanged. Contextual
          encoders can represent broader relationships, but their advantage still needs measurement on the
          same task. Keep a fitted word-feature baseline in the comparison before assuming a pretrained model
          is the winner."
        hold: 0.85
        visual_cues:
          - id: representation-b2-1
            phrase: swapping these tokens
            targets:
              - token-vectors
            linger: 0.45
          - id: representation-b2-2
            phrase: pooled representation unchanged
            targets:
              - pooled-vector
            linger: 0.45
          - id: representation-b2-3
            phrase: advantage still needs measurement
            targets:
              - head-weights
            linger: 0.45
  - id: stable-positive-score
    title: Normalize the logits and retain the positive-class index
    visual: Subtract the maximum from actual logits before exponentiation. A score of the winning routine class
      remains distinct from the class-one review score.
    beats:
      - say: The linear head computes one logit per class by multiplying each weight row by the pooled vector, summing
          its feature contributions and adding that class’s bias. Class zero means guarded agent and class one
          means immediate human review. For stable softmax, subtract the largest logit from every logit,
          exponentiate each shifted value, then divide each by their sum. The shift preserves the normalized
          result in exact arithmetic while avoiding large positive exponentials.
        hold: 0.7
        visual_cues:
          - id: score-shift
            phrase: subtract the largest logit from every logit
            targets:
              - stable-score
            linger: 0.4
          - id: score-normalize
            phrase: divide each by their sum
            targets:
              - stable-score
            linger: 0.4
      - say: For the article’s supplied logits minus one and two, the human-review score is about point nine five.
          Logits one and minus one give about point one two. On each ticket, the two class scores sum to one.
          Calling them probabilities requires held-out calibration evidence. The winning score can belong
          to the routine class. Read column one to get the score for human review.
        hold: 0.7
        visual_cues:
          - id: score-first
            phrase: point nine five
            targets:
              - stable-score
            linger: 0.4
          - id: score-second
            phrase: Logits one and minus one give about point one two
            targets:
              - stable-score
            linger: 0.4
      - say: Return to our two words, key and disabled. Their pooled vector is one, one and their logits are
          two, one. The review score is about point two six nine. Reversing the words keeps that mean fixed.
          The router will apply its cutoff to the same review column in either order.
        hold: 0.7
        visual_cues:
          - id: score-miniature
            phrase: point two six nine
            targets:
              - stable-score
            linger: 0.4
  - id: learning
    title: Let the reviewed label shape the score
    visual: The example updates the two logits directly. The review score and loss follow from the same logits.
    beats:
      - say: The model initially favors the routine class for this urgent ticket. A small score for the reviewed
          class gives a large cross-entropy loss. Try updating the two logits directly. For each one, subtract
          the target indicator from its softmax score, then subtract the learning rate times that difference
          from the logit. Watch the urgent score climb as the loss falls. Next we’ll trace that same error
          into the parameters that produced the logits.
        hold: 0.75
        visual_cues:
          - id: learning-b1-1
            phrase: initially favors the routine class
            targets:
              - class-probabilities
            linger: 0.45
          - id: learning-b1-2
            phrase: large cross-entropy loss
            targets:
              - correct-class-loss
            linger: 0.45
          - id: learning-b1-3
            phrase: Watch the urgent score climb as the loss falls
            targets:
              - head-gradient
            linger: 0.45
      - say: In a full encoder training loop, gradients can also update the representation. A pretrained candidate
          starts with learned features and adapts them to the label guide. Saving its weights still requires
          the tokenizer, architecture and label mapping so a reload computes the same task.
        hold: 0.85
        visual_cues:
          - id: learning-b2-1
            phrase: gradients can also update
            targets:
              - current-logits
            linger: 0.45
          - id: learning-b2-2
            phrase: tokenizer, architecture and label mapping
            targets:
              - class-probabilities
            linger: 0.45
  - id: embedding-backward
    title: "Which token vectors move on one training step?"
    visual: "The head sends the reviewed ticket’s error back into its pooled vector. Two live tokens split that gradient. Identical head updates then produce different review scores depending on whether the embeddings move."
    beats:
      - say: "Rewind the two-word example to its original weights. The target is human review. The logits are two and one, so the model gives the correct class about point two six nine. Taking minus the natural log of that score gives a loss of about one point three one three. Subtract the target from the two scores. To find what reaches the pooled vector, multiply that pair by the transpose of the original head weights."
        hold: 0.95
        visual_cues:
          - id: gradient-logits
            phrase: "Subtract the target from the two scores"
            targets: [backward-work]
            linger: 0.4
          - id: gradient-pool
            phrase: "the transpose of the original head weights"
            targets: [backward-work]
            linger: 0.4
      - say: "Only the first coordinate of the pooled vector gets a gradient here. The second coordinate feeds both logits with the same weight, so those two contributions cancel. The pool averaged two live words. How much of the pooled gradient reaches each word?"
        hold: 2.4
        visual_cues:
          - id: gradient-ask
            phrase: "averaged two live words"
            targets: [backward-work]
            linger: 0.4
      - say: "Each gets half. Padding and the unused word get zero. Now take one step at a learning rate of point one. Subtract the scaled gradient from each live vector. Key’s first coordinate slips just below two. The first coordinate of disabled slips just below zero. Their second coordinates stay put."
        hold: 1.15
        visual_cues:
          - id: gradient-split
            phrase: "Each gets half"
            targets: [backward-work]
            linger: 0.4
          - id: gradient-update
            phrase: "Subtract the scaled gradient from each live vector"
            targets: [backward-work]
            caption_boundary: true
            linger: 0.4
      - say: "Compare two runs from the same starting point. Give both the same updated head and bias. Freeze the token vectors in the first run. Its pooled vector stays at one, one, and the new review score is about point three six three. Let the word vectors move in the other run. The shift in their mean raises its score a little further, to about point three seven zero. Next we’ll train eight-dimensional vectors on six whole tickets."
        hold: 1.15
        visual_cues:
          - id: gradient-frozen
            phrase: "point three six three"
            targets: [branch-scores]
            caption_boundary: true
            linger: 0.4
          - id: gradient-trained
            phrase: "point three seven zero"
            targets: [branch-scores]
            caption_boundary: true
            linger: 0.4
  - id: tiny-training-run
    title: Execute the complete small training path
    visual: Actual six-row token IDs and padding mask feed an eight-dimensional mean, 2-by-8 head and
      cross-entropy. The fitted state is restored and scores are compared.
    beats:
      - say: Now use the actual article program. Seed seven initializes a vocabulary with padding and unknown IDs,
          eight-dimensional word embeddings, and a two-output linear head. The final training row, show access
          policy, has three live tokens and padding to the batch width. Multiply by the nonpadding mask, sum
          the live vectors and divide by their live count. Padding must not dilute the mean.
        hold: 0.7
        visual_cues:
          - id: tiny-input
            phrase: three live tokens and padding
            targets:
              - tiny-training
            linger: 0.4
          - id: tiny-mean
            phrase: divide by their live count
            targets:
              - tiny-training
            linger: 0.4
      - say: The program uses cross-entropy on unnormalized logits and Adam at learning rate point zero five for
          eighty updates. Each update clears gradients, runs backward and changes parameters. Embedding rows
          used by this training batch can receive signal; absent vocabulary rows have no path through it, and
          the designated padding row stays fixed. The actual run decreases loss and changes the head,
          producing a six-by-two logit array.
        hold: 0.7
        visual_cues:
          - id: tiny-update
            phrase: eighty updates
            targets:
              - tiny-training
            linger: 0.4
          - id: tiny-shape
            phrase: six-by-two logit array
            targets:
              - tiny-training
            linger: 0.4
      - say: "The tiny encoder catches both urgent tickets and sends both routine tickets to the agent. All four use wording close to the training examples. Reloading the saved weights with the same vocabulary and architecture reproduces the logits in this CPU run. Swapping token order still gives the same scores. Later we’ll try both fitted models on six different tickets."
        hold: 0.7
        visual_cues:
          - id: tiny-restore
            phrase: reproduces the logits in this CPU run
            targets:
              - tiny-training
            linger: 0.4
          - id: tiny-order
            phrase: Swapping token order still gives the same scores
            targets:
              - tiny-training
            linger: 0.4
  - id: pretrained-encoder
    title: Replace the representation while keeping the task
    visual: The pinned six-layer DistilBERT encoder exposes its first-token dense/ReLU/dropout/classifier head. A
      separate causal last-token view retains full admitted input visibility.
    beats:
      - say: "Now start with an encoder that already knows relationships between words. This DistilBERT checkpoint has six transformer layers and supports five hundred twelve positions. Its classification head selects the first token’s contextual vector, passes it through a dense layer, ReLU and dropout, then produces the two class logits."
        hold: 0.7
        visual_cues:
          - id: pretrained-layers
            phrase: six transformer layers
            targets:
              - pretrained-architecture
            linger: 0.4
          - id: pretrained-head
            phrase: selects the first token’s contextual vector
            targets:
              - pretrained-architecture
            linger: 0.4
      - say: "In DistilBERT, a word can draw on words before and after it. A causal decoder’s final input token can also see the preceding ticket and summarize it for classification. Full encoder fine-tuning permits gradients to change the pretrained representation. Freeze the encoder and only the head learns, just as in our two-word example."
        hold: 0.7
        visual_cues:
          - id: pretrained-causal
            phrase: final input token can also see the preceding ticket
            targets:
              - pretrained-architecture
            linger: 0.4
          - id: pretrained-trainable
            phrase: Full encoder fine-tuning permits gradients
            targets:
              - pretrained-architecture
            linger: 0.4
      - say: "DeBERTa version three is another candidate. It uses disentangled attention, replaced-token detection and gradient-disentangled embedding sharing in pretraining. For this project we’ll use the DistilBERT recipe. To compare it with the two models we trained on the CPU, fit it on reviewed tickets and score it on the same gate."
        hold: 0.7
        visual_cues:
          - id: pretrained-other
            phrase: replaced-token detection
            targets:
              - pretrained-architecture
            linger: 0.4
  - id: training-inputs
    title: Reject data coercion and lost evidence before training
    visual: Typed JSONL labels and IDs are checked before dataset-library conversion. An actual policy boundary
      keeps a late exception suffix outside the admitted 256-token window.
    beats:
      - say: "Read the original JSON lines before loading them into a training library. Each ticket needs text, a unique trimmed ID and an integer label of zero or one. Reject a Boolean such as true before the library turns it into a one. Check for repeated IDs and for repeated text after normalizing case and spaces. Both training and checkpoint development need examples of both classes. Check account separation and dates in the split manifest."
        hold: 0.7
        visual_cues:
          - id: input-bool
            phrase: Reject a Boolean such as true
            targets:
              - training-admission
            linger: 0.4
          - id: input-duplicates
            phrase: Repeated IDs
            targets:
              - training-admission
            linger: 0.4
      - say: Count the entire stripped ticket with the pinned tokenizer and without truncation. This serving policy
          permits at most two hundred fifty-six tokens including special tokens, even though the model
          configuration allows more positions. Padding is dynamic after input admission. Silently cutting a
          long ticket can remove its incident-freeze exception; changing which end is cut can remove different
          evidence.
        hold: 0.7
        visual_cues:
          - id: input-full-count
            phrase: without truncation
            targets:
              - training-admission
            linger: 0.4
          - id: input-boundary
            phrase: two hundred fifty-six tokens including special tokens
            targets:
              - training-admission
            linger: 0.4
      - say: "Training tickets supply gradient updates. Development tickets select the checkpoint. Set aside separate tickets for threshold selection and the final gate. The recipe sets the seed before creating the new head. Save the tokenizer, label mapping and length rule with the weights so the scorer reads tickets the same way."
        hold: 0.7
        visual_cues:
          - id: input-roles
            phrase: "Set aside separate tickets for threshold selection and the final gate"
            targets:
              - training-admission
            linger: 0.4
  - id: checkpoint-export
    title: A selected checkpoint still needs a routing policy
    visual: Three hypothetical checkpoint losses select the minimum, while threshold and final gate remain locked
      outside the training process. The actual recipe’s export fields assemble around that selected state.
    beats:
      - say: "Start with three epochs, batches of sixteen and a learning rate of two times ten to the minus five. Save each epoch and restore the checkpoint with minimum development loss. Record its path. The recall shown during training uses the winning class. The router will apply a cutoff to the human-review score, so we’ll evaluate that decision separately."
        hold: 0.7
        visual_cues:
          - id: checkpoint-minimum
            phrase: minimum development loss
            targets:
              - checkpoint-export
            linger: 0.4
          - id: checkpoint-policy
            phrase: "The router will apply a cutoff"
            targets:
              - checkpoint-export
            linger: 0.4
      - say: Preserve the project lock, Python and resolved package versions. The article’s Trainer recipe is pinned
          to Transformers five point seventeen. A locked run errors if its lock no longer matches the project
          rather than silently resolving new dependencies. A new versioned output directory preserves the old
          experiment; the recipe refuses to reuse an existing run root.
        hold: 0.7
        visual_cues:
          - id: checkpoint-lock
            phrase: lock no longer matches the project
            targets:
              - checkpoint-export
            linger: 0.4
          - id: checkpoint-directory
            phrase: refuses to reuse an existing run root
            targets:
              - checkpoint-export
            linger: 0.4
      - say: "The saved export joins model and tokenizer with the label mapping, length rule, input policy and package versions. Record the base revision, selected checkpoint, seed and development-file hashes. A revision identifies a source snapshot. File digests identify the bytes to reload. Keep the approved manifest and those bytes outside the scorer’s write access. Keep the training and evaluation records with them so you can trace the run."
        hold: 0.7
        visual_cues:
          - id: checkpoint-artifact
            phrase: saved export joins model and tokenizer
            targets:
              - checkpoint-export
            linger: 0.4
          - id: checkpoint-provenance
            phrase: "Keep the training and evaluation records"
            targets:
              - checkpoint-export
            linger: 0.4
  - id: reload-contract
    title: Verify the whole export before selecting score column one
    visual: A complete flat inventory is compared with approved digests, then the exact label mapping is checked.
      Extra files, a symlink and an index flip are separate controlled failures.
    beats:
      - say: The local scorer requires this recipe’s complete flat export, including configuration, safetensors
          weights and tokenizer JSON. It rejects path separators, malformed digests, symbolic links, extra or
          missing files, then compares every retained digest. A sharded model would need a different inventory
          contract. Files must remain fixed through verification and use; sequential hash checks do not stop a
          concurrent writer.
        hold: 0.7
        visual_cues:
          - id: reload-inventory
            phrase: extra or missing files
            targets:
              - export-inventory
            linger: 0.4
          - id: reload-mutable
            phrase: concurrent writer
            targets:
              - export-inventory
            linger: 0.4
      - say: Reload locally and verify two labels with guarded agent at zero and human review at one. Run evaluation
          mode and inference mode, and take the softmax score at column one. If a generic pipeline returns
          point eight eight confidence for routine, the human-review score is point one two in a two-class
          case. Treating the winning confidence as urgent would reverse the policy input.
        hold: 0.7
        visual_cues:
          - id: reload-labels
            phrase: guarded agent at zero and human review at one
            targets:
              - export-inventory
            linger: 0.4
          - id: reload-score
            phrase: point one two
            targets:
              - export-inventory
            linger: 0.4
      - say: The scorer reads evaluator-owned fixture IDs and text, counts full input length, and emits only each ID
          and its score. Separate metadata records the fixture-file digest, manifest digest, input policy and
          scoring-library versions. Editable metadata is not authenticated execution provenance. Replacing
          both an export and its writable manifest can preserve internal consistency while changing the model
          that ran.
        hold: 0.7
        visual_cues:
          - id: reload-meta
            phrase: Editable metadata is not authenticated execution provenance
            targets:
              - export-inventory
            linger: 0.4
  - id: threshold
    title: "Which tickets switch queues?"
    visual: "The freeze and guide tickets keep their scores and reviewed labels on two aligned tracks. A cutoff moves past both tickets. Each queue assignment changes when its dot crosses the cutoff."
    beats:
      - say: "Return to the access desk. Suppose the freeze exception gets a review score of point four two. In this two-ticket example, the angry guide question scores a little higher, at point four four. The reviewed labels are beside the tickets. At a cutoff of one half, both go to the guarded agent. The freeze request was missed."
        hold: 1.1
        visual_cues:
          - id: threshold-read
            phrase: "at point four four"
            targets: [score-rows]
            linger: 0.4
          - id: threshold-first
            phrase: "both go to the guarded agent"
            targets: [score-rows]
            caption_boundary: true
            linger: 0.4
      - say: "A score at or above the cutoff sends a ticket to a person. Suppose we lower the cutoff to point three five. Which tickets would enter review? Would both belong there?"
        hold: 2.8
