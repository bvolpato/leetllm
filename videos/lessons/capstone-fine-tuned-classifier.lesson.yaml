  - id: selection-cost
    title: "Which cutoff can the review queue afford?"
    visual: "Six hand-authored selection scores stay fixed as one cutoff sweeps across them. Counts accumulate beside the changed destinations. A separate expected-loss graph uses mistake costs of two and six to find a break-even probability."
    beats:
      - say: "Now open the six-ticket selection set. These are hand-authored scores. Here the angry guide question scores point seven one. At point three five, all three required cases reach a person, and so does that guide question. That’s one extra review. Keep your eye on those two rows as we try the next cutoff."
