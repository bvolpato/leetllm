      - say: "Take sixteen requests with two thousand forty-eight tokens each. With thirty-two key-value heads the cache needs about seventeen point two decimal gigabytes. With eight it needs about four point three. Llama three eight-B has thirty-two query heads sharing eight key-value heads. Serving the thirty-two-key-value-head design would require a different checkpoint."
