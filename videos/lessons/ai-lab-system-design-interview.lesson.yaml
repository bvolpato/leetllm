  - id: memory-realization
    title: An allocation estimate leaves work and ownership to explain
    visual: Weights retain one fixed size while independent histories grow. Page rounding, shared prefixes,
      sliding eviction and layer/rank ownership change physical cache storage. An explicitly unfilled
      workspace reserve prevents an estimated fit from becoming a fabricated throughput result.
    beats:
      - say: "Watch the weight bar as four requests arrive. All four share the same sixteen gigabytes of two-byte weights in this replica. Their histories grow separately. Leave room for activations, workspace and whole cache blocks. With quantized weights, count scales, metadata and any tensors kept at higher precision. Measure peak memory and tokens per second while serving that mix."
        hold: 0.7
        visual_cues:
          - id: sd-memory-realization-0-operation
            phrase: "Watch the weight bar as four requests arrive"
            color: cyan
            linger: 0.35
            targets:
              - sd-memory-realization-mechanism
          - id: sd-memory-realization-0-result
            phrase: "Measure peak memory and tokens per second while serving that mix"
            color: yellow
            linger: 0.45
            targets:
              - sd-memory-realization-mechanism
      - say: Our full-history estimate assumes independent attention histories. Shared prefix blocks avoid duplicating
          compatible state. Sliding-window eviction limits retained positions. Compression changes
          representation; cache sharding changes which rank owns bytes. Paged allocation rounds a request up
          to whole blocks. State each condition before comparing a measured allocation with the formula.
        hold: 0.7
        visual_cues:
          - id: sd-memory-realization-1-operation
            phrase: Our full-history estimate assumes independent attention histories. Shared prefix blocks avoid
              duplicating compatible state. Sliding-window eviction limits retained positions. Compression
              changes representation; cache sharding changes which rank owns bytes. Paged allocation rounds a
              request up to whole blocks. State each condition before comparing a measured allocation with the
              formula.
            color: cyan
            linger: 0.35
            targets:
              - sd-memory-realization-mechanism
          - id: sd-memory-realization-1-result
            phrase: State each condition before comparing a measured allocation with the formula.
            color: yellow
            linger: 0.45
            targets:
              - sd-memory-realization-mechanism
      - say: Changing stored key-value heads requires a compatible architecture and checkpoint. Quantization can
          reduce weight bytes, with workload-dependent quality and runtime speed. An eight-bit weight payload
