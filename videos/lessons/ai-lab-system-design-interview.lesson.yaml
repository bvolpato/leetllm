  - id: memory
    title: Weights stay fixed while KV grows with requests
    visual: A memory comparison derives fixed BF16 weights and KV estimates for the same model shape, batch, and
      context, then changes only the number of key/value heads.
    beats:
      - say: A loaded model's weights form a fixed memory cost. During generation, each request keeps key and value
          vectors for its tokens. That cache grows with batch and context. Start with the stated model shape
          on screen before deciding how much room another request needs.
        hold: 0.8
        visual_cues:
          - id: memory-fixed-weights
            phrase: A loaded model's weights form a fixed memory cost
            targets:
              - memory-loaded-bf16-weights
              - memory-fixed-weight-cost
              - memory-weight-bytes
            color: blue
            linger: 0.5
          - id: memory-grow-cache
            phrase: During generation, each request keeps key and value vectors for its tokens
            targets:
              - memory-head-slices
              - memory-cache-shape
              - memory-cache-bytes
            color: pink
            linger: 0.5
      - say: In this fixture, the multi-head cache is slightly larger than the loaded weights. The grouped-query
          architecture uses a quarter as many key and value heads, so its cache is a quarter the size. The
          chart keeps the byte estimates visible. Activations and runtime workspace still need headroom.
        hold: 0.8
        visual_cues:
          - id: memory-mha-comparison
            phrase: the multi-head cache is slightly larger than the loaded weights
            targets:
              - memory-weight-bytes
              - memory-cache-bytes
            color: pink
            linger: 0.5
          - id: memory-quarter-heads
            phrase: The grouped-query architecture uses a quarter as many key and value heads, so its cache is a quarter
