  - id: batch-and-pages
    title: Scheduling and storage repair different failures
    visual: Two unequal-length request histories retain their page maps. One finishes and relinquishes its batch
      slot to a newcomer without moving the other history. Independently, logical cache pages map to reusable
      physical blocks; page reclamation never impersonates a scheduling decision.
    beats:
      - say: A static batch can leave a finished request’s slot idle while a long neighbor continues; naive padding
          adds wasted work. Continuous, iteration-level batching removes completed sequences and adds waiting
          ones between iterations. Similar-length offline batches can still be appropriate. The scheduling
          choice determines when a sequence participates.
