          instead of assuming every lower-bit model is fast or every quantized model is unusable.
        hold: 0.7
        visual_cues:
          - id: sd-memory-realization-2-operation
            phrase: Changing stored key-value heads requires a compatible architecture and checkpoint. Quantization can
              reduce weight bytes, with workload-dependent quality and runtime speed. An eight-bit weight
              payload is roughly half the two-byte payload before overhead. Test quality and the actual kernel
              path instead of assuming every lower-bit model is fast or every quantized model is unusable.
            color: cyan
            linger: 0.35
            targets:
              - sd-memory-realization-mechanism
          - id: sd-memory-realization-2-result
