  - id: cache-bytes
    title: Build one token of cache before multiplying the histories
    visual: One key and one value vector expand into 128 scalar cells at two bytes each; eight heads and
      thirty-two layer slices form a 128 KiB token. Independent histories concatenate; dimensions stay
      attached to the original memory comparison.
    beats:
      - say: "Derive the cache estimate from one token. Each layer stores a key and a value. Multiply those two
          vectors by the number of layers, stored key-value heads, values per head and bytes per value.
          Thirty-two layers, eight key-value heads, width one hundred twenty-eight and two bytes give one
          hundred thirty-one thousand seventy-two bytes per retained token: one hundred twenty-eight
          kibibytes."
        hold: 0.7
        visual_cues:
          - id: sd-cache-bytes-0-operation
            phrase: "Derive the cache estimate from one token. Each layer stores a key and a value. Multiply those two
              vectors by the number of layers, stored key-value heads, values per head and bytes per value.
              Thirty-two layers, eight key-value heads, width one hundred twenty-eight and two bytes give one
              hundred thirty-one thousand seventy-two bytes per retained token: one hundred twenty-eight
              kibibytes."
            color: cyan
            linger: 0.35
            targets:
              - sd-cache-bytes-mechanism
          - id: sd-cache-bytes-0-result
            phrase: "Thirty-two layers, eight key-value heads, width one hundred twenty-eight and two bytes give one
              hundred thirty-one thousand seventy-two bytes per retained token: one hundred twenty-eight
              kibibytes."
            color: yellow
            linger: 0.45
            targets:
              - sd-cache-bytes-mechanism
      - say: For equal histories, multiply that per-token storage by request count and retained sequence length. For
          unequal histories, multiply by the sum of their lengths instead. Include retained generated tokens
          as well as prompt tokens. Decimal gigabytes divide bytes by a billion; gibibytes divide by two to
