          answers who supplied the key. Authorization answers which model and data that caller may use. Quota
          reservation checks the tenant's budget before shared capacity becomes relevant.
        hold: 0.75
        motion_check:
          region:
            - 110
            - 390
            - 1700
            - 105
          minimumChangedFraction: 0.002
        visual_cues:
          - id: contract-request-id
            phrase: Start with a server-generated request ID
            targets:
