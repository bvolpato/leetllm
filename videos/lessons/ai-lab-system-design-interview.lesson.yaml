scenes:
  - id: opening
    title: "Can a worker start this request in time?"
    visual: "A request to summarize notes slides up to five blocks of prompt work. The same blocks stretch onto the queue clock after the viewer chooses a response. The receipt records the wait and the decision."
    beats:
      - say: "“Summarize my notes.” This employee has access and quota. A worker needs to pick up the request within a quarter of a second. Look at the work ahead of it."
        caption_starts: ["This employee has access and quota"]
        hold: 0.65
        visual_cues:
          - id: opening-budget
            phrase: "pick up the request within a quarter of a second"
            targets: [opening-clock]
            color: cyan
            linger: 0.35
      - say: "Five blocks, ten thousand tokens each. The worker clears a hundred and twenty-five thousand tokens a second. Queue it, refuse for quota, or refuse for overload?"
        hold: 2.5
        visual_cues:
          - id: opening-blocks
            phrase: "Five blocks, ten thousand tokens each"
            targets: [opening-work]
            color: cyan
            linger: 0.35
          - id: opening-choice
            phrase: "Queue it, refuse for quota, or refuse for overload"
            targets: [opening-receipt]
            color: cyan
            linger: 0.35
      - say: "Lay the five blocks on the clock. Eighty milliseconds per block. Four hundred milliseconds for all five. That's past the limit. Five oh three for shared overload. Put the wait and the limit on the receipt so support can explain the decision."
        caption_starts: ["Eighty milliseconds per block"]
        hold: 1.25
        visual_cues:
          - id: opening-unfold
            phrase: "Lay the five blocks on the clock"
            targets: [opening-work, opening-clock]
            color: cyan
            linger: 0.35
          - id: opening-block-time
            phrase: "Eighty milliseconds per block"
            targets: [opening-work]
            color: cyan
            linger: 0.35
          - id: opening-wait
            phrase: "Four hundred milliseconds for all five"
            targets: [opening-clock]
            caption_boundary: true
            color: yellow
            linger: 0.35
          - id: opening-status
            phrase: "Five oh three for shared overload"
            targets: [opening-receipt]
            caption_boundary: true
            color: yellow
            linger: 0.35
  - id: admission
    title: "When does R-104 stop waiting?"
    visual: "In one serial queue A and B consume work ahead of R-104. A clock records wait and service separately. The same 250 ms mark tests the opening backlog and an independent caller-limit case."
    beats:
      - say: "Try a lighter queue at the same rate. A has ten thousand tokens left in the worker. B has ten thousand ahead of us in line. That's eighty milliseconds apiece. R one oh four can join behind B. Its own five thousand tokens will take time once it starts. Which event should stop its queue clock?"
        hold: 2
        visual_cues:
          - id: admission-ahead
            phrase: "A has ten thousand tokens left in the worker. B has ten thousand ahead of us in line"
            targets: [admission-queue]
            color: cyan
            linger: 0.35
          - id: admission-join
            phrase: "R one oh four can join behind B"
            targets: [admission-queue]
            color: cyan
            linger: 0.35
          - id: admission-question
            phrase: "Which event should stop its queue clock"
            targets: [admission-clock]
            color: cyan
            linger: 0.35
      - say: "Start the clock. A finishes and B takes its place. B finishes and our request takes the worker. Freeze the wait there, at one hundred sixty milliseconds. The worker now holds two cache blocks for this request. Let its five thousand tokens run. At two hundred milliseconds the response is complete. The worker and both blocks are free again."
        hold: 1.15
        visual_cues:
          - id: admission-drain-a
            phrase: "A finishes and B takes its place"
            targets: [admission-queue]
            color: cyan
            linger: 0.35
          - id: admission-drain-b
            phrase: "B finishes and our request takes the worker"
            targets: [admission-queue]
            color: cyan
            linger: 0.35
          - id: admission-wait-stops
            phrase: "Freeze the wait there, at one hundred sixty milliseconds"
            targets: [admission-clock]
            color: cyan
            linger: 0.35
          - id: admission-drain-own
            phrase: "Let its five thousand tokens run. At two hundred milliseconds the response is complete"
            targets: [admission-clock]
            color: cyan
            linger: 0.35
          - id: admission-free
            phrase: "The worker and both blocks are free again"
            targets: [admission-cache]
            color: cyan
            linger: 0.35
      - say: "Put the opening request on that same clock. Only the backlog changes, from twenty thousand tokens to fifty thousand. Its wait reaches four hundred milliseconds. That crosses the queue limit before this caller gets any service. The gateway refuses it and keeps the estimate on the receipt."
        hold: 1
        visual_cues:
          - id: admission-compare
            phrase: "Only the backlog changes, from twenty thousand tokens to fifty thousand"
            targets: [admission-clock]
            color: cyan
            linger: 0.35
          - id: admission-second-wait
            phrase: "Its wait reaches four hundred milliseconds"
            targets: [admission-clock]
            caption_boundary: true
            color: yellow
            linger: 0.35
          - id: admission-verdict
            phrase: "The gateway refuses it"
            targets: [admission-outcome]
            caption_boundary: true
            color: yellow
            linger: 0.35
      - say: "Now take a different team that has used up its quota. Even with an idle worker, its request gets a four twenty-nine. The quota check stops it before it reaches the queue. For the opening team, support sees five oh three and the work ahead. The same client action, asking for an answer, reached two different owners."
        hold: 1.15
        visual_cues:
          - id: admission-quota-response
            phrase: "its request gets a four twenty-nine"
            targets: [admission-caller]
            caption_boundary: true
            color: yellow
            linger: 0.35
          - id: admission-capacity-response
            phrase: "support sees five oh three and the work ahead"
            targets: [admission-outcome]
            color: cyan
            linger: 0.35
  - id: requirements-control
    title: "Which queue does your team own?"
    visual: "A hosted request initially ends at a provider. When the interviewer asks for self-hosting, a local worker and its queue appear. A versioned policy then supplies the entitlement for the serving decision."
    beats:
      - say: "Step back to the interview board. Who waits for an answer, and who runs the model? If a provider runs it, ask for the provider's quota and latency. Now the interviewer asks you to run it yourself. The queue and worker we just sized belong inside your service. Ask whether users stream answers and whether spend is a hard stop. Each answer changes what you have to enforce."
        hold: 0.8
        visual_cues:
          - id: sd-requirements-control-0-operation
            phrase: "ask for the provider's quota and latency"
            targets: [sd-requirements-control-mechanism]
            color: cyan
            linger: 0.35
          - id: requirements-host
            phrase: "Now the interviewer asks you to run it yourself"
            targets: [sd-requirements-control-mechanism]
            color: cyan
            linger: 0.35
          - id: sd-requirements-control-0-result
            phrase: "Each answer changes what you have to enforce"
            targets: [sd-requirements-control-mechanism]
            color: cyan
            linger: 0.35
      - say: "Follow policy version seven. On the left, an administrator grants access to a model, sets a route and assigns a quota bucket. That's the control plane. On the right, the gateway reads those records for this request, checks the key, reserves budget and attempts admission. That's the data plane. If the required policy is unavailable, keep the beta model and private data closed."
        hold: 0.7
        visual_cues:
          - id: sd-requirements-control-1-operation
            phrase: "an administrator grants access to a model, sets a route and assigns a quota bucket"
            targets: [sd-requirements-control-mechanism]
            color: cyan
            linger: 0.35
          - id: requirements-policy-missing
            phrase: "If the required policy is unavailable"
            targets: [sd-requirements-control-mechanism]
            color: yellow
            linger: 0.35
          - id: sd-requirements-control-1-result
            phrase: "keep the beta model and private data closed"
            targets: [sd-requirements-control-mechanism]
            color: cyan
            linger: 0.35
      - say: "Three follow-ups change this drawing. The employee wants an answer from a company document. Now we need a versioned index and permission checks. The employee wants a change to a repository. Give that work a durable task and a sandbox. A new candidate might answer differently. Give rollout an evaluation gate. If source updates can repeat, give ingestion a retry queue and a deduplication key. For support and abuse controls, name what you'd record and which action you could stop."
        hold: 0.7
        visual_cues:
          - id: sd-requirements-control-2-operation
            phrase: "The employee wants an answer from a company document. Now we need a versioned index and permission checks. The employee wants a change to a repository. Give that work a durable task and a sandbox. A new candidate might answer differently. Give rollout an evaluation gate"
            targets: [sd-requirements-control-mechanism]
            color: cyan
            linger: 0.35
          - id: sd-requirements-control-2-result
            phrase: "name what you'd record and which action you could stop"
            targets: [sd-requirements-control-mechanism]
            color: cyan
            linger: 0.35
  - id: contract
    title: Give every request a decision owner and receipt
    visual: Request R-104 passes authentication, authorization, quota reservation, shared-capacity admission, and
