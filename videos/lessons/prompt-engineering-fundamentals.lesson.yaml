scenes:
  - id: opening
    title: When is the first page due?
    visual: A runbook page says 30 minutes. A chat bubble cites the same line and says 90.
      Both deadlines sit on the same ruler. Measure the gap after the viewer predicts it.
    beats:
      - say: The runbook gives us thirty minutes to page the on-call engineer.
          The assistant cites that very line and gives us ninety minutes.
        caption_starts:
          - The assistant cites that very line
        hold: 0.8
        visual_cues:
          - id: open-runbook
            phrase: thirty minutes
            targets:
              - runbook-line
            color: green
            linger: 0.35
          - id: opening-reply
            phrase: ninety minutes
            targets:
              - assistant-line
            color: blue
            linger: 0.35
      - say: Start the clock when the incident is declared P1. If we follow the assistant's
          advice and page at minute ninety, how late are we?
        hold: 3
      - say: Sixty minutes late. Start by opening the prompt, the instructions and facts the model
          received. Did it get the runbook line? If the line is missing, add it. If it's there,
          try this wording. Give the deadline in minutes since P1 declaration.
        caption_starts:
          - Give the deadline in minutes since P1 declaration
        hold: 1.1
        visual_cues:
          - id: deadline-distance-reveal
            phrase: Sixty minutes late
            targets:
              - deadline-distance
            color: yellow
            linger: 0.35
          - id: opening-reference
            phrase: Give the deadline in minutes since P1 declaration
            targets: [prompt-wording]
            color: cyan
            linger: 0.35
  - id: conditional-context
    title: What is the probability of this two-token reply?
    visual: Shade six tenths of a rectangle, then four tenths of that region. Hold the area for a
      prediction. A separate pass processes a selected token while the learned weights stay fixed.
    beats:
      - say: This rectangle holds all the possible continuations. Suppose our first token gets six
          tenths of the area. Given that first token, the next one gets four tenths of the blue
          region. What fraction of the whole rectangle belongs to the pair?
        caption_starts:
          - Given that first token
          - What fraction of the whole rectangle
        hold: 2.4
        visual_cues:
          - id: pf-conditional-context-b0
            phrase: our first token gets six tenths of the area
            targets:
              - pf-conditional-context-mechanism
            color: cyan
            linger: 0.35
          - id: conditional-second-token
            phrase: four tenths of the blue region
            targets: [pf-conditional-context-mechanism]
            color: green
            linger: 0.35
      - say: Multiply the two shares. Twenty-four hundredths is the probability of getting both
          tokens in that order.
          For each token, use its probability given the prompt and the tokens already chosen.
        caption_starts:
          - Twenty-four hundredths
        hold: 1
        visual_cues:
          - id: conditional-product
            phrase: twenty-four hundredths
            targets: [pf-conditional-context-mechanism]
            color: green
            linger: 0.35
      - say: Give the model a different prompt and it can assign different probabilities to those same tokens.
          That's in-context learning. When a Transformer processes a selected token on the next forward
          pass, it can cache its keys and values for later attention. The prompt changes what the
          model can attend to. Its learned weights stay fixed.
        hold: 1
        visual_cues:
          - id: pf-conditional-context-b1
            phrase: When a Transformer processes a selected token on the next forward pass
            targets:
              - pf-conditional-context-mechanism
            color: cyan
            linger: 0.35
      - say: Luna is building this on-call assistant. Keep the current rule, time since P1 declaration,
          and page status in its prompt. Long incident logs can crowd the rule out of the model's
          finite context window. Check which facts reached the model, then compare its reply with the rule.
        hold: 0.8
        visual_cues:
          - id: pf-conditional-context-b2
            phrase: time since P1 declaration, and page status
            targets:
              - pf-conditional-context-mechanism
            color: cyan
            linger: 0.35
  - id: policy-baseline
    title: Work out the decision before writing the prompt
    visual: >
      A clock advances across the 30-minute deadline. Current elapsed time, remaining time and
      overdue status derive from the same clock state.
    beats:
      - say: >
          The fictional rule requires a first page within thirty minutes of a P1 declaration.
          Twelve minutes have passed since this P1 was declared, and nobody has paged. That leaves
          eighteen minutes.
        hold: 0.8
        visual_cues:
          - id: remaining-page-time-b1-1
            phrase: eighteen minutes
            targets:
              - remaining-page-time
            color: blue
            linger: 0.6
      - say: >
          Watch the clock approach the boundary. Overdue means elapsed time is strictly greater than
          thirty. Exactly thirty is still on the boundary; the next minute is overdue. The remaining
          time stops at zero.
        hold: 0.9
        motion_check:
          region:
            - 220
            - 400
            - 1460
            - 470
          minimumChangedFraction: 0.002
        visual_cues:
          - id: clock-to-limit
            phrase: Watch the clock approach the boundary
            targets: [incident-clock]
            color: blue
            linger: 0.35
          - id: page-overdue-state-b2-1
            phrase: next minute is overdue
            targets:
              - page-overdue-state
            color: pink
            linger: 0.6
      - say: >
          A missing rule or unknown page status needs review. Writing down these branches first
          gives us a reference answer, a fallback, and useful examples before we ask the model
          anything.
        hold: 0.9
        visual_cues:
          - id: page-deadline-b3-1
            phrase: reference answer
            targets:
              - page-deadline
            color: yellow
            linger: 0.6
          - id: pf-missing-policy
            phrase: A missing rule or unknown page status needs review
            targets:
              - page-deadline
            color: cyan
            linger: 0.35
  - id: role-serialization
    title: Who put this line in the request?
    visual: One structured user message is shown in two model-specific chat templates. The application
      supplies the role. A benign archived note stays inside the user message. Incident age and time
      since P1 declaration appear separately.
    beats:
      - say: The application sends an incident as a user message. Here are two ways to turn that message into
          input tokens. Mistral's template wraps it in instruction markers. Zephyr's uses a user marker
          and a turn ending. Both start from the same message. Use the selected model's chat template,
          or send the structured message through its API.
        hold: 0.9
        visual_cues:
          - id: pf-role-serialization-b0
            phrase: two ways to turn that message into input tokens
            targets:
              - pf-role-serialization-mechanism
            color: cyan
            linger: 0.35
      - say: Luna puts the task in the application's instruction message. In an interface that supports the
          OpenAI developer role, those instructions have priority over the user's. An archived note may
          contain the word system. Its role still comes from the application. Serialize or escape the
          note's content so its punctuation stays inside the quoted data.
        hold: 0.9
        visual_cues:
          - id: pf-role-serialization-b1
            phrase: the word system
            targets:
              - pf-role-serialization-mechanism
            color: cyan
            linger: 0.35
      - say: This ticket has been open for three hundred and thirty minutes. Look at the other clock. The P1
          declaration was only twelve minutes ago. That is the clock IR-7 uses. Luna fetches the rule
          from approved storage and the page status from current incident state. A role label by itself
          can't tell her who supplied a fact.
        hold: 1
        visual_cues:
          - id: pf-role-serialization-b2
            phrase: P1 declaration was only twelve minutes ago
            targets:
              - pf-role-serialization-mechanism
            color: cyan
            linger: 0.35
  - id: prompt-assembly
    title: Assemble the complete prompt
    visual: >
      Four concrete sections accumulate in one persistent editor: task, authenticated facts, a
      boundary demonstration and an exact output contract. A section index tracks the currently
      inserted block.
    beats:
      - say: >
          Start with the task: recommend the first page for this incident. Use the supported
          instruction role for that request and its response rules. Supply the runbook and current
          incident as clearly separated input facts.
        hold: 0.9
        motion_check:
          region:
            - 180
            - 360
            - 1450
            - 560
          minimumChangedFraction: 0.002
        visual_cues:
          - id: assembled-section-0-b1-1
            phrase: task
            targets:
              - prompt-task-body
            color: blue
            linger: 0.6
          - id: assembly-facts
            phrase: Supply the runbook and current incident
            targets: [prompt-facts-body]
            color: cyan
            linger: 0.35
      - say: >
          Now add one boundary example. At thirty-one minutes, an unpaged P1 is overdue, while the
          deadline remains thirty minutes from declaration. A demonstration shows how the fields
          relate to each other.
        hold: 0.9
        visual_cues:
          - id: assembled-section-2-b2-1
            phrase: boundary example
            targets:
              - prompt-example-body
            color: yellow
            linger: 0.6
      - say: >
          Finish with the contract: action, deadline in minutes, overdue, and source line IDs.
          Include the missing-facts fallback. The complete prompt stays visible so we can inspect
          the actual instructions together.
        hold: 1.1
        visual_cues:
          - id: assembled-section-3-b3-1
            phrase: contract
            targets:
              - prompt-contract-body
            color: green
            linger: 0.6
  - id: demonstration-boundaries
    title: Which ticket belongs with the documentation writers?
    visual: Three tickets share vocabulary but describe different causes. Label each at the diagnosis,
      then permute the intact pairs and keep the final ticket outside development.
    beats:
      - say: Luna also routes support tickets. A bug goes to the developers, misleading instructions go to the
          writers, and a new capability goes to feature planning. Defining the routes without a labeled
          example is called zero-shot prompting. Look at the three tickets. Which one belongs with the
          documentation writers?
        hold: 2.8
        visual_cues:
          - id: pf-demonstration-boundaries-b0
            phrase: three tickets
            targets:
              - pf-demonstration-boundaries-mechanism
            color: cyan
            linger: 0.35
      - say: The first one goes to docs. The program simulates writes exactly as designed. The guide promises
          something else. In the second ticket the guide is right and the program crashes. That's a bug.
          The third asks for a new JSON output flag. That's a feature request. Give the model one
          labeled pair and you have a one-shot prompt. With two or more, it's few-shot.
        caption_starts:
          - In the second ticket
          - That's a bug
          - The third asks
          - That's a feature request
        hold: 1
        visual_cues:
          - id: pf-demonstration-boundaries-b1
            phrase: one labeled pair
            targets:
              - pf-demonstration-boundaries-mechanism
            color: cyan
            linger: 0.35
          - id: ticket-docs
            phrase: first one goes to docs
            targets:
              - pf-demonstration-boundaries-mechanism
            color: green
            linger: 0.35
          - id: ticket-bug
            phrase: That's a bug
            targets:
              - pf-demonstration-boundaries-mechanism
            color: green
            linger: 0.35
          - id: ticket-feature
            phrase: That's a feature request
            targets:
              - pf-demonstration-boundaries-mechanism
            color: green
            linger: 0.35
      - say: Keep the labels attached as you move the examples. Does the model favor the last label it saw?
          Zhao and colleagues found effects from order and label frequency. Start with balanced examples
          and test several orders on the same cases. Min and colleagues found that format and the
          available labels mattered in their studied tasks, sometimes even with randomized pairings.
          Keep the pairs correct when teaching your own routing rule.
        hold: 1
        visual_cues:
          - id: pf-demonstration-boundaries-b2
            phrase: Keep the labels attached as you move the examples
            targets:
              - pf-demonstration-boundaries-mechanism
            color: cyan
            linger: 0.35
      - say: Set aside a ticket before choosing the examples. If you see its answer, revise the prompt around
          it, and score that same ticket again, the score measures development work. Keep a separate
          untouched set to measure how the prompt transfers.
        hold: 1
        visual_cues:
          - id: pf-demonstration-boundaries-b3
            phrase: Set aside a ticket
            targets:
              - pf-demonstration-boundaries-mechanism
            color: cyan
            linger: 0.35
  - id: prompt-revision
    title: Where does the deadline start?
    visual: Both intervals end at the IR-7 limit. Focus the edited line in the prompt as the deadline's
      origin moves from minute twelve to declaration. Advance the test clock to thirteen while the
      deadline stays at thirty.
    beats:
      - say: >
          Look closely at the draft's output phrase: deadline in minutes. Minutes from when? A model
          might interpret that field as time remaining or invent a different window. The contract
          needs a named reference point.
        hold: 0.9
        visual_cues:
          - id: revision-draft
            phrase: deadline in minutes
            targets: [revised-reference-phrase]
            color: blue
            linger: 0.35
          - id: revision-left
            phrase: time remaining
            targets: [time-remaining, field-interval]
            color: cyan
            linger: 0.35
      - say: >
          Replace that phrase with deadline minutes since P1 declaration. Keep the task, facts, and
          example unchanged. The highlighted phrase is the only prompt edit, making its intended
          effect easy to test.
        hold: 0.9
        visual_cues:
          - id: revision-wording
            phrase: deadline minutes since P1 declaration
            targets: [revised-reference-phrase]
            color: green
            linger: 0.35
      - say: >
          Our supplied revised reply now contains thirty, with overdue false for the current
          twelve-minute incident. That is the desired behavior. To establish that this wording helps
          a model, run both prompts on the same untouched incidents.
        hold: 1
        visual_cues:
          - id: revision-reply
            phrase: overdue false
            targets: [revised-page-response]
            color: green
            linger: 0.35
          - id: revision-tick
            phrase: run both prompts on the same untouched incidents
            targets: [reading-now, time-remaining]
            color: cyan
            linger: 0.35
  - id: reasoning-work
    title: What does a longer answer buy Luna?
    visual: Seven illustrative output positions accrue one at a time. Cached pairs follow processed
      tokens. The last selected token awaits its next forward pass. A separate experiment varies a
      supported effort setting.
    beats:
      - say: Suppose Luna asks the model to explain its arithmetic. Each extra token costs another generation
          step and gives later tokens a partial result to work from. Even a direct answer can take
          several tokens. Early chain-of-thought experiments showed worked intermediate steps in the
          prompt and improved performance on some reasoning tasks.
        hold: 1
        visual_cues:
          - id: pf-reasoning-work-b0
            phrase: Each extra token costs another generation step and gives later tokens a partial result to work
              from
            targets:
              - pf-reasoning-work-mechanism
            color: cyan
            linger: 0.35
      - say: Look at the last token. The model has selected it. A conventional cached Transformer writes its
          keys and values when it processes that token on the next forward pass. The earlier tokens
          already have theirs. Later tokens can attend to those earlier steps.
        hold: 0.9
        visual_cues:
          - id: pf-reasoning-work-b1
            phrase: keys and values when it processes that token on the next forward pass
            targets:
              - pf-reasoning-work-mechanism
            color: cyan
            linger: 0.35
      - say: Start with the direct request for four fields. A model may spend reasoning effort without showing
          every intermediate step. OpenAI's guidance for its reasoning models favors a direct
          instruction. Asking for a step-by-step explanation can even hurt. Hold the prompt fixed and
          raise the effort setting on the same cases. Measure correct decisions, latency and cost. Test
          a short justification in a separate comparison.
        hold: 1
        visual_cues:
          - id: pf-reasoning-work-b2
            phrase: raise the effort setting
            targets:
              - pf-reasoning-work-mechanism
            color: cyan
            linger: 0.35
  - id: agreement-check
    title: What does the vote measure?
    visual: Five supplied replies move into two piles by normalized deadline. An agreement count follows
      the last ballot. The majority continues into the next scene as a candidate for policy validation.
    beats:
      - say: Here are five supplied replies to the same prompt. Put equivalent answers together first. Ninety
          minutes and an hour and a half should count as the same deadline. Decide beforehand how to
          handle invalid answers and ties. Sampling several reasoning paths and aggregating their final
          answers is called self-consistency.
        hold: 1
        visual_cues:
          - id: pf-agreement-check-b0
            phrase: Put equivalent answers together first
            targets:
              - pf-agreement-check-mechanism
            color: cyan
            linger: 0.35
      - say: Deal the five replies into piles by deadline. Four choose ninety and one chooses thirty. Four out
          of five gives ninety an eighty percent share of this vote. The largest pile is the plurality
          winner. Here it also has a majority because it holds more than half. Several replies can share
          the same mistake. To turn vote shares into estimates of correctness, compare them with labeled
          outcomes on held-out cases. For this incident, check the winning answer against the source.
        caption_starts:
          - Four choose ninety
          - Four out of five gives ninety
        hold: 1
        visual_cues:
          - id: pf-agreement-check-b1
            phrase: For this incident
            targets:
              - pf-agreement-check-mechanism
            color: cyan
            linger: 0.35
          - id: pf-agreement-build
            phrase: Deal the five replies into piles by deadline
            targets:
              - pf-agreement-check-mechanism
            color: cyan
            linger: 0.35
          - id: pf-agreement-result
            phrase: Four out of five gives ninety an eighty percent share of this vote
            targets:
              - pf-agreement-check-mechanism
            color: yellow
            linger: 0.35
  - id: complete-response
    title: Inspect the reply Luna received
    visual: Assemble the 30-minute reply one named field at a time and close the object. Align the four
      fields with the trusted values. Substitute the 90-minute vote winner's deadline and repeat the
      checks on the same incident.
    beats:
      - say: >
          Watch the complete response assemble: a proposed action, the deadline, the overdue flag,
          and IR-7 as its source. A partial object stays incomplete until its closing brace arrives.
        hold: 0.9
        visual_cues:
          - id: incoming-action
            phrase: proposed action
            targets: [response-field-1]
            color: blue
            linger: 0.35
          - id: incoming-deadline
            phrase: deadline
            targets: [response-field-2]
            color: yellow
            linger: 0.35
          - id: incoming-overdue
            phrase: overdue flag
            targets: [response-field-3]
            color: blue
            linger: 0.35
          - id: incoming-source
            phrase: IR-7 as its source
            targets: [response-field-4]
            color: blue
            linger: 0.35
          - id: close-object
            phrase: closing brace arrives
            targets: [object-end]
            color: blue
            linger: 0.35
      - say: >
          First parse the text. Then check the required fields and types. Finally compare every
          decision field with the trusted rule and snapshot. Our complete reply passes all three
          checks and becomes an accepted recommendation.
        hold: 1
        visual_cues:
          - id: parse-object
            phrase: First parse the text
            targets: [json-check]
            color: cyan
            linger: 0.35
          - id: check-types
            phrase: required fields and types
            targets: [type-check]
            color: cyan
            linger: 0.35
          - id: align-fields
            phrase: compare every decision field with the trusted rule and snapshot
            targets: [reference-fields]
            color: cyan
            linger: 0.35
          - id: accept-reference
            phrase: passes all three checks
            targets: [policy-check]
            color: green
            linger: 0.35
      - say: >
          Now change just the deadline to ninety. Parsing still passes, and an integer still
          satisfies this schema. The policy comparison catches the contradiction. A source ID
          becomes useful evidence when the answer agrees with its source.
        hold: 1
        visual_cues:
          - id: change-deadline
            phrase: change just the deadline to ninety
            targets: [response-field-2]
            color: yellow
            linger: 0.35
          - id: reparse-object
            phrase: Parsing still passes
            targets: [json-check]
            color: cyan
            linger: 0.35
          - id: recheck-types
            phrase: an integer still satisfies this schema
            targets: [type-check]
            color: cyan
            linger: 0.35
          - id: compare-deadline
            phrase: The policy comparison catches the contradiction
            caption_boundary: true
            targets: [response-field-2, reference-deadline]
            color: pink
            linger: 0.35
  - id: grammar-mask
    title: What can a grammar enforce?
    visual: Align original logits and probabilities with the mass that survives the parser's mask. The
      object-start row leaves only a brace. At a second position two legal tokens divide the mass. A
      closing token pops two nested structures.
    beats:
      - say: Ask for a JSON object with one integer field, the deadline in minutes. A plain prompt can get a sentence
          back. JSON mode enforces syntax on a completed response. The word “soon” in quotes is a
          valid JSON string. A strict schema can require an integer. Ninety fits that field.
          Compare it with the runbook. IR-7 says thirty. Route refusals and unfinished responses to review.
        caption_starts:
          - JSON mode enforces syntax
          - A strict schema can require an integer
          - IR-7 says thirty
        hold: 1
        visual_cues:
          - id: grammar-json-mode
            phrase: JSON mode enforces syntax
            targets: [json-mode-example]
            color: cyan
            linger: 0.35
          - id: pf-grammar-mask-b0
            phrase: A strict schema can require an integer
            targets: [schema-example]
            color: green
            linger: 0.35
          - id: grammar-rule-check
            phrase: IR-7 says thirty
            targets: [schema-example, runbook-deadline]
            color: yellow
            linger: 0.35
          - id: grammar-incomplete
            phrase: Route refusals and unfinished responses to review
            targets: [response-status]
            color: yellow
            linger: 0.35
      - say: Start a JSON object using this four-character vocabulary. Before the mask, even a bracket has a
          chance. Keep the opening brace and rule out the other three. The decoder sets their logits to
          negative infinity, so they get zero mass. Divide by the surviving mass and the brace gets
          probability one. Stop right there and the parser still has an unfinished object.
        caption_starts:
          - Keep the opening brace
          - the brace gets probability one
        hold: 1
        visual_cues:
          - id: pf-grammar-mask-b1
            phrase: Start a JSON object
            targets:
              - pf-grammar-mask-mechanism
            color: cyan
            linger: 0.35
          - id: object-mask
            phrase: Keep the opening brace and rule out the other three
            targets:
              - pf-grammar-mask-mechanism
            color: pink
            linger: 0.35
          - id: object-normalize
            phrase: the brace gets probability one
            targets:
              - pf-grammar-mask-mechanism
            color: green
            linger: 0.35
      - say: Try another position. X has the largest logit, but only A and B are legal. Mask X. Subtract the
          largest legal logit, one, from each legal score. Exponentiate. That gives A one unit of mass
          and B about point three six eight. Divide each by their sum. A gets about point seven three
          one, B about point two six nine. X gets zero. This calculation needs at least one finite legal
          logit.
        caption_starts:
          - A gets about point seven three one
        hold: 1.2
        visual_cues:
          - id: pf-grammar-mask-b2
            phrase: Try another position
            targets:
              - pf-grammar-mask-mechanism
            color: cyan
            linger: 0.35
          - id: two-mask
            phrase: Mask X
            targets:
              - pf-grammar-mask-mechanism
            color: pink
            linger: 0.35
          - id: pf-mask-result
            phrase: A gets about point seven three one, B about point two six nine
            targets:
              - pf-grammar-mask-mechanism
            color: green
            linger: 0.35
      - say: One vocabulary token can contain several characters, or part of a sequence of bytes. Check its
          whole decoded continuation. Here the closing token finishes the array first, then the object
          around it. A nesting stack remembers which one closes next. A finite-state machine works for
          regular constraints. To handle arbitrary nesting, the parser can push each opening delimiter
          onto a stack and pop it when the matching closer arrives.
        hold: 1
        visual_cues:
          - id: pf-grammar-mask-b3
            phrase: Here the closing token finishes the array first, then the object around it
            targets:
              - pf-grammar-mask-mechanism
            color: cyan
            linger: 0.35
  - id: strict-validator
    title: Run the validator at the deadline
    visual: Inspect duplicate keys, actual Python types and the required fallback. Run the same supplied
      JSON against elapsed times 30 and 31. Only the clock changes between the two calls.
    beats:
      - say: Look at the deadline key. It appears twice, even with the same number. Python's usual JSON
          decoding keeps the last value. The article's validator inspects the key-value pairs first and
          rejects every duplicate. It also rejects nonstandard constants such as NaN. Those checks
          preserve what the sender actually supplied.
        hold: 0.9
        visual_cues:
          - id: pf-strict-validator-b0
            phrase: It appears twice
            targets:
              - pf-strict-validator-mechanism
            color: cyan
            linger: 0.35
      - say: Now suppose the deadline is the Boolean true. In Python, true compares equal to one. Test the
          actual type before treating that value as an integer. A deadline must be a nonnegative integer
          or null. An overdue flag must be a Boolean or null. Require exactly the four fields, a
          permitted action and a list of string source IDs. A page recommendation must cite the
          applicable line.
        hold: 1
        visual_cues:
          - id: pf-strict-validator-b1
            phrase: Boolean true
            targets:
              - pf-strict-validator-mechanism
            color: cyan
            linger: 0.35
      - say: Start with an unpaged P1, a valid elapsed time and the applicable rule. Compare elapsed time with
          the limit using strictly greater than. Take away the rule. Now the correct response is needs
          review, two nulls and no sources. The same fallback applies if severity is outside this
          contract, elapsed time is invalid, or page status is unknown or already true. A fallback on a
          fully known, unpaged P1 would be a wrong decision.
        hold: 1
        visual_cues:
          - id: pf-strict-validator-b2
            phrase: Start with an unpaged P1
            targets:
              - pf-strict-validator-mechanism
            color: cyan
            linger: 0.35
          - id: pf-validator-missing
            phrase: Take away the rule
            targets:
              - pf-strict-validator-mechanism
            color: pink
            linger: 0.35
      - say: Keep this reply fixed. It recommends a first page under IR-7 and says overdue is false. Run the
          article's Python validator at exactly thirty minutes. It accepts the reply. Now call it with
          thirty-one. Will that same false flag pass?
        hold: 2.6
        visual_cues:
          - id: pf-strict-validator-b3
            phrase: exactly thirty minutes
            targets:
              - pf-strict-validator-mechanism
            color: cyan
            linger: 0.35
          - id: strict-second-call
            phrase: call it with thirty-one
            targets:
              - pf-strict-validator-mechanism
            color: cyan
            linger: 0.35
      - say: The second call reports a contradiction. At thirty-one minutes the flag has to be true. Correct
          it and check the whole response again. These two calls test a decision boundary in code. The
          article's eighteen cases also exercise malformed replies, wrong types and missing evidence. A
          model's reliability needs an evaluation on its own generated replies.
        hold: 1
        visual_cues:
          - id: pf-strict-validator-b4
            phrase: Correct it and check the whole response again
            targets:
              - pf-strict-validator-mechanism
            color: cyan
            linger: 0.35
          - id: strict-second-result
            phrase: second call reports a contradiction
            targets:
              - pf-strict-validator-mechanism
            color: pink
            linger: 0.35
  - id: input-boundary
    title: Which source owns the deadline?
    visual: A benign archived exercise note and the authenticated runbook both mention a deadline. The
      validator traces a proposed 90 back to the current runbook and an independent check rejects it.
    beats:
      - say: The archived exercise note mentions ninety minutes. Someone pasted it into today's ticket. Keep
          the note with the user data. It's evidence about the previous exercise.
        hold: 1
        visual_cues:
          - id: untrusted-incident-note-b1-1
            phrase: archived exercise note
            targets:
              - untrusted-incident-note
            color: blue
            linger: 0.35
      - say: For today's decision, fetch the current rule. Follow that line down to the check. If a reply
          borrows ninety from the note, the number fails against IR-7 even though the type is correct.
        hold: 1
        visual_cues:
          - id: trusted-incident-policy-b2-1
            phrase: fetch the current rule
            targets:
              - trusted-incident-policy
            color: green
            linger: 0.35
      - say: Reject that deadline. An ordinary stale note can lead to a wrong answer. In an indirect prompt
          injection, retrieved text deliberately tries to steer the model. Keeping notes in their own
          role helps identify them. Recomputing the decision from trusted facts lets the application
          enforce the boundary.
        hold: 1
        visual_cues:
          - id: page-policy-verdict-b3-1
            phrase: Reject that deadline
            targets:
              - page-policy-verdict
            color: pink
            linger: 0.35
  - id: execution-boundary
    title: Who can send the first page?
    visual: A well-typed review fallback is checked against known facts. The accepted recommendation
      crosses to a separate consumer. Another worker pages first and the no-page claim fails.
    beats:
      - say: This reply asks for review. All the facts for this P1 are present. Accepting the fallback
          would leave an unpaged incident waiting. Check the decision against the rule. For a separate
          privacy check, put a harmless test marker in the input and look for that exact text in the reply.
        hold: 1
        visual_cues:
          - id: pf-execution-boundary-b0
            phrase: All the facts for this P1 are present
            targets:
              - pf-execution-boundary-mechanism
            color: cyan
            linger: 0.35
      - say: Give the model no paging credentials. A separate service checks permission and the current rule.
          Imagine another worker sends the page after Luna checks the snapshot. The original
          recommendation still describes that snapshot. To prevent a duplicate, the service must couple
          its fresh check to an atomic claim or an idempotent send. Two workers could both pass a
          separate read.
        hold: 1.2
        visual_cues:
          - id: pf-execution-boundary-b1
            phrase: Imagine another worker sends the page after Luna checks the snapshot. The original
              recommendation still describes that snapshot. To prevent a duplicate, the service must
              couple its fresh check to an atomic claim or an idempotent send
            targets:
              - pf-execution-boundary-mechanism
            color: cyan
            linger: 0.35
      - say: The first page is already recorded. The second worker loses the claim and stops there.
          Give the dispatcher the incident ID, rule version and validation result so it can check
          the recommendation against live state.
        hold: 1
        visual_cues:
          - id: pf-execution-boundary-b2
            phrase: first page is already recorded
            targets:
              - pf-execution-boundary-mechanism
            color: cyan
            linger: 0.35
  - id: regression-evaluation
    title: Compare revisions case by case
    visual: >
      Six paired supplied evaluation outcomes reveal one row at a time. Prefix totals count only
      inspected rows, while the final fixed and regressed cases remain highlighted.
    beats:
      - say: >
          A clearer sentence should improve the target case while preserving other useful behavior.
          Keep the model, sampling settings, tools and incident set fixed when comparing prompt
          revisions.
        hold: 0.9
        visual_cues:
          - id: prompt-evaluation-header-b1-1
            phrase: incident set fixed
            targets:
              - prompt-evaluation-header
            color: blue
            linger: 0.6
      - say: >
          Walk through these supplied evaluation outcomes. Both revisions finish with four passing
          cases out of six. The paired rows reveal what the totals hide: a prior-page case improves
          while an overdue case regresses.
        hold: 0.9
        motion_check:
          region:
            - 220
            - 370
            - 1440
            - 560
          minimumChangedFraction: 0.002
        visual_cues:
          - id: inspect-case-pairs
            phrase: Walk through these supplied evaluation outcomes
            targets: [paired-prompt-totals]
            color: cyan
            linger: 0.35
          - id: paired-prompt-totals-b2-1
            phrase: four passing cases out of six
            targets:
              - paired-prompt-totals
            color: yellow
            linger: 0.6
          - id: fixed-pair
            phrase: prior-page case improves
            targets: [prompt-case-prior-page]
            color: green
            linger: 0.35
          - id: lost-pair
            phrase: overdue case regresses
            targets: [prompt-case-overdue]
            color: pink
            linger: 0.35
      - say: >
          Inspect those disagreements before choosing a revision, and reserve a final set for an
          untouched evaluation. Track format failures, wrong decisions and missing-facts behavior
          separately so the next edit addresses a specific problem.
        hold: 1
        visual_cues:
          - id: prompt-case-overdue-b3-1
            phrase: disagreements
            targets:
              - prompt-case-overdue
            color: pink
            linger: 0.6
  - id: paired-fields
    title: Which decision changed?
    visual: The original six case IDs stay paired. Opening prior-page exposes old page_on_call versus
      repaired needs_review/null; opening overdue exposes new false versus required true. Each exact
      field is linked back to its current input rather than adding another aggregate card.
    beats:
      - say: Someone already sent the first page. The old prompt recommended another one. The
          revision sends that case for review. Now look at the unpaged incident at minute
          thirty-one. The revision says overdue is false. That gives us one field to work on
          in the next prompt.
        caption_starts:
          - Now look at the unpaged incident
        hold: 0.8
        visual_cues:
          - id: pf-paired-fields-b0
            phrase: Now look at the unpaged incident
            targets: [overdue-comparison]
            color: cyan
            linger: 0.35
      - say: Try three versions on development incidents. Give just the instructions, add a boundary
          example, or ask for a short explanation. Use the same model, settings, tools and runbook
          for each. Repeat the comparison if the answers vary. Keep related tickets together when
          you set aside incidents for the final test.
        hold: 0.8
        visual_cues:
          - id: pf-paired-fields-b1
            phrase: Keep related tickets together
            targets:
              - pf-paired-fields-mechanism
            color: cyan
            linger: 0.35
  - id: guarded-recommendation
    title: What should Luna test next?
    visual: The regressed minute-31 development case stays on screen. Add minute 30 beside it. Compute
      both expected flags and leave the next prompt's results unfilled until it is measured.
    beats:
      - say: Look at the overdue case that the revision lost. At minute thirty-one it said false.
          What's the last minute when false would have been correct?
        hold: 2.4
        visual_cues:
          - id: inspect-late-case
            phrase: minute thirty-one it said false
            targets:
              - late-row
            color: pink
            linger: 0.35
      - say: Try minute thirty. Exactly at the limit, overdue is false. One minute later it's true.
          Give the prompt those two examples side by side.
        hold: 1
        visual_cues:
          - id: inspect-limit-case
            phrase: Try minute thirty
            targets:
              - exact-limit-row
            color: cyan
            linger: 0.35
      - say: Use separate development cases to compare that version with the one-example prompt. Keep the
          settings fixed and record the full decisions. Only after choosing a version should you open
          the final set. Let's give Luna one incident from another team.
        hold: 1
        visual_cues:
          - id: measure-revision
            phrase: record the full decisions
            targets:
              - unmeasured-replies
            color: yellow
            linger: 0.35
  - id: fresh-boundary
    title: Luna's next incident
    visual: Keep one unpaged P1 fixed at minute 37. Compare the four recommended fields under IR-7,
      with the rule missing, and when the other team's IR-9 arrives. Each result and its explanation
      appear together after the spoken answer.
    beats:
      - say: Luna helps another team test a paging recommendation. Thirty-seven minutes have passed since
          P1 declaration, and nobody has paged. First, try the incident under Luna's familiar rule,
          IR-7. It allows thirty minutes. What action, deadline, overdue flag and source should she hand back?
        hold: 3.2
        visual_cues:
          - id: read-new-clock
            phrase: Thirty-seven minutes have passed
            targets: [incident-reading]
            color: cyan
            linger: 0.35
          - id: read-new-rule
            phrase: It allows thirty minutes
            targets: [current-rule]
            color: green
            linger: 0.35
      - say: Recommend paging now. Thirty-seven is past thirty. The deadline is thirty, overdue is true,
          and the source is IR-7.
        hold: 1.2
        visual_cues:
          - id: pf-fresh-present
            phrase: The deadline is thirty, overdue is true, and the source is IR-7
            caption_boundary: true
            targets: [new-recommendation]
            color: cyan
            linger: 0.35
      - say: Keep this incident and the page status. This time the lookup returns no applicable rule. What can
          Luna recommend on the evidence she has now?
        hold: 3
        visual_cues:
          - id: pf-fresh-remove
            phrase: the lookup returns no applicable rule
            targets: [current-rule]
            color: yellow
            linger: 0.35
      - say: Send the case for review. Leave the deadline and overdue flag null, with an empty list of
          sources. Luna asks the team's runbook service for the missing line.
        hold: 1.4
        visual_cues:
          - id: pf-fresh-fallback
            phrase: Leave the deadline and overdue flag null, with an empty list of sources
            caption_boundary: true
            targets: [new-recommendation]
            color: yellow
            linger: 0.35
      - say: The other team's service returns IR-9. It allows forty-five minutes from P1 declaration.
          The snapshot still shows minute thirty-seven and no page. What should Luna put in the four fields now?
        hold: 3.2
        visual_cues:
          - id: restore-rule
            phrase: returns IR-9
            targets: [current-rule]
            color: green
            linger: 0.35
          - id: read-team-limit
            phrase: It allows forty-five minutes from P1 declaration
            caption_boundary: true
            targets: [current-rule]
            color: green
            linger: 0.35
      - say: Recommend paging now. Cite IR-9 and enter forty-five for the deadline. At minute
          thirty-seven, eight minutes remain, so overdue is false. Give that recommendation to the
          engineer. Before sending, the authorized dispatcher checks whether anyone has paged since
          this snapshot.
        caption_starts:
          - Cite IR-9
          - eight minutes remain
          - so overdue is false
        hold: 1.5
        visual_cues:
          - id: check-restored-rule
            phrase: At minute thirty-seven, eight minutes remain, so overdue is false
            caption_boundary: true
            targets: [new-recommendation]
            color: cyan
            linger: 0.35
