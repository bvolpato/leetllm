    visual: Expand the original four physical slots into immutable IDs, hash map, request tables and an intrusive
      free queue. Touch a zero-reference cached slot and physically remove it from the queue before allocating
      another head.
    beats:
      - say: The pool preconstructs block objects. A block retains its physical ID, reference count, optional
          full-block hash and links in a doubly linked free queue. Request tables name their current blocks; a
          separate hash map finds reusable cached content. A zero reference count can coexist with a cached
          hash because finished content may still be useful before overwrite.
        hold: 0.65
