            phrase: "Read the CLI and API server, then the engine core, scheduler, KV manager, block pool and the runner actually selected by gpu-worker. The pinned scheduler assigns token counts; the KV manager finds computed blocks and reserves slots; the pool controls references and free capacity. Follow the same request ID through these files instead of treating every low token rate as an attention-kernel problem."
            targets:
              - vllm-source-diagnosis-mechanism
            color: cyan
            linger: 0.2
      - say: >-
          With rising inter-token latency, a quiet GPU and increasing recompute preemptions, first inspect KV
          usage and free blocks. Then inspect token and sequence caps and prompt lengths, engine-core CPU and
          scheduling latency, and tensor or pipeline communication. The hit rate tells you how often cached
          prefixes were reused. The free-block count tells you how much room was left.
