scenes:
  - id: intro
    title: "Can the next word run?"
    visual: "Follow the fifth word of R1’s prompt to the open place in a six-input GPU step. Keep the four proposed prompt inputs aligned with the words in one KV block. Give R1 a second block and admit the fifth word."
    beats:
      - say: >-
          Can the word “on” take that last place? The GPU can process six inputs together. R0 needs one to
          keep its answer streaming. Its cache has room. R1 brings nine uncached tokens. The first four
          words fit beside R0. Each needs a cell in R1’s only block for its keys and values. Where would
          “on” go?
        hold: 2.8
        visual_cues:
          - id: intro-word
            phrase: "Can the word “on” take that last place"
            targets: [intro-prompt, intro-step]
            color: yellow
          - id: intro-whole-step
            phrase: "The GPU can process six inputs together"
            targets: [intro-step]
            color: blue
          - id: intro-reserve
            phrase: "R0 needs one to keep its answer streaming"
            targets: [intro-step]
            color: blue
          - id: intro-storage
            phrase: "Each needs a cell in R1’s only block"
            targets: [intro-storage]
            color: cyan
        caption_starts: ["The GPU can process six inputs together", "R0 needs one", "R1 brings nine uncached tokens", "Each needs a cell in R1’s only block", "Where would “on” go"]
      - say: >-
          The block is full. Leave “on” in the prompt. Four of R1’s words can run with R0, and five wait.
          That last GPU place stays empty.
        hold: 1.4
        visual_cues:
          - id: intro-wait
            phrase: "The block is full"
            targets: [intro-storage, intro-step, intro-decision]
            color: yellow
        caption_starts: ["Four of R1’s words can run"]
      - say: >-
          Give R1 a second block. Now “on” fits. Its keys and values have a place in the new block, and it
          can take the sixth place in the step. The engine sends the worker one decode input for R0 and five
          prompt inputs for R1. The API front end streams each reply to its reader.
        hold: 0.8
        visual_cues:
          - id: intro-second-block
            phrase: "Give R1 a second block"
            targets: [intro-storage]
            color: cyan
          - id: intro-fifth
            phrase: "Now “on” fits"
            targets: [intro-prompt, intro-step, intro-storage]
            color: pink
        caption_starts: ["Now “on” fits", "The engine sends the worker"]
  - id: entry-contract
    title: Choose the entry path and preserve the version
    visual: Keep the same R0/R1 request records. One caller uses offline LLM.generate; another uses HTTP through
      vllm serve. Reveal the pinned source tag and separate route/task capabilities.
    beats:
      - say: >-
          Call LLM.generate from Python and the caller waits for its results. The engine and workers can run
          in separate processes while it waits. With the online server, the client sends an HTTP request and
          can receive each token as it arrives. The model and its runner determine which tasks the service
          can handle, such as generation, pooling or reranking.
        hold: 0.65
        visual_cues:
          - id: vv-entry-contract-op-0
            phrase: "Call LLM.generate from Python and the caller waits for its results. The engine and workers can run in separate processes while it waits. With the online server, the client sends an HTTP request and can receive each token as it arrives. The model and its runner determine which tasks the service can handle, such as generation, pooling or reranking."
            targets:
              - vllm-entry-contract-mechanism
            color: cyan
            linger: 0.2
      - say: >-
          The request trace follows vLLM zero point twenty-eight. The block calculations run on a CPU and
          describe a decoder with full attention. The trace keeps the KV cache on the GPU and uses ordinary
          decoding. Later we’ll compare how this release and zero point thirty-one identify the same adapter.
        hold: 0.65
        visual_cues:
          - id: vv-entry-contract-op-1
            phrase: "The request trace follows vLLM zero point twenty-eight. The block calculations run on a CPU and describe a decoder with full attention. The trace keeps the KV cache on the GPU and uses ordinary decoding. Later we’ll compare how this release and zero point thirty-one identify the same adapter."
            targets:
              - vllm-entry-contract-mechanism
            color: cyan
            linger: 0.2
      - say: Use vllm serve for the online entrypoint. In zero point thirty, the older Python API-server module became
          a deprecated compatibility shim, and ordinary scale-out routes require the enable-scale-out flag. A
          copied environment variable can leave a route absent. Preserve the installed revision, registered
          routes and resolved configuration before comparing requests or attributing a capability to the
          engine.
        hold: 0.65
        visual_cues:
          - id: vv-entry-contract-op-2
            phrase: "Use vllm serve for the online entrypoint. In zero point thirty, the older Python API-server module became a deprecated compatibility shim, and ordinary scale-out routes require the enable-scale-out flag. A copied environment variable can leave a route absent. Preserve the installed revision, registered routes and resolved configuration before comparing requests or attributing a capability to the engine."
            targets:
              - vllm-entry-contract-mechanism
            color: cyan
            linger: 0.2
  - id: fragmentation
    title: Derive the wasted space before introducing blocks
    visual: Lay out one contiguous twelve-position reservation with seven occupied cells, then independent free
      runs of two and three beside a four-position request. Convert logical growth into separately allocated
      four-position blocks.
    beats:
      - say: >-
          A request reserves twelve token positions but finishes after seven. Five positions remain unused
          inside its reservation. That is internal fragmentation. Now put two free positions in one region
          and three in another. Five positions are free overall, yet a request needing four contiguous
          positions cannot fit into either region. That is external fragmentation.
        hold: 0.65
        visual_cues:
          - id: vv-fragmentation-op-0
            phrase: "A request reserves twelve token positions but finishes after seven. Five positions remain unused inside its reservation. That is internal fragmentation. Now put two free positions in one region and three in another. Five positions are free overall, yet a request needing four contiguous positions cannot fit into either region. That is external fragmentation."
            targets:
              - vllm-fragmentation-mechanism
            color: cyan
            linger: 0.2
          - id: vv-fragmentation-internal
            phrase: "Five positions remain unused inside its reservation."
            targets:
              - vllm-fragmentation-mechanism
            color: green
            linger: 0.45
          - id: vv-fragmentation-external
            phrase: "Five positions are free overall, yet a request needing four contiguous positions cannot fit into either region."
            targets:
              - vllm-fragmentation-mechanism
            color: green
            linger: 0.45
      - say: >-
          Fixed-size KV blocks let the request grow by acquiring another physical block without requiring its
          neighbors. The request keeps its own logical order in a table. Physical placement can change
          without permuting that logical sequence. Count the empty cells in the final block. Those cells are
          the unused part of this request’s allocation.
        hold: 0.65
        visual_cues:
          - id: vv-fragmentation-op-1
            phrase: "Fixed-size KV blocks let the request grow by acquiring another physical block without requiring its neighbors. The request keeps its own logical order in a table. Physical placement can change without permuting that logical sequence. Count the empty cells in the final block. Those cells are the unused part of this request’s allocation."
            targets:
              - vllm-fragmentation-mechanism
            color: cyan
            linger: 0.2
      - say: Each cached position holds attention keys and values for the relevant layers and heads. Our four-position
          blocks make addresses inspectable; actual supported block sizes depend on the backend. For a
          zero-based position, divide by block size and discard the fraction for its logical block. The
          remainder gives its within-block offset; the table maps that logical block to a physical ID. Keep
          the same token identities while changing the view.
        hold: 0.65
        visual_cues:
          - id: vv-fragmentation-op-2
            phrase: "Each cached position holds attention keys and values for the relevant layers and heads. Our four-position blocks make addresses inspectable; actual supported block sizes depend on the backend. For a zero-based position, divide by block size and discard the fraction for its logical block. The remainder gives its within-block offset; the table maps that logical block to a physical ID. Keep the same token identities while changing the view."
            targets:
              - vllm-fragmentation-mechanism
            color: cyan
            linger: 0.2
  - id: blocks
    title: Logical neighbors can live in distant physical blocks
    visual: R0's eight illustrative word tokens form two logical blocks mapped to physical slots twelve and
      forty-one. Selecting positions resolves both the logical block and within-block offset without sorting
      physical IDs.
    beats:
      - say: >
          Autoregressive decoding reuses keys and values computed for earlier positions. Reserving each
          request's maximum history would leave unused capacity when it finishes early. vLLM divides cached
          state into fixed-size blocks and gives each request a table that names its physical blocks.
        hold: 0.6
        visual_cues:
          - id: blocks-beat-1-focus-1
            phrase: vLLM divides cached state into fixed-size blocks and gives each request a table that names its
              physical blocks
            targets:
              - blocks-first-block
              - blocks-second-block
              - blocks-request-table
            color: cyan
            linger: 0.65
          - id: blocks-beat-1-focus-2
            phrase: Reserving each request's maximum history would leave unused capacity when it finishes early
            targets:
              - blocks-r0
            color: yellow
            linger: 0.65
      - say: >
          Our small sentence occupies two four-position blocks. The first lives in one physical slot and the
          next in another, far away in the pool. Logical order comes from the request's table. The model can
          read a continuous history without requiring adjacent physical storage.
        hold: 0.6
        visual_cues:
          - id: blocks-beat-2-focus-1
            phrase: The first lives in one physical slot and the next in another
            targets:
              - blocks-request-table
              - blocks-physical-slot-offset
            color: cyan
            linger: 0.65
          - id: blocks-beat-2-focus-2
            phrase: Our small sentence occupies two four-position blocks
            targets:
              - blocks-first-block
              - blocks-second-block
            color: yellow
            linger: 0.65
      - say: >
          Follow the selected position through integer division and its within-block offset. A kernel consumes
          that mapping when loading attention state. Paged addressing describes a memory contract. The actual
          attention implementation still depends on the model, hardware, dtype and enabled features.
        hold: 0.6
        visual_cues:
          - id: blocks-beat-3-focus-1
            phrase: Follow the selected position through integer division and its within-block offset
            targets:
              - blocks-selected-position
              - blocks-logical-block
              - blocks-physical-slot-offset
              - blocks-address-calculation
            color: cyan
            linger: 0.65
          - id: blocks-beat-3-focus-2
            phrase: The actual attention implementation still depends on the model, hardware, dtype and enabled features
            targets:
              - blocks-r0
            color: yellow
            linger: 0.65
  - id: historical-evidence
    title: Read the original throughput result with its denominator
    visual: Place the PagedAttention paper receipt beside the same growing KV history. Reveal hardware,
      model/workload, baseline reservation variants and normalized mean latency as independent constraints.
    beats:
      - say: The twenty twenty-three PagedAttention paper reported two to four times higher throughput than
          FasterTransformer and Orca at comparable latency in its experiments. Its basic sampling workloads
          used OPT thirteen, sixty-six and one hundred seventy-five billion parameter models with ShareGPT and
          Alpaca length distributions and Poisson arrivals. Shared-prefix experiments used LLaMA thirteen
          billion and WMT sixteen translation examples.
        hold: 0.65
        visual_cues:
          - id: vv-historical-evidence-op-0
            phrase: "The twenty twenty-three PagedAttention paper reported two to four times higher throughput than FasterTransformer and Orca at comparable latency in its experiments. Its basic sampling workloads used OPT thirteen, sixty-six and one hundred seventy-five billion parameter models with ShareGPT and Alpaca length distributions and Poisson arrivals. Shared-prefix experiments used LLaMA thirteen billion and WMT sixteen translation examples."
            targets:
              - vllm-historical-evidence-mechanism
            color: cyan
            linger: 0.2
      - say: >-
          Those measurements used GCP A2 instances with A100 GPUs. FasterTransformer had a custom dynamic
          batcher; the authors reimplemented Orca with different reservation variants. Most traces lasted one
          hour, while the largest OPT experiment used fifteen minutes. The reported latency was mean
          end-to-end latency normalized by output length.
        hold: 0.65
        visual_cues:
          - id: vv-historical-evidence-op-1
            phrase: "Those measurements used GCP A2 instances with A100 GPUs. FasterTransformer had a custom dynamic batcher; the authors reimplemented Orca with different reservation variants. Most traces lasted one hour, while the largest OPT experiment used fifteen minutes. The reported latency was mean end-to-end latency normalized by output length."
            targets:
              - vllm-historical-evidence-mechanism
            color: cyan
            linger: 0.2
      - say: >-
          To compare two servers today, send each the same arrivals with the same prompt and output lengths.
          Match the hardware and topology, software versions, model, dtypes and sampling. Warm up both
          servers, check their outputs, then compare useful completions and latency distributions. To
          identify the kernel that read the paged blocks, check the attention backend selected by the runner.
        hold: 0.65
        visual_cues:
          - id: vv-historical-evidence-op-2
            phrase: "To compare two servers today, send each the same arrivals with the same prompt and output lengths. Match the hardware and topology, software versions, model, dtypes and sampling. Warm up both servers, check their outputs, then compare useful completions and latency distributions. To identify the kernel that read the paged blocks, check the attention backend selected by the runner."
            targets:
              - vllm-historical-evidence-mechanism
            color: cyan
            linger: 0.2
  - id: process-owners
    title: Count the processes that own one request
    visual: Carry R1 through API processing to its engine core and four GPU workers. Expand the same topology to
      DP ranks and compute the documented main-process count without counting auxiliary OS processes.
    beats:
      - say: In the documented V1 online multiprocessing topology, API servers parse requests, tokenize, load media
          and stream outputs. They connect through ZeroMQ to engine cores, one per data-parallel rank. Each
          core owns scheduling and KV management. Each GPU has a worker. With data parallelism, API-server
          count defaults to the number of ranks, and every API server can reach every engine core.
        hold: 0.65
        visual_cues:
          - id: vv-process-owners-op-0
            phrase: "In the documented V1 online multiprocessing topology, API servers parse requests, tokenize, load media and stream outputs. They connect through ZeroMQ to engine cores, one per data-parallel rank. Each core owns scheduling and KV management. Each GPU has a worker. With data parallelism, API-server count defaults to the number of ranks, and every API server can reach every engine core."
            targets:
              - vllm-process-owners-mechanism
            color: cyan
            linger: 0.2
      - say: Let A count API servers, D count data-parallel ranks and N count GPUs. Add A, D and N, then add one
          coordinator when D exceeds one. Four GPUs with tensor parallelism four and one data-parallel rank
          give one plus one plus four, or six main processes. Eight GPUs with two-way tensor parallelism and
          four data-parallel ranks give four plus four plus eight plus one, or seventeen.
        hold: 0.65
        visual_cues:
          - id: vv-process-owners-op-1
            phrase: "Let A count API servers, D count data-parallel ranks and N count GPUs. Add A, D and N, then add one coordinator when D exceeds one. Four GPUs with tensor parallelism four and one data-parallel rank give one plus one plus four, or six main processes. Eight GPUs with two-way tensor parallelism and four data-parallel ranks give four plus four plus eight plus one, or seventeen."
            targets:
              - vllm-process-owners-mechanism
            color: cyan
            linger: 0.2
          - id: vv-process-owners-single-six
            phrase: "Four GPUs with tensor parallelism four and one data-parallel rank give one plus one plus four, or six main processes."
            targets:
              - vllm-process-owners-mechanism
            color: green
            linger: 0.45
          - id: vv-process-owners-parallel-seventeen
            phrase: "Eight GPUs with two-way tensor parallelism and four data-parallel ranks give four plus four plus eight plus one, or seventeen."
            targets:
              - vllm-process-owners-mechanism
            color: green
            linger: 0.45
      - say: >-
          Use those process boundaries to trace a slow reply. The API server tokenizes the request. The core
          queues it and allocates its blocks. The workers run the kernels and collectives. CPU starvation can
          delay the GPU handoff even when the GPU has spare capacity.
        hold: 0.65
        visual_cues:
          - id: vv-process-owners-op-2
            phrase: "Use those process boundaries to trace a slow reply. The API server tokenizes the request. The core queues it and allocates its blocks. The workers run the kernels and collectives. CPU starvation can delay the GPU handoff even when the GPU has spare capacity."
            targets:
              - vllm-process-owners-mechanism
            color: cyan
            linger: 0.2
  - id: prefix
    title: Exact full blocks carry reusable prompt work
    visual: R0 and R1 share six word positions, but only their complete first four-position block matches. R1 maps
      that block to the same physical slot and allocates its divergent suffix and partial tail separately.
    beats:
      - say: >
          The second sentence begins with the same words and later diverges. In this full-attention teaching
          path, automatic prefix caching reuses complete matching blocks. Compare the first block, then
          inspect the next one. A partially matching block does not provide an exact cached block for the new
          request.
        hold: 0.7
        visual_cues:
          - id: prefix-beat-1-focus-1
            phrase: The second sentence begins with the same words and later diverges
            targets:
              - prefix-shared-block
              - prefix-divergent-block
            color: cyan
            linger: 0.65
          - id: prefix-beat-1-focus-2
            phrase: A partially matching block does not provide an exact cached block for the new request
            targets:
              - prefix-divergent-block
              - prefix-tail-block
            color: yellow
            linger: 0.65
      - say: >
          Both requests can point to the first physical slot. Its reference count becomes two. The new request
          still computes the divergent suffix and its partial final block. The shared-prefix count and
          skipped-computation count differ because the cache's reuse unit is a whole block.
        hold: 0.6
        visual_cues:
          - id: prefix-beat-2-focus-1
            phrase: The new request still computes the divergent suffix and its partial final block
            targets:
              - prefix-r1-recompute
              - prefix-block-tables
              - prefix-reference-count
            color: cyan
            linger: 0.65
          - id: prefix-shared-references
            phrase: Its reference count becomes two
            targets:
              - prefix-shared-block
              - prefix-block-tables
              - prefix-reference-count
            color: green
            linger: 0.65
      - say: >
          Cache identity also includes preceding context and relevant configuration, such as an adapter or an
          enforced trust namespace. Equal text alone cannot establish compatible state. Reuse saves prompt
          processing. Each new generated token still needs its decoding computation, even when much of the
          prompt was cached.
        hold: 0.6
        motion_check:
          region:
            - 280
            - 365
            - 1440
            - 650
          minimumChangedFraction: 0.002
        visual_cues:
          - id: prefix-beat-3-focus-1
            phrase: Cache identity also includes preceding context and relevant configuration
            targets:
              - prefix-cache-key
              - prefix-block-tables
            color: cyan
            linger: 0.65
          - id: prefix-config-change
            phrase: such as an adapter or an enforced trust namespace
            targets:
              - prefix-cache-key
              - prefix-block-tables
              - prefix-reference-count
              - prefix-r1-recompute
            color: pink
            linger: 0.65
  - id: prefix-limit
    title: Compute the block-rounded hit and the remaining logits work
    visual: Keep R0 cached ABCD/EFGH and R1 ABCDEFXYZ. Move a match boundary from six to seven to eight tokens,
      then change prompt length from nine to eight while leaving cached bytes fixed.
    beats:
      - say: The pinned full-attention reference takes the smaller of the shared-prefix length and prompt length minus
          one. Divide that limit by block size, discard the fractional part, then multiply by block size. The
          result counts skipped input positions. Subtract skipped positions from prompt length to obtain
          remaining computation. This assumes eligible cached blocks exist and their complete context matches.
          For a new request with a block-aligned reused prefix, round the remaining count upward to a whole
          number of new blocks.
        hold: 0.65
        visual_cues:
          - id: vv-prefix-limit-op-0
            phrase: "The pinned full-attention reference takes the smaller of the shared-prefix length and prompt length minus one. Divide that limit by block size, discard the fractional part, then multiply by block size. The result counts skipped input positions. Subtract skipped positions from prompt length to obtain remaining computation. This assumes eligible cached blocks exist and their complete context matches. For a new request with a block-aligned reused prefix, round the remaining count upward to a whole number of new blocks."
            targets:
              - vllm-prefix-limit-mechanism
            color: cyan
            linger: 0.2
      - say: For our nine-position prompt and four-position blocks, six matching positions permit four skips and leave
          five computations. Seven matching positions give the same result. Eight matching positions permit
          eight skips and leave one. Turning APC on in the earlier six-position scheduling step would let R0
          consume one decode input and R1 compute its remaining five prompt inputs in that same step.
        hold: 0.65
        visual_cues:
          - id: vv-prefix-limit-op-1
            phrase: "For our nine-position prompt and four-position blocks, six matching positions permit four skips and leave five computations. Seven matching positions give the same result. Eight matching positions permit eight skips and leave one. Turning APC on in the earlier six-position scheduling step would let R0 consume one decode input and R1 compute its remaining five prompt inputs in that same step."
            targets:
              - vllm-prefix-limit-mechanism
            color: cyan
            linger: 0.2
          - id: vv-prefix-limit-match-six
            phrase: "For our nine-position prompt and four-position blocks, six matching positions permit four skips and leave five computations."
            targets:
              - vllm-prefix-limit-mechanism
            color: green
            linger: 0.45
          - id: vv-prefix-limit-match-seven
            phrase: "Seven matching positions give the same result."
            targets:
              - vllm-prefix-limit-mechanism
            color: green
            linger: 0.45
          - id: vv-prefix-limit-match-eight
            phrase: "Eight matching positions permit eight skips and leave one."
            targets:
              - vllm-prefix-limit-mechanism
            color: green
            linger: 0.45
          - id: vv-prefix-limit-apc-step
            phrase: "Turning APC on in the earlier six-position scheduling step would let R0 consume one decode input and R1 compute its remaining five prompt inputs in that same step."
            targets:
              - vllm-prefix-limit-mechanism
            color: green
            linger: 0.45
          - id: vv-prefix-limit-apc-input
            phrase: "let R0 consume one decode input and R1 compute its remaining five prompt inputs"
            targets:
              - vllm-prefix-limit-mechanism
            color: cyan
            linger: 0.35
      - say: Now make the prompt itself eight positions long, with all eight cached. KV entries do not contain the
          final logits needed to sample its reply. The pinned code caps the hit at seven positions; block
          alignment rounds that to four, so the last whole block is recomputed. A one-position prompt skips
          zero. Sliding-window, hybrid-state, offloaded and prompt-logprob paths require their own contracts.
        hold: 0.65
        visual_cues:
          - id: vv-prefix-limit-op-2
            phrase: "Now make the prompt itself eight positions long, with all eight cached. KV entries do not contain the final logits needed to sample its reply. The pinned code caps the hit at seven positions; block alignment rounds that to four, so the last whole block is recomputed. A one-position prompt skips zero. Sliding-window, hybrid-state, offloaded and prompt-logprob paths require their own contracts."
            targets:
              - vllm-prefix-limit-mechanism
            color: cyan
            linger: 0.2
          - id: vv-prefix-limit-prompt-eight
            phrase: "The pinned code caps the hit at seven positions; block alignment rounds that to four, so the last whole block is recomputed."
            targets:
              - vllm-prefix-limit-mechanism
            color: green
            linger: 0.45
  - id: hash-context
    title: "Which cache record follows the adapter?"
    visual: "Hold parent history and suffix tokens fixed. Change only the adapter manifest path, then compare the identity fields recorded by the two revisions."
    beats:
      - say: >-
          Look at the block ending in “green branch.” Its keys and values depend on the words before it. Its
          cache record carries a parent hash for that history, the exact token IDs in this block, and context
          such as the adapter, media identity and cache namespace. A different earlier history changes the
          parent, even when all four words here stay the same.
        hold: 0.65
        visual_cues:
          - id: hash-parent
            phrase: "A different earlier history changes the parent"
            targets: [hash-record]
            color: cyan
            linger: 0.25
            caption_boundary: true
      - say: >-
          Our service calls its adapter Finch. We’ve installed a new revision in a different directory. The
          display name stays Finch. Look at what changed in the manifest. Which version of the cache key
          records that path change?
        hold: 2
        visual_cues:
          - id: hash-revision
            phrase: "a new revision in a different directory"
            targets: [hash-record]
            color: yellow
            linger: 0.25
            caption_boundary: true
          - id: hash-ask
            phrase: "Which version of the cache key records that path change"
            targets: [hash-record]
            color: yellow
            linger: 0.25
            caption_boundary: true
      - say: >-
          Version zero point twenty-eight records the adapter name, which stayed Finch. It also leaves the
          source of some extra fields implicit. A hash function sees only the serialized input it receives.
          Version zero point thirty-one tags those fields and includes the adapter path. That input changes
          when the path changes. The default digest is SHA two fifty-six. Choosing a different hash changes
          collision risk. Verifying the adapter’s actual weights is a separate deployment check.
        hold: 0.7
        visual_cues:
          - id: hash-name-only
            phrase: "Version zero point twenty-eight records the adapter name"
            targets: [hash-record]
            color: blue
            linger: 0.25
            caption_boundary: true
