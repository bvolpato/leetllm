  - id: goodput
    title: Count successful completions that meet the latency promise
    visual: Two supplied one-hundred-second candidate receipts compare offered requests, successful completions
      and completions meeting both latency targets. Goodput is calculated from passing completions over
      elapsed time, alongside an inflated completion-only-denominator estimate.
    beats:
      - say: >
          A faster token counter can still produce a worse interactive service. Evaluate completions against
          the promised first-token and between-token delays. Our supplied candidate receipts keep offered
          requests, successful completions and latency-compliant completions separate, so failures and
          unfinished work remain visible.
        hold: 0.6
        visual_cues:
          - id: goodput-beat-1-focus-1
            phrase: A faster token counter can still produce a worse interactive service
            targets:
              - goodput-candidate-a
              - goodput-candidate-b
            color: cyan
            linger: 0.65
          - id: goodput-offered-receipts
            phrase: offered requests
            targets:
              - goodput-a-offered
              - goodput-b-offered
            color: blue
            linger: 0.65
          - id: goodput-successful-receipts
            phrase: successful completions
            targets:
              - goodput-a-complete
              - goodput-b-complete
            color: green
            linger: 0.65
          - id: goodput-compliant-receipts
            phrase: latency-compliant completions
            targets:
              - goodput-a-passed
              - goodput-b-passed
            color: cyan
            linger: 0.65
      - say: >
          Goodput is the number of completions meeting both latency limits divided by the full measurement
          window. Candidate B serves more useful completions here despite receiving fewer offers. The receipt
          displays the numerator and rate while keeping failed and unfinished requests visible.
        hold: 0.7
        visual_cues:
          - id: goodput-beat-2-focus-1
            phrase: number of completions meeting both latency limits
            targets:
              - goodput-a-passed
              - goodput-b-passed
            color: cyan
            linger: 0.65
