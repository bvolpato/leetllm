            targets: [vllm-route-security-mechanism]
            color: green
            linger: 0.45
      - say: >-
          A client sends a scoring request. The gateway authenticates the caller and checks the route
          against its allowlist. This caller has permission, so the gateway forwards the request. The
          scoring server accepts client traffic only through that gateway.
        hold: 0.65
        visual_cues:
          - id: vv-route-security-gateway
            phrase: "the gateway forwards the request"
            targets: [vllm-route-security-mechanism]
            color: green
            linger: 0.45
      - say: >-
          Inside the cluster, one worker sends cached keys and values to another. The workers use a private
          network. Firewall rules limit these ports to the peers that need them. Apply that boundary to
