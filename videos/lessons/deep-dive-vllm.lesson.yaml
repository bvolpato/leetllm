      distinguish block exhaustion/recompute from tokenizer or scheduler CPU delay, preserving the actual
      current counters.
    beats:
      - say: Read the CLI and API server, then the engine core, scheduler, KV manager, block pool and the runner
          actually selected by gpu-worker. The pinned scheduler assigns token counts; the KV manager finds
          computed blocks and reserves slots; the pool controls references and free capacity. Follow the same
          request ID through these files instead of treating every low token rate as an attention-kernel
          problem.
