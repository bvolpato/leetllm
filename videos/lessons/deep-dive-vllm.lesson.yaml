  - id: project-identity
    title: Keep source stewardship and loaded artifacts separate
    visual: Link the paper’s memory contribution to the community source tree, then assign an individual committer
      review and a separate model-weight license check without turning company logos into owners.
    beats:
      - say: vLLM grew from UC Berkeley’s Sky Computing Lab and the PagedAttention paper by Woosuk Kwon, Zhuohan Li,
          Siyuan Zhuang, Ying Sheng and collaborators. Its community engine combines block memory, scheduling,
          runner integration and serving interfaces. Companies fund and operate the project, while governance
          assigns committer authority to individuals through sustained contributions, reviews and subsystem
          work.
        hold: 0.65
        visual_cues:
          - id: vv-project-identity-op-0
            phrase: "vLLM grew from UC Berkeley’s Sky Computing Lab and the PagedAttention paper by Woosuk Kwon, Zhuohan Li, Siyuan Zhuang, Ying Sheng and collaborators. Its community engine combines block memory, scheduling, runner integration and serving interfaces. Companies fund and operate the project, while governance assigns committer authority to individuals through sustained contributions, reviews and subsystem work."
