          - id: vv-pool-structures-op-0
            phrase: "The pool preconstructs block objects. A block retains its physical ID, reference count, optional full-block hash and links in a doubly linked free queue. Request tables name their current blocks; a separate hash map finds reusable cached content. A zero reference count can coexist with a cached hash because finished content may still be useful before overwrite."
            targets:
