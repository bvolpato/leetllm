  - id: fresh-admission
    title: "Admission and wait time"
    visual: "Try two requested adapters against the same thirteen-position prompt. Lay the uncached positions into actual four-place block outlines, including a fourth block outside the free pool. Finish with an independent request clock and an admission diagnosis."
    beats:
      - say: >-
          Try this one. Q has thirteen prompt positions in blocks of four. Its first ten token IDs match a
          live prefix computed under adapter A. Q asks for B. Three other blocks are free. The step can handle
          fourteen inputs, and one place is already spoken for by an active decode with its own storage. Can
          the entire prompt run beside it?
        hold: 2.6
        visual_cues:
          - id: vv-fresh-admission-matches
            phrase: "Its first ten token IDs match a live prefix computed under adapter A"
            targets: [fresh-prompt]
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: vv-fresh-admission-resources
            phrase: "Three other blocks are free"
            targets: [fresh-prompt, fresh-pool]
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: vv-fresh-admission-whole-prompt
            phrase: "Can the entire prompt run beside it"
            targets: [fresh-prompt, fresh-pool, fresh-decision]
            color: yellow
            linger: 0.25
            caption_boundary: true
      - say: >-
          B needs its own keys and values for all thirteen positions. Count them into the free blocks.
          Four in the first. Eight across two. Twelve across three. The last position needs a fourth block.
          Thirteen prompt inputs plus one decode fit
          the step exactly, yet the proposal to run the entire prompt has to wait. A scheduler that allows a
          shorter slice could process twelve now and leave the last position for later.
        hold: 1.5
        visual_cues:
          - id: vv-fresh-admission-miss
            phrase: "B needs its own keys and values for all thirteen positions"
            targets: [fresh-prompt, fresh-decision]
            color: pink
            linger: 0.25
            caption_boundary: true
          - id: vv-fresh-admission-first-four
            phrase: "Four in the first"
            targets: [fresh-pool]
          - id: vv-fresh-admission-next-four
            phrase: "Eight across two"
            targets: [fresh-pool]
          - id: vv-fresh-admission-third-four
            phrase: "Twelve across three"
            targets: [fresh-pool]
          - id: vv-fresh-admission-overflow
            phrase: "The last position needs a fourth block"
            targets: [fresh-pool]
            color: yellow
            caption_boundary: true
          - id: vv-fresh-admission-memory-wait
            phrase: "the proposal to run the entire prompt has to wait"
            targets: [fresh-pool, fresh-decision]
            color: yellow
            linger: 0.25
            caption_boundary: true
      - say: >-
          Reset the pool. A separate request asks for adapter A from the outset. It has the same thirteen
          tokens and the same ten matching positions. Those prefix blocks are already live, so sharing one
          leaves all three free blocks available for new storage. Does the entire prompt fit this time?
        hold: 2.7
        caption_starts: ["Those prefix blocks are already live", "Does the entire prompt fit this time"]
        visual_cues:
          - id: vv-fresh-admission-restore-adapter
            phrase: "A separate request asks for adapter A"
            targets: [fresh-prompt, fresh-pool, fresh-decision]
            color: yellow
            linger: 0.25
            caption_boundary: true
      - say: >-
          Two complete matching blocks cover eight positions. The next two matches lie in a block that
          diverges. Five positions still need computing. Place four in one new block and the last in another.
          With the active decode, six inputs run and one block is still free. Each request kept the adapter
          its caller asked for.
        hold: 1.15
        caption_starts: ["The next two matches lie in a block that diverges", "Five positions still need computing"]
        visual_cues:
          - id: vv-fresh-admission-matching-blocks
            phrase: "Two complete matching blocks cover eight positions"
            targets: [fresh-prompt]
            color: green
            linger: 0.25
            caption_boundary: true
          - id: vv-fresh-admission-hit-counts
            phrase: "Five positions still need computing"
            targets: [fresh-prompt]
            color: green
            linger: 0.25
          - id: vv-fresh-admission-tail-four
            phrase: "Place four in one new block"
            targets: [fresh-prompt, fresh-pool]
          - id: vv-fresh-admission-tail-one
            phrase: "the last in another"
            targets: [fresh-pool]
          - id: vv-fresh-admission-hit-admitted
            phrase: "With the active decode, six inputs run"
            targets: [fresh-pool, fresh-decision]
            color: green
            linger: 0.25
            caption_boundary: true
      - say: >-
          How long did a reader actually wait? Take a separate timed request for A. Input handling took seven
          milliseconds. The request waited sixty-five in the queue. Its prompt took twenty-four to run. Six
          more brought the first token to the reader. Which interval would you open first?
        hold: 2.4
        visual_cues:
          - id: vv-fresh-admission-input
            phrase: "Input handling took seven milliseconds"
            targets: [fresh-clock]
            color: blue
            linger: 0.25
            caption_boundary: true
          - id: vv-fresh-admission-queue
            phrase: "The request waited sixty-five in the queue"
            targets: [fresh-clock]
            color: pink
            linger: 0.25
            caption_boundary: true
          - id: vv-fresh-admission-prefill
            phrase: "Its prompt took twenty-four to run"
            targets: [fresh-clock]
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: vv-fresh-admission-delivery
            phrase: "Six more brought the first token to the reader"
            targets: [fresh-clock]
            color: green
            linger: 0.25
            caption_boundary: true
          - id: vv-fresh-admission-question
            phrase: "Which interval would you open first"
            targets: [fresh-clock, fresh-diagnosis]
            color: yellow
            linger: 0.25
            caption_boundary: true
      - say: >-
          Of the hundred and two milliseconds, sixty-five were spent in the engine queue. Open the engine’s
          admission records for that interval. At each attempt, did the requested slice have both the input
          budget and the blocks it needed? If both were available, check when the scheduler actually issued
          the work.
        hold: 1.35
        caption_starts: ["Open the engine’s admission records", "At each attempt", "If both were available"]
        visual_cues:
          - id: vv-fresh-admission-latency-total
            phrase: "sixty-five were spent in the engine queue"
            targets: [fresh-clock, fresh-diagnosis]
            color: pink
            linger: 0.25
            caption_boundary: true
          - id: vv-fresh-admission-dispatch
            phrase: "check when the scheduler actually issued the work"
            targets: [fresh-diagnosis]
            color: pink
            linger: 0.25
