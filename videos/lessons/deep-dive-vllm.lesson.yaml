            phrase: "The pinned source carries Apache two point zero. That license covers the repository under its terms; loaded model weights, tokenizers, datasets and remote code retain their own licensing and trust requirements. A compatible server can still load an artifact whose rights or behavior need separate review. Preserve those identities with the release."
            targets:
