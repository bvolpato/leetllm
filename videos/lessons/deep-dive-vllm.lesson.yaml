  - id: tenant-cache
    title: "Who assigns the cache namespace?"
    visual: "Two authenticated groups send the same first block. Their gateway records keep the namespaces separate. Change the adapter on one authorized request and retain its cache miss."
    beats:
      - say: >-
          Orchard sends four prompt tokens under adapter A. Meadow sends the same four. A cache salt enters
          the hash of the first block, and later blocks inherit that history through their parent hashes. Give
          the groups separate namespaces and their requests can keep separate cache identities even when the
          words match.
        hold: 0.8
        visual_cues:
          - id: tenant-second
            phrase: "Meadow sends the same four"
            targets: [tenant-records]
            color: pink
            linger: 0.25
            caption_boundary: true
      - say: >-
          The gateway authenticates each group and assigns its namespace. Only the gateway can set that value.
          Unguessable salts help limit what one group can learn from another group’s cache timing. The service
          still has to authorize access to source documents, protect memory and isolate internal traffic.
        hold: 0.8
        visual_cues:
          - id: tenant-enforce
            phrase: "authenticates each group and assigns its namespace"
            targets: [tenant-records]
            color: green
            linger: 0.25
            caption_boundary: true
      - say: >-
          Keep Orchard’s namespace and change its requested adapter to B. The cached block was computed with
          A. A miss here preserves the meaning of the request. Compute the block under B. Model, tokenizer and
          media context also need to agree before a hit counts as useful work saved.
        hold: 0.8
        visual_cues:
          - id: tenant-adapter
            phrase: "change its requested adapter to B"
            targets: [tenant-records]
            color: yellow
            linger: 0.25
            caption_boundary: true
  - id: synthesis
    title: "Where did R1 wait?"
    visual: "Follow R1 on a single arrival-to-first-token ruler. Open the queue interval to compare two admission records for the same five prompt inputs, then follow the successful handoff to the worker."
    beats:
      - say: >-
          Start R1’s clock at arrival. Input handling takes twenty milliseconds. R1 waits another eighty in
          the queue. Its prompt runs for forty. Delivery takes ten more, and the first token reaches the
          reader at one hundred fifty milliseconds. Which interval would you investigate first?
        hold: 2.3
        visual_cues:
          - id: synthesis-input
            phrase: "Input handling takes twenty milliseconds"
            targets: [synthesis-clock]
            color: blue
            linger: 0.25
            caption_boundary: true
          - id: synthesis-queue
            phrase: "another eighty in the queue"
            targets: [synthesis-clock]
            color: pink
            linger: 0.25
            caption_boundary: true
          - id: synthesis-prefill
            phrase: "Its prompt runs for forty"
            targets: [synthesis-clock]
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: synthesis-deliver
            phrase: "Delivery takes ten more"
            targets: [synthesis-clock]
            color: green
            linger: 0.25
            caption_boundary: true
          - id: synthesis-question
            phrase: "Which interval would you investigate first"
            targets: [synthesis-clock, synthesis-question]
            color: yellow
            linger: 0.25
            caption_boundary: true
      - say: >-
          Open the long queue interval. Here are two admission records from our example. At twenty
          milliseconds R1 asks to run all five remaining prompt inputs. They fit the step, but need two new
          blocks. Only one is free. At one hundred milliseconds two blocks are free and the same slice can
          run. The first record explains one refusal. To account for the whole wait, check the attempts
          between them and the time the engine spent scheduling.
        hold: 1
        visual_cues:
          - id: synthesis-first-attempt
            phrase: "At twenty milliseconds R1 asks to run all five remaining prompt inputs"
            targets: [synthesis-clock, synthesis-attempts]
            color: yellow
            linger: 0.25
            caption_boundary: true
          - id: synthesis-second-attempt
            phrase: "At one hundred milliseconds two blocks are free"
            targets: [synthesis-clock, synthesis-attempts]
            color: green
            linger: 0.25
            caption_boundary: true
      - say: >-
          Follow the successful handoff. The worker gets R1, five inputs, and its block table. Twelve holds
          the shared prefix. Seventy-three and ninety hold the suffix. Keep that record together when checking
          the runner, its attention backend and the sampled result. If worker time is the long interval on a
          real trace, compare warmed runs on the same topology and check the outputs. The authenticated API
          streams the reply. The worker traffic stays on the private network.
        hold: 0.8
        visual_cues:
          - id: synthesis-handoff
            phrase: "The worker gets R1, five inputs, and its block table"
            targets: [synthesis-attempts, synthesis-handoff]
            color: cyan
            linger: 0.25
            caption_boundary: true
  - id: source-diagnosis
