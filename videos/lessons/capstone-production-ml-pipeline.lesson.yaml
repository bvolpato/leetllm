            color: cyan
            linger: 0.45
          - id: pipe-result-restored-policy-match
            phrase: The fingerprint matches again, but the old ready receipt is still superseded by the newer hold
            targets:
              - fresh-stale-receipt-mechanism
            color: cyan
            linger: 0.45
      - say: "Now retain a new complete ordered history under the restored policy and create its new ready receipt. Promotion follows that current evidence chain, reloads both compatible packages and moves the local production pointer to v one. The identical nine-minute probe now warns. Two staged repairs earned this result: restore the policy and obtain fresh current evidence. A service rollout would still need worker and routing verification. Document QA next applies those evidence gates to language: decide which text may speak as policy, what the caller may read and when the answer must abstain."
        hold: 0.8
        visual_cues:
          - id: fresh-stale-receipt-b3
            phrase: Now retain a new complete ordered history under the restored policy and create its new ready receipt
            targets:
              - fresh-stale-receipt-mechanism
            linger: 0.8
          - id: fresh-stale-receipt-new-commit
            phrase: moves the local production pointer to v one
            targets:
