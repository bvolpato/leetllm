            linger: 0.7
          - id: pipe-result-fresh-compound-hold
            phrase: Promotion holds for both a superseded canary receipt and the changed policy fingerprint
            targets:
              - fresh-stale-receipt-mechanism
            color: cyan
            linger: 0.45
          - id: pipe-result-fresh-unchanged-silent-probe
            phrase: Production remains v zero and the probe stays silent
            targets:
