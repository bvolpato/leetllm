  - id: production-history
    title: Keep missing, invalid and older observations distinct
    visual: One retained request, release and evidence identity constructs each operation and consequence;
      predictions precede their computed outcomes.
    beats:
      - say: After promotion, healthy service with missing delayed quality yields hold monitor and leaves the current
          release selected. A finite measured cost increase above policy, error-rate breach or latency breach
          can require rollback. Malformed production telemetry holds for investigation in this fixture;
          malformed canary telemetry aborts limited exposure. The real service needs a deadline and fallback
          when measurement remains unavailable.
        hold: 0.8
        visual_cues:
          - id: production-history-b1
            phrase: After promotion, healthy service with missing delayed quality yields hold monitor and leaves the
              current release selected
            targets:
              - production-history-mechanism
            linger: 0.8
      - say: The monitor retains the latest valid observation day separately from the latest receipt. Suppose valid
          day nine is followed by malformed day ten. The malformed receipt can hold monitoring, but it cannot
          erase day nine. A late day-eight report is older than retained valid evidence and must hold rollback
          without replacing the current receipt pointer. A report for a different release likewise cannot move
          the live release.
        hold: 0.8
        visual_cues:
          - id: production-history-b2
            phrase: The monitor retains the latest valid observation day separately from the latest receipt
            targets:
              - production-history-mechanism
            linger: 0.8
          - id: production-history-malformed
            phrase: followed by malformed day ten
            targets:
              - production-history-mechanism
            linger: 0.7
          - id: production-history-older
            phrase: A late day-eight report
            targets:
              - production-history-mechanism
            linger: 0.7
          - id: pipe-result-malformed-observation-hold
            phrase: The malformed receipt can hold monitoring, but it cannot erase day nine
            targets:
              - production-history-mechanism
            color: cyan
            linger: 0.45
          - id: pipe-result-older-observation-hold
            phrase: A late day-eight report is older than retained valid evidence and must hold rollback without replacing
              the current receipt pointer
            targets:
              - production-history-mechanism
            color: cyan
            linger: 0.45
      - say: A newer monitoring receipt supersedes an older rollback receipt. Before recovery, recheck the live
          release, policy and retained previous-target fingerprints, then reload that previous package. A
          changed target, changed policy or failed reload holds recovery. Integer days cannot order same-day
          updates or distinguish repeated rollout attempts; production windows need timestamps and attempt
          identity.
        hold: 0.8
        visual_cues:
          - id: production-history-b3
            phrase: A newer monitoring receipt supersedes an older rollback receipt
            targets:
              - production-history-mechanism
            linger: 0.8
  - id: product-monitoring
    title: Carry the same evidence contract across four products
    visual: One retained request, release and evidence identity constructs each operation and consequence;
      predictions precede their computed outcomes.
    beats:
      - say: Change the product while retaining the immediate-versus-delayed distinction. Delivery warnings need scan
          freshness now and labeled warning cost later. Ranking needs eligible candidate supply now and an
          assignment-aware purchase or return outcome later. Forecasting needs fresh counts now and residual
          or alert-decision cost later. Vision needs photo quality now and reviewer-confirmed damage later.
          Restore the relevant cropper, imputer or other preprocessing with that product model.
        hold: 0.8
        visual_cues:
          - id: product-monitoring-b1
            phrase: Change the product while retaining the immediate-versus-delayed distinction
            targets:
              - product-monitoring-mechanism
            linger: 0.8
      - say: A canary bounds initial exposure while checking a release. An A B test uses an assignment and analysis
          design to estimate an outcome difference. A canary can sit within a randomized experiment; a pair of
          supplied summaries is not a causal business-lift estimate. A training schedule or drift trigger
          creates another candidate, which must pass the same data, model, monitoring and promotion evidence
          checks.
        hold: 0.8
        visual_cues:
          - id: product-monitoring-b2
            phrase: A canary bounds initial exposure while checking a release
            targets:
              - product-monitoring-mechanism
            linger: 0.8
  - id: synthesis
    title: Make every transition answerable
    visual: The release tuple and bound evidence chain connect fitting, evaluation, canary and recovery.
    beats:
      - say: We have built a chain from admitted observations through fitted transformations to a release decision.
          Each transition has a reason to proceed, hold or recover. The cheap model’s miss remained visible,
          and the passing model still had to wait for separate operational evidence.
        hold: 0.75
        visual_cues:
          - id: synthesis-b1-1
            phrase: admitted observations through fitted transformations
            targets:
              - synthesis-mechanism
            linger: 0.45
          - id: synthesis-b1-2
            phrase: proceed, hold or recover
            targets:
              - synthesis-mechanism
            linger: 0.45
      - say: Keep that chain together as the service grows. Store complete compatible bundles, derive metrics from
          retained rows, control receipt writers and test stale or missing evidence. Then the next training
          run produces a candidate whose behavior and recovery path another engineer can inspect.
        hold: 0.85
        visual_cues:
          - id: synthesis-b2-1
            phrase: complete compatible bundles
            targets:
              - synthesis-mechanism
            linger: 0.45
          - id: synthesis-b2-2
            phrase: behavior and recovery path
            targets:
              - synthesis-mechanism
            linger: 0.45
  - id: fresh-stale-receipt
    title: Predict what the changed receipt can authorize
    visual: One retained request, release and evidence identity constructs each operation and consequence;
      predictions precede their computed outcomes.
    beats:
      - say: Return to the retained candidate and the same nine-minute probe, with production still v zero. A ready
          receipt exists. Before promotion, a newer one-window evaluation records hold; then someone changes
          the latency policy from two hundred fifty to three hundred under the same ID. Predict whether the
          old ready receipt can move production, and whether the nine-minute warning changes.
        hold: 0.8
        visual_cues:
          - id: fresh-stale-receipt-b1
            phrase: Return to the retained candidate and the same nine-minute probe, with production still v zero
            targets:
              - fresh-stale-receipt-mechanism
            linger: 0.8
      - say: Promotion holds for both a superseded canary receipt and the changed policy fingerprint. Production
          remains v zero and the probe stays silent. Restore only the original two-hundred-fifty policy. The
          fingerprint matches again, but the old ready receipt is still superseded by the newer hold.
          Production and the probe still do not change.
        hold: 0.8
        visual_cues:
          - id: fresh-stale-receipt-b2
            phrase: Promotion holds for both a superseded canary receipt and the changed policy fingerprint
            targets:
              - fresh-stale-receipt-mechanism
            linger: 0.8
