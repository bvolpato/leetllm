            linger: 0.45
          - id: recovery-restore
            phrase: Recovery selects the retained previous bundle and verifies it loads
            targets:
              - recovery-mechanism
            linger: 0.7
          - id: pipe-result-restored-package
            phrase: Recovery selects the retained previous bundle and verifies it loads
