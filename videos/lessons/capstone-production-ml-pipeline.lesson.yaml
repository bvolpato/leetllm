  - id: alias-generation
    title: Make the production transition atomic with its audit event
    visual: One retained request, release and evidence identity constructs each operation and consequence;
      predictions precede their computed outcomes.
    beats:
      - say: The Python controller checks production and then assigns it sequentially. A second controller can change
          the pointer between those actions. A transaction or compare-and-swap must check the expected release
          and alias generation while committing the pointer and audit event together. This lab does not
          implement that distributed operation.
        hold: 0.8
        visual_cues:
          - id: alias-generation-b1
            phrase: The Python controller checks production and then assigns it sequentially
            targets:
              - alias-generation-mechanism
            linger: 0.8
      - say: Consider production v zero at generation forty-one. Another controller moves it to v two at generation
          forty-two, then back to v zero at generation forty-three. The text label matches the old receipt
          again, but generation forty-one is stale. Compare the expected generation as well as the release,
          and bind freshness and rollout-attempt identity to evidence. A pointer check without a generation
          cannot detect that history.
        hold: 0.8
        visual_cues:
          - id: alias-generation-b2
            phrase: Consider production v zero at generation forty-one
            targets:
              - alias-generation-mechanism
            linger: 0.8
          - id: alias-generation-away
            phrase: Another controller moves it to v two at generation forty-two
            targets:
              - alias-generation-mechanism
            linger: 0.7
          - id: alias-generation-returned
            phrase: then back to v zero at generation forty-three
            targets:
              - alias-generation-mechanism
            linger: 0.7
          - id: pipe-result-aba-stale-comparison
            phrase: The text label matches the old receipt again, but generation forty-one is stale
            targets:
              - alias-generation-mechanism
            color: cyan
            linger: 0.45
      - say: An alias move is still a control-plane decision. Verify the serving workers loaded the complete
          compatible package, became ready and actually received routed requests. Restoring an alias cannot
          undo a warning already delivered. Recovery time includes reload, readiness, routing convergence and
          any external feature compatibility; the local dictionary example measures none of those times.
        hold: 0.8
        visual_cues:
          - id: alias-generation-b3
            phrase: An alias move is still a control-plane decision
            targets:
              - alias-generation-mechanism
            linger: 0.8
  - id: recovery
    title: Restore the earlier complete computation
    visual: A later labelled regression requests recovery, moving the simulated pointer back and changing the
      nine-minute probe.
    beats:
      - say: After promotion, monitor both service health and mature prediction quality. A measured regression can
          request recovery. Missing labels hold for investigation under the declared policy, with a deadline
          and fallback needed for a real service. Keep the distinction visible in the monitoring record.
        hold: 0.75
        visual_cues:
          - id: recovery-b1-1
            phrase: measured regression
            targets:
              - recovery-mechanism
            linger: 0.45
          - id: recovery-b1-2
            phrase: monitoring record
            targets:
              - recovery-mechanism
            linger: 0.45
      - say: Recovery selects the retained previous bundle and verifies it loads. Our nine-minute test changes with
          the restored model, showing that the pointer selected a different computation. A deployed recovery
          must also measure readiness and routing convergence, and it cannot undo notifications already
          delivered.
        hold: 0.85
        visual_cues:
          - id: recovery-b2-1
            phrase: retained previous bundle
            targets:
              - recovery-mechanism
            linger: 0.45
          - id: recovery-b2-2
            phrase: pointer selected a different computation
            targets:
