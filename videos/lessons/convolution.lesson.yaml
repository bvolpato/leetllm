    title: Collapse spatial positions while preserving channels
    beats:
      - say: Global average pooling computes one mean per channel and example. Batch by channels by height by width
          becomes batch by channels, or keeps singleton spatial axes. It removes position information from the
          following head. A permutation of one channel’s feature-map values preserves that mean, though
          translating a finite image can change those values before pooling.
        hold: 0.6
        visual_cues:
          - id: global-average-head-b1
            phrase: Global average pooling computes one mean per channel and example.
            targets:
              - global-average-head-construction
            color: cyan
            linger: 0.5
          - id: mean-collapse
            phrase: computes one mean per channel and example.
            targets:
              - global-average-head-construction
            color: cyan
            linger: 0.5
      - say: A Q-class head after flattening uses channels times height times width times Q weights, plus Q biases.
          After global average pooling it uses channels times Q weights, plus the same Q biases. For a
          supplied six-channel three-by-three map and two classes, those counts are one hundred ten and
          fourteen. Both heads still produce two logits per example, but their allowable use of spatial
          position differs.
        hold: 0.6
        visual_cues:
          - id: global-average-head-b2
            phrase: A Q-class head after flattening uses channels times height times width times Q weights, plus Q biases.
            targets:
              - global-average-head-construction
            color: cyan
            linger: 0.5
          - id: head-count
            phrase: one hundred ten and fourteen.
            targets:
              - global-average-head-construction
            color: cyan
            linger: 0.5
      - say: Look at the single bright response on the right. A nine sits among eight zeros. Max pooling
          keeps the nine. Average pooling divides the sum by nine and returns one. When a mark
          covers just one cell, the choice of pooling changes what reaches the classifier.
