  - id: transfer
    title: Predict what reversing the edge will do
    visual: The opening image and fully computed map return. A learner predicts the response sign with the result
      hidden. Reversing brightness constructs the negative map, then ReLU clips those actual values to zero.
    beats:
      - say: Return to our opening windows. The two windows crossing the edge respond, and the uniformly bright one
          gives zero. Now predict the sign if we swap dark and bright everywhere. Keep the signed weights
          fixed.
        visual_cues:
          - id: reverse-prediction
            phrase: predict the sign
            targets:
              - recap-image
              - reversed-prediction
            color: yellow
        hold: 1.3
      - say: Reverse the brightness. The left column now subtracts more than the right adds. The boundary responses
          become minus three. Library convolution layers usually apply this stored kernel orientation
          directly; our calculation follows that cross-correlation convention.
        caption_starts:
          - The boundary responses become minus three
        visual_cues:
          - id: reverse-edge
            phrase: Reverse the brightness
            targets:
              - signed-response
            color: cyan
          - id: reverse-result
            phrase: The boundary responses become minus three.
            targets:
              - signed-response
            color: green
            linger: 0.6
        hold: 0.5
      - say: Apply ReLU. Replace each negative response with zero. With this filter, the dark-to-bright edge
          survives. Reverse the edge and its response drops to zero after ReLU.
        visual_cues:
          - id: apply-relu
            phrase: replace each negative response with zero
            targets:
              - rectified-response
            color: green
        hold: 0.8
