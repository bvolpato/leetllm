scenes:
  - id: intro
    title: Where does the edge disappear?
    visual: A yellow window on a metal panel samples the passing seam. Its nine pixels appear enlarged beside
      the panel. Three neighboring samples stay in view through the prediction and the cancellation.
    beats:
      - say: Watch the bright seam enter the yellow window. On the right are the nine pixels the detector sees.
        hold: 0.6
        caption_starts:
          - On the right
        visual_cues:
          - id: opening-pan
            phrase: Watch the bright seam enter the yellow window
            targets:
              - edge-input
              - edge-choice
            color: cyan
            linger: 0.25
          - id: opening-image
            phrase: the nine pixels the detector sees
            targets:
              - edge-input
              - edge-choice
            color: yellow
            linger: 0.25
      - say: Slide it one pixel to the right. Then slide it once more. At each stop, count the bright pixels
          in the left column and in the right column. Subtract the left count from the right. Which window
          gives zero?
        hold: 3
        caption_starts:
          - At each stop
          - Which window gives zero
        visual_cues:
          - id: second-window
            phrase: Slide it one pixel to the right
            targets:
              - edge-input
            color: yellow
            linger: 0.25
          - id: third-window
            phrase: Then slide it once more
            targets:
              - edge-input
            color: yellow
            linger: 0.25
          - id: opening-left
            phrase: the left column
            targets:
              - edge-choice
            color: pink
            linger: 0.25
          - id: opening-right
            phrase: the right column
            targets:
              - edge-choice
            color: cyan
            linger: 0.25
          - id: opening-choice
            phrase: Which window gives zero
            targets:
              - edge-choice
            color: yellow
            linger: 0.25
      - say: Window C. Both columns have three bright pixels. Three minus three gives zero.
        hold: 1
        caption_starts:
          - Three minus three
        visual_cues:
          - id: opening-winner
            phrase: Window C
            targets:
              - edge-choice
            color: green
          - id: opening-zero
            phrase: Three minus three gives zero
            targets:
              - edge-choice
            color: green
  - id: pixels
    title: Brightness and arrangement tell different stories
    visual: Individual brightness cells assemble into the image. Then a uniform two-thirds patch and an edge patch
      retain the same total brightness while displaying different spatial arrangements.
    beats:
      - say: Each square stores a brightness value. Zero is dark; one is bright. The row and column tell us where that
          measurement belongs. A small window keeps neighboring pixels together.
        visual_cues:
          - id: pixel-arrivals
            phrase: Each square stores a brightness value
            targets:
              - pixel-grid
            color: blue
        hold: 0.5
      - say: Compare these two patches. Both contain the same total brightness. One is uniform, while the other has a
          boundary. Our detector needs a comparison across space to tell those arrangements apart.
        visual_cues:
          - id: equal-brightness
            phrase: Both contain the same total brightness
            targets:
              - brightness-pair
            color: cyan
        hold: 0.5
  - id: kernel
    title: Build a comparison between the two sides
    visual: Signed kernel columns appear at their spoken clauses. The same uniform and edge patches supply
      negative-left and positive-right column totals before their sums resolve.
    beats:
      - say: A filter, or kernel, is a small table of weights. Subtract the left column. Ignore the center column. Add
          the right column. These hand-chosen weights measure whether the patch becomes brighter toward the
          right.
        visual_cues:
          - id: kernel-left
            phrase: Subtract the left column
            targets:
              - edge-kernel
            color: red
          - id: kernel-center
            phrase: Ignore the center column
            targets:
              - edge-kernel
            color: blue
          - id: kernel-right
            phrase: Add the right column
            targets:
              - edge-kernel
            color: cyan
        hold: 0.5
      - say: Apply it to the uniform patch. The left side contributes minus two, and the right contributes plus two.
          Add them and the response is zero. Equal brightness on both sides cancels.
        visual_cues:
          - id: uniform-columns
            phrase: The left side contributes minus two, and the right contributes plus two
            targets:
              - kernel-comparison
            color: cyan
          - id: uniform-result
            phrase: the response is zero.
            targets:
              - kernel-comparison
            color: green
            linger: 0.5
        hold: 0.5
      - say: Now use the edge patch with the same total brightness. Its dark left side contributes zero. Its bright
          right side contributes three. The response is three. We chose these weights to find this edge.
          During training, backpropagation tells the network how to adjust its filter weights.
        visual_cues:
          - id: edge-columns
            phrase: Its dark left side contributes zero. Its bright right side contributes three
            targets:
              - kernel-comparison
            color: green
          - id: edge-result
            phrase: The response is three.
            targets:
              - kernel-comparison
            color: green
            linger: 0.5
        hold: 0.5
  - id: patch
    title: Follow one response into its map cell
    visual: Nine matched pixel-weight pairs build their products and running subtotal. The completed sum travels
      beside the arrow. The top-left map cell stays empty until the arrow arrives, then displays the sum.
      The bright third patch asks the viewer to place its zero in the map.
    beats:
      - say: Place the filter over the first window. Multiply each pixel by its matching weight, then add the
          products. Follow the highlighted pairs into the running sum. All nine terms belong to this one
          output position.
        visual_cues:
          - id: patch-accumulate
            phrase: Multiply each pixel by its matching weight, then add the products. Follow the highlighted pairs into
              the running sum
            targets:
              - patch-products
            color: green
        hold: 0.7
        motion_check:
          region:
            - 900
            - 380
            - 850
            - 650
          minimumChangedFraction: 0.002
      - say: The total is three. Follow the arrow to the top-left cell of the feature map. That cell holds the sum
          for the top-left window of the image. The kernel stays the same when we move to another window.
        visual_cues:
          - id: patch-deposit
            phrase: Follow the arrow to the top-left cell
            targets:
              - patch-sum
            color: green
        hold: 0.5
      - say: Look at the third window, filled entirely with bright pixels. Its sides cancel. Where does
          that zero belong on the map?
        visual_cues:
          - id: uniform-question
            phrase: Where does that zero belong on the map
            targets:
              - sliding-window
            color: yellow
        hold: 1.3
  - id: slide
    title: Reuse the same weights at every position
    visual: The fully bright patch earns zero, then one persistent small kernel accompanies a nine-position scan.
      Each computed scalar is deposited into its corresponding output cell.
    beats:
      - say: The zero goes in the top-right cell. Now the window steps right, then down, and every
          response lands in the matching position. Watch the same nine weights remain beside the image
          throughout the sweep.
        visual_cues:
          - id: bright-window-result
            phrase: The zero goes in the top-right cell
            targets:
              - constructed-feature-map
            color: green
          - id: sliding-sweep
            phrase: the window steps right, then down, and every response lands in the matching position
            targets:
              - sliding-window
            color: green
        hold: 0.8
        motion_check:
          region:
            - 230
            - 330
            - 1500
            - 570
          minimumChangedFraction: 0.002
      - say: Only three starting rows and three starting columns fit. They produce a three-by-three feature map. Local
          connectivity limits each measurement to its patch; weight sharing lets one learned rule serve every
          valid location.
        visual_cues:
          - id: map-complete
            phrase: three-by-three feature map
            targets:
              - constructed-feature-map
            color: green
        hold: 0.5
  - id: article-crop
    title: Which window fits the bright mark?
    visual: A three-row stencil lines up with the panel crop. Each row lights as its signed contribution enters
      the sum. One coefficient changes at a fixed placement, then the original filter scans all four windows.
    beats:
      - say: Here the camera sees a bright mark on a gray panel. Our first detector compared left and right. This
          one compares rows. Its middle row rewards brightness. Its top and bottom rows subtract it. We chose
          those weights by hand and set the bias to zero. How many places can the whole stencil fit?
        hold: 1.7
        visual_cues:
          - id: crop-weights
            phrase: This one compares rows
            targets:
              - crop-kernel
            color: cyan
            linger: 0.25
          - id: crop-shape
            phrase: How many places can the whole stencil fit
            targets:
              - crop-image
            color: yellow
            linger: 0.25
      - say: Two starts across and two down. Stay at the upper left. The dark top row costs a little. The bright
          middle row adds more than two. The bottom row takes some of that back. Add the three row
          contributions. The mark still gives a positive response.
        hold: 0.8
        visual_cues:
          - id: crop-start
            phrase: Two starts across and two down
            targets:
              - crop-image
            color: cyan
            linger: 0.25
          - id: crop-top
            phrase: The dark top row costs a little
            targets:
              - crop-terms
            color: pink
            linger: 0.25
          - id: crop-middle
            phrase: The bright middle row adds more than two
            targets:
              - crop-terms
            color: green
            linger: 0.25
          - id: crop-bottom
            phrase: The bottom row takes some of that back
            targets:
              - crop-terms
            color: pink
            linger: 0.25
          - id: crop-sum
            phrase: Add the three row contributions
            targets:
              - crop-terms
            color: green
            linger: 0.25
      - say: Try changing one weight while the window stays put. Set the upper-left weight to zero. Its pixel used
          to subtract three hundredths. Removing that penalty raises the response by three hundredths. At a
          fixed window you can correct the old sum by multiplying the aligned pixel by the change in its
          weight.
        hold: 0.8
        visual_cues:
          - id: crop-weight-edit
            phrase: Set the upper-left weight to zero
            targets:
              - crop-kernel
            color: yellow
            linger: 0.25
          - id: crop-weight-delta
            phrase: Removing that penalty raises the response by three hundredths
            targets:
              - crop-terms
            color: green
            linger: 0.25
      - say: Put the original weight back. Slide the same stencil right, down and across to finish the map. The
          strongest match is at the bottom right. PyTorch slides the stored weights in this orientation.
          That's cross-correlation. Mathematical convolution flips the stencil across both axes first. Our
          ridge stencil looks the same after a flip. An asymmetric imported filter can change its answer. A
          freely learned filter can learn either orientation.
        hold: 0.9
        visual_cues:
          - id: crop-restore
            phrase: Put the original weight back
            targets:
              - crop-kernel
            color: cyan
            linger: 0.25
          - id: crop-map
            phrase: Slide the same stencil right, down and across to finish the map
            targets:
              - crop-image
            color: yellow
            linger: 0.25
          - id: crop-max
            phrase: The strongest match is at the bottom right
            targets:
              - crop-terms
            color: green
            linger: 0.25
          - id: crop-orientation
            phrase: flips the stencil across both axes first
            targets:
              - crop-kernel
            color: cyan
            linger: 0.25
  - id: sharing-budget
    title: Who owns the filter weights?
    visual: A bank of local filters is copied to many fixed output sites, then the copies converge on one
      shared bank. Two neighboring windows read different pixels through that bank.
    beats:
      - say: Consider a color panel photo, two hundred twenty-four pixels on a side. A dense layer with two hundred
          fifty-six outputs gives every output a weight for every color value, plus a bias. That's over
          thirty-eight million parameters. Give a local detector nine pixels in each of the three colors and
          one bias. Sixteen such filters need four hundred forty-eight parameters.
        hold: 0.7
        visual_cues:
          - id: sharing-budget-b1
            phrase: Consider a color panel photo
            targets:
              - sharing-budget-construction
            color: cyan
            linger: 0.25
          - id: dense-budget
            phrase: over thirty-eight million parameters
            targets:
              - sharing-budget-construction
            color: cyan
            linger: 0.25
          - id: conv-budget
            phrase: four hundred forty-eight parameters
            targets:
              - sharing-budget-construction
            color: green
            linger: 0.25
      - say: Those layers produce different things. One gives global scores. The other gives sixteen maps. Keep
          those maps exactly the same size. Give each position its own private bank of filters. Now the same
          size bank has to be stored more than forty-nine thousand times. That costs over twenty-two million
          parameters. Tie all those banks back to one shared owner, and the count returns to four hundred
          forty-eight.
        hold: 0.8
        visual_cues:
          - id: sharing-budget-b2
            phrase: Keep those maps exactly the same size
            targets:
              - sharing-budget-construction
            color: cyan
            linger: 0.25
          - id: private-banks
            phrase: Give each position its own private bank of filters
            targets:
              - sharing-budget-construction
            color: cyan
            linger: 0.25
          - id: retie-banks
            phrase: Tie all those banks back to one shared owner
            targets:
              - sharing-budget-construction
            color: cyan
            linger: 0.25
          - id: retie-count
            phrase: the count returns to four hundred forty-eight
            targets:
              - sharing-budget-construction
            color: green
            linger: 0.25
      - say: Follow one local window. Move it one pixel right. Its neighbors change, but it uses the same weights.
          The window sets which pixels an output reads. Sharing sets how many copies of the weights you have
          to learn. Flattening the photo preserves its pixels and their order. A dense layer would have to
          learn the reuse from examples. To compare speed, time the layers on the hardware you plan to use.
        hold: 0.8
        visual_cues:
          - id: sharing-budget-b3
            phrase: Follow one local window
            targets:
              - sharing-budget-construction
            color: cyan
            linger: 0.25
          - id: local-shift
            phrase: Move it one pixel right
            targets:
              - sharing-budget-construction
            color: yellow
            linger: 0.25
  - id: translation
    title: Does the peak follow the edge?
    visual: In the full image, a one-pixel shift moves the responses while their global maximum holds. On a
      six-pixel strip, fixed stride-two pairs can miss the shifted edge altogether.
    beats:
      - say: Move the boundary one pixel right. Find the two columns that lit up in the old map. Both move one
          place in the new map. We call that translation equivariance. At stride one, away from the image
          border, the response follows the pattern.
        hold: 0.6
        visual_cues:
          - id: translated-edge
            phrase: Move the boundary one pixel right
            targets:
              - translated-input
            color: blue
            linger: 0.25
        motion_check:
          region:
            - 230
            - 330
            - 1500
            - 570
          minimumChangedFraction: 0.002
      - say: Follow each number down the arrow. The green box keeps the largest value it has received so far.
          After the ninth cell, that's the global maximum. Both crops have a peak of three. That one number
          tells you the detector fired somewhere. Its address is gone. At the edge of a finite crop, some
          comparisons can disappear.
        hold: 0.6
        visual_cues:
          - id: max-aggregate
            phrase: Follow each number down the arrow. The green box keeps the largest value it has received so far
            targets:
              - translated-response
            color: green
            linger: 0.25
      - say: Try a detector just two pixels wide on a single row. Subtract the left pixel from the right. Step two
          pixels at a time. The brackets show every pair it gets to read. The first pair straddles the edge.
          Now move the edge one place right, keeping the brackets fixed. Will the strongest response survive?
        hold: 2.5
        visual_cues:
          - id: pair-read
            phrase: The brackets show every pair it gets to read
            targets:
              - stride-pairs
            color: cyan
            linger: 0.25
          - id: pair-original
            phrase: The first pair straddles the edge
            targets:
              - stride-pairs
            color: green
            linger: 0.25
          - id: pair-shift
            phrase: move the edge one place right, keeping the brackets fixed
            targets:
              - stride-pairs
            color: yellow
            linger: 0.25
      - say: Read the same three pairs again. Both pixels in each pair now have the same brightness. Every
          difference is zero, so the peak disappears. The edge is still there, between the brackets. At
          stride two, a one-pixel shift can change what the detector even gets to measure.
        hold: 0.9
        caption_starts:
          - Both pixels in each pair
          - Every difference is zero
        visual_cues:
          - id: pair-read-again
            phrase: Read the same three pairs again
            targets:
              - stride-pairs
            color: cyan
            linger: 0.25
          - id: pair-peak
            phrase: Every difference is zero, so the peak disappears
            targets:
              - stride-pairs
            color: green
            linger: 0.25
  - id: stride-padding
    title: Where can the whole window fit?
    visual: The five-by-five image stays at fixed coordinates. Stride two skips alternate starts. The scene
      restores unit stride before a ring of zero-valued cells appears outside the image. Two positive
      products survive along the top.
    beats:
      - say: Back on the five-by-five image, use the original three-by-three filter. Move two cells at a time, both
          across and down. Four complete windows fit. That's where the two rows and two columns of this map
          come from.
        hold: 0.6
        visual_cues:
          - id: stride-scan
            phrase: Move two cells at a time, both across and down
            targets:
              - stride-source-grid
            color: yellow
            linger: 0.25
      - say: First return to steps of one pixel. The unpadded image gives us three starts on each axis again. Now
          add a ring of zeros outside the image. Look at the window that sticks out over the top. Only two
          bright pixels contribute on the positive side. The top row of this window sits in the padding,
          so the sum is two.
        hold: 0.7
        visual_cues:
          - id: restore-stride
            phrase: return to steps of one pixel
            targets:
              - stride-source-grid
            color: cyan
            linger: 0.25
          - id: padding-build
            phrase: add a ring of zeros outside the image
            targets:
              - stride-source-grid
            color: cyan
            linger: 0.25
          - id: boundary-calculate
            phrase: Only two bright pixels contribute on the positive side
            targets:
              - boundary-products
            color: yellow
            linger: 0.25
      - say: Follow the window around the border and fill in the remaining responses. Including the padding, this
          image is seven cells wide. A three-wide window can start in five places. The same count holds
          vertically. With adjacent weights, subtract the kernel width from the padded width, divide by the
          stride, round down and add one for the first start.
        hold: 0.7
        visual_cues:
          - id: padded-sweep
            phrase: Follow the window around the border and fill in the remaining responses
            targets:
              - stride-response-grid
            color: green
            linger: 0.25
          - id: shape-rule
            phrase: subtract the kernel width from the padded width
            targets:
              - output-size-rule
            color: cyan
            linger: 0.25
        motion_check:
          region:
            - 130
            - 330
            - 1600
            - 560
          minimumChangedFraction: 0.002
  - id: shape-dilation
    title: Count starts using the complete kernel footprint
    beats:
      - say: Stride changes the gap between starts. Dilation changes the gap between weights inside one placement. A
          three-by-three kernel at dilation two still has nine weights, but spans five-by-five positions. Its
          effective span is dilation multiplied by the quantity kernel size minus one, then plus one.
        hold: 0.6
        visual_cues:
          - id: shape-dilation-b1
            phrase: Stride changes the gap between starts.
            targets:
              - shape-dilation-construction
            color: cyan
            linger: 0.5
          - id: dilate-weights
            phrase: A three-by-three kernel at dilation two still has nine weights, but spans five-by-five positions.
            targets:
              - shape-dilation-construction
            color: cyan
            linger: 0.5
      - say: Slide that five-pixel footprint along a row of twenty-eight pixels. Each dot marks a start where
          the whole window fits. The last four pixels have too little room to start a window. That leaves
          twenty-four starts.
          For each axis, take the padded length, subtract the effective span and divide by the stride.
          Round down and add one to count the first placement.
        hold: 0.6
        caption_starts:
          - That leaves twenty-four starts
        visual_cues:
          - id: shape-dilation-b2
            phrase: Slide that five-pixel footprint
            targets:
              - shape-dilation-construction
            color: cyan
            linger: 0.5
          - id: dilated-starts
            phrase: Slide that five-pixel footprint along a row of twenty-eight pixels. Each dot marks a start where the whole window fits. The last four pixels have too little room to start a window. That leaves twenty-four starts
            targets:
              - shape-dilation-construction
            color: cyan
            linger: 0.5
      - say: At stride one, same-size padding adds a total of dilation multiplied by the quantity kernel size minus
          one extra positions, split across the two sides. An odd total requires unequal sides. PyTorch same
          padding supports stride one. For valid padding there are no synthetic positions. Shape checks
          require positive kernel, stride and dilation, nonnegative padding, and a footprint that fits the
          padded input.
        hold: 0.8
        visual_cues:
          - id: shape-dilation-b3
            phrase: At stride one, same-size padding adds a total of dilation multiplied by the quantity kernel size minus
              one extra positions, split across the two sides.
            targets:
              - shape-dilation-construction
            color: cyan
            linger: 0.5
          - id: same-padding
            phrase: An odd total requires unequal sides.
            targets:
              - shape-dilation-construction
            color: cyan
            linger: 0.5
    visual: Count starts using the complete kernel footprint.
  - id: channels
    title: Several input channels contribute to one output
    visual: Two input-channel patches each pair with a distinct kernel. Their actual products give three and
      three, which accumulate into six. A second filter reverses the first channel kernel and yields minus
      three plus three equals zero.
    beats:
      - say: A color image has several input channels. Our small example uses two. One output filter has a kernel for
          each channel. Compute each patch sum, then add the contributions. Here, three plus three gives one
          output value of six. We use zero bias.
        visual_cues:
          - id: channel-first
            phrase: Compute each patch sum
            targets:
              - channel-first
            color: blue
          - id: channel-second
            phrase: then add the contributions
            targets:
              - channel-second
            color: cyan
          - id: channel-sum
            phrase: three plus three gives one output value of six
            targets:
              - channel-sum-rule
            color: green
        hold: 0.5
      - say: A second output filter gets its own weights. Reverse the first channel kernel and retain the second. The
          channel contributions become minus three and plus three, so this filter gives zero at the same
          position. Multiple filters create multiple output maps.
        visual_cues:
          - id: second-filter
            phrase: Reverse the first channel kernel and retain the second
            targets:
              - channel-first
            color: pink
          - id: second-channel-sum
            phrase: this filter gives zero
            targets:
              - channel-sum-rule
            color: green
        hold: 0.5
  - id: grouped-connectivity
    title: One output sums only its declared input-channel group
    beats:
      - say: "With groups one, each output filter sees all input channels. Its stored shape is output channels by
          input channels by kernel height by kernel width. Add one bias per output filter. A batch keeps its
          own axis: batch, input channels, height, width becomes batch, output channels, output height, output
          width. Each image in the batch gets its own six output maps."
        hold: 0.6
        visual_cues:
          - id: grouped-connectivity-b1
            phrase: With groups one, each output filter sees all input channels.
            targets:
              - grouped-connectivity-construction
            color: cyan
            linger: 0.5
      - say: Split the channels into two groups. Each filter sees input
          channels divided by groups, and both channel counts must divide evenly by the group count. With four
          inputs, six outputs, two groups and three-by-three weights, each output reads two channels. Six
          times two times nine, plus six biases, gives one hundred fourteen parameters. A change in the first
          input can now reach only the three filters in its group.
        hold: 0.6
        visual_cues:
          - id: grouped-connectivity-b2
            phrase: Split the channels into two groups.
            targets:
              - grouped-connectivity-construction
            color: cyan
            linger: 0.5
          - id: disconnect-groups
            phrase: Each filter sees input channels divided by groups
            targets:
              - grouped-connectivity-construction
            color: cyan
            linger: 0.5
          - id: group-count
            phrase: Six times two times nine, plus six biases, gives one hundred fourteen parameters.
            targets:
              - grouped-connectivity-construction
            color: cyan
            linger: 0.5
      - say: In general the parameter count is output channels multiplied by input channels divided by groups,
          multiplied by kernel height and width, then plus output biases when enabled. Double the image
