  - id: patch-projection
    title: The same patch projection can be written as a convolution
    beats:
      - say: A vision transformer begins by cutting nonoverlapping image patches and linearly projecting each
          flattened patch into a D-dimensional token. For a P-by-P RGB patch, the flat vector has three times
          P squared entries. The same projection at every patch is a convolution with kernel P, stride P and D
          output channels, when coefficient ordering and bias agree.
        hold: 0.6
        visual_cues:
          - id: patch-projection-b1
            phrase: A vision transformer begins by cutting nonoverlapping image patches and linearly projecting each
              flattened patch into a D-dimensional token.
            targets:
              - patch-projection-construction
            color: cyan
            linger: 0.5
          - id: patch-extract
            phrase: cutting nonoverlapping image patches
            targets:
              - patch-projection-construction
            color: cyan
            linger: 0.5
      - say: Use a supplied four-by-four grayscale image, two-by-two patches and three output features. Each patch has
          four values, so the shared projection has twelve weights and three biases. Four patches produce four
          three-feature tokens. Reshape each output row’s four weights into its two-by-two convolution kernel,
          preserving the same row and column order. The two implementations now sum the same owners into each
          token.
        hold: 0.6
        visual_cues:
          - id: patch-projection-b2
            phrase: Use a supplied four-by-four grayscale image, two-by-two patches and three output features.
            targets:
              - patch-projection-construction
            color: cyan
            linger: 0.5
          - id: patch-weights
            phrase: twelve weights and three biases.
            targets:
              - patch-projection-construction
            color: cyan
            linger: 0.5
          - id: patch-reshape
            phrase: Reshape each output row’s four weights into its two-by-two convolution kernel, preserving the same row
              and column order. The two implementations now sum the same owners into each token.
            targets:
              - patch-projection-construction
            color: cyan
            linger: 0.5
      - say: Follow a patch after the projection. A convolution reads neighboring positions through a local
          window. In the original vision transformer, self-attention can mix any pair of patches. Even the
          two opposite corners can exchange information in one layer. A learned position vector tells the
          model where each patch came from.
        hold: 0.8
        visual_cues:
          - id: patch-projection-b3
            phrase: Follow a patch after the projection
            targets:
              - patch-projection-construction
            color: cyan
            linger: 0.5
          - id: patch-mix
            phrase: self-attention can mix any pair of patches
            targets:
              - patch-projection-construction
            color: cyan
            linger: 0.5
