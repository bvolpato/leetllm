      - say: The fourteen earlier errors in this fixture have mean point five and root mean square about one point
          seven five jobs. Root mean square squares each signed error, averages those squares, then takes the
          square root. It measures deviation around zero; the sample standard deviation around an estimated
          mean uses a different centering and denominator.
