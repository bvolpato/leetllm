            targets: [monitor-trace]
            caption_boundary: true
      - say: Waiting for a second sample filters out short excursions and delays detection. A separate cooldown can suppress repeated notifications for a time. Keep state for each cluster and give an urgent capacity symptom its own route.
        hold: 0.75
  - id: state-trace
    title: Follow one review through eight checks
    visual: The article’s five-minute errors feed the same two counters and stepped state line. A later breach interrupts the first attempt to clear.
    beats:
      - say: Start a fresh monitor at minute zero. These eight readings come five minutes apart. Four and five are both above the three-job band. The first starts a run. The second opens a review at minute five, five minutes after the first breach.
        hold: 0.85
