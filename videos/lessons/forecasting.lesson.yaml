    visual: Groups of one hundred daily forecasts show the expected number of threshold crossings. Four rows of minute checks then follow one cluster through a sustained spike. A separate three-reading example shows how different thresholds open and clear a review.
    beats:
      - say: Make one daily forecast for each of a hundred clusters. If each band covers ninety-five percent of outcomes, expect five misses per hundred forecasts. Scale that up to a thousand clusters. That gives fifty crossings per day on average. A shared launch can make several clusters cross together. You still add each cluster’s chance of crossing to get the expected total.
