            phrase: The second opens a review at minute five
            targets: [monitor-trace]
            caption_boundary: true
      - say: Minute ten has no reading. Reset both counters and carry the open state across the gap. At fifteen the error is four. At twenty it falls to two. That’s the first clean check. Look one sample ahead. Will the review clear at twenty-five?
        hold: 2
        visual_cues:
          - id: fc-state-trace-missing
            phrase: Minute ten has no reading
            targets: [monitor-trace]
            caption_boundary: true
          - id: fc-state-trace-fifteen
            phrase: At fifteen the error is four
            targets: [monitor-trace]
            caption_boundary: true
          - id: fc-state-trace-twenty
            phrase: At twenty it falls to two
            targets: [monitor-trace]
            caption_boundary: true
      - say: It stays open. Four at twenty-five breaks the clean run. At thirty the error is zero. At thirty-five it is minus one. Two clean checks in succession clear the review.
        hold: 0.85
        visual_cues:
          - id: fc-state-trace-twenty-five
            phrase: Four at twenty-five breaks the clean run
            targets: [monitor-trace]
            caption_boundary: true
          - id: fc-state-trace-thirty
            phrase: At thirty the error is zero
            targets: [monitor-trace]
            caption_boundary: true
          - id: fc-state-trace-clear
            phrase: Two clean checks in succession clear the review
            targets: [monitor-trace]
            caption_boundary: true
      - say: Only the change from inactive to active requested a review. Preserve the state across checks for this series. A late sample needs a rule about which run it belongs to. A missing or invalid count needs its own handling before it can affect the state.
        hold: 0.75
  - id: joint-detector
    title: Project the same pair and expose the blind spot
    visual: Equal-scale axes retain marginal square[-1,1]². Point(1,−1) projects to(0,0), squared distance2.
      Point(5,5) remains beyond ranges while reconstructing exactly on the diagonal.
    beats:
      - say: A supplied standardized two-metric reference places healthy pairs near the diagonal where both
          coordinates agree. The point one, minus one lies inside each individual range from minus one to one,
          yet violates that relationship. Project onto the diagonal by averaging the coordinates, then
          repeating that mean for both reconstructed coordinates.
        hold: 0.7
        visual_cues:
          - id: fc-joint-detector-point
            phrase: point one, minus one
            targets:
              - fc-joint-detector-mechanism
            color: cyan
            linger: 0.4
      - say: "The mean of one and minus one is zero, so the reconstruction is zero, zero. Squared reconstruction error
          sums each coordinate’s squared difference: one squared plus minus one squared equals two. Separate
          range checks miss this point. Now change the input to five, five: both coordinates exceed their
          ranges, but the diagonal reconstructs it exactly and the reconstruction score is zero."
        hold: 0.7
        visual_cues:
          - id: fc-joint-detector-projection
            phrase: reconstruction is zero, zero
            targets:
              - fc-joint-detector-mechanism
            color: cyan
            linger: 0.4
          - id: fc-joint-detector-two
            phrase: equals two
            targets:
              - fc-joint-detector-mechanism
            color: yellow
            linger: 0.4
          - id: fc-joint-detector-five
            phrase: five, five
            targets:
              - fc-joint-detector-mechanism
            color: cyan
            linger: 0.4
          - id: fc-joint-detector-zero
            phrase: score is zero
            targets:
              - fc-joint-detector-mechanism
            color: cyan
            linger: 0.4
      - say: Look at the two points together. The range check catches five, five. The distance from the diagonal catches one, minus one. PCA can learn a line like this from healthy pairs. A constrained autoencoder can learn a curved relationship. Isolation Forest uses random splits. Points with shorter average paths through its trees score as more unusual. Fit the scale and detector on earlier healthy data. Use later labeled periods to check which scores deserve a review.
        hold: 0.7
        caption_starts: [PCA can learn a line, Isolation Forest uses random splits, Fit the scale and detector]
        visual_cues:
          - id: fc-joint-detector-forest
            phrase: Isolation Forest uses random splits
            targets:
              - fc-joint-detector-mechanism
            color: cyan
            linger: 0.4
