scenes:
  - id: intro
    title: Friday’s batch jobs
    visual: A copy of last Friday’s count slides onto the next Friday’s calendar page. The three-job band opens around the forecast. The observed count lands on the same scale.
    beats:
      - say: Slide last Friday’s count onto this Friday. A hundred and thirty-two batch jobs. On Thursday evening, that’s our forecast for tomorrow.
        caption_starts: [A hundred and thirty-two batch jobs, On Thursday evening]
        hold: 0.65
        visual_cues:
          - id: fc-intro-copy
            phrase: Slide last Friday’s count onto this Friday
            targets: [friday-chart]
            caption_boundary: true
      - say: On earlier days this rule missed by at most three jobs. Give the forecast three jobs on either side. Friday’s review band runs from a hundred and twenty-nine to a hundred and thirty-five.
        caption_starts: [Friday’s review band runs]
        hold: 0.6
        visual_cues:
          - id: fc-intro-band
            phrase: Give the forecast three jobs on either side
            targets: [friday-chart]
            caption_boundary: true
      - say: Friday closes at a hundred and sixty jobs. Does that cross the band? How far above forecast did the cluster finish?
        caption_starts: [Does that cross the band]
        hold: 2.5
        visual_cues:
          - id: fc-intro-observed
            phrase: Friday closes at a hundred and sixty jobs
            targets: [friday-chart]
            caption_boundary: true
      - say: Twenty-eight jobs above forecast. That earns a review. There’s a launch on the calendar. Check the job IDs for duplicates and the cluster for signs it’s running out of capacity.
        hold: 0.95
        visual_cues:
          - id: fc-intro-gap
            phrase: Twenty-eight jobs above forecast
            targets: [friday-chart]
            caption_boundary: true
          - id: fc-intro-review
            phrase: That earns a review
            targets: [friday-action]
            caption_boundary: true
  - id: clock-contract
    title: What could Sunday’s forecaster know?
    visual: The last week of the January calendar stays closed at a fixed Sunday origin. A planned launch is known in advance. A delayed Sunday report changes the most recent usable count.
    beats:
      - say: Rewind to Sunday evening, January twenty-fifth. We have four weeks of example data for one cluster, from January fifth through February first. Each cell is one day of outbound batch jobs. From this Sunday, dates in the bottom row are still in the future. Friday’s launch is already on the calendar.
        hold: 0.7
        visual_cues:
          - id: fc-clock-contract-calendar
            phrase: Rewind to Sunday evening
            targets: [clock-calendar]
            caption_boundary: true
      - say: Issue a forecast after Sunday’s count is final. Sunday evening is the origin. Monday is the target, one day ahead. If you issue all seven forecasts tonight, the dates stay put. Their horizons run from one day through seven.
        hold: 0.85
        visual_cues:
          - id: fc-clock-contract-origin
            phrase: Monday is the target
            targets: [clock-calendar]
            caption_boundary: true
          - id: fc-clock-contract-weekly
            phrase: Their horizons run from one day through seven
            targets: [clock-calendar]
            caption_boundary: true
      - say: Now delay the Sunday report. The calendar still says Sunday, but Saturday has the latest count you can use. A missing report leaves the count unknown. Using zero would invent an observation. In production, keep the time of the observation and the time it arrived. Check the time zone and missing dates before treating seven rows as seven days.
        hold: 0.8
        visual_cues:
          - id: fc-clock-contract-missing
            phrase: Now delay the Sunday report
            targets: [clock-calendar]
            caption_boundary: true
          - id: fc-clock-contract-availability
            phrase: Saturday has the latest count you can use
            targets: [clock-calendar]
            caption_boundary: true
  - id: additive-decomposition
    title: How much of Friday’s count can we account for?
    visual: The first week’s seven bars share a mean line. Friday’s level and weekday offset move into a separate launch-day stack. A supplied launch contribution and the unexplained remainder close the gap to the observation.
    beats:
      - say: Look at the first week. Friday is the high day and Sunday is the low day. Draw a line at the weekly mean, a hundred and five jobs. Measure each day from that line. Friday is twenty-seven jobs above it. Sunday is twenty-nine below it. Those repeating weekday differences are what a seasonal term tries to capture.
        hold: 0.75
        visual_cues:
          - id: fc-additive-decomposition-mean
            phrase: Draw a line at the weekly mean
            targets: [decomposition-week]
            caption_boundary: true
          - id: fc-additive-decomposition-offsets
            phrase: Measure each day from that line
            targets: [decomposition-week]
            caption_boundary: true
      - say: Carry Friday’s level and weekday offset over to launch day. Suppose the launch adds twenty jobs. With that assumption, the three pieces together predict a hundred and fifty-two. We observed a hundred and sixty. How many jobs are still unexplained?
        hold: 2.1
        visual_cues:
          - id: fc-additive-decomposition-launch
            phrase: Suppose the launch adds twenty jobs
            targets: [decomposition-friday]
            caption_boundary: true
          - id: fc-additive-decomposition-sum
            phrase: together predict a hundred and fifty-two
            targets: [decomposition-friday]
            caption_boundary: true
      - say: Eight jobs remain. The remainder is what’s left after the level, the seasonal contribution and the assumed launch effect. A counting error could sit there. So could work carried over in a backlog. If those misses persist, past misses may help predict the next one.
        hold: 0.85
        visual_cues:
          - id: fc-additive-decomposition-remainder
            phrase: Eight jobs remain
            targets: [decomposition-friday]
            caption_boundary: true
      - say: A changing level over time would be a trend. Four constructed weeks give us a reference level and a weekly pattern. To study hourly cycles, we’d need finer observations. A seven-day lag can also miss a month-end effect.
        hold: 0.7
  - id: proportional-seasonality
    title: A changing level changes the choice of seasonal model
    visual: Friday’s same original132 supplies both a+27 offset and132/105 ratio. Moving only the level105→120
      yields147 versus150.857 on one shared axis.
    beats:
      - say: An additive seasonal effect stays fixed in job units. A multiplicative effect scales with the level.
          Starting from Friday one hundred thirty-two at level one hundred five, the additive offset is
          twenty-seven and the proportional factor is one hundred thirty-two divided by one hundred five. Both
          describe the same original point.
        hold: 0.7
        visual_cues:
          - id: fc-proportional-seasonality-same
            phrase: Both describe the same original point
            targets:
              - fc-proportional-seasonality-mechanism
            color: cyan
            linger: 0.4
      - say: Now supply a new level of one hundred twenty, keeping each fitted seasonal description fixed. Adding
          twenty-seven predicts one hundred forty-seven. Multiplying by that ratio predicts about one hundred
          fifty point eight six. On later Fridays, compare the misses. Does the Friday bump stay close to
          twenty-seven jobs, or does it grow with the weekly level?
        hold: 0.7
        visual_cues:
          - id: fc-proportional-seasonality-level
            phrase: new level of one hundred twenty
            targets:
              - fc-proportional-seasonality-mechanism
            color: cyan
            linger: 0.4
          - id: fc-proportional-seasonality-additive
            phrase: predicts one hundred forty-seven
            targets:
              - fc-proportional-seasonality-mechanism
            color: cyan
            linger: 0.4
          - id: fc-proportional-seasonality-proportional
            phrase: one hundred fifty point eight six
            targets:
              - fc-proportional-seasonality-mechanism
            color: cyan
            linger: 0.4
      - say: For positive quantities, logarithms turn a product of level, seasonal factor and remainder into a sum.
          Exponentiating a predicted log mean generally does not recover the original-scale mean;
          back-transformation needs a distribution-aware bias adjustment. Zero counts need another model or a
          different transform such as log one plus the count, whose interpretation changes.
        hold: 0.7
        visual_cues:
          - id: fc-proportional-seasonality-logs
            phrase: logarithms turn a product
            targets:
              - fc-proportional-seasonality-mechanism
            color: cyan
            linger: 0.4
  - id: seasonal-baseline
    title: Compare tomorrow with the matching day last week
    visual: The input row holds Sunday's 78 and the prior Monday's 104. The result table reveals yesterday-copy
      error 25, then same-weekday error 1 against Monday's 103.
    beats:
      - say: Start with a model that respects the weekly pattern. On Sunday evening, the latest count is 78, while
          last Monday’s count was 104. Tomorrow is Monday, when the cluster usually carries weekday work.
        hold: 0.55
        visual_cues:
          - id: seasonal-baseline-beat-1-focus-1
            phrase: Start with a model that respects the weekly pattern
            targets:
              - seasonal-model-rule
            color: blue
            linger: 0.6
          - id: seasonal-baseline-latest-count
            phrase: the latest count is 78
            targets:
              - seasonal-sunday-count
            color: cyan
            linger: 0.6
          - id: seasonal-baseline-prior-monday
            phrase: last Monday’s count was 104
            targets:
              - seasonal-prior-monday
            color: blue
            linger: 0.6
          - id: seasonal-baseline-target-day
            phrase: Tomorrow is Monday
            targets:
              - seasonal-target-day
            color: yellow
            linger: 0.6
      - say: Copying yesterday predicts 78 and misses the actual 103 by 25 jobs. Copying the same weekday last week
          predicts 104 and misses by one.
        hold: 0.6
        visual_cues:
          - id: seasonal-baseline-yesterday-result
            phrase: Copying yesterday predicts 78 and misses the actual 103 by 25 jobs
            targets:
              - seasonal-yesterday-result
            color: blue
            linger: 0.6
          - id: seasonal-baseline-weekday-result
            phrase: Copying the same weekday last week predicts 104 and misses by one
            targets:
              - seasonal-weekday-result
            color: green
            linger: 0.6
      - say: A seasonal-naive forecast carries the previous weekly pattern forward. It gives us a reference point. A
          more complex model earns its place by improving later forecast origins.
        hold: 0.7
        visual_cues:
          - id: seasonal-baseline-beat-3-focus-1
            phrase: A seasonal-naive forecast carries the previous weekly pattern forward
            targets:
              - seasonal-model-rule
            color: blue
            linger: 0.6
  - id: fixed-origin
    title: How far can Sunday’s forecast reach?
    visual: A seven-day bracket links each future target to the row it would copy. It slides one day past Sunday's origin, then returns to the most recent observed Monday for the seasonal replay.
    beats:
      - say: Stop the clock at Sunday evening, January twenty-fifth. The last observed row is index twenty. For a target seven days ahead, the weekly lookup goes back seven rows. Follow the left end of the bracket. All seven targets this week can read an observation that Sunday already has.
        hold: 0.7
        visual_cues:
          - id: fc-fixed-origin-h7
            phrase: goes back seven rows
            targets: [fixed-calendar]
            caption_boundary: true
      - say: For next Sunday the lookup returns seventy-eight jobs. Now slide the target one day farther, to Monday, February second. The left end moves too. With the origin still at index twenty, can this lookup issue the eighth forecast?
        hold: 2.4
        visual_cues:
          - id: fc-fixed-origin-seven
            phrase: the lookup returns seventy-eight jobs
            targets: [fixed-result]
            caption_boundary: true
          - id: fc-fixed-origin-future
            phrase: slide the target one day farther
            targets: [fixed-calendar]
            caption_boundary: true
      - say: It rejects the request. Index twenty-eight minus seven lands on twenty-one, the Monday after issuance. Monday’s eventual count of a hundred and three belongs on the far side of the line. Reading it here would leak the answer.
        hold: 0.85
        visual_cues:
          - id: fc-fixed-origin-reject
            phrase: It rejects the request
            targets: [fixed-result]
            caption_boundary: true
      - say: A seasonal forecast can still go farther. Repeat the last whole week you actually observed. For a Monday target, take the most recent observed Monday. That was January nineteenth, with a hundred and four jobs. Compare models using the same origin and horizon so each gets the same history.
        hold: 0.85
        visual_cues:
          - id: fc-fixed-origin-repair
            phrase: take the most recent observed Monday
            targets: [fixed-calendar]
            caption_boundary: true
          - id: fc-fixed-origin-repeated
            phrase: with a hundred and four jobs
            targets: [fixed-result]
            caption_boundary: true
  - id: time-order
    title: Evaluate only after the forecast origin
    visual: A shuffled split puts Jan 31 in training while Jan 6 is held out. A date-ordered timeline then marks
      the Jan 25 cutoff and advances the origin through later targets.
    beats:
      - say: A forecasting model must predict beyond the information it used to fit. If January 31 is in training
          while January 6 is held out for testing, the score has already seen the future.
        hold: 0.55
        visual_cues:
          - id: time-order-shuffled-split
            phrase: A forecasting model must predict beyond the information it used to fit
            targets:
              - time-order-shuffled-split
            color: blue
            linger: 0.6
          - id: time-order-beat-1-jan31
            phrase: If January 31 is in training
            targets:
              - time-order-jan31-training
            color: blue
            linger: 0.6
          - id: time-order-beat-1-jan6
            phrase: while January 6 is held out for testing
            targets:
              - time-order-jan6-heldout
            color: pink
            linger: 0.6
          - id: time-order-beat-1-leak
            phrase: the score has already seen the future
            targets:
              - time-order-jan31-training
              - time-order-jan6-heldout
            color: blue
            linger: 0.6
      - say: Sort each feature by when it became available, then keep training earlier than the first test target. A
          timestamped table can still leak if its rolling average includes later days.
        hold: 0.6
        visual_cues:
          - id: time-order-feature-availability
            phrase: Sort each feature by when it became available
            targets:
              - time-order-feature-availability
            color: blue
            linger: 0.6
          - id: time-order-chronological-split
            phrase: then keep training earlier than the first test target
            targets:
              - time-order-chronological-split
              - time-order-test-window
            color: blue
            linger: 0.6
      - say: Rolling-origin evaluation advances the forecast date and measures the next observations repeatedly. In
          this fixture, one week has MAE 0.9 jobs and the launch week has 5.3. The difference is useful
          context.
        hold: 0.7
        visual_cues:
          - id: time-order-rolling-origin
            phrase: Rolling-origin evaluation advances the forecast date and measures the next observations repeatedly
            targets:
              - time-order-test-window
            color: blue
            linger: 0.6
          - id: time-order-earlier-mae-result
            phrase: one week has MAE 0.9 jobs
            targets:
              - time-order-earlier-mae
            color: cyan
            linger: 0.6
          - id: time-order-launch-mae-result
            phrase: and the launch week has 5.3
            targets:
              - time-order-launch-mae
            color: blue
            linger: 0.6
  - id: sarimax-contract
    title: What changes when we account for the launch?
    visual: Two Friday bars start at 132 and 160 jobs. Removing the assumed 20-job launch contribution from the second bar leaves 140. A bracket measures the remaining eight-job difference.
    beats:
      - say: These two Fridays were a week apart. Only the second had a scheduled launch. A SARIMAX model can use a launch flag as an input. Write the count as the launch contribution plus a remainder. That remainder is the regression error. The seasonal part of this model compares errors seven days apart. Its autoregressive and moving-average terms use past errors and past surprises to model what happens next.
        hold: 0.7
        visual_cues:
          - id: fc-sarimax-contract-equation
            phrase: the launch contribution plus a remainder
            targets:
              - fc-sarimax-contract-mechanism
            color: cyan
            linger: 0.4
      - say: Give the launch a coefficient of twenty jobs. Mark those twenty jobs in yellow on the second Friday. A hundred and sixty minus twenty leaves a hundred and forty. Last Friday had no launch, so its remainder is the full hundred and thirty-two. The seasonal difference is eight. Comparing the two raw counts would give twenty-eight. Twenty of those jobs were already in our launch term.
        caption_starts: [A hundred and sixty minus twenty, The seasonal difference is eight, Comparing the two raw counts]
        hold: 0.7
        visual_cues:
          - id: fc-sarimax-contract-regressor
            phrase: Mark those twenty jobs in yellow on the second Friday
            targets:
              - fc-sarimax-contract-mechanism
            color: cyan
            linger: 0.4
          - id: fc-sarimax-contract-difference
            phrase: seasonal difference is eight
            targets:
              - fc-sarimax-contract-mechanism
            color: cyan
            linger: 0.4
          - id: fc-sarimax-contract-raw
            phrase: would give twenty-eight
            targets:
              - fc-sarimax-contract-mechanism
            color: cyan
            linger: 0.4
      - say: We supplied twenty for this example. If you fit that coefficient from history, it describes the association between launches and counts. For a future Friday, use the launch plan available at issuance. If the plan is uncertain, try both settings. Each interval is conditional on the setting you chose. Fitting a separate model for each of twenty-five thousand containers means learning each pattern separately. A pooled model can learn across containers.
        caption_starts: [For a future Friday, Fitting a separate model]
        hold: 0.7
        visual_cues:
          - id: fc-sarimax-contract-future
            phrase: use the launch plan available at issuance
            targets:
              - fc-sarimax-contract-mechanism
            color: cyan
            linger: 0.4
  - id: origin-features
    title: Build every feature from its availability time
    visual: The same origin boundary admits t−1/t−7 and a shifted rolling window, blocks a centered window, and
      distinguishes a known launch calendar from a future realized measurement.
    beats:
      - say: A boosted-tree forecaster turns this into supervised regression. For a target at time t issued after t
          minus one, possible inputs include observed lags one, two, seven and fourteen, plus rolling mean,
          spread, minimum and maximum ending at t minus one. A centered window or an unshifted average
          containing the target leaks its answer even if the table is sorted by date.
        hold: 0.7
        visual_cues:
          - id: fc-origin-features-window
            phrase: ending at t minus one
            targets:
              - fc-origin-features-mechanism
            color: cyan
            linger: 0.4
          - id: fc-origin-features-leak
            phrase: containing the target leaks its answer
            targets:
              - fc-origin-features-mechanism
            color: cyan
            linger: 0.4
      - say: Put the weekdays on a circle. Sunday sits right beside Monday. Encode weekday d with the sine and cosine of two pi d over seven to keep those neighbors close. A shared model can learn from clusters with similar hardware, regions or tenant tiers. Join each row to the metadata available at forecast time. Check how much weight each cluster gets, then try the model on a new cluster.
        hold: 0.7
        visual_cues:
          - id: fc-origin-features-cycle
            phrase: Put the weekdays on a circle
            targets:
              - fc-origin-features-mechanism
            color: cyan
            linger: 0.4
      - say: A holiday calendar or an approved launch plan may already be known at the origin. Actual weather a week
          later is unavailable, while the weather forecast issued today is a different potentially usable
          input. Version feature extraction and its availability rules with the model, and apply those same
          rules separately at every backtest origin.
        hold: 0.7
        visual_cues:
          - id: fc-origin-features-known
            phrase: already be known at the origin
            targets:
              - fc-origin-features-mechanism
            color: cyan
            linger: 0.4
          - id: fc-origin-features-weather
            phrase: Actual weather a week later is unavailable
            targets:
              - fc-origin-features-mechanism
            color: cyan
            linger: 0.4
  - id: multi-horizon
    title: Advance a prediction without advancing knowledge
    visual: One fixed origin branches into recursive predictions feeding later lag cells and direct
      horizon-specific predictors sharing only observed inputs. The future target columns stay hidden.
    beats:
      - say: A recursive design fits a one-step model and feeds its own prediction into later lag features. Its second
          prediction can therefore use a predicted first target, while training may have exposed the model to
          observed inputs. Errors can propagate and the input distribution changes along that path.
        hold: 0.7
        visual_cues:
          - id: fc-multi-horizon-recursive
            phrase: feeds its own prediction into later lag features
            targets:
              - fc-multi-horizon-mechanism
            color: cyan
            linger: 0.4
      - say: A direct design fits a separate predictor for each horizon from origin-available features. It avoids
          inserting earlier predicted targets into later lag cells, but still makes forecast errors and may
          require more fitted models. One shared predictor with a horizon input or a multiple-output design
          offers other parameter-sharing choices.
        hold: 0.7
        visual_cues:
          - id: fc-multi-horizon-direct
            phrase: separate predictor for each horizon
            targets:
              - fc-multi-horizon-mechanism
            color: cyan
            linger: 0.4
      - say: Backtest the exact issuance task. A seven-day path issued on Sunday cannot borrow Monday’s observation
          for its Tuesday forecast. A daily one-step Tuesday forecast issued on Monday evening can use it
          after finalization. Their horizons, available history and downstream lead times differ, so their
          scores answer different operational questions.
        hold: 0.7
        visual_cues:
          - id: fc-multi-horizon-fixed
            phrase: cannot borrow Monday’s observation
            targets:
              - fc-multi-horizon-mechanism
            color: cyan
            linger: 0.4
          - id: fc-multi-horizon-daily
            phrase: can use it after finalization
            targets:
              - fc-multi-horizon-mechanism
            color: cyan
            linger: 0.4
  - id: patch-count
    title: How much smaller is the attention map?
    visual: A strip of 336 samples forms overlapping patches of 16 at a stride of 8. End padding adds one patch. An eight-by-eight grid compares the two attention maps at the same scale.
    beats:
      - say: One timestamp per token gives a dense attention map with sequence length squared entries. PatchTST
          instead embeds overlapping numerical patches and processes channels independently with shared
          encoder weights. In the inspected implementation, compute unpadded patch count by subtracting patch
          length from lookback, dividing that difference by stride, rounding down, then adding one. The
          paper’s end-padding path adds one more patch.
        hold: 0.7
        visual_cues:
          - id: fc-patch-count-formula
            phrase: compute unpadded patch count
            targets:
              - fc-patch-count-mechanism
            color: cyan
            linger: 0.4
      - say: For lookback three hundred thirty-six, patch length sixteen and stride eight, floor of three hundred
          twenty divided by eight plus one gives forty-one. End padding gives forty-two tokens. Comparing
          three hundred thirty-six squared with forty-two squared gives sixty-four times as many entries in
          the unpatched attention map, for one channel.
        hold: 0.7
        visual_cues:
          - id: fc-patch-count-forty-one
            phrase: gives forty-one
            targets:
              - fc-patch-count-mechanism
            color: cyan
            linger: 0.4
          - id: fc-patch-count-forty-two
            phrase: gives forty-two tokens
            targets:
              - fc-patch-count-mechanism
            color: cyan
            linger: 0.4
          - id: fc-patch-count-ratio
            phrase: sixty-four times as many entries
            targets:
              - fc-patch-count-mechanism
            color: cyan
            linger: 0.4
      - say: Eight small maps fit across the large square and eight fit down. That’s sixty-four copies of the patched map for one channel. PatchTST processes each channel separately. To see how much time patching saves, time the full model on the same hardware, including its projections and memory traffic. Score both forecasts on the same later days to compare accuracy.
        caption_starts: [That’s sixty-four copies, To see how much time patching saves, Score both forecasts]
        hold: 0.7
  - id: foundation-generations
    title: Name the architecture and the dated generation
    visual: "A shared numeric context passes through three distinct inspected architectures: scaled uniform bins
      and autoregressive sampling, continuous grouped patches and quantiles, then masked multivariate future
      patches. No invented output values are emitted."
    beats:
      - say: The original twenty twenty-four Chronos mean-scales historical values and uses uniformly spaced bins in
          its reported experiments. Primarily T five based models learn cross-entropy over quantized sequences
          and sample future tokens autoregressively. Uniform numerical bins are different from
          equal-probability quantile bins. Later releases need their own architecture description.
        hold: 0.7
        visual_cues:
          - id: fc-foundation-generations-scale
            phrase: mean-scales historical values
            targets:
              - fc-foundation-generations-mechanism
            color: cyan
            linger: 0.4
          - id: fc-foundation-generations-bins
            phrase: uniformly spaced bins
            targets:
              - fc-foundation-generations-mechanism
            color: cyan
            linger: 0.4
      - say: Chronos two, released October twentieth, twenty twenty-five, uses continuous patches, time and group
          attention, and quantile outputs. Its supported inputs include multivariate targets and past-only or
          known-future covariates. Times F M three, announced August thirty-first, twenty twenty-six, adds
          native multivariate targets and covariates with alternating temporal and variate attention and
          masked future patches filled in one forward pass. Its reported quantiles run from P ten through P
          ninety.
        hold: 0.7
        visual_cues:
