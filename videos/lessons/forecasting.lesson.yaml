  - id: later-policy-check
    title: Which day would add a review?
    visual: The seven holdout errors stay fixed. A magnified signed-error scale puts Tuesday and Wednesday on the boundaries while Friday’s off-scale +28 remains labeled.
    beats:
      - say: Return to the seven daily forecasts. The blue strip runs from minus three to plus three jobs, including both ends. Each row is one day. Friday is off the scale to the right. It already goes to review.
        hold: 0.75
      - say: Suppose we tighten the half-width to two jobs. Keep the forecasts and observations exactly where they are. Which day would join Friday in the review queue?
        hold: 2.5
        visual_cues:
          - id: fc-later-policy-check-ask
            phrase: tighten the half-width to two jobs
            targets: [week-band]
            caption_boundary: true
      - say: Tuesday joins Friday. Bring the edges in to minus two and plus two. Tuesday’s plus three is outside. Wednesday’s minus two sits right on the edge and stays covered. Coverage falls from six days out of seven to five. One crossing becomes two.
        hold: 0.9
