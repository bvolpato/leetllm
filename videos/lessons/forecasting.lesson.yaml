            phrase: fifty crossings per day
            targets:
              - fc-review-volume-mechanism
            color: cyan
            linger: 0.4
      - say: Now follow one cluster. Its count stays high for four hours. Checking every minute gives two hundred forty evaluations. Suppose the first breach opens a review. Every later check updates that same review. Sending a page for every breach would give the owner two hundred forty pages about one spike. Keep the review state across restarts, and use the delivery log to track each notification attempt.
