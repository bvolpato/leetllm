  - id: online-calibration
    title: Wait for the outcome before changing the next interval
    visual: A time-separated interval, delayed outcome and working-alpha update retain their identity. A miss
      lowers.10→.055; only the next issued interval can use the changed level.
    beats:
      - say: A rolling window drops old errors as new ones arrive. A short window follows a change sooner, but its quantile depends on fewer observations. Nearby days can still have related errors. Choose the window on earlier backtests. Adaptive conformal inference takes another approach. It adjusts the working miss rate after each observed outcome.
        hold: 0.7
        visual_cues:
          - id: fc-online-calibration-observed
            phrase: after each observed outcome
            targets:
              - fc-online-calibration-mechanism
            color: cyan
            linger: 0.4
      - say: The update is next working alpha equals current working alpha plus learning rate gamma times the quantity
          target alpha minus the miss indicator. A miss has indicator one; a covered observation has indicator
          zero. With current and target alpha point one and gamma point zero five, a miss gives point one plus
          point zero five times minus point nine, or point zero five five. For a monotone quantile rule,
          lowering miscoverage usually widens the next interval.
        hold: 0.7
        visual_cues:
          - id: fc-online-calibration-miss
            phrase: A miss has indicator one
            targets:
              - fc-online-calibration-mechanism
            color: cyan
            linger: 0.4
          - id: fc-online-calibration-update
            phrase: or point zero five five
            targets:
              - fc-online-calibration-mechanism
            color: cyan
            linger: 0.4
      - say: Wait for the actual count. If it arrives after you issue tomorrow’s forecast, use the update for the next forecast you can still change. The original rule controls miss frequency over a long sequence and can produce unbounded intervals at extreme settings. Track their width too. If you cap alpha or delay updates, check coverage under that policy.
        caption_starts: [If it arrives after, The original rule controls, Track their width too]
        hold: 0.7
        visual_cues:
          - id: fc-online-calibration-wait
            phrase: Wait for the actual count
            targets:
              - fc-online-calibration-mechanism
            color: cyan
            linger: 0.4
          - id: fc-online-calibration-extremes
            phrase: can produce unbounded intervals
            targets:
              - fc-online-calibration-mechanism
            color: cyan
            linger: 0.4
