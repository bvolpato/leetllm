  - id: quantile-target
    title: What does a ten-job miss cost?
    visual: A fixed forecast sits at 100 on a jobs ruler. Two alternative observations land the same distance away. The losses build on one separate scale.
    beats:
      - say: Suppose you plan for a hundred jobs. The mean tells you average demand. The median puts you halfway through the distribution. When it hurts more to run short, you can fit a higher quantile by charging more for each job you miss on the high side.
        hold: 0.6
      - say: Try the ninetieth percentile. Set the penalty for each job above forecast to point nine, and for each job below forecast to point one. Now suppose a hundred and ten jobs arrive. What loss do those ten extra jobs earn?
        hold: 2.2
        visual_cues:
          - id: fc-quantile-target-rates
            phrase: Set the penalty
            targets: [loss-ruler]
            caption_boundary: true
          - id: fc-quantile-target-under
            phrase: a hundred and ten jobs arrive
            targets: [loss-ruler]
            caption_boundary: true
      - say: Nine loss units. Now run the same forecast again. This time only ninety jobs arrive. Which penalty applies to those ten spare places?
        hold: 2.2
        visual_cues:
          - id: fc-quantile-target-nine
            phrase: Nine loss units
            targets: [loss-score]
            caption_boundary: true
          - id: fc-quantile-target-over
            phrase: only ninety jobs arrive
            targets: [loss-ruler]
            caption_boundary: true
      - say: One loss unit. Those two slopes define pinball loss. For a target quantile q, charge q times the shortfall or one minus q times the surplus. Averaging this loss over possible outcomes at the origin gives a model a way to learn a conditional quantile. Limited data and an imperfect fit can move its prediction.
        hold: 0.75
        visual_cues:
          - id: fc-quantile-target-one
            phrase: One loss unit
            targets: [loss-score]
            caption_boundary: true
      - say: A low quantile like P ten leaves most demand above it in a continuous distribution. A high quantile can guide headroom. Translating jobs into servers still takes job sizes, lead time, queue tolerance and the price of spare capacity. These loss units score a forecast.
        hold: 0.7
  - id: discrete-quantile
    title: Where should the forecast marker go?
    visual: Ten equally likely counts share a forecast ruler. As the forecast moves, one colored contribution to total pinball loss shrinks by exactly the amount the other grows.
    beats:
      - say: Here are ten equally likely outcomes. Nine have ten jobs. The remaining one has a hundred. Together they average nineteen, and just one of the ten exceeds that mean.
        hold: 0.65
        visual_cues:
          - id: fc-discrete-quantile-mean
            phrase: Together they average nineteen
            targets: [quantile-ruler]
            caption_boundary: true
      - say: Place the forecast at ten. The nine small outcomes fit exactly. On the large outcome we are ninety jobs short. At point nine per missing job, that costs eighty-one loss units. Divide by ten equally likely outcomes and the average loss is eight point one.
        hold: 0.85
        visual_cues:
          - id: fc-discrete-quantile-loss
            phrase: that costs eighty-one loss units
            targets: [quantile-loss]
            caption_boundary: true
          - id: fc-discrete-quantile-average
            phrase: the average loss is eight point one
            targets: [quantile-average]
            caption_boundary: true
      - say: Now imagine moving the forecast from ten to nineteen. Each step saves point nine on the one large outcome. Each step also costs point one on each of the nine small outcomes. Will the average loss go up, go down, or stay put?
        hold: 2.4
        caption_starts: [Each step saves point nine, Each step also costs point one, Will the average loss]
        visual_cues:
          - id: fc-discrete-quantile-ask
            phrase: moving the forecast from ten to nineteen
            targets: [quantile-ruler]
            caption_boundary: true
          - id: fc-discrete-quantile-weights
            phrase: Each step saves point nine on the one large outcome
            targets: [quantile-loss]
      - say: It stays put. Slide the mark to nineteen. The nine small outcomes now contribute eight point one units in total. The large one contributes seventy-two point nine. The color moved across the bar, but its full length is still eighty-one.
        hold: 0.9
        visual_cues:
          - id: fc-discrete-quantile-move
            phrase: Slide the mark to nineteen
            targets: [quantile-ruler, quantile-loss, quantile-average]
            caption_boundary: true
          - id: fc-discrete-quantile-split
            phrase: The nine small outcomes now contribute
            targets: [quantile-loss]
            caption_boundary: true
      - say: Keep sliding until the forecast reaches a hundred. Now all the loss comes from the nine small outcomes. Every forecast from ten to a hundred ties. Moving farther out raises the loss. Look back at the ten outcomes. What’s the smallest job count that covers at least nine of them?
        hold: 2.8
        caption_starts: [Look back at the ten outcomes, What’s the smallest job count]
        visual_cues:
          - id: fc-discrete-quantile-sweep
            phrase: Keep sliding until the forecast reaches a hundred
            targets: [quantile-ruler, quantile-loss, quantile-average]
            caption_boundary: true
          - id: fc-discrete-quantile-threshold
            phrase: What’s the smallest job count
            targets: [quantile-ruler]
            caption_boundary: true
      - say: Count the matching tiles from the left. Nine outcomes have ten jobs each. Ten is the first count that reaches ninety percent. That’s the P ninety forecast under the inverse cumulative distribution rule. A forecast of a hundred covers every outcome and still has the same average loss.
        hold: 1
