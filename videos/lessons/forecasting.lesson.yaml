        hold: 0.75
      - say: If future launch days keep breaking the band, check what the model knew about each launch. If routine days start breaking it, check the input counts and how the error scale changed. Follow a missed disruption through the direct symptoms, the joint detector and the delivery record.
        hold: 0.75
