scenes:
  - id: subject-intro
    title: "What changes when Casey clicks Approve?"
    visual: "Two boots trade places in a shadow copy of a search. The shopper’s shelf keeps its order while Casey approves a 25% canary."
    beats:
      - say: |-
          Watch the red boot take first place. That ranking ran on a copy of a shopper’s search for boots. On the shopper’s screen, the brown boot still comes first. That’s a shadow test.
        hold: 0.5
        visual_cues:
          - id: intro-red
            phrase: "Watch the red boot take first place"
            targets: [shadow-path]
          - id: intro-shopper
            phrase: "the brown boot still comes first"
            targets: [serving-path]
      - say: |-
          Vega, the release assistant, asks to try the new ranking on one search in four. That’s a twenty-five percent canary. Casey reviews the request and clicks Approve. What share is live now?
        hold: 2.5
        visual_cues:
          - id: intro-target
            phrase: "one search in four"
            targets: [proposed-share]
          - id: intro-click
            phrase: "clicks Approve"
            targets: [decision]
          - id: intro-question
            phrase: "What share is live now"
            targets: [live-share, decision]
      - say: |-
          Still zero. Casey’s click saved her permission to make this change. For the red boot to come first in a live search, a worker still has to check that permission and change the route.
        hold: 1.1
        visual_cues:
          - id: intro-zero
            phrase: "Still zero"
            targets: [live-share]
            caption_boundary: true
          - id: intro-saved
            phrase: "saved her permission"
            targets: [decision]
  - id: choose-review
    title: "Which calls can Vega make on its own?"
    visual: "The weekday policy lets a scoped read through. A promotion at the 25% threshold waits for review. Changing only its requested target to 50% raises the reviewer tier."
    beats:
      - say: |-
          Vega can read this service’s evaluation metrics under a scoped grant. Promoting the reranker needs human review because users would see different results. Disabling a required safety filter needs stronger review. A public release note also needs approval before it reaches its audience.
        hold: 0.9
        visual_cues:
          - id: choose-read
            phrase: "read this service’s evaluation metrics"
            targets: [read]
          - id: choose-live
            phrase: "needs human review"
            targets: [policy]
          - id: choose-strong
            phrase: "needs stronger review"
            targets: [safety-filter]
      - say: |-
          Now keep the promotion tool, service and reviewer policy fixed. The weekday rule sends targets above twenty-five percent to a senior reviewer. Vega’s original target sits exactly on that line. Increase the target to fifty percent. The call crosses the threshold and needs senior review.
        hold: 0.85
        visual_cues:
          - id: choose-threshold
            phrase: "exactly on that line"
            targets: [policy]
          - id: choose-broad
            phrase: "Increase the target to fifty percent"
            targets: [target]
          - id: choose-escalate
            phrase: "needs senior review"
            targets: [policy]
      - say: |-
          The minimum review level for an action is its policy floor. A model can flag an anomaly or help a reviewer decide which packet to open first. The host enforces that floor before it lets an effect reach users.
        hold: 0.9
        visual_cues:
          - id: choose-floor
            phrase: "host enforces that floor"
            targets: [policy]
  - id: oversight-modes
    title: "When can a person still intervene?"
    visual: "Three timelines put the reviewer before a live change, beside monitored work, or outside the real-time path."
    beats:
      - say: |-
          Imagine Casey spotting a bad release. If she has to stop it before the first user sees it, put her decision before the gated effect. That’s human-in-the-loop. A monitor can interrupt a draft-routing job that’s already running. That’s human-on-the-loop. The first effect may already have happened. A permitted metrics read can run with no real-time reviewer. That’s human-out-of-the-loop.
        hold: 1
        visual_cues:
          - id: hitl-before
            phrase: "before the gated effect"
            targets:
              - oversight-modes-mechanism
            color: yellow
          - id: hotl-monitor
            phrase: "The first effect may already have happened"
            targets:
              - oversight-modes-mechanism
            color: yellow
          - id: hootl-none
            phrase: "no real-time reviewer"
            targets:
              - oversight-modes-mechanism
            color: yellow
      - say: |-
          The host still checks what each action can do. Even a read can expose another tenant’s data. A prohibited effect stays blocked after a click. The host can tighten the rule when the audience or conditions change. High model confidence can change where a request sits in the queue. It can’t give Vega a new permission.
        hold: 1
        visual_cues:
          - id: policy-block
            phrase: "A prohibited effect stays blocked after a click"
            targets:
              - oversight-modes-mechanism
            color: yellow
  - id: durable-pending
    title: "Where does op-17 wait?"
    visual: "A stored approval row stays in place as the first worker disappears. Another worker picks up the same operation key while the live share stays at zero."
    beats:
      - say: |-
          The promotion needs review. The host prepares a row with the scoped action, its digest and version, the required deployment revision, the evidence references, who may decide and when review expires. It adds the operation key and commits the pending record. Casey can now be notified.
        hold: 0.7
        visual_cues:
          - id: pending-save
            phrase: "commits the pending record"
            targets: [record]
          - id: pending-key
            phrase: "operation key"
            targets: [record]
      - say: |-
          Now notify Casey. While she reads, the first worker stops. Its open request is gone. Watch the key in the stored row. A replacement worker reads that same row and recovers the original action. Casey can still decide.
        hold: 0.9
        visual_cues:
          - id: pending-notify
            phrase: "notify Casey"
            targets: [record]
          - id: pending-stop
            phrase: "the first worker stops"
            targets: [worker]
          - id: pending-reload
            phrase: "reads that same row and recovers the original action"
            targets: [worker]
      - say: |-
          A sleeping thread or an unfinished web request lasts only as long as its process. If a card vanishes after a restart, check where the pending record lived. Resume from durable state and use the recorded arguments. Asking the model to reconstruct them would create a new proposal. If nobody responds before expiry, close the request without a write.
        hold: 1
        visual_cues:
          - id: pending-expire
            phrase: "If nobody responds before expiry"
            targets: [record]
  - id: bind-decision
    title: "Which traffic split did Casey review?"
    visual: "Two copies of one release packet start with the same fields and digest. A change to the working copy moves three shares out of the canary while the approved copy stays fixed."
    beats:
      - say: |-
          Here is the packet the host saved. Vega wants twenty-five percent of live traffic on reranker seventeen, starting from shadow at deployment revision three. The run and evaluation references travel with the proposal. The host serializes these fields and hashes those bytes. The short fingerprint stands for the full digest.
        hold: 0.7
        visual_cues:
          - id: bind-evidence
            phrase: "run and evaluation references"
            targets: [stored]
          - id: bind-hash
            phrase: "hashes those bytes"
            targets: [stored]
      - say: |-
          Casey signs in and clicks Approve. Her click is pending. The decision service checks her role and tenant, the packet version and the deadline. Once she qualifies, it saves her approval and the full digest together in a protected record.
        hold: 0.75
        visual_cues:
          - id: bind-click
            phrase: "Casey signs in and clicks Approve"
            targets: [decision]
          - id: bind-eligible
            phrase: "Once she qualifies"
            targets: [decision]
          - id: bind-save
            phrase: "saves her approval and the full digest"
            targets: [decision]
      - say: |-
          Start the worker with the same packet. Its fingerprint matches. Now change just the working copy to ten percent. Would Casey’s saved decision cover that smaller canary?
        hold: 2.2
        visual_cues:
          - id: bind-worker
            phrase: "same packet"
            targets: [working]
          - id: bind-edit
            phrase: "working copy to ten percent"
            targets: [working]
          - id: bind-ask
            phrase: "Would Casey’s saved decision cover that smaller canary"
            targets: [comparison]
      - say: |-
          It covers twenty-five percent. The worker’s ten percent gives a different digest. Three of the proposed shares disappeared from the working copy. The host keeps Casey’s decision with the original bytes and sends the edit through policy as a new proposal. To judge the ranking itself, Casey can open the evaluation linked in the packet.
        hold: 0.9
        visual_cues:
          - id: bind-reject
            phrase: "gives a different digest"
            targets: [comparison]
            caption_boundary: true
  - id: serialization-card
    title: "What belongs on the review card?"
    visual: "The card keeps the owned snapshot separate from the caller’s edited arguments. It distinguishes the host’s exact request from a quoted evaluation note."
    beats:
      - say: |-
          Keep those two copies separate in memory, too. The review service takes its own snapshot of the tool, arguments, scope, preconditions and their schema. Hash the complete envelope. With a deep copy, editing the caller’s traffic from twenty-five to ten leaves the displayed review at twenty-five. The changed proposal has a different digest.
        hold: 0.8
        visual_cues:
          - id: intent-envelope
            phrase: "Hash the complete envelope"
            targets: [serialization-card-mechanism]
          - id: intent-copy
            phrase: "editing the caller’s traffic from twenty-five to ten"
            targets: [serialization-card-mechanism]
          - id: intent-different
            phrase: "The changed proposal has a different digest"
            targets: [serialization-card-mechanism]
      - say: |-
          The sender and worker need identical bytes for the same proposal. This Python example sorts the keys. Across languages, agree on one representation for names and numbers, such as RFC eighty-seven eighty-five. Reject duplicate keys and nonfinite numbers. The worker compares its digest with the one the host saved alongside Casey’s decision. That protected record ties the bytes to a reviewer.
        hold: 0.8
        visual_cues:
          - id: intent-bytes
            phrase: "one representation for names and numbers"
            targets: [serialization-card-mechanism]
          - id: intent-protected
            phrase: "That protected record ties the bytes to a reviewer"
            targets: [serialization-card-mechanism]
      - say: |-
          Casey’s screen puts the host’s proposed change beside the release ticket. The host sets the scope, the required role and the two deadlines. The ticket says the evaluation looks ready. Escape argument strings and show that note as text with its source, so Casey can check the evaluation herself. Isolate rich content. The buttons send a scoped decision to an authenticated backend. Protect cookie sessions against cross-site requests. Before keeping a ticket as evidence, redact secrets as well as email addresses.
        hold: 0.9
        visual_cues:
          - id: intent-escape
            phrase: "that note as text with its source"
            targets: [serialization-card-mechanism]
          - id: intent-backend
            phrase: "buttons send a scoped decision"
            targets: [serialization-card-mechanism]
  - id: decision-branches
    title: "What if Casey edits the request?"
    visual: "The 25% request can close without dispatch. Casey’s 10% revision occupies a new row and waits for an eligible reviewer."
    beats:
      - say: |-
          Go back to Casey’s review screen. Approval authorizes the exact packet. If Casey rejects it, save her reason. If nobody decides by the deadline, the host records expiry. In either case the worker leaves live traffic alone.
        hold: 0.8
        visual_cues:
          - id: branches-close
            phrase: "host records expiry"
            targets: [outcomes]
      - say: |-
          Casey can also propose ten percent instead. Keep the original twenty-five percent version in the history and mark it superseded. Validate the edit, give it a new version and digest, then run policy again. Under Vega’s rule, Casey is now the proposer. A different eligible reviewer must decide on this revision.
        hold: 0.9
        visual_cues:
          - id: branches-edit
            phrase: "propose ten percent instead"
            targets: [edited]
          - id: branches-version
            phrase: "a new version and digest"
            targets: [edited]
          - id: branches-review
            phrase: "A different eligible reviewer must decide"
            targets: [outcomes]
      - say: |-
          The note in the ticket may support her edit. It can’t change the trusted target. The executor reloads the protected record for the version that actually won approval.
        hold: 0.8
        visual_cues:
          - id: branches-note
            phrase: "note in the ticket"
            targets: [outcomes]
  - id: langgraph-replay
    title: "Where does the review node restart?"
    visual: "Two graph instances open the same local SQLite checkpoint in turn. The second invocation reenters the review node and receives the saved decision."
    beats:
      - say: |-
          LangGraph runs an agent as a graph of steps called nodes. In this example, the review node calls interrupt with a packet it can serialize as JSON. A checkpointer saves the thread. In the same process, the example closes the SQLite connection, builds a new graph and reopens the same thread. A resume command supplies the value returned by interrupt. The state changes from pending to authorized. The review node starts twice and production writes stay at zero.
        hold: 1
        visual_cues:
          - id: graph-save
            phrase: "A checkpointer saves the thread"
            targets:
              - langgraph-replay-mechanism
            color: yellow
          - id: graph-reopen
            phrase: "builds a new graph and reopens the same thread"
            targets:
              - langgraph-replay-mechanism
            color: yellow
          - id: graph-result
            phrase: "The review node starts twice and production writes stay at zero"
            targets:
              - langgraph-replay-mechanism
            color: yellow
      - say: |-
          Why twice? On resume, the node starts again at its first line. Put a notification before interrupt and it may go out again. Send it from an earlier completed node or give the notification a durable key that suppresses duplicates. Leave the production write for the guarded executor. Authenticate whoever submits the decision before resuming.
        hold: 1
        visual_cues:
          - id: graph-restart
            phrase: "the node starts again at its first line"
            targets:
              - langgraph-replay-mechanism
            color: yellow
          - id: graph-notify
            phrase: "it may go out again"
            targets:
              - langgraph-replay-mechanism
            color: yellow
          - id: graph-repair
            phrase: "Send it from an earlier completed node"
            targets:
              - langgraph-replay-mechanism
            color: yellow
      - say: |-
          LangChain’s review middleware offers approve, edit, reject and respond. Its edit option can run revised arguments immediately. Vega needs a fresh decision for an edit. If the reviewer denies the write, use reject. Use respond to give the model a tool result. When several interrupts share one thread, identify the particular interrupt to resume.
        hold: 1
        visual_cues:
          - id: graph-edit
            phrase: "Vega needs a fresh decision for an edit"
            targets:
              - langgraph-replay-mechanism
            color: yellow
          - id: graph-respond
            phrase: "use reject"
            targets:
              - langgraph-replay-mechanism
            color: yellow
  - id: temporal-review
    title: "What does the Approve button tell Casey?"
    visual: "An open tab keeps version 3 while the pending proposal advances to version 4. Three message replies show Casey what arrived, why her click was rejected and which proposal still needs review."
    beats:
      - say: |-
          Casey opens version three. While her tab is open, someone saves version four. She clicks Approve on the old tab. What reply would help her here?
        hold: 1.8
        visual_cues:
          - id: temporal-edit
            phrase: "someone saves version four"
            targets: [workflow]
          - id: temporal-click
            phrase: "clicks Approve on the old tab"
            targets: [reviewer]
      - say: |-
          A Temporal Signal tells Casey the server received her message. An Update can check her version before accepting the decision. Three and four differ, so the validator rejects her click. A Query reads the current state. Version four is still waiting for review.
        hold: 1
        visual_cues:
          - id: temporal-signal
            phrase: "the server received her message"
            targets: [messages]
          - id: temporal-validate
            phrase: "An Update can check her version"
            targets: [messages]
          - id: temporal-update
            phrase: "the validator rejects her click"
            targets: [messages]
          - id: temporal-observe
            phrase: "A Query reads the current state"
            targets: [messages]
          - id: temporal-query
            phrase: "Version four is still waiting for review"
            targets: [messages]
      - say: |-
          Casey opens version four, reviews the edit and clicks Approve again. The gateway checks her identity and authority. The workflow checks the pending action, version, digest and expiry. The handler checks again and records her decision without yielding between those steps. If the deadline passes before anyone decides, review closes without a write.
        hold: 1
        visual_cues:
          - id: temporal-refresh
            phrase: "Casey opens version four"
            targets: [reviewer]
          - id: temporal-resubmit
            phrase: "clicks Approve again"
            targets: [reviewer]
          - id: temporal-check
            phrase: "the pending action, version, digest and expiry"
            targets: [workflow]
          - id: temporal-record
            phrase: "records her decision without yielding between those steps"
            targets: [workflow]
          - id: temporal-expiry
            phrase: "review closes without a write"
            targets: [messages]
      - say: |-
          After a worker restarts, Temporal rebuilds the workflow by replaying its code against the event history. The review timer uses workflow time and keeps the original deadline. Fetch live policy and metrics in an Activity. On replay, the workflow reads the recorded result.
        hold: 1
        visual_cues:
          - id: temporal-replay
            phrase: "replaying its code against the event history"
            targets: [history]
          - id: temporal-deadline
            phrase: "keeps the original deadline"
            targets: [history]
          - id: temporal-activity
            phrase: "Fetch live policy and metrics in an Activity"
            targets: [history]
          - id: temporal-read
            phrase: "reads the recorded result"
            targets: [history]
      - say: |-
          The promotion runs in a separately registered Activity. Here it gets one attempt, up to thirty seconds to run and forty-five seconds from scheduling to completion. If it waits twenty seconds to start, how much time is left?
        hold: 2
        visual_cues:
          - id: temporal-timeouts
            phrase: "forty-five seconds from scheduling to completion"
            targets: [clock]
          - id: temporal-wait
            phrase: "waits twenty seconds to start"
            targets: [clock]
      - say: |-
          Twenty-five seconds. If the worker sends the change and then times out, look up the operation’s receipt. Before Continue-As-New starts a fresh history, finish active message handlers. Carry the workflow state and operation keys into the new history so it can recognize a repeat.
        hold: 1
        visual_cues:
          - id: temporal-remaining
            phrase: "Twenty-five seconds"
            targets: [clock]
            caption_boundary: true
          - id: temporal-new
            phrase: "Continue-As-New starts a fresh history"
            targets: [handoff]
          - id: temporal-carry
            phrase: "Carry the workflow state and operation keys"
            targets: [handoff]
  - id: identities-and-grants
    title: "Who can authorize this promotion?"
    visual: "The requester, Vega, Casey and the worker contribute distinct authority. A requester with the right role still fails the example’s sole self-approval check."
    beats:
      - say: |-
          Four participants touch the same packet. The requester signs in for a specific tenant and task. Vega proposes the arguments and gathers evidence. Casey signs in as a reviewer and needs the release role for this tenant. The worker uses its own narrow workload identity to carry out the permitted effect. The thread ID tells the worker where the record is. It gives nobody a credential.
        hold: 1
        visual_cues:
          - id: identity-requester
            phrase: "The requester signs in"
            targets:
              - identities-and-grants-mechanism
            color: yellow
          - id: identity-agent
            phrase: "Vega proposes the arguments"
            targets:
              - identities-and-grants-mechanism
            color: yellow
          - id: identity-reviewer
            phrase: "Casey signs in as a reviewer"
            targets:
              - identities-and-grants-mechanism
            color: yellow
          - id: identity-executor
            phrase: "its own narrow workload identity"
            targets:
              - identities-and-grants-mechanism
            color: yellow
      - say: |-
          Suppose the requester also holds the release-manager role. Can they approve this request alone? Vega’s policy requires a different eligible reviewer. It treats the author of an edit as a new proposer, too. Take identity, tenant and roles from trusted services. Keep browser sessions and reusable production credentials out of the model. If a correct action reaches the wrong tenant, stop dispatch and check the scope at every handoff.
        hold: 1
        visual_cues:
          - id: identity-self
            phrase: "requires a different eligible reviewer"
            targets:
              - identities-and-grants-mechanism
            color: yellow
      - say: |-
          An emergency override needs its own narrow role, expiry, reason, alert and later review. A note saying it’s urgent supplies none of that authority. Recheck current policy and the worker’s scope on resume. The review deadline limits when Casey can decide. The execution deadline limits when the worker can send. Define what revocation can stop once a write is already in flight.
        hold: 1
        visual_cues:
          - id: identity-breakglass
            phrase: "A note saying it’s urgent"
            targets:
              - identities-and-grants-mechanism
            color: yellow
          - id: identity-deadlines
            phrase: "execution deadline limits when the worker can send"
            targets:
              - identities-and-grants-mechanism
            color: yellow
  - id: decision-outbox
    title: "Two clicks on one pending row"
    visual: "Two SQLite connections compete for one decision. A separate interrupted transaction leaves the approval pending and its outbox empty."
    beats:
      - say: |-
          Two eligible reviewers open the same pending request. Put the status check in the database update. It must match this tenant, approval, version and full digest, and the deadline must still be open at database time. One changed row wins the decision. If someone already decided, the next update finds no pending row. Give edits the same guard.
        hold: 1
        visual_cues:
          - id: outbox-row
            phrase: "One changed row wins the decision"
            targets:
              - decision-outbox-mechanism
            color: yellow
      - say: |-
          Try the local SQLite example at clock tick one hundred. The packet expires at one hundred twenty. A click at that exact deadline is blocked. Now race two connections before expiry. Each requests a write transaction with begin immediate. One authorizes, one is blocked, and one outbox row commits. In a separate run, stop after the update and before inserting the message. The transaction rolls back to pending with zero messages.
        hold: 1
        visual_cues:
          - id: outbox-expiry-complete
            phrase: "A click at that exact deadline is blocked"
            targets:
              - decision-outbox-mechanism
            color: yellow
            linger: 0.45
          - id: outbox-race
            phrase: "One authorizes, one is blocked, and one outbox row commits"
            targets:
              - decision-outbox-mechanism
            color: yellow
          - id: outbox-rollback
            phrase: "rolls back to pending with zero messages"
            targets:
              - decision-outbox-mechanism
            color: yellow
      - say: |-
          The table holding that message is the outbox. If the worker stops after commit, the resume instruction is already there with the decision. A dispatcher can deliver the same message twice. Deduplicate by decision identity and reload the protected grant. A rejection also resumes the workflow, so it can end without a write. If a recorded approval never resumes, follow its outbox entry. The deployment receipt belongs to a later step.
        hold: 1
        visual_cues:
          - id: outbox-delivery
            phrase: "deliver the same message twice"
            targets:
              - decision-outbox-mechanism
            color: yellow
          - id: outbox-reload
            phrase: "reload the protected grant"
            targets:
              - decision-outbox-mechanism
            color: yellow
  - id: stale-version
    title: "One approved write, two deployments"
    visual: "The same guarded SQL update runs against two copies of the deployment. A second operator changes one copy to 10% at revision 4. Both live traffic bars and both row counts remain visible."
    beats:
      - say: |-
          Back at the router, run Casey’s original twenty-five percent packet on two copies of the same deployment. Both start in shadow at revision three. The worker has a current grant for this service. Read the last line of its update. The database checks the revision as part of the write. Leave the left deployment alone. On the right, another operator puts ten percent of traffic on the canary. That advances its revision to four. Casey’s stored packet and digest stay fixed. When the same statement returns on each side, what percentage will each canary serve?
        hold: 3
        visual_cues:
          - id: stale-sql
            phrase: "last line of its update"
            targets: [write]
          - id: stale-other
            phrase: "another operator puts ten percent of traffic on the canary"
            targets: [right]
          - id: stale-ask
            phrase: "what percentage will each canary serve"
            targets: [question]
      - say: |-
          On the left, one row changes. The canary serves twenty-five percent. On the right, zero rows change. Ten percent stays live. Zero rows tells us that a condition failed. Reload the row to find out why. Here it exists, and its revision changed. A mismatch marks the old approval stale and stops the write. Both deployments now say revision four. Only the left one got there through Casey’s write.
        hold: 1.3
        visual_cues:
          - id: stale-left
            phrase: "The canary serves twenty-five percent"
            targets: [left]
            caption_boundary: true
          - id: stale-right
            phrase: "Ten percent stays live"
            targets: [right]
            caption_boundary: true
          - id: stale-reject
            phrase: "A mismatch marks the old approval stale and stops the write"
            targets: [right]
            caption_boundary: true
      - say: |-
          Build a new packet for revision four. Attach the new run and evaluation, then request a fresh review. This proposal would move the right-hand canary from ten to twenty-five percent. The worker needs a new decision before it can write.
        hold: 0.85
        visual_cues:
          - id: stale-rebuild
            phrase: "Attach the new run and evaluation"
            targets: [repair]
          - id: stale-review
            phrase: "request a fresh review"
            targets: [repair, question]
      - say: |-
          Retain the old decision in the history. Advance the revision on every relevant change, even a rollback. Checking it before the write would leave time for a competing update. Check roles and policy separately when another service owns them.
        hold: 0.85
        visual_cues:
          - id: stale-history
            phrase: "Retain the old decision in the history"
            targets: [question]
  - id: execute-and-reconcile
    title: "Where did the reply go?"
    visual: "The worker sends the newly approved operation. Canary traffic changes at the destination. The worker stays uncertain until a read with the original key brings the receipt back."
    beats:
      - say: |-
          Follow the right-hand deployment. Casey has now approved the new packet for revision four. The worker claims the operation and sends the target a stable idempotency key. The request asks for twenty-five percent. The target applies the traffic change. It saves a receipt under that key, but the response disappears on the network. Now stand at the worker. Its timer expires. What outcome can it record from the timeout alone?
        hold: 2.4
        visual_cues:
          - id: execute-claim-complete
            phrase: "The worker claims the operation"
            targets: [host]
          - id: execute-and-reconcile-b1-1
            phrase: "and sends the target a stable idempotency key"
            targets: [wire]
          - id: execute-apply-complete
            phrase: "The target applies the traffic change"
            targets: [destination]
          - id: execute-and-reconcile-b1-2
            phrase: "but the response disappears on the network"
            targets: [wire]
          - id: execute-ask
            phrase: "Its timer expires"
            targets: [host]
      - say: |-
          A timeout leaves the execution state unknown. Query the target with the original operation identity. The reply names this operation, the twenty-five percent share and revision five. The worker can now record its receipt.
        hold: 1.15
        visual_cues:
          - id: execute-timeout-complete
            phrase: "A timeout leaves the execution state unknown"
            targets: [host]
            caption_boundary: true
          - id: execute-and-reconcile-b2-1
            phrase: "Query the target with the original operation identity"
            targets: [wire]
          - id: execute-and-reconcile-b2-2
            phrase: "record its receipt"
            targets: [host]
            caption_boundary: true
      - say: |-
          Look at the router. It moved traffic from ten to twenty-five percent once. Reading the receipt moves no traffic. The change at the worker is what it can now prove.
        hold: 1.15
        visual_cues:
          - id: execute-proof
            phrase: "Reading the receipt moves no traffic"
            targets: [destination]
      - say: |-
          A definite failure and a missing reply need different handling. If the result is still unknown, inspect it before another attempt. A repeat is safe only for identical parameters under a key the destination still honors. If that contract is missing or the key has expired, keep the outcome open for reconciliation. A fresh key could apply a second effect.
        hold: 0.9
        visual_cues:
          - id: execute-retry
            phrase: "only for identical parameters under a key the destination still honors"
            targets: [wire]
  - id: batch-ledger
    title: "Which publication needs recovery?"
    visual: "Fifty publications have distinct operation keys. The confirmed prefix stops at item 41, and the recovery lookup addresses item 42."
    beats:
      - say: |-
          Vega has fifty release notes to publish. A qualified reviewer can approve them together if policy permits and the packet identifies that exact set. Bind the scope, version, destinations, preconditions and ordered contents in one envelope. Move one item or change its destination and the digest changes. Adding another note also needs a new decision.
        hold: 1
        visual_cues:
          - id: batch-binding
            phrase: "Move one item or change its destination"
            targets:
              - batch-ledger-mechanism
            color: yellow
      - say: |-
          Now publish them in order. The worker claims each item in durable storage, checks its grant and preconditions, and sends its own operation key. The first forty-one items have receipts. Item forty-two was sent, but its reply timed out. Its outcome is unknown. Look up item forty-two under its original key. Keep the first forty-one receipts and leave the eight unsent notes in place.
        hold: 1
        visual_cues:
          - id: batch-receipts
            phrase: "The first forty-one items have receipts"
            targets:
              - batch-ledger-mechanism
            color: yellow
          - id: batch-unknown
            phrase: "Its outcome is unknown"
            targets:
              - batch-ledger-mechanism
            color: yellow
          - id: batch-reconcile
            phrase: "Look up item forty-two under its original key"
            targets:
              - batch-ledger-mechanism
            color: yellow
      - say: |-
          Whether the eight can go next depends on what they need from item forty-two. Order alone doesn’t tell you which items depend on it. Set the stop or continue rule before dispatch. A correction to an already published note needs its own authority and can itself fail. The article’s batch digest checks the order and contents. The item ledger and the destination receipts tell you what actually happened.
        hold: 1
        visual_cues:
          - id: batch-dependency
            phrase: "Order alone doesn’t tell you which items depend on it"
            targets:
              - batch-ledger-mechanism
            color: yellow
  - id: weekend-budget
    title: "Two increases in one hour"
    visual: "Place a previous nine-point increase on the one-hour timeline. Moving it to the open left boundary changes the rolling sum while the present request stays fixed."
    beats:
      - say: |-
          Vega’s weekend rule counts increases in this service’s canary traffic over one hour. More than ten percentage points goes to a senior reviewer. Every promotion still needs at least ordinary approval. From two in the morning through seven fifty-nine local time, two failed rollouts in the previous hour block write-tier work. Permitted reads keep their own floor. Disabling a required safety filter still escalates.
        hold: 0.8
        visual_cues:
          - id: weekend-floor
            phrase: "two failed rollouts in the previous hour block write-tier work"
            targets: [policy]
      - say: |-
          At ten fifteen in the evening the history is empty. A move from zero to nine percent adds nine points and needs ordinary approval. It goes through. Half an hour later Vega asks to go from nine to eighteen. The proposed increase is nine points again. Include the previous increase and the hour’s total reaches eighteen. This one needs senior review.
        hold: 1.1
        visual_cues:
          - id: weekend-first
            phrase: "adds nine points and needs ordinary approval"
            targets: [budget]
          - id: weekend-next
            phrase: "Half an hour later"
            targets: [window]
          - id: weekend-add
            phrase: "The proposed increase is nine points again"
            targets: [budget]
          - id: weekend-second
            phrase: "the hour’s total reaches eighteen"
            targets: [budget]
          - id: weekend-escalate
            phrase: "This one needs senior review"
            targets: [budget]
            caption_boundary: true
      - say: |-
          Keep the proposed move and the current share exactly as they are. Move the earlier increase back to nine forty-five. At ten forty-five, the window includes now and excludes its exact left endpoint. Does this request still need senior review?
        hold: 2.5
        visual_cues:
          - id: weekend-boundary
            phrase: "Move the earlier increase back to nine forty-five"
            targets: [window]
          - id: weekend-ask
            phrase: "Does this request still need senior review"
            targets: [budget]
      - say: |-
          Ordinary approval is enough here. Only the new nine points count. Ignore future timestamps as well. A decrease adds zero to an increase budget. It gives no credit against a later promotion.
        hold: 0.9
        visual_cues:
          - id: weekend-answer
            phrase: "Only the new nine points count"
            targets: [budget]
            caption_boundary: true
      - say: |-
          Two workers can each see an empty ledger while judging concurrent requests. Reserve the increase when the host admits a request, in the same service-wide transaction. The second worker then counts the first reservation. Release reservations on rejection or expiry. Take times, service history and local context from trusted sources, validate numeric shares, and recheck the deployment revision when writing.
        hold: 0.95
        visual_cues:
          - id: weekend-race
            phrase: "each see an empty ledger"
            targets: [window]
          - id: weekend-reserve
            phrase: "second worker then counts the first reservation"
            targets: [budget]
  - id: transfer
    title: "Six packets in the review queue"
    visual: "Follow one packet’s wait and decision time, then compare each known defect with its recorded decision in the same six-packet exercise."
    beats:
      - say: |-
          These six practice packets never reach a live writer. Start with packet one. It entered the queue at zero seconds. Casey opened it at four and decided at ten. Its queue wait is four minus zero, or four seconds. Casey’s review took ten minus four, or six seconds. Across the five opened packets, the mean wait was five point two seconds. The five decisions took six point four seconds on average after opening. Keep both times beside the approval rate.
        hold: 0.55
        visual_cues:
          - id: transfer-b1-1
            phrase: "four minus zero, or four seconds"
            targets: [p1-queue-cells]
            caption_boundary: true
          - id: reviewer-response
            phrase: "ten minus four, or six seconds"
            targets: [p1-review-cells]
            caption_boundary: true
          - id: transfer-mean-wait
            phrase: "the mean wait was five point two seconds"
            targets: [queue-mean]
          - id: transfer-mean-review
            phrase: "six point four seconds on average after opening"
            targets: [review-mean]
          - id: approval-rate
            phrase: "Keep both times beside the approval rate"
            targets: [queue-mean, review-mean]
      - say: |-
          At twenty-five seconds, five packets have decisions. Packet four expired unopened. Three decisions were approvals. An approval rate of three out of five tells us how often the reviewers said yes. Did they catch every planted defect? Compare the known condition with the decision on the same row.
        hold: 2.25
        visual_cues:
          - id: transfer-expire
            phrase: "Packet four expired unopened"
            targets: [cohort]
          - id: transfer-rate
            phrase: "three out of five"
            targets: [cohort, result]
          - id: transfer-ask
            phrase: "Did they catch every planted defect"
            targets: [cohort, result]
      - say: |-
          They caught two out of three. Look at packet three. It carried a known defect and got approved. Count false alarms on clean reviewed packets as well. If a queue keeps passing defective packets, inspect what reviewers see and how much time they have. For live investigations, keep the proposal, decision, dispatch and trusted result linked by operation key and digest. That lets you find the boundary where evidence stops.
        hold: 0.9
        visual_cues:
          - id: transfer-caught
            phrase: "They caught two out of three"
            targets: [result]
            caption_boundary: true
          - id: transfer-missed
            phrase: "It carried a known defect and got approved"
            targets: [cohort]
  - id: queue-governance
    title: "Which denominator answers the question?"
    visual: "Four permitted reads join the six queued packets. The scorecard counts autonomous completions, corrections and false alarms against their own cohorts, then compares median and oldest pending age."
    beats:
      - say: |-
          Add four permitted metric reads to the six review tasks. All four reads finished automatically. That’s four autonomous completions out of ten tasks. Now ask how often a reviewer corrected a proposal. Two of five reviewed packets were rejected or edited. Here both corrections were rejections. Neither of the two clean packets that received a decision raised a false alarm. The clean packet that expired never got a decision.
        hold: 0.95
        visual_cues:
          - id: queue-cohort
            phrase: "four autonomous completions out of ten tasks"
            targets: [queue-governance-mechanism]
          - id: queue-correction
            phrase: "Two of five reviewed packets were rejected or edited"
            targets: [queue-governance-mechanism]
          - id: queue-defects
            phrase: "Neither of the two clean packets that received a decision raised a false alarm"
            targets: [queue-governance-mechanism]
      - say: |-
          Look at these seven pending requests. The middle request is five minutes old. The oldest has waited an hour. Track tail wait and expirations for each tool and tier, alongside the times to dispatch and verify a result. A triage system may reorder the queue or reject a policy violation. It can fast-track only work already cleared for automatic execution. If you reuse decisions for training, check permission, purpose, redaction, label quality and separation from the evaluation set.
        hold: 0.9
        visual_cues:
          - id: queue-tail
            phrase: "The oldest has waited an hour"
            targets: [queue-governance-mechanism]
          - id: queue-floor
            phrase: "only work already cleared for automatic execution"
            targets: [queue-governance-mechanism]
      - say: |-
          Someone auditing Casey’s release needs to see who reviewed which version and what the executor could verify. Keep the authorized evidence that answers those questions and limit access and retention. The voluntary NIST AI Risk Management Framework describes human roles and documented oversight. Article fourteen of the EU AI Act addresses oversight for applicable high-risk systems, including interpreting outputs, recognizing automation bias and being able to intervene.
        hold: 0.85
        visual_cues:
          - id: queue-governance
            phrase: "who reviewed which version and what the executor could verify"
            targets: [queue-governance-mechanism]
  - id: fresh-packet
    title: "Whose write moved the traffic?"
    visual: "Two alternative histories start from the same packet. Identical final shares conceal a stale write on one side and a lost reply on the other. An operation-specific receipt attributes the second change."
    beats:
      - say: |-
          Try a fresh release. These are two possible histories of the same router. Each starts at five percent, at revision fifty-eight. Casey approves fifteen percent for that revision. Both workers have the right packet, the current grant and the same logical operation key. On the left, another operator gets there first and sets fifteen percent. The revision advances to fifty-nine. The approved digest still matches. Predict whether that matching digest permits the write.
        hold: 2.4
        visual_cues:
          - id: fresh-packet
            phrase: "Casey approves fifteen percent for that revision"
            targets: [packet]
          - id: fresh-other
            phrase: "another operator gets there first and sets fifteen percent"
            targets: [left]
          - id: fresh-predict
            phrase: "Predict whether that matching digest permits the write"
            targets: [question]
      - say: |-
          It does not: the left router requires a match on the deployment revision. Vega’s guarded update returns zero rows. Reloading the row explains why the precondition failed. Close that stale attempt. Now follow the right-hand worker. It sends the same approved update while the revision still matches.
        hold: 0.85
        visual_cues:
          - id: fresh-zero
            phrase: "returns zero rows"
            targets: [left]
            caption_boundary: true
          - id: fresh-stale
            phrase: "Close that stale attempt"
            targets: [left]
          - id: fresh-send
            phrase: "It sends the same approved update"
            targets: [right]
      - say: |-
          On the way back, the network reply is lost. The right-hand worker times out. A later read shows fifteen percent at revision fifty-nine on both routers. Which worker still needs a receipt lookup to find out whether its write happened?
        hold: 3
        visual_cues:
          - id: fresh-loss
            phrase: "the network reply is lost"
            targets: [right]
          - id: fresh-timeout
            phrase: "The right-hand worker times out"
            targets: [right]
          - id: fresh-read
            phrase: "fifteen percent at revision fifty-nine on both routers"
            targets: [right]
          - id: fresh-ask
            phrase: "Which worker still needs a receipt lookup"
            targets: [question]
      - say: |-
          The worker on the right. Someone else could have produced exactly that traffic reading, as the left-hand router shows. Look up the key Vega sent on the right. The destination returns the receipt for that operation, recording fifteen percent at revision fifty-nine. Now the worker can mark it executed. Both traffic strips stay still. What changed was our evidence of who moved the traffic.
        hold: 1.6
        visual_cues:
          - id: fresh-answer
            phrase: "The worker on the right"
            targets: [question]
            caption_boundary: true
          - id: fresh-query
            phrase: "Look up the key Vega sent on the right"
            targets: [right]
          - id: fresh-receipt
            phrase: "the receipt for that operation, recording fifteen percent at revision fifty-nine"
            targets: [right]
            caption_boundary: true
          - id: fresh-close
            phrase: "Both traffic strips stay still"
            targets: [question]
