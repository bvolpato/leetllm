scenes:
  - id: intro
    title: "Where will the next scores go?"
    visual: >-
      The fourth query finishes a tile of scalar products. The next four keys wait beside the full
      tile. New scores replace the old ones as the map records each visit.
    beats:
      - say: >-
          This query has value four. Watch it multiply each key to fill the bottom row. Now all
          sixteen score slots are full, and four more keys are waiting. Where will their scores go?
        hold: 2.1
        caption_starts:
          - "Now all sixteen score slots are full"
          - "Where will their scores go"
        visual_cues:
          - id: intro-first
            phrase: >-
              Watch it multiply each key to fill the bottom row
            targets: [intro-live-tile]
            linger: 0.4
            caption_boundary: true
          - id: intro-question
            phrase: >-
              Where will their scores go
            targets: [intro-account, intro-live-tile]
            linger: 0.4
      - say: >-
          Right back into those same slots. Keep each query's maximum and its running weight and value
          sums. Bring in the next four keys and overwrite the scores. Now these four queries have seen
          all eight keys and can write their outputs. The other four queries take their turn. This head
          makes sixty-four comparisons through one tile. At two bytes per score, it holds thirty-two bytes.
        hold: 0.9
        visual_cues:
          - id: intro-next
            phrase: >-
              Bring in the next four keys and overwrite the scores
            targets: [intro-live-tile]
            linger: 0.4
            caption_boundary: true
          - id: intro-rest
            phrase: >-
              The other four queries take their turn
            targets: [intro-pair-map]
            linger: 0.4
            caption_boundary: true
      - say: >-
          Stretch each side to thirty-two tokens. Keep that same four-by-four tile. Which count grows,
          the number of scores we can hold or the number of comparisons we have to make?
        hold: 2
        visual_cues:
          - id: intro-long
            phrase: "Stretch each side to thirty-two tokens"
            targets: [intro-pair-map]
            linger: 0.4
            caption_boundary: true
      - say: >-
          There are now a thousand and twenty-four comparisons. Storing them all at two bytes each would
          take two thousand and forty-eight bytes. FlashAttention reuses the same thirty-two bytes of
          score space. Its inputs and outputs still need room in high-bandwidth memory, the GPU's main
          memory.
        hold: 1
        visual_cues:
          - id: intro-many
            phrase: "There are now a thousand and twenty-four comparisons"
            targets: [intro-pair-map]
            linger: 0.4
            caption_boundary: true
          - id: intro-bytes
            phrase: "two thousand and forty-eight bytes"
            targets: [intro-account]
            linger: 0.4
            caption_boundary: true
  - id: workspace-accounting
    title: Count one score tensor and one saved summary
    visual: The growing score square expands to a calculated real workload; the same row identities
      collapse into their linear LSE column while all dense comparisons remain counted.
    beats:
      - say: >-
          Now scale that square up. Each of eight examples has thirty-two heads. Each head has eight
          thousand one hundred ninety-two query rows and just as many key columns. A two-byte score
          occupies every cell. Divide the byte count by two to the thirtieth. One materialized score
          tensor needs thirty-two gibibytes. Writing that tensor out and reading it back for softmax
          adds traffic.
        hold: 0.7
        visual_cues:
          - id: fa-workspace-accounting-0
            phrase: >-
              Now scale that square up. Each of eight examples has thirty-two heads. Each head has eight
              thousand one hundred ninety-two query rows and just as many key columns. A two-byte score
              occupies every cell. Divide the byte count by two to the thirtieth. One materialized score
              tensor needs thirty-two gibibytes. Writing that tensor out and reading it back for softmax
              adds traffic.
            targets:
              - fa-workspace-accounting-mechanism
            color: cyan
            linger: 0.35
          - id: fa-workspace-score
            phrase: >-
              One materialized score tensor needs thirty-two gibibytes
            targets:
              - fa-workspace-accounting-mechanism
            color: cyan
            linger: 0.35
            caption_boundary: true
      - say: >-
          Training can save one number per query row. It's the log of the sum of exponentials, or L S E.
          Cross out the key axis, and allow four bytes per row for a single-precision number. That is
          eight mebibytes at the same shape. The queries, keys, values and outputs still take space. As
          the square grows, the kernel still evaluates the dense pairs.
        hold: 0.7
        visual_cues:
          - id: fa-workspace-accounting-1
            phrase: >-
              Training can save one number per query row. It's the log of the sum of exponentials, or L S
              E. Cross out the key axis, and allow four bytes per row for a single-precision number. That
              is eight mebibytes at the same shape. The queries, keys, values and outputs still take
              space. As the square grows, the kernel still evaluates the dense pairs.
            targets:
              - fa-workspace-accounting-mechanism
            color: cyan
            linger: 0.35
          - id: fa-workspace-lse
            phrase: >-
              That is eight mebibytes at the same shape
            targets:
              - fa-workspace-accounting-mechanism
            color: cyan
            linger: 0.35
            caption_boundary: true
      - say: >-
          Why does the original paper count memory accesses? Main memory is far from the arithmetic. A
          larger on-chip tile can reuse data before going back for more. In the paper's model, M counts
          scalar elements and ranges from head width d to sequence length n times d. The tiled access
          bound scales as n squared times d squared over M. The materializing baseline needs at least
          order n times d plus n squared accesses. Converting that bound to seconds takes a hardware
          measurement.
        hold: 0.7
        caption_starts: ["Main memory is far from the arithmetic"]
        visual_cues:
          - id: fa-workspace-accounting-2
            phrase: >-
              Why does the original paper count memory accesses? Main memory is far from the arithmetic.
              A larger on-chip tile can reuse data before going back for more. In the paper's model, M
              counts scalar elements and ranges from head width d to sequence length n times d. The tiled
              access bound scales as n squared times d squared over M. The materializing baseline needs
              at least order n times d plus n squared accesses. Converting that bound to seconds takes a
              hardware measurement.
            targets:
              - fa-workspace-accounting-mechanism
            color: cyan
            linger: 0.35
  - id: tiles
    title: "What survives the next tile?"
    visual: >-
      A single query stays on chip as two pairs of scored keys visit the same two slots. A counter
      records only completed comparisons. The row summary survives the overwrite.
    beats:
      - say: >-
          Zoom in on one query. All four keys are allowed. A score is the query-key dot product
          divided by the square root of the head width. Give each key a two-coordinate value. The
          first pair earns scores of one and two. We keep the largest score, a sum of weights and a
          weighted sum of values. Those three pieces are enough to release the first pair of scores.
        hold: 0.9
        visual_cues:
          - id: tile-first
            phrase: "The first pair earns scores of one and two"
            targets: [tile-slots]
            linger: 0.4
            caption_boundary: true
          - id: tile-save
            phrase: "a sum of weights and a weighted sum of values"
            targets: [tiles-running-summary]
            linger: 0.4
            caption_boundary: true
      - say: >-
          Keep the query here. The second pair brings scores of three and zero into the same two slots.
          Four comparisons are complete. The largest score has changed. How can we combine the new
          weights with the ones we already counted?
        hold: 1.8
        visual_cues:
          - id: tile-second
            phrase: "The second pair brings scores of three and zero"
            targets: [tile-slots]
            linger: 0.4
            caption_boundary: true
          - id: tile-count
            phrase: "Four comparisons are complete"
            targets: [tile-counts]
            linger: 0.4
            caption_boundary: true
      - say: >-
          Once the two sums use the same scale, divide the weighted value sum by the weight sum to get
          the output. Only the output and any requested row statistics go back to main memory. Let's
          replay that change of scale with the actual weights.
        hold: 0.7
        visual_cues:
          - id: tile-release
            phrase: "Only the output and any requested row statistics go back to main memory"
            targets: [tile-slots]
            linger: 0.4
            caption_boundary: true
  - id: online
    title: "What happens to the weight on the old keys?"
    visual: >-
      Two key-value pairs establish three blue sums. A new score of three sets a new reference. The
      old bars shrink together inside their original outlines, then the second tile's contributions
      extend them. The last division produces the output.
    beats:
      - say: >-
          A score of two is the largest in our first tile. Subtract two from each score before taking
          its exponential. The key with score two gets weight one. Its value puts ten in the second
          coordinate. The other key carries ten in the first coordinate. Its weight is about point
          three six eight, so it adds about three point six eight there. Add the weights to get the
          denominator. Keep both coordinates of the numerator.
        hold: 0.8
        visual_cues:
          - id: online-first
            phrase: "The key with score two gets weight one"
            targets: [online-keys]
            linger: 0.4
            caption_boundary: true
          - id: online-other
            phrase: "so it adds about three point six eight there"
            targets: [online-keys, online-bars]
            linger: 0.4
          - id: online-totals
            phrase: "Add the weights to get the denominator"
            targets: [online-bars]
            linger: 0.4
            caption_boundary: true
      - say: >-
          Here comes a score of three. Look at the old key with score two. It used to have weight one.
          With three as our reference, what weight should that same key carry?
        hold: 2.2
        visual_cues:
          - id: online-arrival
            phrase: "Here comes a score of three"
            targets: [online-keys]
            linger: 0.4
            caption_boundary: true
      - say: >-
          Two minus three is negative one. Its exponential is about point three six eight. Every old
          weight shrinks by that factor. Watch the ten in the second coordinate shrink with it. Multiply
          the old denominator and both parts of the old numerator by the same factor. Now we can add the
          new tile.
        hold: 0.85
        visual_cues:
          - id: online-factor
            phrase: "Its exponential is about point three six eight"
            targets: [online-keys]
            linger: 0.4
            caption_boundary: true
          - id: online-rescale-old
            phrase: "Every old weight shrinks by that factor"
            targets: [online-bars]
            linger: 0.4
            caption_boundary: true
      - say: >-
          Add the second tile on the new scale. The key with score three contributes its whole value,
          five in each coordinate. The key with score zero contributes a little to each. Divide both
          totals by the combined weight. The result is about four point three eight zero and five point
          six two zero. A dense softmax over all four keys gives the same pair to this precision. Moving
          a tile boundary changes which scores share storage. Floating-point rounding can change
          slightly with the order of addition.
        hold: 1
        visual_cues:
          - id: online-merge-summary
            phrase: "Add the second tile on the new scale"
            targets: [online-bars]
            linger: 0.4
            caption_boundary: true
          - id: online-result
            phrase: "The result is about four point three eight zero and five point six two zero"
            targets: [online-output]
            linger: 0.4
            caption_boundary: true
          - id: online-check
            phrase: "A dense softmax over all four keys gives the same pair to this precision"
            targets: [online-output]
            linger: 0.4
            caption_boundary: true
  - id: recurrence-domain
    title: "Does the output belong on this line?"
    visual: >-
      The first tile initializes a row recurrence. With the denominator correct, omitting the old
      numerator's scale moves the output off the line shared by every input value. Restoring the
      scale puts it back. An empty tile is then distinguished from an entirely empty row.
    beats:
      - say: >-
          For a fresh row, the largest score starts at negative infinity. Both sums start at zero. For
          each nonempty tile, take the larger maximum. Shift every incoming score by that maximum and
          exponentiate. Add those weights to the rescaled denominator. Multiply them by their values and
          add those contributions to the rescaled numerator. Wait until the last tile to divide.
        hold: 0.7
        visual_cues:
          - id: recurrence-steps
            phrase: "For each nonempty tile, take the larger maximum"
            targets: [recurrence-rule]
            linger: 0.4
            caption_boundary: true
      - say: >-
          Here's a way to check our result by eye. Each blue dot is one of the four value vectors. Its
          two coordinates add to ten. So any weighted average must land on that line. Suppose we rescale
          the denominator but leave the old numerator untouched. Where would you expect the output to
          land?
        hold: 2
        visual_cues:
          - id: recurrence-line
            phrase: "Its two coordinates add to ten"
            targets: [recurrence-plane]
            linger: 0.4
            caption_boundary: true
      - say: >-
          Off the line. The second coordinate alone is nearly ten, and the first is almost six. That sum
          is too large for any mixture of these values. Keep the denominator. Rescale the old numerator
          as well. Now the point is back on the line, at four point three eight zero and five point six
          two zero. This check catches that mistake. Comparing with a dense reference also checks where
          on the line we landed.
        hold: 0.9
        visual_cues:
          - id: recurrence-wrong
            phrase: "Off the line"
            targets: [recurrence-plane]
            linger: 0.4
            caption_boundary: true
          - id: recurrence-fix
            phrase: "Rescale the old numerator as well"
            targets: [recurrence-plane]
            linger: 0.4
            caption_boundary: true
          - id: recurrence-result
            phrase: "at four point three eight zero and five point six two zero"
            targets: [recurrence-readout]
            linger: 0.4
            caption_boundary: true
      - say: >-
          If a tile has no allowed key, skip it before subtracting maxima. Negative infinity minus
          negative infinity is undefined. If the whole row is empty, the documented kernel convention
          returns zero. For nonempty rows, a common finite score shift or a different tile boundary
          preserves the mathematical result. The article's CPU check also rejects ragged values, invalid
          tile sizes, NaNs and positive-infinite scores. Use a tolerance for floating-point comparisons.
        hold: 0.9
        visual_cues:
          - id: recurrence-skip
            phrase: "skip it before subtracting maxima"
            targets: [recurrence-empty]
            linger: 0.4
            caption_boundary: true
          - id: recurrence-zero
            phrase: "the documented kernel convention returns zero"
            targets: [recurrence-empty]
            linger: 0.4
            caption_boundary: true
  - id: mask
    title: "Where does the first query sit?"
    visual: >-
      The two queries occupy positions three and four on a five-key ruler. The first row of an
      upper-left mask stops under ten. The lower-right mask reaches forty. Each row's actual
      addends, divisor and answer stay together.
    beats:
      - say: >-
          These two queries sit at the end of a five-token sequence. The first sits over forty. Its
          neighbor sits over fifty. A query can use its own key and every earlier key. Give every
          allowed key the same score, so the output is their average. Which values belong in the first
          query's average?
        hold: 2.2
        visual_cues:
          - id: mask-pin
            phrase: "The first sits over forty"
            targets: [mask-positions]
            linger: 0.4
            caption_boundary: true
      - say: >-
          Trace the mask the caller supplied. Its first row stops under ten. The next row stops under
          twenty. The caller has counted from the first query row as if it sat at key zero. That
          upper-left corner returns ten for the first query and fifteen for its neighbor.
        hold: 1.2
        visual_cues:
          - id: mask-left
            phrase: "Its first row stops under ten"
            targets: [mask-mixtures]
            linger: 0.4
            caption_boundary: true
          - id: mask-wrong
            phrase: "That upper-left corner returns ten for the first query and fifteen for its neighbor"
            targets: [mask-answers]
            linger: 0.4
            caption_boundary: true
      - say: >-
          Keep the five values still. Line up the last query with the last key. The row above it now
          ends under forty. Ten, twenty, thirty and forty sum to a hundred. Divide by four and you get
          twenty-five. The second query includes fifty as well, so it returns thirty.
        hold: 1.1
        visual_cues:
          - id: mask-align
            phrase: "Line up the last query with the last key"
            targets: [mask-mixtures]
            linger: 0.4
            caption_boundary: true
          - id: mask-first-answer
            phrase: "Divide by four and you get twenty-five"
            targets: [mask-answers]
            linger: 0.4
            caption_boundary: true
          - id: mask-last-answer
            phrase: "so it returns thirty"
            targets: [mask-answers]
            linger: 0.4
            caption_boundary: true
      - say: >-
          FlashAttention two point one uses this bottom-right causal corner. Earlier versions used the
          upper left. PyTorch's built-in causal flag uses the upper left for unequal lengths. When your
          queries occupy the tail, give the reference an explicit lower-right mask. A square test passes
          with either corner. Test unequal lengths in both directions.
        hold: 0.85
        visual_cues:
          - id: mask-contract
            phrase: "give the reference an explicit lower-right mask"
            targets: [mask-contracts]
            linger: 0.4
            caption_boundary: true
  - id: window-empty
    title: Derive the legal keys from their actual positions
    visual: The existing two-by-five mask retains query positions three/four; it changes to an
      explicitly bounded local window, then reverses unequal lengths to expose three empty rows.
    beats:
      - say: For query row i, query length L and key length S, the bottom-right matching key position is i
          plus S minus L. A finite local window includes positions from that center minus left
          extent through center plus right extent, including both endpoints and clipping to valid
          keys. A minus-one extent means unbounded on that side. A causal rule can further remove
          future keys.
        hold: 0.7
        visual_cues:
          - id: fa-window-empty-0
            phrase: For query row i, query length L and key length S, the bottom-right matching key position is
              i plus S minus L. A finite local window includes positions from that center minus left
              extent through center plus right extent, including both endpoints and clipping to
              valid keys. A minus-one extent means unbounded on that side. A causal rule can further
              remove future keys.
            targets:
              - fa-window-empty-mechanism
            color: cyan
            linger: 0.35
      - say: For our two queries and five keys, the centers are three and four. With left extent one and
          right extent zero, their windows are keys two and three, then keys three and four. Equal
          scores average values thirty and forty to thirty-five, then forty and fifty to forty-five.
          The first query used to average ten through forty. Keeping just its last two keys raises
          that output from twenty-five to thirty-five.
        hold: 0.7
        visual_cues:
          - id: fa-window-empty-1
            phrase: For our two queries and five keys, the centers are three and four. With left extent one and
              right extent zero, their windows are keys two and three, then keys three and four.
              Equal scores average values thirty and forty to thirty-five, then forty and fifty to
              forty-five. The first query used to average ten through forty. Keeping just its last
              two keys raises that output from twenty-five to thirty-five.
            targets:
              - fa-window-empty-mechanism
            color: cyan
            linger: 0.35
          - id: fa-window-first
            phrase: Equal scores average values thirty and forty to thirty-five
            targets:
              - fa-window-empty-mechanism
            color: cyan
            linger: 0.35
          - id: fa-window-second
            phrase: then forty and fifty to forty-five
            targets:
              - fa-window-empty-mechanism
            color: cyan
            linger: 0.35
      - say: Reverse the lengths to five queries and two keys. Bottom-right centers are negative three,
          negative two, negative one, zero and one. The first three rows have no legal keys and
          return zero by convention. The final two rows see one and two keys. Equal-length tests
          alone cannot reveal a wrong causal corner; compare both unequal-length directions against
          an explicit intended mask.
        hold: 0.7
        visual_cues:
          - id: fa-window-empty-2
            phrase: Reverse the lengths to five queries and two keys. Bottom-right centers are negative three,
              negative two, negative one, zero and one. The first three rows have no legal keys and
              return zero by convention. The final two rows see one and two keys. Equal-length tests
              alone cannot reveal a wrong causal corner; compare both unequal-length directions
              against an explicit intended mask.
            targets:
              - fa-window-empty-mechanism
            color: cyan
            linger: 0.35
          - id: fa-reverse-zero
            phrase: The first three rows have no legal keys and return zero by convention
            targets:
              - fa-window-empty-mechanism
            color: cyan
            linger: 0.35
  - id: packed
    title: "Where does the first sentence end?"
    visual: >-
      Five packed words keep their physical addresses and attached values. Changing a single middle
      offset slides the boundary across Rain. Its value enters the first sequence's sum and leaves
      again when the offset is restored.
    beats:
      - say: >-
          Read these two examples. Birds sing softly. Rain falls. In memory, the five words sit side by
          side. The first example starts at zero and stops just before three. Use full attention
          within each example. Give a query in the first sentence equal scores for every key it can
          see. Two plus four plus eight gives fourteen, shared across three words.
        hold: 0.85
        visual_cues:
          - id: packed-sum
            phrase: "Two plus four plus eight gives fourteen"
            targets: [packed-mean]
            linger: 0.4
            caption_boundary: true
      - say: >-
          Suppose the caller writes four in the middle offset. Keep the words and their values exactly
          where they are. Which word would join the first example, and what would its average become?
        hold: 2.1
        visual_cues:
          - id: packed-shift
            phrase: "writes four in the middle offset"
            targets: [packed-boundary]
            linger: 0.4
            caption_boundary: true
      - say: >-
          Rain brings a hundred into the sum. Four values now average twenty-eight point five. Every
          multiply can be correct and still mix two people's examples. Move the boundary back to three.
          Rain stays at address three, but its hundred drops out. The first average is fourteen thirds
          again.
        hold: 1.1
        visual_cues:
          - id: packed-admit
            phrase: "Rain brings a hundred into the sum"
            targets: [packed-boundary, packed-mean]
            linger: 0.4
            caption_boundary: true
          - id: packed-wrong-mean
            phrase: "Four values now average twenty-eight point five"
            targets: [packed-mean]
            linger: 0.4
            caption_boundary: true
          - id: packed-restore
            phrase: "Move the boundary back to three"
            targets: [packed-boundary]
            linger: 0.4
            caption_boundary: true
          - id: packed-restored-mean
            phrase: "The first average is fourteen thirds again"
            targets: [packed-mean]
            linger: 0.4
            caption_boundary: true
  - id: packed-page-contract
    title: "Where is the next key stored?"
    visual: >-
      The offsets mark the ends of two adjacent token ranges. A block-table lookup then follows
      logical page zero for request A to physical page two, and for request B to physical page zero.
    beats:
      - say: >-
          Check the offsets before packing. For two examples you need three entries, starting at zero
          and ending at the packed token count. Adjacent differences give the lengths, three and two.
          The maximum is three. Check both the query and key arrays this way. Each uses thirty-two-bit
          integers and must never run backward.
        hold: 0.9
        visual_cues:
          - id: page-offsets
            phrase: "Adjacent differences give the lengths, three and two"
            targets: [packed-offsets]
            linger: 0.4
            caption_boundary: true
      - say: >-
          During decode the caller can store keys in separate physical pages. Follow request A to its
          first logical page. The entry two sends the kernel to physical page two. Now follow request B.
          Its first logical page points to physical page zero. The serving engine supplies this table
          and manages allocation, eviction and sharing.
        hold: 1.1
        visual_cues:
          - id: page-a
            phrase: "Follow request A to its first logical page"
            targets: [page-lookup]
            linger: 0.4
            caption_boundary: true
          - id: page-b
            phrase: "Now follow request B"
            targets: [page-lookup]
            linger: 0.4
            caption_boundary: true
      - say: >-
          For the pinned FlashAttention two cache call, reserve space before a write. The block size
          must be divisible by two hundred fifty-six. This forward-only call can update the cache in
          place and apply rotary embeddings. If two writers name the same cache batch index, they
          compete for that location. The engine must schedule those writes.
        hold: 0.7
        visual_cues:
          - id: page-writes
            phrase: "If two writers name the same cache batch index"
            targets: [page-lookup]
            linger: 0.4
            caption_boundary: true
  - id: page-padding
    title: Which padding rows did the kernel load?
    visual: A declared whole-page TMA load distinguishes used rows, loaded padding in the final partial
      page and completely untouched pages; zero-times-NaN reaches the real value accumulator before
      finite padding repairs it.
    beats:
      - say: >-
          Look at the last page this request actually uses. The October snapshot of generation four
          documents a loader that reads a whole tile. That read can bring padding values into the
          multiply even though the mask gave them zero weight. Zero probability times a NaN value is
          still NaN. The bad value can reach the output.
        hold: 0.7
        visual_cues:
          - id: fa-page-padding-0
