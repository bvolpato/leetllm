            phrase: structurally zero exposure probability
            targets:
              - propensity-contract-mechanism
            color: pink
            linger: 0.5
      - say: Estimate the required propensity from identifiable data rather than assuming one divided by
          position. Randomized position swaps are one approach. Agarwal and colleagues also harvest
          position variation across multiple historic rankers under their position-based model and
          assignment/support assumptions. Their model can identify relative propensities; it does
          not grant an unconditional guarantee for arbitrary historical logs.
        hold: 0.75
        visual_cues:
          - id: propensity-relative
            phrase: identify relative propensities
            targets:
              - propensity-contract-mechanism
            color: cyan
            linger: 0.5
      - say: "A common positive rescaling of an unregularized loss preserves its minimizer, but a fixed
          regularizer changes its relative influence unless adjusted. Relative examination weights
          do not identify an absolute relevance rate. This fixture performs no propensity study: its
          fields stay unset and its rows stay evaluation-only. A version string names an estimate;
          suitable evidence and downstream access controls must validate and enforce its use."
        hold: 0.75
        visual_cues:
