  - id: click-model
    title: Make the attention assumption earn inverse weighting
    visual: Two equally relevant items pass through different examination probabilities; exact expected
      clicks and clipped contributions remain conserved.
    beats:
      - say: Construct an explicit toy click model. Let O mean examined, R mean relevant, and click C equal
          O times R with no click noise. At a fixed context, assume relevance is independent of
          examination, and examination depends only on position. Then click probability is
          examination propensity p times relevance probability r. Independence is an assumption, not
          a consequence of the probability chain rule.
        hold: 0.75
        visual_cues:
          - id: click-product
            phrase: click C equal O times R
            targets:
              - click-model-mechanism
            color: cyan
            linger: 0.5
          - id: click-independence
            phrase: relevance is independent of examination
            targets:
              - click-model-mechanism
            color: cyan
            linger: 0.5
      - say: "Use relevance probability point five at both positions and examination probabilities point
          eight and point two. Expected click rates are point four and point one. Divide each click
          by its positive examination probability: inverse weights one point two five and five give
          expected weighted clicks point five for both. This is an expectation over the toy
          mechanism; one finite log need not match it."
        hold: 0.75
        visual_cues:
          - id: click-raw
            phrase: Expected click rates are point four and point one
            targets:
              - click-model-mechanism
            color: cyan
            linger: 0.5
          - id: click-inverse
            phrase: inverse weights one point two five and five give expected weighted clicks point five for
              both
            targets:
              - click-model-mechanism
            color: cyan
            linger: 0.5
      - say: Clipping uses the smaller of inverse propensity and the chosen positive cap. Clip each inverse
          weight at two. The first stays one point two five and its expectation stays point five.
          The second falls from five to two, making point one times two equal point two. Clipping
          bounds weights but introduces bias; neither small bias nor small variance follows
          automatically. Real clicks can also depend on attractiveness, trust and accidental
          interaction, so evaluate the observation model.
        hold: 0.75
        visual_cues:
          - id: click-clip
            phrase: The second falls from five to two, making point one times two equal point two
            targets:
              - click-model-mechanism
            color: cyan
            linger: 0.5
          - id: click-bias
            phrase: expectation stays point five
            targets:
              - click-model-mechanism
            color: cyan
            linger: 0.5
  - id: propensity-contract
    title: Keep three probabilities and missing support distinct
    visual: Experiment assignment, selection and examination receive separate named paths; zero exposure
      stays visibly empty instead of being rescaled.
    beats:
      - say: A fifty-fifty experiment allocation describes assignment to an arm. Action-selection
          probability describes choosing a product or slate. Examination propensity describes
          looking at a product already shown. They are different probabilities. An item with
          structurally zero exposure probability contributes no behavioral evidence; no finite
          examination weight creates its missing outcomes. New judgments or approved exploration
          supply new observations.
