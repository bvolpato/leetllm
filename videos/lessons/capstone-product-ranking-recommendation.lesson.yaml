scenes:
  - id: intro
    title: A useful search list starts before scoring
    visual: Raw matches split into eligible and prohibited candidates before the displayed ranking forms.
    beats:
      - say: A shopper searches for a label printer. The closest text matches include a blocked listing and
          a product that cannot ship to their region. A useful ranking system must preserve those
          constraints while choosing an order that helps the shopper find a suitable item.
        hold: 0.75
        visual_cues:
          - id: intro-b1-1
            phrase: searches for a label printer
            targets:
              - query
            linger: 0.45
          - id: intro-b1-2
            phrase: blocked listing
            targets:
              - blocked-products
            linger: 0.45
          - id: intro-b1-3
            phrase: cannot ship to their region
            targets:
              - blocked-products
            linger: 0.45
      - say: We will build a small ranking experiment from that problem. First decide what may appear, then
          measure which relevant items reach the ranker, learn how to order them, and inspect how
          the displayed list changes the feedback we later collect.
        hold: 0.85
        visual_cues:
          - id: intro-b2-1
            phrase: First decide what may appear
            targets:
              - eligibility-reasons
            linger: 0.45
          - id: intro-b2-2
            phrase: learn how to order them
            targets:
              - ranking-pool
            linger: 0.45
  - id: funnel-contract
    title: Separate retrieval, ranking and slate construction
    visual: The same eligible P5/P6/P4 identities pass through candidate selection, pair scoring and a
      computed MMR tradeoff.
    beats:
      - say: The catalog has ten authored listings across two searches. Our first stage sorts supplied
          retrieval scores and filters required eligibility. It builds no embedding model or
          approximate-neighbor index. A large system can use lexical or two-tower retrieval before a
          richer query-item ranker. The candidate budget and displayed cutoff have different jobs
          and need separate measurements.
        hold: 0.75
        visual_cues:
          - id: funnel-catalog
            phrase: The catalog has ten authored listings
            targets:
              - funnel-contract-mechanism
            color: cyan
            linger: 0.5
          - id: funnel-cutoffs
            phrase: candidate budget and displayed cutoff
            targets:
              - funnel-contract-mechanism
            color: cyan
            linger: 0.5
      - say: Ranking scores the surviving candidates. LambdaMART is a boosted-tree ranking method whose
          pairwise updates can be weighted by ranking-metric changes. Our trainer will instead use a
          two-feature linear pairwise objective. Neither architecture turns a relevance score into
          permission to display a prohibited or undeliverable listing.
        hold: 0.75
        visual_cues:
          - id: funnel-pair
            phrase: pairwise updates can be weighted by ranking-metric changes
            targets:
              - funnel-contract-mechanism
            color: cyan
            linger: 0.5
      - say: "Construct the slate after scoring. For a worked M M R worksheet, give relevance weight point
          six and redundancy weight point four. P five, P six and P four have relevance point nine
          six, point eight four and point four five. With no selected item, redundancy is zero, so P
          five wins point five seven six. Then similarity to P five is point nine for P six and
          point one for P four. Their values become point one four four and point two three: P four
          wins the second slot. This is a computed diversification worksheet, not an implemented lab
          component."
        hold: 0.75
        visual_cues:
          - id: mmr-first
            phrase: P five wins point five seven six
            targets:
              - funnel-contract-mechanism
            color: cyan
            linger: 0.5
          - id: mmr-second
            phrase: "Their values become point one four four and point two three: P four wins the second slot"
            targets:
              - funnel-contract-mechanism
            color: cyan
            linger: 0.5
  - id: eligibility
    title: Treat eligibility as an explicit decision
    visual: Five raw matches flow into a single shortlist only when eligible. Policy and region
      exclusions keep their rejection reasons and remain outside the ranking pool.
    beats:
      - say: Look at these retrieval scores. The blocked products would win an ordinary score sort.
          Eligibility rules remove them from the display pool regardless of their match strength.
          The remaining listings fill the candidate budget, with rejection reasons retained for
          inspection.
        hold: 0.75
        motion_check:
          region:
            - 610
            - 330
            - 1200
            - 600
          minimumChangedFraction: 0.002
        visual_cues:
          - id: eligibility-b1-1
            phrase: blocked products would win
            targets:
              - rejected-rows
            linger: 0.45
          - id: eligibility-b1-2
            phrase: Eligibility rules remove them
            targets:
              - rejection-reasons
            linger: 0.45
          - id: eligibility-b1-3
            phrase: remaining listings fill the candidate budget
            targets:
              - ranking-pool
            linger: 0.45
      - say: A learned penalty could be outweighed by another feature, so enforce required display rules
          directly. Recheck the applicable state when constructing the response and record its
          version. Our in-memory fixture demonstrates the rule; a service also needs an
          authoritative eligibility source and update policy.
        hold: 0.85
        visual_cues:
          - id: eligibility-b2-1
            phrase: enforce required display rules directly
            targets:
              - rejected-rows
            linger: 0.45
          - id: eligibility-b2-2
            phrase: authoritative eligibility source
            targets:
              - ranking-pool
            linger: 0.45
  - id: slate-recheck
    title: A score cannot repair a forbidden slate
    visual: Persistent catalog rows retain policy, stock, region and seller fields as a candidate loses
      stock before response creation.
    beats:
      - say: The eligibility function tests policy approval, then stock, then region. P eight fails policy
          and stock, but this helper records the first failure, policy block. P eleven fails region.
          Validation rejects malformed flags, grades and nonfinite scores. Retrieval fills its
          budget from eligible products rather than letting forbidden high scores consume the entire
          shortlist.
        hold: 0.75
        visual_cues:
          - id: slate-first-failure
            phrase: P eight fails policy and stock
            targets:
              - slate-recheck-mechanism
            color: cyan
            linger: 0.5
          - id: slate-fill
            phrase: fills its budget from eligible products
            targets:
              - slate-recheck-mechanism
            color: cyan
            linger: 0.5
      - say: The lab checks a fictional maximum of two listings per seller in a three-item slate. A
          concentration cap is its own constraint; it does not prove fairness. A real constructor
          needs an explicit skip, refill, or shorter-slate policy. Sponsored placements and M M R
          would need their own evaluated contracts rather than being assumed from this three-row
          check.
        hold: 0.75
        visual_cues:
          - id: slate-seller
            phrase: maximum of two listings per seller
            targets:
              - slate-recheck-mechanism
            color: cyan
            linger: 0.5
      - say: Recheck current eligibility before retaining the response. If P five becomes out of stock after
          scoring, impression-rows rejects the slate instead of trusting its old score. Rebuild from
          current eligible candidates under a new pinned snapshot. Historical replay still needs the
          old catalog, while a new response must not restore obsolete eligibility merely to
          reproduce yesterday’s list.
        hold: 0.75
        visual_cues:
          - id: slate-stock
            phrase: P five becomes out of stock after scoring
            targets:
              - slate-recheck-mechanism
            color: pink
            linger: 0.5
          - id: slate-rebuild
            phrase: Rebuild from current eligible candidates
            targets:
              - slate-recheck-mechanism
            color: green
            linger: 0.5
          - id: slate-history
            phrase: Historical replay still needs the old catalog
            targets:
              - slate-recheck-mechanism
            color: cyan
            linger: 0.5
  - id: ordering
    title: Give position a measurable value
    visual: Candidate identities carry their grades as control positions transform into the ideal order.
    beats:
      - say: Human judgments assign stronger relevance to some surviving products. Showing a weak result
          first spends the most valuable position poorly. Discounted cumulative gain adds each
          relevance gain after reducing the value of later positions. The ideal ordering supplies a
          common reference.
        hold: 0.75
        visual_cues:
          - id: ordering-b1-1
            phrase: stronger relevance
            targets:
              - ranked-products
            linger: 0.45
          - id: ordering-b1-2
            phrase: reducing the value of later positions
            targets:
              - discount-calculation
            linger: 0.45
          - id: ordering-b1-3
            phrase: ideal ordering
            targets:
              - ideal-gain
            linger: 0.45
      - say: Divide the observed gain by that ideal gain to obtain NDCG. Our control places the weakest of
          these three first; the treatment puts the strongest first. The metric rewards the improved
          order while preserving the same candidate identities and judged relevance.
        hold: 0.85
        visual_cues:
          - id: ordering-b2-1
            phrase: Divide the observed gain
            targets:
              - normalized-gain
            linger: 0.45
          - id: ordering-b2-2
            phrase: treatment puts the strongest first
            targets:
              - ranked-products
            linger: 0.45
          - id: ordering-b2-3
            phrase: same candidate identities
            targets:
              - dcg-total
            linger: 0.45
  - id: metric-contracts
    title: Earn the ranking metric and its denominator
    visual: One relevance grade becomes an exponential gain, receives a position discount and
      contributes to a fixed-universe metric.
    beats:
      - say: Pin the metric before comparing methods. This lab uses gain equal to two raised to the
          relevance grade, minus one. At one-based position i, divide that gain by the base-two
          logarithm of the quantity i plus one. Add the first K contributions for D C G. Sort the
          fixed judgment universe into its ideal order and divide observed D C G by ideal D C G for
          N D C G. Some libraries use linear gain, so their number can differ even on the same list.
        hold: 0.75
        visual_cues:
          - id: metric-gains
            phrase: two raised to the relevance grade, minus one
            targets:
              - metric-contracts-mechanism
            color: cyan
            linger: 0.5
          - id: metric-discount
            phrase: divide that gain by the base-two logarithm
            targets:
              - metric-contracts-mechanism
            color: cyan
            linger: 0.5
          - id: metric-normalize
            phrase: divide observed D C G by ideal D C G
            targets:
              - metric-contracts-mechanism
            color: cyan
            linger: 0.5
      - say: "Binary candidate recall uses a different rule here: relevant means eligible grade at least
          two. Divide the number of those products retrieved by all relevant eligible judgments in
          the declared universe. Grade one still contributes positive graded gain to N D C G. The
          helper rejects duplicated products, changed judgments and unknown items; no relevant
          eligible judgments is an error for recall, while zero ideal gain yields N D C G zero."
        hold: 0.75
        visual_cues:
          - id: metric-recall
            phrase: relevant means eligible grade at least two
            targets:
              - metric-contracts-mechanism
            color: cyan
            linger: 0.5
          - id: metric-guards
            phrase: rejects duplicated products, changed judgments and unknown items
            targets:
              - metric-contracts-mechanism
            color: cyan
            linger: 0.5
      - say: Mean reciprocal rank asks only where the first relevant result appears. Take one divided by
          that one-based rank, or zero if none appears, then average across query instances. A first
          relevant item at rank three contributes one third. Pin whether relevance is independently
          judged or defined by a click. Neither reciprocal rank nor N D C G directly measures
          shopper satisfaction or establishes a purchase probability.
        hold: 0.75
        visual_cues:
          - id: metric-mrr
            phrase: first relevant item at rank three contributes one third
            targets:
              - metric-contracts-mechanism
            color: cyan
            linger: 0.5
  - id: recall
    title: Expose the product retrieval dropped
    visual: Binary recall explicitly counts grades of at least two, showing two of two relevant products
      before P6 leaves and one of two afterward. NDCG retains positive graded gains for grade one as
      well, so survivor and fixed-universe ranking metrics remain separate from the binary recall
      criterion.
    beats:
      - say: Now remove a relevant product before ranking. The ranker can perfectly order every survivor and
          still leave the shopper without that option. Candidate recall asks how many relevant
          eligible items reached this stage, using the original judgment universe as its
          denominator.
        hold: 0.75
        visual_cues:
          - id: recall-b1-1
            phrase: remove a relevant product
            targets:
              - removed-p6
            linger: 0.45
          - id: recall-b1-2
            phrase: every survivor
            targets:
              - retained-p5
              - retained-p4
            linger: 0.45
          - id: recall-b1-3
            phrase: original judgment universe
            targets:
              - recall-metrics
            linger: 0.45
      - say: Notice how a score normalized only against survivors can stay perfect. Keeping the full
          eligible universe in the ranking denominator exposes the loss. Report retrieval coverage
          and ordering separately, with their cutoffs and relevance criteria, so an excellent second
          stage cannot hide an incomplete first stage.
        hold: 0.85
        visual_cues:
          - id: recall-b2-1
            phrase: normalized only against survivors
            targets:
              - recall-metrics
            linger: 0.45
          - id: recall-b2-2
            phrase: full eligible universe
            targets:
              - removed-p6
            linger: 0.45
  - id: offline-gates
    title: Expose both component loss and a hidden bad slice
    visual: Actual two-query gains and the P3 omission remain beside synthetic percentile samples and
      independently named gates.
    beats:
      - say: The two-query hand-entered fixture has baseline N D C G about point nine seven two for
          insulated bag and point seven three six for label printer. Their mean is point eight five
          four. The candidate gives one on both. These are regression scores supplied by the author;
          the model-fitting exercise is a separate artifact.
        hold: 0.75
        visual_cues:
          - id: offline-per-query
            phrase: baseline N D C G about point nine seven two
            targets:
              - offline-gates-mechanism
            color: cyan
            linger: 0.5
          - id: offline-mean
            phrase: Their mean is point eight five four
            targets:
              - offline-gates-mechanism
            color: cyan
            linger: 0.5
      - say: Now remove P three from the insulated-bag candidate list. Its surviving ideal order still
          normalizes to one against itself. Keep the original eligible universe, and N D C G falls
          to about point eight one two; binary recall falls to one half. A per-query gate can also
          catch a poor ordering hidden by a better mean. Preserve the cutoff, universe and relevance
          rule with each result.
        hold: 0.75
        visual_cues:
          - id: offline-drop
            phrase: remove P three
            targets:
              - offline-gates-mechanism
            color: cyan
            linger: 0.5
          - id: offline-universe
            phrase: Keep the original eligible universe
            targets:
              - offline-gates-mechanism
            color: cyan
            linger: 0.5
      - say: "The local gates also check no blocked displays, complete unique slates, known versions, stable
          assignment, outcome joins and a seller count at most two. Its ten supplied scoring samples
          have nearest-rank p ninety-five of eighteen milliseconds: sort, take the ceiling of sample
          count times point nine five, then select that one-based rank. Passing the fictional
          twenty-millisecond threshold proves this synthetic calculation, not measured service
          latency."
        hold: 0.75
        visual_cues:
          - id: offline-gates
            phrase: complete unique slates
            targets:
              - offline-gates-mechanism
            color: cyan
            linger: 0.5
          - id: offline-percentile
            phrase: ceiling of sample count times point nine five
            targets:
              - offline-gates-mechanism
            color: cyan
            linger: 0.5
          - id: offline-synthetic
            phrase: not measured service latency
            targets:
              - offline-gates-mechanism
            color: cyan
            linger: 0.5
  - id: pairwise
    title: Learn a scoring direction from a preference
    visual: Fixed P5 and P4 feature vectors drop perpendiculars onto the current weight direction.
      Twelve pairwise updates rotate that direction toward listing quality. The projected score
      order reverses with the computed dot products.
    beats:
      - say: The ranker uses semantic match and listing quality. P5 loses on semantic match, but our
          judgment prefers its stronger listing quality. The projections favor P4. Predict how
          learning that preference should turn the scoring direction.
        hold: 1
        visual_cues:
          - id: pairwise-b1-1
            phrase: P5 loses on semantic match
            targets:
              - feature-pair
            linger: 0.45
          - id: pairwise-b1-2
            phrase: projections favor P4
            targets:
              - weights
              - score-projections
            linger: 0.45
      - say: The pairwise loss increases the preferred product’s margin. Watch the shared direction turn
          toward listing quality. P5’s projection moves ahead, and its computed score overtakes P4.
          We still need later untouched requests to evaluate this learned rule.
        hold: 0.7
        visual_cues:
          - id: pairwise-b2-1
            phrase: pairwise loss increases
            targets:
              - pairwise-loss
            linger: 0.45
          - id: pairwise-b2-2
            phrase: shared direction turn toward listing quality
            targets:
              - weights
              - score-projections
            linger: 0.45
          - id: pairwise-b2-3
            phrase: computed score overtakes P4
            targets:
              - learned-scores
            linger: 0.45
  - id: pairwise-objective
    title: Derive one preference update before training the matrix
    visual: A2−A1 equals a signed two-coordinate difference; its margin, stable loss and exact gradient
      lead to a visible update.
    beats:
      - say: The rotating arrow was a separate single-preference illustration with twelve visual updates.
          Now use the actual C S V training rule. A two has features point eight five, point nine
          zero; A one has point nine five, point three zero. Better minus worse is negative point
          one, positive point six. Score is the dot product of weights and features; the preferred
          margin is the dot product with that difference.
        hold: 0.75
        visual_cues:
          - id: pair-difference
            phrase: Better minus worse
            targets:
              - pairwise-objective-mechanism
            color: cyan
            linger: 0.5
          - id: pair-margin
            phrase: preferred margin is the dot product
            targets:
              - pairwise-objective-mechanism
            color: cyan
            linger: 0.5
      - say: "For one preferred pair, loss is the logarithm of one plus the exponential of the negative
          margin. Its gradient is negative feature difference times sigmoid of negative margin. At
          zero weights that sigmoid is one half, giving gradient point zero five, negative point
          three. Subtract point three times the gradient: weights become negative point zero one
          five, positive point zero nine, and the preferred margin becomes point zero five five
          five."
        hold: 0.75
        visual_cues:
          - id: pair-gradient
            phrase: At zero weights that sigmoid is one half, giving gradient point zero five, negative point
              three
            targets:
              - pairwise-objective-mechanism
            color: cyan
            linger: 0.5
          - id: pair-update
            phrase: "Subtract point three times the gradient: weights become negative point zero one five,
              positive point zero nine, and the preferred margin becomes point zero five five five"
            targets:
              - pairwise-objective-mechanism
            color: cyan
            linger: 0.5
      - say: The full objective averages every pair loss and adds one half times lambda times squared weight
          norm. Its gradient averages the negative weighted differences, then adds lambda times
          weights. The code computes sigmoid of negative margin as exponential of negative
          log-add-exp of zero and margin, avoiding an unstable direct exponential. This linear model
          shares RankNet’s preference objective; the original RankNet uses a neural scoring
          architecture.
        hold: 0.75
        visual_cues:
          - id: pair-average
            phrase: averages every pair loss
            targets:
              - pairwise-objective-mechanism
            color: cyan
            linger: 0.5
          - id: pair-regularize
            phrase: then adds lambda times weights
            targets:
              - pairwise-objective-mechanism
            color: cyan
            linger: 0.5
  - id: training-matrix
    title: Build the actual nine-pair average
    visual: All three request groups contribute their three signed preference differences; accumulation
      leads to the actual first full update.
    beats:
      - say: "Each of three training requests has grades one, two and three. Form a directed pair whenever
          one grade is larger: three pairs per request, nine total. Equal grades contribute no
          preference pair. Keep product and request identities on every row. The feature differences
          all lie between negative one and one in this authored scale."
        hold: 0.75
        visual_cues:
          - id: training-pairs
            phrase: three pairs per request, nine total
            targets:
              - training-matrix-mechanism
            color: cyan
            linger: 0.5
      - say: At zero weights, all nine wrong-order probabilities are one half. The average gradient is
          approximately positive point zero one six six seven in text match and negative point one
          six one one one in quality. The first full update with step point three is negative point
          zero zero five, positive point zero four eight three three. It differs from the isolated A
          two versus A one update because all nine rows contribute.
        hold: 0.75
        visual_cues:
          - id: training-gradient
            phrase: The average gradient is approximately positive point zero one six six seven in text match
              and negative point one six one one one in quality
            targets:
              - training-matrix-mechanism
            color: cyan
            linger: 0.5
          - id: training-update
            phrase: The first full update with step point three is negative point zero zero five, positive point
              zero four eight three three
            targets:
              - training-matrix-mechanism
            color: cyan
            linger: 0.5
      - say: This objective averages pairs, not requests. They have equal weight here because each request
          supplies three pairs. A request with many more judged pairs would contribute more. Use a
          per-request average if equal request influence is intended. The features already share the
          supplied zero-to-one scale; a fitted scaler on real features must learn statistics from
          training only.
        hold: 0.75
        visual_cues:
          - id: training-weights
            phrase: A request with many more judged pairs would contribute more
            targets:
              - training-matrix-mechanism
            color: cyan
            linger: 0.5
          - id: training-scale
            phrase: training only
            targets:
              - training-matrix-mechanism
            color: cyan
            linger: 0.5
  - id: time
    title: Only train on labels already available
    visual: A moving label-window marker follows a pending request from day 4 to day 5.5 across the
      day-5 training freeze. The row stays out of the frozen training set until its label matures.
    beats:
      - say: Ranking rows from one request belong together. For a model intended to score later traffic,
          choose chronological windows and check when features and labels became available. A
          request served yesterday may still have an immature purchase or return outcome when
          today’s training freezes.
        hold: 0.75
        motion_check:
          region:
            - 830
            - 540
            - 300
            - 120
          minimumChangedFraction: 0.002
        visual_cues:
          - id: time-b1-1
            phrase: chronological windows
            targets:
              - freeze
            linger: 0.45
          - id: time-b1-2
            phrase: immature purchase or return outcome
            targets:
              - pending-label
            linger: 0.45
      - say: Keep the pending request out of that frozen training set. Choose regularization and other
          settings on development requests, then evaluate the later test window. This design answers
          a specific future-traffic question; new-query and new-product generalization need their
          own held-out slices.
        hold: 0.85
        visual_cues:
          - id: time-b2-1
            phrase: pending request out
            targets:
              - pending-label
            linger: 0.45
          - id: time-b2-2
            phrase: later test window
            targets:
              - label-times
            linger: 0.45
  - id: temporal-protocol
    title: Three clocks govern each frozen row
    visual: Serving time selects a half-open window, feature availability precedes serving, and every
      label must precede the freeze.
    beats:
      - say: The downloadable file contains twenty-four rows in eight three-product requests. Serving time
          chooses the request’s chronological window. Feature availability must be no later than
          serving, and a judgment cannot be available before its request. The loader requires
          explicit U T C timestamps, finite bounded features, valid grades, one query and serving
          time per request, and unique products.
        hold: 0.75
        visual_cues:
          - id: temporal-rows
            phrase: twenty-four rows in eight three-product requests
            targets:
              - temporal-protocol-mechanism
            color: cyan
            linger: 0.5
          - id: temporal-clocks
            phrase: Feature availability must be no later than serving
            targets:
              - temporal-protocol-mechanism
            color: cyan
            linger: 0.5
      - say: Training serves from May first up to but excluding May fifth, with labels strictly before May
          fifth midnight. Validation serves May fifth and sixth with labels strictly before May
          seventh. Test serves May seventh and eighth; its labels must be available before May
          tenth. Every product row of a request stays together. Labels arriving exactly at a strict
          freeze fail that historical training window.
        hold: 0.75
        visual_cues:
          - id: temporal-windows
            phrase: Training serves from May first
            targets:
              - temporal-protocol-mechanism
            color: cyan
            linger: 0.5
          - id: temporal-freeze
            phrase: Labels arriving exactly at a strict freeze
            targets:
              - temporal-protocol-mechanism
            color: cyan
            linger: 0.5
      - say: "These rules give three training, two validation and two test requests; pending-four is
          excluded. An immature return outcome is not a finalized negative. Excluding slow outcomes
          can itself select a biased cohort, so report that selection. The same query can recur
          across these windows: later traffic, unseen-query transfer and unseen-product transfer
          require different declared evaluation slices."
        hold: 0.75
        visual_cues:
          - id: temporal-counts
            phrase: three training, two validation and two test requests
