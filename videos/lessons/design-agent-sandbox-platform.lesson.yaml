scenes:
  - id: intro
    title: A job receives explicit resources and authority
    visual: An untrusted job attempts file, process and network operations while an authenticated generation owns
      its separate resource budget.
    beats:
      - say: An agent writes a short script to analyze a file. That script can also spawn processes, read available
          credentials, or leave files behind. A multi-tenant execution platform gives each job limited
          resources and authority, then proves the next job receives a clean environment. Fast startup and
          strong containment have to work together.
        hold: 0.65
        visual_cues:
          - id: intro-beat-1-focus-1
            phrase: That script can also spawn processes, read available credentials, or leave files behind
            targets:
              - intro-name
            color: cyan
            linger: 0.65
      - say: We will follow a job through a microVM, shared snapshot pages, private writes, controlled networking, and
          retirement. The article proposes an interactive warm-start target. Treat that target as a
          requirement to measure on the chosen host, guest image, and load. Our numerical examples explain
          mechanisms and capacity arithmetic rather than reporting platform benchmarks.
        hold: 0.65
        visual_cues:
          - id: intro-beat-2-focus-1
            phrase: Our numerical examples explain mechanisms and capacity arithmetic rather than reporting platform
              benchmarks
            targets:
              - intro-name
            color: cyan
            linger: 0.65
  - id: request-limits
    title: Bind one generation to its resources
    visual: A generation-stamped allocation record owns the same page mappings, scratch backing, command channel
      and expiring capability throughout its lifetime.
    beats:
      - say: Authenticate the tenant before reserving a sandbox identifier and generation. Bind placement, the command
          session, writable resources and capabilities to that identity. An existing identifier on a retried
          request needs authoritative reconciliation; assigning a new number cannot stop an old owner.
        hold: 0.7
        visual_cues:
          - id: sp-request-limits-0
            phrase: Authenticate the tenant before reserving a sandbox identifier and generation
            targets:
              - sp-request-limits-mechanism
            color: cyan
            linger: 0.4
          - id: sp-request-limits-identity
            phrase: Bind placement, the command session, writable resources and capabilities to that identity
            targets:
              - sp-request-limits-mechanism
            color: cyan
            linger: 0.4
      - say: The example product profiles offer one to four virtual CPUs, half a gibibyte to eight gibibytes of
          configured guest memory, and five gibibytes of scratch. These are chosen limits. Bound input,
          output, uploads, exports and session lifetime as well as computation.
        hold: 0.7
        visual_cues:
          - id: sp-request-limits-1
            phrase: The example product profiles offer one to four virtual CPUs, half a gibibyte to eight gibibytes of
              configured guest memory, and five gibibytes of scratch
            targets:
              - sp-request-limits-mechanism
            color: yellow
            linger: 0.4
          - id: sp-request-limits-limits
            phrase: These are chosen limits
            targets:
              - sp-request-limits-mechanism
            color: cyan
            linger: 0.4
      - say: A virtual CPU is scheduled work, and configured guest memory is an address-space allowance. Neither is a
          measurement of present physical use. Keep host memory, page tables, VMM allocations and shared
          residency in the host budget. MiB and GiB mean powers of two.
        hold: 0.7
        visual_cues:
          - id: sp-request-limits-2
            phrase: A virtual CPU is scheduled work, and configured guest memory is an address-space allowance
            targets:
              - sp-request-limits-mechanism
            color: green
            linger: 0.4
          - id: sp-request-limits-allowance
            phrase: Neither is a measurement of present physical use
            targets:
              - sp-request-limits-mechanism
            color: cyan
            linger: 0.4
  - id: boundary
    title: A guest kernel changes the trust boundary
    visual: Two guest kernels remain inside separate VMM processes above the shared trusted KVM and host boundary.
    beats:
      - say: A container uses host-kernel isolation mechanisms. A hardware virtual machine gives the job a separate
          guest kernel, with a virtual machine monitor coordinating its hardware interface. KVM supplies the
          virtualization interface, and Firecracker uses a small device model suited to microVM workloads. The
          host, VMM, and driver stack still need hardening.
        hold: 0.65
        visual_cues:
          - id: boundary-beat-1-focus-1
            phrase: A hardware virtual machine gives the job a separate guest kernel
            targets:
              - boundary-guest-kernel
            color: cyan
            linger: 0.65
          - id: boundary-beat-1-focus-2
            phrase: A container uses host-kernel isolation mechanisms
            targets:
              - boundary-host-kernel-kvm-resource-controls
            color: yellow
            linger: 0.65
      - say: "Place the VMM inside its own restricted host context: narrow filesystem access, limited privileges,
          namespace separation, syscall policy, and resource limits. Guest limits contain the user workload;
          host limits contain the VMM and its resources. Test the actual deployed boundary, including
          administrative APIs and host communication, against the declared threat model."
        hold: 0.65
        visual_cues:
          - id: boundary-beat-2-focus-1
            phrase: "Place the VMM inside its own restricted host context: narrow filesystem access"
            targets:
              - boundary-restricted-vmm-process
            color: cyan
            linger: 0.65
          - id: boundary-beat-2-focus-2
            phrase: "Place the VMM inside its own restricted host context: narrow filesystem access, limited privileges,
              namespace separation, syscall policy, and resource limits"
            targets:
              - boundary-host-kernel-kvm-resource-controls
            color: yellow
            linger: 0.65
  - id: kvm-descriptors
    title: Follow the descriptor and return value
    visual: A real descriptor tree routes each modeled KVM call, keeping failed returns separate from device exits.
    beats:
      - say: Open slash dev slash kvm to obtain the system descriptor. Creating a VM returns a VM descriptor. Register
          host userspace memory as guest physical regions, then create a virtual CPU descriptor. KVM RUN
          belongs to that virtual CPU; the VMM handles the exits that require userspace work.
        hold: 0.7
        visual_cues:
          - id: sp-kvm-descriptors-0
            phrase: Open slash dev slash kvm to obtain the system descriptor
            targets:
              - sp-kvm-descriptors-mechanism
            color: cyan
            linger: 0.4
          - id: sp-kvm-descriptors-system
            phrase: Open slash dev slash kvm to obtain the system descriptor
            targets:
              - sp-kvm-descriptors-mechanism
            color: cyan
            linger: 0.4
          - id: sp-kvm-descriptors-vm
            phrase: Creating a VM returns a VM descriptor
            targets:
              - sp-kvm-descriptors-mechanism
            color: cyan
            linger: 0.4
          - id: sp-kvm-descriptors-cpu
            phrase: then create a virtual CPU descriptor
            targets:
              - sp-kvm-descriptors-mechanism
            color: cyan
            linger: 0.4
      - say: First inspect the return code. Zero permits consulting the current exit reason. Minus one with E INTR
          means an unmasked signal interrupted the call. The article loop returns to its shutdown check before
          retrying. Other run errors stop this sketch. Old exit data cannot describe a failed run.
        hold: 0.7
        visual_cues:
          - id: sp-kvm-descriptors-1
            phrase: First inspect the return code
            targets:
              - sp-kvm-descriptors-mechanism
            color: yellow
            linger: 0.4
          - id: sp-kvm-descriptors-eintr
            phrase: The article loop returns to its shutdown check before retrying
            targets:
              - sp-kvm-descriptors-mechanism
            color: cyan
            linger: 0.4
          - id: sp-kvm-descriptors-return
            phrase: Old exit data cannot describe a failed run
            targets:
              - sp-kvm-descriptors-mechanism
            color: cyan
            linger: 0.4
      - say: The supplied exit paths send MMIO and port I O to their handlers. A halt follows lifecycle policy and can
          wait for an interrupt. An unhandled exit stops the sketch. Some hardware exits stay inside KVM. This
          C fragment omits VM setup, device implementation and shutdown coordination; no guest is executed
          here.
        hold: 0.7
        visual_cues:
          - id: sp-kvm-descriptors-2
            phrase: The supplied exit paths send MMIO and port I O to their handlers
            targets:
              - sp-kvm-descriptors-mechanism
            color: green
            linger: 0.4
          - id: sp-kvm-descriptors-exit
            phrase: The supplied exit paths send MMIO and port I O to their handlers
            targets:
              - sp-kvm-descriptors-mechanism
            color: cyan
            linger: 0.4
  - id: jailer-surfaces
    title: Reduce host authority around the VMM
    visual: Nested guest and jailed host boundaries expose their separate credentials, device interfaces and
      output sinks.
    beats:
      - say: A guest kernel separates tenant execution from the host kernel, but the VMM, KVM, host and management
          services remain trusted. Firecracker limits its device surface. Rust helps prevent classes of
          memory-safety errors; unsafe code, device emulation and integration still need review and maintained
          host and guest configurations.
        hold: 0.7
        visual_cues:
          - id: sp-jailer-surfaces-0
            phrase: A guest kernel separates tenant execution from the host kernel, but the VMM, KVM, host and management
              services remain trusted
            targets:
              - sp-jailer-surfaces-mechanism
            color: cyan
            linger: 0.4
      - say: Jailer constructs a restricted filesystem view, changes user and group identity, configures resource
          controls and can create a process namespace. Its network-namespace option joins an existing
          namespace. The integrator prepares that object and its routes. Protect the API socket and keep the
          recommended syscall filters.
        hold: 0.7
        visual_cues:
          - id: sp-jailer-surfaces-1
            phrase: Jailer constructs a restricted filesystem view, changes user and group identity, configures resource
              controls and can create a process namespace
            targets:
              - sp-jailer-surfaces-mechanism
            color: yellow
            linger: 0.4
          - id: sp-jailer-surfaces-view
            phrase: Jailer constructs a restricted filesystem view, changes user and group identity, configures resource
              controls and can create a process namespace
            targets:
              - sp-jailer-surfaces-mechanism
            color: cyan
            linger: 0.4
          - id: sp-jailer-surfaces-join
            phrase: Its network-namespace option joins an existing namespace
            targets:
              - sp-jailer-surfaces-mechanism
            color: cyan
            linger: 0.4
      - say: Bound serial output and VMM process output because the guest can drive host memory or storage consumption
          there. The inspected source supports VirtIO over MMIO and optional PCI VirtIO transport. That
          transport choice does not grant arbitrary device passthrough. Match the release, kernels and device
          configuration rather than memorizing a device count.
        hold: 0.7
        visual_cues:
          - id: sp-jailer-surfaces-2
            phrase: Bound serial output and VMM process output because the guest can drive host memory or storage
              consumption there
            targets:
              - sp-jailer-surfaces-mechanism
            color: green
            linger: 0.4
          - id: sp-jailer-surfaces-output
            phrase: Bound serial output and VMM process output
            targets:
              - sp-jailer-surfaces-mechanism
            color: cyan
            linger: 0.4
          - id: sp-jailer-surfaces-transport
            phrase: That transport choice does not grant arbitrary device passthrough
            targets:
              - sp-jailer-surfaces-mechanism
            color: cyan
            linger: 0.4
  - id: clean-template
    title: Seal memory, machine state and matching disks
    visual: A clean supervisor is paused before user work, and three distinct sealed artifact owners feed a paused
      restore.
    beats:
      - say: Build the template after the guest kernel, language runtime and supervisor are initialized, before tenant
          inputs, customer keys or user jobs arrive. Pause it in a quiescent state. Save memory and versioned
          virtual-machine state, and preserve the matching disk backing files separately.
        hold: 0.7
        visual_cues:
          - id: sp-clean-template-0
            phrase: Build the template after the guest kernel, language runtime and supervisor are initialized, before
              tenant inputs, customer keys or user jobs arrive
            targets:
              - sp-clean-template-mechanism
            color: cyan
            linger: 0.4
          - id: sp-clean-template-seal
            phrase: Save memory and versioned virtual-machine state, and preserve the matching disk backing files
              separately
            targets:
              - sp-clean-template-mechanism
            color: cyan
            linger: 0.4
      - say: Authenticate the provenance and integrity of every required artifact before loading. A checksum for
          accidental corruption does not authenticate a template. Keep the memory backing immutable and
          available for the lifetime of its restored private mappings. Snapshot compatibility and disk
          consistency belong to this contract.
        hold: 0.7
        visual_cues:
          - id: sp-clean-template-1
            phrase: Authenticate the provenance and integrity of every required artifact before loading
            targets:
              - sp-clean-template-mechanism
            color: yellow
            linger: 0.4
          - id: sp-clean-template-auth
            phrase: A checksum for accidental corruption does not authenticate a template
            targets:
              - sp-clean-template-mechanism
            color: cyan
            linger: 0.4
      - say: A loaded snapshot and a ready service are different states. Resume the supervisor for readiness work
          while user instructions remain withheld. Missing or failed checks retain ownership and keep
          admission closed. A returned snapshot API call cannot establish the first executed user instruction.
        hold: 0.7
        visual_cues:
          - id: sp-clean-template-2
            phrase: A loaded snapshot and a ready service are different states
            targets:
              - sp-clean-template-mechanism
            color: green
            linger: 0.4
          - id: sp-clean-template-held
            phrase: Missing or failed checks retain ownership and keep admission closed
            targets:
              - sp-clean-template-mechanism
            color: cyan
            linger: 0.4
  - id: cow
    title: Reads share a page and writes create a private copy
    visual: Six physical backing pages appear once. Clone A and B point to the same selected page. A write
      allocates and copies a private page, changes its value, and redirects only A. Physical resident bytes
      grow by exactly one page.
    beats:
      - say: "A warmed snapshot preserves guest memory and virtual machine state. A private file mapping can load
          pages on demand. Clones can read a shared backing page, while a write creates private anonymous
          storage for that clone. Follow the changed page: one tenant sees its new value while the other
          retains the base value."
        hold: 0.65
        motion_check:
          region:
            - 170
            - 300
            - 1560
            - 620
          minimumChangedFraction: 0.002
        visual_cues:
          - id: cow-beat-1-focus-1
            phrase: Clones can read a shared backing page, while a write creates private anonymous storage for that clone
            targets:
              - cow-clone-a-page-2
            color: cyan
            linger: 0.65
          - id: cow-beat-1-focus-2
            phrase: "Follow the changed page: one tenant sees its new value while the other retains the base value"
            targets:
              - cow-base
            color: yellow
            linger: 0.65
      - say: "This saves copying unmodified memory at restore time. It also creates a lifetime contract: keep the
          backing memory file available, protect the complete snapshot artifacts, and validate compatibility.
          Private pages still consume real host memory. Writes, allocator activity, and runtime behavior can
          reduce sharing, so measure dirty growth rather than assuming a fixed density."
        hold: 0.65
        visual_cues:
          - id: cow-beat-2-focus-1
            phrase: "It also creates a lifetime contract: keep the backing memory file available"
            targets:
              - cow-base
            color: cyan
            linger: 0.65
          - id: cow-beat-2-focus-2
            phrase: Private pages still consume real host memory
            targets:
              - cow-a-private-2
            color: yellow
            linger: 0.65
  - id: article-page-run
    title: Execute the three-page article model
    visual: Three shared entries and exact per-clone private entries compute values and accounting without
      asserting operating-system residency.
    beats:
      - say: Our earlier six-page schematic and the article program are separate labeled examples. The program has
          three clean entries, ten, twenty and thirty, each assigned four kibibytes. A and B refer to the same
          immutable tuple. Both initially read twenty at index one.
        hold: 0.7
        visual_cues:
          - id: sp-article-page-run-0
            phrase: Our earlier six-page schematic and the article program are separate labeled examples
            targets:
              - sp-article-page-run-mechanism
            color: cyan
            linger: 0.4
          - id: sp-article-page-run-base
            phrase: Both initially read twenty at index one
            targets:
              - sp-article-page-run-mechanism
            color: cyan
            linger: 0.4
      - say: After A writes ninety-nine at index one, only A has that private entry. A reads ninety-nine; B and the
          base read twenty. The modeled accounting counts the shared base once, then every private entry from
          every clone. Three plus one pages times four kibibytes equals sixteen kibibytes.
        hold: 0.7
        visual_cues:
          - id: sp-article-page-run-1
            phrase: After A writes ninety-nine at index one, only A has that private entry
            targets:
              - sp-article-page-run-mechanism
            color: yellow
            linger: 0.4
          - id: sp-article-page-run-write
            phrase: After A writes ninety-nine at index one, only A has that private entry
            targets:
              - sp-article-page-run-mechanism
            color: cyan
            linger: 0.4
          - id: sp-article-page-run-count
            phrase: Three plus one pages times four kibibytes equals sixteen kibibytes
            targets:
              - sp-article-page-run-mechanism
            color: green
            linger: 0.4
      - say: Another clone writing the same index owns another private entry. A later write to an already private
          index replaces its value instead of adding an entry. These dictionary counts model ownership; they
          do not measure physical residency, VMM overhead or page-cache behavior. Even a read can fault clean
          data into RAM without making it private.
        hold: 0.7
        visual_cues:
          - id: sp-article-page-run-2
            phrase: Another clone writing the same index owns another private entry
            targets:
              - sp-article-page-run-mechanism
            color: green
            linger: 0.4
          - id: sp-article-page-run-second
            phrase: Another clone writing the same index owns another private entry
            targets:
              - sp-article-page-run-mechanism
            color: cyan
            linger: 0.4
