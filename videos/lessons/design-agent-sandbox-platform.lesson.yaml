  - id: rng-window
    title: Kernel reseeding leaves separate copied state
    visual: The kernel notification crosses a handling window while the copied application seed, cached token and
      boot identifier retain their own owners.
    beats:
      - say: On restore, Firecracker changes VMGenID and notifies the guest. A supporting guest kernel handles that
          notification and reseeds its random generator. Between resumed virtual CPUs and completed handling,
          a race window remains. A configured device without its guest driver does not complete this protocol.
        hold: 0.7
        visual_cues:
          - id: sp-rng-window-0
            phrase: On restore, Firecracker changes VMGenID and notifies the guest
            targets:
              - sp-rng-window-mechanism
            color: cyan
            linger: 0.4
          - id: sp-rng-window-notify
            phrase: On restore, Firecracker changes VMGenID and notifies the guest
            targets:
              - sp-rng-window-mechanism
            color: cyan
            linger: 0.4
          - id: sp-rng-window-kernel
            phrase: A supporting guest kernel handles that notification and reseeds its random generator
            targets:
              - sp-rng-window-mechanism
            color: cyan
            linger: 0.4
      - say: The kernel pool is separate from an application pseudorandom generator, a previously generated token, an
          application identifier and the saved boot identifier. Kernel reseeding does not replace those copied
          values. Keep one-use credentials out of the shared template and reinitialize the application state
          that requires uniqueness.
        hold: 0.7
        visual_cues:
          - id: sp-rng-window-1
            phrase: The kernel pool is separate from an application pseudorandom generator, a previously generated token,
              an application identifier and the saved boot identifier
            targets:
              - sp-rng-window-mechanism
            color: yellow
            linger: 0.4
          - id: sp-rng-window-app
            phrase: Kernel reseeding does not replace those copied values
            targets:
              - sp-rng-window-mechanism
            color: cyan
            linger: 0.4
      - say: "The overview grouped readiness into four headings. The actual Python contract checks five names: clock,
          kernel randomness, application state, network and control. They are supplied controller observations
          for the current clone. All five must be present before the model can become ready; sending fresh
          bytes alone proves none of them."
        hold: 0.7
        visual_cues:
          - id: sp-rng-window-2
            phrase: The overview grouped readiness into four headings
            targets:
              - sp-rng-window-mechanism
            color: green
            linger: 0.4
          - id: sp-rng-window-five
            phrase: All five must be present before the model can become ready
            targets:
              - sp-rng-window-mechanism
            color: green
            linger: 0.4
  - id: namespace-identity
    title: Separate a local name from global routing
    visual: Two independent network namespaces retain the same TAP name and guest address while their host routes
