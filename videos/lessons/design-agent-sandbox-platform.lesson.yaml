  - id: fault-handler
    title: A missing page must be supplied before progress
    visual: The selected guest address faults, a handler owns a pending page request, and only a completed load
      resumes that access.
    beats:
      - say: The File backend relies on host faults to bring snapshot contents into RAM on demand. A private write
          then allocates modified private state. Avoiding an eager full copy saves restore work, while cold
          faults and the growing working set still affect latency.
        hold: 0.7
        visual_cues:
          - id: sp-fault-handler-0
            phrase: The File backend relies on host faults to bring snapshot contents into RAM on demand
            targets:
              - sp-fault-handler-mechanism
            color: cyan
            linger: 0.4
          - id: sp-fault-handler-file
            phrase: The File backend relies on host faults to bring snapshot contents into RAM on demand
            targets:
              - sp-fault-handler-mechanism
            color: cyan
            linger: 0.4
      - say: The U F F D backend passes missing-page responsibility to a userspace handler through userfaultfd. That
          handler needs permissions, validated backing data, storage access, failure handling and a deadline.
          A remote chunk cache is an integrator design, not a distributed storage service supplied by this
          interface.
        hold: 0.7
        visual_cues:
          - id: sp-fault-handler-1
            phrase: The U F F D backend passes missing-page responsibility to a userspace handler through userfaultfd
            targets:
              - sp-fault-handler-mechanism
            color: yellow
            linger: 0.4
          - id: sp-fault-handler-delegate
            phrase: The U F F D backend passes missing-page responsibility to a userspace handler through userfaultfd
            targets:
              - sp-fault-handler-mechanism
            color: cyan
            linger: 0.4
      - say: When the handler stalls, the access needing its page cannot complete. Test cold pages and backend
          failure, stop admission under policy, and reconcile retirement before reclaiming. Mapping without a
          reservation changes virtual-memory accounting; it does not create physical RAM or make overcommit
          safe.
        hold: 0.7
        visual_cues:
          - id: sp-fault-handler-2
            phrase: When the handler stalls, the access needing its page cannot complete
            targets:
              - sp-fault-handler-mechanism
            color: green
            linger: 0.4
          - id: sp-fault-handler-stall
            phrase: When the handler stalls, the access needing its page cannot complete
            targets:
              - sp-fault-handler-mechanism
            color: cyan
            linger: 0.4
  - id: clock-refresh
    title: Refresh wall time and application deadlines separately
    visual: A restored wall-clock reading and a saved monotonic deadline travel through separate checks before
      admission.
    beats:
      - say: The documented snapshot path can resume wall time from the saved moment. Synchronize through the guest
          protocol, or use the supported restore-time clock option with its matching host and clock-source
          prerequisites. A clock jump can affect application behavior.
        hold: 0.7
        visual_cues:
          - id: sp-clock-refresh-0
            phrase: The documented snapshot path can resume wall time from the saved moment
            targets:
              - sp-clock-refresh-mechanism
            color: cyan
            linger: 0.4
          - id: sp-clock-refresh-sync
            phrase: Synchronize through the guest protocol
            targets:
              - sp-clock-refresh-mechanism
            color: cyan
            linger: 0.4
      - say: Certificate validity and token expiry depend on current time, while saved monotonic timers and
          application deadlines need their own semantics. Do not infer that every timer expires or every TLS
          request fails. Validate the actual guest protocol and keep user work held until its required checks
          finish.
        hold: 0.7
        visual_cues:
          - id: sp-clock-refresh-1
            phrase: Certificate validity and token expiry depend on current time, while saved monotonic timers and
              application deadlines need their own semantics
            targets:
              - sp-clock-refresh-mechanism
            color: yellow
            linger: 0.4
          - id: sp-clock-refresh-separate
            phrase: while saved monotonic timers and application deadlines need their own semantics
            targets:
              - sp-clock-refresh-mechanism
            color: cyan
            linger: 0.4
      - say: With matching guest and application support, VMClock can expose a changed generation counter after
          restore. Compatible userspace can detect that change and rebuild copied state. The device
          notification is a signal for integrated software; it does not refresh every application by itself.
        hold: 0.7
        visual_cues:
          - id: sp-clock-refresh-2
            phrase: With matching guest and application support, VMClock can expose a changed generation counter after
              restore
            targets:
              - sp-clock-refresh-mechanism
            color: green
            linger: 0.4
          - id: sp-clock-refresh-generation
            phrase: Compatible userspace can detect that change and rebuild copied state
