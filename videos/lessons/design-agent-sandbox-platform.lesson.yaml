          restored state, then start requires ready. Read requires running and an integer page index within
          the base. A negative index is rejected rather than using Python negative indexing.
        hold: 0.7
        visual_cues:
          - id: sp-state-machine-0
            phrase: The actual Python object starts restored
            targets:
