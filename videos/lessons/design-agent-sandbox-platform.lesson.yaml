  - id: retirement
    title: A lease ends only after its resources are retired
    visual: The running generation retains pages, scratch, references and authority until execution retirement and
      closure permit disposal.
    beats:
      - say: Cancellation is a request to stop, rather than proof that the guest and its resources have disappeared.
          Maintain a durable job identity, owner lease, and terminal state. Reconcile orphaned runtimes after
          host-agent failure, and verify that the process tree, network objects, scratch layer, and credential
          references are retired before advertising free capacity.
        hold: 0.65
        visual_cues:
          - id: retirement-beat-1-focus-1
            phrase: Maintain a durable job identity, owner lease, and terminal state
            targets:
              - retirement-name
            color: cyan
            linger: 0.65
      - say: You can now explain what a snapshot shares, what a private write allocates, what must become fresh after
          restore, and which component enforces egress authority. Validate hostile workloads, worker loss,
          cleanup, and load separately. A useful execution platform makes both its fast path and its
          return-to-clean-state boundary inspectable.
        hold: 0.65
        visual_cues:
          - id: retirement-beat-2-focus-1
            phrase: A useful execution platform makes both its fast path and its return-to-clean-state boundary
              inspectable
            targets:
              - retirement-name
            color: cyan
            linger: 0.65
  - id: reference-retirement
    title: Wait for the last resource reference
    visual: A stopped VMM loses its execution edge, but a duplicate descriptor keeps the VM resource allocated
      until that reference closes.
    beats:
      - say: A VM lifetime follows its file-descriptor references, not just the process that created it. A duplicate
          or inherited reference can keep VM resources alive after that creator exits. Execution retirement
          and final resource-reference closure are separate facts to verify before advertising free capacity.
        hold: 0.7
        visual_cues:
          - id: sp-reference-retirement-0
            phrase: A VM lifetime follows its file-descriptor references, not just the process that created it
            targets:
              - sp-reference-retirement-mechanism
            color: cyan
            linger: 0.4
          - id: sp-reference-retirement-duplicate
            phrase: A duplicate or inherited reference can keep VM resources alive after that creator exits
            targets:
              - sp-reference-retirement-mechanism
            color: cyan
            linger: 0.4
      - say: For an owned non-root cgroup in a valid domain configuration, cgroup kill targets the process tree. In a
          threaded cgroup it fails with E OPNOTSUPP because the operation is process directed. A kill request
          still needs exit and remaining-reference verification. A reused PID number cannot establish
          generation ownership.
        hold: 0.7
        visual_cues:
          - id: sp-reference-retirement-1
            phrase: For an owned non-root cgroup in a valid domain configuration, cgroup kill targets the process tree
            targets:
              - sp-reference-retirement-mechanism
            color: yellow
            linger: 0.4
          - id: sp-reference-retirement-threaded
            phrase: In a threaded cgroup it fails with E OPNOTSUPP
            targets:
              - sp-reference-retirement-mechanism
            color: cyan
            linger: 0.4
      - say: Revoke the capability, close network and command references, retire writable-memory access, and dispose
          of the scratch backing under the generation owner. Retention rules govern exported artifacts and
          logs. Hold uncertain resources for reconciliation; a timed-out reply supplies no timeout-to-free
          transition.
        hold: 0.7
        visual_cues:
          - id: sp-reference-retirement-2
            phrase: Revoke the capability, close network and command references, retire writable-memory access, and
              dispose of the scratch backing under the generation owner
            targets:
              - sp-reference-retirement-mechanism
            color: green
            linger: 0.4
          - id: sp-reference-retirement-close
            phrase: Revoke the capability, close network and command references, retire writable-memory access, and
              dispose of the scratch backing under the generation owner
            targets:
              - sp-reference-retirement-mechanism
            color: cyan
            linger: 0.4
  - id: reconciliation-table
    title: Choose recovery from the observed failure
    visual: Each concrete failed resource retains ownership until its own observation and recovery complete.
    beats:
      - say: A missing controller heartbeat can coexist with a running VMM. Reconcile the durable tenant and
          generation against host processes, cgroups, sockets, volumes and network objects, then adopt or stop
          that same owner. A second controller must not merely declare its predecessor gone.
        hold: 0.7
        visual_cues:
          - id: sp-reconciliation-table-0
            phrase: A missing controller heartbeat can coexist with a running VMM
            targets:
              - sp-reconciliation-table-mechanism
            color: cyan
            linger: 0.4
          - id: sp-reconciliation-table-inventory
            phrase: Reconcile the durable tenant and generation against host processes, cgroups, sockets, volumes and
              network objects
            targets:
              - sp-reconciliation-table-mechanism
            color: cyan
            linger: 0.4
      - say: For runaway processes inspect guest limits, CPU and output growth. For private-memory growth inspect
          resident pages, memory events and guest OOM state, stop admission and preserve host reserve. For a
          stalled handler inspect fault progress and storage errors. Retire the affected execution before
          reclaiming.
        hold: 0.7
        visual_cues:
          - id: sp-reconciliation-table-1
            phrase: For runaway processes inspect guest limits, CPU and output growth
            targets:
              - sp-reconciliation-table-mechanism
            color: yellow
            linger: 0.4
          - id: sp-reconciliation-table-memory
            phrase: For private-memory growth inspect resident pages, memory events and guest OOM state
            targets:
              - sp-reconciliation-table-mechanism
            color: cyan
            linger: 0.4
      - say: For credential abuse inspect caller, capability, operation, resource and upstream result, deny
          unauthorized work and revoke affected authority. Incomplete cleanup quarantines resources until
          process, descriptor, mount and network checks establish disposal. Fault-inject crashes, delayed
          cleanup, duplicate events, cold pages and cross-tenant probes in the deployed runtime.
        hold: 0.7
        visual_cues:
          - id: sp-reconciliation-table-2
            phrase: For credential abuse inspect caller, capability, operation, resource and upstream result, deny
              unauthorized work and revoke affected authority
            targets:
              - sp-reconciliation-table-mechanism
            color: green
            linger: 0.4
          - id: sp-reconciliation-table-quarantine
            phrase: Incomplete cleanup quarantines resources
            targets:
              - sp-reconciliation-table-mechanism
            color: cyan
            linger: 0.4
  - id: endpoint-clock
    title: Measure through the first user instruction
    visual: One accepted request crosses placement, queue, restore and readiness markers before its true endpoint
      is counted.
    beats:
      - say: The design target is fifteen milliseconds at the ninety-ninth percentile, from gateway acceptance to the
          supervisor beginning the first user instruction. It includes accepted queueing, placement, restore
          and required readiness. Record rejection and timeout rates alongside it, and measure cold launch
          separately for each image.
        hold: 0.7
        visual_cues:
          - id: sp-endpoint-clock-0
            phrase: The design target is fifteen milliseconds at the ninety-ninth percentile, from gateway acceptance to
              the supervisor beginning the first user instruction
            targets:
              - sp-endpoint-clock-mechanism
            color: cyan
            linger: 0.4
          - id: sp-endpoint-clock-target
            phrase: from gateway acceptance to the supervisor beginning the first user instruction
            targets:
              - sp-endpoint-clock-mechanism
            color: cyan
            linger: 0.4
      - say: "In a supplied timing worksheet, acceptance is zero, placement ends at three milliseconds, loading at
          seven, readiness at sixteen and user entry at seventeen. Subtract acceptance from user entry:
          seventeen milliseconds misses the target. Reporting seven from the load response would measure the
          wrong endpoint. This one invented request does not determine a percentile."
        hold: 0.7
        visual_cues:
          - id: sp-endpoint-clock-1
            phrase: In a supplied timing worksheet, acceptance is zero, placement ends at three milliseconds, loading at
              seven, readiness at sixteen and user entry at seventeen
            targets:
              - sp-endpoint-clock-mechanism
            color: yellow
            linger: 0.4
          - id: sp-endpoint-clock-user
            phrase: readiness at sixteen and user entry at seventeen
            targets:
              - sp-endpoint-clock-mechanism
            color: cyan
            linger: 0.4
          - id: sp-endpoint-clock-miss
            phrase: seventeen milliseconds misses the target
            targets:
              - sp-endpoint-clock-mechanism
            color: pink
            linger: 0.4
      - say: To evaluate the service, retain host and guest kernels, Firecracker version, image, snapshot residency,
          concurrent starts and actual user-entry instrumentation. Test hostile workloads, worker loss,
          cleanup and load independently. A fast API response and the local arithmetic do not establish
          readiness, isolation or a production benchmark.
        hold: 0.7
        visual_cues:
          - id: sp-endpoint-clock-2
            phrase: To evaluate the service, retain host and guest kernels, Firecracker version, image, snapshot
              residency, concurrent starts and actual user-entry instrumentation
            targets:
              - sp-endpoint-clock-mechanism
            color: green
            linger: 0.4
  - id: fresh-generation
