          copy-on-write sharing even when user data appears unchanged. Read faults and private dirty growth
          are different accounting paths; measure both instead of deriving density from configured RAM.
        hold: 0.7
        visual_cues:
          - id: sp-readonly-data-2
            phrase: A garbage collector can write marks, reference counts or heap metadata
            targets:
              - sp-readonly-data-mechanism
            color: green
            linger: 0.4
          - id: sp-readonly-data-dirty
            phrase: Those writes can break copy-on-write sharing even when user data appears unchanged
            targets:
              - sp-readonly-data-mechanism
            color: cyan
            linger: 0.4
  - id: state-machine
