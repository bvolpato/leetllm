  - id: semantic
    title: Which neighbor can answer the customer?
    visual: Normalize Birch’s vector on the unit circle. Read its signed projection along the query
      direction, then inspect ownership, time and grants down the ranking. Save the actual first admitted
      embedding.
    beats:
      - say: >-
          Return to the published August edition with its three Harbor return paragraphs. The customer
          asks, can I take this coat back? None of our paragraphs contains that phrase. An embedding
          model represents the question and each paragraph with a vector. We chose these coordinates
          by hand so we can follow the comparison. The query points right. Look at Birch’s paragraph.
          Its vector goes three steps right and one up. Divide both coordinates by the square root of
          ten. The tip moves onto the unit circle without changing direction. Now drop the tip onto
          the query axis. Its horizontal coordinate is the cosine similarity. To the left of zero,
          that score would be negative. Place the other tips on the same circle and order them by that
          coordinate. Can Bob cite the closest paragraph for this customer?
        hold: 2
        visual_cues:
          - id: normalize-candidate-vectors
            phrase: Divide both coordinates by the square root of ten. The tip moves onto the unit circle without
              changing direction
            targets:
              - similarity-geometry
              - similarity-projection
            color: cyan
          - id: project-cosine-score
            phrase: Now drop the tip onto the query axis. Its horizontal coordinate is the cosine similarity
            targets:
              - similarity-geometry
              - similarity-projection
            color: yellow
          - id: rank-by-cosine
            phrase: Place the other tips on the same circle and order them by that coordinate
            targets:
              - normalized-candidate-overview
              - cosine-ranking
            color: blue
      - say: Read the nearest row. It belongs to another store. The next is retired. The staff rule lacks Bob's
          grant. The request needs two results. Keep going down the ranked list. The next two current
          Harbor paragraphs pass all three checks. With an approximate index you may run out of candidates
          before you fill both places. We can test that against an exact search.
        hold: 1.2
        visual_cues:
          - id: inspect-filtered-prefix
            phrase: Read the nearest row
            targets:
              - candidate-gates
            color: blue
          - id: explain-other-store-failure
            phrase: It belongs to another store
            targets:
              - candidate-gates
            color: pink
            caption_boundary: true
          - id: explain-retired-failure
            phrase: The next is retired
            targets:
              - candidate-gates
            color: pink
            caption_boundary: true
