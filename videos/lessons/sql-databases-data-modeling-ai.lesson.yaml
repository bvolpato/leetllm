    title: What survives a duplicate insert?
    visual: Two independent transactions stage the same key. Follow the duplicate error to a handler on
      either side of the with boundary. The pending key reaches the committed shelf only on normal exit.
    beats:
      - say: Imagine two empty tables, each with a unique key. Put one K in each table. In the lab’s Python
          legacy transaction mode, that first write opens a transaction. Try to insert the same K again.
          Both tables reject the duplicate. On the left the handler catches the error inside the with
          block. On the right the handler waits outside. When both blocks finish, where will the first K
          still exist?
        hold: 3.1
        visual_cues:
          - id: insert-first-k
            phrase: Put one K in each table
            targets:
              - key-inserts
            color: cyan
          - id: attempt-second-k
            phrase: Try to insert the same K again
            targets:
              - key-inserts
            color: pink
      - say: Follow the error out to each handler. On the left the block finishes normally, so the earlier insert
          commits. On the right the error crosses the block boundary, and Python rolls back the open
          transaction. Count the saved rows. One on the left. Zero on the right. To roll back a whole
          failed ingestion, let the exception reach the transaction boundary and handle it outside.
        hold: 1.3
        caption_starts:
          - On the left the block finishes normally
          - One on the left
        visual_cues:
