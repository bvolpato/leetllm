scenes:
  - id: opening
    title: Can this coat go back?
    visual: The return slip shows a purchase on July 25 and a return on August 12. The marker for day
      eighteen stays put while Bob recovers one saved rule and finds a second with a different deadline.
    beats:
      - say: >-
          This coat came back eighteen days after purchase. Bob has a fourteen-day rule open.
          When the app restarts, the open paragraph disappears. Bob finds it again in the database.
          Another saved rule allows thirty days. Which rule can he quote for this return on August twelfth?
        hold: 3.2
        visual_cues:
          - id: place-purchase
            phrase: eighteen days after purchase
            targets: [purchase-age]
            color: yellow
          - id: restart-memory
            phrase: the open paragraph disappears
            targets: [process-area]
            color: pink
          - id: read-file-candidates
            phrase: Another saved rule allows thirty days
            targets: [durable-copy]
            color: blue
  - id: durability
    title: Where did the paragraph survive?
    visual: Follow c7a into the database file at commit and back into the support process on a fresh connection.
    beats:
      - say: Go back to the moment Bob saved the paragraph. The database puts it in a table called chunks. Read
          across one row. The columns give us the paragraph’s identity, the document it came from, and the
          words Bob saw. Commit saves that row in the database file.
        hold: 1
        visual_cues:
          - id: store-row
            phrase: Commit saves that row in the database file
            targets:
              - stored-row
            color: green
      - say: Now start with an empty screen. Open a new connection to the same file and read the row back. The
          paragraph still points to the same document. That recovery depends on where the file lives. If a
          container can disappear, the file needs storage that survives the container.
        hold: 1
        visual_cues:
          - id: recover-row
            phrase: read the row back
            targets:
              - recovered-row
            color: cyan
      - say: You can check this in the article’s SQLite lab. Its sample file holds Acme’s API policies.
          Save the IDs from Bob’s search, commit, and close the connection. Reopen the same file and run
          the same search. The two IDs come back without loading any seed data. Let’s follow the
          document link on the paragraph at Harbor.
        hold: 1
        visual_cues:
          - id: reopen-acme-file
            phrase: Reopen the same file and run the same search
            targets:
              - acme-reread
            color: cyan
  - id: relations
    title: Give each fact an identity and a relationship
    visual: Matching paragraph, document and workspace fields connect directly. A permission row names Bob. A
      duplicate identity and a missing foreign-key target are attempted.
    beats:
      - say: >
          Store the source once, then let each paragraph carry its document identity. Follow the matching
          fields to the document, and from there to Harbor's workspace. A separate permission row says Bob may
          read this paragraph. These links are data the database can check.
        hold: 0.7
        motion_check:
          region:
            - 570
            - 370
            - 830
            - 80
          minimumChangedFraction: 0.002
        visual_cues:
          - id: follow-source-key
            phrase: Follow the matching fields to the document
            targets:
              - source-reference
            color: cyan
          - id: follow-owner-key
            phrase: from there to Harbor's workspace
            targets:
              - owner-reference
            color: blue
      - say: >-
          A primary key gives a row its identity. Try inserting this identity a second time. The
          database rejects the duplicate. A new chunk must name its source. The document field is
          required, and SQLite checks its foreign key as soon as we insert the row. Point the chunk at
          a missing document and that insertion fails too. Enable foreign keys on each SQLite
          connection before starting the transaction.
        hold: 0.8
        visual_cues:
          - id: duplicate-row
            phrase: rejects the duplicate
            targets:
              - invalid-row
            color: pink
          - id: missing-parent
            phrase: that insertion fails too
            targets:
              - invalid-row
            color: pink
  - id: schema-contract
    title: Which rows will SQLite accept?
    visual: Acme’s rows expose the same four relationships as Harbor’s file. Try three independent inserts.
      In a separate score column, add a NOT NULL declaration and inspect the one outcome that changes.
    beats:
      - say: The SQLite lab uses Acme’s API policy. Follow one grant across its chunk, its document, and its
          workspace. The document holds the title, source key, and validity dates. Each chunk holds its own
          text. Bob can have a grant on one chunk and none on the next. The chunk and the reader together
          identify a grant, so inserting that pair twice fails. CREATE TABLE sets up those rules. INSERT
          asks the database to check a new row against them.
        hold: 1
        visual_cues:
          - id: follow-schema-links
            phrase: Follow one grant across its chunk, its document, and its workspace
            targets:
              - schema-links
            color: cyan
      - say: Try these three inserts separately. The first chunk lacks an ID. The second names a document that
          never arrived. The third copies an existing paragraph into a different document. Check the ID,
          then the parent, then the document and text together. Only the copy gets through. The same words
          can occur in different editions. This database requires a text primary key to be non-null
          explicitly. An ordinary SQLite rowid table otherwise allows a null text primary key. A required
          parent also needs a non-null reference. Declaring that foreign key in a column lets SQLite check
          it. Putting a document ID in optional JSON metadata buys you no such check.
        hold: 1.2
        caption_starts:
          - Only the copy gets through
        visual_cues:
          - id: try-declarations
            phrase: Check the ID, then the parent, then the document and text together
            targets:
              - schema-inserts
            color: yellow
      - say: Now look at a score column with a check that the score is positive. Which of these values could you
          store?
        hold: 2.6
      - say: Read the check results. Zero makes the expression false, so its insert fails. For a
          missing score the expression is unknown. SQLite lets that row through. Add a separate requirement
          that a score must be present. Only the missing score changes outcome. In the policy tables,
          passing the structural checks tells us the links exist. We still need to check the source and
          Bob’s grant before he quotes it.
        hold: 1.3
        caption_starts:
          - Zero makes the expression false
        visual_cues:
          - id: read-check-results
            phrase: Read the check results
            targets:
              - score-constraint
            color: cyan
          - id: require-score
            phrase: Add a separate requirement that a score must be present
            targets:
              - score-constraint
            color: yellow
  - id: query
    title: What goes in the question-mark slot?
    visual: The query returns document fields for Harbor. A search for children’s coats keeps its apostrophe
      inside a bound value. The LIKE examples use the same exclamation-mark escape as the literal search.
    beats:
      - say: Bob wants the identities and titles of the policies on file at Harbor. SELECT names the fields to
          return. WHERE tells the database which documents to keep. Bind the store identity into the
          question-mark slot. Now test each document in order. All three Harbor versions come through,
          including the retired one. Birch stays out.
        hold: 0.9
        visual_cues:
          - id: project-fields
            phrase: SELECT names the fields to return
            targets:
              - selected-columns
            color: cyan
          - id: bind-workspace
            phrase: Bind the store identity into the question-mark slot
            targets:
              - bound-value
            color: yellow
          - id: filter-bound-rows
            phrase: Now test each document in order. All three Harbor versions come through, including the retired
              one. Birch stays out
            targets:
              - document-rows
              - returned-fields
            color: green
      - say: Try searching for children's coats. The apostrophe travels with the words in the bound value. SQL
          still sees the same statement, and none of our paragraphs contain that phrase. Now search for the
          percent sign on a discount notice. Inside a LIKE pattern, you have to mark that percent as
          literal. The same goes for the underscore in a field name.
        hold: 1
        visual_cues:
          - id: bind-input
            phrase: travels with the words in the bound value
            targets:
              - bound-value
            color: yellow
          - id: literal-percent
            phrase: percent sign on a discount notice
            targets:
              - literal-result
            color: green
          - id: literal-underscore
            phrase: underscore in a field name
            targets:
              - literal-underscore
            color: cyan
  - id: literal-substring
    title: Which passages contain the printed policy code?
    visual: >-
      Build the escaped pattern one character at a time. Test it against the printed code, a wildcard
      lookalike, and an uppercase copy inside a longer passage.
    beats:
      - say: >-
          A customer copied this policy code from a notice. Look at the middle passage. Its X could
          fit an underscore wildcard. The letters after ten could fit a percent wildcard. Here the
          punctuation has to match the print, and the search ignores ASCII letter case. Double the
          customer's own exclamation point first. That's our escape mark. Mark the underscore and
          percent as literal. Then put a wildcard at each end to allow words around the code. Which
          passages match?
        hold: 3
        visual_cues:
          - id: escape-bang
            phrase: Double the customer's own exclamation point first
            targets:
              - pattern-cells
            color: yellow
          - id: escape-wildcards
            phrase: Mark the underscore and percent as literal
            targets:
              - pattern-cells
            color: blue
          - id: substring-pattern
            phrase: put a wildcard at each end
            targets:
              - pattern-cells
            color: yellow
      - say: >-
          Read down the three passages. The first has the code by itself. In the second, the X breaks
          the match. In the last passage, even the capital letters match. The outer wildcards let the
          extra words sit on either side.
        hold: 1.1
        caption_starts:
          - The first has the code by itself
          - In the last passage
        visual_cues:
          - id: test-stored-strings
            phrase: The first has the code by itself
            targets:
              - passage-one
            color: green
          - id: reject-lookalike
            phrase: In the second, the X breaks the match
            targets:
              - passage-two
            color: pink
            caption_boundary: true
          - id: match-uppercase
            phrase: In the last passage, even the capital letters match
            targets:
              - passage-three
            color: green
      - say: Clear the search box. The helper trims the input and returns an empty list for a blank search.
          Otherwise the two outside wildcards could match every passage.
        hold: 1
        visual_cues:
          - id: substring-empty
            phrase: Clear the search box
            targets:
              - search-input
              - pattern-cells
            color: blue
  - id: join
    title: Build a citation from matching row fields
    visual: A paragraph's document_id compares with two source IDs. The matching title joins its text; a receipt
      paragraph follows the same parent without duplicating the source.
    beats:
      - say: >
          The paragraph alone gives us text. A citation also needs its source title and version. A JOIN
          combines rows whose named fields satisfy a condition. Compare the paragraph's document reference
          with each document identity. Which source belongs beside this paragraph?
        hold: 1.5
        visual_cues:
          - id: compare-join-fields
            phrase: Compare the paragraph's document reference
            targets:
              - join-fields
            color: yellow
      - say: >
          The matching identity selects the return-policy document. Move its title beside the text and we have
          a citable result. The receipt paragraph follows the same source. Matching a key identifies the exact
          version, even when an older document has the same title.
        hold: 0.8
        visual_cues:
          - id: attach-source-title
            phrase: Move its title beside the text
            targets:
              - joined-result
            color: green
          - id: join-second-paragraph
            phrase: receipt paragraph follows the same source
            targets:
              - second-join
            color: cyan
  - id: query-null
    title: Keep unknown and not-yet-active separate
    visual: Same old and current source rows, plus a future edition with a NULL end. Evaluate equality, IS NULL
      and the start predicate on each row. Unknown equality does not pass WHERE; a future open-ended edition
      still fails its start. Use normalized time representations before comparing version intervals.
    beats:
      - say: NULL represents missing or unknown information. Comparing an end field to NULL with equals produces
          unknown rather than true, so WHERE does not keep that row. Use IS NULL for the open-end branch,
          joined with the earlier-than-end test by OR. Then combine that whole branch with start less than or
          equal to the request time. A future version with an empty end still fails its start condition.
        hold: 0.65
        visual_cues:
          - id: query-null-b1
            phrase: NULL represents missing or unknown information.
            targets:
              - query-null-construction
            color: blue
            linger: 0.5
          - id: query-null-voice-1
            phrase: NULL represents missing or unknown information. Comparing an end field to NULL with equals produces
              unknown rather than true, so WHERE does not keep that row. Use IS NULL for the open-end branch,
              joined with the earlier-than-end test by OR. Then combine that whole branch with start less than
              or equal to the request time. A future version with an empty end still fails its start
              condition.
            targets:
              - query-null-construction
            color: blue
            linger: 0.5
          - id: query-null-step-0-1
            phrase: Comparing an end field to NULL with equals produces unknown rather than true, so WHERE does not keep
              that row.
            targets:
              - query-null-construction
            color: blue
            linger: 0.5
          - id: query-null-step-0-2
            phrase: Use IS NULL for the open-end branch, joined with the earlier-than-end test by OR.
            targets:
              - query-null-construction
            color: blue
            linger: 0.5
          - id: query-null-step-0-3
            phrase: Then combine that whole branch with start less than or equal to the request time.
            targets:
              - query-null-construction
            color: blue
            linger: 0.5
          - id: query-null-step-0-4
            phrase: A future version with an empty end still fails its start condition.
            targets:
              - query-null-construction
            color: blue
            linger: 0.5
      - say: Our SQLite program stores fixed-width UTC timestamps with the same precision and Z suffix. Their text
          order matches chronological order under that convention. Arbitrary offsets and mixed formats need
          normalization rather than raw string comparison. The PostgreSQL extension sketch uses timestamp with
          time zone to compare instants. It does not retain the original written time-zone identity. Adopt the
          server type, driver placeholders and transaction contract explicitly when moving this model to a
          shared server.
        hold: 0.65
        visual_cues:
          - id: query-null-b2
            phrase: Our SQLite program stores fixed-width UTC timestamps with the same precision and Z suffix.
            targets:
              - query-null-construction
            color: blue
            linger: 0.5
          - id: query-null-voice-2
            phrase: Our SQLite program stores fixed-width UTC timestamps with the same precision and Z suffix. Their text
              order matches chronological order under that convention. Arbitrary offsets and mixed formats
              need normalization rather than raw string comparison. The PostgreSQL extension sketch uses
              timestamp with time zone to compare instants. It does not retain the original written time-zone
              identity. Adopt the server type, driver placeholders and transaction contract explicitly when
              moving this model to a shared server.
            targets:
              - query-null-construction
            color: blue
            linger: 0.5
          - id: query-null-step-1-1
            phrase: Their text order matches chronological order under that convention.
            targets:
              - query-null-construction
            color: blue
            linger: 0.5
          - id: query-null-step-1-2
            phrase: Arbitrary offsets and mixed formats need normalization rather than raw string comparison.
            targets:
              - query-null-construction
            color: blue
            linger: 0.5
          - id: query-null-step-1-3
            phrase: The PostgreSQL extension sketch uses timestamp with time zone to compare instants.
            targets:
              - query-null-construction
            color: blue
            linger: 0.5
          - id: query-null-step-1-4
            phrase: It does not retain the original written time-zone identity.
            targets:
              - query-null-construction
            color: blue
            linger: 0.5
          - id: query-null-step-1-5
            phrase: Adopt the server type, driver placeholders and transaction contract explicitly when moving this model
              to a shared server.
            targets:
              - query-null-construction
            color: blue
            linger: 0.5
  - id: validity
    title: Put the request inside the version's interval
    visual: Two versions occupy equal-unit date intervals. The old version excludes the July endpoint, the new one
      includes it, and a request marker moves from that boundary to August. The open interval arrow continues
      beyond the visible October window.
    beats:
      - say: >
          Our fictional store changed its return window in July. Both editions contain the word return. Place
          the request time on their intervals. The earlier edition ends exactly where the next begins. At that
          boundary, which edition should supply the answer?
        hold: 1.5
        visual_cues:
          - id: move-request-time
            phrase: Place the request time on their intervals
            targets:
              - request-time
            color: yellow
      - say: >
          Include the start and exclude the end. The newer edition owns the boundary and this August request.
          Its empty end field means the end is unknown, so SQL uses IS NULL. Also check that the version has
          already started. Uniqueness of a start time alone allows overlapping intervals.
        hold: 0.8
        visual_cues:
          - id: resolve-version
            phrase: newer edition owns the boundary
            targets:
              - active-version
            color: green
          - id: open-ended-version
            phrase: SQL uses IS NULL
            targets:
              - validity-predicate
            color: cyan
  - id: version-guard
    title: Can two editions cover the same day?
    visual: Add a short proposed edition across the July boundary. Mark each edition that covers
      June 20, then July 10. Replace the open edition at one shared boundary on August 12.
    beats:
      - say: >-
          These two Harbor editions meet on July first. For each store and policy, the database
          requires a different start date for each edition. Try adding an edition that runs from
          June fifteenth to July fifteenth. Its start date is new, and its end comes after its start.
          Both checks pass. Look at June twentieth.
          Two editions cover that day. Move to July tenth. The proposal overlaps the July edition
          there. A unique start date still leaves Bob with two answers.
        hold: 1
        visual_cues:
          - id: add-proposal
            phrase: adding an edition that runs from June fifteenth to July fifteenth
            targets: [proposed-interval]
            color: pink
          - id: check-start-key
            phrase: Both checks pass
            targets: [proposed-interval]
            color: blue
          - id: probe-june
            phrase: Look at June twentieth
            targets: [overlap-date]
            color: yellow
          - id: probe-july
            phrase: Move to July tenth
            targets: [overlap-date]
            color: yellow
      - say: >-
          Watch how Harbor replaces an edition in August. The publisher runs BEGIN IMMEDIATE to take
          SQLite’s writer slot before it checks the open edition. It closes that edition exactly
          where the replacement starts. It saves the new document, paragraphs and grants in the same
          transaction. At commit, the two intervals meet on August twelfth. Every publisher needs to
          follow that sequence. A second writer can wait for the slot or retry.
        hold: 1
        visual_cues:
          - id: take-writer-slot
            phrase: take SQLite’s writer slot
            targets: [replacement-steps]
            color: yellow
          - id: replace-edition
            phrase: closes that edition exactly where the replacement starts
            targets: [replacement-intervals]
            color: cyan
          - id: commit-edition
            phrase: At commit, the two intervals meet on August twelfth
            targets: [replacement-steps, replacement-intervals]
            color: green
  - id: authorization
    title: Which paragraphs reach Bob’s desk?
    visual: A table keeps each paragraph beside its actual readers, store and validity. Each predicate marks
      its evidence in place before the two surviving paragraphs move into context.
    beats:
      - say: >-
          Here we supply Bob and Harbor as test inputs. All five paragraphs match the word return.
          Read the names beside the seven-day rule. Bob has a grant there. Now look across the rest of
          its row. For his Harbor request on August twelfth, which paragraphs belong in the answer?
        hold: 3.2
        visual_cues:
          - id: inspect-candidates
            phrase: look across the rest of its row
            targets:
              - candidate-rows
              - workspace-check
            color: yellow
      - say: Check Bob's grant first. Only Alice has the staff grant. Next require Harbor's workspace. That
          takes Birch’s seven-day rule out of this request even though Bob can read it there. Finally check
          the active version. Harbor once allowed thirty days, but that edition ended in July.
        hold: 1
        visual_cues:
          - id: require-reader
            phrase: Check Bob's grant first
            targets:
              - reader-check
            color: cyan
          - id: require-workspace
            phrase: require Harbor's workspace
            targets:
              - workspace-check
            color: blue
          - id: require-time
            phrase: check the active version
            targets:
              - time-check
            color: yellow
      - say: >-
          Move the two admitted paragraphs into the answer context. Bob has a deadline and a receipt
          instruction, both from the July edition. In production the server must identify Bob through
          his session and verify that he may serve Harbor. The same checks belong on a search by
          meaning.
        hold: 1
        visual_cues:
          - id: admit-context
            phrase: Move the two admitted paragraphs into the answer context
            targets:
              - answer-context
            color: green
  - id: role-boundary
    title: Test the database role that runs the query
    visual: Keep the same allowed and forbidden chunks while changing only the PostgreSQL execution role. Enable
      row security, compare an ordinary role without a policy to owner and bypass roles. Default deny applies
      to ordinary subject roles; bypass roles cross that boundary. The authenticated principal, verified
      workspace and production role must agree.
    beats:
      - say: Application predicates are one boundary; PostgreSQL row-level security can add another. When row security
          is enabled and no applicable policy permits rows, an ordinary subject role has a default-deny
          result. A policy must derive the principal and workspace from trusted request context.
          Client-supplied reader names or workspace fields cannot grant themselves access merely by entering a
          query parameter.
        hold: 0.65
        visual_cues:
          - id: role-boundary-b1
            phrase: Application predicates are one boundary; PostgreSQL row-level security can add another.
            targets:
              - role-boundary-construction
            color: blue
            linger: 0.5
          - id: role-boundary-voice-1
            phrase: Application predicates are one boundary; PostgreSQL row-level security can add another. When row
              security is enabled and no applicable policy permits rows, an ordinary subject role has a
              default-deny result. A policy must derive the principal and workspace from trusted request
              context. Client-supplied reader names or workspace fields cannot grant themselves access merely
              by entering a query parameter.
            targets:
              - role-boundary-construction
            color: blue
            linger: 0.5
          - id: role-boundary-step-0-1
            phrase: When row security is enabled and no applicable policy permits rows, an ordinary subject role has a
              default-deny result.
            targets:
              - role-boundary-construction
            color: blue
            linger: 0.5
          - id: role-boundary-step-0-2
            phrase: A policy must derive the principal and workspace from trusted request context.
            targets:
              - role-boundary-construction
            color: blue
            linger: 0.5
          - id: role-boundary-step-0-3
            phrase: Client-supplied reader names or workspace fields cannot grant themselves access merely by entering a
              query parameter.
            targets:
              - role-boundary-construction
            color: blue
            linger: 0.5
      - say: Test the role the server actually uses. Superusers and BYPASSRLS roles bypass row security. Table owners
          normally bypass it too; FORCE ROW LEVEL SECURITY can subject the owner to the policies, while
          superuser and BYPASSRLS exceptions remain. A successful test under an unrestricted owner is not a
          test of the application’s restricted role. Keep the same forbidden row in the fixture and exercise
          every retrieval route before adding it to answer context.
        hold: 0.65
        visual_cues:
          - id: role-boundary-b2
            phrase: Test the role the server actually uses.
            targets:
              - role-boundary-construction
            color: blue
            linger: 0.5
          - id: role-boundary-voice-2
            phrase: Test the role the server actually uses. Superusers and BYPASSRLS roles bypass row security. Table
              owners normally bypass it too; FORCE ROW LEVEL SECURITY can subject the owner to the policies,
              while superuser and BYPASSRLS exceptions remain. A successful test under an unrestricted owner
              is not a test of the application’s restricted role. Keep the same forbidden row in the fixture
              and exercise every retrieval route before adding it to answer context.
            targets:
              - role-boundary-construction
            color: blue
            linger: 0.5
          - id: role-boundary-step-1-1
            phrase: Superusers and BYPASSRLS roles bypass row security.
            targets:
              - role-boundary-construction
            color: blue
            linger: 0.5
          - id: role-boundary-step-1-2
            phrase: Table owners normally bypass it too; FORCE ROW LEVEL SECURITY can subject the owner to the policies,
              while superuser and BYPASSRLS exceptions remain.
            targets:
              - role-boundary-construction
            color: blue
            linger: 0.5
          - id: role-boundary-step-1-3
            phrase: A successful test under an unrestricted owner is not a test of the application’s restricted role.
            targets:
              - role-boundary-construction
            color: blue
            linger: 0.5
          - id: role-boundary-step-1-4
            phrase: Keep the same forbidden row in the fixture and exercise every retrieval route before adding it to
              answer context.
            targets:
              - role-boundary-construction
            color: blue
            linger: 0.5
  - id: counts
    title: Group the rows before counting them
    visual: Current paragraph rows collect by their exact source identity. The two groups contain two and one
      children. A left join retains an empty document and COUNT(child.id) yields zero.
    beats:
      - say: >
          We can ask a different question of the same rows: how many current paragraphs does each source
          contain? Filter by workspace and time, then collect matching document identities into groups. COUNT
          reduces each group to one result. Harbor has two return-policy paragraphs, and its staff guide
          contributes one. An ingestion audit has to account for drafts too.
        hold: 0.9
        visual_cues:
          - id: form-source-groups
