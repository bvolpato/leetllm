            color: yellow
          - id: compare-k-rows
            phrase: Count the saved rows
            targets:
              - transaction-exit
            color: cyan
      - say: The connection’s with block handles the exit of an open transaction. The first write opened it here.
          Python’s autocommit setting matters, and the program still has to close the connection itself.
        hold: 0.9
