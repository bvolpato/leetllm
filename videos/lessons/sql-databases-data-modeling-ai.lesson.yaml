            color: cyan
  - id: vector-contract
    title: What if the query points up?
    visual: Rotate the query against the fixed clothing-tags vector. Then replay the original search with a
      supplied approximate scan and put its filtered result beside the exact allowed neighbors.
    beats:
      - say: Take the clothing-tags paragraph at the far end of that ranking. Its tip lies to the left of the old
          query. Keep the paragraph and its grant fixed. Turn the query upward until it’s two units high.
          The paragraph points mostly up, too. What will that do to its score?
        hold: 2.8
        visual_cues:
          - id: turn-query
            phrase: Turn the query upward until it’s two units high
            targets:
              - query-axes
            color: yellow
      - say: >-
          Multiply corresponding coordinates and add. The horizontal pair contributes zero and the
          vertical pair contributes six. Divide that dot product by both lengths. The query has length
          two and the paragraph has length square root of ten. Its new cosine is about point nine four
          nine. The distance operator in pgvector gives about point zero five one. Smaller distances
          come first. Subtract that distance from one and the score column gives us the similarity
          again.
        hold: 1.2
        visual_cues:
          - id: new-vector-score
            phrase: Its new cosine is about point nine four nine
            targets:
              - cosine-operands
            color: yellow
            caption_boundary: true
          - id: recover-similarity
            phrase: the score column gives us the similarity again
            targets:
              - cosine-operands
            color: yellow
          - id: read-distance
            phrase: The distance operator in pgvector gives about point zero five one
            targets:
              - cosine-operands
            color: blue
            caption_boundary: true
      - say: >-
          We chose those coordinates to show the arithmetic. Cosine takes two nonzero vectors of equal
          dimension. To interpret the score as a match in meaning, use the model’s prescribed query
          and document encoders and prepare each input as the model expects. Their outputs must share
          a comparable space. Store the model version, source chunk and creation time with the vector.
          The article declares three dimensions in PostgreSQL. We drew two. Bind the query with your
          driver’s placeholders and keep the workspace, time, model and reader checks.
        hold: 1
        visual_cues:
          - id: match-encoder
            phrase: use the model’s prescribed query and document encoders
            targets:
              - embedding-row
              - query-model
            color: cyan
      - say: >-
          Go back to the original query pointing right. Three paragraphs qualify for Bob. He wants the
          nearest two. Pgvector’s default exact search gives us that reference pair. Now try one
          possible HNSW scan through its graph of nearby vectors. Inspect these first three
          candidates. Compare their store, edition and reader with Bob’s request. If the scan stops
          here, which eligible paragraphs does he get?
        hold: 2.8
        visual_cues:
          - id: scan-prefix
            phrase: Inspect these first three candidates
            targets:
              - scan-visits
            color: yellow
      - say: >-
          None of Bob’s three eligible paragraphs appears in this first group. Iterative scans let
          pgvector keep looking after filtering. They’re available from version zero point eight, off
          by default, and subject to scan limits. Continue the scan past that first group. Both places
          fill, but the scan skipped the deadline paragraph. Strict distance order sorts the neighbors
          it found. Compare the two pairs. Only the receipt appears in both. That’s one out of two for
          filtered recall at two.
        hold: 1.8
        caption_starts:
          - Only the receipt appears in both
        visual_cues:
          - id: continue-scan
            phrase: Continue the scan past that first group
            targets:
              - scan-visits
            color: cyan
          - id: compare-neighbors
            phrase: one out of two for filtered recall at two
            targets:
              - neighbor-lists
            color: green
            caption_boundary: true
  - id: lineage-version
    title: Can yesterday’s score be checked?
    visual: >-
      Follow R1’s first result through an overwrite and a versioned insert for the same chunk. Compare
      its two original ranked rows with a later model’s embedding. Recompute one hit under two
      versions of the relevance labels.
    beats:
      - say: >-
          Open a separate saved run with a simple pair of arrows. The query and its first hit both
          pointed right. Their cosine was one. A new encoder produces an arrow pointing up for that
          same paragraph. What if we overwrite the stored vector so it points straight up? Follow the
          old result. The lookup still works, but the arrows now give zero. If the old coordinates are
          gone, mark the evidence as missing. Replay that write. Keep the original row. Give a changed
          encoder or preprocessing recipe its own model identifier. Store the new encoder version and
          its vector under a new embedding ID. The schema allows one embedding per chunk and model
          version. To keep multiple revisions for that same pair, include a revision
          in the unique key. If the source words change, give the edited chunk a new ID too.
        hold: 1.5
        caption_starts:
          - The lookup still works
        visual_cues:
          - id: lineage-version-step-0-1
            phrase: overwrite the stored vector so it points straight up
            targets:
              - overwritten-vector
            color: yellow
          - id: recompute-old-score
            phrase: the arrows now give zero
            targets:
              - overwritten-vector
            color: yellow
            caption_boundary: true
          - id: lineage-version-step-0-5
            phrase: Store the new encoder version and its vector under a new embedding ID
            targets:
              - versioned-vectors
            color: cyan
      - say: >-
          These two embeddings were already in the file when run one ranked the coat query. The later
          embedding can appear in a later run. Each result keeps its rank, score and embedding ID. The
          run records the dataset and query model. Give each rank one place in this query. A second
          uniqueness rule keeps the same embedding from taking two places, and ranks must be positive.
          To repeat the search, also save the query, settings, preprocessing version, policy time and
          corpus snapshot. The article’s minimal schema needs those extra fields.
        hold: 1
        visual_cues:
          - id: protect-rank
            phrase: Give each rank one place in this query
            targets:
              - ranked-records
            color: blue
      - say: Here’s a report for one query. In the first dataset, the deadline paragraph was marked relevant,
          so it earned a hit. In a second dataset the reviewer marks only the tags paragraph relevant.
          Look at the chunk the search returned. What score belongs beside the new labels?
        hold: 2.8
        visual_cues:
          - id: first-judgment
            phrase: so it earned a hit
            targets:
              - judged-reports
            color: blue
          - id: change-judgment
            phrase: the reviewer marks only the tags paragraph relevant
            targets:
              - judged-reports
            color: blue
      - say: This report gets zero. Bob’s first result is still the deadline paragraph. The second dataset
          counts only the tags paragraph as a hit. Keep both reports with the labels used to score them.
        hold: 1.6
        visual_cues:
          - id: recompute-hit
            phrase: This report gets zero
            targets:
              - judged-reports
            color: yellow
            caption_boundary: true
