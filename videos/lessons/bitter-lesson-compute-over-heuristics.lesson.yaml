            linger: 0.5
  - id: training-compute
    title: Training FLOPs expose a budget tradeoff
    visual: The six-N-D approximation computes work for two parameter-token allocations at equal estimated
      training FLOPs and reveals the resulting token exposure.
    beats:
      - say: >
          A dense Transformer planning estimate counts about six floating-point operations per parameter
          for each training token. Multiply parameter count N by token count D to get C approximately
          equal to six N D.
        hold: 0.8
        visual_cues:
          - id: training-compute-beat-1-focus-1
            phrase: floating-point operations per parameter for each training token
            targets:
              - training-compute-simulation-47
            color: blue
            linger: 0.6
      - say: >
          Seven billion parameters trained on one hundred forty billion tokens gives about 5.88
          zettaFLOPs under this estimate. The unit measures total operations, not speed or wall-clock
          time.
        hold: 0.85
        visual_cues:
          - id: training-compute-beat-2-focus-1
            phrase: parameters trained on one hundred forty billion tokens
            targets:
              - training-compute-simulation-47
            color: blue
            linger: 0.6
      - say: >
          Keep that budget fixed and double the model to fourteen billion parameters. The affordable
          token count falls to seventy billion. Training experiments and held-out quality determine which
          allocation works better.
        hold: 0.9
        visual_cues:
          - id: training-compute-beat-3-focus-1
            phrase: Keep that budget fixed and double the model to fourteen billion parameters
            targets:
              - training-compute-simulation-47
            color: blue
            linger: 0.6
          - id: training-compute-beat-3-focus-2
            phrase: The affordable token count falls to seventy billion
            targets:
              - training-compute-object-row-tokens-1e9-tofixed-0-b-training-tokens-49
            color: blue
            linger: 0.6
