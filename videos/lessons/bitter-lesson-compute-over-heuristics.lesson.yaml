scenes:
  - id: opening
    title: More CPU cannot teach a missing condition
    visual: An incident report moves through an exact keyword router, reaches an unassigned queue, and
      becomes legible to a learned router after examples provide evidence.
    beats:
      - say: >
          At three in the morning, an alert says tokens are arriving slowly. The router looks for the
          word timeout, sends nothing to the latency queue, and leaves a live issue unassigned.
        hold: 0.8
        visual_cues:
          - id: opening-beat-1-focus-1
            phrase: and leaves a live issue unassigned
            targets:
              - opening-object-s-issue-1
            color: blue
            linger: 0.6
          - id: opening-beat-1-focus-2
            phrase: The router looks for the word timeout
            targets:
              - opening-object-condition-contains-timeout-2
            color: blue
            linger: 0.6
      - say: >
          The team adds more CPU cores. The same condition runs faster, and the ticket still misses. This
          is the Bitter Lesson in miniature: compute helps a method when that method can turn more
          computation into better behavior.
        hold: 0.8
        visual_cues:
          - id: opening-beat-2-focus-1
            phrase: The team adds more CPU cores
            targets:
              - opening-object-cpu-s-cpu-3
            color: blue
            linger: 0.6
          - id: opening-beat-2-focus-2
            phrase: The same condition runs faster
            targets:
              - opening-object-condition-contains-timeout-2
            color: blue
            linger: 0.6
      - say: >
          We’ll watch a rulebook reach its boundary, teach a small learner from labeled issues, and spend
          extra compute on search. Then we’ll calculate how training and serving budgets change the
          choice.
        hold: 0.85
        visual_cues:
          - id: opening-beat-3-focus-1
            phrase: We’ll watch a rulebook reach its boundary
            targets:
              - opening-object-s-issue-1
            color: blue
            linger: 0.6
  - id: historical-pattern
    title: Learning and search made computation useful
    visual: Three historical timelines trace chess, vision, and speech from expert-designed methods toward
      systems that use deeper search or learned patterns, with design choices still visible.
    beats:
      - say: >
          Sutton’s Bitter Lesson describes a long history of methods that improved as they used more
          computation. The key shift is a method that can turn added search or learning into stronger
          results.
        hold: 0.8
        visual_cues:
          - id: historical-pattern-beat-1-focus-1
            phrase: Sutton’s Bitter Lesson describes a long history of
            targets:
              - historical-pattern-simulation-7
            color: blue
            linger: 0.6
      - say: >
          Chess makes the pattern concrete. Deep Blue combined deep search with engineered evaluation
          features. AlphaZero combined self-play learning with search, using a designed network and board
          encoding as its starting structure.
        hold: 0.85
        visual_cues:
          - id: historical-pattern-beat-2-focus-1
            phrase: Chess makes the pattern concrete
            targets:
              - historical-pattern-simulation-7
            color: blue
            linger: 0.6
      - say: >
          Vision moved from SIFT descriptors toward features learned by AlexNet. Speech systems moved
          from expert descriptions toward hidden Markov models and deep learning. Each history keeps
          useful design choices while giving computation more room to improve capability.
        hold: 0.9
        visual_cues:
          - id: historical-pattern-beat-3-focus-1
            phrase: Vision moved from SIFT descriptors toward features learned by AlexNet
            targets:
              - historical-pattern-simulation-7
            color: blue
            linger: 0.6
      - say: Go paired scaled search with learned policy and value estimates; AlphaZero learned from self-play
          with the rules supplied, while still using a designed network and search. AlexNet’s winning
          twenty-twelve entry was a seven-network ensemble. The paper’s five-to-six-day timing on two GTX
          five-eighty GPUs describes its base network, not the total ensemble cost. Historical results
          keep their exact system and measurement scope.
        hold: 0.8
        visual_cues:
          - id: historical-pattern-core-completion
            phrase: Go paired scaled search with learned policy and value estimates; AlphaZero learned from self-play
              with the rules supplied, while still using a designed network and search
            targets:
              - historical-pattern-completion
            linger: 0.5
