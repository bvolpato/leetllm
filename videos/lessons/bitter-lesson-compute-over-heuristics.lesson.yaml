            phrase: A rule is a condition someone wrote in advance
            targets:
              - rulebook-simulation-11
            color: blue
            linger: 0.6
      - say: >
          Three reports contain one of those exact words and reach the intended queue. The other three
          describe slow tokens, an old source, and a failed sign-in with different wording.
        hold: 0.8
        visual_cues:
          - id: rulebook-beat-2-focus-1
            phrase: Three reports contain one of those exact words
            targets:
              - rulebook-simulation-11
            color: blue
            linger: 0.6
      - say: >
          The baseline routes three of six correctly. Giving the same checks more execution time
          preserves that decision boundary; a new condition needs new information in the rulebook.
        hold: 0.85
        visual_cues:
          - id: rulebook-beat-3-focus-1
