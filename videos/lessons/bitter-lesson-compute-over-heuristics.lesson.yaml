  - id: policy-gate
    title: Let learning interpret while policy checks actions
    visual: A model proposes promotion from free-form text. An independent gate checks the evaluation report
      and the 0.95 score threshold, promoting valid evidence and routing failures to review.
    beats:
      - say: >
          Learned systems help interpret varied language. A policy gate can handle consequential
          boundaries such as artifact identity, authorization, and a measured release threshold.
        hold: 0.8
        visual_cues:
          - id: policy-gate-beat-1-focus-1
            phrase: A policy gate can handle consequential boundaries such as artifact identity
            targets:
              - policy-gate-artifact-checks
              - policy-gate-object-independent-policy-gate-58
            color: blue
            linger: 0.6
          - id: policy-gate-beat-1-focus-2
            phrase: Learned systems help interpret varied language
            targets:
              - policy-gate-object-learned-model-proposal-57
            color: blue
            linger: 0.6
      - say: >
          In this teaching example, a score of 0.91 goes to human review, while a score of 0.98 with a
          report passes the numeric gate. Missing evidence requests the report before any release.
        hold: 0.85
        visual_cues:
          - id: policy-gate-beat-2-focus-1
            phrase: Missing evidence requests the report before any release
            targets:
              - policy-gate-object-0-98-report-missing-request-evidence-61
            color: blue
            linger: 0.6
          - id: policy-gate-beat-2-focus-2
            phrase: 91 goes to human review
            targets:
              - policy-gate-object-0-91-report-present-human-review-59
            color: blue
            linger: 0.6
      - say: >
          The useful question is where another unit of compute can improve behavior and how we will
          measure it. Learning can absorb evidence, search can examine candidates, and explicit checks
          can control the actions a system may take.
        hold: 0.9
        visual_cues:
          - id: policy-gate-beat-3-focus-1
            phrase: Learning can absorb evidence
            targets:
              - policy-gate-object-learned-model-proposal-57
            color: blue
            linger: 0.6
      - say: The gate returns the low-risk latency, quality and access routes directly, and sends an unknown
          route to review. For a promote route, it first requests a missing report marker. With that
          marker present, it requires a finite numeric score from zero through one, rejecting Boolean,
          string, not-a-number and out-of-range values. The point-nine-five boundary is inclusive. Only
          valid scores at or above it pass this local numeric check; that does not authorize deployment.
        hold: 0.8
        visual_cues:
          - id: policy-gate-core-completion
            phrase: For a promote route, it first requests a missing report marker
            targets:
              - policy-gate-completion
            linger: 0.5
  - id: allocation-evidence
    title: Fit the allocation instead of declaring a universal ratio
    visual: A fixed-ND rectangle reshapes while empirical parameter and token exponents keep their study labels.
    beats:
      - say: The six-N-D estimate comes from about two-N operations for a forward token and about twice that for
          backward. It counts dense training work using non-embedding parameters and omits terms such as
          sequence-dependent attention when small relative to projections. It is a planning approximation
          rather than a wall-clock or quality equation.
        hold: 1.2
        visual_cues:
          - id: allocation-evidence-b1
            phrase: The six-N-D estimate comes from about two-N operations for a forward token and about twice that
              for backward
            targets:
              - allocation-evidence-mechanism
            linger: 0.5
      - say: Kaplan twenty-twenty fitted a compute-efficient split with parameter count growing roughly as
          compute to point seven three and tokens to point two seven. Hoffmann twenty-twenty-two tested
          more than four hundred models and favored roughly equal growth in parameters and tokens; its
          different estimation methods gave nearby, distinct exponents. Chinchilla tested that revised
          allocation at roughly Gopher training compute using seventy billion parameters and one point
          four trillion tokens, versus Gopher two hundred eighty billion and three hundred billion.
        hold: 0.8
        visual_cues:
          - id: allocation-evidence-b2
            phrase: Kaplan twenty-twenty fitted a compute-efficient split with parameter count growing roughly as
              compute to point seven three and tokens to point two seven
            targets:
              - allocation-evidence-mechanism
            linger: 0.5
      - say: Those are empirical studies, not universal constants or a mandatory twenty-token-per-parameter rule.
          The Llama-three paper later described longer training for its smaller models to improve
          performance at the same inference budget. That motivates measuring serving quality and lifetime
          work, not declaring one historical ratio optimal for every corpus, architecture or release.
        hold: 0.8
        visual_cues:
          - id: allocation-evidence-b3
            phrase: Those are empirical studies, not universal constants or a mandatory twenty-token-per-parameter
              rule
            targets:
              - allocation-evidence-mechanism
            linger: 0.5
  - id: request-budget
    title: Charge every part of test-time work
    visual: The same ticket retains a frozen learned model while revision candidates, difficulty estimation
      and hidden effort spend a visible budget.
    beats:
      - say: Request-time reasoning can generate intermediate tokens, revise an answer or search multiple
          candidates without changing the deployed model weights. Training and post-training can instead
          change those weights through supervised examples or verifiable reinforcement-learning outcomes.
          A convincing long explanation establishes neither answer correctness nor faithful access to
          internal computation.
        hold: 1.2
        visual_cues:
          - id: request-budget-b1
            phrase: Request-time reasoning can generate intermediate tokens, revise an answer or search multiple
              candidates without changing the deployed model weights
            targets:
              - request-budget-mechanism
            linger: 0.5
      - say: Extra search depends on candidate quality and verifier quality. Our citation-ID counter admits a
          delete-report action with the same evidence-ID score as trace-and-block. Increasing the budget
          can therefore discover a stronger exploitation of a weak checker. Check whether the cited
          evidence actually supports the proposed action and whether execution is authorized.
        hold: 0.8
        visual_cues:
          - id: request-budget-b2
            phrase: Extra search depends on candidate quality and verifier quality
            targets:
              - request-budget-mechanism
            linger: 0.5
      - say: Charge difficulty estimation, routing, all candidates, verification, input, hidden reasoning and
          visible output in the real request budget. An effort setting is not a specified FLOP count, and
          a generation cap can be exhausted before a visible answer. Compare untouched tasks, useful
          outcomes, completion failures, latency and resource cost at matched quality. Different output
          lengths also invalidate an equal-token-volume lifetime crossover.
        hold: 0.8
        visual_cues:
          - id: request-budget-b3
            phrase: Charge difficulty estimation, routing, all candidates, verification, input, hidden reasoning and
              visible output in the real request budget
            targets:
              - request-budget-mechanism
            linger: 0.5
  - id: earned-transfer
    title: Keep the ticket while evidence changes
    visual: One fresh candidate passes the numeric threshold, then removing only its report changes the
      permitted next action.
    beats:
      - say: Try a new release proposal. The learned router recognizes a messy promotion request and the supplied
          score is point nine seven against an illustrative point nine five floor. The report marker is
          present. The local numeric-and-marker gate can return promote, but a real service still needs
          authenticated report identity, matching artifact and cohort, and caller authorization.
        hold: 1.2
        visual_cues:
          - id: earned-transfer-b1
            phrase: Try a new release proposal
            targets:
              - earned-transfer-mechanism
            linger: 0.5
      - say: Now remove only the report marker. The score and proposed action stay fixed. Should more search or a
          faster CPU make this executable? The gate must request evidence. Restoring a real report can
          change that boundary; extra computation does not manufacture the missing authority or support.
        hold: 0.8
        visual_cues:
          - id: earned-transfer-b2
            phrase: Now remove only the report marker
            targets:
              - earned-transfer-mechanism
            linger: 0.5
          - id: earned-evidence-verdict
            phrase: The gate must request evidence
            targets:
              - earned-transfer-mechanism
            color: yellow
            linger: 0.5
      - say: "You can now choose where a new unit of computation earns value: absorb reviewed labels for a future learner, inspect and verify candidates for this request, or enforce a clear consequential boundary. Keep the same held-out tasks and product requirements while measuring that choice. The tiny word counter and authored FLOP worksheet expose mechanisms rather than benchmarking scalable intelligence. A language model reads text through token pieces and IDs. Next, we trace that mapping and why it has to stay compatible with the checkpoint."
        hold: 0.8
        visual_cues:
          - id: earned-transfer-b3
            phrase: "You can now choose where a new unit of computation earns value: absorb reviewed labels for a
              future learner, inspect and verify candidates for this request, or enforce a clear
              consequential boundary"
            targets:
              - earned-transfer-mechanism
            linger: 0.5
