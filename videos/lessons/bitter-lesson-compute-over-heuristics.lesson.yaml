  - id: learning
    title: Labeled examples become reusable evidence
    visual: Word counts accumulate under labeled queues, contribute to a held-out ticket score, and change
      after a reviewed correction is added to training data.
    beats:
      - say: >
          A small learner counts words in labeled reports. The word citation appears with quality-labeled
          issues, so it becomes evidence for that route without a developer adding a special citation
          branch.
        hold: 0.8
        visual_cues:
          - id: learning-beat-1-focus-1
            phrase: A small learner counts words in labeled reports
            targets:
              - learning-simulation-26
            color: blue
            linger: 0.6
      - say: >
          For “unsupported citation answer,” unsupported, citation, and answer each add one quality
          point. A report with none of the observed words receives zero evidence and goes to manual
          review.
        hold: 0.8
        visual_cues:
          - id: learning-beat-2-focus-1
            phrase: For “unsupported citation answer
            targets:
              - learning-simulation-26
            color: blue
            linger: 0.6
      - say: >
          Add a reviewed label for “the site loads slowly,” retrain, and the same phrase now scores for
          latency. The correction changed the model through data; fresh untouched reports still measure
          whether the change generalizes.
        hold: 0.9
        visual_cues:
          - id: learning-beat-3-focus-1
            phrase: and the same phrase now scores for latency
            targets:
              - learning-object-correction-latency-quality-evidence-correction-fra-36
            color: blue
            linger: 0.6
          - id: learning-beat-3-focus-2
            phrase: The correction changed the model through data
            targets:
              - learning-slowly-count
            color: blue
            linger: 0.6
      - say: A positive tie needs abstention too. The report timeout password gives equal route evidence, so this
          counter returns manual review rather than choosing by label order. Exact word counts still miss
          unseen synonyms. Fitting the reviewed phrase the site loads slowly repairs that training
          example; only fresh untouched issues can test whether it generalizes.
        hold: 0.8
        visual_cues:
          - id: learning-core-completion
            phrase: A positive tie needs abstention too
            targets:
              - learning-completion
            linger: 0.5
  - id: search
    title: Search spends compute when a request arrives
    visual: Candidate budgets reveal actions one by one. A verifier scores distinct trusted evidence IDs,
      then an adversarial action earns the same evidence score as the sensible action.
    beats:
      - say: >
          Learning changes a later release. Search spends compute during the current request: produce
          candidate actions, check each one, and choose according to a verifier.
        hold: 0.75
        visual_cues:
          - id: search-beat-1-focus-1
            phrase: Learning changes a later release
            targets:
              - search-simulation-40
            color: blue
            linger: 0.6
      - say: >
          For a citation failure, a budget of two candidates sees only an empty retry and an unsupported
          promotion. A budget of four reveals an action tied to run R42 and its citation-precision
          metric.
        hold: 0.85
        motion_check:
          region:
            - 220
            - 350
            - 1480
            - 560
          minimumChangedFraction: 0.002
        visual_cues:
          - id: search-beat-2-focus-1
            phrase: For a citation failure
            targets:
              - search-simulation-40
            color: blue
            linger: 0.6
          - id: search-beat-2-focus-2
            phrase: action tied to run R42 and its citation-precision
            targets:
              - search-simulation-40
              - search-budget
            color: blue
            linger: 0.6
          - id: search-four-candidates
            phrase: A budget of four
            targets:
              - search-simulation-40
              - search-budget
            color: yellow
            linger: 0.4
      - say: >
          Both trusted evidence IDs give that action a score of two. Deleting the evaluation report
          receives the same score when the checker only counts IDs, so a stronger verifier must also
          check what the evidence supports.
        hold: 0.9
        visual_cues:
          - id: search-beat-3-focus-1
            phrase: Both trusted evidence IDs give that action a score of two
            targets:
              - search-simulation-40
            color: blue
            linger: 0.6
          - id: search-beat-3-focus-2
            phrase: Deleting the evaluation report receives the same score
            targets:
              - search-object-unsafe-action-delete-evaluation-report-44
            color: blue
            linger: 0.6
      - say: This is a fixed authored candidate list, not a real language-model generator. Its verifier counts
          distinct trusted evidence IDs. Repeating the same ID earns no extra point, and invented IDs
          earn none. Revealing more list entries isolates selection under a budget without measuring
          generation quality.
        hold: 0.8
        visual_cues:
          - id: search-core-completion
            phrase: This is a fixed authored candidate list, not a real language-model generator
            targets:
