version: 1
id: prefix-reuse
title: Reusing the Beginning of a Conversation
source: fundamentals/prefix-caching-prompt-caching/content.md
voice: en-US-AndrewNeural
rate: +0%
sources:
  - title: vLLM automatic prefix caching design
    url: https://docs.vllm.ai/en/latest/design/prefix_caching/
  - title: SGLang and RadixAttention
    url: https://arxiv.org/abs/2312.07104
  - title: OpenAI prompt caching contract
    url: https://developers.openai.com/api/docs/guides/prompt-caching
  - title: OpenAI prompt cache diagnostics
    url: https://developers.openai.com/api/docs/guides/prompt-caching/diagnostics
  - title: Claude prompt caching contract
    url: https://platform.claude.com/docs/en/build-with-claude/prompt-caching
  - title: Mooncake KVCache-centric scheduling
    url: https://arxiv.org/abs/2407.00079
  - title: Consistent Hashing with Bounded Loads
    url: https://arxiv.org/abs/1608.01350
scenes:
  - id: intro
    title: A long guide, three different questions
    visual: Three identified requests share the same blue guide while their differently colored question
      tails remain separate. A computed ledger distinguishes reused and fresh input.
    beats:
      - say: >
          Imagine a coding assistant that reads the same repository guide whenever someone asks a
          question. The guide stays fixed while the questions change. Computing its attention state
          once could save a great deal of repeated work. Follow three requests and watch which parts
          can travel together.
        visual_cues:
          - id: fixed-guide
            phrase: guide stays fixed
            targets:
              - intro-guide
            color: blue
          - id: request-identities
            phrase: Follow three requests
            targets:
              - intro-question
            color: cyan
        hold: 0.6
      - say: >
          A language model first processes its input tokens. Each attention layer creates keys and
          values that later tokens can read. Keeping this state lets a new question begin after an
          already processed guide, provided its exact starting tokens and computation settings
          match.
        visual_cues:
          - id: input-state
            phrase: first processes its input tokens
            targets:
              - intro-question
            color: blue
          - id: matching-settings
            phrase: exact starting tokens and computation settings match
            targets:
              - intro-guide
            color: green
        hold: 0.6
      - say: >
          The new question still has to be processed, and its answer still has to be generated. Our
          ledger will count those operations separately. We will also examine why a tiny early edit,
          an unavailable entry, or a different tenant can close the path to reuse.
        visual_cues:
          - id: fresh-question
            phrase: new question still has to be processed
            targets:
              - intro-question
            color: cyan
          - id: new-output
            phrase: answer still has to be generated
            targets:
              - intro-readout-2
            color: yellow
        hold: 0.7
  - id: causal-keys
    title: Each block inherits its history
    visual: Actual SHA-256 chained keys connect three named blocks. Editing the guide changes its key
      and the unchanged tools block's descendant key while preserving the system key.
    beats:
      - say: >
          Consider three blocks: instructions, a guide, and a tool description. In causal attention,
          later positions can depend on everything before them. A useful cache identity therefore
          includes both the current block and a key representing its preceding history. Follow the
          chain from left to right.
        visual_cues:
          - id: history-chain
            phrase: both the current block and a key representing its preceding history
            targets:
              - causal-keys-readout-2
            color: blue
          - id: chained-hash
            phrase: chain from left to right
            targets:
              - causal-keys-equation
            color: yellow
        hold: 0.65
      - say: >
          Now change the guide version. The instruction block keeps the same key. The guide receives
          a different key, and that change flows into the tools block. Its visible text stayed
          fixed, yet the context that produced its deeper attention state has changed.
        visual_cues:
          - id: edit-guide
            phrase: change the guide version
            targets:
              - causal-keys-readout-2
            color: pink
          - id: propagated-key
            phrase: change flows into the tools block
            targets:
              - causal-keys-readout-3
            color: pink
        hold: 0.7
      - say: >
          The displayed digests come from an actual structured hash calculation. A serving engine
          also binds the relevant model, adapter, positions, and other conditioning to its cache
          namespace. Matching text becomes useful only within a computation contract that can safely
          reproduce the intended state.
        visual_cues:
          - id: actual-digest
            phrase: actual structured hash calculation
            targets:
              - causal-keys-readout-3
            color: yellow
          - id: computation-contract
            phrase: computation contract
            targets:
              - causal-keys-equation
            color: blue
        hold: 0.55
  - id: radix-split
    title: Split the history without losing its identity
    visual: One concrete token edge splits at the actual divergence. A bracketed 6005-position match is
      rounded only for the separate sixteen-token block cache.
    beats:
      - say: "Keep the original chain beside a second index. A stored edge contains token IDs eleven,
          twelve, thirteen, fourteen. A new request begins eleven, twelve, ninety-nine. Compare from
          the root: two tokens match. Split the edge after twelve. Both branches retain the shared
          ancestor; their different suffixes acquire separate state."
        hold: 0.7
        visual_cues:
          - id: radix-match
            phrase: two tokens match
            targets:
              - radix-match-mark
            color: cyan
            linger: 0.55
          - id: radix-branch
            phrase: Split the edge after twelve
            targets:
              - radix-split-geometry
            color: cyan
            linger: 0.55
      - say: "This is a compressed radix tree: an edge can hold several token IDs, and a divergence creates
          a branch inside that edge. The original SGLang paper retains prompt and generated state,
          searches the longest shared prefix, and protects running paths with reference counts. Its
          least-recently-used eviction removes eligible leaves before their shared ancestors."
        hold: 0.7
        visual_cues:
          - id: radix-protect
            phrase: protects running paths
            targets:
              - radix-protect-mark
            color: cyan
            linger: 0.55
          - id: radix-evict
            phrase: eviction removes eligible leaves
            targets:
              - radix-evict-mark
            color: cyan
            linger: 0.55
      - say: Compare a larger match of six thousand and five tokens. A token-granular radix fixture can
          expose that divergence. A full-block cache with sixteen tokens per block reuses six
          thousand. Divide the common-prefix length by the block size, discard the fraction, then
          multiply by block size. Five shared tokens remain outside its reusable boundary. The index
          and backend decide which boundaries actually exist.
        hold: 0.7
        visual_cues:
          - id: radix-scale
            phrase: larger match of six thousand and five tokens
            targets:
              - radix-scale-mark
            color: cyan
            linger: 0.55
          - id: radix-round
            phrase: reuses six thousand
            targets:
              - radix-round-mark
            color: cyan
            linger: 0.55
          - id: radix-remainder
            phrase: "Five shared tokens remain outside its reusable boundary"
            targets:
              - radix-round-mark
            color: cyan
            linger: 0.55
  - id: block-boundaries
    title: Reuse stops at an eligible boundary
    visual: Two literal token-ID rows share nine positions. A four-token block fixture reuses eight,
      then an early token edit removes the first block and all downstream hits.
    beats:
      - say: >
          Our small block cache stores four tokens per block. These two requests share their first
          nine token IDs. Count complete blocks before revealing the result. Two complete blocks
          account for eight reusable positions, leaving the next shared token inside an incomplete
          boundary in this fixture.
        visual_cues:
          - id: four-token-block
            phrase: four tokens per block
            targets:
              - block-boundaries-readout-2
            color: blue
          - id: complete-boundaries
            phrase: Two complete blocks account for eight reusable positions
            targets:
              - block-boundaries-readout-5
            color: green
        hold: 0.9
      - say: >
          The highlighted prefix ends after the second block. The remaining input takes the fresh
          path. Different indexes can expose different boundaries: a compressed token trie can split
          at a divergence, while a block cache follows the granularity supported by its
          implementation and backend.
        visual_cues:
          - id: matched-boundary
            phrase: highlighted prefix ends after the second block
            targets:
              - block-boundaries-readout-2
            color: green
          - id: fresh-input
            phrase: remaining input takes the fresh path
            targets:
              - block-boundaries-readout-2
            color: yellow
        hold: 0.65
      - say: >
          Edit the third token and compare again. The first complete block now differs, so the old
          chain offers no reusable starting block. Even matching words later in the row inherit the
          changed history. Exact token identity and the boundary together determine this lookup
          result.
        visual_cues:
          - id: early-edit
            phrase: Edit the third token
            targets:
              - block-boundaries-readout-2
            color: pink
          - id: miss-chain
            phrase: no reusable starting block
            targets:
              - block-boundaries-readout-5
            color: pink
        hold: 0.65
  - id: prompt-order
    title: Put stable context before changing detail
    visual: The same named sections move between a changing-ID-first layout and a stable-first layout. A
      longest-prefix comparison computes zero versus three matching section units.
    beats:
      - say: >
          A changing request identifier at the beginning makes every guide follow a different
          history. Compare the two serialized layouts. In the first, the requests diverge
          immediately. These labeled sections stand in for token sequences, so the count measures
          matching section units rather than tokenizer output.
        visual_cues:
          - id: variable-first
            phrase: changing request identifier at the beginning
            targets:
              - prompt-order-readout-4
            color: pink
          - id: immediate-divergence
            phrase: diverge immediately
            targets:
              - prompt-order-readout-5
            color: pink
        hold: 0.6
      - say: >
          Move the variable detail after the instructions, guide, and tools. The stable sections now
          share their starting history. Their identities remain visible as they move. Preserve the
          message roles required by your application while making the actual serialized content as
          stable as its meaning allows.
        visual_cues:
          - id: stable-first
            phrase: Move the variable detail after the instructions, guide, and tools
            targets:
              - prompt-order-readout-3
            color: blue
          - id: retained-identities
            phrase: identities remain visible as they move
            targets:
              - prompt-order-readout-4
            color: pink
        hold: 0.7
      - say: >
          Deterministic rendering matters here. A timestamp, changed line ending, or reordered JSON
          field can change token IDs. Inspect the request that actually reached the model. A
          template file and a similar-looking sentence give weaker evidence than the final
          serialized token sequence.
        visual_cues:
          - id: serialized-order
            phrase: timestamp, changed line ending, or reordered JSON field
            targets:
              - prompt-order-readout-4
            color: yellow
          - id: final-input
            phrase: final serialized token sequence
            targets:
              - prompt-order-readout-3
            color: blue
        hold: 0.6
  - id: rendered-identity
    title: The actual serialization chooses the branch
    visual: Identical-looking guide source is rendered into literal newline and JSON token fixtures. A
      one-variable line-ending edit moves the first unequal token while ordered arrays stay
      distinct.
    beats:
      - say: Follow the guide from source text into the actual request. A renderer adds role wrappers,
          whitespace, tools, and document content before tokenization. A source file digest alone
          cannot tell us which token sequence reached the model. Record the renderer version and
          inspect the serialized input at the same boundary the engine uses.
        hold: 0.7
        visual_cues:
          - id: render-pipeline
            phrase: A renderer adds role wrappers, whitespace, tools, and document content
            targets:
              - render-pipeline-mark
            color: cyan
            linger: 0.55
      - say: Change only a line ending from newline to carriage-return plus newline. That can change token
          IDs and move the first mismatch into an otherwise stable guide. Restore the original
          rendering and the old branch becomes eligible again, if its entry still exists. Reordering
          JSON object keys can similarly change literal serialized text; deterministic serialization
          prevents that accidental variation.
        hold: 0.7
        visual_cues:
          - id: render-edit
            phrase: Change only a line ending
            targets:
              - render-edit-mark
            color: cyan
            linger: 0.55
          - id: render-repair
            phrase: Restore the original rendering
            targets:
              - render-repair-mark
            color: green
            linger: 0.55
      - say: "Canonicalization must preserve meaning. Object keys may be sorted when that respects the
          application contract, but arrays remain ordered: tool arguments or message lists can
          change meaning when reordered. Preserve role boundaries, model and adapter identity,
          position behavior, and multimodal content identity. A repeated image placeholder is
          insufficient when the underlying image differs."
        hold: 0.7
        visual_cues:
          - id: render-array
            phrase: arrays remain ordered
            targets:
              - render-array-mark
            color: cyan
            linger: 0.55
          - id: render-image
            phrase: underlying image differs
            targets:
              - render-image-mark
            color: cyan
            linger: 0.55
  - id: publication
    title: A matching prefix needs a completed entry
    visual: Request R1 writes a named guide entry. R2 arrives before publication and misses. A later R3
      finds that exact completed boundary and reuses it.
    beats:
      - say: >
          A matching prefix also needs somewhere to come from. Request one is still computing the
          guide when request two arrives. The cache has no completed guide entry yet, so this second
          request takes the cold path even though its starting tokens match perfectly.
        visual_cues:
          - id: writing-entry
            phrase: still computing the guide
            targets:
              - publication-source
            color: blue
          - id: cold-arrival
            phrase: second request takes the cold path
            targets:
              - publication-request
            color: pink
        hold: 0.65
      - say: >
          The write completes and publishes the guide boundary. We keep the entry identity and its
          state visible. Our fixture explicitly stores that boundary. Writing only a larger changing
          request would require a lookup scheme capable of exposing the smaller stable boundary
          before it could be reused.
        visual_cues:
          - id: published-entry
            phrase: publishes the guide boundary
            targets:
              - publication-entry
            color: green
          - id: stored-boundary
            phrase: entry identity and its state visible
            targets:
              - publication-entry
            color: yellow
        hold: 0.65
      - say: >
          Request three arrives after publication and finds the compatible guide. The stored prefix
          is reused, while its own question proceeds separately. A cold burst can therefore behave
          differently from sequential warm traffic. Test availability and write completion alongside
          the matching rule when measuring a deployment.
        visual_cues:
          - id: warm-arrival
            phrase: Request three arrives after publication
            targets:
              - publication-request
            color: green
          - id: reused-entry
            phrase: stored prefix is reused
            targets:
              - publication-entry
            color: green
        hold: 0.65
  - id: hosted-boundaries
    title: A marker selects work, then a write makes it available
    visual: The guide boundary is physically marked on two compatible request envelopes. Minimum-length,
      completed-entry and TTL gates operate on that exact endpoint, while changing tails remain
      uncached.
    beats:
      - say: "Now put the same guide behind a hosted API. Ask four concrete questions: which endpoint is
          eligible, whether that endpoint was written, whether it remains available, and how usage
          is reported. A marker is a selection instruction. It does not manufacture a cache entry.
          Our earlier publication fixture requires a completed write; a provider defines its own
          readiness point."
        hold: 0.7
        visual_cues:
          - id: host-marker
            phrase: A marker is a selection instruction
            targets:
              - host-marker-mark
            color: cyan
            linger: 0.55
      - say: The current newer OpenAI contract supports explicit-only mode and a breakpoint on eligible
          developer input text. Mark the end of the stable guide on the warmup and subsequent
          requests, leaving changing questions after it. Explicit-only mode with no markers performs
          no cache reads or writes. A selected boundary below the model minimum remains ineligible
          even if an unmarked suffix makes the whole request long enough.
        hold: 0.7
        visual_cues:
          - id: host-endpoint
            phrase: Mark the end of the stable guide
            targets:
              - hosted-boundaries-geometry
            color: cyan
            linger: 0.55
          - id: host-none
            phrase: Explicit-only mode with no markers performs no cache reads or writes
            targets:
              - host-none-mark
            color: cyan
            linger: 0.55
          - id: host-min
            phrase: selected boundary below the model minimum
            targets:
              - host-min-mark
            color: cyan
            linger: 0.55
      - say: The documented newer family currently starts at one thousand and twenty-four visible tokens,
          while earlier-model eligibility and reporting differ. Check the selected model and API
          version. Supported prewarming can write the chosen prefix without generating an answer,
          with a write charge. The newer settings offer thirty-minute or twelve-hour write coverage,
          with documented refresh rules. A thirty-minute read of valid twelve-hour coverage
          preserves the later of its existing expiry and thirty minutes after the read; it does not
          restart twelve hours. The requested lifetime is not a promised deletion deadline. These
          are checked service contracts, not a provider experiment in this film.
        hold: 0.7
        visual_cues:
          - id: host-minimum
            phrase: one thousand and twenty-four visible tokens
            targets:
              - host-minimum-mark
            color: cyan
            linger: 0.55
          - id: host-prewarm
            phrase: Supported prewarming
            targets:
              - host-prewarm-mark
            color: cyan
            linger: 0.55
          - id: host-refresh
            phrase: A thirty-minute read of valid twelve-hour coverage
            targets:
              - host-refresh-mark
            color: cyan
            linger: 0.55
  - id: lookup-window
    title: Count lookup positions from the marked endpoint
    visual: A twenty-position inclusive ruler slides over actual numbered Claude lookup positions. Entry
      fifteen falls out at breakpoint thirty-five; a second explicit marker restores the lookup
      without changing token text.
    beats:
      - say: Claude offers top-level automatic placement and explicit content-block markers. Its cache
          hierarchy follows tools, system, then messages. The minimum depends on model and platform.
          The current lookup window counts twenty eligible positions, including the selected
          breakpoint itself. Consecutive tool-use blocks count as one position, and consecutive
          tool-result blocks count as one, under this contract.
        hold: 0.7
        visual_cues:
          - id: window-twenty
            phrase: twenty eligible positions
            targets:
              - window-twenty-mark
            color: cyan
            linger: 0.55
      - say: "Keep an earlier entry at position fifteen. A breakpoint at thirty-four searches positions
          thirty-four down through fifteen, so the old endpoint is inside the window. Move only the
          breakpoint to thirty-five. It now searches thirty-five through sixteen. Predict the result
          before the ruler moves: the entry at fifteen falls outside. A marker at fifteen supplies a
          direct lookup there, subject to the other eligibility and availability checks."
        hold: 0.7
        visual_cues:
          - id: window-34
            phrase: A breakpoint at thirty-four
            targets:
              - window-34-mark
            color: cyan
            linger: 0.55
          - id: window-35
            phrase: Move only the breakpoint to thirty-five
            targets:
              - lookup-window-geometry
            color: cyan
            linger: 0.55
          - id: window-miss
            phrase: the entry at fifteen falls outside
            targets:
              - lookup-window-geometry
            color: pink
            linger: 0.55
          - id: window-repair
            phrase: A marker at fifteen supplies a direct lookup
            targets:
              - window-repair-mark
            color: green
            linger: 0.55
      - say: The current Claude API has four breakpoint slots, with automatic placement consuming one. A
          concurrent read becomes available after the first response starts, not merely after
          sending its request. Its ordinary cache lifetime is five minutes, with a supported
          one-hour option; reads refresh it. Time is measured from request start, so generation
          consumes part of that interval. Provider and platform isolation scopes also differ. Read
          the actual contract rather than transferring this ruler to every cache. With several
          eligible markers, take the longest compatible available prefix reached; overlapping prefix
          lengths are not added together.
        hold: 0.7
        visual_cues:
          - id: window-slots
            phrase: four breakpoint slots
            targets:
              - window-slots-mark
            color: cyan
            linger: 0.55
          - id: window-ready
            phrase: after the first response starts
            targets:
              - window-ready-mark
            color: cyan
            linger: 0.55
          - id: window-longest
            phrase: take the longest compatible available prefix reached
            targets:
              - window-longest-mark
            color: cyan
            linger: 0.55
  - id: usage-buckets
    title: Conserve the prompt tokens across billing buckets
    visual: The same 2600-token input is partitioned into read 2000, write 400 and ordinary 200. OpenAI
      total and Claude ordinary-input schemas assemble the identical conserved bar.
    beats:
      - say: Build one input ledger with two thousand six hundred tokens. Two thousand are read from cache,
          four hundred are written, and two hundred are processed as ordinary input. These are
          disjoint portions. Their sum must recover the complete prompt. Retain output tokens in a
          separate ledger because generating the answer still costs work.
        hold: 0.7
        visual_cues:
          - id: usage-read
            phrase: Two thousand are read from cache
            targets:
              - usage-read-mark
            color: cyan
            linger: 0.55
          - id: usage-write
            phrase: four hundred are written
            targets:
              - usage-write-mark
            color: cyan
            linger: 0.55
          - id: usage-ordinary
            phrase: two hundred are processed as ordinary input
            targets:
              - usage-ordinary-mark
            color: cyan
            linger: 0.55
      - say: In the current OpenAI Responses usage schema, input tokens is the whole two thousand six
          hundred. Its detail fields supply cached tokens for reads and cache-write tokens for
          writes. Subtract both from the total to recover two hundred ordinary input tokens. A cache
          write is not also a cache read. Other OpenAI API schemas need their own adapter.
        hold: 0.7
        visual_cues:
          - id: usage-subtract
            phrase: "Subtract both from the total to recover two hundred ordinary input tokens"
            targets:
              - usage-subtract-mark
            color: cyan
            linger: 0.55
      - say: Claude uses cache-read input tokens, cache-creation input tokens, and input tokens for the
          ordinary portion. Here those fields are two thousand, four hundred, and two hundred. Add
          all three to recover the same two thousand six hundred. Normalize provider fields into
          read, write, ordinary, and output buckets, preserving route, model, prompt version, and
          request identity before pricing them.
        hold: 0.7
        visual_cues:
          - id: usage-claude
            phrase: "Add all three to recover the same two thousand six hundred"
            targets:
              - usage-claude-mark
            color: cyan
            linger: 0.55
  - id: write-economics
    title: Earn the write premium with actual later reads
    visual: One concrete 6000-token write and repeated full reads build both cold and cached cost
      curves. The break-even inequality appears only after the same tokens have been priced.
    beats:
      - say: "Use an authored price fixture: ordinary input costs one unit per token, a short-lived cache
          write costs one point two five, and a read costs zero point one. These ratios match some
          documented tiers, but actual rates depend on model, platform, lifetime, and billing
          dimensions. Exclude output and other charges so that we can isolate the input decision."
        hold: 0.7
        visual_cues:
          - id: cost-rates
            phrase: ordinary input costs one unit per token
            targets:
              - cost-rates-mark
            color: cyan
            linger: 0.55
      - say: Writing six thousand tokens costs seven thousand five hundred units, compared with six thousand
          uncached. The premium is fifteen hundred. One full later read costs six hundred instead of
          six thousand, saving fifty-four hundred. After one write and one read, cached input costs
          eighty-one hundred versus twelve thousand cold. Without a later read, the premium is a
          loss.
        hold: 0.7
        visual_cues:
          - id: cost-write
            phrase: Writing six thousand tokens costs seven thousand five hundred
            targets:
              - write-economics-geometry
            color: cyan
            linger: 0.55
          - id: cost-read
            phrase: One full later read costs six hundred
            targets:
              - write-economics-geometry
            color: cyan
            linger: 0.55
          - id: cost-total
            phrase: "After one write and one read, cached input costs eighty-one hundred versus twelve thousand cold"
            targets:
              - cost-total-mark
            color: cyan
            linger: 0.55
      - say: For a prefix of N tokens and r complete later reads, cached cost is N times the write rate,
          plus r times N times the read rate. Cold cost is r plus one, multiplied by N and the
          ordinary rate. Break even when r times the ordinary-minus-read rate is at least the
          write-minus-ordinary rate. With ordinary rate one and read rate point one, a write rate of
          two needs two whole later reads. Expiry and eviction can prevent those planned reads.
        hold: 0.7
        visual_cues:
          - id: cost-formula
            phrase: Break even when r times
            targets:
              - cost-formula-mark
            color: cyan
            linger: 0.55
          - id: cost-long
            phrase: a write rate of two needs two whole later reads
            targets:
              - cost-long-mark
            color: cyan
            linger: 0.55
  - id: partial-writes
    title: A hit can still raise the bill
    visual: Four concrete 6000-token requests retain a 1024-token shared front and 4976-token unique
      tails. Every returned read and write bucket is individually priced, then moving the marker
      removes only suffix writes.
    beats:
      - say: Now vary just how much stays stable. Four requests each contain six thousand tokens, but only
          the first one thousand and twenty-four repeat. Assume the entire input is eligible for
          writing, and every changing tail is written. The first request writes six thousand. Each
          later request reads one thousand and twenty-four and writes four thousand nine hundred and
          seventy-six.
        hold: 0.7
        visual_cues:
          - id: partial-rows
            phrase: Four requests each contain six thousand tokens
            targets:
              - partial-writes-geometry
            color: cyan
            linger: 0.55
          - id: partial-share
            phrase: only the first one thousand and twenty-four repeat
            targets:
              - partial-writes-geometry
            color: cyan
            linger: 0.55
      - say: "Price the first row at seven thousand five hundred units. Each later row costs one hundred and
          two point four for its read, plus six thousand two hundred and twenty for its write: six
          thousand three hundred and twenty-two point four. Three such rows plus the first give
          twenty-six thousand four hundred and sixty-seven point two. Four cold inputs cost
          twenty-four thousand. Three reported hits coexist with a ten point three percent
          increase."
        hold: 0.7
        visual_cues:
          - id: partial-first
            phrase: Price the first row at seven thousand five hundred
            targets:
              - partial-writes-geometry
            color: cyan
            linger: 0.55
          - id: partial-read
            phrase: one hundred and two point four for its read
            targets:
              - partial-read-mark
            color: cyan
            linger: 0.55
          - id: partial-write
            phrase: six thousand two hundred and twenty for its write
            targets:
              - partial-write-mark
