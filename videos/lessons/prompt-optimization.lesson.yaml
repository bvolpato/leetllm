version: 1
id: prompt-optimization
title: Which Prompt Should You Ship?
source: training/programmatic-prompt-optimization-dspy/content.md
voice: en-US-AndrewNeural
rate: +0%
sources:
  - title: DSPy paper, Compiling Declarative Language Model Calls into Self-Improving Pipelines
    url: https://arxiv.org/abs/2310.03714
  - title: DSPy optimization guide
    url: https://dspy.ai/learn/optimization/optimizers/
  - title: DSPy signatures guide
    url: https://dspy.ai/learn/programming/signatures/
scenes:
  - id: subject-intro
    title: "Should 2139 earn a point?"
    visual: >-
      Four digits travel from a stamped envelope to the first prompt's answer. The leading zero
      stays on the envelope. The second prompt copies all five digits. Both replies stay in view
      as the grader switches from a numeric comparison to an exact text match.
    beats:
      - say: >-
          Watch the first digit as this ZIP code comes off the envelope. Prompt A returns a number and
          drops the zero. Prompt B copies all five digits. The grader compares each answer with the
          ZIP code as a number. Which prompt gets a point?
        hold: 2.8
        caption_starts: ["Prompt A returns a number", "Prompt B copies all five digits", "The grader compares", "Which prompt gets a point"]
        visual_cues:
          - { id: number-copy, phrase: "drops the zero", targets: [number-answer] }
          - { id: text-copy, phrase: "Prompt B copies all five digits", targets: [text-answer] }
          - { id: numeric-rule, phrase: "compares each answer with the ZIP code as a number", targets: [grading-rule] }
      - say: >-
          Both get a point. As numbers, the two answers are equal. Switch the grader to an exact text
          match. Now only prompt B earns the point. The outputs stayed the same. Changing what earned
          a point changed which prompt won.
        hold: 1.4
        caption_starts: ["Switch the grader", "Now only prompt B earns the point"]
        visual_cues:
          - { id: numeric-tie, phrase: "Both get a point", targets: [scores] }
          - { id: text-rule, phrase: "Switch the grader to an exact text match", targets: [grading-rule] }
          - { id: text-winner, phrase: "Now only prompt B earns the point", targets: [scores] }
  - id: program-parts
    title: "What comes back from the predictor?"
    visual: >-
      The request and evidence occupy the input side of one predictor. A route and a supporting record
      appear in separate response fields. An instruction and an example fill its prompt.
    beats:
      - say: >-
          Now try a deployment question. The engineer asks to deploy payment-service. The record allows a
          rollback of payment-tests. Give the predictor the question and that record. Ask for two fields back,
          a route and a record ID. The reviewed answer is abstain, with an empty ID. The signature declares
          those inputs and outputs.
        hold: 0.8
        visual_cues:
          - { id: signature-fields, phrase: "two fields back", targets: [signature-fields] }
          - { id: signature-gold, phrase: "abstain, with an empty ID", targets: [signature-fields], caption_boundary: true }
      - say: >-
          The module calls the predictor. Its instruction says when to cite a record. A demonstration shows a
          worked answer, like the approved rollback. DSPy can compile a new prompt by changing the instruction
          or the examples. The host still checks the proposed action against its authorization policy.
        hold: 0.9
        visual_cues:
          - { id: show-module, phrase: "module calls the predictor", targets: [module-flow] }
          - { id: show-instruction, phrase: "instruction says when to cite a record", targets: [instruction-field] }
          - { id: show-demonstrations, phrase: "A demonstration shows a worked answer", targets: [demonstration-field] }
          - { id: structured-program, phrase: "host still checks", targets: [compiler-contract] }
  - id: metric
    title: "What earns a point?"
    visual: >-
      The reviewed pair stays pinned above the proposed pair. Swapping just the cited ID makes an
      otherwise correct rollback fail. Restoring the ID fixes it. A deployment replay changes the reviewed
      answer.
    beats:
      - say: >-
          Score the rollback first. Its label calls for serve and record forty-four twelve. The assistant gets
          the route right but cites record ninety-nine ninety-nine. Our grader compares the two fields to the
          reviewed label. How many points should this reply get?
        hold: 2.4
        visual_cues:
          - { id: compare-id, phrase: "cites record ninety-nine ninety-nine", targets: [pairs] }
      - say: >-
          Zero points. The route agrees, but the records differ. Put the approved ID back. The metric awards a point
          only when both fields match. Keep that last reply. Change the question to deployment. The reviewed
          answer changes to abstain with an empty ID. The unsupported deployment scores zero.
        hold: 1.2
        visual_cues:
          - { id: wrong-id, phrase: "Zero points", targets: [metric-score], caption_boundary: true }
          - { id: restore-id, phrase: "Put the approved ID back", targets: [pairs] }
          - { id: both-fields, phrase: "The metric awards a point only when both fields match", targets: [metric-score], caption_boundary: true }
          - { id: deploy-label, phrase: "Change the question to deployment", targets: [pairs] }
          - { id: wrong-action-zero, phrase: "The unsupported deployment scores zero", targets: [metric-score], caption_boundary: true }
      - say: >-
          The assistant cited the same real approval both times. It only supports the rollback.
          If a task allows several valid records, give the grader that approved set. A good grader needs good labels.
        hold: 1.1
        visual_cues:
          - { id: id-only-replay, phrase: "The assistant cited the same real approval both times", targets: [metric-score] }
  - id: data-splits
    title: "Where do the paraphrases belong?"
    visual: >-
      Two training requests share approval-4412. A request with a new ID tries to enter test with the same
      family. The conflict is traced to the original training rows.
    beats:
      - say: >-
          Use training cases to build examples. Use development cases to choose among prompts. Save the test
          for the frozen choice. Here two training requests ask about the same approval in different words.
          They belong to one policy family.
        hold: 0.8
        visual_cues:
          - { id: split-roles, phrase: "development cases to choose among prompts", targets: [split-families] }
      - say: >-
          Look at the new request in the test column. Its request number is different. Its approval number
          already appears in training. How can we keep this test fresh? Group paraphrases of the same policy family together. A
          checker catches matching family IDs. If someone gave two paraphrases different family IDs, the
          metadata check could pass. Inspect the underlying policies too.
        hold: 1
        visual_cues:
          - { id: new-request, phrase: "new request in the test column", targets: [test-copy] }
          - { id: group-policy-family, phrase: "Group paraphrases of the same policy family together", targets: [test-copy], caption_boundary: true }
  - id: local-contract
    title: "Make a copy with two examples"
    visual: >-
      Two labels from training appear in a compiled copy. The original predictor keeps its empty example
      slots.
    beats:
      - say: >-
          The request is a rollback. In this example a local model double proposes a route and a record ID.
          The host checks both against the approval. A field description tells the model what to return.
          Chain of Thought adds a reasoning field. This one says the approval covers the rollback.
          You can check that claim against the record too.
        hold: 0.8
        caption_starts: ["In this example", "The host checks both", "Chain of Thought adds", "This one says", "You can check that claim"]
        visual_cues:
          - { id: local-proof, phrase: "local model double", targets: [local-contract-mechanism] }
          - { id: typed-proposals, phrase: "proposes a route and a record ID", targets: [local-contract-mechanism] }
          - { id: cot-output, phrase: "adds a reasoning field", targets: [local-contract-mechanism] }
      - say: >-
          Start with an empty student. Labeled Few Shot copies training labels straight into a new program.
          The copy gets two demonstrations, one rollback and one abstention. The original student keeps zero.
          This step copies the labels as supplied. It makes no model calls and never scores either example.
          For the next experiment, the teacher can be a copy of the student using its configured model.
        hold: 1
        visual_cues:
          - { id: labeled-slots, phrase: "copies training labels", targets: [local-contract-mechanism] }
          - { id: labeled-compiled, phrase: "two demonstrations", targets: [local-contract-mechanism] }
          - { id: labeled-copy, phrase: "original student keeps zero", targets: [local-contract-mechanism] }
          - { id: teacher-copy, phrase: "a copy of the student", targets: [local-contract-mechanism] }
  - id: bootstrap
    title: "Which teacher reply gets copied?"
    visual: >-
      One local teacher supplies identical answers to two training questions. The first trace is copied
      into a prompt slot. The second misses the same threshold and leaves that slot intact.
    beats:
      - say: >-
          Try another way to fill the example slots. Let a teacher answer the training questions and record
          its steps. On the rollback, it answers serve with the approved record. Both fields match. At a
          threshold of one, this trace passes. The accepted trace can become a few-shot demonstration in the
          compiled program. Look at the copied predictor step. It still names the rollback and its approval.
        hold: 1.2
        visual_cues:
          - { id: teacher-output, phrase: "answers serve with the approved record", targets: [teacher-trace] }
          - { id: binary-threshold, phrase: "At a threshold of one", targets: [trace-score] }
          - { id: accept-trace, phrase: "The accepted trace can become a few-shot demonstration in the compiled program", targets: [bank], caption_boundary: true }
          - { id: copy-trace, phrase: "copied predictor step", targets: [bank] }
      - say: >-
          Now ask the teacher about deploying payment-service. It gives the same reply. The reviewed label is
          abstain with an empty ID. Does the rollback example stay in the prompt?
        hold: 2.2
        visual_cues:
          - { id: second-question, phrase: "deploying payment-service", targets: [teacher-trace] }
          - { id: same-output, phrase: "It gives the same reply", targets: [teacher-trace] }
          - { id: keep-question, phrase: "Does the rollback example stay in the prompt", targets: [bank] }
      - say: >-
          It stays. The deployment scores zero, so its trace is discarded. Two teacher replies left one
          bootstrapped example. The original student still has zero. Now imagine a two-step teacher whose
          final answer is right by chance. Check each recorded step before you teach another predictor to
          repeat it.
        hold: 1.2
        visual_cues:
          - { id: zero-score, phrase: "The deployment scores zero", targets: [trace-score], caption_boundary: true }
          - { id: partial-trace, phrase: "its trace is discarded", targets: [rejected-trace], caption_boundary: true }
          - { id: bank-count, phrase: "one bootstrapped example", targets: [bank] }
  - id: optimizer-families
    title: "What does the teacher’s score cover?"
    visual: >-
      A two-step teacher makes an unsupported claim and then abstains correctly. Its final pair passes
      while the earlier claim stays visible. A separate half-point probe changes only the threshold.
    beats:
      - say: >-
          Look inside a two-step teacher. Its first step says the approval covers deployment. Its final reply
          happens to abstain with an empty ID. A grader that checks just the final pair gives it one. The
          unsupported first step can now enter a demonstration too. Review it against the policy. Collection
          can stop when the example slots fill, even if training cases remain. What if the grader returns a
          fraction? In this version, a zero or missing threshold tests the score’s truth value.
          A partial score of zero point five, a negative number and NaN are truthy.
        hold: 1
        caption_starts: ["What if the grader returns a fraction", "In this version"]
        visual_cues:
          - { id: trace-intermediate, phrase: "first step says the approval covers deployment", targets: [optimizer-families-mechanism] }
          - { id: final-pair, phrase: "gives it one", targets: [optimizer-families-mechanism] }
          - { id: threshold-branch, phrase: "zero or missing threshold", targets: [optimizer-families-mechanism] }
          - { id: truthy-values, phrase: "A partial score of zero point five, a negative number and NaN are truthy", targets: [optimizer-families-mechanism], caption_boundary: true }
      - say: >-
          Now try a separate probe. Give both traces half a point, including the bad deployment. With a zero
          threshold, half a point lets both traces through. Set the threshold to one and neither gets in.
          With no metric at all, a successful execution passes unchecked. Choose a threshold and a
          metric that actually catches the error.
        hold: 1
        visual_cues:
          - { id: half-admit, phrase: "Half a point lets both traces through", targets: [optimizer-families-mechanism] }
          - { id: full-reject, phrase: "neither gets in", targets: [optimizer-families-mechanism] }
          - { id: no-metric, phrase: "a successful execution passes unchecked", targets: [optimizer-families-mechanism] }
      - say: >-
          You can search different parts of this program with the same model weights. Bootstrap Random Search
          tries different subsets of examples. COPRO searches instructions and output prefixes using scores
          from earlier trials. Its trainset argument supplies development cases. MIPRO version two searches
          instructions and examples together across predictors. It proposes instructions from the data and
          uses Optuna’s Tree-structured Parzen Estimator to choose combinations to try.
        hold: 0.9
        visual_cues:
          - { id: search-space, phrase: "same model weights", targets: [optimizer-families-mechanism] }
          - { id: subset-search, phrase: "different subsets of examples", targets: [optimizer-families-mechanism] }
          - { id: copro-search, phrase: "instructions and output prefixes", targets: [optimizer-families-mechanism] }
          - { id: mipro-search, phrase: "instructions and examples together", targets: [optimizer-families-mechanism] }
      - say: >-
          GEPA can use a written critique of a recorded run. To point to the bad step, its metric takes five
          arguments, the label, prediction, trace, predictor name and predictor trace. Adapt our
          three-argument metric to that interface. It can return a scalar, or a score and feedback like “check
          which target the approval names.” The optional program trace serves Flex submodules. The critique
          proposes a new instruction that still needs evaluation.
        hold: 1
        visual_cues:
          - { id: gepa-inputs, phrase: "the label, prediction, trace, predictor name and predictor trace", targets: [optimizer-families-mechanism] }
          - { id: gepa-feedback, phrase: "Adapt our three-argument metric", targets: [optimizer-families-mechanism] }
          - { id: gepa-revision, phrase: "proposes a new instruction", targets: [optimizer-families-mechanism] }
  - id: search-configuration
    title: "Which programs and cases will MIPRO try?"
    visual: >-
      A finite trial budget covers twelve cells of the joint prompt grid. In a ten-case list, two
      wordings of the same approval straddle the default split. The reviewed split moves them together.
    beats:
      - say: >-
          For a manual MIPRO search, turn off the automatic budget, set the number of candidates, and pass the
          trial count when you compile. Leave the trial count out and the local check rejects the plan. The
          proposer and task predictor can share a model or use separate ones. Want to search instructions
          alone? Set both demo limits to zero. Start with a student whose slots are empty. Those limits leave
          existing demos in place. Internal bootstrap examples can still inform the proposals.
        hold: 0.9
        caption_starts: ["Leave the trial count out", "The proposer and task predictor", "Want to search instructions alone", "Set both demo limits to zero", "Those limits leave existing demos in place"]
        visual_cues:
          - { id: manual-budget, phrase: "the local check rejects the plan", targets: [search-configuration-mechanism] }
          - { id: model-roles, phrase: "The proposer and task predictor", targets: [search-configuration-mechanism] }
          - { id: demo-zero, phrase: "Set both demo limits to zero", targets: [search-configuration-mechanism] }
          - { id: demo-controls, phrase: "leave existing demos in place", targets: [search-configuration-mechanism] }
      - say: >-
          Suppose each of two predictors has three instructions to choose from and two possible example sets.
          Pair each instruction with each set. That gives six choices for the first predictor and six for the
          second. Pick a column and a row to make one complete program. Six times six gives thirty-six
          programs. Twelve trials can sample just part of that grid. Each candidate’s score is its average
          across the validation cases.
        hold: 1
        caption_starts: ["Pair each instruction with each set", "That gives six choices", "Pick a column and a row", "Six times six gives", "thirty-six programs", "Twelve trials"]
        visual_cues:
          - { id: candidate-six, phrase: "six choices for the first predictor", targets: [search-configuration-mechanism] }
          - { id: choose-column, phrase: "Pick a column", targets: [search-configuration-mechanism] }
          - { id: choose-row, phrase: "and a row", targets: [search-configuration-mechanism] }
          - { id: choose-cell, phrase: "make one complete program", targets: [search-configuration-mechanism] }
          - { id: candidate-grid, phrase: "thirty-six programs", targets: [search-configuration-mechanism] }
          - { id: candidate-trials, phrase: "Twelve trials", targets: [search-configuration-mechanism] }
      - say: >-
          Give MIPRO ten requests. With no validation set, this version takes roughly the last eighty
          percent of the list, at least one request and at most a thousand. Here the last eight go to
          validation. Read requests two and three. Roll back the tests. Undo the test release. Both use
          the same approval. Move request three into training with its partner and give MIPRO that split.
          Reserve fresh policies for the final test. If a test case helps you edit the prompt, keep that
          case for development.
        hold: 0.9
        caption_starts: ["With no validation set", "Here the last eight", "Read requests two and three", "Both use the same approval", "Move request three", "Reserve fresh policies", "If a test case"]
        visual_cues:
          - { id: split-rule, phrase: "roughly the last eighty percent of the list", targets: [split-list] }
          - { id: default-val, phrase: "Here the last eight go to validation", targets: [split-list] }
          - { id: split-default, phrase: "Read requests two and three", targets: [wordings] }
          - { id: group-wordings, phrase: "Move request three into training with its partner", targets: [split-list, wordings] }
          - { id: fresh-policies, phrase: "Reserve fresh policies for the final test", targets: [test-use] }
          - { id: test-feedback, phrase: "keep that case for development", targets: [test-use] }
  - id: search-budget
    title: "Count the work in one search"
    visual: >-
      Forty full candidate passes and the default baseline contribute distinct executions. Each execution
      expands into two predictors and one judge under the stated assumptions.
    beats:
      - say: >-
          Take a larger plan with forty full trials and fifty validation cases. That’s two thousand logical
          program executions for the candidates. MIPRO also scores the default program first, adding fifty.
          That brings us to two thousand fifty executions. Minibatches and periodic full evaluations would
          change this count.
        hold: 0.9
        caption_starts: ["That’s two thousand logical program executions", "MIPRO also scores", "That brings us to two thousand fifty executions"]
        visual_cues:
          - { id: trial-work, phrase: "two thousand logical program executions", targets: [search-budget-mechanism] }
          - { id: baseline-work, phrase: "adding fifty", targets: [search-budget-mechanism] }
          - { id: logical-budget, phrase: "two thousand fifty executions", targets: [search-budget-mechanism] }
      - say: >-
          What does one execution cost? Suppose it makes two predictor requests and one judge request. With
          one answer per call, no cache hits and no retries, those three calls turn two thousand fifty
          executions into six thousand one hundred fifty requests. Teacher and proposal calls are extra. Keep the executions fixed. One cache hit saves
          one request. If instead one call takes an extra attempt, add one request to the original total.
        hold: 1
        caption_starts: ["six thousand one hundred fifty requests", "Teacher and proposal calls are extra", "One cache hit saves one request", "If instead"]
        visual_cues:
          - { id: three-roles, phrase: "two predictor requests and one judge request", targets: [search-budget-mechanism] }
          - { id: request-expansion, phrase: "those three calls turn two thousand fifty executions into six thousand one hundred fifty requests", targets: [search-budget-mechanism], caption_boundary: true }
          - { id: cache-hit, phrase: "One cache hit saves one request", targets: [search-budget-mechanism] }
          - { id: retry-call, phrase: "add one request to the original total", targets: [search-budget-mechanism] }
      - say: >-
          The host enforces spend and latency caps. A timed-out request may still incur a charge. Reconcile
          its outcome. Suppose longer demonstrations add tokens to every request.
          Adding two thousand five hundred logical input tokens at one hundred requests per second gives
          two hundred fifty thousand extra logical input tokens per second. To price it, measure actual input and output usage by role, including cached input, and use
          the applicable rates. Measure first-token latency on the serving system.
        hold: 0.9
        visual_cues:
          - { id: host-caps, phrase: "spend and latency caps", targets: [search-budget-mechanism] }
          - { id: logical-token-rate, phrase: "Adding two thousand five hundred logical input tokens at one hundred requests per second gives two hundred fifty thousand extra logical input tokens per second", targets: [search-budget-mechanism], caption_boundary: true }
          - { id: cost-boundary, phrase: "measure actual input and output usage", targets: [search-budget-mechanism] }
  - id: engine-requests
    title: "How many engine calls returned the answers?"
    visual: >-
      A local engine receives one prompt and returns two answers in sequence. Its call counter advances
      once per answer.
    beats:
      - say: >-
          One more setting changes the request count. DSPy three point four point zero prefers its native
          engine, L M fifteen, for supported requests. For eligible compatibility cases it selects Lite L L M
          before inference. An authentication error, timeout or provider failure leaves the selected backend
          in place. Record which engine handled the call.
        hold: 0.9
        visual_cues:
          - { id: engine-auto, phrase: "prefers its native engine", targets: [engine-requests-mechanism] }
          - { id: engine-selection, phrase: "before inference", targets: [engine-requests-mechanism] }
          - { id: engine-failures, phrase: "leaves the selected backend in place", targets: [engine-requests-mechanism] }
      - say: >-
          Ask the article’s local engine for two answers to one prompt with caching off. It makes the first
          call and returns answer one. Then it makes the second call and returns answer two. That’s two
          sequential engine calls for one logical prompt. The pinned native and custom-engine paths work this
          way. Lite L L M can use a backend’s own multi-answer operation. A provider bill requires that
          backend’s usage records.
        hold: 0.8
        visual_cues:
          - { id: one-prompt, phrase: "two answers to one prompt", targets: [engine-requests-mechanism] }
          - { id: native-call-one, phrase: "returns answer one", targets: [engine-requests-mechanism] }
          - { id: native-call-two, phrase: "returns answer two", targets: [engine-requests-mechanism] }
          - { id: native-n, phrase: "two sequential engine calls", targets: [engine-requests-mechanism] }
      - say: >-
          To repeat the comparison, keep the seed, dependencies, model revision, generation settings and cache
          policy with the data and scorer versions. Record repeated trials. Temperature zero still leaves the
          backend free to change, and a cached answer may come from an earlier run. Match the effective model
          and engine to the artifact you evaluated.
        hold: 0.9
        visual_cues:
          - { id: engine-provenance, phrase: "seed, dependencies, model revision", targets: [engine-requests-mechanism] }
          - { id: temp-not-proof, phrase: "Temperature zero", targets: [engine-requests-mechanism] }
          - { id: run-lineage, phrase: "effective model and engine", targets: [engine-requests-mechanism] }
  - id: fresh-budget
    title: "Would this search fit the request cap?"
    visual: >-
      A worksheet keeps the number of trials, baseline, cases, calls per execution and fixed overhead next
      to a 650-request cap. Removing one trial changes only trial work.
    beats:
      - say: >-
          Here’s a smaller plan. Run eight full trials and one baseline over twenty-four cases each. Every
          execution makes two predictor calls and one judge call. Assume one answer per call, no cache hits
          and no retries. Allow twelve teacher requests and nine proposal requests for the whole search. The
          host allows six hundred fifty requests. Would you start?
        hold: 3.4
        visual_cues:
          - { id: fresh-roles, phrase: "two predictor calls and one judge call", targets: [worksheet] }
          - { id: fresh-overhead, phrase: "twelve teacher requests and nine proposal requests", targets: [overhead] }
          - { id: fresh-predict, phrase: "Would you start", targets: [cap] }
      - say: >-
          Nine runs through twenty-four cases make two hundred sixteen executions. Three calls each give six
          hundred forty-eight requests. Add the teacher and proposer and the total reaches six hundred
          sixty-nine. The plan exceeds the six hundred fifty request cap by nineteen before it starts.
        hold: 1.2
        visual_cues:
          - { id: fresh-executions, phrase: "two hundred sixteen executions", targets: [worksheet], caption_boundary: true }
          - { id: fresh-role-product, phrase: "six hundred forty-eight requests", targets: [worksheet], caption_boundary: true }
          - { id: fresh-cap, phrase: "six hundred sixty-nine", targets: [cap], caption_boundary: true }
          - { id: fresh-reject, phrase: "The plan exceeds the six hundred fifty request cap by nineteen before it starts", targets: [cap], caption_boundary: true }
      - say: >-
          Try seven trials instead. Keep the baseline and the same overhead. One fewer pass saves seventy-two
          requests. The revised plan needs five hundred ninety-seven. It fits. That buys a smaller search. You
          still have to establish which prompt it chose and how that prompt behaves.
        hold: 1.1
        visual_cues:
          - { id: cut-trial, phrase: "Try seven trials instead", targets: [worksheet] }
          - { id: saved-requests, phrase: "saves seventy-two requests", targets: [worksheet], caption_boundary: true }
          - { id: admit-plan, phrase: "needs five hundred ninety-seven", targets: [cap], caption_boundary: true }
  - id: search
    title: "Replay the request with a different instruction"
    visual: >-
      A fixed request and approval sit over an editable instruction. The baseline reply is scored, the
      instruction is replaced, and the revised reply fills the same fields. Aggregate development results
      appear separately.
    beats:
      - say: >-
          Return to the deployment request. The baseline instruction says to find an approval and give its ID.
          It serves with the rollback record. The exact action-and-record metric scores zero. Change just the
          instruction. Tell the predictor to match both action and target and to abstain if either lacks support.
          With the same inputs, which route and record should it return?
        hold: 2.5
        caption_starts: ["Change just the instruction", "With the same inputs"]
        visual_cues:
          - { id: baseline-case, phrase: "It serves with the rollback record", targets: [reply] }
          - { id: baseline-zero, phrase: "The exact action-and-record metric scores zero", targets: [score], caption_boundary: true }
          - { id: revise-instruction, phrase: "match both action and target", targets: [instruction] }
      - say: >-
          Candidate B abstains with no record and earns one point.
        hold: 1.2
        visual_cues:
          - { id: revised-abstain, phrase: "Candidate B abstains with no record", targets: [reply], caption_boundary: true }
          - { id: revised-one, phrase: "and earns one point", targets: [score], caption_boundary: true }
      - say: >-
          Now compare two prompts across twenty development cases. Both use the same model weights.
          The baseline gets fourteen right. Compiled A gets nineteen. Which prompt would you freeze for the test?
        hold: 2.6
        caption_starts: ["The baseline gets fourteen right", "Compiled A gets nineteen", "Which prompt would you freeze"]
        visual_cues:
          - { id: development-sample, phrase: "Now compare two prompts", targets: [counts] }
          - { id: baseline-count, phrase: "The baseline gets fourteen right", targets: [counts] }
          - { id: development-counts, phrase: "Compiled A gets nineteen", targets: [counts] }
      - say: >-
          Freeze Compiled A. It got five more cases right.
        hold: 1.2
        visual_cues:
          - { id: select-program, phrase: "Freeze Compiled A", targets: [selection] }
  - id: sealed-test
    title: "Does the lead hold up?"
    visual: >-
      The development tallies stay above a covered pair of test tallies on the same twenty-case scale.
      Each new count appears as the narrator finishes naming it. The frozen choice stays marked.
    beats:
      - say: >-
          Keep that choice fixed. Both prompts now face twenty cases the search never saw.
          Does Compiled A keep its lead?
        hold: 2.4
        visual_cues:
          - { id: frozen-winner, phrase: "Keep that choice fixed", targets: [counts] }
      - say: >-
          The baseline gets sixteen right. Compiled A gets thirteen. Its five-case lead on development
          has become a three-case deficit on test.
        hold: 1.4
        caption_starts: ["Compiled A gets thirteen", "Its five-case lead"]
        visual_cues:
          - { id: open-baseline, phrase: "The baseline gets sixteen right", targets: [test-counts] }
          - { id: open-heldout, phrase: "Compiled A gets thirteen", targets: [test-counts] }
          - { id: reversed-order, phrase: "a three-case deficit on test", targets: [test-counts] }
        motion_check: { region: [100, 640, 1680, 290], minimumChangedFraction: 0.002 }
      - say: >-
          To investigate, line up both answers for each request. Check the labels, compare policy families,
          and estimate uncertainty on the paired results. A small sample or a different mix of policies could
          change the order. If you edit the prompt after seeing these cases, save a fresh test for the next
          frozen prompt.
        hold: 1
        visual_cues:
          - { id: inspect-reversal, phrase: "line up both answers for each request", targets: [test-counts] }
  - id: artifact
    title: "Which model answers after reload?"
    visual: >-
      The saved attachment and global default occupy separate fields. The predictor keeps its attached
      model when the context changes. Explicit binding updates that same field.
    beats:
      - say: >-
          Return to the copy with two labeled examples. Save its prompt with model A attached. Load it into
          the same program class. Now set the global default to model B. Which model would this predictor
          call?
        hold: 2.5
        visual_cues:
          - { id: save-program, phrase: "model A attached", targets: [attachment] }
          - { id: inspect-attached, phrase: "set the global default to model B", targets: [context] }
      - say: >-
          Model A. The predictor already has its own attachment. Bind the intended runtime model explicitly.
          Here that's model B. Now the
          predictor reports B. Keep the prompt fixed and evaluate that exact combination before serving it.
        hold: 1.2
        visual_cues:
          - { id: attached-answer, phrase: "Model A", targets: [effective], caption_boundary: true }
          - { id: bind-runtime, phrase: "Bind the intended runtime model explicitly", targets: [attachment], caption_boundary: true }
          - { id: bound-answer, phrase: "the predictor reports B", targets: [effective], caption_boundary: true }
  - id: artifact-safety
    title: "What survived the save?"
    visual: >-
      The two demonstrations and model settings return from JSON. A missing top-level key and a surviving
      nested header receive separate inspection before the artifact can be shared.
    beats:
      - say: >-
          Look inside that same JSON file. It stores the instruction, demonstrations, signature metadata and
          model settings. The actual serialization fixture restores two demonstrations and its attached model A.
          Both examples travel with the file. Set the global default to B and the attachment stays A.
          Explicitly call set L M with the intended runtime model. Now the loaded copy uses B.
          What else made it into the file?
        hold: 1.4
        visual_cues:
          - { id: json-restore, phrase: "The actual serialization fixture restores two demonstrations and its attached model A", targets: [artifact-safety-mechanism], caption_boundary: true }
          - { id: set-runtime, phrase: "Explicitly call set L M with the intended runtime model", targets: [artifact-safety-mechanism], caption_boundary: true }
      - say: >-
          The pinned serializer omits the top-level API key. Open the nested configuration. The same serializer
          preserves the fixture’s nested Authorization header string. Read the demonstrations and instructions too. They can contain
          sensitive text. Inspect and sanitize the whole saved state before sharing it, then evaluate the
          approved copy.
        hold: 1
        visual_cues:
          - { id: api-key-omitted, phrase: "The pinned serializer omits the top-level API key", targets: [artifact-safety-mechanism], caption_boundary: true }
          - { id: artifact-content, phrase: "The same serializer preserves the fixture’s nested Authorization header string", targets: [artifact-safety-mechanism], caption_boundary: true }
          - { id: full-inspection, phrase: "Inspect and sanitize the whole saved state", targets: [artifact-safety-mechanism] }
      - say: >-
          Whole-program files use cloudpickle. An untrusted pickle can execute code when loaded. State-only
          JSON needs compatible reviewed code, dependencies and configuration. Keep the code and artifact
          digests with the effective model and engine, data and scorer versions, evaluation evidence and a
          checked rollback target. A digest identifies the bytes. Record approval separately and retain the
          approved files.
        hold: 1
        visual_cues:
          - { id: pickle-load, phrase: "execute code when loaded", targets: [artifact-safety-mechanism] }
          - { id: release-evidence, phrase: "code and artifact digests", targets: [artifact-safety-mechanism] }
          - { id: release-binding, phrase: "checked rollback target", targets: [artifact-safety-mechanism] }
  - id: release-decision
    title: "Would you release this prompt?"
    visual: >-
      A fresh approval permits a deployment to billing-canary. The requested action matches, but the
      target is billing-service. The proposed reply becomes one of two forbidden serves in a separate
      eighty-case safety sample.
    beats:
      - say: >-
          This approval permits deploying billing-canary. The engineer asks to deploy billing-service.
          You’re testing the frozen prompt on its intended model. Which route and record should it return?
        hold: 2.8
        caption_starts: ["The engineer asks", "You’re testing the frozen prompt", "Which route and record"]
        visual_cues:
          - { id: new-policy, phrase: "deploying billing-canary", targets: [approval-record] }
          - { id: new-target, phrase: "deploy billing-service", targets: [requested-action] }
          - { id: ask-pair, phrase: "Which route and record", targets: [approval-record, requested-action] }
      - say: >-
          Abstain, with an empty ID. The target changed. The candidate served and cited the canary
          approval. Count that reply as one forbidden serve.
        hold: 1.1
        visual_cues:
          - { id: new-gold, phrase: "Abstain, with an empty ID", targets: [reviewed-pair], caption_boundary: true }
          - { id: actual-serve, phrase: "the candidate served and cited the canary approval", targets: [candidate-pair], caption_boundary: true }
          - { id: first-error, phrase: "one forbidden serve", targets: [candidate-pair] }
      - say: >-
          That reply is part of a separate safety sample. All eighty requests in it should get an abstention.
          The candidate served twice, including the case you just saw. Its mean score improved on development.
          The release rule allows forbidden serves on at most one percent of these requests. Ship or hold?
        hold: 3.2
        caption_starts: ["All eighty requests", "The candidate served twice", "Its mean score improved", "The release rule", "Ship or hold"]
        visual_cues:
          - { id: relevant-sample, phrase: "All eighty requests", targets: [slice, errors] }
          - { id: two-failures, phrase: "served twice", targets: [slice, errors] }
          - { id: development-mean, phrase: "Its mean score improved on development", targets: [rate] }
          - { id: release-cap, phrase: "at most one percent", targets: [limit] }
          - { id: ship-or-hold, phrase: "Ship or hold", targets: [limit] }
      - say: >-
          Two out of eighty is two and a half percent. Hold this release. Inspect those two replies
          against their approvals. If you revise the prompt, freeze it with its model and test on fresh cases.
        hold: 1.5
        caption_starts: ["two and a half percent", "Inspect those two replies", "If you revise the prompt"]
        visual_cues:
          - { id: observed-rate, phrase: "Two out of eighty is two and a half percent", targets: [rate], caption_boundary: true }
          - { id: release-result, phrase: "Hold this release", targets: [limit], caption_boundary: true }
          - { id: review-errors, phrase: "Inspect those two replies", targets: [errors] }
