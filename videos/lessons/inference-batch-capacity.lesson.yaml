  - id: pages
    title: Where does the next block start?
    visual: >-
      Keep each request’s last two blocks visible. Fill A to its six empty tail slots, bring B exactly to
      the boundary, then track C past B's endpoint into a new 16-position block.
    beats:
      - say: >-
          Now the server hands out cache in blocks of sixteen positions. For these three patch requests,
          reserve five hundred twelve output positions apiece. A brings four thousand ninety prompt
          positions. Add the answer allowance and fill the last two blocks. Those six empty slots at the end
          belong to A. Another request needs its own block.
        hold: 0.65
        visual_cues:
          - id: ic-pages-a
            phrase: fill the last two blocks
            targets: [page-a]
            color: cyan
            linger: 0.22
          - id: ic-pages-padding
            phrase: six empty slots
            targets: [page-a]
            color: yellow
            linger: 0.22
      - say: >-
          B starts with six more prompt positions than A. Its reservation fills the last block exactly. C
          brings just four more prompt positions than B. Before we place those four, how many more slots will
          the allocator have to set aside for C than for B?
        hold: 2.1
        visual_cues:
          - id: ic-pages-b
            phrase: fills the last block exactly
            targets: [page-b]
            color: cyan
            linger: 0.22
          - id: ic-pages-predict
            phrase: four more prompt positions than B
            targets: [page-c]
            color: yellow
            linger: 0.22
      - say: >-
          Place the four positions. They open a whole block. C reserves sixteen more slots than B and leaves
          twelve of them unused. Add A's six and there are eighteen empty slots across the three
          reservations. Round each request up first, then add the blocks. Check and claim them in the same
          operation so two arrivals can't both spend the last block.
        hold: 0.65
        caption_starts:
          - They open a whole block
          - C reserves sixteen more slots
        visual_cues:
          - id: ic-pages-cross
            phrase: Place the four positions
            targets: [page-c]
            color: yellow
            linger: 0.22
          - id: ic-pages-round
            phrase: sixteen more slots than B
            targets: [page-c]
            color: cyan
            linger: 0.22
          - id: ic-pages-sum
            phrase: eighteen empty slots
            targets: [page-total]
            color: yellow
            linger: 0.22
  - id: live-page-ownership
    title: Move logical histories through physical page identities
    visual: Keep A0/A1,B0–B4,C0–C2,D0; map their11 live blocks into nonadjacent slots of15,
      contrasting32 reserved slab slots without shrinking the payload.
    beats:
      - say: Paging changes where live state is allocated. Give A two live blocks, B five, C three and D
          one. Four maximum-length slabs of eight blocks reserve thirty-two slots for eleven live
          blocks, leaving twenty-one unused. A separate fifteen-block paged pool stores the same
          eleven live blocks with four free. A logical block table can map A zero and A one to
          physically separated slots without changing their sequence order.
        visual_cues:
          - id: ic-live-page-ownership-slabs
            phrase: Four maximum-length slabs of eight blocks reserve thirty-two slots for eleven live blocks,
              leaving twenty-one unused.
            targets:
              - live-page-ownership-mechanism
            color: cyan
            linger: 0.45
          - id: ic-live-page-ownership-pages
            phrase: A separate fifteen-block paged pool stores the same eleven live blocks with four free.
            targets:
              - live-page-ownership-mechanism
            color: cyan
            linger: 0.45
          - id: ic-live-page-ownership-map
            phrase: A logical block table can map A zero and A one to physically separated slots without
              changing their sequence order.
            targets:
              - live-page-ownership-mechanism
            color: cyan
            linger: 0.45
      - say: "A sixteen-position page still stores the same live keys and values. Its last partially
          occupied page can waste at most fifteen slots. With only one live position, fifteen of
          sixteen allocated slots are empty: ninety-three point seven five percent. Long histories spread
          the empty slots of the last page across many full pages."
        visual_cues:
          - id: ic-live-page-ownership-fragment
            phrase: "With only one live position, fifteen of sixteen allocated slots are empty: ninety-three
              point seven five percent."
            targets:
              - live-page-ownership-mechanism
            color: cyan
            linger: 0.45
      - say: After an exclusively owned block loses its last active reader, it may be reused. Shared
          references and cached blocks need their own release and eviction rules. When A finishes, B still
          needs their shared block. Capacity accounting must distinguish
          physical allocation, active references and reusable cache entries. When arrivals exceed
          sustainable service, requests wait, expire, are rejected, or are preempted according to
          policy.
