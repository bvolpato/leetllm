scenes:
  - id: intro
    title: Can this patch request start?
    visual: Compare the prompt with the last free half gibibyte on the cache ruler. Add the answer allowance, then release a neighboring conversation and try the whole reservation again.
    beats:
      - say: >-
          This patch prompt needs half a gibibyte of cache. There's half a gibibyte free. Slide the prompt
          into the gap. Its keys and values fit exactly.
        visual_cues:
          - id: ic-intro-free
            phrase: There's half a gibibyte free
            targets: [pool-edge]
            color: green
          - id: ic-intro-prompt
            phrase: Slide the prompt into the gap
            targets: [patch-footprint]
            color: cyan
        hold: 0.65
      - say: >-
          Before it starts, the server promises room for up to a thousand twenty-four answer tokens. Can
          this request start?
        visual_cues:
          - id: ic-intro-promise
            phrase: up to a thousand twenty-four answer tokens
            targets: [patch-terms]
            color: yellow
        hold: 2.2
      - say: >-
          Add the answer allowance. It sticks out by an eighth of a gibibyte. The request waits. Now
          another conversation finishes and releases its half gibibyte. Slide the whole reservation into
          the space. The prompt and its answer allowance both fit.
        caption_starts:
          - It sticks out
          - The request waits
          - Now another conversation finishes
          - The prompt and its answer allowance both fit
        visual_cues:
          - id: ic-intro-reserve
            phrase: Add the answer allowance
            targets: [answer-block]
            color: yellow
          - id: ic-intro-excess
            phrase: an eighth of a gibibyte
            targets: [answer-block]
            color: yellow
          - id: ic-intro-queue
            phrase: The request waits
            targets: [answer-block]
            color: pink
          - id: ic-intro-release
            phrase: releases its half gibibyte
            targets: [pool-edge]
            color: green
          - id: ic-intro-retry
            phrase: Slide the whole reservation into the space
            targets: [patch-footprint, answer-block]
            color: cyan
          - id: ic-intro-admit
            phrase: The prompt and its answer allowance both fit
            targets: [patch-footprint, answer-block]
            color: green
        hold: 1
  - id: phase-roofline
    title: What limits the next token?
    visual: Retain one weight tensor while prompt rows reuse it; construct FLOPs and bytes, then a
      bandwidth and compute roof with a clearly separate published H100 reference.
    beats:
      - say: Prefill processes known prompt positions together, reusing weights across many rows. Ordinary
          decode adds one position per request per step. First-token delay includes queueing, prompt
          work and delivery. Later token gaps are inter-token latency. For at least two output
          tokens, time per output token averages first-to-last elapsed time over the remaining token
          count; it can hide a long individual gap.
        visual_cues:
          - id: ic-phase-roofline-prefill
            phrase: Prefill processes known prompt positions together, reusing weights across many rows.
            targets:
              - phase-roofline-mechanism
            color: cyan
            linger: 0.45
          - id: ic-phase-roofline-decode
            phrase: Ordinary decode adds one position per request per step.
            targets:
              - phase-roofline-mechanism
            color: cyan
            linger: 0.45
          - id: ic-phase-roofline-latency
            phrase: First-token delay includes queueing, prompt work and delivery.
            targets:
              - phase-roofline-mechanism
            color: cyan
            linger: 0.45
      - say: For a dense model with P parameters, approximate parameter-dependent linear work as two times P
          times active batch B. A multiply-add counts twice. A full weight read costs P times the
          bytes per parameter. Dividing gives two B divided by bytes per parameter, or roughly B
          FLOPs per byte for sixteen-bit weights. This omits attention work and other traffic. The
          roofline takes the lower of a compatible compute peak and bandwidth times intensity.
        visual_cues:
          - id: ic-phase-roofline-intensity
            phrase: Dividing gives two B divided by bytes per parameter, or roughly B FLOPs per byte for
              sixteen-bit weights.
            targets:
              - phase-roofline-mechanism
            color: cyan
            linger: 0.45
          - id: ic-phase-roofline-roof
            phrase: The roofline takes the lower of a compatible compute peak and bandwidth times intensity.
            targets:
              - phase-roofline-mechanism
            color: cyan
            linger: 0.45
      - say: "The H one hundred SXM specifications list three point three five terabytes per second and
          one thousand nine hundred seventy-nine teraFLOPs with sparsity for sixteen-bit Tensor
          Cores. Halve the latter for dense work: nine hundred eighty-nine point five. Compute
          divided by bandwidth gives a ridge near two hundred ninety-five point four FLOPs per byte.
          At intensity one, the lower roof is three point three five teraFLOPs. That's about a third of one
          percent of the dense compute peak. At this point, moving the weights sets the pace. An
          approximate sixteen-decimal-gigabyte weight read alone gives two hundred nine point four
          single-token steps per second at that peak bandwidth."
        visual_cues:
          - id: ic-phase-roofline-dense
            phrase: "Halve the latter for dense work: nine hundred eighty-nine point five."
            targets:
              - phase-roofline-mechanism
            color: cyan
            linger: 0.45
          - id: ic-phase-roofline-ridge
            phrase: Compute divided by bandwidth gives a ridge near two hundred ninety-five point four FLOPs per
              byte.
            targets:
              - phase-roofline-mechanism
            color: cyan
            linger: 0.45
          - id: ic-phase-roofline-lower
            phrase: At intensity one, the lower roof is three point three five teraFLOPs.
            targets:
              - phase-roofline-mechanism
            color: cyan
            linger: 0.45
          - id: ic-phase-roofline-steps
            phrase: An approximate sixteen-decimal-gigabyte weight read alone gives two hundred nine point four
              single-token steps per second at that peak bandwidth.
            targets:
              - phase-roofline-mechanism
            color: cyan
            linger: 0.45
  - id: one-token
    title: Count the bytes attached to each position
    visual: Keys and values, layers, KV heads, head width and value precision build the actual
      bytes-per-token formula, followed by a context-length payload calculation.
    beats:
      - say: >
          Full-attention layers retain a key and a value for each consumed token position. The
          payload multiplies two arrays by the number of layers, KV heads, head width, and bytes per
          element. Those dimensions come from the checkpoint and the cache representation being
          used.
        visual_cues:
          - id: kv-factors
            phrase: two arrays by the number of layers, KV heads, head width, and bytes
            targets:
              - one-token-readout
            color: blue
          - id: checkpoint-dimensions
            phrase: dimensions come from the checkpoint
            targets:
              - one-token-readout-2
            color: yellow
          - id: ic-one-token-arrays
            phrase: Full-attention layers retain a key and a value for each consumed token position.
            targets:
              - one-token-mechanism
            color: cyan
            linger: 0.45
        hold: 0.65
      - say: Our architecture uses thirty-two layers, eight KV heads, width one hundred twenty-eight, and
          two bytes per value. Together the two arrays require one hundred twenty-eight kibibytes
          per retained position. Multiply by four thousand ninety-six positions and the cache
          reaches half a gibibyte.
        visual_cues:
          - id: token-payload
            phrase: one hundred twenty-eight kibibytes
            targets:
              - one-token-equation
            color: yellow
          - id: history-payload
            phrase: Multiply by four thousand ninety-six positions and the cache reaches half a gibibyte.
            targets:
              - one-token-equation-2
            color: green
          - id: ic-one-token-factors
            phrase: Our architecture uses thirty-two layers, eight KV heads, width one hundred twenty-eight, and
              two bytes per value.
            targets:
              - one-token-mechanism
            color: cyan
            linger: 0.45
          - id: ic-one-token-payload
            phrase: Together the two arrays require one hundred twenty-eight kibibytes per retained position.
            targets:
              - one-token-mechanism
            color: cyan
            linger: 0.45
        hold: 0.7
      - say: >
          Concurrent independent histories add their payloads. Shared prefixes, local attention
          layers, recurrent state, quantization scales, and sharding require additional accounting.
          For the initial replica calculation we keep equal, unshared full-attention histories so
          that the effect of batch size stays easy to follow.
        visual_cues:
          - id: independent-payloads
            phrase: independent histories add their payloads
            targets:
              - one-token-equation-2
            color: green
          - id: stored-geometry
            phrase: equal, unshared full-attention histories
            targets:
              - one-token-readout
            color: blue
        hold: 0.6
  - id: architecture-residency
    title: How many histories fit in one pool?
    visual: >-
      Compare the 8B and 70B cache geometries. Follow one Llama 3.1 8B history through five lengths. On a
      fixed pool ruler, equal copies get wider and the count drops. Try a fourth 128K copy against the
      remaining space.
    beats:
      - say: >-
          The history we just built uses the dimensions of Llama three eight B. Move to the
          seventy-billion-parameter model and the layer stack grows from thirty-two to eighty. Keep eight key
          and value heads, width one hundred twenty-eight, and two bytes per value. Each position now costs
          three hundred twenty kibibytes. At eight thousand one hundred ninety-two positions, one history
          takes two and a half gibibytes. Give sixty-four people a history that size and their caches alone
          need a hundred sixty gibibytes. They already exceed an eighty-gigabyte device before you load any
          weights.
        hold: 0.65
        visual_cues:
          - id: ic-architecture-residency-geometry
            phrase: the layer stack grows from thirty-two to eighty
            targets: [architecture-residency-mechanism]
            color: blue
            linger: 0.22
          - id: ic-architecture-residency-request
            phrase: one history takes two and a half gibibytes
            targets: [architecture-residency-mechanism]
            color: cyan
            linger: 0.22
          - id: ic-architecture-residency-many
            phrase: their caches alone need a hundred sixty gibibytes
            targets: [architecture-residency-mechanism]
            color: pink
            linger: 0.22
      - say: >-
          Come back to the smaller model. For this comparison use Llama three point one, which supports the
          long histories we're about to try. The original Llama three stopped at eight thousand one hundred
          ninety-two positions. Set aside a fixed pool of about fifty-one point six gibibytes. Take one short
          history and fill the pool with independent copies of that size. Now make that one history four
          times as long. Each copy needs four times the room. The same pool that held over a hundred short
          conversations now has room for just twenty-five of these.
        hold: 0.8
        visual_cues:
          - id: ic-architecture-residency-context
            phrase: The original Llama three stopped at eight thousand one hundred ninety-two positions
            targets: [history-size]
            color: blue
            linger: 0.22
          - id: ic-architecture-residency-capacity
            phrase: fill the pool with independent copies of that size
            targets: [pool-comparison]
            color: green
            linger: 0.22
          - id: ic-architecture-residency-sixteen
            phrase: make that one history four times as long
            targets: [pool-comparison]
            color: cyan
            linger: 0.22
      - say: >-
          Double the history again. Two of the previous histories would fill the space this one takes. Twelve
          whole requests fit, and the rest of the pool is too small for a thirteenth. Double it once more.
          Six people can now hold a history this long at the same time.
        hold: 0.9
        visual_cues:
          - id: ic-architecture-residency-thirty-two
            phrase: Double the history again
            targets: [pool-comparison]
            color: cyan
            linger: 0.22
          - id: ic-architecture-residency-sixty-four
            phrase: Double it once more
            targets: [pool-comparison]
            color: cyan
            linger: 0.22
      - say: >-
          Extend the same history to the checkpoint's limit. Each conversation now takes sixteen gibibytes.
          Three are already in the pool. Another developer arrives with an equally long history. There's
          still some space free. Can the fourth one join them?
        hold: 2.2
        visual_cues:
          - id: ic-architecture-residency-longest
            phrase: Extend the same history to the checkpoint's limit
            targets: [pool-comparison]
            color: cyan
            linger: 0.22
          - id: ic-architecture-residency-arrives
            phrase: Another developer arrives
            targets: [next-history]
            color: yellow
            linger: 0.22
      - say: >-
          Put the fourth history against the free end. It needs sixteen gibibytes and there's only about
          three point six left. Leave it in the queue. That's what rounding down means here. Divide the pool
          by the bytes for one complete history and keep the whole requests. This counts the history people
          have now. Their answers may still grow. Changing the number of key and value heads would mean
          choosing a different model architecture, such as grouped-query or multi-query attention.
        hold: 0.65
        caption_starts:
          - It needs sixteen gibibytes
          - Leave it in the queue
        visual_cues:
          - id: ic-architecture-residency-fourth
            phrase: Put the fourth history against the free end
            targets: [next-history]
            color: yellow
            linger: 0.22
          - id: ic-architecture-residency-wait
            phrase: Leave it in the queue
            targets: [next-history]
            color: pink
            linger: 0.22
  - id: partition
    title: Subtract weights and runtime before sizing the pool
    visual: A thirty-two GiB authored memory bar first charges twelve GiB of weights, then four GiB of
      runtime reserve, leaving sixteen GiB for a KV pool.
    beats:
      - say: >
          Begin with the available device budget. Our replica has thirty-two gibibytes. Loading its
          weight allocation consumes the blue region. This memory is shared across the active batch,
          so adding another conversation will not load another complete copy of those weights.
        visual_cues:
          - id: device-weights
            phrase: weight allocation consumes the blue region
            targets:
              - memory-partition
            color: blue
          - id: shared-allocation
            phrase: shared across the active batch
            targets:
              - partition-readout
            color: blue
        hold: 0.65
      - say: >
          Set aside a runtime allowance before promising space to requests. Activations, kernel
          workspace, captured graphs, and other allocations can peak under load. The four-gibibyte
          region protects this part of our budget. Measure the peak under the batch shapes and
          kernels you plan to serve.
        visual_cues:
          - id: runtime-reserve
            phrase: four-gibibyte region
            targets:
              - memory-partition
            color: yellow
          - id: runtime-peaks
            phrase: Measure the peak
            targets:
              - partition-readout
            color: yellow
        hold: 0.65
      - say: >
          The remaining half of this device becomes the KV pool. Its storage can be preallocated
          even when few blocks have owners. Keep resident pool bytes separate from current block
          ownership. The next calculation divides this available request-state budget rather than
          the GPU's total advertised memory.
        visual_cues:
          - id: kv-pool
            phrase: remaining half of this device becomes the KV pool
            targets:
              - memory-partition
            color: green
          - id: available-state-budget
            phrase: available request-state budget
            targets:
              - partition-equation
            color: yellow
        hold: 0.65
  - id: decimal-budget
    title: Turn a nominal device label into an explicit byte budget
    visual: Construct an independent80,000,000,000-byte reference budget, convert each term toGiB and
      place103 current versus91 growth-reserved histories into the remainder.
    beats:
      - say: Now size a GPU with eighty billion available bytes. A decimal gigabyte is one billion bytes; a gibibyte is two
          to the thirtieth. The total is seventy-four point five zero six gibibytes. Approximate
          eight B sixteen-bit weights take sixteen billion bytes, or fourteen point nine zero one
          gibibytes. Subtract an assumed eight gibibytes of workspace, runtime and headroom.
        visual_cues:
          - id: ic-decimal-budget-total
            phrase: The total is seventy-four point five zero six gibibytes.
            targets:
              - decimal-budget-mechanism
            color: cyan
            linger: 0.45
          - id: ic-decimal-budget-weights
            phrase: Approximate eight B sixteen-bit weights take sixteen billion bytes, or fourteen point nine
              zero one gibibytes.
            targets:
              - decimal-budget-mechanism
            color: cyan
            linger: 0.45
          - id: ic-decimal-budget-runtime
            phrase: Subtract an assumed eight gibibytes of workspace, runtime and headroom.
            targets:
              - decimal-budget-mechanism
            color: cyan
            linger: 0.45
      - say: The remaining fifty-one point six zero five gibibytes hold one hundred three current
          half-gibibyte histories. Reserve five hundred twelve more positions per request and each
          becomes point five six two five gibibytes. Only ninety-one now fit; ninety-two would need
          fifty-one point seven five gibibytes. Allocator metadata and runtime peaks can leave fewer slots available.
        visual_cues:
          - id: ic-decimal-budget-pool
            phrase: The remaining fifty-one point six zero five gibibytes hold one hundred three current
              half-gibibyte histories.
            targets:
              - decimal-budget-mechanism
            color: cyan
            linger: 0.45
          - id: ic-decimal-budget-reserve
            phrase: Reserve five hundred twelve more positions per request and each becomes point five six two
              five gibibytes.
            targets:
              - decimal-budget-mechanism
            color: cyan
            linger: 0.45
          - id: ic-decimal-budget-capacity
            phrase: Only ninety-one now fit; ninety-two would need fifty-one point seven five gibibytes.
            targets:
              - decimal-budget-mechanism
            color: cyan
            linger: 0.45
      - say: Measure device-reported memory and actual engine allocations. Activations, scratch, captured
          graphs and other processes vary with workload. FlashAttention avoids storing the large attention
          score matrix. Its kernels still use workspace. A preallocated KV pool can stay resident as live
          and
          cached ownership changes. In current vLLM configuration, the GPU-memory-utilization
          setting limits the model executor fraction; an explicit KV-cache-memory-bytes value
          controls the pool separately. Measure the workspace peak under load.
        visual_cues:
          - id: ic-decimal-budget-settings
            phrase: an explicit KV-cache-memory-bytes value controls the pool separately.
            targets:
              - decimal-budget-mechanism
            color: cyan
            linger: 0.45
  - id: growth
    title: Leave room for the answer to grow
    visual: A computed capacity grid changes from thirty-two current-history payloads to twenty-five
      output-reserved requests, then seven long-history requests under the same pool budget.
    beats:
      - say: >
          Thirty-two half-gibibyte histories fill this entire pool. Every occupied square is a conversation
          that could still be writing. Its next token needs cache space too.
        visual_cues:
          - id: current-capacity
            phrase: Thirty-two half-gibibyte histories
            targets:
              - growth-field-grid
            color: green
          - id: future-growth
            phrase: Its next token needs cache space too
            targets:
              - growth-readout
            color: yellow
        hold: 0.9
      - say: >
          Reserve an additional answer allowance for every request before admission. With one
          thousand twenty-four additional positions per request, only twenty-five requests fit. The
          empty grid positions show the difference between counting what exists now and promising
          what each conversation may need before it completes.
        visual_cues:
          - id: reserve-answer
            phrase: Reserve an additional answer allowance
            targets:
              - growth-readout
            color: yellow
          - id: reserved-capacity
            phrase: only twenty-five requests fit
            targets:
              - growth-field-grid
            color: green
        hold: 0.65
        motion_check:
          region:
            - 150
            - 350
            - 1530
            - 460
          minimumChangedFraction: 0.002
      - say: >
          Now increase every starting history to sixteen thousand three hundred eighty-four
          positions while keeping the answer allowance and pool fixed. Capacity falls to seven. A
          mean prompt length can hide this change during a burst. Admission should charge the actual
          request's reservation, and enforce its output limit as generation proceeds.
        visual_cues:
          - id: longer-history
            phrase: increase every starting history to sixteen thousand three hundred eighty-four positions
            targets:
              - growth-readout
            color: yellow
          - id: seven-fit
