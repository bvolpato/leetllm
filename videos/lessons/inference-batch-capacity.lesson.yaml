          hundred forty decimal gigabytes, so an eighty-gigabyte device cannot hold the weights even
          at batch one. A shorter context or an appropriate sharded layout must address the actual
          residency failure.
        visual_cues:
          - id: ic-request-shards-weights
            phrase: Seventy B sixteen-bit parameters alone are roughly one hundred forty decimal gigabytes
            targets:
              - request-shards-mechanism
            color: cyan
            linger: 0.45
      - say: "Attention still combines evidence across context shards. Ring Attention rotates key and value
          blocks during one long-sequence approach; some decode implementations combine partial
          attention states instead. With both shards on the same score scale,
          shard A has mass one and weighted-value sum two, while shard B has mass three and sum
          thirty. Add sums and masses, then divide: thirty-two over four equals eight. Averaging
          local normalized outputs two and ten would give six and lose their different masses. Real
          merges also reconcile different score maxima. Communication depends on phase and
          implementation."
        visual_cues:
          - id: ic-request-shards-parts
            phrase: shard A has mass one and weighted-value sum two, while shard B has mass three and sum
              thirty.
            targets:
              - request-shards-mechanism
            color: cyan
            linger: 0.45
          - id: ic-request-shards-merge
            phrase: "Add sums and masses, then divide: thirty-two over four equals eight."
            targets:
              - request-shards-mechanism
            color: cyan
            linger: 0.45
          - id: ic-request-shards-wrong
            phrase: Averaging local normalized outputs two and ten would give six and lose their different
              masses.
            targets:
              - request-shards-mechanism
            color: cyan
            linger: 0.45
  - id: measurement
    title: What does a batch of sixteen buy?
    visual: >-
      Read the original batch of sixteen on two scales. One bar reserves room for future output, the other
      times a weight read and a current-history read. Mark the point where a seventeenth history would cross
      the time target.
    beats:
      - say: >-
          Return to the code assistant with sixteen conversations. Each has its
          four-thousand-ninety-six-position prompt and room for a thousand twenty-four more positions. Lay
          the reservations in the pool. Six gibibytes are still available. Now time one decode step. The GPU
          reads the weights once, then reads the sixteen current histories in our model. That fills the
          entire forty-millisecond window.
        hold: 0.65
        visual_cues:
          - id: ic-measurement-reserved
            phrase: Lay the reservations in the pool
            targets: [measurement-reservation]
            color: yellow
            linger: 0.22
          - id: ic-measurement-weights
            phrase: reads the weights once
            targets: [measurement-clock]
            color: blue
            linger: 0.22
          - id: ic-measurement-live
            phrase: reads the sixteen current histories
            targets: [measurement-clock]
            color: cyan
            linger: 0.22
      - say: >-
          Suppose another patch request joins these sixteen. Its reservation fits easily. Its cache read adds
          a millisecond to the step. There's the reason to test token gaps even when the memory gauge looks
          fine. On a real workload, sweep batch pressure with the same prompts, model, precision and quality
          checks. Record queue age and time to first token alongside the gaps people actually experience.
        hold: 0.65
        visual_cues:
          - id: ic-measurement-extra-space
            phrase: Its reservation fits easily
            targets: [measurement-reservation]
            color: yellow
            linger: 0.22
          - id: ic-measurement-extra-time
            phrase: Its cache read adds a millisecond
            targets: [measurement-clock]
            color: pink
            linger: 0.22
      - say: >-
          If requests spend their time waiting for cache blocks, look at peak allocations, unused slots and
          preemptions. If reads dominate the step, measure which bytes you're moving. Smaller weights reduce
          the shared read. A narrower cache changes both the live read and the reservation. Count useful
          output over the whole run, including time spent on rejected or cancelled work. Let's try the
          narrower cache on this same replica.
        hold: 0.65
        visual_cues:
          - id: ic-measurement-shared
            phrase: Smaller weights reduce the shared read
            targets: [measurement-clock]
            color: blue
            linger: 0.22
          - id: ic-measurement-private
            phrase: both the live read and the reservation
            targets: [measurement-reservation]
            color: cyan
            linger: 0.22
  - id: fresh-resource
    title: Which batch would you try on the patch queue?
    visual: >-
      Keep five batch sizes in the same columns. Build their current and reserved cache bars against 16 GiB,
      then their shared and per-history reads against 38 ms. Hold on the evidence before selecting a column
      and pricing its useful output.
    beats:
      - say: >-
          Try a cache format that uses one byte instead of two. The kernel supports it and the answers pass
          the quality check. Keep the same prompt and answer limit. That
          cuts each live history to a quarter of a gibibyte. Reserving room for the answer brings it to five
          sixteenths.
        hold: 0.65
        visual_cues:
          - id: ic-fresh-resource-premise
            phrase: one byte instead of two
            targets: [case-inputs]
            color: cyan
            linger: 0.22
          - id: ic-fresh-resource-payload
            phrase: a quarter of a gibibyte
            targets: [case-inputs]
            color: cyan
            linger: 0.22
          - id: ic-fresh-resource-allowance
            phrase: five sixteenths
            targets: [case-inputs]
            color: yellow
            linger: 0.22
      - say: >-
          Try these five batch sizes in the sixteen-gibibyte pool. Give each conversation space for its
          current history, then add its answer allowance. Memory alone has room for fifty-one whole
          reservations. Forty-eight is the largest size on our list that fits. At sixty-four the reservations
          run past the edge. Now tighten the time allowed for a step to thirty-eight milliseconds.
        hold: 0.65
        visual_cues:
          - id: ic-fresh-resource-memory
            phrase: space for its current history
            targets: [memory-bars]
            color: cyan
            linger: 0.22
          - id: ic-fresh-resource-candidate
            phrase: add its answer allowance
            targets: [memory-bars]
            color: yellow
            linger: 0.22
          - id: ic-fresh-resource-target
            phrase: thirty-eight milliseconds
            targets: [time-bars]
            color: yellow
            linger: 0.22
      - say: >-
          Keep the assumed bandwidth at five hundred gibibytes per second. Each batch pays the same
          twenty-four milliseconds to read the weights. Add the time for the histories that already exist.
          The yellow space is for tokens still to come, so it adds no read time on this step.
          Which is the largest batch on the list that clears both limits?
        hold: 2.5
        visual_cues:
          - id: ic-fresh-resource-weight-time
            phrase: twenty-four milliseconds to read the weights
            targets: [time-bars]
            color: blue
            linger: 0.22
          - id: ic-fresh-resource-time
            phrase: Add the time for the histories that already exist
            targets: [time-bars]
            color: cyan
            linger: 0.22
          - id: ic-fresh-resource-predict
            phrase: clears both limits
            targets: [time-bars]
            color: yellow
            linger: 0.22
      - say: >-
          At thirty-two, the cache fits, but the read takes forty milliseconds. Move back one column.
          Twenty-four fits both limits. Its live histories add six gibibytes to the shared twelve.
          Eighteen gibibytes divided by five hundred gibibytes per second gives thirty-six milliseconds.
          Each conversation gets one token in that step. That's about six hundred sixty-seven tokens
          per second across the batch. Sixteen requests with the original cache gave four hundred
          tokens per second. If that new rate held for every billed second, two dollars an hour would
          buy two point four million tokens. That's about eighty-three cents per million.
          Try twenty-four on live patch traffic. Check whether readers still get timely answers as
          the queue fills. If even the model weights won't fit on one GPU, the next lesson follows
          the model as it splits across devices.
        hold: 0.65
        caption_starts:
          - Move back one column
          - Twenty-four fits both limits
          - That's about six hundred sixty-seven
          - That's about eighty-three cents
        visual_cues:
          - id: ic-fresh-resource-reject
            phrase: the read takes forty milliseconds
            targets: [time-bars]
            color: pink
            linger: 0.22
          - id: ic-fresh-resource-selection
            phrase: Twenty-four fits both limits
            targets: [batch-choice]
            color: green
            linger: 0.22
          - id: ic-fresh-resource-rate
            phrase: six hundred sixty-seven tokens per second across the batch
            targets: [batch-choice]
            color: green
            linger: 0.22
          - id: ic-fresh-resource-cost
            phrase: about eighty-three cents per million
            targets: [batch-choice]
            color: green
            linger: 0.22
          - id: ic-fresh-resource-trial
            phrase: Try twenty-four on live patch traffic
            targets: [batch-choice]
            color: green
            linger: 0.22
