scenes:
  - id: policy-premise
    title: One score row, several possible answers
    visual: The retrieved key-rotation guide remains visible while the same four named tokens acquire model
      scores. An allowed-token rail and a separate evidence-supported marker retain different jobs.
    beats:
      - say: "The retrieved guide says: create a replacement key, deploy it, then revoke the old key. Our prompt
          asks for the first rotation step. Keep that guide visible. A supplied model row can still score
          create, revoke, rename and quota. Those are invented scores for a teaching fixture, not a trained
          model’s measured accuracy."
        hold: 0.6
        visual_cues:
          - id: policy-premise-build-0
            phrase: Keep that guide visible
            targets:
              - policy-premise-state-0
            color: cyan
            linger: 0.55
      - say: A decoder turns a score row into a next token. Greedy chooses a local maximum, sampling draws from a
          distribution, and beam search carries several prefixes. The resulting token becomes part of the
          next input. Our experiment emits text; executing an infrastructure action would need its own
          authorization and checks. We will calculate the policy before judging the complete answer.
        hold: 0.8
        visual_cues:
          - id: policy-premise-build-1
            phrase: The resulting token becomes part of the next input
            targets:
              - policy-premise-state-1
            color: cyan
            linger: 0.55
  - id: search-space
    title: Follow a path instead of enumerating the tree
    visual: An actual bounded three-way tree expands by depth; a distinct logarithmic count ruler extends the
      multiplication to the supplied32000-token,100-position example. A single ancestral sample follows one
      retained path.
    beats:
      - say: At each position, the model supplies a conditional distribution given the prompt and every generated
          token so far. Multiply those conditional probabilities along a path to obtain its joint
          probability. Adding log probabilities gives the same ranking while avoiding long products of tiny
          numbers. A direct stable log-softmax can retain a log probability even when its ordinary
          probability underflows.
        hold: 0.6
        visual_cues:
          - id: search-space-build-0
            phrase: Multiply those conditional probabilities along a path
            targets:
              - search-space-state-0
            color: cyan
            linger: 0.55
      - say: A fixed horizon with vocabulary size V and T positions has V to power T possible paths. Three choices
          for three positions already give twenty-seven paths. The article’s hypothetical
          thirty-two-thousand-token vocabulary over one hundred positions gives about three point two seven
          times ten to power four hundred fifty. These are completed length-one-hundred paths, not every
          intermediate tree node. EOS and constraints change which sequences are eligible.
        hold: 0.6
        visual_cues:
          - id: search-space-build-1
            phrase: Three choices for three positions already give twenty-seven paths
            targets:
              - search-space-state-1
            color: cyan
            linger: 0.55
          - id: search-space-large-vocabulary
            phrase: thirty-two-thousand-token vocabulary
            targets:
              - search-space-state-1
            color: cyan
            linger: 0.55
      - say: "Viterbi can merge histories that have the same compact future-relevant state. General transformer
          prefixes usually retain different future distributions, so merely keeping a full prefix or KV
          cache does not merge that tree away. Ancestral sampling takes a different route: draw one
          conditional token at a time. In ideal arithmetic that samples the model’s joint law without
          enumerating paths or locating its highest-probability sequence."
        hold: 0.8
        visual_cues:
          - id: search-space-build-2
            phrase: draw one conditional token at a time
            targets:
              - search-space-state-2
            color: cyan
            linger: 0.55
  - id: logit-shift
    title: Turn scores into one normalized row
    visual: Four stable token identities move from logits through maximum subtraction and exponentiation into a
      unit-mass categorical strip. The normalization is computed from the current values, with a movable
      uniform draw kept separate from the mode.
    beats:
      - say: Return to the rotation prompt. Its supplied logits are three for create, two point five for revoke, one
          for rename and negative one for quota. A logit is a score, not a probability. Negative scores are
          permitted, and the scores do not sum to one. Predict which token has the largest probability
          before we convert the row.
        hold: 0.6
        visual_cues:
          - id: logit-shift-build-0
            phrase: Predict which token has the largest probability
            targets:
              - logit-shift-state-0
            color: cyan
            linger: 0.55
      - say: Subtract the largest score from every entry, then exponentiate. The shifted scores are zero, negative
          point five, negative two and negative four. Dividing each resulting weight by their sum gives
          probabilities about point five six eight, point three four five, point zero seven seven and point
          zero one zero. The common factor introduced by the shift cancels between numerator and
          denominator.
        hold: 0.6
        visual_cues:
          - id: logit-shift-build-1
            phrase: Subtract the largest score from every entry, then exponentiate
            targets:
              - logit-shift-state-1
            color: cyan
            linger: 0.55
          - id: logit-shift-subtract
            phrase: Subtract the largest score from every entry
            targets:
              - logit-shift-subtracted-row
            color: cyan
            linger: 0.3
          - id: logit-shift-exponentiate
            phrase: then exponentiate
            targets:
              - logit-shift-exponential-row
            color: yellow
            linger: 0.3
          - id: logit-shift-normalize
            phrase: Dividing each resulting weight by their sum gives probabilities
            targets:
              - logit-shift-probability-row
            color: cyan
            linger: 0.45
      - say: Create is the mode, but a weighted draw can choose revoke. On the cumulative probability strip, the
          supplied uniform draw point seven five lands in revoke’s interval. That is one next-token event.
          It is not a measured probability that a whole answer is wrong, an operation executes or a service
          fails. Later tokens and complete-answer grading still matter.
        hold: 0.8
        visual_cues:
          - id: logit-shift-build-2
            phrase: uniform draw point seven five lands in revoke’s interval
            targets:
              - logit-shift-state-2
            color: cyan
            linger: 0.55
  - id: logit-boundaries
    title: Keep overflow, masks and tiny log probabilities distinct
    visual: An exponent ruler exposes raw exp1000 overflow, then max subtraction. A separate all-masked row
      fails explicitly, and a tiny finite log probability stays on a log ruler after ordinary probability
      rounds to zero.
    beats:
      - say: Now supply logits one thousand, nine hundred ninety-nine and nine hundred ninety-eight. Direct
          exponentiation overflows ordinary floating-point math. Subtracting the maximum leaves zero,
          negative one and negative two, whose exponentials fit and produce about point six six five, point
          two four five and point zero nine zero. This operation preserves the mathematical distribution; it
          changes the numerical route.
        hold: 0.6
        visual_cues:
          - id: logit-boundaries-build-0
            phrase: Subtracting the maximum leaves zero, negative one and negative two
            targets:
              - logit-boundaries-state-0
            color: cyan
            linger: 0.55
          - id: logit-boundaries-exponentiate
            phrase: whose exponentials fit
            targets:
              - logit-boundaries-state-0
            color: yellow
            linger: 0.35
      - say: An extreme negative gap can still underflow its probability to zero. Taking a logarithm after that
          rounding cannot recover the original finite log probability; calculate log-softmax directly when
          you need that quantity. Negative infinity deliberately masks a token. If every token is masked,
          this lab rejects the row rather than dividing zero by zero. Its actual code also rejects NaN and
          positive infinity.
        hold: 0.8
        visual_cues:
          - id: logit-boundaries-build-1
            phrase: If every token is masked, this lab rejects the row
            targets:
              - logit-boundaries-state-1
            color: cyan
            linger: 0.55
  - id: greedy-loop
    title: Append the chosen token before asking again
    visual: The actual two-step article fixture shows the current prefix, its own conditional row and a distinct
      next row after appending create. Greedy ownership stays separate from model weights and KV reuse.
    beats:
      - say: Greedy selects the largest score at the current position. The article’s first row selects create.
          Append that token to the prompt before looking at the next row. In this supplied two-step fixture,
          the second scores are four for a period, one point five for then, and point five for after.
          Predict which token is appended next.
        hold: 0.6
        visual_cues:
          - id: greedy-loop-build-0
            phrase: Append that token to the prompt before looking at the next row
            targets:
              - greedy-loop-state-0
            color: cyan
            linger: 0.55
      - say: "The period wins, yielding: the first rotation step is create. A period is written punctuation; an EOS
          token signals generation completion under a separate stop rule. Identical logits and a fixed tie
          rule make greedy selection deterministic. The runtime can still change logits through numerical
          differences. A KV cache reuses attention state; it does not choose a token or prove the complete
          answer correct."
        hold: 0.8
        visual_cues:
          - id: greedy-loop-build-1
            phrase: The period wins
            targets:
              - greedy-loop-state-1
            color: cyan
            linger: 0.55
  - id: opening
    title: The best first word can lose the sentence
    visual: A sentence tree grows from the prefix Mia, with a locally strong branch and a weaker opening that
      later earns a stronger completion.
    beats:
      - say: Start with Mia. The supplied model gives opened the strongest next-word score, but the sentence still
          has several steps to go. Can the first choice tell us which ending will score best?
        hold: 0.55
        visual_cues:
          - id: opening-beat-1-focus-1
            phrase: Start with Mia
            targets:
              - opening-object-mia-1
            color: blue
            linger: 0.6
          - id: opening-supplied-choices
            phrase: The supplied model gives opened the strongest next-word score
            targets:
              - opening-simulation-3
            color: cyan
            linger: 0.6
      - say: We will follow a small search tree by hand. Each edge carries a conditional probability. A path
          multiplies those probabilities, or adds their logarithms, so the model's local choices accumulate
          into a score for a complete sentence.
        hold: 0.55
        visual_cues:
          - id: opening-beat-2-focus-1
            phrase: so the model's local choices accumulate into a
            targets:
              - opening-simulation-3
            color: blue
            linger: 0.6
          - id: opening-beat-2-focus-2
            phrase: We will follow a small search tree by hand
            targets:
              - opening-object-mia-1
            color: blue
            linger: 0.6
      - say: The fixture uses ordinary words and supplied probabilities, so every branch can be checked. We will
          expand candidates, prune by a fixed beam width, include the end-of-sentence choice, then compare
          the scoring rules used for completed answers.
        hold: 0.7
        visual_cues:
          - id: opening-beat-3-focus-1
            phrase: The fixture uses ordinary words and supplied probabilities
            targets:
              - opening-simulation-3
            color: blue
            linger: 0.6
  - id: probabilities
    title: Each edge scores a conditional choice
    visual: The opening row sums to one; a separate pair of prefix-labeled lanes multiplies successive
      conditional probabilities; an EOS row distinguishes finishing from extending the completed phrase.
    beats:
      - say: Given the same prefix, the model assigns mass across its next-token choices. Opened receives the
          largest share, looked receives a little less, and slept receives the smallest. These supplied toy
          probabilities let us trace each branch.
        hold: 0.5
        visual_cues:
          - id: probabilities-beat-1-focus-1
            phrase: Opened receives the largest share
            targets:
              - probabilities-active-bars
            color: yellow
            linger: 0.6
          - id: probabilities-beat-1-focus-2
            phrase: the model assigns mass across its next-token choices
            targets:
              - probabilities-active-bars
            color: blue
            linger: 0.6
      - say: A complete path needs another conditional choice after every unfinished word. Multiply the edge
          probabilities along one path to obtain its joint probability. In log space, add each edge's log
          probability and keep the same ranking without tiny repeated products.
        hold: 0.55
        visual_cues:
          - id: probabilities-beat-2-focus-1
            phrase: Multiply the edge probabilities along one path to obtain its joint probability
            targets:
              - probabilities-equation-string-raw-p-text-opened-the-p-text-opened-mid-tex-13
            color: blue
            linger: 0.6
          - id: probabilities-beat-2-focus-2
            phrase: A complete path needs another conditional choice after every unfinished word
            targets:
              - probabilities-active-bars
            color: yellow
            linger: 0.6
      - say: A period and an end-of-sentence token have different meanings in a tokenizer. We will use the explicit
          EOS marker for completion, so the search knows exactly when a candidate stops and how many
          generated tokens its score includes.
        hold: 0.65
        visual_cues:
          - id: probabilities-beat-3-focus-1
            phrase: We will use the explicit EOS marker for completion
            targets:
              - probabilities-active-bars
            color: yellow
            linger: 0.6
          - id: probabilities-beat-3-focus-2
            phrase: A period and an end-of-sentence token have different meanings in a tokenizer
            targets:
              - probabilities-active-bars
            color: blue
            linger: 0.6
  - id: first-beam
    title: Keep several openings while pruning
    visual: Search expands every opening and marks the top two cumulative log scores as active while the third
      is pruned.
    beats:
      - say: Beam search keeps a small set of active prefixes. At the first step, width two retains opened and
          looked. The shorter route beginning with slept falls below the cutoff, so later steps cannot
          extend that route in this run.
        motion_check:
          region:
            - 205
            - 340
            - 1510
            - 520
          minimumChangedFraction: 0.002
        hold: 0.5
        visual_cues:
          - id: first-beam-beat-1-focus-1
            phrase: Beam search keeps a small set of active prefixes
            targets:
              - first-beam-simulation-18
            color: blue
            linger: 0.6
      - say: Notice what the width controls. It is the number of partial sentences carried between steps. The model
          still scores possible next tokens, and the search still compares cumulative path scores before
          deciding which prefixes remain active.
        hold: 0.5
        visual_cues:
          - id: first-beam-beat-2-focus-1
            phrase: path scores before deciding which prefixes remain active
            targets:
              - first-beam-simulation-18
            color: blue
            linger: 0.6
          - id: first-beam-beat-2-focus-2
            phrase: Notice what the width controls
            targets:
              - first-beam-object-label-19
            color: blue
            linger: 0.6
      - say: A beam acts like a narrow moving frontier through the tree. Its surviving leaves are promising under
          scores seen so far. The frontier is a compute budget, and pruning makes the procedure an
          approximation to searching every sequence.
        hold: 0.65
        visual_cues:
          - id: first-beam-beat-3-focus-1
            phrase: and pruning makes the procedure an approximation to searching every sequence
            targets:
              - first-beam-simulation-18
            color: blue
            linger: 0.6
          - id: first-beam-beat-3-focus-2
            phrase: A beam acts like a narrow moving frontier through the tree
            targets:
              - first-beam-object-label-19
            color: blue
            linger: 0.6
  - id: search-lattice
    title: Expand the surviving lattice
    visual: The retained prefixes open their conditional rows; a live candidate table recomputes cumulative path
      probabilities and highlights the next beam frontier.
    beats:
      - say: At this step, opened branches to the or a, while looked branches outside or up. Each edge belongs to
          its own prefix. One expansion later, opened the can propose door, and looked outside can continue
          to again.
        hold: 0.55
        visual_cues:
          - id: search-lattice-beat-1-focus-1
            phrase: At this step
            targets:
              - search-lattice-simulation-27
            color: blue
            linger: 0.6
      - say: The search adds each new log probability to its prefix score, ranks the resulting candidates, and keeps
          the leading active paths. Follow the inherited prefix into the new score. That identity is what
          turns local predictions into a sentence-level comparison.
        hold: 0.55
        visual_cues:
          - id: search-lattice-beat-2-focus-1
            phrase: and keeps the leading active paths
            targets:
              - search-lattice-simulation-27
            color: blue
            linger: 0.6
      - say: After another expansion, opened the door reaches EOS with the strongest completed route. Looked outside
          again quietly stays active for one more step. The best words at each position did not need to form
          one sentence.
        hold: 0.65
        visual_cues:
          - id: search-lattice-beat-3-focus-1
            phrase: opened the door reaches EOS with the strongest completed route
            targets:
              - search-lattice-simulation-29
            color: blue
            linger: 0.6
          - id: search-lattice-beat-3-focus-2
            phrase: Looked outside again quietly stays active for one more step
            targets:
              - search-lattice-simulation-29
            color: blue
            linger: 0.6
  - id: stopping
    title: EOS turns a path into an answer
    visual: EOS edges leave the active frontier and enter a completed set; an unfinished sentence remains
      eligible for another expansion.
    beats:
      - say: Now run the same tree with width three. This separate run keeps slept alive, where it reaches EOS
          immediately. An EOS choice moves a candidate into the completed set, while unfinished prefixes
          stay active for another expansion.
        hold: 0.5
        visual_cues:
          - id: stopping-beat-1-focus-1
            phrase: where it reaches EOS immediately
            targets:
              - stopping-simulation-34
            color: blue
            linger: 0.6
      - say: In the width-three run, the completed paths include Mia slept and Mia opened the door. The short path
          earns a higher joint probability in this fixture. The longer path combines several conditional
          choices into a nearby score.
        hold: 0.55
        visual_cues:
          - id: stopping-beat-2-focus-1
            phrase: In the width-three run
            targets:
              - stopping-simulation-34
            color: blue
            linger: 0.6
          - id: stopping-beat-2-focus-2
            phrase: the completed paths include Mia slept and Mia opened the door
            targets:
              - stopping-simulation-34
            color: blue
            linger: 0.6
      - say: A stopping rule changes which candidates count as complete. Fixed horizons, maximum lengths, minimum
          lengths, and early stopping all alter the search space. State the rule before comparing outputs,
          or the final ranking may mix different tasks.
        hold: 0.65
        visual_cues:
          - id: stopping-beat-3-focus-1
            phrase: A stopping rule changes which candidates count as complete
            targets:
              - stopping-simulation-34
            color: blue
            linger: 0.6
  - id: length-score
    title: Length normalization changes the comparison
    visual: A computed ranking compares joint log probability with mean log probability per generated token,
      including EOS, and reveals the winner for each rule.
    beats:
      - say: Compare the completed candidates from the width-three run. Joint probability favors the short path.
          Every extra conditional probability is at most one, so extra edges add nonpositive log terms and
          can pressure a raw-sum objective toward brief completions.
        hold: 0.5
        visual_cues:
          - id: length-score-beat-1-focus-1
            phrase: Joint probability favors the short path
            targets:
              - length-scored-paths
            color: blue
            linger: 0.6
          - id: length-score-beat-1-focus-2
            phrase: Compare the completed candidates from the width-three run
            targets:
              - length-scored-paths
            color: blue
            linger: 0.6
      - say: Divide each completed log score by its generated-token count, including EOS. This changes the objective
          from total sequence probability to average log probability per token. For the width-three
          candidates here, that normalization reverses their order.
        hold: 0.55
        visual_cues:
          - id: length-score-beat-2-focus-1
            phrase: Divide each completed log score by its generated-token count
            targets:
              - length-scored-paths
            color: blue
            linger: 0.6
      - say: GNMT used a different length penalty, and libraries expose their own conventions. The formula belongs
          to the decoding policy. Tune it on development examples and check the resulting answer lengths
          alongside task quality.
        hold: 0.7
        visual_cues:
          - id: length-score-beat-3-focus-1
            phrase: GNMT used a different length penalty
            targets:
              - length-scored-paths
            color: blue
            linger: 0.6
  - id: width
    title: A wider frontier preserves more options
    visual: Width-two and width-three runs share the same lattice; the third first-step branch remains available
      only in the wider run and changes the completed candidate set.
    beats:
      - say: The width-two run pruned slept before its high EOS probability appeared. A width-three run keeps that
          prefix, later completing a path with a larger raw joint probability. The search budget changed
          which answers could reach the final comparison.
        hold: 0.55
        visual_cues:
          - id: width-beat-1-focus-1
            phrase: The width-two run pruned slept before its high EOS probability appeared
            targets:
              - width-simulation-54
            color: blue
            linger: 0.6
      - say: Width also multiplies work. Each step expands the retained prefixes, scores their continuations, and
          selects a new frontier. KV states may share common prefixes in an optimized runtime, while each
          distinct continuation still needs its own correct state.
        hold: 0.55
        visual_cues:
          - id: width-beat-2-focus-1
            phrase: Width also multiplies work
            targets:
              - width-work
            color: blue
            linger: 0.6
      - say: A larger beam preserves more candidates at each pruning step, but final task quality depends on the
          model scores and scoring rule. Measure latency, memory, and answer quality on the same prompts and
          stopping contract.
        hold: 0.7
        visual_cues:
          - id: width-beat-3-focus-1
            phrase: A larger beam preserves more candidates at each pruning step
            targets:
              - width-output-policy
            color: blue
            linger: 0.6
  - id: wider-counterexample
    title: A wider intermediate frontier can lose the final winner
    visual: A supplied three-step tree runs at widths two and three with exact shared conditional rows. Two C
      children displace the later winner from only the wider frontier; final expansion recomputes rather
      than assuming a monotonic score gain.
    beats:
      - say: A larger beam is not a general guarantee of a larger final score. Build a separate fixed-three-token
          tree with first probabilities A point five, B point three and C point two. A’s next choices have
          probabilities point eight, point one eight and point zero two. B splits equally over ten children,
          while C splits equally over two. Keep these conditional rows identical in both runs.
        hold: 0.6
        visual_cues:
          - id: wider-counterexample-build-0
            phrase: Keep these conditional rows identical in both runs
            targets:
              - wider-counterexample-state-0
            color: cyan
            linger: 0.55
      - say: Width two first keeps A and B, then retains A-one at joint point four and A-two at point zero nine.
          Width three also keeps C, whose two children each reach point one. Its second frontier therefore
          becomes A-one, C-one and C-two, displacing A-two. The larger frontier contains two paths the
          narrower search never expanded, so its retained set is not simply the smaller frontier plus one.
        hold: 0.6
        visual_cues:
          - id: wider-counterexample-build-1
            phrase: displacing A-two
            targets:
              - wider-counterexample-state-1
            color: cyan
            linger: 0.55
      - say: For the last step, A-two has a certain continuation. A-one and each C child split equally over ten
          continuations. The width-two run finishes with probability point zero nine, while width three’s
          best result is point zero four. Both correctly followed their local pruning rule. This computed
          counterexample separates a search budget from a monotonic final-score or task-quality guarantee.
        hold: 0.8
        visual_cues:
          - id: wider-counterexample-build-2
            phrase: width three’s best result is point zero four
            targets:
              - wider-counterexample-state-2
            color: cyan
            linger: 0.55
  - id: length-conventions
    title: A length-penalty name does not identify its formula
    visual: The same completed candidates retain log score, EOS-inclusive length and derived scores on two
      aligned objective rulers. A separate explicit EOS tree disproves a cross-branch short-answer claim.
    beats:
      - say: A raw path score cannot increase when that same prefix gains another conditional edge, because the
          added log probability is nonpositive. This does not rank arbitrary completed branches by length.
          In a separate supplied tree, immediate EOS has probability point zero one, while create followed
          by EOS has probability point nine nine times point nine zero, or point eight nine one. The longer
          completion wins.
        hold: 0.6
        visual_cues:
          - id: length-conventions-build-0
            phrase: The longer completion wins
            targets:
              - length-conventions-state-0
            color: cyan
            linger: 0.55
