scenes:
  - id: intro
    title: Would you switch coding assistants?
    visual: The coding assistants have three passes apiece. Five task pairs match. B's permission test
      is the last open cell on the scoreboard.
    beats:
      - say: Three passes apiece. One test left to score. Each coding assistant gets one try.
          The permission test checks that a denied request stays blocked. A failed it.
          If B passes, would you switch?
        hold: 2.2
        caption_starts:
          - The permission test checks
          - If B passes
        visual_cues:
          - id: opening-current
            phrase: Three passes apiece
            targets:
              - opening-scores
            color: blue
            linger: 0.25
          - id: opening-pairs
            phrase: The permission test checks that a denied request stays blocked
            targets:
              - paired-task-permission
            color: blue
            linger: 0.25
          - id: opening-predict
            phrase: If B passes
            targets:
              - opening-question
              - opening-scores
              - paired-task-permission
              - model-a-only-fail-permission
              - model-b-only-pass-permission
            color: yellow
            linger: 0.25
      - say: One task passes for Model B. Its answer keeps the request blocked. B wins four to three.
          Five tasks ended in ties. If either assistant was equally likely to win that last task, how surprising is B's lead?
        hold: 0.85
        visual_cues:
          - id: intro-permission
            phrase: One task passes for Model B
            targets:
              - model-a-only-fail-permission
              - model-b-only-pass-permission
            color: green
            linger: 0.25
          - id: intro-pass
            phrase: passes
            targets:
              - paired-task-permission
              - model-a-only-fail-permission
              - model-b-only-pass-permission
            color: green
            linger: 0.9
          - id: intro-denial
            phrase: Its answer keeps the request blocked
            targets:
              - paired-task-permission
              - model-a-only-fail-permission
              - model-b-only-pass-permission
            color: green
            linger: 0.25
          - id: intro-receipt
            phrase: B wins four to three
            targets:
              - intro-lift
            color: green
            linger: 0.25
            caption_boundary: true
  - id: paired-design
    title: Keep the task attached to both answers
    visual: A permission prompt feeds the same tests, followed by a large paired table and signed
      differences.
    beats:
      - say: Take the permission task. An explicit denial must stay denied. We give each model the same
          prompt and hidden tests, then keep both outcomes on one row. Pairing by task preserves
          this shared difficulty. Related versions of one task would need a cluster-level analysis.
        hold: 0.6
        visual_cues:
          - id: pair-prompt
            phrase: same prompt
            targets:
              - paired-task-source
            color: blue
            linger: 0.45
          - id: pair-results
            phrase: both outcomes on one row
            targets:
              - permission-pair
            color: green
            linger: 0.45
      - say: Here are all six rows. Model A passes three; Model B passes four. The observed lift is one
          extra pass divided by all six tasks. We keep the task population, checkpoint, decoding and
          attempt budget attached to that description.
        hold: 0.6
        visual_cues:
          - id: pair-table
            phrase: all six rows
            targets:
              - paired-table
            color: blue
            linger: 0.45
          - id: pair-lift
            phrase: The observed lift is one extra pass divided by all six tasks.
            targets:
              - paired-observed-lift
              - paired-task-permission
              - model-a-only-fail-permission
              - model-b-only-pass-permission
            color: green
            linger: 0.45
      - say: Subtract A from B within each row. A shared pass and a shared failure each contribute zero.
          Only a disagreement changes the signed difference. The permission row contributes plus
          one; the five ties stay in the denominator of the overall lift.
        hold: 0.6
        visual_cues:
          - id: pair-differences
            phrase: Subtract A from B
            targets:
              - paired-differences
            color: blue
            linger: 0.45
          - id: pair-ties
            phrase: each contribute zero
            targets:
              - paired-differences
            color: blue
            linger: 0.25
          - id: pair-permission
            phrase: only a disagreement
            targets:
              - paired-positive-difference-permission
              - paired-task-permission
              - model-a-only-fail-permission
              - model-b-only-pass-permission
            color: green
            linger: 0.45
  - id: protocol-identity
    title: Which answer belongs to which task?
    visual: Two out-of-order results create opposing apparent wins. The challenger results move beside
      their matching task IDs. A replay leaves a timeout attached to its task.
    beats:
      - say: Let's see how easy it is to invent a win. Here are two tasks from the first six. The
          challenger's cache test finishes before its timestamp test. Line up the results by finish
          time. It looks as though each assistant won a different task. Look at the names in those
          pairs. Now match each result to its own task ID. Both apparent wins disappear. A strict
          length check on the lists would have let the first pairing through. Suppose the timestamp
          result times out instead. Keep that row and apply the timeout policy you declared.
        hold: 0.85
        visual_cues:
          - id: protocol-identity-0
            phrase: Here are two tasks from the first six
            targets:
              - protocol-identity-construction
            color: cyan
            linger: 0.25
          - id: identity-order
            phrase: Line up the results by finish time
            targets:
              - protocol-identity-construction
            color: cyan
            linger: 0.25
          - id: hyp-identity-join
            phrase: Now match each result to its own task ID
            targets:
              - protocol-identity-construction
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: hyp-identity-missing
            phrase: Suppose the timestamp result times out instead
            targets:
              - protocol-identity-construction
            color: cyan
            linger: 0.25
            caption_boundary: true
      - say: Write down enough to repeat that pair. Save the checkpoint hashes, prompt and tests. Give both
          assistants the same decoder settings, seeds, token limit, execution timeout and attempt
          budget. Fix how you'll select an answer. If you give B more time, the result measures the
          longer timeout along with the checkpoint. Decide which direction to test, how many
          comparisons to make and when to stop before you see the scores. Write down what the switch
          has to buy. For this run, the lower end of the lift interval must exceed two percentage points
          to cover the extra cost. Reserve fresh tasks for the winner.
        hold: 0.8
        visual_cues:
          - id: protocol-identity-1
            phrase: Write down enough to repeat that pair
            targets:
              - protocol-identity-construction
            color: cyan
            linger: 0.25
          - id: identity-cost-rule
            phrase: the lower end of the lift interval must exceed two percentage points
            targets:
              - protocol-identity-construction
            color: yellow
            linger: 0.25
      - say: Where did the tasks come from? Suppose one repository supplies twenty variations of the same
          helper. One bug could make all twenty fail together. Carry those related tasks together when
          you resample, and draw independent repository clusters. Counting every variation as
          independent can give a narrow interval for a population you barely sampled.
        hold: 0.8
        visual_cues:
          - id: protocol-identity-2
            phrase: Where did the tasks come from
            targets:
              - protocol-identity-construction
            color: cyan
            linger: 0.25
          - id: hyp-identity-cluster
            phrase: one repository supplies twenty variations of the same helper
            targets:
              - protocol-identity-construction
            color: cyan
            linger: 0.25
  - id: forty-tasks
    title: Finish the planned forty-task experiment
    visual: The same six rows extend to forty retained identities and sort into agreements, B wins and A
      wins.
    beats:
      - say: Six tasks were our close-up. Finish the planned forty-task run before drawing a conclusion.
          These are illustrative outcomes, with the same one-attempt protocol throughout. Watch the
          original permission row join seven more B-only passes, while five tasks favor A.
        hold: 0.7
        visual_cues:
          - id: forty-arrive
            phrase: Finish the planned forty-task run
            targets:
              - forty-rows
            color: blue
            linger: 0.45
          - id: forty-sort
            phrase: permission row join seven more B-only passes, while five tasks favor A
            targets:
              - forty-groups
              - forty-rows
            color: green
            linger: 0.45
        motion_check:
          region:
            - 180
            - 370
            - 1530
            - 400
      - say: "Twenty-seven pairs agree. Eight favor B and five favor A. The net gain is three passes across
          forty tasks, or seven and a half percentage points. Before looking at these results, we
          chose a one-sided question: does B improve the pass rate?"
        hold: 0.6
        visual_cues:
          - id: forty-lift
            phrase: The net gain is three passes across forty tasks, or seven and a half percentage points.
            targets:
              - forty-lift
            color: green
            linger: 0.45
          - id: direction-plan
            phrase: one-sided question
            targets:
              - direction-plan
            color: yellow
            linger: 0.45
  - id: null-model
    title: What would a fair contest produce?
    visual: One observed disagreement splits into two fair alternatives. Thirteen fixed task IDs receive
      new signs, and all 8,192 assignments accumulate in bins by B-win count.
    beats:
      - say: For that directional test, the equal-win boundary gives A and B the same chance on a
          disagreement. Start with our permission row alone. Its two possible directions are equally
          likely. A single B win has a one-sided tail probability of one half.
        hold: 0.8
        visual_cues:
          - id: null-single
            phrase: Its two possible directions are equally likely
            targets:
              - single-branches
            color: blue
            linger: 0.25
          - id: null-half
            phrase: A single B win has a one-sided tail probability of one half
            targets:
              - single-tail
            color: green
            linger: 0.25
            caption_boundary: true
      - say: Now keep all thirteen disagreement identities and assign each a fair direction under that
          model. The twenty-seven ties stay parked. Independent task pairs let us multiply the coin
          probabilities. One simulated row of signs produces one count of B wins.
        hold: 0.7
        visual_cues:
          - id: null-signs
            phrase: keep all thirteen disagreement identities and assign each a fair direction under that model
            targets:
              - null-signs
            color: blue
            linger: 0.25
          - id: null-count
            phrase: one count of B wins
            targets:
              - null-count
            color: green
            linger: 0.25
        motion_check:
          region:
            - 190
            - 360
            - 1500
            - 350
      - say: Enumerating every possible sign assignment gives this binomial distribution. Every assignment
          is equally likely, but the middle counts occur in many more assignments. The height of a
          bar is the fraction of assignments with that many B wins.
        hold: 2
        visual_cues:
          - id: null-enumerate
            phrase: Enumerating every possible sign assignment gives this binomial distribution
            targets:
              - null-histogram
            color: blue
            linger: 0.25
          - id: null-bar-share
            phrase: the fraction of assignments with that many B wins
            targets:
              - null-histogram
            color: blue
            linger: 0
  - id: p-value
    title: Which results count as evidence for B?
    visual: The observed eight stays pinned to its bin. The rightward sweep counts assignments before the
      one-sided probability appears. A mirror tail shows the other planned question.
    beats:
      - say: "Our observed count is eight B wins. Include eight, nine, and every larger count: each is at
          least as favorable to B. Add those bar probabilities. Under the equal-win model, this
          happens about twenty-nine percent of the time. This sample gives fairly ordinary results
          under that model."
        hold: 0.8
        visual_cues:
          - id: tail-observed
            phrase: Our observed count is eight B wins
            targets:
              - observed-boundary
            color: yellow
            linger: 0.25
          - id: tail-sum
            phrase: Include eight, nine, and every larger count
            targets:
              - tail-bars
            color: yellow
            linger: 0.25
          - id: tail-result
            phrase: about twenty-nine percent
            targets:
              - tail-result
            color: yellow
            linger: 0.25
            caption_boundary: true
        motion_check:
          region:
            - 200
            - 380
            - 1460
            - 380
      - say: That p-value is a tail probability for outcomes generated by the null model. A two-sided
          question would also count equally extreme A wins, shown on the other side. We choose the
          direction before seeing results. Here we retain the original one-sided plan and its full
          right tail.
        hold: 0.7
        visual_cues:
          - id: tail-mirror
            phrase: equally extreme A wins, shown on the other side
            targets:
              - mirror-tail
            color: pink
            linger: 0.25
          - id: tail-return
            phrase: original one-sided plan
            targets:
              - tail-plan
            color: blue
            linger: 0.25
  - id: null-contract
    title: What did we draw?
    visual: Compare fair assignments of thirteen wins with new samples of forty observed pairs.
      Enumerate a sweep and use a decision table to identify the two possible errors.
    beats:
      - say: Our null hypothesis gives B at most half the wins on disagreements. At the gold line,
          each assistant wins half in the long run. Farther left, a run of B wins gets even rarer. That's why we
          use the fair coin at the boundary and keep the thirteen disagreements fixed. For paired
          pass or fail results, the exact McNemar test uses this same calculation. Its usual
          two-sided version counts extremes in either direction.
        hold: 0.8
        visual_cues:
          - id: null-contract-0
            phrase: At the gold line
            targets:
              - null-contract-construction
            color: cyan
            linger: 0.5
      - say: On the left, toss thirteen fair coins. The yellow tail counts eight or more B wins.
          Its probability is our p-value. On the right, draw forty whole task pairs with replacement
          from the results we observed. Repeat that draw. The pink bars count samples where B falls behind.
          Each chart tells you how often an outcome occurs under its own drawing rule.
          To assign a posterior probability to B being better, we'd also need a prior and a model of the data.
        hold: 0.8
        caption_starts:
          - On the right
        visual_cues:
          - id: null-contract-1
            phrase: toss thirteen fair coins
            targets:
              - fair-draws
            color: blue
            linger: 0.5
          - id: empirical-draws
            phrase: On the right, draw forty whole task pairs with replacement
            targets:
              - row-draws
            color: cyan
            linger: 0.25
      - say: Suppose B wins all four disagreements. Find the four B's. Only one of the sixteen
          equally likely strings looks like that. Even a sweep lands above five percent.
          Add a fifth B win and the chance falls to one in thirty-two. Each extra win halves
          the smallest possible one-sided p-value. With no disagreements the test returns one.
          To plan a study, we also need to know how often the assistants tie and what advantage we want to detect.
        hold: 0.8
        visual_cues:
          - id: null-contract-2
            phrase: Suppose B wins all four disagreements
            targets:
              - null-contract-construction
            color: cyan
            linger: 0.5
          - id: hyp-null-five
            phrase: Add a fifth B win
            targets:
              - null-contract-construction
            color: cyan
            linger: 0.15
          - id: hyp-null-empty
            phrase: With no disagreements
            targets:
              - null-contract-construction
            color: cyan
            linger: 0.15
      - say: Read the top row. If the null is true and we reject it, we've called a false win.
          That's a Type one error. On the bottom row B really is better. Missing that gain is a
          Type two error. Power is the chance of detecting that particular gain.
          When the test leaves the comparison unresolved, a smaller gain could still matter.
          To test for practical equivalence, choose a tolerance first and test whether the difference fits inside it.
        hold: 0.8
        visual_cues:
          - id: null-contract-3
            phrase: Read the top row
            targets:
              - null-contract-construction
            color: cyan
            linger: 0.5
  - id: errors-and-power
    title: Watch the same decision rule repeat
    visual: Fixed-seed repeated studies are classified by the exact rejection cutoff under null and
      alternative win probabilities.
    beats:
      - say: A five-percent significance threshold defines a repeated-use rule. With thirteen disagreements,
          ten or more B wins trigger rejection. The colored studies are false positives when equal
          win chances really hold. Their exact long-run probability is a little below five percent
          because the counts are discrete.
        hold: 0.7
        visual_cues:
          - id: size-cutoff
            phrase: ten or more B wins
            targets:
              - decision-cutoff
            color: yellow
            linger: 0.45
          - id: size-studies
            phrase: colored studies are false positives
            targets:
              - study-grid
            color: pink
            linger: 0.45
          - id: size-receipt
            phrase: a little below five percent
            targets:
              - size-receipt
            color: pink
            linger: 0.45
        motion_check:
          region:
            - 180
            - 390
            - 1080
            - 400
      - say: "Now specify a real advantage: B wins sixty-five percent of disagreements. Keep the same
          rejection rule. Some simulated studies detect the advantage; others miss it. Power is the
          probability of detection under this specified alternative. A missed rejection leaves the
          comparison unresolved."
        hold: 0.6
        visual_cues:
          - id: power-alternative
            phrase: sixty-five percent
            targets:
              - study-alternative
            color: green
            linger: 0.45
          - id: power-studies
            phrase: Some simulated studies detect the advantage; others miss it
            targets:
              - study-grid
            color: green
            linger: 0.45
          - id: power-receipt
            phrase: probability of detection
            targets:
              - power-receipt
            color: green
            linger: 0.45
      - say: Plan for sixty-four independent disagreements instead. The critical count changes to preserve
          the error limit, and more studies now detect the same advantage. The exact power rises to
          about seventy-one percent. These sample sizes count disagreements; a full task study must
          also allow for how often models tie.
        hold: 0.85
        visual_cues:
          - id: power-grow
            phrase: sixty-four independent disagreements
            targets:
              - study-grid
            color: green
            linger: 0.45
          - id: power-large
            phrase: seventy-one percent
            targets:
              - power-receipt
            color: green
            linger: 0.45
  - id: search
    title: A winner can come from the search
    visual: Twenty independent null comparisons build a family-risk calculation, then the Bonferroni
      cutoff physically removes the weaker rejection bars.
    beats:
      - say: Imagine repeating that thirteen-disagreement test for twenty prompt variants whose results are
          independent under this example. Even when every variant has equal win chances, a family
          gets twenty opportunities for a false positive. The exact per-test error compounds to
          about sixty-one percent for at least one.
        hold: 0.6
        visual_cues:
          - id: search-variants
            phrase: twenty prompt variants
            targets:
              - variant-grid
            color: blue
            linger: 0.45
          - id: search-risk
            phrase: sixty-one percent
            targets:
              - family-risk
            color: pink
            linger: 0.45
      - say: Bonferroni spends the family error budget across all twenty comparisons. The smaller per-test
          threshold moves our rejection boundary from ten B wins to twelve. Only the farthest tail
          survives. The union bound keeps family error at most five percent even when comparisons
          depend on one another.
        hold: 0.8
        visual_cues:
          - id: search-budget
            phrase: across all twenty comparisons
            targets:
              - family-budget
            color: yellow
            linger: 0.45
          - id: search-tighten
            phrase: ten B wins to twelve
            targets:
              - search-tail
            color: yellow
            linger: 0.45
        motion_check:
          region:
            - 270
            - 400
            - 1320
            - 370
      - say: Repeated looks at one accumulating experiment create another search. This fixed null sequence
          crosses the nominal line once, then moves back above it. Stopping at the first crossing
          would select the favorable look. Fix the stopping rule in advance, use a valid sequential
          method, or keep a fresh set for the final comparison.
        hold: 0.6
        visual_cues:
          - id: peeking-path
            phrase: crosses the nominal line once
            targets:
              - peek-path
            color: pink
            linger: 0.45
          - id: peeking-return
            phrase: moves back above it
            targets:
              - peek-path
            color: blue
            linger: 0.45
  - id: variance-construction
    title: What changes when the prompts match?
    visual: Equal pass rates hide agreements within tasks. The 100-square population isolates joint
      passes before the paired and independent variances and reference widths are compared.
    beats:
      - say: Imagine a different task population. Each square stands for one percent of it. Each assistant
          passes half the tasks, so each has variance one quarter. Look at the top group. Both
          assistants pass together on forty-five percent. Now multiply A's zero or one by B's zero or
          one in each square. Only joint passes count. The average product is point four five. Subtract
          the product of the two half-pass rates. The difference, point two, is the covariance. A pass
          by one model tends to come with a pass by the other.
        hold: 0.85
        visual_cues:
          - id: variance-construction-0
            phrase: Each square stands for one percent of it
            targets:
              - variance-construction-construction
            color: cyan
            linger: 0.25
          - id: variance-product
            phrase: Now multiply A's zero or one by B's zero or one in each square
            targets:
              - variance-construction-construction
            color: cyan
            linger: 0.25
          - id: hyp-variance-covariance
            phrase: The difference, point two, is the covariance
            targets:
              - variance-construction-construction
            color: cyan
            linger: 0.25
            caption_boundary: true
      - say: How much would the lift vary over studies of forty independent pairs? Add the two marginal
          variances, subtract twice their covariance, then divide by forty. Here the numerator falls
          from one half to one tenth. That gives the smaller cyan bar. Now give A and B separate
          batches of forty independent tasks each. Both still pass half in the population. There's no
          shared-task covariance to subtract. The pink bar is five times as tall. Both bars measure
          variance of the difference in mean pass rates.
        hold: 0.85
        caption_starts:
          - Here the numerator falls
        visual_cues:
          - id: variance-construction-1
            phrase: Add the two marginal variances, subtract twice their covariance, then divide by forty
            targets:
              - variance-construction-construction
            color: cyan
            linger: 0.25
          - id: hyp-variance-paired-result
            phrase: That gives the smaller cyan bar
            targets:
              - variance-construction-construction
            color: cyan
            linger: 0.25
          - id: hyp-variance-independent-result
            phrase: The pink bar is five times as tall
            targets:
              - variance-construction-construction
            color: cyan
            linger: 0.25
            caption_boundary: true
      - say: Take the square root and we're back in percentage points. These are the two standard errors.
          Multiplying each by one point nine six gives the reference margins on the ruler. Pairing cuts
          the margin from about twenty-two points to about ten in this population. These widths use the
          known zero effect. In forty pairs we'd expect only four disagreements, so a normal interval
          can miss its intended coverage.
        hold: 0.85
        visual_cues:
          - id: variance-construction-2
            phrase: Take the square root
            targets:
              - variance-construction-construction
            color: cyan
            linger: 0.25
          - id: hyp-variance-standard-errors
            phrase: These are the two standard errors
            targets:
              - variance-construction-construction
            color: cyan
            linger: 0.25
          - id: hyp-variance-margins
            phrase: the reference margins on the ruler
            targets:
              - variance-construction-construction
            color: cyan
            linger: 0.25
            caption_boundary: true
      - say: What if the models pass on different kinds of tasks? Keep both pass rates at one half and make
          them agree less often. At zero covariance the paired and independent variances meet. With
          negative covariance the paired variance goes above the independent one. Go back to the
          original positive covariance. Now enlarge the independent batches until the pink line reaches
          the dot. It takes two hundred tasks per model to match forty pairs in this example. That's a
          variance comparison. Power also depends on the effect, the test and its threshold.
        hold: 0.85
        caption_starts:
          - At zero covariance
        visual_cues:
          - id: variance-construction-3
            phrase: What if the models pass on different kinds of tasks
            targets:
              - variance-construction-construction
            color: cyan
            linger: 0.25
          - id: hyp-variance-sign
            phrase: Keep both pass rates at one half and make them agree less often
            targets:
              - variance-construction-construction
            color: cyan
            linger: 0.25
          - id: hyp-variance-match
            phrase: Now enlarge the independent batches until the pink line reaches the dot
            targets:
              - variance-construction-construction
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: variance-negative
            phrase: With negative covariance the paired variance goes above the independent one
            targets:
              - variance-construction-construction
            color: cyan
            linger: 0.2
            caption_boundary: true
          - id: variance-reset
            phrase: Go back to the original positive covariance
            targets:
              - variance-construction-construction
            color: cyan
            linger: 0.2
            caption_boundary: true
  - id: paired-uncertainty
    title: How large could the improvement be?
    visual: Whole paired rows are resampled with replacement, keeping each source identity and both
      outcomes, before accumulating a lift histogram.
    beats:
      - say: The tail answered a question about the null. To estimate the size of the lift, draw forty whole
          task rows with replacement from our observed forty. The permission row can appear again.
          Its A failure and B pass travel together, so every draw still has a paired difference.
        hold: 0.75
        visual_cues:
          - id: bootstrap-draw
            phrase: draw forty whole task rows with replacement from our observed forty. The permission row can
              appear again
            targets:
