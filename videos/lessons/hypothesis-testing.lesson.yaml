            phrase: Keep the settings attached to those numbers
            targets:
              - report-contract-construction
            color: cyan
            linger: 0.25
          - id: hyp-report-missing
            phrase: B has run out of time
            targets:
              - report-contract-construction
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: report-timeout-score
            phrase: Score it under that policy
            targets:
              - report-contract-construction
            color: cyan
            linger: 0.25
            caption_boundary: true
      - say: Apply the same two-point minimum to a few possible intervals. First, the low end is plus one and
          the high end is plus fourteen. Every value is positive, yet a one-point gain could be too
          small to pay for B. Move just the low end to exactly two. Our rule says strictly above two,
          so we still hold. If the entire range sits below zero, we have evidence of a regression. If
          the range crosses zero, even the direction is unresolved. Keep that gold line where it is for
          the final comparison.
        hold: 0.85
        visual_cues:
          - id: report-contract-2
            phrase: the low end is plus one and the high end is plus fourteen
            targets:
              - report-contract-construction
            color: cyan
            linger: 0.25
          - id: hyp-report-equality
            phrase: Move just the low end to exactly two
            targets:
              - report-contract-construction
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: hyp-report-regression
            phrase: the entire range sits below zero
            targets:
              - report-contract-construction
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: hyp-report-zero
            phrase: the range crosses zero
            targets:
              - report-contract-construction
            color: cyan
            linger: 0.25
            caption_boundary: true
  - id: holdout
    title: Would you switch now?
    visual: Four hundred fresh pairs give a second interval below the development interval on one fixed
      ruler. The viewer compares their lower endpoints before the decision appears.
    beats:
      - say: Try the decision rule on a new illustrative holdout, collected once after freezing B. It has
          four hundred fresh matched tasks, with the same hidden-test policy and one attempt per
          model. Keep these rows separate from the development set. Fifty-two favor B, twelve favor
          A, and the rest agree.
        hold: 0.85
        visual_cues:
          - id: holdout-rows
            phrase: four hundred fresh matched tasks, with the same hidden-test policy and one attempt per model
            targets:
              - holdout-rows
            color: blue
            linger: 0.25
          - id: holdout-count
            phrase: Fifty-two favor B, twelve favor A, and the rest agree
            targets:
              - holdout-counts
            color: cyan
            linger: 0.25
            caption_boundary: true
      - say: Subtract the A-only wins and divide by all four hundred tasks. The lift is ten percentage
          points. Resampling these whole paired rows gives this new approximate interval. Compare
          its lower endpoint with our original useful-lift threshold. Which action does the frozen
          rule call for?
        hold: 2.4
        visual_cues:
          - id: holdout-lift
            phrase: The lift is ten percentage points
            targets:
              - holdout-lift
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: holdout-interval
            phrase: Resampling these whole paired rows gives this new approximate interval
            targets:
              - holdout-interval
            color: cyan
            linger: 0.25
          - id: holdout-lower
            phrase: Compare its lower endpoint with our original useful-lift threshold
            targets:
              - holdout-interval
              - holdout-ruler
            color: cyan
            linger: 0.25
          - id: holdout-predict
            phrase: Which action does the frozen rule call for
            targets:
              - holdout-question
              - holdout-interval
              - holdout-ruler
            color: yellow
            linger: 0.25
            caption_boundary: true
      - say: The low end is plus six and a quarter points. With one try per task, even that end
          clears our two-point cutoff. Switch to B.
        hold: 1.65
        caption_starts:
          - Switch to B
        visual_cues:
          - id: holdout-clearance
            phrase: even that end clears our two-point cutoff
            targets:
              - holdout-interval
              - holdout-ruler
            color: yellow
            linger: 0.25
          - id: release-receipt
            phrase: Switch to B
            targets:
              - holdout-interval
              - holdout-ruler
            color: cyan
            linger: 0.25
