scenes:
  - id: intro
    title: Where do the two chat inputs first differ?
    visual: The word “sing?” travels from a chat bubble into the two clients’ token strips. Compare
      their final positions, restore the missing assistant prefix and follow the IDs into the model.
    beats:
      - say: Follow the last word into both requests. Both clients send ID five. The weights match, too.
          Read across the approved row. Now compare the candidate. Where do their inputs first differ?
        hold: 2.4
        caption_starts:
          - Both clients send ID five
        visual_cues:
          - id: intro-reference
            phrase: Read across the approved row
            targets:
              - intro-inputs
            color: cyan
            linger: 0.25
          - id: intro-candidate
            phrase: Now compare the candidate
            targets:
              - intro-inputs
            color: cyan
            linger: 0.25
          - id: intro-question
            phrase: Where do their inputs first differ
            targets:
              - intro-inputs
            color: yellow
            linger: 0.25
            caption_boundary: true
      - say: Position seven. Both clients close the user turn at six. The approved client then opens an assistant
          turn. The candidate stops. Restore that opening marker and the assistant role. Now the inputs
          match all the way to the end. Keep the weights fixed and compare the scores for the first reply
          token.
        hold: 0.8
        visual_cues:
          - id: intro-position
            phrase: Position seven
            targets:
              - intro-inputs
            color: yellow
            linger: 0.25
          - id: intro-restore
            phrase: Restore that opening marker and the assistant role
            targets:
              - intro-inputs
            color: cyan
            linger: 0.25
          - id: intro-check
            phrase: compare the scores for the first reply token
            targets:
              - intro-inputs
            color: cyan
            linger: 0.25
      - say: Those numbers are what reach the model. Hugging Face Transformers reads the configuration to choose
          a model class, then loads the saved tensors into it. The class runs on PyTorch. One forward pass
          gives scores for the next token. The generation loop uses those scores to choose what comes next.
          A trainer and a compatible serving system can use that same model definition.
        hold: 0.7
        visual_cues:
          - id: intro-class
            phrase: choose a model class
            targets:
              - intro-forward
            color: cyan
            linger: 0.25
          - id: intro-weights
            phrase: loads the saved tensors into it
            targets:
              - intro-forward
            color: cyan
            linger: 0.25
          - id: intro-logits
            phrase: One forward pass gives scores for the next token
            targets:
              - intro-forward
            color: cyan
            linger: 0.25
          - id: intro-selection
            phrase: choose what comes next
            targets:
              - intro-forward
            color: cyan
            linger: 0.25
  - id: four-contracts
    title: A successful parse still leaves other contracts to check
    visual: "One same checkpoint record keeps four independently checked fields: immutable identity,
      architecture dimensions, parameter restoration and input/output semantics. An actual
      vocabulary mismatch fails restoration; a same-shape positional-rule mismatch survives loading
      but fails a known input."
    beats:
      - say: A checkpoint needs four agreements. Identity selects the actual snapshot. Configuration defines
          the architecture and dimensions. Parameters restore values into expected tensor names and
          shapes. Input and output rules give those tensors meaning. A valid safetensors file can
          pass parsing while one of the other agreements is broken.
        hold: 0.7
        visual_cues:
          - id: hf-four-contracts-0
            phrase: A checkpoint needs four agreements. Identity selects the actual snapshot. Configuration
              defines the architecture and dimensions. Parameters restore values into expected
              tensor names and shapes. Input and output rules give those tensors meaning. A valid
              safetensors file can pass parsing while one of the other agreements is broken.
            targets:
              - hf-four-contracts-mechanism
            color: cyan
            linger: 0.2
      - say: For a declared shape example, configuration requests thirty-two thousand embedding rows, but
          the supplied shard contains thirty-two thousand and one. The vocabulary dimension cannot
          be restored into that expected tensor. Separately, a shape-compatible custom class might
          load the same arrays while applying a different positional rule. A known-input numerical
          test detects that second problem after allocation succeeds.
        hold: 0.7
        visual_cues:
          - id: hf-four-contracts-1
            phrase: For a declared shape example, configuration requests thirty-two thousand embedding rows, but
              the supplied shard contains thirty-two thousand and one. The vocabulary dimension
              cannot be restored into that expected tensor. Separately, a shape-compatible custom
              class might load the same arrays while applying a different positional rule. A
              known-input numerical test detects that second problem after allocation succeeds.
            targets:
              - hf-four-contracts-mechanism
            color: cyan
            linger: 0.2
      - say: Classify the first failing boundary. An unknown model type points to config or installed
          support. Missing keys point to the index, class or conversion. A size mismatch points to
          dimensions or export. A parse error points to artifact integrity. Wrong roles point to
          preprocessing; a precision change points to dtype. Preserve the first error and its exact
          inputs before changing another layer.
        hold: 0.7
        visual_cues:
          - id: hf-four-contracts-2
            phrase: Classify the first failing boundary. An unknown model type points to config or installed
              support. Missing keys point to the index, class or conversion. A size mismatch points
              to dimensions or export. A parse error points to artifact integrity. Wrong roles point
              to preprocessing; a precision change points to dtype. Preserve the first error and its
              exact inputs before changing another layer.
            targets:
              - hf-four-contracts-mechanism
            color: cyan
            linger: 0.2
