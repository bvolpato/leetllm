      extra insertion and compare the arrays.
    beats:
      - say: Here is the whole bird question from the opening. This little vocabulary gives each piece a number.
          The template opens the user turn, inserts the words, and closes the turn. Then it opens the
          assistant turn. Look at the ends of the two strips. This client has the assistant prefix in
