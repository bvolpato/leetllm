  - id: lifecycle
    title: Configuration, initialization and restoration are different operations
    visual: A config-only object creates shapes, construction allocates and initializes actual tiny
      tensors, weight tying joins two references, and restoration replaces their values before
      model-only save leaves tokenizer state outside its bundle.
    beats:
      - say: A configuration records hyperparameters and options without creating all model parameters.
          Construction builds the module hierarchy. Weight initialization supplies values for a new
          model, and post-initialization collects model properties and configured ties. Tying input
          embeddings to the output head means two uses share a parameter; each model family and
          configuration decides whether that tie applies.
        hold: 0.7
        visual_cues:
          - id: hf-lifecycle-0
            phrase: A configuration records hyperparameters and options without creating all model parameters.
              Construction builds the module hierarchy. Weight initialization supplies values for a
              new model, and post-initialization collects model properties and configured ties.
              Tying input embeddings to the output head means two uses share a parameter; each model
              family and configuration decides whether that tie applies.
            targets:
              - hf-lifecycle-mechanism
            color: cyan
            linger: 0.2
      - say: Loading pretrained weights resolves files, builds the compatible architecture, restores tensor
          values and sets evaluation mode. That mode controls training-dependent module behavior; it
          does not disable gradient recording. The actual CPU lab runs backward after calling eval,
          and its tied input and output weights are the same parameter object.
        hold: 0.7
        visual_cues:
          - id: hf-lifecycle-1
            phrase: Loading pretrained weights resolves files, builds the compatible architecture, restores
              tensor values and sets evaluation mode. That mode controls training-dependent module
              behavior; it does not disable gradient recording. The actual CPU lab runs backward
              after calling eval, and its tied input and output weights are the same parameter
              object.
            targets:
              - hf-lifecycle-mechanism
            color: cyan
            linger: 0.2
      - say: Saving pretrained model state writes configuration and weights, with sharding metadata when
          needed and generation configuration for a generative model. Save the tokenizer or
          processor separately. A directory containing model weights alone does not reproduce the
          conversation serialization that produced their inputs. Keep each saved artifact in the
          release receipt.
        hold: 0.7
        visual_cues:
          - id: hf-lifecycle-2
            phrase: Saving pretrained model state writes configuration and weights, with sharding metadata when
              needed and generation configuration for a generative model. Save the tokenizer or
              processor separately. A directory containing model weights alone does not reproduce
              the conversation serialization that produced their inputs. Keep each saved artifact in
              the release receipt.
            targets:
              - hf-lifecycle-mechanism
            color: cyan
            linger: 0.2
  - id: load-safety
    title: What does the loader read, and what can it run?
    visual: A single snapshot enters separate dtype and deserialization gates. The first floating weight
      determines the documented fallback dtype when configuration has no dtype; safetensors remains
      distinct from the custom Python import.
    beats:
      - say: With the default auto setting shown here, the loader reads the dtype saved in the configuration. If
          that field is missing, it checks the first floating-point weight. That tells you how the
          weights were saved. A training run can use several precisions. When comparing two releases,
          set the intended dtype and inspect a loaded parameter. Older examples call the option
          torch-dtype.
        hold: 0.7
        visual_cues:
          - id: hf-load-safety-0
            phrase: the first floating-point weight
            targets:
              - hf-load-safety-mechanism
            color: cyan
            linger: 0.2
      - say: The file on the left holds tensors. Safetensors reads their values without unpickling
          Python objects. Check their names and shapes against the model class. On the right is a
          Python file that defines a custom class. Allowing that import lets the code run with the
          permissions of your process.
        hold: 0.7
        visual_cues:
          - id: hf-load-safety-1
            phrase: Allowing that import lets the code run with the permissions of your process
            targets:
              - hf-load-safety-mechanism
            color: cyan
            linger: 0.2
      - say: If the loader reports an unknown family, check which families your installed version
          supports. If you need custom code, pin the model and code revisions, review the source and
          its dependencies, and test with limited permissions. Check the licenses on the weights and
          datasets as well. The Apache license covers the Transformers library.
        hold: 0.7
        visual_cues:
          - id: hf-load-safety-2
            phrase: test with limited permissions
            targets:
              - hf-load-safety-mechanism
            color: cyan
            linger: 0.2
  - id: offload-execution
    title: Storage placement does not name the execution device
    visual: Meta shapes acquire real shard bytes on two GPUs and CPU/disk storage. One CPU-stored layer
      moves into the main GPU execution slot, receives its input, computes, and releases the
      temporary copy; cache and workspace remain in that same live ledger.
    beats:
      - say: Accelerate’s big-model inference path can create a meta-device skeleton with parameter shapes
          and dtypes but no parameter data. Python objects and metadata still occupy memory. A map
          then plans submodule placement, respects protected unsplit blocks and loads checkpoint
          data into its destinations. This avoids requiring a full randomly initialized parameter
          copy first.
        hold: 0.7
        visual_cues:
          - id: hf-offload-execution-0
            phrase: Accelerate’s big-model inference path can create a meta-device skeleton with parameter
              shapes and dtypes but no parameter data. Python objects and metadata still occupy
              memory. A map then plans submodule placement, respects protected unsplit blocks and
              loads checkpoint data into its destinations. This avoids requiring a full randomly
              initialized parameter copy first.
            targets:
              - hf-offload-execution-mechanism
            color: cyan
            linger: 0.2
      - say: "When a GPU-backed dispatch map offloads a layer to CPU or disk, hooks move that layer’s
          weights to the main execution device before use and clean up temporary device storage
          afterward. Disk data first crosses host memory. A CPU-only map executes on CPU. Read the
          actual device map and hooks: a storage label does not promise an additional concurrent
          worker."
        hold: 0.7
        visual_cues:
          - id: hf-offload-execution-1
            phrase: "When a GPU-backed dispatch map offloads a layer to CPU or disk, hooks move that layer’s
              weights to the main execution device before use and clean up temporary device storage
              afterward. Disk data first crosses host memory. A CPU-only map executes on CPU. Read
              the actual device map and hooks: a storage label does not promise an additional
              concurrent worker."
            targets:
              - hf-offload-execution-mechanism
            color: cyan
            linger: 0.2
      - say: For a supplied memory worksheet, resident weights occupy six gibibytes, the current offloaded
          layer needs two, live cache needs three and workspace needs one. These separate
          allocations total twelve gibibytes at use time. A ten-gibibyte device cannot admit that
          live set even when its six resident weight gibibytes fit. This sequential inference
          placement is distinct from training-state sharding and tensor-parallel execution.
        hold: 0.7
        visual_cues:
          - id: hf-offload-execution-2
            phrase: For a supplied memory worksheet, resident weights occupy six gibibytes, the current
              offloaded layer needs two, live cache needs three and workspace needs one. These
              separate allocations total twelve gibibytes at use time. A ten-gibibyte device cannot
              admit that live set even when its six resident weight gibibytes fit. This sequential
              inference placement is distinct from training-state sharding and tensor-parallel
              execution.
            targets:
              - hf-offload-execution-mechanism
            color: cyan
            linger: 0.2
          - id: hf-offload-total
            phrase: These separate allocations total twelve gibibytes at use time.
            targets:
              - hf-offload-execution-mechanism
            color: green
            linger: 0.35
