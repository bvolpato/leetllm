  - id: tokenizer-fields
    title: Token IDs retain truncation, span and role meaning
    visual: The same message retains vocabulary pieces, special-token IDs, attention mask and source
      span mapping. A declared left-truncation removes the oldest visible policy in one explicit
      example while a retained offset points back to the original word.
    beats:
      - say: A tokenizer defines vocabulary pieces, merge rules, special tokens, padding, truncation and
          attention masks. Optional offset mappings connect token spans to original text for
          extraction tasks. A truncation policy can remove the very instruction or evidence the
          model needs; the same visible user sentence does not establish the same complete input.
        hold: 0.7
        visual_cues:
          - id: hf-tokenizer-fields-0
            phrase: A tokenizer defines vocabulary pieces, merge rules, special tokens, padding, truncation and
              attention masks. Optional offset mappings connect token spans to original text for
              extraction tasks. A truncation policy can remove the very instruction or evidence the
              model needs; the same visible user sentence does not establish the same complete
              input.
            targets:
              - hf-tokenizer-fields-mechanism
            color: cyan
            linger: 0.2
      - say: The local example pairs a small word vocabulary with a Jinja template in the fast
          tokenizer. Its ChatML-style markers surround the system and user messages and open the
          assistant turn. Tokenize in the template call, or render first and turn off extra special
          tokens in the tokenizer. Both paths give the same IDs here. For another checkpoint, load its
          own template and check which tokenizer backend its release supports.
        hold: 0.7
