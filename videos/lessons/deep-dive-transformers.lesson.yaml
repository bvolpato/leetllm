  - id: decoding-policy
    title: Resolve selection and stopping policy around the same logits
    visual: A fixed logit row becomes a temperature-scaled distribution, an actual top-k keep-set and a
      selected token. Separate greedy/beam/assisted branches retain the same model forward, and the
      returned sequence explicitly contains its input prefix.
    beats:
      - say: With sampling off and one beam, the model picks the highest score at each step. Leave the
          beam count at three and you get beam search. It ranks partial replies and keeps three. A
          reply pruned at this step can never win later, even if it would have had the highest final
          score. Assisted decoding uses a draft model or another candidate generator and asks the
          target model to verify the proposed tokens.
        hold: 0.7
        visual_cues:
          - id: hf-decoding-policy-0
            phrase: Leave the beam count at three
            targets:
              - hf-decoding-policy-mechanism
            color: cyan
            linger: 0.2
      - say: Try sampling from three logits, two, one and zero. Temperature one leaves them unchanged.
          Top-k two keeps the first two. Subtract the largest logit and exponentiate. The two weights
          are one and e to the minus one. Divide each by their sum. The first token gets about
          seventy-three percent of the probability and the second gets twenty-seven percent. A draw
          can pick either.
        hold: 0.7
        visual_cues:
          - id: hf-decoding-policy-1
            phrase: Top-k two keeps the first two
            targets:
              - hf-decoding-policy-mechanism
            color: cyan
            linger: 0.2
          - id: hf-sampling-probs
            phrase: The first token gets about seventy-three percent of the probability and the second
              gets twenty-seven percent
            targets:
              - hf-decoding-policy-mechanism
            color: green
            linger: 0.35
      - say: Top-p instead keeps a high-probability set reaching its configured cumulative threshold under
          the selected implementation. Stop IDs, repetition controls and maximum new tokens also
          change the loop. Record the resolved GenerationConfig. Decoder-only returned sequences
          include the input prefix, so slice by the actual prompt tensor width when the caller needs
          only completion IDs. Then compare token IDs before decoding strings.
        hold: 0.7
        visual_cues:
          - id: hf-decoding-policy-2
            phrase: Top-p instead keeps a high-probability set reaching its configured cumulative threshold
              under the selected implementation. Stop IDs, repetition controls and maximum new
              tokens also change the loop. Record the resolved GenerationConfig. Decoder-only
              returned sequences include the input prefix, so slice by the actual prompt tensor
              width when the caller needs only completion IDs. Then compare token IDs before
              decoding strings.
            targets:
