scenes:
  - id: intro
    title: Would you send this reply?
    visual: A message about restoring a revoked key slides up beside a calendar with the saved thirty-day reply. The reply line stays empty. A retention question gets the full saved sentence after review, and a live incident question goes to its own source.
    beats:
      - say: “Can I restore a revoked API key?” The cache suggests this reply about thirty days. Would you send it?
        hold: 2.2
        visual_cues:
          - id: second-reader
            phrase: Can I restore a revoked API key
            targets: [incoming-question, stored-value]
            color: cyan
            linger: 0.28
        caption_starts:
          - The cache suggests
      - say: Thirty days tells us how long the key stays in the audit log. This reader needs the restoration rule. Fetch the current policy before replying.
        hold: 0.8
        visual_cues:
          - id: restoration-rule
            phrase: needs the restoration rule
            targets: [requested-field]
            color: yellow
            linger: 0.28
          - id: read-policy
            phrase: Fetch the current policy
            targets: [reply-slot]
            color: cyan
            linger: 0.28
        caption_starts:
          - This reader needs
          - Fetch the current policy
      - say: Now try “How long do revoked keys stay in audit logs?” Compare that with the original question. Different wording gives the two questions different exact keys, so exact lookup misses. Semantic search finds the saved question by meaning. Both readers need the retention period. The caller has access, the answer is approved, and the policy is current. Send the saved reply.
        hold: 1.1
        visual_cues:
          - id: paraphrase
            phrase: How long do revoked keys stay in audit logs
            targets: [incoming-question, saved-question]
            color: cyan
            linger: 0.28
          - id: different-key
            phrase: different exact keys
            targets: [exact-keys]
            color: blue
            linger: 0.28
          - id: name-duration
            phrase: Both readers need the retention period
            targets: [requested-field]
            color: yellow
            linger: 0.28
          - id: retention-answer
            phrase: Send the saved reply
            targets: [reply-slot]
            color: green
            linger: 0.28
        caption_starts:
          - Different wording
          - Semantic search finds
          - Both readers need
          - Send the saved reply
      - say: Now the reader asks for an incident’s current status. That can change from minute to minute. The caller has access, so the incident route reads the live record and skips the answer cache.
        hold: 0.8
        visual_cues:
          - id: live-question
            phrase: an incident’s current status
            targets: [incoming-question]
            color: cyan
            linger: 0.28
          - id: bypass-live
            phrase: reads the live record
            targets: [reply-slot]
            color: cyan
            linger: 0.28
        caption_starts:
          - The caller has access
  - id: request-contract
    title: What makes this answer reusable?
    visual: The saved thirty-day response sits beside its source question. Trusted route, permission, review
      and release fields identify the conditions for reuse.
    beats:
      - say: We would send the whole saved response, including the words about the audit log. That is what a
          response cache stores. Now imagine the next message just says, “What about mine?” We need the
          earlier conversation to know what “mine” means. That follow-up leaves the reusable class. So
          does a live incident read. And a request to revoke a key needs an authorized action, which a
          saved sentence cannot perform.
        hold: 0.7
        visual_cues:
          - id: sc-request-contract-b0
            phrase: We would send the whole saved response, including the words about the audit log. That is what a
              response cache stores. Now imagine the next message just says, “What about mine?” We need
              the earlier conversation to know what “mine” means. That follow-up leaves the reusable
              class. So does a live incident read. And a request to revoke a key needs an authorized
              action, which a saved sentence cannot perform.
            targets:
              - sc-request-contract-mechanism
            color: cyan
            linger: 0.4
      - say: Suppose the question stays the same but the policy changes. Give the model, prompt, policy and
          runtime a release identity. Bind the answer to its corpus, tenant, access scope, language and
          response format. If account state, tools or generation settings can change the answer, include
          that dependency in the key or route those requests separately.
        hold: 0.7
        visual_cues:
          - id: sc-request-contract-b1
            phrase: Suppose the question stays the same but the policy changes. Give the model, prompt, policy
              and runtime a release identity. Bind the answer to its corpus, tenant, access scope,
              language and response format. If account state, tools or generation settings can change the
              answer, include that dependency in the key or route those requests separately.
            targets:
              - sc-request-contract-mechanism
            color: cyan
            linger: 0.4
  - id: exact-bytes
    title: Build the response key from unchanged text and full scope
    visual: The unchanged request text, route and compound scope produce an exact key. A different question or release changes the key. Case-sensitive code identifiers show why normalization requires evidence.
    beats:
      - say: Hash the original text with the full scope and route ID. Repeat the same request and you get
          the same key. A paraphrase and a new release produce different keys. A request from the wrong
          tenant stops before hashing. For a matching key, check the record and the caller’s current
          access before serving it.
        hold: 0.7
        visual_cues:
          - id: sc-exact-bytes-b0
            phrase: Hash the original text with the full scope and route ID. Repeat the same request and you
              get the same key. A paraphrase and a new release produce different keys. A request from the
              wrong tenant stops before hashing. For a matching key, check the record and the caller’s
              current access before serving it.
            targets:
              - sc-exact-bytes-mechanism
            color: cyan
            linger: 0.4
          - id: sc-exact-different
            phrase: a paraphrase and a new release produce different keys
            targets:
              - sc-exact-bytes-mechanism
            color: cyan
            linger: 0.4
      - say: Look at the capital letters in User ID and the extra space in the last pair. Lowercasing an
          identifier or collapsing a space inside code can merge two questions that need different
          answers. Preserve the original bytes unless the application has tested that change. Trusted
          middleware supplies the tenant, route and permission. The request type checks required text,
          field names and Boolean flags.
        hold: 0.7
        visual_cues:
          - id: sc-exact-bytes-b1
            phrase: Look at the capital letters in User ID and the extra space in the last pair. Lowercasing an
              identifier or collapsing a space inside code can merge two questions that need different
              answers. Preserve the original bytes unless the application has tested that change. Trusted
              middleware supplies the tenant, route and permission. The request type checks required
              text, field names and Boolean flags.
            targets:
              - sc-exact-bytes-mechanism
            color: cyan
            linger: 0.4
  - id: current-authorization
    title: Check the current caller on both cache paths
    visual: The caller loses access while the record stays admitted and unexpired. Authorization stops both response-cache paths before lookup.
    beats:
      - say: Yesterday this caller could read the document. Today the role and tenant still match, but the
          document owner can revoke that permission. Authenticate the caller and check access to the
          resource on every request, including exact hits. For a private answer, serve it only when you
          can verify current access and the versions of its source documents.
        hold: 0.7
        visual_cues:
          - id: sc-current-authorization-b0
            phrase: Yesterday this caller could read the document. Today the role and tenant still match, but
              the document owner can revoke that permission. Authenticate the caller and check access to
              the resource on every request, including exact hits. For a private answer, serve it only
              when you can verify current access and the versions of its source documents.
            targets:
              - sc-current-authorization-mechanism
            color: cyan
            linger: 0.4
      - say: The permission service supplies a Boolean. A missing value, a string or the number one fails
          validation. Watch the flag turn false. This caller receives denial before lookup, and
          generation stops there too. If an authorized caller hits a cache timeout instead, the
          application can still fetch a fresh answer.
        hold: 0.7
        visual_cues:
          - id: sc-current-authorization-b1
            phrase: The permission service supplies a Boolean. A missing value, a string or the number one
              fails validation. Watch the flag turn false. This caller receives denial before lookup, and
              generation stops there too. If an authorized caller hits a cache timeout instead, the
              application can still fetch a fresh answer.
            targets:
              - sc-current-authorization-mechanism
            color: cyan
            linger: 0.4
          - id: sc-auth-deny
            phrase: receives denial before lookup
            targets:
              - sc-current-authorization-mechanism
            color: cyan
            linger: 0.4
  - id: geometry
    title: Similarity measures direction in representation space
    visual: Normalized two-dimensional question vectors rotate from a valid paraphrase to a nearby exception
      question. Cosines and cosine distances are calculated from those same vectors, with a magnified score
      axis beside the equal-scale geometry.
    beats:
      - say: >
          Represent the stored question as a vector pointing right. Normalize a new question's vector and
          compare their directions. Cosine similarity is the dot product of these unit vectors. The valid
          paraphrase points almost the same way, so its score sits close to one.
        hold: 0.65
        visual_cues:
          - id: stored-direction
            phrase: stored question as a vector pointing right
            targets:
              - stored-vector
            color: blue
            linger: 0.5
          - id: unit-similarity
            phrase: Cosine similarity is the dot product of these unit vectors
            targets:
              - query-vector
              - similarity-readout
            color: yellow
            linger: 0.5
      - say: >
          Now rotate toward a question about restoring a revoked key. It shares vocabulary with the retention
          policy but asks for a different fact. The angle remains small. A representation can capture related
          subject matter while the stored answer fails to answer the actual question.
        hold: 0.65
        visual_cues:
          - id: rotate-question
            phrase: rotate toward a question about restoring a revoked key
            targets:
              - query-vector
              - similarity-readout
            color: pink
            linger: 0.5
        motion_check:
          region:
            - 150
            - 350
            - 1570
            - 510
          minimumChangedFraction: 0.002
      - say: >
          Some indexes return cosine distance, which is one minus similarity. The same candidate therefore has
          a small distance and a large similarity. Check the metric and comparison direction in your
          implementation. An apparently reasonable threshold can reverse the selection if those definitions
          get mixed.
        hold: 0.65
        visual_cues:
          - id: distance-definition
            phrase: cosine distance, which is one minus similarity
            targets:
              - similarity-readout
              - distance-readout
            color: cyan
            linger: 0.5
  - id: numeric-geometry
    title: How close are these two questions?
    visual: Both questions are compared to the same unit vector. The dot product and length of each new
      vector appear beneath its plot before their quotient is revealed. A second example rescales large
      coordinates before normalization.
    beats:
      - say: Use the blue direction, one across and zero up, for both comparisons. Its length is one, so
          the dot product picks out the first coordinate of each question. On the left, divide point nine
          nine by the length printed underneath. The paraphrase scores about point nine nine nine two.
          Try the same division on the right. Restoration scores about point nine nine four four. These
          two directions are close even though only the left question asks for a duration.
        hold: 0.7
        visual_cues:
          - id: sc-numeric-geometry-b0
            phrase: Use the blue direction, one across and zero up, for both comparisons. Its length is one, so
              the dot product picks out the first coordinate of each question. On the left, divide point
              nine nine by the length printed underneath. The paraphrase scores about point nine nine
              nine two. Try the same division on the right. Restoration scores about point nine nine four
              four. These two directions are close even though only the left question asks for a
              duration.
            targets:
              - sc-numeric-geometry-mechanism
            color: cyan
            linger: 0.4
          - id: sc-cosine-paraphrase
            phrase: scores about point nine nine nine two
            targets:
              - sc-numeric-geometry-mechanism
            color: cyan
            linger: 0.4
          - id: sc-cosine-exception
            phrase: scores about point nine nine four four
            targets:
              - sc-numeric-geometry-mechanism
            color: cyan
            linger: 0.4
        caption_starts:
          - The paraphrase scores
          - Try the same division
          - Restoration scores
      - say: Now look at the two huge vectors. Squaring a coordinate this large can overflow. Divide each vector
          by its largest absolute coordinate first. Their directions stay the same. After normalization
          the two products cancel, giving a cosine of zero. Reject zero vectors, empty or unequal
          dimensions, Boolean coordinates and nonfinite numbers. The final clamp to minus one through one
          handles small rounding errors. This calculation checks the supplied vectors. Their usefulness
          for matching answers still needs review.
        hold: 0.7
        visual_cues:
          - id: sc-numeric-geometry-b1
            phrase: Now look at the two huge vectors. Squaring a coordinate this large can overflow. Divide each
              vector by its largest absolute coordinate first. Their directions stay the same. After
              normalization the two products cancel, giving a cosine of zero. Reject zero vectors, empty
              or unequal dimensions, Boolean coordinates and nonfinite numbers. The final clamp to minus
              one through one handles small rounding errors. This calculation checks the supplied vectors.
              Their usefulness for matching answers still needs review.
            targets:
              - sc-numeric-geometry-mechanism
            color: cyan
            linger: 0.4
  - id: retrieval-scope
    title: Restrict candidate retrieval before inspecting a result
    visual: A tenant filter limits which records enter nearest-neighbor search. The returned record receives another scope check. A logging-only label leaves both tenants eligible for retrieval.
    beats:
      - say: The caller can read public documents from release seven. Only A and D belong in that search. B
          belongs to another tenant. C comes from another release. Apply the tenant and permission
          filters in the index query. Whether the search is exact or approximate, recheck current access,
          versions and approval on the record it returns.
        hold: 0.7
        visual_cues:
          - id: sc-retrieval-scope-b0
            phrase: The caller can read public documents from release seven. Only A and D belong in that
              search. B belongs to another tenant. C comes from another release. Apply the tenant and
              permission filters in the index query. Whether the search is exact or approximate, recheck
              current access, versions and approval on the record it returns.
            targets:
              - sc-retrieval-scope-mechanism
            color: cyan
            linger: 0.4
      - say: RedisVL lets you store filter fields with an entry. Its default read searches the whole cache,
          so include the filter expression on each lookup. Redis cosine distance runs from zero to two.
          Closer questions have a smaller distance. Subtract the minimum similarity of point nine nine
          five from one. That gives a maximum distance of point zero zero five.
        hold: 0.7
        visual_cues:
          - id: sc-retrieval-scope-b1
            phrase: RedisVL lets you store filter fields with an entry. Its default read searches the whole
              cache, so include the filter expression on each lookup. Redis cosine distance runs from
              zero to two. Closer questions have a smaller distance. Subtract the minimum similarity of
              point nine nine five from one. That gives a maximum distance of point zero zero five.
            targets:
              - sc-retrieval-scope-mechanism
            color: cyan
            linger: 0.4
          - id: sc-distance-cutoff
            phrase: maximum distance of point zero zero five
            targets:
              - sc-retrieval-scope-mechanism
            color: cyan
            linger: 0.4
        caption_starts:
          - That gives a maximum distance
  - id: route-order
    title: Which check stops the request?
    visual: Two request traces stop at different columns. A second pair shares an invalid supplied score and
      an expiry but differs by one second on the clock. Only the unexpired record reaches the score check.
      A nearby restoration question then passes the numeric screen and fails offline review.
    beats:
      - say: Start with two requests and a valid active scope. The first caller has lost permission and the
          route is unknown. Deny that caller at the permission check. The second caller has access but
          needs live incident state. Bypass answer lookup at the route check. Neither request receives a
          candidate score. With permission, an unknown route also bypasses. The trusted route handles
          writes separately. History-dependent requests bypass before we check request scope or derive a
          lookup key.
        hold: 0.8
        visual_cues:
          - id: deny-first
            phrase: Deny that caller at the permission check
            targets:
              - gate-trace
            color: pink
            linger: 0.28
          - id: live-bypass
            phrase: Bypass answer lookup at the route check
            targets:
              - gate-trace
            color: yellow
            linger: 0.28
      - say: Now take two eligible reads with the right encoder and index. Validate the record type, clock and
          scope. Both test inputs supply an invalid score. The first clock lands exactly at expiry. That
          read stops at expiry, before admission or score. The other clock is one second earlier. Its
          record is fresh and its approval matches. This read reaches the invalid score and rejects it. A
          usable score must be a finite number from minus one through one. A Boolean fails that check.
        hold: 0.8
        visual_cues:
          - id: sc-record-expired
            phrase: That read stops at expiry
            targets:
              - gate-trace
            color: pink
            linger: 0.28
          - id: sc-record-invalid-score
            phrase: This read reaches the invalid score
            targets:
              - gate-trace
            color: yellow
            linger: 0.28
      - say: Take the restoration question with a valid score. At the initial cutoff of point nine nine zero, a
          score equal to the minimum would pass. This one clears it. The cache proposes the retention
          answer. The reviewer spots the missing restoration rule. That label lets us diagnose the pair in
          shadow. A new question in production arrives without the reviewer’s label.
        hold: 0.9
        visual_cues:
          - id: sc-structural-wrong
            phrase: The cache proposes the retention answer
            targets:
              - score-result
            color: yellow
            linger: 0.28
  - id: index-contract
    title: Version retrieval geometry separately from answer content
    visual: The approved answer remains in place while the retrieval policy changes. A new encoder requires new question vectors. A search-only change can retain the vectors, and both changes need a new evaluation.
    beats:
      - say: A cutoff goes with the system that produced the scores. Record the encoder, preprocessing and
          search settings, how the index chooses a candidate, and which traffic you evaluated. The index
          version points to that manifest. At startup, check that the loaded components match it.
        hold: 0.7
        visual_cues:
          - id: sc-index-contract-b0
            phrase: A cutoff goes with the system that produced the scores. Record the encoder, preprocessing
              and search settings, how the index chooses a candidate, and which traffic you evaluated.
              The index version points to that manifest. At startup, check that the loaded components
              match it.
            targets:
              - sc-index-contract-mechanism
            color: cyan
            linger: 0.4
      - say: Change the encoder or its preprocessing and the same question can land at new coordinates.
          Re-embed the saved questions and evaluate the new pairs. If you change only the search policy,
          you can keep compatible vectors and test which answers now make the cutoff. The approved reply
          still says thirty days. Its contents have their own review.
        hold: 0.7
        visual_cues:
          - id: sc-index-contract-b1
            phrase: Change the encoder or its preprocessing and the same question can land at new coordinates.
              Re-embed the saved questions and evaluate the new pairs. If you change only the search
              policy, you can keep compatible vectors and test which answers now make the cutoff. The
              approved reply still says thirty days. Its contents have their own review.
            targets:
              - sc-index-contract-mechanism
            color: cyan
            linger: 0.4
  - id: threshold
    title: Where would you put the cutoff?
    visual: Five eligible, reviewed question pairs occupy separate rows on one fixed similarity scale. The
      yellow line moves across restoration and then across three acceptable pairs. The proposed rows
      supply both metric numerators.
    beats:
      - say: Here are five public-policy questions that made it to search. Reviewers compared each one with the
          thirty-day answer. The four blue rows need a duration. The pink row asks whether a key can be
          restored. Start at point nine nine zero. Every dot meets the minimum, so the cache proposes all
          five in shadow. If we move the line to point nine nine five, which request drops out?
        hold: 2.2
        visual_cues:
          - id: proposed-hits
            phrase: proposes all five in shadow
            targets:
              - score-board
              - selection-counts
            color: yellow
            linger: 0.28
      - say: Move the line to point nine nine five. It passes the restoration question and stops on the FAQ
          wording. A score equal to the minimum qualifies, so the FAQ stays. All four proposals now have
          the right answer. That gives us four out of four for precision. We also kept all four acceptable
          pairs.
        hold: 0.75
        visual_cues:
          - id: raise-threshold
            phrase: Move the line to point nine nine five
            targets:
              - score-board
            color: yellow
            linger: 0.28
          - id: improve-precision
            phrase: four out of four for precision
            targets:
              - selection-counts
            color: cyan
            linger: 0.28
        caption_starts:
          - It passes the restoration question
      - say: Move the line again, to point nine nine nine. Only the top paraphrase survives. One correct
          proposal out of one still gives perfect precision. Count back down the four blue rows. We found
          just one of the four acceptable pairs. That fraction is recall on these labeled pairs.
        hold: 0.8
        visual_cues:
          - id: strict-threshold
            phrase: Move the line again, to point nine nine nine
            targets:
              - score-board
            color: yellow
            linger: 0.28
          - id: reuse-tradeoff
            phrase: one of the four acceptable pairs
            targets:
              - selection-counts
            color: cyan
            linger: 0.28
        caption_starts:
          - Only the top paraphrase survives
  - id: shadow-population
    title: Which requests belong in the denominator?
    visual: Seven request IDs stay in fixed columns. Rows show membership among all requests, eligible
      requests, proposals and acceptable proposals. The counts and both proposal-rate fractions come from
      the same replay.
    beats:
      - say: Put the two bypassed requests back beside our five candidates. One needs live state and one asks
          for a write. Follow those last two columns down. Both end before search. At the loose cutoff we
          proposed five answers, and four were acceptable. Precision uses those five proposals. For the
          fraction of all requests that received a proposal, count all seven at the top. Shadow mode still
          serves fresh answers.
        hold: 0.7
        visual_cues:
          - id: shadow-seven
            phrase: Follow those last two columns down
            targets:
              - population
            color: cyan
            linger: 0.28
      - say: Return to point nine nine five. Restoration drops out of the proposed row. Read the two fractions
          below. Four of seven requests received a proposal. Among the five that were eligible, four
          received one. Every proposed pair was acceptable, and every acceptable pair was proposed.
        hold: 0.7
        visual_cues:
          - id: sc-shadow-four
            phrase: Return to point nine nine five
            targets:
              - population
              - population-ratios
            color: yellow
            linger: 0.28
      - say: At point nine nine nine, only the first column reaches the bottom. We still got every proposal
          right, but found just one of the four acceptable pairs. On a fixed set, moving the line to the
          right can only remove proposals. Whether precision improves depends on which ones leave.
        hold: 0.7
        visual_cues:
          - id: sc-shadow-one
            phrase: At point nine nine nine
            targets:
              - population
              - population-ratios
            color: yellow
            linger: 0.28
  - id: unseparable-exception
    title: Can one cutoff still separate these questions?
    visual: The restoration dot travels along its own row as its supplied vector changes. The moving cutoff
      sweeps across all four retention rows before it can exclude restoration. A separately evaluated
      retention-only route changes eligibility before scoring.
    beats:
      - say: Put the cutoff back at point nine nine five. Keep the four retention questions and all the review
          labels. Change just the restoration vector to the three numbers below. Watch the pink dot pass
          even the closest paraphrase. The score is now about point nine nine nine nine five. Where could
          you put the cutoff to keep even one retention pair and exclude restoration?
        hold: 2.3
        visual_cues:
          - id: sc-exception-high
            phrase: Change just the restoration vector to the three numbers below
            targets:
              - score-board
              - selection-counts
            color: pink
            linger: 0.28
        caption_starts:
          - The score is now about
      - say: Slide the cutoff all the way to one. The four acceptable pairs leave first. Restoration is the last
          one out. Any line far enough right to exclude it has already lost all four. The thirty-day
          policy still answers exactly the same question it did before we moved the dot.
        hold: 1
        visual_cues:
          - id: sweep-cutoff
            phrase: Slide the cutoff all the way to one
            targets:
              - score-board
              - selection-counts
            color: yellow
            linger: 0.28
        caption_starts:
          - The four acceptable pairs leave first
      - say: Change the question class instead. Suppose held-out review supports a trusted retention-only route.
          At the old cutoff, the four duration questions can reach search. Restoration goes straight to an
          authorized fresh policy read. Keep that failed pair in the evaluation set. If you cannot
          establish a reliable class or a separate equivalence check, leave semantic reuse off for these
          questions.
        hold: 0.8
        visual_cues:
          - id: sc-exception-repair
            phrase: a trusted retention-only route
            targets:
              - score-board
            color: cyan
            linger: 0.28
  - id: evidence
    title: Four successes leave a wide uncertainty interval
    visual: A Wilson lower confidence bound is calculated for four reviewed successes, then a separate larger
      supplied evaluation. The larger report is labeled as a hypothetical independent sample rather than
      replicated evidence.
    beats:
      - say: >
          Four correct proposals out of four look perfect as a point estimate. Their uncertainty is much
          wider. The lower confidence bound on screen comes from those four observations. A tiny suite can
          reveal implementation mistakes while leaving substantial uncertainty about the next proposed hit.
        hold: 0.65
        visual_cues:
          - id: small-suite
            phrase: Four correct proposals out of four
            targets:
              - review-population
            color: cyan
            linger: 0.5
          - id: wide-bound
            phrase: lower confidence bound
            targets:
              - confidence-bound
            color: yellow
            linger: 0.5
      - say: >
          Compare a separate hypothetical report with several thousand independently reviewed proposals and no
          errors. The same calculation yields a tighter bound. Replaying four questions many times would
          preserve the same narrow coverage. Evidence grows through representative independent cases,
          including exceptions and important permission boundaries.
        hold: 0.65
