            color: pink
      - say: Look where the two weights went. One rose as the other fell, even while their predictions stay close to the measurements. For independent columns, forming the Gram matrix squares the two-norm condition number. More stored digits help with this rounding. A direct QR or SVD fit avoids that extra step. The original measurement noise still affects the direct fit.
