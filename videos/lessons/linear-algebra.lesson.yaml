            color: blue
      - say: Introduce the storage rounding. The original table and the observed readings already fit in three decimal places. Round the normal equations before subtracting. The blue remainder gets longer. The yellow one gets shorter. Dividing yellow by blue now gives a much smaller second weight.
        hold: 0.9
        motion_check:
          region:
            - 600
            - 565
            - 1100
            - 390
          minimumChangedFraction: 0.002
        caption_starts:
          - The blue remainder gets longer
        visual_cues:
