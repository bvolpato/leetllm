  - id: energy-cutoff
    title: Square the strengths before choosing a cutoff
    visual: Singular-axis segments become square areas 36,9,1 on a conserved energy strip; the retained area crosses a95% line only after the second component.
    beats:
      - say: "Suppose another table has singular values six, three and one. Each square shows how much that direction contributes to reconstruction. Count their areas: thirty-six plus nine plus one, or forty-six. Predict the smallest retained rank that reaches ninety-five percent."
        hold: 2.1
        visual_cues:
          - id: predict-rank
            phrase: Predict the smallest retained rank
            targets:
              - energy-receipt
            color: yellow
            linger: 0.8
          - id: square-areas
            phrase: thirty-six plus nine plus one, or forty-six
            targets:
              - energy-receipt
            color: yellow
      - say: The first strength retains thirty-six over forty-six, about seventy-eight percent. The first two retain forty-five over forty-six, about ninety-eight percent. So two is the smallest rank that passes. For the Frobenius error, add the discarded squares and take the square root. That last square has area one. On centered data the retained fraction measures variation around the mean. On the original table it measures energy around zero.
        hold: 1.2
        visual_cues:
          - id: retain-second
            phrase: The first two retain forty-five over forty-six, about ninety-eight percent
            targets:
              - energy-receipt
            color: green
            linger: 0.8
            caption_boundary: true
          - id: retain-first
            phrase: The first strength retains thirty-six over forty-six, about seventy-eight percent
            targets:
              - energy-receipt
            color: yellow
            caption_boundary: true
          - id: rank-answer
            phrase: two is the smallest rank that passes
            targets:
              - energy-receipt
            color: yellow
            caption_boundary: true
      - say: The last square barely moves the fraction. Think of the two tickets the router mixed up. A small discarded direction can still decide which team gets called. Before accepting a smaller search index, check the projected tickets and queries against the relevance judgments.
        hold: 1.2
        visual_cues:
          - id: task-relevance
            phrase: A small discarded direction
            targets:
              - energy-receipt
            color: pink
            linger: 0.8
  - id: low-rank-update
    title: Two thin factors restrict the update’s directions
    visual: A two-dimensional input drives a rank-one line through one scalar. Two thin factors replace a square update. One trainable weight from a factor opens into its two Adam moment slots.
    beats:
      - say: Consider a model update that passes through a single number. Turn the input arrow all the way around. The output travels back and forth along one line. Low-rank adaptation, or LoRA, learns the two thin factors of an update directly. The width between them limits how many independent output directions it can use. The input and output widths also bound its rank.
        hold: 1.2
        visual_cues:
          - id: low-rank-map
            phrase: Turn the input arrow all the way around
            targets:
              - rank-one-latent
            color: green
            linger: 0.8
      - say: Now let eight numbers pass between the factors. The full layer has four thousand ninety-six inputs and just as many outputs. Each factor has eight weights for each of those four thousand ninety-six positions. Counting both factors gives sixty-five thousand five hundred thirty-six in total. The full square has over sixteen million weights. Those counts cover the update weights for one layer.
        hold: 1.2
        visual_cues:
          - id: count-factors
            phrase: Each factor has eight weights for each of those four thousand ninety-six positions
            targets:
              - factor-weights
            color: green
            linger: 0.8
          - id: factor-count
            phrase: sixty-five thousand five hundred thirty-six in total
            targets:
              - factor-weights
            color: yellow
          - id: full-update-count
            phrase: full square has over sixteen million weights
            targets:
              - factor-weights
            color: yellow
      - say: Pick one of those trainable weights. If we train it with Adam, it also needs two moment estimates. One tracks its gradient and the other tracks its squared gradient. Both are moving averages that give recent steps more weight. Each weight in the two factors gets its own pair. Choose the rank by measuring how well the adapted model does its job.
        hold: 0.8
        visual_cues:
          - id: adam-moments
            phrase: One tracks its gradient and the other tracks its squared gradient
            targets:
              - weight-state
            color: yellow
  - id: new-routing-objective
    title: Which measurement belongs in the field?
    visual: The same ruler measures two count rows. It turns for routing, stays fixed when a counter reads two new rows, then turns back to recover their totals.
    beats:
      - say: Try two new tickets. One mentions slow pages four times. The other asks for a rollback four times. The yellow ruler measures their common score. You have one field to save. How would you set the ruler so the router can tell these tickets apart?
        hold: 2.2
      - say: Turn it through a right angle. Watch the two marks on the score scale. They started together. Now contrast gives opposite signs, enough to separate these two issue types.
        hold: 0.8
        caption_starts:
          - Now contrast gives opposite signs
        visual_cues:
          - id: choose-contrast
            phrase: Turn it through a right angle
            targets:
              - task-direction
            color: pink
      - say: Leave the ruler there. A counter needs the total number of mentions in each ticket. Try zero, zero and four, four. Read the two stored scores. Could the counter recover both totals?
        hold: 2
        visual_cues:
          - id: count-counterexample
            phrase: Try zero, zero and four, four
            targets:
              - projected-scores
            color: blue
          - id: counter-contrast
            phrase: Read the two stored scores
            targets:
              - projected-scores
            color: yellow
      - say: Both have contrast coordinate zero. Turn back to the common direction. Now the marks separate. Multiply each common score by the square root of two to recover the totals zero and eight. This is true for any pair of counts, because common adds the two entries before dividing by the square root of two.
        hold: 0.9
        visual_cues:
          - id: recover-total
            phrase: Turn back to the common direction
            targets:
              - task-direction
            color: yellow
          - id: counter-totals
            phrase: totals zero and eight
            targets:
              - task-test
            color: yellow
            caption_boundary: true
  - id: decision
