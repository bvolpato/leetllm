scenes:
  - id: intro
    title: Dogs and cats trade places
    visual: Keep the first sentence and its blue output in view while the nouns cross in a second sentence.
      Reveal the matching coordinate under dogs, then slide the words along a position ruler.
    beats:
      - say: Swap dogs and cats. The blue number under dogs is part of its attention output. Every word can
          see all three, with no position signal. Where does that number go now?
        hold: 2.2
        caption_starts:
          - The blue number under dogs
          - Every word can see all three
        visual_cues:
          - id: swap-nouns
            phrase: Swap dogs and cats
            targets: [nouns]
            color: yellow
            linger: 0.25
          - id: mark-output
            phrase: The blue number under dogs
            targets:
              - output-row
            color: cyan
            linger: 0.25
          - id: track-output
            phrase: Where does that number go now
            targets:
              - output-row
              - nouns
            color: cyan
            linger: 0.25
            caption_boundary: true
      - say: Under dogs. Its query meets the same three keys and mixes the same values. Its first output
          coordinate is still point eight zero two.
        hold: 0.7
        visual_cues:
          - id: dogs-output
            phrase: Under dogs
            targets:
              - output-row
            color: cyan
            linger: 0.25
            caption_boundary: true
      - say: Slide the whole sentence eight places to the right. Dogs is still two places after cats. Rotary
          position embedding, or RoPE, turns a query and a key according to their positions. We'll see how
          their dot product picks up that two-place gap.
        hold: 0.7
        visual_cues:
          - id: move-sentence
            phrase: Slide the whole sentence eight places to the right
            targets:
              - sentence-positions
            color: pink
            linger: 0.25
            caption_boundary: true
  - id: permutation
    title: Content follows its token
    visual: Three token identities and their computed unmasked attention outputs exchange rows. A miniature
      attention matrix permutes both rows and columns, while the same output numbers travel with their colored
      tokens.
    beats:
      - say: Replay the swap with all three outputs in view. Begin with attention that has neither a position signal nor a mask. A query compares its content with
          each key. Those comparisons become weights, and the weights mix the corresponding values.
        hold: 0.4
        visual_cues:
          - id: permutation-permuted-output-0-b1-1
            phrase: weights mix the corresponding values
            targets:
              - permuted-output-0
            color: cyan
            linger: 0.6
          - id: rp-permutation-0-0
            phrase: Begin with attention that has neither a position signal nor a mask.
            targets:
              - permutation-construction
            color: blue
            linger: 0.25
          - id: rp-permutation-0-1
            phrase: A query compares its content with each key.
            targets:
              - permutation-construction
            color: blue
            linger: 0.25
          - id: rp-permutation-0-2
            phrase: Those comparisons become weights, and the weights mix the corresponding values.
            targets:
              - permutation-construction
            color: green
            linger: 0.25
      - say: Shuffle the token rows and carry their vectors along. The same content comparisons happen in a different
          arrangement. The outputs move with their tokens. This property is called permutation equivariance.
        hold: 0.6
        visual_cues:
          - id: permutation-permuted-token-0-b2-1
            phrase: outputs move with their tokens
            targets:
              - permuted-token-0
              - permuted-output-0
            color: blue
            linger: 0.6
          - id: rp-permutation-1-0
            phrase: Shuffle the token rows and carry their vectors along.
            targets:
              - permutation-construction
            color: blue
            linger: 0.25
          - id: rp-permutation-1-1
            phrase: The same content comparisons happen in a different arrangement.
            targets:
              - permutation-construction
            color: blue
            linger: 0.25
          - id: rp-permutation-1-2
            phrase: The outputs move with their tokens.
            targets:
              - permutation-construction
            color: blue
            linger: 0.25
          - id: rp-permutation-1-3
            phrase: This property is called permutation equivariance.
            targets:
              - permutation-construction
            color: green
            linger: 0.25
      - say: Our test deliberately uses unmasked attention. A decoder's causal mask changes which earlier tokens are
          visible and therefore changes this symmetry. We'll keep that visibility rule separate from the
          position signal we are about to construct.
        hold: 0.5
        visual_cues:
          - id: permutation-content-weight-0-2-b3-1
            phrase: unmasked attention
            targets:
              - content-weight-0-2
            color: yellow
            linger: 0.6
          - id: rp-permutation-2-0
            phrase: Our test deliberately uses unmasked attention.
            targets:
              - permutation-construction
            color: blue
            linger: 0.25
          - id: rp-permutation-2-1
            phrase: A decoder's causal mask changes which earlier tokens are visible and therefore changes this symmetry.
            targets:
              - permutation-construction
            color: blue
            linger: 0.25
          - id: rp-permutation-2-2
            phrase: We'll keep that visibility rule separate from the position signal we are about to construct.
            targets:
              - permutation-construction
            color: green
            linger: 0.25
  - id: mask-and-prefill
    title: Parallel work keeps causal visibility
    visual: The same three tokens move through an unmasked calculation, then a fixed lower-triangular visibility
      grid. The row at position two cannot read position three even when all queries execute together.
    beats:
      - say: The unmasked equality follows through every matrix. Permuting token rows permutes queries, keys and
          values. The score matrix permutes both axes, row-wise softmax follows those permutations, and the
          value mixture gives the same permutation of the original output. An exact comparison disables
          dropout or carries its sampled mask along too.
        hold: 0.5
        visual_cues:
          - id: rp-mask-and-prefill-0-0
            phrase: The unmasked equality follows through every matrix.
            targets:
              - mask-and-prefill-construction
            color: blue
            linger: 0.25
          - id: rp-mask-and-prefill-0-1
            phrase: Permuting token rows permutes queries, keys and values.
            targets:
              - mask-and-prefill-construction
            color: blue
            linger: 0.25
          - id: rp-mask-and-prefill-0-2
            phrase: The score matrix permutes both axes, row-wise softmax follows those permutations, and the value
              mixture gives the same permutation of the original output.
            targets:
              - mask-and-prefill-construction
            color: blue
            linger: 0.25
          - id: rp-mask-and-prefill-0-3
            phrase: An exact comparison disables dropout or carries its sampled mask along too.
            targets:
              - mask-and-prefill-construction
            color: green
            linger: 0.25
      - say: Look down the rows of the causal mask. Query two can read the first two keys. The third key
          is hidden. During parallel prefill, all three queries run together with those same
          permissions. Some decoders trained with this mask learn approximate positions even without a
          position encoding. With identical value rows, though, the average is the same whether one row or three
          are visible.
        hold: 0.5
        visual_cues:
          - id: rp-mask-and-prefill-1-0
            phrase: Look down the rows of the causal mask.
            targets:
              - mask-and-prefill-construction
            color: blue
            linger: 0.25
          - id: rp-mask-and-prefill-1-1
            phrase: Query two can read the first two keys. The third key is hidden.
            targets:
              - mask-and-prefill-construction
            color: blue
            linger: 0.25
          - id: rp-mask-and-prefill-1-2
            phrase: During parallel prefill, all three queries run together with those same permissions.
            targets:
              - mask-and-prefill-construction
            color: blue
            linger: 0.25
          - id: rp-mask-and-prefill-1-3
            phrase: Some decoders trained with this mask learn approximate positions even without a position encoding.
            targets:
              - mask-and-prefill-construction
            color: blue
            linger: 0.25
          - id: rp-mask-and-prefill-1-4
            phrase: With identical value rows, though, the average is the same whether one row or three are
              visible.
            targets:
              - mask-and-prefill-construction
            color: green
            linger: 0.25
  - id: insertion
    title: Where can position enter?
    visual: A large three-lane tensor pipeline separates embedding addition, Q/K rotation, and score bias. A
      position marker travels to each method's actual insertion point; values retain a separate straight
      aggregation route.
    beats:
      - say: An absolute encoding gives each slot a vector and adds it to the token embedding. Learned position tables
          and the original Transformer's sine and cosine waves take this early route.
        hold: 0.4
        visual_cues:
          - id: insertion-embedding-insertion-0-b1-1
            phrase: adds it to the token embedding
            targets:
              - embedding-insertion-0
            color: blue
            linger: 0.6
          - id: rp-insertion-0-0
            phrase: An absolute encoding gives each slot a vector and adds it to the token embedding.
            targets:
              - insertion-construction
            color: blue
            linger: 0.25
          - id: rp-insertion-0-1
            phrase: Learned position tables and the original Transformer's sine and cosine waves take this early route.
            targets:
              - insertion-construction
            color: green
            linger: 0.25
      - say: RoPE enters later. First the model projects content into queries and keys. Then position rotates those
          vectors, just before their dot products determine attention weights.
        hold: 0.4
        visual_cues:
          - id: insertion-qk-insertion-1-b2-1
            phrase: position rotates those vectors
            targets:
              - qk-insertion-1
            color: cyan
            linger: 0.6
          - id: rp-insertion-1-0
            phrase: RoPE enters later.
            targets:
              - insertion-construction
            color: blue
            linger: 0.25
          - id: rp-insertion-1-1
            phrase: First the model projects content into queries and keys.
            targets:
              - insertion-construction
            color: blue
            linger: 0.25
          - id: rp-insertion-1-2
            phrase: Then position rotates those vectors, just before their dot products determine attention weights.
            targets:
              - insertion-construction
            color: green
            linger: 0.25
      - say: Another method, ALiBi, adds a distance bias directly to the scores. These insertion points matter. We'll
          concentrate on RoPE's middle route, where a small rotation produces an exact relationship between
          two positions.
        hold: 0.5
        visual_cues:
          - id: insertion-score-insertion-2-b3-1
            phrase: distance bias directly to the scores
            targets:
              - score-insertion-2
            color: yellow
            linger: 0.6
          - id: rp-insertion-2-0
            phrase: Another method, ALiBi, adds a distance bias directly to the scores.
            targets:
              - insertion-construction
            color: blue
            linger: 0.25
          - id: rp-insertion-2-1
            phrase: These insertion points matter.
            targets:
              - insertion-construction
            color: blue
            linger: 0.25
          - id: rp-insertion-2-2
            phrase: We'll concentrate on RoPE's middle route, where a small rotation produces an exact relationship
              between two positions.
            targets:
              - insertion-construction
            color: green
            linger: 0.25
  - id: absolute-waves
    title: One slot drives several wave pairs
    visual: The four retained frequency clocks construct sine-first position rows at zero and two, then add one
      row coordinate by coordinate to the same content vector.
    beats:
      - say: Build the original Transformer's absolute signal before returning to rotary attention. An
          eight-coordinate position vector contains four sine-cosine pairs with frequencies one, one-tenth,
          one-hundredth and one-thousandth. Multiply the slot index by each frequency, then store its sine
          followed by its cosine. At position zero the row alternates zero and one.
        hold: 0.5
        visual_cues:
          - id: rp-absolute-waves-0-0
            phrase: Build the original Transformer's absolute signal before returning to rotary attention.
            targets:
              - absolute-waves-construction
            color: blue
            linger: 0.25
          - id: rp-absolute-waves-0-1
            phrase: An eight-coordinate position vector contains four sine-cosine pairs with frequencies one, one-tenth,
              one-hundredth and one-thousandth.
            targets:
              - absolute-waves-construction
            color: blue
            linger: 0.25
          - id: rp-absolute-waves-0-2
            phrase: Multiply the slot index by each frequency, then store its sine followed by its cosine.
            targets:
              - absolute-waves-construction
            color: blue
            linger: 0.25
          - id: rp-absolute-waves-0-3
            phrase: At position zero the row alternates zero and one.
            targets:
              - absolute-waves-construction
            color: green
            linger: 0.25
      - say: "At position two, the first pair becomes sine two and cosine two: about zero point nine zero nine and
          minus zero point four one six. Slower pairs have turned less. Their combined fingerprint is added
          coordinate by coordinate to the token embedding, before all three projections. That means position
          can directly enter the value projection as well as queries and keys."
        hold: 0.5
        visual_cues:
          - id: rp-absolute-waves-1-0
            phrase: "At position two, the first pair becomes sine two and cosine two: about zero point nine zero nine and
              minus zero point four one six."
            targets:
              - absolute-waves-construction
            color: blue
            linger: 0.25
          - id: rp-absolute-waves-1-1
            phrase: Slower pairs have turned less.
            targets:
              - absolute-waves-construction
            color: blue
            linger: 0.25
          - id: rp-absolute-waves-1-2
            phrase: Their combined fingerprint is added coordinate by coordinate to the token embedding, before all three
              projections.
            targets:
              - absolute-waves-construction
            color: blue
            linger: 0.25
          - id: rp-absolute-waves-1-3
            phrase: That means position can directly enter the value projection as well as queries and keys.
            targets:
              - absolute-waves-construction
            color: green
            linger: 0.25
      - say: A wavelength is two pi divided by frequency. In the original five-hundred-twelve-wide schedule, dimension
          pairs beginning at zero, sixty-four and five hundred ten have wavelengths about six, twenty and
          sixty thousand six hundred eleven positions. Keep the first coordinate index distinct from the pair
          index. With sine stored first, a shared offset acts through the corresponding sine-first rotation
          convention.
        hold: 0.5
        visual_cues:
          - id: rp-absolute-waves-2-0
            phrase: A wavelength is two pi divided by frequency.
            targets:
              - absolute-waves-construction
            color: blue
            linger: 0.25
          - id: rp-absolute-waves-2-1
            phrase: In the original five-hundred-twelve-wide schedule, dimension pairs beginning at zero, sixty-four and
              five hundred ten have wavelengths about six, twenty and sixty thousand six hundred eleven
              positions.
            targets:
              - absolute-waves-construction
            color: blue
            linger: 0.25
          - id: rp-absolute-waves-2-2
            phrase: Keep the first coordinate index distinct from the pair index.
            targets:
              - absolute-waves-construction
            color: blue
            linger: 0.25
          - id: rp-absolute-waves-2-3
            phrase: With sine stored first, a shared offset acts through the corresponding sine-first rotation convention.
            targets:
              - absolute-waves-construction
            color: green
            linger: 0.25
  - id: absolute-mixture
    title: Addition creates four score terms
    visual: The same content and position components make four actual dot-product contributions, including both
      cross terms. A shared shift preserves the position-only dot under identity projection but changes a
      supplied cross term.
    beats:
      - say: Addition preserves hidden width, but mixes two sources before projection. Expand a query from content
          plus position against a key from content plus position. The dot product has content-content,
          content-position, position-content and position-position terms. The two cross terms do not vanish
          merely because the waves are paired.
        hold: 0.5
        visual_cues:
          - id: rp-absolute-mixture-0-0
            phrase: Addition preserves hidden width, but mixes two sources before projection.
            targets:
              - absolute-mixture-construction
            color: blue
            linger: 0.25
          - id: rp-absolute-mixture-0-1
            phrase: Expand a query from content plus position against a key from content plus position.
            targets:
              - absolute-mixture-construction
            color: blue
            linger: 0.25
          - id: rp-absolute-mixture-0-2
            phrase: The dot product has content-content, content-position, position-content and position-position terms.
            targets:
              - absolute-mixture-construction
            color: blue
            linger: 0.25
          - id: rp-absolute-mixture-0-3
            phrase: The two cross terms do not vanish merely because the waves are paired.
            targets:
              - absolute-mixture-construction
            color: green
            linger: 0.25
      - say: If the combined query-key projection is the identity, each position-only pair contributes the cosine of
          its offset. A general learned projection need not preserve that shared-shift relationship. In
          column-vector notation, transpose the shared-offset rotation, multiply by the learned bilinear
          matrix, then multiply by the rotation. Shared-shift invariance requires that result to equal the
          original bilinear matrix. Even equal query and key projection matrices do not guarantee it.
        hold: 0.5
        visual_cues:
          - id: rp-absolute-mixture-1-0
            phrase: If the combined query-key projection is the identity, each position-only pair contributes the cosine
              of its offset.
            targets:
              - absolute-mixture-construction
            color: blue
            linger: 0.25
          - id: rp-absolute-mixture-1-1
            phrase: A general learned projection need not preserve that shared-shift relationship.
            targets:
              - absolute-mixture-construction
            color: blue
            linger: 0.25
          - id: rp-absolute-mixture-1-2
            phrase: In column-vector notation, transpose the shared-offset rotation, multiply by the learned bilinear
              matrix, then multiply by the rotation.
            targets:
              - absolute-mixture-construction
            color: blue
            linger: 0.25
          - id: rp-absolute-mixture-1-3
            phrase: Shared-shift invariance requires that result to equal the original bilinear matrix.
            targets:
              - absolute-mixture-construction
            color: blue
            linger: 0.25
          - id: rp-absolute-mixture-1-4
            phrase: Even equal query and key projection matrices do not guarantee it.
            targets:
              - absolute-mixture-construction
            color: green
            linger: 0.25
      - say: This differs from the fixed-content rotary identity we will derive. Adding two width-d vectors keeps
          width d. Concatenating them produces width two d unless another projection reduces it. If the whole
          transformer keeps that doubled width, square query, key and value matrices have four times as many
          entries. For a supplied width two hundred fifty-six, doubling to five hundred twelve changes each
          square from sixty-five thousand five hundred thirty-six entries to two hundred sixty-two thousand
          one hundred forty-four.
        hold: 0.5
        visual_cues:
          - id: rp-absolute-mixture-2-0
            phrase: This differs from the fixed-content rotary identity we will derive.
            targets:
              - absolute-mixture-construction
            color: blue
            linger: 0.25
          - id: rp-absolute-mixture-2-1
            phrase: Adding two width-d vectors keeps width d.
            targets:
              - absolute-mixture-construction
            color: blue
            linger: 0.25
          - id: rp-absolute-mixture-2-2
            phrase: Concatenating them produces width two d unless another projection reduces it.
            targets:
              - absolute-mixture-construction
            color: blue
            linger: 0.25
          - id: rp-absolute-mixture-2-3
            phrase: If the whole transformer keeps that doubled width, square query, key and value matrices have four
              times as many entries.
            targets:
              - absolute-mixture-construction
            color: blue
            linger: 0.25
          - id: rp-absolute-mixture-2-4
            phrase: For a supplied width two hundred fifty-six, doubling to five hundred twelve changes each square from
              sixty-five thousand five hundred thirty-six entries to two hundred sixty-two thousand one
              hundred forty-four.
            targets:
              - absolute-mixture-construction
            color: green
            linger: 0.25
  - id: finite-table
    title: A learned table has a real last row
    visual: A4096-row learned table admits4095 and rejects4096. A sinusoidal formula produces a new row outside
      that table while separate task-evaluation receipts remain pending.
    beats:
      - say: A learned absolute table with four thousand ninety-six rows supplies indices zero through four thousand
          ninety-five. Index four thousand ninety-six is already missing. Extending or remapping it changes
          the design and needs adaptation. A sinusoidal formula can be evaluated beyond its training range,
          although a cached implementation may still need a larger buffer.
        hold: 0.5
        visual_cues:
          - id: rp-finite-table-0-0
            phrase: A learned absolute table with four thousand ninety-six rows supplies indices zero through four
              thousand ninety-five.
            targets:
              - finite-table-construction
            color: blue
            linger: 0.25
          - id: rp-finite-table-0-1
            phrase: Index four thousand ninety-six is already missing.
            targets:
              - finite-table-construction
            color: blue
            linger: 0.25
          - id: rp-finite-table-0-2
            phrase: Extending or remapping it changes the design and needs adaptation.
            targets:
              - finite-table-construction
            color: blue
            linger: 0.25
          - id: rp-finite-table-0-3
            phrase: A sinusoidal formula can be evaluated beyond its training range, although a cached implementation may
              still need a larger buffer.
            targets:
              - finite-table-construction
            color: green
            linger: 0.25
      - say: Look at the row on the right. Each coordinate lies between minus one and one, even at
          position four thousand ninety-six. To find out how well the model uses that row, try a task
          at that length. The original Transformer compared fixed and learned positions with nearly
          identical translation results in that experiment. Reproduce the checkpoint's insertion point
          first, then test the lengths and tasks you intend to serve.
        hold: 0.5
        visual_cues:
          - id: rp-finite-table-1-0
            phrase: Look at the row on the right. Each coordinate lies between minus one and one, even at
              position four thousand ninety-six.
            targets:
              - finite-table-construction
            color: blue
            linger: 0.25
          - id: rp-finite-table-1-1
            phrase: To find out how well the model uses that row, try a task at that length.
            targets:
              - finite-table-construction
            color: blue
            linger: 0.25
          - id: rp-finite-table-1-2
            phrase: The original Transformer compared fixed and learned positions with nearly identical translation
              results in that experiment.
            targets:
              - finite-table-construction
            color: blue
            linger: 0.25
          - id: rp-finite-table-1-3
            phrase: Reproduce the checkpoint's insertion point first, then test the lengths and tasks you intend to serve.
            targets:
              - finite-table-construction
            color: green
            linger: 0.25
  - id: rotation
    title: A position becomes an angle
    visual: A large query arrow turns around a fixed Cartesian origin through an angle equal to position times
      frequency. Its trail, coordinate projections, and norm remain tied to the same exact rotated vector.
    beats:
      - say: Take two coordinates from a query and draw them as an arrow. Moving around this circle changes its
          direction while preserving its length. That's the operation RoPE applies to the pair.
        hold: 0.4
        visual_cues:
          - id: rotation-rotating-coordinate-pair-b1-1
            phrase: preserving its length
            targets:
              - rotating-coordinate-pair
            color: cyan
            linger: 0.6
          - id: rp-rotation-0-0
            phrase: Take two coordinates from a query and draw them as an arrow.
            targets:
              - rotation-construction
            color: blue
            linger: 0.25
          - id: rp-rotation-0-1
            phrase: Moving around this circle changes its direction while preserving its length.
            targets:
              - rotation-construction
            color: blue
            linger: 0.25
          - id: rp-rotation-0-2
            phrase: That's the operation RoPE applies to the pair.
            targets:
              - rotation-construction
            color: green
            linger: 0.25
      - say: "Choose a frequency: the angle added for each position step. Multiply that frequency by the token's
          position. Advance the position slider and the arrow turns by exactly the resulting angle."
        hold: 0.5
        visual_cues:
          - id: rotation-position-frequency-product-b2-1
            phrase: Multiply that frequency
            targets:
              - position-frequency-product
            color: yellow
            linger: 0.6
          - id: rp-rotation-1-0
            phrase: "Choose a frequency: the angle added for each position step."
            targets:
              - rotation-construction
            color: blue
            linger: 0.25
          - id: rp-rotation-1-1
            phrase: Multiply that frequency by the token's position.
            targets:
              - rotation-construction
            color: blue
            linger: 0.25
          - id: rp-rotation-1-2
            phrase: Advance the position slider and the arrow turns by exactly the resulting angle.
            targets:
              - rotation-construction
            color: green
            linger: 0.25
      - say: The horizontal and vertical coordinates change together. They still describe the same length, so this
          operation introduces position without amplifying the vector. We can write the entire motion as one
          small matrix.
        hold: 0.5
        visual_cues:
          - id: rotation-preserved-vector-length-b3-1
            phrase: same length
            targets:
              - preserved-vector-length
            color: green
            linger: 0.6
          - id: rp-rotation-2-0
            phrase: The horizontal and vertical coordinates change together.
            targets:
              - rotation-construction
            color: blue
            linger: 0.25
