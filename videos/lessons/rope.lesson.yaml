  - id: frequencies
    title: Four pairs, one offset
    visual: Four dials face their respective query directions. The same two-position move turns a key at four
      angular speeds. Its four projections become signed contributions to one scaled logit.
    beats:
      - say: Give one head eight coordinates. Each neighboring pair can turn at its own speed. On each dial the
          blue query points right in its own frame. The yellow key starts aligned with it. The rates under
          the dials are radians per position. Suppose the query stays at four and the key moves back to two.
          Which pair will contribute a negative dot product?
        hold: 2.2
        visual_cues:
          - id: compare-rates
            phrase: Which pair will contribute a negative dot product
            targets:
              - pair-0
              - pair-1
              - pair-2
              - pair-3
            color: cyan
            linger: 0.25
            caption_boundary: true
      - say: Take those two steps back. The first key turns clockwise by two radians and crosses the vertical
          line. Look at its projection. It lands to the left of zero and contributes about minus point four
          two. Each successive pair turns a tenth as far. Those other three projections still point right.
