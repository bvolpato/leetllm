  - id: dot-product
    title: Measuring alignment
    visual: A perpendicular from the yellow key meets the cyan query axis. A green marker on a signed ruler
      reads off their dot product as the key turns.
    beats:
      - say: Start with two unit arrows pointing right. The green mark lies one unit out along the query. Turn
          the key a quarter turn. Its tip is directly above the origin, so its projection is zero. Turn it
          another quarter turn. The mark reaches minus one. That signed reading is the dot product for
          these two unit arrows.
        hold: 0.8
        visual_cues:
          - id: quarter-turn
            phrase: Turn the key a quarter turn
            targets:
              - alignment
            color: yellow
            linger: 0.25
            caption_boundary: true
          - id: half-turn
            phrase: Turn it another quarter turn
            targets:
              - projection-score
            color: green
            linger: 0.25
            caption_boundary: true
      - say: Bring the key back alongside the query. Use half a radian per position. Rotate the query for
          position five and the key for position three. From the yellow tip, drop a perpendicular onto the
          blue query. The green mark tells us how much of the key points along it.
        hold: 0.6
        visual_cues:
          - id: reset-key
            phrase: Bring the key back alongside the query
            targets:
              - alignment
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: position-the-pair
            phrase: Rotate the query for position five and the key for position three
            targets:
              - alignment
            color: yellow
            linger: 0.25
            caption_boundary: true
      - say: From query to key, that's three minus five, times one half. The key trails by one radian. The cosine
          of minus one is about point five four. We started these unit vectors in the same direction so we
          could isolate what position contributed.
        hold: 0.6
        visual_cues:
          - id: read-projection
            phrase: cosine of minus one is about point five four
            targets:
              - projection-score
            color: green
            linger: 0.25
            caption_boundary: true
