    title: Move both positions
    visual: A fixed bracket joins the positions of cats and dogs. Both arrows rotate under a common
      translation. A separate trial doubles the query length with the two indices held still.
    beats:
      - say: Here are cats and dogs again, at three and five. Use the same unit key for cats and the same unit
          query for dogs. Their dot product is point five four. What will it be if we move both positions
          eight places forward?
