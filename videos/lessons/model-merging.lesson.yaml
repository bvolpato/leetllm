version: 1
id: model-merging
title: Model Merging and Weight Interpolation
source: training/model-merging-weight-interpolation/content.md
voice: en-US-AndrewNeural
rate: +0%
sources:
  - title: "Wortsman et al. Model soups: averaging weights of multiple fine-tuned models improves
      accuracy without increasing inference time"
    url: https://arxiv.org/abs/2203.05482
  - title: Ilharco et al. Editing Models with Task Arithmetic
    url: https://arxiv.org/abs/2212.04089
  - title: Yadav et al. TIES-Merging
    url: https://arxiv.org/abs/2306.01708
  - title: Yu et al. DARE drop and rescale
    url: https://arxiv.org/abs/2311.03099
  - title: Hu et al. LoRA
    url: https://arxiv.org/abs/2106.09685
  - title: Shoemake. Animating rotation with quaternion curves
    url: https://www.cs.cmu.edu/~kiranb/animation/p245-shoemake.pdf
  - title: Mergekit recipe, tokenizer, and precision settings used in the article
    url: https://github.com/arcee-ai/mergekit/blob/9eeb539892c6753b032ea164e818b44a8c7a401b/README.md
scenes:
  - id: intro
    title: How do you merge three checkpoints?
    visual: >-
      Pull the same slot from three checkpoint files. The three values form a mean that fills that slot
      in a fourth file. Zoom out to compare the weight storage for three specialists and one merge.
    beats:
      - say: >-
          Pull weight seventeen from each checkpoint. Code has one, Math has two, and Chat has six.
          All three learned from the same base model. If each gets an equal share, what goes in slot seventeen?
        hold: 2.4
        caption_starts: ["Code has one", "If each gets an equal share"]
        visual_cues:
          - id: read-code
            phrase: "Code has one"
            targets: [code-file]
          - id: read-math
            phrase: "Math has two"
            targets: [math-file]
          - id: read-chat
            phrase: "Chat has six"
            targets: [chat-file]
          - id: equal-share
            phrase: "each gets an equal share"
            targets: [weights]
      - say: >-
          One plus two plus six gives nine. Divide by three. The merged weight is three.
          Write it in the same slot. Repeat for every matching weight. This equal-weight merge
          gives you one model without another training run.
        hold: 0.85
        caption_starts: ["Divide by three", "The merged weight is three", "Write it in the same slot"]
        visual_cues:
          - id: weight-sum
            phrase: "gives nine"
            targets: [weights]
          - id: merged-weight
            phrase: "The merged weight is three"
            targets: [candidate]
          - id: write-weight
            phrase: "Write it in the same slot"
            targets: [candidate]
      - say: >-
          Now zoom out. At eight billion parameters and two bytes per weight, each specialist carries about
          sixteen gigabytes of weights. Keeping all three in memory takes forty-eight gigabytes.
          The merged checkpoint carries sixteen. Can it still do all three jobs? We'll test each one.
        hold: 0.8
        caption_starts: ["Keeping all three in memory", "The merged checkpoint carries sixteen", "Can it still do all three jobs"]
        visual_cues:
          - id: resident-copies
            phrase: "Keeping all three in memory takes forty-eight gigabytes"
            targets: [weights]
          - id: merged-copy
            phrase: "The merged checkpoint carries sixteen"
            targets: [candidate]
  - id: alignment
    title: Which weights belong together?
    visual: >-
      Two copies inherit a shared coordinate system. A second, tiny example swaps both weights of a neuron
      and retests the average.
    beats:
      - say: >-
          Start at the fork. Both fine-tunes inherit the same layers and channels. If you average a weight at
          one address, you're assuming it still does the same job on both sides. Check the base revision, tensor
          names, shapes, and architecture before you pair them.
        hold: 0.5
        visual_cues:
          - id: alignment-b1-1
            phrase: "inherit the same layers and channels"
            targets: [common-base]
            linger: 0.35
      - say: >-
          Look at these two tiny networks. Both return one for a negative-one input and two for a positive-one
          input. But the positive-input neuron lives in a different slot on the right. Average by slot and the
          incoming weights cancel. Both outputs become zero. Now swap the two complete neurons on the right,
          taking their outgoing weights with them.
        hold: 1.1
        motion_check:
          region: [1040, 350, 750, 410]
          minimumChangedFraction: 0.002
        visual_cues:
          - id: naive-output
            phrase: "Both outputs become zero"
            targets: [neuron-weights]
            caption_boundary: true
          - id: alignment-b2-1
            phrase: "swap the two complete neurons on the right"
            targets: [permutation-neurons]
            linger: 0.35
      - say: >-
          The aligned average returns one and two again. We knew the swap in this example. Independently trained
          models can learn different features altogether. Matching tensor shapes tells you which arrays fit.
          Shared lineage and a functional check give you a reason to combine the entries.
        hold: 0.65
        visual_cues:
          - id: alignment-b3-1
            phrase: "aligned average returns one and two again"
            targets: [aligned-output]
            linger: 0.35
  - id: average
    title: Follow one weight at a time
    visual: >-
      Code and Math values share a row for each parameter. The mean is calculated in place one row at a
      time.
    beats:
      - say: >-
          Start with Code and Math. Each row follows one weight through two toy checkpoints. Give the sources
          equal weight. In the first row Code has one and Math has three. Where should the merged weight land?
        hold: 2.2
        visual_cues:
          - id: average-row-one
            phrase: "Code has one and Math has three"
            targets: [row-one]
            linger: 0.35
      - say: >-
          Halfway is two. In the second row the two sources trade places. Half of three plus half of one gives
          two again. Apply that rule to every matching coordinate and you have a uniform model soup.
        hold: 0.8
        motion_check:
          region: [1240, 420, 490, 355]
          minimumChangedFraction: 0.002
        visual_cues:
          - id: first-mean
            phrase: "Halfway is two"
            targets: [row-one]
            caption_boundary: true
            linger: 0.35
          - id: second-mean
            phrase: "gives two again"
            targets: [row-two]
            caption_boundary: true
            linger: 0.35
      - say: >-
          These two numbers are weights. To find out whether their midpoint can still do the job, run the
          checkpoint on held-out examples. We can repeat that test at other mixing ratios.
        hold: 0.65
        visual_cues:
          - id: average-test
            phrase: "midpoint"
            targets: [merged-weights]
            linger: 0.35
  - id: path
    title: Test the checkpoints between the endpoints
    visual: >-
      Two endpoint dots share a fixed loss plot with a maximum-loss line. Midpoint and quarter-point
      evaluations arrive with their task scores. A second path shares the endpoints.
    beats:
      - say: >-
          Put Code at the left end and Math at the right. Each dot is one checkpoint scored on the same held-out
          cases. These are toy measurements. To pass this screen, loss must be at most point three, and task
          accuracy at least eighty-four percent. Both endpoints clear it. Can you clear the halfway checkpoint
          yet?
        hold: 2.5
        visual_cues:
          - id: path-rule
            phrase: "loss must be at most point three"
            targets: [rule]
            linger: 0.35
          - id: path-half
            phrase: "halfway checkpoint"
            targets: [sample]
            linger: 0.35
      - say: >-
          Test the halfway mixture. Loss comes back at point six one and accuracy at seventy percent. It fails
          both checks. The dotted line connects the endpoint losses. Halfway along that line, the height is
          point one eight five. The measured loss sits point four two five above that line.
        hold: 1.05
        visual_cues:
          - id: midpoint-data
            phrase: "Loss comes back at point six one and accuracy at seventy percent"
            targets: [sample]
            caption_boundary: true
            linger: 0.35
          - id: midpoint-barrier
            phrase: "point four two five above that line"
            targets: [barrier]
            caption_boundary: true
            linger: 0.35
      - say: >-
          Move a quarter of the way from Code toward Math instead. Loss is point two zero and accuracy is
          eighty-six percent. Would you keep this checkpoint for the next round of tests?
        hold: 2.1
        visual_cues:
          - id: quarter-position
            phrase: "a quarter of the way"
            targets: [sample]
            linger: 0.35
          - id: quarter-data
            phrase: "Loss is point two zero and accuracy is eighty-six percent"
            targets: [sample]
            linger: 0.35
      - say: >-
          Yes. It clears both limits. The three-quarter mixture clears them too. Four of these five checkpoints
          pass. The gaps between the dots are mixtures we haven't tested.
        hold: 0.75
        visual_cues:
          - id: quarter-call
            phrase: "It clears both limits"
            targets: [sample]
            caption_boundary: true
            linger: 0.35
          - id: three-quarter
            phrase: "three-quarter mixture"
            targets: [path-samples]
            linger: 0.35
      - say: >-
          Now compare a second toy path with exactly the same endpoint losses. Halfway along this one, loss is
          just point zero nine. Nearby fine-tunes can have a low-loss route between them. Run the same
          task checks at the new midpoint to see how it performs.
        hold: 0.85
        visual_cues:
          - id: low-path
            phrase: "a second toy path"
            targets: [path-samples]
            linger: 0.35
          - id: low-midpoint
            phrase: "point zero nine"
            targets: [sample]
            caption_boundary: true
            linger: 0.35
  - id: slerp
    title: Interpolate directions along a sphere
    visual: Two unit vectors form a sixty-degree arc; linear interpolation contracts the midpoint norm
      while spherical interpolation follows the arc at unit length.
    beats:
      - say: Each dot marks the tip of a unit vector. The two vectors are sixty degrees apart.
          Linear interpolation cuts straight through from dot to dot. Halfway along the chord,
          the distance to the origin is about point eight seven.
        hold: 0.55
        caption_starts: ["Linear interpolation cuts straight through", "Halfway along the chord"]
        visual_cues:
          - id: slerp-b1-1
            phrase: straight through
            targets:
              - linear-chord
            linger: 0.45
          - id: linear-radius
            phrase: "point eight seven"
            targets: [linear-midpoint]
      - say: Spherical interpolation follows the arc on the unit sphere, so its midpoint keeps unit norm in
          this two-dimensional example. The movement stays at a constant angular rate.
        hold: 0.55
        caption_starts: ["so its midpoint keeps unit norm"]
        visual_cues:
          - id: slerp-b2-1
            phrase: arc on the unit sphere
            targets:
              - spherical-arc
            linger: 0.45
          - id: slerp-b2-2
            phrase: its midpoint keeps unit norm
            targets:
              - spherical-midpoint
            linger: 0.45
      - say: Compare the two lengths. If you want a midpoint as far from the origin as these endpoints,
          choose the arc. To pick a checkpoint for a coding assistant, run the same coding tasks on both
          midpoints and compare their scores.
        hold: 0.75
        caption_starts: ["To pick a checkpoint for a coding assistant"]
        visual_cues:
          - id: slerp-b3-1
            phrase: Compare the two lengths
            targets:
              - linear-chord
            linger: 0.45
          - id: slerp-b3-2
            phrase: choose the arc
            targets:
              - spherical-arc
            linger: 0.45
  - id: task-arithmetic
    title: Measure the changes from a common base
    visual: >-
      Two task vectors leave the same origin. Scaling each colored displacement changes its length before
      they are added tip to tail.
    beats:
      - say: >-
          You can also choose how much of each fine-tune's change to keep. Start at this toy base. Subtract the
          base from each checkpoint. The remaining displacement is its task vector. Code moved one step across.
          Math moved one step up.
        hold: 0.75
        visual_cues:
          - id: subtract
            phrase: "Subtract the base from each checkpoint"
            targets: [deltas]
            linger: 0.35
      - say: >-
          Keep eight tenths of Code's step. Then keep six tenths of Math's step. Slide the second arrow to the
          tip of the first. Where do you land?
        hold: 1.8
        visual_cues:
          - id: code-scale
            phrase: "eight tenths of Code's step"
            targets: [code-step]
            linger: 0.35
          - id: math-scale
            phrase: "six tenths of Math's step"
            targets: [math-step]
            linger: 0.35
          - id: join-vectors
            phrase: "Slide the second arrow to the tip of the first"
            targets: [math-step]
            linger: 0.35
      - say: >-
          Eight tenths across and six tenths up. Add those changes to the original base. That's task arithmetic.
          Here the arrows act on different weights. At a shared coordinate the changes might pull in opposite
          directions.
        hold: 0.65
        visual_cues:
          - id: vector-result
            phrase: "Eight tenths across and six tenths up"
            targets: [result]
            caption_boundary: true
            linger: 0.35
  - id: base-coefficient
    title: What happens to the base weight?
    visual: >-
      Opposing scaled displacements start at two. On the same ruler, a weighted endpoint sum needs a
      negative base correction to meet the delta result.
    beats:
      - say: >-
          Now both specialists change the same weight. The base is two. Code takes it up to two point four and
          Math takes it down to one point eight. Keep seven tenths of Code's change and half of Math's. Start
          your calculation at the base. Where do the two steps end?
        hold: 2.2
        visual_cues:
          - id: base-inputs
            phrase: "Start your calculation at the base"
            targets: [base-ruler]
            linger: 0.35
      - say: >-
          Code adds point two eight. From there, Math takes away point one zero. The weight lands at two point
          one eight. If you weight the two endpoints directly, you get two point five eight. That counted the
          base one point two times. Subtract the extra fifth of the base, point four, and the two paths meet.
        hold: 0.9
        visual_cues:
          - id: step-code
            phrase: "Code adds point two eight"
            targets: [code-delta]
            linger: 0.35
          - id: step-math
            phrase: "Math takes away point one zero"
            targets: [math-delta]
            linger: 0.35
          - id: step-result
            phrase: "The weight lands at two point one eight"
            targets: [base-ruler]
            caption_boundary: true
            linger: 0.35
          - id: endpoint-sum
            phrase: "two point five eight"
            targets: [endpoint]
            linger: 0.35
          - id: correction
            phrase: "Subtract the extra fifth of the base, point four"
            targets: [endpoint]
            linger: 0.35
      - say: >-
          In general the base keeps a coefficient of one minus the sum of the delta coefficients. If they sum to
          one, the endpoint formula needs no correction. To subtract a specialist's update, give its delta
          a negative coefficient. Every change in that delta reverses direction. Test the behavior you wanted
          to reduce and the skills you want to keep.
        hold: 0.7
        visual_cues:
          - id: base-rule
            phrase: "one minus the sum of the delta coefficients"
            targets: [endpoint]
            linger: 0.35
          - id: reverse-delta
            phrase: "give its delta a negative coefficient"
            targets: [endpoint]
  - id: adapter-products
    title: Which adapter weights should you average?
    visual: >-
      Two rank-one updates mark different diagonal cells. The mean of the products, the product of the means
      and a concatenated adapter are compared on the same cell grid.
    beats:
      - say: >-
          A low-rank adapter stores two factors. Multiply B by A and apply the adapter's scale to recover its
          change to a weight matrix. Both scales are one here. Code writes to the top left cell. Math writes to
          the bottom right. Give each update half the weight.
        hold: 0.65
        visual_cues:
          - id: adapter-one
            phrase: "Code writes to the top left cell"
            targets: [products]
            linger: 0.35
          - id: adapter-two
            phrase: "Math writes to the bottom right"
            targets: [products]
            linger: 0.35
          - id: adapter-mix
            phrase: "half the weight"
            targets: [desired]
            linger: 0.35
      - say: >-
          The two diagonal cells get half each. Look at the empty upper right cell. What would it contain if you
          averaged the B factors, averaged the A factors, and then multiplied those averages?
        hold: 2.5
        visual_cues:
          - id: adapter-corner
            phrase: "empty upper right cell"
            targets: [factor-product]
            linger: 0.35
      - say: >-
          A quarter. The averaged column supplies a half and the averaged row supplies a half. The same
          multiplication fills all four cells. That upper right cell now pairs a Code factor with a Math factor.
          Neither adapter asked for that change.
        hold: 1.05
        visual_cues:
          - id: adapter-cross
            phrase: "A quarter"
            targets: [factor-product]
            caption_boundary: true
            linger: 0.35
      - say: >-
          Keep the pairs together. Stack the A rows and put the half-weighted B columns side by side.
          Multiplying now adds the two original products. It restores both diagonal halves and leaves the
          other two cells at zero. Those two independent directions need rank two. Compress back to rank
          one and you lose one. Keep the base revision, target modules, and configured scales with the adapter.
        hold: 0.8
        visual_cues:
          - id: adapter-stack
            phrase: "Stack the A rows"
            targets: [factor-product]
            linger: 0.35
          - id: adapter-exact
            phrase: "Multiplying now adds the two original products"
            targets: [factor-product]
            linger: 0.35
  - id: ties
    title: Which updates count in the mean?
    visual: >-
      Trim each specialist row, compare signed mass in a selected column, then average only the updates
      pointing in the chosen direction. A second column changes the divisor.
    beats:
      - say: >-
          Look across each specialist's row. These four numbers are changes to four weights. Keep the two
          largest changes by magnitude in each row. The entries in columns two and four survive. This trimming
          is the first step of TIES.
        hold: 0.8
        caption_starts: ["Keep the two largest changes by magnitude", "The entries in columns two and four survive"]
        motion_check:
          region: [265, 420, 625, 383]
          minimumChangedFraction: 0.002
        visual_cues:
          - id: trim-rows
            phrase: "Keep the two largest changes by magnitude"
            targets: [delta-table]
            linger: 0.35
      - say: >-
          Follow column two. Code and Chat pull left. Math alone pulls right. Add the signed lengths of all
          three arrows. Which way does the balance tip?
        hold: 2.4
        visual_cues:
          - id: pick-two
            phrase: "Follow column two"
            targets: [signed-bars]
            linger: 0.35
      - say: >-
          Code and Chat pull left by nine tenths together. Math pulls right by one point one.
          The sum is plus point two, so right wins. Only Math points right.
          Its full plus one point one becomes the update.
        hold: 1
        caption_starts: ["Math pulls right", "The sum is plus point two", "Only Math points right", "Its full plus one point one"]
        visual_cues:
          - id: two-left
            phrase: "Code and Chat pull left by nine tenths together"
            targets: [signed-bars]
          - id: two-right
            phrase: "Math pulls right by one point one"
            targets: [signed-bars]
          - id: two-sum
            phrase: "The sum is plus point two"
            targets: [signed-bars]
            caption_boundary: true
            linger: 0.35
          - id: two-keep
            phrase: "Only Math points right"
            targets: [signed-bars]
            linger: 0.35
          - id: two-mean
            phrase: "Its full plus one point one"
            targets: [column-mean]
            caption_boundary: true
            linger: 0.35
      - say: >-
          Try column four. Code adds point eight, Math subtracts point six, and Chat adds point seven. Use the
          same rule. Which values go in the mean, and what update do you get?
        hold: 3.2
        visual_cues:
          - id: pick-four
            phrase: "Try column four"
            targets: [signed-bars]
            linger: 0.35
      - say: >-
          The sum is positive again. This time Code and Chat both point right. Divide their combined one point
          five by two. The update is plus point seven five. Scale the resulting task vector and add it to the
          base. Compare its held-out scores with plain task arithmetic to see what filtering bought you.
        hold: 0.9
        caption_starts: ["This time Code and Chat both point right", "Divide their combined one point five by two"]
        visual_cues:
          - id: four-sum
            phrase: "The sum is positive again"
            targets: [signed-bars]
            caption_boundary: true
            linger: 0.35
          - id: four-keep
            phrase: "Code and Chat both point right"
            targets: [signed-bars]
            linger: 0.35
          - id: four-mean
            phrase: "The update is plus point seven five"
            targets: [column-mean]
            caption_boundary: true
            linger: 0.35
  - id: drop-rescale
    title: What does a random mask preserve?
    visual: >-
      A fixed mask removes two delta bars and doubles the other two. One negative entry then branches into
      its two possible outcomes. A probability grid counts overlap among active entries.
    beats:
      - say: >-
          Here's another way to thin a task vector. Give each entry a fair coin. In this draw the first two
          entries drop out. The last two survive. Double those survivors because each had only half a chance to
          be kept. This drop-and-rescale step is called DARE. Feed the result to a merge rule such as task
          arithmetic.
        hold: 0.8
        visual_cues:
          - id: mask
            phrase: "the first two entries drop out"
            targets: [dare-bars]
            linger: 0.35
          - id: rescale
            phrase: "Double those survivors"
            targets: [dare-bars]
            linger: 0.35
      - say: >-
          Follow the negative entry across repeated draws. Half the time it becomes zero. Half the time it
          survives at minus point eight. Average the two equally likely outcomes and you recover minus point
          four, its original signed change. In this example each outcome sits four tenths from that mean.
          Square that distance and you get a variance of point one six. At higher drop rates survivors get
          bigger and the variance grows. For a drop rate of p, multiply the original change squared by p
          over one minus p. One draw can change the vector's length and the model's answers.
        hold: 0.7
        visual_cues:
          - id: outcomes
            phrase: "two equally likely outcomes"
            targets: [expectation]
            linger: 0.35
          - id: expected
            phrase: "minus point four, its original signed change"
            targets: [expectation]
            caption_boundary: true
            linger: 0.35
          - id: mask-variance
            phrase: "variance of point one six"
            targets: [expectation]
      - say: >-
          Change the drop rate to ninety percent and mask two initially nonzero task updates independently. This
          square has a hundred equally likely outcomes. The top row keeps Code. The first column keeps Math.
          They overlap in one square. If you consider only squares where at least one update survives, what
          denominator belongs under that one?
        hold: 2.35
        visual_cues:
          - id: keep-code
            phrase: "top row keeps Code"
            targets: [dare-grid]
            linger: 0.35
          - id: keep-math
            phrase: "first column keeps Math"
            targets: [dare-grid]
            linger: 0.35
      - say: >-
          Nineteen. Count ten in the row and nine more down the column. Both survive in one percent of all
          draws, or about five point three percent of active draws. Overlap can include updates that agree. And
          once you add a sparse change back to a dense base, you still have a dense checkpoint to serve.
        hold: 0.7
        visual_cues:
          - id: active-denominator
            phrase: "Nineteen"
            targets: [dare-grid]
            caption_boundary: true
            linger: 0.35
  - id: recipe-contract
    title: What will the saved model read?
    visual: >-
      Look up return and a fill-in-the-middle token by string, test a greedy soup on new inputs, then pass
      two probes through a layer splice.
    beats:
      - say: >-
          Even checkpoints from one base can have different vocabularies. Look up row four seventeen. One source
          reads it as return. The other uses it for a fill-in-the-middle marker that our code prompts need.
          Pairing by row number would mix two meanings.
        hold: 0.9
        visual_cues:
          - id: row-lookup
            phrase: "row four seventeen"
            targets: [vocabulary]
            linger: 0.35
      - say: >-
          Choose an output vocabulary. Here a compatible union keeps both strings. For return, look up the
          matching row in each source. For the marker, only the code source has a row to supply. Align the input
          embeddings and the output head this way. Test an actual fill-in-the-middle prompt with the saved
          tokenizer and chat template. A base vocabulary that omits the marker would need a different serving
          contract.
        hold: 0.8
        visual_cues:
          - id: token-union
            phrase: "compatible union keeps both strings"
            targets: [vocabulary]
            linger: 0.35
          - id: token-donor
            phrase: "only the code source has a row"
            targets: [vocabulary]
            linger: 0.35
      - say: >-
          Recipes also choose which checkpoints to include. In this toy search, the target for each validation
          input is one. Start with A. Adding B lowers mean squared error, so keep the pair. Try adding C. Its
          predictions move farther from the targets, so keep A and B. A greedy soup accepts improvements, and
          the original rule accepts ties. Searching coefficients and layers costs evaluations. Use fresh final
          cases to check what that search selected.
        hold: 0.75
        visual_cues:
          - id: try-b
            phrase: "Adding B lowers mean squared error"
            targets: [selection]
            linger: 0.35
          - id: try-c
            phrase: "Try adding C"
            targets: [selection]
            linger: 0.35
          - id: held-out
            phrase: "fresh final cases"
            targets: [selection]
            linger: 0.35
      - say: >-
          A splice makes a different kind of candidate. Copy the first four layers from A and the last four from
          B. Both sides have two channels, so the pieces fit. Now follow the first probe. Each B layer doubles
          its first channel. One becomes sixteen. The other probe uses only the second channel and comes through
          unchanged. The dimensions let you build the splice. The first probe tells you why it can still fail.
        hold: 0.8
        visual_cues:
          - id: splice
            phrase: "Copy the first four layers from A and the last four from B"
            targets: [splice]
            linger: 0.35
          - id: probe
            phrase: "Each B layer doubles its first channel"
            targets: [splice]
            linger: 0.35
          - id: probe-y
            phrase: "uses only the second channel"
            targets: [splice]
            linger: 0.35
  - id: precision-diagnosis
    title: Which value reaches the saved checkpoint?
    visual: >-
      Keep a fixed BF16 ruler while rounding the input and then the output of the same halfway merge. The
      two routes end at the same stored weight.
    beats:
      - say: >-
          A mergekit recipe can cast weights as it reads them and again as it saves them. Zoom in on a weight
          just above one. The base is one and the specialist is one point zero zero two. The next bfloat
          sixteen tick is one plus one over one hundred twenty-eight. Round the specialist to the
          nearest tick before merging. It lands on the base. The change is already gone.
        hold: 0.75
        visual_cues:
          - id: round-input
            phrase: "Round the specialist to the nearest tick"
            targets: [precision-ruler]
            linger: 0.35
      - say: >-
          Rewind to the same two inputs and keep them in float thirty-two. Go halfway. The working value is
          about one point zero zero one. Now save that result in bfloat sixteen. It rounds to one again. The
          first route lost the change on input. This one lost it on output. Test the checkpoint you actually
          save and reload.
        hold: 0.9
        visual_cues:
          - id: wide-half
            phrase: "Go halfway"
            targets: [precision-ruler]
            linger: 0.35
          - id: round-output
            phrase: "save that result in bfloat sixteen"
            targets: [precision-ruler]
            linger: 0.35
      - say: >-
          Start from the original floating-point weights when you can. Dequantizing an already rounded source
          gives an approximation. If a saved model produces incoherent text, check the tensor layouts, token
          rows, and output head. Format the same prompt with the audited chat template. Compare the sources
          and the merge under the same decoding settings. Once the artifact is sound, investigate interference.
          If you quantize it for serving, recalibrate and evaluate that version.
        hold: 0.7
        visual_cues:
          - id: saved-weight
            phrase: "saved model"
            targets: [precision-ruler]
            linger: 0.35
  - id: evaluate
    title: Open the three task scores
    visual: >-
      An example release report opens into three score tracks. Each track has the absolute floor and the specialist
      regression floor. The macro average stays in sight while Math is inspected.
    beats:
      - say: >-
          The merged checkpoint scored eighty-seven point two percent in this example. That's the mean,
          with one vote per task. Open the rows. Code scored ninety-two point four, Math eighty-two point one,
          and Chat eighty-seven. Each score comes from the saved candidate on that task's held-out cases.
        hold: 0.85
        caption_starts: ["Open the rows", "Code scored ninety-two point four"]
        visual_cues:
          - id: report-rows
            phrase: "Open the rows"
            targets: [candidate-scores]
            linger: 0.35
      - say: >-
          Compare each dot with its task minimum. Code and Chat cross theirs. Look at Math. Its minimum is
          eighty-five. How far short is that dot?
        hold: 2.35
        visual_cues:
          - id: absolute-floors
            phrase: "task minimum"
            targets: [floors]
            linger: 0.35
      - say: >-
          Two point nine percentage points. There's a second condition in this example. On the same cases each
          task can lose at most one percentage point against its specialist. The Math specialist scored
          eighty-eight, so the effective minimum for Math is eighty-seven. Our candidate is four point nine
          points below that line.
        hold: 0.95
        visual_cues:
          - id: absolute-gap
            phrase: "Two point nine percentage points"
            targets: [math-gap]
            caption_boundary: true
            linger: 0.35
          - id: relative-floors
            phrase: "at most one percentage point against its specialist"
            targets: [floors]
            linger: 0.35
          - id: relative-gap
            phrase: "four point nine points below that line"
            targets: [math-gap]
            linger: 0.35
      - say: >-
          Keep the specialists in service. Math misses both checks. Record the source revisions, tokenizer,
          template, merge method, coefficients, and evaluation cases. Try a new recipe on validation data.
          Apply the same gates to a spherical merge. If it keeps the radius but misses the coding floor,
          set it aside. Use separate release cases to judge the candidate you select, including safety and the
          prompts you will actually serve.
        hold: 0.75
        visual_cues:
          - id: hold-original
            phrase: "Keep the specialists in service"
            targets: [decision]
            caption_boundary: true
            linger: 0.35
  - id: earned-transfer
    title: Would the next candidate clear the same checks?
    visual: >-
      Two signed steps locate a new weight. Two subsequent example score reports keep the release policy
      fixed and move only the Math score.
    beats:
      - say: >-
          Try a fresh weight from another recipe. Start at two. Code ended at two point five and Math ended at
          one point five. Keep six tenths of Code's change and four tenths of Math's. What weight would you
          save?
        hold: 2.7
        visual_cues:
          - id: new-inputs
            phrase: "six tenths of Code"
            targets: [transfer-ruler]
            linger: 0.35
      - say: >-
          You take three tenths of a step right, then two tenths left. That lands at two point one. You can
          now load that checkpoint and score it on each job.
        hold: 0.8
        visual_cues:
          - id: earned-result
            phrase: "three tenths of a step right, then two tenths left"
            targets: [transfer-ruler]
            linger: 0.35
          - id: transfer-weight
            phrase: "That lands at two point one"
            targets: [transfer-ruler]
            caption_boundary: true
            linger: 0.35
      - say: >-
          Suppose the new evaluation gives the same Code and Chat scores, but Math now scores eighty-six point
          four. The absolute Math minimum is still eighty-five. Would you clear all three score gates?
        hold: 2.8
        visual_cues:
          - id: retry-score
            phrase: "Math now scores eighty-six point four"
            targets: [candidate-scores]
            linger: 0.35
      - say: >-
          Hold it. Math lost one point six percentage points against its specialist. We allowed one.
          Move just the Math dot to eighty-seven. Does this checkpoint pass all three score checks?
        hold: 2.7
        caption_starts: ["Move just the Math dot", "Does this checkpoint pass"]
        visual_cues:
          - id: retry-hold
            phrase: "Hold it"
            targets: [decision]
            caption_boundary: true
            linger: 0.35
          - id: boundary-score
            phrase: "Move just the Math dot to eighty-seven"
            targets: [candidate-scores]
            linger: 0.35
      - say: >-
          Yes. Math lands exactly on its limit. Code and Chat still pass. This checkpoint can move on to
          safety and serving tests. Next we'll use a vector index to find evidence for an answer.
        hold: 1.2
        caption_starts: ["This checkpoint can move on", "Next we'll use a vector index"]
        visual_cues:
          - id: pass-scores
            phrase: "Yes"
            targets: [decision]
            caption_boundary: true
            linger: 0.35
          - id: next-tests
            phrase: "safety and serving tests"
            targets: [next-check]
