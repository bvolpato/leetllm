  - id: containment-contract
    title: Who still owns the assigned pod?
    visual: Eight GPU slots share one node. Future placement changes independently of the existing assignment
      and of eviction.
    beats:
      - say: There are two separate admissions here. The gateway decides where a request goes. The scheduler
          decides where a pod runs. If a request was already in flight when readiness changed, the
          workload owner still has to finish or reject it. Retry on a healthy peer only if the budget and
          the operation’s deduplication or side-effect contract allow it.
        hold: 0.8
        visual_cues:
          - id: containment-contract-0
            phrase: The scheduler decides where a pod runs.
            targets:
              - containment-contract-operation
            color: cyan
            linger: 0.25
      - say: Watch the assigned pod under GPU zero. The device plugin marks that GPU unhealthy. Kubernetes now
          reports seven allocatable GPUs out of eight installed. The pod stays on GPU zero. It may fail
          there. Moving it or shutting it down takes a separate action.
        hold: 1
        visual_cues:
          - id: containment-contract-1
            phrase: Watch the assigned pod under GPU zero.
            targets:
              - containment-contract-operation
            color: cyan
            linger: 0.25
          - id: gpu-device-unhealthy
            phrase: marks that GPU unhealthy
            targets:
              - containment-contract-operation
            color: cyan
            linger: 0.25
      - say: A cordon stops ordinary new placements on the whole node. The existing pod is still here with its
          local cache. A drain requests eviction. It can wait on a disruption budget. If eviction
          completes, unrelated tenants can lose work and local empty-directory data can disappear. That
          wider action needs the platform owner’s authority and a reason to disrupt the node.
        hold: 0.9
        visual_cues:
          - id: containment-contract-2
            phrase: The existing pod is still here with its local cache.
            targets:
              - containment-contract-operation
            color: cyan
            linger: 0.25
          - id: gpu-node-cordon
            phrase: A cordon stops ordinary new placements
            targets:
              - containment-contract-operation
            color: cyan
            linger: 0.25
          - id: gpu-node-drain
            phrase: A drain requests eviction.
            targets:
              - containment-contract-operation
            color: cyan
            linger: 0.25
  - id: automation-contract
    title: What changes on the second report?
    visual: One authenticated device and incident key retains its recurrence count and quarantine state
      across repeated and quiet observations.
    beats:
      - say: If a controller handles a device fault, give it a stable incident key. Bind the GPU and node IDs to
          the workload, process, exact error code, first and last timestamps and evidence links. Decode
          category and severity with the parser for that tool version. A line of log text cannot grant
          the workload permission to reset a shared GPU.
        hold: 0.8
        visual_cues:
          - id: automation-contract-0
            phrase: a stable incident key
            targets:
              - automation-contract-operation
            color: cyan
            linger: 0.25
      - say: The first fault opens one quarantine record. A second report for the same key raises its count to
          two. There’s still just one record. A later successful collection finds no new events. The
          count stays at two and the quarantine stays in place. A collection that failed would leave the
          window unknown.
        hold: 0.9
        visual_cues:
          - id: automation-contract-1
            phrase: The first fault opens one quarantine record.
            targets:
              - automation-contract-operation
            color: cyan
            linger: 0.25
          - id: gpu-incident-repeat
            phrase: A second report for the same key raises its count to two.
            targets:
              - automation-contract-operation
            color: cyan
            linger: 0.25
          - id: gpu-incident-quiet
            phrase: A later successful collection finds no new events.
            targets:
              - automation-contract-operation
            color: cyan
            linger: 0.25
      - say: The serving team can route requests, the workload owner can repair the process, and the platform can
          repair the device or node. Enforce those permissions when the controller acts. To reopen the
          route after a device quarantine, the owners need fresh evidence and a separate release.
        hold: 0.8
        visual_cues:
          - id: automation-contract-2
            phrase: Enforce those permissions when the controller acts.
            targets:
              - automation-contract-operation
            color: cyan
            linger: 0.25
  - id: diagnostics
    title: Did the peer test actually run?
    visual: Three runs on an isolated GPU pair share a bandwidth scale. The skipped test leaves its row
      empty. Two measured bars end on opposite sides of the required minimum.
    beats:
      - say: How fast can these two GPUs exchange data? The platform owner isolates the pair. For this
          workload, the link needs to carry sixteen gigabytes per second. Each run records the GPU
          identities, the tool version and the test settings. The lane check counts PCIe lanes. The
          bandwidth test times a transfer between the GPUs.
        hold: 0.85
        visual_cues:
          - id: diagnostics-beat-1-focus-1
            phrase: Each run records the GPU identities, the tool version and the test settings.
            targets:
              - diagnostics-run-provenance
            color: cyan
            linger: 0.25
      - say: In the first run the peer is unavailable, so bandwidth is skipped. The tool exits with zero,
          and we still need a measurement. With the peer available, the second run reaches eleven
          point two. It falls short of sixteen. The third reaches eighteen point four. Both required
          tests pass. Add that result to the worker’s admission checks.
        hold: 1
        caption_starts:
          - It falls short of sixteen.
          - Both required tests pass.
        visual_cues:
          - id: diagnostics-skip
            phrase: bandwidth is skipped
            targets:
              - diagnostics-plugin-results
            color: cyan
            linger: 0.25
          - id: gpu-result-diagnostic-incomplete
            phrase: The tool exits with zero, and we still need a measurement.
            targets:
              - diagnostics-run-result
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: diagnostics-fail
            phrase: With the peer available, the second run reaches eleven point two.
            targets:
              - diagnostics-plugin-results
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: diagnostics-below
            phrase: It falls short of sixteen.
            targets:
              - diagnostics-plugin-results
            color: pink
            linger: 0.25
          - id: diagnostics-both-pass
            phrase: The third reaches eighteen point four.
            targets:
              - diagnostics-plugin-results
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: diagnostics-beat-2-focus-1
            phrase: Both required tests pass.
            targets:
              - diagnostics-run-result
            color: cyan
            linger: 0.25
  - id: diagnostic-plan
    title: Do both passes cover the run?
    visual: A declared pair of required plugins is evaluated on one identified topology. A third failing
      result changes coverage even when both required rows pass.
    beats:
      - say: Pick the test for the incident. In the article’s DCGM run table, level one checks readiness and
          level two can check memory, PCIe and NVLink around a failure. The bandwidth and collective
          tests begin at level three. Level four extends the administrator’s burn-in. Confirm the
          installed plugins and version on this hardware before you plan the run.
        hold: 0.85
        visual_cues:
          - id: diagnostic-plan-0
            phrase: Pick the test for the incident.
            targets:
              - diagnostic-plan-operation
            color: cyan
            linger: 0.25
      - say: Here the question is whether this particular pair can sustain the required bandwidth. Run the probe
          across that pair on isolated hardware. Save the command, versions, topology, parameters, time,
          raw results and exit status together. If the executable is missing, a raw Fail describes a
          setup problem. Read the full error before declaring a device defective.
        hold: 0.85
        visual_cues:
          - id: diagnostic-plan-1
            phrase: this particular pair
            targets:
              - diagnostic-plan-operation
            color: cyan
            linger: 0.25
          - id: gpu-diagnostic-probe
            phrase: Run the probe across that pair
            targets:
              - diagnostic-plan-operation
            color: cyan
            linger: 0.25
          - id: gpu-diagnostic-setup
            phrase: If the executable is missing
            targets:
              - diagnostic-plan-operation
            color: cyan
            linger: 0.25
      - say: Declare PCIe and bandwidth as required. With bandwidth skipped, coverage is false. A missing result
          or Not Run leaves the same gap. Now both required tests pass. Coverage is true for this run.
          Add one more result, a memory failure. Coverage goes back to false. Decode that failure. The
          check requires a nonempty plan, passes for all required tests, and no failure anywhere in the
          run.
        hold: 1
        visual_cues:
          - id: diagnostic-plan-2
            phrase: Declare PCIe and bandwidth as required.
            targets:
              - diagnostic-plan-operation
            color: cyan
            linger: 0.25
          - id: gpu-result-diagnostic-required-false
            phrase: coverage is false
            targets:
              - diagnostic-plan-operation
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: gpu-diagnostic-required-pass
            phrase: Coverage is true for this run.
            targets:
              - diagnostic-plan-operation
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: gpu-diagnostic-extra-fail
            phrase: Add one more result, a memory failure.
            targets:
              - diagnostic-plan-operation
            color: cyan
            linger: 0.25
          - id: gpu-diagnostic-pass-input
            phrase: Now both required tests pass.
            targets:
              - diagnostic-plan-operation
            color: cyan
            linger: 0.15
          - id: gpu-diagnostic-extra-false
            phrase: Coverage goes back to false.
            targets:
              - diagnostic-plan-operation
            caption_boundary: true
            color: cyan
            linger: 0.25
  - id: soak
    title: Would you stop the burn-in at cycle five?
    visual: A fixed 1.50 GiB threshold crosses two block-size traces. The restart-only run stops at its first
      violation. A separate run under a lower concurrency cap exercises the same request shape.
    beats:
      - say: Back at the summarizer, the workload owner restarted the process. Here’s a synthetic burn-in. Repeat
          the same one-and-a-half-gibibyte workspace allocation and release. For this test, stop if the
          largest reusable block drops below the request. Follow the first four cycles. It still fits at
          cycle four. The fifth sample comes in at one point four gibibytes. Would you let this run
          continue?
        hold: 1.9
        visual_cues:
          - id: soak-first-four
            phrase: Follow the first four cycles.
            targets:
              - soak-trace
            color: cyan
            linger: 0.25
          - id: soak-sample
            phrase: The fifth sample comes in at one point four gibibytes.
            targets:
              - soak-trace
            color: cyan
            linger: 0.25
      - say: Stop the run at cycle five. The largest block has fallen a tenth of a gibibyte below the request.
          Save its receipt. The test caught the block shape crossing its limit. Device-free memory and
          other pools could still serve an allocation. A threshold crossing gives us a reason to hold
          traffic without having to wait for another failure.
        hold: 1
        visual_cues:
          - id: soak-fifth
            phrase: Stop the run at cycle five.
            targets:
              - soak-trace
            color: cyan
            linger: 0.25
            caption_boundary: true
      - say: Start a separate run with a lower concurrency cap. Keep the workspace size, its lifetime and the
          peer path the same. Replay all eight cycles. The new run completes with its blocks above the
          line. Compare the snapshots and outside use. If the outside delta grows, find the owner. If
          live demand grows, inspect the batch and sequence limits, cache sizing, graph pools and
          workspace lifetimes.
        hold: 1
        visual_cues:
          - id: soak-cap
            phrase: a lower concurrency cap
            targets:
              - soak-trace
            color: cyan
            linger: 0.25
          - id: soak-replay
            phrase: Replay all eight cycles.
            targets:
              - soak-trace
            color: cyan
            linger: 0.25
  - id: canary-construction
    title: What did the probe exercise?
    visual: The same allocate, exchange and release sequence spans a worker and its peer. A functional probe
      leaves the peer lane idle. A bounded two-rank canary exercises the missing path.
    beats:
      - say: The smaller concurrency cap passed the block-size test. That burn-in started with the expected model
          and configuration on a fresh process. Before applying load, the owners checked the GPU
          identity, process owners and idle memory. Now suppose the failed workload also exchanged
          buffers with a second rank. This HTTP probe ran on just the first worker.
        hold: 0.85
      - say: The response has the right shape. Look at the empty peer lane. Could a hundred more of these
          responses tell you whether the two ranks can exchange a buffer?
        hold: 2
      - say: Bring the peer into the canary on isolated hardware. Allocate the workspace, exchange across the
          pair, then release it. Repeat that lifecycle for the declared count. Watch memory and outside
          use, new device errors and link counters, clocks, power, temperature and request latency
          against the agreed limits. If any gate fails, stop, save the receipt and investigate before
          trying user traffic.
        hold: 1
        visual_cues:
          - id: canary-pair
            phrase: Bring the peer into the canary
            targets:
              - canary-lanes
            color: cyan
            linger: 0.25
          - id: canary-cycle
            phrase: Allocate the workspace, exchange across the pair, then release it.
            targets:
              - canary-lanes
            color: cyan
            linger: 0.25
  - id: earned-gpu-transfer
    title: A new worker asks for 3 GiB
    visual: A fresh 32 GiB receipt uses the same memory comparison. After a separate device finding and
      process error arrive, the same worker needs two owners to act.
    beats:
      - say: Try a fresh worker. Its native allocator recorded an out-of-memory error on a three-gibibyte
          request. The upper bar gives capacity, reserve and device use. Below it are the inactive total
          and the largest piece. All other signals are clear. How much is free on the device, how much is
          outside reserve, and which evidence would you inspect first?
        hold: 2.5
      - say: The device has two and a half gibibytes free. Three and a half sit outside reserve. That’s below the
          worksheet’s four-gibibyte alert. Five gibibytes are split into pieces no larger than three
          quarters of a gibibyte. Inspect the allocator layout and attribute outside use. The evidence
          supports fragmentation. This allocation error alone leaves a restart up to policy.
        hold: 1
        visual_cues:
          - id: fresh-free
            phrase: The device has two and a half gibibytes free.
            targets:
              - fresh-budget
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: fresh-outside
            phrase: Three and a half sit outside reserve.
            targets:
              - fresh-budget
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: fresh-fragments
            phrase: Inspect the allocator layout and attribute outside use.
            targets:
              - fresh-decision
            color: cyan
            linger: 0.25
            caption_boundary: true
      - say: While the worker is held, a new incident report arrives. It adds a decoded device memory defect and
          an illegal address in this process. The platform owner and the workload owner each have a
          decision. What must each of them do?
        hold: 2.1
        visual_cues:
          - id: fresh-finding
            phrase: a decoded device memory defect and an illegal address
            targets:
              - fresh-event
            color: cyan
            linger: 0.25
      - say: Isolate the GPU and relaunch the process. The platform handles the device finding. The workload
          owner preserves the error within the capture deadline, terminates the inconsistent process and
          brings up a replacement after the required device repair. A quiet event window can follow both
          repairs while the GPU is still in quarantine.
        hold: 1
        visual_cues:
          - id: fresh-both
            phrase: Isolate the GPU and relaunch the process.
            targets:
              - fresh-decision
            color: cyan
            linger: 0.25
            caption_boundary: true
