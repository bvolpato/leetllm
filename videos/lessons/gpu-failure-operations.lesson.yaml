scenes:
  - id: intro
    title: Where should the next request go?
    visual: The summarizer’s failed allocation and the smaller device-free reading share a scale.
      A new request waits at the fork until the gateway closes the summarizer’s route and sends it to the peer.
    beats:
      - say: Here comes another request. The summarizer just failed to allocate one and a half gibibytes.
          The GPU had only point six two gibibytes free. The other replica is still serving. Which
          replica should get this request?
        hold: 2.2
        caption_starts:
          - The summarizer just failed to allocate one and a half gibibytes.
          - Which replica should get this request?
        visual_cues:
          - id: intro-allocation
            phrase: The summarizer just failed to allocate one and a half gibibytes.
            targets:
              - intro-receipt
            color: cyan
            linger: 0.25
          - id: intro-peers
            phrase: The other replica is still serving.
            targets:
              - intro-router
            color: cyan
            linger: 0.25
          - id: intro-arrive
            phrase: Here comes another request.
            targets:
              - intro-router
            color: yellow
            linger: 0.25
      - say: Close admission to the summarizer. Send the new arrival to the healthy peer. The failed request
          stays with the summarizer. Capture its allocator snapshot while the process is alive.
        hold: 0.9
        caption_starts:
          - Send the new arrival to the healthy peer.
        visual_cues:
          - id: intro-close
            phrase: Close admission to the summarizer.
            targets:
              - intro-router
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: intro-route
            phrase: Send the new arrival to the healthy peer.
            targets:
              - intro-router
            color: cyan
            linger: 0.25
  - id: receipt-contract
    title: Which worker produced this receipt?
    visual: A failed request binds to the pod, process, GPU and node. A bounded dump can preserve the
      original process evidence.
    beats:
      - say: Follow the request ID across the incident receipt. Process seventeen handled this request.
          Record the pod’s unique ID, restart count and process ID alongside the node and GPU identifier. Keep
          the model revision, allocator settings, driver and runtime versions with the timestamps.
          Tomorrow a pod with the same display name could have a different process behind it.
        hold: 0.8
        visual_cues:
          - id: receipt-contract-0
            phrase: Follow the request ID across the incident receipt.
            targets:
              - receipt-contract-operation
            color: cyan
            linger: 0.25
          - id: gpu-receipt-bind
            phrase: a pod with the same display name could have a different process
            targets:
              - receipt-contract-operation
            color: cyan
            linger: 0.25
      - say: With new work routed away, take a snapshot from the affected process. Match it to device memory and
          process owners in the same window. Save driver events, error-correcting memory counters,
          clocks, power and temperature. If the dump hangs past the deadline, keep what you have and
          proceed with required isolation. Killing the process loses its unsaved history. A reset can
          erase device evidence too.
        hold: 0.8
        visual_cues:
          - id: receipt-contract-1
            phrase: With new work routed away
            targets:
              - receipt-contract-operation
            color: cyan
            linger: 0.25
          - id: gpu-capture-dump
            phrase: take a snapshot from the affected process
            targets:
              - receipt-contract-operation
            color: cyan
            linger: 0.25
          - id: gpu-capture-deadline
            phrase: If the dump hangs past the deadline
            targets:
              - receipt-contract-operation
            color: cyan
            linger: 0.25
      - say: Stacks and paths can identify another tenant’s code. Store the receipt with restricted access,
          encryption and a retention limit. Stable IDs and hashes let responders join evidence without
          copying another tenant’s command line or prompt. Capture payloads only when the incident policy
          requires them.
        hold: 0.8
        visual_cues:
          - id: receipt-contract-2
            phrase: Stacks and paths can identify another tenant’s code.
            targets:
              - receipt-contract-operation
            color: cyan
            linger: 0.25
  - id: history-construction
    title: How can a real failure disappear from history?
    visual: Four slots retain the newest events. The write pointer wraps, and a durable dump outlives the
      process.
    beats:
      - say: To see the allocations leading up to a failure, enable history before the workload. The article sets
          a limit of a hundred thousand entries and dumps from that same process. These are private
          PyTorch APIs, so pin the version you’ve validated. A long history can grow to gigabytes. Its
          stacks remain sensitive even when you open the file in the local viewer.
        hold: 0.8
        visual_cues:
          - id: history-construction-0
            phrase: a hundred thousand entries
            targets:
              - history-construction-operation
            color: cyan
            linger: 0.25
      - say: Shrink the buffer to four slots. Write A, B, C and D. A marks the failed allocation. The
          buffer is full. When E arrives, which record will it replace?
        hold: 2
        caption_starts:
          - When E arrives, which record will it replace?
        visual_cues:
          - id: history-construction-1
            phrase: four slots
            targets:
              - history-construction-operation
            color: cyan
            linger: 0.25
          - id: gpu-history-four
            phrase: Write A, B, C and D.
            targets:
              - history-construction-operation
            color: cyan
            linger: 0.25
      - say: E replaces A. The alert has already fired, but its record is gone. F replaces B.
          A dump taken now contains C through F, the four most recent events.
        hold: 0.9
        caption_starts:
          - F replaces B.
        visual_cues:
          - id: gpu-history-wrap
            phrase: E replaces A.
            targets:
              - history-construction-operation
            color: yellow
            linger: 0.25
          - id: gpu-history-next
            phrase: F replaces B.
            targets:
              - history-construction-operation
            color: cyan
            linger: 0.25
      - say: Save the dump before restarting. When the old process ends, the four entries on the right survive in
          incident storage. Record when capture started, its entry limit, and when the dump finished.
          Starting too late can also miss a failure. When a free is still pending on a stream, keep that
          separate from a completed free.
        hold: 0.8
        visual_cues:
          - id: history-construction-2
            phrase: Save the dump before restarting.
            targets:
              - history-construction-operation
            color: cyan
            linger: 0.25
          - id: gpu-history-restart
            phrase: When the old process ends
            targets:
              - history-construction-operation
            color: cyan
            linger: 0.25
  - id: memory-contract
    title: Where did the 40 GiB go?
    visual: A fixed device bar brackets PyTorch reserve. Two magnified rulers compare the reserve gap with
      inactive splits and the failed request with device-free memory.
    beats:
      - say: Here’s the memory snapshot from that worker. The bracket covers everything PyTorch has reserved. The
          blue part holds live tensors. Subtract live from reserved. That leaves six point six gibibytes
          inside the bracket. The allocator still owns those bytes. How much of that gap can the snapshot
          explain?
        hold: 1.3
        visual_cues:
          - id: memory-subtract
            phrase: That leaves six point six gibibytes inside the bracket.
            targets:
              - memory-detail
            color: cyan
            linger: 0.25
            caption_boundary: true
      - say: Magnify just the gap. Inactive split blocks account for six point one. These are unused pieces of
          segments that still contain live allocations. Subtract them and half a gibibyte remains. We
          need the block layout to tell which pieces could serve one request.
        hold: 0.8
        visual_cues:
          - id: memory-splits
            phrase: Inactive split blocks account for six point one.
            targets:
              - memory-detail
            color: cyan
            linger: 0.25
          - id: memory-remainder
            phrase: half a gibibyte remains
            targets:
              - memory-detail
            color: cyan
            linger: 0.25
            caption_boundary: true
      - say: Now make the lower ruler the length of the failed request. Only point six two gibibytes are free on
          the device. That leaves it short by point eight eight. Could the allocator serve the request
          from space it already holds?
        hold: 1.4
        visual_cues:
          - id: memory-short
            phrase: That leaves it short by point eight eight.
            targets:
              - memory-detail
            color: cyan
            linger: 0.25
            caption_boundary: true
  - id: fragments
    title: Compare the request with individual reusable blocks
    visual: One request outline crosses seven inactive splits on a shared scale. Occupied spans separate the
      holes.
    beats:
      - say: The allocator holds more memory than its live tensors use. Some reserve supports later reuse, and
          some can be trapped in split segments. Here inactive fragments add up to more than the failed
          request, yet none of the observed fragments is large enough. The request needs a suitable block
          under the allocator rules.
        hold: 0.65
        visual_cues:
          - id: fragments-beat-1-focus-1
            phrase: Here inactive fragments add up to more than the failed request, yet none of the observed
              fragments is large enough
            targets:
              - fragments-operation
            color: cyan
            linger: 0.65
          - id: fragments-beat-1-focus-2
            phrase: Here inactive fragments add up to more than the failed request
            targets:
              - fragments-operation
            color: yellow
            linger: 0.65
      - say: Follow the request across those separated fragments. Adding their sizes does not create one
          contiguous allocation. This supports fragmentation under pressure as a working hypothesis.
          Inspect pending frees, stream ordering, segment pools, and the allocator backend. Native
          split-block statistics cannot be copied unchanged onto an asynchronous allocator with different
          accounting semantics.
        hold: 0.65
        motion_check:
          region:
            - 160
            - 330
            - 1630
            - 500
          minimumChangedFraction: 0.002
        visual_cues:
          - id: fragments-beat-2-focus-1
            phrase: Follow the request across those separated fragments
            targets:
              - fragments-operation
            color: cyan
            linger: 0.65
          - id: gpu-fragment-probe
            phrase: Follow the request across those separated fragments. Adding their sizes does not create one
              contiguous allocation.
            targets:
              - fragments-operation
            color: cyan
            linger: 0.15
  - id: ownership
    title: Who owns the bytes past the bracket?
    visual: Two rulers share device identity, sample window and scale. Removing the NVML reading withdraws
      only the outside-reserve subtraction.
    beats:
      - say: Line up two readings from the failure. PyTorch reports the memory its allocator holds. NVIDIA’s
          Management Library measures use across the device. Match the GPU, the partition if it has one,
          and the sample times. How far does the lower bar extend past the allocator? Two point six eight
          gibibytes lie outside its reserve. That’s more than the shortfall. Whether any of it can be
          released depends on who owns it.
        hold: 0.9
        visual_cues:
          - id: owner-delta
            phrase: Two point six eight gibibytes lie outside its reserve.
            targets:
              - owner-delta-value
            color: cyan
            linger: 0.25
            caption_boundary: true
      - say: Look for direct CUDA allocations, communication buffers such as NCCL’s, or another process.
          PyTorch’s own graph pools may already be inside its reserve. To call a process stale, check its
          identity and expected teardown. NVML version two counts system-reserved memory in device use.
          On systems where the operating system manages GPU pages, some can remain after a process exits.
        hold: 0.8
      - say: Take away the device reading. The allocator still reports the same reserve. What changes is the
          outside amount. It becomes unknown. Collect a comparable reading before you assign those bytes
          to another process or change allocator settings.
        hold: 0.9
        visual_cues:
          - id: owner-missing
            phrase: Take away the device reading.
            targets:
              - owner-readings
            color: cyan
            linger: 0.25
  - id: analyzer-construction
    title: Which worker exceeds the 40 GiB limit?
    visual: The article’s two 40 GiB OOM receipts share a capacity ruler. Each requested size appends to the
      live tensors. After the comparison the analyzer shows all eight results.
    beats:
      - say: The next receipt comes from another forty-gibibyte device. This time live tensors occupy thirty-nine
          point one. Imagine clearing everything except each worker’s live tensors. Magnify the end of
          the second ruler. Its live tensors end here, and the worker needs one more gibibyte. Which
          worker would still run out, even with the rest of the device to itself?
        hold: 2.2
        visual_cues:
          - id: analyzer-zoom
            phrase: Magnify the end of the second ruler.
            targets:
              - analyzer-capacity
            color: blue
            linger: 0.25
      - say: Lay the one-gibibyte request down at the end of the blue block. The second worker needs forty point
          one gibibytes. That last tenth cannot fit. Reduce live demand there. The first worker would
          need only thirty-one point six. Its live demand fits under this ceiling, so look back at which
          blocks it can actually use.
        hold: 0.9
        visual_cues:
          - id: analyzer-add
            phrase: Lay the one-gibibyte request down at the end of the blue block.
            targets:
              - analyzer-capacity
            color: yellow
            linger: 0.15
          - id: analyzer-answer
            phrase: The second worker needs forty point one gibibytes.
            targets:
              - analyzer-capacity
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: analyzer-first
            phrase: The first worker would need only thirty-one point six.
            targets:
              - analyzer-capacity
            caption_boundary: true
            color: blue
            linger: 0.25
      - say: The article’s read-only worksheet makes that comparison on saved receipts. Before classifying
          anything, it checks the inputs. It accepts a missing reading as unknown. A Boolean size or a
          negative count is invalid. The live bytes must fit inside their reserve. The reserve must fit
          inside device use, and the largest hole must fit inside the inactive total. A millionth of a
          gibibyte is allowed for rounding. Decode a raw diagnostic failure before supplying it as a
          device finding.
        hold: 0.85
      - say: Now look at the first two results. The same out-of-memory alert led to a layout investigation on one
          worker and a capacity change on the other. Device, fabric, driver and process errors take
          precedence in this worksheet. Unknown CUDA errors need interpretation. A clock limit correlated
          with a regression, a stale owner, or at least four gibibytes outside reserve can also take
          priority over allocator layout. That four-gibibyte threshold belongs to this example. The
          separate relaunch column follows the exact process error in every row.
        hold: 1
  - id: event-construction
    title: Same bytes, different incident
    visual: Four receipts share one unchanged memory bar. Each new row changes one field relative to the
      native OOM at the top. The local classifier computes the output for that row.
    beats:
      - say: Pin the first worker’s memory readings in place. Its native allocator recorded an out-of-memory
          error and the size that failed. On that evidence the worksheet reports allocator fragmentation.
          Now we'll keep those bytes fixed and change what the worker recorded.
        hold: 0.75
        visual_cues:
          - id: event-base
            phrase: the worksheet reports allocator fragmentation
            targets:
              - event-row-0
            color: cyan
            linger: 0.25
            caption_boundary: true
      - say: Change the operation result to success. The size field still says one and a half. This is the result
          of the allocation itself. There’s no failure to explain, so the worksheet returns unclassified.
        hold: 0.9
        visual_cues:
          - id: event-success-input
            phrase: Change the operation result to success.
            targets:
              - event-row-1
            color: cyan
            linger: 0.25
          - id: event-success
            phrase: the worksheet returns unclassified
            targets:
              - event-row-1
            color: cyan
            linger: 0.25
            caption_boundary: true
      - say: Start from the first row again. Keep the failure and remove its size. You’ve lost the length you
          need to compare against the blocks. The out-of-memory failure is unresolved. A recorded size of
          zero takes the same path.
        hold: 0.9
        visual_cues:
          - id: event-size-input
            phrase: Keep the failure and remove its size.
            targets:
              - event-row-2
            color: cyan
            linger: 0.25
          - id: event-size
            phrase: The out-of-memory failure is unresolved.
            targets:
              - event-row-2
            color: cyan
            linger: 0.25
            caption_boundary: true
      - say: For the last row, copy both the failure and its size from the first. Change only the allocator to
          CUDA malloc async. Those split-block measurements have native allocator semantics. The
          worksheet leaves this failure unresolved too. Use the asynchronous backend’s own evidence
          before tuning it. It ignores the native maximum split size setting.
        hold: 0.9
        visual_cues:
          - id: event-backend-input
            phrase: Change only the allocator to CUDA malloc async.
            targets:
              - event-row-3
            color: cyan
            linger: 0.25
          - id: event-backend
            phrase: The worksheet leaves this failure unresolved too.
            targets:
              - event-row-3
            color: cyan
            linger: 0.25
            caption_boundary: true
  - id: fault-construction
    title: Which event came first?
    visual: A stalled peer leaves request buffers held on the surviving rank. Separate event-specific
      examples show application and device recovery scopes.
    beats:
      - say: There’s another way a worker can run out of memory. Imagine a two-rank collective. Its peer stops
          responding. The first rank holds its buffers and more requests accumulate behind them. Its next
          allocation fails. Compare each rank’s first timestamp with link counters and the peer topology.
          Changing the allocator on the surviving rank can leave the earlier fault in place.
        hold: 0.9
        visual_cues:
          - id: fault-construction-0
            phrase: Imagine a two-rank collective.
            targets:
              - fault-construction-operation
            color: cyan
            linger: 0.25
          - id: gpu-peer-stall
            phrase: Its peer stops responding.
            targets:
              - fault-construction-operation
            color: cyan
            linger: 0.25
          - id: gpu-peer-buffers
            phrase: holds its buffers and more requests accumulate
            targets:
              - fault-construction-operation
            color: cyan
            linger: 0.25
          - id: gpu-peer-oom
            phrase: Its next allocation fails.
            targets:
              - fault-construction-operation
            color: cyan
            linger: 0.25
      - say: A new uncorrectable memory error calls for device investigation. An Xid is a driver event. It can
          come from software, hardware or an application. Read the action for the exact code. For the
          catalog’s code ninety-four, restart the affected application. The others can keep running, with
          a reset recommended when convenient. Change that to code ninety-five. Now the platform owner
          must reset the GPU before applications restart.
        hold: 1
        visual_cues:
          - id: fault-construction-1
            phrase: An Xid is a driver event.
            targets:
              - fault-construction-operation
            color: cyan
            linger: 0.25
          - id: gpu-xid-uncontained
            phrase: Change that to code ninety-five.
            targets:
              - fault-construction-operation
            color: cyan
            linger: 0.25
      - say: A slower clock also needs context. Here the card draws two hundred and fifty watts against a limit
          of two hundred and fifty. The active reason is a software power cap. Check the approved limit,
          the workload and the regression window. Thermal slowdown asks a different question about
          temperature. A driver and runtime mismatch at startup belongs with the platform team.
        hold: 0.85
        visual_cues:
          - id: fault-construction-2
            phrase: A slower clock also needs context.
            targets:
              - fault-construction-operation
            color: cyan
            linger: 0.25
  - id: contain
    title: Stop admission and account for existing work
    visual: A two-replica replay follows six new arrivals and two existing requests through a process failure.
    beats:
      - say: Contain the affected replica by stopping new admission. Readiness changes future routing; it does
          not instantly cancel in-flight requests or close every existing connection. Our two-replica
          trace keeps those existing requests visible while later arrivals move to the healthy worker.
          Safe retries also need the request side-effect and deduplication contract.
        hold: 0.65
        visual_cues:
          - id: contain-beat-1-focus-1
            phrase: it does not instantly cancel in-flight requests or close every existing connection
            targets:
              - contain-existing-owners
            color: cyan
            linger: 0.65
          - id: contain-beat-1-focus-2
            phrase: Contain the affected replica by stopping new admission
            targets:
              - contain-admission-router-gpu-0-closed
            color: yellow
            linger: 0.65
      - say: A process-corrupting CUDA error requires stronger containment than an ordinary allocation failure.
          An illegal-address error can surface at a later synchronization point and leaves the process
          unsafe for continued work. Preserve the first observed exact error, terminate and relaunch that
          process, and expand scope only when device or node evidence requires it.
        hold: 0.65
        visual_cues:
          - id: contain-beat-2-focus-1
            phrase: An illegal-address error can surface at a later synchronization point and leaves the process
              unsafe for continued work
            targets:
              - contain-cuda-error-illegal-address
              - contain-existing-owners
            color: cyan
            linger: 0.65
          - id: contain-beat-2-focus-2
            phrase: A process-corrupting CUDA error requires stronger containment than an ordinary allocation failure
            targets:
              - contain-gpu-0-trace-process
            color: yellow
            linger: 0.65
          - id: contain-relaunch
            phrase: terminate and relaunch that process
            targets:
              - contain-gpu-0-trace-process
              - contain-existing-owners
            color: yellow
            linger: 0.65
  - id: async-construction
    title: Which worker has to relaunch?
    visual: Two workers retain their original CUDA results above the clearing error records and identical
      HTTP probes. The exact captured error determines each process obligation.
    beats:
      - say: These two receipts name the original errors in a common format. The summarizer failed to allocate
          memory. On the vision worker, the host submitted a kernel and moved on. A later synchronization
          reports an illegal address. Save that exact error with the stream, request and time. The place
          that reported the failure can be several calls away from the work that caused it.
        hold: 0.85
        visual_cues:
          - id: async-sync
            phrase: A later synchronization reports an illegal address.
            targets:
              - async-captured
            color: cyan
            linger: 0.25
      - say: Suppose each worker now reads its last error on the same host thread. The first read clears the
          record. In this example the second read returns success on both. Both workers also pass their
          HTTP probes. Look back at the saved operation above those green results. Which worker has to
          relaunch before it can serve again?
        hold: 2.3
        visual_cues:
          - id: async-read
            phrase: The first read clears the record.
            targets:
              - async-record
            color: cyan
            linger: 0.25
          - id: async-success
            phrase: the second read returns success on both
            targets:
              - async-record
            color: cyan
            linger: 0.25
          - id: async-http
            phrase: Both workers also pass their HTTP probes.
            targets:
              - async-record
            color: cyan
            linger: 0.25
      - say: The vision worker has to relaunch. Reading the error cleared a record. The illegal address left the
          process inconsistent. Preserve what you can within the deadline, then terminate and relaunch
          it. Launch failure and kernel execution timeout also carry that requirement. The summarizer’s
          allocation error leaves a restart up to its repair policy. Both still need fresh admission
          checks. In an isolated debug run, launch blocking can help locate the original operation, but
          it changes execution timing.
        hold: 1
        visual_cues:
          - id: async-verdict
            phrase: The vision worker has to relaunch.
            targets:
              - async-action
            color: cyan
            linger: 0.25
            caption_boundary: true
  - id: mixed-construction
    title: One receipt can give two owners work
    visual: The vision worker adds Xid 31 to its illegal address. Its primary hypothesis changes while its
      process obligation survives.
    beats:
      - say: Give the vision worker a second signal. Its receipt still records the illegal address, and the
          driver also reports Xid thirty-one. The worksheet’s primary result is an Xid event. Decode the
          catalog action for that GPU. The process must still relaunch. The workload owner can preserve
          and terminate it while the platform investigates the code. Coordinate the relaunch with any
          required device repair.
        hold: 0.9
        visual_cues:
          - id: mixed-construction-0
            phrase: Its receipt still records the illegal address
            targets:
              - mixed-construction-operation
            color: cyan
            linger: 0.25
          - id: gpu-result-mixed-primary
            phrase: The worksheet’s primary result is an Xid event.
            targets:
              - mixed-construction-operation
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: gpu-result-mixed-relaunch
            phrase: The process must still relaunch.
            targets:
              - mixed-construction-operation
            color: cyan
            linger: 0.25
            caption_boundary: true
      - say: For the catalog’s contained error with code ninety-four, the affected application still has to
          restart. Now take the illegal-address receipt and substitute a decoded device memory finding
          for the Xid. The primary result switches to a device memory fault. The exact CUDA error still
          requires the process owner to act.
        hold: 0.9
        visual_cues:
          - id: mixed-construction-1
            phrase: contained error with code ninety-four
            targets:
              - mixed-construction-operation
            color: cyan
            linger: 0.25
          - id: gpu-mixed-memory
            phrase: substitute a decoded device memory finding for the Xid
            targets:
              - mixed-construction-operation
            color: cyan
