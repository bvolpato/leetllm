            color: blue
            linger: 0.25
          - id: cp-initialization-0-4
            phrase: The article's teaching loop raises rather than propagating a not-a-number center.
            targets:
              - initialization-construction
            color: green
            linger: 0.25
      - say: An explicit repair policy could reseed the empty center at the point farthest from any current center,
          then run assignments again. It must also state tie handling and stopping. Our NumPy loop resolves
          distance ties to the first center, stops when assignments repeat and enforces a twenty-step cap.
          Exact assignments and means with consistent ties and nonempty groups reach a fixed assignment; a
          tolerance or iteration cap may stop a library run earlier.
