  - id: seeding-mass
    title: Squared distance becomes a sampling probability
    visual: Retain the six IDs and first seed A. Accumulate exact D-squared masses into a CDF, place explicitly
      supplied drawu=.8, reveal selectedF separately, then update nearest-seed distances. Original versus
      greedy variant and expected bound are separately labeled.
    beats:
      - say: The original k-means-plus-plus algorithm draws its first center uniformly from the data. For each later
          choice, find each point's distance to its closest selected center, square that distance, then divide
          by the sum of those squared distances. Sample from those normalized masses. Already selected
          coordinates have zero mass, while nearby different coordinates can still have positive mass.
        hold: 0.5
        visual_cues:
          - id: cp-seeding-mass-0-0
            phrase: The original k-means-plus-plus algorithm draws its first center uniformly from the data.
            targets:
