  - id: algorithm-contract
    title: Check the matrix before assigning a group
    visual: Same six vectors enter an n-by-d matrix and three k-by-d centers. A mismatched one-coordinate center
      is shown broadcasting before rejection; one NaN blocks assignment. The squared-error gradient resolves
      to the actual arithmetic mean.
    beats:
      - say: The distance rule needs an input contract. Documents have n rows and d features, while centers have k
          rows and the same d features. Reject a center matrix with the wrong feature width and reject
          nonfinite coordinates. NumPy can silently broadcast a one-coordinate center across several features,
          so a calculation that runs can still compare the wrong objects.
        hold: 0.5
        visual_cues:
          - id: cp-algorithm-contract-0-0
            phrase: The distance rule needs an input contract.
            targets:
              - algorithm-contract-construction
            color: blue
            linger: 0.25
          - id: cp-algorithm-contract-0-1
            phrase: Documents have n rows and d features, while centers have k rows and the same d features.
            targets:
              - algorithm-contract-construction
            color: blue
            linger: 0.25
          - id: cp-algorithm-contract-0-2
            phrase: Reject a center matrix with the wrong feature width and reject nonfinite coordinates.
            targets:
              - algorithm-contract-construction
            color: blue
            linger: 0.25
          - id: cp-algorithm-contract-0-3
            phrase: NumPy can silently broadcast a one-coordinate center across several features, so a calculation that
              runs can still compare the wrong objects.
            targets:
              - algorithm-contract-construction
            color: green
            linger: 0.25
      - say: For fixed memberships, differentiate the sum of squared distances to a center. The gradient is minus two
          times the sum of each point minus the center. Setting it to zero makes the center the
          coordinate-wise arithmetic mean. That is the unique minimizer for a nonempty group under this
          objective. A change of metric needs its own update rule.
