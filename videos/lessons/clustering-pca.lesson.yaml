    visual: Same centered6x2 matrix builds sample covariance and direct SVD. Squared singular values divide by5 to
      match eigenvalues11.1825/1.9442; a100x1536 matrix illustrates covariance storage/rank limits without a
      speed claim.
    beats:
      - say: PCA assumes the same fitted mean has been subtracted from every row. For n greater than one, sample
          covariance is the centered transpose times the centered matrix, divided by n minus one. Its
          eigenvectors give principal directions and eigenvalues give captured sample variance. Direct
          singular-value decomposition of the centered matrix gives the same directions through its right
          singular vectors.
