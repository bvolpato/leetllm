scenes:
  - id: intro
    title: Who gets row four?
    visual: R1's single query slides into packed row 3 beside R0's three queries. Row 4 stays open through
      the question. R2's four queries move together, then its nine keys appear above the packed buffer.
    beats:
      - say: One query slides into row three. R zero filled the first three rows, starting at zero. R one
          needs just this row for its next token. Which request gets row four?
        hold: 2.4
        caption_starts:
          - R zero filled the first three rows
        visual_cues:
          - id: intro-first-four
            phrase: One query slides into row three.
            targets:
              - intro-batch
            linger: 0.25
            caption_boundary: true
          - id: intro-ask
            phrase: Which request gets row four?
            targets:
              - intro-batch
            linger: 0.25
            caption_boundary: true
      - say: R two gets row four. Copy its four queries into the remaining spaces. Eight useful rows
          fit where the rectangle reserved twelve. R zero and R two are reading chunks of their
          prompts. R one is decoding one token. All three can use the same packed buffer.
        hold: 0.8
        caption_starts:
          - Eight useful rows fit where the rectangle reserved twelve.
          - R zero and R two are reading chunks of their prompts.
        visual_cues:
          - id: intro-owner
            phrase: R two gets row four.
            targets:
              - intro-batch
            linger: 0.25
            caption_boundary: true
          - id: intro-pack
            phrase: Copy its four queries into the remaining spaces.
            targets:
              - intro-batch
            linger: 0.25
            caption_boundary: true
      - say: Follow the first query from R two. Its request already holds nine keys, including the four just
          appended. FlashInfer needs two pieces of information to answer that query. Which rows belong to this
          request, and where does it keep its keys?
        hold: 0.8
        visual_cues:
          - id: intro-history
            phrase: Its request already holds nine keys, including the four just appended.
            targets:
              - intro-batch
            linger: 0.25
            caption_boundary: true
  - id: pointers
    title: Two ways to find R2
    visual: Two indexed strips expose query rows and page identifiers. The brackets select each request on both
      strips and end at different offsets for R2.
    beats:
      - say: Start both counts at zero. The top strip holds query rows. The first request takes three, so its next
          boundary is three. The bottom strip holds page identifiers. That same request has two pages, seven
          and two. Its next boundary here is two.
        hold: 0.6
        visual_cues:
          - id: pointers-first
            phrase: That same request has two pages, seven and two.
            targets:
              - pointers-ranges
            linger: 0.25
            caption_boundary: true
      - say: The middle request adds one to each count. On top, it takes row three. Below, it takes entry two, which
          contains page eleven. The brackets include their starting index and stop just before the next
          boundary.
        hold: 0.7
        visual_cues:
          - id: pointers-middle
            phrase: Below, it takes entry two, which contains page eleven.
            targets:
              - pointers-ranges
            linger: 0.25
            caption_boundary: true
      - say: For R two, start at query row four and stop before eight. The page entries start at three and stop
          before six. Read the three numbers inside that lower bracket in order. They tell us which pages to
          open.
        hold: 0.8
        visual_cues:
          - id: pointers-last
            phrase: Read the three numbers inside that lower bracket in order.
            targets:
              - pointers-ranges
            linger: 0.25
            caption_boundary: true
  - id: pages
    title: From a logical key to its cache slot
    visual: Three fixed four-slot pages show R2's keys. Division selects a listed page and the remainder selects
      a slot. Repeat on the last key to expose the unused tail.
    beats:
      - say: Here are those pages, in the order R two uses them. Each has four slots, numbered from zero. Key five
          belongs to our first new query. Which page and slot would you load for key five?
        hold: 2
        visual_cues:
          - id: pages-five
            phrase: Which page and slot would you load for key five?
            targets:
              - pages-lookup
            linger: 0.25
            caption_boundary: true
      - say: One full group of four comes before key five. That puts it in entry one of the list. The remainder of
          five divided by four is one. Key five lives on page fourteen, slot one. Fourteen is the page
          identifier the allocator put there.
        hold: 0.9
        caption_starts:
          - That puts it in entry one of the list.
          - The remainder of five divided by four is one.
        visual_cues:
          - id: pages-address
            phrase: Key five lives on page fourteen, slot one.
            targets:
              - pages-lookup
            linger: 0.25
            caption_boundary: true
      - say: Try key eight. Two full groups come before it, with no remainder. It lives on page six, slot zero.
          That's the only occupied slot on the last page. The serving engine owns these pages. FlashInfer
          follows the list when it loads keys and values.
        hold: 0.8
        caption_starts:
          - Two full groups come before it, with no remainder.
        visual_cues:
          - id: pages-eight
            phrase: Try key eight.
            targets:
              - pages-lookup
            linger: 0.25
            caption_boundary: true
          - id: pages-tail
            phrase: It lives on page six, slot zero.
            targets:
              - pages-lookup
            linger: 0.25
            caption_boundary: true
  - id: page-permutation
    title: What if the page IDs are sorted?
    visual: The physical contents stay fixed. Sorting the lookup list redirects entry one to the empty slot on
      page 6. Restoring the order selects k5 again.
    beats:
      - say: Someone sorts the page identifiers before passing them to the kernel. Keep your eye on entry one.
          Change only the list to three, six, fourteen. The lookup for key five still picks entry one and slot
          one. See what it finds on page six. That slot is empty.
        hold: 1.4
        visual_cues:
          - id: fi-page-permutation-sort
            phrase: Change only the list to three, six, fourteen.
            targets:
              - fi-page-permutation-mechanism
            linger: 0.25
            caption_boundary: true
          - id: fi-page-permutation-wrongpage
            phrase: That slot is empty.
            targets:
              - fi-page-permutation-mechanism
            linger: 0.25
            caption_boundary: true
      - say: Every address was inside the allocation. The wrong value came from changing which page counts as the
          second page. Restore the original order. The same lookup now lands back on key five.
        hold: 0.75
        visual_cues:
          - id: fi-page-permutation-repair
            phrase: Restore the original order.
            targets:
              - fi-page-permutation-mechanism
            linger: 0.25
            caption_boundary: true
      - say: Two full pages and one occupied tail slot give nine keys. For a nonempty list, multiply page size by
          the number of full pages before the last, then add its occupied length. Our CPU check rejects an
          empty list, negative page IDs and tail lengths outside one through four.
        hold: 0.7
        visual_cues:
          - id: pages-length
            phrase: Two full pages and one occupied tail slot give nine keys.
            targets:
              - fi-page-permutation-mechanism
            linger: 0.25
            caption_boundary: true
  - id: causal
    title: Where does the read stop?
    visual: Four query markers sit under their own keys in the physical cache. A bracket counts readable keys
      through the selected query, including the final step onto page 6.
    beats:
      - say: All nine keys are in memory. The five earlier keys came from the prefix. The four queries underneath
          belong to the new tokens. Look at the yellow query, the first of the four. Which key is the last one
          it may read?
        hold: 2.4
        visual_cues:
          - id: causal-query
            phrase: Look at the yellow query, the first of the four.
            targets:
              - causal-history
            linger: 0.25
            caption_boundary: true
      - say: It stops at its own key, five. Count from zero through five. Those six keys can affect this query's
          answer. Keys six, seven and eight are already in memory, but they come from its future.
        hold: 0.8
        visual_cues:
          - id: causal-stop
            phrase: It stops at its own key, five.
            targets:
              - causal-history
            linger: 0.25
            caption_boundary: true
          - id: causal-read
            phrase: Count from zero through five.
            targets:
              - causal-history
            linger: 0.25
            caption_boundary: true
      - say: Move to query one. It gains key six. Move to query two. Key seven is now in reach. Move to query three.
          Only this last query crosses onto page six and reads key eight. Four queries share one cache and
          each sees a different prefix.
        hold: 1
        visual_cues:
          - id: causal-one
            phrase: Move to query one.
            targets:
              - causal-history
            linger: 0.25
            caption_boundary: true
          - id: causal-two
            phrase: Move to query two.
            targets:
              - causal-history
            linger: 0.25
            caption_boundary: true
          - id: causal-three
            phrase: Move to query three.
            targets:
              - causal-history
            linger: 0.25
            caption_boundary: true
  - id: causal-rule
    title: Place the query in its history
    visual: Right-align the four new queries, try two incorrect masks while holding q0 fixed, then work a fresh
      seven-key request at local row one.
    beats:
      - say: To compute the boundary, count the keys already in the cache, including those just appended. Call that
          count K. Subtract the number of new queries, Q. That gives the position of the first new token. For
          any new query, add its local row index to that starting position. Allow every logical key up to and
          including that position.
        hold: 0.65
        visual_cues:
          - id: fi-causal-rule-0
            phrase: For any new query, add its local row index to that starting position.
            targets:
              - fi-causal-rule-mechanism
            linger: 0.25
            caption_boundary: true
          - id: fi-causal-rule-0-result
            phrase: Allow every logical key up to and including that position.
            targets:
              - fi-causal-rule-mechanism
            linger: 0.25
            caption_boundary: true
      - say: For R two, nine keys minus four queries leaves five earlier positions. The first row sees six keys. The
          next sees seven. Row two sees eight. The last sees nine. The last row reaches the last column.
          That's why this mask is called bottom-right aligned.
        hold: 0.6
        visual_cues:
          - id: fi-causal-rule-1
            phrase: The first row sees six keys.
            targets: &a1
              - fi-causal-rule-mechanism
            linger: 0.25
            caption_boundary: true
          - id: rule-seven
            phrase: The next sees seven.
            targets: *a1
            linger: 0.25
            caption_boundary: true
          - id: rule-eight
            phrase: Row two sees eight.
            targets: *a1
            linger: 0.25
            caption_boundary: true
          - id: rule-nine
            phrase: The last sees nine.
            targets: *a1
            linger: 0.25
            caption_boundary: true
          - id: fi-causal-rule-1-result
            phrase: That's why this mask is called bottom-right aligned.
            targets:
              - fi-causal-rule-mechanism
            linger: 0.25
            caption_boundary: true
      - say: Select the first query again. Align a triangle at the top left and the query loses five legal keys.
          Remove the mask and it reads three future keys. Align the four new queries with the end of the nine
          keys. The first row can see six again. A paged-prefill wrapper can carry this mix of query lengths.
          A dedicated batch-decode wrapper expects one query per request.
        hold: 0.9
        visual_cues:
          - id: rule-top
            phrase: Align a triangle at the top left
            targets:
              - fi-causal-rule-mechanism
            linger: 0.25
            caption_boundary: true
          - id: rule-open
            phrase: Remove the mask
            targets:
              - fi-causal-rule-mechanism
            linger: 0.25
            caption_boundary: true
          - id: rule-restore
            phrase: Align the four new queries with the end of the nine keys.
            targets:
              - fi-causal-rule-mechanism
            linger: 0.25
            caption_boundary: true
          - id: fi-causal-rule-2
            phrase: Align a triangle at the top left and the query loses five legal keys. Remove the mask and it reads
              three future keys. Align the four new queries with the end of the nine keys.
            targets:
              - fi-causal-rule-mechanism
            linger: 0.25
            caption_boundary: true
      - say: Try a different request. It has seven keys and three new queries. Look at local row one. Seven minus
          three puts the first new token at four. Where does the read for row one stop?
        hold: 2.4
        visual_cues:
          - id: causal-transfer
            phrase: It has seven keys and three new queries.
            targets:
              - fi-causal-rule-mechanism
            linger: 0.25
            caption_boundary: true
      - say: It stops at key five. Row one comes one place after four, so it can read six keys. Changing where the
          sequence is stored could change the values you load. The logical boundary still comes from the query
          position.
        hold: 0.8
        caption_starts:
          - Row one comes one place after four
        visual_cues:
          - id: causal-transfer-answer
            phrase: It stops at key five.
            targets:
              - fi-causal-rule-mechanism
            linger: 0.25
            caption_boundary: true
  - id: merge
    title: How much weight does each worker carry?
    visual: R2's first six visible keys become six weight bars. Split them at the page boundary. Change only the
      last score and compare the new weight shares for the same six keys.
    beats:
      - say: Go back to the first query of R two, on a single head. Split its six visible keys at the page boundary. Worker
          A gets the first four keys. Give each the value vector one, zero. Worker B gets the other two, with
          value zero, one. Give all six a score of zero. Which worker gets more weight?
        hold: 2.2
        caption_starts:
          - Worker B gets the other two
          - Which worker gets more weight?
        visual_cues:
          - id: merge-split
            phrase: Split its six visible keys at the page boundary.
            targets:
              - merge-weights
            linger: 0.25
            caption_boundary: true
      - say: Exponentiating a zero score gives one. The four bars on the left carry four units of weight. The two on
          the right carry two. A gets two thirds and B gets one third. Those shares are also the two
          coordinates of the output, because our workers' values point along different axes.
        hold: 1
        caption_starts:
          - The four bars on the left carry four units of weight.
          - The two on the right carry two.
        visual_cues:
          - id: merge-share
            phrase: A gets two thirds and B gets one third.
            targets:
              - merge-weights
            linger: 0.25
            caption_boundary: true
      - say: Keep the same keys and values. Change the last score to the natural log of three. Its bar now carries
          three units. The other five still carry one each. Where does the weight divide now?
        hold: 2.4
        caption_starts:
          - Where does the weight divide now?
        visual_cues:
          - id: merge-change
            phrase: Change the last score to the natural log of three.
            targets:
              - merge-weights
            linger: 0.25
            caption_boundary: true
      - say: Each worker now carries half the weight. The right pair contributes one plus three, which matches the
          four on the left. Counting keys happened to work when their scores were equal. To merge real
          workers, we need the weight behind each local average.
        hold: 0.9
        visual_cues:
          - id: merge-equal
            phrase: Each worker now carries half the weight.
            targets:
              - merge-weights
            linger: 0.25
            caption_boundary: true
  - id: merge-recurrence
    title: What must a worker return?
    visual: Two worker records retain their normalized vector and base-two log mass. Align the scales under one
      shift, form both coordinate shares, then store the parent statistic beside the merged output.
    beats:
      - say: Put the last score back to zero. Our workers carry masses four and two again. Each returns a local
          average and a second number. Sum the natural exponentials of that worker's scores, then take the
          base-two logarithm. That's the stored log-sum-exp. Four becomes two, and two becomes one.
        hold: 0.75
        visual_cues:
          - id: recurrence-original
            phrase: Put the last score back to zero.
            targets:
              - recurrence-states
            linger: 0.25
            caption_boundary: true
      - say: Use the larger stored number, two, as a common shift. Subtract it from each statistic, then raise two
          to each difference. A has weight one. B has weight one half. They sum to one and a half. Divide each
          by that sum before multiplying the local outputs. The shares are two thirds and one third.
        hold: 0.9
        visual_cues:
          - id: recurrence-shift
            phrase: A has weight one. B has weight one half.
            targets:
              - recurrence-states
            linger: 0.25
            caption_boundary: true
          - id: recurrence-shares
            phrase: The shares are two thirds and one third.
            targets:
              - recurrence-states
            linger: 0.25
            caption_boundary: true
      - say: A later worker may need to merge with this result. Keep the output and put its weight back on the
          original scale. Add the shift to the base-two log of one and a half. The parent statistic is about
          two point five eight five. It represents all six units of weight, even after we discard the original
          scores.
        hold: 0.9
        visual_cues:
          - id: recurrence-parent
            phrase: The parent statistic is about two point five eight five.
            targets:
              - recurrence-states
            linger: 0.25
            caption_boundary: true
  - id: merge-units
    title: Name the producer before converting its statistic
    visual: Two producer records expose backend, version and LSE base. A single conversion changes ln mass into
      log2 mass; a second conversion visibly distorts the already-correct relative weights.
    beats:
      - say: "A producer returning natural-log L S E needs one conversion before this base-two merge: divide its
          statistic by the natural logarithm of two. Keep its normalized output unchanged. An already base-two
          producer needs no conversion. Dividing again changes the relative masses and therefore generally
          changes the output."
        hold: 0.65
        visual_cues:
          - id: fi-merge-units-0
            phrase: "A producer returning natural-log L S E needs one conversion before this base-two merge: divide its
              statistic by the natural logarithm of two. Keep its normalized output unchanged. An already
              base-two producer needs no conversion. Dividing again changes the relative masses and therefore
              generally changes the output."
            targets:
              - fi-merge-units-mechanism
            color: cyan
            linger: 0.35
          - id: fi-merge-units-0-result
            phrase: Dividing again changes the relative masses and therefore generally changes the output.
            targets:
              - fi-merge-units-mechanism
            color: yellow
            linger: 0.35
      - say: This was a real version boundary. The pinned zero point six eighteen cuDNN frontend path returned its
          natural-log statistic without conversion. The zero point seven zero release included the conversion
          fix. In the released zero point seven one low-level interface, log two is the default output choice
          and natural log is an explicit alternative.
        hold: 0.65
        visual_cues:
          - id: fi-merge-units-1
            phrase: This was a real version boundary. The pinned zero point six eighteen cuDNN frontend path returned its
              natural-log statistic without conversion. The zero point seven zero release included the
              conversion fix. In the released zero point seven one low-level interface, log two is the default
              output choice and natural log is an explicit alternative.
            targets:
              - fi-merge-units-mechanism
            color: cyan
            linger: 0.35
          - id: fi-merge-units-1-result
            phrase: In the released zero point seven one low-level interface, log two is the default output choice and
              natural log is an explicit alternative.
            targets:
              - fi-merge-units-mechanism
            color: yellow
            linger: 0.35
      - say: That natural-log alternative belongs to the frontend path. The cubin cuDNN path returns base-two
          statistics and rejects a natural-log request. Record the producer backend, release and argument with
          the state. A library version by itself is insufficient to infer the units of every returned
          statistic.
        hold: 0.8
        visual_cues:
          - id: fi-merge-units-2
            phrase: That natural-log alternative belongs to the frontend path. The cubin cuDNN path returns base-two
              statistics and rejects a natural-log request. Record the producer backend, release and argument
              with the state. A library version by itself is insufficient to infer the units of every returned
              statistic.
            targets:
              - fi-merge-units-mechanism
            color: cyan
            linger: 0.35
          - id: fi-merge-units-2-result
            phrase: A library version by itself is insufficient to infer the units of every returned statistic.
            targets:
              - fi-merge-units-mechanism
            color: yellow
            linger: 0.35
  - id: merge-domain
    title: Handle empty mass before subtracting infinities
    visual: The reference empty state carries a zero vector and negative-infinity statistic. Branches return the
      nonempty state or the same empty sentinel before the finite recurrence; a separate finite1e308 example
      normalizes scales before multiplication.
    beats:
      - say: An empty or fully masked range has zero normalization mass and no ordinary normalized output. Our CPU
          reference represents it by a zero vector and negative infinity. If one side is empty, return the
          other state. If both are empty, return that same empty representation. Handle these cases before
          subtracting the maximum.
        hold: 0.65
        visual_cues:
          - id: fi-merge-domain-0
            phrase: An empty or fully masked range has zero normalization mass and no ordinary normalized output. Our CPU
              reference represents it by a zero vector and negative infinity. If one side is empty, return the
              other state. If both are empty, return that same empty representation. Handle these cases before
              subtracting the maximum.
            targets:
              - fi-merge-domain-mechanism
            color: cyan
            linger: 0.35
          - id: fi-merge-domain-0-result
            phrase: Handle these cases before subtracting the maximum.
            targets:
              - fi-merge-domain-mechanism
            color: yellow
            linger: 0.35
      - say: Subtracting negative infinity from itself leaves the shift undefined. The CPU reference also
          rejects NaN, positive infinity, mismatched vector dimensions and a nonzero vector paired with
          the empty sentinel. The pinned CUDA merge applies the finite recurrence directly. Handle an
          empty range before calling it.
        hold: 0.65
        visual_cues:
          - id: fi-merge-domain-1
            phrase: Subtracting negative infinity from itself leaves the shift undefined. The CPU
              reference also rejects NaN, positive infinity, mismatched vector dimensions and a nonzero
              vector paired with the empty sentinel. The pinned CUDA merge applies the finite recurrence
              directly. Handle an empty range before calling it.
            targets:
              - fi-merge-domain-mechanism
            color: cyan
            linger: 0.35
          - id: fi-merge-domain-1-result
            phrase: The pinned CUDA merge applies the finite recurrence directly. Handle an empty range
              before calling it.
            targets:
              - fi-merge-domain-mechanism
            color: yellow
            linger: 0.35
      - say: Take two equal outputs, each ten to the three hundred eighth, with equal weights. Their
          average should be the same number. Adding the outputs first overflows. Normalize the two scales
          to one half first, multiply, then add. Both halves fit, and their sum gives back the original
          value.
        hold: 0.8
        visual_cues:
          - id: fi-merge-domain-2
            phrase: Take two equal outputs, each ten to the three hundred eighth, with equal weights.
              Their average should be the same number. Adding the outputs first overflows. Normalize the
              two scales to one half first, multiply, then add. Both halves fit, and their sum gives back
              the original value.
            targets:
              - fi-merge-domain-mechanism
            color: cyan
            linger: 0.35
          - id: fi-merge-domain-2-result
            phrase: Both halves fit, and their sum gives back the original value.
            targets:
              - fi-merge-domain-mechanism
            color: yellow
            linger: 0.35
          - id: fi-merge-domain-half
            phrase: Normalize the two scales to one half first, multiply, then add.
            targets:
              - fi-merge-domain-mechanism
            color: yellow
            linger: 0.35
  - id: merge-partition
    title: Partition keys, not just worker labels
    visual: Two equal-logit key identities first form a disjoint partition, then the first key is mistakenly
      inserted again. Actual numerator and mass change from one-over-two to two-over-three; restoring disjoint
      ownership repairs them.
    beats:
      - say: Take two equal-logit keys whose values are the two coordinate directions. Together they produce one half,
          one half. Now merge that full state with another state containing the first key again. The first key
          contributes twice, so the output becomes two thirds, one third. It stays finite while answering a
          different attention problem.
        hold: 0.65
        visual_cues:
          - id: fi-merge-partition-0
