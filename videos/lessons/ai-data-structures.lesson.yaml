      - say: The posting counters skip M1. Bring back its score from the scan. Zero fails the positive-score
          check, so we discard M1 without comparing it with the root. M2 keeps its place. Sort the winners strongest first.
          A bounded heap uses space for two winners, while
          the score dictionary still holds its candidates.
        hold: 0.55
        visual_cues:
          - id: heap-scan-zero
            phrase: Bring back its score from the scan
            targets: [heap-actors]
            color: cyan
          - id: heap-discard
            phrase: discard M1
