  - id: hash-collision
    title: Two words land in one bucket
    visual: Both even character sums route to bucket zero. Probe the stored words, overwrite one entry
      using only the bucket number, then restore the saved postings under their word keys.
    beats:
      - say: In this two-bucket index, add up the letter codes for each word and take the remainder after division
          by two. Follow each sum to its bucket. Both are even, so both land in zero. The bucket holds both words.
        hold: 0.65
        visual_cues:
          - id: ds-hash-collision-0
            phrase: Follow each sum to its bucket
            targets:
              - ds-hash-collision-mechanism
            color: cyan
            linger: 0.4
        caption_starts:
          - Both are even
      - say: Ask for twice. Compare it with charged, then with twice. Only the second string matches. A
          hashable key keeps a stable hash, and equal keys must have equal hashes. Two different
          keys can still collide.
        hold: 0.9
        visual_cues:
          - id: ds-hash-collision-1
            phrase: Compare it with charged, then with twice
            targets:
              - ds-hash-collision-mechanism
            color: cyan
            linger: 0.4
        caption_starts:
          - Only the second string matches
      - say: Try storing just the number zero as the key. Charged has already written its three IDs there.
          Now write the two IDs for twice in the same place. Look for charged again. Which note went
          missing?
        hold: 2.5
        visual_cues:
          - id: ds-hash-collision-2
            phrase: Now write the two IDs for twice in the same place
            targets:
              - ds-hash-collision-mechanism
            color: green
            linger: 0.4
      - say: The overwrite lost M3. Restore the saved postings under their original word keys. Charged
          leads to M0, M2 and M3 again. Dictionary lookup takes constant time on average with suitable hashes and
          bounded key costs. Many collisions can force a linear search, and hashing a long new
          string takes work of its own.
        hold: 0.8
        visual_cues:
          - id: hash-restore
            color: cyan
            linger: 0.4
            phrase: Restore the saved postings under their original word keys
            targets:
              - ds-hash-collision-mechanism
