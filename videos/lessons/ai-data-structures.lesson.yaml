            phrase: Move down the list
            targets:
              - scan-records
            color: yellow
            linger: 0.65
      - say: The sign-in note earned no score, but the scan still read it. Repeated questions repeat that
          work. We can prepare a different direction of lookup before the next request.
        hold: 0.55
        visual_cues:
