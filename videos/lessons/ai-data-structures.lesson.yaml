  - id: heap
    title: Which note gives up its place?
    visual: The scored records enter a two-place min-heap. The viewer can see the scores before the root
      leaves. Tied winners switch positions as the heap is repaired.
    beats:
      - say: The posting counters now hold candidate scores. Keep the two strongest notes in a min-heap. Put
          the once-charged note into the root, the position we inspect when something stronger
          arrives.
        hold: 0.55
        visual_cues:
          - id: heap-first
            phrase: Put the once-charged note into the root
            targets:
              - heap-actors
            color: green
            linger: 0.65
      - say: The plan-change note has two points and enters the child slot. The parent is weaker than its
          child. Only that partial order is required inside the heap.
        hold: 0.55
        visual_cues:
          - id: heap-second
            phrase: enters the child slot
            targets:
              - heap-actors
            color: green
            linger: 0.65
      - say: The earlier note also has two points. The heap is full. Predict which retained note should
          leave before we move anything.
        hold: 1.3
        visual_cues:
          - id: heap-predict
            phrase: Predict which retained note should leave
            targets:
              - heap-actors
            color: yellow
            linger: 0.65
      - say: The weaker root leaves and the earlier note takes its place. Tied scores favor the lower
          message ID. Restore the heap by moving the plan-change note up and the earlier note down.
          The root is again the next result to evict.
        hold: 0.65
        visual_cues:
          - id: heap-replace
            phrase: weaker root leaves
            targets:
              - heap-actors
            color: pink
            linger: 0.65
          - id: heap-sift
            phrase: moving the plan-change note up and the earlier note down
            targets:
