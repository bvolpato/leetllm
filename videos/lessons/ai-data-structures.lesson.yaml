  - id: heap-order
    title: What can the root tell you?
    visual: Inspect the two edges of a three-node heap. Then replay the zero-score arrival with and
      without the replacement guard. Count the edges on a seven-slot heap's repair path, then use the same three candidates to compare keeping one winner with sorting them all.
    beats:
      - say: Here are three numbers in a heap. Suppose smaller keys went left and larger keys went right.
          Which way would you look for five? Take a look at where five actually sits.
        hold: 2.1
      - say: Check one against each of its children. One is smaller than either child. That satisfies the
          min-heap rule. Now compare the left child with the root. Five is bigger than one. A binary
          search tree would put larger keys on the right. A heap can leave its two children in
          either order.
        hold: 0.7
        visual_cues:
          - id: ds-heap-order-0
            phrase: Check one against each of its children
            targets:
              - ds-heap-order-mechanism
            color: cyan
            linger: 0.4
          - id: heap-order-left
            color: cyan
            linger: 0.4
            phrase: Now compare the left child with the root
            targets:
              - ds-heap-order-mechanism
        caption_starts:
          - One is smaller
          - Five is bigger
      - say: Go back to the zero-point arrival. Call heap replace without checking the score. Watch which ID
          leaves.
        hold: 1.5
        visual_cues:
          - id: ds-heap-order-1
            phrase: Call heap replace without checking the score
            targets:
              - ds-heap-order-mechanism
            color: cyan
            linger: 0.4
      - say: M2 was a winner. Rewind and compare before replacing the root. The incoming key is smaller, so
          keep M2. Python compares the score first, then the negative ID. That's how the lower ID
          wins a tie.
        hold: 0.9
        visual_cues:
          - id: heap-order-guard
            color: cyan
            linger: 0.4
            phrase: Rewind and compare before replacing the root
            targets:
              - ds-heap-order-mechanism
      - say: Find the root in one lookup. This heap has seven slots. Follow a repair down one path.
          Two edges take us to a leaf. A push or pop compares a few keys per level. Doubling a binary heap adds one level.
          When Python resizes the backing list, it can also copy every reference.
          To keep k winners from m candidates, we repair at most one path per candidate. For k between two and m
          inclusive, that takes order m times log k work and k extra slots.
          For one winner, keep the best seen so far. For nearly all the candidates, sorting can be simpler.
          Python's n-largest can sort directly when the whole list fits the limit.
        hold: 0.75
        visual_cues:
          - id: ds-heap-order-2
            phrase: Follow a repair down one path
            targets:
              - ds-heap-order-mechanism
            color: green
            linger: 0.4
          - id: heap-order-double
            phrase: Doubling a binary heap adds one level
            targets: [ds-heap-order-mechanism]
            color: cyan
          - id: heap-order-resize
            phrase: Python resizes the backing list
            targets: [ds-heap-order-mechanism]
            color: cyan
          - id: heap-order-budget
            phrase: To keep k winners from m candidates
            targets: [ds-heap-order-mechanism]
            color: cyan
          - id: heap-order-one
            phrase: For one winner, keep the best seen so far
            targets: [ds-heap-order-mechanism]
            color: green
          - id: heap-order-sort
            phrase: For nearly all the candidates
            targets: [ds-heap-order-mechanism]
            color: green
  - id: code-contract
