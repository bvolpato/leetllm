  - id: representation
    title: What does a list slot hold?
    visual: Follow a reference from slot three to M2 after front insertion. Compare the list with a
      packed row of numbers.
    beats:
      - say: Follow the reference from slot three to the plan-change note. In CPython a list keeps its
          references side by side. Moving one leaves the note itself where it was. A known slot
          takes constant time to read. If all you have is an ID, finding its slot can take a full
          scan.
        hold: 0.65
        visual_cues:
          - id: ds-representation-0
            phrase: Follow the reference from slot three to the plan-change note
            targets:
              - ds-representation-mechanism
            color: cyan
            linger: 0.4
      - say: With a row of measurements, each cell can hold the number itself. Python's array module packs
          values of one basic type. A numeric tensor adds a shape and a data type for doing math
          across those values. Our list of note references can change. Python therefore rejects the
          list as a dictionary key. A tuple of integer IDs can serve as a key.
        hold: 0.85
        visual_cues:
          - id: ds-representation-1
            phrase: Python therefore rejects the list as a dictionary key. A tuple of integer IDs can serve as a
              key
            targets:
              - ds-representation-mechanism
            color: cyan
            linger: 0.4
  - id: amortized-ledger
    title: How many references move?
    visual: Follow seven references into a doubling array. The old-copy and new-write totals accumulate
      separately. Drain the same seven from the front, then count the shifts for a backlog of fifty thousand.
    beats:
      - say: Count writes as the notes arrive. This example doubles capacity whenever it fills. CPython
          chooses its own growth factor. Fill the first three slots. The fourth arrival copies all
          three references and adds one. The next two arrivals use those spare slots.
        hold: 0.75
        visual_cues:
          - id: ds-amortized-ledger-0
            phrase: Fill the first three slots
            targets:
              - ds-amortized-ledger-mechanism
            color: cyan
            linger: 0.4
          - id: ledger-fourth
            phrase: The fourth arrival copies all three references and adds one
            targets:
              - ds-amortized-ledger-mechanism
            color: cyan
            linger: 0.4
          - id: ledger-fifth-sixth
            phrase: The next two arrivals use those spare slots
            targets:
              - ds-amortized-ledger-mechanism
            color: cyan
            linger: 0.4
      - say: The seventh arrival copies six references and writes one of its own. Across the whole run, nine
          copies plus seven new entries make sixteen writes. As a doubling array grows, the sizes it
          copies form a geometric sum. Total copying grows in proportion to the number of appends.
          That's what amortized constant time buys you. One append can still be expensive.
        hold: 0.8
        visual_cues:
          - id: ds-amortized-ledger-1
            phrase: The seventh arrival copies six references and writes one of its own
            targets:
              - ds-amortized-ledger-mechanism
            color: cyan
            linger: 0.4
        caption_starts:
          - Across the whole run
      - say: Now drain those seven from the front. Six survivors slide left on the first removal, five on
          the next. Keep removing the oldest until the row is empty. That's twenty-one moves. For n
          items the shifts add up to n times the quantity n minus one, divided by two. A deque can
          take the oldest from its end without paying for that slide. Reaching into the middle of a deque can still take linear time.
        hold: 0.9
        visual_cues:
          - id: ds-amortized-ledger-2
            phrase: Six survivors slide left on the first removal, five on the next. Keep removing the oldest
              until the row is empty
            targets:
              - ds-amortized-ledger-mechanism
            color: green
            linger: 0.4
      - say: Try the same drain with fifty thousand jobs. Take the first job and count the ones behind it. Every one of those references has to move. The next removal shifts one fewer. Sum those shrinking rows. More than a billion shifts just to deliver the jobs in order.
        hold: 0.8
        visual_cues:
          - id: ledger-backlog
            phrase: Take the first job and count the ones behind it
            targets: [ds-amortized-ledger-mechanism]
            color: cyan
          - id: ledger-drain
            phrase: Sum those shrinking rows
            targets: [ds-amortized-ledger-mechanism]
            color: yellow
  - id: scan
    title: How many notes did the search open?
    visual: A scan counts the distinct matching words in each of the original four notes, including the
      zero-score sign-in note.
    beats:
      - say: Test the question against the notes. The simplest search opens every note. Lowercase the words
          and ignore punctuation in this tiny tokenizer. Move down the list, count matching query
          words, and keep each score with its message ID.
        hold: 0.55
        visual_cues:
