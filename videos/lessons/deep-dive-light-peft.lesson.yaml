  - id: shared-fleet
    title: Select which artifacts may share one base
    visual: Two tasks’ head sets retain their IDs as separate bases, an execution mask and a survivor union are
      compared. The union physically approaches the original width.
    beats:
      - say: Separate pruned bases give each task its own shape. That duplicates base weights and sends requests to
          different workers. An unpruned base plus masks can share storage. Whether it saves work depends on
          the kernels. Or keep every head that either task uses. As tasks accumulate, that union can grow back
          toward the original width.
        hold: 0.75
        visual_cues:
          - id: lp-separate
            phrase: Separate pruned bases
            targets:
              - lp-fleet
            color: cyan
            linger: 0.4
          - id: lp-masks
            phrase: unpruned base plus masks
            targets:
              - lp-fleet
            color: cyan
            linger: 0.4
          - id: lp-union
            phrase: union can grow back toward the original width
            targets:
              - lp-fleet
            color: cyan
            linger: 0.4
      - say: Changing the actual tensors between requests introduces another job. The server would need to synchronize
          the rewrite, reload compatible layouts and handle cache invalidation. The paper tests switching
          masks and modules in its setup. Before routing requests on a compiled or sharded fleet, demonstrate
          load, output and cache compatibility on that fleet.
        hold: 0.75
        visual_cues:
          - id: lp-cache-layout
            phrase: cache invalidation
            targets:
              - lp-fleet-cache
            color: cyan
            linger: 0.4
  - id: shift-gate
    title: A quiet prefix does not approve a changed task distribution
    visual: The same selected-head artifact moves from early D0 to a held-out D1 population. The aggregate and
      required shifted-slice counters update separately and the slice failure keeps continuation unapproved.
    beats:
      - say: An early policy supplies the trajectories used to score the gates. After a cut, an online
          reinforcement-learning policy may visit different states. A head that looked quiet on the early
          distribution could matter there. Even later supervised batches can shift. The paper’s static tasks
          leave this online question open.
        hold: 0.75
      - say: Take a held-out example. All fifty familiar cases pass, and six of ten shifted cases pass. The aggregate
          is fifty-six of sixty, about ninety-three percent. On the shifted cases the pass rate is only sixty
          percent. This experiment requires eighty percent on that slice, so hold the cut.
        hold: 0.75
        visual_cues:
          - id: lp-shift-counts
            phrase: six of ten shifted cases pass
            targets:
              - lp-shift
            color: cyan
            linger: 0.4
          - id: lp-shift-aggregate
            phrase: fifty-six of sixty
            targets:
              - lp-shift-total
            color: cyan
            linger: 0.4
          - id: lp-shift-slice
            phrase: only sixty percent
            targets:
              - lp-shift-total
            color: cyan
            linger: 0.4
          - id: lp-shift-hold
            phrase: hold the cut
            targets:
              - lp-shift-gate
            color: cyan
            linger: 0.4
      - say: Save the policy and mask revisions with the trajectories. Compare reward on the same inputs before and
          after pruning, and measure how the two trajectory distributions differ. That helps distinguish a
          changed model response from a changed mix of cases. Keep the original base and adapter so you can
          replay a failure.
        hold: 0.75
