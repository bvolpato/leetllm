version: 1
id: deep-dive-light-peft
title: "Light-PEFT: From Importance Scores to Smaller Tensors"
source: projects/deep-dive-light-peft/content.md
sources:
  - title: Gu et al. Light-PEFT original ACL2024 paper, equations and protocols
    url: https://aclanthology.org/2024.findings-acl.447/
  - title: Exact inspected Light-PEFT source pin
    url: https://github.com/gccnlp/Light-PEFT/tree/7b10c22026fe6fa283d127353a50d6ed7176a8aa
  - title: LoRA original method
    url: https://arxiv.org/abs/2106.09685
  - title: QLoRA original frozen-quantized-base scope
    url: https://arxiv.org/abs/2305.14314
scenes:
  - id: opening
    title: What gets cheaper when we cut one LoRA rank?
    visual: The eight features of the token “cat” slide into alignment with a frozen query matrix. Its rows
      light up as they consume the features. Beside it, the two unmerged adapter factors count their work.
      First the adapter loses a rank. Then a head cut removes two output rows from both W and B.
    beats:
      - say: Watch the word cat slide into place. Its eight features line up with eight weights in the first row.
          Each row makes one query output. Eight rows take sixty-four multiply-add pairs. The same token goes
          through the adapter, first through A, then through B. That takes thirty-two more pairs. If we halve
          the adapter rank, which count falls?
        hold: 2.2
        caption_starts:
          - Eight rows take
          - That takes thirty-two
          - If we halve
        visual_cues:
          - id: open-pull-back
            phrase: Each row makes one query output
            targets:
              - open-base
            color: blue
            linger: 0.18
          - id: open-token
            phrase: Eight rows take sixty-four multiply-add pairs
            targets:
              - open-base
            color: blue
            linger: 0.18
          - id: open-branch
            phrase: first through A, then through B
            targets:
              - open-adapter
            color: cyan
            linger: 0.18
      - say: Take away one row of A and its column in B. The adapter goes from thirty-two pairs to sixteen. Send
          cat through the frozen matrix again. All sixty-four pairs still run. Freezing those weights saves
          optimizer state. The forward pass still uses every row.
        hold: 0.8
        caption_starts:
          - The adapter goes
          - to sixteen
          - All sixty-four pairs
        visual_cues:
          - id: open-rank-cut
            phrase: Take away one row of A and its column in B
            targets:
              - open-adapter
            color: cyan
            linger: 0.18
          - id: open-rank-total
            phrase: to sixteen
            targets:
              - open-adapter
            color: cyan
            linger: 0.18
          - id: open-replay
            phrase: Send cat through the frozen matrix again
            targets:
              - open-base
            color: blue
            linger: 0.18
      - say: Light-PEFT uses the first stretch of training to score heads, feed-forward coordinates and parts of the
          adapter. Suppose the scores select three of four heads. Cut the two query rows belonging to the
          other head. Six rows times eight inputs now costs forty-eight pairs. B loses those same two output
          rows. How can we check that the smaller matrices kept the right features?
        hold: 1.1
        caption_starts:
          - Six rows times eight inputs
        visual_cues:
          - id: open-base-cut
            phrase: Cut the two query rows belonging to the other head
            targets:
              - open-base
              - open-adapter
            color: blue
            linger: 0.18
  - id: parallel-product
    title: Compute the frozen and trainable paths from the same input
    visual: A supplied input [2,−1] fans into a frozen two-by-two W and a parallel stored A/B pair. Each dot
      product accumulates signed named terms; the two outputs add only after their paths complete.
    beats:
      - say: Let's put numbers on the two paths. In this smaller example the input is two, negative one. In the first
          blue row, two plus negative two gives zero. In the second, both terms are negative. Its frozen
          linear output is zero, negative three. The very same token goes into the adapter below.
        hold: 0.75
        visual_cues:
          - id: lp-input
            phrase: the input is two, negative one
            targets:
              - lp-input
            color: cyan
            linger: 0.4
          - id: lp-base
            phrase: Its frozen linear output is zero, negative three
            targets:
              - lp-base
            color: cyan
            linger: 0.4
      - say: Here A is the identity, so A produces two, negative one. B maps that to zero, one. The adapter scales
          that by a half. Add the correction to the frozen result and the combined output is zero, negative
          two point five. A and B can learn from the error on that output. W still had to do both dot
          products.
        hold: 0.75
        visual_cues:
          - id: lp-a
            phrase: A produces two, negative one
            targets:
              - lp-adapter
            color: cyan
            linger: 0.4
          - id: lp-b
            phrase: B maps that to zero, one
            targets:
              - lp-adapter
            color: cyan
            linger: 0.4
          - id: lp-combine
            phrase: the combined output is zero, negative two point five
            targets:
              - lp-sum
            color: cyan
            linger: 0.4
      - say: Read the stored shapes from the calculation. Each row of A makes one rank activation from all the input
          features. Each row of B reads all those activations to make one output feature. Counting
          multiply-add pairs gives r times d in plus d out times r per token. Here we multiply stored weights
          by a column vector. If you write the input as a row vector, transpose the factors and multiply from
          the other side.
        hold: 0.75
        visual_cues:
          - id: lp-general
            phrase: r times d in plus d out times r
            targets:
              - lp-general
            color: cyan
            linger: 0.4
  - id: execution-gradient
    title: Keep the dependency path while removing update state
    visual: A backward signal crosses the frozen W operation to an earlier trainable insertion. W retains no
      parameter-gradient or optimizer slot; activation ownership remains visible.
    beats:
      - say: Now trace the error backward. Suppose an earlier adapter sits before this frozen projection. To train
          that adapter the backward pass can still need an input derivative through W. Its own weight gradient
          and optimizer state can be absent. The training step still needs the activations on this path,
          either saved from the forward pass or computed again.
        hold: 0.75
        visual_cues:
          - id: lp-dependency
            phrase: can still need an input derivative
            targets:
              - lp-dependency
            color: cyan
            linger: 0.4
          - id: lp-no-state
            phrase: Its own weight gradient and optimizer state can be absent
            targets:
              - lp-state
            color: cyan
            linger: 0.4
      - say: Count the four attention projections, then the up and down projections in the feed-forward network. Call
          the hidden width d and the intermediate width m. That gives four times d squared plus twice d times
          m pairs per token. Multiply by the number of tokens. Attention-score products, value aggregation,
          normalization, nonlinearities and memory traffic add other work.
        hold: 0.75
        visual_cues:
          - id: lp-dense-formula
            phrase: four times d squared plus twice d times m pairs per token
            targets:
              - lp-formula
            color: cyan
            linger: 0.4
  - id: cost
    title: Count the frozen work before choosing what to cut
    visual: A one-layer cost ledger separates 768 dense projection multiply-accumulate pairs per token from a
      rank-one adapter's 16 added pairs at one target. Four tokens scale the dense projection count to 3,072
      pairs.
    beats:
      - say: Return to the layer of width eight. Every input token passes through the query, key, value, and output
          projections. Each eight-by-eight grid costs sixty-four multiply-add pairs. Keep that count while we
          widen the middle of the feed-forward network.
        hold: 0.7
        visual_cues:
          - id: cost-beat-1-focus-1
            phrase: Every input token passes through the query, key, value, and output projections
            targets:
              - cost-projection-ledger
            color: cyan
            linger: 0.65
          - id: cost-query-product
            phrase: query
            targets:
              - cost-query-product
            color: blue
          - id: cost-key-product
            phrase: key
            targets:
              - cost-key-product
            color: blue
          - id: cost-value-product
            phrase: value
            targets:
              - cost-value-product
            color: blue
          - id: cost-output-product
            phrase: output projections
            targets:
              - cost-output-product
            color: blue
      - say: The two larger feed-forward projections dominate this recipe. The up projection expands eight features to
          thirty-two. The down projection brings them back to eight. Each costs two hundred fifty-six pairs.
          The total is seven hundred sixty-eight dense projection pairs per token. Processing four tokens
          repeats that work four times, for three thousand seventy-two pairs.
        hold: 0.8
        visual_cues:
          - id: cost-beat-2-focus-1
            phrase: The total is seven hundred sixty-eight dense projection pairs per token
            targets:
              - cost-dense-total
            color: cyan
            linger: 0.65
          - id: cost-ffn-products
            phrase: The two larger feed-forward projections dominate this recipe
            targets:
              - cost-ffn-ledger
            color: cyan
          - id: cost-four-tokens
            phrase: Processing four tokens repeats that work four times
            targets:
              - cost-dense-total
              - cost-token-total
            color: yellow
      - say: At one target, a rank-one adapter adds sixteen projection pairs per token. If its rank grows, the adapter
          count grows with it. All seven hundred sixty-eight base pairs still run. To reduce the base cost,
          first decide whether your constraint is weight storage or the shape that the kernel has to multiply.
        hold: 0.8
        visual_cues:
          - id: cost-beat-3-focus-1
            phrase: At one target, a rank-one adapter adds sixteen projection pairs
            targets:
              - cost-adapter-product
            color: cyan
            linger: 0.65
  - id: quantized-versus-sliced
    title: Change storage bits separately from tensor dimensions
    visual: The same dense rectangle changes element bit width while retaining every coordinate, then a separate
      structured cut removes named coordinates from its dimensions.
    beats:
      - say: Keep every square in the base matrix. Storing a weight in fewer bits can reduce its stored bytes. A
          kernel can unpack the values for arithmetic, and the rows and columns can remain unchanged. Ordinary
          LoRA already avoids optimizer state for the frozen weights. Quantizing them reduces a different
          cost.
        hold: 0.75
        visual_cues:
          - id: lp-pack
            phrase: fewer bits can reduce its stored bytes
            targets:
              - lp-bits
            color: cyan
            linger: 0.4
          - id: lp-same-shape
            phrase: rows and columns can remain unchanged
            targets:
              - lp-shape
            color: cyan
            linger: 0.4
      - say: Now take a row out of the array. Structured pruning changes which heads or intermediate coordinates exist
          in the next run. QLoRA trains adapters through a frozen quantized base with its original dimensions.
          A system could try combining these choices. The Light-PEFT paper did not benchmark their
          combination.
        hold: 0.75
        visual_cues:
          - id: lp-slice
            phrase: changes which heads or intermediate coordinates exist
            targets:
              - lp-slice
            color: cyan
            linger: 0.4
          - id: lp-combination
            phrase: did not benchmark their combination
            targets:
              - lp-scope
            color: cyan
            linger: 0.4
  - id: source-boundary
    title: Inside the Light-PEFT research release
    visual: The ACL author record, exact source pin and bundled PEFT subtree occupy separate labeled scopes. A
      file outside the subtree cannot inherit its license through a visual merge.
    beats:
      - say: Gu and colleagues at two Chinese Academy of Sciences institutions tested LoRA and bottleneck adapters
          on RoBERTa-Large and OPT. Their results appeared at Findings of ACL in twenty twenty-four.
          Let's open the code that goes with the paper.
        hold: 0.75
        visual_cues:
          - id: lp-source-pin
            phrase: the code that goes with the paper
            targets:
              - lp-source
            color: cyan
            linger: 0.4
      - say: Look for OPT in this version of the loader. The two entries build custom RoBERTa models, one for
          sequence classification and one for multiple choice. This release uses Torch two point zero point one
          and Transformers four point thirty-one. To run the cut on a decoder, we need a loader that knows
          how its heads map to rows and columns.
        hold: 0.75
        visual_cues:
          - id: lp-registry
            phrase: The two entries build custom RoBERTa models
            targets:
              - lp-source
            color: cyan
            linger: 0.4
      - say: Look inside the PEFT folder. Its bundled fork has an Apache-two license. One level up, the project
          root has no license file. If you reuse the pruning code, check the terms for those files, their
          dependencies and the checkpoint you plan to load.
        hold: 0.75
        visual_cues:
          - id: lp-license
            phrase: Its bundled fork has an Apache-two license
            targets:
              - lp-license
            color: cyan
            linger: 0.4
  - id: receipt-identity
    title: Bind the saved score record to the model that will consume it
    visual: An estimate receipt binds source, data, target names and record hashes. The same score artifact is
      admitted only when the consumer’s model revision and coordinate layout match.
    beats:
      - say: The first command starts the mask trainer. Its callback writes two NumPy arrays, one history for
          attention and one for feed-forward gates. The module and rank importance pickles record the adapter
          scores. The adapter checkpoint holds the actual weights. The second command reads these through its
          PEFT directory argument.
        hold: 0.75
        visual_cues:
          - id: lp-write
            phrase: writes two NumPy arrays
            targets:
              - lp-files
            color: cyan
            linger: 0.4
          - id: lp-pickles
            phrase: module and rank importance pickles
            targets:
              - lp-files
            color: cyan
            linger: 0.4
      - say: Suppose a second run writes the same filenames. Which ones belong to our model? Hash the score records
          and adapter weights. Tie them to the source, model, tokenizer and data revisions, preprocessing,
          hardware and software environment. Keep the seed, precision, target list and both commands. After
          surgery, add the selected original coordinates and resulting shapes.
        hold: 0.75
        caption_starts:
          - Hash the score records
        visual_cues:
          - id: lp-bind
            phrase: Hash the score records and adapter weights
            targets:
              - lp-receipt
            color: cyan
            linger: 0.4
          - id: lp-selected
            phrase: selected original coordinates and resulting shapes
            targets:
              - lp-receipt
            color: cyan
            linger: 0.4
      - say: Even the example scripts can select different experiments. Vanilla selects MNLI with query and value
          targets. The pruning scripts select SST-two and a larger target set. Match the task, data, target
          placement, optimizer policy and total budget before comparing their clocks.
        hold: 0.75
        visual_cues:
          - id: lp-shells
            phrase: vanilla selects MNLI with query and value targets
            targets:
              - lp-shells
            color: cyan
            linger: 0.4
  - id: handoff
    title: Keep the evidence file between scoring and surgery
    visual: An estimate run writes attention and FFN arrays plus adapter records and weights. The second phase
      reads those records, slices compatible base and adapter tensors, restores the selected weights, and
      begins continued training.
    beats:
      - say: During the short estimation run, the model still has all its heads and feed-forward coordinates. Each
          score describes a coordinate on the task examples seen so far. The estimate also records which
          adapter modules and ranks contributed.
        hold: 0.7
        visual_cues:
          - id: handoff-beat-1-focus-1
            phrase: Each score describes a coordinate on the task examples seen so far
            targets:
              - handoff-id-job-label
            color: cyan
            linger: 0.65
      - say: Look at the record from revision seventeen. The pruning phase reads the recorded gates and selects the
          original head IDs shown here. It slices the base projections and matching adapter dimensions, then
          restores the surviving weights. Saved indices and tensor shapes need to describe the same model
          revision.
        hold: 0.8
        visual_cues:
          - id: handoff-beat-2-focus-1
            phrase: Saved indices and tensor shapes need to describe the same model revision
            targets:
              - handoff-id-job-label
            color: cyan
            linger: 0.65
          - id: lp-record-load
            phrase: The pruning phase reads the recorded gates
            targets:
              - lp-handoff-record
            color: cyan
            linger: 0.4
          - id: lp-handoff-slice
            phrase: slices the base projections and matching adapter dimensions
            targets:
              - lp-handoff-shape
            color: cyan
            linger: 0.4
      - say: A new trainer starts work on those smaller tensors. Include mask estimation, record writing, surgery,
          continuation, evaluation, and export in the complete stopwatch. The shorter multiplication has to
          earn back the time spent finding it.
        hold: 0.8
        visual_cues:
          - id: handoff-beat-3-focus-1
            phrase: Include mask estimation, record writing, surgery, continuation, evaluation, and export in the complete
              stopwatch
            targets:
              - handoff-id-job-label
            color: cyan
            linger: 0.65
          - id: lp-stopwatch-scope
            phrase: evaluation, and export
            targets:
