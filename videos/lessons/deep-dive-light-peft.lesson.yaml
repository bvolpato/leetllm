            color: cyan
            linger: 0.4
  - id: mask-gradient
    title: Learn a gate before deleting its coordinate
    visual: A scalar head contribution remains in a loss graph. The actual task gradient and a separate L1
      gradient add before one supplied update; a physical deletion is withheld.
    beats:
      - say: At first every gate is one. In the attention layer the gate scales probabilities after softmax and
          dropout, before multiplying values. That scales the contribution from the whole head. In the
          feed-forward layer the gate acts on one intermediate activation before the down projection.
        hold: 0.75
        visual_cues:
          - id: lp-gate-location
            phrase: before multiplying values
            targets:
              - lp-gate
            color: cyan
            linger: 0.4
      - say: Take one gate, m, multiplying a value of two. Our toy task loss is half the square of that gated value.
          At m equal to one, the task derivative is four. Add a penalty of a tenth times the absolute gate
          value. Its positive-gate L1 derivative is point one. A step of size one tenth brings m to point five
          nine.
        hold: 0.75
        visual_cues:
          - id: lp-task-grad
            phrase: The task derivative is four
            targets:
              - lp-gradient
            color: cyan
            linger: 0.4
          - id: lp-l1-grad
            phrase: positive-gate L1 derivative is point one
            targets:
              - lp-gradient
            color: cyan
            linger: 0.4
          - id: lp-gate-update
            phrase: brings m to point five nine
            targets:
              - lp-gate
            color: cyan
            linger: 0.4
      - say: The actual script uses a much smaller penalty, ten to the negative four, on both mask families. That
          pressure can make a gate shrink while its coordinate still executes. Later quantiles impose the
          requested capacity cut. The resulting ranking reflects the task that supplied those gradients.
        hold: 0.75
        visual_cues:
          - id: lp-mask-budget
            phrase: Later quantiles impose the requested capacity cut
            targets:
              - lp-gate
            color: cyan
            linger: 0.4
  - id: heads
    title: A head score becomes a shared set of weight slices
    visual: Four attention-head scores in one layer produce a linear 25th-percentile threshold of 0.425. Strictly
      greater scores keep heads one, three, and four, with Q, K, V, and output projections sharing the
      selected feature ranges.
    beats:
      - say: Each attention head receives one scalar mask during the estimate phase. Here all four start at one. The
          short training run moves them under the task loss and the L1 penalty. That pressure shapes the
          ranking, while a separate pruning ratio sets the requested budget.
        hold: 0.7
        visual_cues:
          - id: heads-beat-1-focus-1
            phrase: Each attention head receives one scalar mask during the estimate phase
            targets:
              - heads-h-mask-1-00
            color: cyan
            linger: 0.65
          - id: heads-beat-1-focus-2
            phrase: That pressure shapes the ranking, while a separate pruning ratio sets the requested budget
            targets:
              - heads-h-mask-1-00
            color: yellow
            linger: 0.65
      - say: Sort the four recorded head scores from smallest to largest. Keep the name attached to each score. For a
          quarter cut, go three quarters of the way from point zero eight to point five four. That puts the
          cutoff at point four two five. Which head fails the strict greater-than test?
        motion_check:
          region:
            - 235
            - 350
            - 1410
            - 370
          minimumChangedFraction: 0.002
        hold: 2.1
        visual_cues:
          - id: heads-sort-scores
            phrase: Sort the four recorded head scores from smallest to largest
            targets:
              - heads-h
              - heads-sorted-scores
            color: blue
          - id: heads-beat-2-focus-1
            phrase: go three quarters of the way from point zero eight to point five four
            targets:
              - heads-cutoff
              - heads-sorted-scores
            color: cyan
            linger: 0.65
      - say: Head two falls below the cutoff. Its feature range must disappear from query, key, value, and output
          projections together. For queries, keys and values, cut output rows. For the attention output
          projection, cut the corresponding input columns. A scalar mask suggested the choice. The smaller
          tensors make it physical.
        motion_check:
          region:
            - 230
            - 715
            - 1490
            - 270
          minimumChangedFraction: 0.002
        hold: 0.8
        visual_cues:
          - id: heads-beat-3-focus-1
            phrase: A scalar mask suggested the choice
            targets:
              - heads-beforelabels
            color: cyan
            linger: 0.65
          - id: heads-beat-3-focus-2
            phrase: Its feature range must disappear from query, key, value, and output projections together
            targets:
              - heads-beforelabels
            color: yellow
            linger: 0.65
  - id: signed-gates
    title: One head changes sign
    visual: The first head’s signed score moves across zero while its magnitude stays fixed. Two quarter-cut
      thresholds select different original heads. Both rulers keep the preceding scene’s one-based head
      labels.
    beats:
      - say: Keep the same four heads. This time change the first gate to negative point nine one. On the left, head
          one crosses zero. On the right, its distance from zero stays the same. If you remove a quarter of
          the heads, which head will each rule drop?
        hold: 2.2
        visual_cues:
          - id: lp-negative
            phrase: change the first gate to negative point nine one
            targets:
              - lp-signed
              - lp-absolute
            color: cyan
            linger: 0.18
      - say: The pinned code compares signed values. Its cutoff removes head one. The paper describes a magnitude
          ranking. On that ruler the small positive gate is closest to zero, so head two leaves. The
          distinction matters. A contribution of two times the negative gate becomes negative one point eight
          two. A large negative gate reverses the contribution. Record which rule you used and evaluate the
          model it actually selected.
        hold: 1.1
        caption_starts:
          - Its cutoff removes head one
          - The paper describes a magnitude ranking
          - so head two leaves
        visual_cues:
          - id: lp-signed-select
            phrase: Its cutoff removes head one
            targets:
              - lp-signed
            color: yellow
            linger: 0.18
          - id: lp-absolute-select
            phrase: head two leaves
            targets:
              - lp-absolute
            color: yellow
            linger: 0.18
          - id: lp-reverse
            phrase: becomes negative one point eight two
            targets:
              - lp-reverse
            color: pink
            linger: 0.18
  - id: ffn
    title: Follow a feed-forward coordinate through the cut
    visual: Five labeled FFN scores sort into a global pool. Layer zero loses one up row before its down column.
      The two remaining activations cannot fill three input columns until the matching weight leaves. Both
      layers then compact their stored matrices.
    beats:
      - say: These five gates come from two layers in a small example. Sort all five together. A forty-percent cut
          lands six tenths of the way from the second score to the third. The cutoff is point two four six.
          Neuron one in each layer falls below it. The layer labels tell us which two sets of weights to cut.
        hold: 0.85
        visual_cues:
          - id: lp-ffn-sort
            phrase: Sort all five together
            targets:
              - ffn-scores
            color: cyan
            linger: 0.18
          - id: lp-ffn-cut
            phrase: The cutoff is point two four six
            targets:
              - ffn-cutoff
            color: yellow
            linger: 0.18
      - say: Look inside layer zero. Each up-projection row supplies one activation to the down projection. For this
          token, the three products add to nine. Remove only the up row for neuron one. Two activations reach
          a down projection with three input weights. Which down column must go?
        hold: 2.5
        visual_cues:
          - id: lp-ffn-full
            phrase: the three products add to nine
            targets:
              - ffn-product
            color: cyan
            linger: 0.18
          - id: lp-ffn-first-cut
            phrase: Remove only the up row for neuron one
            targets:
              - ffn-paired-projections
            color: yellow
            linger: 0.18
      - say: Remove the column for neuron one. Its weight of one leaves with the activation it used to read. Neuron
          two contributes six. Neuron three contributes one. The repaired product gives seven. The change from
          nine is exactly the contribution we cut.
        hold: 1.1
        visual_cues:
          - id: lp-ffn-repair
            phrase: Remove the column for neuron one
            targets:
              - ffn-paired-projections
            color: cyan
            linger: 0.18
          - id: lp-ffn-result
            phrase: The repaired product gives seven
            targets:
              - ffn-product
            color: green
            linger: 0.18
      - say: Apply the selected IDs to both layers. The up rows slide together with their matching down columns. Layer
          zero keeps two paths and layer one keeps one. A global cutoff lets each layer end up with its own
          width.
        hold: 1
        visual_cues:
          - id: lp-ffn-slice
            phrase: The up rows slide together with their matching down columns
            targets:
              - ffn-weights
            color: cyan
            linger: 0.18
  - id: global-versus-local
    title: Choose the population before computing its quantile
    visual: Two layers retain coordinate labels while their scores move into a common global ruler. The same
      overall budget is compared with two independent layer rulers.
    beats:
      - say: Try a fresh pair of layers, each with two scores. Every score in B exceeds every score in A. Pool all
          four for a fifty-percent cut. The global median is point five, so both survivors come from B. Cut
          each layer separately and the medians are point one five and point eight five, keeping one
          coordinate in each layer.
        hold: 0.75
        visual_cues:
          - id: lp-global-cut
            phrase: The global median is point five, so both survivors come from B
            targets:
              - lp-global
            color: cyan
            linger: 0.4
          - id: lp-local-cut
            phrase: keeping one coordinate in each layer
            targets:
              - lp-local
            color: cyan
            linger: 0.4
      - say: Both rules keep two of four. They give different shapes and functions. The pinned head helper uses a
          separate cutoff per layer by default. The example training script requests global cuts for
