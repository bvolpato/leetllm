  - id: random-control
    title: Keep a proposed control separate from an executable branch
    visual: A seeded substitute score array reaches the actual rank branch, then fails where code expects
      name-keyed records. The independent task-mask control remains a distinct proposed experiment.
    beats:
      - say: Would random survivors do just as well? A fair control changes the selection rule while matching the
          data, pruning budget, seed policy, hardware and full training window. The pinned backbone helper can
          generate seeded random scores, restoring NumPy’s surrounding random state when it finishes.
