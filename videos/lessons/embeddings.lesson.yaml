  - id: elmo-layers
    title: Mix layers without confusing them with token attention
    visual: Construct forward and backward recurrence into three matching layer states, then apply one
      task-wide softmax mixture and gamma.
    beats:
      - say: ELMo uses a forward and a backward recurrent language model. Their input representation and
          output softmax parameters are shared, while their LSTM weights are separate. The original
          character CNN projects a context-free state to five hundred twelve coordinates. The
          implementation duplicates it to one thousand twenty-four for the layer mix. Each of two
          contextual layers concatenates five hundred twelve forward and five hundred twelve
          backward coordinates.
        hold: 0.65
        visual_cues:
          - id: emb-elmo-recurrent
            phrase: Their input representation and output softmax parameters are shared
            targets:
              - elmo-layers-mechanism
            color: cyan
            linger: 0.5
          - id: emb-elmo-duplicate
            phrase: duplicates it to one thousand twenty-four
            targets:
              - elmo-layers-mechanism
            color: cyan
            linger: 0.5
          - id: emb-elmo-concatenate
            phrase: concatenates five hundred twelve forward and five hundred twelve backward
            targets:
              - elmo-layers-mechanism
            color: cyan
            linger: 0.5
      - say: At each token position, the downstream task takes a weighted sum of those three matching layer
          states and multiplies by gamma. Softmax-normalized layer weights are nonnegative and sum
          to one. The same task-specific layer weights are used at every token position; they are
          not token-to-token attention weights. Ordinarily this downstream combination learns while
          the pretrained language model stays frozen.
        hold: 0.65
        visual_cues:
          - id: emb-elmo-mixture
            phrase: takes a weighted sum of those three matching layer states
            targets:
              - elmo-layers-mechanism
            color: cyan
            linger: 0.5
