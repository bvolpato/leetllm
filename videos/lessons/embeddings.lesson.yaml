scenes:
  - id: intro
    title: One word, two different surroundings
    visual: The sentences She sat by the river bank and She went to the bank share an identical bank
      starting vector, then diverge after contextual mixing.
    beats:
      - say: Think of the word bank in two sentences. She sat by the river bank. She went to the bank to
          deposit money. The spelling is identical, yet the surrounding words point toward different
          meanings. How can a model represent both uses with one vocabulary entry?
        hold: 0.6
        visual_cues:
          - id: intro-beat-1-focus-1
            phrase: She sat by the river bank
            targets:
              - intro-object-she-sat-by-the-river-bank-1
            color: blue
            linger: 0.6
      - say: We will begin with an embedding table, where each token selects a stored vector. Then we will
          watch contextual computation change that vector for a particular occurrence. A small
          numerical map will separate the starting lookup, the surrounding evidence, and the
          resulting representation.
        hold: 0.6
        visual_cues:
          - id: intro-beat-2-focus-1
            phrase: We will begin with an embedding table
            targets:
              - intro-bank-vector
            color: blue
            linger: 0.6
      - say: The coordinates in our example are constructed for teaching, with a deliberately visible river
          direction and finance direction. Real embedding dimensions acquire their roles through
          training and generally lack such tidy names. The example lets us inspect a mechanism
          without mistaking the drawing for a measured model.
        hold: 0.8
        visual_cues:
          - id: intro-beat-3-focus-1
            phrase: with a deliberately visible river direction and finance direction
            targets:
              - intro-contextual-vectors
            color: blue
            linger: 0.6
  - id: lookup
    title: A token ID selects one stored vector
    visual: Two occurrences select ID zero in the same table. Identical coordinate strips travel from
      that one row into the two sentence positions.
    beats:
      - say: A vocabulary ID indexes one row in the embedding matrix. That row contains a fixed-length
          vector of learned numbers. At lookup time, two occurrences of the same ID receive the same
          coordinates, even when their sentences suggest different meanings.
        hold: 0.6
        visual_cues:
          - id: lookup-beat-1-focus-1
            phrase: A vocabulary ID indexes one row in the embedding matrix
            targets:
              - lookup-matrix
            color: blue
            linger: 0.6
      - say: Here bank starts halfway between our two named teaching directions. River and money point
          elsewhere in the same tiny space. Reading bank in either sentence selects the identical
          starting row. The lookup has no access to the surrounding words until another computation
          supplies them.
        hold: 0.6
        visual_cues:
          - id: lookup-beat-2-focus-1
            phrase: Reading bank in either sentence selects the identical starting row
            targets:
              - lookup-matrix
            color: blue
            linger: 0.6
      - say: The stored vector can change during training. Calling it static describes its independence from
          the current sentence, rather than its ability to be learned. Position information can
          distinguish locations, while contextual computation is needed to incorporate the clues
          carried by the neighboring words themselves.
        hold: 0.8
        visual_cues:
          - id: lookup-beat-3-focus-1
            phrase: The stored vector can change during training
            targets:
              - lookup-matrix
            color: blue
            linger: 0.6
  - id: table-contract
    title: A row lookup is an exact selection
    visual: Build one-hot times E from actual row selection; retain token identity while raw ID order
      has no geometric meaning.
    beats:
      - say: Keep our bank example, and open its array contract. An embedding table has one row per
          vocabulary ID and one column per feature. With vocabulary size V and width d, its shape is
          V by d. A one-hot row containing one at the token ID and zeros elsewhere, multiplied by
          this table, selects exactly that stored row. Practical lookup gathers the row without
          constructing a huge one-hot array.
        hold: 0.65
        visual_cues:
          - id: emb-onehot
            phrase: selects exactly that stored row
            targets:
              - table-contract-mechanism
            color: cyan
            linger: 0.5
      - say: The numerical ID is an address. Nearby ID numbers need not describe related words. The article
          uses a separate charge fixture, where the same token ID selects point eight, point two in
          an invoice sentence and a phone instruction. These are different supplied teaching
          coordinates from our bank map. Keep each fixture and its owners separate.
        hold: 0.65
        visual_cues:
          - id: emb-charge-fixture
            phrase: The article uses a separate charge fixture
            targets:
              - table-contract-mechanism
            color: cyan
            linger: 0.5
      - say: Tokenization determines those units before lookup. A word may split into several subwords, and
          a static vector can be assigned to each piece. Changing the units does not by itself add
          sentence dependence. The table can be learned during training; at a fixed lookup, an
          occurrence needs another operation to read its surrounding clues.
        hold: 0.65
        visual_cues:
          - id: emb-pieces
            phrase: A word may split into several subwords
            targets:
              - table-contract-mechanism
            color: cyan
            linger: 0.5
  - id: neighbors
    title: Build the evidence one word pair at a time
    visual: Six actual word-bank pairs travel from their sentence positions into four count columns.
    beats:
      - say: Start with one sentence. Find bank, then inspect the words within four positions. River appears
          inside that window. Move that observed pair into the river column. One occurrence
          contributes one count.
        hold: 0.8
        visual_cues:
          - id: neighbors-built-count-0
            phrase: observed pair
            targets:
              - neighbors-object-distribution-neighbors-4
            color: cyan
            linger: 0.6
      - say: Continue through the remaining sentences. Water and river contribute in the second. Money
          contributes in the third. Deposit and money contribute in the fourth. The histogram grows
          from these actual pairs, with bank participating in both context groups.
        hold: 0.8
        visual_cues:
          - id: neighbors-built-count-1
            phrase: histogram grows
            targets:
              - neighbors-object-distribution-neighbors-4
            color: cyan
            linger: 0.6
      - say: The completed counts describe this small corpus. Word2Vec learns predictive word-context
          objectives, GloVe uses global co-occurrence statistics, and FastText includes subword
          information. Their objectives differ. These observed contexts provide evidence for
          learning useful representations; the counts alone are not trained vectors.
        hold: 0.8
        visual_cues:
          - id: neighbors-built-count-2
            phrase: completed counts
            targets:
              - neighbors-object-distribution-neighbors-4
            color: cyan
            linger: 0.6
  - id: count-ppmi
    title: Compare an observed pair with its chance baseline
    visual: Trace one count cell through row and column marginals, expected count, ratio, logarithm and
      positive floor; construct zero cells honestly.
    beats:
      - say: Our bank histogram counted actual pairs within a four-position window. The article next uses a
          separate two-position corpus window and an explicitly supplied four-by-four count matrix.
          Apple and pear share fruit and sweet contexts; river and lake share water and shore. This
          matrix illustrates compression and is not claimed to be the histogram of the earlier four
          sentences.
        hold: 0.65
        visual_cues:
          - id: emb-count-build
            phrase: an explicitly supplied four-by-four count matrix
            targets:
              - count-ppmi-mechanism
            color: cyan
            linger: 0.5
      - say: "Raw counts favor common contexts. For a word-context pair, multiply its row total by its
          column total and divide by the grand total to obtain the independence baseline. The
          supplied apple-fruit cell has count eight, row total fourteen, fruit-column total fifteen
          and grand total fifty-three. The expected count is two hundred ten divided by fifty-three,
          about three point nine six. Divide eight by that expected count, then take the natural
          logarithm: about point seven zero three."
        hold: 0.65
        visual_cues:
          - id: emb-count-marginals
            phrase: row total fourteen, fruit-column total fifteen and grand total fifty-three
            targets:
              - count-ppmi-mechanism
            color: cyan
            linger: 0.5
          - id: emb-count-expected
            phrase: about three point nine six
            targets:
              - count-ppmi-mechanism
            color: cyan
            linger: 0.5
          - id: emb-count-log
            phrase: about point seven zero three
            targets:
              - count-ppmi-mechanism
            color: green
            linger: 0.5
      - say: Positive pointwise mutual information, or PPMI, keeps the larger of that log ratio and zero.
          Unobserved cells are set to zero rather than taking log zero. Empty marginals need
          explicit handling; an entirely zero count matrix has no observed association. A large
          value from a rare count is an association estimate, not statistical confidence. Words with
          opposite meanings can also occur in similar contexts.
        hold: 0.65
        visual_cues:
          - id: emb-count-floor
            phrase: keeps the larger of that log ratio and zero
            targets:
              - count-ppmi-mechanism
            color: cyan
            linger: 0.5
          - id: emb-count-zeros
            phrase: Unobserved cells are set to zero
            targets:
              - count-ppmi-mechanism
            color: cyan
            linger: 0.5
  - id: factorization
    title: Compress context patterns into shared directions
    visual: Construct a rank-two SVD approximation from the actual PPMI matrix and carry labeled rows
      into two axes.
    beats:
      - say: "The count table has a feature for each context. To compress it, take a singular value
          decomposition: U times the diagonal singular-value matrix times V transpose. Keep two
          singular directions. Our chosen word representation uses the first two columns of U,
          scaled by the square roots of their singular values. The companion context factor uses the
          matching square roots and right singular directions."
        hold: 0.65
        visual_cues:
          - id: emb-factor-two
            phrase: Keep two singular directions
            targets:
              - factorization-mechanism
            color: cyan
            linger: 0.5
          - id: emb-factor-scale
            phrase: scaled by the square roots of their singular values
            targets:
              - factorization-mechanism
            color: cyan
            linger: 0.5
      - say: The executed fixture’s leading singular values are about one point four one eight and one point
          three four eight. Its two-coordinate apple and pear representations have cosine one, while
          apple and river have cosine zero. These are actual results of this constructed matrix, not
          measurements of natural-language semantic accuracy. A different corpus, weighting or
          truncation can change them.
        hold: 0.65
        visual_cues:
          - id: emb-factor-rows
            phrase: Its two-coordinate apple and pear representations have cosine one
            targets:
              - factorization-mechanism
            color: cyan
            linger: 0.5
          - id: emb-factor-cross
            phrase: apple and river have cosine zero
            targets:
              - factorization-mechanism
            color: green
            linger: 0.5
      - say: The whole sign of a singular axis can flip while preserving the represented relationships.
          Every word must use the same fitted basis. Static co-occurrence patterns can support
          useful neighbors, but a two-dimensional drawing or a successful analogy checks a
          particular geometric relationship. It does not establish that every use of a word has been
          understood.
        hold: 0.65
        visual_cues:
          - id: emb-factor-sign
            phrase: The whole sign of a singular axis can flip
            targets:
              - factorization-mechanism
            color: cyan
            linger: 0.5
  - id: predictive-window
    title: Build the prediction examples from actual positions
    visual: Move center-to-neighbor arrows through the supplied sentence and distinguish CBOW direction
      from Skip-gram direction.
    beats:
      - say: Word2Vec learns a predictive objective instead of directly factorizing this count table.
          Continuous bag of words predicts a center word from its neighboring words. Skip-gram uses
          the center word to predict nearby context words. These training directions define
          different examples even when they use the same text.
        hold: 0.65
        visual_cues:
          - id: emb-cbow
            phrase: Continuous bag of words predicts a center word from its neighboring words
            targets:
              - predictive-window-mechanism
            color: cyan
            linger: 0.5
          - id: emb-skipgram
            phrase: Skip-gram uses the center word to predict nearby context words
            targets:
              - predictive-window-mechanism
            color: cyan
            linger: 0.5
      - say: In children read stories each night, use read as the center and a two-position window. Children
          is one position left, stories one right, and each two right. Those are the three positive
          pairs in the actual cell. Night is three positions away, outside this chosen window.
          Whitespace positions are the declared toy tokens here.
        hold: 0.65
        visual_cues:
          - id: emb-window-pairs
            phrase: Children is one position left, stories one right, and each two right
            targets:
              - predictive-window-mechanism
            color: cyan
            linger: 0.5
          - id: emb-window-night
            phrase: Night is three positions away
            targets:
              - predictive-window-mechanism
            color: cyan
            linger: 0.5
      - say: Training moves parameters to improve these predictions. A learned input word vector can later
          be compared with another input vector, but that cosine lookup is different from the
          training score between a center input row and a context output row. The objective, the
          extracted table and the downstream metric each need a clear contract.
        hold: 0.65
        visual_cues:
          - id: emb-word-tables
            phrase: center input row and a context output row
            targets:
              - predictive-window-mechanism
            color: cyan
            linger: 0.5
  - id: negative-step
    title: Take one actual Skip-gram gradient step
    visual: Construct positive and negative dot products, collect signed gradient contributions, then
      move the center to lower the actual supplied loss.
    beats:
      - say: Skip-gram with negative sampling keeps separate input and output tables. Score the center input
          vector against the observed neighbor’s output vector, then against sampled output rows.
          The original method draws noise according to unigram frequency raised to three quarters
          and normalized. A sampled negative need not be absent, unknown or semantically unrelated.
          Repeated draws remain repeated terms in the loss.
        hold: 0.65
        visual_cues:
          - id: emb-negative-inputs
            phrase: Score the center input vector against the observed neighbor’s output vector
            targets:
              - negative-step-mechanism
            color: cyan
            linger: 0.5
          - id: emb-negative-noise
            phrase: Repeated draws remain repeated terms in the loss
            targets:
              - negative-step-mechanism
            color: cyan
            linger: 0.5
      - say: The sigmoid of a score is one divided by the quantity one plus the exponential of the negative
          score. A zero score gives one half. The positive loss is negative log sigmoid of its
          score. Each negative loss is negative log sigmoid of the negated score. The derivative
          with respect to a positive score is sigmoid minus one; for a negative score it is sigmoid.
          Multiply those coefficients by their output rows and add to obtain the center gradient.
          Subtract learning rate times that gradient. A full trainer also updates output rows; this
          cell holds them fixed to isolate the center step.
        hold: 0.65
        visual_cues:
          - id: emb-sigmoid-zero
            phrase: A zero score gives one half
            targets:
              - negative-step-mechanism
            color: cyan
            linger: 0.5
          - id: emb-negative-gradient
            phrase: Multiply those coefficients by their output rows and add
            targets:
              - negative-step-mechanism
            color: cyan
            linger: 0.5
          - id: emb-negative-update-rule
            phrase: Subtract learning rate times that gradient
            targets:
              - negative-step-mechanism
            color: cyan
            linger: 0.5
      - say: In the executed fixture, center one, zero and the supplied positive and two negative output
          vectors give loss about point eight nine two. One step at rate point one moves the center
          to about one point zero eight one, point zero zero eight. Its positive score rises from
          one point two to one point two nine eight, and loss falls to about point eight two seven.
          That verifies this local update. It does not certify the resulting semantic neighborhoods.
        hold: 0.65
        visual_cues:
          - id: emb-negative-before
            phrase: loss about point eight nine two
            targets:
              - negative-step-mechanism
            color: cyan
            linger: 0.5
          - id: emb-negative-move
            phrase: One step at rate point one moves the center to about one point zero eight one, point zero
              zero eight
            targets:
              - negative-step-mechanism
            color: cyan
            linger: 0.5
          - id: emb-negative-loss
            phrase: loss falls to about point eight two seven
            targets:
              - negative-step-mechanism
            color: green
            linger: 0.5
  - id: shifted-pmi
    title: Read the connection between two objectives
    visual: Compare a fitted input-output score with shifted PMI while keeping the noise distribution
      and capacity assumptions visible.
    beats:
      - say: Levy and Goldberg connected negative sampling to matrix factorization. When noise is
          proportional to context frequency and a score is unconstrained, the optimum for an
          observed pair is its pointwise mutual information minus natural log k, where k is the
          number of negative draws per positive pair. This is a statement about an input-output dot
          product.
        hold: 0.65
        visual_cues:
          - id: emb-pmi-optimum
            phrase: pointwise mutual information minus natural log k
            targets:
              - shifted-pmi-mechanism
            color: cyan
            linger: 0.5
      - say: For an unobserved pair with positive noise probability, the ideal unconstrained score goes to
          negative infinity. A finite-width shared vector model cannot independently set every table
          cell. Regularization and the original three-quarter-power noise distribution change the
          fitted solution as well. Do not claim that trained Word2Vec must equal the two-dimensional
          SVD we just computed.
        hold: 0.65
        visual_cues:
          - id: emb-pmi-absent
            phrase: ideal unconstrained score goes to negative infinity
            targets:
              - shifted-pmi-mechanism
            color: cyan
            linger: 0.5
          - id: emb-pmi-capacity
            phrase: cannot independently set every table cell
            targets:
              - shifted-pmi-mechanism
            color: cyan
            linger: 0.5
      - say: "The connection explains a mechanism: frequent positive evidence pushes a score up, while
          expected noise exposure pushes it down. Both count-based and predictive methods use
          distributional evidence, with different objectives and constraints. Neither a high
          training score nor a nearby input vector proves that a generated factual claim is true."
        hold: 0.65
        visual_cues:
          - id: emb-pmi-pressure
            phrase: frequent positive evidence pushes a score up
            targets:
              - shifted-pmi-mechanism
            color: cyan
            linger: 0.5
  - id: glove-fit
    title: Fit log counts with a weighted residual
    visual: Trace the actual count through log target, input-output score plus biases, squared residual
      and capped count weighting.
    beats:
      - say: GloVe fits global statistics aggregated from local context windows. Its original collection
          weights a neighbor at distance r by one over r, so a co-occurrence can be fractional. The
          model score is a word-context dot product plus a bias for each side, and the target is the
          natural log of the observed count. Sum weighted squared residuals over nonzero observed
          cells.
        hold: 0.65
        visual_cues:
          - id: emb-glove-score
            phrase: word-context dot product plus a bias for each side
            targets:
              - glove-fit-mechanism
            color: cyan
            linger: 0.5
      - say: The article supplies a score of log thirty. Counts three, thirty and three hundred have log
          targets about one point zero nine nine, three point four zero one and five point seven
          zero four. The matching thirty-count residual is zero. Against count three, the squared
          residual is natural log ten squared, about five point three zero two. The target is log
          count, not raw count or a sampled class label.
        hold: 0.65
        visual_cues:
          - id: emb-glove-log-targets
            phrase: Counts three, thirty and three hundred
            targets:
              - glove-fit-mechanism
            color: cyan
            linger: 0.5
          - id: emb-glove-zero
            phrase: The matching thirty-count residual is zero
            targets:
              - glove-fit-mechanism
            color: green
            linger: 0.5
          - id: emb-glove-error
            phrase: about five point three zero two
            targets:
              - glove-fit-mechanism
            color: cyan
            linger: 0.5
      - say: For the published weighting function, raise the ratio of count to one hundred to the
          three-quarter power, then cap at one. Counts three, thirty and one hundred receive weights
          about point zero seven two, point four zero five and one. Skip absent cells before taking
          logarithms. These weights regulate how much each observed count contributes; they do not
          turn the fitted vectors into sentence-specific states.
        hold: 0.65
        visual_cues:
          - id: emb-glove-weights
            phrase: raise the ratio of count to one hundred to the three-quarter power
            targets:
              - glove-fit-mechanism
            color: cyan
            linger: 0.5
          - id: emb-glove-weight-values
            phrase: about point zero seven two, point four zero five and one
            targets:
              - glove-fit-mechanism
            color: cyan
            linger: 0.5
  - id: subword-components
    title: Compose an unfamiliar spelling from retained pieces
    visual: Slide bounded character n-grams over play and played, preserve repeated bucket occurrences,
      and construct both sum and exported average.
    beats:
      - say: FastText augments word representations with character n-gram components. Boundary markers
          distinguish pieces at a word’s edges. The original setup uses lengths three through six.
          Our article simplifies this to unique length-three character strings for play and played.
          Their shared pieces are the left boundary plus p l, then p l a and l a y. Played adds a y
          e, y e d and e d plus the right boundary.
        hold: 0.65
        visual_cues:
          - id: emb-subword-windows
            phrase: Their shared pieces are the left boundary plus p l, then p l a and l a y
            targets:
              - subword-components-mechanism
            color: cyan
            linger: 0.5
      - say: The toy uses a set to expose shared spellings. The actual implementation retains component
          occurrences and hashes them into a finite bucket table, so repeated pieces or collisions
          can repeat a bucket contribution. An in-vocabulary word also has its own word row. An
          unknown spelling has no whole-word row but can compose available hashed subword rows. That
          can help rare forms and does not guarantee their semantic quality.
        hold: 0.65
        visual_cues:
          - id: emb-subword-occurrences
            phrase: repeat a bucket contribution
            targets:
              - subword-components-mechanism
            color: cyan
            linger: 0.5
          - id: emb-subword-oov
            phrase: An unknown spelling has no whole-word row
            targets:
              - subword-components-mechanism
            color: cyan
            linger: 0.5
      - say: The paper’s scoring construction sums components. The released get-word-vector implementation
          adds its returned component rows and then divides by their number. Sum and positive
          average have the same direction when nonzero, but different norms and raw dot products.
          Keep the chosen API and normalization contract explicit. Exported dot-vec word rows do not
          retain the model’s subword machinery for new spellings; the full binary model does.
        hold: 0.65
        visual_cues:
          - id: emb-subword-average
            phrase: divides by their number
            targets:
              - subword-components-mechanism
            color: cyan
            linger: 0.5
          - id: emb-subword-export
            phrase: the full binary model does
            targets:
              - subword-components-mechanism
            color: cyan
            linger: 0.5
  - id: geometry
    title: Similarity compares vectors in one coordinate system
    visual: Constructed word vectors appear as arrows from a common origin. Normalized vectors expose
      cosine as a directional comparison.
    beats:
      - say: A dot product combines matching coordinates. For unit-length vectors, it equals cosine
          similarity and measures directional alignment. Normalizing removes vector magnitude from
          that comparison, making the angle between two representations the quantity being scored in
          this particular metric.
        hold: 0.6
        visual_cues:
          - id: geometry-beat-1-focus-1
            phrase: A dot product combines matching coordinates
            targets:
              - geometry-equation-string-raw-cos-u-v-frac-u-top-v-u-v-10
            color: yellow
            linger: 0.6
          - id: geometry-beat-1-focus-2
            phrase: For unit-length vectors
            targets:
              - embedding-state-vectors
            color: blue
            linger: 0.6
      - say: Follow the river and water arrows. They point in similar directions in our constructed map,
          while money points elsewhere. Bank begins between the two groups. These relationships were
          chosen for the demonstration; a trained model’s actual neighbors need to be measured from
          its vectors.
        hold: 0.6
        visual_cues:
          - id: geometry-beat-2-focus-1
            phrase: Follow the river and water arrows
            targets:
              - geometry-river-water-vectors
            color: yellow
            linger: 0.6
          - id: geometry-bank-position-b2-2
            phrase: Bank begins between the two groups
            targets:
              - geometry-bank-vector
            color: yellow
            linger: 0.6
      - say: Coordinate systems matter. Two embedding models can both output the same number of dimensions
          while arranging information differently. Comparing one model’s vector with another model’s
          vector using an ordinary dot product requires an established alignment or shared training
          contract; matching dimensions alone leaves that relationship unestablished.
        hold: 0.8
        visual_cues:
          - id: geometry-beat-3-focus-1
            phrase: Coordinate systems matter
            targets:
              - geometry-equation-string-raw-cos-u-v-frac-u-top-v-u-v-10
            color: yellow
            linger: 0.6
  - id: context
    title: Surrounding clues create an occurrence state
    visual: Two copies of the identical bank vector receive different weighted context updates. Their
      endpoints travel toward river and finance regions.
    beats:
