  - id: evaluate-path
    title: How many rows reach one expert call?
    visual: Four dependent decode steps each contain one row for E1 and one for E3. A prefill batch stacks the
      same four positions at both experts in one group. Each example contains eight expert rows.
    beats:
      - say: Give four positions the same pair of experts for this comparison. In one request, generate those
          positions one step at a time. The next step needs the preceding token. Each step routes, groups and
          dispatches a single row to each expert, then combines the returns. A remote expert adds a trip
          across the link.
        hold: 0.7
        visual_cues:
          - id: serial-steps
            phrase: generate those positions one step at a time
            targets:
              - decode-steps
            color: cyan
            linger: 0.25
      - say: Now suppose the four positions arrive together in a prompt. At this layer, group all four rows at each
          expert for prefill. Each expert now processes four rows in one call. Batching several requests can
          gather rows in much the same way.
