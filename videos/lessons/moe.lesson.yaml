  - id: prefetch-dependency
    title: Distinguish moving weights from moving tokens
    visual: A resident expert owner receives token packets. A separate offload branch must fetch weight pages from
      CPU or SSD. A next-layer router remains locked behind the current hidden-state computation; predicted
      pages can be used or discarded with visible transfer costs.
    beats:
      - say: Resident expert parallelism moves token states to weights that are already on their owners. Offloading
          instead brings selected expert weights from another memory tier, such as CPU memory or storage.
          Those weight transfers can be much larger than one hidden vector, so the two traffic estimates are
          not interchangeable.
