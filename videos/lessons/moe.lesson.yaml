        visual_cues:
          - id: prefill-group
            phrase: group all four rows at each expert for prefill
            targets:
              - prefill-step
            color: cyan
            linger: 0.25
      - say: Count the expert rows. There are eight in each case. One-row calls and four-row calls give the
          hardware different amounts of work to do at once. Measure decode and prefill separately against a
