scenes:
  - id: capacity-question
    title: Where does the router send each token?
    visual: The code tokens return and total sit above eight expert weight blocks. Two cyan paths connect
      return to E1 and E3 from the first frame. The outputs merge at return. Total lights a different pair
      in pink on the same shelf.
    beats:
      - say: Follow the word return. Two experts light up for it in this layer. Both get the same token vector.
          Each transforms it with its own weights. We multiply each output by its router weight and add the two vectors.
        hold: 0.6
        visual_cues:
          - id: first-pair
            phrase: Follow the word return
            targets:
              - weight-rack
              - token-path
            color: cyan
            linger: 0.25
          - id: first-return
            phrase: multiply each output by its router weight and add the two vectors
            targets:
              - token-path
            color: cyan
            linger: 0.25
      - say: The six gray experts sat idle for this word. Can we discard their weights before we process total?
        hold: 2.7
        visual_cues:
          - id: keep-weights
            phrase: Can we discard their weights before we process total
            targets:
              - weight-rack
            color: yellow
            linger: 0.25
      - say: Keep all eight. For total, the router picks experts two and eight. Both were idle for return.
          Their outputs now combine at total. That's how this mixture of experts uses just two networks
          per token while keeping eight different functions available.
        caption_starts:
          - For total, the router picks experts two and eight
        hold: 0.8
        visual_cues:
          - id: next-pair
            phrase: For total, the router picks experts two and eight
            targets:
              - weight-rack
              - token-path
            color: pink
            linger: 0.25
          - id: next-return
            phrase: Their outputs now combine at total
            targets:
              - token-path
            color: pink
            linger: 0.25
  - id: shared-and-routed
    title: Open up the feed-forward layer
    visual: A token row passes through shared attention and one dense FFN. The FFN opens into four parallel expert
      lanes, preserving the shared attention block and residual bypass. Two routes illuminate for one
      highlighted token.
    beats:
      - say: A Transformer represents each token with a vector called its hidden state. Attention mixes information
          across positions. A feed-forward network then transforms each position using the same learned
          function. Follow the highlighted token.
        visual_cues:
          - id: hidden-token
            phrase: hidden state
            targets:
              - shared-and-routed-input
            color: cyan
          - id: shared-attention
            phrase: Attention mixes information across positions
            targets:
              - shared-and-routed-attention
            color: blue
          - id: dense-ffn
            phrase: feed-forward network then transforms each position
            targets:
              - shared-and-routed-dense
            color: blue
        hold: 0.5
      - say: Open the feed-forward part into several networks. A small router chooses which expert functions process
          this token. Attention stays shared, while the feed-forward transformation takes a selected path.
        visual_cues:
          - id: open-expert-pool
            phrase: Open the feed-forward part into several networks
            targets:
              - shared-and-routed-expert
            color: blue
          - id: router-choice
            phrase: router chooses which expert functions process this token
            targets:
              - shared-and-routed-gate
            color: yellow
        hold: 0.55
      - say: Combine the selected outputs into one vector for the surrounding residual connection and later layers.
          Another token, or the same position at another layer, can take a different route.
        visual_cues:
          - id: combine-experts
            phrase: Combine the selected outputs into one vector
            targets:
              - shared-and-routed-output
            color: cyan
          - id: residual-connection
            phrase: surrounding residual connection
            targets:
              - shared-and-routed-residual-path
            color: blue
        hold: 0.55
  - id: router-scores
    title: Let the hidden state choose a path
    visual: Four coordinate tiles feed the router matrix. The source article's exact logits appear, exponentiate
      into positive masses, and rescale on a common probability axis. Bar lengths use the actual
      stable-softmax calculation.
    beats:
      - say: Multiply the hidden state by the router's learned matrix. This produces one score, called a logit, for
          each expert. Their relative sizes tell us which paths the router favors.
        visual_cues:
          - id: router-hidden-state
            phrase: hidden state
            targets:
              - token-hidden-state
            color: cyan
          - id: project-router-logits
            phrase: one score, called a logit, for each expert
            targets:
              - router-projection
              - expert-scores
            color: blue
        hold: 0.55
      - say: Softmax turns the scores into positive weights that sum to one. Watch the probability bars grow. Raising
          one logit relative to the others gives that expert a larger share.
        visual_cues:
          - id: router-softmax
            phrase: Softmax turns the scores into positive weights that sum to one
            targets:
              - expert-scores
              - softmax-normalization
            color: yellow
          - id: expert-probability-shares
            phrase: larger share
            targets:
              - expert-scores
            color: cyan
        hold: 0.55
      - say: Follow the blue and yellow bars. For this input, those two experts have the highest scores.
        visual_cues:
          - id: expert-identities
            phrase: Follow the blue and yellow bars
            targets:
              - expert-scores
            color: blue
        hold: 0.5
  - id: top-two
    title: Keep two paths and rescale their weights
    visual: Exact probability bars preserve their expert positions as E1 and E3 are selected. The two surviving
      masses travel into one stacked unit bar, growing from their original mass into normalized weights whose
      sum is exactly one.
    beats:
      - say: "Use a Mixtral-style top-two rule. Keep the two largest scores: the first and third experts win. The
          others stay stored and contribute no expert computation for this token."
        visual_cues:
          - id: select-top-two
            phrase: Keep the two largest scores
            targets:
              - winning-expert-probabilities
              - selected-gate-blend
            color: yellow
          - id: unselected-stored
            phrase: The others stay stored
            targets:
              - other-expert-probabilities
            color: blue
        hold: 0.7
      - say: Divide each surviving probability by their combined mass. The selected weights now fill one whole bar,
          with roughly two thirds assigned to the first expert. This is the blend we'll use.
        visual_cues:
          - id: normalize-selected-gates
            phrase: Divide each surviving probability by their combined mass
            targets:
              - gate-renormalization-rule
              - selected-gate-blend
            color: yellow
          - id: unit-gate-blend
            phrase: The selected weights now fill one whole bar
            targets:
              - selected-gate-blend
            color: green
          - id: unit-gate-readout
            phrase: with roughly two thirds assigned to the first expert
            targets:
              - selected-gate-blend
            color: green
        hold: 0.6
      - say: Follow those two colors. We have chosen both the functions to evaluate and the weights for blending their
          outputs. Keep the exact values on screen to check the result.
        visual_cues:
          - id: follow-selected-colors
            phrase: Follow those two colors
            targets:
              - winning-expert-probabilities
              - selected-gate-blend
            color: yellow
        hold: 0.7
  - id: weighted-output
    title: Build the output as a weighted vector sum
    visual: A shared input forks into two illustrative linear expert maps. On a common two-dimensional plane, the
      first output arrow shrinks by its gate, the second shrinks by its own gate, and the weighted arrows join
      head to tail. The diagonal result is computed from the exact logits.
    beats:
      - say: Both selected experts receive the same hidden state and return equally sized vectors. Our tiny example
          produces a horizontal vector from one expert and a vertical vector from the other.
        visual_cues:
          - id: same-expert-input
            phrase: Both selected experts receive the same hidden state
            targets:
              - same-token-input
            color: cyan
          - id: unweighted-expert-results
            phrase: horizontal vector from one expert and a vertical vector from the other
            targets:
              - first-expert-output
              - third-expert-output
            color: yellow
        hold: 0.55
      - say: Scale each vector by its gate weight. The first arrow becomes about two thirds of its original length;
          the second becomes about one third. Their lengths follow our router calculation.
        visual_cues:
          - id: weight-first-expert
            phrase: The first arrow becomes about two thirds of its original length
            targets:
              - first-expert-output
            color: blue
          - id: weight-third-expert
            phrase: the second becomes about one third
            targets:
              - third-expert-output
            color: yellow
        hold: 0.7
      - say: Place the weighted arrows head to tail. The diagonal from the origin is the combined output. Real experts
          use large nonlinear networks; these tiny linear maps make the addition visible.
        visual_cues:
          - id: join-weighted-arrows
            phrase: Place the weighted arrows head to tail
            targets:
              - first-expert-output
              - third-expert-output
            color: yellow
          - id: combined-vector
            phrase: The diagonal from the origin is the combined output
            targets:
              - combined-expert-output
              - mixture-rule
            color: cyan
        hold: 0.75
  - id: routing-rules
    title: The gate rule belongs to the architecture
    visual: The selected top-two gates remain paired. A separate Switch top-one example shows the original winning
      softmax gate multiplying its expert, with a continuous gate sensitivity probe. A common hidden-state row
      remains visible rather than implying independent full models.
    beats:
      - say: Mixtral selects two experts from eight at each layer. Our four-expert picture is a smaller teaching
          example. A checkpoint's routing rule determines the function its trained weights implement.
        visual_cues:
          - id: mixtral-route
            phrase: Mixtral selects two experts from eight
            targets:
              - routing-rules-readout
            color: blue
          - id: trained-routing
            phrase: checkpoint's routing rule
            targets:
              - routing-rules-readout-2
            color: yellow
        hold: 0.5
      - say: Switch Transformer selects one expert and retains its original softmax gate. The gate changes as the
          router learns. Normalizing that lone weight to one would remove this task-loss gradient through the
          gate.
        visual_cues:
          - id: switch-route
            phrase: Switch Transformer selects one expert
            targets:
              - switch-gate
            color: yellow
          - id: gate-learning
            phrase: gate changes as the router learns
            targets:
              - switch-gate
            color: yellow
          - id: retain-gate
            phrase: Normalizing that lone weight to one
            targets:
              - routing-rules-readout-4
            color: blue
        hold: 0.55
      - say: Other architectures add shared experts or use different scoring and balancing rules. Changing the
          selected count changes the computation. Evaluate the resulting answers and cost against the
          checkpoint's actual definition.
        visual_cues:
          - id: architectural-variants
            phrase: different scoring and balancing rules
            targets:
              - routing-rules-readout-2
              - routing-rules-readout-4
            color: blue
          - id: selected-count
            phrase: selected count changes the computation
            targets:
              - routing-rules-readout
            color: yellow
        hold: 0.55
  - id: router-contract
    title: Make the routing rule executable
    visual: One hidden vector enters the actual finite-value validator, four projected logits and a stable
      softmax. Adding one common offset preserves the probability geometry. A deterministic tie splits equal
      scores by expert ID; malformed counts stop before dispatch.
    beats:
      - say: The walkthrough uses a four-coordinate hidden state and four expert maps. Our original two-coordinate
          drawing shows its first two coordinates. For the exact logits, the selected weights are about point
          six six eight and point three three two. The full output begins one point three three six, point
          nine nine five. The rounded probability table instead gives four thirds and one. Keep those two
          calculations separate.
        hold: 0.7
        visual_cues:
          - id: mo-router-contract-op-0
            phrase: The walkthrough uses a four-coordinate hidden state and four expert maps. Our original two-coordinate
              drawing shows its first two coordinates. For the exact logits, the selected weights are about
              point six six eight and point three three two. The full output begins one point three three six,
              point nine nine five. The rounded probability table instead gives four thirds and one. Keep
              those two calculations separate.
            targets:
              - mo-router-contract-mechanism
            color: cyan
            linger: 0.35
          - id: mo-exact-gates
            phrase: selected weights are about point six six eight and point three three two
            targets:
              - mo-router-contract-mechanism
            color: yellow
            linger: 0.45
          - id: mo-exact-output
            phrase: full output begins one point three three six, point nine nine five
            targets:
              - mo-router-contract-mechanism
            color: yellow
            linger: 0.45
          - id: mo-rounded-output
            phrase: rounded probability table instead gives four thirds and one
            targets:
              - mo-router-contract-mechanism
            color: yellow
            linger: 0.45
      - say: The executable router first checks dimensions, finite numbers and an integer expert count. A Boolean or a
          fractional count fails that contract. It projects the hidden state, rejects a nonfinite result, and
          subtracts the largest logit before exponentiating. Subtracting the same number preserves probability
          ratios while avoiding unnecessarily large exponentials.
        hold: 0.7
        visual_cues:
          - id: mo-router-contract-op-1
            phrase: The executable router first checks dimensions, finite numbers and an integer expert count. A Boolean
              or a fractional count fails that contract. It projects the hidden state, rejects a nonfinite
              result, and subtracts the largest logit before exponentiating. Subtracting the same number
              preserves probability ratios while avoiding unnecessarily large exponentials.
            targets:
              - mo-router-contract-mechanism
            color: cyan
            linger: 0.35
          - id: mo-stable-shift
            phrase: subtracts the largest logit before exponentiating
            targets:
              - mo-router-contract-mechanism
            color: yellow
            linger: 0.45
      - say: Choose the highest scores, using expert ID to break an exact tie in this teaching implementation. Divide
          each chosen probability by the sum of chosen probabilities. These weights sum to one. That is the
          rule for this example. A trained model may use another rule, and changing its chosen count changes
          the function it was trained to compute.
        hold: 0.7
        visual_cues:
          - id: mo-router-contract-op-2
            phrase: Choose the highest scores, using expert ID to break an exact tie in this teaching implementation.
              Divide each chosen probability by the sum of chosen probabilities. These weights sum to one.
              That is the rule for this example. A trained model may use another rule, and changing its chosen
              count changes the function it was trained to compute.
            targets:
              - mo-router-contract-mechanism
            color: cyan
            linger: 0.35
          - id: mo-tie-order
            phrase: using expert ID to break an exact tie in this teaching implementation
            targets:
              - mo-router-contract-mechanism
            color: yellow
            linger: 0.45
          - id: mo-normalized
            phrase: These weights sum to one
            targets:
              - mo-router-contract-mechanism
            color: yellow
            linger: 0.45
  - id: gate-gradient
    title: One selected expert can still train a gate
    visual: Two expert scores define a sigmoid curve. The selected expert stays fixed while its retained
      probability changes the output and squared-loss slope. A second branch normalizes its sole gate to one
      and becomes locally flat. Both loss values wait for their completed clauses.
    beats:
      - say: One expert returns two. Its router weight is three quarters, and the target output is one. Use
          half the squared error for the loss. What output do we get if we keep the router weight? What if
          we set it to one?
        hold: 1.5
        visual_cues:
          - id: mo-gate-gradient-op-0
            phrase: One expert returns two. Its router weight is three quarters, and the target output is one.
              Use half the squared error for the loss. What output do we get if we keep the router weight?
              What if we set it to one?
            targets:
              - mo-gate-gradient-mechanism
            color: cyan
            linger: 0.35
      - say: One point five. That's three quarters of the expert's output. The loss is one eighth. A
          small change in the selected logit changes that probability, so the task loss can train
          the router even while the selected expert stays fixed. With the other logit fixed at zero,
          the derivative here is three sixteenths. The curve shows this local slope.
        caption_starts:
          - The loss is one eighth
        hold: 0.7
        visual_cues:
          - id: mo-gate-gradient-op-1
            phrase: One point five. That's three quarters of the expert's output. The loss is one eighth.
              A small change in the selected logit changes that probability, so the task loss can
              train the router even while the selected expert stays fixed. With the other logit
              fixed at zero, the derivative here is three sixteenths. The curve shows this local
              slope.
            targets:
              - mo-gate-gradient-mechanism
            color: cyan
            linger: 0.35
          - id: mo-retained-output
            phrase: One point five
            targets:
              - mo-gate-gradient-mechanism
            color: yellow
            linger: 0.45
          - id: mo-retained-loss
            phrase: The loss is one eighth
            targets:
              - mo-gate-gradient-mechanism
            color: yellow
            linger: 0.45
          - id: mo-retained-gradient
            phrase: derivative here is three sixteenths
            targets:
              - mo-gate-gradient-mechanism
            color: yellow
            linger: 0.45
      - say: Normalizing a sole selected gate gives weight one, output two, and loss one half. Away from a
          selection boundary, that output has zero derivative through this normalized gate. The expert
          itself can still learn. Load balancing gives the router another training signal.
        caption_starts:
          - output two
        hold: 0.7
        visual_cues:
          - id: mo-gate-gradient-op-2
            phrase: Normalizing a sole selected gate gives weight one, output two, and loss one half. Away from a
              selection boundary, that output has zero derivative through this normalized gate. The expert
              itself can still learn. Load balancing gives the router another training signal.
            targets:
              - mo-gate-gradient-mechanism
            color: cyan
            linger: 0.35
          - id: mo-normalized-output
            phrase: Normalizing a sole selected gate gives weight one, output two, and loss one half
            targets:
              - mo-gate-gradient-mechanism
            color: yellow
            linger: 0.45
          - id: mo-normalized-flat
            phrase: that output has zero derivative through this normalized gate
            targets:
              - mo-gate-gradient-mechanism
            color: yellow
            linger: 0.45
  - id: batch-dispatch
    title: Group the work, preserve the token
    visual: Six persistent token colors branch into their explicit top-two assignments, traveling along visible
      polylines into four expert queues. The queued rows execute together, then return to six original token
      positions with both contributions accumulated.
    beats:
      - say: Give every token a persistent color and follow its two assignments. The runtime groups assignments by
          expert, letting one network process several hidden states together as rows of a matrix.
        visual_cues:
          - id: persistent-token
            phrase: persistent color
            targets:
              - source-token-identities
            color: cyan
          - id: group-assignments
            phrase: groups assignments by expert
            targets:
              - expert-assignment-rows
            color: blue
        hold: 0.6
      - say: The grouped rows become an expert matrix multiplication. A token's identity and gate weight travel with
          its row. The work changes order while each row retains its original destination.
        visual_cues:
          - id: expert-matrix
            phrase: expert matrix multiplication
            targets:
              - expert-assignment-rows
            color: blue
          - id: carried-gates
            phrase: identity and gate weight travel with its row
            targets:
              - batch-dispatch-readout-5
            color: yellow
        hold: 0.55
      - say: Return each result to its token position, apply its gate, and accumulate both contributions. Preserving
          the indices and weights makes grouped execution compute the same mixture we built for one token.
        visual_cues:
          - id: restore-order
            phrase: Return each result to its token position
            targets:
              - ordered-token-results
            color: cyan
          - id: weighted-accumulation
            phrase: apply its gate, and accumulate both contributions
            targets:
              - ordered-token-results
            color: green
        hold: 0.65
  - id: pack-permutation
    title: Follow two assignments for token zero
    visual: Five tickets carry a token ID, expert ID and gate. One ticket at a time crosses into its expert's
      group. Token zero's two tickets land in different groups and retain their own weights.
    beats:
      - say: Here are three tokens and five assignments. In this example the experts are numbered from zero. Read
          the first ticket on the right. Expert two gets token zero's vector, one and two. A quarter of that
          expert's output belongs back at token zero.
        hold: 0.55
        visual_cues:
          - id: read-ticket
            phrase: Read the first ticket on the right
            targets:
              - assignment-rack
            color: cyan
            linger: 0.25
      - say: Move each ticket into its expert's group, taking its token number and weight along. Now each expert
          can process its rows together in one matrix operation.
        hold: 0.75
        visual_cues:
          - id: group-tickets
            phrase: Move each ticket into its expert's group, taking its token number and weight along
            targets:
              - assignment-rack
            color: cyan
            linger: 0.25
      - say: Look down the packed rows. Which two will send results back to token zero?
        hold: 2.2
        visual_cues:
          - id: find-address
            phrase: Which two will send results back to token zero
            targets:
              - assignment-rack
            color: cyan
            linger: 0.25
      - say: The two tickets marked token zero went to different experts. Expert one carries three quarters and
          expert two carries one quarter. You can change the order within a group. Each result still needs
          that original token address and its own weight.
        caption_starts:
          - Expert one carries three quarters
        hold: 0.65
        visual_cues:
          - id: both-addresses
            phrase: The two tickets marked token zero went to different experts
            targets:
              - assignment-rack
            color: cyan
            linger: 0.25
  - id: scatter-combine
    title: What comes back to each token?
    visual: The same packed tickets execute in order. Weighted vectors move to three running sums by token ID.
      Token zero's second vector waits beside its first subtotal, then the two add in place.
    beats:
      - say: Keep those five tickets in order. On the right, put a zero vector at each token address. Expert zero
          doubles both its inputs. Its weighted returns go to token one and token two. Token one is finished.
          Token two is still waiting for another return.
        hold: 0.7
        visual_cues:
          - id: double-rows
            phrase: Its weighted returns go to token one and token two
            targets:
              - packed-execution
              - weighted-return-path
              - token-sums
            color: cyan
            linger: 0.25
      - say: Expert one negates token zero's input, giving minus one and minus two. Send three quarters of that
          back to token zero. Look at its subtotal. Both coordinates are negative.
        hold: 0.9
        visual_cues:
          - id: negate-zero
            phrase: Send three quarters of that back to token zero
            targets:
              - weighted-return-path
              - token-sums
            color: cyan
            linger: 0.25
      - say: Expert two halves that same input. Take a quarter of its half-sized vector and carry it back. Here's
          the positive return beside the negative subtotal. What belongs in token zero now?
        hold: 2.7
        visual_cues:
          - id: quarter-return
            phrase: Take a quarter of its half-sized vector and carry it back
            targets:
              - packed-execution
              - weighted-return-path
              - token-sums
            color: cyan
            linger: 0.25
      - say: Add the return to the subtotal. Token zero ends at minus point six two five, minus one point two five.
          The last ticket goes back to token two and finishes its sum at five point five, six point six.
          That's scatter-add. Five assignment rows have filled three token addresses.
        caption_starts:
          - Token zero ends at minus point six two five
          - The last ticket goes back to token two
        hold: 0.8
        visual_cues:
          - id: add-zero
            phrase: Token zero ends at minus point six two five, minus one point two five
            targets:
              - weighted-return-path
              - token-sums
            color: cyan
            linger: 0.25
          - id: last-return
            phrase: finishes its sum at five point five, six point six
            targets:
              - weighted-return-path
              - token-sums
            color: cyan
            linger: 0.25
      - say: If you overwrite token zero on the second delivery, only the small positive return survives. If you
          omit the gates, the two raw outputs add to minus a half, minus one. Both mistakes change the
          answer. Apply each gate once, including when a kernel does the multiplication for you. Add the
          residual and any shared expert separately.
        hold: 0.7
        visual_cues:
          - id: wrong-writes
            phrase: overwrite token zero on the second delivery
            targets:
              - token-sums
            color: yellow
            linger: 0.25
  - id: expert-choice
    title: Who gets a place?
    visual: A three-by-five matrix holds a router probability for each expert and token. Each expert fills its
      two places from its own row. The viewer reads down the same columns to decide which token receives no
      return.
    beats:
      - say: So far the token has chosen its experts. Now give each expert two places and let it choose its tokens.
          This is expert choice. Read the first row of this toy score table. Fill its two places with the
          highest scores. Token zero and token one get those calls.
