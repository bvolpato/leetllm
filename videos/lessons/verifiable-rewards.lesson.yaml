    title: Find what the checker leaves unmeasured
    visual: A formatting signal gives partial credit to a wrong answer, a shortcut passes the declared check, and
      an invalid test runner sends the rollout to quarantine.
    beats:
      - say: A separate format reward can encourage a required answer structure. A model may learn that structure
          while still giving the wrong result, so log outcome accuracy and format compliance separately.
        hold: 0.55
        visual_cues:
          - id: failure-b1-1
            phrase: format reward
            targets:
              - format-score
            linger: 0.45
          - id: failure-b1-2
            phrase: outcome accuracy
            targets:
              - answer-score
            linger: 0.45
      - say: Any narrow verifier creates an optimization target. If the checker awards points for a boxed number
          alone, a lucky guess can tie a sound derivation. Broader tests reduce some shortcuts while leaving
          untested cases.
        hold: 0.55
        visual_cues:
          - id: failure-b2-1
            phrase: narrow verifier
            targets:
              - combined-reward
            linger: 0.45
      - say: Subjective helpfulness needs judgment suited to that task. A deterministic checker is valuable when the
          task has a reliable external criterion, such as compiled code tests or exact arithmetic. Subjective
          feedback needs its own calibration and disagreement checks before it becomes part of the objective.
        hold: 0.75
        visual_cues:
          - id: failure-b3-1
            phrase: external criterion
            targets:
              - answer-score
            linger: 0.45
