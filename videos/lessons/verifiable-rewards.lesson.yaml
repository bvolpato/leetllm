          point and half earn zero. It gets paid only at the end, with no discount. The expected return
          is half a point. That's the value a PPO critic tries to predict from these tokens. Follow the
          continuation that misses. Its reward is zero. Subtract the half point we expected. Its observed
          advantage is minus one half.
