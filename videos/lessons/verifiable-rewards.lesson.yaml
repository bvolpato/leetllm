  - id: fresh-batch-repair
    title: Which zero belongs in the next update?
    visual: Four identified records share a ledger. Move the host result into quarantine, recount the measured
      rows, then follow the second response across zero when the parser changes.
    beats:
      - say: A fresh cluster has eighteen workers with fourteen slots each. Again, one job takes one slot. The first
          response boxes the product. The second boxes that same number, then changes its answer. The third runs
          out of its own time on a healthy runner. The fourth loses its host. An old run recorded two ones and
          two zeros. Which zero belongs in training?
        hold: 2.15
        visual_cues:
          - id: batch-inputs
            phrase: eighteen workers with fourteen slots each
            targets:
              - task-and-rows
            linger: 0.2
            caption_boundary: true
          - id: batch-first
            phrase: first response boxes the product
            targets:
              - first-record
            linger: 0.2
            caption_boundary: true
          - id: batch-second
            phrase: second boxes that same number
            targets:
              - second-record
            linger: 0.2
            caption_boundary: true
          - id: batch-timeout
            phrase: third runs out of its own time
            targets:
              - third-record
            linger: 0.2
            caption_boundary: true
          - id: batch-lost
            phrase: fourth loses its host
            targets:
              - fourth-record
            linger: 0.2
            caption_boundary: true
          - id: batch-buffer
            phrase: two ones and two zeros
            targets:
              - reward-column
            linger: 0.2
            caption_boundary: true
      - say: Keep the third response's zero. Its time limit was part of the task. Move the fourth record into
          quarantine for a bounded retry on the same submission. We have three measurements. The old first-box
          rule pays two of them, so the mean is two thirds. The second response still sits above average.
        hold: 0.7
        visual_cues:
          - id: batch-quarantine
            phrase: Move the fourth record into quarantine
            targets:
              - fourth-record
            linger: 0.2
            caption_boundary: true
          - id: batch-weak-stats
            phrase: mean is two thirds
            targets:
              - batch-stats
            linger: 0.2
            caption_boundary: true
      - say: Replay the single-box rule on the same text. The first answer has one box matching two hundred fifty-two.
          The second answer has two boxes. Change its reward from one to zero. Now just one of the three passes.
          The mean drops to one third. The spread stays the same because we've exchanged two passes and one miss
          for one pass and two misses.
        hold: 0.55
        visual_cues:
          - id: batch-fields
            phrase: The second answer has two boxes
            targets:
              - second-record
            linger: 0.2
            caption_boundary: true
          - id: batch-strict
            phrase: Change its reward from one to zero
            targets:
              - reward-column
            linger: 0.2
            caption_boundary: true
          - id: batch-strict-stats
            phrase: mean drops to one third
            targets:
              - batch-stats
            linger: 0.2
            caption_boundary: true
      - say: Read across the second row. With the first parser its advantage was positive. With the repaired parser
          it's negative. The timeout still earned zero, yet its advantage changed too. Both answers are now
          compared with the new mean. Which of those two versions of the group should supply the next update?
        hold: 1.55
        visual_cues:
          - id: batch-flip
            phrase: Read across the second row
            targets:
              - second-advantages
            linger: 0.2
            caption_boundary: true
  - id: fresh-step-payoff
    title: What will the next update reinforce?
    visual: The three measured rows retain their identities. A common probability ruler marks one third. One
      softmax step is replayed from that mark under each parser, exposing the sign reversal for the two-box
      response. The last prompt adds one worker and leaves the new model answer open.
    beats:
      - say: Use the repaired group. Give each of its three measured responses one category in a tiny policy. Start
          the three logits at zero. Each response has probability one third. Look at the second row again. Which
          way should its probability move on this step?
        hold: 1.95
        visual_cues:
          - id: step-start
            phrase: Each response has probability one third
            targets:
              - probability-ruler
            linger: 0.2
            caption_boundary: true
          - id: step-ask
            phrase: the second row again
            targets:
              - second-probability
            linger: 0.2
            caption_boundary: true
      - say: At the starting policy every current-to-rollout ratio is one. Negate the mean of ratio times advantage,
          with no reference penalty. The gradient for each logit here is its negative advantage divided by
          three. Take one step of size point three. The first logit rises. The other two each fall by about
          seven hundredths.
        hold: 0.45
        visual_cues:
          - id: step-grad
            phrase: negative advantage divided by three
            targets:
              - step-arithmetic
            linger: 0.2
            caption_boundary: true
          - id: step-logits
            phrase: Take one step of size point three
            targets:
              - step-arithmetic
            linger: 0.2
            caption_boundary: true
      - say: Exponentiate those three logits and divide each result by their sum. Watch the marks move away from one
          third. The single-box answer now gets about thirty-eight percent of the probability. The two-box
          answer and the timeout each get about thirty-one percent. Their unrounded shares still add to one.
        hold: 0.7
        visual_cues:
          - id: step-normalize
            phrase: Exponentiate those three logits and divide each result by their sum
            targets:
              - normalizer
            linger: 0.2
            caption_boundary: true
          - id: step-move
            phrase: Watch the marks move away from one third
            targets:
              - probability-ruler
            linger: 0.2
            caption_boundary: true
      - say: What did the parser repair buy us? Start from one third again and change only the parser back. Follow the
          second row. The old checker would push that same contradictory answer up to nearly thirty-six percent.
          The repaired checker pushes it down. Train on the rescored group, and keep the missing host
          measurement out. To find out whether a model learned to count slots, give it new worker counts and
          check the answers.
        hold: 0.95
        caption_starts:
          - Start from one third again
          - Follow the second row
          - The old checker would push
          - nearly thirty-six percent
          - The repaired checker pushes it down
          - Train on the rescored group
          - To find out whether a model learned to count slots
        visual_cues:
          - id: step-replay
            phrase: change only the parser back
            targets:
              - second-probability
            linger: 0.2
          - id: step-compare
            phrase: up to nearly thirty-six percent
            targets:
              - second-probability
            linger: 0.2
          - id: step-old-value
            phrase: nearly thirty-six percent
            targets: [second-probability]
          - id: step-transfer
            phrase: To find out whether a model learned to count slots
            targets: [next-check]
            linger: 0.2
