  - id: token-surrogate
    title: Which token incentive survives clipping?
    visual: Two stored token choices use the same signed ruler. Plot the raw and clipped products, pick the
      smaller, then carry each selected value into its own response mean.
    beats:
      - say: Pick one generated token from a response with advantage plus one. The policy that sampled it gave it
          probability one half at that position. The current policy gives it point six five. Divide current by
          rollout to get one point three. In code we exponentiate the difference of their log probabilities.
        hold: 0.5
        visual_cues:
          - id: clip-ratio
            phrase: Divide current by rollout
            targets:
              - token-input
            linger: 0.2
            caption_boundary: true
      - say: Set the clipping margin to point two. The raw product lands at one point three. Clip the ratio to one
          point two and multiply by the same advantage. Keep the smaller product. Further increases in this
          ratio earn no more reward on this branch.
        hold: 0.6
        visual_cues:
          - id: clip-raw
            phrase: raw product lands at one point three
            targets:
              - raw-product
            linger: 0.2
            caption_boundary: true
          - id: clip-bound
            phrase: Clip the ratio
            targets:
              - clipped-product
            linger: 0.2
            caption_boundary: true
          - id: clip-select
            phrase: Keep the smaller product
            targets:
              - selected-term
            linger: 0.2
            caption_boundary: true
      - say: Now take a token from a response with advantage minus one. Its rollout probability was also one half. Its
          current probability is point three five. The raw ratio is point seven, and clipping lifts it to point
          eight. Multiply both by minus one. Which product is smaller?
        hold: 2.1
        visual_cues:
          - id: clip-next
            phrase: take a token
            targets:
              - token-input
            linger: 0.2
            caption_boundary: true
          - id: clip-negative-raw
            phrase: raw ratio is point seven
            targets:
              - raw-product
            linger: 0.2
            caption_boundary: true
          - id: clip-negative-bound
            phrase: clipping lifts it to point eight
            targets:
              - clipped-product
            linger: 0.2
            caption_boundary: true
      - say: Minus point eight is farther left. That's the term we keep. For a negative advantage the plateau is below
          point eight. A ratio moving the other way can still change the loss. The denominator belongs to the
          rollout policy. A reference policy enters separately if we use a drift penalty.
        hold: 0.55
        visual_cues:
          - id: clip-negative-select
            phrase: Minus point eight is farther left
            targets:
              - selected-term
            linger: 0.2
            caption_boundary: true
      - say: Put each selected term back in its response. Suppose every other included token has ratio one. The first
          response averages two terms. The second averages three. Skip the padding, average the two response
          means, and negate that result for the reward loss. This is DeepSeekMath's tokenwise objective.
          Clipping a product of ratios once for the whole response would give a different objective.
        hold: 0.7
        visual_cues:
          - id: clip-reduce
            phrase: Put each selected term back in its response
            targets:
              - token-rows
            linger: 0.2
            caption_boundary: true
          - id: clip-average
            phrase: average the two response means
            targets:
              - reduced-loss
            linger: 0.2
            caption_boundary: true
  - id: kl-value-gradient
    title: Do equal KL values give the same gradient?
    visual: At one prefix, two weighted sums begin equal. Change only the first logit. The token terms change in
      both sums, but only the live weights move toward the cheaper token. Return to the starting policy to
      compare the slopes.
    beats:
      - say: Clipping used the policy that generated our batch. Now bring in a separate reference policy. It gives
          these two tokens equal probability. The current policy gives the first token eighty percent. For each
          token take the log of reference probability divided by current probability. Call it ell. Exponentiate
          ell, subtract ell, then subtract one. Each sample term is nonnegative.
        hold: 0.65
        visual_cues:
          - id: kl-input
            phrase: separate reference policy
            targets:
              - kl-input
            linger: 0.2
            caption_boundary: true
          - id: kl-terms
            phrase: Exponentiate ell, subtract ell, then subtract one
            targets:
              - kl-input
            linger: 0.2
            caption_boundary: true
      - say: Weight those two terms by how often the current policy picks each token. The sum is about point one nine
          three. With current-policy sampling and shared full support, that expectation equals forward KL. A
          single token gives one term. The lower copy freezes the weights at eighty and twenty percent. The sums
          agree here. If we raise the first logit, will they still agree?
        hold: 2.1
        visual_cues:
          - id: kl-weights
            phrase: Weight those two terms
            targets:
              - kl-weights
            linger: 0.2
            caption_boundary: true
      - say: Raise just the first logit by point two. Both copies recalculate the token terms. The upper copy also
          shifts weight toward the cheaper first token. The lower copy misses that shift. Both sums rose, but
          the upper one rose less.
        hold: 0.7
        caption_starts:
          - Both sums rose
        visual_cues:
          - id: kl-shift
            phrase: Raise just the first logit by point two
            targets:
              - kl-input
              - kl-weights
            linger: 0.2
            caption_boundary: true
          - id: kl-cheaper
            phrase: shifts weight toward the cheaper first token
            targets:
              - kl-weights
            linger: 0.2
            caption_boundary: true
      - say: Return to the starting point and measure the slope there. For the first logit, the full KL slope is about
          point two two two. Holding the sampled-token weights fixed gives point three. The second logit has the
          opposite derivative in each case. Before comparing updates, check which policy supplied the samples
          and whether gradients flowed through their weights. Older rollout samples can change the weighting
          too.
        hold: 0.75
        caption_starts:
          - For the first logit
          - point two two two
          - Holding the sampled-token weights fixed
          - point three
          - The second logit has the opposite derivative
          - Before comparing updates
        visual_cues:
          - id: kl-reset
            phrase: Return to the starting point
            targets:
              - kl-weights
            linger: 0.2
            caption_boundary: true
          - id: kl-slopes
            phrase: the full KL slope
            targets:
              - kl-slopes
            linger: 0.2
          - id: kl-live-value
            phrase: point two two two
            targets: [kl-slopes]
          - id: kl-fixed-value
            phrase: point three
            targets: [kl-slopes]
