  - id: grpo
    title: Where do these four answers set the baseline?
    visual: Four reward bars share a horizontal mean. Each answer keeps its identity as its distance from the mean
      becomes a signed advantage. The same axis then shows two uniform groups.
    beats:
      - say: Take the four scores for fourteen times twelve. Two passes out of four put the mean halfway up the scale.
          Trace the first answer down to that line. Its reward sits half a point above the group. The second
          answer is half a point below. Group relative policy optimization, or GRPO, uses this group mean in
          place of the return estimate from a learned critic.
        hold: 0.65
        visual_cues:
          - id: grpo-mean
            phrase: halfway up the scale
            targets:
              - reward-scale
            linger: 0.2
            caption_boundary: true
          - id: grpo-distance
            phrase: Trace the first answer down to that line
            targets:
              - reward-scale
            linger: 0.2
            caption_boundary: true
          - id: grpo-below
            phrase: half a point below
            targets:
              - relative-rows
            linger: 0.2
            caption_boundary: true
      - say: Those gaps are all half a point in magnitude. Square them, average over the four responses, and take the
          square root. The population standard deviation is one half. Divide each signed gap by that spread. Now
          the first answer is one standard deviation above average, and the second is one below. Those signed
          numbers are the advantages.
        hold: 0.8
        visual_cues:
          - id: grpo-spread
            phrase: Square them, average over the four responses, and take the square root
            targets:
              - spread-rule
            linger: 0.2
            caption_boundary: true
          - id: grpo-normalize
            phrase: Divide each signed gap by that spread
            targets:
              - relative-rows
            linger: 0.2
            caption_boundary: true
      - say: Try four passes. The mean meets the top of every bar. Try four misses. The mean and the rewards are all
          at zero. Both groups have zero spread. Guard the division, give each response zero reward advantage,
          and log the uniform group. Other terms in the loss can still move the policy.
        hold: 0.8
        visual_cues:
          - id: grpo-pass
            phrase: Try four passes
            targets:
              - reward-scale
            linger: 0.2
            caption_boundary: true
          - id: grpo-fail
            phrase: Try four misses
            targets:
              - reward-scale
            linger: 0.2
            caption_boundary: true
          - id: grpo-guard
            phrase: Guard the division
            targets:
              - spread-rule
            linger: 0.2
            caption_boundary: true
