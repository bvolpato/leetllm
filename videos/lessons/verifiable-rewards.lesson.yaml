scenes:
  - id: intro
    title: What score will submission B get?
    visual: A pen draws a box around the revised number on submission B. Keep that sheet and the answer key in place while a one-box submission appears below it.
    beats:
      - say: Submission B just changed its answer. It had a hundred and sixty-eight. Now it says a hundred and forty-eight.
        hold: 0.45
        caption_starts:
          - Now it says
        visual_cues:
          - id: intro-extra
            phrase: Submission B just changed its answer
            targets: [second-box]
      - say: Fourteen times twelve is a hundred and sixty-eight. The checker awards one point if the first box matches. What does B earn?
        hold: 2.2
        caption_starts:
          - The checker awards one point
          - What does B earn
        visual_cues:
          - id: intro-rule
            phrase: The checker awards one point
            targets: [read-rule]
      - say: Compare B with an answer that stops after one box. The checker reads the same number in both. Each gets one point. Even the answer that contradicts itself gets full credit. Using those scores to update the model is reinforcement learning with verifiable rewards.
        hold: 0.8
        caption_starts:
          - The checker reads the same number
          - Each gets one point
          - Even the answer
          - Using those scores
        visual_cues:
          - id: intro-read
            phrase: The checker reads the same number
            targets: [first-boxes]
          - id: intro-award
            phrase: Each gets one point
            targets: [scores]
  - id: alignment-space
    title: Where does the feedback come from?
    visual: Four training methods pair a source of feedback with the way it changes the model. The Tülu 3 example shows a checker reward and a separate missing-end-token penalty.
    beats:
      - say: Suppose we have a worked answer. Supervised fine-tuning fits its tokens by cross-entropy. If people rank two answers, we can train a reward model on those rankings and let it score new answers for reinforcement learning. Direct preference optimization, or DPO, uses the preferred and rejected answers directly.
        hold: 0.7
        visual_cues:
          - id: method-sft
            phrase: Supervised fine-tuning
            targets: [method-sft]
          - id: method-rlhf
            phrase: If people rank two answers
            targets: [method-rlhf]
          - id: method-dpo
            phrase: Direct preference optimization
            targets: [method-dpo]
      - say: With verifiable rewards, we sample new answers and run the checker on each one. PPO and GRPO are two ways to use those scores to update the policy. We could also use the checker to order a pair for DPO. In that case the training data are pairs with a recorded preference.
        hold: 0.7
        visual_cues:
          - id: method-rlvr
            phrase: With verifiable rewards
            targets: [method-rlvr]
      - say: Tülu three used PPO. A checked success earned ten points and a failure earned zero. A missing end token cost ten points separately. A checker can also award partial credit. The scale and the way those scores combine determine which answers earn the most.
        hold: 0.7
        visual_cues:
          - id: tulu-checked
            phrase: A checked success earned ten points and a failure earned zero
            targets: [tulu-rewards]
          - id: tulu-end
            phrase: A missing end token cost ten points
            targets: [tulu-rewards]
  - id: contract
    title: Define the verifier's contract
    visual: A response passes through syntax, execution, and answer checks; candidate failure and infrastructure
      failure route to distinct outcomes.
    beats:
      - say: A verifier maps a prompt and candidate answer to a reward. For a simple outcome-only design, a matching
          checked answer earns one and a mismatch earns zero. A verifier output becomes a training label, so
          its version and failure behavior belong in the experiment record.
        hold: 0.55
        visual_cues:
          - id: contract-b1-1
            phrase: maps a prompt and candidate answer
            targets:
              - answer-parser
            linger: 0.45
          - id: contract-b1-2
            phrase: reward
            targets:
              - outcome-reward
            linger: 0.45
      - say: The checker can parse a final number, run tests on a program, or ask a proof system to validate a formal
          statement. The exact contract determines what a passing answer means.
        hold: 0.55
        visual_cues:
          - id: contract-b2-1
            phrase: run tests
            targets:
              - verifier
            linger: 0.45
      - say: A checker crash leaves the candidate unmeasured. Quarantine that rollout as an infrastructure fault. A
          wrong answer is a candidate failure; a broken test runner is missing evidence.
        hold: 0.75
        visual_cues:
          - id: contract-b3-1
            phrase: checker crash
            targets:
              - infrastructure-fault
            linger: 0.45
          - id: contract-b3-2
            phrase: wrong answer
            targets:
              - candidate-failure
            linger: 0.45
  - id: measurement-status
    title: Keep a broken measurement out of the reward vector
    visual: The same rollout identity travels through reference validation, parser and bounded execution; a
      candidate-owned failure receives zero while infrastructure faults leave an unscored hole.
    beats:
      - say: Validate the task and trusted reference before judging its candidate. A malformed candidate, wrong result
          or candidate-owned runtime timeout receives zero when the verifier infrastructure is healthy. A host
          crash, unavailable prover or invalid reference leaves that sample unscored. Store prompt, rollout
          and verifier versions with both reward and failure type.
        hold: 0.7
        visual_cues:
          - id: vr-measurement-status-b0
            phrase: Validate the task and trusted reference before judging its candidate.
            targets:
              - measurement-status-mechanism
            color: cyan
            linger: 0.3
          - id: vr-zero-measurement-status
            phrase: candidate-owned runtime timeout receives zero
            targets:
              - measurement-status-mechanism
            color: yellow
            linger: 0.35
          - id: vr-unscored-measurement-status
            phrase: leaves that sample unscored
            targets:
              - measurement-status-mechanism
            color: yellow
            linger: 0.35
      - say: Keep unscored identities in quarantine while excluding their missing outcomes from the reward vector. Use
          a bounded retry policy for genuine infrastructure failures, preserving the original candidate.
          Resampling until a passing answer appears changes the experiment. Recording missing measurements as
          zeros can make an outage look like an all-fail group. In a mixed group, a false zero also changes
          the baseline for the measured responses.
        hold: 0.7
        visual_cues:
          - id: vr-measurement-status-b1
            phrase: Keep unscored identities in quarantine while excluding their missing outcomes from the reward vector.
            targets:
              - measurement-status-mechanism
            color: yellow
            linger: 0.3
          - id: vr-quarantine-measurement-status
            phrase: excluding their missing outcomes from the reward vector
            targets:
              - measurement-status-mechanism
            color: yellow
            linger: 0.35
          - id: vr-retry-measurement-status
            phrase: Resampling until a passing answer appears changes the experiment
            targets:
              - measurement-status-mechanism
            color: yellow
            linger: 0.35
      - say: Test the checker on repeated answer fields, invalid reference values, crashes, excessive output
          and timeouts. Look at the last two records. The candidate hit its time limit on a healthy
          runner, so its zero counts. The host crashed before it could measure the fourth response. Only
          the first three scores go into the group mean.
        hold: 0.7
        visual_cues:
          - id: vr-measurement-status-b2
            phrase: Test the checker on repeated answer fields
            targets:
              - measurement-status-mechanism
            color: cyan
            linger: 0.3
          - id: vr-adversarial-measurement-status
            phrase: repeated answer fields, invalid reference values, crashes, excessive output and timeouts
            targets:
              - measurement-status-mechanism
            color: yellow
            linger: 0.35
  - id: check
    title: What can a final field tell us?
    visual: Ten rows of twelve slots and four more rows supply two subtotals. They meet at 168. Two responses then
      show different amounts of working with the same boxed value.
    beats:
      - say: Check the reference by counting the slots. Ten workers with twelve slots each give us a hundred and
          twenty. Four more workers give us forty-eight. Add the two groups. Their hundred and sixty-eight slots
          give us the capacity.
        hold: 0.65
        visual_cues:
          - id: check-ten
            phrase: Ten workers with twelve slots each give us a hundred and twenty
            targets:
              - ten-groups
            linger: 0.2
            caption_boundary: true
          - id: check-four
            phrase: Four more workers give us forty-eight
            targets:
              - four-groups
            linger: 0.2
            caption_boundary: true
          - id: check-gather
            phrase: Add the two groups
            targets:
              - sum
            linger: 0.2
            caption_boundary: true
          - id: check-total
            phrase: hundred and sixty-eight slots
            targets:
              - sum
            linger: 0.2
            caption_boundary: true
      - say: Give the checker two fresh responses. The first gives only the answer. The second shows the calculation.
          Each submits one final field. If the checker compares just that field with the reference, which
          response earns more?
        hold: 2.05
        visual_cues:
          - id: check-answer
            phrase: The first gives only the answer
            targets:
              - check-answer
            linger: 0.2
            caption_boundary: true
          - id: check-worked
            phrase: The second shows the calculation
            targets:
              - check-worked
            linger: 0.2
            caption_boundary: true
      - say: They tie. Each final field says a hundred and sixty-eight, so each response earns one. If a customer
          needs a sound explanation too, inspect the steps separately. A reviewer can catch a faulty argument
          even when its last number matches.
        hold: 0.7
        visual_cues:
          - id: check-tie
            phrase: They tie
            targets:
              - checked-scores
            linger: 0.2
            caption_boundary: true
  - id: outcome-process
    title: Which explanation for 97 would you trust?
    visual: Both responses call 97 prime. Their outcome scores stay equal while a second number tests the first explanation.
    beats:
      - say: "Change the task to whether ninety-seven is prime. One answer says yes because it ends in seven. Another
          checks the prime divisors no larger than its square root: two, three, five and seven. Both final Yes
          fields pass an outcome-only check, although ending in seven does not establish primality."
        hold: 0.7
        visual_cues:
          - id: vr-outcome-process-b0
            phrase: Change the task to whether ninety-seven is prime.
            targets:
              - outcome-process-mechanism
            color: cyan
            linger: 0.3
          - id: vr-bad-proof-outcome-process
            phrase: yes because it ends in seven
            targets:
              - outcome-process-mechanism
            color: yellow
            linger: 0.35
          - id: vr-prime-check-outcome-process
            phrase: two, three, five and seven
            targets:
              - outcome-process-mechanism
            color: yellow
            linger: 0.35
          - id: vr-equal-final-outcome-process
            phrase: Both final Yes fields pass an outcome-only check
            targets:
              - outcome-process-mechanism
            color: yellow
            linger: 0.35
      - say: A process supervisor evaluates intermediate work. Lightman and colleagues used human step labels and learned process reward models to select among generated math solutions. Cobbe and colleagues trained verifiers to score completed solutions. Those studies used learned scores for selection. Here the program checks the final field directly.
        hold: 0.7
        visual_cues:
          - id: vr-outcome-process-b1
            phrase: A process supervisor evaluates intermediate work.
            targets:
              - outcome-process-mechanism
            color: yellow
            linger: 0.3
          - id: vr-steps-outcome-process
            phrase: human step labels and learned process reward models
            targets:
              - outcome-process-mechanism
            color: yellow
            linger: 0.35
      - say: Try the first explanation on seventy-seven. It ends in seven too. Seven times eleven is seventy-seven, so that rule calls a composite number prime. The other explanation tested every prime divisor up to the square root of ninety-seven. All four left a remainder. Now we can say which explanation earns credit for its steps.
        hold: 0.7
        caption_starts:
          - Seven times eleven is seventy-seven
          - The other explanation tested
        visual_cues:
          - id: vr-outcome-process-b2
            phrase: Try the first explanation on seventy-seven
            targets: [outcome-process-mechanism]
          - id: vr-coverage-outcome-process
            phrase: Seven times eleven is seventy-seven
            targets: [outcome-process-mechanism]
  - id: numeric-parser
    title: Extract one bounded field before comparing exact values
    visual: A character-level boxed parser counts markers and balances braces before a numeric grammar and exact
      rational comparison; invalid gold routes away before candidate parsing.
    beats:
      - say: The actual mathematics program first requires one literal boxed marker in at most four thousand
          ninety-six characters. It balances braces, accepts a field of at most sixty-four characters and
          restricts it to a signed integer, fraction or decimal grammar. Fraction conversion makes one half
          and zero point five equal without accepting arbitrary Python expressions.
        hold: 0.7
        visual_cues:
          - id: vr-numeric-parser-b0
            phrase: The actual mathematics program first requires one literal boxed marker in at most four thousand
              ninety-six characters.
            targets:
              - numeric-parser-mechanism
            color: cyan
            linger: 0.3
          - id: vr-markers-numeric-parser
            phrase: one literal boxed marker
            targets:
              - numeric-parser-mechanism
            color: yellow
            linger: 0.35
          - id: vr-balance-numeric-parser
            phrase: It balances braces
            targets:
              - numeric-parser-mechanism
            color: yellow
            linger: 0.35
          - id: vr-fraction-numeric-parser
            phrase: Fraction conversion makes one half and zero point five equal
            targets:
              - numeric-parser-mechanism
            color: yellow
            linger: 0.35
      - say: The trusted reference is parsed first. A zero denominator or invalid gold field quarantines the task. A
          malformed candidate, second box or candidate zero denominator returns zero under a healthy checker.
          The same written text can pass a permissive first-match extractor and fail this deliberately strict
          single-field contract.
        hold: 0.7
        visual_cues:
          - id: vr-numeric-parser-b1
            phrase: The trusted reference is parsed first.
            targets:
              - numeric-parser-mechanism
            color: yellow
            linger: 0.3
          - id: vr-gold-numeric-parser
            phrase: The trusted reference is parsed first
            targets:
              - numeric-parser-mechanism
            color: yellow
            linger: 0.35
          - id: vr-duplicate-numeric-parser
            phrase: second box or candidate zero denominator returns zero
            targets:
              - numeric-parser-mechanism
            color: yellow
            linger: 0.35
      - say: Math-Verify instead separates extraction, symbolic representation and comparison, with configurable
          priorities and tolerance. Symbolic equivalence also needs variable domains, assumptions and time
          limits; failed simplification does not itself prove inequality. If useful working legitimately
          contains several boxes, define a dedicated final-answer field rather than applying our toy contract
          blindly.
        hold: 0.7
        visual_cues:
          - id: vr-numeric-parser-b2
            phrase: Math-Verify instead separates extraction, symbolic representation and comparison, with configurable
              priorities and tolerance.
            targets:
              - numeric-parser-mechanism
            color: cyan
            linger: 0.3
          - id: vr-domains-numeric-parser
            phrase: variable domains, assumptions and time limits
            targets:
              - numeric-parser-mechanism
            color: yellow
            linger: 0.35
  - id: trusted-execution
    title: Grade actual behavior outside the candidate process
    visual: Fixed trusted local program strings run in child processes while the host owns tests, exact output
      type and results; security boundaries are drawn separately from the local execution fixture.
    beats:
      - say: The code exercise runs fixed trusted Python strings with isolated-mode child processes. The host keeps
          expected results and checks the parsed output with exact type int, so the Boolean true does not pass
          as integer one. Candidate-written JSON claiming a perfect score is just output text. The grader must
          observe behavior on its own cases.
        hold: 0.7
        visual_cues:
          - id: vr-trusted-execution-b0
            phrase: The code exercise runs fixed trusted Python strings with isolated-mode child processes.
            targets:
              - trusted-execution-mechanism
            color: cyan
            linger: 0.3
          - id: vr-type-trusted-execution
            phrase: the Boolean true does not pass as integer one
            targets:
              - trusted-execution-mechanism
            color: yellow
            linger: 0.35
          - id: vr-claim-trusted-execution
            phrase: Candidate-written JSON claiming a perfect score is just output text
            targets:
              - trusted-execution-mechanism
            color: yellow
            linger: 0.35
      - say: This subprocess exercise does not sandbox arbitrary generated code. A production code verifier needs a
          restricted, patched execution environment with bounded CPU, wall time, memory, filesystem, network
          and output. Firecracker uses KVM microVMs; gVisor interposes its Sentry application kernel. Their
          different boundaries still depend on host configuration and allowed interfaces.
        hold: 0.7
        visual_cues:
          - id: vr-trusted-execution-b1
            phrase: This subprocess exercise does not sandbox arbitrary generated code.
            targets:
              - trusted-execution-mechanism
            color: yellow
            linger: 0.3
          - id: vr-boundary-trusted-execution
            phrase: bounded CPU, wall time, memory, filesystem, network and output
            targets:
              - trusted-execution-mechanism
            color: yellow
            linger: 0.35
      - say: A sleeping program can exhaust wall time without using its CPU allowance. Set an elapsed-time
          limit and make sure cancellation covers the whole execution boundary, including child
          processes. Keep tests and secrets on the grader's side of that boundary. Clean up the sandbox
          after each run. If the host fails, record the missing measurement.
        hold: 0.7
        visual_cues:
          - id: vr-trusted-execution-b2
            phrase: A sleeping program can exhaust wall time without using its CPU allowance.
            targets:
              - trusted-execution-mechanism
            color: cyan
            linger: 0.3
          - id: vr-sleep-trusted-execution
            phrase: A sleeping program can exhaust wall time without using its CPU allowance
            targets:
              - trusted-execution-mechanism
            color: yellow
            linger: 0.35
          - id: vr-descendant-trusted-execution
            phrase: cancellation covers the whole execution boundary
            targets:
              - trusted-execution-mechanism
            color: yellow
            linger: 0.35
  - id: hidden-cases
    title: Will the lookup work on two new inputs?
    visual: A visible two-key multiplication lookup earns2/2; a withheld pair of new keys is evaluated without
      modifying its stored table and earns0/2.
    beats:
      - say: A lookup table remembers fourteen times twelve and eight times twelve. It earns two out of two on those
          exposed examples. Hold the table fixed and ask seven times nine and eleven times thirteen. The
          authored lookup now earns zero out of two. The visible checker rewarded matching cases without
          establishing multiplication.
        hold: 0.7
        caption_starts:
          - Hold the table fixed
          - zero out of two
          - The visible checker
        visual_cues:
          - id: vr-hidden-cases-b0
            phrase: A lookup table remembers fourteen times twelve and eight times twelve.
            targets:
              - hidden-cases-mechanism
            color: cyan
            linger: 0.3
          - id: vr-visible-hidden-cases
            phrase: two out of two on those exposed examples
            targets:
              - hidden-cases-mechanism
            color: yellow
            linger: 0.35
          - id: vr-new-hidden-cases
            phrase: seven times nine and eleven times thirteen
            targets:
              - hidden-cases-mechanism
            color: yellow
            linger: 0.35
          - id: vr-fail-hidden-cases
            phrase: zero out of two
            targets:
              - hidden-cases-mechanism
            color: yellow
            linger: 0.35
      - say: Use separate hidden inputs and varied execution conditions to test transfer. Keep duplicates and
          near-duplicates across the optimization boundary under control. Hidden tests can also be overfit
          through repeated reward queries, so a final held-out set needs a declared access and selection
          policy. Secrecy alone is not an unlimited source of fresh evidence.
        hold: 0.7
        visual_cues:
          - id: vr-hidden-cases-b1
            phrase: Use separate hidden inputs and varied execution conditions to test transfer.
            targets:
              - hidden-cases-mechanism
            color: yellow
            linger: 0.3
          - id: vr-access-hidden-cases
            phrase: repeated reward queries
            targets:
              - hidden-cases-mechanism
            color: yellow
            linger: 0.35
      - say: Broader checks reduce some shortcuts while leaving other inputs untested. Preserve exact test and
          verifier versions when comparing runs. A policy that cannot see gold outputs can still infer a weak
          grader through its feedback, so validate the full reward interface as well as each individual test.
        hold: 0.7
        visual_cues:
          - id: vr-hidden-cases-b2
            phrase: Broader checks reduce some shortcuts while leaving other inputs untested.
            targets:
              - hidden-cases-mechanism
            color: cyan
            linger: 0.3
          - id: vr-versions-hidden-cases
            phrase: Preserve exact test and verifier versions
            targets:
              - hidden-cases-mechanism
            color: yellow
            linger: 0.35
  - id: instruction-contract
    title: Count the whole response under the declared constraint
    visual: Three actual nonempty hyphen lines are accepted, then an extra unbulleted fourth line reveals a weak
      counter that the strict checker repairs on the same response.
    beats:
      - say: The instruction fixture requires exactly three lines, all nonempty and each beginning with a hyphen and a
          space. A weak counter sees three bullet markers and accepts an extra prose line. The strict
          whole-response check sees four nonempty lines and rejects it. Count the supplied structure rather
          than the fragments a shortcut happens to recognize.
        hold: 0.7
        visual_cues:
          - id: vr-instruction-contract-b0
            phrase: The instruction fixture requires exactly three lines, all nonempty and each beginning with a hyphen
              and a space.
            targets:
              - instruction-contract-mechanism
            color: cyan
            linger: 0.3
          - id: vr-weak-instruction-contract
            phrase: A weak counter sees three bullet markers
            targets:
              - instruction-contract-mechanism
            color: yellow
            linger: 0.35
          - id: vr-strict-instruction-contract
            phrase: four nonempty lines and rejects it
            targets:
              - instruction-contract-mechanism
            color: yellow
            linger: 0.35
      - say: This program checks the explicit format. It does not score whether a story is compelling, an explanation
          is helpful or a business recommendation is wise. An open-ended task can have verifiable subcontracts
          for schema, authorization or secret handling while other qualities still need calibrated judgment
          and disagreement review.
        hold: 0.7
        visual_cues:
          - id: vr-instruction-contract-b1
            phrase: This program checks the explicit format.
            targets:
              - instruction-contract-mechanism
            color: yellow
            linger: 0.3
          - id: vr-boundary-instruction-contract
            phrase: It does not score whether a story is compelling
            targets:
              - instruction-contract-mechanism
            color: yellow
            linger: 0.35
      - say: Fix a parser defect before interpreting its reward as model improvement. If a low-reward base produces
          unreadable syntax, a small supervised or distilled cold start may make useful candidates reachable.
          If the gold or runner is broken, more model training treats a measurement failure as a capability
          problem.
        hold: 0.7
        visual_cues:
          - id: vr-instruction-contract-b2
            phrase: Fix a parser defect before interpreting its reward as model improvement.
            targets:
              - instruction-contract-mechanism
            color: cyan
            linger: 0.3
          - id: vr-repair-instruction-contract
            phrase: Fix a parser defect before interpreting its reward as model improvement
            targets:
              - instruction-contract-mechanism
            color: yellow
            linger: 0.35
  - id: formal-sql
    title: Own the theorem and preserve query multiplicity
    visual: An authored proof-result record compares the externally fixed theorem/imports and axiom set; a
      parallel SQL result comparison preserves repeated rows and explicit ordering.
    beats:
      - say: Read this example proof record. The trusted theorem and imports stay outside candidate control.
          The grader checks which theorem was proved, whether the proof was accepted and which axioms it
          uses. Here Classical dot choice, propext and Quot dot sound are allowed. A dependency on
          sorryAx fails the audit.
        hold: 0.7
        visual_cues:
          - id: vr-formal-sql-b0
            phrase: Read this example proof record
            targets:
              - formal-sql-mechanism
            color: cyan
            linger: 0.3
          - id: vr-owned-formal-sql
            phrase: The trusted theorem and imports stay outside candidate control
            targets:
              - formal-sql-mechanism
            color: yellow
            linger: 0.35
          - id: vr-axiom-formal-sql
            phrase: sorryAx fails the audit
            targets:
              - formal-sql-mechanism
            color: yellow
            linger: 0.35
      - say: Lean lists the axioms a proof depends on, including those inherited through other theorems.
          That list can contain an unapproved axiom even when the file compiles. Native evaluation also
          depends on the compiler. Audit the dependencies for the exact statement and environment you
          intend to trust.
        hold: 0.7
        visual_cues:
          - id: vr-formal-sql-b1
            phrase: Lean lists the axioms a proof depends on
            targets:
              - formal-sql-mechanism
            color: yellow
            linger: 0.3
          - id: vr-compile-formal-sql
            phrase: even when the file compiles
            targets:
              - formal-sql-mechanism
            color: yellow
            linger: 0.35
      - say: For SQL, two identical returned rows are a different multiset from one row. Preserve duplicates, column
          values, types and NULL behavior. Without an explicit order clause, SQLite does not guarantee result
          order; equal sort keys need not fix tie order. Testing more database snapshots improves coverage but
          does not prove two queries equivalent on all databases.
        hold: 0.7
        visual_cues:
          - id: vr-formal-sql-b2
            phrase: For SQL, two identical returned rows are a different multiset from one row.
            targets:
              - formal-sql-mechanism
            color: cyan
            linger: 0.3
