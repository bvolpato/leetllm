  - id: tower-contract
    title: Freeze compatible vectors and score the actual query
    visual: Freeze compatible vectors and score the actual query.
    beats:
      - say: "A query or session tower and an item tower encode independently before their final similarity. Item
          vectors can be precomputed. Normalize both if the intended score is cosine: normalized dot product
          equals cosine, while an unnormalized dot product also reflects magnitude. Keep tower weights,
          normalization, item embeddings and index version compatible."
        hold: 0.6
        visual_cues:
          - id: tower-contract-b1
            phrase: A query or session tower and an item tower encode independently before their final similarity.
            targets:
              - tower-contract-construction
            color: cyan
            linger: 0.5
          - id: tower-normalization
            phrase: normalized dot product equals cosine
            targets:
              - tower-contract-construction
            color: cyan
            linger: 0.4
      - say: The article supplies a thousand random sixteen-dimensional item vectors, computes one query vector, and
          evaluates a thousand exact dot products. Five candidates then receive a query-dependent cross layer.
          Those exact scores give us a reference for testing an approximate index. Check which neighbors
          it finds, how quickly it picks up new pages, and how long requests take under load.
        hold: 0.6
        visual_cues:
          - id: tower-contract-b2
            phrase: The article supplies a thousand random sixteen-dimensional item vectors, computes one query vector,
              and evaluates a thousand exact dot products.
            targets:
              - tower-contract-construction
            color: cyan
            linger: 0.5
          - id: tower-counts
            phrase: Five candidates then receive a query-dependent cross layer.
            targets:
              - tower-contract-construction
            color: cyan
            linger: 0.4
      - say: Retrieval training commonly pushes observed positive query-item pairs above sampled alternatives. Those
          alternatives are not verified dislikes, and repeated known positives need care. An independent
          two-tower score can be the final score if it meets the task; a later joint scorer trades additional
          request work for richer early query-document interactions.
        hold: 0.8
        visual_cues:
          - id: tower-contract-b3
            phrase: Retrieval training commonly pushes observed positive query-item pairs above sampled alternatives.
            targets:
              - tower-contract-construction
            color: cyan
            linger: 0.5
  - id: cross-vector
    title: A shared scalar projection couples every cross feature
    visual: A shared scalar projection couples every cross feature.
    beats:
      - say: The original DCN vector cross layer first takes the dot product of the current vector with a learned
          weight vector. Multiply that one scalar by each coordinate of the original input, then add the bias
          and current coordinate. This is x zero times the scalar x l transpose w, plus b, plus x l. Preserve
          which object supplies each factor.
        hold: 0.6
        visual_cues:
          - id: cross-vector-b1
            phrase: The original DCN vector cross layer first takes the dot product of the current vector with a learned
              weight vector.
            targets:
              - cross-vector-construction
            color: cyan
            linger: 0.5
      - say: Use the article’s separate two-coordinate input x zero equal two, three and current x l equal five,
          seven. Weight one, zero gives projection five. Multiply the original input by five to obtain ten,
          fifteen. Add biases one half, one and the residual five, seven. The result is fifteen point five,
          twenty-three. These two features carry the interaction into the next layer.
        hold: 0.6
        visual_cues:
          - id: cross-vector-b2
            phrase: Use the article’s separate two-coordinate input x zero equal two, three and current x l equal five,
