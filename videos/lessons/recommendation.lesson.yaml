            color: blue
            linger: 0.6
      - say: Five documents are eligible. Three have useful answers. Look for the guide, the runbook and the SDK
          example. The first three retrieved pages include the guide, the blog and the changelog. Only the guide
          matches a useful answer, so candidate recall is one divided by three.
        hold: 0.6
