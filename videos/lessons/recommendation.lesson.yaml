  - id: retrieval-recall
    title: Retrieve useful candidates before ranking
    visual: A retrieval budget of three returns one of three relevant eligible documents; expanding to five
      recovers all three so a later ranker can see them.
    beats:
      - say: At a million documents, running an expensive query-and-document model on every item for each keystroke
          costs too much. A first stage uses lexical or vector search to produce a shortlist for more careful
          scoring.
        hold: 0.55
        visual_cues:
          - id: retrieval-recall-beat-1-focus-1
            phrase: At a million documents
            targets:
