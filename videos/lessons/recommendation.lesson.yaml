          four and zero point two can correspond to probabilities one and one half, giving corrected estimates
          zero point four each. If the first slot’s absolute examination anchor is zero point eight, the
          second is zero point four, and both corrected estimates become zero point five. Relative ratios
          alone cannot select the absolute relevance level.
