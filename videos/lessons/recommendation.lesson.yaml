  - id: eligibility
    title: Check permission before relevance
    visual: The private incident draft and stale migration guide are removed by current eligibility checks before
      candidate retrieval, despite their high retrieval scores.
    beats:
      - say: Start with seven documents. Five are current and permitted. A private draft scores 0.99 for retrieval,
          and a stale guide scores 0.95, but neither belongs in this request’s eligible set.
        hold: 0.55
        visual_cues:
          - id: eligibility-beat-1-focus-1
            phrase: A private draft scores 0
            targets:
              - eligibility-simulation-6
            color: blue
            linger: 0.6
          - id: eligibility-beat-1-focus-2
            phrase: Five are current and permitted
            targets:
              - eligibility-object-allowed-eligible-item-permitted-stale-private-8
            color: blue
            linger: 0.6
