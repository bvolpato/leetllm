  - id: judgment-universe
    title: Which pages belong in the denominator?
    visual: A cutoff moves down the five frozen judgments. The best returned slate and both NDCG denominators
      stay aligned as retrieval admits the fourth page.
    beats:
      - say: Take the three pages retrieval found first. The API guide has grade three, so its gain is two cubed
          minus one, or seven. It’s in slot one. Divide by the base-two logarithm of rank plus one, then add
          the three slots. The two zero grades contribute nothing. That leaves seven units of discounted
          gain.
        hold: 0.5
        visual_cues:
          - id: universe-gain
            phrase: That leaves seven units of discounted gain
            targets:
              - universe-scores
            color: cyan
            linger: 0.25
      - say: How good is seven? Among those three candidates, the guide already leads. The best possible sum is
          seven. Across all five eligible pages, a judge could put the runbook and SDK example in slots two
          and three. Build that ideal before taking the first three slots. Now the same seven earns only
          about point six seven four. The discount expresses how we value position. Examination by a real
          person needs separate evidence.
        caption_starts:
          - Among those three candidates
          - The best possible sum is seven
          - Across all five eligible pages
          - Now the same seven earns
        hold: 0.6
        visual_cues:
          - id: universe-local
            phrase: The best possible sum is seven
            targets:
