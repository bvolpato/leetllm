            phrase: That fits the twenty-millisecond limit
            targets:
              - offline-fixture-gate-construction
            color: cyan
            linger: 0.4
      - say: These checks evaluate the original unconstrained order. Substituting the source-constrained slate changes
          system NDCG to zero point eight five six and requires an explicit source-cap check. Reuse the same
          declared quality threshold and that candidate fails it. Do not keep a green receipt from the old
          slate after changing the function being evaluated.
        hold: 0.6
        visual_cues:
