    visual: A request and page identify the proposed result. Two events reuse an ID, and another names a
      request with no matching page.
    beats:
      - say: The server proposes three pages for request R one. Later, a click and a resolution both name the
          guide on that request. To learn where the developer saw the guide, record its position when the
          browser displays it.
        hold: 0.6
        visual_cues:
          - id: exposure-join-b1
            phrase: The server proposes three pages for request R one
            targets:
              - exposure-join-construction
            color: cyan
            linger: 0.5
      - say: Retain candidate IDs, feature and document versions, policy, ranker and allowed request context so the
          slate can be replayed. Join later events by request and document. The fixture separately checks
          required fields, joinable outcomes and unique event IDs. An orphan event can fail the join while a
          duplicate ID fails deduplication even when both copies join.
        hold: 0.6
        visual_cues:
          - id: exposure-join-b2
            phrase: Retain candidate IDs, feature and document versions, policy, ranker and allowed request context so the
              slate can be replayed.
            targets:
              - exposure-join-construction
            color: cyan
            linger: 0.5
          - id: event-orphan
            phrase: An orphan event can fail the join while a duplicate ID fails deduplication even when both copies join.
            targets:
              - exposure-join-construction
            color: cyan
            linger: 0.4
      - say: Keep impressions for pages that received no click, too. They tell us which pages had an
          opportunity to earn one. Check the event types and timestamps before using them for training.
          Limit access to search traces and expire them on schedule. Common query phrases can still be
          recognizable from their hashes.
        hold: 0.8
        visual_cues:
          - id: exposure-join-b3
            phrase: Keep impressions for pages that received no click
            targets:
              - exposure-join-construction
            color: cyan
            linger: 0.5
  - id: slate-policy
    title: Who gets the third slot?
    visual: Keep the top two platform results in place. Compare the third candidate's source to the used
      platform places before exchanging its graded contribution for the blog's.
    beats:
      - say: The scorer puts the API guide, the runbook and the SDK example on the first screen. Look at their
          source. All three come from platform. The portal wants a mix of sources and allows at most two
          from any one source in these three slots.
        hold: 0.6
        visual_cues:
          - id: slate-source
            phrase: All three come from platform
            targets:
              - slate-policy-construction
            color: yellow
            linger: 0.25
      - say: Leave the two higher scores alone. Both platform places are taken. The SDK example is next by score.
          Just below it sits a community blog. Which one can fill the last slot under this rule?
        hold: 2.1
        visual_cues:
          - id: slate-open
            phrase: Both platform places are taken
            targets:
              - slate-third
            color: yellow
            linger: 0.25
          - id: slate-choice
            phrase: Which one can fill the last slot
            targets:
              - slate-third
              - slate-reserve
            color: yellow
            linger: 0.25
      - say: The blog takes slot three. The SDK example stays eligible and keeps its score. The cap changes which
          page can sit beside the first two. We traded a grade two for a zero at rank three, so we lost one
          and a half units of discounted gain. System NDCG falls from one to about point eight five six.
        hold: 0.6
        visual_cues:
          - id: slate-exchange
            phrase: The blog takes slot three
            targets:
              - slate-third
            color: pink
            linger: 0.25
          - id: slate-cost
            phrase: we lost one and a half units of discounted gain
            targets:
              - slate-metric
            color: yellow
            linger: 0.25
      - say: Whether that trade serves developers is a product question. Measure it on the actual slate. Retrieval
          must also supply another source if the portal expects three results. Let’s take that alternative
          away.
        hold: 0.55
  - id: policy-underfill
    title: Suppose retrieval finds only platform pages
    visual: Replay the scored reserve under the same cap, then withdraw the community alternatives. The SDK
      stays behind the full platform gate and the third slot empties.
    beats:
      - say: First replay the full reserve in score order. The source check keeps a count for each source. A page
          can enter while its source has fewer than two places.
        hold: 0.5
        visual_cues:
          - id: policy-underfill-b1
            phrase: keeps a count for each source
            targets:
              - policy-underfill-construction
            color: yellow
            linger: 0.25
      - say: Take the guide. Take the runbook. That uses both platform places. Pass over the SDK example and take
          the community blog. Now suppose retrieval returned platform pages only. The guide, runbook and SDK
          scores stay the same. How many pages can this portal show?
        hold: 2
        visual_cues:
          - id: slate-capacity
            phrase: Take the guide. Take the runbook. That uses both platform places. Pass over the SDK example and
              take the community blog
            targets:
              - policy-underfill-construction
            color: cyan
            linger: 0.25
          - id: slate-withdraw
            phrase: Now suppose retrieval returned platform pages only
            targets:
              - policy-underfill-construction
            color: yellow
            linger: 0.25
      - say: Two. The third slot stays empty. The SDK example still belongs to platform. To fill that slot under
          this rule, retrieval would need another eligible source. Our greedy pass assumes unique pages,
          known sources and positive limits. More complicated, overlapping constraints may need a different
          algorithm.
        hold: 0.5
        visual_cues:
          - id: slate-two
            phrase: The third slot stays empty
            targets:
              - policy-underfill-construction
            color: yellow
            linger: 0.25
      - say: Test the source cap on the final result. This portal also requires current pages. An archive could
          choose to include older ones. Either product must still honor the developer’s current access at
          display time.
        hold: 0.6
  - id: offline-fixture-gate
    title: The final slate must pass the gate it actually uses
    visual: The final slate must pass the gate it actually uses.
    beats:
      - say: Start with the unconstrained list on the left. Retrieval found every useful page at five.
          The reranker at five and the displayed list at three both clear the NDCG threshold of point nine
          five. Check that blocked pages stayed out and that the events have their required fields,
          matching requests and pages, and unique IDs. In ten example timings, the nearest-rank
          ninety-fifth percentile is eighteen milliseconds. That fits the twenty-millisecond limit.
