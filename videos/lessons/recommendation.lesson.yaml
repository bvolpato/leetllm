            phrase: but neither belongs in this request’s eligible set
            targets:
              - eligibility-simulation-6
            color: blue
            linger: 0.6
      - say: Permission, tenancy, deletion, and any product freshness rule define what a person may receive. Apply
          those rules before a learned relevance score can influence the displayed slate.
