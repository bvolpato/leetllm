          serving latency under load and specify which requests and time window count toward the guardrail.
        hold: 0.8
        visual_cues:
          - id: offline-fixture-gate-b3
            phrase: The passing receipt belongs to the original list
            targets:
              - offline-fixture-gate-construction
            color: cyan
            linger: 0.5
          - id: offline-scope
            phrase: Its hash identifies the recorded JSON
            targets:
              - offline-fixture-gate-construction
            color: cyan
            linger: 0.4
  - id: developer-experiment
    title: Assignment and aggregation define the experimental unit
    visual: Assignment and aggregation define the experimental unit.
    beats:
      - say: The proposed experiment assigns each developer once at the first eligible request and keeps that
          assignment stable. Repeated sessions from one developer are not independent experimental units. Its
          primary metric first computes each developer’s resolved sessions divided by all their sessions, then
          averages those developer ratios. Analyze at that unit or account for clustering in uncertainty.
        hold: 0.6
        visual_cues:
          - id: developer-experiment-b1
            phrase: The proposed experiment assigns each developer once at the first eligible request and keeps that
              assignment stable.
            targets:
              - developer-experiment-construction
            color: cyan
            linger: 0.5
      - say: For a supplied aggregation example, one developer resolves one of one sessions and another resolves one
          of nine. The equal-developer mean is five ninths, while pooled sessions give two tenths. They answer
          different questions. Declare enrollment, attribution window, missing-event and timeout handling,
          metric, sample size, duration, uncertainty method and decision rule before exposure.
        hold: 0.6
        visual_cues:
          - id: developer-experiment-b2
            phrase: For a supplied aggregation example, one developer resolves one of one sessions and another resolves
              one of nine.
            targets:
              - developer-experiment-construction
            color: cyan
            linger: 0.5
          - id: developer-ratios
            phrase: The equal-developer mean is five ninths, while pooled sessions give two tenths.
            targets:
              - developer-experiment-construction
            color: cyan
            linger: 0.4
      - say: This example waits for both fourteen days and five thousand developers per group before comparing
          resolution rates once. For your own experiment, use a power calculation to choose the sample size
          for the effect you need to detect. Monitor blocked impressions and harmful latency from day one
          so you can stop early. Read negative feedback alongside engagement.
        hold: 0.8
        visual_cues:
          - id: developer-experiment-b3
            phrase: This example waits for both fourteen days and five thousand developers per group
            targets:
              - developer-experiment-construction
            color: cyan
            linger: 0.5
  - id: wrap
    title: What would show the guide helped?
    visual: Follow the guide from a proposed first slot to a matching browser impression and a later
      resolution. Keep the request and page fixed across the records.
    beats:
      - say: Suppose our portal proposes the guide first for this retry search. That tells us what the server
          sent. Which observation would tell us the developer actually had the guide on screen?
        hold: 1.6
        visual_cues:
          - id: wrap-proposal
            phrase: what the server sent
            targets:
              - wrap-proposal-row
            color: cyan
            linger: 0.25
      - say: A browser impression can record the request, the page and its displayed position. A later resolution
          event can join to that impression on request and page. Keep the versions and snapshots needed to
          replay the proposal. Protect query and user traces and limit how long you retain them.
        hold: 0.55
        visual_cues:
          - id: wrap-impression
            phrase: A browser impression can record the request, the page and its displayed position
            targets:
              - wrap-impression-row
            color: blue
            linger: 0.25
          - id: wrap-resolution
            phrase: A later resolution event can join to that impression on request and page
            targets:
              - wrap-resolution-row
            color: green
            linger: 0.25
      - say: That join tells us which exposure preceded the resolution. To learn whether changing the ranker
          helps, compare developers randomly assigned to stable groups. Declare the outcome and guardrails
          in advance. Check task resolution, latency, bad-result reports and blocked impressions. Now take
          the same search back to the moment before display.
        hold: 0.55
