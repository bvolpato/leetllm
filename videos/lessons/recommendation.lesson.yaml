  - id: reciprocal-precision
    title: Count the first target and every relevant prefix separately
    visual: Count the first target and every relevant prefix separately.
    beats:
      - say: Reciprocal rank gives one divided by the first target’s rank, or zero if that target never appears in the
          evaluated list. The lab calls grade three a target. MRR averages reciprocal rank over queries. Both
          original orders put the guide first, so their reciprocal rank is one even though useful guides
          remain separated by irrelevant pages.
        hold: 0.6
        visual_cues:
          - id: reciprocal-precision-b1
            phrase: Reciprocal rank gives one divided by the first target’s rank, or zero if that target never appears in
              the evaluated list.
            targets:
              - reciprocal-precision-construction
            color: cyan
            linger: 0.5
          - id: rr-result
            phrase: Both original orders put the guide first, so their reciprocal rank is one
            targets:
              - reciprocal-precision-construction
            color: cyan
            linger: 0.4
      - say: Average precision instead visits every result at or above the declared relevance threshold. At each
          relevant position, add the fraction of results seen so far that are relevant. In the retrieval
          order, those contributions are one, two fourths and three fifths. Their sum divided by three gives
          zero point seven. The ideal order gives one. MAP averages each query’s AP, with declared query
          weights.
        hold: 0.6
        visual_cues:
          - id: reciprocal-precision-b2
            phrase: Average precision instead visits every result at or above the declared relevance threshold.
            targets:
              - reciprocal-precision-construction
            color: cyan
            linger: 0.5
          - id: ap-terms
            phrase: those contributions are one, two fourths and three fifths.
            targets:
              - reciprocal-precision-construction
            color: cyan
            linger: 0.4
          - id: ap-result
            phrase: Their sum divided by three gives zero point seven.
            targets:
              - reciprocal-precision-construction
            color: cyan
            linger: 0.4
      - say: At a cutoff, declare the denominator. This lab divides by the smaller of relevant-count R and cutoff k.
          With two relevant documents and one perfect top result, that capped AP at one is one. Dividing by
          full R gives one half instead. A system denominator must count eligible judged relevant items,
          including missing ones; the existing supplied-list helper only knows its survivors. Neither
          convention turns missing evidence into a recovered document.
        hold: 0.8
        visual_cues:
          - id: reciprocal-precision-b3
            phrase: At a cutoff, declare the denominator.
            targets:
              - reciprocal-precision-construction
            color: cyan
            linger: 0.5
          - id: ap-denominator
            phrase: Dividing by full R gives one half instead.
            targets:
              - reciprocal-precision-construction
            color: cyan
            linger: 0.4
