  - id: timing
    title: When can we stop the warm-call timer?
    visual: The host returns at one millisecond on a supplied warm trace. A second clock runs from the same start
      until the result leaves are ready at twelve milliseconds.
    beats:
      - say: Suppose the inputs are already on the accelerator and the compiled call is warm. Both clocks start when
          Python issues the call. In this example Python gets a result handle after one millisecond. The device
          still has work to do. Which event should stop the timer for completed work?
        hold: 2
        visual_cues:
          - id: timer-return
            phrase: Python gets a result handle after one millisecond
