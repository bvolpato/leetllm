  - id: measurement-contract
    title: What goes inside the timer?
    visual: Trace a CPU benchmark from a preplaced float32 input of shape [512, 64] to a result of shape [64, 64]. Compare the start and stop points on cold and warm calls.
    beats:
      - say: Put the input on the CPU before starting the clock. This matrix has five hundred twelve rows and sixty-four columns. The calculation returns a square matrix with sixty-four rows. Wait for the result on both the cold and warm calls. Check that their entries are finite and agree.
        hold: 0.75
        visual_cues:
          - id: jx-measurement-contract-b0
            phrase: Wait for the result on both the cold and warm calls
            targets: [jx-measurement-contract-mechanism]
      - say: A cold call can include tracing and compilation. A persistent cache can shorten that part. For warm latency, start at dispatch and stop when every output is ready. JAX's top-level block until ready can wait on all the arrays in a tuple or dictionary. For throughput, queue several independent calls, then wait for all of them and count how many finished per second.
        hold: 0.75
        caption_starts:
          - For warm latency
          - For throughput
        visual_cues:
          - id: jx-measurement-contract-b1
            phrase: start at dispatch and stop when every output is ready
            targets: [jx-measurement-contract-mechanism]
      - say: To compare this call across frameworks, give both the same shape and dtype on the same device. Check the dtype in particular. A default NumPy float array can use sixty-four bits where JAX uses thirty-two. To include input transfer, start both clocks before placement. Apply the same rule to loading data, running evaluation or writing checkpoints if those are part of the workload.
        hold: 0.75
        caption_starts:
          - Check the dtype
          - To include input transfer
        visual_cues:
          - id: jx-measurement-contract-b2
            phrase: give both the same shape and dtype on the same device
            targets: [jx-measurement-contract-mechanism]
