scenes:
  - id: intro
    title: What will the training log print?
    visual: Two zero-loss padding tokens drop beside two real errors. Five cyan squares stay in place as the divisor changes from two to four and back.
    beats:
      - say: Two zeros slide into the last batch. The real predictions miss by two and one. Squared, those errors are four and one. Their mean loss is two point five.
        hold: 0.5
        caption_starts:
          - The real predictions
          - Their mean loss
        visual_cues:
          - id: intro-pad
            phrase: Two zeros slide into the last batch
            targets: [padding-2, padding-3]
          - id: intro-square
            phrase: Squared, those errors are four and one
            targets: [example-0, example-1]
          - id: intro-mean
            phrase: Their mean loss is two point five
            targets: [real-mean]
      - say: Padding gives the compiled JAX step the four rows it expects. The log averages all four slots. What loss will it print?
        hold: 2.2
        caption_starts:
          - What loss will it print
        visual_cues:
          - id: intro-all
            phrase: averages all four slots
            targets: [counted-rows]
      - say: One point two five. The two padding rows added zero to the sum, but the divisor doubled. Count just the two real examples and the loss returns to two point five. That divisor also scales the gradient sent to the optimizer.
        hold: 1
        caption_starts:
          - The two padding rows
          - Count just the two real examples
          - and the loss returns
          - That divisor also scales
        visual_cues:
          - id: intro-report
            phrase: One point two five
            targets: [logged-mean]
          - id: intro-divisor
            phrase: Count just the two real examples
            targets: [counted-rows]
          - id: intro-restore
            phrase: the loss returns to two point five
            targets: [logged-mean]
  - id: program-contract
    title: Follow one call through the training loop
    visual: Follow the parameter, velocity and random-key arguments through one call. Keep its returned state for
      the following step. The loss is recorded against the inputs.
    beats:
      - say: Find the step that consumes that batch in the research code. It might sit inside Flax, Equinox or Optax. If
          you know a PyTorch training loop, look for the pieces the model and optimizer usually hold. Here the
          caller supplies the weights, the optimizer's momentum and a key for drawing random numbers.
        hold: 0.5
        visual_cues:
          - id: program-call
            phrase: the weights, the optimizer's momentum and a key
            targets:
              - program-state
            linger: 0.12
      - say: Follow the return values into the next call. Those three inputs each get a successor. The loss goes to the
          log. When changing state travels through arguments and returns, you can replay this step. Write the
          array operations with JAX NumPy. JAX can take a derivative of that function, map it over examples or
          compile it. The article's ordinary-array examples use one CPU. JAX also supports controlled mutation
          through a separate interface called Ref.
        hold: 0.8
        visual_cues:
          - id: program-return
            phrase: Follow the return values into the next call
            targets:
              - program-state
            linger: 0.12
  - id: regression-oracle
    title: Two checks on the same four examples
    visual: The two remaining examples complete the batch. With zero parameters the table gives the reference loss.
      The targets remain fixed as a known solution replaces the weights and eliminates each error.
    beats:
      - say: Here is a full batch. The first two columns of numbers pair each input with its target. Two more examples
          join the ones from the opening. At zero weights and bias, all four predictions are zero. Their squared
          errors add to fifteen. Divide by four, and the reference loss is three point seven five.
        hold: 0.65
        visual_cues:
          - id: oracle-loss
            phrase: the reference loss is three point seven five
            targets:
              - oracle-mean
            linger: 0.12
            caption_boundary: true
      - say: Try weights two and minus one. Double the first feature and subtract the second. On the bottom row that
          gives four minus one, exactly the target of three. Work up the other rows and each prediction lands on
          its target. The loss is zero. A loss function has to pass both checks before its training curve tells us
          much.
        hold: 0.9
        visual_cues:
          - id: oracle-weights
            phrase: Try weights two and minus one
            targets:
              - oracle-table
            linger: 0.12
          - id: oracle-predictions
            phrase: Double the first feature and subtract the second
            targets:
              - oracle-table
            linger: 0.12
          - id: oracle-exact
            phrase: The loss is zero
            targets:
              - oracle-mean
            linger: 0.12
            caption_boundary: true
  - id: gradient
    title: Which row pulls hardest on the first weight?
    visual: Each first-weight derivative shares a signed scale. Build the longest contribution from the bottom row,
      then average. Pair all three gradient leaves with the first SGD update.
    beats:
      - say: Reset the parameters to zero. Look at the bottom row. The prediction misses by minus three, and the first
          feature is two. Squaring the error gives us a derivative of twice the residual times that feature. This
          row contributes minus twelve. The second row has no first feature, so it contributes zero. Average all
          four contributions and the first weight's gradient is minus four point five.
        hold: 0.8
        visual_cues:
          - id: gradient-row
            phrase: This row contributes minus twelve
            targets:
              - gradient-rows
            linger: 0.12
            caption_boundary: true
          - id: gradient-mean
            phrase: minus four point five
            targets:
              - gradient-result
            linger: 0.12
            caption_boundary: true
      - say: The same calculation gives a gradient for the other weight and the bias. Each has its own line. Subtract
          five hundredths of each gradient from its parameter. The first weight moves up to point two two five,
          the second to point zero seven five, and the bias to point one two five. JAX's value and grad computes
          the loss and the whole gradient tree in one call.
        hold: 0.9
        visual_cues:
          - id: gradient-step
            phrase: and the bias to point one two five
            targets:
              - gradient-update
            linger: 0.12
            caption_boundary: true
  - id: transform-order
    title: One gradient per batch or one per example?
    visual: Compare a scalar loss with a length-one vector. Keep the example axis when mapping grad. Follow two equal and opposite scalar gradients to see what averaging discards.
    beats:
      - say: Both boxes contain three point seven five. On the left, the loss is a scalar. Grad accepts that empty shape. On the right, the loss is a vector with one entry. Grad rejects it because it expects a scalar output here. Value and grad gives you both the scalar loss and the gradient tree in one call.
        hold: 0.75
        visual_cues:
          - id: jx-transform-order-b0
            phrase: Both boxes contain three point seven five
            targets: [jx-transform-order-mechanism]
          - id: transform-scalar
            phrase: Grad accepts that empty shape
            targets: [jx-transform-order-mechanism]
      - say: To get a gradient for each example, differentiate the loss for one row. Then use vmap to apply that function to all four rows. The parameters stay the same while the features and target change from row to row. That's what the three entries in the axes setting mean. The weight gradients have four rows and two columns. Each row also has its own bias gradient.
        hold: 0.75
        visual_cues:
          - id: jx-transform-order-b1
            phrase: Then use vmap
            targets: [jx-transform-order-mechanism]
          - id: transform-mapped-shape
            phrase: four rows and two columns
            targets: [jx-transform-order-mechanism]
      - say: Differentiate the mean loss and you get two weight gradients and one bias gradient for the whole batch. Averaging those four rows gives the same update for these independent examples. Now look at two examples with just one weight. One gradient points left by two. The other points right by two. Their mean is zero. For one weight, the gradient norm is its absolute value. Each arrow has length two, so their mean norm is two. To clip gradients per example, keep the rows until you've measured each one.
        hold: 1
        caption_starts:
          - Now look at two examples
          - Their mean is zero
          - Each arrow has length two
          - so their mean norm is two
        visual_cues:
          - id: transform-aggregate
            phrase: two weight gradients and one bias gradient
            targets: [jx-transform-order-mechanism]
          - id: transform-left
            phrase: One gradient points left by two
            targets: [jx-transform-order-mechanism]
          - id: transform-right
            phrase: The other points right by two
            targets: [jx-transform-order-mechanism]
          - id: transform-cancel
            phrase: Their mean is zero
            targets: [jx-transform-order-mechanism]
          - id: transform-norm
            phrase: their mean norm is two
            targets: [jx-transform-order-mechanism]
  - id: tree
    title: Match named paths and leaf shapes
    visual: A parameter tree and gradient tree align weight and bias paths. A renamed key, then a scalar broadcast
      mismatch, are rejected on separate states.
    beats:
      - say: Model state usually lives in a nested collection of arrays. JAX calls that structure a pytree.
          Differentiating with respect to the parameter tree returns corresponding gradient leaves. An update
          must associate the weight gradient with the weight path and the bias gradient with the bias path.
        hold: 0.8
        visual_cues:
          - id: tree-b1-1
            phrase: weight gradient with the weight path
            targets:
              - weight-path
            linger: 0.45
          - id: tree-b1-2
            phrase: bias gradient with the bias path
            targets:
              - bias-path
            linger: 0.45
      - say: Now change one gradient path, then change its shape. The first case breaks the tree schema. The second
          can silently broadcast during array arithmetic even with matching keys. Check exact leaf shapes as
          well as structure. Leaf count alone loses the identity that makes an update meaningful.
        hold: 0.8
        visual_cues:
          - id: tree-b2-1
            phrase: change one gradient path
            targets:
              - gradient-path
            linger: 0.45
          - id: tree-b2-2
            phrase: exact leaf shapes
            targets:
              - schema-check
            linger: 0.45
  - id: dynamic-static
    title: Preserve semantic paths and bounded metadata
    visual: Keep the parameter paths fixed while values change. Transpose a square weight matrix and check how the predictions change even though the shape stays the same.
    beats:
      - say: Pytree structure includes container nesting and dictionary keys. Registered custom classes can be nodes;
          an unsupported object may become one opaque leaf. Inspect the tree definition, named paths, leaf
          shapes and dtypes at a checkpoint boundary. Equal leaf count or equal element count does not
          establish semantic compatibility.
        hold: 0.75
        visual_cues:
          - id: jx-dynamic-static-b0
            phrase: Pytree structure includes container nesting and dictionary keys. Registered custom classes can be
              nodes; an unsupported object may become one opaque leaf. Inspect the tree definition, named
              paths, leaf shapes and dtypes at a checkpoint boundary. Equal leaf count or equal element count
              does not establish semantic compatibility.
            targets:
              - jx-dynamic-static-mechanism
            color: cyan
            linger: 0.35
      - say: Numerical array leaves can change value under one compiled contract. Small activation choices or
          architecture settings can instead be static metadata. Changing those settings can require new
          variants. Marking every changing value static creates a variant problem rather than solving it. A
          checkpoint port must also preserve axis meaning; a square projection transpose can retain shape and
          still alter predictions.
        hold: 0.75
        visual_cues:
          - id: jx-dynamic-static-b1
            phrase: Numerical array leaves can change value under one compiled contract. Small activation choices or
              architecture settings can instead be static metadata. Changing those settings can require new
              variants. Marking every changing value static creates a variant problem rather than solving it.
              A checkpoint port must also preserve axis meaning; a square projection transpose can retain
              shape and still alter predictions.
            targets:
              - jx-dynamic-static-mechanism
            color: cyan
            linger: 0.35
          - id: static-transpose
            phrase: a square projection transpose can retain shape and still alter predictions
            targets:
              - jx-dynamic-static-mechanism
            color: cyan
            linger: 0.35
  - id: values
    title: Keep the new value returned by an update
    visual: The old array remains visible while an updated array changes its middle entry. A retained binding
      points to the new value on the second beat.
    beats:
      - say: "Ordinary JAX arrays are immutable values. An indexed set expression returns an updated array while
          preserving the original value. Watch the middle entry: the new row changes, and the old row stays
          available. This makes aliasing at a function boundary easier to reason about."
        hold: 0.8
        visual_cues:
          - id: values-b1-1
            phrase: preserving the original value
            targets:
              - original-array
            linger: 0.45
          - id: values-b1-2
            phrase: middle entry
            targets:
              - returned-array
            linger: 0.45
      - say: The caller must keep the returned array or tree. Computing an indexed update and discarding its result
          leaves the old binding unchanged. Compiled execution can reuse buffers while preserving this value
          contract. If you donate an input buffer explicitly, follow the separate rule that the donated input
          must no longer be used.
        hold: 0.8
        visual_cues:
          - id: values-b2-1
            phrase: keep the returned array or tree
            targets:
              - returned-array
            linger: 0.45
  - id: indexing-bounds
    title: What does index nine reach?
    visual: Compare the middle entry in the original and returned arrays. Try an out-of-range set and get against the same original three entries.
    beats:
      - say: The middle entry is twenty in the original array and ninety-nine in the array returned by the indexed update. Direct assignment to the original raises a TypeError. Now try index nine on the original. It has just three entries. What happens if we write there? What if we read there?
        hold: 1.8
        caption_starts:
          - Now try index nine
        visual_cues:
          - id: jx-indexing-bounds-b0
            phrase: The middle entry is twenty
            targets: [jx-indexing-bounds-mechanism]
      - say: With the default indexing mode, JAX drops the out-of-range write. The returned array still reads ten, twenty, thirty. The read clips the index to the last entry and returns thirty. If an invalid index means your data is wrong, check it before either operation.
        hold: 0.9
        caption_starts:
          - JAX drops the out-of-range write
          - The read clips the index
          - and returns thirty
        visual_cues:
          - id: jx-indexing-bounds-b1
            phrase: With the default indexing mode
            targets: [jx-indexing-bounds-mechanism]
          - id: index-drop
            phrase: JAX drops the out-of-range write
            targets: [jx-indexing-bounds-mechanism]
          - id: index-clip
            phrase: and returns thirty
            targets: [jx-indexing-bounds-mechanism]
  - id: keys
    title: Two matching dropout decisions
    visual: Keep the two False outputs pinned. Expose their key identities, then rewire only the second draw to the
      other child of the same seed-seven Threefry split. Its new one-bit output is also False.
    beats:
      - say: Two calls each draw a single dropout bit, with a fifty percent chance of keeping it. Both say false. From
          those two bits alone, can you tell whether the programmer reused a key?
        hold: 2.2
        caption_starts:
          - From those two bits alone
        visual_cues:
          - id: keys-question
            phrase: From those two bits alone
            targets:
              - key-outputs
            linger: 0.12
      - say: Follow the two inputs back. Both calls received child zero from the same split. Sampling leaves the key
          unchanged. The same key, operation and arguments reproduce the bit exactly.
        hold: 0.9
        caption_starts:
          - Both calls received child zero
        visual_cues:
          - id: keys-open
            phrase: Follow the two inputs back
            targets:
              - key-routes
            linger: 0.12
      - say: Keep the first call fixed. Give the second call child one. Its key words have changed. Does the bit have to
          change too?
        hold: 2
        visual_cues:
          - id: keys-fork
            phrase: Give the second call child one
            targets:
              - key-routes
            linger: 0.12
      - say: False again. This time separate keys happened to give the same bit. Inspect which child each call received.
          When the next training step also needs randomness, reserve a continuation child and return it with the
          optimizer state.
        hold: 0.9
        visual_cues:
          - id: keys-second-mask
            phrase: False again
            targets:
              - key-outputs
            linger: 0.12
            caption_boundary: true
  - id: key-replay
    title: Preserve key derivation as well as the seed
    visual: Follow seed 7 through a Threefry split and replay a normal draw with the same key. Compare three scalar draws with one vector draw, then count the ways two independent bits can agree.
    beats:
      - say: Typed keys carry their implementation in the dtype. Our pinned Threefry key is a scalar key-fry value
          wrapping two unsigned thirty-two-bit words. Legacy keys do not carry that implementation tag.
          Checkpoint conversion must retain the implementation together with raw key data; other
          implementations can use another layout.
        hold: 0.75
        visual_cues:
          - id: jx-key-replay-b0
            phrase: Typed keys carry their implementation in the dtype. Our pinned Threefry key is a scalar key-fry value
              wrapping two unsigned thirty-two-bit words. Legacy keys do not carry that implementation tag.
              Checkpoint conversion must retain the implementation together with raw key data; other
              implementations can use another layout.
            targets:
              - jx-key-replay-mechanism
            color: cyan
            linger: 0.35
          - id: key-words
            phrase: two unsigned thirty-two-bit words
            targets:
              - jx-key-replay-mechanism
            color: cyan
            linger: 0.35
      - say: The seed-seven fixture splits three children, retains one and uses two for normal samples. Reusing A
          repeats its four values. A separate comparison draws three scalars from split keys versus one vector
          from the parent. Their shown sequences differ. JAX does not promise sequential equivalence across
          those two derivations, so preserving only the seed cannot preserve an altered sampler.
        hold: 0.75
        visual_cues:
          - id: jx-key-replay-b1
            phrase: The seed-seven fixture splits three children, retains one and uses two for normal samples. Reusing A
              repeats its four values. A separate comparison draws three scalars from split keys versus one
              vector from the parent. Their shown sequences differ. JAX does not promise sequential
              equivalence across those two derivations, so preserving only the seed cannot preserve an altered
              sampler.
            targets:
              - jx-key-replay-mechanism
            color: cyan
            linger: 0.35
          - id: key-repeat
            phrase: Reusing A repeats its four values
            targets:
              - jx-key-replay-mechanism
            color: cyan
            linger: 0.35
          - id: key-sequences
            phrase: Their shown sequences differ
            targets:
              - jx-key-replay-mechanism
            color: cyan
            linger: 0.35
      - say: Think back to those two False bits from different keys. Each column is one possible pair of independent fair draws. Count the matching columns. Both false is a match, and so is both true. Each of those pairs has probability one quarter. Together they give one half. For a keep probability p, add p squared for two keeps and the square of one minus p for two drops.
        hold: 1.2
        visual_cues:
          - id: jx-key-replay-b2
            phrase: Each column is one possible pair of independent fair draws
            targets: [jx-key-replay-mechanism]
          - id: key-equal
            phrase: Both false is a match, and so is both true
            targets: [jx-key-replay-mechanism]
            caption_boundary: true
          - id: key-agreement
            phrase: Together they give one half
            targets: [jx-key-replay-mechanism]
            caption_boundary: true
  - id: key-ownership
    title: Give each random operation an owned input
    visual: Give dropout and augmentation different children of one step key. Compare that assignment with two helpers splitting the same parent. Show how global replica identities distinguish two local device zeros.
    beats:
      - say: If dropout and augmentation need independent randomness, split at the boundary that owns both operations.
          Passing the same parent to two helpers that each split it independently can duplicate their child
          sequence. Retain a continuation child for the next step, and consume each operation child once
          unless deliberate replay is the experiment.
        hold: 0.75
        visual_cues:
          - id: jx-key-ownership-b0
            phrase: If dropout and augmentation need independent randomness, split at the boundary that owns both
              operations. Passing the same parent to two helpers that each split it independently can
              duplicate their child sequence. Retain a continuation child for the next step, and consume each
              operation child once unless deliberate replay is the experiment.
            targets:
              - jx-key-ownership-mechanism
            color: cyan
            linger: 0.35
          - id: key-duplicate
            phrase: can duplicate their child sequence
            targets:
              - jx-key-ownership-mechanism
            color: cyan
            linger: 0.35
          - id: key-continue
            phrase: Retain a continuation child for the next step
            targets:
              - jx-key-ownership-mechanism
            color: cyan
            linger: 0.35
      - say: "Fold-in combines an integer identity with a key. Stable globally unique replica and step identities can
          define a reproducible mapping; local device indices alone can repeat across processes. Alternative
          random implementations also need validation: current experimental R B G batching can generate a
          mapped batch from its first key. The experimental stateful Ref-backed wrapper has separate
          transformation limits. We keep explicit keys throughout these executed fixtures."
        hold: 0.75
        visual_cues:
          - id: jx-key-ownership-b1
            phrase: "Fold-in combines an integer identity with a key. Stable globally unique replica and step identities
              can define a reproducible mapping; local device indices alone can repeat across processes.
              Alternative random implementations also need validation: current experimental R B G batching can
              generate a mapped batch from its first key. The experimental stateful Ref-backed wrapper has
              separate transformation limits. We keep explicit keys throughout these executed fixtures."
            targets:
              - jx-key-ownership-mechanism
            color: cyan
            linger: 0.35
          - id: key-global
            phrase: Stable globally unique replica and step identities
            targets:
              - jx-key-ownership-mechanism
            color: cyan
            linger: 0.35
  - id: state
    title: A training step returns the next state explicitly
    visual: Parameter, momentum and key packets enter a central numerical transition and return as new packets. A
      chronological computed SGD loss trace accompanies subsequent updates.
    beats:
      - say: A pure numerical boundary makes changing state visible in its arguments and returns. Parameters,
          optimizer state, and a key enter the step with a read-only batch. Differentiation produces
          gradients, the optimizer produces an update, and the caller keeps every returned piece needed for
          the next call.
        hold: 0.8
        visual_cues:
          - id: state-b1-1
            phrase: Parameters, optimizer state, and a key enter the step
            targets:
              - initial-state
            linger: 0.45
          - id: state-b1-2
            phrase: caller keeps every returned piece
            targets:
              - returned-state
            linger: 0.45
      - say: The regression trace now applies the actual gradient-descent recurrence to our four rows. Its loss is
          recomputed after each displayed update. Adam would add moment arrays and a step counter. Stateful
          layers may add statistics too. Preserve these named values when modifying or resuming an existing
          research program.
        hold: 0.8
        motion_check:
          region:
            - 230
            - 330
            - 1150
            - 500
          minimumChangedFraction: 0.002
        visual_cues:
          - id: state-b2-1
            phrase: actual gradient-descent recurrence
            targets:
              - current-state
            linger: 0.45
          - id: state-b2-2
            phrase: loss is recomputed after each displayed update
            targets:
              - fresh-loss
            linger: 0.45
  - id: state-replay
    title: Carry the actual momentum and key into the next call
    visual: Apply the four-by-two dropout mask to the original features and divide the kept values by 0.75. Follow the first weight, its velocity, and the continuation key into the next call.
    beats:
      - say: Add the article’s actual momentum and input-dropout state to the same regression. Keep a feature with
          probability point seven five and divide kept values by point seven five. The executed first mask
          keeps both features in the middle two rows and none in the fourth. The first row keeps its first
          feature. At zero parameters, pre-update loss is still three point seven five.
        hold: 0.75
        visual_cues:
          - id: jx-state-replay-b0
            phrase: Add the article’s actual momentum and input-dropout state to the same regression. Keep a feature with
              probability point seven five and divide kept values by point seven five. The executed first mask
              keeps both features in the middle two rows and none in the fourth. The first row keeps its first
              feature. At zero parameters, pre-update loss is still three point seven five.
            targets:
              - jx-state-replay-mechanism
            color: cyan
            linger: 0.35
          - id: state-mask
