  - id: search-completion
    title: Keep finished answers separate from active prefixes
    visual: Expand the actual scripted frontier into active and completed pools, apply the final-answer parser,
      and spend a finite proposal budget without promoting a prefix.
    beats:
      - say: Keep two pools as you search. One holds unfinished paths you can extend. The other holds answers that
          have reached the final marker. A proposed step can be a whole sentence. Score each proposal,
          move finished answers to the completed pool, and spend the next round on the strongest
          unfinished paths.
        visual_cues:
          - id: tt-search-completion-0
            phrase: Keep two pools as you search
            targets:
              - tt-search-completion-0
            color: cyan
            linger: 0.4
          - id: tt-pool-transfer
            phrase: move finished answers to the completed pool
            targets:
              - tt-pool-transfer
            color: cyan
            linger: 0
        hold: 0.7
      - say: Take three rounds. Each time, keep one unfinished path and propose two ways to extend it. At the
          deadline, the unfinished path scores point nine. A finished answer scores point eight. Return
          the finished answer. If the completed pool is empty, mark the best partial path incomplete so
          the caller can retry or escalate.
        visual_cues:
          - id: tt-search-completion-1
            phrase: Take three rounds
            targets:
              - tt-search-completion-1
            color: yellow
            linger: 0.4
          - id: tt-completed-return
            phrase: Return the finished answer
            targets:
              - tt-completed-return
            color: green
            linger: 0
        hold: 0.7
        caption_starts:
          - A finished answer scores
          - Return the finished answer
      - say: The parser strips whitespace, handles case and requires nonempty text after its final marker. A guess
          can meet all three conditions. Run the task’s checker on the finished answer. When ranking
          paths, reject malformed or non-finite scores.
        visual_cues:
          - id: tt-search-completion-2
            phrase: The parser strips whitespace, handles case and requires nonempty text after its final marker.
            targets:
              - tt-search-completion-2
            color: green
            linger: 0.4
        hold: 0.7
  - id: search-bound
    title: Can the unfinished path still win?
    visual: Run one possible extension against a fixed completed score under two different path-scoring rules.
      Then count proposals over three rounds.
    beats:
      - say: Try a different frontier. One answer is finished. Its score is point eight. The only unfinished path
          stands at point seven. Our first rule keeps the lowest step score on the path. Imagine its next
          step scores point nine. Could that lift the path above the finished answer?
        hold: 2.2
        visual_cues:
          - id: bound-inputs
            phrase: The only unfinished path stands at point seven
            targets:
              - minimum
            color: blue
            linger: 0.18
          - id: offer-step
            phrase: next step scores point nine
            targets:
              - next-score
            color: yellow
            linger: 0.18
      - say: The lower score stays. Even a perfect next step would leave the minimum at point seven. We can stop
          this retained search. Replay the very same extension with a rule that keeps just the latest
          step. Now the path reaches point nine. With that rule the path was worth extending. The bound
          covers the paths still in play. Check the finished answer separately.
        hold: 1
        visual_cues:
          - id: tt-path-bound
            phrase: The lower score stays
            targets:
              - minimum
            color: green
            linger: 0.18
          - id: replay-latest
            phrase: keeps just the latest step
            targets:
              - latest
            color: yellow
            linger: 0.18
          - id: latest-rise
            phrase: the path reaches point nine
            targets:
              - latest
            color: cyan
            linger: 0.18
        caption_starts:
          - Now the path reaches point nine
      - say: Suppose we keep one unfinished path at a time and propose two next steps per round. Over three full
          rounds, that buys at most six proposals and six scores. In general multiply beam width by proposals
          per path by rounds. Finishing early can save proposals. A proposal could be one token or a whole
          sentence, so six scores alone won’t tell you the token bill or the latency.
        hold: 0.8
        visual_cues:
          - id: search-rounds
            phrase: two next steps per round
            targets:
              - proposals
            color: blue
            linger: 0.18
          - id: tt-proposal-ceiling
            phrase: at most six proposals and six scores
            targets:
              - proposal-total
            color: green
            linger: 0.18
  - id: pruning
    title: Check a branch before funding its remaining steps
    visual: Four eight-step paths contrast full outcome scoring with correctly timed process pruning, counting
      generated steps and scoring calls separately.
    beats:
      - say: A process scorer can inspect intermediate steps. If it reliably detects a bad path early, the controller
          can stop funding that branch before its final answer. An outcome scorer waits for a completed
          answer. The two approaches therefore see evidence at different moments in the computation.
        visual_cues:
          - id: outcome-completion
            phrase: outcome scorer waits for a completed answer
            targets:
              - branch-steps
            color: blue
          - id: intermediate-evidence
            phrase: different moments in the computation
            targets:
              - branch-steps
            color: yellow
        hold: 0.6
      - say: These four branches would each take eight steps. Our supplied process decisions prune three at the marked
          positions, leaving fourteen generated steps instead of thirty-two. Follow which work disappears. The
          saving depends on those pruning decisions preserving the path that can actually finish correctly.
        visual_cues:
          - id: process-pruning
            phrase: prune three at the marked positions
            targets:
              - branch-steps
            color: blue
          - id: saved-steps
            phrase: fourteen generated steps instead of thirty-two
            targets:
              - pruning-readout-3
            color: green
        hold: 0.65
        motion_check:
          region:
            - 420
            - 340
            - 1200
            - 520
          minimumChangedFraction: 0.002
      - say: Step checks also cost work. This fixture makes fourteen process-scoring calls, compared with four
          outcome-scoring calls. Generated steps and scorer calls are different units, and their lengths can
          vary. Measure total compute and selected correctness before concluding that early pruning improves
          the complete system.
        visual_cues:
          - id: scorer-cost
            phrase: fourteen process-scoring calls
            targets:
              - pruning-process-checks-14-outcome-checks-4
            color: yellow
          - id: different-work-units
            phrase: Generated steps and scorer calls are different units
            targets:
              - pruning-readout-3
            color: blue
        hold: 0.7
  - id: train-time-axis
    title: Separate weight learning from request-time work
    visual: Construct a training parameter-by-token rectangle, freeze its resulting weight artifact, then branch
      the same request through different inference policies.
    beats:
      - say: Training compute changes weights. For a dense transformer, a common rough training estimate is six times
