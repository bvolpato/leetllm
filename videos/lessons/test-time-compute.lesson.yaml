  - id: coverage
    title: What do four attempts buy?
    visual: Draw the probability of at least one hit and split that area into returned and lost answers. Charge
      all generated tokens on the same row.
    beats:
      - say: Keep one prompt fixed. Give each independent attempt a one-in-four chance of hitting the answer. One
          attempt misses three quarters of the time. For four attempts to miss, all four misses have to
          happen. Multiply four copies of three quarters. What share is left for pools with at least one hit?
        hold: 2
        visual_cues:
          - id: independent-attempts
            phrase: One attempt misses three quarters of the time
            targets:
              - row-one
            color: blue
            linger: 0.18
          - id: failure-product
            phrase: Multiply four copies of three quarters
            targets:
              - product
            color: yellow
            linger: 0.18
      - say: About sixty-eight percent. That is candidate coverage. At eight hundred tokens per attempt, those four
          tries cost thirty-two hundred generated tokens. Move to sixteen attempts. Coverage approaches
          ninety-nine percent, while token work quadruples. If attempts copy one another or their success
          rates change, we need a different probability model.
        hold: 0.8
        visual_cues:
          - id: four-attempts
            phrase: About sixty-eight percent
            targets:
              - row-four
            color: green
            linger: 0.18
          - id: diminishing-returns
            phrase: Move to sixteen attempts
            targets:
              - row-sixteen
            color: cyan
            linger: 0.18
      - say: Return to the four-try row. Suppose the selector finds the right answer in four fifths of the pools
          that contain one. Take four fifths of the green length. About fifty-five percent of all requests
          now return a correct answer. The remaining part of that green length is where the generator
          succeeded and the selector lost the answer. With one attempt we simply return that attempt.
        hold: 1
        visual_cues:
          - id: selector-recall
            phrase: Take four fifths of the green length
            targets:
              - row-four
            color: green
            linger: 0.18
          - id: selected-success
            phrase: About fifty-five percent of all requests
            targets:
              - returned-four
            color: green
            linger: 0.18
        caption_starts:
          - Take four fifths of the green length
          - About fifty-five percent
  - id: per-prompt-distribution
    title: Average coverage after computing each prompt
    visual: Construct two per-prompt miss products and complement them before averaging; move probability mass
      between prompts while retaining the sampling budget.
    beats:
      - say: For one fixed prompt with independent identically distributed attempts, let p be its one-attempt hit
          probability. The chance all N attempts miss is the quantity one minus p raised to N. Subtract that
          result from one to obtain candidate coverage. To estimate dataset coverage, compute that quantity
          for each prompt first, then average those prompt-level results.
        visual_cues:
          - id: tt-per-prompt-distribution-0
            phrase: For one fixed prompt with independent identically distributed attempts, let p be its one-attempt hit
              probability.
            targets:
              - tt-per-prompt-distribution-0
            color: cyan
            linger: 0.4
        hold: 0.7
      - say: Consider the article’s two hypothetical prompts. Before training their hit probabilities are point eight
          and point two. Afterward they are point nine nine and point zero five. Mean one-attempt success
          rises from point five to point five two. But mean four-attempt coverage falls from about point seven
          nine four to point five nine three, because one prompt has become much harder to cover.
        visual_cues:
          - id: tt-per-prompt-distribution-1
            phrase: Consider the article’s two hypothetical prompts.
            targets:
              - tt-per-prompt-distribution-1
            color: yellow
            linger: 0.4
          - id: tt-probability-shift
            phrase: Afterward they are point nine nine and point zero five.
            targets:
              - tt-probability-shift
            color: cyan
            linger: 0
          - id: tt-prompt-coverage
            phrase: But mean four-attempt coverage falls from about point seven nine four to point five nine three,
              because one prompt has become much harder to cover.
            targets:
              - tt-prompt-coverage
            color: pink
            linger: 0
        hold: 0.7
      - say: For fixed p, adding independent attempts cannot reduce oracle coverage. Changing the trained probability
          distribution is a different comparison. Selection can also lose a correct candidate already present.
          If a selector succeeds with conditional probability r whenever coverage exists, selected success is
          coverage multiplied by r. Charge all N generated attempts even when just one answer returns.
        visual_cues:
          - id: tt-per-prompt-distribution-2
            phrase: For fixed p, adding independent attempts cannot reduce oracle coverage.
            targets:
              - tt-per-prompt-distribution-2
            color: green
            linger: 0.4
        hold: 0.7
  - id: policy-training
    title: Train for the way you’ll choose an answer
    visual: Contrast a target-likelihood update with per-prompt multi-attempt coverage and retain the prompt
      distribution in both evaluation tables.
    beats:
      - say: Token-level likelihood training rewards the demonstrated target. At serving time we may try four
          answers and let a verifier choose. A model can get better at its first guess while giving us
          fewer useful alternatives on hard prompts. Evaluate it with the sampling budget and selector you
          plan to use.
        visual_cues:
          - id: tt-policy-training-0
            phrase: Token-level likelihood training rewards the demonstrated target.
            targets:
              - tt-policy-training-0
            color: cyan
            linger: 0.4
        hold: 0.7
      - say: Chen and colleagues studied this on math problems and formal theorem proving. They changed the
          training objective to limit how much probability the model puts on a single answer. In their
          evaluations, that helped search find correct alternatives.
        visual_cues:
          - id: tt-policy-training-1
            phrase: Chen and colleagues studied this on math problems and formal theorem proving
            targets:
              - tt-policy-training-1
            color: yellow
            linger: 0.4
          - id: tt-training-search
            phrase: limit how much probability the model puts on a single answer
            targets:
              - tt-training-search
            color: cyan
            linger: 0
        hold: 0.7
      - say: At each sampling budget, ask two questions. How often did any draft get the answer right? How often
          did the verifier send one of those correct drafts? That gap tells you where selection lost a
          good answer.
        visual_cues:
          - id: tt-policy-training-2
            phrase: At each sampling budget, ask two questions
            targets:
              - tt-policy-training-2
            color: green
            linger: 0.4
          - id: tt-selected-evaluation
            phrase: How often did the verifier send one of those correct drafts
            targets:
              - tt-selected-evaluation
            color: green
            linger: 0
        hold: 0.7
  - id: process-targets
    title: What does a step score measure?
    visual: Keep a false intermediate equation fixed while completed rollouts repair or repeat it, constructing
      separate human-validity, any-success and fraction-success labels.
    beats:
      - say: An outcome reward model scores a completed trajectory. Its signal can be correctness, a scalar judgment
          or a preference. A process reward model scores intermediate work conditioned on the problem and
          preceding steps. Its training labels determine what that score means. Human step-validity labels ask
          whether the step itself is sound. Rollout-based labels ask whether a continuation policy can recover
          a correct final answer.
        visual_cues:
          - id: tt-process-targets-0
            phrase: An outcome reward model scores a completed trajectory.
            targets:
              - tt-process-targets-0
            color: cyan
            linger: 0.4
        hold: 0.7
      - say: The first step says two plus two equals five. A human checking that step would mark it wrong. Now let
          four continuations finish from there. They answer four, five, four and four. The any-success
          target is one because at least one continuation recovered. The fraction-success target is three
          quarters. It counts how often the continuation fixed the mistake.
        visual_cues:
          - id: tt-process-targets-1
            phrase: The first step says two plus two equals five
            targets:
              - tt-process-targets-1
            color: yellow
            linger: 0.4
          - id: tt-rollout-targets
            phrase: The fraction-success target is three quarters
            targets:
              - tt-rollout-targets
            color: green
            linger: 0
        hold: 0.7
        caption_starts:
          - The any-success target
          - The fraction-success target
      - say: Math-Shepherd’s completion-based targets depend on the completer and rollout budget. In another
          reward-to-go setup, Snell and colleagues found the last-step aggregate worked better than minimum or
          product aggregation. Our minimum-step controller is a declared search heuristic. Match aggregation
          and pruning to the actual score contract instead of treating every process score as the same
          probability.
        visual_cues:
          - id: tt-process-targets-2
            phrase: Math-Shepherd’s completion-based targets depend on the completer and rollout budget.
            targets:
              - tt-process-targets-2
            color: green
            linger: 0.4
        hold: 0.7
