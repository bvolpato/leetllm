  - id: intro
    title: How many chairs are in this room?
    visual: Keep the model’s answer beside the seating plan. Count the seats at the four tables, then light up
      the row of chairs the model missed.
    beats:
      - say: The model counted thirty-two chairs. Four tables seat eight people each. There’s another row along
          the wall. What count would you send the organizer?
        hold: 2.3
        caption_starts:
          - What count would you send the organizer
        visual_cues:
