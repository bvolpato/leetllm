scenes:
  - id: intro
    title: "What does SkyRL keep when a query fails?"
    visual: >-
      A yellow database error travels from the failed SQL into the sampler's response. The customer
      table opens beside the query for the repair. Five toy IDs keep both attempts and the reply.
    beats:
      - say: >-
          No such column. The database error lands right after the failed query. The sampler asked for
          unresolved count. To find active customers with more than three open incidents, which column
          should it use?
        hold: 2.1
        caption_starts:
          - "The database error lands"
          - "The sampler asked for unresolved count"
        visual_cues:
          - id: intro-attempt
            phrase: "The sampler asked for unresolved count"
            targets: [intro-sql]
            linger: 0.3
          - id: intro-db-error
            phrase: "The database error lands right after the failed query"
            targets: [intro-observation]
            linger: 0.3
          - id: intro-find-column
            phrase: "which column should it use"
            targets: [intro-schema]
            linger: 0.3
      - say: >-
          Use open incidents. Now the query can run. Ben has exactly three, and Cy is inactive. Only Ada
          qualifies. The database returns Ada, and the checker verifies the result. The failed turn earned
          minus point two. The repair earns one, bringing the reward for this trajectory to point eight.
        hold: 0.8
        caption_starts:
          - "Only Ada qualifies"
        visual_cues:
          - id: intro-repair
            phrase: "Use open incidents"
            targets: [intro-sql]
            linger: 0.3
          - id: intro-beat-2-focus-1
            phrase: "The database returns Ada, and the checker verifies the result"
            targets: [intro-environment]
            linger: 0.3
          - id: intro-return
            phrase: "bringing the reward for this trajectory to point eight"
            targets: [intro-environment]
            linger: 0.3
      - say: >-
          Look at the five tokens. The sampler wrote the two blue tokens on each side. The yellow token
          came from the database. The model needed that reply to fix its query. SkyRL keeps all five in
          the response. Which positions should contribute to the policy loss?
        hold: 1.6
      - say: >-
          Mark the four sampled positions for loss. Give the database reply a zero in the mask. The
          trainer can now tell which actions the model took and what it saw between them.
        hold: 1.2
        visual_cues:
          - id: intro-apply-mask
            phrase: "Mark the four sampled positions for loss"
            targets: [intro-response]
            linger: 0.3
  - id: seams-record
    title: "Both queries run. Which one earns the reward?"
    visual: >-
      The same three customers and SQL query stay visible while a single comparison changes. Ben enters
      the result at the threshold. The resulting task evidence follows the generator handoff into the
      trainer.
    beats:
      - say: >-
          Keep Ada, Ben and Cy exactly as they were. This time change the comparison to greater than or equal
          to three. Both queries run. Look at Ben. The extra row is Ben, so the returned set no longer matches
          the expected answer. A successful database call alone would reward the wrong query here.
        hold: 0.9
        caption_starts:
          - "The extra row is Ben"
        visual_cues:
          - id: seams-include-three
            phrase: "change the comparison to greater than or equal to three"
            targets: [seams-query]
            linger: 0.3
          - id: seams-extra-row
            phrase: "The extra row is Ben"
            targets: [seams-rows]
            linger: 0.3
      - say: >-
          Who can tell the trainer what happened? The inference engine sampled the action. The SQL environment
          ran it, checked the rows and returned the observation, reward and stop condition. The generator puts
          both turns in one record. The trainer can now compute advantages. At the pinned revision much of the
          setup and control flow still lives in trainer dot py.
        hold: 0.6
        caption_starts:
          - "The inference engine sampled the action"
        visual_cues:
          - id: seams-handoff
            phrase: "The generator puts both turns in one record"
            targets: [seams-record]
            linger: 0.3
      - say: >-
          Now give the agent a terminal task. Change the parser and the environment that executes the action.
          A test result can take the place of database rows. Keep the same response positions, masks, reward
          and task identity at the trainer boundary. If the generator returns one turn at a time, its
          completion flag tells you whether the episode ended there.
        hold: 0.6
        visual_cues:
          - id: seams-switch-task
            phrase: "give the agent a terminal task"
            targets: [seams-record]
            linger: 0.3
  - id: version-contract
    title: Follow the query back to its source
    visual: The same query-42 record stays at the center while a pinned source tree and CPU receipt attach to it.
      The source fingerprint persists; no GPU or server receipt appears.
    beats:
      - say: >-
          Which copy of SkyRL runs this query? The commit beside it identifies the source. Older recipes
          split the trainer and the API across two packages. At this revision both live under skyrl. Follow
          the client in that tree to see which server calls it makes.
        hold: 0.6
        caption_starts:
          - "The commit beside it identifies the source"
        visual_cues:
          - id: sky-version-contract-b0
            phrase: >-
              At this revision both live under skyrl
            targets:
              - sky-version-contract-mechanism
            color: cyan
            linger: 0.3
      - say: >-
          The article checks the reward and queue arithmetic in two small examples. It also runs methods
          from this exact revision on a CPU. One check fills the queue, filters a group and watches a
          waiting producer wake up. Others check epoch counters and where each turn's reward lands. To check
          a weight transfer, look on the receiving sampler.
        hold: 0.6
        visual_cues:
          - id: sky-version-contract-b1
            phrase: >-
              One check fills the queue, filters a group and watches a waiting producer wake up. Others
              check epoch counters and where each turn's reward lands
            targets:
              - sky-version-contract-mechanism
            color: cyan
            linger: 0.3
  - id: generator-runtime
    title: What goes back to the trainer?
    visual: Two identified input rows take unequal-duration environment paths. Completion order differs from input
      order; entire aligned rows return to their original indices. A required nullable key is populated with
      None.
    beats:
      - say: >-
          A and B go into the generator in that order. B finishes first. B's reward belongs to B's tokens.
          Move each whole row back to its input position. A goes first, then B. The masks, log
          probabilities, IDs, timing and any image data travel with their row.
        hold: 0.6
        visual_cues:
          - id: sky-generator-runtime-b0
            phrase: >-
              A and B go into the generator in that order
            targets:
              - sky-generator-runtime-mechanism
            color: cyan
            linger: 0.3
          - id: sky-row-arrival
            phrase: >-
              B finishes first
            targets:
              - sky-generator-runtime-mechanism
            color: yellow
            linger: 0.3
          - id: sky-row-order
            phrase: >-
              Move each whole row back to its input position
            targets:
              - sky-generator-runtime-mechanism
            color: yellow
            linger: 0.3
      - say: >-
          This SQL example has no image. What goes in the pixel values field? Put None there. GeneratorInput
          and GeneratorOutput declare required keys. An optional value lets the key hold None. Check that
          your generator returns each key when it runs.
        hold: 0.6
        caption_starts:
          - "Put None there"
        visual_cues:
          - id: sky-generator-runtime-b1
            phrase: >-
              This SQL example has no image
            targets:
              - sky-generator-runtime-mechanism
            color: cyan
            linger: 0.3
          - id: sky-nullable-key
            phrase: >-
              Put None there
            targets:
              - sky-generator-runtime-mechanism
            color: yellow
            linger: 0.3
      - say: >-
          Now check row B. It has five response positions and five mask positions. Its behavior scores are
          missing. Version nineteen is a label. To get the probability of an action, record it when the
          sampler chooses that token. Before training, also check row counts, stop reasons and the timing or
          expert routing data your recipe uses.
        hold: 0.6
        visual_cues:
          - id: sky-generator-runtime-b2
            phrase: >-
              Now check row B
            targets:
              - sky-generator-runtime-mechanism
            color: cyan
            linger: 0.3
          - id: sky-missing-behavior
            phrase: >-
              Its behavior scores are missing
            targets:
              - sky-generator-runtime-mechanism
            color: yellow
            linger: 0.3
  - id: masks
    title: "Which scores reach the loss?"
    visual: >-
      Five fixed response positions feed a second track. The error remains in the response throughout.
      Only four scores have paths into the sum. First the error score changes, then the last action score
      changes.
    beats:
      - say: >-
          Read the top row as the sampler's history. On the track below, follow each action's log probability
          down the arrow and reverse its sign. Four contributions add to two. Divide by four sampled tokens.
          The mean loss is point five. This little calculation checks alignment before we use a policy
          objective.
        hold: 0.65
        visual_cues:
          - id: masks-half
            phrase: "The mean loss is point five"
            targets: [action-mean]
            linger: 0.3
      - say: >-
          Give the database error a score of minus nine. Watch the bottom of its column. The mask stops its
          score there. The four action terms still add to two, so the mean stays at point five. The error
          token itself stays where the repair can read it.
        hold: 0.7
        visual_cues:
          - id: masks-score-error
            phrase: "a score of minus nine"
            targets: [action-position-2]
            linger: 0.3
          - id: masks-still-half
            phrase: "the mean stays at point five"
            targets: [action-mean]
            linger: 0.3
      - say: >-
          Keep that error score. Now change the last action to minus one point two. Its arrow carries an extra
          four tenths into the sum. Two point four divided by four gives point six. These are supplied scores.
          If you changed the error text itself, the probabilities of later actions could change too.
        hold: 0.8
        visual_cues:
          - id: masks-score-repair
            phrase: "change the last action to minus one point two"
            targets: [action-position-4]
            linger: 0.3
          - id: masks-six
            phrase: "Two point four divided by four gives point six"
            targets: [action-mean]
            linger: 0.3
  - id: token-boundary
    title: "Try a response with two tool replies"
    visual: >-
      Two context-only columns interrupt a new six-position response. The four finite action scores reach
      the mean. A final vocabulary example compares appending two sampled IDs with encoding their combined
      text.
    beats:
      - say: >-
          Try this response with two tool replies. One tool position has a missing score, shown as NaN. The
          other has infinity. Use the arrows you just saw. Can you still compute the mean over sampled
          actions, and what value do you get?
        hold: 2.1
        visual_cues:
          - id: boundary-context
            phrase: "One tool position has a missing score, shown as NaN"
            targets: [action-position-1]
            linger: 0.3
      - say: >-
          Select the four action positions first. Their negative log probabilities add to one point six. The
          mean is point four. Now change just the last action to minus one point two. The total becomes two,
          so the new mean is point five. Both tool replies remain in the context.
        hold: 0.8
        caption_starts:
          - "The mean is point four"
          - "the new mean is point five"
        visual_cues:
          - id: boundary-four
            phrase: "The mean is point four"
            targets: [action-mean]
            linger: 0.3
          - id: boundary-new-action
            phrase: "change just the last action to minus one point two"
            targets: [action-position-5]
            linger: 0.3
          - id: boundary-half
            phrase: "the new mean is point five"
            targets: [action-mean]
            linger: 0.3
      - say: >-
          Those positions depend on the IDs you keep. Suppose the sampler emitted A and then B in this toy
          vocabulary. Appending the two IDs preserves two scores. Encode the whole string again and the
          tokenizer can merge it into one token, ID nine. Which original score would go there? SkyRL's default
          multi-turn path appends the IDs. Check alignment separately if a custom chat template retokenizes
          the history.
        hold: 1
        visual_cues:
          - id: boundary-merge
            phrase: "one token, ID nine"
            targets: [boundary-ids]
            linger: 0.3
  - id: reward-endpoints
    title: Reward belongs to a precise action endpoint
    visual: The same five-position row receives -0.2 at the first action endpoint and +1 at the second. A length
      boundary cuts off an endpoint; an appended EOS receives the final reward. A separate custom-template
      scalar remains distinct.
    beats:
      - say: >
          A reward list aligns to response positions, not an arbitrary list of turns. In the default
          generator, each step reward is stamped at its final action token. Our minus point two and plus one
          occupy the two action endpoints. Their sum is point eight, but the advantage calculation decides how
          that return affects training.
        hold: 0.6
        visual_cues:
          - id: sky-reward-endpoints-b0
            phrase: A reward list aligns to response positions, not an arbitrary list of turns. In the default generator,
              each step reward is stamped at its final action token. Our minus point two and plus one occupy the two
              action endpoints. Their sum is point eight, but the advantage calculation decides how that return
              affects training.
            targets:
              - sky-reward-endpoints-mechanism
            color: cyan
            linger: 0.3
          - id: sky-reward-ends
            phrase: Our minus point two and plus one occupy the two action endpoints
            targets:
              - sky-reward-endpoints-mechanism
            color: yellow
            linger: 0.3
          - id: sky-reward-sum
            phrase: Their sum is point eight
            targets:
              - sky-reward-endpoints-mechanism
            color: yellow
            linger: 0.3
      - say: >
          Read the truncation boundary literally. A recorded endpoint beyond the retained response is not
          stamped into that shortened row. If the generator appends an end-of-sequence token, its final reward
          goes on that appended token. Those rules can move or remove a reward even when the environment
          originally returned it.
        hold: 0.6
        visual_cues:
          - id: sky-reward-endpoints-b1
            phrase: Read the truncation boundary literally. A recorded endpoint beyond the retained response is not
              stamped into that shortened row. If the generator appends an end-of-sequence token, its final reward
              goes on that appended token. Those rules can move or remove a reward even when the environment
              originally returned it.
            targets:
              - sky-reward-endpoints-mechanism
            color: cyan
            linger: 0.3
          - id: sky-reward-truncate
            phrase: A recorded endpoint beyond the retained response is not stamped into that shortened row
            targets:
              - sky-reward-endpoints-mechanism
            color: yellow
            linger: 0.3
          - id: sky-reward-eos
            phrase: its final reward goes on that appended token
            targets:
              - sky-reward-endpoints-mechanism
            color: yellow
            linger: 0.3
      - say: >
          The pinned custom-chat-template branch instead returns the last step’s scalar reward. For our
          supplied two rewards, that scalar would be one, not point eight. This is why reward shape,
          aggregation, truncation, and the selected template belong in the experiment receipt. They change the
          objective before any optimizer runs.
        hold: 0.6
        visual_cues:
          - id: sky-reward-endpoints-b2
            phrase: The pinned custom-chat-template branch instead returns the last step’s scalar reward. For our supplied
              two rewards, that scalar would be one, not point eight. This is why reward shape, aggregation,
              truncation, and the selected template belong in the experiment receipt. They change the objective before
              any optimizer runs.
            targets:
              - sky-reward-endpoints-mechanism
            color: cyan
            linger: 0.3
          - id: sky-reward-scalar
            phrase: that scalar would be one, not point eight
            targets:
              - sky-reward-endpoints-mechanism
            color: yellow
            linger: 0.3
  - id: trainer-pass
    title: The trainer builds its update from normalized records
    visual: The retained trajectory is successively annotated with training tensors, current log probabilities,
      optional critic values, advantages and returns before crossing the optimizer boundary.
      Evaluator/checkpoint/sync are separate later actions.
    beats:
      - say: >
          The regular trainer first generates trajectories, applies dynamic sampling or step-wise merging as
          configured, then constructs training input. It computes current log probabilities and critic values
          when a critic is enabled. Advantage and return calculation follow those records. Policy and optional
          critic optimization consume the resulting tensors.
        hold: 0.6
        visual_cues:
          - id: sky-trainer-pass-b0
            phrase: The regular trainer first generates trajectories, applies dynamic sampling or step-wise merging as
              configured, then constructs training input. It computes current log probabilities and critic values when
              a critic is enabled. Advantage and return calculation follow those records. Policy and optional critic
              optimization consume the resulting tensors.
            targets:
              - sky-trainer-pass-mechanism
            color: cyan
            linger: 0.3
          - id: sky-trainer-advantages
            phrase: Advantage and return calculation follow those records
            targets:
              - sky-trainer-pass-mechanism
            color: yellow
            linger: 0.3
      - say: >-
          The validation score is in. The checkpoint is still being written, and the sampler is waiting for
          new weights. Each column records a different event. In a synchronous run the trainer waits for the
          last environment in the batch, updates the policy, then syncs the sampler before the next batch
          starts.
        hold: 0.6
        visual_cues:
          - id: sky-trainer-pass-b1
            phrase: >-
              Each column records a different event
            targets:
              - sky-trainer-pass-mechanism
            color: cyan
            linger: 0.3
          - id: sky-trainer-checkpoint
            phrase: >-
              The checkpoint is still being written
            targets:
              - sky-trainer-pass-mechanism
            color: yellow
            linger: 0.3
  - id: group
    title: Relative reward supplies a learning direction
    visual: Four reward markers shift downward by their common group mean, exposing positive and negative centered
      advantages around a stable zero line. Raising the two low rewards toward one collapses every centered
      marker to zero. Exact reward and mean arithmetic drives each position.
    beats:
      - say: >
          Consider several responses to the same prompt. A frozen checker assigns each a reward under the same
          success condition. Group-relative methods compare those responses. Our simple version subtracts the
          group mean to measure which samples did better or worse than their peers.
        hold: 0.6
        visual_cues:
          - id: group-beat-1-focus-1
            phrase: A frozen checker assigns each a reward under the same success condition
            targets:
              - group-reward-states
              - group-math-a-i-r-i-ar-r-quad-ar-rapprox
            color: cyan
            linger: 0.65
      - say: >
          The centered advantages now have positive and negative signs. A policy objective can encourage
          rewarded action patterns relative to the lower-scoring samples. The comparison needs the same prompt
          and a trustworthy evaluator. Faster execution cannot repair a reward function that measures the
          wrong behavior.
        hold: 0.6
        visual_cues:
          - id: group-beat-2-focus-1
            phrase: A policy objective can encourage rewarded action patterns relative to the lower-scoring samples
            targets:
              - group-reward-states
              - group-math-a-i-r-i-ar-r-quad-ar-rapprox
            color: cyan
            linger: 0.65
      - say: >
          Give every response the same reward. The centered signal vanishes. That could mean an easy prompt or
          a checker that always reports success. Other enabled terms can still contribute gradients. Inspect
          the reward diversity and environment evidence before attributing a flat learning curve to the
          optimizer.
        hold: 0.6
        visual_cues:
          - id: group-beat-3-focus-1
            phrase: That could mean an easy prompt or a checker that always reports success
            targets:
              - group-reward-states
              - group-math-a-i-r-i-ar-r-quad-ar-rapprox
            color: cyan
            linger: 0.65
          - id: group-equal-rewards
            phrase: Give every response the same reward
            targets:
              - group-reward-states
              - group-math-a-i-r-i-ar-r-quad-ar-rapprox
            color: green
            linger: 0.2
          - id: group-zero-signal
            phrase: The centered signal vanishes
            targets:
              - group-reward-states
            color: yellow
            linger: 0.5
  - id: policy-ratio
    title: Clipping changes an incentive rather than imposing a final ratio
    visual: The same action has behavior probability and current probability. Their ratio feeds unclipped and
      clipped advantage products; the smaller product is selected separately for positive and negative
      advantages.
    beats:
      - say: >
          A simplified policy-gradient loss is minus advantage times log probability, averaged over sampled
          actions. Its local incentive rewards positive-advantage actions and discourages negative-advantage
          actions. Shared parameters couple samples, so a particular probability can still move either way
          after the complete update.
        hold: 0.6
        visual_cues:
          - id: sky-policy-ratio-b0
            phrase: A simplified policy-gradient loss is minus advantage times log probability, averaged over sampled
              actions. Its local incentive rewards positive-advantage actions and discourages negative-advantage
              actions. Shared parameters couple samples, so a particular probability can still move either way after
              the complete update.
            targets:
              - sky-policy-ratio-mechanism
            color: cyan
            linger: 0.3
      - say: >
          For the clipped surrogate, divide current action probability by its behavior probability to get the
          ratio. Multiply that ratio by advantage. Also clip the ratio between one minus epsilon and one plus
          epsilon, then multiply by the same advantage. Select the smaller product; the minimized loss negates
          that surrogate.
        hold: 0.6
        visual_cues:
          - id: sky-policy-ratio-b1
            phrase: For the clipped surrogate, divide current action probability by its behavior probability to get the
              ratio. Multiply that ratio by advantage. Also clip the ratio between one minus epsilon and one plus
              epsilon, then multiply by the same advantage. Select the smaller product; the minimized loss negates
              that surrogate.
            targets:
              - sky-policy-ratio-mechanism
            color: cyan
            linger: 0.3
          - id: sky-ratio-current
            phrase: divide current action probability by its behavior probability to get the ratio
            targets:
              - sky-policy-ratio-mechanism
            color: yellow
            linger: 0.3
          - id: sky-ratio-min
            phrase: Select the smaller product
            targets:
              - sky-policy-ratio-mechanism
            color: yellow
            linger: 0.3
      - say: >
          With epsilon point two, ratio one point five, and advantage plus point five, the products are point
          seven five and point six. Select point six. With ratio point five and advantage minus point five,
          select minus point four rather than minus point two five. This clips objective incentives; it does
          not force every final ratio to stay inside the interval.
        hold: 0.6
        visual_cues:
          - id: sky-policy-ratio-b2
            phrase: With epsilon point two, ratio one point five, and advantage plus point five, the products are point
              seven five and point six. Select point six. With ratio point five and advantage minus point five, select
              minus point four rather than minus point two five. This clips objective incentives; it does not force
              every final ratio to stay inside the interval.
            targets:
              - sky-policy-ratio-mechanism
            color: cyan
            linger: 0.3
          - id: sky-ratio-positive
            phrase: Select point six
            targets:
              - sky-policy-ratio-mechanism
            color: yellow
            linger: 0.3
          - id: sky-ratio-negative
            phrase: select minus point four rather than minus point two five
            targets:
              - sky-policy-ratio-mechanism
            color: yellow
            linger: 0.3
  - id: reward-normalization
    title: Mean centering and standardization are different recipes
    visual: Original rewards [1,0,1,0] construct mean 0.5 and signed centered bars. A separate standard-deviation
      divisor is added and removed without changing the original recipe. Equal rewards flatten only the
      centered term.
    beats:
      - say: >
          For our four binary rewards, the mean is point five and centered advantages are plus point five,
          minus point five, plus point five, minus point five. A separate two-response
          correct-versus-incorrect experiment gives the same signed half values. It deliberately uses binary
          rewards rather than the earlier shaped turn rewards.
        hold: 0.6
        visual_cues:
          - id: sky-reward-normalization-b0
            phrase: For our four binary rewards, the mean is point five and centered advantages are plus point five, minus
              point five, plus point five, minus point five. A separate two-response correct-versus-incorrect
              experiment gives the same signed half values. It deliberately uses binary rewards rather than the
              earlier shaped turn rewards.
            targets:
              - sky-reward-normalization-mechanism
            color: cyan
            linger: 0.3
          - id: sky-centered-halves
            phrase: centered advantages are plus point five, minus point five, plus point five, minus point five
            targets:
              - sky-reward-normalization-mechanism
            color: yellow
            linger: 0.3
      - say: >
          Some recipes additionally divide by group standard deviation. The article’s small arithmetic example
          uses mean centering only. Keep that normalization choice explicit when comparing DAPO-like
          filtering, Dr. GRPO-style settings, or another configuration. Identical rewards give zero centered
          reward signal, while an enabled KL or auxiliary term can still produce an update.
        hold: 0.6
        visual_cues:
          - id: sky-reward-normalization-b1
            phrase: Some recipes additionally divide by group standard deviation. The article’s small arithmetic example
              uses mean centering only. Keep that normalization choice explicit when comparing DAPO-like filtering,
              Dr. GRPO-style settings, or another configuration. Identical rewards give zero centered reward signal,
              while an enabled KL or auxiliary term can still produce an update.
            targets:
              - sky-reward-normalization-mechanism
            color: cyan
            linger: 0.3
          - id: sky-standardize
            phrase: Some recipes additionally divide by group standard deviation
            targets:
              - sky-reward-normalization-mechanism
            color: yellow
            linger: 0.3
          - id: sky-equal-centered
            phrase: Identical rewards give zero centered reward signal
            targets:
              - sky-reward-normalization-mechanism
            color: yellow
