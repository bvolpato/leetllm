  - id: admission-math
    title: "How many groups can the producer start?"
    visual: >-
      Six consumed groups share a strip with four buffered and one running. Subtracting those six leaves
      five of six outstanding slots occupied. The last slot competes with the number of free workers. A
      separate step-one example sets S to zero.
    beats:
      - say: >-
          Suppose the trainer uses two prompt groups per update. Call that number B. Set the staleness
          parameter S to two. Just before step four, ten groups have finished and one is running. The
          controller counts eleven against its cumulative limit. Add S to the current step, then multiply by
          B. Here that limit is twelve.
        hold: 0.75
        visual_cues:
          - id: sky-admission-math-b0
            phrase: "ten groups have finished and one is running"
            targets: [sky-admission-math-mechanism]
            linger: 0.3
      - say: >-
          Six of the ten accepted groups have already trained. Subtract those six from both sides. Four
          finished groups are waiting and one is running. That's five outstanding groups in a budget of six.
          In general the first s minus one updates have used B groups each. Subtract them from the cumulative
          limit and the outstanding budget is B times S plus one, with the addition inside the parentheses.
        hold: 0.8
        visual_cues:
          - id: sky-admission-math-b1
            phrase: "Six of the ten accepted groups have already trained"
            targets: [sky-admission-math-mechanism]
            linger: 0.3
          - id: sky-consumed-block
            phrase: "Subtract those six from both sides"
            targets: [sky-admission-math-mechanism]
            linger: 0.3
          - id: sky-outstanding-bound
            phrase: "five outstanding groups in a budget of six"
            targets: [sky-admission-math-mechanism]
            linger: 0.3
      - say: >-
          Now decide how many groups can start. Of six workers, one is busy. Five workers could take a group,
          but there's only one place left in the budget. Use the smaller margin and admit at most one. Try
          starting a fresh run with S set to zero and two workers. Only the current two-group mini-batch fits.
          Later, a trainer update or a filtered group can make room again.
        hold: 0.85
        visual_cues:
          - id: sky-admission-math-b2
            phrase: "decide how many groups can start"
            targets: [sky-admission-math-mechanism]
            linger: 0.3
          - id: sky-worker-margin
            phrase: "admit at most one"
            targets: [sky-admission-math-mechanism]
            linger: 0.3
          - id: sky-zero-staleness
            phrase: "S set to zero and two workers"
            targets: [sky-admission-math-mechanism]
            linger: 0.3
  - id: capacity
    title: "How long can one group wait?"
    visual: >-
      Four snapshots share a three-slot rack. Ready groups change at the top while group L remains in the
      bottom slot. Its scheduling step stays fixed as each trainer update consumes another group. The age
      and the training decision arrive after the question.
    beats:
      - say: >-
          One group trains per update. With the staleness setting at two, there's room for three groups. Look
          just before the first update. A and B are ready. L is still waiting on its database. That fills all
          three places. The trainer takes A.
        hold: 0.8
        visual_cues:
          - id: capacity-first
            phrase: "A and B are ready"
            targets: [capacity-step-1]
            linger: 0.3
      - say: >-
          At step two, B is next. C has already finished in the place A freed. The accepted count is now three
          because it still includes A. Subtract that one trained group and add L, still running. We're back at
          three outstanding. At step three, C is next. Only C and L remain.
        hold: 0.85
        visual_cues:
          - id: capacity-next-b
            phrase: "At step two, B is next"
            targets: [capacity-step-2]
            linger: 0.3
          - id: capacity-next-c
            phrase: "At step three, C is next"
            targets: [capacity-step-3]
            linger: 0.3
      - say: >-
          At step four, L is ready. Four groups have finished and three have already trained. Just L occupies
          a place. It started at step one. Does its age force SkyRL to drop it?
        hold: 2.2
        visual_cues:
          - id: capacity-l-arrives
            phrase: "At step four, L is ready"
            targets: [capacity-step-4]
            linger: 0.3
          - id: capacity-question
            phrase: "Does its age force SkyRL to drop it"
            targets: [capacity-decision]
            linger: 0.3
      - say: >-
          Four minus one gives a lag of three. That's longer than the setting of two. Look back along L's row.
          It occupied one place the whole time. The queue never exceeded three places. SkyRL logs the lag
          warning and trains on L. To find out which weights produced its actions, we need to look inside the
          group.
        hold: 1
        caption_starts:
          - "SkyRL logs the lag warning and trains on L"
        visual_cues:
          - id: capacity-age
            phrase: "Four minus one gives a lag of three"
            targets: [capacity-decision]
            linger: 0.3
          - id: capacity-train
            phrase: "SkyRL logs the lag warning and trains on L"
            targets: [capacity-decision]
            linger: 0.3
