    title: "Which policy sampled the repair?"
    visual: >-
      The scheduling stamp stays at step one. A weight sync splits two sampled action spans around the
      database reply. A scoring example holds the repair token fixed while a replayed probability competes
      with its recorded denominator.
    beats:
      - say: >-
          Open one trajectory in L. The first query came from version eleven. While the database worked, the
