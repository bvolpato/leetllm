            color: yellow
            linger: 0.4
          - id: sr-sync-two-chunks-delete
            phrase: Deletion revision three updates both again
            targets:
              - sr-sync-two-chunks-mechanism
            color: yellow
            linger: 0.4
          - id: sr-sync-two-chunks-other
            phrase: tenant B keeps revision one and operations access
            targets:
              - sr-sync-two-chunks-mechanism
            color: yellow
            linger: 0.4
      - say: The reader’s program would accept a supplied newer revision-four grant and even clear the deleted flag
          and restore the record. It does not enforce terminal tombstones. Source ordering, authorized
          restoration and deletion policy therefore need a real contract. A tombstone denies reads; erasing
          vectors, reports, logs and backups is a separate retention process.
        hold: 0.7
        visual_cues:
          - id: sr-sync-two-chunks-2
            phrase: The reader’s program would accept a supplied newer revision-four grant and even clear the deleted flag
              and restore the record
