version: 1
id: secure-rag
title: Retrieving Only the Evidence a User May See
source: retrieval/enterprise-rag-security-rbac-access-control/content.md
voice: en-US-AndrewNeural
rate: +0%
sources:
  - title: OWASP authorization guidance
    url: https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html
  - title: OWASP LLM application security risks
    url: https://genai.owasp.org/llmrisk/llm01-prompt-injection/
  - title: PostgreSQL row security policies
    url: https://www.postgresql.org/docs/current/ddl-rowsecurity.html
scenes:
  - id: subject-intro
    title: How do I rotate the signing key?
    visual: >-
      The runbook and checklist start in score order, each with its readers and a score
      bar. Only a passage the verified reader can read crosses its gate into the prompt.
    beats:
      - say: >-
          The signing-key runbook is the closest match. Look across its row. It’s for the security group.
          Our reader works in operations. Everyone in tenant A can read the checklist.
          Which passage can the assistant give the model?
        hold: 2.1
        visual_cues:
          - id: intro-runbook
            phrase: "The signing-key runbook is the closest match"
            targets: [runbook]
            linger: 0.35
          - id: intro-reader
            phrase: "Our reader works in operations"
            targets: [request, runbook]
            linger: 0.35
          - id: intro-checklist
            phrase: "Everyone in tenant A can read the checklist"
            targets: [request, checklist]
            linger: 0.35
          - id: intro-question
            phrase: "Which passage can the assistant give the model"
            targets: [request, runbook, checklist, prompt]
            linger: 0.35
      - say: >-
          Only the checklist. Watch its passage cross into the prompt. The runbook stays in the store.
          Looking up passages to help a model answer is called retrieval-augmented generation.
          The service checks the reader’s permissions before handing over the text.
        hold: 0.65
        visual_cues:
          - id: intro-first-answer
            phrase: "Only the checklist"
            targets: [checklist, prompt]
            caption_boundary: true
            linger: 0.35
          - id: intro-list-copy
            phrase: "Watch its passage cross into the prompt"
            targets: [prompt]
            linger: 0.35
      - say: >-
          Same question, same scores. The directory now lists our reader in the security group too.
          Which extra passage can enter?
        hold: 1.8
        visual_cues:
          - id: intro-membership
            phrase: "The directory now lists our reader in the security group too"
            targets: [request, runbook]
            linger: 0.35
      - say: >-
          Now the runbook can enter too. Follow the second copy across. The reader’s new group
          matches the grant on the runbook.
        hold: 0.8
        visual_cues:
          - id: intro-second-answer
            phrase: "Now the runbook can enter too"
            targets: [runbook, prompt]
            caption_boundary: true
            linger: 0.35
          - id: intro-key-copy
            phrase: "Follow the second copy across"
            targets: [prompt]
            linger: 0.35
  - id: permission-models
    title: Trace the grant that permits this reader
    visual: Four named source objects build a role/attribute/relationship permission map under a mandatory tenant
      boundary.
    beats:
      - say: Return to the operations-only reader. Our small corpus contains a tenant-wide checklist, an operations FAQ, a security-only signing-key runbook
          and an executive acquisition plan. Public here means authenticated employees inside one tenant. The
          operations analyst may use the first two; relevance cannot substitute for either missing grant.
        hold: 0.7
        visual_cues:
          - id: sr-permission-models-0
            phrase: Our small corpus contains a tenant-wide checklist, an operations FAQ, a security-only signing-key
              runbook and an executive acquisition plan
            targets:
              - sr-permission-models-mechanism
            color: cyan
            linger: 0.4
          - id: sr-permission-models-corpus
            phrase: Our small corpus contains a tenant-wide checklist, an operations FAQ, a security-only signing-key
              runbook and an executive acquisition plan
            targets:
              - sr-permission-models-mechanism
            color: cyan
            linger: 0.4
          - id: sr-permission-models-eligible
            phrase: The operations analyst may use the first two
            targets:
              - sr-permission-models-mechanism
            color: cyan
            linger: 0.4
      - say: "Role-based control assigns permissions to job roles. Attribute-based control evaluates declared
          properties, such as department and clearance. Relationship-based control follows membership,
          inheritance and ownership edges. Trace user to child team, parent team, then its document: the grant
          comes from that trusted relationship path."
        hold: 0.7
        visual_cues:
          - id: sr-permission-models-1
            phrase: Role-based control assigns permissions to job roles
            targets:
              - sr-permission-models-mechanism
            color: yellow
            linger: 0.4
          - id: sr-permission-models-path
            phrase: Trace user to child team, parent team, then its document
            targets:
              - sr-permission-models-mechanism
            color: yellow
            linger: 0.4
          - id: sr-permission-models-path-grant
            phrase: the grant comes from that trusted relationship path
            targets:
              - sr-permission-models-mechanism
            color: yellow
            linger: 0.4
      - say: User namespaces, metadata filters, trusted late-bound ID authorization and a permission graph are four
          enforcement approaches. Choose one that preserves the source rules and revocation. A permission
          graph decides access; a GraphRAG content graph describes facts. Its edges and reports still need
          their own authorization.
        hold: 0.7
        visual_cues:
          - id: sr-permission-models-2
            phrase: User namespaces, metadata filters, trusted late-bound ID authorization and a permission graph are four
              enforcement approaches
            targets:
              - sr-permission-models-mechanism
            color: green
            linger: 0.4
          - id: sr-permission-models-four
            phrase: User namespaces, metadata filters, trusted late-bound ID authorization and a permission graph are four
              enforcement approaches
            targets:
              - sr-permission-models-mechanism
            color: green
            linger: 0.4
  - id: resolve-principal
    title: Begin with trusted identity state
    visual: The authenticated caller resolves to tenant A and the operations group during the first mapping
      clause. A separate requested read and current resource-grant record expose R6's operations grant, live
      source revision, and actual authorization result; request-supplied identity fields stay outside that
      trust path.
    beats:
      - say: >
          The request reaches the retrieval service with an authenticated principal. Trusted server state maps
          that identity to tenant A and the operations group. Request text can name a tenant or group, while
          authenticated identity and server-side membership establish the caller's scope.
        hold: 0.55
        visual_cues:
          - id: resolve-principal-b1-1
            phrase: authenticated principal
            targets:
              - authenticated-caller
            linger: 0.45
          - id: resolve-principal-b1-2
            phrase: tenant A
            targets:
              - tenant-scope
            linger: 0.45
          - id: resolve-principal-group
            phrase: operations group
            targets:
              - group-scope
            color: green
            linger: 0.45
      - say: >
          Authorization combines the caller, the requested read, and the document's current grants. Tenant,
          deletion state, validity window, group, role, or explicit user permission can each affect the
          result. The policy must say which fields provide a real grant.
        hold: 0.7
        visual_cues:
          - id: resolve-principal-read
            phrase: requested read
            targets:
              - requested-resource-read
            color: cyan
            linger: 0.45
          - id: resolve-principal-b2-1
            phrase: current grants
            targets:
              - document-current-grant
            linger: 0.45
      - say: >
          Resolve a clear allow or deny for every request. Missing identity or policy state keeps protected
          retrieval paused. This gives the search system an explicit eligible set to work with.
        hold: 0.55
        visual_cues:
          - id: resolve-principal-b3-1
            phrase: Missing identity
            targets:
              - missing-identity
            linger: 0.45
  - id: external-join
    title: Join candidate IDs before exporting text
    visual: Four actual candidate identities join a tenant-qualified policy relation; only the local operations
      FAQ crosses into application context.
    beats:
      - say: "The actual first program stores four ranked candidates inside its trusted service: the key runbook, the
          local operations FAQ, another tenant’s FAQ and a record without policy. It joins each
          tenant-qualified document ID to its allowed groups before returning candidate objects."
        hold: 0.7
        visual_cues:
          - id: sr-external-join-0
            phrase: "The actual first program stores four ranked candidates inside its trusted service: the key runbook,
              the local operations FAQ, another tenant’s FAQ and a record without policy"
            targets:
              - sr-external-join-mechanism
            color: cyan
            linger: 0.4
          - id: sr-external-join-join
            phrase: It joins each tenant-qualified document ID to its allowed groups before returning candidate objects
            targets:
              - sr-external-join-mechanism
            color: cyan
            linger: 0.4
      - say: The analyst’s operations membership intersects only the local FAQ’s grant. The runbook misses that group,
          the other FAQ misses the tenant, and the missing policy supplies an empty grant. Only the local FAQ
          returns. Removing all user groups returns none.
        hold: 0.7
        visual_cues:
          - id: sr-external-join-1
            phrase: The analyst’s operations membership intersects only the local FAQ’s grant
            targets:
              - sr-external-join-mechanism
            color: yellow
            linger: 0.4
          - id: sr-external-join-grant
            phrase: The analyst’s operations membership intersects only the local FAQ’s grant
            targets:
              - sr-external-join-mechanism
            color: yellow
            linger: 0.4
          - id: sr-external-join-only
            phrase: Only the local FAQ returns
            targets:
              - sr-external-join-mechanism
            color: yellow
            linger: 0.4
          - id: sr-external-join-empty
            phrase: Removing all user groups returns none
            targets:
              - sr-external-join-mechanism
            color: yellow
            linger: 0.4
      - say: This late-bound join avoids copying resolved user memberships onto every chunk. It is still responsible
          for current source semantics and freshness. The local program holds all fixture text in one process;
          production privileges and data flow determine the actual trusted boundary.
        hold: 0.7
        visual_cues:
          - id: sr-external-join-2
            phrase: This late-bound join avoids copying resolved user memberships onto every chunk
            targets:
              - sr-external-join-mechanism
            color: green
            linger: 0.4
  - id: filter-before-rank
    title: Constrain the searchable set first
    visual: The ACL predicate filters seven candidates inside the trusted store; only the permitted subset enters
      ranking and crosses the boundary.
    beats:
      - say: >
          Inside the trusted store, the index holds seven candidate records. Five restricted candidates match
          the words in the query strongly. Two records are within the analyst's grants. The identity and ACL
          predicate is applied before the result set leaves this boundary.
        hold: 0.65
        visual_cues:
          - id: filter-before-rank-b1-1
            phrase: seven candidate records
            targets:
              - candidate-metadata
            linger: 0.45
          - id: filter-before-rank-b1-2
            phrase: identity and ACL predicate
            targets:
              - candidate-metadata
            linger: 0.45
      - say: >
          The ranking stage receives only eligible candidates. It orders the incident checklist and operations
          runbook by relevance, then returns those permitted passages. The key-rotation text remains in the
          protected corpus and never reaches prompt assembly.
        hold: 0.7
        visual_cues:
          - id: filter-before-rank-b2-1
            phrase: only eligible candidates
            targets:
              - ranked-queue
            linger: 0.45
          - id: filter-before-rank-b2-2
            phrase: orders the incident checklist
            targets:
              - ranked-queue
            linger: 0.45
      - say: >
          Some stores combine filtering with approximate nearest-neighbor search. The filter semantics and
          search budget depend on the backend. Design the query so permission controls the returned candidate
          set, then evaluate recall and underfill on the chosen engine.
        hold: 0.55
        visual_cues:
          - id: filter-before-rank-b3-1
            phrase: returned candidate set
            targets:
              - ranked-queue
            linger: 0.45
  - id: copy-leak
    title: What did the reranker receive?
    visual: Two synthetic runs return the same FAQ. A reviewer opens the reranker input receipts and counts the forbidden passages that crossed in each run.
    beats:
      - say: >-
          Put two test runs side by side. Our operations analyst can read the FAQ. The key runbook
          requires security. Both runs return only the FAQ. Each also recorded which passages its
          reranker received. That reranker is ordinary application code with permission to handle this
          reader's results. Can the final results tell us what the reranker saw?
        hold: 2.05
        visual_cues:
          - id: copies-reader
            phrase: "Our operations analyst can read the FAQ"
            targets: [access]
          - id: copies-returned
            phrase: "Both runs return only the FAQ"
            targets: [captures]
          - id: copies-question
            phrase: "Can the final results tell us what the reranker saw"
            targets: [access, captures, witness]
      - say: >-
          We need the input receipts. Open the first capture. The reranker received the runbook and the
          FAQ. The application removed the runbook later. Open the second capture. Here the store
          checked the document IDs before it handed over text, so the reranker received only the FAQ.
          Count the forbidden passages at that handoff. One in A, zero in B.
        hold: 0.8
        visual_cues:
          - id: copies-a
            phrase: "The reranker received the runbook and the FAQ"
            targets: [captures]
          - id: copies-b
            phrase: "the reranker received only the FAQ"
            targets: [captures]
          - id: copies-count
            phrase: "One in A, zero in B"
            targets: [captures, witness]
            caption_boundary: true
      - say: >-
          Follow the copy in run A. A cache, trace, or crash report could still hold it after the answer
          has gone out. Inspect those destinations. In run B the check happened inside trusted
          handling. A trusted service can inspect a candidate internally. Its privileges and the next
          recipient determine where the boundary lies. Keep denied IDs and titles in a restricted
          audit channel because even a document's existence can be sensitive.
        hold: 0.7
        visual_cues:
          - id: copies-repair
            phrase: "In run B the check happened inside trusted handling"
            targets: [captures, witness]
  - id: typed-policy
    title: Evaluate the complete local predicate
    visual: The actual document row passes mandatory tenant, literal tombstone and aware-time gates before its
      declared grant paths are evaluated.
    beats:
      - say: The larger in-memory exercise uses lexical word matching, despite its vector-store interface name.
          Authorization runs first. Its mandatory gates require the caller’s tenant, an is-deleted value that
          is literally false, and valid time fields. Missing or malformed required fields deny the row.
        hold: 0.7
        visual_cues:
          - id: sr-typed-policy-0
            phrase: The larger in-memory exercise uses lexical word matching, despite its vector-store interface name
            targets:
              - sr-typed-policy-mechanism
            color: cyan
            linger: 0.4
          - id: sr-typed-policy-required
            phrase: Its mandatory gates require the caller’s tenant, an is-deleted value that is literally false, and
              valid time fields
            targets:
              - sr-typed-policy-mechanism
            color: cyan
            linger: 0.4
          - id: sr-typed-policy-deny
            phrase: Missing or malformed required fields deny the row
            targets:
              - sr-typed-policy-mechanism
            color: cyan
            linger: 0.4
      - say: "The runtime clock and bounded endpoints must be timezone-aware datetimes. None explicitly means an
          unbounded endpoint; an absent endpoint does not. A string timestamp must be decoded before this
          predicate. The validity interval includes its start and excludes its end: exactly at expiry, the row
          is denied."
        hold: 0.7
        visual_cues:
          - id: sr-typed-policy-1
            phrase: The runtime clock and bounded endpoints must be timezone-aware datetimes
            targets:
              - sr-typed-policy-mechanism
            color: yellow
            linger: 0.4
          - id: sr-typed-policy-interval
            phrase: The validity interval includes its start and excludes its end
            targets:
              - sr-typed-policy-mechanism
            color: yellow
            linger: 0.4
          - id: sr-typed-policy-expiry
            phrase: exactly at expiry, the row is denied
            targets:
              - sr-typed-policy-mechanism
            color: yellow
            linger: 0.4
      - say: Only after those gates does this fictional source policy accept any matching public, owner, department,
          explicit-user, group or role grant. These are deliberately alternative grants. A real source may
          require conjunctions, explicit denies or inheritance; copying this OR expression would change that
          policy.
        hold: 0.7
        visual_cues:
          - id: sr-typed-policy-2
            phrase: Only after those gates does this fictional source policy accept any matching public, owner,
              department, explicit-user, group or role grant
            targets:
              - sr-typed-policy-mechanism
            color: green
            linger: 0.4
          - id: sr-typed-policy-or
            phrase: this fictional source policy accept any matching public, owner, department, explicit-user, group or
              role grant
            targets:
              - sr-typed-policy-mechanism
            color: green
            linger: 0.4
  - id: grant-paths
    title: Remove every grant that still authorizes the row
    visual: The same FAQ loses its group edge while its department edge remains; removing the remaining applicable
      paths actually changes its authorization.
    beats:
      - say: Follow the operations FAQ through a revocation. Clearing its operations-group field alone leaves its
          operations-department grant active under this toy policy. The result stays allowed. Revocation must
          remove every applicable permission path that the intended source decision withdrew.
        hold: 0.7
        visual_cues:
          - id: sr-grant-paths-0
            phrase: Follow the operations FAQ through a revocation
            targets:
              - sr-grant-paths-mechanism
            color: cyan
            linger: 0.4
          - id: sr-grant-paths-remove
            phrase: Clearing its operations-group field alone leaves its operations-department grant active under this toy
              policy
            targets:
              - sr-grant-paths-mechanism
            color: cyan
            linger: 0.4
          - id: sr-grant-paths-still
            phrase: The result stays allowed
            targets:
              - sr-grant-paths-mechanism
            color: cyan
            linger: 0.4
      - say: "The denial program executes eight cases: wrong tenant, deletion, malformed deletion, future start, exact
          expiry, string time, naive time and missing grant. Four missing mandatory fields also deny, and
          removing the caller’s department, group and role memberships denies the FAQ."
        hold: 0.7
        visual_cues:
          - id: sr-grant-paths-1
            phrase: "The denial program executes eight cases: wrong tenant, deletion, malformed deletion, future start,
              exact expiry, string time, naive time and missing grant"
            targets:
              - sr-grant-paths-mechanism
            color: yellow
            linger: 0.4
          - id: sr-grant-paths-cases
            phrase: The denial program executes eight cases
            targets:
              - sr-grant-paths-mechanism
            color: yellow
            linger: 0.4
      - say: The checklist remains tenant-wide only while its mandatory gates pass. Expire that last allowed record
          and the authorized set becomes empty. Refuse or request permitted evidence. An unfiltered retry
          would turn missing recall into a disclosure.
        hold: 0.7
        visual_cues:
          - id: sr-grant-paths-2
            phrase: The checklist remains tenant-wide only while its mandatory gates pass
            targets:
              - sr-grant-paths-mechanism
            color: green
            linger: 0.4
          - id: sr-grant-paths-expire
            phrase: Expire that last allowed record and the authorized set becomes empty
            targets:
              - sr-grant-paths-mechanism
            color: green
            linger: 0.4
  - id: metadata-receipt
    title: Keep source identity attached to each child
    visual: A source receipt is copied onto two identified chunks, with typed times decoded before policy
      evaluation and classification kept separate from grants.
    beats:
      - say: Each child needs a tenant-qualified source and chunk identity, source revision, policy version, deletion
          state, validity and a live grant decision. Classification and compliance tags describe the document;
          they grant access only if the source policy explicitly says so.
        hold: 0.7
        visual_cues:
          - id: sr-metadata-receipt-0
            phrase: Each child needs a tenant-qualified source and chunk identity, source revision, policy version,
              deletion state, validity and a live grant decision
            targets:
              - sr-metadata-receipt-mechanism
            color: cyan
            linger: 0.4
          - id: sr-metadata-receipt-identity
            phrase: Each child needs a tenant-qualified source and chunk identity, source revision, policy version,
              deletion state, validity and a live grant decision
            targets:
              - sr-metadata-receipt-mechanism
            color: cyan
            linger: 0.4
      - say: The actual schema records the signing-key source at content revision seven and policy version forty-two.
          Its allowed groups are security and platform. Conversion preserves these fields and emits an ISO
          timestamp, which the earlier Python predicate cannot use until the adapter decodes it.
        hold: 0.7
        visual_cues:
          - id: sr-metadata-receipt-1
            phrase: The actual schema records the signing-key source at content revision seven and policy version
              forty-two
            targets:
              - sr-metadata-receipt-mechanism
            color: yellow
            linger: 0.4
          - id: sr-metadata-receipt-source
            phrase: The actual schema records the signing-key source at content revision seven and policy version
              forty-two
            targets:
              - sr-metadata-receipt-mechanism
            color: yellow
            linger: 0.4
          - id: sr-metadata-receipt-grants
            phrase: Its allowed groups are security and platform
            targets:
              - sr-metadata-receipt-mechanism
            color: yellow
            linger: 0.4
          - id: sr-metadata-receipt-iso
            phrase: Conversion preserves these fields and emits an ISO timestamp
            targets:
              - sr-metadata-receipt-mechanism
            color: yellow
            linger: 0.4
      - say: Type annotations do not validate incoming values. Validate at ingestion and test the real backend’s
          supported filter syntax. The local resolved-ACL object and valid-at adapter fields are teaching
          glue, not portable Pinecone, Weaviate or PostgreSQL query operators.
        hold: 0.7
        visual_cues:
          - id: sr-metadata-receipt-2
            phrase: Type annotations do not validate incoming values
            targets:
              - sr-metadata-receipt-mechanism
            color: green
            linger: 0.4
          - id: sr-metadata-receipt-validate
            phrase: Validate at ingestion and test the real backend’s supported filter syntax
            targets:
              - sr-metadata-receipt-mechanism
            color: green
            linger: 0.4
  - id: runtime-rls
    title: Test the role that actually runs the query
    visual: The same SQL policy is viewed through ordinary, owner, forced-owner and bypass identities; the role
      determines whether the row gate applies.
    beats:
      - say: "An available filter option is not authentication: a privileged client may omit it. PostgreSQL row
          security, when enabled without an applicable policy, gives ordinary access a default deny. Policies
          operate inside the database query path."
        hold: 0.7
        visual_cues:
          - id: sr-runtime-rls-0
            phrase: "An available filter option is not authentication: a privileged client may omit it"
            targets:
              - sr-runtime-rls-mechanism
            color: cyan
            linger: 0.4
          - id: sr-runtime-rls-default
            phrase: PostgreSQL row security, when enabled without an applicable policy, gives ordinary access a default
              deny
            targets:
              - sr-runtime-rls-mechanism
            color: cyan
            linger: 0.4
      - say: Table owners normally bypass row security. Force row-level security subjects the owner to its policies,
          but superusers and roles with BYPASS RLS still bypass them. Changing a query string cannot repair an
          overprivileged runtime connection.
        hold: 0.7
        visual_cues:
          - id: sr-runtime-rls-1
            phrase: Table owners normally bypass row security
            targets:
              - sr-runtime-rls-mechanism
            color: yellow
            linger: 0.4
          - id: sr-runtime-rls-owner
            phrase: Table owners normally bypass row security
            targets:
              - sr-runtime-rls-mechanism
            color: yellow
            linger: 0.4
          - id: sr-runtime-rls-force
            phrase: Force row-level security subjects the owner to its policies
            targets:
              - sr-runtime-rls-mechanism
            color: yellow
            linger: 0.4
          - id: sr-runtime-rls-bypass
            phrase: superusers and roles with BYPASS RLS still bypass them
            targets:
              - sr-runtime-rls-mechanism
            color: yellow
            linger: 0.4
      - say: Use the intended constrained connection identity and exercise every search path, including exact lookup,
          ANN, cache hits and citation previews. A local Python allow-list does not establish that a real RLS
          connection, vector API or alternate endpoint enforces the same rule.
        hold: 0.7
        visual_cues:
          - id: sr-runtime-rls-2
            phrase: Use the intended constrained connection identity and exercise every search path, including exact
              lookup, ANN, cache hits and citation previews
            targets:
              - sr-runtime-rls-mechanism
            color: green
            linger: 0.4
          - id: sr-runtime-rls-paths
            phrase: exercise every search path, including exact lookup, ANN, cache hits and citation previews
            targets:
              - sr-runtime-rls-mechanism
            color: green
            linger: 0.4
  - id: recall-tradeoff
    title: Where does the search stop?
    visual: >-
      A yellow rail advances below seven fixed, scored records in the trusted store. Two output slots
      show which members of the exact allowed pair each successive scan limit can reach.
    beats:
      - say: >-
          Back to the seven records, in score order. The request asks for two passages. Exact search finds
          both eligible records, R six and R seven. Let's keep that pair as our reference. First, stop after
          the five highest scores. Every one of those records is restricted. Both result slots are empty.
        hold: 0.7
        motion_check:
          region: [115, 595, 1700, 145]
          minimumChangedFraction: 0.002
        visual_cues:
          - id: recall-reference
            phrase: "Exact search finds both eligible records, R six and R seven"
            targets: [rack, slots]
            linger: 0.35
          - id: recall-five
            phrase: "stop after the five highest scores"
            targets: [rack]
            linger: 0.35
          - id: recall-zero
            phrase: "Both result slots are empty"
            targets: [slots]
            caption_boundary: true
            linger: 0.35
      - say: >-
          Keep the same reader and grants. Move the stop one place to the right. We can now inspect six
          candidates inside the store. Which passages fill the two slots at this stop?
        hold: 2.2
        visual_cues:
          - id: recall-six
            phrase: "Move the stop one place to the right"
            targets: [rack]
            linger: 0.35
          - id: recall-question
            phrase: "Which passages fill the two slots at this stop"
            targets: [rack, slots]
            linger: 0.35
      - say: >-
          Only R six makes it. R seven also has a grant, but the search stopped just before it. We recovered
          one of the two passages in the exact result. That's the authorized recall for this search. The
          empty slot tells us nothing by itself about whether a grant is missing.
        hold: 0.75
        visual_cues:
          - id: recall-one
            phrase: "Only R six makes it"
            targets: [rack, slots]
            caption_boundary: true
            linger: 0.35
      - say: >-
          Let the search visit the seventh record. Both passages now fit. We changed how far the store
          looked. It applied the same permission check every time. These supplied scores give us a
          repeatable test. On a real index, compare filtered results with exact authorized search, then
          measure how much latency a larger budget or an exact fallback costs.
        hold: 0.8
        visual_cues:
          - id: recall-seven
            phrase: "Let the search visit the seventh record"
            targets: [rack]
            linger: 0.35
          - id: recall-two
            phrase: "Both passages now fit"
            targets: [slots]
            caption_boundary: true
            linger: 0.35
  - id: ann-backends
    title: How many permitted rows will the search find?
    visual: >-
      Two possible forty-candidate scans share a match probability. One continues to a cap of fifty.
      A separate allow-list admits only eligible IDs from a three-visit example path.
    beats:
      - say: >-
          Suppose one candidate in ten matches the reader's access rules on average, and each match is
          independent. You ask for ten passages. The index examines forty candidates. How many eligible rows
          would you expect on average?
        hold: 1.8
        visual_cues:
          - id: ann-premise
            phrase: "The index examines forty candidates"
            targets: [samples]
            linger: 0.35
      - say: >-
          Four, on average. Multiply forty by one tenth. Here is one possible scan with two matches. Here is
          another with six. The green squares show which candidates passed. On a real query, records with
          similar wording can also share a grant, so the matching fraction along the search path can differ
          from the fraction in the whole index.
        hold: 0.75
        visual_cues:
          - id: ann-mean
            phrase: "Four, on average"
            targets: [samples]
            caption_boundary: true
            linger: 0.35
          - id: ann-left
            phrase: "one possible scan with two matches"
            targets: [samples]
            caption_boundary: true
            linger: 0.35
          - id: ann-right
            phrase: "another with six"
            targets: [samples]
            caption_boundary: true
            linger: 0.35
      - say: >-
          In pgvector's approximate index example, the database applies the SQL filter after index
          exploration. Take scan A and set a cap of fifty candidates for this example. An iterative scan
          can examine ten more candidates. Only one more matches. At the cap, three of our ten slots are
          filled. With a larger budget the scan could keep looking until it fills the request or hits a
          limit. A partial index, a partition, or exact search over permitted rows can also help.
        hold: 0.65
        visual_cues:
          - id: ann-filter
            phrase: "the database applies the SQL filter after index exploration"
            targets: [engine]
            linger: 0.35
          - id: ann-iterate
            phrase: "examine ten more candidates"
            targets: [engine]
            linger: 0.35
          - id: ann-cap
            phrase: "At the cap, three of our ten slots are filled"
            targets: [engine]
            linger: 0.35
      - say: >-
          Return to the original forty candidates. Weaviate can build an allow-list before it searches the
          neighbor graph. Our list contains three and twenty-seven. Suppose one path visits two, three,
          then eight. Only three can enter the result along that path. Weaviate's ACORN strategy targets
          restrictive filters that correlate poorly with the query. A small allowed set can instead use
          flat search. On the real engine, measure authorized recall, how often the request fills, and latency.
        hold: 0.8
        visual_cues:
          - id: ann-list
            phrase: "Our list contains three and twenty-seven"
            targets: [engine]
            linger: 0.35
          - id: ann-walk
            phrase: "one path visits two, three, then eight"
            targets: [engine]
            linger: 0.35
          - id: ann-flat
            phrase: "A small allowed set can instead use flat search"
            targets: [engine]
            linger: 0.35
  - id: keep-grants-current
    title: Retrieval needs current permission state
    visual: A source grant is revoked; the old index revision is held behind a version gate while all document
      chunks update.
    beats:
      - say: >
          Suppose the source owner removes the operations group's grant. An index webhook can be delayed,
          leaving old metadata on several chunks. If the store trusts that stale copy, a revoked grant may
          still admit the text.
        hold: 0.55
        visual_cues:
          - id: keep-grants-current-b1-1
            phrase: removes the operations group's grant
            targets:
              - source-revocation
            linger: 0.45
      - say: >
          A safer design combines authenticated change events with reconciliation against the source system.
          Apply a monotonic policy revision to every chunk or hold reads behind a trusted document-version
          check while updates complete.
        hold: 0.7
        visual_cues:
          - id: keep-grants-current-b2-1
            phrase: every chunk
            targets:
              - chunk-revisions
            linger: 0.45
          - id: keep-grants-current-b2-2
            phrase: document-version check
            targets:
              - current-version
            linger: 0.45
      - say: >
          Set a revocation objective for the data and threat model. When the current decision is unavailable,
          fail closed for that content. Measure full revocation latency from source change to blocked read,
          alongside the cache bound.
        hold: 0.55
        visual_cues:
          - id: keep-grants-current-b3-1
            phrase: fail closed
            targets:
              - request-decision
            linger: 0.45
  - id: sync-two-chunks
    title: Replay a missed event in source order
    visual: The actual two-chunk tenant-A fixture advances revision1→2→3 while the same document ID in tenant B
      stays unchanged.
    beats:
      - say: Follow the two chunks of this runbook. Tenant B has a runbook with the same name and two chunks
          of its own. The owner removes tenant A's security grant at revision two. The change event never
          arrives. Both copies in A still say revision one and security. Reconciliation reads the
          authoritative revision two and updates both to no groups.
