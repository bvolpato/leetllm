  - id: snapshot-clock
    title: Check both exact version and authoritative age
    visual: A protected snapshot carries one version and fetched clock; old, future and unexpectedly different
      versions stop the same read before export.
    beats:
      - say: The snapshot helper requires equality with the authoritative required version. A freshly fetched version
          forty-one still fails when forty-two is required. A supposedly newer version forty-three also fails
          that exact contract; version numbers cannot be guessed from a request.
        hold: 0.7
        visual_cues:
          - id: sr-snapshot-clock-0
            phrase: The snapshot helper requires equality with the authoritative required version
            targets:
              - sr-snapshot-clock-mechanism
            color: cyan
            linger: 0.4
          - id: sr-snapshot-clock-mismatch
            phrase: A freshly fetched version forty-one still fails when forty-two is required
            targets:
              - sr-snapshot-clock-mechanism
            color: cyan
            linger: 0.4
          - id: sr-snapshot-clock-newer
            phrase: A supposedly newer version forty-three also fails that exact contract
            targets:
              - sr-snapshot-clock-mechanism
            color: cyan
            linger: 0.4
      - say: Compute age as now minus the successful authoritative fetch time. Require age from zero through the
          supplied maximum, inclusive. In the article’s five-minute worksheet, equality is acceptable; six
          minutes or a future fetch time fails. Retimestamping a cached old ACL does not refresh its policy.
        hold: 0.7
        visual_cues:
          - id: sr-snapshot-clock-1
            phrase: Compute age as now minus the successful authoritative fetch time
            targets:
              - sr-snapshot-clock-mechanism
            color: yellow
            linger: 0.4
          - id: sr-snapshot-clock-age
            phrase: Compute age as now minus the successful authoritative fetch time
            targets:
              - sr-snapshot-clock-mechanism
            color: yellow
            linger: 0.4
          - id: sr-snapshot-clock-inclusive
            phrase: equality is acceptable
            targets:
              - sr-snapshot-clock-mechanism
            color: yellow
            linger: 0.4
          - id: sr-snapshot-clock-invalid
            phrase: six minutes or a future fetch time fails
            targets:
              - sr-snapshot-clock-mechanism
            color: yellow
            linger: 0.4
      - say: Document and directory-membership freshness both matter. A signed, unexpired token may retain a revoked
          group. A cache TTL bounds one cache’s age; detection, queues, replicas and derived copies also
          affect end-to-end revocation delay. Set and measure the objective rather than promising instant
          revocation.
        hold: 0.7
        visual_cues:
          - id: sr-snapshot-clock-2
            phrase: Document and directory-membership freshness both matter
            targets:
              - sr-snapshot-clock-mechanism
            color: green
            linger: 0.4
          - id: sr-snapshot-clock-end-to-end
            phrase: detection, queues, replicas and derived copies also affect end-to-end revocation delay
            targets:
              - sr-snapshot-clock-mechanism
            color: green
            linger: 0.4
  - id: tenant-and-scope
