      - say: >-
          Our reader still belongs to operations and security. On the left are the live sources. Line them
          up with two saved copies. The report used the checklist and the FAQ. The buffered draft saw the
          FAQ and the key runbook. It cites only the key. Now the checklist moves to version two. The FAQ
          loses its read grant. The key stays at version seven with its grant intact. The task token and
          policy snapshot both pass. Which old copy may leave now?
        hold: 2.3
        visual_cues:
          - id: sr-fresh-release-reader
            phrase: "Our reader still belongs to operations and security"
            targets: [live-records]
            linger: 0.35
          - id: sr-fresh-release-report
            phrase: "The report used the checklist and the FAQ"
            targets: [old-copies]
            linger: 0.35
          - id: sr-fresh-release-draft
            phrase: "The buffered draft saw the FAQ and the key runbook"
            targets: [old-copies]
            linger: 0.35
          - id: fresh-version
            phrase: "the checklist moves to version two"
            targets: [live-records]
            linger: 0.35
          - id: sr-fresh-release-changes
            phrase: "The FAQ loses its read grant"
            targets: [live-records]
            linger: 0.35
          - id: sr-fresh-release-token
            phrase: "The task token and policy snapshot both pass"
            targets: [live-records]
            linger: 0.35
          - id: fresh-question
            phrase: "Which old copy may leave now"
            targets: [live-records, old-copies]
            linger: 0.35
      - say: >-
          Hold both copies. In the report column, the checklist revision is old and the FAQ grant is gone.
          In the draft column, the key citation is valid. Look one row above it. That uncited FAQ was also
          in the draft's context. Discard the draft. Editing the citation would leave the same words and the
          same exposure.
        hold: 0.8
        visual_cues:
          - id: sr-fresh-release-hold
            phrase: "Hold both copies"
            targets: [old-copies]
            caption_boundary: true
            linger: 0.35
          - id: fresh-report-reason
            phrase: "the checklist revision is old and the FAQ grant is gone"
            targets: [live-records, old-copies]
            linger: 0.35
          - id: fresh-draft-reason
            phrase: "That uncited FAQ was also in the draft's context"
            targets: [live-records, old-copies]
            linger: 0.35
      - say: >-
          Start again from the current sources. Copy checklist version two and key version seven into a new
          report manifest. Both versions and both grants match. Admit the new report. Use those same two
          sources for a new buffered draft addressed to this reader. We can test the send decision with one
          fixed sentence.
        hold: 0.75
        visual_cues:
          - id: sr-fresh-release-rebuild
            phrase: "Copy checklist version two and key version seven into a new report manifest"
            targets: [new-manifest]
            linger: 0.35
          - id: sr-fresh-release-report-admit
            phrase: "Admit the new report"
            targets: [new-manifest]
            caption_boundary: true
            linger: 0.35
          - id: fresh-new-draft
            phrase: "Use those same two sources for a new buffered draft"
            targets: [new-manifest]
            linger: 0.35
      - say: >-
          The example runbook says the security desk reviews rotation requests. Read the verb in the draft
          below it. The draft cites the right runbook. Its context, privacy, clearance, and citation checks
          pass. Would you send this sentence as written?
        hold: 2.1
        visual_cues:
          - id: fresh-local-checks
            phrase: "Its context, privacy, clearance, and citation checks pass"
            targets: [quote-check]
            linger: 0.35
          - id: fresh-support-question
            phrase: "Would you send this sentence as written"
            targets: [quote-check]
            linger: 0.35
      - say: >-
          Hold this draft. Approving a request promises an outcome. The passage only promises a review.
          Change that one word to “reviews.” Now the two sentences match word for word. Send this reply
          to the requesting reader. For a paraphrase, check the meaning against the source. The next lesson
          takes up the shape that answer needs for software to use it.
        hold: 0.9
        visual_cues:
          - id: fresh-mismatch
            phrase: "Hold this draft"
            targets: [quote-check]
            caption_boundary: true
            linger: 0.35
          - id: fresh-correct
            phrase: "Change that one word to “reviews.”"
            targets: [quote-check]
            linger: 0.35
          - id: fresh-match
            phrase: "Now the two sentences match word for word"
            targets: [quote-check]
            caption_boundary: true
            linger: 0.35
          - id: fresh-send
            phrase: "Send this reply to the requesting reader"
            targets: [quote-check]
            caption_boundary: true
            linger: 0.35
