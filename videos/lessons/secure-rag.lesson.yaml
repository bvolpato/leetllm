    beats:
      - say: This token is good for one retrieval request. One JSON payload binds the tenant, user, query
          digest and intended service. It also carries an expiry time and a nonce, a value used once.
          HMAC authenticates all six fields with a shared secret. It stands for hash-based message
          authentication code. Each verifier holds the same secret and can issue tokens too.
        hold: 0.7
        visual_cues:
          - id: sr-task-hmac-0
            phrase: This token is good for one retrieval request
            targets:
              - sr-task-hmac-mechanism
            color: cyan
