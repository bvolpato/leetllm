            color: cyan
            linger: 0.4
          - id: sr-task-hmac-mac
            phrase: HMAC authenticates all six fields with a shared secret
            targets:
              - sr-task-hmac-mechanism
            color: cyan
            linger: 0.4
      - say: The verifier checks integrity, expiry and all request bindings before adding the nonce to its used set. A
          wrong tenant, user, query or audience fails without consuming it. The first matching request before
          expiry succeeds; replay and exact-expiry use fail.
