              - sr-sync-two-chunks-mechanism
            color: cyan
            linger: 0.4
          - id: sr-sync-two-chunks-reconcile
            phrase: Reconciliation reads the authoritative revision two and updates both to no groups
            targets:
              - sr-sync-two-chunks-mechanism
            color: cyan
            linger: 0.4
      - say: Replaying the old revision-one grant updates zero chunks. Repeating revision two is idempotent. Deletion
          revision three updates both again, while tenant B keeps revision one and operations access. The
          dictionary loop is sequential and local; atomic publication or a trusted version gate is still
          required in a serving store.
        hold: 0.7
        visual_cues:
          - id: sr-sync-two-chunks-1
            phrase: Replaying the old revision-one grant updates zero chunks
            targets:
