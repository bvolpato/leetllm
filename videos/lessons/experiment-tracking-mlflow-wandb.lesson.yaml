  - id: alias-workers
    title: What did each worker load?
    visual: Move champion while worker A keeps its loaded object. Start worker B, move the pointer back, then reload B and read back both identities.
    beats:
      - say: Worker A loaded version two through the champion alias. An alias is a name the registry can point at another version. Move champion to version three. A keeps the object it already loaded. Now start worker B and let it resolve champion. It loads version three. The same name led to different running versions.
        hold: 0.6
        visual_cues:
          - id: worker-start
            phrase: Worker A loaded version two
            targets:
              - worker-a
              - pointer
            color: cyan
            linger: 0.3
          - id: move-alias
            phrase: Move champion to version three
            targets:
              - pointer
              - worker-a
            color: cyan
            linger: 0.3
          - id: new-worker
            phrase: It loads version three
            targets:
              - worker-b
              - pointer
            color: cyan
            linger: 0.3
      - say: In MLflow three point sixteen point one, an alias lookup is cached for sixty seconds by default. An explicit version has no default cache expiry. You can change the lifetime or bypass the cache with zero. The reserved latest alias follows the newest available version, so a worker that resolves it can pick up a draft. To roll back, move champion back to version two. B still has three. Reload B from the known-good version and configuration, then read back both workers. Now both report version two.
