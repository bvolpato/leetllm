    title: What did this request cost?
    visual: Measure the two sequential spans. Price three disjoint token buckets, then move all cached input into the uncached bucket while keeping the request size fixed.
    beats:
      - say: In this example retrieval takes four hundred twenty milliseconds and generation takes eighteen hundred fifty. Generation occupies the longer span. To find out why, inspect queue waits, retries, provider timings and resource use. A reader may see the first chunk well before generation ends. Measure that delay from the client’s request to the first visible chunk.
        hold: 0.65
        visual_cues:
          - id: time-spans
            phrase: Generation occupies the longer span
            targets:
              - spans
            color: cyan
            linger: 0.3
          - id: first-visible
            phrase: the first visible chunk
            targets:
              - first-chunk
            color: cyan
            linger: 0.3
      - say: The same request has two thousand input tokens. Twelve hundred are cached, leaving eight hundred billed as uncached. Price those two buckets separately, then add a hundred billed output tokens at the output rate. The rates on screen are per million, so divide each product by a million. The total is just over a third of a cent.
        hold: 0.85
        visual_cues:
          - id: token-buckets
            phrase: Price those two buckets separately
            targets:
              - buckets
            color: cyan
            linger: 0.3
          - id: first-cost
            phrase: just over a third of a cent
            targets:
              - bill
            color: cyan
            linger: 0.3
      - say: Keep the input and output lengths fixed. Suppose every input token misses the cache. All two thousand now pay the uncached rate. The estimate rises to just under seven tenths of a cent. For a real estimate, use the provider’s rate for that model, date and tier. Include additional billable work, and count reasoning tokens only once if the output bill already includes them.
