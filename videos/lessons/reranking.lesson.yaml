            phrase: "Now score passages A and B"
            targets: [passages]
            color: blue
      - say: "On yes alone, B wins with three. Subtract no and A wins with a gap of one. B’s gap is minus one. The BGE Gemma example uses a single Yes logit. RankLLaMA uses a scalar classification head. Check the checkpoint, template, tokenizer and output code before sorting. Even a mathematically increasing sigmoid can introduce ties in finite precision."
