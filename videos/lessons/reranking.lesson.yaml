  - id: transfer
    title: "Which stage needs the repair?"
    visual: "The exact Sunday sentence sits above a hypothetical affirmative reply. Only the reply changes after the viewer identifies the first contradiction."
    beats:
      - say: "Back at the library, open the trace. The hours slip began at rank three. It rose to first, and its complete Sunday sentence reached the assistant. Here’s a possible reply: “Yes. The library is open on Sunday.” Look at both lines. Which stage first contradicts the source?"
