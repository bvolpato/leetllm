scenes:
  - id: subject-intro
    title: "Library search"
    visual: "Three library slips show their full sentences. The first two slide into the prompt. After the prediction, the hours slip trades places with the events slip, carrying its Sunday sentence across the cutoff."
    beats:
      - say: "Is the library open on Sunday? The assistant gets the first two slips. Can it answer from those two?"
        hold: 3
        caption_starts: ["The assistant gets the first two slips", "Can it answer from those two"]
        visual_cues:
          - id: first-two
            phrase: "the first two slips"
            targets: [shelf, cutoff]
            color: blue
          - id: which-slip
            phrase: "Can it answer from those two"
            targets: [shelf, cutoff, decision]
            color: yellow
      - say: "Move the hours slip from third to first. The library is closed on Sunday. Search found that sentence on the first try. Reranking changed which two passages the assistant read."
        hold: 1
        caption_starts: ["The library is closed on Sunday", "Search found that sentence"]
        visual_cues:
          - id: choose-hours
            phrase: "Move the hours slip from third to first"
            targets: [shelf, cutoff]
            color: green
            caption_boundary: true
          - id: sunday-answer
            phrase: "The library is closed on Sunday"
            targets: [shelf, cutoff]
            color: green
  - id: candidate-ceiling
    title: "What reaches the scorer?"
    visual: "The search slips stay still. A different bracket limits the scoring input, and the receipt gains the hours ID only when the bracket reaches rank three."
    beats:
      - say: "Now choose how many slips the scorer gets. A fast retriever searches the collection and hands over a shortlist. Suppose that handoff stops at two. Look at the scoring input. Story time and the holiday notice can trade places all day. Neither gives Sunday’s hours."
        hold: 1
        visual_cues:
          - id: shortlist
            phrase: "a shortlist"
            targets: [shelf, cutoff]
            color: blue
          - id: scoring-input
            phrase: "Look at the scoring input"
            targets: [receipt]
            color: yellow
      - say: "Let the scorer read one more passage. Now the hours slip gets compared with the question. The assistant still has room for two. One limit buys us another comparison. The other decides what the assistant can read."
        hold: 0.9
        visual_cues:
          - id: expand-budget
            phrase: "Let the scorer read one more passage"
            targets: [cutoff, receipt]
            color: yellow
      - say: "These three belong to the same permitted search result. A change in access or a newer revision calls for a fresh check before scoring or packing. Raising a relevance score can move a permitted passage up the list. Access comes from the application."
        hold: 0.6
        visual_cues:
          - id: same-snapshot
            phrase: "same permitted search result"
            targets: [shelf, receipt]
            color: blue
  - id: joint-input
    title: "When does the question meet the passage?"
    visual: "The question and passage start as separate groups with separate vectors. Special tokens join them into one BERT input, then two example cross-text links precede the final CLS state."
    beats:
      - say: "A dense retriever can work on the hours slip before anyone asks a question. It stores a passage vector. Later it compares that vector with a vector for the question. Encoding each side separately makes this kind of search practical across a large collection. That’s a bi-encoder."
        hold: 0.6
        visual_cues:
          - id: index-passage
            phrase: "It stores a passage vector"
            targets: [tokens, vectors]
            color: green
      - say: "Now put the question and the passage into one input. This is a BERT-style cross-encoder. The special token at the front is called C L S. The separators mark the ends of the two texts. Inside this model, Sunday in the question can interact with Sunday in the passage. Open can interact with closed. Those links show comparisons the architecture permits."
        hold: 0.7
        visual_cues:
          - id: join-pair
            phrase: "put the question and the passage into one input"
            targets: [tokens, vectors]
            color: cyan
          - id: match-day
            phrase: "Sunday in the question can interact with Sunday in the passage"
            targets: [tokens, interaction]
            color: blue
          - id: match-hours
            phrase: "Open can interact with closed"
            targets: [tokens, interaction]
            color: blue
      - say: "Read the final state at the first token. It has seen both sides, so it can represent this particular match. What it learns depends on training. Test questions that differ by a date, a condition or a word like “closed,” alongside passages that share the vocabulary but give the wrong rule."
        hold: 0.7
        visual_cues:
          - id: read-cls
            phrase: "Read the final state at the first token"
            targets: [tokens, vectors]
            color: cyan
  - id: scalar-score
    title: "A score for the Sunday question"
    visual: "Two coordinates contribute along a common ruler. A backward step applies the bias before the three separate pair logits are compared."
    beats:
      - say: "Suppose the model represents the Sunday question and the hours slip with two coordinates, two and one. Start the marker at zero. The first weight is one. Two times one takes us to two. The second weight is a half. One times a half adds half a step. The bias is minus point two. Where does that leave the marker?"
        hold: 2.5
        visual_cues:
          - id: pair-state
            phrase: "two coordinates, two and one"
            targets: [head]
            color: green
          - id: first-product
            phrase: "Two times one takes us to two"
            targets: [ruler, total]
            color: blue
          - id: second-product
            phrase: "One times a half adds half a step"
            targets: [ruler, total]
            color: cyan
          - id: subtract-bias
            phrase: "The bias is minus point two"
            targets: [head, ruler, total]
            color: yellow
      - say: "Two point three. That final number is the pair’s logit. Use the same weights and bias for each passage. The holiday notice gets point four, and story time gets point zero five. Each logit belongs to one question and one passage."
        hold: 1
        visual_cues:
          - id: logit-result
            phrase: "Two point three"
            targets: [ruler, total]
            color: green
            caption_boundary: true
          - id: compare-pairs
            phrase: "Use the same weights and bias for each passage"
            targets: [comparison]
            color: blue
      - say: "Some checkpoints apply a sigmoid to each logit. It squeezes the scale between zero and one and preserves the mathematical order. The hours slip still wins. To interpret its new number as a probability of relevance, check predictions against held-out relevance labels for that event."
        hold: 0.8
        visual_cues:
          - id: apply-sigmoid
            phrase: "apply a sigmoid to each logit"
            targets: [comparison]
            color: cyan
  - id: reorder-evidence
    title: "Across the two-passage cutoff"
    visual: "A rank diagram traces each of the three original IDs into its new position. The receiving column shows the exact Sunday clause and the unchanged two-slot cutoff."
    beats:
      - say: "Put those three logits beside their original search ranks. Keep your eye on the hours slip at the bottom. Now follow each score into descending order. The hours passage travels from third to first. Its words and source ID travel with it."
        hold: 1.1
        visual_cues:
          - id: compare-order
            phrase: "beside their original search ranks"
            targets: [order]
            color: blue
          - id: order-pairs
            phrase: "follow each score into descending order"
            targets: [order]
            color: green
      - say: "Send the first two passages to the assistant. Before the move, neither passage gave Sunday’s hours. Now the first one does. Candidate recall stayed at one out of one throughout. All the reranker changed was the order."
        hold: 0.8
        visual_cues:
          - id: pack-two
            phrase: "Send the first two passages to the assistant"
            targets: [order, metrics]
            color: yellow
      - say: "For this query there’s one labeled relevant passage. Take one divided by its rank. Its reciprocal rank goes from one third to one. The mean across questions is mean reciprocal rank. On a held-out set, check the actual packed spans too. A later packing step could still cut the line we wanted."
        hold: 0.8
        visual_cues:
          - id: rr-change
            phrase: "from one third to one"
            targets: [metrics]
            color: cyan
  - id: policy-snapshot
    title: Which passages may the scorer read?
    visual: Four permitted records enter hybrid search. The application checks their text, parent, revision and access before passing them on.
    beats:
      - say: "A service account asks whether it can use the legacy token endpoint on day ten after deprecation with audit logging active. Rule AUTH-fourteen allows that request through day fourteen while logging is active. Search returns four current passages the account may read. The governing rule is third, below troubleshooting and password reset. An admin-only rule and a superseded revision remain outside scoring."
        hold: 0.7
        visual_cues:
          - id: auth-request
            phrase: on day ten after deprecation with audit logging active
            targets:
              - auth-request-mark
            color: cyan
            linger: 0.6
          - id: auth-rule
            phrase: Rule AUTH-fourteen allows that request
            targets:
              - auth-rule-mark
            color: cyan
            linger: 0.6
          - id: four-records
            phrase: "four current passages the account may read"
            targets:
              - four-records-mark
            color: cyan
            linger: 0.6
          - id: exclude-records
            phrase: An admin-only rule and a superseded revision remain outside scoring
            targets:
              - exclude-records-mark
            color: cyan
            linger: 0.6
      - say: "Compare the returned passage with the search record, including text and parent identity. The ID and revision still match, but look at the text. The clause has changed. Reject the changed record and retrieve its current revision before scoring it. Bind each score to the exact candidate sent and check that each ID appears only once."
        hold: 0.7
        visual_cues:
          - id: snapshot-compare
            phrase: including text and parent identity
            targets:
              - snapshot-compare-mark
            color: cyan
            linger: 0.6
          - id: mutate-text
            phrase: "look at the text"
            targets:
              - mutate-text-mark
            color: cyan
            linger: 0.6
          - id: source-binding
            phrase: "Bind each score to the exact candidate sent"
            targets:
              - source-binding-mark
            color: cyan
            linger: 0.6
      - say: "The application supplied those access decisions. It rechecks access and revisions before scoring and again before packing. Here the account loses access after scoring, so the passage comes out. Before sending text to a hosted scorer, check that the application permits that processor to receive it."
        hold: 0.7
        visual_cues:
          - id: recheck-access
            phrase: "Here the account loses access after scoring"
            targets:
              - recheck-access-mark
            color: cyan
            linger: 0.6
          - id: disclosure-check
            phrase: "Before sending text to a hosted scorer"
            targets:
              - disclosure-check-mark
            color: cyan
            linger: 0.6
  - id: phrase-scorer
    title: "What earns a place in the prompt?"
    visual: "The four permitted passages carry their scores from search order into descending order. Only AUTH-14 clears the gate. The same rule then answers three requests under two different decisions."
    beats:
      - say: "The reference scorer is deliberately hand-written. It awards two for the endpoint phrase, three for the requested remedy, one for service accounts, two for the fourteen-day window and two for active auditing. It subtracts six for the troubleshooting disclaimer. The governing rule receives two plus one plus two plus two, totaling seven. The audit-export note gets two despite referring to a different action. Password reset gets zero. Troubleshooting gets minus one."
        hold: 0.7
        visual_cues:
          - id: endpoint-points
            phrase: "two for the endpoint phrase"
            targets: [terms]
            color: blue
          - id: actor-points
            phrase: "one for service accounts"
            targets: [terms]
            color: blue
          - id: window-points
            phrase: "two for the fourteen-day window"
            targets: [terms]
            color: yellow
          - id: audit-points
            phrase: "two for active auditing"
            targets: [terms]
            color: green
          - id: rule-seven
            phrase: "totaling seven"
            targets: [scores, terms]
            color: green
          - id: export-score
            phrase: "The audit-export note gets two"
            targets: [scores]
            color: blue
          - id: reset-score
            phrase: "Password reset gets zero"
            targets: [scores]
            color: blue
          - id: troubleshooting-score
            phrase: "Troubleshooting gets minus one"
            targets: [scores]
            color: blue
      - say: "Sort the four passages by score, highest first. If scores tie, use search rank, then chunk ID. A passage needs five points for a slot. Only the governing rule qualifies. Its parent, revision and exact text travel with it. The second slot stays empty."
        hold: 0.8
        caption_starts: ["A passage needs five points for a slot", "Only the governing rule qualifies", "The second slot stays empty"]
        visual_cues:
          - id: sort-fixture
            phrase: "Sort the four passages by score, highest first. If scores tie, use search rank, then chunk ID"
            targets: [order]
            color: blue
          - id: admission-five
            phrase: "Only the governing rule qualifies"
            targets: [slots]
            color: yellow
          - id: one-context
            phrase: "the second slot stays empty"
            targets: [slots]
            color: green
      - say: "The rule covers days zero through fourteen while audit logging is on. Move the request to day fifteen, or turn off logging on day ten. In both cases the rule still scores five. It earns a place in the prompt. Read the last column. Both requests are denied. The same passage explains each decision."
        hold: 1
        visual_cues:
          - id: day-fifteen
            phrase: "Move the request to day fifteen"
            targets: [rule, requests]
            color: yellow
          - id: audit-off
            phrase: "or turn off logging on day ten"
            targets: [requests]
            color: yellow
          - id: still-five
            phrase: "In both cases the rule still scores five"
            targets: [requests]
            color: green
            caption_boundary: true
          - id: policy-denial
            phrase: "Both requests are denied"
            targets: [requests, rule]
            color: yellow
            caption_boundary: true
  - id: scored-span
    title: "Where did the scorer stop reading?"
    visual: "A prefix cuts the hours clause off a library passage. The reader edition of AUTH-14 then supplies a literal two-input audit test and a replay with the readers swapped."
    beats:
      - say: "The Sunday hours are at the bottom of this building guide. Cut the scorer’s copy after the services line. The generator gets the whole page. Look below the cut. Only the generator can read that Sunday sentence."
        hold: 0.7
        visual_cues:
          - id: library-prefix
            phrase: "Cut the scorer’s copy after the services line"
            targets: [source]
            color: yellow
      - say: "Here’s a cut we can check word for word. In this version of the policy, the last four words are “audit logging is active.” Keep the first sixteen words for the scorer. Leave the complete rule for the generator. If we search each copy for the words “audit logging,” which reader has them?"
        hold: 2.8
        visual_cues:
          - id: read-rule
            phrase: "the last four words"
            targets: [source]
            color: green
          - id: cut-after-if
            phrase: "Keep the first sixteen words for the scorer"
            targets: [source, readers]
            color: yellow
          - id: inspect-both
            phrase: "which reader has them"
            targets: [source, readers]
            color: yellow
      - say: "The scorer gets false. The generator gets true. The prefix ends on “if.” The score describes an unfinished sentence. Reverse the two inputs. Now the scorer sees the condition and the generator loses it. The two recorded spans show exactly where the condition disappeared."
        hold: 1
        caption_starts: ["The generator gets true", "Reverse the two inputs"]
        visual_cues:
          - id: prefix-result
            phrase: "The scorer gets false"
            targets: [readers]
            color: yellow
            caption_boundary: true
          - id: check-texts
            phrase: "The generator gets true"
            targets: [readers]
            color: cyan
            caption_boundary: true
          - id: swap-spans
            phrase: "Reverse the two inputs"
            targets: [readers]
            color: yellow
  - id: scored-token-ledger
    title: Reserve query and special tokens before cutting a document
    visual: The 24-position example reserves space for the query and special tokens, then compares
      scored and packed token digests.
    beats:
      - say: "Fill this row with the text the scorer can read. For this count, lowercase the text and split it on whitespace. Each word gets one position. The pair capacity is twenty-four. Reserve three positions for special tokens. Keep the entire eleven-token query first. That leaves ten document tokens. Background fills those ten positions, so the scored prefix omits the decisive clause. The generator receives the whole passage."
        hold: 0.7
        caption_starts: ["That leaves ten document tokens"]
        visual_cues:
          - id: toy-capacity
            phrase: The pair capacity is twenty-four
            targets:
              - toy-capacity-mark
            color: cyan
            linger: 0.6
          - id: query-eleven
            phrase: Keep the entire eleven-token query first
            targets:
              - query-eleven-mark
            color: cyan
            linger: 0.6
          - id: document-ten
            phrase: That leaves ten document tokens
            targets:
              - document-ten-mark
            color: cyan
            linger: 0.6
          - id: governing-omitted
            phrase: the scored prefix omits the decisive clause
            targets:
              - governing-omitted-mark
            color: cyan
            linger: 0.6
      - say: "The normalized token-list digests differ. The scorer saw the prefix and the generator got the whole rule. This fixture’s release gate refuses that mismatch. Lowercasing treats “Audit” and “audit” as the same word. To recover exactly what each model read, record the immutable source revision, exact scored text and kept span separately from token counts. Count positions with each model’s own tokenizer and template."
        hold: 0.7
        visual_cues:
          - id: span-digests
            phrase: The normalized token-list digests differ
            targets:
              - span-digests-mark
            color: cyan
            linger: 0.6
          - id: mismatch-reject
            phrase: this fixture’s release gate refuses that mismatch
            targets:
              - mismatch-reject-mark
            color: cyan
            linger: 0.6
          - id: source-token-separation
            phrase: Record the immutable source revision, exact scored text and kept span separately
            targets:
              - source-token-separation-mark
            color: cyan
            linger: 0.6
      - say: "A declared window or parent expansion can be valid if the trace names its scope. A maximum over
          more windows gives a long document more chances to obtain a high score and can separate a
          qualification from its rule. Keep the necessary surrounding conditions. Also test the reverse
          mismatch: scoring a complete passage and then packing a prefix can remove the evidence that
          earned the score."
        hold: 0.7
        visual_cues:
          - id: window-scope
            phrase: A declared window or parent expansion
            targets:
              - window-scope-mark
            color: cyan
            linger: 0.6
          - id: window-opportunities
            phrase: A maximum over more windows
            targets:
              - window-opportunities-mark
            color: cyan
            linger: 0.6
          - id: reverse-truncation
            phrase: scoring a complete passage and then packing a prefix
            targets:
              - reverse-truncation-mark
            color: cyan
            linger: 0.6
  - id: learned-policy-check
    title: Two requests at the same checkpoint
    visual: The article’s recorded MiniLM results pair each request with the highest-ranked rule and its policy outcome. A fixed 512-position boundary explains the equal scores on a separate pair of long inputs.
    beats:
      - say: The article also runs a trained MiniLM scorer on the four reader-edition passages. For day ten with active logging, the governing rule scores nine point one three and ranks first. Change the request to day fifteen with logging disabled. It still ranks first at eight point five six. Both numbers are raw logits. The rule answers both questions, even though it permits the first request and denies the second.
        hold: 0.7
        visual_cues:
          - id: actual-model
            phrase: a trained MiniLM scorer
            targets:
              - actual-model-mark
            color: cyan
            linger: 0.6
          - id: model-allow
            phrase: the governing rule scores nine point one three
            targets:
              - model-allow-mark
            color: cyan
            linger: 0.6
          - id: model-deny
            phrase: it still ranks first at eight point five six
            targets:
              - model-deny-mark
            color: cyan
            linger: 0.6
          - id: changed-request
            phrase: Change the request to day fifteen with logging disabled
            targets: [changed-request-mark]
            color: yellow
      - say: This checkpoint accepts five hundred twelve positions. A separate example repeats the same permissive sentence eighty times, then appends the audit requirement to one copy. Tokenizing both pairs up to the limit produces identical input-token IDs. Both rounded scores are three point zero six. The added condition was outside the input the model could read.
        hold: 0.7
        visual_cues:
          - id: limit-512
            phrase: This checkpoint accepts five hundred twelve positions
            targets:
              - limit-512-mark
            color: cyan
            linger: 0.6
          - id: append-condition
            phrase: then appends the audit requirement
            targets:
              - append-condition-mark
            color: cyan
            linger: 0.6
          - id: same-input-ids
            phrase: produces identical input-token IDs
            targets:
              - same-input-ids-mark
            color: cyan
            linger: 0.6
          - id: same-score
            phrase: Both rounded scores are three point zero six
            targets:
              - same-score-mark
            color: cyan
            linger: 0.6
      - say: Keep the immutable weights and tokenizer fingerprints with that replay so another person can identify the scored inputs. Measure serving latency separately on your workload. To test quality, change one condition at a time across labeled questions. Correct context with an unsupported affirmative answer points to the way the generator interpreted the rule.
        hold: 0.7
        visual_cues:
          - id: immutable-model
            phrase: Keep the immutable weights and tokenizer fingerprints
            targets:
              - immutable-model-mark
            color: cyan
            linger: 0.6
          - id: no-speed-inference
            phrase: Measure serving latency separately on your workload
            targets:
              - no-speed-inference-mark
            color: cyan
            linger: 0.6
          - id: downstream-repair
            phrase: Correct context with an unsupported affirmative answer
            targets:
              - downstream-repair-mark
            color: cyan
            linger: 0.6
  - id: ranking-losses
    title: What does a wrong order cost?
    visual: "The hours slip and the story time slip each mark a binary loss curve. On a second curve, their score gap moves through zero as the two logits trade places. At search time the same scorer reads each slip separately."
    beats:
      - say: "For the Sunday question, opening hours is relevant and story time is irrelevant. Suppose hours scores one point two and story time scores point two. Read the curves from left to right. A higher logit lowers the loss for hours. It raises the loss for story time. Each loss is the negative log of the probability the model assigned to the training label. Averaging these two losses gives about point five three one."
        hold: 0.7
        caption_starts: ["Suppose hours scores one point two", "Read the curves from left to right", "Averaging these two losses gives about point five three one"]
        visual_cues:
          - id: loss-pairs
            phrase: "Suppose hours scores one point two and story time scores point two"
            targets:
              - loss-pairs-mark
            color: cyan
            linger: 0.6
          - id: higher-hours
            phrase: "A higher logit lowers the loss for hours"
            targets: [higher-hours-mark]
            color: green
          - id: higher-events
            phrase: "It raises the loss for story time"
            targets: [higher-events-mark]
            color: pink
          - id: binary-loss
            phrase: Averaging these two losses gives about point five three one
            targets:
              - binary-loss-mark
            color: cyan
            linger: 0.6
      - say: "Now compare the order of the same two slips. Subtract the story time score from the hours score. Hours leads by one. Find that gap on the curve. The loss is about point three one three. Swap the scores. Follow the dot as it crosses zero and climbs the curve. With story time ahead by one, the loss reaches about one point three one three. This pairwise loss rewards the scorer for putting the useful passage first."
        hold: 0.7
        caption_starts: ["The loss is about point three one three", "Swap the scores", "With story time ahead by one", "the loss reaches about one point three one three"]
        visual_cues:
          - id: score-gap
            phrase: "Subtract the story time score from the hours score"
            targets:
              - score-gap-mark
            color: cyan
            linger: 0.6
          - id: gap-loss
            phrase: The loss is about point three one three
            targets:
              - gap-loss-mark
            color: cyan
            linger: 0.6
          - id: swap-gap
            phrase: "Swap the scores. Follow the dot as it crosses zero and climbs the curve. With story time ahead by one, the loss reaches about one point three one three"
