        visual_cues:
          - id: packed-clause
            phrase: "its complete Sunday sentence reached the assistant"
            targets: [source]
            color: green
          - id: sample-answer
            phrase: "Yes. The library is open on Sunday"
            targets: [reply]
            color: blue
            caption_boundary: true
          - id: diagnose-reply
            phrase: "Which stage first contradicts the source"
            targets: [source, reply, diagnosis]
            color: yellow
      - say: "The reply does. A supported answer is “No. The library is closed on Sunday.” The passage was relevant precisely because it settled the question. Keep the scored span, source revision, scorer version and packed text in the trace. Here they let you take the faulty claim straight to answer evaluation."
        hold: 1
        visual_cues:
          - id: correct-answer
            phrase: "No. The library is closed on Sunday"
            targets: [source, reply]
            color: green
            caption_boundary: true
