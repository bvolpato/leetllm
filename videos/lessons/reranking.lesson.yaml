  - id: token-score-contracts
    title: "How does this checkpoint use the logits?"
    visual: "The yes weight stays fixed as the denominator grows from two tokens to three. A separate pair of passages then reverses order when the score changes from yes alone to yes minus no."
    beats:
      - say: "What counts as a score depends on the checkpoint. Mono T five runs an encoder and a decoder and compares its true and false target tokens. The Qwen three reranker example reads lowercase yes and no at the last prompt position. When each label is one token at that same position, their log odds are the yes logit minus the no logit. The binary yes score is the sigmoid of that difference."
        hold: 0.7
        visual_cues:
          - id: token-rule
            phrase: "The binary yes score is the sigmoid of that difference"
            targets: [position]
            color: green
      - say: "Give this position three possible tokens. Yes gets a logit of two, no gets one, and other gets three. Exponentiate each to get the weights on screen. First divide the yes weight by just the yes and no weights added together. Its share is point seven three one. Put other back into the denominator. Will yes get a larger share or a smaller one?"
        hold: 2.7
        visual_cues:
          - id: toy-logits
            phrase: "three possible tokens"
            targets: [masses]
            color: blue
