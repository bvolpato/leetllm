  - id: late-maxsim
    title: "Which token wins each comparison?"
    visual: "The two query directions pick independent document-token matches. The viewer can compare each row of dot products before its winner appears in the maximum column. A later centroid sketch shows which comparisons the example can prune."
    beats:
      - say: "There’s a middle ground between storing one vector per passage and reading the whole passage with the question. ColBERT stores one contextual vector per document token. When the query arrives, each query token can find its own best match among them. Original ColBERT uses unit vectors, so a dot product gives their cosine similarity. The number of coordinates depends on the configuration."
        hold: 0.8
        visual_cues:
          - id: token-storage
            phrase: "stores one contextual vector per document token"
            targets: [token-storage-mark]
            color: blue
          - id: row-maxima
            phrase: "each query token can find its own best match"
            targets: [row-maxima-mark]
            color: cyan
      - say: "These three arrows are invented unit vectors for document tokens. Our first query vector points due right. Read the horizontal coordinate of each arrow across the first row. The blue arrow reaches farthest right, so its dot product wins at point nine. The second query vector points straight up. Read the vertical coordinates across row two. The blue arrow’s height is the square root of point one nine, rounded here. Which token wins row two? Add its value to the first winner."
        hold: 3
        visual_cues:
          - id: maxsim-vectors
            phrase: "Read the horizontal coordinate"
            targets: [maxsim-vectors-mark]
            color: blue
          - id: maxsim-first
            phrase: "its dot product wins at point nine"
            targets: [maxsim-first-mark]
            color: green
          - id: second-row
            phrase: "Read the vertical coordinates"
            targets: [maxsim-vectors-mark]
            color: blue
      - say: "The second document token wins at point eight. Add point nine and point eight to get one point seven. That sum of row maxima is MaxSim. Both rows are free to choose the same document token if it has the best dot product for each."
        hold: 0.8
        caption_starts: ["to get one point seven"]
        visual_cues:
          - id: maxsim-second
            phrase: "The second document token wins at point eight"
            targets: [maxsim-second-mark]
            color: green
            caption_boundary: true
          - id: maxsim-sum
            phrase: "Add point nine and point eight to get one point seven"
            targets: [maxsim-sum-mark]
            color: cyan
            caption_boundary: true
      - say: "Picking independently saves us a joint model pass, but all those token vectors take space. ColBERT version two stores compressed residuals relative to centroids. Its study reported a sixfold to tenfold space reduction. PLAID uses centroids to prune candidates before full scoring. In our sketch, discarding the third arrow leaves both winners intact and cuts six comparisons to four. Measure the space, speed and quality on your own index."
        hold: 0.8
