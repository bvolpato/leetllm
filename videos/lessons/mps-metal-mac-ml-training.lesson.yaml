            color: cyan
  - id: shape-and-step
    title: What did one training step establish?
    visual: Each of four input rows keeps its label through pooling and scoring. A gradient appears before
      the weight changes. The last beat distinguishes the checks in the article from measurements on a Mac.
    beats:
      - say: The article uses seeded random features to stand in for encoded text. A tokenizer would give you
          integer IDs. Follow the four tickets. Averaging the eight positions leaves four rows of sixteen
          features. The linear layer returns four rows of three scores. Each row still goes with the same
          label. To budget raw float32 input, multiply the dimensions and allow four bytes per value.
          That’s two kibibytes for this entire batch.
        hold: 0.75
        visual_cues:
          - id: shape-and-step-b1
            phrase: seeded random features
            targets:
              - shape-and-step-mechanism
            color: cyan
            linger: 0.55
          - id: mps-contract-pool
            phrase: four rows of sixteen features
            targets:
              - mps-contract-shapes
            color: yellow
            linger: 0.5
          - id: mps-contract-logits
            phrase: four rows of three scores
            targets:
              - mps-contract-shapes
            color: yellow
            linger: 0.5
          - id: mps-contract-bytes
            phrase: two kibibytes for this entire batch
            targets:
              - mps-contract-bytes
            color: yellow
            linger: 0.5
      - say: The labels are zero, two, one and zero. Watch the weight while backward fills the gradient buffer.
          The weight is still at its old value. Now the optimizer changes the weight, using a learning rate
          of one tenth. We can check that the weight matrix changed and the loss before the update was
          finite. Even shuffled labels or wrong gradients can pass both checks. To see whether routing
          improved, try held-out tickets.
        hold: 0.75
        visual_cues:
          - id: shape-and-step-b2
            phrase: The labels are zero, two, one and zero
            targets:
              - shape-and-step-mechanism
            color: cyan
            linger: 0.55
