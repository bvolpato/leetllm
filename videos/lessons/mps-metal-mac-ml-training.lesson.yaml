      - say: Watch the first column. The highlighted values build the first mean. Even the smallest and largest
          values sit equally far from that average. Repeat the calculation for each column. The position
          axis disappears. Each ticket keeps sixteen features, and it keeps its place in the batch.
        hold: 0.65
        motion_check:
          region:
            - 170
            - 410
            - 1575
            - 390
          minimumChangedFraction: 0.006
        visual_cues:
