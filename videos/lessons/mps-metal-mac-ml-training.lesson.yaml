scenes:
  - id: opening
    title: Which line stops on this Mac?
    visual: The mean and the classifier call sit above their operands. Eight rows for one input fold into a CPU vector that stops at the MPS weights. The two device readouts stay visible beside the repair.
    beats:
      - say: Average the positions in this CPU batch. For each input, eight rows fold into one.
          Pass that vector to the classifier. Its weights are on MPS, the Mac’s GPU. Will this call succeed?
        hold: 2.2
        motion_check:
          region:
            - 250
            - 542
            - 480
            - 229
          minimumChangedFraction: 0.008
        visual_cues:
          - id: opening-mean
            phrase: Average the positions in this CPU batch. For each input, eight rows fold into one
            targets: [mean-call, batch-device, ticket-journey]
            color: blue
          - id: opening-linear
            phrase: Pass that vector to the classifier
            targets: [ticket-journey, score-call]
            color: blue
          - id: opening-score-line
            phrase: Its weights are on MPS
            targets: [weight-device]
            color: cyan
      - say: PyTorch stops at the linear layer. The mean used only CPU values.
          The classifier needs its input and weights on the same device, even on a Mac with shared memory.
          Move the batch to the weights’ device and keep the returned tensor. Its mean will be on the GPU too.
        hold: 1.2
        caption_starts:
          - Move the batch to the weights’ device
        visual_cues:
          - id: failed-call
            phrase: PyTorch stops at the linear layer
            targets: [device-mismatch, score-call]
            color: pink
            linger: 0.6
          - id: opening-repair
            phrase: Move the batch to the weights’ device and keep the returned tensor
            targets: [placement-fix]
            color: cyan
  - id: backend
    title: Open the Mac's GPU path
    visual: A dispatch marker follows the PyTorch, MPS, and Metal layers. The composition changes to a
      build/runtime decision, showing why a known backend can still be unavailable.
    beats:
      - say: The letters on those weights are PyTorch’s name for the Apple GPU backend. When Python dispatches
          the tensor work, the backend can use Metal Performance Shaders, Apple’s optimized GPU operations.
          Metal supplies the underlying compute framework. Python itself keeps running on the CPU.
        hold: 0.5
        motion_check:
          region:
            - 290
            - 270
            - 1260
            - 600
          minimumChangedFraction: 0.002
        visual_cues:
          - id: dispatch-stack
            phrase: dispatches the tensor work
            targets:
              - backend-stack
            color: yellow
      - say: A build can include MPS even when the runtime is unavailable. Those two checks ask different
          questions. When both checks succeed, our program can put the classifier on the GPU.
        hold: 0.6
        visual_cues:
          - id: built-capability
            phrase: build can include MPS
            targets:
              - build-check
            color: green
          - id: runtime-closed
            phrase: runtime is unavailable
            targets:
              - availability-check
            color: pink
          - id: runtime-open
            phrase: both checks succeed
            targets:
              - availability-check
              - backend-route
            color: green
  - id: release-prerequisites
    title: Which installation can run this ticket?
    visual: Two versioned setup records lead to the machine checks and three possible build and runtime results.
    beats:
      - say: A colleague can import PyTorch on their Mac, but moving a tensor to the GPU fails. Start with
          their release. For PyTorch two point eleven, Apple lists a Mac with Apple silicon, macOS
          fourteen or later, Python three point ten or later, and Xcode command-line tools. The macOS
          fifteen example on the right comes from a different PyTorch release, two point fifteen.
        hold: 0.65
        visual_cues:
          - id: release-prerequisites-b1
            phrase: Start with their release
            targets:
              - release-prerequisites-mechanism
            color: cyan
            linger: 0.55
      - say: Check their developer tools, Python version and macOS version. Choose Mac, Pip and Python in
          the installer. For a specific PyTorch release, check that its macOS wheel matches the Python
          version and architecture of their interpreter. Try that wheel in a project virtual environment.
        hold: 0.55
        visual_cues:
          - id: release-prerequisites-b2
            phrase: Check their developer tools, Python version and macOS version
            targets:
              - release-prerequisites-mechanism
            color: cyan
            linger: 0.55
      - say: Read the two results from left to right. If the build check is false, inspect the wheel. If only the
          runtime check is false, keep the CPU route while you check hardware, macOS and runtime access. An
          available runtime permits MPS placement. Apple labels this backend beta. Keep the version with
          the first failing operation when you report it.
        hold: 0.75
        visual_cues:
          - id: release-prerequisites-b3
            phrase: Read the two results from left to right
            targets:
              - release-prerequisites-mechanism
            color: cyan
            linger: 0.55
          - id: mps-runtime-ready
            phrase: An available runtime permits MPS placement
            targets:
              - release-prerequisites-mechanism
            color: yellow
            linger: 0.5
  - id: shared-pool
    title: Shared hardware, explicit tensor placement
    visual: Separate host RAM and discrete GPU VRAM become a single large Apple silicon pool. The CPU ticket
      allocation and MPS weights remain separately labeled within that pool.
    beats:
      - say: Think back to a discrete GPU. The CPU puts the ticket in system RAM. To place it on that card, its
          features have to cross into video memory. Now look at the Mac.
        hold: 0.5
      - say: The two processors draw from one physical pool. Look at the different device tags. The ticket
          is on CPU and the weights are on MPS. Those tags help PyTorch choose an implementation.
          The mean can run on CPU. The linear layer needs its input and weights on compatible devices.
        hold: 0.7
        visual_cues:
          - id: shared-physical-pool
            phrase: one physical pool
            targets:
              - one-memory-pool
            color: green
          - id: distinct-device-tags
            phrase: different device tags
            targets:
              - cpu-allocation
              - mps-allocation
            color: yellow
  - id: assignment
    title: Which tensor does batch name?
    visual: A four-by-eight CPU array remains in the shared pool as the same features fill a second
      allocation. A reference named batch switches sides only after assignment.
    beats:
      - say: Keep the CPU tensor under the name source. For now, batch points there too. Save the result of the
          device move as placed. Watch the features arrive in a new allocation. The original CPU tensor
          still exists. Each copy holds two kibibytes of raw features. Which copy would the mean read
          if we used batch now? Could the classifier on MPS score that vector?
        hold: 2
        motion_check:
          region:
            - 1100
            - 485
            - 555
            - 190
          minimumChangedFraction: 0.01
        visual_cues:
          - id: returned-copy
            phrase: Watch the features arrive in a new allocation
            targets:
              - returned-mps-tensor
            color: cyan
            linger: 0.3
          - id: original-remains
            phrase: original CPU tensor still exists
            targets:
              - original-cpu-tensor
            color: blue
      - say: The yellow name still points to CPU. The mean would give us a CPU vector, and the classifier
          would fail at the linear layer. Both copies are alive, so the raw features take four kibibytes
          together. Assign the return value to batch. Now the mean reads the MPS copy and the classifier
          can score its vector. A tensor’s device-changing call returns a copy. Moving a module updates
          the module in place and moves its registered parameters and buffers to the requested device. That’s how our classifier
          got there while its input was still on CPU.
        hold: 0.65
        caption_starts:
          - The yellow name still points to CPU
        visual_cues:
          - id: assign-return
            phrase: Assign the return value to batch
            targets:
              - batch-binding
              - assignment-code
            color: yellow
  - id: device-identity
    title: Read the device on each operand
    visual: An indexless request and an indexed tensor device are compared beside the batch and parameter.
      Several illustrated core groups occupy one logical GPU.
    beats:
      - say: If your check still fails, read the actual parameter and batch devices. MPS with no index requests
          the default GPU. MPS colon zero names an indexed device. Those device objects can compare unequal
          even when both select the same GPU. For this single-device model, use the parameter’s own device
          as the destination for each batch tensor, including the labels.
        hold: 0.7
        visual_cues:
          - id: device-identity-b1
            phrase: read the actual parameter and batch devices
            targets:
              - device-identity-mechanism
            color: cyan
            linger: 0.55
      - say: Look inside that device. Several core groups can execute work on the same GPU. PyTorch counts
          available MPS devices. A CUDA recipe that expects several cards needs a framework and
          communication backend that support that arrangement. Apple’s MLX takes a different approach and
          selects where operations run on shared arrays. Our copy and assignment rule belongs to PyTorch.
        hold: 0.75
        visual_cues:
          - id: device-identity-b2
            phrase: Several core groups can execute work on the same GPU
            targets:
              - device-identity-mechanism
            color: cyan
            linger: 0.55
  - id: pooling
    title: Follow one feature through eight positions
    visual: One ticket's eight encoded position vectors fill the frame. The next composition magnifies one
