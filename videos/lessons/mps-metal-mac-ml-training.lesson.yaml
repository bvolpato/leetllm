            color: yellow
            linger: 0.5
          - id: mps-contract-step
            phrase: the optimizer changes the weight
            targets:
              - mps-contract-buffers
            color: yellow
            linger: 0.5
      - say: The article shows the expected shapes, a changed weight matrix and a finite loss. To test
          the Apple GPU path, repeat the complete step on your Mac. Record the actual devices for the
          model, inputs and labels. Keep the PyTorch version, dtype and shape with those results.
        hold: 0.65
        visual_cues:
          - id: shape-and-step-b3
            phrase: The article shows the expected shapes
            targets:
              - shape-and-step-mechanism
            color: cyan
            linger: 0.55
  - id: fallback
    title: Where does operation U execute?
    visual: Ticket 1 stops at a modeled missing MPS kernel. Enabling process-start fallback opens a CPU
      branch and the ticket follows the complete CPU-return route before the next MPS operation.
    beats:
      - say: Suppose one operation in our placed classifier lacks an MPS kernel in this PyTorch build. The input
          and weights already agree. Moving either one again won’t supply the missing implementation.
        hold: 0.55
        motion_check:
          region:
            - 550
            - 340
            - 220
            - 110
          minimumChangedFraction: 0.003
        visual_cues:
          - id: missing-operator
            phrase: lacks an MPS kernel
            targets:
              - missing-kernel
            color: pink
      - say: If that operation has a working CPU fallback, enable the flag before importing PyTorch. The ticket
          detours through the CPU and returns to MPS. That can mean waiting and converting data on both
          sides, even in shared memory. How much time can one detour add?
        hold: 1.25
        motion_check:
          region:
            - 840
            - 490
            - 840
            - 420
          minimumChangedFraction: 0.003
        visual_cues:
