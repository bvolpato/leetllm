            color: cyan
  - id: score
    title: Build one class score
    visual: A single ticket vector meets the Billing weight vector. The view cuts to one active
      feature-weight product and a signed contribution strip that accumulates into the Billing score.
    beats:
      - say: The refund now has sixteen numbers. To get its Billing score, pair each pooled feature with the
          weight that Billing gives it. Some weights pull the score up. Others pull it down.
        hold: 0.5
        visual_cues:
          - id: feature-weight-pairs
            phrase: pair each pooled feature
            targets:
              - feature-vector
              - class-weights
            color: yellow
      - say: Start with the bias. Watch the sixteen products arrive one by one in the accumulator.
          See the two flat marks? Billing gives those features zero weight. Adding either product leaves
          the running sum where it was. The final sum is Billing’s class score. Now we need the other two.
        hold: 0.6
        motion_check:
          region:
            - 250
            - 440
            - 1420
            - 470
          minimumChangedFraction: 0.008
        visual_cues:
          - id: sum-products
            phrase: sixteen products arrive one by one in the accumulator
            targets:
              - active-product
              - score-accumulator
            color: yellow
            linger: 0.3
  - id: probabilities
    title: Where would this refund go?
    visual: Three large class scores become probability bars. The correct Billing route is highlighted
      independently from the model's highest Login score, then one-ticket cross-entropy appears.
    beats:
      - say: Run the same calculation with the Delivery and Login weights. Login just edges ahead. Softmax turns
          them into an almost even probability split. Even the leading class gets only about a third of the
          probability.
        hold: 0.7
        visual_cues:
          - id: probability-bars
            phrase: Softmax turns them into an almost even probability split
            targets:
              - probability-bars
            color: cyan
            linger: 0.3
      - say: The customer asked for a refund, so the training label is Billing. Cross-entropy measures how much
          probability the model gave that label by taking its negative log. Moving probability toward
          Billing would lower this ticket’s loss, even before Billing takes the lead.
        hold: 0.65
        visual_cues:
          - id: correct-route-loss
            phrase: Cross-entropy measures how much probability
            targets:
              - ticket-loss
            color: yellow
  - id: batch-update
