  - id: dtype-allocation
    title: Can this pair reach the GPU?
    visual: Follow the floating features through the allocation check. A separate row carries the class indices through placement with their integer dtype intact.
    beats:
      - say: Here’s another failure that can look like a missing kernel. NumPy supplies two floating-point
          features in double precision. PyTorch keeps that dtype when it wraps the array. In PyTorch two
          point fourteen point one, MPS rejects float64 before creating the device tensor. There’s no
          tensor for an operator fallback to use.
        hold: 0.7
        visual_cues:
          - id: dtype-allocation-b1
            phrase: two floating-point features in double precision
            targets:
              - dtype-allocation-mechanism
            color: cyan
            linger: 0.55
          - id: mps-dtype-reject
            phrase: rejects float64 before creating the device tensor
            targets:
              - mps-dtype-gate
            color: yellow
            linger: 0.5
      - say: If the calculation needs double precision, keep it on CPU. Otherwise, convert floating features to a
          supported dtype before placement. Keep this classifier’s class indices in torch long,
          PyTorch’s sixty-four-bit integer dtype. The float32 features can now reach MPS.
          Did the cast keep the difference between them?
        hold: 1.45
        visual_cues:
          - id: dtype-allocation-b2
            phrase: If the calculation needs double precision
            targets:
              - dtype-allocation-mechanism
            color: cyan
            linger: 0.55
          - id: mps-dtype-convert
            phrase: Convert floating features to a supported dtype before placement
            targets:
              - mps-dtype-gate
            color: yellow
            linger: 0.5
          - id: class-index-dtype
            phrase: Keep this classifier’s class indices in torch long
            targets: [mps-dtype-gate]
            color: blue
  - id: precision
    title: Two inputs on the float32 ruler
    visual: Two float64 inputs land on one float32 tick. A division explains the even and odd labels. The yellow input slides to a second midpoint. Brackets compare its distance from blue before and after casting.
    beats:
      - say: The lower ruler has a tick at two to the twenty-fourth. The next float32 value is two units away.
          One feature sits on the left tick. The other is exactly halfway to the next tick. Predict whether
          these adjacent integers survive the cast as two different values.
        hold: 2
        visual_cues:
          - id: cast-prediction
            phrase: Predict whether these adjacent integers survive
            targets:
              - precision-question
            color: yellow
      - say: Follow both markers down to the float32 ruler. Both round to the same number.
          The yellow feature started halfway between ticks. This cast rounds to the nearest float32 value.
          It breaks ties by choosing the even significand. Here the ticks are two units apart.
          Divide the left tick by two to see its integer significand. It ends in eight, so it’s even.
          Take one tick to the right and the significand goes up by one.
        hold: 0.9
        caption_starts:
          - Both round to the same number
        motion_check:
          region:
            - 370
            - 428
            - 640
            - 350
          minimumChangedFraction: 0.007
        visual_cues:
          - id: rounding-snap
            phrase: Follow both markers down to the float32 ruler
            targets:
              - rounding-points
            color: pink
            linger: 0.3
          - id: rounding-result
            phrase: Both round to the same number
            targets: [precision-question]
            color: cyan
            caption_boundary: true
          - id: even-significands
            phrase: Divide the left tick by two
            targets: [parity-key]
            color: blue
      - say: Slide the yellow input to the next gap. It’s halfway again. Which neighbor has the even significand this time?
        hold: 2.15
        visual_cues:
          - id: move-midpoint
            phrase: Slide the yellow input to the next gap
            targets: [rounding-points]
