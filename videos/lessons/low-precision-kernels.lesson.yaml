scenes:
  - id: intro
    title: What reaches the multiplier?
    visual: A blue strip shows an incoming activation of 500. A single division spans the previous
      peak of 10. The encoder fills eight bit cells, then the multiplier reads the byte with its scale.
    beats:
      - say: Five hundred goes into the FP8 encoder. The last batch peaked at ten, just one blue division.
          Keep that batch's scale.
        hold: 0.6
        visual_cues:
          - id: intro-spike
            phrase: The last batch peaked at ten
            targets:
              - peak-ruler
            color: blue
            linger: 0.15
      - say: Ten already maps to the largest finite value, four hundred forty-eight. Five hundred clips
          to that same value. Multiply by the scale on screen. What value reaches the multiplier?
        hold: 2.7
        caption_starts:
          - Five hundred clips to that same value
          - What value reaches the multiplier
        visual_cues:
          - id: intro-cap
            phrase: Five hundred clips to that same value
            targets:
              - peak-code
            color: yellow
            linger: 0.15
          - id: intro-question
            phrase: What value reaches the multiplier
            targets:
              - peak-product
              - peak-code
            color: cyan
            linger: 0.15
      - say: Only ten comes back. Five hundred went in. That's a ninety-eight percent loss, and a check for
          infinity or NaN would pass. Even a kernel that accumulates in FP32 starts with this ten.
        hold: 1.1
        caption_starts:
          - That's a ninety-eight percent loss
        visual_cues:
          - id: intro-read
            phrase: Only ten comes back
            targets:
              - peak-product
            color: cyan
            linger: 0.15
            caption_boundary: true
          - id: intro-loss
            phrase: That's a ninety-eight percent loss
            targets:
              - peak-ruler
            color: pink
            linger: 0.15
  - id: stale-scale
    title: One stored value, two scales
    visual: The ruler uses the same activation units. Two conversions of the same 500 keep their pre-cast inputs,
      stored values and reconstructions aligned. Measuring the current maximum changes the upper end
      of the encodable interval.
    beats:
      - say: Divide five hundred by the old scale. That's twenty-two thousand four hundred before the cast.
          Saturation maps that whole overshoot to the same ceiling value, four hundred forty-eight.
        hold: 0.7
        visual_cues:
          - id: stale-divide
            phrase: twenty-two thousand four hundred before the cast
            targets:
              - previous-conversion
            color: yellow
            linger: 0.15
      - say: This time measure today's maximum. Use five hundred over four hundred forty-eight as the scale.
          The same input now lands exactly at the last slot. Both runs sent the same byte. What will
          it mean with the new scale?
        hold: 2.3
        visual_cues:
          - id: stale-measure
            phrase: measure today's maximum
            targets:
              - scale-range
            color: yellow
            linger: 0.15
      - say: It now means five hundred. The difference is in the scale that traveled with the byte. Keep the
          scale and the value before the cast if you need to tell an exact fit from a clipped peak.
        hold: 0.95
        visual_cues:
          - id: stale-restored
            phrase: It now means five hundred
            targets:
              - current-conversion
            color: cyan
            linger: 0.15
            caption_boundary: true
  - id: format-budget
    title: What fits in the byte?
    visual: Aligned bit cells compare storage width and field widths. Two rulers show FP8 spacing near 1.
      The same bytes are decoded under both E4M3 biases.
    beats:
      - say: The ceiling of four hundred forty-eight belongs to a particular format. Look at the two shorter
          strips. Both store sixteen bits. BF16 keeps the eight exponent bits of FP32 and trims its
          fraction from twenty-three bits to seven. FP16 spends ten bits on the fraction and just five
          on the exponent. That buys closer neighbors, but its finite range ends at sixty-five
          thousand five hundred four.
        hold: 0.6
        visual_cues:
          - id: lp-format-budget-build-0
            phrase: Both store sixteen bits. BF16 keeps the eight exponent bits of FP32 and trims its fraction
              from twenty-three bits to seven. FP16 spends ten bits on the fraction and just five on
              the exponent.
            targets:
              - lp-format-budget-trace
            color: cyan
            linger: 0.45
      - say: TF32 keeps the whole FP32 value in memory. A supported matrix instruction uses ten fraction bits.
          Now look at the eight-bit strips. Both keep one sign bit. E4M3 spends four bits on the
          exponent and three on the fraction. E5M2 gives one more bit to the exponent. Their biases
          are seven and fifteen. Their finite ceilings are four hundred forty-eight and fifty-seven
          thousand three hundred forty-four. That extra range is one reason training recipes often use
          E5M2 for gradients and E4M3 for forward operands.
        hold: 0.6
        visual_cues:
          - id: lp-format-budget-build-1
            phrase: look at the eight-bit strips
            targets:
              - lp-format-budget-trace
            color: cyan
            linger: 0.45
          - id: lp-format-budget-limits
            phrase: Their finite ceilings are four hundred forty-eight and fifty-seven thousand three hundred
              forty-four
            targets:
              - lp-format-budget-trace
            color: yellow
            linger: 0.45
      - say: Between one and two, E4M3 has eight spaces. E5M2 has four. The steps are one eighth and one
          quarter. In any normal binary interval, divide the value at its lower end by two raised to
          the fraction-bit count. The rounding error also depends on where your input lands. Even
          normalized activations can span a wide range. Apply layer normalization to a row with one
          nonzero entry among a thousand and twenty-four. With epsilon set to zero and before the
          affine step, its magnitude is about thirty-two.
        hold: 0.6
        visual_cues:
          - id: lp-format-budget-build-2
            phrase: Between one and two, E4M3 has eight spaces. E5M2 has four
            targets:
              - lp-format-budget-trace
            color: cyan
            linger: 0.45
          - id: lp-format-budget-spacing
            phrase: The steps are one eighth and one quarter
            targets:
              - lp-format-budget-trace
            color: yellow
            linger: 0.45
          - id: lp-format-budget-norm
            phrase: its magnitude is about thirty-two
            targets:
              - lp-format-budget-trace
            color: yellow
            linger: 0.45
      - say: Read the sign, subtract the bias from the stored exponent, and multiply the resulting power of
          two by one plus the fraction integer over eight. Here the exponent field is seven and the
          fraction is zero. OCP E4M3 reads one. FNUZ subtracts eight, so it reads a half. For the byte
          hex eighty, the OCP reader sees negative zero. The FNUZ reader reserves that byte for NaN.
        hold: 0.6
        visual_cues:
          - id: lp-format-budget-build-3
            phrase: Here the exponent field is seven and the fraction is zero
            targets:
              - lp-format-budget-trace
            color: cyan
            linger: 0.45
          - id: lp-format-budget-bias
            phrase: The FNUZ reader reserves that byte for NaN
            targets:
              - lp-format-budget-trace
            color: yellow
            linger: 0.45
  - id: number-grid
    title: Which neighbor wins a tie?
    visual: A probe moves between exact decoded E4M3 values. At consecutive midpoints the low bit selects
      opposite neighbors. The ruler widens at the next exponent boundary.
    beats:
      - say: Look between one and one and an eighth. You can move the yellow input a little to the right, but
          the nearest E4M3 tick is still one. Three fraction bits give us only eight steps over this
          interval. The input can change while its stored byte stays put.
        hold: 0.65
        visual_cues:
          - id: number-grid-beat-1-focus-1
            phrase: move the yellow input a little to the right
            targets:
              - number-grid-representable-values
              - number-grid-s-code-tostring-2-padstart-8-0-split
            color: cyan
            linger: 0.65
      - say: At one point zero six two five, both neighbors are equally close. Read the last bit on each byte.
          The lower neighbor ends in zero. Round-to-nearest-even picks that neighbor, so we store one.
        hold: 0.7
        visual_cues:
          - id: number-grid-beat-2-focus-1
            phrase: The lower neighbor ends in zero
            targets:
              - number-grid-current-rounding
              - number-grid-s-code-tostring-2-padstart-8-0-split
            color: cyan
            linger: 0.65
      - say: Move one gap to the right. At one point one eight seven five the upper neighbor ends in zero.
          This tie goes up to one and a quarter. Cross two and the grid widens. Eight spaces across an
          interval of width two gives a quarter per step. The same rule works at the next exponent
          boundary.
        hold: 0.65
        visual_cues:
          - id: number-grid-next-midpoint
            phrase: Move one gap to the right
            targets:
              - number-grid-current-rounding
              - number-grid-s-code-tostring-2-padstart-8-0-split
            color: yellow
            linger: 0.5
          - id: number-grid-exponent-spacing
            phrase: Cross two and the grid widens
            targets:
              - number-grid-representable-values
              - number-grid-current-rounding
            color: pink
            linger: 0.5
  - id: subnormal-grid
    title: How close can a code get to zero?
    visual: The leading bit changes at the smallest normal. Signed half-step ties and a three-quarter-step
      input round on a magnified subnormal ruler. The CPU cast and MI200 matrix modes have separate
      labels.
    beats:
      - say: At the smallest E4M3 normal, a leading one stands for one times two to the minus six. Set the
          exponent bits to zero. The leading bit becomes zero, and the fraction bits give us smaller
          values called subnormals. Call the smallest step d. It's two to the minus nine. In E5M2 the
          smallest step is two to the minus sixteen.
        hold: 0.6
        visual_cues:
          - id: lp-subnormal-grid-build-0
            phrase: Set the exponent bits to zero
            targets:
              - lp-subnormal-grid-trace
            color: cyan
            linger: 0.45
          - id: lp-subnormal-grid-floor
            phrase: In E5M2 the smallest step is two to the minus sixteen
            targets:
              - lp-subnormal-grid-trace
            color: yellow
            linger: 0.45
      - say: Three quarters of d is closer to d than to zero. It rounds up to d. Half of d is a tie. The even
          code is zero. A negative half step keeps its sign and rounds to negative zero in OCP E4M3.
          Even the wider E5M2 range can't save an unscaled ten to the minus seven. It sits below half
          its first step.
        hold: 0.6
        visual_cues:
          - id: lp-subnormal-grid-build-1
            phrase: Three quarters of d is closer to d than to zero
            targets:
              - lp-subnormal-grid-trace
            color: cyan
            linger: 0.45
          - id: lp-subnormal-grid-up
            phrase: It rounds up to d
            targets:
              - lp-subnormal-grid-trace
            color: yellow
            linger: 0.45
          - id: lp-subnormal-grid-zero
            phrase: rounds to negative zero
            targets:
              - lp-subnormal-grid-trace
            color: yellow
            linger: 0.45
      - say: That was a conversion on the number grid. A matrix instruction can also flush subnormals to zero.
          PyTorch documents this for affected FP16 and BF16 matrix paths on AMD's MI two hundred, with
          separate FP16 backward alternatives. To see whether a small value survives multiplication,
          try it on the instruction and mode you plan to use.
        hold: 0.6
        visual_cues:
          - id: lp-subnormal-grid-build-2
            phrase: A matrix instruction can also flush subnormals to zero
            targets:
              - lp-subnormal-grid-trace
            color: cyan
            linger: 0.45
  - id: overflow-mode
    title: Did the cast overflow?
    visual: Two nearby inputs round on one precision grid. Only 465 crosses the E4M3 finite boundary after
      rounding. Separate format and CPU examples show what their own overflow contracts return.
    beats:
      - say: A ceiling code can have two explanations. OCP rounds to destination precision before testing for
          overflow. Four hundred forty-nine rounds back to four hundred forty-eight. Four hundred
          sixty-five is nearer four hundred eighty. That's a precision-rounded intermediate beyond the
          finite E4M3 range.
        hold: 0.6
        visual_cues:
          - id: lp-overflow-mode-build-0
            phrase: OCP rounds to destination precision before testing for overflow
            targets:
              - lp-overflow-mode-trace
            color: cyan
            linger: 0.45
          - id: lp-overflow-mode-449
            phrase: Four hundred forty-nine rounds back to four hundred forty-eight
            targets:
              - lp-overflow-mode-trace
            color: yellow
            linger: 0.45
          - id: lp-overflow-mode-465
            phrase: Four hundred sixty-five is nearer four hundred eighty
            targets:
              - lp-overflow-mode-trace
            color: yellow
            linger: 0.45
      - say: For that second input, saturating E4M3 stores four hundred forty-eight. Non-saturating E4M3
          returns NaN. The format has two NaN patterns and no infinity. E5M2 has a larger ceiling. Try
          sixty-five thousand five hundred thirty-six on E5M2. This input exceeds its own range after
          rounding. Its non-saturating result is positive infinity. OCP requires nearest-even and both
          overflow modes. A caller has to know which mode was used.
        hold: 0.6
        visual_cues:
          - id: lp-overflow-mode-build-1
            phrase: For that second input
            targets:
              - lp-overflow-mode-trace
            color: cyan
            linger: 0.45
          - id: lp-overflow-mode-modes
            phrase: Non-saturating E4M3 returns NaN
            targets:
              - lp-overflow-mode-trace
            color: yellow
            linger: 0.45
          - id: lp-overflow-mode-e5
            phrase: Its non-saturating result is positive infinity
            targets:
              - lp-overflow-mode-trace
            color: pink
            linger: 0.15
            caption_boundary: true
      - say: The article's PyTorch two point fifteen CPU run tried five hundred with a plain cast, then an
          explicit finite clamp before casting. Both returned four hundred forty-eight. To diagnose
          clipping, record the scaled input and check where it rounded. A ceiling code alone can't
          distinguish our two cases.
        hold: 0.6
        visual_cues:
          - id: lp-overflow-mode-build-2
            phrase: a plain cast, then an explicit finite clamp before casting
            targets:
              - lp-overflow-mode-trace
            color: cyan
            linger: 0.45
          - id: lp-overflow-mode-cpu
            phrase: Both returned four hundred forty-eight
            targets:
              - lp-overflow-mode-trace
            color: yellow
            linger: 0.45
  - id: rounding-probability
    title: Where does one weight update land?
    visual: Two aligned rulers magnify one eighth above 1. An exact increment of 1/32 lands between E4M3
      ticks and directly on a BF16 tick. A second trial uses the same E4M3 gap to derive stochastic
      rounding probabilities.
    beats:
      - say: Start both weights at one. Add one thirty-second to each. The blue dots mark the exact sum. Both
          rulers cover the same distance. With round-to-nearest-even, which stored weight will move?
        hold: 2.3
        visual_cues:
          - id: round-candidate
            phrase: Add one thirty-second to each
            targets:
              - round-rulers
            color: blue
            linger: 0.15
      - say: Store the two results. E4M3 falls back to one. Its next value is a whole eighth away. BF16 has a
          tick every one hundred twenty-eighth here, so it keeps the full update. If you repeat that
          addition on the E4M3 weight, you'll start from one again, unless you kept the remainder or a
          wider master weight.
        hold: 0.9
        caption_starts:
          - E4M3 falls back to one
          - BF16 has a tick
          - so it keeps the full update
        visual_cues:
          - id: round-store
            phrase: E4M3 falls back to one
            targets:
              - round-rulers
            color: cyan
            linger: 0.15
          - id: round-bf16
            phrase: so it keeps the full update
            targets:
              - round-rulers
            color: cyan
            linger: 0.15
      - say: Keep the E4M3 neighbors. Now add just one hundredth. Suppose we store either neighbor and want
          the average stored value to equal one point zero one. How often should we pick the upper
          tick?
        hold: 2.4
        visual_cues:
          - id: round-trial
            phrase: Now add just one hundredth
            targets:
              - round-rulers
            color: blue
            linger: 0.15
      - say: The input is eight percent of the way across the gap. So put eight percent of the probability on
          the upper tick and the rest on one. The weighted average is one point zero one. That's
          stochastic rounding. An individual write still stores just one of the two neighbors.
        hold: 0.9
        visual_cues:
          - id: round-mass
            phrase: put eight percent of the probability on the upper tick and the rest on one
            targets:
              - round-outcomes
            color: yellow
            linger: 0.15
          - id: round-expectation
            phrase: The weighted average is one point zero one
            targets:
              - round-outcomes
            color: cyan
            linger: 0.15
            caption_boundary: true
      - say: Put the input exactly on the upper tick and every write can keep it. At five hundred there's no
          finite E4M3 neighbor above the input. Clipping to four hundred forty-eight changes the
          average too. Unbiased rounding inside a gap gives a local expectation. Training convergence
          also depends on the optimizer. Transformer Engine's NVFP4 training recipe uses stochastic
          rounding for gradients.
        hold: 0.7
        visual_cues:
          - id: round-exact
            phrase: Put the input exactly on the upper tick
            targets:
              - round-rulers
            color: cyan
            linger: 0.15
          - id: round-limits
            phrase: Clipping to four hundred forty-eight
            targets:
              - round-outcomes
            color: cyan
            linger: 0.15
  - id: scale-conventions
    title: Which way does the scale go?
    visual: The same real activation travels through reciprocal encode and reconstruct formulas. A
      zero-only group gets a declared positive scale. Two unequal scale products stay beside their own
      contraction blocks.
    beats:
      - say: Return to the five hundred that came back as ten. We divided by a reconstruction scale, then
          multiplied the decoded number by that scale. Some APIs store its reciprocal instead.
          Multiply by that factor on the way in and divide by it on the way back. Either convention
          gives ten here. Read both operations before assigning a meaning to a field named scale.
        hold: 0.6
        visual_cues:
          - id: lp-scale-conventions-build-0
            phrase: We divided by a reconstruction scale
            targets:
              - lp-scale-conventions-trace
            color: cyan
            linger: 0.45
          - id: lp-scale-conventions-reciprocal
            phrase: Multiply by that factor on the way in and divide by it on the way back
            targets:
              - lp-scale-conventions-trace
            color: yellow
            linger: 0.45
      - say: For a positive finite maximum, divide the maximum by four hundred forty-eight to get the ideal
          reconstruction scale. Invert that fraction for the other convention. If the whole group is
          zero, taking the reciprocal of its maximum would divide by zero. Choose a positive scale,
          such as one. Every zero still comes back as zero.
        hold: 0.6
        visual_cues:
          - id: lp-scale-conventions-build-1
            phrase: For a positive finite maximum
            targets:
              - lp-scale-conventions-trace
            color: cyan
            linger: 0.45
          - id: lp-scale-conventions-zero
            phrase: Choose a positive scale, such as one
            targets:
              - lp-scale-conventions-trace
            color: yellow
            linger: 0.45
      - say: A scale also belongs to particular values. If a row scale and a weight-column scale stay fixed
          throughout a dot product, their product can move outside the inner sum. If the scale changes
          halfway through, keep each scale with its own partial sum. That's an identity for
          reconstructed operands in real arithmetic. Reordering a finite-precision sum can change its
          rounding.
        hold: 0.6
        visual_cues:
          - id: lp-scale-conventions-build-2
            phrase: keep each scale with its own partial sum
            targets:
              - lp-scale-conventions-trace
            color: cyan
            linger: 0.45
  - id: scale-timeline
    title: When is the maximum available?
    visual: Two scans read the same eight values for current scaling. A history window supplies the
      delayed scale while a single scan records a new peak for the next iteration. A separate retained
      outlier coarsens the tiny probe.
    beats:
      - say: To choose today's scale from today's values, first scan the tensor for its largest absolute
          value. Transformer Engine's current-scaling guide describes a second read to scale and cast
          the same values. GEMM reads the encoded tensor later. These dependencies can stay on the
          device. Copying the maximum back for a host decision also requires a transfer and
          synchronization.
        hold: 0.6
        visual_cues:
          - id: lp-scale-timeline-build-0
            phrase: first scan the tensor for its largest absolute value. Transformer Engine's current-scaling
              guide describes a second read to scale and cast the same values
            targets:
              - lp-scale-timeline-trace
            color: cyan
            linger: 0.45
          - id: lp-scale-timeline-second
            phrase: a second read to scale and cast the same values
            targets:
              - lp-scale-timeline-trace
            color: yellow
            linger: 0.45
      - say: Try the same input with three earlier maxima. Ten is the largest, so today's scale is ten over
          four hundred forty-eight. That's ready before the scan starts. Cast each value and keep
          track of the largest one you see. Seven hundred enters the history for the next iteration.
          This maximum-over-history rule uses no margin. Transformer Engine describes one tensor read
          here. A distributed run may also combine maxima across ranks to update its scales.
        hold: 0.6
        visual_cues:
          - id: lp-scale-timeline-build-1
            phrase: Cast each value and keep track of the largest one you see
            targets:
              - lp-scale-timeline-trace
            color: cyan
            linger: 0.45
          - id: lp-scale-timeline-history
            phrase: Seven hundred enters the history for the next iteration
            targets:
              - lp-scale-timeline-trace
            color: yellow
            linger: 0.45
      - say: Yesterday's small maximum let a new spike clip. The opposite shift is possible too. Suppose the
          history still contains five hundred while today's input is one thousandth. That old maximum
          spaces the ticks so far apart that the tiny input rounds to zero.
        hold: 0.6
        visual_cues:
          - id: lp-scale-timeline-build-2
            phrase: Suppose the history still contains five hundred
            targets:
              - lp-scale-timeline-trace
            color: cyan
            linger: 0.45
  - id: online-quantization
    title: Who writes the FP8 operand?
    visual: The online activation strip and weight tile mark DeepSeek-V3's 128-element contraction
      interval. The reported BF16 read, FP8 write and MMA read stay distinct from the proposed fused
      transfer.
    beats:
      - say: DeepSeek V-three measured the maximum online. One activation group spans a hundred twenty-eight
          values. A weight group spans a square of that width. On its H eight hundred runs, the
          authors observed loss inside accumulation. Every hundred twenty-eight contraction elements,
          they promoted the partial result to FP32 accumulation on CUDA cores.
        hold: 0.6
        visual_cues:
          - id: lp-online-quantization-build-0
            phrase: One activation group spans a hundred twenty-eight values
            targets:
              - lp-online-quantization-trace
            color: cyan
            linger: 0.45
          - id: lp-online-quantization-promote
            phrase: they promoted the partial result to FP32 accumulation on CUDA cores
            targets:
              - lp-online-quantization-trace
            color: yellow
            linger: 0.45
      - say: Follow the reported data movement. Read BF16. Quantize. Write FP8. Then the matrix operation
          reads the FP8 operand. Combining the cast with a Tensor Memory Accelerator transfer was a
          proposed optimization. The cited DeepGEMM interface likewise leaves casting and transposing
          to the caller or an earlier fused kernel. Measuring the range online tells you when the
          scale is chosen. You still have to account for moving the operand.
        hold: 0.6
        visual_cues:
          - id: lp-online-quantization-build-1
            phrase: Read BF16. Quantize. Write FP8. Then the matrix operation reads the FP8 operand
            targets:
              - lp-online-quantization-trace
            color: cyan
            linger: 0.45
          - id: lp-online-quantization-future
            phrase: was a proposed optimization
            targets:
              - lp-online-quantization-trace
            color: yellow
            linger: 0.45
  - id: local-scales
    title: Which activations share a scale?
    visual: One bracket covers both 32-entry rows, then splits into two brackets. Separate magnified
      rulers compare the source and stored values at the same two indices in each run.
    beats:
      - say: Look at the blue cells. The first holds one thousandth. The second row contains five hundred. One
