          the scales. Now the thousandth sets the scale for block A. Multiply its stored value,
          two hundred fifty-six, by two to the minus eighteen. The dot product gets almost the whole
          thousandth back. Moving the spike changed what the kernel could read at a different position.
        hold: 1.6
        visual_cues:
          - id: fresh-split
            phrase: Move the spike back to block B and recompute the scales
            targets:
              - fresh-blocks
            color: yellow
            linger: 0.15
          - id: fresh-recheck
            phrase: The dot product gets almost the whole thousandth back
            targets:
              - fresh-probe
            color: cyan
            linger: 0.15
            caption_boundary: true
