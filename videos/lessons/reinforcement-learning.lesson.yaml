        visual_cues:
          - id: bellman-voice-1
            phrase: A value function estimates the return available from a
            targets:
              - bellman-construction
            color: cyan
            linger: 0.5
      - say: "At the new-request state, unsupported approval is worth minus one hundred twenty. Requesting evidence is worth fifty-nine, while direct review is worth fifty-four. The highest expected action value gives the greedy choice under this model: request evidence."
        hold: 0.6
        visual_cues:
          - id: bellman-voice-2
            phrase: At the new-request state, unsupported approval is worth minus
            targets:
              - bellman-construction
            color: yellow
            linger: 0.5
      - say: The value comes from the full path. In the evidence-ready state, direct approval yields seventy now. A human review after an added minus-ten step has value sixty-two, even though its eventual approval reward is eighty. Backups keep delay and consequence together.
        hold: 0.75
        visual_cues:
          - id: bellman-voice-3
            phrase: The value comes from the full path. In the
            targets:
              - bellman-construction
            color: cyan
            linger: 0.5
      - say: A policy maps each state to an action or an action distribution. A policy value follows those decisions, so its Bellman expectation averages over the policy actions. An optimal backup instead takes the maximum action value. Closed has zero future value; evidence-ready compares immediate seventy with minus ten plus point nine times eighty, which is sixty-two.
