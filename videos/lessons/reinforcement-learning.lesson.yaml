  - id: bellman
    title: Compare actions with a Bellman backup
    visual: Immediate rewards combine with discounted successor values; evidence scores 59, review 54, and unsupported approval minus 120.
    beats:
      - say: A value function estimates the return available from a state. An action value asks what happens if we take one particular action first, then continue well. The Bellman backup combines each possible next state’s probability, immediate reward, and discounted value.
