            color: cyan
            linger: 0.5
  - id: exploration
    title: Exploration supplies missing experience
    visual: A named episode passes through an epsilon test and a uniform action draw. The same eight episode identities then accumulate an auditable action-count ledger.
    beats:
      - say: Our current values favor requesting evidence. Epsilon-greedy behavior usually follows that estimate. Here epsilon is one fifth, so the first random draw chooses between exploration and the greedy action. Follow episode E zero two. Its draw falls below the cutoff, so we explore. A second uniform draw chooses among all three actions and lands on human review. That learned proposal still passes through the runtime policy gate.
