  - id: td-targets
    title: Use the future the sample actually has
    visual: The same transition splits into complete-return, greedy-next-action, selected-next-action and stopped-rollout targets.
    beats:
      - say: Monte Carlo learning waits for a completed sampled return. For a fixed policy with correctly sampled episodes, that target has the right conditional mean. It includes later randomness. Temporal difference learning replaces the unobserved tail with a successor value estimate and updates sooner. An inaccurate estimate can bias the target. With exact successor values, replacing a sampled tail by its conditional mean reduces target variance; learned estimates have no universal finite-data advantage.
        hold: 1
        visual_cues:
          - id: td-targets-voice-1
            phrase: Monte Carlo learning waits for a completed sampled return.
            targets:
              - td-targets-construction
            color: cyan
            linger: 0.5
      - say: Keep reward minus four and next-state actions valued seventy and sixty-two. Q-learning uses the greedy seventy, making target fifty-nine. If the behavior actually chooses the sixty-two review action, SARSA instead uses minus four plus point nine times sixty-two, or fifty-one point eight. Q-learning is off-policy; SARSA evaluates the exploratory policy it follows.
        hold: 1
        visual_cues:
          - id: td-targets-voice-2
            phrase: Keep reward minus four and next-state actions valued seventy
            targets:
              - td-targets-construction
            color: yellow
            linger: 0.5
      - say: Now the reward is minus eighteen and the next-state value is eighty. A genuine terminal outcome has target minus eighteen because no future remains. An external collection time limit leaves that future, so its target is fifty-four. Mask true termination, not every stopped rollout, and bootstrap from the actual final observation rather than a reset state. A deadline built into the task can be terminal; include remaining time when it affects decisions.
        hold: 1
        visual_cues:
