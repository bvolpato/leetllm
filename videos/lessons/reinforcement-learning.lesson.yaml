  - id: reward-design
    title: Keep reward optimization inside safe boundaries
    visual: A learned action proposal passes through a separate runtime policy gate before an audited outcome is recorded.
    beats:
      - say: An agent optimizes the reward we specify. A reward that values quick closure alone could favor unsupported approvals. Enforce hard policy rules with deterministic controls, then use reward tests to measure learned trade-offs across states.
        hold: 0.55
        visual_cues:
          - id: reward-design-voice-1
            phrase: An agent optimizes the reward we specify. A reward
            targets:
              - reward-design-construction
            color: cyan
            linger: 0.5
      - say: Keep authorization invariants in deterministic controls that can reject an unsafe action. Then evaluate whether the reward captures useful service, security, delay, and escalation outcomes. The simulator should expose failure paths and transition uncertainty before any live use.
        hold: 0.6
        visual_cues:
          - id: reward-design-voice-2
            phrase: Keep authorization invariants in deterministic controls that can reject
