            targets:
              - mdp-node-start
            color: cyan
            linger: 0.6
      - say: The Markov assumption says the current state contains the information needed to predict the next state and reward once the action is known. If abandonment depends on how long the requester has waited, include elapsed time or a sufficient summary in the state.
