  - id: q-learning
    title: Learn action values from sampled transitions
    visual: One observed evidence-request transition updates a tabular action value toward its sampled reward plus discounted next-state estimate.
    beats:
      - say: A transition record contains the current state, chosen action, received reward, and next state. Q-learning uses each sample to update an action value, bootstrapping from the best estimated value in the next state.
