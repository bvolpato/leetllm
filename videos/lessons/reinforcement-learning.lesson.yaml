    title: A request creates a decision with consequences
    visual: A stale access request branches to evidence collection or human review before reaching a safe resolution.
    beats:
      - say: A stale access-change request reaches a routing desk. Security policy requires human review unless strong secondary evidence arrives. The router can approve now, ask for evidence, or send the request to a reviewer. Its choice changes the next observation and the eventual outcome.
