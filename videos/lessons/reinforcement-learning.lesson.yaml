            color: cyan
            linger: 0.5
      - say: In one teaching update, the evidence request receives minus four and the next state’s best value is seventy. With discount point nine, the target is fifty-nine. Starting from zero and using a step size of one half moves the table entry halfway to that target, or twenty-nine point five.
