            color: cyan
            linger: 0.4
      - say: "Now replay eight authored simulator episodes with this same fixed Q snapshot: minus one hundred twenty, fifty-nine and fifty-four. Each row keeps its random draws and proposed action. Watch proposal counts accumulate. Most request evidence; two exploration branches propose approval and review. The unsafe approval exists only in this simulator. A live gate rejects it and can route to allowed human review, so proposal counts are not automatically executed-action learning visits."
        hold: 0.6
        visual_cues:
          - id: exploration-beat-2-focus-1
            phrase: Now replay eight authored simulator episodes
            targets:
              - exploration-episode-ledger
            color: blue
            linger: 0.6
      - say: The fixture proposes every action. A tabular convergence claim instead needs actual repeated updates of every state-action pair in a stationary finite Markov process with bounded rewards and discount below one. Each pair needs visit-indexed steps whose sum diverges and squared sum converges. Runtime rejection changes the executed process. It supplies no experience of the rejected unsafe action. Under epsilon point two with three actions and one unique greedy choice, that greedy choice has probability point eight plus point two divided by three, not just point eight.
