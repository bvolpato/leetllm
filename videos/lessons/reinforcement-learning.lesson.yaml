  - id: policy-gradient
    title: Move probabilities using the sampled consequence
    visual: The same action identities become a probability simplex; signed advantage contributions move the opening logits.
    beats:
      - say: A parameterized policy outputs action probabilities directly. For a fixed starting-state distribution and environment dynamics independent of policy parameters, REINFORCE estimates the gradient of expected return by multiplying each action log-probability gradient by reward-to-go. Under a discounted start-state objective, also include gamma to the action time. Reward-to-go already discounts from that step; it does not replace the outer time weight.
        hold: 1
        visual_cues:
          - id: policy-gradient-voice-1
            phrase: A parameterized policy outputs action probabilities directly. For a
            targets:
              - policy-gradient-construction
            color: cyan
            linger: 0.5
      - say: For a two-step example, the first action is fixed and the second is Bernoulli with probability one half, earning its selected zero or one. With gamma point nine, the objective derivative is point two two five at logit zero. Omitting the time weight gives point two five, which is the derivative of a different objective.
        hold: 1
        visual_cues:
          - id: policy-gradient-voice-2
            phrase: For a two-step example, the first action is fixed
            targets:
              - policy-gradient-construction
            color: yellow
            linger: 0.5
      - say: An action-independent state baseline leaves the expected score gradient unchanged. With baseline equal to the exact state value, sampled return minus baseline estimates advantage, Q minus V. Treat that baseline as fixed in the actor gradient. A baseline fit from the same action return needs care. For the one-step half-probability example, baselines zero, one half and ten all give mean gradient point two five, but variances point zero six two five, zero and twenty-two point five six two five. A poor baseline can increase variance.
        hold: 1
        visual_cues:
          - id: policy-gradient-voice-3
            phrase: An action-independent state baseline leaves the expected score gradient
            targets:
              - policy-gradient-construction
            color: cyan
            linger: 0.5
      - say: Return to the opening router at twenty-five-percent abandonment. Freeze downstream choices, begin with three equal probabilities and action values minus one hundred twenty, thirty point seven five and fifty-four. One exact expected-gradient step of size point zero three changes approval to about point zero eight nine, evidence to point four zero three and review to point five zero eight. This is an exact opening-policy calculation, not a full sampled trajectory trainer.
        hold: 1
        visual_cues:
          - id: policy-gradient-voice-4
            phrase: Return to the opening router at twenty-five-percent abandonment. Freeze
            targets:
              - policy-gradient-construction
            color: yellow
            linger: 0.5
  - id: llm-policy
    title: Carry the same probability update into text
    visual: A prefix appends owned action tokens; actor, critic, reference and reward roles remain separate as group rewards normalize.
    beats:
      - say: For text-only completion, the state can be the prompt and generated prefix, and the action is the next token including an end token. The transition appends that token deterministically. A completion reward can come from a learned preference model or an automated verifier. Tool-using agents also receive external observations and actions, so token appending alone does not describe their whole environment.
        hold: 1
        visual_cues:
          - id: llm-policy-voice-1
            phrase: For text-only completion, the state can be the prompt
            targets:
              - llm-policy-construction
            color: cyan
            linger: 0.5
      - say: In classical PPO-based preference training, the actor generates completions, a critic estimates partial-prefix value, a frozen reference controls divergence, and a reward model scores completions. These are four roles even when architectures share weights. PPO ratios compare with the policy that sampled the rollout. That old policy differs from the frozen reference. Clipping discourages some large ratio changes; it is no hard KL bound or improvement guarantee.
        hold: 1
        visual_cues:
          - id: llm-policy-voice-2
            phrase: In classical PPO-based preference training, the actor generates completions,
            targets:
              - llm-policy-construction
            color: yellow
            linger: 0.5
      - say: The original group-relative recipe removes the separate critic and samples a group of completions for one prompt. Subtract the group reward mean and divide by its standard deviation plus a small stabilizer. Rewards zero, one and two give mean one and population standard deviation square root of two thirds, so relative scores are about minus one point two two five, zero and one point two two five. Original outcome supervision gives each token its completion score, with a clipped token-ratio objective and reference KL term.
        hold: 1
        visual_cues:
          - id: llm-policy-voice-3
            phrase: The original group-relative recipe removes the separate critic and
            targets:
              - llm-policy-construction
            color: cyan
            linger: 0.5
      - say: Equal rewards give zero normalized reward component, while the KL term may still update. These empirical scores are not exact Q minus V advantages. Group mean includes the sampled completion, and normalization and length weighting change the objective. Removing a critic saves its resources, but group size, rollout length and the remaining models still determine cost. Better surrogate scores require held-out behavior checks.
        hold: 1
        visual_cues:
          - id: llm-policy-voice-4
            phrase: Equal rewards give zero normalized reward component, while the
            targets:
              - llm-policy-construction
            color: yellow
            linger: 0.5
  - id: off-policy-evaluation
    title: A counterfactual needs logged support
    visual: Two logged action likelihood ratios multiply along one trajectory; a zero-probability action leaves a visible missing branch.
    beats:
      - say: Our synthetic scorecard knows every branch because we wrote the environment. A real log records only executed actions and outcomes. Evaluating a target policy from a behavior-policy log needs support and recorded action probabilities, under common dynamics and a suitable initial-state distribution.
