  - id: value-iteration
    title: Let values propagate backward
    visual: Three Bellman sweeps move terminal reward information from review and evidence states back to the original request.
    beats:
      - say: When a small transition model is known, value iteration repeatedly applies Bellman backups. Begin with every value at zero. On the first sweep, the new-request state sees immediate rewards, so asking for evidence looks like the least costly action at minus four.
        hold: 0.55
        visual_cues:
          - id: value-iteration-voice-1
            phrase: When a small transition model is known, value iteration
            targets:
              - value-iteration-construction
            color: cyan
            linger: 0.5
      - say: "The same sweep fills the successor values: seventy for evidence-ready and eighty for the review queue. On the second sweep, those values travel backward. Requesting evidence becomes fifty-nine, review becomes fifty-four, and requesting evidence remains the best first action."
        hold: 0.6
        visual_cues:
          - id: value-iteration-voice-2
            phrase: "The same sweep fills the successor values: seventy for"
            targets:
              - value-iteration-construction
            color: yellow
            linger: 0.5
      - say: For a finite model with bounded rewards and discount below one, exact value iteration converges to the optimal value. Several actions can tie, so the value can be unique while more than one optimal policy exists. The result applies to the declared transition and reward model; re-estimate it when real traffic changes.
        hold: 0.75
        visual_cues:
          - id: value-iteration-voice-3
            phrase: For a finite model with bounded rewards and discount
            targets:
              - value-iteration-construction
            color: cyan
            linger: 0.5
      - say: Policy iteration separates two jobs. First evaluate one fixed policy by solving its expectation equations, then improve greedily using those values. Exact evaluation with consistent tie handling terminates for a finite discounted model. Value iteration applies an optimality backup every sweep instead. Its operator contracts the largest value error by at most gamma, giving the unique optimal value; several actions can still tie. Approximate evaluation needs its own error control.
        hold: 1
        visual_cues:
          - id: value-iteration-voice-4
            phrase: Policy iteration separates two jobs. First evaluate one fixed
            targets:
              - value-iteration-construction
            color: yellow
            linger: 0.5
