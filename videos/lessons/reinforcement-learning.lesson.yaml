            color: cyan
            linger: 0.5
      - say: For two decisions with behavior probabilities point five and point five, and target probabilities point eight and point six, the trajectory weight is one point six times one point two, or one point nine two. Using only the last ratio misses the first choice. Per-decision weights multiply through the action that earned each reward. Products can have high variance.
