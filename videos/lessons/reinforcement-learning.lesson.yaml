  - id: mdp
    title: Keep enough state to predict the next step
    visual: A state graph distinguishes new, evidence-ready, review, and closed requests. A constructed elapsed-wait field grows to forty-five seconds. The router sends an ask-evidence action to the environment, which returns supplied event E17 with an evidence-ready observation, reward minus four, and twenty more elapsed seconds.
    beats:
      - say: A Markov decision process describes states, actions, transition probabilities, rewards, and a discount factor. Here the states distinguish a new request from one with verified evidence, because the same approval action has different consequences in each state.
