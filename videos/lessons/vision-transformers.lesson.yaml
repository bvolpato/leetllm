scenes:
  - id: intro
    title: Which ID opens the trace?
    visual: The three-row ID beside Retry grows under a magnifier. A native crop puts nine rows of source pixels directly below it. Both proposed readings stay in view.
    beats:
      - say: F or eight? The resized screenshot gives us just three rows of pixels to read.
          To open the trace, we need the ID beside Retry.
        caption_starts:
          - The resized screenshot gives us
          - To open the trace
        hold: 0.45
        visual_cues:
          - id: intro-locate
            phrase: the ID beside Retry
            targets:
              - incident-screen
              - id-readings
            color: yellow
            linger: 0.38
      - say: Take a crop from the original. Now you can follow the stroke after the seven. Check the last
          character too. Which reading fits both?
        hold: 2.6
        visual_cues:
          - id: intro-magnify
            phrase: Take a crop from the original
            targets:
              - incident-screen
              - id-readings
            color: yellow
            linger: 0.38
      - say: The left reading matches. The F has an open side, and the ID ends in A. Let's follow those
          strokes into a vision transformer, starting with the pixels it receives.
        caption_starts:
          - Let's follow those strokes
        hold: 0.75
        visual_cues:
          - id: intro-match
            phrase: The left reading matches
            targets:
              - id-readings
            color: green
            linger: 0.38
  - id: processor-evidence
    title: What reaches the encoder?
    visual: The source stays fixed while its identifier shrinks under a three-by-three area average. A
      native crop of the same region reveals the two strips at equal magnification.
    beats:
      - say: The original screenshot is six hundred seventy-two pixels wide. Its identifier spans nine pixel
          rows. Shrink the full screenshot to a width of two hundred twenty-four. In this example, we
          average each square of three by three pixels into one. The whole identifier is now just three
          pixels high.
        hold: 1.15
        visual_cues:
          - id: processor-resize
            phrase: Shrink the full screenshot to a width of two hundred twenty-four
            targets:
              - processor-source
              - sampled-id
            color: cyan
            linger: 0.38
      - say: Take a native crop around Retry instead. It too is two hundred twenty-four pixels wide, but it
          keeps all nine rows. We've enlarged both strips by the same amount. Zooming in on the first one
          only makes its three rows bigger.
        hold: 1.05
        visual_cues:
          - id: processor-crop
            phrase: Take a native crop around Retry
            targets:
              - processor-source
              - sampled-id
            color: yellow
            linger: 0.38
      - say: Inspect the pixels the checkpoint receives. A center crop can cut off an edge label, and
          stretching can distort a letter. Keep the checkpoint's color conversion and normalization.
          Compare readings from the full image and the native crop against the labeled ID. If only the
          crop reads correctly, inspect the resize. If the processed pixels are clear and the model still
          misses a letter, trace it through the encoder, bridge and decoder. If neither view is legible,
          leave the lookup open.
        caption_starts:
          - Compare readings from the full image
          - If only the crop reads correctly
          - If the processed pixels are clear
          - If neither view is legible
        hold: 0.65
        visual_cues:
          - id: processor-check
            phrase: Compare readings from the full image and the native crop
            targets:
              - processor-source
              - sampled-id
            color: cyan
            linger: 0.38
          - id: processor-check-resize
            phrase: If only the crop reads correctly
            targets: [sampled-id]
            color: yellow
            linger: 0.38
          - id: processor-check-model
            phrase: If the processed pixels are clear
            targets: [sampled-id]
            color: cyan
            linger: 0.38
          - id: processor-unreadable
            phrase: If neither view is legible
            targets: [sampled-id]
            color: yellow
            linger: 0.38
  - id: patches
    title: Follow four pixels into one row
    visual: A moving cursor follows four source pixels into each raster-ordered row.
      A separate RGB example keeps the number of patches fixed through projection.
    beats:
      - say: Give each pixel in this little image its own number. The cyan square in the top left contains four
          of them. Unfold that square into one row. Read across the top, then across the bottom. That's
          how zero, one, four and five become neighbors in the sequence.
        hold: 0.85
        visual_cues:
          - id: patch-unfold
            phrase: Unfold that square into one row
            targets:
              - raster-pixels
            color: cyan
            linger: 0.4
      - say: Unfold the other three squares in the same order. Every original number has an address in a patch
          row. You could run the move backwards and rebuild the image exactly. So far, we've rearranged
          the pixels and kept every value.
        hold: 0.85
        visual_cues:
          - id: patch-unfold-rest
            phrase: Unfold the other three squares in the same order
            targets:
              - raster-pixels
            color: yellow
            linger: 0.4
      - say: Now use a thirty-two by thirty-two color image and patches eight pixels wide. Four patches fit
          along each side. Each of the sixteen rows holds eight times eight locations, with three color
          values at each location. That's a hundred ninety-two inputs per row. If the model projects to a
          hidden width of two hundred fifty-six, there are still sixteen rows. For a rectangle made of
          complete patches, divide each side by the patch width and multiply the two counts.
        hold: 0.9
        visual_cues:
          - id: patch-rgb
            phrase: thirty-two by thirty-two color image
            targets:
              - patch-shapes
            color: cyan
            linger: 0.4
  - id: convolution-equivalence
    title: Do these two patch readers agree?
    visual: Two colored input planes meet their matching filter planes. The values unroll into channel order
      and then interleave against a fixed filter. The equality check runs on each order.
    beats:
      - say: Put two channels in the same two-by-two patch. One convolution filter spans both. Start with
          the first channel. Multiply its four pixels by their matching weights and sum the products.
          That's thirty. The second channel contributes seven hundred. Together they make one output, seven hundred
          thirty. We're using zero bias.
        hold: 0.9
        visual_cues:
          - id: convolution-channels
            phrase: Multiply its four pixels by their matching weights
            targets:
              - convolution-order
            color: cyan
            linger: 0.4
      - say: Read all of channel one, then all of channel two. Flatten the filter the same way. The dot product
          gives seven hundred thirty again. A convolution with kernel and stride equal to the patch width,
          no padding, and one filter per hidden coordinate can implement a shared patch projection. Both
          implementations must include the same bias.
        hold: 0.9
        visual_cues:
          - id: convolution-correct
            phrase: Flatten the filter the same way
            targets:
              - convolution-order
            color: cyan
            linger: 0.4
      - say: Keep those eight weights still. Interleave the two channels in pixel order, as in a channels-last
          array. We still have eight input numbers. Will this row pass the same numerical check?
        hold: 2.35
        visual_cues:
          - id: convolution-permute
            phrase: Interleave the two channels in pixel order
            targets:
              - convolution-order
            color: yellow
            linger: 0.4
      - say: This time the dot product is six hundred fifty. Ten now multiplies the second weight, where two
          used to sit. Match the order before you compare the two implementations. In the larger example,
          two RGB images, each four by six, produce six tokens of width five per image. Compare every
          output value. Both input orders give the expected shape, and only the correctly ordered one
          matches the convolution.
        hold: 1
        visual_cues:
          - id: convolution-wrong
            phrase: the dot product is six hundred fifty
            targets:
              - convolution-order
            color: pink
            linger: 0.4
  - id: projection
    title: What does the shared matrix measure?
    visual: Four raster values meet the same two columns of weights. The product rows fill as their pixels
      are named, and the two running sums end at the mean and the half-difference between column totals.
    beats:
      - say: Read the cyan row from the top-left patch. To get a mean, the first column of weights gives each of
          its four numbers one quarter. Look down the second column. A left pixel gets minus one half, and
          a right pixel gets plus one half. That coordinate measures half the difference between the two
          column sums. These are weights we chose so you can see what they measure. A trained projection
          learns its own.
        hold: 0.8
        visual_cues:
          - id: projection-shared-patch-projection-b1-1
            phrase: first column of weights
            targets:
              - shared-patch-projection
            color: cyan
            linger: 0.3
      - say: Zero adds nothing to either sum. One adds a quarter to the mean and a half to the contrast. Four is
          a left pixel. It adds one to the mean and subtracts two from the contrast. Five is a right
          pixel. It adds one and a quarter, and adds two and a half. Read the two totals at the bottom.
          Two point five for mean brightness. One for contrast.
        hold: 1
        visual_cues:
          - id: projection-patch-column-products-b2-1
            phrase: Zero adds nothing
            targets:
              - patch-column-products
            color: pink
            linger: 0.3
          - id: projection-one
            phrase: One adds a quarter
            targets:
              - patch-column-products
            color: pink
            linger: 0.3
          - id: projection-four
            phrase: Four is a left pixel
            targets:
              - patch-column-products
            color: pink
            linger: 0.3
          - id: projection-five
            phrase: Five is a right pixel
            targets:
              - patch-column-products
            color: pink
            linger: 0.3
        motion_check:
          region:
            - 1280
            - 340
            - 250
            - 430
          minimumChangedFraction: 0.002
      - say: Use that same matrix on each of the other patches. Their averages differ, but a coordinate keeps
          the same meaning wherever the patch came from. We started with four pixel values and kept just
          two measurements. Let's change the pixels and see what that choice lets through.
        hold: 0.85
        visual_cues:
          - id: projection-projected-patch-result-b3-1
            phrase: two measurements
            targets:
              - projected-patch-result
            color: green
            linger: 0.3
  - id: projection-rank
    title: Which pixel changes can this token carry?
    visual: One unit moves up the left column of a two-by-two patch, then a second trial moves a unit across
      columns. Both trials keep the total brightness fixed. Column sums explain which trial changes the
      projected token.
    beats:
      - say: Start with two copies of the top-left patch. On the right, move one unit from the bottom left pixel
          to the top left. The first output is the mean of all four pixels. The second is the right column
          sum minus the left, divided by two. Does the mean change, the contrast, both, or neither?
        hold: 2.6
        visual_cues:
          - id: rank-within
            phrase: move one unit from the bottom left pixel to the top left
            targets:
              - reference-patch
              - edited-patch
            color: yellow
            linger: 0.38
      - say: Neither one moves. Both columns kept their totals, so the token still reads two point five, one.
          Look at the four changes in raster order. Plus one, zero, minus one, zero. This is a null
          direction of the projection. Flattening kept the difference. Multiplying by this matrix erased
          it.
        hold: 1.3
        visual_cues:
          - id: rank-equal
            phrase: Both columns kept their totals
            targets:
              - reference-patch
              - edited-patch
            color: green
            linger: 0.38
      - say: Reset the right patch. This time, move one unit from the top right to the top left. The total
          brightness stays ten. Which output coordinate changes now?
        hold: 2.25
        visual_cues:
          - id: rank-across
            phrase: move one unit from the top right to the top left
            targets:
              - reference-patch
              - edited-patch
            color: yellow
            linger: 0.38
      - say: The contrast falls to zero. Each column now sums to five, and the mean is still two point five. To
          recover every possible input, the projection needs full input rank. Even a wide matrix can have
          a null direction. Once two images give the same tokens in the same slots, widening those tokens
          downstream cannot recover which image we had.
        hold: 0.95
        visual_cues:
          - id: rank-contrast
            phrase: Each column now sums to five
            targets:
              - reference-patch
              - edited-patch
            color: green
            linger: 0.38
  - id: positions
    title: Content needs a record of its location
    visual: Two patches swap fixed slots, yielding an unchanged position-free
      readout but different computed readouts once slot vectors are added.
    beats:
      - say: A sequence of patch contents needs information about their locations.
          Without position information or an order-dependent mask, deterministic
          self-attention follows a permutation of its inputs. A fixed-query
          summary can therefore remain unchanged when we swap two patches, even
          though their layout changes.
        hold: 0.6
        visual_cues:
          - id: positions-permuted-patch-a-b1-1
            phrase: swap two patches
            targets:
              - permuted-patch-a
              - permuted-patch-b
            color: cyan
            linger: 0.6
      - say: Add a distinct vector for each slot, then repeat the swap. Each content
          vector now meets the position vector of its new location. The computed
          summary changes in this fixture. Original ViT uses learned
          one-dimensional position vectors, with a separate slot for its
          classification token.
        hold: 0.65
        visual_cues:
          - id: positions-permuted-position-summary-b2-1
            phrase: computed summary changes
            targets:
              - permuted-position-summary
            color: yellow
            linger: 0.6
      - say: The classification token is a learned vector prepended to the patch
          sequence. Its final state serves as an image-level readout. If
          resolution changes, a learned position table may need grid
          interpolation while preserving that separate class slot. Match the
          checkpoint's processor and interpolation settings.
        hold: 0.7
        visual_cues:
          - id: positions-class-and-patch-sequence-b3-1
            phrase: learned vector prepended
            targets:
              - class-and-patch-sequence
            color: cyan
            linger: 0.6
  - id: resolution-grid
    title: Resize the patch positions while preserving the class slot
    visual: The class position stays separate while a 14 × 14 patch-position grid resizes to 16 × 20. The new table contains 321 positions.
    beats:
      - say: At fixed sixteen-pixel patches, a two-hundred-twenty-four square gives one
          hundred ninety-six patches plus class, or one hundred ninety-seven
          positions. A two-hundred-fifty-six square gives two hundred fifty-six
          patches plus class, or two hundred fifty-seven. The raw patch width
          stays seven hundred sixty-eight for RGB; it is the number of position
          slots that changes.
        hold: 0.65
        visual_cues:
          - id: resolution-grid-beat-0
            phrase: At fixed sixteen-pixel patches, a two-hundred-twenty-four square gives
              one hundred ninety-six patches plus class, or one hundred
              ninety-seven positions
            targets:
              - resolution-grid-mechanism
            color: cyan
            linger: 0.65
      - say: "Separate the class position, reshape only patch positions into their
          two-dimensional grid, resize each feature channel, flatten and
          reattach class. The article’s rectangular toy resizes a
          fourteen-by-fourteen grid to sixteen by twenty: three hundred twenty
          patches plus one class position gives three hundred twenty-one. Its
          class vector remains exactly unchanged."
        hold: 0.65
        visual_cues:
          - id: resolution-grid-beat-1
            phrase: Separate the class position, reshape only patch positions into their
              two-dimensional grid, resize each feature channel, flatten and
              reattach class
            targets:
              - resolution-grid-mechanism
            color: yellow
            linger: 0.65
      - say: Original ViT interpolates the patch positions in two dimensions. Google's reference uses linear
          interpolation. The rectangle here uses PyTorch's bicubic interpolation with align corners false.
          When you resize a checkpoint, use its interpolation settings, then check recognition on the larger images.
        hold: 0.65
        visual_cues:
          - id: resolution-grid-beat-2
            phrase: interpolates the patch positions in two dimensions
            targets:
              - resolution-grid-mechanism
            color: cyan
            linger: 0.65
  - id: rotary-grid
    title: Row and column offsets rotate different coordinate pairs
    visual: Two pairs of coordinates rotate separately for row and column. Moving just the key changes the dot product, while translating query and key together preserves it.
    beats:
      - say: Two-dimensional rotary positions rotate queries and keys rather than adding
          an absolute vector to every token. In one simple construction, split
          the head width into row and column groups, each containing paired
          coordinates. This construction needs width divisible by four; actual
          implementations can allocate axes differently.
        hold: 0.65
        visual_cues:
          - id: rotary-grid-beat-0
            phrase: Two-dimensional rotary positions rotate queries and keys rather than
              adding an absolute vector to every token
            targets:
              - rotary-grid-mechanism
            color: cyan
            linger: 0.65
      - say: "For an explicitly toy four-coordinate head, let both content vectors be
          one, zero, one, zero and choose ninety degrees per coordinate unit. At
          the same location their dot product is two. Move only the key one row:
          its row pair rotates and the dot product becomes one. Translate both
          positions by the same row and column offsets; the score remains one
          because the relative offsets remain."
        hold: 0.65
        visual_cues:
          - id: rotary-grid-beat-1
            phrase: For an explicitly toy four-coordinate head, let both content vectors be
              one, zero, one, zero and choose ninety degrees per coordinate unit
            targets:
              - rotary-grid-mechanism
            color: yellow
            linger: 0.65
          - id: rotary-key-row
            phrase: Move only the key one row
            targets:
              - rotary-grid-mechanism
            color: yellow
            linger: 0.6
          - id: rotary-translate
            phrase: Translate both positions by the same row and column offsets
            targets:
              - rotary-grid-mechanism
            color: yellow
            linger: 0.6
      - say: The score still depends on the content vectors. Rotary positions avoid
          resizing a learned absolute table, but do not remove token limits or
          guarantee extrapolation quality. Qwen two point five VL uses its own
          spatial rotary construction, resizes dimensions to multiples of
          twenty-eight and merges neighboring patches before the language model.
        hold: 0.65
        visual_cues:
          - id: rotary-grid-beat-2
            phrase: The score still depends on the content vectors
            targets:
              - rotary-grid-mechanism
            color: cyan
            linger: 0.65
  - id: attention
    title: What can the banner read?
    visual: Three regions of the incident screenshot supply explicit two-coordinate keys and values. Colored
      contributions accumulate on the banner’s two output coordinates. A causal-mask replay removes the
      two later regions and renormalizes the first weight.
    beats:
      - say: Put a query on the banner. For this small example, use the same two numbers as the key and the
          value at each marked patch. The banner's query is one, zero. Its dot product with the Retry key
          is one. Divide by the square root of two to get the score. Softmax turns the three scores into
          weights. The banner starts with a zero in its second coordinate. Can Retry contribute to that
          coordinate?
        hold: 2.4
        visual_cues:
          - id: attention-locations
            phrase: each marked patch
            targets:
              - attention-image
              - attention-weights
            color: cyan
            linger: 0.38
          - id: attention-softmax
            phrase: Softmax turns the three scores into weights
            targets:
              - attention-weights
            color: cyan
            linger: 0.38
      - say: Start with the banner itself. Its weight adds about point four to the first coordinate and nothing
          to the second. Add the panel's share. Its value points entirely along the second coordinate. Now
          add the Retry button. Its value is one, one, so its blue piece has the same length on both bars.
          Read the endpoints. The banner's new second coordinate is about point six, and most of it came
          from Retry.
        caption_starts:
          - Add the panel's share
          - Now add the Retry button
          - The banner's new second coordinate
        hold: 1.1
        visual_cues:
          - id: attention-banner
            phrase: Start with the banner itself
            targets:
              - contextual-patch-sum
              - attention-weights
            color: red
            linger: 0.38
          - id: attention-panel
            phrase: Add the panel's share
            targets:
              - contextual-patch-sum
              - attention-weights
            color: yellow
            linger: 0.38
          - id: attention-button
            phrase: Now add the Retry button
            targets:
              - contextual-patch-sum
              - attention-weights
            color: blue
            linger: 0.38
        motion_check:
          region:
            - 475
            - 780
            - 860
            - 165
          minimumChangedFraction: 0.002
      - say: Keep those three values and apply a decoder's causal mask. The panel and Retry come later in raster
          order, so the first query can see only the banner. Its weight becomes one. The second coordinate
          is back at zero. Original ViT uses bidirectional attention because the whole picture is already
          present. Other encoders can limit attention to a window or mask padding.
        hold: 1
        visual_cues:
          - id: attention-mask
            phrase: apply a decoder's causal mask
            targets:
              - attention-weights
              - contextual-patch-sum
            color: pink
            linger: 0.38
  - id: preln-block
    title: Each sublayer adds an update to the retained state
    visual: A supplied attention update changes [2, 4] to [2.5, 3.5]. The normalized branch passes through an expansion, GELU and a contraction before its update joins the retained state.
    beats:
      - say: Build the original ViT block around the state we must retain. Normalize the
          incoming vector, run multi-head attention, then add that attention
          update to the original incoming vector. Normalize this new residual
          state, run the position-wise MLP, then add its update to that same
          residual. Normalization does not replace either skip path.
        hold: 0.65
        visual_cues:
          - id: preln-block-beat-0
            phrase: Build the original ViT block around the state we must retain
            targets:
              - preln-block-mechanism
            color: cyan
            linger: 0.65
      - say: In a supplied two-coordinate toy, input two, four receives attention update
          one half, minus one half, giving two point five, three point five.
          With unit normalization gain, zero bias and epsilon one
          hundred-thousandth, the next normalized coordinates are approximately
          minus one and one. Our displayed first linear map expands them to four
          coordinates, then GELU acts on each, and the displayed second map
          returns two updates. The final state is approximately two point three
          four one, four point three four one.
        hold: 0.65
        visual_cues:
          - id: preln-block-beat-1
            phrase: In a supplied two-coordinate toy, input two, four receives attention
              update one half, minus one half, giving two point five, three
              point five
            targets:
              - preln-block-mechanism
            color: yellow
            linger: 0.65
          - id: preln-first-residual
            phrase: giving two point five, three point five
            targets:
              - preln-block-mechanism
            color: yellow
            linger: 0.6
          - id: preln-normalize
            phrase: the next normalized coordinates are approximately minus one and one
            targets:
              - preln-block-mechanism
            color: yellow
            linger: 0.6
          - id: preln-expand
            phrase: Our displayed first linear map expands them to four coordinates
            targets:
              - preln-block-mechanism
            color: yellow
            linger: 0.6
          - id: preln-gelu
            phrase: then GELU acts on each
            targets:
              - preln-block-mechanism
            color: yellow
            linger: 0.6
          - id: preln-final
            phrase: The final state is approximately
            targets:
              - preln-block-mechanism
            color: yellow
            linger: 0.6
      - say: The MLP runs independently at each position while sharing weights across
          positions; attention routes information between positions. Real
          ViT-Base uses hidden width seven hundred sixty-eight, twelve blocks
          and twelve heads of width sixty-four. Queries and keys have shape
          batch, twelve, one hundred ninety-seven, sixty-four; the MLP expands
          width to three thousand seventy-two and projects back. Final LayerNorm
          precedes class readout or patch-feature handoff.
        hold: 0.65
        visual_cues:
          - id: preln-block-beat-2
            phrase: The MLP runs independently at each position while sharing weights across
              positions; attention routes information between positions
            targets:
              - preln-block-mechanism
            color: cyan
            linger: 0.65
  - id: inductive-bias
    title: Architecture and training recipe are both variables
    visual: A convolution’s receptive field grows over a fixed grid. A second grid shows which patches a full-attention layer can connect in one step.
    beats:
      - say: A small convolution connects nearby pixels; stacking layers expands its
          receptive field without requiring downsampling. On an ideal grid,
          stride-one convolution is translation-equivariant. Finite boundaries
          and padding qualify that statement, and strided sampling generally
          preserves it only for stride-aligned shifts.
        hold: 0.65
        visual_cues:
          - id: inductive-bias-beat-0
            phrase: A small convolution connects nearby pixels; stacking layers expands its
              receptive field without requiring downsampling
            targets:
              - inductive-bias-mechanism
            color: cyan
            linger: 0.65
      - say: Original ViT has weaker image-specific bias but still groups neighboring
          pixels into patches and uses the grid for position resizing. Full
          attention permits immediate distant connections. The original paper’s
          smaller-data training setup underperformed comparable ResNets, while
          larger-scale pretraining improved transfer. DeiT later showed
          competitive ImageNet-only ViTs with a stronger recipe and optional
