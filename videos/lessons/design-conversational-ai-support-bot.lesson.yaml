  - id: evaluation
    title: Evaluate both the conversation and the effect ledger
    visual: Twelve executable case fixtures produce six handoffs, three abstentions, one policy reply, one
      confirmation request and one queued action. Independent expected effects detect an extra write and a
      missing write despite unchanged outcome labels.
    beats:
      - say: >
          Replay twelve cases through the same gate and queue. They cover ownership, missing policy, stale
          charges, item mismatch, confirmation and duplicates. Compare every outcome with its declared
          expectation. Compare queue records with independently specified expected effects.
        hold: 0.6
        visual_cues:
          - id: twelve-cases
            phrase: Replay twelve cases
            targets:
              - regression-cases
            color: blue
            linger: 0.5
          - id: expected-effects
            phrase: queue records with independently specified expected effects
            targets:
              - effect-accounting
            color: cyan
            linger: 0.5
      - say: >
          Inject an extra queue record while retaining every conversational outcome. The label comparisons
          still pass, but the effect comparison detects an unexpected write and holds release. This is why
          testing only the assistant's final sentence leaves a dangerous gap.
        hold: 0.6
        visual_cues:
          - id: unexpected-write
            phrase: extra queue record
            targets:
              - effect-accounting
              - release-verdict
            color: pink
            linger: 0.5
      - say: >
          Remove that extra record and instead lose the expected insertion. The ledger catches the missing
          effect. A dependable support experience connects verified facts, current policy, exact
          authorization, recoverable actions and honest customer receipts. The team can inspect and improve
          those connections.
        hold: 0.8
        visual_cues:
          - id: missing-effect
            phrase: lose the expected insertion
            targets:
              - effect-accounting
              - release-verdict
            color: pink
            linger: 0.5
      - say: Twelve serial fixtures establish their declared control behavior, not population resolution or service
          capacity. Resolution needs independently checked task outcomes; apparent containment may be
          abandonment. Report repeat contacts, reopened tickets and satisfaction with observation windows and
          survey nonresponse limits. Escalation precision divides necessary escalations by all escalations;
          recall divides escalated necessary-review cases by all necessary-review cases. Measure first useful
          output separately from an acknowledgement and full resolution. Include queueing, unfinished cases,
          specialist delay, fan-out, retries, tokens and critical slices under a stated arrival load.
        hold: 0.6
        visual_cues:
          - id: outcome-metrics
            phrase: Resolution needs independently checked task outcomes
            targets:
              - outcome-metrics
            color: blue
            linger: 0.4
          - id: precision-recall
            phrase: Escalation precision divides
            targets:
              - precision-recall
            color: yellow
            linger: 0.4
          - id: arrival-load
            phrase: under a stated arrival load
            targets:
              - arrival-load
            color: cyan
            linger: 0.4
