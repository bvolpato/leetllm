version: 1
id: design-conversational-ai-support-bot
title: A Support Assistant That Can Explain Every Action
source: system-design/design-conversational-ai-support-bot/content.md
voice: en-US-AndrewNeural
rate: +0%
sources:
  - title: Stripe API idempotent requests
    url: https://docs.stripe.com/api/idempotent_requests
  - title: PostgreSQL transaction isolation
    url: https://www.postgresql.org/docs/current/transaction-iso.html
  - title: WHATWG server-sent events
    url: https://html.spec.whatwg.org/multipage/server-sent-events.html
  - title: LangChain Human-in-the-loop
    url: https://docs.langchain.com/oss/python/langchain/human-in-the-loop
  - title: Large Language Models Cannot Self-Correct Reasoning Yet
    url: https://arxiv.org/abs/2310.01798
  - title: Distributed Locks with Redis
    url: https://redis.io/docs/latest/develop/clients/patterns/distributed-locks/
scenes:
  - id: intro
    title: A helpful answer must agree with the actual case
    visual: Alex's fictional duplicate-charge request follows invoice evidence, published policy and an
      application-owned action gate. The model drafts the customer explanation.
    beats:
      - say: >
          Alex opens a support ticket. A GPU invoice appears to contain a duplicate charge. Alex wants a clear
          explanation and a reliable next step. Our invoice shows nine hundred dollars.
        hold: 0.6
        visual_cues:
          - id: invoice-case
            phrase: GPU invoice
            targets:
              - invoice-record
            color: blue
            linger: 0.5
      - say: >
          A support assistant connects conversation to trusted business records. Invoice tools establish
          facts, published policy establishes eligibility, and application code authorizes actions. The
          language model turns that evidence into a useful explanation. Each boundary is testable.
        hold: 0.6
        visual_cues:
          - id: trusted-boundaries
            phrase: Invoice tools establish facts, published policy establishes eligibility, and application code
              authorizes actions
            targets:
              - invoice-record
              - published-policy
              - action-boundary
            color: cyan
            linger: 0.5
      - say: >
          We will follow this case through state, retrieval, parallel reads and a guarded queue. Our sample
          policy sends larger requests to a specialist. Smaller eligible requests need an exact confirmation
          before entering the credit queue.
        hold: 0.6
        visual_cues:
          - id: specialist-policy
            phrase: larger requests to a specialist
            targets:
              - specialist-route
            color: yellow
            linger: 0.5
  - id: channels-and-fences
    title: Keep turns, streams and concurrent workers on one case clock
    visual: Construct the stated support-case mechanism with persistent case identity, exact source records and an
      earned outcome.
    beats:
      - say: Client turns arrive through an incoming HTTP request or a bidirectional channel. Server-sent events carry
          server updates toward the client; the incoming turn needs its own channel. Deduplicate webhook event
          IDs, rate-limit the authenticated tenant and serialize accepted case updates. Intent distinguishes a
          public policy question, an authorized private read and a proposed write, but intent itself grants no
          authority.
        hold: 0.6
        visual_cues:
          - id: incoming-turn
            phrase: incoming HTTP request
            targets:
              - incoming-turn
            color: blue
            linger: 0.4
          - id: outgoing-sse
            phrase: Server-sent events carry server updates
            targets:
              - outgoing-sse
            color: cyan
            linger: 0.4
          - id: dedup-event
            phrase: Deduplicate webhook event IDs
            targets:
              - dedup-event
            color: yellow
            linger: 0.4
      - say: A Redis lease can expire while its old worker continues. Give each ownership period an increasing fencing
          token and make the protected resource reject stale tokens. Keep financial uniqueness in the
          authoritative shared database. Row locks protect selected rows; advisory locks coordinate only code
          paths that honor them. Transaction-level advisory locks end with the transaction. Use short
          state-transition transactions rather than holding one open while waiting for a model or customer.
        hold: 0.6
        visual_cues:
          - id: lease-expiry
            phrase: lease can expire while its old worker continues
            targets:
              - lease-expiry
            color: pink
            linger: 0.4
          - id: fencing-token
            phrase: increasing fencing token
            targets:
              - fencing-token
            color: yellow
            linger: 0.4
          - id: reject-fence
            phrase: protected resource reject stale tokens
            targets:
              - reject-fence
            color: pink
            linger: 0.4
      - say: One supervisor owns accepted case state and final disposition. Independent policy and invoice workers get
          narrow typed jobs, scoped credentials, deadlines and bounded outputs. Validate request identity,
          revision, successful outcome and source evidence before merging their observations. Separate context
          windows do not enforce access. Worker counts and queues consume capacity and tokens, so compare a
          simple single-agent workflow before expanding fan-out. Published research-system token multipliers
          are workload observations, not support-bot capacity laws.
        hold: 0.6
        visual_cues:
          - id: scoped-jobs
            phrase: narrow typed jobs
            targets:
              - scoped-jobs
            color: blue
            linger: 0.4
          - id: merge-jobs
            phrase: before merging their observations
            targets:
              - merge-jobs
            color: green
            linger: 0.4
  - id: state
    title: Every observation belongs to one revision of one case
    visual: A worker receipt binds customer, invoice and state revision. A stale invoice result fails the merge
      predicate; a fresh matching result is accepted.
    beats:
      - say: >
          Keep the authenticated customer, invoice identifier, line item and amount in typed application
          state. Store money as integer cents. Summaries help conversation flow; the invoice tool supplies the
          authoritative amount.
        hold: 0.6
        visual_cues:
          - id: typed-invoice
            phrase: typed application state
            targets:
              - current-invoice
            color: blue
            linger: 0.5
      - say: >
          Alex switches to a different invoice while a worker is running. The state revision advances. The old
          worker returns with the original invoice and revision, so the merge check rejects it. A valid
          observation could otherwise contaminate the wrong request.
        hold: 0.6
        visual_cues:
          - id: invoice-switch
            phrase: state revision advances
            targets:
              - current-invoice
            color: yellow
            linger: 0.5
          - id: reject-stale
            phrase: merge check rejects it
            targets:
              - worker-receipt
              - merge-fence
            color: pink
            linger: 0.5
      - say: >
          A fresh worker reads the new invoice and carries the matching revision and customer scope. Its
          receipt passes the merge check. The supervisor owns state updates; read workers return observations.
          This division clarifies concurrent work.
        hold: 0.6
        visual_cues:
          - id: fresh-receipt
            phrase: matching revision and customer scope
            targets:
              - worker-receipt
              - merge-fence
            color: green
            linger: 0.5
      - say: Keep dialogue, operational state and retrievable history separate. Suppose a lossy summary says ninety
          dollars while validated state says nine hundred. The action gate reads the validated amount. A
          schema validates shape, not the extracted amount’s truth. Verify it against the invoice and require
          an application-rendered exact confirmation when automation is permitted. Derive identity, tenant and
          region from server state, include them in state and action keys, and treat a connection-local
          transcript buffer as nondurable. The reference fixture stores Decimal dollars with cent precision;
          our equivalent visual amounts use integer cents. Reject nonfinite, negative, zero and sub-cent
          financial requests.
        hold: 0.6
        visual_cues:
          - id: summary-conflict
            phrase: summary says ninety dollars
            targets:
              - summary-conflict
            color: pink
            linger: 0.4
          - id: trusted-amount
            phrase: action gate reads the validated amount
            targets:
              - trusted-amount
            color: green
            linger: 0.4
  - id: contract-and-fallback
    title: Preserve two contracts through generation and retries
    visual: Construct the stated support-case mechanism with persistent case identity, exact source records and an
      earned outcome.
    beats:
      - say: Compile the current gateway policy and support action policy before retrieval or drafting. The contract
          carries ticket identity, private-data class, policy versions, citation and review requirements,
          response schema and generation ceiling. A published policy ID and its exact reviewed content must
          agree with executable rules under one immutable version. A hash detects changed bytes; trusted
          publication and subject review establish whether those rules are appropriate.
        hold: 0.6
        visual_cues:
          - id: compile-contract
            phrase: Compile the current gateway policy and support action policy
            targets:
              - compile-contract
            color: yellow
            linger: 0.4
          - id: version-content
            phrase: exact reviewed content must agree
            targets:
              - version-content
            color: blue
            linger: 0.4
      - say: The reference routing stub declares a half-cent per-generation ceiling and returns lane metadata, without
          calling a model or enforcing actual billing. Its private fallback keeps the same declared private,
          cited and review disposition. A real adapter must enforce processor eligibility, returned output,
          actual usage and shared attempt, deadline and spend reservations. A permitted fallback cannot relax
          that contract. Repeated unproductive calls need a bounded recovery rule; a single empty state change
          can be a legitimate status poll. Approved polling needs its own cadence and stopping condition.
        hold: 0.6
        visual_cues:
          - id: stub-ceiling
            phrase: half-cent per-generation ceiling
            targets:
              - stub-ceiling
            color: yellow
            linger: 0.4
          - id: fallback-contract
            phrase: permitted fallback cannot relax that contract
            targets:
              - fallback-contract
            color: pink
            linger: 0.4
      - say: Private billing writes bypass a public answer cache. A promoted public-policy cache needs region,
          effective policy version and access scope in its identity, with invalidation when they change.
          Minimize private inputs and protect any reversible redaction map. Injection screening can miss
          adaptive attacks and differs from harmful-content classification. A detector acceptance, a supplied
          citation ID or a correct JSON shape establishes no business authority or semantic claim support.
        hold: 0.6
        visual_cues:
          - id: private-cache
            phrase: Private billing writes bypass a public answer cache
            targets:
              - private-cache
            color: pink
            linger: 0.4
          - id: cache-version
            phrase: invalidation when they change
            targets:
              - cache-version
            color: yellow
            linger: 0.4
          - id: screen-authority
            phrase: establishes no business authority
            targets:
              - screen-authority
            color: pink
            linger: 0.4
  - id: evidence
    title: Retrieval admits evidence through a positive policy contract
    visual: Published US policy version three passes region, topic, effective-version and content-digest checks.
      EU text, private notes and stale policy versions fail distinct checks.
    beats:
      - say: >
          Return to Alex's original invoice. Retrieval finds several plausible documents. Admit the published
          policy for the customer's region, relevant topic and current version, with trusted publication
          evidence and matching content. European policy and private notes fail that contract.
        hold: 0.6
        visual_cues:
          - id: admit-policy
            phrase: published policy for the customer's region, relevant topic and current version
            targets:
              - policy-documents
              - admission-verdicts
            color: green
            linger: 0.5
      - say: >
          Now edit the admitted document while retaining its old content digest. Verification detects changed
          bytes and admits no policy. The assistant asks for review. A hash establishes identity; publication
          and subject review establish appropriateness.
        hold: 0.6
        visual_cues:
          - id: changed-bytes
            phrase: edit the admitted document
            targets:
              - policy-documents
              - admission-verdicts
            color: pink
            linger: 0.5
      - say: >
          Change the case region to Canada. This small corpus contains no matching published policy, so the
          assistant abstains from an eligibility claim. Preserve that reason for the specialist. Retrieval
          must recognize evidence gaps.
        hold: 0.6
        visual_cues:
          - id: missing-region
            phrase: no matching published policy
            targets:
              - policy-documents
              - admission-verdicts
            color: pink
            linger: 0.5
  - id: policy
    title: A confirmation authorizes a precise proposed action
    visual: The policy function checks identity, ownership, item, amount, age, current evidence and confirmation.
      The original high-value case routes to a human; a separate small request progresses from confirmation to
      queue eligibility.
    beats:
      - say: >
          The original charge is nine days old and the duplicate is verified. Our published fixture policy has
          a thirty-day window and a five-hundred-dollar specialist threshold. The requested amount reaches
          that threshold, so the decision routes to a human.
        hold: 0.6
        visual_cues:
          - id: specialist-threshold
            phrase: five-hundred-dollar specialist threshold
            targets:
              - business-checks
              - action-outcome
            color: yellow
            linger: 0.5
      - say: >
          Consider a separate partial-credit request for thirty-five dollars on the same invoice. Its business
          checks pass, but confirmation is missing. Ask the customer to confirm the invoice, item, amount and
          policy version together. This binds consent to the proposal.
        hold: 0.6
        visual_cues:
          - id: small-proposal
            phrase: thirty-five dollars
            targets:
              - proposed-tuple
            color: blue
            linger: 0.5
          - id: bind-confirmation
            phrase: confirm the invoice, item, amount and policy version together
            targets:
              - proposed-tuple
              - confirmed-tuple
            color: cyan
            linger: 0.5
      - say: >
          Supply a confirmation bound to those exact values. Compare each field, and the action becomes
          eligible for the queue. The executor still rechecks current state at insertion. Now change the
          proposed amount while retaining the old confirmation. That mismatch requires a new confirmation
          before the action can proceed.
        hold: 0.6
        visual_cues:
          - id: compare-confirmation
            phrase: Compare each field
            targets:
              - tuple-comparisons
              - confirmed-tuple
            color: green
            linger: 0.5
          - id: queue-eligible
            phrase: action becomes eligible for the queue
            targets:
              - action-outcome
            color: green
            linger: 0.5
          - id: change-proposal
            phrase: change the proposed amount while retaining the old confirmation
            targets:
              - proposed-tuple
              - confirmed-tuple
              - action-outcome
            color: pink
            linger: 0.5
      - say: "The five-hundred-dollar specialist boundary is inclusive: an otherwise valid request for exactly five
          hundred still needs review. Customer confirmation cannot lift it. The reference queue fixture
          permits one smaller partial request no larger than the verified duplicate; its
          one-request-per-invoice rule is not a complete partial-credit balance system. The reader’s small
          helper uses the stricter full-duplicate equality rule. Both are declared toy policies. State the
          chosen amount contract explicitly; changing a low amount to another low amount still invalidates the
          exact proposal and confirmation binding."
        hold: 0.6
        visual_cues:
          - id: inclusive-boundary
            phrase: exactly five hundred still needs review
            targets:
              - inclusive-boundary
            color: pink
            linger: 0.4
          - id: two-amount-contracts
            phrase: Both are declared toy policies
            targets:
              - two-amount-contracts
            color: blue
            linger: 0.4
  - id: parallel
    title: Parallelize independent reads and join their evidence
    visual: A constructed serial schedule takes six time units; parallel invoice and policy reads join before a
      one-unit merge, taking four. A supplied timeout branch prevents the join from authorizing an action.
    beats:
      - say: >
          The policy read and invoice read are independent once their identifiers are fixed. First watch a
          constructed serial schedule. One read follows the other, and the supervisor merges their matching
          receipts afterward. The total includes both reads and the merge.
        hold: 0.6
        visual_cues:
          - id: serial-reads
            phrase: One read follows the other
            targets:
              - read-operations
              - read-schedule
            color: blue
            linger: 0.5
      - say: >
          Run those reads together. The merge waits for the slower branch, reducing this illustrative critical
          path. Both receipts still need successful outcomes and matching state identities. Parallel execution
          changes scheduling; the business authorization function remains the same.
        hold: 0.6
        visual_cues:
          - id: parallel-reads
            phrase: Run those reads together
            targets:
              - read-operations
              - read-schedule
            color: cyan
            linger: 0.5
          - id: wait-slower
            phrase: merge waits for the slower branch
            targets:
              - read-schedule
              - join-outcome
            color: yellow
            linger: 0.5
        motion_check:
          region:
            - 180
            - 530
            - 1560
            - 500
          minimumChangedFraction: 0.002
      - say: >
          In a separate supplied trace, the invoice read times out. The join now reports missing evidence and
          holds the action. Bound retries, deadlines and total request spend across every attempt. A
          specialist can continue from the retained observations and failure reason.
        hold: 0.6
        visual_cues:
          - id: timeout-reads
            phrase: In a separate supplied trace
            targets:
              - read-operations
              - read-schedule
            color: cyan
            linger: 0.5
          - id: read-timeout
            phrase: times out
            targets:
              - read-operations
              - read-schedule
              - join-outcome
            color: pink
            linger: 0.5
  - id: ledger
    title: A retry should recover the first queued result
    visual: A retained operation key and canonical payload protect a simulated credit queue. The same request
      returns the original entry; changed parameters conflict. Invoice uniqueness provides a separate fence
      across tickets.
    beats:
      - say: >
          Follow the confirmed small request into a simulated credit queue. The insert succeeds, but its
          response is lost. The customer interface now has an uncertain outcome. Retain the operation key,
          exact payload and queued result so a retry can recover that result.
        hold: 0.6
        visual_cues:
          - id: insert-credit
            phrase: insert succeeds
            targets:
              - credit-request
              - queue-entry
            color: green
            linger: 0.5
          - id: lose-reply
            phrase: response is lost
            targets:
              - queue-entry
              - delivery-receipt
            color: pink
            linger: 0.5
      - say: >
          Retry with the same key and identical parameters. The queue returns its existing entry, leaving one
          pending operation. A queued credit still needs downstream processing. Customer language should
          describe the observed status and provide a reference for follow-up.
        hold: 0.6
        visual_cues:
          - id: retry-payload
            phrase: same key and identical parameters
            targets:
              - operation-key
              - credit-request
              - queue-entry
            color: cyan
            linger: 0.5
          - id: recover-entry
            phrase: returns its existing entry
            targets:
              - queue-entry
              - delivery-receipt
            color: green
            linger: 0.5
      - say: >
          Reuse the key with a changed amount and the payload comparison rejects it. A separate invoice fence
          catches another ticket requesting the same credit. Production storage must enforce these decisions
          atomically, including concurrency, retention and recovery after an interrupted request.
        hold: 0.6
        visual_cues:
          - id: changed-payload
            phrase: changed amount
            targets:
              - credit-request
              - queue-outcome
            color: pink
            linger: 0.5
          - id: invoice-unique-fence
            phrase: A separate invoice fence catches another ticket requesting the same credit
            targets:
              - other-ticket
              - invoice-unique-fence
              - queue-entry
            color: pink
            linger: 0.65
      - say: These dictionaries demonstrate serial key and invoice checks only. Two processes can both observe an
          empty local queue. Enforce shared uniqueness, balance rules and an outbox atomically in the
          authoritative database; revalidate again before the later billing worker applies the credit. Stripe
          API version one retains the first executed response, including errors, while its key is retained;
          pruning after at least twenty-four hours can allow a new request. API version two uses a different
          failed-work retry contract. Read the destination’s actual version, parameter and retention rules
          before replaying. A local queued result establishes a pending request, not settled money.
        hold: 0.6
        visual_cues:
          - id: local-race
            phrase: Two processes can both observe an empty local queue
            targets:
              - local-race
            color: pink
            linger: 0.4
          - id: atomic-outbox
            phrase: outbox atomically
            targets:
              - atomic-outbox
            color: green
            linger: 0.4
          - id: destination-version
            phrase: API version two uses a different failed-work retry contract
            targets:
              - destination-version
            color: yellow
            linger: 0.4
  - id: repair-and-status
    title: Render observed status and bound explanation repair
    visual: Construct the stated support-case mechanism with persistent case identity, exact source records and an
      earned outcome.
    beats:
      - say: The trusted state says no credit was applied, but a draft says I have credited nine hundred dollars. The
          small reader phrase-list experiment flags a prohibited promise and a missing citation. Its alternate
          wording, your refund is on the way, passes that limited list despite the same unsupported promise. A
          citation ID identifies a record; a semantic check must still determine whether the passage supports
          the actual claim.
        hold: 0.6
        visual_cues:
          - id: bad-promise
            phrase: draft says I have credited nine hundred dollars
            targets:
              - bad-promise
            color: pink
            linger: 0.4
          - id: phrase-catch
            phrase: flags a prohibited promise and a missing citation
            targets:
              - phrase-catch
            color: pink
            linger: 0.4
          - id: phrase-miss
            phrase: passes that limited list
            targets:
              - phrase-miss
            color: yellow
            linger: 0.4
      - say: Render money and case-status sentences from validated state. The model can draft the explanation around
          that status, and that explanation still needs support and privacy checks. A safer restricted
          response can use only the status template and admitted passage. Keep every proposed tool call from a
          rejected draft away from dispatch. Screening, exact status templates and independent sampled review
          address different failure paths.
        hold: 0.6
        visual_cues:
          - id: state-template
            phrase: Render money and case-status sentences from validated state
            targets:
              - state-template
            color: green
            linger: 0.4
          - id: no-dispatch
            phrase: away from dispatch
            targets:
              - no-dispatch
            color: pink
            linger: 0.4
      - say: Allow at most one revision in this proposed repair policy. Supply the original admitted evidence and
          violation codes, retain the same contract and permissions, then rerun every check. If access or
          policy changes, discard the draft and rebuild current authority. The initial call, provider fallback
          and application repair all consume the same request-wide attempts, deadline and spend budget. With a
          two-attempt cap, a timeout followed by a failed fallback leaves zero revisions. Exhaustion or a
          failed revision ends in the declared abstention or acknowledged handoff. This is a proposed verifier
          design; the reference lab calls no generator or semantic judge.
        hold: 0.6
        visual_cues:
          - id: one-revision
            phrase: Allow at most one revision
            targets:
              - one-revision
            color: blue
            linger: 0.4
          - id: same-authority
            phrase: retain the same contract and permissions
            targets:
              - same-authority
            color: yellow
            linger: 0.4
          - id: no-attempts
            phrase: leaves zero revisions
            targets:
              - no-attempts
            color: pink
            linger: 0.4
  - id: handoff
    title: A handoff needs an acknowledged destination
    visual: A minimal specialist packet retains verified evidence and reason. A supplied matching queue
      acknowledgment enables a precise customer receipt. An unverified identity produces a redacted packet.
    beats:
      - say: >
          Return to the original high-value case. Prepare a specialist packet with the verified invoice,
          policy reference, requested action and reason for review. Include the evidence needed to continue. A
          prepared packet establishes what we intend to send.
        hold: 0.6
        visual_cues:
          - id: prepare-packet
            phrase: specialist packet with the verified invoice, policy reference, requested action and reason for review
            targets:
              - specialist-packet
            color: blue
            linger: 0.5
      - say: >
          Our extended service fixture supplies a queue acknowledgment bound to this packet. Only that
          matching receipt supports telling Alex that the specialist review is queued. Show the review
          reference and next step. Keep acknowledgment separate from the eventual specialist decision.
        hold: 0.6
        visual_cues:
          - id: matching-ack
            phrase: matching receipt supports telling Alex
            targets:
              - specialist-packet
              - delivery-acknowledgment
            color: green
            linger: 0.5
      - say: >
          Remove verified identity and rebuild the packet. Private customer and invoice fields disappear from
          its allowed output. Escalation should preserve useful context while respecting access boundaries.
          Every destination needs its own authenticated delivery contract and failure handling.
        hold: 0.6
        visual_cues:
          - id: restrict-output
            phrase: Private customer and invoice fields disappear from its allowed output
            targets:
              - private-host-record
              - delivery-allowlist
              - restricted-packet
            color: yellow
            linger: 0.5
      - say: A later approval comes from an authenticated review service, bound to the exact action, policy, reviewer
          permissions, expiry and one-time consumption. Track waiting, accepted, resolved and expired review
          tasks. Recheck live ownership, evidence, balances and policy on resume. Framework pause and resume
          require the correct persisted checkpoint and thread identity; they do not establish those business
          permissions. If submission timed out, retain unknown effect status until reconciliation resolves the
          original operation.
        hold: 0.6
        visual_cues:
          - id: approval-scope
            phrase: bound to the exact action
            targets:
              - approval-scope
            color: blue
            linger: 0.4
          - id: resume-current
            phrase: Recheck live ownership
            targets:
              - resume-current
            color: yellow
            linger: 0.4
          - id: unknown-effect
            phrase: unknown effect status
            targets:
              - unknown-effect
            color: pink
            linger: 0.4
  - id: ticket-budget
    title: Reconstruct the supplied two-draft bill
    visual: Construct the stated support-case mechanism with persistent case identity, exact source records and an
      earned outcome.
    beats:
      - say: "The reader’s separate budget demonstration uses a one-cent ceiling per generation, a three-hundred-token
          output cap, two attempts, a two-cent task cap and a twenty-five-hundred-millisecond deadline. Use
          its supplied dated rates per million tokens: fresh input two dollars fifty, cached input twenty-five
          cents and output fifteen dollars. These are the demonstration’s price inputs, not a current price
          guarantee. Fresh input equals total input minus cached reads. Multiply each category by its own
          rate, add, then divide by one million."
        hold: 0.6
        visual_cues:
          - id: budget-inputs
            phrase: supplied dated rates per million tokens
            targets:
              - budget-inputs
            color: blue
            linger: 0.4
          - id: fresh-minus-cache
            phrase: Fresh input equals total input minus cached reads
            targets:
              - fresh-minus-cache
            color: yellow
            linger: 0.4
      - say: "The first draft has two thousand input tokens, twelve hundred eighty cached reads and one hundred thirty
          output tokens. Its charge is point zero zero four zero seven dollars. The revision has twenty-one
          hundred seventy input, nineteen hundred twenty cached and one hundred thirty output; its charge is
          point zero zero three zero five five. Total point zero zero seven one two five. Conservatively
          reserve all input as fresh and three hundred output tokens: point zero zero nine five and point zero
          zero nine nine two five, each below one cent. Reads take one hundred eighty milliseconds, each draft
          nine hundred forty, and each check ten: total twenty hundred eighty, leaving four hundred twenty.
          Fifty revisions daily for thirty days add about four dollars fifty-eight under these inputs."
        hold: 0.6
        visual_cues:
          - id: first-bill
            phrase: charge is point zero zero four zero seven
            targets:
              - first-bill
            color: green
            linger: 0.4
          - id: revision-bill
