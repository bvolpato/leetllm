  - id: objective-choice
    title: What goes into the mean loss?
    visual: The same seventeen input tokens stay fixed. Eligible predictions feed an eight-term mean, a sixteen-term mean, or an empty set that has no mean.
    beats:
      - say: >-
          Keep the eight targets we just marked. For each one, take minus the natural logarithm of the probability the model assigned to the token that actually came next. A confident correct guess costs less. Add the eight losses and divide by eight. An ignored label adds nothing to either part of that fraction.
        hold: 0.9
        visual_cues:
          - id: objective-mean
            phrase: "Add the eight losses and divide by eight"
            targets: [loss-divisor]
            color: cyan
            linger: 0.35
      - say: >-
          Change just the objective. Score the whole transcript and we get sixteen targets. There are still seventeen inputs. The very first token has no earlier predictor in this row. This choice can train a model to predict user text too. Studies have found benefits in some long-prompt, short-answer and small-data settings. Compare the objectives on held-out conversations for your task.
        hold: 1
        visual_cues:
          - id: objective-full
            phrase: "Score the whole transcript and we get sixteen targets"
            targets: [scored-pieces, loss-divisor]
            color: cyan
            linger: 0.35
      - say: >-
          Now suppose a bad mask ignores every target. The denominator falls to zero. Reject that row before taking the mean. Lowering the learning rate cannot restore a missing target. In a good row, prompt representations can still affect the reply through attention and shared weights, even when their own labels are ignored.
        hold: 1
        visual_cues:
          - id: objective-empty
            phrase: "a bad mask ignores every target"
            targets: [scored-pieces, loss-divisor]
            color: cyan
            linger: 0.35
