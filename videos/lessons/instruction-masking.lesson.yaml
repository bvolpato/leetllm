  - id: serving-parity
    title: An input repair precedes the quality comparison
    visual: An input repair precedes the quality comparison.
    beats:
      - say: The training manifest binds checkpoint, tokenizer revision, resolved template and whether special tokens
          are added after rendering. The matching article candidate proceeds to evaluation. The drifted
          candidate changes the template family and enables a second special-token pass; both differences
          block it before a model-quality decision.
        hold: 0.6
        visual_cues:
