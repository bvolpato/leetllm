        hold: 0.85
        visual_cues:
          - id: role-validation-b3
            phrase: Message roles describe structure; they do not guarantee obedience or trusted provenance.
            targets:
              - role-validation-construction
            color: cyan
            linger: 0.5
          - id: im-false-content
