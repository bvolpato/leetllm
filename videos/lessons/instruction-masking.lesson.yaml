  - id: typed-control
    title: Who supplied these five characters?
    visual: Two identical printed endings have different owners. A benign quoted-marker fixture in the pinned tokenizer shows why a defensive check also needs the message boundaries.
    beats:
      - say: >-
          A manual quotes the five characters on the left. The template uses the same spelling to end a turn. Our toy encoder knows who supplied each piece. It assigns the template ending a single control ID, two. For quoted text it assigns one ordinary ID to each character. You can read the same five characters on screen and send very different IDs to the model.
        hold: 0.8
        visual_cues:
          - id: typed-toy
            phrase: "one ordinary ID to each character"
            targets: [typed-example]
            color: cyan
            linger: 0.35
      - say: >-
          Now inspect the article’s pinned tokenizer example with a quoted instruction delimiter in an ordinary user message. The same four pieces occur twice. The first match starts at six, inside the user’s text. The second starts at eleven, at the template boundary. A checker that knows the message spans can flag the unexpected occurrence for the application’s input policy. These IDs tell us what was encoded.
        hold: 1
        visual_cues:
          - id: typed-match
            phrase: "The same four pieces occur twice"
            targets: [typed-spans]
            color: cyan
            linger: 0.35
      - say: >-
          The reserved end spelling also needs care. With default encoding, quoted end text can produce ID two here. Split special spellings across the whole rendered transcript and both occurrences break into ordinary pieces. That loses the template’s genuine control token and still leaves ordinary delimiters to handle. Apply the input policy to the user content and verify the serialized result.
        hold: 0.9
        visual_cues:
          - id: typed-split
            phrase: "both occurrences break into ordinary pieces"
            targets: [encoding-policy]
            color: cyan
            linger: 0.35
  - id: payload-scope
    title: What did the tokenizer check establish?
    visual: Reported translation outcomes stay attached to their three input conditions. A separate comparison shows which claims need a rendered request, a tokenizer, or a behavioral evaluation.
    beats:
      - say: >-
          The article also reports a small translation experiment from November twenty twenty-six. On one quantized Mistral build on Apple hardware, each of five sentences was tried five times. Count replies containing only the test word. The plain-text condition gave zero out of twenty-five. With marker text the report counted twenty-four. The condition that also included an end marker gave twenty-five. These are the article’s recorded outcomes for that setup.
        hold: 0.9
        visual_cues:
          - id: historical-plain
            phrase: "zero out of twenty-five"
            targets: [observations]
            color: cyan
            linger: 0.35
          - id: historical-marker
            phrase: "the report counted twenty-four"
            targets: [observations]
            color: cyan
            linger: 0.35
          - id: historical-ending
            phrase: "an end marker gave twenty-five"
            targets: [observations]
            color: cyan
            linger: 0.35
      - say: >-
          There are three different observations here. You can inspect the text the template rendered. You can count the matching IDs and check which message owns them. To learn how the assistant responds, you need a behavioral evaluation on the deployed path. A defensive input policy can flag or rewrite risky content before rendering. Measure the remaining behavior on held-out requests.
        hold: 0.85
        visual_cues:
          - id: scope-check
            phrase: "you need a behavioral evaluation on the deployed path"
            targets: [evidence-check]
            color: cyan
            linger: 0.35
      - say: >-
          If a hosted service hides the token stream, inspect what you can see. Compare the request bodies and reported input counts. Extra tools, repeated turns or a missing tool result can change them. Include benign quoted markers in your behavioral checks, and restrict access to traces that contain user text or secrets.
        hold: 0.85
        visual_cues:
          - id: scope-hosted
            phrase: "Compare the request bodies and reported input counts"
            targets: [evidence-check]
            color: cyan
            linger: 0.35
  - id: whitespace-parity
    title: An internal space survives trimming the outside
    visual: An internal space survives trimming the outside.
    beats:
      - say: The article’s loose Jinja template places three spaces inside the stream, directly before the end marker,
          plus outer newlines. Its exact counterpart places no such gap. Trimming only the outside leaves
          those internal spaces untouched. Whitespace controls should produce the checkpoint’s intended bytes,
          including any spaces or newlines it requires.
        hold: 0.6
        visual_cues:
          - id: whitespace-parity-b1
            phrase: The article’s loose Jinja template places three spaces inside the stream, directly before the end
              marker, plus outer newlines.
            targets:
              - whitespace-parity-construction
            color: cyan
            linger: 0.5
          - id: im-inner-space
            phrase: Trimming only the outside leaves those internal spaces untouched
            targets:
              - im-inner-space
            color: yellow
            linger: 0.45
      - say: Compare bytes and token IDs separately. Tokenizer normalization can map two byte strings to the same IDs.
          A display can also show the same text while hiding an extra control ID. Neither comparison
          substitutes for the other. A digest identifies the resolved template’s content, while a filename can
          stay unchanged after an edit.
        hold: 0.6
        visual_cues:
          - id: whitespace-parity-b2
            phrase: Compare bytes and token IDs separately.
            targets:
              - whitespace-parity-construction
            color: cyan
            linger: 0.5
          - id: im-dual-parity
            phrase: Compare bytes and token IDs separately
            targets:
              - im-dual-parity
            color: yellow
            linger: 0.45
          - id: im-template-digest
            phrase: a filename can stay unchanged after an edit
            targets:
              - im-template-digest
            color: yellow
            linger: 0.45
      - say: Keep golden single-turn, multi-turn, Unicode, code-indentation, quoted-marker and supported empty-content
          cases, plus an open assistant prefill. Pin checkpoint and tokenizer revisions, resolved template
          digest, special-token settings and truncation policy. Freeze any clock input in a template-driven
          test. Unknown differences block the parity decision until explained.
        hold: 0.85
        visual_cues:
          - id: whitespace-parity-b3
            phrase: Keep golden single-turn, multi-turn, Unicode, code-indentation, quoted-marker and supported
              empty-content cases, plus an open assistant prefill.
            targets:
              - whitespace-parity-construction
            color: cyan
            linger: 0.5
          - id: im-golden-cases
            phrase: Unknown differences block the parity decision
            targets:
              - im-golden-cases
            color: yellow
            linger: 0.45
  - id: role-validation
    title: Reject incomplete demonstrations before serialization
    visual: Reject incomplete demonstrations before serialization.
    beats:
      - say: This lab’s completed text-only S F T row permits an optional initial system turn, then alternating user
          and assistant messages, ending with an assistant answer. That contract rejects empty and system-only
          rows, a user with no answer, two consecutive user messages, and a system message inserted midway. It
          accepts several complete user-assistant exchanges.
        hold: 0.6
        visual_cues:
          - id: role-validation-b1
            phrase: This lab’s completed text-only S F T row permits an optional initial system turn, then alternating
              user and assistant messages, ending with an assistant answer.
            targets:
              - role-validation-construction
            color: cyan
            linger: 0.5
          - id: im-role-errors
            phrase: two consecutive user messages
            targets:
