            color: yellow
            linger: 0.45
  - id: synthetic-methods
    title: Generate variations and preserve the review boundary
    visual: Generate variations and preserve the review boundary.
    beats:
      - say: Hand review can check a policy version directly but costs time and can miss cases. Self-Instruct began
          with one hundred seventy-five human seed tasks, generated instructions and instances, and filtered
          invalid or similar material. Its historical similarity screen used a ROUGE L threshold of zero point
          seven. That screen removes near duplicates. Checking the answer against the policy takes a separate review.
        hold: 0.6
        visual_cues:
          - id: synthetic-methods-b1
            phrase: Hand review can check a policy version directly but costs time and can miss cases.
            targets:
              - synthetic-methods-construction
            color: cyan
            linger: 0.5
          - id: im-similarity
            phrase: ROUGE L threshold of zero point seven
            targets:
              - im-similarity
            color: yellow
            linger: 0.45
      - say: Evol-Instruct changes constraints, depth or breadth to create more complex tasks. UltraChat uses
          simulated multi-turn conversations. Each can create diverse examples and also inherits generator
          mistakes, stale assumptions or impossible tasks. Read the follow-up in context. Does the answer still follow from what the user and the policy said?
        hold: 0.6
        visual_cues:
          - id: synthetic-methods-b2
            phrase: Evol-Instruct changes constraints, depth or breadth to create more complex tasks.
            targets:
              - synthetic-methods-construction
            color: cyan
            linger: 0.5
          - id: im-evolve
            phrase: changes constraints, depth or breadth
            targets:
              - im-evolve
            color: yellow
            linger: 0.45
          - id: im-simulated-turns
            phrase: simulated multi-turn conversations
            targets:
              - im-simulated-turns
            color: yellow
            linger: 0.45
      - say: For generated code, use an isolated runner and meaningful tests. Record which cases pass, fail, time out or give different results across runs. If reviewers and a model judge disagree, check the answer against the source. Version evidence snapshots,
          generator prompts, gates, decisions and accepted data together.
        hold: 0.85
        visual_cues:
          - id: synthetic-methods-b3
            phrase: For generated code, use an isolated runner and meaningful tests.
            targets:
              - synthetic-methods-construction
            color: cyan
