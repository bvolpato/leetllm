            color: yellow
            linger: 0.45
          - id: im-role-complete
            phrase: It accepts several complete user-assistant exchanges
            targets:
              - im-role-complete
            color: yellow
            linger: 0.45
      - say: A fresh generation request instead ends with a completed user turn, because the answer is not yet known.
          Validate against the intended mode. Tool interactions, multimodal records and assistant-only
          completion datasets need their own schemas; do not force them through this lab’s alternating text
          validator.
        hold: 0.6
        visual_cues:
          - id: role-validation-b2
            phrase: A fresh generation request instead ends with a completed user turn, because the answer is not yet
              known.
            targets:
              - role-validation-construction
            color: cyan
            linger: 0.5
