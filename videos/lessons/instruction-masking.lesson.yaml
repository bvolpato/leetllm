  - id: release-gate
    title: Validate metric types before comparing the thresholds
    visual: Validate metric types before comparing the thresholds.
    beats:
      - say: The article’s illustrative gate assumes one hundred cases per candidate, a grounded-rate floor of
          ninety-eight percent, zero critical policy errors and p ninety-five latency at most seven hundred
          milliseconds. The first candidate reports ninety-nine percent, zero and six hundred twenty, so it
          passes this small rule. The faster candidate reports ninety-four percent and one critical error, so
          it fails despite lower latency.
        hold: 0.6
        visual_cues:
          - id: release-gate-b1
            phrase: The article’s illustrative gate assumes one hundred cases per candidate, a grounded-rate floor of
              ninety-eight percent, zero critical policy errors and p ninety-five latency at most seven
              hundred milliseconds.
            targets:
              - release-gate-construction
            color: cyan
            linger: 0.5
          - id: im-good-candidate
            phrase: so it passes this small rule
            targets:
              - im-good-candidate
            color: yellow
            linger: 0.45
          - id: im-fast-fail
            phrase: so it fails despite lower latency
            targets:
              - im-fast-fail
            color: yellow
            linger: 0.45
      - say: Check types and domains first. Rates must be finite numeric values between zero and one; critical errors
          must be a nonnegative integer; latency must be finite and nonnegative. Python booleans are not
          accepted as these numbers in this function. A NaN can evade ordinary threshold comparisons, so
          reject it before those comparisons. A string saying yes is not literal boolean true for template
          parity.
        hold: 0.6
        visual_cues:
          - id: release-gate-b2
            phrase: Check types and domains first.
            targets:
              - release-gate-construction
            color: cyan
            linger: 0.5
