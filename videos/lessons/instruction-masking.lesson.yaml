            color: cyan
            linger: 0.5
  - id: earned-contract
    title: Audit a fresh reply
    visual: The learner follows a six-position row, fixes one missing answer label, fits a protected prompt into a budget, then inserts a reply word and locates the shifted ending again.
    beats:
      - say: >-
          Try a fresh toy row. The user asks, Ready? The assistant says Yes and ends its turn. The last slot is padding. Read the bottom row under each predictor. Its label should be the ID of the next selected token, or minus one hundred if that prediction is skipped. One cell is wrong. Which predictor needs a different label, and which ID belongs there?
        caption_starts: ["Read the bottom row", "One cell is wrong"]
        hold: 4
        visual_cues:
          - id: fresh-question
            phrase: "Which predictor needs a different label, and which ID belongs there"
            targets: [fresh-input, fresh-labels]
            color: cyan
            linger: 0.35
      - say: >-
          Put nineteen under position two. That assistant header predicts Yes. One step later, Yes predicts the real ending. Both the ending and the pad have ID twenty-three. Only the ending has a valid position inside the reply, so keep the padding prediction ignored.
        hold: 1.2
        visual_cues:
          - id: im-fresh-cell
            phrase: "Put nineteen under position two"
            targets: [fresh-labels]
            caption_boundary: true
            color: green
            linger: 0.35
          - id: fresh-real-end
            phrase: "Yes predicts the real ending"
            targets: [fresh-labels]
            color: cyan
            linger: 0.35
      - say: >-
          Before serving this conversation with its full history, count the space it needs. The serialized prompt takes nine hundred seventy tokens. Reserve ninety-six for the reply. The limit is one thousand twenty-four, with no other overhead. We are forty-two tokens over. One old exchange uses forty-five tokens and contains none of the required policy evidence. Remove that whole exchange. Nine hundred twenty-five plus ninety-six gives one thousand twenty-one. We have three slots to spare.
        hold: 1.2
        visual_cues:
          - id: im-fresh-overflow
            phrase: "We are forty-two tokens over"
            targets: [im-fresh-overflow]
            color: cyan
            linger: 0.35
          - id: im-fresh-budget-repair
            phrase: "Remove that whole exchange"
            targets: [im-fresh-budget-repair]
            color: cyan
            linger: 0.35
          - id: im-fresh-total
            phrase: "Nine hundred twenty-five plus ninety-six gives one thousand twenty-one"
            targets: [im-fresh-overflow]
            caption_boundary: true
      - say: >-
          Back to the training row. Extend the answer by one word, indeed. The same ending and the same pad move over together. Which position now predicts the real ending?
        hold: 3.5
        visual_cues:
          - id: fresh-add-word
            phrase: "Extend the answer by one word, indeed"
            targets: [fresh-input]
            color: cyan
            linger: 0.35
          - id: fresh-transfer-question
            phrase: "Which position now predicts the real ending"
            targets: [fresh-input, fresh-labels]
            color: cyan
            linger: 0.35
      - say: >-
          Position four, the word indeed. Its next label is twenty-three. Position five already contains that ending. What follows it is padding, so its prediction is skipped. That is how to check whether a row actually teaches the handoff.
        hold: 1.3
        visual_cues:
          - id: fresh-new-stop
            phrase: "Position four, the word indeed"
            targets: [fresh-input, fresh-labels]
            caption_boundary: true
            color: green
            linger: 0.35
      - say: >-
          Now serve that same reply. The decoder has just produced the trained ending, twenty-three, and it still has room to generate. This toy server stops only when the latest ID belongs to its stop set. The set contains forty-two. Does this token stop the decoder?
        caption_starts: ["This toy server stops", "The set contains forty-two"]
        hold: 2.8
        visual_cues:
          - id: fresh-serving
            phrase: "Does this token stop the decoder"
            targets: [decoded-reply, decoder-check]
            color: cyan
            linger: 0.35
      - say: >-
          The decoder asks for another token. Add twenty-three to the stop set. Replay the very same ending. This time it stops. The row teaches the handoff. The server acts on it. Next we’ll see whether shorter embeddings can still retrieve the policy clause the answer needs.
        caption_starts: ["Next we’ll see whether shorter embeddings"]
        hold: 1.4
        visual_cues:
          - id: fresh-miss
            phrase: "The decoder asks for another token"
            targets: [decoder-check]
            caption_boundary: true
          - id: fresh-config
            phrase: "Add twenty-three to the stop set"
            targets: [decoder-check]
            caption_boundary: true
          - id: fresh-stop
            phrase: "This time it stops"
            targets: [decoder-check]
            caption_boundary: true
