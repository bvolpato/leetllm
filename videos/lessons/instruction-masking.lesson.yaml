scenes:
  - id: intro
    title: Which “is” should training score?
    visual: A token ID drops from each copy of “is” in a two-message chat. The IDs match. The loss labels reveal which prediction the assistant practices.
    beats:
      - say: >-
          “How is my dog?” “She is happy.” Both copies of “is” have the same token ID. If we’re training the assistant to answer, which copy should we score?
        hold: 3.1
        caption_starts: ["Both copies of", "If we’re training"]
        visual_cues:
          - id: intro-copies
            phrase: "Both copies of “is” have the same token ID"
            targets: [conversation]
          - id: intro-choice
            phrase: "which copy should we score"
            targets: [user-label, reply-label]
      - say: >-
          The one in the reply. Keep its token ID as the label. Under the user’s “is,” put minus one hundred. That tells the loss to skip this prediction. The model still reads the whole question when it predicts the reply.
        hold: 1.1
        caption_starts: ["Under the user’s", "The model still reads"]
        visual_cues:
          - id: intro-reply
            phrase: "The one in the reply"
            targets: [reply-label]
            caption_boundary: true
            color: green
          - id: intro-ignore
            phrase: "put minus one hundred"
            targets: [user-label]
      - say: >-
          After “happy” comes the end-of-turn marker. Keep its label too. The assistant learns the words of the reply and when to hand the conversation back.
        hold: 0.9
        visual_cues:
          - id: intro-ending
            phrase: "After “happy” comes the end-of-turn marker"
            targets: [reply-label]
            color: green
  - id: behavior-contract
    title: What answer does the policy support?
    visual: The key age and ticket rule determine the target answer. A two-choice probability bar shows what happens when training rewards its first word.
    beats:
      - say: >-
          An engineer wants to keep using an eighteen-day-old service key. The support assistant gets the question and the policy together. Under policy P fourteen, keys older than fourteen days need a rotation ticket. The approved reply says to open the ticket before further use.
        hold: 0.6
        visual_cues:
          - id: behavior-contract-b1
            phrase: The support assistant gets the question and the policy together
            targets:
              - behavior-contract-construction
            color: cyan
            linger: 0.5
          - id: im-evidence
            phrase: The approved reply says to open the ticket before further use
            targets:
              - im-evidence
            color: yellow
            linger: 0.45
      - say: >-
          Look at the first word of the approved reply, Open. A causal model predicts it from everything before it. Suppose it gives Open a one-in-four chance and puts the rest on one other choice. Supervised fine-tuning minimizes the negative log probability of the selected words. For one word, the gradient on each logit is its probability minus its target. Open gets a target of one. A descent step raises its logit and lowers the other one. With shared weights, updates for different words can pull in different directions.
        hold: 0.6
        visual_cues:
          - id: behavior-contract-b2
            phrase: Look at the first word of the approved reply
            targets:
              - behavior-contract-construction
            color: cyan
            linger: 0.5
          - id: im-gradient
            phrase: its probability minus its target
            targets:
              - im-gradient
            color: yellow
            linger: 0.45
          - id: im-descent
            phrase: raises its logit and lowers the other one
            targets:
              - im-descent
            color: yellow
            linger: 0.45
      - say: >-
          Now accept the answer “No ticket required.” The loss rewards that answer, even though it contradicts the policy in the request. Here the application supplies the policy in the system message. Keep retrieved text and tool results in their own roles so you can trace each claim to its source. The row also teaches an ending. At serving time the decoder needs the matching stop ID and a budget for the reply.
        hold: 0.85
        visual_cues:
          - id: behavior-contract-b3
            phrase: Now accept the answer “No ticket required”
            targets:
              - behavior-contract-construction
            color: cyan
            linger: 0.5
          - id: im-wrong-supervision
            phrase: The loss rewards that answer
            targets:
              - im-wrong-supervision
            color: yellow
            linger: 0.45
  - id: adaptation-evidence
    title: What did the demonstrations teach?
    visual: Compare the training objectives, count the demonstrations used by LIMA, then follow held-out scores as the task mix changes.
    beats:
      - say: >-
          What counts as a good answer during training? InstructGPT first learned from demonstrations. People then ranked answers, a reward model learned those preferences, and P P O used its scores. F L A N learned from instruction-formatted tasks. Its researchers tested whether the model could follow instructions on task types held out of fine-tuning.
        hold: 0.6
        visual_cues:
          - id: adaptation-evidence-b1
            phrase: InstructGPT first learned from demonstrations
            targets:
              - adaptation-evidence-construction
            color: cyan
            linger: 0.5
          - id: im-objectives
            phrase: F L A N learned from instruction-formatted tasks
            targets:
              - im-objectives
            color: yellow
            linger: 0.45
      - say: >-
          Each square stands for one demonstration. LIMA fine-tuned a sixty-five-billion-parameter LLaMA on one thousand curated demonstrations without reinforcement learning. The authors called their explanation the Superficial Alignment Hypothesis. They proposed that pretraining had already taught much of the capability, and the examples helped the model express it. Fine-tuning can also teach new facts and skills.
        hold: 0.6
        visual_cues:
          - id: adaptation-evidence-b2
            phrase: Each square stands for one demonstration
            targets:
              - adaptation-evidence-construction
            color: cyan
            linger: 0.5
          - id: im-lima
            phrase: one thousand curated demonstrations without reinforcement learning
            targets:
              - im-lima
            color: yellow
            linger: 0.45
      - say: A narrow adaptation can improve policy answers while lowering earlier coding or reasoning scores. First
          hold tokenizer, template, decoding and evaluation cases fixed to establish the regression. Then
          compare smaller update budgets, broader approved instruction data or replay. Record sampling
          probabilities and loss weights. InstructGPT’s pre-training-gradient mixture was in its
          reinforcement-learning stage. For your supervised run, compare replay mixtures on the same held-out tasks.
        hold: 0.85
        visual_cues:
          - id: adaptation-evidence-b3
            phrase: A narrow adaptation can improve policy answers while lowering earlier coding or reasoning scores.
            targets:
              - adaptation-evidence-construction
            color: cyan
            linger: 0.5
          - id: im-regression
            phrase: improve policy answers while lowering earlier coding or reasoning scores
            targets:
              - im-regression
            color: yellow
            linger: 0.45
          - id: im-freeze-protocol
            phrase: First hold tokenizer, template, decoding and evaluation cases fixed
            targets:
              - im-freeze-protocol
            color: yellow
            linger: 0.45
  - id: template
    title: The template turns messages into one stream
    visual: User and assistant messages serialize with role markers and endings. A second assistant turn remains
      distinct in the token stream.
    beats:
      - say: Begin with an ordinary exchange. The user asks, How is my dog? The assistant answers, She is happy. The
          user follows with, Why? The assistant replies, She is playing. A chat template adds role and turn
          markers around those familiar words.
        hold: 0.6
        visual_cues:
          - id: template-beat-1-focus-1
            phrase: A chat template adds role and turn markers around those familiar words
            targets:
              - template-object-turn-label-2
            color: blue
            linger: 0.6
          - id: im-flatten
            phrase: A chat template adds role and turn markers around those familiar words
            targets:
              - im-flatten
            color: yellow
            linger: 0.45
      - say: The resulting sequence is one stream of token IDs. Different model families use different delimiters, and
          whitespace can change tokenization. Training, generation, and an unfinished assistant prefix each
          have their own formatting contract, so inspect the actual rendered tokens.
        hold: 0.8
        visual_cues:
          - id: template-beat-2-focus-1
            phrase: The resulting sequence is one stream of token IDs
            targets:
              - template-object-turn-label-2
            color: blue
            linger: 0.6
          - id: im-token-ids
            phrase: one stream of token IDs
            targets:
              - im-token-ids
            color: yellow
            linger: 0.45
  - id: three-tails
    title: Where does the assistant start writing?
    visual: One question has three endings. Training includes a finished reply, fresh generation awaits a reply, and a prefill leaves a reply open.
    beats:
      - say: >-
          Start with the same policy and question in all three rows. This small ChatML example changes only what comes next. Training writes the assistant’s known answer and closes its turn. Fresh generation writes the assistant header and waits for an answer. Assistant prefill writes the start of an answer and leaves that message open.
        hold: 0.6
        visual_cues:
          - id: three-tails-b1
            phrase: Start with the same policy and question
            targets:
              - three-tails-construction
            color: cyan
            linger: 0.5
          - id: im-train-tail
            phrase: Training writes the assistant’s known answer and closes its turn
            targets:
              - im-train-tail
            color: yellow
            linger: 0.45
          - id: im-generate-tail
            phrase: Fresh generation writes the assistant header
            targets:
              - im-generate-tail
            color: yellow
            linger: 0.45
          - id: im-prefill-tail
            phrase: Assistant prefill writes the start of an answer
            targets:
              - im-prefill-tail
            color: yellow
            linger: 0.45
      - say: Predict what happens if a request asks both to start a new assistant message and to continue the final
          one.
        hold: 1.5
        visual_cues:
          - id: three-tails-b2
            phrase: Predict what happens if a request asks both to start a new assistant message and to continue the final
              one.
            targets:
              - three-tails-construction
            color: cyan
            linger: 0.5
      - say: Those intents conflict, so the serializer rejects the combination. In this toy a prefill must end in an
          assistant role. Transformers can continue a final message more generally, including a named
          reasoning field when its template supports it.
        hold: 0.6
        visual_cues:
          - id: three-tails-conflict-result
            phrase: Those intents conflict, so the serializer rejects the combination.
            targets:
              - three-tails-construction
            color: cyan
            linger: 0.5
      - say: >-
          Look at the open JSON field. The model can continue right there. When it finishes, parse the JSON, check the fields and compare the values with the policy. A text-generation pipeline may treat a final assistant message as a prefill by default. Choose the mode explicitly. For a hosted endpoint, check whether its request format supports prefills.
        hold: 0.85
        visual_cues:
          - id: three-tails-b3
            phrase: Look at the open JSON field
            targets:
              - three-tails-construction
            color: cyan
            linger: 0.5
          - id: im-json-validation
            phrase: parse the JSON, check the fields and compare the values with the policy
            targets:
              - im-json-validation
            color: yellow
            linger: 0.45
  - id: checkpoint-ids
    title: Count the actual pinned tokenizer output
