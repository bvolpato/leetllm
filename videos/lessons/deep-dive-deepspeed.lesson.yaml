            targets:
              - accumulation-last-cell
              - accumulation-counters
            color: green
            linger: 0.5
          - id: ds-accumulation-b2-s0
            phrase: The final cell reaches the boundary and the optimizer advances once.
            targets: *a4
            color: blue
            linger: 0.5
          - id: ds-accumulation-b2-s1
            phrase: The default engine already handles its configured accumulation scaling.
            targets: *a4
            color: blue
            linger: 0.5
          - id: ds-accumulation-b2-s2
            phrase: Dividing the loss again would change the gradient magnitude.
            targets: *a4
            color: blue
