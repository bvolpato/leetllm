  - id: ownership
    title: Shard the arrays according to their owners
    visual: Four-rank state bars progress through ZeRO stages one, two and three. Weights, gradients and optimizer
      components independently become quarter-sized, producing the calculated persistent per-rank totals.
    beats:
      - say: >
          Ordinary data parallelism keeps a full model-state replica on every rank. Each rank processes
          different examples. ZeRO first assigns optimizer slices to owners, allowing the large optimizer
          block to be partitioned while compute weights and gradients remain replicated in this simplified
          ledger.
        hold: 0.6
        visual_cues:
          - id: ownership-replicated-baseline
            phrase: Ordinary data parallelism keeps a full model-state replica on every rank
            targets:
              - ownership-component-0
              - ownership-component-1
              - ownership-component-2
            color: cyan
            linger: 0.5
          - id: ownership-optimizer-partition
            phrase: ZeRO first assigns optimizer slices to owners
            targets:
              - ownership-component-2
            color: pink
            linger: 0.5
          - id: ds-ownership-b0-s0
            phrase: Ordinary data parallelism keeps a full model-state replica on every rank.
            targets: &a2
              - ownership-component-0
              - ownership-component-1
              - ownership-component-2
            color: blue
            linger: 0.5
          - id: ds-ownership-b0-s1
            phrase: Each rank processes different examples.
            targets: *a2
            color: blue
            linger: 0.5
          - id: ds-ownership-b0-s2
            phrase: ZeRO first assigns optimizer slices to owners, allowing the large optimizer block to be partitioned
              while compute weights and gradients remain replicated in this simplified ledger.
            targets: *a2
            color: blue
            linger: 0.5
      - say: >
          Stage two also retains only the owned reduced-gradient slice. Stage three partitions compute
          parameters as well. Watch which colored block changes in each stage. These are different ownership
          schedules. The examples handled by the data replicas remain distinct throughout.
        hold: 0.6
        visual_cues:
          - id: ownership-gradient-partition
            phrase: Stage two also retains only the owned reduced-gradient slice
            targets:
              - ownership-component-1
            color: cyan
            linger: 0.5
          - id: ownership-weight-partition
            phrase: Stage three partitions compute parameters as well
            targets:
              - ownership-component-0
            color: blue
            linger: 0.5
          - id: ds-ownership-b1-s0
            phrase: Stage two also retains only the owned reduced-gradient slice.
            targets: *a2
            color: blue
            linger: 0.5
          - id: ds-ownership-b1-s1
            phrase: Stage three partitions compute parameters as well.
            targets: *a2
            color: blue
            linger: 0.5
          - id: ds-ownership-b1-s2
            phrase: Watch which colored block changes in each stage.
            targets: *a2
            color: blue
            linger: 0.5
          - id: ds-ownership-b1-s3
            phrase: These are different ownership schedules.
            targets: *a2
            color: blue
            linger: 0.5
          - id: ds-ownership-b1-s4
            phrase: The examples handled by the data replicas remain distinct throughout.
            targets: *a2
            color: blue
            linger: 0.5
      - say: >
          The last setting minimizes these idealized persistent arrays, but it also requires parameter gathers
          during computation. Actual buffer dtypes change the ledger, and peak allocations exceed persistent
          storage. Choose a stage that fits the workload after counting its live working set and measuring its
          communication.
        hold: 0.6
        visual_cues:
          - id: ownership-beat-3-focus-1
            phrase: Actual buffer dtypes change the ledger, and peak allocations exceed persistent storage
            targets:
              - ownership-component-0
              - ownership-component-1
              - ownership-component-2
            color: cyan
            linger: 0.65
          - id: ds-ownership-b2-s0
            phrase: The last setting minimizes these idealized persistent arrays, but it also requires parameter gathers
