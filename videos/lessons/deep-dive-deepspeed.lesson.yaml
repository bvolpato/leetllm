            targets: *a2
            color: blue
            linger: 0.5
          - id: ds-ownership-b2-s1
            phrase: Actual buffer dtypes change the ledger, and peak allocations exceed persistent storage.
            targets: *a2
            color: blue
            linger: 0.5
          - id: ds-ownership-b2-s2
