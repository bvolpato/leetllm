scenes:
  - id: intro
    title: The weights are only one part of training memory
    visual: A state stack begins with three gigabytes of compute weights, then adds gradients and the three FP32
      optimizer arrays. The total is derived from the components currently visible.
    beats:
      - say: >
          A model's weights fit on the GPU, yet its first training update runs out of memory. The missing
          pieces are the gradients and optimizer state. Watch a memory ledger expand from the compute weights
          to the state needed by this mixed-precision Adam recipe.
        hold: 0.6
        visual_cues:
          - id: intro-beat-1-focus-1
            phrase: yet its first training update runs out of memory
            targets:
              - intro-panel-intro
            color: cyan
            linger: 0.65
          - id: ds-intro-b0-s0
            phrase: A model's weights fit on the GPU, yet its first training update runs out of memory.
            targets: &a1
              - intro-component-0
              - intro-component-1
              - intro-component-2
            color: blue
            linger: 0.5
          - id: ds-intro-b0-s1
            phrase: The missing pieces are the gradients and optimizer state.
            targets: *a1
            color: blue
            linger: 0.5
          - id: ds-intro-b0-s2
            phrase: Watch a memory ledger expand from the compute weights to the state needed by this mixed-precision Adam
              recipe.
            targets: *a1
            color: blue
            linger: 0.5
      - say: >
          The optimizer keeps a higher-precision weight copy and two running moments. These arrays can
          outweigh the low-precision model itself. Our supplied parameter count makes the difference visible
          before adding activations, communication buffers or temporary workspace. Those further allocations
          still need room.
        hold: 0.6
        visual_cues:
          - id: intro-beat-2-focus-1
            phrase: The optimizer keeps a higher-precision weight copy and two running moments
            targets:
              - intro-panel-intro
            color: cyan
            linger: 0.65
          - id: ds-intro-b1-s0
            phrase: The optimizer keeps a higher-precision weight copy and two running moments.
            targets: *a1
            color: blue
            linger: 0.5
          - id: ds-intro-b1-s1
            phrase: These arrays can outweigh the low-precision model itself.
            targets: *a1
            color: blue
            linger: 0.5
          - id: ds-intro-b1-s2
            phrase: Our supplied parameter count makes the difference visible before adding activations, communication
              buffers or temporary workspace.
            targets: *a1
            color: blue
            linger: 0.5
          - id: ds-intro-b1-s3
            phrase: Those further allocations still need room.
            targets: *a1
            color: blue
            linger: 0.5
      - say: >
          DeepSpeed coordinates the training engine, including a technique called ZeRO that partitions this
          persistent state across data replicas. We will follow ownership, one reduced gradient, a live
          parameter gather and a checkpoint. Each shows why fitting the weights is only the beginning of a
          workable training plan.
        hold: 0.6
        visual_cues:
          - id: intro-beat-3-focus-1
            phrase: including a technique called ZeRO that partitions this persistent state across data replicas
            targets:
              - intro-panel-intro
            color: cyan
            linger: 0.65
          - id: ds-intro-b2-s0
            phrase: DeepSpeed coordinates the training engine, including a technique called ZeRO that partitions this
              persistent state across data replicas.
            targets: *a1
            color: blue
            linger: 0.5
          - id: ds-intro-b2-s1
            phrase: We will follow ownership, one reduced gradient, a live parameter gather and a checkpoint.
            targets: *a1
            color: blue
            linger: 0.5
          - id: ds-intro-b2-s2
            phrase: Each shows why fitting the weights is only the beginning of a workable training plan.
            targets: *a1
            color: blue
