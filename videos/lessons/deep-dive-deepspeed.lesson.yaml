  - id: token-objective
    title: Preserve the intended token objective before sharding
    visual: Two differently sized token sets contribute separate loss sums and counts. Compute the global token
      mean,then reduce the gradient before the nonlinear second-moment operation.
    beats:
      - say: Equal rank averages assume equal weighting units. Suppose one rank has two valid tokens and the other
          six. A mean loss from each rank, averaged equally, gives each rank half the influence. A global
          token mean instead weights those means by two eighths and six eighths. Padding tokens should not
          silently become objective terms.
        hold: 0.55
        visual_cues:
          - id: ds-token-objective-b0-s0
            phrase: Equal rank averages assume equal weighting units.
            targets:
              - token-objective-construction
            color: blue
            linger: 0.5
          - id: ds-token-objective-b0-s1
            phrase: Suppose one rank has two valid tokens and the other six.
            targets:
              - token-objective-construction
            color: blue
            linger: 0.5
          - id: ds-token-objective-b0-s2
            phrase: A mean loss from each rank, averaged equally, gives each rank half the influence.
            targets:
              - token-objective-construction
            color: blue
            linger: 0.5
          - id: ds-token-objective-b0-s3
            phrase: A global token mean instead weights those means by two eighths and six eighths.
            targets:
              - token-objective-construction
            color: blue
            linger: 0.5
          - id: ds-token-objective-b0-s4
            phrase: Padding tokens should not silently become objective terms.
            targets:
              - token-objective-construction
            color: blue
            linger: 0.5
      - say: "Choose the objective first: combine the appropriate loss sums and valid-token counts, then arrange loss
          and distributed scaling to reproduce that gradient. Adam updates its second moment as beta two times
          the old moment plus one minus beta two times the square of the reduced gradient. Squaring local
          gradients first cannot generally reproduce it."
        hold: 0.55
        visual_cues:
          - id: ds-token-objective-b1-s0
            phrase: "Choose the objective first: combine the appropriate loss sums and valid-token counts, then arrange
              loss and distributed scaling to reproduce that gradient."
            targets:
