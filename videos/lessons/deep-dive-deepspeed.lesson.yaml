  - id: dtype-ledger
    title: Give every state array its own element width
    visual: Construct separate compute-weight,gradient,master-weight and two moment allocations from the same
      parameter count. Change only accumulation dtype and recompute each stage.
    beats:
      - say: The three gigabytes of compute weights came from one point five billion parameters at two bytes each. The
          gradient adds three. A four-byte master weight and two four-byte moments add eighteen. Sixteen bytes
          per parameter make twenty-four decimal gigabytes before activations. Adam’s second moment tracks
          squared gradients, not a centered variance.
        hold: 0.55
        visual_cues:
          - id: ds-dtype-ledger-b0-s0
            phrase: The three gigabytes of compute weights came from one point five billion parameters at two bytes each.
            targets:
              - dtype-ledger-construction
            color: blue
            linger: 0.5
          - id: ds-dtype-ledger-b0-s1
            phrase: The gradient adds three.
            targets:
              - dtype-ledger-construction
            color: blue
            linger: 0.5
          - id: ds-dtype-ledger-b0-s2
            phrase: A four-byte master weight and two four-byte moments add eighteen.
            targets:
              - dtype-ledger-construction
            color: blue
            linger: 0.5
          - id: ds-dtype-ledger-b0-s3
            phrase: Sixteen bytes per parameter make twenty-four decimal gigabytes before activations.
            targets:
              - dtype-ledger-construction
            color: blue
            linger: 0.5
          - id: ds-dtype-ledger-b0-s4
            phrase: Adam’s second moment tracks squared gradients, not a centered variance.
            targets:
              - dtype-ledger-construction
            color: blue
            linger: 0.5
      - say: Now change only gradient accumulation to four bytes. It adds six gigabytes instead of three, and the
          persistent total becomes twenty-seven. Compute precision did not specify that buffer. Read the
          actual optimizer and gradient-accumulation dtypes. Some recipes do not keep the same master copy,
          and their ledger must reflect that choice.
        hold: 0.55
        visual_cues:
          - id: ds-dtype-ledger-b1-s0
            phrase: Now change only gradient accumulation to four bytes.
            targets:
              - dtype-ledger-construction
            color: blue
            linger: 0.5
          - id: ds-dtype-ledger-b1-s1
            phrase: It adds six gigabytes instead of three, and the persistent total becomes twenty-seven.
            targets:
              - dtype-ledger-construction
            color: blue
            linger: 0.5
          - id: ds-dtype-ledger-b1-s2
            phrase: Compute precision did not specify that buffer.
            targets:
              - dtype-ledger-construction
            color: blue
            linger: 0.5
          - id: ds-dtype-ledger-b1-s3
            phrase: Read the actual optimizer and gradient-accumulation dtypes.
            targets:
              - dtype-ledger-construction
            color: blue
            linger: 0.5
          - id: ds-dtype-ledger-b1-s4
            phrase: Some recipes do not keep the same master copy, and their ledger must reflect that choice.
            targets:
              - dtype-ledger-construction
            color: blue
            linger: 0.5
      - say: For parameter count P, let p, g and o name bytes per parameter for compute weights, gradients and
          optimizer-related arrays. With N data ranks, stage two retains P times p plus P times the quantity g
          plus o, divided by N. Stage three divides all three terms by N. These ideal ownership counts do not
          include padded gathers, activations or workspace.
        hold: 0.55
        visual_cues:
          - id: ds-dtype-ledger-b2-s0
            phrase: For parameter count P, let p, g and o name bytes per parameter for compute weights, gradients and
              optimizer-related arrays.
            targets:
              - dtype-ledger-construction
            color: blue
            linger: 0.5
          - id: ds-dtype-ledger-b2-s1
            phrase: With N data ranks, stage two retains P times p plus P times the quantity g plus o, divided by N.
            targets:
              - dtype-ledger-construction
            color: blue
            linger: 0.5
          - id: ds-dtype-ledger-b2-s2
            phrase: Stage three divides all three terms by N.
