            color: blue
            linger: 0.5
          - id: ds-token-objective-b1-s1
            phrase: Adam updates its second moment as beta two times the old moment plus one minus beta two times the
              square of the reduced gradient.
            targets:
              - token-objective-construction
            color: blue
            linger: 0.5
          - id: ds-token-objective-b1-s2
            phrase: Squaring local gradients first cannot generally reproduce it.
            targets:
              - token-objective-construction
            color: blue
            linger: 0.5
      - say: Our CPU ownership program reduces equal-weight gradients and reproduces the reference scalar Adam
          updates. It does not execute a distributed training engine or prove unequal-token weighting in your
          integration. Check a small loss and update against a reference under the same examples, masks and
          accumulation schedule before trusting the memory saving.
        hold: 0.55
        visual_cues:
          - id: ds-token-objective-b2-s0
            phrase: Our CPU ownership program reduces equal-weight gradients and reproduces the reference scalar Adam
              updates.
            targets:
