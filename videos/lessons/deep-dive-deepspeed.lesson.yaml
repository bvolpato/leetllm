  - id: reduce
    title: Reduce the gradient before applying Adam
    visual: Rank gradients one and three arrive separately at a partial sum, then division by two creates the
      reduced mean. Paired bars construct the square of that mean and the mean of separately squared
      gradients. An actual Adam update follows the completed reduction.
    beats:
      - say: >
          Sharding should preserve the intended optimizer update. Two ranks contribute gradients for the same
          parameter. Reduce them first, then let the owner update its state from that reduced gradient. The
          owner needs the correct mathematical input, regardless of where the other slices live.
        hold: 0.6
        visual_cues:
          - id: reduce-beat-1-focus-1
            phrase: Two ranks contribute gradients for the same parameter
            targets:
              - reduce-rank-0-gradient-1
            color: cyan
            linger: 0.65
          - id: reduce-beat-1-focus-2
            phrase: Reduce them first, then let the owner update its state from that reduced gradient
            targets:
              - reduce-ready-reduced-mean-2-second-sum-1-3-4-first-partial-sum-1-await-both
            color: yellow
            linger: 0.65
          - id: ds-reduce-b0-s0
            phrase: Sharding should preserve the intended optimizer update.
            targets:
              - reduce-ready-reduced-mean-2-second-sum-1-3-4-first-partial-sum-1-await-both
            color: blue
            linger: 0.5
          - id: ds-reduce-b0-s1
            phrase: Two ranks contribute gradients for the same parameter.
            targets:
              - reduce-ready-reduced-mean-2-second-sum-1-3-4-first-partial-sum-1-await-both
            color: blue
            linger: 0.5
          - id: ds-reduce-b0-s2
            phrase: Reduce them first, then let the owner update its state from that reduced gradient.
            targets:
              - reduce-ready-reduced-mean-2-second-sum-1-3-4-first-partial-sum-1-await-both
            color: blue
            linger: 0.5
          - id: ds-reduce-b0-s3
            phrase: The owner needs the correct mathematical input, regardless of where the other slices live.
            targets:
              - reduce-ready-reduced-mean-2-second-sum-1-3-4-first-partial-sum-1-await-both
            color: blue
            linger: 0.5
      - say: >
          Adam squares its gradient when updating the second moment. The square of the mean differs from the
          mean of the squares. Our example shows both results side by side. Updating each local moment first
          and averaging afterward would implement a different algorithm.
        hold: 0.7
