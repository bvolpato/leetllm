            linger: 0.5
          - id: ds-token-objective-b2-s1
            phrase: It does not execute a distributed training engine or prove unequal-token weighting in your
              integration.
            targets:
              - token-objective-construction
            color: blue
            linger: 0.5
          - id: ds-token-objective-b2-s2
            phrase: Check a small loss and update against a reference under the same examples, masks and accumulation
              schedule before trusting the memory saving.
            targets:
              - token-objective-construction
            color: blue
            linger: 0.5
  - id: accumulation
    title: Microsteps and optimizer updates have different clocks
    visual: Eight microbatch cells fill across three beats. The engine call counter advances on each microstep
      while the optimizer-update counter changes only at the configured accumulation boundary. Global batch is
      calculated from data degree.
    beats:
      - say: >
          A training engine also owns accumulation bookkeeping. Several microbatches can contribute to one
          optimizer update. Under DeepSpeed's default managed accumulation, call the engine's backward and
          step methods for each microbatch. The engine advances its microstep clock and waits for the
          configured update boundary.
        hold: 0.6
        visual_cues:
          - id: accumulation-beat-1-focus-1
            phrase: The engine advances its microstep clock and waits for the configured update boundary
            targets:
              - accumulation-array-from-length-8-i-i-s-micro-string-i-1-pending
            color: cyan
            linger: 0.65
          - id: ds-accumulation-b0-s0
            phrase: A training engine also owns accumulation bookkeeping.
            targets: &a4
              - accumulation-counters
            color: blue
            linger: 0.5
          - id: ds-accumulation-b0-s1
            phrase: Several microbatches can contribute to one optimizer update.
            targets: *a4
            color: blue
            linger: 0.5
          - id: ds-accumulation-b0-s2
            phrase: Under DeepSpeed's default managed accumulation, call the engine's backward and step methods for each
              microbatch.
            targets: *a4
            color: blue
            linger: 0.5
          - id: ds-accumulation-b0-s3
            phrase: The engine advances its microstep clock and waits for the configured update boundary.
            targets: *a4
            color: blue
            linger: 0.5
      - say: >
          The next cells fill without an Adam update yet. The effective batch combines microbatch size,
          accumulation count and data-parallel degree. Tensor-parallel workers cooperate on the same examples,
          so multiplying by every physical GPU would overcount the independent data contributions.
        hold: 0.6
        motion_check:
          region:
            - 180
            - 430
            - 1520
            - 140
          minimumChangedFraction: 0.002
        visual_cues:
          - id: accumulation-beat-2-focus-1
            phrase: The effective batch combines microbatch size, accumulation count and data-parallel degree
            targets:
              - accumulation-effective-batch
              - accumulation-counters
            color: cyan
            linger: 0.65
          - id: ds-accumulation-b1-s0
            phrase: The next cells fill without an Adam update yet.
            targets: *a4
            color: blue
            linger: 0.5
          - id: ds-accumulation-b1-s1
            phrase: The effective batch combines microbatch size, accumulation count and data-parallel degree.
            targets: *a4
            color: blue
            linger: 0.5
          - id: ds-accumulation-b1-s2
            phrase: Tensor-parallel workers cooperate on the same examples, so multiplying by every physical GPU would
              overcount the independent data contributions.
            targets: *a4
            color: blue
            linger: 0.5
      - say: >
          The final cell reaches the boundary and the optimizer advances once. The default engine already
          handles its configured accumulation scaling. Dividing the loss again would change the gradient
          magnitude. Alternative unmanaged APIs have different contracts, so keep the loop behavior and
          resolved configuration together.
        hold: 0.6
        visual_cues:
