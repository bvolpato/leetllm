            color: cyan
            linger: 0.65
          - id: bigram-training-losses
            phrase: at one point zero three three and one point zero one nine
            targets: [bigram-floor-mechanism]
            color: cyan
            linger: 0.35
  - id: bigram-selection
    title: Which character table would you keep?
    visual: Grow the train and validation traces on fixed axes. Hold both candidate readings on the curves
      before identifying the checkpoint. Separate the selection data from the final test.
    beats:
      - say: Each point scores the entire set of character pairs at one update. Cyan follows the training text.
          Pink follows the same seventy-five validation pairs each time. Watch them fall together. Leave a
          mark at update one hundred eleven. Keep training the same table to one thousand.
        hold: 0.85
        visual_cues:
          - id: bigram-early
            phrase: Watch them fall together
            targets:
              - bigram-chart
            color: cyan
            linger: 0.35
          - id: bigram-late
            phrase: Keep training the same table to one thousand
            targets:
              - bigram-chart
            color: pink
            linger: 0.35
      - say: The cyan trace keeps falling. On the pink trace, compare the two dots. Each pink reading is the
          average cost of predicting the next character in the held-out text. A smaller cost is better.
          Which update do you copy?
        hold: 2.1
        visual_cues:
          - id: bigram-compare
            phrase: compare the two dots
            targets:
              - bigram-chart
              - bigram-choice
            color: pink
            linger: 0.35
      - say: Copy update one hundred eleven. Its mean validation loss is about two point one zero five nats per
          pair. By one thousand that has climbed to two point three nine two. Twenty-four of those
          seventy-five validation pairs never occurred in training. The model can pay dearly for putting
          less and less probability on a successor that actually turns up.
        hold: 1
        visual_cues:
          - id: bigram-pick
            phrase: Copy update one hundred eleven
            targets:
              - bigram-choice
              - bigram-chart
            color: yellow
            linger: 0.35
            caption_boundary: true
          - id: bigram-unseen
            phrase: Twenty-four of those seventy-five validation pairs never occurred in training
            targets:
              - bigram-choice
            color: pink
            linger: 0.3
      - say: The sample from that copy contains recognizable fragments, like the letters t, h, e. Read a little
          farther and the words fall apart. Validation helped choose these weights. Use an untouched test
          set for the final estimate, and measure the behavior you care about in deployment. If validation
          keeps getting worse, more training data or regularization may help.
        hold: 0.8
        visual_cues:
          - id: bigram-sample
            phrase: The sample from that copy
            targets:
              - bigram-choice
            color: blue
            linger: 0.35
  - id: run-receipt
    title: Can you reproduce the saved router’s decision?
    visual: Bind the selected weight state to feature and label schema, split
      identity, optimizer recipe, metric population and layer mode. Keep the
      untouched test population distinct.
    beats:
      - say: Save the architecture and optimizer settings with the checkpoint. Keep the feature order and
          label map so the next reader knows which column means escalation. Record the source data, split
          IDs, both loss curves and the metric you used to pick these weights.
        hold: 0.65
        visual_cues:
          - id: run-receipt-beat-0
            phrase: Keep the feature order and label map
            targets:
              - run-receipt-mechanism
            color: cyan
            linger: 0.65
      - say: A training epoch averages losses from batches scored while the weights were changing. To score
          the saved checkpoint, freeze its weights and run the evaluation rows through it again. Record
          which rows you used. Check how you split the data so that a document and its copies stay on the
          same side.
        hold: 0.65
        visual_cues:
          - id: run-receipt-beat-1
            phrase: freeze its weights and run the evaluation rows through it again
            targets:
              - run-receipt-mechanism
            color: yellow
            linger: 0.65
      - say: Reload the checkpoint and give it the same ticket. Compare both route scores with the ones you
          saved. To check that training resumes, give it the same next batch and compare the updated
          weights with the uninterrupted run.
        caption_starts:
          - To check that training resumes
        hold: 0.65
        visual_cues:
          - id: run-receipt-beat-2
            phrase: Reload the checkpoint and give it the same ticket
            targets:
              - run-receipt-mechanism
            color: cyan
            linger: 0.65
          - id: receipt-next
            phrase: give it the same next batch
            targets:
              - run-receipt-mechanism
            color: cyan
            linger: 0.35
  - id: transfer
    title: Before the next backward call
    visual: Take one column from the earlier two-ticket update and mark where to inspect the buffer when
      another update goes the wrong way.
    beats:
      - say: Return to the ticket router. Read down the urgency column. On the clean step, the standard gradient
          was positive and the escalation gradient was negative. Starting at zero, subtracting those
          gradients pushed the weights in opposite directions. Severity had the same values.
        hold: 0.9
        visual_cues:
          - id: transfer-read
            phrase: Read down the urgency column
            targets:
              - transfer-column
            color: cyan
            linger: 0.35
          - id: transfer-subtract
            phrase: subtracting those gradients
            targets:
              - transfer-column
            color: green
            linger: 0.35
      - say: Suppose the routes flip the wrong way even with the same two training tickets. Look one line
          earlier. Read the buffer just before backward, then just after it. The difference tells you what
          this batch contributed. Compare the weights across the optimizer step. Once a clean batch fits,
          use a separate validation set to check how far that result carries.
        hold: 0.9
        visual_cues:
          - id: transfer-inspect
            phrase: Read the buffer just before backward
            targets:
              - transfer-column
            color: yellow
            linger: 0.35
  - id: fresh-stale-gradient
    title: Route a ticket that was held out
    visual: Score one held-out ticket on the opening ruler. Leave its first mark in place during a
      controlled replay that clears only the gradient buffer.
    beats:
      - say: This ticket was held out. Its urgency is one and a half, its severity is one, and its label says
          escalate. Train on A and B again from zero weights. This time inspect the buffer before
          backward. Both standard weights already have a gradient of minus one. Both escalation weights
          have plus one. Add the fresh contributions in the next column. With a learning rate of point
          two, which queue will get the held-out ticket?
        hold: 2.2
        visual_cues:
          - id: fresh-input
            phrase: Its urgency is one and a half
            targets:
              - fresh-ticket
            color: blue
            linger: 0.35
          - id: fresh-old
            phrase: inspect the buffer before backward
            targets:
              - fresh-calculation
            color: pink
            linger: 0.35
          - id: fresh-ask
            phrase: which queue will get the held-out ticket
            targets:
              - route-ruler
              - fresh-calculation
              - fresh-scores
            color: yellow
            linger: 0.35
      - say: The old buffer reverses both signs. Standard stores minus a half and escalation stores plus a half.
          Subtract those with plain SGD. Each standard weight becomes plus point one, and each escalation
          weight becomes minus point one. Score the held-out ticket. Standard wins. Multiply each weight
          by its feature and add. For standard, that's a tenth times one and a half, plus a tenth times
          one. Standard scores a quarter and escalation scores minus a quarter. Their difference puts the
          mark half a unit left of zero. Escalation gets about a thirty-eight percent share of the model's
          probability.
        hold: 1.35
        visual_cues:
          - id: loop-stale-sum
            phrase: Standard stores minus a half and escalation stores plus a half
            targets:
              - fresh-calculation
            color: pink
            linger: 0.35
            caption_boundary: true
          - id: loop-stale-update
            phrase: Each standard weight becomes plus point one, and each escalation weight becomes minus point one
            targets:
              - fresh-calculation
            color: yellow
            linger: 0.35
            caption_boundary: true
          - id: loop-bad-route
            phrase: Standard wins
            targets:
              - route-ruler
            color: blue
            linger: 0.35
            caption_boundary: true
          - id: fresh-bad-prob
            phrase: about a thirty-eight percent share
            targets:
              - fresh-scores
            color: cyan
            linger: 0.35
            caption_boundary: true
          - id: fresh-bad-logits
            phrase: Standard scores a quarter and escalation scores minus a quarter
            targets:
              - fresh-scores
            color: cyan
            linger: 0.3
            caption_boundary: true
          - id: fresh-bad-gap
            phrase: half a unit left of zero
            targets:
              - route-ruler
            color: blue
            linger: 0.3
            caption_boundary: true
      - say: Leave that mark there. Rewind to the same zero weights and the same old buffer. This time clear the
          buffer before backward. A and B still supply exactly the same gradient as before. The held-out
          ticket stays out of training. Where should its new mark land?
        hold: 2.1
        visual_cues:
          - id: loop-clear-stale
            phrase: clear the buffer before backward
            targets:
              - fresh-calculation
            color: yellow
            linger: 0.35
          - id: fresh-replay
            phrase: Where should its new mark land
            targets:
              - route-ruler
              - fresh-calculation
              - fresh-scores
            color: yellow
            linger: 0.35
          - id: fresh-rewind
            phrase: Rewind to the same zero weights and the same old buffer
            targets:
              - fresh-calculation
              - route-ruler
            color: blue
            linger: 0.3
      - say: Now the buffer holds only the fresh contributions. SGD gives the escalation weights plus point one
          each. On the same held-out ticket, escalation wins. Its score is now a quarter and standard
          scores minus a quarter. The gap is plus a half. Escalation probability rises to about sixty-two
          percent. For two classes, take the negative score gap and exponentiate it. Add one, then take
          the reciprocal. The same calculation gave thirty-eight percent on the left. Clearing the buffer
          flipped this ticket to its labeled queue. To measure accuracy, divide the number routed
          correctly by the total number of tickets in a separate labeled set.
        caption_starts:
          - Clearing the buffer flipped
          - To measure accuracy
        hold: 1.4
        visual_cues:
          - id: fresh-fixed-update
            phrase: SGD gives the escalation weights plus point one each
            targets:
              - fresh-calculation
            color: green
            linger: 0.35
          - id: loop-fixed-route
            phrase: escalation wins
            targets:
              - route-ruler
            color: green
            linger: 0.35
            caption_boundary: true
          - id: fresh-good-prob
            phrase: about sixty-two percent
            targets:
              - fresh-scores
            color: cyan
            linger: 0.35
            caption_boundary: true
          - id: fresh-good-logits
            phrase: Its score is now a quarter and standard scores minus a quarter
            targets:
              - fresh-scores
            color: cyan
            linger: 0.3
            caption_boundary: true
          - id: fresh-good-gap
            phrase: The gap is plus a half
            targets:
              - route-ruler
            color: green
            linger: 0.3
            caption_boundary: true
          - id: fresh-logistic
            phrase: Add one, then take the reciprocal
            targets:
              - fresh-scores
            color: cyan
            linger: 0.3
          - id: fresh-accuracy
            phrase: To measure accuracy
            targets:
              - fresh-scores
            color: cyan
            linger: 0.35
