scenes:
  - id: intro
    title: Which call fixes this ticket’s route?
    visual: Follow ticket A into the standard inbox on a tie. Run backward, take one SGD step, and score A
      again. Move the same ticket to its new inbox and mark the score gap on the ruler.
    beats:
      - say: Checkout is down. This ticket belongs in escalation. Both scores are zero, and a tie sends it to
          standard. Which call can fix the route, backward or optimizer step?
        caption_starts:
          - Which call can fix the route
        hold: 2.1
        visual_cues:
          - id: intro-score-tie
            phrase: Both scores are zero
            targets:
              - intro-scores
            color: blue
            linger: 0.35
          - id: intro-choose
            phrase: backward or optimizer step
            targets:
              - intro-scores
              - intro-operation
            color: yellow
            linger: 0.35
          - id: intro-pin
            phrase: a tie sends it to standard
            targets:
              - intro-scores
              - route-ruler
            color: blue
            linger: 0.3
      - say: Train on A and one ticket labeled standard. Run backward. The gradient buffer fills. Score A
          again with the same weights. It's still a tie.
        caption_starts:
          - Run backward
        hold: 0.85
        visual_cues:
          - id: intro-gradient
            phrase: The gradient buffer fills
            targets:
              - intro-operation
            color: yellow
            linger: 0.35
          - id: intro-still
            phrase: It's still a tie
            targets:
              - intro-scores
              - route-ruler
            color: cyan
            linger: 0.35
            caption_boundary: true
      - say: Take one optimizer step and score A again. Escalation wins. It scores point two against minus
          point two for standard. The marker moves four tenths to the right.
        hold: 0.95
        visual_cues:
          - id: intro-result
            phrase: Escalation wins
            targets:
              - intro-scores
              - intro-operation
              - route-ruler
            color: green
            linger: 0.35
            caption_boundary: true
          - id: intro-read-scores
            phrase: It scores point two against minus point two for standard
            targets:
              - intro-scores
            color: cyan
            linger: 0.35
            caption_boundary: true
          - id: intro-gap
            phrase: four tenths to the right
            targets:
              - route-ruler
            color: green
            linger: 0.3
            caption_boundary: true
  - id: tensors
    title: A batch is a pair of aligned tensors
    visual: Six ticket rows keep their IDs attached to two feature values and one
      class label as a four-row batch separates from the final two.
    beats:
      - say: Each ticket is two floating point features and one integer target. The
          target identifies the standard queue or specialist escalation. A batch
          stacks feature rows into a matrix and targets into a matching vector,
          so row identity must stay aligned through shuffling and loading.
        hold: 0.6
        visual_cues:
          - id: tensors-beat-1-focus-1
            phrase: stacks feature rows into a matrix and targets
            targets:
              - tensors-object-feature-rows-targets-12
            color: blue
            linger: 0.6
          - id: tensors-beat-1-focus-2
            phrase: Each ticket is two floating point features and one integer target
            targets:
              - tensors-object-sample-name-11
            color: blue
            linger: 0.6
      - say: With six tickets and a batch size of four, the loader emits one group of
          four and a final group of two. Follow the same ticket IDs across both
          tensors as the split moves. Their shapes are six by two for features
          and six for labels before batching.
        hold: 0.8
        visual_cues:
          - id: tensors-beat-2-focus-1
            phrase: With six tickets and a batch size of four
            targets:
              - tensors-object-sample-name-11
            color: blue
            linger: 0.6
  - id: loss-contract
    title: A shape match does not validate the objective
    visual: Retain the actual ticket rows. Compare integer route indices with full
      floating target distributions, then score raw logits and a deliberately
      double-normalized input.
    beats:
      - say: For this hard-label router, features are floating rows, logits have one
          score per class, and targets are a one-dimensional long-integer
          vector. A target shaped batch by one or a floating class-index vector
          violates that contract. A different soft-target contract uses floating
          distributions with the same batch-by-class shape as the logits;
          PyTorch does not validate those distributions for you.
        hold: 0.65
        visual_cues:
          - id: loss-contract-beat-0
            phrase: For this hard-label router, features are floating rows, logits have one
              score per class, and targets are a one-dimensional long-integer
              vector
            targets:
              - loss-contract-mechanism
            color: cyan
            linger: 0.65
      - say: Pass raw logits to cross entropy. It computes negative target logit plus
          log-sum-exp over class logits. Subtract the maximum score inside the
          exponential calculation for stability. Taking log of a separately
          rounded softmax can turn an underflowed probability into minus
          infinity; feeding softmax probabilities to cross entropy makes them be
          treated as logits and changes the objective.
        hold: 0.65
        visual_cues:
          - id: loss-contract-beat-1
            phrase: Pass raw logits to cross entropy
            targets:
              - loss-contract-mechanism
            color: yellow
            linger: 0.65
      - say: The integer labels and feature rows must stay paired through one shared
          shuffle. Before scaling up, print and decode a real batch, inspect
          targets and shapes, and verify its loss. A falling number cannot
          validate a different objective or a mismatched ticket identity.
        hold: 0.65
        visual_cues:
          - id: loss-contract-beat-2
            phrase: The integer labels and feature rows must stay paired through one shared
              shuffle
            targets:
              - loss-contract-mechanism
            color: cyan
            linger: 0.65
          - id: loop-shuffle
            phrase: one shared shuffle
            targets:
              - loss-contract-mechanism
            color: yellow
            linger: 0.6
  - id: scores
    title: Raw scores become a classification loss
    visual: Two supplied logit pairs become stable softmax probabilities,
      correct-class likelihoods, and a row-weighted batch loss.
    beats:
      - say: A linear head produces one logit per destination. Logits are unrestricted
          scores, so the pair two and minus one does not itself describe
          percentages. Cross entropy applies log softmax internally and selects
          the score associated with the target class.
        hold: 0.6
        visual_cues:
          - id: scores-beat-1-focus-1
            phrase: A linear head produces one logit per destination
            targets:
              - scores-simulation-16
            color: blue
            linger: 0.6
          - id: scores-beat-1-focus-2
            phrase: and selects the score associated with the target
            targets:
              - scores-object-ticket-a-target-standard-14
            color: blue
            linger: 0.6
      - say: The first ticket already strongly favors its correct route. The second
          ticket's scores are closer, so its correct route receives less
          probability and contributes a larger loss. The bars show both rows and
          their batch average.
        hold: 0.8
        visual_cues:
          - id: scores-beat-2-focus-1
            phrase: The first ticket already strongly favors its correct route
            targets:
              - scores-simulation-16
            color: blue
            linger: 0.6
          - id: scores-beat-2-focus-2
            phrase: The bars show both rows and their batch average
            targets:
              - scores-simulation-16
              - scores-batch-average
            color: yellow
            linger: 0.6
  - id: phases
    title: Two tickets, one weight update
    visual: Keep W and W.grad side by side. Follow both tickets into the same escalation-weight derivative
      before applying SGD and re-scoring A.
    beats:
      - say: Go back to the first step. Clear the buffer. Ticket A has two positive features and belongs in
          escalation. B has two negative features and belongs in standard. The forward pass reads the zero
          weights. Both tickets give their target half the probability, so each costs about point six nine
          three nats.
        hold: 0.8
        visual_cues:
          - id: phases-inputs
            phrase: Ticket A has two positive features
            targets:
              - phases-pair
            color: blue
            linger: 0.35
          - id: phases-loss
            phrase: each costs about point six nine three nats
            targets:
              - phases-readout
            color: cyan
            linger: 0.35
      - say: Follow the urgency weight for escalation. On A, take the probability minus its target indicator.
          Half minus one is minus a half. Multiply by A's urgency, plus one. B gives half minus zero,
          times minus one. Both tickets contribute minus a half, so their mean is minus a half. Calling
          backward writes that mean into the gradient buffer, in the escalation row under urgency. The
          weights still read zero.
        hold: 1.1
        visual_cues:
          - id: phases-contrib-a
            phrase: Half minus one is minus a half
            targets:
              - phases-pair
            color: yellow
            linger: 0.35
          - id: phases-contrib-b
            phrase: B gives half minus zero, times minus one
            targets:
              - phases-pair
            color: yellow
            linger: 0.35
          - id: phases-written
            phrase: Calling backward writes that mean into the gradient buffer, in the escalation row under urgency
            targets:
              - phases-gradient-matrix
            color: yellow
            linger: 0.35
          - id: phases-weights-still-zero
            phrase: The weights still read zero
            targets:
              - phases-weight-matrix
            color: green
            linger: 0.35
      - say: Plain SGD subtracts the stored gradient times point two. Subtracting a negative raises the
          escalation weight to point one. Severity gets the same update. The standard weights move the
          other way. Run A through those weights again. Its escalation score leads by four tenths, just as
          it did on the opening ruler.
        hold: 0.95
        visual_cues:
          - id: phases-beat-3-focus-1
            phrase: Plain SGD subtracts the stored gradient times point two
            targets:
              - phases-weight-matrix
              - phases-gradient-matrix
            color: green
            linger: 0.35
          - id: phases-rescore
            phrase: Its escalation score leads by four tenths
            targets:
              - phases-readout
            color: cyan
            linger: 0.35
  - id: none-and-momentum
    title: Will a weight move with a zero gradient?
    visual: Retain one scalar weight and momentum buffer. Fork a missing gradient
      and a zero tensor, compute their distinct next weights, and show that
      clearing gradients leaves optimizer history.
    beats:
      - say: Clear the gradients before the next independent backward pass. You can do this on either side of
          forward. Backward adds derivatives to the trainable leaves it reaches. An unused weight can
          still have an empty gradient field. Forward has state of its own. In training mode, BatchNorm
          can update its running statistics as it reads the batch.
        hold: 0.65
        visual_cues:
          - id: none-and-momentum-beat-0
            phrase: Clear the gradients before the next independent backward pass
            targets:
              - none-and-momentum-mechanism
            color: cyan
            linger: 0.65
      - say: Setting a gradient to None releases the parameter's reference to that tensor. Other references
          or the allocator can keep the storage. Now take one SGD step from weight one with gradient one
          and learning rate one tenth. The weight reaches point nine, and its momentum buffer holds one.
          Make two copies. Give one an empty gradient field and the other a zero. Which weight will move
          on the next step?
        hold: 2
        visual_cues:
          - id: none-and-momentum-beat-1
            phrase: Make two copies
            targets:
              - none-and-momentum-mechanism
            color: yellow
            linger: 0.65
          - id: momentum-saved
            phrase: The weight reaches point nine, and its momentum buffer holds one
            targets: [none-and-momentum-mechanism]
            color: cyan
            linger: 0.35
          - id: momentum-first-step
            phrase: Now take one SGD step
            targets: [none-and-momentum-mechanism]
            color: cyan
            linger: 0.35
      - say: SGD skips the weight with no gradient. It stays at point nine. With a zero gradient, SGD
          multiplies the old momentum by nine tenths and adds zero. The buffer now holds point nine. At a
          learning rate of one tenth, subtract nine hundredths. The weight moves to point eight one.
          Clearing the gradient leaves the momentum history in place. Weight decay can also move a
          parameter with a zero gradient.
        caption_starts:
          - It stays at point nine
          - With a zero gradient, SGD multiplies
          - The buffer now holds point nine
          - The weight moves to point eight one
        hold: 0.65
        visual_cues:
          - id: none-and-momentum-beat-2
            phrase: SGD skips the weight with no gradient
            targets:
              - none-and-momentum-mechanism
            color: cyan
            linger: 0.65
          - id: loop-missing-gradient
            phrase: It stays at point nine
            targets:
              - none-and-momentum-mechanism
            color: yellow
            linger: 0.6
          - id: loop-zero-gradient
            phrase: The weight moves to point eight one
            targets:
              - none-and-momentum-mechanism
            color: yellow
            linger: 0.6
          - id: momentum-decayed
            phrase: The buffer now holds point nine
            targets: [none-and-momentum-mechanism]
            color: pink
            linger: 0.35
  - id: accumulation
    title: What is still in w.grad?
    visual: Hold w at one and rebuild the same square three times. Each backward call deposits two units in
      the buffer. Clear the reference before the third call and compare the two readings.
    beats:
      - say: Hold the weight at one. Square it. The slope here is two. Run backward once and the buffer holds
          two. Keep the weight fixed, build the same square again, and call backward a second time. It
          adds another two. The buffer now holds four, even though the slope here is still two.
        hold: 1
        visual_cues:
          - id: buffer-first
            phrase: the buffer holds two
            targets:
              - accumulation-buffer
            color: yellow
            linger: 0.35
            caption_boundary: true
          - id: buffer-second
            phrase: The buffer now holds four
            targets:
              - accumulation-buffer
            color: yellow
            linger: 0.35
            caption_boundary: true
      - say: Start a fresh update. Set the gradient to None. The buffer is empty. The weight is still one. If
          you build that same square and run backward once more, what will you read in the buffer?
        hold: 1.95
        visual_cues:
          - id: buffer-clear
            phrase: Set the gradient to None
            targets:
              - accumulation-buffer
            color: pink
            linger: 0.35
            caption_boundary: true
          - id: buffer-ask
            phrase: what will you read in the buffer
            targets:
              - accumulation-buffer
            color: yellow
            linger: 0.35
            caption_boundary: true
      - say: Two. Only this last backward pass contributed. Clear before a fresh update. When several
          microbatches belong to one update, keep their contributions together. You still have to decide
          how much each microbatch counts.
        hold: 0.8
        visual_cues:
          - id: buffer-fresh
            phrase: Two
            targets:
              - accumulation-buffer
            color: yellow
            linger: 0.35
            caption_boundary: true
  - id: microbatch-denominators
    title: How much weight does ticket C get?
    visual: Give each ticket a share of the same strip. Compare equal chunks and equal tickets, then trace
      the effect on the urgency weight for the standard route.
    beats:
      - say: Reset the router to zero weights and keep them fixed. A and B fit in the first chunk. Ticket C runs
          alone. It also needs escalation, but its urgency is two. Follow the standard route's urgency
          weight. At these weights, either A or B on its own gives a gradient of a half. C gives one. If
          we weight the two chunk means equally, what fraction multiplies C's loss?
        hold: 2
        visual_cues:
          - id: micro-first-chunks
            phrase: A and B fit in the first chunk
            targets:
              - micro-shares
            color: blue
            linger: 0.35
          - id: micro-question
            phrase: what fraction multiplies C's loss
            targets:
              - micro-shares
              - micro-readout
            color: yellow
            linger: 0.35
      - say: C gets half. A and B share the other half, one quarter each. That makes the gradient three
          quarters. Now give each ticket the same width. The first chunk gets two thirds and C gets one
          third. The gradient becomes two thirds, exactly the mean of the three contributions. Severity
          stays at a half in both runs.
        hold: 1
        visual_cues:
          - id: micro-equal
            phrase: C gets half
            targets:
              - micro-shares
              - micro-readout
            color: pink
            linger: 0.35
            caption_boundary: true
          - id: micro-count
            phrase: Now give each ticket the same width
            targets:
              - micro-shares
            color: cyan
            linger: 0.35
          - id: micro-row-result
            phrase: The gradient becomes two thirds
            targets:
              - micro-readout
            color: green
            linger: 0.35
            caption_boundary: true
          - id: micro-chunk-result
            phrase: That makes the gradient three quarters
            targets:
              - micro-readout
            color: pink
            linger: 0.3
            caption_boundary: true
      - say: Apply those fractions to the mean losses before backward. A fraction applied only to a logged
          number leaves the buffer untouched. For equal chunks, dividing each mean loss by the number of
          chunks works. Skipping the division multiplies the gradient by that count. For plain SGD alone
          that scales the step. Clipping, momentum history and Adam can change the effect. For ignored
          targets or class weights, use each chunk's share of the loss denominator.
        hold: 0.75
        visual_cues:
          - id: micro-loss
            phrase: Apply those fractions to the mean losses before backward
            targets:
              - micro-readout
              - micro-shares
            color: cyan
            linger: 0.35
      - say: Accumulate at the same weights, then step once. BatchNorm can use different statistics in smaller
          chunks, and Dropout can draw different masks. With distributed data parallel, put both forward
          and backward of the early chunks inside no sync. Let the final backward synchronize the
          accumulated gradients. Ranks need the same schedule. Other communication can still occur. With
          loss scaling, keep one scale for the window. Unscale once after the last backward, then clip,
          step, and update the scale.
        hold: 0.85
        visual_cues:
          - id: micro-window
            phrase: Let the final backward synchronize the accumulated gradients
            targets:
              - micro-readout
            color: green
            linger: 0.35
          - id: micro-scale
            phrase: Unscale once after the last backward
            targets:
              - micro-readout
            color: yellow
            linger: 0.35
  - id: batching
    title: Weight an epoch loss by its rows
    visual: Batch means 0.20 and 0.50 combine with sizes four and two. Two animated
      aggregations distinguish the row mean 0.30 from equal-batch mean 0.35.
    beats:
      - say: An epoch ends with one batch of four rows at mean loss 0.20 and a final
          batch of two at mean loss 0.50. Each row should contribute equally to
          this example's reported epoch average, so the batch sizes must remain
          part of the calculation.
        hold: 0.6
        visual_cues:
          - id: batching-beat-1-focus-1
            phrase: with one batch of four rows at mean
            targets:
              - batching-object-batch-a-4-rows-mean-0-20-32
            color: blue
            linger: 0.6
          - id: batching-beat-1-focus-2
            phrase: a final batch of two at mean loss 0.50
            targets:
              - batching-batch-b
            color: blue
            linger: 0.6
      - say: Multiply each mean by its row count, add the loss totals, and divide by
          six. The result is 0.30. Giving each batch mean equal weight produces
          0.35 and overstates the influence of the smaller final batch.
        hold: 0.8
        visual_cues:
          - id: batching-beat-2-focus-1
            phrase: Multiply each mean by its row count
            targets:
              - batching-object-distribution-batching-34
            color: blue
            linger: 0.6
          - id: batching-beat-2-focus-2
            phrase: Giving each batch mean equal weight produces 0
            targets:
              - batching-object-equal-batch-weighting-36
            color: blue
            linger: 0.6
  - id: fit-batch
    title: Memorize a clean batch to test the wiring
    visual: A seeded two-layer ticket classifier runs 120 measured SGD updates. The
      current update count, cross-entropy loss, weight norm, predictions, and
      loss-curve endpoint all come from the same model state.
    beats:
      - say: Before loading a large dataset, ask whether the model and loop can memorize
          a small, clean batch. This seeded two-layer ticket classifier starts
          with a measured loss of 0.6521. As SGD changes the weights, we
          reevaluate all eight tickets and plot each measured loss from the same
          current model state. Across 120 updates, the loss reaches 0.0056 and
          all eight routes are correct.
        hold: 0.6
        motion_check:
          region:
            - 285
            - 315
            - 1350
            - 665
          minimumChangedFraction: 0.002
        visual_cues:
          - id: fit-batch-beat-1-focus-1
            phrase: 0056 and all eight routes are correct
            targets:
              - fit-batch-simulation-37
            color: blue
            linger: 0.6
          - id: fit-batch-beat-1-focus-2
            phrase: This seeded two-layer ticket classifier starts with a measured loss of 0
            targets:
              - fit-batch-object-ticket-38
            color: blue
            linger: 0.6
      - say: All eight tickets now go to the right queues. That's a quick check on the shapes, labels, loss
          and update order. Freeze these weights and try tickets the model has never seen.
        hold: 0.8
        visual_cues:
          - id: fit-batch-beat-2-focus-1
            phrase: All eight tickets now go to the right queues
            targets:
              - fit-batch-simulation-37
            color: blue
            linger: 0.6
          - id: fit-batch-beat-2-focus-2
            phrase: Freeze these weights
            targets:
              - fit-batch-object-distribution-fit-batch-40
            color: blue
            linger: 0.6
  - id: layer-modes
    title: Layer behavior and graph recording are separate controls
    visual: Keep the same activation identities through a supplied Dropout mask and
      evaluation identity. Separately show BatchNorm running-buffer updates and
      graph-recording controls.
    beats:
      - say: Training-mode Dropout zeroes sampled entries and scales survivors by one
          divided by one minus its probability. At one half, surviving
          activations double. In this layer, evaluation is identity. If two outputs
          match, check the layer's training flag. Two training calls can draw
          the same mask. Linear and ReLU layers by themselves have the same computation
          in train and eval.
        hold: 0.65
        visual_cues:
          - id: layer-modes-beat-0
            phrase: Training-mode Dropout zeroes sampled entries and scales survivors by one
              divided by one minus its probability
            targets:
              - layer-modes-mechanism
            color: cyan
            linger: 0.65
          - id: loop-dropout-train
            phrase: surviving activations double
            targets:
              - layer-modes-mechanism
            color: yellow
            linger: 0.6
          - id: loop-dropout-eval
            phrase: evaluation is identity
            targets:
              - layer-modes-mechanism
            color: yellow
            linger: 0.6
      - say: With default running-statistics tracking, BatchNorm training uses the
          current batch and updates persistent running buffers; evaluation reads
          those buffers. Disabling that tracking uses batch statistics in both
          modes. LayerNorm itself applies the same trailing-dimension
          normalization in either mode. Even inside no-grad, a BatchNorm layer in
          training mode can update its running statistics.
        hold: 0.65
        visual_cues:
          - id: layer-modes-beat-1
            phrase: With default running-statistics tracking, BatchNorm training uses the
              current batch and updates persistent running buffers; evaluation
              reads those buffers
            targets:
              - layer-modes-mechanism
            color: yellow
            linger: 0.65
      - say: For ordinary held-out loss evaluation, choose eval and no-grad and omit backward and optimizer
          step. To find which inputs influence a score, keep the layers in eval and turn gradient
          recording on. We use four validation tickets to choose a checkpoint. Save a separate set of
          tickets for its final test.
        hold: 0.65
        visual_cues:
          - id: layer-modes-beat-2
            phrase: For ordinary held-out loss evaluation, choose eval and no-grad and omit
              backward and optimizer step
            targets:
              - layer-modes-mechanism
            color: cyan
            linger: 0.65
  - id: validation
    title: Validation reads weights without updating them
    visual: Training and evaluation lanes separate. A best-validation checkpoint is
      copied into a frozen snapshot that does not follow later weight changes.
    beats:
      - say: Training mode and evaluation mode configure layers such as Dropout and
          BatchNorm. Separately, no-grad prevents validation from recording an
          autograd graph. During evaluation, compute held-out loss and accuracy
          without calling backward or optimizer step.
        hold: 0.6
        visual_cues:
          - id: validation-beat-1-focus-1
            phrase: compute held-out loss and accuracy without calling backward or optimizer
              step
            targets:
              - validation-object-validation-model-eval-44
              - validation-measure-only
            color: blue
            linger: 0.6
          - id: validation-beat-1-focus-2
            phrase: Training mode and evaluation mode configure layers such as Dropout and
              BatchNorm
