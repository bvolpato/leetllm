            phrase: A signature proves that particular bytes were signed; the receiver still checks issuer, audience,
              expiry and permission.
            targets:
              - trusted-envelope-mechanism
            color: yellow
            linger: 0.35
          - id: mt-trusted-envelope-s1-3
            phrase: A downstream tenant field cannot overwrite the context simply because its spelling resembles the
              trusted one.
            targets:
              - trusted-envelope-mechanism
            color: yellow
            linger: 0.35
      - say: Alice has signed in. Her grant opens workspace A. When she chooses B, the gateway denies the
          request before retrieval. If her grant changes, check that retrieval and inference enforce the
