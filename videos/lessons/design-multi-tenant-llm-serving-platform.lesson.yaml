scenes:
  - id: intro
    title: Should this route deliver another summary?
    visual: A folded citation slides into Bob’s incident summary. Keep his delivery name beside the source’s
      permitted reader. Mark the route paused only after the decision.
    beats:
      - say: This citation landed in Bob’s incident summary. Look at the two names. Bob received the summary
          in workspace B. Only Carol can read the postmortem in workspace A. Should this route deliver
          another summary?
        hold: 2.6
        caption_starts:
          - Look at the two names
          - Only Carol can read
          - Should this route deliver another summary
        visual_cues:
          - id: intro-delivery
            phrase: This citation landed in Bob’s incident summary
            targets: [summary-receipt, cited-source]
            color: pink
          - id: intro-citation
            phrase: Only Carol can read the postmortem in workspace A
            targets: [summary-receipt, cited-source]
            color: blue
          - id: intro-choice
            phrase: Should this route deliver another summary
            targets: [summary-receipt, cited-source]
            color: yellow
      - say: Pause deliveries on this route. Keep a protected record of who received the summary, which source
          it cited and who had permission to read it. Trace Bob’s request through retrieval and the cache
          to find where that check failed. Alice’s long review and Bob’s short summary also waited on the
          same replica. Use the queue and memory traces to investigate that delay.
        hold: 1.1
        caption_starts:
          - Pause deliveries on this route
          - Keep a protected record
          - Trace Bob’s request
          - Alice’s long review
        visual_cues:
          - id: intro-contain
            phrase: Pause deliveries on this route
            targets: [summary-receipt, cited-source]
            color: yellow
          - id: intro-delay
            phrase: Alice’s long review and Bob’s short summary also waited on the same replica
            targets: [summary-receipt]
            color: cyan
  - id: sharing-contract
    title: Follow the boundaries through one shared step
    visual: A shared immutable weight rectangle sits above two continuously separate request lanes. Move
      authenticated identity, evidence, page handles and usage receipts through each lane; the common
      execution step joins work, never ownership.
    beats:
      - say: Alice and Bob can run in the same batch. Follow the two rows under the frozen model weights. Each
          request carries its own reader permissions, evidence, conversation history, adapter revision and
          usage record. The worker applies the same weights to both rows.
        hold: 0.8
        visual_cues:
          - id: mt-sharing-contract-b0
            phrase: Alice and Bob can run in the same batch. Follow the two rows under the frozen model weights.
              Each request carries its own reader permissions, evidence, conversation history, adapter
              revision and usage record. The worker applies the same weights to both rows.
            targets:
              - sharing-contract-packet
            color: cyan
            linger: 0.35
      - say: For our supplied dense model, seventy two billion weights at two bytes each occupy one hundred
          forty four decimal gigabytes. One hundred copies would occupy fourteen point four terabytes
          before runtime memory. The fleet still needs replicas for capacity and availability. Each
          replica checks which requests may use its private state.
        hold: 0.8
        visual_cues:
          - id: mt-sharing-contract-b1
            phrase: For our supplied dense model, seventy two billion weights at two bytes each occupy one hundred
              forty four decimal gigabytes. One hundred copies would occupy fourteen point four terabytes
              before runtime memory. The fleet still needs replicas for capacity and availability. Each
              replica checks which requests may use its private state.
            targets:
              - sharing-contract-mechanism
            color: cyan
            linger: 0.35
          - id: mt-sharing-contract-s1-0
            phrase: For our supplied dense model, seventy two billion weights at two bytes each occupy one hundred
              forty four decimal gigabytes.
            targets:
              - sharing-contract-mechanism
            color: yellow
            linger: 0.35
          - id: mt-sharing-contract-s1-1
            phrase: One hundred copies would occupy fourteen point four terabytes before runtime memory.
            targets:
              - sharing-contract-mechanism
            color: yellow
            linger: 0.35
      - say: "Begin the design with six promises: trusted identity, scoped state, conserved admission, bounded
          service shares, replay-safe accounting and recoverable ownership. Put each promise at its
          enforcing component. A gateway check cannot protect a worker administration endpoint that
          tenants can reach directly. Deployment and artifact policy belong to the control plane as well."
        hold: 0.8
        visual_cues:
          - id: mt-sharing-contract-b2
            phrase: "Begin the design with six promises: trusted identity, scoped state, conserved admission,
              bounded service shares, replay-safe accounting and recoverable ownership. Put each promise
              at its enforcing component. A gateway check cannot protect a worker administration endpoint
              that tenants can reach directly. Deployment and artifact policy belong to the control plane
              as well."
            targets:
              - sharing-contract-mechanism
            color: cyan
            linger: 0.35
  - id: stream-clocks
    title: Measure the events you can actually observe
    visual: On one 0–240 ms axis, reveal arrival, first token, bundled event and completion sequentially. Four
      tokens share one 220 ms envelope. Construct the 120 ms event bracket and 35 ms TPOT only after their
      spoken calculations.
    beats:
      - say: Draw one request on a clock. It arrives at zero, emits one token at one hundred milliseconds, emits four
          more together at two hundred twenty, and completes at two hundred forty. Those four tokens arrived
          as one observed event. The trace does not contain four separate decoding timestamps for them.
        hold: 0.8
        visual_cues:
          - id: mt-stream-clocks-b0
            phrase: Draw one request on a clock. It arrives at zero, emits one token at one hundred milliseconds, emits
              four more together at two hundred twenty, and completes at two hundred forty. Those four tokens
              arrived as one observed event. The trace does not contain four separate decoding timestamps for
              them.
            targets:
              - stream-clocks-mechanism
            color: cyan
            linger: 0.35
          - id: mt-stream-clocks-s0-1
            phrase: It arrives at zero, emits one token at one hundred milliseconds, emits four more together at two
              hundred twenty, and completes at two hundred forty.
            targets:
              - stream-clocks-mechanism
            color: yellow
            linger: 0.35
          - id: mt-stream-clocks-first
            phrase: emits one token at one hundred milliseconds
            targets:
              - stream-clocks-mechanism
            color: cyan
            linger: 0.35
          - id: mt-stream-clocks-bundle
            phrase: emits four more together at two hundred twenty
            targets:
              - stream-clocks-mechanism
            color: cyan
            linger: 0.35
          - id: mt-stream-clocks-terminal
            phrase: completes at two hundred forty
            targets:
              - stream-clocks-mechanism
            color: cyan
            linger: 0.35
      - say: The two output events are one hundred twenty milliseconds apart. Completion minus first output is one
          hundred forty milliseconds. Divide that by four additional tokens and request time per output token
          is thirty five milliseconds. The final twenty milliseconds is completion overhead; this mean cannot
          reconstruct the hidden gaps inside the bundle.
        hold: 0.8
        visual_cues:
          - id: mt-stream-clocks-b1
            phrase: The two output events are one hundred twenty milliseconds apart. Completion minus first output is one
              hundred forty milliseconds. Divide that by four additional tokens and request time per output
              token is thirty five milliseconds. The final twenty milliseconds is completion overhead; this
              mean cannot reconstruct the hidden gaps inside the bundle.
            targets:
              - stream-clocks-mechanism
            color: cyan
            linger: 0.35
          - id: mt-stream-clocks-s1-0
            phrase: The two output events are one hundred twenty milliseconds apart.
            targets:
              - stream-clocks-mechanism
            color: yellow
            linger: 0.35
          - id: mt-stream-clocks-s1-1
            phrase: Completion minus first output is one hundred forty milliseconds.
            targets:
              - stream-clocks-mechanism
            color: yellow
            linger: 0.35
          - id: mt-stream-clocks-s1-2
            phrase: Divide that by four additional tokens and request time per output token is thirty five milliseconds.
            targets:
              - stream-clocks-mechanism
            color: yellow
            linger: 0.35
          - id: mt-stream-clocks-s1-3
            phrase: The final twenty milliseconds is completion overhead; this mean cannot reconstruct the hidden gaps
              inside the bundle.
            targets:
              - stream-clocks-mechanism
            color: yellow
            linger: 0.35
      - say: Our external time to first token starts when the request reaches the platform. It includes admission
          queueing, adapter loading and prompt processing. A worker metric may start after some of those
          stages. Compare like boundaries, and label whether a streaming objective constrains event gaps, a
          request mean or another precisely defined observation.
        hold: 0.8
        visual_cues:
          - id: mt-stream-clocks-b2
            phrase: Our external time to first token starts when the request reaches the platform. It includes admission
              queueing, adapter loading and prompt processing. A worker metric may start after some of those
              stages. Compare like boundaries, and label whether a streaming objective constrains event gaps,
              a request mean or another precisely defined observation.
            targets:
              - stream-clocks-mechanism
            color: cyan
            linger: 0.35
  - id: goodput-contract
    title: Count successful requests without hiding failures
    visual: Five supplied request cards carry completion, TTFT and worst observed event gap. Apply a
      declared per-request gate to each. Keep the failed card in the denominator. The final three-of-five
      counter appears after the complete conclusion.
    beats:
      - say: Five requests arrive. To count as a success, each stream must finish, send its first output within
          eight hundred milliseconds and keep every output gap within one hundred twenty milliseconds.
          Request one passes with first output at six hundred milliseconds and a maximum gap of eighty.
          Request two passes with first output at seven hundred and a maximum gap of one hundred twenty
          milliseconds. Its longest gap lands exactly on the limit.
        hold: 0.8
        visual_cues:
          - id: mt-goodput-contract-b0
            phrase: Five requests arrive. To count as a success, each stream must finish, send its first output
              within eight hundred milliseconds and keep every output gap within one hundred twenty
              milliseconds. Request one passes with first output at six hundred milliseconds and a maximum
              gap of eighty. Request two passes with first output at seven hundred and a maximum gap of
              one hundred twenty milliseconds. Its longest gap lands exactly on the limit.
            targets:
              - goodput-contract-mechanism
            color: cyan
            linger: 0.35
          - id: mt-goodput-contract-s0-2
            phrase: Request one passes with first output at six hundred milliseconds and a maximum gap of eighty.
            targets:
              - goodput-contract-mechanism
            color: yellow
            linger: 0.35
          - id: mt-goodput-contract-s0-3
            phrase: Request two passes with first output at seven hundred and a maximum gap of one hundred twenty
              milliseconds.
            targets:
              - goodput-contract-mechanism
            color: yellow
            linger: 0.35
      - say: Request three reaches its first output at nine hundred milliseconds and fails the first-output
          condition. Request four starts at four hundred with short gaps, but its stream fails; it also
          fails the gate. Request five completes successfully. Its first output arrives at five hundred
          milliseconds and its longest observed gap is one hundred. Three of five arrivals therefore pass,
          or sixty percent.
        hold: 0.8
        caption_starts:
          - Three of five arrivals therefore pass
        visual_cues:
          - id: mt-goodput-contract-b1
            phrase: Request three reaches its first output at nine hundred milliseconds and fails the first-output
              condition. Request four starts at four hundred with short gaps, but its stream fails; it
              also fails the gate. Request five completes successfully. Its first output arrives at five
              hundred milliseconds and its longest observed gap is one hundred. Three of five arrivals
              therefore pass, or sixty percent.
            targets:
              - goodput-contract-mechanism
            color: cyan
            linger: 0.35
          - id: mt-goodput-contract-s1-0
            phrase: Request three reaches its first output at nine hundred milliseconds and fails the first-output
              condition.
            targets:
              - goodput-contract-mechanism
            color: yellow
            linger: 0.35
          - id: mt-goodput-contract-s1-1
            phrase: Request four starts at four hundred with short gaps, but its stream fails; it also fails the
              gate.
            targets:
              - goodput-contract-mechanism
            color: yellow
            linger: 0.35
          - id: mt-goodput-contract-s1-2
            phrase: Request five completes successfully. Its first output arrives at five hundred milliseconds and
              its longest observed gap is one hundred.
            targets:
              - goodput-contract-mechanism
            color: yellow
            linger: 0.35
          - id: mt-goodput-contract-s1-3
            phrase: Three of five arrivals therefore pass, or sixty percent.
            targets:
              - goodput-contract-mechanism
            color: yellow
            linger: 0.35
      - say: Count each arrival once, including the stream that failed. If you pool the gaps instead, a long
          stream contributes a gap every time it sends more output. Its gaps carry more weight in the pooled
          percentile. Compare the pass rate by tenant tier and workload, alongside the arrival rate,
          completions, failures, latency and throughput.
        hold: 0.8
        visual_cues:
          - id: mt-goodput-contract-b2
            phrase: Count each arrival once, including the stream that failed. If you pool the gaps instead, a
