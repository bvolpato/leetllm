            color: cyan
            linger: 0.35
  - id: identity
    title: Which workspace can Alice open?
    visual: Run the same verified identity and grant through the gateway twice. Selecting A opens a route
      with Alice’s scoped context. Selecting B closes the route before retrieval can receive a lookup.
    beats:
      - say: Alice has signed in. Her current grant lists workspace A. The workspace in her request tells the
          gateway which grant to check. She selects A, and the gateway sends retrieval her authorized
          context. Even inside A, retrieval still checks which documents Alice can read. Carol’s private
          postmortem stays with Carol.
        hold: 0.85
        visual_cues:
          - id: identity-principal
            phrase: Her current grant lists workspace A
            targets:
              - identity-request
            color: cyan
            linger: 0.25
          - id: identity-allow-a
            phrase: the gateway sends retrieval her authorized context
            targets:
              - workspace-gate
            color: cyan
            linger: 0.25
      - say: Keep Alice’s credentials and grant exactly as they were. This time she selects B. The worker
          already has B’s adapter loaded. Should the gateway send a lookup to retrieval?
        hold: 2.2
        visual_cues:
          - id: identity-select-b
            phrase: This time she selects B
            targets:
              - identity-request
            color: pink
            linger: 0.25
          - id: identity-choice
            phrase: Should the gateway send a lookup to retrieval
            targets:
              - identity-request
              - workspace-gate
            color: yellow
            linger: 0.25
      - say: Deny the selection here. There is no authorized B context to send. A hot adapter saves loading time
          for people who may use it. Carry Alice’s verified context through admission, workers, caches and
          usage records. Check service credentials on the worker’s administrative routes too.
        hold: 0.9
        visual_cues:
          - id: identity-deny-b
            phrase: Deny the selection here
            targets:
              - workspace-gate
            color: yellow
            linger: 0.25
            caption_boundary: true
  - id: trusted-envelope
    title: Carry authority beyond the gateway
    visual: Build a request envelope from authenticated principal to selected authorized tenant, immutable
      revisions, attempt and reservation IDs, deadline and cap. A downstream untrusted body field tries and
      fails to replace tenant identity.
    beats:
      - say: The request envelope begins with authenticated identity, then an authorized workspace choice. Add request
          and attempt identifiers, policy revision, approved model and adapter revisions, deadline and output
          cap. The receiving worker must know which service issued that envelope and which operation it
          authorizes, rather than accepting a tenant name from arbitrary JSON.
        hold: 0.8
        visual_cues:
          - id: mt-trusted-envelope-b0
            phrase: The request envelope begins with authenticated identity, then an authorized workspace choice. Add
              request and attempt identifiers, policy revision, approved model and adapter revisions, deadline
              and output cap. The receiving worker must know which service issued that envelope and which
              operation it authorizes, rather than accepting a tenant name from arbitrary JSON.
            targets:
              - trusted-envelope-mechanism
            color: cyan
            linger: 0.35
          - id: mt-trusted-envelope-s0-0
            phrase: The request envelope begins with authenticated identity, then an authorized workspace choice.
            targets:
              - trusted-envelope-mechanism
            color: yellow
            linger: 0.35
          - id: mt-trusted-envelope-s0-1
            phrase: Add request and attempt identifiers, policy revision, approved model and adapter revisions, deadline
              and output cap.
            targets:
              - trusted-envelope-mechanism
            color: yellow
            linger: 0.35
      - say: Protect service communication and use narrowly scoped credentials. A signature proves that particular
          bytes were signed; the receiver still checks issuer, audience, expiry and permission. Preserve the
          resolved identity through retrieval, worker dispatch and metering. A downstream tenant field cannot
          overwrite the context simply because its spelling resembles the trusted one.
        hold: 0.8
        visual_cues:
          - id: mt-trusted-envelope-b1
            phrase: Protect service communication and use narrowly scoped credentials. A signature proves that particular
