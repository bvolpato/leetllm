  - id: admission-dimensions
    title: Reserve the resources that can actually run out
    visual: Present six limits as separate reservoirs with explicit units. One request passes the rate gate but
      fails a page reservation. Change only page availability to make the contrasting request eligible; retain
      all other inputs.
    beats:
      - say: A requests-per-minute limit controls arrivals. A token window controls a declared token budget. A
          billing-period quota controls total allowance. A concurrency cap controls outstanding requests, and
          context or output caps bound one sequence’s growth. None of these quantities tells us how many
          physical cache pages remain on a particular worker.
        hold: 0.8
        visual_cues:
          - id: mt-admission-dimensions-b0
            phrase: A requests-per-minute limit controls arrivals. A token window controls a declared token budget. A
              billing-period quota controls total allowance. A concurrency cap controls outstanding requests,
              and context or output caps bound one sequence’s growth. None of these quantities tells us how
              many physical cache pages remain on a particular worker.
            targets:
              - admission-dimensions-mechanism
            color: cyan
            linger: 0.35
      - say: Consider a request that passes its rate limit and has spare period allowance, but needs five pages on a
          worker with only four available. Admission must wait or choose a different eligible placement. If
          one additional page becomes safely available, that memory condition changes. The user’s permission,
          quota and concurrency checks still apply independently.
        hold: 0.8
        visual_cues:
          - id: mt-admission-dimensions-b1
            phrase: Consider a request that passes its rate limit and has spare period allowance, but needs five pages on
              a worker with only four available. Admission must wait or choose a different eligible placement.
              If one additional page becomes safely available, that memory condition changes. The user’s
              permission, quota and concurrency checks still apply independently.
            targets:
              - admission-dimensions-mechanism
            color: cyan
            linger: 0.35
          - id: mt-admission-dimensions-s1-0
            phrase: Consider a request that passes its rate limit and has spare period allowance, but needs five pages on
              a worker with only four available.
            targets:
              - admission-dimensions-mechanism
            color: yellow
            linger: 0.35
          - id: mt-admission-dimensions-s1-1
            phrase: Admission must wait or choose a different eligible placement.
            targets:
              - admission-dimensions-mechanism
            color: yellow
            linger: 0.35
          - id: mt-admission-dimensions-s1-2
            phrase: If one additional page becomes safely available, that memory condition changes.
            targets:
              - admission-dimensions-mechanism
            color: yellow
            linger: 0.35
      - say: Reserve the assembled prompt, including authorized retrieved content, together with the maximum permitted
          output under the policy. Enforce real context limits before allocation. An admitted request needs
          both tenant allowance and worker capacity. If those holds live in different services, define
          recoverable stages so a partial failure cannot strand or double-spend either one.
        hold: 0.8
        visual_cues:
          - id: mt-admission-dimensions-b2
            phrase: Reserve the assembled prompt, including authorized retrieved content, together with the maximum
              permitted output under the policy. Enforce real context limits before allocation. An admitted
              request needs both tenant allowance and worker capacity. If those holds live in different
              services, define recoverable stages so a partial failure cannot strand or double-spend either
              one.
            targets:
              - admission-dimensions-mechanism
            color: cyan
            linger: 0.35
          - id: mt-admission-dimensions-s2-0
            phrase: Reserve the assembled prompt, including authorized retrieved content, together with the maximum
              permitted output under the policy.
            targets:
              - admission-dimensions-mechanism
            color: yellow
            linger: 0.35
  - id: quota
    title: Conserve allowance through reservation and settlement
    visual: A 1,000-unit quota ledger moves 700 units into a reservation, settles 420 actual units, releases the
      unused 280, and stays unchanged when completion is delivered twice. Each balance derives from the
      current transaction state.
    beats:
      - say: Before dispatch, reserve the fully assembled input and the maximum permitted output under the declared
          quota policy. A token quota, concurrency limit, and physical cache-page reservation answer different
          questions. Atomic check-and-update prevents two gateways from promising the same remaining
          allowance. Bind the idempotency key to the resolved request fingerprint.
        hold: 0.65
        motion_check:
          region:
            - 320
            - 360
            - 1280
            - 500
          minimumChangedFraction: 0.002
        visual_cues:
          - id: quota-reserve-before-dispatch
            phrase: Before dispatch, reserve the fully assembled input and the maximum permitted output
            targets:
              - quota-held
            color: cyan
            linger: 0.6
          - id: quota-conserve-allowance
            phrase: the same remaining allowance
            targets:
              - quota-free
            color: yellow
            linger: 0.6
      - say: Follow this fixed-period ledger. Reservation moves allowance from available into held state. Trusted
          completion charges actual input and output, releasing only unused capacity. Deliver the same
          completion again and the balance stays unchanged. A conflicting fingerprint or usage report must
          fail. Distributed durability and execution ownership require additional recoverable coordination
          beyond this arithmetic.
        hold: 0.65
        motion_check:
          region:
            - 320
            - 360
            - 1280
            - 500
          minimumChangedFraction: 0.002
        visual_cues:
          - id: quota-into-held
            phrase: Reservation moves allowance from available into held state
            targets:
              - quota-free
              - quota-held
            color: cyan
            linger: 0.6
          - id: quota-trusted-completion
            phrase: Trusted completion charges actual input and output, releasing only unused capacity
            targets:
              - quota-held
              - quota-settled
              - quota-free
            color: yellow
            linger: 0.6
          - id: quota-replay-unchanged
            phrase: Deliver the same completion again and the balance stays unchanged
            targets:
              - quota-completion-receipt
              - quota-settled
              - quota-free
            color: yellow
            linger: 0.6
  - id: admission-race
    title: Make two gateways compete for one allowance
    visual: Two lanes each request 700 against one 1000-unit ledger. Show both stale reads as a rejected design.
      Rewind explicitly to the initial ledger and serialize the actual atomic operations; exactly one wins and
      the loser observes 300.
    beats:
      - say: Put two gateways beside the same one thousand unit allowance. Each wants to reserve seven hundred. If
          both read one thousand before either writes, both can believe admission is safe. Adding their
          promises produces fourteen hundred units, exceeding the allowance by four hundred. Independent
          successful reads do not establish a safe combined decision.
        hold: 0.8
        visual_cues:
          - id: mt-admission-race-b0
            phrase: Put two gateways beside the same one thousand unit allowance. Each wants to reserve seven hundred. If
              both read one thousand before either writes, both can believe admission is safe. Adding their
              promises produces fourteen hundred units, exceeding the allowance by four hundred. Independent
              successful reads do not establish a safe combined decision.
            targets:
              - admission-race-mechanism
            color: cyan
            linger: 0.35
          - id: mt-admission-race-s0-2
            phrase: If both read one thousand before either writes, both can believe admission is safe.
            targets:
              - admission-race-mechanism
            color: yellow
            linger: 0.35
          - id: mt-admission-race-s0-3
            phrase: Adding their promises produces fourteen hundred units, exceeding the allowance by four hundred.
            targets:
              - admission-race-mechanism
            color: yellow
            linger: 0.35
      - say: Now explicitly restart at the same initial balance and use one atomic check and update. The first
          accepted reservation holds seven hundred and leaves three hundred. The second sees three hundred and
          fails. Which contender wins depends on ordering. The safety property is exactly one admission,
          rather than a promise about which request finishes first.
        hold: 0.8
        visual_cues:
          - id: mt-admission-race-b1
            phrase: Now explicitly restart at the same initial balance and use one atomic check and update. The first
              accepted reservation holds seven hundred and leaves three hundred. The second sees three hundred
              and fails. Which contender wins depends on ordering. The safety property is exactly one
