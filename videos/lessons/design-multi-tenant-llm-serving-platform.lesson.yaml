      - say: Come back to B’s thirty-third position. For this run, retrieval has verified Bob’s access to every
          passage in his summary. B has allowance and a turn on the worker. Its two pages are full. A’s
          stream has closed, but a device operation still holds A’s page table. Can B take page four now?
        hold: 2.5
        visual_cues:
          - id: close-host
            phrase: A’s stream has closed, but a device operation still holds A’s page table
            targets:
              - history-tables
              - worker-pages
            color: cyan
            linger: 0.25
          - id: close-decision
            phrase: Can B take page four now
            targets:
              - worker-pages
              - pending-write
            color: yellow
            linger: 0.25
      - say: Wait. That read still owns a reference. While it’s using A’s page, B’s next position stays in the queue.
        hold: 0.7
        caption_starts:
          - Wait
          - While it’s using A’s page
        visual_cues:
          - id: close-wait
            phrase: Wait. That read still owns a reference
            caption_boundary: true
            targets:
              - worker-pages
              - pending-write
            color: yellow
            linger: 0.25
      - say: Now the worker confirms that A’s last read has finished and retires A’s page table. Three whole
          pages are free. The allocator gives B an empty page four. B writes position thirty-three into
          its first slot. Follow B’s table again. One, three, four. Only that first slot in page four
          belongs to B’s history so far.
        hold: 2.2
        caption_starts:
          - Three whole pages are free
          - The allocator gives B an empty page four
          - Follow B’s table again
          - One, three, four
        visual_cues:
          - id: close-last-read
            phrase: A’s last read has finished and retires A’s page table
            targets:
              - history-tables
              - worker-pages
            color: blue
            linger: 0.25
          - id: close-grant-page
            phrase: The allocator gives B an empty page four
            targets:
              - history-tables
              - worker-pages
            color: pink
            linger: 0.25
          - id: close-write
            phrase: B writes position thirty-three into its first slot
            targets:
              - worker-pages
              - pending-write
            color: pink
            linger: 0.25
            caption_boundary: true
