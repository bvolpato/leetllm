          common 100 ms once, then measure the uncovered part of the 800 ms root.
    beats:
      - say: >-
          Try a different request. Its clock stops at eight hundred milliseconds. Child A runs from zero
          to three hundred. Child B starts at two hundred and ends at six hundred fifty. Inside B, a model
          runs from two hundred fifty to five hundred fifty. How much of the root clock lies outside both
          direct children?
