scenes:
  - id: intro
    title: "How long do I have to make a return?"
    visual: "Two replies slide into view, both saying 30 days. Follow the earlier reply's citation to the policy. Open the request records to compare the prompt and index each reply used."
    beats:
      - say: >-
          Both replies say thirty days. The earlier reply links to document twelve. Open the link. The
          policy says thirty days from delivery. Which reply leaves you looking for the source?
        hold: 2.2
        visual_cues:
          - id: mf-sentence-intro-0-0
            phrase: "Both replies say thirty days."
            targets: [intro-construction]
            linger: 0
            caption_boundary: true
          - id: mf-sentence-intro-0-1
            phrase: "The earlier reply links to document twelve."
            targets: [intro-construction]
            linger: 0
            caption_boundary: true
          - id: mf-sentence-intro-0-2
            phrase: "Open the link. The policy says thirty days from delivery."
            targets: [intro-construction]
            linger: 0
            caption_boundary: true
          - id: mf-sentence-intro-0-3
            phrase: "Which reply leaves you looking for the source?"
            targets: [intro-construction]
            linger: 0
            caption_boundary: true
      - say: >-
          The new one. Its citation field is empty. Open its MLflow trace beside the earlier trace. Both
          requests used the same code and model. The prompt moved from sixteen to seventeen. The search
          index moved from seven to eight.
        hold: 0.75
        visual_cues:
          - id: mf-sentence-intro-1-0
            phrase: "The new one. Its citation field is empty."
            targets: [intro-construction]
            linger: 0
            caption_boundary: true
          - id: mf-sentence-intro-1-1
            phrase: "Open its MLflow trace beside the earlier trace."
            targets: [intro-construction]
            linger: 0
            caption_boundary: true
          - id: mf-sentence-intro-1-2
            phrase: "Both requests used the same code and model."
            targets: [intro-construction]
            linger: 0
            caption_boundary: true
          - id: mf-sentence-intro-1-3
            phrase: "The prompt moved from sixteen to seventeen."
            targets: [intro-construction]
            linger: 0
            caption_boundary: true
          - id: mf-sentence-intro-1-4
            phrase: "The search index moved from seven to eight."
            targets: [intro-construction]
            linger: 0
            caption_boundary: true
      - say: >-
          Each trace records the versions that request used. Let's test the prompt change against the
          earlier reply. Put prompt seventeen in the replay. Which search index belongs beside it?
        hold: 2.4
        visual_cues:
          - id: mf-sentence-intro-2-0
            phrase: "Each trace records the versions that request used."
            targets: [intro-construction]
            linger: 0
            caption_boundary: true
          - id: mf-sentence-intro-2-1
            phrase: "Let's test the prompt change against the earlier reply."
            targets: [intro-construction]
            linger: 0
            caption_boundary: true
          - id: mf-sentence-intro-2-2
            phrase: "Put prompt seventeen in the replay. Which search index belongs beside it?"
            targets: [intro-construction]
            linger: 0
            caption_boundary: true
  - id: evidence-controls
    title: "Set up the replay"
    visual: >-
          Complete the replay row against T103 by changing only the prompt. Then freeze T104 as RET-104
          and build the candidate replay against that separate reference.
    beats:
      - say: >-
          Use index seven, from the earlier request. Keep its question, commit and model. Change just
          prompt sixteen to seventeen. Run the replay and see which source it cites.
        hold: 0.7
        visual_cues:
          - id: mf-sentence-evidence-controls-0-0
            phrase: "Use index seven, from the earlier request."
            targets: [evidence-controls-construction]
            linger: 0
            caption_boundary: true
          - id: mf-sentence-evidence-controls-0-1
            phrase: "Keep its question, commit and model. Change just prompt sixteen to seventeen."
            targets: [evidence-controls-construction]
            linger: 0
            caption_boundary: true
          - id: mf-sentence-evidence-controls-0-2
            phrase: "Run the replay and see which source it cites."
            targets: [evidence-controls-construction]
            linger: 0
            caption_boundary: true
      - say: >-
          For a release test, keep the request that actually lost its citation. Save its question and the
          allowed source, document twelve, under the case name RET one oh four. A trace records what
          happened once. A case keeps the input and the expectation for the next run.
        hold: 0.8
        visual_cues:
          - id: mf-sentence-evidence-controls-1-0
            phrase: "For a release test, keep the request that actually lost its citation."
            targets: [evidence-controls-construction]
            linger: 0
            caption_boundary: true
          - id: mf-sentence-evidence-controls-1-1
            phrase: "Save its question and the allowed source, document twelve, under the case name RET one oh four."
            targets: [evidence-controls-construction]
            linger: 0
            caption_boundary: true
          - id: mf-sentence-evidence-controls-1-2
            phrase: "A trace records what happened once. A case keeps the input and the expectation for the next run."
            targets: [evidence-controls-construction]
            linger: 0
            caption_boundary: true
      - say: >-
          Try candidate prompt eighteen on that case. This time the reference is the failed request, so
          keep its index eight. The replay gets a new trace, T one oh five. Link it back to the case
          before scoring the answer. That link lets us find the version, the output and the test that used
          it.
        hold: 0.85
        visual_cues:
          - id: mf-sentence-evidence-controls-2-0
            phrase: "Try candidate prompt eighteen on that case."
            targets: [evidence-controls-construction]
            linger: 0
            caption_boundary: true
          - id: mf-sentence-evidence-controls-2-1
            phrase: "This time the reference is the failed request, so keep its index eight."
            targets: [evidence-controls-construction]
            linger: 0
            caption_boundary: true
          - id: mf-sentence-evidence-controls-2-2
            phrase: "The replay gets a new trace, T one oh five. Link it back to the case before scoring the answer."
            targets: [evidence-controls-construction]
            linger: 0
            caption_boundary: true
          - id: mf-sentence-evidence-controls-2-3
            phrase: "That link lets us find the version, the output and the test that used it."
            targets: [evidence-controls-construction]
            linger: 0
            caption_boundary: true
  - id: stores
    title: Searchable records and large bytes follow separate paths
    visual: Run metadata routes to a database and a checkpoint routes to an artifact store. The route switches
      from server-proxied to direct client upload while metadata ownership and credential locations remain
      explicit.
    beats:
      - say: >
          An experiment adds small searchable records and potentially huge checkpoint files. MLflow separates
          those jobs. The backend store holds identities, parameters and metrics. The artifact store holds
          large bytes such as weights, plots and evaluation tables. One run links the two storage paths.
        hold: 0.6
        visual_cues:
          - id: stores-beat-1-focus-1
            phrase: The artifact store holds large bytes such as weights, plots and evaluation tables
            targets:
              - stores-artifact-store-2-gb
            color: cyan
            linger: 0.65
          - id: stores-beat-1-focus-2
            phrase: One run links the two storage paths
            targets:
              - stores-sdk-run-r8
            color: yellow
            linger: 0.65
          - id: mf-sentence-stores-0-0
            phrase: An experiment adds small searchable records and potentially huge checkpoint files.
            targets:
              - stores-construction
            color: cyan
            linger: 0
          - id: mf-sentence-stores-0-1
            phrase: MLflow separates those jobs.
            targets:
              - stores-construction
            color: cyan
            linger: 0
          - id: mf-sentence-stores-0-2
            phrase: The backend store holds identities, parameters and metrics.
            targets:
              - stores-construction
            color: cyan
            linger: 0
          - id: mf-sentence-stores-0-3
            phrase: The artifact store holds large bytes such as weights, plots and evaluation tables.
            targets:
              - stores-construction
            color: cyan
            linger: 0
          - id: mf-sentence-stores-0-4
            phrase: One run links the two storage paths.
            targets:
              - stores-construction
            color: cyan
            linger: 0
      - say: >
          In a proxied setup, the client sends artifact bytes through the tracking server. Storage credentials
          can remain with that server. Its network capacity and access checks become part of the artifact
          path. Search traffic and large uploads still have different scaling requirements.
        hold: 0.6
        visual_cues:
          - id: stores-beat-2-focus-1
            phrase: In a proxied setup, the client sends artifact bytes through the tracking server
            targets:
              - stores-sdk-run-r8
              - stores-tracking-server
              - stores-artifact-store-2-gb
            color: cyan
            linger: 0.65
          - id: mf-sentence-stores-1-0
            phrase: In a proxied setup, the client sends artifact bytes through the tracking server.
            targets:
              - stores-construction
            color: cyan
            linger: 0
          - id: mf-sentence-stores-1-1
            phrase: Storage credentials can remain with that server.
            targets:
              - stores-construction
            color: cyan
            linger: 0
          - id: mf-sentence-stores-1-2
            phrase: Its network capacity and access checks become part of the artifact path.
            targets:
              - stores-construction
            color: cyan
            linger: 0
          - id: mf-sentence-stores-1-3
            phrase: Search traffic and large uploads still have different scaling requirements.
            targets:
              - stores-construction
            color: cyan
            linger: 0
      - say: >
          A direct setup sends large bytes from the client to object storage instead. The client now needs
          appropriate storage access. Changing routing settings does not relocate existing experiments
          automatically. Keep the recorded artifact location and a digest of its contents with the run you
          intend to reproduce.
        hold: 0.6
        visual_cues:
          - id: stores-direct-artifact
            phrase: A direct setup sends large bytes from the client to object storage instead
            targets:
              - stores-sdk-run-r8
              - stores-artifact-store-2-gb
            color: green
            linger: 0.5
          - id: stores-client-storage-access
            phrase: The client now needs appropriate storage access
            targets:
              - stores-storage-authority
            color: yellow
            linger: 0.5
          - id: mf-sentence-stores-2-0
            phrase: A direct setup sends large bytes from the client to object storage instead.
            targets:
              - stores-construction
            color: cyan
            linger: 0
          - id: mf-sentence-stores-2-1
            phrase: The client now needs appropriate storage access.
            targets:
              - stores-construction
            color: cyan
            linger: 0
          - id: mf-sentence-stores-2-2
            phrase: Changing routing settings does not relocate existing experiments automatically.
            targets:
              - stores-construction
            color: cyan
            linger: 0
          - id: mf-sentence-stores-2-3
            phrase: Keep the recorded artifact location and a digest of its contents with the run you intend to reproduce.
            targets:
              - stores-construction
            color: cyan
            linger: 0
  - id: store-route
    title: "Fetch the old checkpoint"
    visual: >-
          Follow R8's recorded direct artifact location before and after the server enables a proxy for
          new experiments. Fetch each checkpoint along its own route and identify the actor that needs
          storage access.
    beats:
      - say: >-
          Run R eight wrote its checkpoint before the server enabled proxying. Look up the run's
          experiment. Its stored artifact location points directly to the old bucket. To fetch those
          bytes, the worker opens that location with its own scoped storage credentials.
        hold: 0.7
        visual_cues:
          - id: mf-sentence-store-route-0-0
            phrase: "Run R eight wrote its checkpoint before the server enabled proxying. Look up the run's experiment."
            targets: [store-route-construction]
            linger: 0
            caption_boundary: true
          - id: mf-sentence-store-route-0-1
            phrase: "Its stored artifact location points directly to the old bucket."
            targets: [store-route-construction]
            linger: 0
            caption_boundary: true
          - id: mf-sentence-store-route-0-2
            phrase: "To fetch those bytes, the worker opens that location with its own scoped storage credentials."
            targets: [store-route-construction]
            linger: 0
            caption_boundary: true
      - say: >-
          Now the administrator enables proxying for new experiments. A new run gets a proxy location. R
          eight still points to the old bucket. The server has access to both buckets. If the worker loses
          its direct access, can it still fetch R eight from the recorded location?
        hold: 2.1
        visual_cues:
          - id: mf-sentence-store-route-1-0
            phrase: "Now the administrator enables proxying for new experiments."
            targets: [store-route-construction]
            linger: 0
            caption_boundary: true
          - id: mf-sentence-store-route-1-1
            phrase: "A new run gets a proxy location. R eight still points to the old bucket."
            targets: [store-route-construction]
            linger: 0
            caption_boundary: true
          - id: mf-sentence-store-route-1-2
            phrase: "The server has access to both buckets. If the worker loses its direct access, can it still fetch R eight from the recorded location?"
            targets: [store-route-construction]
            linger: 0
            caption_boundary: true
      - say: >-
          The old download fails the storage check. Restore the worker's authorized access or explicitly
          migrate the old artifact and its references. For the new location, the worker asks the tracking
          server, and the server reads the bytes with its scoped role. The server must also check who may
          read that artifact. The article's SQLite lab uses local files. A deployed service needs its own
          access tests.
        hold: 0.85
        visual_cues:
          - id: mf-sentence-store-route-2-0
            phrase: "The old download fails the storage check. Restore the worker's authorized access or explicitly migrate the old artifact and its references."
            targets: [store-route-construction]
            linger: 0
            caption_boundary: true
          - id: mf-sentence-store-route-2-1
            phrase: "For the new location, the worker asks the tracking server, and the server reads the bytes with its scoped role."
            targets: [store-route-construction]
            linger: 0
            caption_boundary: true
          - id: mf-sentence-store-route-2-2
            phrase: "The server must also check who may read that artifact. The article's SQLite lab uses local files. A deployed service needs its own access tests."
            targets: [store-route-construction]
            linger: 0
            caption_boundary: true
  - id: metadata-mutability
    title: The database enforces different mutation contracts
    visual: Try to change retrieval_k from 40 to 50. Compare that write with edits to a run tag and a prompt configuration.
    beats:
      - say: The native three-point-sixteen-point-one lab logs retrieval K forty. It then attempts fifty under the
          same run and parameter key. The existing parameter value must remain forty. In the SQL store, a
          uniqueness conflict is checked in the transaction; a different old value raises the
          changing-parameter error after rollback.
        hold: 0.8
        visual_cues:
          - id: mf-metadata-mutability-0
            phrase: The native three-point-sixteen-point-one lab logs retrieval K forty.
            targets:
              - metadata-mutability-construction
            color: cyan
            linger: 0.4
          - id: mf-sentence-metadata-mutability-0-0
            phrase: The native three-point-sixteen-point-one lab logs retrieval K forty.
            targets:
              - metadata-mutability-construction
            color: cyan
            linger: 0
          - id: mf-sentence-metadata-mutability-0-1
            phrase: It then attempts fifty under the same run and parameter key.
            targets:
              - metadata-mutability-construction
            color: cyan
            linger: 0
          - id: mf-sentence-metadata-mutability-0-2
            phrase: The existing parameter value must remain forty.
            targets:
              - metadata-mutability-construction
            color: cyan
            linger: 0
          - id: mf-sentence-metadata-mutability-0-3
            phrase: In the SQL store, a uniqueness conflict is checked in the transaction; a different old value raises
              the changing-parameter error after rollback.
            targets:
              - metadata-mutability-construction
            color: cyan
            linger: 0
      - say: A run tag follows a different contract. The lab changes review state from pending to approved, and the
          later read returns approved. The same prompt template version also accepts model configuration
          changes from temperature point two to point eight. The template text remains fixed. A stable record
          identifier does not make every attached field immutable.
        hold: 0.8
        visual_cues:
          - id: mf-metadata-mutability-1
            phrase: A run tag follows a different contract.
            targets:
              - metadata-mutability-construction
            color: cyan
            linger: 0.4
          - id: mf-sentence-metadata-mutability-1-0
            phrase: A run tag follows a different contract.
            targets:
              - metadata-mutability-construction
            color: cyan
            linger: 0
          - id: mf-sentence-metadata-mutability-1-1
            phrase: The lab changes review state from pending to approved, and the later read returns approved.
            targets:
              - metadata-mutability-construction
            color: cyan
            linger: 0
          - id: mf-sentence-metadata-mutability-1-2
            phrase: The same prompt template version also accepts model configuration changes from temperature point two
              to point eight.
            targets:
              - metadata-mutability-construction
            color: cyan
            linger: 0
          - id: mf-sentence-metadata-mutability-1-3
            phrase: The template text remains fixed.
            targets:
              - metadata-mutability-construction
            color: cyan
            linger: 0
          - id: mf-sentence-metadata-mutability-1-4
            phrase: A stable record identifier does not make every attached field immutable.
            targets:
              - metadata-mutability-construction
            color: cyan
            linger: 0
      - say: >-
          The earlier record says pending. Today's tag says approved. To find out who approved the release,
          open the workflow's approval record. Save the approver and time alongside the configuration the
          request used. Keep those configuration bytes with their digest so you can retrieve and verify
          them.
        hold: 0.8
        visual_cues:
          - id: mf-metadata-mutability-2
            phrase: "The earlier record says pending. Today's tag says approved."
            targets:
              - metadata-mutability-construction
            color: green
            linger: 0.4
          - id: mf-sentence-metadata-mutability-2-0
            phrase: "The earlier record says pending. Today's tag says approved."
            targets:
              - metadata-mutability-construction
            color: cyan
            linger: 0
          - id: mf-sentence-metadata-mutability-2-1
            phrase: "To find out who approved the release, open the workflow's approval record."
            targets:
              - metadata-mutability-construction
            color: cyan
            linger: 0
          - id: mf-sentence-metadata-mutability-2-2
            phrase: "Save the approver and time alongside the configuration the request used."
            targets:
              - metadata-mutability-construction
            color: cyan
            linger: 0
          - id: mf-sentence-metadata-mutability-2-3
            phrase: "Keep those configuration bytes with their digest so you can retrieve and verify them."
            targets:
              - metadata-mutability-construction
            color: cyan
            linger: 0
  - id: lineage
    title: Distinct identities answer distinct reconstruction questions
    visual: Select run R8 and attach its exact code C8, data D4 and prompt P17 records one at a time. Carry logged
      model M3 into registry version three and then the resolved request T104, whose runtime prompt P17 and
      index I8 remain distinct. Retain that request as case RET-104.
    beats:
      - say: >
          Build the lineage one edge at a time. This run records a source revision, a frozen dataset snapshot
          and a resolved prompt. The run's metric is meaningful only alongside those inputs. Logging a number
          successfully establishes persistence; the experiment design determines what the number means.
        hold: 0.6
        visual_cues:
          - id: lineage-beat-1-focus-1
            phrase: This run records a source revision, a frozen dataset snapshot and a resolved prompt
            targets:
              - lineage-run-r8
            color: cyan
            linger: 0.65
          - id: lineage-beat-1-focus-2
            phrase: Logging a number successfully establishes persistence; the experiment design determines what the
              number means
            targets:
              - lineage-label
            color: yellow
            linger: 0.65
          - id: mf-sentence-lineage-0-0
            phrase: Build the lineage one edge at a time.
            targets:
              - lineage-construction
            color: cyan
            linger: 0
          - id: mf-sentence-lineage-0-1
            phrase: This run records a source revision, a frozen dataset snapshot and a resolved prompt.
            targets:
              - lineage-construction
            color: cyan
            linger: 0
          - id: mf-sentence-lineage-0-2
            phrase: The run's metric is meaningful only alongside those inputs.
            targets:
              - lineage-construction
            color: cyan
            linger: 0
          - id: mf-sentence-lineage-0-3
            phrase: Logging a number successfully establishes persistence; the experiment design determines what the
              number means.
            targets:
              - lineage-construction
            color: cyan
            linger: 0
      - say: >
          The run creates a logged model with its own identity. Registering that model assigns a separate
          registry version. Neither identifier is the run ID. Following the links reaches the actual artifact
          and its source evidence, which is more precise than trusting a convenient model name.
        hold: 0.6
        visual_cues:
          - id: lineage-beat-2-focus-1
            phrase: The run creates a logged model with its own identity
            targets:
              - lineage-logged-model-m3
            color: cyan
            linger: 0.65
          - id: lineage-beat-2-focus-2
            phrase: Registering that model assigns a separate registry version
            targets:
              - lineage-registry-version-3
            color: yellow
            linger: 0.65
          - id: mf-sentence-lineage-1-0
            phrase: The run creates a logged model with its own identity.
            targets:
              - lineage-construction
            color: cyan
            linger: 0
          - id: mf-sentence-lineage-1-1
            phrase: Registering that model assigns a separate registry version.
            targets:
              - lineage-construction
            color: cyan
            linger: 0
          - id: mf-sentence-lineage-1-2
            phrase: Neither identifier is the run ID.
            targets:
              - lineage-construction
            color: cyan
            linger: 0
          - id: mf-sentence-lineage-1-3
            phrase: Following the links reaches the actual artifact and its source evidence, which is more precise than
              trusting a convenient model name.
            targets:
              - lineage-construction
            color: cyan
            linger: 0
      - say: >
          A failing request has its own trace identity and can become an evaluation case with retained inputs
          and expectations. Some named records have mutable fields, including aliases and dataset contents.
          Preserve the resolved configuration and content digest used by each evaluation so later edits cannot
          silently change the comparison.
        hold: 0.6
        visual_cues:
          - id: lineage-beat-3-focus-1
            phrase: A failing request has its own trace identity and can become an evaluation case with retained inputs
              and expectations
            targets:
              - lineage-request-t104-model-m3-prompt-p17-index-i8
            color: cyan
            linger: 0.65
          - id: lineage-beat-3-focus-2
            phrase: Some named records have mutable fields, including aliases and dataset contents
            targets:
              - lineage-run-r8
            color: yellow
            linger: 0.65
          - id: mf-sentence-lineage-2-0
            phrase: A failing request has its own trace identity and can become an evaluation case with retained inputs
              and expectations.
            targets:
              - lineage-construction
            color: cyan
            linger: 0
          - id: mf-sentence-lineage-2-1
            phrase: Some named records have mutable fields, including aliases and dataset contents.
            targets:
              - lineage-construction
            color: cyan
