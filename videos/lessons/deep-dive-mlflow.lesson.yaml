            phrase: "Retrieval takes a hundred forty-five. Reranking takes another hundred ten."
            targets: [trace-construction]
            linger: 0
            caption_boundary: true
          - id: mf-sentence-trace-0-2
            phrase: "Generation then takes eleven hundred thirty milliseconds. Inside it, the model call and the citation check have their own spans."
            targets: [trace-construction]
            linger: 0
            caption_boundary: true
          - id: mf-sentence-trace-0-3
            phrase: "A span records when an operation started and ended. Read all six against the same clock."
            targets: [trace-construction]
            linger: 0
            caption_boundary: true
      - say: >-
          Project the three direct children onto the request clock. Retrieval and reranking cover the
          first two hundred fifty-five milliseconds. Generation takes the covered interval to thirteen
          hundred eighty-five. The model call sits entirely inside generation. How many milliseconds of
          the request lie beyond those three children?
        hold: 2.2
        visual_cues:
          - id: mf-sentence-trace-1-0
            phrase: "Project the three direct children onto the request clock."
            targets: [trace-construction]
            linger: 0
            caption_boundary: true
          - id: mf-sentence-trace-1-1
            phrase: "Retrieval and reranking cover the first two hundred fifty-five milliseconds. Generation takes the covered interval to thirteen hundred eighty-five."
            targets: [trace-construction]
            linger: 0
            caption_boundary: true
          - id: mf-sentence-trace-1-2
            phrase: "The model call sits entirely inside generation."
            targets: [trace-construction]
            linger: 0
            caption_boundary: true
          - id: mf-sentence-trace-1-3
            phrase: "How many milliseconds of the request lie beyond those three children?"
            targets: [trace-construction]
            linger: 0
            caption_boundary: true
      - say: >-
          Thirty-five milliseconds, at the right edge. Adding the nested model call would count its time
          twice inside generation. The long bar tells us where time went. To find the missing citation,
          we'll also need the records that went into the answer.
