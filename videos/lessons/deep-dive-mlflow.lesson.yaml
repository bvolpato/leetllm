  - id: trace
    title: "Where did the request spend its time?"
    visual: >-
          Build T104 on one millisecond ruler. Project its three sequential children onto the root, keep
          both nested operations inside generation, and isolate the uncovered right edge.
    beats:
      - say: >-
          Open the trace for the reply with the empty citation. Its clock stops at fourteen hundred twenty
          milliseconds. Retrieval takes a hundred forty-five. Reranking takes another hundred ten.
          Generation then takes eleven hundred thirty milliseconds. Inside it, the model call and the
          citation check have their own spans. A span records when an operation started and ended. Read
          all six against the same clock.
        hold: 0.8
        visual_cues:
          - id: mf-sentence-trace-0-0
            phrase: "Open the trace for the reply with the empty citation. Its clock stops at fourteen hundred twenty milliseconds."
            targets: [trace-construction]
            linger: 0
            caption_boundary: true
