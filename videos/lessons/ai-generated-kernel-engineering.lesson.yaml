            color: cyan
            linger: 0.4
      - say: PyTorch two point fourteen assert-close defaults to rejecting matching NaNs unless equal-nan is enabled.
          Under our declared policy, NaN positions match and infinities must have the same sign. Dtype, device
          and layout are checked by default; exact strides are optional. Report finite errors separately from
          nonfinite mismatches, and define any relative-error denominator near zero.
        hold: 0.7
        visual_cues:
          - id: kg-tolerance-policy-voice-2
            phrase: PyTorch two point fourteen assert-close defaults to rejecting matching NaNs unless equal-nan is
              enabled. Under our declared policy, NaN positions match and infinities must have the same sign.
              Dtype, device and layout are checked by default; exact strides are optional. Report finite
