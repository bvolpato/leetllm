  - id: tail
    title: Reduction padding needs the correct identity
    visual: Five valid values occupy an eight-slot reduction tile. A deliberately wrong padded contribution
      changes the mean square; zero-filled reduction padding repairs it while keeping the logical denominator
      five.
    beats:
      - say: A masked load protects which input positions may be read. The reduction also needs suitable values in its
          padded lanes. Here five real features occupy an eight-slot tile. If the invalid lanes contribute
          ones to the squared sum, the normalization scale changes even though all valid addresses were loaded
          safely.
        hold: 0.65
        visual_cues:
          - id: tail-beat-1-focus-1
            phrase: the normalization scale changes even though all valid addresses were loaded safely
            targets:
              - tail-s-terms
            color: cyan
            linger: 0.65
          - id: kg-tail-wrong
            phrase: If the invalid lanes contribute ones to the squared sum
            targets:
              - tail-s-terms
            color: cyan
            linger: 0.4
          - id: kg-tail-effect
            phrase: the normalization scale changes even though all valid addresses were loaded safely.
            targets:
              - tail-s-terms
            color: cyan
            linger: 0.4
      - say: Replace those contributions with the additive identity and divide by the logical row width. The
          denominator counts real features. Test powers of two, neighboring widths, prime lengths, alignment,
          and multiple scales. Uninitialized values within an allocation and accesses outside an allocation
          require different checks, so preserve both numerical and runtime-safety evidence.
        hold: 0.65
        visual_cues:
          - id: tail-beat-2-focus-1
            phrase: Test powers of two, neighboring widths, prime lengths, alignment, and multiple scales
            targets:
