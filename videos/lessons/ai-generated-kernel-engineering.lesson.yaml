  - id: overflow-oracle
    title: Separate reference parity from stable arithmetic
    visual: Square the same large scalar in FP32 and FP64. Carry infinity through reciprocal square root to zero
      in the FP32 path; keep the wider reference near one. A reference-semantics receipt stays separate from
      real-arithmetic accuracy.
    beats:
      - say: Watch what happens when the CPU reference squares one large number. Ten to the nineteenth
          squared still fits in float thirty-two. Double the input. Its square overflows to positive
          infinity. The reciprocal square root is now zero. Multiplying the input by that zero gives
          zero.
        hold: 0.7
        caption_starts:
