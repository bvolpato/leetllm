scenes:
  - id: intro
    title: What should this kernel return?
    visual: Two rows fill the screen beside their reported H100 speedup. Shorten both rows and the numerical check fails.
      Cut to a two-feature row. The blue point marks the caller’s input [3, 4]. Beside the plot, two bars shrink by the same reciprocal
      RMS scale as the cyan point moves toward the origin. The target coordinates stay labeled during the move.
      The viewer uses weights [1, 2] to predict where the point goes next. Only the second bar grows as the
      green point moves straight up. The blue input stays in place.
    beats:
      - say: On these two rows, the generated kernel runs one point four times as fast as the baseline. Shorten each
          row to one thousand nine features. Now the numerical check fails. Let's calculate a row we can check by hand.
          Three across, four up.
        hold: 0.6
        caption_starts:
          - Shorten each row
          - Now the numerical check fails
          - Let's calculate a row
        visual_cues:
          - id: kg-intro-speed
            phrase: one point four times as fast
            targets:
              - intro-work
            color: yellow
            linger: 0.15
          - id: kg-intro-shorten
            phrase: Shorten each row to one thousand nine features.
            targets:
              - intro-work
            color: cyan
            linger: 0.15
          - id: kg-intro-check
            phrase: Now the numerical check fails.
            targets:
              - intro-work
            color: pink
            linger: 0.15
          - id: kg-intro-row
            phrase: by hand.
            targets:
              - intro-plot
            color: blue
            linger: 0.15
          - id: kg-intro-across
            phrase: Three across
            targets:
              - intro-plot
            color: cyan
            linger: 0.15
          - id: kg-intro-input
            phrase: four up.
            targets:
              - intro-plot
            color: cyan
            linger: 0.15
      - say: Square three and four to get nine and sixteen. Their average is twelve point five. Add a small positive
          epsilon so even a row of zeros has a positive denominator. Take the reciprocal square root. Multiply
          both coordinates by that one scale. See how the point travels back along the same line? That is root
          mean square normalization. Now give the first feature weight one and the second weight two. Which way
          will the point move?
        hold: 2.2
        caption_starts:
          - Now give the first feature
          - Which way will the point move?
        visual_cues:
          - id: kg-intro-square
            phrase: Square three and four to get nine and sixteen.
            targets:
              - intro-work
            color: cyan
            linger: 0.15
          - id: kg-intro-mean
            phrase: Their average is twelve point five.
            targets:
              - intro-work
            color: cyan
            linger: 0.15
          - id: kg-intro-epsilon
            phrase: Add a small positive epsilon
            targets:
              - intro-work
            color: cyan
            linger: 0.15
          - id: kg-intro-scale
            phrase: Take the reciprocal square root.
            targets:
              - intro-work
            color: cyan
            linger: 0.15
          - id: kg-intro-normalize
            phrase: Multiply both coordinates by that one scale.
            targets:
              - intro-plot
              - intro-work
            color: cyan
            linger: 0.15
          - id: kg-intro-predict
            phrase: weight one and the second weight two
            targets:
              - intro-work
            color: cyan
            linger: 0.15
      - say: Straight up. The first coordinate stays put. Doubling the second takes it from about one point one three
          to two point two six. The green point is the weighted result. The caller still owns the blue input. A
          generated kernel must produce this answer in fresh storage, within the agreed tolerance.
        hold: 1
        caption_starts:
          - The green point is the weighted result.
        visual_cues:
          - id: kg-intro-weight
            phrase: Doubling the second takes it from about one point one three to two point two six.
            targets:
              - intro-plot
              - intro-work
            color: green
            linger: 0.15
            caption_boundary: true
  - id: domain-contract
    title: Freeze the accepted operation before specialization
    visual: Carry the same caller-owned row through a public-domain envelope. Valid empty/expanded cases remain
      inside; Boolean epsilon and dtype mismatch stop before dispatch. The fast-path subset moves inside the
      larger reference domain.
    beats:
      - say: Write the accepted domain before asking a model for code. Our input has at least one dimension and a
          positive final width; the feature weight has exactly that width. Empty outer dimensions are valid,
          as are ordinary strided and read-only expanded views. Input and weight share float sixteen, bfloat
          sixteen or float thirty-two, on one supported device. The CPU route uses the reference.
        hold: 0.7
        visual_cues:
          - id: kg-domain-contract-voice-0
            phrase: Write the accepted domain before asking a model for code. Our input has at least one dimension and a
              positive final width; the feature weight has exactly that width. Empty outer dimensions are
              valid, as are ordinary strided and read-only expanded views. Input and weight share float
              sixteen, bfloat sixteen or float thirty-two, on one supported device. The CPU route uses the
              reference.
            targets:
              - domain-contract-construction
            color: cyan
            linger: 0.4
      - say: The reference converts input and weight to float thirty-two, squares and averages there, applies
          reciprocal square root and feature weights in that order, then casts back. Epsilon is an ordinary
          Python integer or float, excluding Boolean, and must remain finite and strictly positive after
          conversion to float thirty-two. A tiny positive Python value that rounds to zero is invalid.
        hold: 0.7
        visual_cues:
          - id: kg-domain-contract-voice-1
            phrase: The reference converts input and weight to float thirty-two, squares and averages there, applies
              reciprocal square root and feature weights in that order, then casts back. Epsilon is an
              ordinary Python integer or float, excluding Boolean, and must remain finite and strictly
              positive after conversion to float thirty-two. A tiny positive Python value that rounds to zero
              is invalid.
            targets:
              - domain-contract-construction
            color: cyan
            linger: 0.4
          - id: kg-domain-contract-epsilon
            phrase: A tiny positive Python value that rounds to zero is invalid.
            targets:
              - domain-contract-construction
            color: cyan
            linger: 0.4
      - say: The public operator and fast subset have different jobs. Valid unsupported calls use the reference;
          invalid public inputs raise the versioned error. The inference fast path requires the tested
          architecture and features, full input and weight contiguity, and width divisible by one hundred
          twenty-eight. Active reverse-mode gradients require the differentiable reference. Forward automatic
          differentiation, vectorized transforms and compilation each need their own declared support.
        hold: 0.7
        visual_cues:
          - id: kg-domain-contract-voice-2
            phrase: The public operator and fast subset have different jobs. Valid unsupported calls use the reference;
              invalid public inputs raise the versioned error. The inference fast path requires the tested
              architecture and features, full input and weight contiguity, and width divisible by one hundred
              twenty-eight. Active reverse-mode gradients require the differentiable reference. Forward
              automatic differentiation, vectorized transforms and compilation each need their own declared
              support.
            targets:
              - domain-contract-construction
            color: cyan
            linger: 0.4
  - id: dispatch
    title: A specialization belongs behind an explicit predicate
    visual: A table computes fast-path eligibility from device,contiguity,width divisibility,and gradient demand.
      Unsupported valid calls follow the reference rather than receiving fabricated outputs.
    beats:
      - say: A fast kernel can support a narrower domain than the public operator when the wrapper routes other valid
          calls to a verified reference. Our supplied specialization requires a tested CUDA target, contiguous
          inputs, a width divisible by its tile size, and inference without an active backward requirement.
          Each condition belongs in dispatch.
        hold: 0.65
        visual_cues:
          - id: dispatch-beat-1-focus-1
            phrase: A fast kernel can support a narrower domain than the public operator when the wrapper routes other
              valid calls to a verified reference
            targets:
              - dispatch-row-fast-fast-path-reference
            color: cyan
            linger: 0.65
          - id: dispatch-beat-1-focus-2
            phrase: Our supplied specialization requires a tested CUDA target
            targets:
              - dispatch-row-name
            color: yellow
            linger: 0.65
      - say: Follow the calls through that predicate. A transposed view, an odd width, and an active gradient
          requirement each take the reference route. Invalid public inputs still raise their declared errors.
          Check the whole tensor layout before flattening rows, because contiguous features can coexist with
          gaps between outer rows.
        hold: 0.65
        visual_cues:
          - id: dispatch-beat-2-focus-1
            phrase: Check the whole tensor layout before flattening rows, because contiguous features can coexist with
              gaps between outer rows
            targets:
              - dispatch-gapped-layout
            color: cyan
            linger: 0.65
  - id: hidden
    title: Where does row zero read?
    visual: A fixed storage strip holds eight numbers. Four comparisons exercise its packed layout. A second 2 × 4
      view uses the same storage with strides [1, 2]. Trace row zero to its third element, compare the reference
      and candidate there, and replay through a layout guard. Return to the frozen candidate for a width-five case.
    beats:
      - say: Here are eight numbers in storage. With four packed features per row, the first row reads the first four
          numbers. Our host test compares every candidate output with a trusted implementation. Try the original
          values. Make them ten times larger, then multiply the originals by one hundredth. Finally, negate the
          originals. All four cases pass. What did those changes leave untouched?
        hold: 2
        caption_starts:
