            color: cyan
            linger: 0.4
  - id: epsilon
    title: Check the evaluator's mathematical assumption
    visual: Input magnitude increases by positive scale100 under fixed epsilon, then under epsilon multiplied
      by10000. Outputs are recomputed from both terms and compared with the original.
    beats:
      - say: Even a correct kernel can fail a faulty test. RMS normalization looks scale-invariant when epsilon is
          negligible, but epsilon has a fixed magnitude. For a small input, enlarging the input while holding
          epsilon fixed changes its relative influence. Watch the correctly computed output move as that
          balance changes.
        hold: 0.65
        motion_check:
          region:
            - 160
            - 555
            - 1590
            - 335
          minimumChangedFraction: 0.002
        visual_cues:
          - id: epsilon-beat-1-focus-1
            phrase: RMS normalization looks scale-invariant when epsilon is negligible, but epsilon has a fixed magnitude
            targets:
              - epsilon-epsilon-s-eps-toexponential-2
            color: cyan
            linger: 0.65
          - id: epsilon-beat-1-focus-2
            phrase: For a small input, enlarging the input while holding epsilon fixed changes its relative influence
            targets:
              - epsilon-input-scale-s-a-tofixed-1
            color: yellow
            linger: 0.65
      - say: For a positive scale, multiply epsilon by the square of that scale as well. Both terms inside the square
          root now change together, restoring the exact-arithmetic relation. Floating-point overflow and
          rounding still need a numerical allowance. Validate the relation expected by the evaluator against
          the trusted reference before using it to reject candidates.
        hold: 0.65
        visual_cues:
          - id: epsilon-beat-2-focus-1
            phrase: For a positive scale, multiply epsilon by the square of that scale as well
            targets:
              - epsilon-epsilon-s-eps-toexponential-2
              - epsilon-output
            color: cyan
            linger: 0.65
          - id: epsilon-restored-relation
            phrase: restoring the exact-arithmetic relation
            targets:
              - epsilon-output
              - epsilon-original-s-reference-tofixed-6
            color: green
            linger: 0.65
          - id: epsilon-beat-2-focus-2
            phrase: Validate the relation expected by the evaluator against the trusted reference before using it to
              reject candidates
            targets:
              - epsilon-math-f-ax-a-2epsilon-f-x-epsilon-quad-a-0
            color: yellow
            linger: 0.65
      - say: Go back to the original row and epsilon. Multiply the input by negative four and epsilon by sixteen. The square root makes the denominator
          four times as large. The numerator also changes sign, so the coupled output reverses sign. At zero,
          the coupled epsilon would become zero and violate this operator’s positive-epsilon contract. Check the
          transformed input against the reference because rounding, underflow or overflow can affect the result.
        hold: 0.7
        visual_cues:
          - id: kg-epsilon-base
            phrase: Go back to the original row and epsilon.
            targets:
              - epsilon-input-scale-s-a-tofixed-1
            color: blue
            linger: 0.15
          - id: kg-epsilon-negative
            phrase: multiply the input by negative four and epsilon by sixteen.
            targets:
              - epsilon-output
            color: cyan
            linger: 0.4
          - id: kg-epsilon-zero
            phrase: At zero, the coupled epsilon would become zero and violate this operator’s positive-epsilon contract.
            targets:
              - epsilon-output
            color: cyan
            linger: 0.4
  - id: tolerance-policy
    title: Construct the numerical acceptance interval
    visual: On one number line place reference, candidate, absolute allowance and reference-scaled allowance.
      Assemble the interval before moving the candidate. Handle NaN/infinity placements in a separate row.
    beats:
      - say: For a finite reference component r and candidate c, accept when the absolute difference is at most
          absolute tolerance plus relative tolerance times the absolute reference. Construct that allowance
          before evaluating the candidate. It is asymmetric because the reference supplies the relative scale.
          Choose policy for the dtype and reduction length rather than silently changing it after a failure.
        hold: 0.7
        visual_cues:
          - id: kg-tolerance-policy-voice-0
            phrase: For a finite reference component r and candidate c, accept when the absolute difference is at most
              absolute tolerance plus relative tolerance times the absolute reference. Construct that
              allowance before evaluating the candidate. It is asymmetric because the reference supplies the
              relative scale. Choose policy for the dtype and reduction length rather than silently changing
              it after a failure.
            targets:
              - tolerance-policy-construction
            color: cyan
            linger: 0.4
          - id: kg-tolerance-policy-allowance
            phrase: absolute tolerance plus relative tolerance times the absolute reference.
            targets:
              - tolerance-policy-construction
            color: cyan
            linger: 0.4
      - say: The reference expects ten to the negative eight. The candidate returns zero. With an absolute
          tolerance of one millionth, zero lies inside the interval. Now compare a policy with an
          absolute tolerance of ten to the negative ten. The interval shrinks and that zero fails. Choose
          the policy your application needs before running the candidate.
        hold: 0.7
        visual_cues:
          - id: kg-tolerance-policy-voice-1
            phrase: The reference expects ten to the negative eight. The candidate returns zero. With an
              absolute tolerance of one millionth, zero lies inside the interval. Now compare a policy
              with an absolute tolerance of ten to the negative ten. The interval shrinks and that zero
              fails. Choose the policy your application needs before running the candidate.
            targets:
              - tolerance-policy-construction
            color: cyan
            linger: 0.4
          - id: kg-tolerance-policy-zoom
            phrase: an absolute tolerance of ten to the negative ten.
            targets: [tolerance-policy-construction]
            color: green
          - id: kg-tolerance-policy-tight
            phrase: that zero fails.
            targets:
