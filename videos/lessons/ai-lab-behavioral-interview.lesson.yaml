  - id: rehearsal-repair
    title: What can stay in this sentence?
    visual: The rehearsal transcript and source notes sit side by side. Each unsupported clause is replaced in
      place. A ruler measures the distance from the observation to the acceptance limit.
    beats:
      - say: Here’s an answer a rehearsal partner might accept. “I fixed our security system and cut latency by
          sixteen percent, so we never had this problem again.” Read it against Nia’s notes. How would you
          rewrite the first line in Nia’s own voice?
        hold: 2.6
        visual_cues:
          - id: draft-metric
            phrase: cut latency by sixteen percent
            targets:
              - edit-row-1
            color: yellow
            linger: 0.35
          - id: edit-question
            phrase: How would you rewrite the first line in Nia’s own voice
            targets:
              - edit-row-0
              - edit-prompt
            color: yellow
            linger: 0.35
      - say: Start with the verb. I wrote the release check. Omar fixed authorization. Now measure the gap on the
          ruler. From four hundred twenty to the five hundred millisecond limit is eighty milliseconds.
          Divide by the limit and you get sixteen percent headroom. To say how much faster the tool got,
          you’d need a latency measurement from before the change.
        hold: 0.75
        caption_starts:
          - I wrote the release check
          - sixteen percent headroom
        visual_cues:
          - id: edit-owner
            phrase: I wrote the release check
            targets:
              - edit-row-0
            linger: 0.35
          - id: measure-gap
            phrase: From four hundred twenty to the five hundred millisecond limit
            targets:
              - headroom
            color: yellow
            linger: 0.35
          - id: headroom-percent
            phrase: sixteen percent headroom
            targets:
              - gap-caption
            color: yellow
            linger: 0.35
      - say: Keep the measured sentence. Our p ninety-five was four hundred twenty milliseconds in that window. As
          for recurrence, the notes have no later incident count. When you rehearse your own story, fill in
          the evidence first. Then trim a two-minute telling until your action arrives early. Try reaching
          it in about forty-five seconds. Finally, let someone interrupt. Can they name your contribution, a
          result and one thing you still don’t know?
        hold: 1.1
        visual_cues:
          - id: edit-metric
            phrase: Our p ninety-five was four hundred twenty milliseconds
            targets:
              - edit-row-1
            linger: 0.35
          - id: edit-recurrence
            phrase: no later incident count
            targets:
              - edit-row-2
            linger: 0.35
  - id: fresh-decision
