scenes:
  - id: opening
    title: Friday’s offline test
    visual: A two-word snippet slides out of a locked returns note into the test reader’s search result.
      Product’s proposed traffic share stays beside Nia’s recommendation.
    beats:
      - say: “Refund pending.” Those two words just landed in a search result. Nia’s test reader can’t open the
          returns note they came from.
        hold: 0.55
        visual_cues:
          - id: snippet-returns
            phrase: landed
            targets:
              - receipt-0
            color: pink
            linger: 0.35
      - say: A second offline test returned private citation text too. Product wants support staff to try the
          new search before returns peak. They propose a canary that sends five percent of requests to
          the new version. Priya owns the release. What share would you recommend?
        hold: 3
        visual_cues:
          - id: citation-returns
            phrase: returned private citation text
            targets:
              - receipt-1
            color: pink
            linger: 0.35
          - id: product-asks
            phrase: five percent of requests
            targets:
              - proposal
            color: yellow
            linger: 0.35
          - id: nia-question
            phrase: What share would you recommend
            targets:
              - question
            color: yellow
            linger: 0.35
      - say: Zero. Here’s how Nia could answer an interviewer. “I asked Priya to hold the rollout. Our test
          reader could see private text. Rolling back later couldn’t take those words back.”
        hold: 1.2
        visual_cues:
          - id: nia-holds
            phrase: Zero
            targets:
              - advice
            linger: 0.35
  - id: evidence
    title: Whose requests reach the canary?
    visual: One of twenty request marks changes lanes. Its tenant sent only that one request. The two
      denominators stay visible together.
    beats:
      - say: Product says, “It’s only two cases.” Those tests were written specifically to exercise the permission
          check. How often that happens in production is still an open question. Consider a separate routing
          example. One request comes from tenant A and nineteen from tenant B.
        hold: 0.5
        visual_cues:
          - id: two-tenants
            phrase: One request comes from tenant A and nineteen from tenant B
            targets:
              - tenant-groups
            linger: 0.35
      - say: Route A’s request to the candidate. That’s one out of twenty overall. What share of tenant A’s requests
          reached the candidate?
        hold: 2.4
        visual_cues:
          - id: route-one
            phrase: Route A’s request to the candidate
            targets:
              - one-request
            color: yellow
            linger: 0.35
          - id: tenant-question
            phrase: What share of tenant A’s requests reached the candidate
            targets:
              - tenant-share
            color: yellow
            linger: 0.35
      - say: All of them. A sent one request, and that’s the one the candidate got. The same routing decision gives
          you five percent overall and a hundred percent for A. To call Friday’s failures rare, Nia would
          need a representative sample of requests, with a count of how many actually returned restricted
          text.
        hold: 1
        visual_cues:
          - id: tenant-answer
            phrase: All of them
            targets:
              - tenant-share
            color: yellow
            linger: 0.35
          - id: frequency-unknown
            phrase: a representative sample of requests
            targets:
              - frequency
            linger: 0.35
  - id: tradeoff
    title: What would change Nia’s recommendation?
    visual: B17 stays on the page as the repaired build fills a second column. The other checks, Nia’s
      recommendation and Priya’s approval have separate places.
    beats:
      - say: Suppose the interviewer asks, “Were you too cautious?” Give Product’s reason first. A small live trial
          could tell the team how the tool performs before returns peak. Waiting leaves them less time to
          act on what they learn. Nia offered a way to settle the access question offline. She reproduced
          both failures and wrote the check for the release.
        hold: 0.65
        visual_cues:
          - id: product-reason
            phrase: small live trial
            targets:
              - proposal
            color: yellow
            linger: 0.35
      - say: Omar repairs authorization. Look at the new build beside the old one. Run the snippet check again. This
          time the snippet is denied. Run the citation check. The citation is denied too. Both cases pass.
          What still stands between this build and users?
        hold: 2.8
        visual_cues:
          - id: omar-build
            phrase: new build beside the old one
            targets:
              - rerun-0
              - rerun-1
            linger: 0.35
          - id: snippet-denied
            phrase: the snippet is denied
            targets:
              - rerun-0
            color: green
            linger: 0.35
          - id: citation-denied
            phrase: The citation is denied too
            targets:
              - rerun-1
            color: green
            linger: 0.35
          - id: reopen-question
            phrase: What still stands between this build and users
            targets:
              - question
            color: yellow
            linger: 0.35
      - say: Priya reviews the other release checks. They pass. Now Nia can recommend a review for five percent.
          Priya approves the canary. Those are three different acts. If they ask what you personally did,
          point to Nia’s check. Omar changed the service. Priya decided who could start sending traffic.
        hold: 1.1
        visual_cues:
          - id: other-gates-clear
            phrase: They pass
            targets:
              - other-checks
            color: green
            linger: 0.35
          - id: nia-reopens
            phrase: recommend a review for five percent
            targets:
              - advice
            linger: 0.35
          - id: priya-signs
            phrase: Priya approves the canary
            targets:
              - signature
            color: green
            linger: 0.35
  - id: canary
    title: What did the canary measure?
    visual: The Friday p95 sits on its original limit ruler. A separate ranked sample shows how one slow request
      can remain above p95.
    beats:
      - say: Both access checks passed before Priya approved five percent. In the agreed window, the canary’s
          ninety-fifth percentile response time was four hundred twenty milliseconds. Read that dot against
          the five hundred millisecond limit.
        hold: 0.7
        visual_cues:
          - id: canary-beat-1-focus-1
            phrase: Both access checks passed
            targets:
              - canary-offline-access-gate-pass-both-cases
            color: green
            linger: 0.35
          - id: canary-latency-comparison
            phrase: four hundred twenty milliseconds
            targets:
              - canary-latency-check
            color: yellow
            linger: 0.35
      - say: The dot clears the latency requirement for that window. The access checks covered the snippet and
          the citation. Priya reviewed the remaining checks and approved the next stage. Could an
          individual request have taken longer than the limit?
        hold: 2.25
        visual_cues:
          - id: canary-beat-2-focus-1
            phrase: the snippet and the citation
            targets:
              - canary-offline-access-gate-pass-both-cases
            linger: 0.35
          - id: canary-beat-2-focus-2
            phrase: reviewed the remaining checks
            targets:
              - canary-other-required-checks-reviewed
            linger: 0.35
          - id: canary-stage-approved
            phrase: approved the next stage
            targets:
              - canary-stage
            color: green
            linger: 0.35
      - say: Here are twenty example requests, sorted from fastest to slowest. Each bar is one request. For a
          nearest-rank percentile, multiply the fraction by the count and round up to a whole rank. Point
          nine five times twenty selects rank nineteen. That bar is four hundred twenty milliseconds.
          Look one bar farther. Nine hundred milliseconds for the last request.
        hold: 1.3
        caption_starts:
          - That bar is four hundred twenty milliseconds
          - Nine hundred milliseconds for the last request
        visual_cues:
          - id: canary-illustrative-sample
            phrase: Here are twenty example requests
            targets:
              - canary-sample
            linger: 0.35
          - id: canary-nearest-rank
            phrase: selects rank nineteen
            targets:
              - canary-sample-rank
            color: green
            linger: 0.35
          - id: canary-sample-tail
            phrase: Nine hundred milliseconds for the last request
            targets:
              - canary-sample-tail
            color: pink
            linger: 0.35
  - id: executable-gate
    title: Try Nia’s release check
    visual: The exact case inventory and Boolean comparisons lead into two Python calls with the same p95. Only
      the snippet result changes on the second call.
    beats:
      - say: What did Nia put in her release check? The Python function expects a dictionary with exactly these two
          case names for this build. Both results must be the Boolean True. Try a missing or extra key, or
          replace True with the number one. Those inputs fail the check. With the original two passes and
          the other gates explicitly True, the build is eligible for an approved five percent canary.
        hold: 0.9
        caption_starts:
          - Those inputs fail the check
        visual_cues:
          - id: executable-gate-keys
            phrase: exactly these two case names
            targets:
              - gate-keys
            linger: 0.35
          - id: executable-gate-true
            phrase: Both results must be the Boolean True
            targets:
              - gate-values
            color: green
            linger: 0.35
          - id: gate-key-failures
            phrase: missing or extra key
            targets:
              - gate-keys
            color: yellow
            linger: 0.35
          - id: gate-numeric-one
            phrase: the number one
            targets:
              - gate-values
            color: yellow
            linger: 0.35
          - id: gate-invalid-result
            phrase: Those inputs fail the check
            targets:
              - gate-keys
              - gate-values
            color: pink
            linger: 0.35
          - id: executable-gate-offline
            phrase: eligible for an approved five percent canary
            targets:
              - gate-result
            linger: 0.35
      - say: Once the canary is running, wait for the complete observation window. The policy needs a finite,
          nonnegative number for that window’s p ninety-five. A Boolean, a missing measurement or an
          unfinished window keeps the review at five percent. At five hundred milliseconds the policy
          recommends zero. Now lower the measurement to four hundred ninety-nine. At that value, with all
          the gates still passing, it recommends review for twenty percent.
        hold: 0.8
        caption_starts:
          - the policy recommends zero
          - it recommends review for twenty percent
        visual_cues:
          - id: executable-gate-window
            phrase: complete observation window
            targets:
              - gate-window
            linger: 0.35
          - id: gate-latency-hold
            phrase: keeps the review at five percent
            targets:
              - gate-window
            color: yellow
            linger: 0.35
          - id: executable-gate-rollback
            phrase: At five hundred milliseconds
            targets:
              - gate-limit
            color: yellow
            linger: 0.35
          - id: gate-zero-result
            phrase: the policy recommends zero
            targets:
              - gate-limit
            color: pink
            linger: 0.35
          - id: gate-lower-input
            phrase: four hundred ninety-nine
            targets:
              - gate-limit
            color: yellow
            linger: 0.35
          - id: executable-gate-advance
            phrase: it recommends review for twenty percent
            targets:
              - gate-next
            color: green
            linger: 0.35
      - say: Run that last check with Friday’s numbers. The canary window is complete. Both access checks pass and
          the other gates pass. The response time reported for this window is four hundred twenty
          milliseconds. The function returns twenty, eligible for the release owner’s review.
        hold: 0.85
        visual_cues:
          - id: gate-pass-return
            phrase: function returns twenty
            targets:
              - gate-pass-output
            linger: 0.35
      - say: Keep that latency. Change only the snippet result to False. The citation still passes. What share does
          the function recommend now?
        hold: 2.8
        visual_cues:
          - id: gate-change-access
            phrase: snippet result to False
            targets:
              - gate-changed-input
            color: pink
            linger: 0.35
          - id: gate-replay-question
            phrase: What share does the function recommend now
            targets:
              - gate-withdraw
              - gate-question
            color: yellow
            linger: 0.35
      - say: Zero. It checks authorization first. A fast response can still contain text the reader has no
          permission to see. This return value goes to Priya. She needs a tested way to withdraw traffic,
          check where requests went, and investigate any earlier disclosure. The service needs its own tests
          for enforcing access on each request.
        hold: 1.05
        visual_cues:
          - id: executable-gate-withdraw
            phrase: Zero
            targets:
              - gate-withdraw
            color: pink
            linger: 0.35
          - id: executable-gate-scope
            phrase: goes to Priya
            targets:
              - gate-scope
            color: yellow
            linger: 0.35
  - id: practice
    title: What did you personally do?
    visual: A spoken first-person answer attaches each action to the person who owned it. The observation and
      change in later practice close the answer.
    beats:
      - say: Listen to Nia answer the interviewer. “I wrote the release check. Product wanted to try our new support
          ranking before the returns rush. I reproduced two cases where a reader got restricted text, and I
          asked Priya to hold traffic at zero.”
        hold: 0.7
        visual_cues:
          - id: nia-wrote
            phrase: I wrote the release check
            targets:
              - owner-0
            linger: 0.35
      - say: “Omar repaired authorization. I ran my checks against his build. This time both responses denied
          access. Priya approved the canary once the other checks passed. Its p ninety-five was four hundred
          twenty milliseconds in our agreed window, below the limit of five hundred. Priya then approved the
          next stage.”
        hold: 0.65
        visual_cues:
          - id: omar-repaired
            phrase: Omar repaired authorization
            targets:
              - owner-1
            color: green
            linger: 0.35
          - id: priya-approved
            phrase: Priya approved the canary
            targets:
              - owner-2
            color: yellow
            linger: 0.35
          - id: practice-window
            phrase: four hundred twenty milliseconds
            targets:
              - practice-result
            linger: 0.35
      - say: “Now I ask us to agree on release and rollback criteria before the review, while the team still has
          time to challenge them.”
        hold: 1
        visual_cues:
          - id: practice-next
            phrase: agree on release and rollback criteria
            targets:
              - practice-reflection
            linger: 0.35
  - id: unresolved-disagreement
    title: Suppose Priya hasn’t decided
    visual: A separate version of the decision note has an owner and two proposals. Its decision field stays
      open through escalation.
    beats:
      - say: Now suppose the meeting ends with the disagreement still open. What could Nia tell an interviewer then?
          “We both wanted the ranker ready before returns peaked. Product wanted a live trial. I asked us to
          test the reader permissions on an approved offline fixture, because once a reader saw restricted
          text, a feature flag couldn’t take it back.”
        hold: 0.65
        visual_cues:
          - id: disagreement-views
            phrase: We both wanted the ranker ready
            targets:
              - disagreement-views
            linger: 0.35
          - id: disagreement-offline
            phrase: approved offline fixture
            targets:
              - disagreement-boundary
            linger: 0.35
      - say: “Priya owned the decision. I documented the failed checks and requested security review.” Leave that
          line open if that’s where your involvement ended. When an authorized owner does decide, record
          their reasons and the work you did to carry out the decision. A trustworthy account can end while
          colleagues still disagree.
        hold: 1.2
        visual_cues:
          - id: disagreement-open
            phrase: requested security review
            targets:
              - disagreement-record
            color: yellow
            linger: 0.35
          - id: disagreement-followup
            phrase: record their reasons
            targets:
              - disagreement-next
            linger: 0.35
  - id: negative-evidence
    title: Which result belongs in the interview?
    visual: The two failed cases stay beside the untouched holdout. A separate incident log compares repeat
      incidents in two four-week windows.
    beats:
      - say: Ninety-eight of a hundred checks pass. The two pink squares are
          required boundary cases. What would you do with that result?
        hold: 2.1
        visual_cues:
          - id: negative-evidence-slice
            phrase: two pink squares
            targets:
              - required-pair
            color: pink
            linger: 0.35
      - say: Hold promotion. Keep the original score and both failures. Use those two cases to guide the
          repair, then run the development suite again. How well does the new build handle fresh cases?
          After tuning, open an untouched holdout and report that score too.
        hold: 0.8
        caption_starts:
          - After tuning
        visual_cues:
          - id: negative-evidence-stop
            phrase: Hold promotion
            targets:
              - promotion
            color: yellow
            linger: 0.35
          - id: negative-evidence-holdout
            phrase: open an untouched holdout
            targets:
              - holdout-ids
            linger: 0.35
      - say: For an incident question, try a different example. “Support agents got blank search results. I
          suspected the new index. Jo rolled back the release while I compared the two indexes. I restored
          the missing entries. Then I counted repeat incidents using the same alert. Four in the four
          weeks before the fix. One in the four weeks after.”
        hold: 0.9
        caption_starts:
          - Four in the four weeks
          - One in the four weeks
        visual_cues:
          - id: negative-evidence-incident
            phrase: Support agents got blank search results
            targets:
              - incident
            linger: 0.35
          - id: index-rollback
            phrase: Jo rolled back the release
            targets:
              - rollback
          - id: index-repair
            phrase: I restored the missing entries
            targets:
              - repair
          - id: count-before
            phrase: Four in the four weeks before
            targets:
              - before
          - id: count-after
            phrase: One in the four weeks after
            targets:
              - after
  - id: story-bank
    title: Which question fits this story?
    visual: Practice packets are matched to prompts. The Friday packet fits a launch disagreement and leaves a
      change-of-mind prompt without supporting evidence.
    beats:
      - say: Try collecting three to five real stories as a rehearsal exercise. Pick different decisions. An
          interface change can show who adopted it. A migration can show how you checked compatibility.
          School projects, open source, research replications and work outside machine learning all count if
          you can explain what you did.
        hold: 0.5
        visual_cues:
          - id: story-bank-heuristic
            phrase: three to five real stories
            targets:
              - bank-count
            linger: 0.35
          - id: story-bank-variety
            phrase: different decisions
            targets:
              - bank-packets
            linger: 0.35
      - say: Friday works for a question about launch judgment, disagreement or safety. It has the release check,
          Product’s reason and the access boundary. If the interviewer asks when you changed your mind, you
          need a belief you revised. If you want to claim improvement, bring the comparison and the
          population and time it covers. A concrete observation can carry the story on its own.
        hold: 0.8
        visual_cues:
          - id: story-bank-match
            phrase: launch judgment, disagreement or safety
            targets:
              - bank-match
            linger: 0.35
          - id: bank-new-story
            phrase: when you changed your mind
            targets:
              - bank-match
            color: yellow
            linger: 0.35
          - id: story-bank-limits
            phrase: the population and time it covers
            targets:
              - bank-evidence
            linger: 0.35
  - id: weakness-evidence
    title: When did the review happen?
    visual: A late migration draft costs a teammate rework. In a separate three-project drill each review sits
      before or after the start of coding.
    beats:
      - say: For a weakness question, choose a different story. An engineer kept adding detail to a migration plan
          before showing anyone. The draft came three days late. A teammate had to redo the integration. Now
          we know who paid for the delay.
        hold: 0.7
        visual_cues:
          - id: weakness-cost
            phrase: three days late
            targets:
              - late-draft
            color: pink
            linger: 0.35
          - id: weakness-rework
            phrase: teammate had to redo the integration
            targets:
              - rework
            color: pink
            linger: 0.35
      - say: On the next migration, the engineer shared a one-page proposal and a compatibility checklist. The
          teammate reviewed them before coding began. That one review is evidence of a changed habit.
          Whether it holds under pressure is still worth watching.
        hold: 0.7
        visual_cues:
          - id: weakness-later
            phrase: reviewed them before coding began
            targets:
              - next-migration
            linger: 0.35
      - say: Try a separate rehearsal with three projects. Each dot marks a design review. Delivery dates are
          missing. How many reviews took place before coding began?
        hold: 2.4
        visual_cues:
          - id: weakness-dates
            phrase: Each dot marks a design review
            targets:
              - review-dates
            linger: 0.35
      - say: Two out of three. In the third project the old habit returned. That’s a more candid answer, and you can
          point to the reviews that support it. You’d need delivery dates to say the projects finished
          earlier.
        hold: 1
        visual_cues:
          - id: weakness-count
            phrase: Two out of three
            targets:
              - early-count
            color: yellow
            linger: 0.35
  - id: dual-use
    title: What could the tool do with a support case?
    visual: The read grant allows triage. The bulk-export check stops a different action before it moves any
      records.
    beats:
      - say: For a question about AI risk, follow one action. A support tool can read a case to help with triage.
          The same tool asks to export private records in bulk. Customers whose cases are in that export
          would be exposed. The export permission is off. The policy check denies the request before any
          records leave. An audit log lets a reviewer see the decision afterward.
        hold: 0.75
        visual_cues:
          - id: dual-use-benefit
            phrase: read a case to help with triage
            targets:
              - dual-benefit
            color: green
            linger: 0.35
          - id: dual-use-export
            phrase: export private records in bulk
            targets:
              - dual-export
            color: pink
            linger: 0.35
          - id: dual-use-control
            phrase: denies the request before any records leave
            targets:
              - dual-control
            linger: 0.35
          - id: export-log
            phrase: audit log lets a reviewer
            targets:
              - audit-record
            linger: 0.35
      - say: What would justify broader access? I’d want scoped permissions, controlled tests of the blocked action,
          and a named reviewer for high-risk actions. A passing test gives me evidence about that path. I’d
          still want to know which other actions the tool can take. Say which control you tested and which
          you would propose.
        hold: 0.8
        visual_cues:
          - id: dual-use-residual
            phrase: which other actions the tool can take
            targets:
              - dual-risk
            linger: 0.35
          - id: dual-use-change
            phrase: justify broader access
            targets:
              - dual-reversal
            linger: 0.35
  - id: mission-evidence
    title: Why this work?
    visual: The release check connects Nia’s experience to an open team question about evaluating tool permissions.
    beats:
      - say: Suppose Nia is asked why she wants to work on tool safety. “I like building systems where we can test
          who gets access. I wrote the release check that kept a failing build away from support users.”
        hold: 0.65
        visual_cues:
          - id: mission-evidence-problem
            phrase: who gets access
            targets:
              - mission-problem
            linger: 0.35
          - id: mission-owned
            phrase: I wrote the release check
            targets:
              - mission-evidence
            linger: 0.35
      - say: She can turn that experience into a real question. “I’d like to learn how your team tests whether an
          agent can take an action outside a user’s permissions. Which actions are hardest for you to
          evaluate?”
        hold: 0.85
        visual_cues:
          - id: mission-evidence-artifact
            phrase: turn that experience into a real question
            targets:
              - mission-evidence
            linger: 0.35
          - id: mission-evidence-question
            phrase: Which actions are hardest for you to evaluate
            targets:
              - mission-question
            color: yellow
            linger: 0.35
  - id: published-guidance
    title: Which story would you rehearse for this role?
    visual: Dated public guidance suggests practice prompts. Role-specific instructions stay attached to the
      team that issues them.
    beats:
      - say: The article checked these public guides in October twenty twenty-six. Anthropic described weighing
          benefits and risks, trying a simple solution and communicating directly. Nia could rehearse
          Product’s strongest argument. OpenAI emphasized collaboration and openness to feedback. For that
          prompt, she could choose a project where feedback actually changed her decision. Check the role’s
          instructions with the recruiter.
        hold: 0.65
        visual_cues:
          - id: published-guidance-sources
            phrase: public guides in October
            targets:
              - guidance-sources
            linger: 0.35
          - id: published-guidance-hypothesis
            phrase: role’s instructions
            targets:
              - guidance-team
            linger: 0.35
      - say: Google DeepMind’s candidate guide recommended the STAR structure. Give the situation, your task, your
          action and the result, with data where you have it. Its responsibility essay from twenty
          twenty-two describes how people discussed safeguards. Use that essay for context. The team can
          tell you which skills this interview will assess.
        hold: 0.8
        visual_cues:
          - id: published-guidance-dated
            phrase: essay from twenty twenty-two
            targets:
              - guidance-date
            linger: 0.35
          - id: published-guidance-limits
            phrase: which skills this interview will assess
            targets:
              - guidance-limit
            linger: 0.35
  - id: ai-use-policy
    title: Can you use an AI assistant here?
    visual: Only discussable facts move from notes into the preparation prompt. The assessment has a separate
      set of tool instructions.
    beats:
      - say: If preparation tools are allowed, give your rehearsal partner a sanitized story. For this fictional
          rehearsal, Nia can share two facts. She wrote the check, and the canary measured four hundred
