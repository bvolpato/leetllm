title: Tell the Decision You Can Defend
source: interviewing/ai-lab-behavioral-interview/content.md
sources:
  - title: OpenAI Interview Guide
    url: https://openai.com/interview-guide/
  - title: OpenAI Careers
    url: https://openai.com/careers/
  - title: Anthropic Careers
    url: https://www.anthropic.com/careers
  - title: Anthropic candidate AI-use guidance
    url: https://www.anthropic.com/candidate-ai-guidance
