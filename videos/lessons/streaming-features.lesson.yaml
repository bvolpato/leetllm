scenes:
  - id: intro
    title: "At 09:00, which heartbeat can the scheduler read?"
    visual: "A heartbeat stamped 08:30 travels from the worker toward the feature store. The clock stops at 09:00 with the earlier heartbeat still in the store. When the clock resumes, the packet arrives and the captured row stays in view."
    beats:
      - say: "The worker sent this heartbeat at eight thirty. At nine, the scheduler reads the store to predict whether the report will finish on time."
        hold: 0.35
        caption_starts: ["At nine, the scheduler reads the store"]
        visual_cues:
          - id: sf-intro-second
            phrase: "The worker sent this heartbeat at eight thirty"
            targets: [second-heartbeat]
            color: cyan
            linger: 0.25
      - say: "H one left at one o’clock and reached the store two minutes later. Which heartbeat goes in the nine o’clock training row? How old is it?"
        hold: 2.6
        caption_starts: ["Which heartbeat goes in the nine o’clock training row", "How old is it"]
        visual_cues:
          - id: sf-intro-first
            phrase: "H one left at one o’clock"
            targets: [first-heartbeat]
            color: cyan
            linger: 0.25
          - id: sf-intro-question
            phrase: "Which heartbeat goes in the nine o’clock training row"
            targets: [first-heartbeat, second-heartbeat, morning-row]
            color: cyan
            linger: 0.25
      - say: "H one, eight hours. Subtract the time the worker sent it from the time the scheduler asked. Save that age with the prediction."
        hold: 0.45
        visual_cues:
          - id: sf-intro-age
            phrase: "H one, eight hours"
            targets: [morning-row]
            color: green
            linger: 0.25
            caption_boundary: true
      - say: "At eleven the second heartbeat finally reaches the store. Tomorrow’s archive puts its send time half an hour before the request. Training on that half hour would give the model a heartbeat the scheduler was still waiting for."
        hold: 0.75
        caption_starts: ["Tomorrow’s archive puts its send time", "Training on that half hour"]
        visual_cues:
          - id: sf-intro-second-read
            phrase: "At eleven the second heartbeat finally reaches the store"
            targets: [second-heartbeat]
            color: cyan
            linger: 0.25
          - id: sf-intro-hindsight
            phrase: "Tomorrow’s archive puts its send time half an hour before the request"
            targets: [second-heartbeat, morning-row, replay-row]
            color: cyan
            linger: 0.25
  - id: availability-clock
    title: "When could the service read H2?"
    visual: "The H2 path gains a broker stop. Hold its worker and broker times fixed while moving only publication across the same request cutoff."
    beats:
      - say: "Give that second heartbeat a faster trip to the broker. It still leaves at eight thirty. This time the broker receives it at eight fifty-eight and the store publishes it at nine oh two. Can the nine o’clock request use it now?"
        hold: 2.1
        visual_cues:
          - id: sf-availability-clock-ingest
            phrase: "the broker receives it at eight fifty-eight"
            targets: [publication-path]
            color: cyan
            linger: 0.25
          - id: sf-availability-clock-publish
            phrase: "the store publishes it at nine oh two"
            targets: [publication-path]
            color: cyan
            linger: 0.25
      - say: "It still reads H one. At nine, H two had reached the broker, but the store had nothing new to return. For a historical replay, use the time the feature became readable."
        hold: 0.5
        visual_cues:
          - id: sf-availability-clock-exclude
            phrase: "It still reads H one"
            targets: [publication-row]
            color: green
            linger: 0.25
            caption_boundary: true
      - say: "Change just the publication time to eight fifty-nine. Now the request reads H two, thirty minutes old. Publication decides whether the heartbeat qualifies. Its worker timestamp tells you how old it is."
        hold: 0.6
        visual_cues:
          - id: sf-availability-clock-earlier
            phrase: "Change just the publication time to eight fifty-nine"
            targets: [publication-path]
            color: cyan
            linger: 0.25
          - id: sf-availability-clock-admit
            phrase: "Now the request reads H two, thirty minutes old"
            targets: [publication-row]
            color: green
            linger: 0.25
            caption_boundary: true
      - say: "Put those clocks in the same time zone before comparing them. The lab treats a timestamp with no offset as UTC and converts explicit offsets to UTC. It includes publication exactly at the cutoff. If two operations share one clock tick, a sequence number or a snapshot version can tell you which came first."
        hold: 0.45
        visual_cues:
          - id: sf-availability-clock-utc
            phrase: "in the same time zone"
            targets: [publication-path]
            color: cyan
            linger: 0.25
  - id: event-arrival-clocks
    title: "Read the same job again"
    visual: "Restore immediate publication for accepted heartbeats. A request cursor crosses the original H2 and H3 paths. Each receipt subtracts the chosen worker timestamp from the new cutoff."
    beats:
      - say: "Back on the original feed, an accepted heartbeat becomes readable as soon as it arrives. H two still arrives at eleven. The next heartbeat is sent at noon and arrives one minute later."
        hold: 0.45
        visual_cues:
          - id: sf-event-arrival-clocks-third
            phrase: "sent at noon and arrives one minute later"
            targets: [clock-history]
            color: cyan
            linger: 0.25
      - say: "Move the request to noon. H three sits right on the worker-time boundary. Can the scheduler use it yet? Which age will it read?"
        hold: 2
        visual_cues:
          - id: sf-event-arrival-clocks-noon
            phrase: "Move the request to noon"
            targets: [clock-history]
            color: cyan
            linger: 0.25
      - say: "H two, three and a half hours old. At noon the store is still one minute away from receiving H three. The latest readable worker timestamp is eight thirty."
        hold: 0.6
        visual_cues:
          - id: sf-event-arrival-clocks-noon-age
            phrase: "H two, three and a half hours old"
            targets: [clock-row]
            color: green
            linger: 0.25
            caption_boundary: true
      - say: "Move the request to four in the afternoon. H three is now readable. Subtract noon from four and the age is four hours. Storing the worker timestamp lets the age keep changing between writes."
        hold: 0.55
        visual_cues:
          - id: sf-event-arrival-clocks-four
            phrase: "Move the request to four in the afternoon"
            targets: [clock-history]
            color: cyan
            linger: 0.25
          - id: sf-event-arrival-clocks-four-age
            phrase: "the age is four hours"
            targets: [clock-row]
            color: green
            linger: 0.25
            caption_boundary: true
  - id: per-row-joins
    title: "Which backlog did each job see?"
    visual: "Each job has its own line of published updates and a request marker. A backward search stops at the matching value. A single 09:30 snapshot moves the first marker past J-201’s decision."
    beats:
      - say: "Now build training rows for two jobs. The numbers on each line are queue depths. These updates became readable as soon as they happened. J two oh one was scored at nine. J two oh two was scored half an hour later."
        hold: 0.4
      - say: "Start at the first job’s request and search backward. At eight fifty its backlog was five. Do the same for the second job. At nine twenty its backlog was eight. Each row has its own starting point. That’s a point-in-time join."
        hold: 0.6
        visual_cues:
          - id: sf-per-row-joins-first
            phrase: "At eight fifty its backlog was five"
            targets: [first-job]
            color: green
            linger: 0.25
            caption_boundary: true
          - id: sf-per-row-joins-second
            phrase: "At nine twenty its backlog was eight"
            targets: [second-job]
            color: green
            linger: 0.25
            caption_boundary: true
      - say: "Try reading both jobs from the latest state at nine thirty. Which job picks up information from after its request?"
        hold: 2.15
        visual_cues:
          - id: sf-per-row-joins-snapshot
            phrase: "Try reading both jobs from the latest state at nine thirty"
            targets: [first-job]
            color: cyan
            linger: 0.25
      - say: "The first job gets twelve. Look at its nine-fifteen update. That change came fifteen minutes after the job was scored. A retained table snapshot can supply the history for a join. You still have to apply each row’s cutoff."
        hold: 0.6
        visual_cues:
          - id: sf-per-row-joins-snapshot-value
            phrase: "The first job gets twelve"
            targets: [first-job]
            color: green
            linger: 0.25
            caption_boundary: true
  - id: join-contract
    title: "What did the backward join match?"
    visual: "Globally sort backlog updates by time, then match within a job. Compare a permitted join-key age with a publication that falls after the request. Check how the store records creation and availability."
    beats:
      - say: "These rows are grouped by job. Read down the time column. Nine fifteen comes before eight fifty. In pandas, sort both tables by the join clock across all jobs. Then use a backward as-of join, grouped by job. Exact matches count by default. Here each update is readable immediately, and each job has one update per timestamp."
        hold: 0.6
        visual_cues:
          - id: sf-join-contract-sort
            phrase: "sort both tables by the join clock across all jobs"
            targets: [join-contract-mechanism]
            color: cyan
            linger: 0.25
          - id: sf-join-contract-wrongsort
            phrase: "Nine fifteen comes before eight fifty"
            targets: [join-contract-mechanism]
            color: cyan
            linger: 0.25
          - id: sf-join-contract-backward
            phrase: "a backward as-of join, grouped by job"
            targets: [join-contract-mechanism]
            color: cyan
            linger: 0.25
      - say: "At nine, the join can search back one day. A heartbeat stamped eight thirty is well inside that range. Follow it to publication at nine fifteen. The scheduler had already made its prediction. To replay that request, keep the publication history and select the last heartbeat that was readable by nine. Choose the lookback to suit the feature. A long silence can be the signal you need."
        hold: 0.55
        caption_starts: ["Follow it to publication at nine fifteen", "To replay that request", "Choose the lookback"]
        visual_cues:
          - id: sf-join-contract-tolerance
            phrase: "Follow it to publication at nine fifteen"
            targets: [join-contract-mechanism]
            color: cyan
            linger: 0.25
          - id: sf-join-contract-retention
            phrase: "keep the publication history"
            targets: [join-contract-mechanism]
            color: cyan
            linger: 0.25
      - say: "In Feast, the default historical join filters by event time. At a shared event time it may select a later-created correction. On supported offline stores, filtering by creation time adds another cutoff and excludes missing creation times. For serving replay, first establish that creation actually records when a value was readable. A warehouse insert may precede publication. Feast’s online store keeps the latest value per entity."
        hold: 0.5
        visual_cues:
          - id: sf-join-contract-default
            phrase: "the default historical join filters by event time"
            targets: [join-contract-mechanism]
            color: cyan
            linger: 0.25
          - id: sf-join-contract-created
            phrase: "filtering by creation time adds another cutoff"
            targets: [join-contract-mechanism]
            color: cyan
            linger: 0.25
          - id: sf-join-contract-latest
            phrase: "the latest value per entity"
            targets: [join-contract-mechanism]
            color: cyan
            linger: 0.25
  - id: batch-online
    title: "Two ways to read J-204"
    visual: "Three archived records sit above one online key at 09:00. The same H1 timestamp gives two minutes of age at the write and eight hours at the request."
    beats:
      - say: "Here’s a day of archived heartbeats for J two oh four. Batch processing reads a bounded input like this to build many training rows. A streaming updater handles records as they arrive and keeps a value ready for a single job lookup. Input size, arrival rate, batching and capacity determine how quickly either path can deliver."
        hold: 0.45
        visual_cues:
          - id: sf-batch-online-batch
            phrase: "a day of archived heartbeats"
            targets: [batch-history]
            color: cyan
            linger: 0.25
          - id: sf-batch-online-stream
            phrase: "A streaming updater handles records as they arrive"
            targets: [online-key]
            color: cyan
            linger: 0.25
      - say: "At nine, the online key holds H one. If the writer had saved the age at one oh two, it would have saved about point oh three hours. By nine the heartbeat is eight hours old. Save the worker timestamp and subtract it from the request time on both paths."
        hold: 0.6
        visual_cues:
          - id: sf-batch-online-cached
            phrase: "the writer had saved the age at one oh two"
            targets: [online-key]
            color: cyan
            linger: 0.25
          - id: sf-batch-online-age
            phrase: "By nine the heartbeat is eight hours old"
            targets: [paired-request]
            color: green
            linger: 0.25
            caption_boundary: true
      - say: "Capture the actual row with the request ID, cutoff, definition version and source progress. To reconstruct it later, keep the arrivals, routing decisions, published states and transformations. A shared event feed can supply both stores even when the stores publish at different times."
        hold: 0.6
        visual_cues:
          - id: sf-batch-online-capture
            phrase: "Capture the actual row"
            targets: [paired-request]
            color: cyan
            linger: 0.25
  - id: revision-ordering
    title: "A correction and a retry"
    visual: "Follow H4 for J-204. Three deliveries share the same worker timestamp. Their source versions determine which phase the one online row retains."
    beats:
      - say: "The worker reports that it scaled up at ten thirty. Version one arrives a minute later. At ten thirty-four the producer sends version two with a corrected phase. Both messages refer to the same worker time."
        hold: 0.55
        visual_cues:
          - id: sf-revision-ordering-v2
            phrase: "the producer sends version two with a corrected phase"
            targets: [revision-messages]
            color: cyan
            linger: 0.25
      - say: "At ten thirty-six, version one arrives again. The service has to choose a phase for the next request. Which version stays online?"
        hold: 2.2
        visual_cues:
          - id: sf-revision-ordering-retry
            phrase: "version one arrives again"
            targets: [revision-messages]
            color: cyan
            linger: 0.25
      - say: "Keep version two. Compare worker time first. When the times match, compare the versions assigned by the source. Arrival order would undo the correction. At ten forty, the heartbeat is ten minutes old. Only its phase changed. Even when the one o’clock heartbeat arrives again later, its older worker time leaves this row alone."
        hold: 0.6
        visual_cues:
          - id: sf-revision-ordering-keep
            phrase: "Keep version two"
            targets: [revision-current]
            color: green
            linger: 0.25
            caption_boundary: true
          - id: sf-revision-ordering-age
            phrase: "the heartbeat is ten minutes old"
            targets: [revision-current]
            color: green
            linger: 0.25
            caption_boundary: true
      - say: "Batch replay needs the same ordering. A random event ID can identify a delivery but cannot tell you which revision came later. In this example the source keeps the worker timestamp fixed. Deleting an event or correcting that timestamp needs a rule for retiring the old event. Validate clocks and payloads, then compare and update atomically and record when the winner was published."
        hold: 0.5
  - id: quarantine-state
    title: "Two phases claim the same version"
    visual: "Feed the two H5 payloads to J-205 in opposite orders. Each column shows the actual order of its phases, the state after a repeated message, and recovery on a higher validated revision."
    beats:
      - say: "Try a different job, J two oh five. Both messages describe an event at ten thirty, and both claim version seven. A says the worker scaled up. B says that action failed. Read them in opposite orders in the two columns. Which phase can the store safely serve?"
        hold: 2.1
        visual_cues:
          - id: sf-quarantine-state-payloads
            phrase: "B says that action failed"
            targets: [quarantine-state-mechanism]
            color: cyan
            linger: 0.25
      - say: "Quarantine the state in both orders. The source gave you no way to choose between these payloads. Repeat either message and the same conflict remains. A higher validated revision can supply a replacement. The batch replay checks for these conflicting phases at the latest eligible time and version too."
        hold: 0.6
        visual_cues:
          - id: sf-quarantine-state-quarantine
            phrase: "Quarantine the state in both orders"
            targets: [quarantine-state-mechanism]
            color: green
            linger: 0.25
            caption_boundary: true
          - id: sf-quarantine-state-retry
            phrase: "Repeat either message"
            targets: [quarantine-state-mechanism]
            color: cyan
            linger: 0.25
          - id: sf-quarantine-state-higher
            phrase: "A higher validated revision can supply a replacement"
            targets: [quarantine-state-mechanism]
            color: cyan
            linger: 0.25
      - say: "This example compares the phase field. In production, compare every relevant field or its canonical fingerprint. For a request older than the current event or its arrival, the online lookup raises a historical-read error. Retrieve the capture or replay the published history. Think back to J two oh four. Its nine o’clock receipt still says eight hours."
        hold: 0.55
  - id: watermarks
    title: A watermark estimates event-time progress
    visual: The maximum event timestamp and a configured delay advance a watermark; an 11:05 record is
      tested against its window end plus allowed lateness and separately against an application
      replay threshold.
    beats:
      - say: Stream windows group records by time. Tumbling windows make fixed non-overlapping buckets.
          Sliding windows overlap, and session windows grow until activity pauses. Pick event time
          or processing time before deciding when a result is complete.
        hold: 0.55
        visual_cues:
          - id: watermarks-beat-1-focus-1
            phrase: Stream windows group records by time
            targets:
              - watermarks-object-recordx-520-13-c-pink-28
            color: blue
            linger: 0.6
      - say: A watermark estimates how far event time has progressed. In a simplified rule, take the
          greatest event timestamp seen and subtract a configured delay. With a 12:20 maximum and a
          fifteen-minute delay, the estimate is 12:05.
        hold: 0.6
        motion_check:
          region:
            - 220
            - 340
            - 1380
            - 490
          minimumChangedFraction: 0.002
        visual_cues:
          - id: watermarks-beat-2-focus-1
            phrase: A watermark estimates how far event time has progressed
            targets:
              - watermarks-object-recordx-520-13-c-pink-28
            color: blue
            linger: 0.6
          - id: sf-watermarks-maximum
            phrase: With a 12:20 maximum and a fifteen-minute delay
            targets:
              - watermarks-mechanism
            color: cyan
            linger: 0.5
          - id: sf-watermarks-value
            phrase: the estimate is 12:05
            targets:
              - watermarks-mechanism
            color: cyan
            linger: 0.5
      - say: Now place an 11:05 record in the 11-to-12 window. The 12:05 watermark leaves it sixty minutes
          behind. The window keeps its state until 12:30 with a thirty-minute allowed-lateness setting,
          while this application routes records more than 45 minutes behind the watermark to replay.
          The window can still take updates. The router sets this particular record aside.
        hold: 0.7
        visual_cues:
          - id: watermarks-beat-3-focus-1
            phrase: than 45 minutes behind the watermark to replay
            targets:
              - watermark-current
              - watermarks-object-min-behind-watermark-replay-rule-35
            color: blue
            linger: 0.6
          - id: watermarks-beat-3-focus-2
            phrase: The window keeps its state until 12:30 with a thirty-minute allowed-lateness setting
            targets:
              - watermark-window-limit
            color: blue
            linger: 0.6
          - id: sf-watermarks-lag
            phrase: leaves it sixty minutes behind
            targets:
              - watermarks-mechanism
            color: cyan
            linger: 0.5
  - id: window-geometry
    title: "Which heartbeats belong together?"
    visual: "Put 11:20 inside one hourly bucket and four overlapping examples. Then insert it between two pairs of session events and compare their gaps with fifteen minutes. Finally separate firing a result from retaining its state."
    beats:
      - say: "Count heartbeats by worker time. Eleven o’clock starts a new hourly bucket, and noon starts the next one. Those buckets are called tumbling windows. Now start an hour-long window every five minutes. The line at eleven twenty crosses every sliding window shown. Counting the same heartbeat once in each of those windows is intentional. Using processing time would place it by the engine’s clock instead."
        hold: 0.5
        visual_cues:
          - id: sf-window-geometry-sliding
            phrase: "start an hour-long window every five minutes"
            targets: [window-geometry-mechanism]
            color: cyan
            linger: 0.25
      - say: "For a session, measure the quiet gaps between the dots. Use a fifteen-minute inactivity gap. Eleven ten to eleven thirty leaves two sessions with two heartbeats each. Now an eleven-twenty heartbeat arrives late. How many sessions are there?"
        hold: 2.2
        visual_cues:
          - id: sf-window-geometry-bridge
            phrase: "an eleven-twenty heartbeat arrives late"
            targets: [window-geometry-mechanism]
            color: cyan
            linger: 0.25
      - say: "One session, five heartbeats. The gap on each side of the new dot is only ten minutes. A sink that already published both pairs must retract or replace their old counts when it publishes the merged session. Adding all three counts would count the first four heartbeats twice."
        hold: 0.65
        visual_cues:
          - id: sf-window-geometry-merge
            phrase: "One session, five heartbeats"
            targets: [window-geometry-mechanism]
            color: green
            linger: 0.25
            caption_boundary: true
      - say: "Go back to the fixed hour. With Flink’s default event-time trigger, crossing the window end fires the main result. If we allow thirty minutes of lateness, the state stays available for a later update. Flink defaults to zero allowed lateness. To collect records that are too late in a side output, configure that output."
        hold: 0.55
        visual_cues:
          - id: sf-window-geometry-fire
            phrase: "crossing the window end fires the main result"
            targets: [window-geometry-mechanism]
            color: cyan
            linger: 0.25
          - id: sf-window-geometry-retained
            phrase: "the state stays available for a later update"
            targets: [window-geometry-mechanism]
            color: cyan
            linger: 0.25
          - id: sf-window-geometry-default
            phrase: "Flink defaults to zero allowed lateness"
            targets: [window-geometry-mechanism]
            color: cyan
            linger: 0.25
  - id: watermark-inputs
    title: "Follow the watermark"
    visual: "Two input cursors show the minimum active watermark. On one event-time scale, compare the window end and two different record times with 12:20. The 11:50 record feeds the next scene."
    beats:
      - say: "Start at twelve twenty and subtract fifteen minutes. That takes us to twelve oh five. When Flink’s bounded out-of-orderness generator emits its periodic watermark, it subtracts one more millisecond. Watch the seconds roll back to fifty-nine."
        hold: 0.5
        caption_starts: ["That takes us to twelve oh five", "it subtracts one more millisecond", "Watch the seconds roll back to fifty-nine"]
        visual_cues:
          - id: sf-watermark-inputs-minutes
            phrase: "That takes us to twelve oh five"
            targets: [watermark-rule]
            color: cyan
            linger: 0.25
          - id: sf-watermark-inputs-engine
            phrase: "it subtracts one more millisecond"
            targets: [watermark-rule]
            color: cyan
            linger: 0.25
      - say: "Suppose two active inputs now report these watermarks. A has reached twelve twenty. B has reached eleven fifty. The downstream clock waits at eleven fifty, the smaller of the two. If the configured timeout marks B idle, A can advance the clock. Older records from B may be late when it resumes."
        hold: 0.55
        visual_cues:
          - id: sf-watermark-inputs-minimum
            phrase: "The downstream clock waits at eleven fifty"
            targets: [input-progress]
            color: green
            linger: 0.25
            caption_boundary: true
          - id: sf-watermark-inputs-idle
            phrase: "the configured timeout marks B idle"
            targets: [input-progress]
            color: cyan
            linger: 0.25
      - say: "Freeze the watermark at twelve twenty. This window ended at noon and keeps its state for thirty more minutes. The router accepts heartbeats up to forty-five minutes behind the watermark. Here comes one stamped eleven oh five. Can the window still update? Where does this heartbeat go?"
        hold: 2.4
        caption_starts: ["Here comes one stamped eleven oh five", "Can the window still update", "Where does this heartbeat go"]
      - say: "Measure from noon to the watermark. Twenty minutes have passed, so the window still has its state. Now measure from the heartbeat to the same watermark. That gap is seventy-five minutes. Send the heartbeat to replay."
        hold: 0.65
        caption_starts: ["Twenty minutes have passed", "That gap is seventy-five minutes", "Send the heartbeat to replay"]
        visual_cues:
          - id: sf-watermark-inputs-window-span
            phrase: "Measure from noon to the watermark"
            targets: [window-budgets]
            color: cyan
            linger: 0.25
          - id: sf-watermark-inputs-retained
            phrase: "Twenty minutes have passed, so the window still has its state"
            targets: [window-budgets]
            color: green
            linger: 0.25
            caption_boundary: true
          - id: sf-watermark-inputs-record-span
            phrase: "Now measure from the heartbeat to the same watermark"
            targets: [window-budgets]
            color: cyan
            linger: 0.25
          - id: sf-watermark-inputs-replay
            phrase: "Send the heartbeat to replay"
            targets: [window-budgets]
            color: green
            linger: 0.25
            caption_boundary: true
      - say: "Keep the watermark and window fixed. A different heartbeat was sent at eleven fifty. Where does this one go?"
