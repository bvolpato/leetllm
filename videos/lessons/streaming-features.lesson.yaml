            targets: [atomic-crash-mechanism]
            color: cyan
            linger: 0.25
          - id: sf-atomic-crash-persist
            phrase: "its rejection still stands"
            targets: [atomic-crash-mechanism]
            color: cyan
            linger: 0.25
