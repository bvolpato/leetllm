  - id: atomic-crash
    title: "Which writes survive a restart?"
    visual: "Interrupt a local SQLite transaction after the ID insert, after both writes and after commit but before acknowledgment. Reopen the file and inspect the ledger and backlog before retrying."
    beats:
      - say: "What if the worker stops halfway through writing Q one? Start the SQLite file with backlog zero. Inside one transaction, write the ID and its applied outcome. Stop the process before it updates the backlog. When we reopen the file, the ledger is empty and the backlog is zero."
        hold: 0.65
        visual_cues:
          - id: sf-atomic-crash-ledger
            phrase: "write the ID and its applied outcome"
            targets: [atomic-crash-mechanism]
            color: cyan
            linger: 0.25
          - id: sf-atomic-crash-crash
            phrase: "Stop the process before it updates the backlog"
            targets: [atomic-crash-mechanism]
            color: cyan
            linger: 0.25
          - id: sf-atomic-crash-reopen
            phrase: "the ledger is empty and the backlog is zero"
            targets: [atomic-crash-mechanism]
            color: green
            linger: 0.25
            caption_boundary: true
      - say: "Try again. This time write both the ID and the backlog, but stop before commit. Reopen and we still have zero and an empty ledger. Now commit both writes and stop before acknowledgment. Reopen and we have three with Q one recorded. When the source retries, the ledger recognizes the payload and the backlog stays three. Saving the ID alone could lose the addition. Saving only the addition could double it."
        hold: 0.6
        visual_cues:
          - id: sf-atomic-crash-both
            phrase: "write both the ID and the backlog"
            targets: [atomic-crash-mechanism]
            color: cyan
            linger: 0.25
