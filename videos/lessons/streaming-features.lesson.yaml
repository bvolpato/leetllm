            phrase: "zero and an empty ledger"
            targets: [atomic-crash-mechanism]
            color: green
            linger: 0.25
            caption_boundary: true
          - id: sf-atomic-crash-commit
            phrase: "commit both writes and stop before acknowledgment"
            targets: [atomic-crash-mechanism]
            color: cyan
            linger: 0.25
          - id: sf-atomic-crash-durable
            phrase: "three with Q one recorded"
            targets: [atomic-crash-mechanism]
            color: green
            linger: 0.25
            caption_boundary: true
          - id: sf-atomic-crash-retry
            phrase: "the backlog stays three"
            targets: [atomic-crash-mechanism]
            color: green
            linger: 0.25
            caption_boundary: true
      - say: "Continue from three. Q two subtracts one. Q three tries to subtract five and the ledger records a rejection. A separate Q four adds ten, bringing the backlog to twelve. Now twelve could cover a subtraction of five. Retry the same Q three and its rejection still stands. Reusing Q one’s ID with a different delta raises a payload conflict. These restarts check the local database transaction. A broker and an external store need their own recovery test."
