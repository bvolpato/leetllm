      - say: "End with a fresh reflow: the current frame is version eight, but a proposed Failed tests click still names version seven and the page now has two matching tabs. Predict the host action. It rejects the stale proposal, captures version eight, scopes to the intended run and resolves one actionable target before clicking. If the verifier still cannot prove the local draft, the result stays unknown. A local draft can be complete while an incident update remains outside this task. Human-in-the-loop architecture makes the permitted review pause durable next."
        hold: 1
        visual_cues:
          - id: choose-and-measure-construct-3
