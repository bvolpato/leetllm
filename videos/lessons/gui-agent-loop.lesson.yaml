            linger: 0.45
          - id: choose-and-measure-b1-2
            phrase: legacy screen
            targets:
              - visual-evidence
            linger: 0.45
      - say: Measure whether clicks reach the annotated target, whether the final state matches the goal, how often forbidden actions are attempted or executed, and how many steps the path uses.
        hold: 0.75
        visual_cues:
