scenes:
  - id: intro
    title: The request at nine o’clock
    visual: A signed approval slips onto the access request. Their two timestamps stay in view. Rewinding the completed record to opening then shows which fields the router could read.
    beats:
      - say: The access request opened at nine. The manager signed at ten twenty-two. Could the router use this signature to decide whether to send the request for review?
        hold: 2
      - say: The signature arrived eighty-two minutes too late. Two other fields were already there at eight fifty-nine. One measured ambiguity in the request text. The other counted the user's prior policy exceptions. On July fifteenth an audit revoked access. Which fields survive if we rewind this file to nine?
        hold: 2.4
        caption_starts:
          - Two other fields
          - On July fifteenth
        visual_cues:
          - id: read-approval
            phrase: The signature arrived eighty-two minutes too late
            targets: [field-2]
          - id: read-audit
            phrase: On July fifteenth an audit revoked access
            targets: [field-3]
      - say: Roll the record back to nine. First we lose the audit result. Cross the approval time and the manager's approval goes back to pending too.
        caption_starts:
          - First we lose the audit result
          - Cross the approval time
        visual_cues:
          - id: rewind-audit
            phrase: First we lose the audit result
            targets: [snapshot-cursor, field-3]
          - id: rewind-approval
            phrase: Cross the approval time
            targets: [snapshot-cursor, field-2]
        motion_check:
          region: [260, 287, 1400, 85]
          minimumChangedFraction: 0.002
        hold: 0.5
      - say: Two fields remain. Use them to make the prediction. Save the audit for scoring it. Watch what happens when we give the predictor the audit as well.
        hold: 0.7
  - id: target-leak
    title: Score the same eight requests twice
    visual: Eight rows keep their audit labels. The copied predictions are replaced with decisions from the opening-time rule. Two magnified calculations explain the false alarm and missed review.
    beats:
      - say: In these eight example requests, an audit label of one means review was required. Read down the two columns on the right. The first rule copies each audit label into its prediction. Eight predictions, eight matches.
        hold: 0.9
      - say: Disconnect the audit column from the predictor. Keep it for scoring. At opening, our rule subtracts nine tenths of the policy support value from the ambiguity score. A result above zero sends the request for review. The first six predictions still match.
        hold: 0.75
      - say: Look at row six. There's no policy support to subtract, so the result is positive. The rule sends the request to review. The audit says zero. That's one false alarm.
        hold: 0.85
      - say: Now try row seven. Ambiguity is six tenths and policy support is one. Use the same rule. Would you send this request for review?
        hold: 2.5
      - say: Six tenths minus nine tenths is negative three tenths. The rule lets the request through this review check. Its audit label is one. That missed review leaves six matches in eight requests, or seventy-five percent.
        caption_starts:
          - Its audit label is one
          - That missed review leaves
        hold: 1
      - say: The audit outcomes stayed fixed. Changing what the predictor could read exposed two different mistakes. On real traffic, a perfect score calls for checking duplicate requests, label construction, sample size and whether the cases really are easy to separate. Mandatory authorization rules still apply to every request.
        hold: 0.7
  - id: risk
    title: Separate fitted error from the target risk
    visual: The same request losses deposit into one empirical mean; an explicitly hypothetical population
      distribution has a separate weighted mean.
    beats:
      - say: Read the losses on these four training requests. Three cost the model zero. The fourth costs it one. Add the losses and divide by four. That average is the fitted model's empirical risk.
        hold: 0.7
      - say: The training average is one quarter. Now suppose three quarters of future requests have loss zero and one quarter have loss two. Weight each loss by its probability. The expected loss is one half. That's the population risk. Subtract the training average and the generalization gap is one quarter. On real traffic, a fresh sample helps us estimate the population risk.
        caption_starts:
          - The expected loss is one half
          - Subtract the training average
        visual_cues:
          - id: weighted-loss
            phrase: The expected loss is one half
            targets: [population-loss]
          - id: risk-gap
            phrase: the generalization gap is one quarter
            targets: [gap]
        hold: 0.7
      - say: Take four independent draws from the same population. One in four is positive on average. Our two rules always predict zero or always predict one. Fit the one with fewer training errors, picking zero in a tie. With two positives, it misses half the training cases but only a quarter of the population. That gives the point below zero. Across repeated draws, picking the lowest training error makes it optimistic on average.
        hold: 0.7
  - id: roles
    title: Separate fitting, choosing, and reporting
    visual: Training, validation, and test blocks occupy different windows; arrows show the permitted feedback paths.
    beats:
      - say: Training data fit the parameters and every data-dependent transform. Validation data help choose
          features, hyperparameters, and decision thresholds. Test data evaluate the frozen candidate under
          prespecified metrics. Those are different roles even when cross-validation rotates which physical
          rows perform them.
        hold: 0.6
        visual_cues:
          - id: roles-beat-1-focus-1
            phrase: Training data fit the parameters and every data-dependent transform
            targets:
              - roles-node-train
            color: cyan
            linger: 0.6
      - say: Imagine fitting on January through June, selecting the threshold in July, and reporting the frozen system
          on August. July’s labels need to be ready before the August system is locked. A chronological split
          makes the order visible, while availability checks determine whether the workflow was actually
          possible.
        hold: 0.6
        visual_cues:
          - id: roles-beat-2-focus-1
            phrase: selecting the threshold in July
            targets:
              - roles-node-valid
            color: cyan
            linger: 0.6
          - id: roles-beat-2-focus-2
            phrase: and reporting the frozen system on August
            targets:
              - roles-node-test
            color: cyan
            linger: 0.6
      - say: If August’s errors drive another feature change, August helped design candidate B. Keep the August score with candidate A. Test B on fresh requests.
        hold: 0.75
        visual_cues:
          - id: roles-beat-3-focus-1
            phrase: If August’s errors drive another feature change
            targets:
              - roles-node-test
            color: cyan
            linger: 0.6
  - id: folds
    title: Refit the pipeline as the held-out role moves
    visual: Five development folds rotate through the validation position while a fresh pipeline is fitted for
      each iteration.
    beats:
      - say: Cross-validation rotates the held-out job within development data. In each iteration, fit a fresh model
          on the other folds and evaluate it on the selected fold. Every held-out prediction comes from a fit
          that excluded its corresponding validation rows from the training process.
        hold: 0.6
        visual_cues:
          - id: folds-beat-1-focus-1
            phrase: Every held-out prediction comes from a fit that
            targets:
              - folds-simulation-15
            color: blue
            linger: 0.6
      - say: The collection of scores shows how sensitive the procedure is to these partitions. Their mean summarizes
          the chosen split design. Their spread describes variation across dependent folds, because the fits
          share training rows; it does not automatically form a confidence interval for population
          performance.
        hold: 0.6
        visual_cues:
          - id: folds-beat-2-focus-1
            phrase: because the fits share training rows
            targets:
              - folds-simulation-15
            color: blue
            linger: 0.6
      - say: Stratification tries to preserve class proportions. It cannot place a positive example in every fold when
          there are fewer positives than folds. It also leaves time and user boundaries unresolved. Choose the
          split from the generalization claim, then check whether each fold has enough label support to be
          useful.
        hold: 0.75
        visual_cues:
          - id: folds-beat-3-focus-1
            phrase: Stratification tries to preserve class proportions
            targets:
              - folds-simulation-15
            color: blue
            linger: 0.6
  - id: fold-calculation
    title: From a held-out row to a fold score
    visual: A centered ruler fixes two training class means. One new point lands on the ruler before its audit opens. A second fold then lets the viewer compare averaging scores with pooling the underlying predictions.
    beats:
      - say: Let's fit one fold. Class zero has observations two and four. Class one has eight and ten. The training mean is six. Subtract six from every value on this ruler. The two blue training points now sit around minus three. The two pink ones sit around plus three. Our classifier picks the nearer class mean. A tie goes to class zero.
        hold: 0.8
      - say: Now place a held-out observation at nine. Subtract the same training mean. It lands at plus three. Which class would you predict?
        hold: 2
      - say: Class one. Open the audit for nine and you'll see zero. That's a false positive. Beside it, five is a missed positive. All four predictions were made with the fitted training rule. They give one of each confusion count. Precision and recall are each one half. F one doubles the true positives and divides by that number plus the false positives and false negatives. Here that's two over four.
        caption_starts:
          - Open the audit for nine
          - Here that's two over four
        hold: 0.95
      - say: Add a second fold containing one request. It needed review and we caught it, so its F one is one. Give each fold equal weight and the mean of one half and one is three quarters. Now pool the predictions. There are two true positives, one false positive and one miss. Four over six is two thirds. Both summaries use the same predictions. State which one you report. For an average loss per request, weight each fold by its number of requests.
        hold: 1
        visual_cues:
          - id: average-folds
            phrase: Give each fold equal weight and the mean of one half and one is three quarters
            targets: [fold-average]
          - id: combine-counts
            phrase: Now pool the predictions
            targets: [pooled-row]
          - id: score-pool
            phrase: Four over six is two thirds
            targets: [pooled-score]
      - say: Here are the five supplied development scores again. Their mean is point seven zero eight. Their sample standard deviation is about point zero nine three. The lowest fold is worth a look. Did its traffic change? How many positives did it contain? Training sets overlap, so this spread alone gives no population confidence interval.
        hold: 0.75
      - say: With five folds, each fit uses about eighty percent of the development data. With ten, about ninety percent. Leave-one-out uses all but one row and can require a fit for each row. Two of those fits share all but two rows. The resulting variance also depends on the data and the learner. And with just three positive requests, even the best distribution across five folds leaves at least two with none. Stratification can balance proportions. Time and user separation need their own rules.
        hold: 0.8
  - id: users
    title: A repeated person can cross a row boundary
    visual: Pairs of identical user records first split by row, then regroup so each user remains on one side.
    beats:
      - say: Suppose each user contributes two identical requests and has a user-specific label. Put one row from
          every user in training and the other in validation. A lookup table can now score perfectly by
          recognizing users it already knows. That measures returning-user recognition under this constructed
          setup.
        hold: 0.6
        visual_cues:
          - id: users-beat-1-focus-1
            phrase: Put one row from every user in training
            targets:
              - users-simulation-22
            color: blue
            linger: 0.6
          - id: lookup-recognition
            phrase: A lookup table can now score perfectly
            targets:
              - users-lookup-result
            linger: 0.5
      - say: If the intended claim concerns brand-new users, keep each user entirely on one side. Our same lookup rule
          predicts zero for an unknown user. Two of the four new users have label zero, so it scores one half. The score changes
          because we have changed which task the evaluation asks it to perform.
        hold: 0.6
        visual_cues:
          - id: users-beat-2-focus-1
            phrase: If the intended claim concerns brand-new users
            targets:
              - users-simulation-22
            color: blue
            linger: 0.6
          - id: lookup-fallback
            phrase: Our same lookup rule predicts zero for an unknown user
            targets:
              - users-lookup-result
            linger: 0.5
      - say: Returning users are often a legitimate part of serving traffic, and their earlier history can be useful
          context. Report new and returning slices when both matter. Dropping an explicit user identifier does
          not remove other identifying features, and group separation alone does not enforce a future-time
          boundary.
        hold: 0.75
        visual_cues:
          - id: users-beat-3-focus-1
            phrase: Returning users are often a legitimate part of serving traffic
            targets:
              - users-simulation-22
            color: blue
            linger: 0.6
  - id: pipeline
    title: A transform can peek before the model fits
    visual: Four labeled observation lanes hold the training-only centering origin through the pipeline contract.
      At the spoken Watch cue, the origin moves from 4 to 8, with intermediate origins labeled as a transition
      and both fitted means retained as fixed references.
    beats:
      - say: A scaler, imputer, feature selector, or PCA projection learns from data before the final predictor sees
          it. Fitting that transform on held-out rows crosses an inductive evaluation boundary. The classifier
          can fit only on training labels and still inherit information from a globally fitted preprocessing
          step.
        hold: 0.6
        visual_cues:
          - id: pipeline-beat-1-focus-1
            phrase: The classifier can fit only on training labels
            targets:
              - pipeline-object-training-only-fitted-mean-32
            color: blue
            linger: 0.6
          - id: pipeline-beat-1-focus-2
            phrase: Fitting that transform on held-out rows crosses an inductive evaluation boundary
            targets:
              - pipeline-object-all-row-fitted-mean-33
            color: blue
            linger: 0.6
      - say: Place learned transforms inside the pipeline that each fold fits. The training partition determines its
          means, directions, selected columns, and coefficients. The fitted pipeline then transforms the
          held-out observations. A predefined unit conversion has no learned parameters and follows a
          different information contract.
        hold: 0.6
        visual_cues:
          - id: pipeline-beat-2-focus-1
            phrase: The training partition determines its means
            targets:
              - pipeline-object-training-only-fitted-mean-32
            color: blue
            linger: 0.6
      - say: Our small illustration compares a training-only mean with a mean that also sees a later extreme value.
          Watch how the whole coordinate system shifts. The arithmetic is valid in both cases, while only one
          path matches a model that had to be fitted before the held-out data arrived. A translation alone can
          leave a model with a free intercept unchanged, so the next selector example will calculate an actual
          prediction consequence.
        motion_check:
          region:
            - 290
            - 455
            - 1525
            - 435
          minimumChangedFraction: 0.002
        hold: 0.75
        visual_cues:
          - id: pipeline-beat-3-focus-1
            phrase: illustration compares a training-only mean with a mean
            targets:
              - pipeline-object-training-only-fitted-mean-32
            color: blue
            linger: 0.6
          - id: pipeline-beat-3-focus-2
            phrase: Our small illustration compares a training-only mean with
            targets:
              - pipeline-transformed-observations
            color: blue
            linger: 0.6
  - id: feature-selection
    title: Where can a label enter the fit?
    visual: A bracket controls which labels enter feature selection. Class means update as it expands. The selected columns make different predictions on two identifiable rows. An inner split then builds an encoded input for a unique category.
    beats:
      - say: Here the classifier gets just one column. Each row has two candidates, T and L. To choose between them, separate the rows with label one from those with label zero. In each group, count the fraction of ones in the candidate column. Choose the column with the larger absolute difference between those fractions.
        hold: 0.65
      - say: Start with the four training rows inside the bracket. For T, both positive rows have a one and neither negative row does. For L, just one of the two positive rows has a one. Which column would you keep?
        hold: 2.1
      - say: T wins. Its class means are a full unit apart. L's are only half a unit apart. Freeze T here and the four covered labels can still give us an independent check of this choice.
        hold: 0.75
      - say: Now extend the bracket. Let the selector read each held-out label. Watch the fractions as those rows enter. Among the four positive rows, three have L equal to one. Among the negatives, none do. Which column wins this time?
        hold: 2.1
      - say: L wins, three quarters to one half. The held-out labels changed a decision before the classifier even started fitting.
        hold: 0.75
      - say: Fit both classifiers on the original four training rows. Each predicts whichever class mean is nearer on its chosen column. Compare held rows five and six. Using T, one is a false alarm and the other a miss. Using L reverses both predictions. The all-row selector gets four out of four on the very labels it used. The training-only selector gets two. Refit the selector inside each training fold and freeze it before scoring. A custom transform that reads the full table can still leak.
        caption_starts:
          - Using T, one is a false alarm
          - Using L reverses both predictions
          - The all-row selector gets four out of four
          - The training-only selector gets two
        hold: 1.2
        visual_cues:
          - id: t-predictions
            phrase: Using T, one is a false alarm
            targets: [t-predictions]
          - id: l-predictions
            phrase: Using L reverses both predictions
            targets: [l-predictions]
          - id: l-correct
            phrase: gets four out of four
            targets: [l-correct]
          - id: t-correct
            phrase: The training-only selector gets two
            targets: [t-correct]
      - say: Suppose we replace each category with its average target. A appears once. Its target is one, so using A's own row copies the answer into its input. Now cover A's fold. B and D are left. Neither is category A, so we'll use their overall mean. What value goes into A's input?
        hold: 2.2
        caption_starts:
          - Now cover A's fold
        visual_cues:
          - id: cover-a-fold
            phrase: Now cover A's fold
            targets: [encoding-rows]
      - say: One half. B contributes one and D contributes zero. We can compute A's input with its target covered. That's cross-fitting. In scikit-learn, the target encoder's fit-transform does this for training rows. Fitting once and transforming those same rows lets A influence its own input. Use inner splits that respect your time and user boundaries. For a held-out request, apply the mapping learned on the full training partition.
        caption_starts:
          - In scikit-learn
          - For a held-out request
        visual_cues:
          - id: encoded-mean
            phrase: One half
            targets: [encoded-input]
          - id: held-out-mapping
            phrase: For a held-out request
            targets: [mapping-note]
        hold: 0.85
  - id: time
    title: Rehearse the next deployment
    visual: Three calendar rows distinguish development refits from July selection and August reporting. A June request carries a separate August label timestamp across the July fit date.
    beats:
      - say: Suppose the router will be retrained regularly. Rehearse an early deployment first. Fit on January and February. Without changing that fit, score March and April. Every scored request came later than the history used to fit it.
        hold: 0.7
      - say: Move the fit date forward. This time the pipeline learns from January through April. Its next two months are May and June. Moving the date and refitting at each step is called rolling-origin validation.
        hold: 0.8
      - say: Both rehearsals finished inside June. For release, fit the candidate weights and transforms through June. Use July to choose a threshold, then score August with that threshold frozen. If July's audit labels are still pending when you need to freeze, move the reporting window later.
        hold: 0.8
      - say: Zoom in on one training candidate. The request opened on June twentieth. Its audit label arrives on August second. Your fit starts on July first. Can you include this request as a labeled training row?
        hold: 2.2
      - say: Leave it out of that fit. Knowing the request existed is enough to count prior activity. Learning from its outcome requires the outcome to have arrived. Input features have their own clock too. Let's reconstruct one from the records the router could actually read.
        hold: 0.8
  - id: as-of-history
    title: What was available by the cutoff?
    visual: A seven-day count keeps each event timestamp fixed while its observation marker advances to cache arrival. The July decision line separates the delayed sync from the two readable events. A second cutoff checks label readiness and prior user activity.
    beats:
      - say: It's five minutes past midnight on July first. The router counts events from the previous seven days. All three blue dots fall inside that window. If you used just the event timestamps, the count would be three.
        hold: 0.75
      - say: Add when the router could read each record. The first two synced a second after their events. The third happened in June but didn't arrive until noon on July first. At five past midnight, how many events could the router count?
        hold: 2.1
      - say: Two. The third belongs in the event history, but its value came in after this prediction. Keep its original timestamp and its arrival time. When you rebuild the feature, require both a date inside the window and a record that was readable by the cutoff.
        hold: 0.8
      - say: Now consider user two. Their June request has an August audit label. July's model can't learn from that label, but the request already establishes prior activity. If this person returns in July, count them among returning users. Report the genuinely new users separately when both groups matter.
        hold: 0.8
      - say: Look at the jump from day three to day twenty. In scikit-learn's time series split, the gap counts samples. The elapsed time varies, and the splitter doesn't check label dates. Some designs purge training examples whose outcome intervals overlap the test outcomes. They may also leave a buffer after the test block, called an embargo. Such a design can fit on both sides of the test. To rehearse an actual deployment, use only history available before it.
        hold: 0.85
  - id: nested-selection
    title: Protect the evaluator from the selection loop
    visual: Two candidate identities compete within an inner development region; the selected configuration is
      refit before the outer cohort opens, then outer-feedback tuning contaminates that region.
    beats:
      - say: Two rules compete here. A picks the nearer class mean. B always predicts zero. Either can look good on a lucky split. Let's use the inner rows to pick a rule and save the covered outer labels to score that choice.
        hold: 0.7
      - say: In this inner split, A gets both held-out rows right. B gets one. Choose A and fit it again, this time on all four development rows. Its threshold moves from five to six. In a larger search, inner folds can choose features, hyperparameters and thresholds the same way.
        caption_starts:
          - Choose A and fit it again
        visual_cues:
          - id: refit-threshold
            phrase: Its threshold moves from five to six
            targets: [inner-refit]
        hold: 0.7
      - say: Open the outer labels. A gets two of four right here. Repeat the whole search and refit for each outer fold, keeping the time or user boundaries your task needs. The average scores that procedure at the training sizes you used. If these errors lead you to change A, test the revision on fresh data.
        caption_starts:
          - A gets two of four right here
        visual_cues:
          - id: outer-accuracy
            phrase: A gets two of four right here
            targets: [outer-score]
        hold: 0.7
  - id: selection
    title: One threshold for August
    visual: A common score ruler keeps each request's audit beside it. Three cuts enter a July scorecard. The winning cut stays fixed as August replaces the six requests and opens their labels.
    beats:
      - say: Choose a threshold on six July requests. The yellow marks are requests we send to review. Our metric is F one. At point three, the rule catches all three needed reviews. It also sends two routine requests. That gives six over eight, or point seven five.
        caption_starts:
          - That gives six over eight
        hold: 0.8
        visual_cues:
          - id: july-low
            phrase: or point seven five
            targets: [july-low-score]
      - say: Raise the threshold to one half. Watch the two routine requests at point three one and point four two drop below the cut. All three needed reviews still qualify. July F one reaches one.
        caption_starts:
          - July F one reaches one
        hold: 0.8
        visual_cues:
          - id: july-middle
            phrase: July F one reaches one
            targets: [july-middle-score]
      - say: Try point seven. Only one request clears the cut. Two needed reviews drop out, so F one falls to one half. Which threshold would you take into August?
        caption_starts:
          - F one falls to one half
        hold: 2
        visual_cues:
          - id: july-high
            phrase: F one falls to one half
            targets: [july-high-score]
      - say: Freeze the one-half threshold. Its perfect July score helped choose it. We still need to see how it handles fresh requests.
        hold: 0.7
      - say: August brings six different scores. Keep the same cut. One request sits just below it, at point four nine. The router processes that one automatically. Record the six decisions before looking at the audit.
        hold: 0.8
      - say: Open the labels. That point-four-nine request needed review. The point-five-two request went to review and turned out to be routine. Two true positives, one false alarm and one miss give F one of four over six. The July-to-August drop could reflect selection, small samples or different traffic. These six cases cannot tell us how much each contributed.
        hold: 0.85
  - id: selective-labels
    title: Who got an audit?
    visual: August's requests separate into review and automatic lanes. Three targets disappear under a queue-only audit. Counts compatible with the covered cells sit below them, then an audit opens one automatic outcome.
    beats:
      - say: Keep those same six August requests. The three the router sent to review are on top. Two really needed review, so precision in the queue is two thirds. The previous F one calculation used the audit results from both rows.
        hold: 0.7
      - say: Now suppose only the review queue gets audited. Cover the three automatic outcomes. You can still calculate queue precision. Can you tell what fraction of all needed reviews the router caught?
        hold: 2.1
      - say: Suppose all three covered requests were routine. The two known positives would be the only ones. Catching both gives a recall of two out of two.
        hold: 0.7
      - say: Keep the top row exactly as it is. There could also be one, two or three missed reviews underneath. Each extra miss adds one to the denominator. The same observed queue is consistent with recall as low as two fifths. An unknown outcome has to stay unknown.
        hold: 0.85
      - say: Sample an automatic request for audit. This draw opens the one at point four nine. It reveals one miss and leaves two outcomes unknown. To estimate population recall, record how you sampled and account for unequal chances of being audited. A threshold chooses an action. Calibration asks a separate question. Among requests assigned a given probability, how often does the outcome occur?
        hold: 0.9
  - id: documents
    title: Split three manuals
    visual: Six passages move on fixed tracks between tuning and test. Their parent manuals stay in view as the count of shared sources changes from three to zero.
    beats:
      - say: Suppose our assistant must answer questions about new policy manuals. We have two passages from each of three manuals. Put the first passage from every manual into tuning and the second into test. The passages have different text. Look down the rows. How many test manuals has tuning already seen?
        hold: 2.1
      - say: All three. Start the split over, this time using the manual as the unit. Keep the access and incident manuals in tuning. Hold the whole admins manual for test. Now the two admin passages share a test source, but no test source appears in tuning. A question derived from either passage inherits that same parent.
        hold: 0.9
      - say: A different product might answer new questions about an existing library. Retrieving those shared manuals can be exactly what that product should do. Its evaluation questions and reference answers still have to stay out of prompt tuning. To check the split, look at both the wording and where each example came from.
        hold: 0.8
  - id: benchmark-screen
    title: Compare two versions of a retention rule
    visual: Two five-word windows traverse a training sentence and an evaluation prompt. The wording changes while the period stays the same, separating a lexical match from evidence of source exposure.
    beats:
      - say: Suppose we search training text for runs of five consecutive words from a test prompt. The top line is a training passage. Read the bottom one. The words inside the two brackets agree.
        hold: 0.55
      - say: Slide over one word. These two windows agree too. That makes two shared five-word sequences, so this screen flags the prompt for review. A common piece of boilerplate could also trigger it. The flag tells you where to look.
        hold: 0.8
      - say: Try different wording. The test prompt now says to retain audit records for one week. Will any five consecutive words match the training passage?
        hold: 2.1
      - say: Slide across again. Zero matches. Both passages still say to keep the records for seven days. MinHash estimates how much two sets of word sequences overlap. Locality-sensitive hashing finds likely matches efficiently. To compare meaning as well as wording, search embeddings, then trace each candidate pair to its sources.
        caption_starts:
          - Zero matches
        visual_cues:
          - id: compare-word-windows
            phrase: Slide across again
            targets: [word-windows]
          - id: no-shared-window
            phrase: Zero matches
            targets: [window-result]
        hold: 0.85
      - say: Common wording can give a model low loss. If you remove easy items with familiar wording, the remaining benchmark gets harder. That's another reason its score can change. To trace possible exposure, compare problem and release dates with the model's training cutoff. Check its version, any later training, and whether its tools could retrieve a public solution.
        hold: 0.85
  - id: counterfactual
    title: Show the outcome the log never observed
    visual: The same request context branches to two possible actions; only the logging action has an observed
      reward, and a target-policy request for an unsupported branch stops at a zero-support gap.
    beats:
      - say: Follow this request. The old router sent it for review, so the log records the reward for review. What would have happened to that same request on the automatic route? That missing result is a counterfactual. An audit can tell us a request needed review. To compare routing policies, we also need to know how their actions turn out.
        caption_starts:
          - That missing result is a counterfactual
        hold: 0.7
      - say: The old router always chose review here. The new one sometimes chooses automatic processing. Importance sampling reweights logged actions using the new probability divided by the old one. Look at the denominator for automatic processing. It's zero. The log has no example of what happens on that branch.
        caption_starts:
          - It's zero
        hold: 0.7
      - say: For a sequence of actions, multiply the probability ratios along the path. This needs reliable action probabilities, coverage at each step, and comparable states and dynamics. A simulator can predict a missing reward under assumptions you can test. Mark that reward as a prediction. A randomized comparison can measure the effect of the choice directly.
        hold: 0.7
  - id: source-transfer
    title: Two answers about retention
    visual: The question from policy C first waits for a split. Its family regroups, then a separate fit holds out the whole family. A fresh policy D tests whether a correct fallback belongs in the report.
    beats:
      - say: Our policy assistant answers questions about retention. We want to know how it handles a manual it has never seen in tuning. One passage from policy C says to keep records for seven days. That passage went into tuning. A second passage says to remove records after a week. Someone turned it into this question. Where should the question go?
        hold: 2.5
        visual_cues:
          - id: c-first-passage
            phrase: One passage from policy C
            targets: [source-children]
          - id: c-sibling
            phrase: A second passage
            targets: [source-children]
          - id: c-question
            phrase: Someone turned it into this question
            targets: [source-children]
      - say: Keep the question with its parent in tuning. Give this example assistant one rule. Return the period stored for the policy, or thirty days for a policy it hasn't seen. Tuning on C stores seven days. Ask its sibling question and the lookup gets seven days right. Now replay the split from the start. Hold out all of C before fitting. With no entry for C, the lookup uses its default of thirty days. The policy says seven, so this answer is wrong. That replay explains what the stored answer bought us.
        caption_starts:
          - the lookup gets seven days right
          - Hold out all of C before fitting
          - the lookup uses its default of thirty days
          - The policy says seven
        hold: 0.9
        visual_cues:
          - id: source-group
            phrase: Keep the question with its parent in tuning
            targets: [source-children]
          - id: source-exposed
            phrase: Tuning on C stores seven days
            targets: [lookup-result]
          - id: source-match
            phrase: the lookup gets seven days right
            targets: [lookup-result]
          - id: source-remove
            phrase: Hold out all of C before fitting
            targets: [source-children]
          - id: source-fallback
            phrase: the lookup uses its default of thirty days
            targets: [lookup-result]
          - id: source-result
            phrase: this answer is wrong
            targets: [lookup-result]
      - say: Return to the original lookup, with C in memory. Freeze it. A new page, D, arrives after the freeze. Ask how long D keeps records. The lookup has no entry for D, so it predicts thirty days. Lock that answer before opening the policy.
        hold: 0.95
        caption_starts:
          - The lookup has no entry for D
          - it predicts thirty days
        visual_cues:
          - id: page-d-arrives
            phrase: A new page, D, arrives after the freeze
            targets: [page-d]
          - id: page-d-predicted
            phrase: it predicts thirty days
            targets: [page-d]
      - say: Open D. Its policy really does say thirty days. Now two answers are correct. C gave us seven and D gave us thirty. Which answer belongs in a report about previously unseen sources?
        hold: 2.6
        caption_starts:
          - Its policy really does say thirty days
        visual_cues:
          - id: page-d-policy
            phrase: Its policy really does say thirty days
            targets: [page-d]
      - say: Enter D. It qualifies even though the lookup got there by falling back to its default. C supplied its own answer during tuning. One correct answer on one unseen page is the whole result so far.
        hold: 1
      - say: Keep D's result with this version of the assistant. Freeze the rule and the metric, then draw the next page from a new manual your users will ask about. If today's errors guide your next revision, give that revision a new test.
        caption_starts:
          - If today's errors guide your next revision
        visual_cues:
          - id: next-manual
            phrase: draw the next page from a new manual
            targets: [next-page]
        hold: 1.2
