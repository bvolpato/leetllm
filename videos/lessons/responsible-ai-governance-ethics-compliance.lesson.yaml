scenes:
  - id: intro
    title: Can this rollout go ahead?
    visual: >-
      A pen signs the release line on a rollout form. The required security line stays blank. The decision and executor record open separately. The four NIST functions describe who owns this decision and how to review it.
    beats:
      - say: >-
          The release reviewer signs. This rollout needs two signatures because the recommendation came from an untrusted evaluation note. Look at the security line. Can this rollout go ahead?
        hold: 2.1
        caption_starts:
          - Look at the security line
        motion_check:
          region: [330, 390, 1250, 420]
          minimumChangedFraction: 0.002
        visual_cues:
          - id: intro-beat-1-focus-1
            phrase: "The release reviewer signs"
            targets: [approval-form]
            linger: 0.25
          - id: gov-intro-policy
            phrase: "needs two signatures"
            targets: [approval-form]
            linger: 0.25
          - id: gov-intro-lookup
            phrase: "Look at the security line"
            targets: [approval-form]
            linger: 0.25
      - say: >-
          Hold the rollout. Security still has to sign. Now open the executor record. It shows zero traffic changes. The owner can appeal if a signature was missed. An independent reviewer checks the original request, policy and receipts, then adds the decision and its reason to the file.
        hold: 0.8
        caption_starts:
          - Hold the rollout
          - It shows zero traffic changes
          - The owner can appeal
        visual_cues:
          - id: gov-original-hold
            phrase: "Hold the rollout"
            targets: [approval-form]
            linger: 0.25
          - id: gov-original-effect
            phrase: "It shows zero traffic changes"
            targets: [effect-record]
            linger: 0.25
          - id: gov-original-appeal
            phrase: "An independent reviewer checks the original request, policy and receipts"
            targets: [appeal-record]
            linger: 0.25
      - say: >-
          Who could a bad rollout hurt? The workflow map names the people who will use the new model. Measure what happened on both unauthorized and legitimate requests. Manage the risk by holding an unsafe change or repairing a mistaken denial. The release owner decides who can accept the remaining risk.
        hold: 0.6
        visual_cues:
          - id: gov-map-case
            phrase: "The workflow map names the people"
            targets: [framework-records]
            linger: 0.25
          - id: gov-measure-case
            phrase: "Measure what happened"
            targets: [framework-records]
            linger: 0.25
          - id: gov-manage-case
            phrase: "Manage the risk"
            targets: [framework-records]
            linger: 0.25
      - say: >-
          These are the four functions in NIST's voluntary AI Risk Management Framework. Govern applies throughout Map, Measure and Manage. As of late twenty twenty-six, version one is under revision. The Generative AI Profile covers risks including harmful outputs, information integrity, privacy and security. ISO forty-two thousand and one, published in twenty twenty-three, uses Plan, Do, Check, Act for an organization's AI management system. The team documents safety evidence and legal review for each release.
        hold: 0.7
        visual_cues:
          - id: gov-framework-scope
            phrase: "Govern applies throughout"
            targets: [framework-records]
            linger: 0.25
          - id: gov-iso-system
            phrase: "Plan, Do, Check, Act"
            targets: [framework-records]
            linger: 0.25
  - id: workflow
    title: Review follows the workflow and the people it affects
    visual: Four workflow records run through an explicit engineering triage function. Checked false flags remain
      distinct from unknown intake facts.
    beats:
      - say: >
          The same model can summarize public documents, help assess credit, or propose production changes.
          Start with intended use and affected people. Our intake asks about credit, worker management, direct
          interaction and executable effects. Checked facts determine an engineering review route.
        hold: 0.6
        visual_cues:
          - id: gov-workflow-b1
            phrase: The same model can summarize public documents, help assess credit, or propose production changes
            targets:
              - workflow-mechanism
            color: blue
            linger: 0.6
      - say: >
          The credit example reaches specialized risk review. The promotion assistant reaches interaction and
          effect review. Public summarization reaches the baseline route. These labels organize investigation;
          qualified reviewers determine the applicable legal classification from jurisdiction, role and use.
        hold: 0.6
        visual_cues:
          - id: gov-workflow-b2
            phrase: The credit example reaches specialized risk review
            targets:
              - workflow-mechanism
            color: blue
            linger: 0.6
          - id: gov-credit-route
            phrase: The credit example reaches specialized risk review
            targets:
              - gov-workflow-mechanism
            color: cyan
            linger: 0.5
          - id: gov-effect-route
            phrase: The promotion assistant reaches interaction and effect review
            targets:
              - gov-workflow-mechanism
            color: cyan
            linger: 0.5
          - id: gov-baseline-route
            phrase: Public summarization reaches the baseline route
            targets:
              - gov-workflow-mechanism
            color: cyan
            linger: 0.5
      - say: >
          An incomplete intake reaches facts review. Unknown answers stay visible until established. Record
          the legal basis and its review date beside the workflow. Model-provider responsibilities and
          application responsibilities can coexist, so a replacement model needs a workflow assessment.
        hold: 0.6
        visual_cues:
          - id: gov-workflow-b3
            phrase: An incomplete intake reaches facts review
            targets:
              - workflow-mechanism
            color: blue
            linger: 0.6
          - id: gov-unknown-route
            phrase: An incomplete intake reaches facts review
            targets:
              - gov-workflow-mechanism
            color: cyan
            linger: 0.5
  - id: legal-scope
    title: Classify the workflow and identify each actor
    visual: One model connects to several persistent workflow silhouettes. Territorial-scope and actor branches
      attach to each actual use; transparency overlays rather than replacing high-risk status.
    beats:
      - say: Begin the EU assessment with territorial scope and actor role. Article two includes providers placing
          systems or general-purpose models on the Union market, EU deployers, and certain non-EU providers
          and deployers where system output is used in the Union. Record the actual deployment and affected
          people rather than inferring scope from a vendor name. The legal orientation here was checked
          against the amended official text on November sixth, twenty twenty-six; a launch still needs its
          dated classification and qualified signoff.
        hold: 0.7
        visual_cues:
          - id: gov-legal-scope-b1
            phrase: Begin the EU assessment with territorial scope and actor role
            targets:
              - legal-scope-mechanism
            color: blue
            linger: 0.6
          - id: gov-eu-output
            phrase: where system output is used in the Union
            targets:
              - gov-legal-scope-mechanism
            color: cyan
            linger: 0.5
      - say: An application developer can be the provider of an AI system even when another organization supplies its
          general-purpose model. Provider in the Act concerns developing, or having developed, a system or
          model and placing it on the market or into service under its own name; a deployer uses a system
          under its authority. Which actor you are depends on the facts. A credit application can be a
          high-risk system built on a general-purpose model with separate model-provider duties.
        hold: 0.7
        visual_cues:
          - id: gov-legal-scope-b2
            phrase: An application developer can be the provider of an AI system even when another organization supplies
              its general-purpose model
            targets:
              - legal-scope-mechanism
            color: blue
            linger: 0.6
          - id: gov-application-role
            phrase: An application developer can be the provider of an AI system even when another organization supplies
              its general-purpose model
            targets:
              - gov-legal-scope-mechanism
            color: cyan
            linger: 0.5
      - say: >-
          The four-level intake map asks about prohibited practices, high-risk systems, particular transparency duties, and minimal or no risk. A high-risk assistant can also have transparency obligations. The local triage checks unknown facts first, then credit or worker management, then direct interaction or executable effects, then baseline. A staff scheduling proposal with a checked worker-management flag goes to specialized risk review. An unanswered flag stays facts review. The intake sends that workflow to a qualified reviewer for legal classification.
        hold: 0.7
        visual_cues:
          - id: gov-legal-scope-b3
            phrase: The four-level intake map asks about prohibited practices, high-risk systems, particular transparency
              duties, and minimal or no risk
            targets:
              - legal-scope-mechanism
            color: blue
            linger: 0.6
          - id: gov-staff-route
            phrase: A staff scheduling proposal with a checked worker-management flag goes to specialized risk review
            targets:
              - gov-legal-scope-mechanism
            color: cyan
            linger: 0.5
          - id: gov-staff-unknown
            phrase: "An unanswered flag stays facts review"
            targets:
              - gov-legal-scope-mechanism
            color: cyan
            linger: 0.5
  - id: prohibited-practices
    title: A prohibited-use screen needs conditions and exceptions
    visual: A use record passes through precise Article5 predicates. Conditions illuminate with their associated
      harms; a prohibited result stops the path before any paperwork can green-light it.
    beats:
      - say: Screen prohibited practices before building a release checklist. Article five addresses specified
          manipulative or vulnerability-exploiting techniques that meet significant-harm conditions, and
          social scoring producing specified unrelated, unjustified or disproportionate adverse treatment. A
          score by itself does not establish those conditions. State the behavior, affected person and harm in
          the intake record. A signed risk memo cannot authorize a prohibited practice.
        hold: 0.7
        visual_cues:
          - id: gov-prohibited-practices-b1
            phrase: Screen prohibited practices before building a release checklist
            targets:
              - prohibited-practices-mechanism
            color: blue
            linger: 0.6
          - id: gov-prohibition-conditions
            phrase: specified manipulative or vulnerability-exploiting techniques that meet significant-harm conditions
            targets:
              - gov-prohibited-practices-mechanism
            color: cyan
            linger: 0.5
          - id: gov-score-alone
            phrase: A score by itself does not establish those conditions
            targets:
              - gov-prohibited-practices-mechanism
            color: cyan
            linger: 0.5
      - say: Other provisions concern untargeted facial-image scraping to build recognition databases, specified
          sensitive biometric categorization, and individual criminal-risk prediction based solely on
          profiling or personality. The criminal-risk provision distinguishes support for a human assessment
          already based on objective, verifiable facts directly linked to criminal activity. Workplace and
          education emotion inference has a medical or safety exception. Read each condition rather than
          turning these into a ban on every biometric or emotion-related tool.
        hold: 0.7
        visual_cues:
          - id: gov-prohibited-practices-b2
            phrase: Other provisions concern untargeted facial-image scraping to build recognition databases, specified
              sensitive biometric categorization, and individual criminal-risk prediction based solely on
              profiling or personality
            targets:
              - prohibited-practices-mechanism
            color: blue
            linger: 0.6
          - id: gov-objective-facts
            phrase: support for a human assessment already based on objective, verifiable facts directly linked to
              criminal activity
            targets:
              - gov-prohibited-practices-mechanism
            color: cyan
            linger: 0.5
          - id: gov-medical-exception
            phrase: Workplace and education emotion inference has a medical or safety exception
            targets:
              - gov-prohibited-practices-mechanism
            color: cyan
            linger: 0.5
      - say: Real-time remote biometric identification in publicly accessible spaces for law enforcement has narrow
          necessary objectives and authorization safeguards. They include targeted victim or missing-person
          searches, specified serious threats and certain serious-offence suspects. They are not a general
          exception for convenient surveillance. Record the objective, permitted scope and applicable
          authorization before determining whether the use fits an exception.
        hold: 0.7
        visual_cues:
          - id: gov-prohibited-practices-b3
            phrase: Real-time remote biometric identification in publicly accessible spaces for law enforcement has narrow
              necessary objectives and authorization safeguards
            targets:
              - prohibited-practices-mechanism
            color: blue
            linger: 0.6
          - id: gov-biometric-objective
            phrase: targeted victim or missing-person searches, specified serious threats and certain serious-offence
              suspects
            targets:
              - gov-prohibited-practices-mechanism
            color: cyan
            linger: 0.5
          - id: gov-biometric-scope
            phrase: Record the objective, permitted scope and applicable authorization before determining whether the use
              fits an exception
            targets:
              - gov-prohibited-practices-mechanism
            color: cyan
            linger: 0.5
      - say: The July twenty twenty-six amendment adds prohibitions involving nonconsensual intimate material and
          child sexual abuse material from December second, twenty twenty-six. Market and service restrictions
          distinguish intended generation from reasonably foreseeable, reproducible generation without
          adequate safeguards. The use restriction concerns the deployer's purpose. Detailed definitions and
          exceptions, including the child-material provision's national-law defence condition, matter. Keep a
          dated legal decision for the actual use rather than assigning a blanket rule to every
          general-purpose model.
        hold: 0.7
        visual_cues:
          - id: gov-prohibited-practices-b4
            phrase: The July twenty twenty-six amendment adds prohibitions involving nonconsensual intimate material and
              child sexual abuse material from December second, twenty twenty-six
            targets:
              - prohibited-practices-mechanism
            color: blue
            linger: 0.6
          - id: gov-dated-prohibition
            phrase: from December second, twenty twenty-six
            targets:
              - gov-prohibited-practices-mechanism
            color: cyan
            linger: 0.5
          - id: gov-generation-conditions
            phrase: intended generation from reasonably foreseeable, reproducible generation without adequate safeguards
            targets:
              - gov-prohibited-practices-mechanism
            color: cyan
            linger: 0.5
          - id: gov-use-purpose
            phrase: The use restriction concerns the deployer's purpose
            targets:
              - gov-prohibited-practices-mechanism
            color: cyan
            linger: 0.5
  - id: high-risk-branches
    title: Follow both high-risk routes and test the exception
    visual: A two-condition product AND gate sits beside the AnnexIII use branch. Only the AnnexIII branch reaches
      an exception test; a profiling override preserves high risk.
    beats:
      - say: Article six has two high-risk routes. The product route requires both an Annex one product or its safety
          component, and the relevant third-party conformity assessment for health and safety. Solely
          non-safety assistance, efficiency or convenience does not make a safety component. Failure that
          endangers health and safety can. A conformity check solely for unrelated risks does not satisfy the
          second condition. Preserve both inputs of this AND test.
        hold: 0.7
        visual_cues:
          - id: gov-high-risk-branches-b1
            phrase: Article six has two high-risk routes
            targets:
              - high-risk-branches-mechanism
            color: blue
            linger: 0.6
          - id: gov-product-inputs
            phrase: both an Annex one product or its safety component, and the relevant third-party conformity assessment
              for health and safety
            targets:
              - gov-high-risk-branches-mechanism
            color: cyan
            linger: 0.5
          - id: gov-convenience
            phrase: Solely non-safety assistance, efficiency or convenience does not make a safety component
            targets:
              - gov-high-risk-branches-mechanism
            color: cyan
            linger: 0.5
          - id: gov-safety-failure
            phrase: Failure that endangers health and safety can
            targets:
              - gov-high-risk-branches-mechanism
            color: cyan
            linger: 0.5
          - id: gov-unrelated-assessment
            phrase: A conformity check solely for unrelated risks does not satisfy the second condition
            targets:
              - gov-high-risk-branches-mechanism
            color: cyan
            linger: 0.5
      - say: Annex three is a separate listed-use route. It includes specified biometrics, educational assessment,
          employment and essential-service decisions. Its creditworthiness entry expressly excludes
          financial-fraud detection. For a supplied intake, distinguish an applicant's creditworthiness
          decision from a transaction-fraud detector, then check other applicable duties. A model swap leaves
          the applicant decision's intended use intact.
        hold: 0.7
        visual_cues:
          - id: gov-high-risk-branches-b2
            phrase: Annex three is a separate listed-use route
            targets:
              - high-risk-branches-mechanism
            color: blue
            linger: 0.6
          - id: gov-credit-fraud
            phrase: Its creditworthiness entry expressly excludes financial-fraud detection
            targets:
              - gov-high-risk-branches-mechanism
            color: cyan
            linger: 0.5
          - id: gov-credit-comparison
            phrase: distinguish an applicant's creditworthiness decision from a transaction-fraud detector
            targets:
              - gov-high-risk-branches-mechanism
            color: cyan
            linger: 0.5
      - say: The Annex three exception requires no significant risk to health, safety or fundamental rights, including
          no material influence on decision outcomes. At least one of four conditions must also apply. These
          are a narrow procedural task, improving a completed human activity, detecting decision patterns or
          deviations without replacing or influencing the completed assessment without proper human review, or
          a preparatory task. A provider relying on it documents the assessment before marketing or service
          and registers the system. Annex three profiling of natural persons remains high risk despite that
          exception test.
        hold: 0.7
        visual_cues:
          - id: gov-high-risk-branches-b3
            phrase: The Annex three exception requires no significant risk to health, safety or fundamental rights,
              including no material influence on decision outcomes
            targets:
              - high-risk-branches-mechanism
            color: blue
            linger: 0.6
          - id: gov-narrow-exception
            phrase: These are a narrow procedural task, improving a completed human activity, detecting decision patterns
              or deviations without replacing or influencing the completed assessment without proper human
              review, or a preparatory task
            targets:
              - gov-high-risk-branches-mechanism
            color: cyan
            linger: 0.5
          - id: gov-profiling-override
            phrase: Annex three profiling of natural persons remains high risk despite that exception test
            targets:
              - gov-high-risk-branches-mechanism
            color: cyan
            linger: 0.5
      - say: For covered high-risk systems, Articles nine through fifteen concern risk management, data governance,
          documentation, logging, transparency, human oversight, accuracy, robustness and cybersecurity. Check
          the responsible actor and sector route. Article two gives Annex one Section B products a special
          integration regime through sector legislation. The same direct compliance checklist does not fit
          every regulated product. Our promotion assistant's local controls do not by themselves declare it an
          Annex three high-risk system.
        hold: 0.7
        visual_cues:
          - id: gov-high-risk-branches-b4
            phrase: For covered high-risk systems, Articles nine through fifteen concern risk management, data governance,
              documentation, logging, transparency, human oversight, accuracy, robustness and cybersecurity
            targets:
              - high-risk-branches-mechanism
            color: blue
            linger: 0.6
          - id: gov-sector-route
            phrase: Article two gives Annex one Section B products a special integration regime through sector legislation
            targets:
              - gov-high-risk-branches-mechanism
            color: cyan
            linger: 0.5
  - id: gpai-layer
    title: Model duties coexist with application duties
    visual: A model layer retains Article53 duties while the overlaid credit-system layer remains classified by
      use. A compute threshold branch gains a separate Commission designation route.
    beats:
      - say: Keep the general-purpose model layer visible below the application. Article fifty-three covers technical
          model documentation, information for downstream integrators, a copyright policy and a sufficiently
          detailed public summary of training content. Qualifying open-source models have a limited exception
          from the first two duties, not from copyright policy or the public summary. That exception does not
          apply to models with systemic risk.
        hold: 0.7
        visual_cues:
          - id: gov-gpai-layer-b1
            phrase: Keep the general-purpose model layer visible below the application
            targets:
              - gpai-layer-mechanism
            color: blue
            linger: 0.6
          - id: gov-open-exception
            phrase: Qualifying open-source models have a limited exception from the first two duties
            targets:
              - gov-gpai-layer-mechanism
            color: cyan
            linger: 0.5
          - id: gov-systemic-override
            phrase: That exception does not apply to models with systemic risk
            targets:
              - gov-gpai-layer-mechanism
            color: cyan
            linger: 0.5
      - say: "Articles fifty-one and fifty-two address high-impact capabilities and Commission designation. More than
          ten to the twenty-fifth training FLOPs creates a presumption of high-impact capabilities, with an
          exceptional rebuttal procedure. It is not the only route: the Commission can designate a model based
          on equivalent capabilities or impact under the specified criteria. Being below the compute threshold
          alone does not prove the model is outside systemic-risk duties."
        hold: 0.7
        visual_cues:
          - id: gov-gpai-layer-b2
            phrase: Articles fifty-one and fifty-two address high-impact capabilities and Commission designation
            targets:
              - gpai-layer-mechanism
            color: blue
            linger: 0.6
          - id: gov-compute-presumption
            phrase: More than ten to the twenty-fifth training FLOPs creates a presumption of high-impact capabilities,
              with an exceptional rebuttal procedure
            targets:
              - gov-gpai-layer-mechanism
            color: cyan
            linger: 0.5
          - id: gov-commission-route
            phrase: the Commission can designate a model based on equivalent capabilities or impact under the specified
              criteria
            targets:
              - gov-gpai-layer-mechanism
            color: cyan
            linger: 0.5
      - say: Article fifty-five adds state-of-the-art model evaluation and documented adversarial testing, assessment
          and mitigation of Union-level systemic risks, serious-incident reporting and cybersecurity. Known or
          estimated training energy consumption belongs in Annex eleven documentation under Article
          fifty-three; that is not a separate energy-efficiency duty unique to systemic-risk models. The model
          provider's documentation helps an integrator, while the integrator still assesses its application's
          intended use, permissions and affected people.
        hold: 0.7
        visual_cues:
          - id: gov-gpai-layer-b3
            phrase: Article fifty-five adds state-of-the-art model evaluation and documented adversarial testing,
              assessment and mitigation of Union-level systemic risks, serious-incident reporting and
              cybersecurity
            targets:
              - gpai-layer-mechanism
            color: blue
            linger: 0.6
          - id: gov-energy-documentation
            phrase: Known or estimated training energy consumption belongs in Annex eleven documentation under Article
              fifty-three
            targets:
              - gov-gpai-layer-mechanism
            color: cyan
            linger: 0.5
  - id: dated-obligations
    title: A legal date belongs to one obligation
    visual: Parallel date rails keep prohibitions, general transparency, specific marking transitions, GPAI and
      the two high-risk routes separate; moving one date leaves the others fixed.
    beats:
      - say: Attach a legal-basis check date, source and required signoff to the workflow memo. Regulation twenty
          twenty-six slash seventeen forty-four entered into force on July twenty-seventh, twenty twenty-six.
          Under the amended schedule, Annex three high-risk rules apply from December second, twenty
          twenty-seven, and the Article six paragraph one product-related rules from August second, twenty
          twenty-eight. Each date sits on its own line in the release memo.
        hold: 0.7
        visual_cues:
          - id: dated-obligations-b1
            phrase: Attach a legal-basis check date, source and required signoff to the workflow memo
            targets:
              - dated-obligations-mechanism
            color: blue
            linger: 0.8
      - say: Article fifty transparency duties generally apply from August second, twenty twenty-six. Paragraph one
          concerns informing people of direct AI interaction, with conditions and exceptions including when it
          is obvious in context. Paragraph two concerns machine-readable marking and detection of synthetic
          outputs. Paragraph four gives deployers distinct rules for deepfakes and certain public-interest
          text, including its conditions and exceptions. The workflow determines which of these disclosures applies.
        hold: 0.7
        visual_cues:
          - id: dated-obligations-b2
            phrase: Article fifty transparency duties generally apply from August second, twenty twenty-six
            targets:
              - dated-obligations-mechanism
