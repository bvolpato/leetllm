            color: cyan
            linger: 0.5
      - say: The reviewer first reconstructs the original decision under the policy then in force. If the security
          review really was absent, uphold that hold and explain what evidence is needed. If a valid,
          authorized receipt already covered that exact proposal but the gate failed to read it, record a
          factual correction and assign the gate defect. The historical hold stays in the log. A later policy
          change is a new basis for a new decision, not a rewrite of Monday's facts.
        hold: 0.7
        visual_cues:
          - id: gov-appeal-replay-b2
            phrase: The reviewer first reconstructs the original decision under the policy then in force
            targets:
              - appeal-replay-mechanism
            color: blue
            linger: 0.6
          - id: gov-appeal-uphold
            phrase: If the security review really was absent, uphold that hold and explain what evidence is needed
            targets:
              - gov-appeal-replay-mechanism
            color: cyan
            linger: 0.5
          - id: gov-appeal-correct
            phrase: If a valid, authorized receipt already covered that exact proposal but the gate failed to read it,
              record a factual correction and assign the gate defect
            targets:
              - gov-appeal-replay-mechanism
            color: cyan
            linger: 0.5
      - say: A newly supplied approval can complete the current case only if it is authoritative, fresh, unrevoked and
          bound to the current candidate, environment, target, policy and evidence. Revalidate at the executor
          boundary so the proposal cannot change between check and effect. An appeal result or APPROVED FOR
          EXECUTOR is not an executed promotion. Record the actual effect separately; a lost response leaves
          an uncertain outcome that needs reconciliation before retry.
        hold: 0.7
        visual_cues:
          - id: gov-appeal-replay-b3
            phrase: A newly supplied approval can complete the current case only if it is authoritative, fresh, unrevoked
              and bound to the current candidate, environment, target, policy and evidence
            targets:
              - appeal-replay-mechanism
            color: blue
            linger: 0.6
          - id: gov-appeal-current
            phrase: authoritative, fresh, unrevoked and bound to the current candidate, environment, target, policy and
              evidence
            targets:
              - gov-appeal-replay-mechanism
            color: cyan
            linger: 0.5
          - id: gov-appeal-executor
            phrase: Revalidate at the executor boundary so the proposal cannot change between check and effect
            targets:
              - gov-appeal-replay-mechanism
            color: cyan
            linger: 0.5
          - id: gov-appeal-uncertain
            phrase: a lost response leaves an uncertain outcome that needs reconciliation before retry
            targets:
              - gov-appeal-replay-mechanism
            color: cyan
            linger: 0.5
      - say: Effective oversight gives people time, evidence, expertise and authority to disagree, override within
          their remit or halt safely. Article fourteen for covered high-risk systems addresses understanding
          limitations, automation bias, interpreting output, overriding it and safe intervention. A person's
          name on an org chart does not supply those abilities. Appeal outcomes can point to bad data, unclear
          policy, missing evidence or an explanation that needs repair.
        hold: 0.7
        visual_cues:
          - id: gov-appeal-replay-b4
            phrase: Effective oversight gives people time, evidence, expertise and authority to disagree, override within
              their remit or halt safely
            targets:
              - appeal-replay-mechanism
            color: blue
            linger: 0.6
          - id: gov-oversight-authority
            phrase: time, evidence, expertise and authority to disagree, override within their remit or halt safely
            targets:
              - gov-appeal-replay-mechanism
            color: cyan
            linger: 0.5
      - say: "The local appeal is an organizational control. Article eighty-six has a narrower legal scope: a deployer
          decision based on an Annex three high-risk system, excluding point two, must produce legal or
          similarly significant effects considered adverse to health, safety or fundamental rights. The right
          concerns a clear, meaningful explanation of the AI role and main decision elements, subject to
          lawful exceptions or restrictions and only where that right is not otherwise provided by Union law.
          Assess its applicability separately; our promotion case does not automatically establish it."
        hold: 0.7
        visual_cues:
          - id: gov-appeal-replay-b5
            phrase: The local appeal is an organizational control
            targets:
              - appeal-replay-mechanism
            color: blue
            linger: 0.6
          - id: gov-appeal-legal-scope
            phrase: a deployer decision based on an Annex three high-risk system, excluding point two, must produce legal
              or similarly significant effects considered adverse to health, safety or fundamental rights
            targets:
              - gov-appeal-replay-mechanism
            color: cyan
            linger: 0.5
  - id: package
    title: Which configuration did the reviewers see?
    visual: >-
      The host reads a six-field manifest. Eight review slots share a recorded digest. A missing dataset record, findings, and required legal signoff have separate places on the sheet. One policy change leaves the signed sheet intact while the current digest changes.
    beats:
      - say: >-
          Here is the deployment file the team is reviewing for C seventeen. Read the sheet on the right. We have a workflow memo, a risk row and a system card. The dataset record is missing. Without it, how could the reviewer tell which cases and labels produced the score? The audit replay, red-team report, accessibility report and oversight runbook are present. One unsafe effect and one accessibility finding also remain open. The reviewer has three things to follow up.
        hold: 0.8
        visual_cues:
          - id: gov-draft-artifacts
            phrase: "The dataset record is missing"
            targets: [review-sheet]
            linger: 0.25
          - id: gov-draft-findings
            phrase: "One unsafe effect and one accessibility finding"
            targets: [package-checks]
            linger: 0.25
      - say: >-
          The data owner supplies the reviewed dataset record. The retest closes both findings. Required legal signoff is on file. Each accepted review names C seventeen and the digest of its deployment manifest. All eight now match. This package is eligible for release approval. Keep the signed sheet. On the left, change only policy G seven to G eight. The candidate, model, prompt, tools, evaluation and environment stay the same. Can the release reviewer use the eight signatures on the right for the configuration on the left?
        hold: 2.1
        visual_cues:
          - id: gov-package-dataset
            phrase: "supplies the reviewed dataset record"
            targets: [review-sheet]
            linger: 0.25
          - id: gov-package-close-findings
            phrase: "The retest closes both findings"
            targets: [package-checks]
            linger: 0.25
          - id: gov-package-eligible
            phrase: "This package is eligible for release approval"
            targets: [package-checks]
            linger: 0.25
            caption_boundary: true
          - id: gov-package-edit
            phrase: "change only policy G seven to G eight"
            targets: [current-manifest]
            linger: 0.25
      - say: >-
          The manifest digest changes, and the old reviews stop matching. All eight still describe the earlier deployment. Keep that sheet as the record for G seven. Collect and review the affected evidence for G eight, then check the package again.
        hold: 0.8
        visual_cues:
          - id: gov-package-changed
            phrase: "The manifest digest changes, and the old reviews stop matching"
            targets: [manifest-and-reviews, package-checks]
            linger: 0.25
            caption_boundary: true
      - say: >-
          In this example the reviews came from trusted reviewers. A digest lets us match their decisions to particular inputs. Someone still has to verify who made those decisions. A clean finding count and a successful replay each answer a question. Neither supplies the missing reviews.
        hold: 0.8
        visual_cues:
          - id: gov-package-reviewer-identity
            phrase: "verify who made those decisions"
            targets: [review-sheet]
            linger: 0.25
  - id: earned-transfer
    title: What can the executor do with C29?
    visual: >-
      The original receipt ruler returns with C29. The target mark moves from 10% to 15%. Both signed marks stay at 10%. Deployment evidence still matches its unchanged manifest. The executor decision and observed effects remain distinct.
    beats:
      - say: >-
          Take a new file. Candidate C twenty-nine has eight accepted deployment reviews. Release and security both signed for ten percent of traffic. The untrusted evaluation note is still there. Our rule adds exception review above ten percent. Now the owner asks for fifteen percent. That's the only edit. Can the two receipts in the file authorize this request, and who needs to sign?
        hold: 2.2
        caption_starts:
          - "Now the owner asks for fifteen percent"
          - "Can the two receipts in the file"
        visual_cues:
          - id: gov-fresh-signed
            phrase: "Release and security both signed for ten percent of traffic"
            targets: [receipt-lines]
            linger: 0.25
          - id: gov-fresh-target
            phrase: "the owner asks for fifteen percent"
            targets: [request-file]
            linger: 0.25
      - say: >-
          They cannot. Look where the signed marks end. Both reviewers approved ten percent. The gate compares the whole request with the one each person signed. The exact proposal binding changes, and fifteen is above ten, so our local rule also requires exception review. Release, security and exception must each sign for fifteen. The software manifest stayed the same, so its eight evidence reviews still match that configuration. Check what those reviews cover and whether they set a rollout limit.
        hold: 0.8
        caption_starts:
          - "Release, security and exception must each sign for fifteen"
        visual_cues:
          - id: gov-fresh-cannot
            phrase: "They cannot"
            targets: [gate-record]
            linger: 0.25
            caption_boundary: true
          - id: gov-fresh-binding-and-exception
            phrase: "The exact proposal binding changes, and fifteen is above ten, so our local rule also requires exception review"
            targets: [receipt-lines]
            linger: 0.25
            caption_boundary: true
          - id: gov-fresh-manifest
            phrase: "its eight evidence reviews still match that configuration"
            targets: [deployment-record]
            linger: 0.25
      - say: >-
          The owner appeals. An independent reviewer reads the target on each receipt. Both say ten percent. The reviewer upholds the hold and adds the reason to the file. The effect record shows zero traffic changes. Release, security and the exception reviewer each need to sign for fifteen percent. The executor checks those signatures again just before it can act.
        hold: 1.2
        caption_starts:
          - "Both say ten percent"
          - "Release, security and the exception reviewer each need to sign for fifteen percent"
        visual_cues:
          - id: gov-fresh-appeal
            phrase: "The reviewer upholds the hold and adds the reason to the file"
            targets: [gate-record]
            linger: 0.25
            caption_boundary: true
          - id: gov-fresh-effect
            phrase: "The effect record shows zero traffic changes"
            targets: [gate-record]
            linger: 0.25
            caption_boundary: true
          - id: gov-fresh-next
            phrase: "Release, security and the exception reviewer each need to sign for fifteen percent"
            targets: [receipt-lines]
            linger: 0.25
