          Follow these five test requests all the way to the recorded effect. The first three asked for a change the gate should stop. Trace A three ends with a forbidden promotion. The other two requests were eligible. The gate wrongly blocked R two. One forbidden effect is enough to hold release. One false rejection out of two also exceeds this suite's ten-percent ceiling. The release owner now has two different failures to investigate.
