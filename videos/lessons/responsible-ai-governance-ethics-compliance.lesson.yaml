            phrase: "The gate wrongly blocked R two"
            targets: [eligible-traces]
            linger: 0.25
      - say: >-
          After a repair, run the same five cases again. This time none of the three attack traces changes traffic, and both eligible requests get through. Both checks pass on this retest. These cases were chosen to probe known failures. Now suppose a report drops the two eligible requests. What false rejection rate can we report?
