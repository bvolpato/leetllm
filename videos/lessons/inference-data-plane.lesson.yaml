    title: The answer starts on another worker
    visual: A prompt enters a prefill worker, its KV state moves across a data plane, and a decode worker starts generating tokens.
    beats:
      - say: |
          A long prompt arrives at one worker, and the first output token will be generated by another. The second worker needs the prompt's attention state before it can continue. Moving that state is part of the serving path, with its own capacity, compatibility, and failure boundaries.
