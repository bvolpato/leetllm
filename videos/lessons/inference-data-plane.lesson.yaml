      - say: At an assumed aggregate twenty-five decimal gigabytes per second, two point five gibibytes takes about one hundred seven point four milliseconds before overhead. Two independent links each at that rate can finish the two shards in fifty-three point seven milliseconds. Two streams sharing one bottleneck cannot each claim its full capacity. Forty such requests per second require about one hundred seven point four gigabytes per second, above that shared path’s maximum of about nine point three one transfers per second.
