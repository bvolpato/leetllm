            phrase: Which batch should the replacement workers read first
            targets: [restart-choice]
            linger: 0.25
        caption_starts:
          - Now the workers lose power
          - Which batch should
      - say: Start at A. Those five batches left gradients in memory. The crash wiped them out. Each batch held eight
          examples, so starting at F would skip forty examples. Replay A through E and their gradients count toward the next update.
        hold: 1.2
        visual_cues:
