  - id: adam-first-step
    title: What did the optimizer remember?
    visual: A continuation packet is compared with an inference export. Two scalar gradients are measured against one
      fixed learning-rate limit. A magnified plot compares full and reset-moment continuations.
    beats:
      - say: When a loader opens this file, ask what it was saved for. With compatible weights you can start a new run. A
          fresh optimizer starts its moments at zero. A new sampler can replay the first examples while the schedule
          starts warmup again. To continue this run, bring back the architecture, weights, optimizer moments and
          counters, schedule, consumed cursor, random streams and any scaler. For adapters, use the correct frozen
          base and adapter configuration. A merged export can serve predictions. You need the original training state
          to continue tuning the adapters. A change in kernels or topology can also affect bitwise replay.
        hold: 0.5
        visual_cues:
          - id: adam-first-step-step-1
            phrase: what it was saved for
            targets:
              - adam-first-step-mechanism
            linger: 0.4
      - say: Now reset the step counter as well as the moments. On the first gradient, bias correction gives you the
          gradient and its square. Take the square root of that corrected second moment. You get the absolute
          gradient. Add epsilon to form the denominator. Multiply the gradient by the learning rate and divide by
          that denominator. Subtract the result from the weight. This adaptive move has magnitude at most the
          learning rate. Try a rate of point zero zero two. With a gradient one tenth as large as epsilon, the
          fraction is one eleventh. The move is about point zero zero zero one eight two. With a gradient a hundred
          times as large as epsilon, the move approaches the learning rate. This calculation leaves weight decay
          separate.
