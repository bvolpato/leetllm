  - id: deadline
    title: Will the warning last long enough?
    visual: A proportional time strip starts at the warning. Its end is compared with two grace periods using the
      article’s can_finish predicate. Feasibility and publication remain distinct.
    beats:
      - say: Go back to the warning just after E. All workers are still healthy. The last three rounds and the weight
          update take twenty seconds. Saving through publication takes ninety. Reserve ten seconds for jitter. The
          warning gives us two minutes. With those estimates, would you attempt the save?
        hold: 2.4
        visual_cues:
          - id: deadline-window
            phrase: The last three rounds and the weight update take twenty seconds
            targets:
              - path
            linger: 0.25
          - id: deadline-save
            phrase: Saving through publication takes ninety
            targets:
              - path
            linger: 0.25
          - id: deadline-margin
            phrase: Reserve ten seconds for jitter
            targets:
              - path
            linger: 0.25
      - say: Yes. Twenty plus ninety plus ten is exactly one hundred twenty seconds. That passes the time check. The old
          checkpoint stays published until the new files pass their checks and the pointer moves.
        hold: 1.2
      - say: Keep all three costs. Shorten the warning by one second. Does the same plan still fit?
        hold: 2.2
        visual_cues:
