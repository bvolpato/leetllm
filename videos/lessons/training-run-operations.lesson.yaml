  - id: interval-and-reliability
    title: How much work lies between saves?
    visual: Two compute intervals share a ninety-second blocking save. Historical interruptions and the simplified
      device failure model use separate panels.
    beats:
      - say: What if nobody warns you? Suppose the job saves every five minutes of compute. Three minutes after the last
          save, a node loses power. You lose those three minutes. Periodic checkpoints give the launcher somewhere to
          go even on abrupt failure. The interval determines how much work can be exposed before the next
          publication.
        hold: 0.5
        visual_cues:
          - id: interval-exposed
            phrase: Three minutes after the last save
            targets:
              - interval-and-reliability-mechanism
            linger: 0.25
          - id: interval-cut
            phrase: a node loses power
            targets:
              - interval-and-reliability-mechanism
            linger: 0.25
      - say: A blocking save costs ninety seconds here. Save after five minutes of compute, and you spend ninety of three
          hundred ninety seconds saving. That’s twenty-three point one percent. Wait twenty minutes, and ninety out
          of twelve hundred ninety is about seven percent. You save less often and risk more replay. With an
          asynchronous upload, work done before publication is still exposed. Measure staging time, upload time,
          throughput and how often your job stops.
        hold: 0.5
        visual_cues:
          - id: interval-and-reliability-step-2
            phrase: twenty-three point one percent
            targets:
              - interval-and-reliability-mechanism
            linger: 0.4
          - id: interval-first
            phrase: twenty-three point one percent
            targets:
              - interval-and-reliability-mechanism
            linger: 0.35
          - id: interval-second
            phrase: about seven percent
            targets:
              - interval-and-reliability-mechanism
            linger: 0.35
      - say: The Llama Three team recorded four hundred nineteen unexpected interruptions and forty-seven planned ones in
          fifty-four days. Configurations reached sixteen thousand three hundred eighty-four H one hundreds. For a
          simple estimate, suppose identical devices fail independently at a constant rate and any failure stops the
          job. Their rates add, so divide a device’s mean time between failures by device count. Shared power,
          network and software failures break those assumptions. Use your own interruption record to set an interval.
        hold: 0.65
        visual_cues:
          - id: interval-and-reliability-step-3
            phrase: identical devices fail independently at a constant rate
            targets:
              - interval-and-reliability-mechanism
            linger: 0.4
          - id: interval-history
            phrase: four hundred nineteen unexpected interruptions and forty-seven planned ones
            targets:
              - interval-and-reliability-mechanism
            linger: 0.35
