  - id: checkpoint-ownership
    title: When does a snapshot stop changing?
    visual: Two references point to the same scalar storage and a deep copy retains its original value. A staged copy
      and a validated manifest have different completion points.
    beats:
      - say: Start with a weight of one. Its state dictionary points to the same storage. A deep copy gets its own storage.
          Take one step of gradient descent on the square of the weight. The gradient is two. A learning rate of one
          tenth brings the live weight to point eight. Read it through the dictionary and you see point eight again.
          The deep copy still reads one. It’s independent in memory. Making that copy on a GPU can require a second
          allocation there.
        hold: 0.5
        visual_cues:
          - id: checkpoint-ownership-step-1
            phrase: deep copy still reads one
            targets:
              - checkpoint-ownership-mechanism
            linger: 0.4
          - id: snapshot-alias
            phrase: state dictionary points to the same storage
            targets:
              - checkpoint-ownership-mechanism
            linger: 0.35
          - id: snapshot-copy
            phrase: deep copy gets its own storage
            targets:
              - checkpoint-ownership-mechanism
            linger: 0.35
          - id: snapshot-update
            phrase: A learning rate of one tenth
            targets:
              - checkpoint-ownership-mechanism
            linger: 0.35
          - id: snapshot-value
            phrase: brings the live weight to point eight
            targets:
              - checkpoint-ownership-mechanism
            linger: 0.35
      - say: A large job stages its copy on the host. With PyTorch’s standard asynchronous save, staging can block before
          the call returns a storage future. The optional Default Stager introduced in version two point nine can
          copy on a background CPU thread. Wait for staging to finish before changing any value it’s copying. Even a
          forward pass can change a buffer, and fetching data can move a random stream. Capture the cursor with the
          tensors. The stable copy can upload while training moves on. Handle errors from both futures, limit pending
          saves and close the stager.
        hold: 0.5
        visual_cues:
          - id: checkpoint-ownership-step-2
            phrase: Wait for staging to finish
            targets:
              - checkpoint-ownership-mechanism
            linger: 0.4
          - id: snapshot-background
            phrase: copy on a background CPU thread
            targets:
              - checkpoint-ownership-mechanism
            linger: 0.35
          - id: snapshot-wait
            phrase: before changing any value
            targets:
              - checkpoint-ownership-mechanism
            linger: 0.35
          - id: snapshot-upload
            phrase: The stable copy can upload while training moves on
            targets:
              - checkpoint-ownership-mechanism
            linger: 0.25
      - say: Give this save its own name. Its manifest lists the expected files and their sizes or hashes, all from one
          boundary. Validate every artifact before changing the latest pointer. On a filesystem that supports atomic
          replacement, synchronize the file and directory for crash durability. Cloud Storage writes each object
          atomically. Use a generation-match condition on the pointer so a competing writer can’t overwrite it
          unnoticed. A loader checks the published packet again.
        hold: 0.65
        visual_cues:
          - id: checkpoint-ownership-step-3
            phrase: Validate every artifact
            targets:
              - checkpoint-ownership-mechanism
            linger: 0.4
          - id: snapshot-artifacts
            phrase: lists the expected files
            targets:
              - checkpoint-ownership-mechanism
            linger: 0.35
          - id: snapshot-publish
            phrase: before changing the latest pointer
            targets:
              - checkpoint-ownership-mechanism
            linger: 0.35
  - id: durable
    title: Which update can a new worker load?
    visual: Live and frozen update counters diverge. Two possible writes start from three validated shards. Only one
      row acquires its fourth shard and publishes the new pointer.
    beats:
      - say: Suppose the workers finish update eighteen forty-one. Hold its weights, buffers and data state still while the
          host makes a copy. Once that copy is stable, training takes another step. Watch the consumed count on the
          left. The host copy on the right still belongs to eighteen forty-one. That’s the copy that gets uploaded.
        hold: 1
        visual_cues:
          - id: durable-stage
            phrase: Once that copy is stable
            targets:
              - snapshot
            linger: 0.25
          - id: durable-live
            phrase: training takes another step
            targets:
              - snapshot
            linger: 0.25
      - say: The manifest expects four shards. Three reach storage and pass their checks. The host copy still exists, and
          training has already moved on. If the fourth write fails and the workers disappear, which update can their
          replacements load?
        hold: 2.7
        visual_cues:
          - id: durable-three
            phrase: Three reach storage and pass their checks
            targets:
              - manifest
            linger: 0.25
      - say: Eighteen forty. Follow the interrupted write along the top row. Its last shard is missing. In the second row,
          the fourth shard passes. Check the manifest and the rest of the application state, then publish the new
          pointer. Only now can the replacements load eighteen forty-one with its matching cursor. Readers validate
          that packet again when they open it.
        hold: 1.2
        visual_cues:
          - id: durable-fork
            phrase: Eighteen forty. Follow the interrupted write
            targets:
              - manifest
            linger: 0.25
            caption_boundary: true
          - id: durable-fourth
            phrase: the fourth shard passes
            targets:
