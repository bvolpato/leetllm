  - id: replicas
    title: How many examples did the workers read?
    visual: Each cell contains two sequences shared by a GPU pair. Completed columns drive the count. A second layout
      doubles the pairs and fills four columns to meet the same total.
    beats:
      - say: Look down column A. GPUs zero and one split the model between them. They work on the same two sequences. Each
          of the other three pairs gets two sequences of its own. Fill one round across the four pairs. That's eight
          sequences. Each pair is one independent replica.
        hold: 1
        visual_cues:
          - id: replicas-one-round
            phrase: Fill one round across the four pairs
            targets:
              - mesh
              - sequence-count
            linger: 0.25
        caption_starts:
          - That's eight sequences
      - say: Carry the count forward to the end of round E. Forty sequences have contributed gradients. Finish F, G and H.
          Now all sixty-four belong to one update. Counting both GPUs in each pair separately would count each
          sequence twice.
        hold: 1
        visual_cues:
          - id: replicas-five
            phrase: Carry the count forward to the end of round E
            targets:
              - mesh
              - sequence-count
            linger: 0.25
          - id: replicas-eight
