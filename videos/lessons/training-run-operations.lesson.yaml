    title: Eight batches make one weight update
    visual: The fifth batch drops into an eight-batch accumulation window. Power loss clears the gradients in memory while the checkpoint on disk stays put. The replacement worker replays the lost batches.
    beats:
      - say: Batch E just landed. Five batches read, three to go before the weights change. Now the workers lose power.
          The weights on disk are still the ones from before A. Which batch should the replacement workers read first, A or F?
        hold: 2.7
        visual_cues:
          - id: intro-five
            phrase: Five batches read
            targets: [live-window]
            linger: 0.25
          - id: first-power-loss
            phrase: the workers lose power
            targets: [worker-status]
            color: pink
            linger: 0.25
