            phrase: Warmup ends after fifty successful updates
            targets:
              - batch-and-schedule-mechanism
            linger: 0.25
      - say: Would you double the learning rate too? Goyal and colleagues studied linear scaling with warmup for
          large-batch gradient descent on ResNet. Adam uses different state. For a batch multiplier called kappa,
          Malladi and colleagues propose multiplying the learning rate by the square root of kappa. Divide epsilon by
          the same factor. For each beta, multiply its distance from one by kappa, then subtract from one. Check that
          both coefficients remain valid. The rule assumes a particular noise and moment model. Compare it with a
          fixed rate at the same data budget. Gradient-noise scale, the covariance trace over the squared mean
          gradient norm, estimates useful batch sizes in studied settings. Wall time also depends on kernels and
