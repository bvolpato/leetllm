  - id: storage-topology-contract
    title: How many bytes must the reader hold?
    visual: A 700 GB host-memory floor precedes a two-coordinate request from an eight-coordinate serialized source tensor.
    beats:
      - say: Gather a seventy-billion-parameter model on one host. Its two-byte weights take one hundred forty decimal
          gigabytes. Each four-byte Adam moment takes twice as much. The two moments and the weights alone need seven
          hundred gigabytes. Master weights and buffers add to that floor. Check RAM and transfer time at the
          destination before you choose a consolidated save.
        hold: 0.5
