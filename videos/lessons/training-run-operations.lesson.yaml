          split a sequence. All three cooperate on the same examples. Divide sixty-four GPUs by two times two times
          two. That leaves eight independent replicas. Each takes two sequences per round for four rounds, giving
          sixty-four sequences per complete update. This division assumes distinct axes. Check the actual groups in
          an overlapping expert or hybrid mesh. Count shifted, unmasked targets separately.
