            linger: 0.25
      - say: No. At one hundred nineteen seconds, the estimated save leaves nine seconds of margin. The plan requires ten.
          Use the published eighteen forty and its matching consumed count. Saving only the new cursor would skip A
          through E on restart.
        hold: 1.2
        visual_cues:
