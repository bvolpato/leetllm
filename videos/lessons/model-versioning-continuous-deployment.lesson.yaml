scenes:
  - id: opening
    title: "What time will the next ticket show?"
    visual: >-
      A train ticket slides out of the printer with 17:30 on it. Change the template in Git to
      twelve-hour time and reprint from the running worker. Load the retained release and print
      once more. Each reprint leaves its time and serving release beside the ticket.
    beats:
      - say: >-
          The travel assistant prints seventeen thirty on your ticket. You switch the template in
          Git back to twelve-hour time. Look at the running worker. What time will the next ticket show?
        hold: 2.15
        caption_starts: ["You switch the template", "What time will the next ticket show"]
        visual_cues:
          - id: revert-template
            phrase: "switch the template in Git back to twelve-hour time"
            targets: [release-state]
            color: yellow
      - say: >-
          Print it again. Seventeen thirty. Release two is still running the template packed in its
          image. Load release one, with its image and compiled template together. Print the same
          departure. Five thirty P M. Both releases use the same model. The serving trace tells you
          which bundle printed each ticket.
        hold: 1.0
        caption_starts: ["Seventeen thirty", "Five thirty P M", "Both releases use the same model"]
        visual_cues:
          - id: print-again
            phrase: "Print it again"
            targets: [ticket-printer]
            color: cyan
          - id: reveal-current
            phrase: "Seventeen thirty"
            targets: [ticket-printer]
            color: cyan
          - id: load-stable
            phrase: "Load release one, with its image and compiled template together"
            targets: [release-state]
            color: blue
            caption_boundary: true
          - id: print-stable
            phrase: "Print the same departure"
            targets: [ticket-printer]
            color: blue
            caption_boundary: true
          - id: reveal-stable
            phrase: "Five thirty P M"
            targets: [ticket-printer]
            color: blue
          - id: read-trace
            phrase: "The serving trace tells you which bundle printed each ticket"
            targets: [serving-trace]
            color: green
            caption_boundary: true
  - id: identity
    title: Hash retained bytes and the canonical manifest
    visual: Retained prompt bytes and their computed hash stay beside one bundle object; a sentence edit
      replaces the prompt pin and complete release digest while other pins remain attached.
    beats:
      - say: A release bundle records the components that produce behavior. Here the model pin stays fixed,
          while prompt and runtime bytes differ. We hash those retained bytes and place their pins
          in a canonical manifest. Hashing that manifest gives the complete bundle its release
          identity. The other policy and evaluation pins stay attached to it.
        hold: 0.65
        visual_cues:
          - id: component-bytes
            phrase: prompt and runtime bytes differ
            targets:
              - prompt-bytes
              - release-bundle
            color: yellow
            linger: 0.5
          - id: hash-bundle
            phrase: complete bundle its release identity
            targets:
              - prompt-digest
              - release-bundle
            color: cyan
            linger: 0.5
      - say: Keep the candidate's original prompt beside its bundle. Watch one sentence change. The prompt
          hash changes with its bytes, and the complete release receives a new digest. Retain those
          bytes so this behavior can be restored. A hosted model also needs the provider's strongest
          version contract and its effective settings. We will keep the original candidate for the
          rollout.
        hold: 0.65
        visual_cues:
          - id: edit-prompt
            phrase: Watch one sentence change
            targets:
              - prompt-bytes
              - prompt-digest
              - release-bundle
            color: yellow
            linger: 0.5
          - id: restore-bytes
            phrase: Retain those bytes
            targets:
              - prompt-bytes
            color: blue
            linger: 0.5
        motion_check:
          region:
            - 130
            - 350
            - 1650
            - 485
          minimumChangedFraction: 0.002
  - id: bundle-contract
    title: "What did the worker load?"
    visual: >-
      Bind serving components together, test the router’s schema, and check an overwritten prompt
      against the retained digest. Canonical manifest bytes give the release its identity. The
      evaluation report refers back to that identity.
    beats:
      - say: >-
          Now take a deployment assistant. It looks for an approval record before it answers. Keep the model pin, tokenizer and template. Keep the compiled prompt and the
          build that produced it. A tool schema tells the assistant how to ask for evidence. The policy,
          corpus and index determine what it may use. Pin the retrieval settings, serving image and
          decoding configuration too. Now change the output schema. An answer can be correct and still
          fail when the router expects version two and the worker returns version three. The article’s
          thirteen fields are one application’s example.
        hold: 0.55
        visual_cues:
          - id: mv-bundle-contract-components
            phrase: "Pin the retrieval settings, serving image and decoding configuration too"
            targets: [bundle-contract-mechanism]
            color: cyan
            caption_boundary: true
          - id: mv-bundle-contract-schema
            phrase: "Now change the output schema"
            targets: [bundle-contract-mechanism]
            color: pink
            caption_boundary: true
      - say: >-
          Here’s the file the worker loads. Its name matches the manifest. Overwrite that file in place.
          The name still matches, but look at the two digests now. At startup, compare the loaded bytes
          with the retained pin. Reject that worker when they differ. Restore the pinned bytes, or
          register the changed bytes in a new bundle and evaluate it. Once a worker has loaded the
          intended bundle, record its resolved release on each request. Data permissions and evidence
          that an evaluation actually ran need their own checks.
        hold: 0.7
        visual_cues:
          - id: mv-bundle-contract-overwrite
            phrase: "Overwrite that file in place"
            targets: [bundle-contract-mechanism]
            color: yellow
            caption_boundary: true
          - id: mv-bundle-contract-verify
            phrase: "compare the loaded bytes with the retained pin"
            targets: [bundle-contract-mechanism]
            color: pink
            caption_boundary: true
          - id: mv-bundle-contract-resolved
            phrase: "record its resolved release on each request"
            targets: [bundle-contract-mechanism]
            color: blue
            caption_boundary: true
      - say: >-
          To give two systems the same release ID, they must hash exactly the same bytes. The lab sorts
          JSON keys, removes optional whitespace, and hashes the UTF eight encoding. Store the
          evaluation report separately. It can name the finished release and have its own digest.
          Putting a report containing the release ID inside the manifest would make the hash depend on
          itself. The screen shows a short prefix. The registry keeps the full digest.
        hold: 0.6
        visual_cues:
          - id: mv-bundle-contract-sort
            phrase: "sorts JSON keys, removes optional whitespace, and hashes the UTF eight encoding"
            targets: [bundle-contract-mechanism]
            color: cyan
            caption_boundary: true
          - id: mv-bundle-contract-report
            phrase: "Store the evaluation report separately"
            targets: [bundle-contract-mechanism]
            color: cyan
            caption_boundary: true
          - id: mv-bundle-contract-full
            phrase: "the full digest"
            targets: [bundle-contract-mechanism]
            color: cyan
            caption_boundary: true
  - id: provider-contract
    title: Retain a usable version as well as its name
    beats:
      - say: >-
          On Monday the provider sends your requests to version A. On Tuesday it moves the same alias
          to version B. Your application stayed on the same release. To track which model you used,
          pin the most specific version the provider documents and record your request settings.
          Check how long that version will be available.
        caption_starts: ["On Tuesday it moves"]
        visual_cues:
          - id: mv-provider-contract-alias
            phrase: moves the same alias to version B
            targets:
              - provider-contract-mechanism
            color: cyan
            linger: 0.5
      - say: >-
          Send one saved input three times. Two replies match and one differs. A change in the
          provider’s runtime can affect replies even at temperature zero. When a version or setting
          changes, test it as a new candidate and repeat the regression cases. Before a rollback,
          check that the stable endpoint still accepts requests. Here the provider has retired it.
        caption_starts: ["Two replies match", "Here the provider has retired it"]
        visual_cues:
          - id: mv-provider-contract-variable
            phrase: Two replies match and one differs
            targets:
              - provider-contract-mechanism
            color: cyan
            linger: 0.5
          - id: mv-provider-contract-retired
            phrase: the provider has retired it
            targets:
              - provider-contract-mechanism
            color: pink
            linger: 0.5
      - say: >-
          The article’s registry checks the previous target before it moves a pointer. Follow
          production from stable to candidate and back. Someone who checks the target sees stable
          both times. Add a revision number and the two visits are easy to tell apart. In production,
          authorize the writer, compare the target and revision in one atomic update, and keep a
          durable record of the change.
        visual_cues:
          - id: mv-provider-contract-revision
            phrase: Add a revision number
            targets:
              - provider-contract-mechanism
            color: cyan
            linger: 0.5
          - id: mv-provider-contract-atomic
            phrase: compare the target and revision in one atomic update
            targets:
              - provider-contract-mechanism
            color: cyan
            linger: 0.5
    visual: A fictional hosted identifier remains beside effective settings and an availability
      timeline. A retirement removes the stable endpoint from usable recovery. Compare the
      sequential article pointer with the explicit expected-target/revision movie model.
  - id: registry
    title: Artifacts stay fixed while pointers gain revisions
    visual: Revisioned alias cards connect to retained bundle objects. Actual compare-and-swap events
      move production away and back, then reject an obsolete generation.
    beats:
      - say: Register both bundles as immutable records. Production still points to stable; the canary
          pointer names candidate. Registration makes an artifact addressable. A pointer update
          changes which registered artifact is selected. Each update carries the expected current
          target and revision, so a controller can detect a decision made against old state.
        hold: 0.65
        visual_cues:
          - id: immutable-bundles
            phrase: immutable records
            targets:
              - release-bundle
            color: cyan
            linger: 0.5
          - id: alias-selection
            phrase: pointer update changes which registered artifact is selected
            targets:
              - production-pointer
              - canary-pointer
            color: yellow
            linger: 0.5
      - say: Production moves to candidate, then returns to stable. The target looks familiar, but the
          revision has advanced. An old writer still expects the original revision. Its update is
          rejected. In a production registry, perform that comparison atomically, authenticate the
          writer, and retain the transition record.
        hold: 0.65
        visual_cues:
          - id: promote-production
            phrase: Production moves to candidate
            targets:
              - production-pointer
              - release-bundle
            color: cyan
            linger: 0.5
          - id: restore-stable
            phrase: returns to stable
            targets:
              - production-pointer
            color: green
            linger: 0.5
          - id: reject-stale-writer
            phrase: update is rejected
            targets:
              - registry-verdict
            color: pink
            linger: 0.5
          - id: mv-registry-expected
            phrase: An old writer still expects the original revision
            targets:
              - registry-mechanism
            color: cyan
            linger: 0.5
        motion_check:
          region:
            - 150
            - 330
            - 1640
            - 650
          minimumChangedFraction: 0.002
  - id: gate-arithmetic
    title: Compute route quality and check the critical slice separately
    beats:
      - say: Count serving the answer as the positive decision. A true positive serves a supported request, a
          false positive serves an unsupported one, and a false negative abstains on a supported
          request. Route F one is two times true positives divided by two times true positives plus
          false positives plus false negatives. It measures the routing decision. A separate
          claim-support review must check the generated answer.
        visual_cues:
          - id: mv-gate-arithmetic-positive
            phrase: A true positive serves a supported request
            targets:
              - gate-arithmetic-mechanism
            color: cyan
            linger: 0.5
          - id: mv-gate-arithmetic-false
            phrase: a false positive serves an unsupported one
            targets:
              - gate-arithmetic-mechanism
            color: cyan
            linger: 0.5
          - id: mv-gate-arithmetic-negative
            phrase: a false negative abstains on a supported request
            targets:
              - gate-arithmetic-mechanism
            color: cyan
            linger: 0.5
          - id: mv-gate-arithmetic-formula
            phrase: two times true positives plus false positives plus false negatives
            targets:
              - gate-arithmetic-mechanism
            color: cyan
            linger: 0.5
      - say: "Use a separate supplied worksheet: ninety true positives, five false positives and ten false
          negatives. Numerator one hundred eighty; denominator one hundred ninety-five; F one is
          twelve thirteenths, about point nine two three. That clears a point nine two average floor
          but the five unsupported serves still violate this exercise’s zero-count safety rule. A
          good average cannot cancel a critical failure."
        visual_cues:
          - id: mv-gate-arithmetic-counts
            phrase: ninety true positives, five false positives and ten false negatives
            targets:
              - gate-arithmetic-mechanism
            color: cyan
            linger: 0.5
          - id: mv-gate-arithmetic-numerator
            phrase: Numerator one hundred eighty
            targets:
              - gate-arithmetic-mechanism
            color: cyan
            linger: 0.5
          - id: mv-gate-arithmetic-denominator
            phrase: denominator one hundred ninety-five
            targets:
              - gate-arithmetic-mechanism
            color: cyan
            linger: 0.5
          - id: mv-gate-arithmetic-f1
            phrase: about point nine two three
            targets:
              - gate-arithmetic-mechanism
            color: cyan
            linger: 0.5
          - id: mv-gate-arithmetic-safety
            phrase: five unsupported serves still violate this exercise’s zero-count safety rule
            targets:
              - gate-arithmetic-mechanism
            color: pink
            linger: 0.5
      - say: The frozen reference gate also requires rollback-slice F one at least point nine, two hundred
          cases with complete support and latency coverage, report age from zero through twenty-four
          hours, and p ninety-five at most five hundred milliseconds. Missing, future-dated or
          timezone-free reports fail. Include terminal errors and timeouts in the latency
          population. Pin the suite, evaluator and schema before comparing any threshold.
        visual_cues:
          - id: mv-gate-arithmetic-limits
            phrase: p ninety-five at most five hundred milliseconds
            targets:
              - gate-arithmetic-mechanism
            color: cyan
            linger: 0.5
          - id: mv-gate-arithmetic-missing
            phrase: Missing, future-dated or timezone-free reports fail
            targets:
              - gate-arithmetic-mechanism
            color: cyan
            linger: 0.5
          - id: mv-gate-arithmetic-errors
            phrase: Include terminal errors and timeouts in the latency population
            targets:
              - gate-arithmetic-mechanism
            color: cyan
            linger: 0.5
    visual: Supported serves, unsupported serves and supported abstentions build 90/5/10 counters.
      Construct 180/195 F1, then retain the five critical failures as a separately failing
      zero-count gate beside the exact coverage/age/slice contract.
  - id: trace-replay
    title: "Replay the approval request"
    visual: >-
      Reproduce the incident with its supplied false support label. Run the stable and candidate rules
      on that same label. In a separate replay harness, a version-seven result travels only to the
      matching tool invocation. Change the candidate argument to eight and hold the comparison open.
    beats:
      - say: >-
          Open request two oh five. The assistant said payment tests had approval to ship.
          The approval record was empty. Before testing the candidate, run the
          historical program. It serves the approval even with the support label set to false. That
          gives us a control. Without it, a clean candidate result could just mean we changed the test.
        hold: 0.8
        visual_cues:
          - id: mv-trace-replay-failure
            phrase: "run the historical program"
            targets: [trace-replay-mechanism]
            color: pink
            caption_boundary: true
      - say: >-
          Keep the question and its false support label fixed. Stable withholds the approval. Now try
          the candidate. It withholds too. The article checks that the model, corpus and evidence gate
          match. It runs a Boolean policy branch. The tool names, temperature and seed are recorded
          metadata. Testing generated answers would also require the request and evidence bytes, the
          actual program and recorded tool results.
        hold: 0.7
        visual_cues:
          - id: replay-stable-route
            phrase: "Stable withholds the approval"
            targets: [trace-replay-mechanism]
            color: blue
            caption_boundary: true
          - id: mv-trace-replay-results
            phrase: "It withholds too"
            targets: [trace-replay-mechanism]
            color: green
            caption_boundary: true
      - say: >-
          Here’s how to use a recorded tool result in a real replay. The trace contains a read of policy
          version seven. When the candidate asks for seven, give it the saved result. That keeps the
          evidence fixed and avoids repeating a production action. Now change just the candidate’s
          request to version eight. Can the harness use the result on the right?
        hold: 2.1
        visual_cues:
          - id: mv-trace-replay-match
            phrase: "give it the saved result"
            targets: [trace-replay-mechanism]
            color: green
            caption_boundary: true
          - id: mv-trace-replay-mismatch
            phrase: "change just the candidate’s request to version eight"
            targets: [trace-replay-mechanism]
            color: yellow
            caption_boundary: true
      - say: >-
          Stop the replay here. The tool name matches. Its argument doesn’t. Report the differing call
          and get an approved source for version eight before making that comparison. With variable
          model outputs, repeat the matched runs and compare failure rates. Add this incident to the
          regression suite. Passing it tells us what happened on this particular case.
        hold: 0.7
        visual_cues:
          - id: reject-tool-replay
            phrase: "Stop the replay here"
            targets: [trace-replay-mechanism]
            color: pink
            caption_boundary: true
  - id: offline
    title: Evaluation evidence must name this exact bundle
    visual: A supplied offline report clears numerical thresholds and declared contract checks; an
      evaluator mismatch rejects the same strong metrics.
    beats:
      - say: The supplied offline report names this candidate and its evaluation contract. Match those
          identities first, then inspect coverage, quality, safety, and latency. The values on
          screen clear the exercise thresholds. Eligibility comes from comparing this evidence with
          the bundle and policy.
        hold: 0.65
        visual_cues:
          - id: report-identity
            phrase: Match those identities first
            targets:
              - evaluator-identity
              - release-bundle
            color: cyan
            linger: 0.5
          - id: report-metrics
            phrase: coverage, quality, safety, and latency
            targets:
              - coverage-evidence
              - quality-evidence
              - operational-evidence
            color: green
            linger: 0.5
          - id: offline-eligibility
            phrase: Eligibility comes from comparing this evidence with the bundle and policy
            targets:
              - offline-decision
            color: cyan
            linger: 0.5
      - say: Change only the evaluator identifier. The metrics stay fixed, but the identity check now
          rejects the report. A real evaluation pipeline must also retain authentic case results,
          reviewed labels, artifact integrity, and the runtime that executed them. Those records
          make the summary traceable.
        hold: 0.65
        visual_cues:
          - id: change-evaluator
            phrase: Change only the evaluator identifier
            targets:
              - evaluator-identity
              - offline-decision
            color: pink
            linger: 0.5
          - id: offline-rejection
            phrase: the identity check now rejects the report
            targets:
              - offline-decision
            color: cyan
            linger: 0.5
  - id: report-integrity
    title: "Which case is missing?"
    beats:
      - say: >-
          The report says all two hundred cases ran. Read the first five rows. Which case is missing?
        hold: 1.8
        caption_starts: ["Which case is missing"]
        visual_cues:
          - id: mv-report-integrity-claims
            phrase: Read the first five rows
            targets: [report-integrity-mechanism]
            color: cyan
      - say: >-
          Case three is missing. Case two was counted twice. Match the results to the expected case
          IDs and keep failures and timeouts in the count. Before the gate reads the totals, verify
          the report digest, who scored each case, what counted as support, and which runtime ran it.
        caption_starts: ["Case two was counted twice", "Before the gate reads the totals"]
        visual_cues:
          - id: mv-report-integrity-verify
            phrase: Case three is missing
            targets:
              - report-integrity-mechanism
            color: cyan
            linger: 0.5
          - id: mv-report-integrity-trust
            phrase: Before the gate reads the totals
            targets:
              - report-integrity-mechanism
            color: cyan
            linger: 0.5
      - say: Separate contract errors from numerical errors. A different evaluator, suite, schema or release
          makes otherwise strong numbers inapplicable. A missing metric is unknown. Reject booleans,
          numeric strings, negative values, not-a-number and infinity where finite measurements are
          required. If conversion to a float would overflow, reject the metric and keep the controller running.
        visual_cues:
          - id: mv-report-integrity-contract
            phrase: A different evaluator, suite, schema or release makes otherwise strong numbers inapplicable
            targets:
              - report-integrity-mechanism
            color: cyan
            linger: 0.5
          - id: mv-report-integrity-invalid
            phrase: Reject booleans, numeric strings, negative values, not-a-number and infinity where finite
              measurements are required
            targets:
              - report-integrity-mechanism
            color: pink
            linger: 0.5
          - id: mv-report-integrity-huge
            phrase: conversion to a float would overflow
            targets:
              - report-integrity-mechanism
            color: cyan
            linger: 0.5
      - say: Registration permits addressing a bundle. Passing this offline gate permits the next
          experiment. Moving a canary alias alone sends no requests. The router and exposure
          controller must actually admit traffic. These are different events, so record them
          separately instead of treating a green build or a newly registered artifact as production
          evidence.
        visual_cues:
          - id: mv-report-integrity-register
            phrase: Registration permits addressing a bundle
            targets:
              - report-integrity-mechanism
            color: cyan
            linger: 0.5
          - id: mv-report-integrity-eligible
            phrase: Passing this offline gate permits the next experiment
            targets:
              - report-integrity-mechanism
            color: cyan
            linger: 0.5
          - id: mv-report-integrity-router
            phrase: The router and exposure controller must actually admit traffic
            targets:
              - report-integrity-mechanism
            color: cyan
            linger: 0.5
    visual: Retain a report artifact, its digest and exact case IDs while claimed counters are compared
      with actual membership and missing observations. A changed evaluator and seven malformed
      metric types fail their distinct gates before a canary pointer can admit traffic.
  - id: shadow
    title: "Who gets the third reply?"
    visual: >-
      One lane carries stable replies to users. A separate lane sends sanitized candidate copies into
      two waiting slots. A third copy drops out of the queue. The admitted and missing counts come from
      the queue operation.
    beats:
      - say: >-
          A policy question comes in. Stable sends its reply to the user. We also give the candidate a
          minimized copy. Its answer goes to an evaluator. That second path is a shadow. To look up the
          policy, the worker needs the tool on its allowlist and a credential with permission to read
          it. Both checks pass for this lookup. Now try the deployment tool. The allowlist excludes it,
          and the credential only permits reads. The shadow worker can’t deploy anything.
        hold: 0.65
        visual_cues:
          - id: live-visible
            phrase: "Stable sends its reply to the user"
            targets: [shadow-paths]
            color: blue
            caption_boundary: true
          - id: mv-shadow-allow
            phrase: "Both checks pass for this lookup"
            targets: [shadow-paths]
            color: green
            caption_boundary: true
          - id: tool-authorization
            phrase: "Now try the deployment tool"
            targets: [shadow-paths]
            color: pink
            caption_boundary: true
      - say: >-
          Now three users ask for policy checks. Stable returns three replies. On the shadow path, both
          waiting slots start empty. Put the first copy in one slot. Put the second in the other. The
          next copy finds both slots occupied. That third comparison drops. The third user still got a
          reply from stable. We admitted two copies for evaluation. We have no candidate result for the
          one we dropped. Count that gap, keep the workers and their costs separate, and check completed
          answers against their evidence.
        hold: 0.8
        visual_cues:
          - id: stable-replies
            phrase: "Stable returns three replies"
            targets: [shadow-paths]
            color: blue
            caption_boundary: true
          - id: queue-arrivals
            phrase: "Put the first copy in one slot"
            targets: [shadow-paths]
            color: cyan
            caption_boundary: true
          - id: mv-shadow-two
            phrase: "Put the second in the other"
            targets: [shadow-paths]
            color: cyan
            caption_boundary: true
          - id: mv-shadow-third
            phrase: "That third comparison drops"
            targets: [shadow-paths]
            color: pink
            caption_boundary: true
  - id: shadow-evidence
    title: "Does agreeing make the answer right?"
    visual: >-
      Replace the ship identifier in the copied question, compare the two routes and check both against
      the same evidence label. Two counterexamples then isolate the tool allowlist from the scope on the
      shadow credential.
    beats:
      - say: >-
          In the article’s example, the worker replaces the ship number with a placeholder. Stable
          withheld approval. The simulated candidate withholds it too. Their routes agree, and the
          record supports withholding. The article computes those decisions from a supplied support
          label. It doesn’t generate either answer. Replacing this one pattern removes the ship number.
          Other identifiers and secrets would need their own handling.
        hold: 0.65
        visual_cues:
          - id: mv-shadow-evidence-redact
            phrase: "replaces the ship number with a placeholder"
            targets: [shadow-evidence-mechanism]
            color: cyan
            caption_boundary: true
          - id: mv-shadow-evidence-agreement
            phrase: "Their routes agree"
            targets: [shadow-evidence-mechanism]
            color: green
            caption_boundary: true
      - say: >-
          Sanitize the inputs before the queue, logs, or candidate can see them. If sanitizing changes
