          the canary points to the candidate. The window is fresh. Nine hundred of twelve hundred
          candidate requests have a support review. None has confirmed an unsupported approval. Latency
          and transport look healthy. Do you widen, hold this exposure, or stop the canary?
        caption_starts: ["Do you widen"]
        hold: 2.2
        visual_cues:
          - id: mv-fresh-release-premise
            phrase: "Nine hundred of twelve hundred candidate requests have a support review"
            targets: [attempt-receipt]
            color: cyan
            caption_boundary: true
      - say: >-
          Hold the exposure. We’ve reviewed seventy-five percent. Three hundred outcomes are still
          unknown. Here comes a review from rollout seventy-two. That approval was unsupported, but it
          belongs with the earlier attempt. The count here stays at nine hundred. Now a separate review
          arrives for request nine oh one on seventy-three. It confirms an unsupported approval. Stop
          candidate traffic. Block the saved assignments to this release and move the canary pointer
          back to stable. Record a canary abort. Production stayed where it was.
        hold: 0.8
        visual_cues:
          - id: mv-fresh-release-hold
            phrase: "Hold the exposure"
            targets: [attempt-receipt]
            color: yellow
            caption_boundary: true
          - id: mv-fresh-release-fraction
            phrase: "seventy-five percent"
            targets: [attempt-receipt]
            color: cyan
            caption_boundary: true
          - id: older-receipt
            phrase: "a review from rollout seventy-two"
            targets: [attempt-receipt]
            color: yellow
            caption_boundary: true
          - id: current-slip
            phrase: "a separate review arrives for request nine oh one on seventy-three"
            targets: [attempt-receipt]
            color: cyan
            caption_boundary: true
          - id: mv-fresh-release-unsafe
            phrase: "It confirms an unsupported approval"
            targets: [attempt-receipt]
            color: pink
            caption_boundary: true
          - id: mv-fresh-release-abort-now
            phrase: "Stop candidate traffic"
            targets: [attempt-receipt]
            color: pink
            caption_boundary: true
          - id: mv-fresh-release-abort
            phrase: "move the canary pointer back to stable"
            targets: [attempt-receipt]
            color: blue
            caption_boundary: true
      - say: >-
          Now both pointers select stable. This time the returning traffic needs a hundred fifty
          requests a second. The first set of healthy workers can take a hundred thirty-four. How much
          capacity are we missing?
        caption_starts: ["How much capacity are we missing"]
        hold: 2.05
      - say: >-
          Sixteen requests a second have nowhere to go. A later receipt shows ready capacity of one
          hundred sixty. Look at thread six before you resume it. Its saved conversation uses version
          two, with the shipment under ship I D. The stable worker reads version one, with the value
          under ship. Can that conversation resume as it stands?
        caption_starts: ["Its saved conversation uses version two", "The stable worker reads version one", "Can that conversation resume as it stands"]
        hold: 2.2
        visual_cues:
          - id: mv-fresh-release-gap
            phrase: "Sixteen requests a second have nowhere to go"
            targets: [attempt-receipt]
            color: pink
            caption_boundary: true
          - id: return-headroom
            phrase: "A later receipt shows ready capacity of one hundred sixty"
            targets: [attempt-receipt]
            color: blue
            caption_boundary: true
          - id: inspect-thread
            phrase: "Look at thread six before you resume it"
            targets: [attempt-receipt]
            color: yellow
            caption_boundary: true
      - say: >-
          Pause thread six. The worker has room, but it can’t read this state. If you have no
          compatible migration, use a reviewed reset or keep the conversation paused. Here the
          migration has been reviewed. Keep the shipment and write it under the field the stable
          worker reads. Resume one request under the returning load. Thread six comes back on stable
          with the same shipment.
        caption_starts: ["If you have no compatible migration", "Resume one request"]
        hold: 2.1
        visual_cues:
          - id: mv-fresh-release-capacity
            phrase: "The worker has room, but it can’t read this state"
            targets: [attempt-receipt]
            color: pink
            caption_boundary: true
          - id: migrate-thread
            phrase: "write it under the field the stable worker reads"
            targets: [attempt-receipt]
            color: blue
            caption_boundary: true
          - id: verify-return
            phrase: "Thread six comes back on stable with the same shipment"
            targets: [attempt-receipt]
            color: green
            caption_boundary: true
