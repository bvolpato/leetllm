          failures with incomplete reviews cannot pass. A correctly attributed confirmed unsupported
          serve can already trigger an abort, even below minimum volume or with missing latency.
          Malformed support counters or wrong release attribution instead require investigation. Put
          an escalation timeout on missing telemetry so the experiment cannot linger unseen.
