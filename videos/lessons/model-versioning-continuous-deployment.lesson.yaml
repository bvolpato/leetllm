            targets:
              - zero-risk-mechanism
            color: pink
            linger: 0.5
      - say: "Compute what a zero count can establish under a separate statistical contract. For n
          independent trials with a fixed failure probability, correct classification and a sample
          size fixed in advance, the probability of zero failures is the quantity one minus the
          failure probability, raised to n. Set that probability to alpha and solve: the one-sided
          upper bound is one minus alpha raised to one over n. At ninety-five percent confidence,
          alpha is point zero five."
