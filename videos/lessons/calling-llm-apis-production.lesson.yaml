              to measure remaining time.
            targets:
              - ap-timeout-retry-trace
            color: yellow
            linger: 0.4
  - id: admission-limits
    title: Classify the failure before spending another attempt
    visual: Map request and token admission buckets separately, then route exact
      normalized429codes,503,401 and completed refusal to bounded retry/quota/request/inspect
      destinations. Keep tenant quota separate from providerhealth.
    beats:
      - say: Providers may limit requests per minute, tokens per minute and concurrent work at different
          scopes. An average request rate can hide bursts. Long inputs, reserved output allowances
          and repeated retries can consume token admission differently from a final invoice. Inspect
          the chosen provider’s actual accounting instead of deriving one universal quota from a
          token count.
        hold: 0.6
        visual_cues:
          - id: ap-admission-limits-0
            phrase: Providers may limit requests per minute, tokens per minute and concurrent work at different
              scopes. An average request rate can hide bursts. Long inputs, reserved output
              allowances and repeated retries can consume token admission differently from a final
              invoice. Inspect the chosen provider’s actual accounting instead of deriving one
              universal quota from a token count.
            targets:
              - ap-admission-limits-trace
            color: blue
            linger: 0.4
      - say: >-
          Two requests get the same status: four twenty-nine. The first hit a temporary rate
          limit. A safe read can retry within budget, just as it can after a transient
          five-oh-three. The second ran out of credit. An operator has to fix the quota. For a
          four hundred, fix the request. For four-oh-one or four-oh-three, check credentials and
          access. Inspect an unfamiliar error code before choosing a retry.
        hold: 0.6
        visual_cues:
          - id: ap-admission-limits-1
            phrase: >-
              Two requests get the same status: four twenty-nine. The first hit a temporary rate
              limit. A safe read can retry within budget, just as it can after a transient
              five-oh-three. The second ran out of credit. An operator has to fix the quota. For
              a four hundred, fix the request. For four-oh-one or four-oh-three, check
              credentials and access. Inspect an unfamiliar error code before choosing a retry.
            targets:
              - ap-admission-limits-trace
            color: cyan
            linger: 0.4
      - say: >-
          Even a two hundred can carry a refusal, a partial reply or a decision that fails
          policy. Record the specific failure. Let the adapter translate provider errors, and
          apply a tenant’s spending limit to that tenant. Other accounts may still be getting
          answers.
        hold: 0.6
        visual_cues:
          - id: ap-admission-limits-2
            phrase: >-
              Even a two hundred can carry a refusal, a partial reply or a decision that fails
              policy. Record the specific failure. Let the adapter translate provider errors,
              and apply a tenant’s spending limit to that tenant. Other accounts may still be
              getting answers.
            targets:
              - ap-admission-limits-trace
            color: yellow
            linger: 0.4
  - id: jitter-geometry
    title: When will the workers come back?
    visual: >-
      Six worker tracks share an elapsed-time axis. Hold the failure time fixed while the retry
      marks spread. Then put two successive random draws inside their actual windows.
    beats:
      - say: >-
          Six workers hit a temporary limit together. Ignore request duration for a moment. Each
          worker waits one second, retries, then waits two more. Watch their arrivals at one and
          three seconds. The provider sees two bursts. Now give each worker its own random waits.
          See how much less work lands at the same instant? Two arrivals can still coincide.
        hold: 0.9
        visual_cues:
          - id: fixed-arrivals
            phrase: "Each worker waits one second, retries, then waits two more"
            targets: [arrival-tracks]
            linger: 0.25
          - id: spread-arrivals
            phrase: "give each worker its own random waits"
            targets: [arrival-tracks]
            linger: 0.25
      - say: >-
          Look at one worker. Start with a one-second base and an eight-second cap. For full jitter,
          double the ceiling on each retry up to that cap. Pick a point anywhere between zero and
          the ceiling. Our supplied draw is halfway across the first window. That's half a second.
          Double the window for retry two. The same draw now gives one second.
        hold: 0.8
        visual_cues:
          - id: full-first
            phrase: "halfway across the first window. That's half a second"
            targets: [jitter-windows]
            linger: 0.25
          - id: full-second
            phrase: "Double the window for retry two. The same draw now gives one second"
            targets: [jitter-windows]
            linger: 0.25
      - say: >-
          Try a different rule with the same half draw. Start with a previous sleep of one second.
          Draw between the base and three times the previous sleep, then cap the result. Halfway
          from one to three gives two seconds. That sleep sets the next upper endpoint at six.
          Halfway from one to six gives three and a half seconds. This is decorrelated jitter. The
          lab prints these alternatives and takes the full-jitter waits. Independent draws spread
          traffic, although a cap can bunch workers together again.
        hold: 0.8
        visual_cues:
          - id: decor-first
            phrase: "Halfway from one to three gives two seconds"
            targets: [jitter-windows]
            linger: 0.25
          - id: decor-second
            phrase: "Halfway from one to six gives three and a half seconds"
            targets: [jitter-windows]
            linger: 0.25
  - id: deadline-floor
    title: Is there time for another attempt?
    visual: >-
      Keep a retry reservation on one scale. Stack the header floor, its sampled jitter, the call,
      and the validation allowance. Move only the deadline on replay. Then count provider attempts
      inside nested retry loops.
    beats:
      - say: >-
          Return to the rate-limited read with six seconds left. The Retry-After header asks for two
          seconds. That's the earliest this wrapper will retry. Its first jitter window is one
          second wide, and we drew the midpoint. Add half a second above the floor. A header can
          also give an HTTP date. Convert a past date to zero delay and give malformed values an
          explicit fallback.
        hold: 0.7
        visual_cues:
          - id: reserve-floor
            phrase: "asks for two seconds"
            targets: [retry-ruler]
            linger: 0.25
          - id: reserve-jitter
            phrase: "Add half a second above the floor"
            targets: [retry-ruler]
            linger: 0.25
      - say: >-
          Place the three-second allowance for the next call after that wait. Leave four tenths of a
          second for validation. The whole reservation takes five point nine seconds. With six
          seconds left, the wrapper can schedule this retry. After the wait it must read the
          monotonic clock again and enforce the time still available.
        hold: 0.9
        visual_cues:
          - id: reserve-call
            phrase: "three-second allowance for the next call"
            targets: [retry-ruler]
            linger: 0.25
          - id: reserve-check
            phrase: "four tenths of a second for validation"
            targets: [retry-ruler]
            linger: 0.25
          - id: reserve-admit
            phrase: "the wrapper can schedule this retry"
            targets: [reservation-verdict]
            linger: 0.25
            caption_boundary: true
      - say: >-
          Replay the same read. This time the first attempt ran half a second longer. Five and a
          half seconds remain. The wait, call allowance and validation reserve are unchanged. Can
          the wrapper schedule this retry?
        hold: 2.2
        visual_cues:
          - id: reserve-less
            phrase: "Five and a half seconds remain"
            targets: [retry-ruler]
            linger: 0.25
      - say: >-
          Stop before the wait. The call alone would use every remaining moment after backoff.
          Validation would cross the deadline. The wait helper returns two and a half seconds in
          both cases. It rejects a wait that reaches or exceeds the time left, but the wrapper must
          also budget for the work after it.
        hold: 0.9
        visual_cues:
          - id: reserve-deny
            phrase: "Stop before the wait"
            targets: [reservation-verdict]
            linger: 0.25
            caption_boundary: true
      - say: >-
          One more way to spend the same budget twice. Suppose the wrapper allows three attempts,
          and each SDK call can make three attempts of its own. Count the provider calls across
          those three rows. Up to nine. Let the wrapper own the retry policy here. The SDK example
          sets max retries to zero, so each invocation makes one attempt.
        hold: 0.8
        caption_starts:
          - "Up to nine"
          - "Let the wrapper own"
        visual_cues:
          - id: retry-count
            phrase: "Up to nine"
            targets: [attempt-grid]
          - id: nested-calls
            phrase: "Count the provider calls across those three rows"
            targets: [attempt-grid]
            linger: 0.25
          - id: single-owner
            phrase: "sets max retries to zero"
            targets: [attempt-grid]
            linger: 0.25
