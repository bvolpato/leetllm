            color: yellow
            linger: 0.4
  - id: timeout-contract
    title: Connection activity can outlive useful progress
    visual: Shared wall-clock shows separate connect/read/firsttext/overall timers. Heartbeat arrivals
      reset only readgap; firsttext timer expires independently. Separate cooperative cancellation
      cleanup extends actual wait while remote state remains unknown.
    beats:
      - say: >-
          A call can stall in four places. The client can wait for a pooled connection, open a
          new one, write the request or wait for the next chunk of the reply. Give each wait its
          own limit. Connection reuse, name resolution, proxies and the TLS handshake affect the
          time it takes to connect.
        hold: 0.6
        visual_cues:
          - id: ap-timeout-contract-0
            phrase: >-
              A call can stall in four places. The client can wait for a pooled connection, open
              a new one, write the request or wait for the next chunk of the reply. Give each
              wait its own limit. Connection reuse, name resolution, proxies and the TLS
              handshake affect the time it takes to connect.
            targets:
              - ap-timeout-contract-trace
            color: blue
            linger: 0.4
      - say: >-
          Here come six heartbeats. Each one delivers bytes, so the read timer resets. The user
          is still waiting for the first words. Give that wait its own deadline. Keep a total
          deadline running through retrieval, attempts, waits and validation. Set each limit
          from the delays you measure and the time the user can wait.
        hold: 0.6
        visual_cues:
          - id: ap-timeout-contract-1
            phrase: >-
              Here come six heartbeats. Each one delivers bytes, so the read timer resets. The
              user is still waiting for the first words. Give that wait its own deadline. Keep a
              total deadline running through retrieval, attempts, waits and validation. Set each
              limit from the delays you measure and the time the user can wait.
            targets:
              - ap-timeout-contract-trace
            color: cyan
            linger: 0.4
      - say: >-
          Give a sleeping coroutine one millisecond to answer. It needs twenty. When the
          millisecond is up, wait-for requests cancellation and waits for cleanup. That cleanup
          can push elapsed time past the deadline. Use an asynchronous transport that can yield
          to cancellation, and measure overruns. Blocking code holds the event loop. For remote
          work, check the outcome with the provider.
        hold: 0.6
        visual_cues:
          - id: ap-timeout-contract-2
            phrase: >-
              Give a sleeping coroutine one millisecond to answer. It needs twenty. When the
              millisecond is up, wait-for requests cancellation and waits for cleanup. That
              cleanup can push elapsed time past the deadline. Use an asynchronous transport
              that can yield to cancellation, and measure overruns. Blocking code holds the
              event loop. For remote work, check the outcome with the provider.
            targets:
              - ap-timeout-contract-trace
            color: yellow
            linger: 0.4
  - id: timeout-retry
    title: Share one deadline across attempts and waits
    visual: A supplied timeline lays a fourteen-second attempt, a Retry-After floor plus jitter, and a
      three-second retry inside one twenty-second task budget.
    beats:
      - say: >
          Give the whole task twenty seconds. When its first attempt uses fourteen, six seconds
          remain for any wait, another call, and final validation.
        hold: 0.75
        visual_cues:
          - id: retry-budget-b1-1
            phrase: six seconds remain
            targets:
              - retry-budget
            color: yellow
            linger: 0.6
          - id: ap-timeout-retry-0
            phrase: >
              Give the whole task twenty seconds. When its first attempt uses fourteen, six seconds
              remain for any wait, another call, and final validation.
            targets:
              - ap-timeout-retry-trace
            color: blue
            linger: 0.4
      - say: >
          This rate-limit response requests two seconds. Full jitter adds a half-second in our
          constructed trace, so the next attempt starts after two and a half seconds.
        hold: 0.75
        visual_cues:
          - id: retry-clock-b2-1
            phrase: two and a half seconds
            targets:
              - retry-clock
            color: cyan
            linger: 0.6
          - id: ap-timeout-retry-1
            phrase: >
              This rate-limit response requests two seconds. Full jitter adds a half-second in our
              constructed trace, so the next attempt starts after two and a half seconds.
            targets:
              - ap-timeout-retry-trace
            color: cyan
            linger: 0.4
      - say: >
          The three-second retry ends at nineteen and a half, inside the budget. With only one point
          two seconds left, the requested wait cannot fit, so stop. Use a monotonic clock to measure
          remaining time.
        hold: 0.8
        visual_cues:
          - id: retry-clock-b3-1
            phrase: nineteen and a half
            targets:
              - retry-clock
            color: green
            linger: 0.6
          - id: ap-timeout-retry-2
            phrase: >
              The three-second retry ends at nineteen and a half, inside the budget. With only one
