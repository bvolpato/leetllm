  - id: usage-subsets
    title: What changes the price of the same token count?
    visual: >-
      Keep the total input strip fixed at 2,000 tokens. Partition it into ordinary input, cache reads
      and cache writes. In a second receipt, move 400 tokens from ordinary to cached input. Keep
      the output and the fictional rates fixed while the two prices are compared.
    beats:
      - say: >-
          This receipt lists two thousand input tokens. Twelve hundred came from the cache, and a
          hundred were cache writes. Peel those two groups away. That leaves seven hundred ordinary
          input tokens. The two hundred output tokens include eighty for reasoning. The other
          hundred and twenty are visible output. Check these relationships in the provider's usage
          record before pricing it.
        hold: 0.8
        visual_cues:
          - id: split-cached
            phrase: "Twelve hundred came from the cache"
            targets: [input-strip]
          - id: split-writes
            phrase: "a hundred were cache writes"
            targets: [input-strip]
          - id: ordinary-input
            phrase: "That leaves seven hundred ordinary input tokens"
            targets: [input-strip]
            caption_boundary: true
          - id: output-includes
            phrase: "The two hundred output tokens include eighty for reasoning"
            targets: [output-total]
          - id: split-output
            phrase: "The other hundred and twenty are visible output"
            targets: [output-total]
      - say: >-
          Read across the receipt. Per million tokens, the fictional rates are two dollars for
          ordinary input, fifty cents for cache reads, and two dollars fifty for writes. Price the
          output once at six dollars per million. Reasoning is already in that row. Multiply each
          count by its rate, add the products, and divide by a million. The request costs point
          zero zero three four five dollars.
        hold: 0.9
        visual_cues:
          - id: input-rates
            phrase: "two dollars for ordinary input, fifty cents for cache reads, and two dollars fifty for writes"
            targets: [input-strip]
          - id: output-rate
            phrase: "six dollars per million"
            targets: [output-total]
          - id: price-divisor
            phrase: "divide by a million"
            targets: [price]
          - id: baseline-price
            phrase: "The request costs point zero zero three four five dollars"
            targets: [price]
            caption_boundary: true
      - say: >-
          Run the same prompt again. This time the provider reports four hundred more cached input
          tokens. They came out of the ordinary group. Everything else stays the same, including
          total input and output. Look at which boundary moved. What happens to the price?
        hold: 2.3
        visual_cues:
          - id: cache-shift
            phrase: "four hundred more cached input tokens. They came out of the ordinary group"
            targets: [input-strip]
      - say: >-
          The price drops to point zero zero two eight five dollars. Those four hundred tokens now
          cost fifty cents per million instead of two dollars per million. Reusing a cached prefix
          can also save work processing those input positions. Cache eligibility and prices depend
          on the provider and model. Tools or media can add charges. If a timed-out attempt has no
          usage record, leave its cost unknown until billing confirms it.
        hold: 0.9
        visual_cues:
          - id: replay-price
            phrase: "The price drops to point zero zero two eight five dollars"
            targets: [price]
            caption_boundary: true
