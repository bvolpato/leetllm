            targets:
              - ap-candidate-validation-trace
            color: yellow
            linger: 0.4
  - id: parser-layers
    title: Reject ambiguous bytes before comparing policy
    visual: Use raw ordered JSON key pairs, including identical duplicate decision keys, then
      exactfield/type checks and trusted age/stale inputs. A visible conjunction stale AND
      age>=threshold computes eligible/noteligible in both directions.
    beats:
      - say: A complete candidate must first survive parsing. Python JSON parsing can otherwise accept
          duplicate keys by retaining one value and can accept nonstandard NaN or Infinity. This
          parser observes object pairs before dictionary conversion, rejects any duplicate field and
          nonstandard number, and turns excessive nesting into a named rejection. A response-size
          bound is still needed around the parser.
        hold: 0.6
        visual_cues:
          - id: ap-parser-layers-0
            phrase: A complete candidate must first survive parsing. Python JSON parsing can otherwise accept
              duplicate keys by retaining one value and can accept nonstandard NaN or Infinity. This
              parser observes object pairs before dictionary conversion, rejects any duplicate field
              and nonstandard number, and turns excessive nesting into a named rejection. A
              response-size bound is still needed around the parser.
            targets:
              - ap-parser-layers-trace
            color: blue
            linger: 0.4
      - say: Next require exactly decision, rotation-window-days and source-line-IDs. The decision is one of
          two strings; the threshold is an actual integer, so Boolean true is rejected even though
          Python treats Boolean as an integer subclass. Evidence must be a string list matching the
          supported P seven line, and its numeric threshold must equal the trusted value.
        hold: 0.6
        visual_cues:
          - id: ap-parser-layers-1
            phrase: Next require exactly decision, rotation-window-days and source-line-IDs. The decision is one
              of two strings; the threshold is an actual integer, so Boolean true is rejected even
              though Python treats Boolean as an integer subclass. Evidence must be a string list
              matching the supported P seven line, and its numeric threshold must equal the trusted
              value.
            targets:
              - ap-parser-layers-trace
            color: cyan
            linger: 0.4
      - say: >-
          Check the account record too. The key age and policy threshold must both be
          nonnegative integers, and the stale flag must be Boolean. A stale key qualifies on the
          day it reaches the threshold. A younger key or a key marked current fails that check.
          If the record is missing, report the lookup failure. Calling that key ineligible would
          give the user a made-up answer.
        hold: 0.6
        visual_cues:
          - id: ap-parser-layers-2
            phrase: >-
              Check the account record too. The key age and policy threshold must both be
              nonnegative integers, and the stale flag must be Boolean. A stale key qualifies on
              the day it reaches the threshold. A younger key or a key marked current fails that
              check. If the record is missing, report the lookup failure. Calling that key
              ineligible would give the user a made-up answer.
            targets:
              - ap-parser-layers-trace
            color: yellow
            linger: 0.4
  - id: failure-receipt
    title: A rejected call still emits its real outcome
    visual: Execute actual parser wrapper success and failure receipts with fake clock, preserving trace
      ID. Unknown account stops before providerstub; finally writes failed rather than success or
      invented negative decision.
    beats:
      - say: >-
          Watch the status field. It starts at failed. The wrapper loads the account, calls the
          local provider stub and checks the answer. Only then does it change the status to
          okay. Its finally block records elapsed time on either path. Here the test clock
          advances by five hundredths of a millisecond.
        hold: 0.6
        visual_cues:
          - id: ap-failure-receipt-0
            phrase: >-
              Watch the status field. It starts at failed. The wrapper loads the account, calls
              the local provider stub and checks the answer. Only then does it change the status
              to okay. Its finally block records elapsed time on either path. Here the test
              clock advances by five hundredths of a millisecond.
            targets:
              - ap-failure-receipt-trace
            color: blue
            linger: 0.4
      - say: >-
          Now the stub gives a wrong answer about a known account. Validation fails. Try an
          unknown account and the lookup fails before the provider call. Two failures, one
          provider call. Both leave a status record, and the test restores the original stub
          when it finishes.
        hold: 0.6
        caption_starts: ["Two failures, one provider call"]
        visual_cues:
          - id: ap-failure-receipt-1
            phrase: >-
              Now the stub gives a wrong answer about a known account. Validation fails.
            targets:
              - ap-failure-receipt-trace
            color: cyan
            linger: 0.4
      - say: >-
          Give each attempt its own record with the provider request ID and any reported usage.
          If the caller times out, return a timeout to the user. Leave usage open until the
          provider reports it. The task record tells you what the user received.
        hold: 0.6
        visual_cues:
          - id: ap-failure-receipt-2
            phrase: >-
              Give each attempt its own record with the provider request ID and any reported
              usage. If the caller times out, return a timeout to the user. Leave usage open
              until the provider reports it. The task record tells you what the user received.
            targets:
