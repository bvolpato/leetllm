version: 1
id: calling-llm-apis-production
title: Follow One LLM Request Through Its Production Boundary
source: preparation/calling-llm-apis-production/content.md
opening: lesson
voice: af_heart
rate: +12%
sources:
  - title: Timeouts, retries, and backoff with jitter
    url: https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/
  - title: HTTP Semantics, RFC 9110
    url: https://www.rfc-editor.org/rfc/rfc9110.html
  - title: OpenAI Structured Outputs guide
    url: https://platform.openai.com/docs/guides/structured-outputs
  - title: OpenTelemetry GenAI semantic conventions
    url: https://opentelemetry.io/docs/specs/semconv/gen-ai/
  - title: Server-sent events
    url: https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events/Using_server-sent_events
scenes:
  - id: opening
    title: Calling a model from an app
    visual: >-
      The caller’s stopwatch advances from three seconds to its four-second deadline. Hold the
      dial there as two possible provider histories play beside it. On a second read, compare
      the model reply with the age marker and policy line.
    beats:
      - say: >-
          Three seconds on the clock. Your app is still waiting for the model. Four seconds. The
          app times out. Did the model finish?
        hold: 2.3
        caption_starts:
          - "Four seconds"
          - "Did the model finish"
        visual_cues:
          - id: caller-wait
            phrase: >-
              Your app is still waiting for the model. Four seconds
            targets: [caller-clock]
            linger: 0.25
      - say: >-
          Here’s one possibility. The model finished in three seconds and its reply got lost.
          Here’s another. Six seconds in, the model is still working. Both look the same from
          the app. Record the timeout. The provider can confirm later how the request ended and
          how many tokens it used.
        hold: 1
        caption_starts:
          - "Here’s another"
        visual_cues:
          - id: finished-history
            phrase: >-
              The model finished in three seconds and its reply got lost
            targets: [provider-one]
            linger: 0.25
          - id: running-history
            phrase: >-
              Six seconds in, the model is still working
            targets: [provider-two]
            linger: 0.25
          - id: timeout-receipt
            phrase: "Record the timeout"
            targets: [caller-clock]
            linger: 0.25
            caption_boundary: true
      - say: >-
          On the next check, the model says this stale key is ineligible for rotation. The
          account puts its age at forty-five days. Policy sets the minimum at thirty days. Would
          you return the model's answer?
        hold: 2.2
        caption_starts:
          - "The account puts its age"
          - "Policy sets the minimum"
          - "Would you return"
        visual_cues:
          - id: opening-candidate
            phrase: "The model says this stale key is ineligible for rotation"
            targets: [candidate-record]
          - id: opening-age
            phrase: "Forty-five days"
            targets: [key-ruler]
            linger: 0.25
          - id: opening-policy
            phrase: "Thirty days"
            targets: [key-ruler]
            linger: 0.25
      - say: >-
          Reject it. Forty-five days puts this stale key past the thirty-day mark. To check a
          reply like this, the server needs trusted account facts and access to the policy.
        hold: 0.9
        visual_cues:
          - id: opening-reject
            phrase: "Reject it"
            targets: [candidate-record]
            linger: 0.25
            caption_boundary: true
  - id: secret-probe
    title: Who can spend the organization's quota?
    visual: >-
      A local startup check reads a server setting and prints only its status. Follow a placeholder
      through a public frontend build. Then keep the real credential on the server and trace a
      caller as far as its permission allows.
    beats:
      - say: >-
          Before the server can ask about this account, it needs a provider credential. Calls
          made with that key use the organization's quota. Try the startup check with no key in the settings.
          It stops. A blank value stops it too. Give it the local placeholder and it prints loaded.
          The server found a value. To find out whether the key grants access to the model, the
          provider has to check it.
        hold: 0.8
        visual_cues:
          - id: empty-setting
            phrase: "It stops"
            targets: [startup-check]
          - id: present-setting
            phrase: "Give it the local placeholder and it prints loaded"
            targets: [startup-check]
      - say: >-
          Now follow that placeholder through a frontend build. The browser downloads the bundle.
          If the build inlined the key there, who can read it? The browser can. Encryption protects
          delivery, and the receiving client gets the bytes. Next JS can inline referenced settings
          with the public prefix shown here. Vite normally exposes settings with its own public
          prefix. Keep provider credentials out of both, and out of mobile packages.
        hold: 0.8
        visual_cues:
          - id: bundle-delivery
            phrase: "The browser downloads the bundle"
            targets: [delivery-path]
          - id: client-can-read
            phrase: "The browser can"
            targets: [delivery-path]
            caption_boundary: true
      - say: >-
          Put the credential back on the server, injected from an authorized secret store. Keep
          staging and production credentials separate and revoke a leaked one. Now a signed-out
          caller asks this server to check the same account. The browser has no key.
          Can this caller still spend your quota if the route forwards every request?
        hold: 2.1
        visual_cues:
          - id: server-secret
            phrase: "injected from an authorized secret store"
            targets: [server-key]
          - id: anonymous-request
            phrase: "a signed-out caller asks this server"
            targets: [caller-request]
      - say: >-
          Yes. The server would make a billable call on that caller's behalf. Stop the request
          at sign-in. For a signed-in user, also check access to the tenant and account, then
          enforce the usage limit before the provider call. The local check only tested the
          setting. Try those access checks against the deployed route separately.
        hold: 0.8
        visual_cues:
          - id: proxy-spend
            phrase: "The server would make a billable call on that caller's behalf"
            targets: [server-key]
            caption_boundary: true
          - id: enforce-sign-in
            phrase: "Stop the request at sign-in"
            targets: [caller-request]
  - id: contract-boundary
    title: Put provider calls behind one server wrapper
    visual: A caller request passes authorization, a task wrapper, and a provider adapter. The server
      injects its credential and sends back a typed, validated result.
    beats:
      - say: >
          The browser sends intent and an account identifier. The server authenticates the caller
          and checks tenant access before it loads key age and policy.
        hold: 0.7
        visual_cues:
          - id: authenticated-server-b1-1
            phrase: authenticates the caller
            targets:
              - authenticated-server
            color: cyan
            linger: 0.6
          - id: ap-contract-boundary-0
            phrase: >
              The browser sends intent and an account identifier. The server authenticates the
              caller and checks tenant access before it loads key age and policy.
            targets:
              - ap-contract-boundary-trace
            color: blue
            linger: 0.4
      - say: >
          A shared wrapper maps the task to the provider format, keeps the API key server-side, and
          records the prompt version and trace identifier.
        hold: 0.7
        visual_cues:
          - id: server-secret-b2-1
            phrase: API key server-side
            targets:
              - server-secret
            color: yellow
            linger: 0.6
          - id: ap-contract-boundary-1
            phrase: >
              A shared wrapper maps the task to the provider format, keeps the API key server-side,
              and records the prompt version and trace identifier.
            targets:
              - ap-contract-boundary-trace
            color: cyan
            linger: 0.4
      - say: >
          The adapter returns a candidate to one validation path. Every route can share timeouts,
          retry rules, privacy scrubbing, and operational telemetry. Connect, first-text, read, and
          total deadlines cover different waits.
        hold: 0.75
        visual_cues:
          - id: validated-api-result-b3-1
            phrase: one validation path
            targets:
              - validated-api-result
            color: blue
            linger: 0.6
          - id: ap-contract-boundary-2
            phrase: >
              The adapter returns a candidate to one validation path. Every route can share
              timeouts, retry rules, privacy scrubbing, and operational telemetry. Connect,
              first-text, read, and total deadlines cover different waits.
            targets:
              - ap-contract-boundary-trace
            color: yellow
            linger: 0.4
  - id: domain-wire
    title: Keep application intent distinct from provider bytes
    visual: Construct LLMTask fields one at a time from server-authorized facts; attach trace7e3b and
      promptversion, then explicitly map internal fields to actual Responses text.format. Keep
      legacy minimum-age interpretation beside field.
    beats:
      - say: >-
          Does this stale key qualify for rotation? The task object carries that question, the
          account, the policy IDs, a trace ID and the prompt version. It also sets the
          connection and read timeouts, the total deadline and the retry cap. The Python
          dataclass and its type annotations describe those fields.
        hold: 0.6
        visual_cues:
          - id: ap-domain-wire-0
            phrase: >-
              Does this stale key qualify for rotation? The task object carries that question,
              the account, the policy IDs, a trace ID and the prompt version. It also sets the
              connection and read timeouts, the total deadline and the retry cap. The Python
              dataclass and its type annotations describe those fields.
            targets:
              - ap-domain-wire-trace
            color: blue
            linger: 0.4
      - say: >-
          At the server, check the caller’s access and the allowed task. Timeouts must be finite
          and positive, and the retry count must be zero or more. Now build the task. Its list
          of required fields tells the adapter what the app expects. The adapter puts those
          requirements into the schema the provider accepts.
        hold: 0.6
        visual_cues:
          - id: ap-domain-wire-1
            phrase: >-
              At the server, check the caller’s access and the allowed task. Timeouts must be
              finite and positive, and the retry count must be zero or more. Now build the task.
              Its list of required fields tells the adapter what the app expects. The adapter
              puts those requirements into the schema the provider accepts.
            targets:
              - ap-domain-wire-trace
            color: cyan
            linger: 0.4
      - say: >-
          One field is easy to misread. Rotation window days means the minimum age of a stale
          key. On this ruler, eligibility starts at thirty days. Give the field that name in the
          app. The server checks the proposed answer against the account, then asks for separate
          authorization before creating a job.
        hold: 0.6
        visual_cues:
          - id: ap-domain-wire-2
            phrase: >-
              One field is easy to misread. Rotation window days means the minimum age of a
              stale key. On this ruler, eligibility starts at thirty days. Give the field that
              name in the app. The server checks the proposed answer against the account, then
              asks for separate authorization before creating a job.
            targets:
              - ap-domain-wire-trace
            color: yellow
            linger: 0.4
  - id: candidate-validation
    title: Check the response against policy and facts
    visual: The same P-7 threshold and account age test three structured model candidates. A conflicting
      answer, changed threshold, and grounded decision take distinct branches.
    beats:
      - say: >
          First, the candidate says the forty-five-day-old key is not eligible. Its fields parse,
          but that decision conflicts with the trusted age and thirty-day threshold.
        hold: 0.75
        visual_cues:
          - id: candidate-field-comparison-b1-1
            phrase: decision conflicts
            targets:
              - candidate-field-comparison
            color: pink
            linger: 0.6
          - id: ap-candidate-validation-0
            phrase: >
              First, the candidate says the forty-five-day-old key is not eligible. Its fields
              parse, but that decision conflicts with the trusted age and thirty-day threshold.
            targets:
              - ap-candidate-validation-trace
            color: blue
            linger: 0.4
      - say: >
          Next, the candidate cites P-7 while changing its threshold to ninety days. The source ID
          exists, yet the number fails the policy check.
        hold: 0.75
        visual_cues:
          - id: candidate-field-comparison-b2-1
            phrase: threshold to ninety days
            targets:
              - candidate-field-comparison
            color: pink
            linger: 0.6
          - id: ap-candidate-validation-1
            phrase: >
              Next, the candidate cites P-7 while changing its threshold to ninety days. The source
              ID exists, yet the number fails the policy check.
            targets:
              - ap-candidate-validation-trace
            color: cyan
            linger: 0.4
      - say: >
          The final candidate says eligible, names thirty days, and cites P-7. The server accepts it
          only after field types, evidence, and the comparison agree. Extra fields and duplicate
          keys also need explicit handling.
        hold: 0.8
        visual_cues:
          - id: candidate-verdict-b3-1
            phrase: server accepts it
            targets:
              - candidate-verdict
            color: green
            linger: 0.6
          - id: ap-candidate-validation-2
            phrase: >
              The final candidate says eligible, names thirty days, and cites P-7. The server
              accepts it only after field types, evidence, and the comparison agree. Extra fields
