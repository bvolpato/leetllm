  - id: stream-failures
    title: Did the stream finish?
    visual: >-
      Fill one draft from four normalized deltas. Compare the same 41 characters under two
      endings. Then interrupt a replay after the second delta and keep the exact partial buffer.
    beats:
      - say: >-
          Follow one output item through the stream. The first event is metadata. Here comes the
          text in four pieces. Spaces count too. The buffer grows to eight characters, then
          nineteen, thirty-one, and forty-one. Now the provider sends its completion event. The
          client has a completed draft to check against its schema and policy. A write still needs
          authorization.
        hold: 0.9
        visual_cues:
          - id: eight-chars
            phrase: "eight characters"
            targets: [draft-bytes]
            linger: 0
          - id: nineteen-chars
            phrase: "then nineteen"
            targets: [draft-bytes]
            linger: 0
          - id: thirty-one-chars
            phrase: "thirty-one"
            targets: [draft-bytes]
            linger: 0
          - id: forty-one-chars
            phrase: "and forty-one"
            targets: [draft-bytes]
            linger: 0.25
          - id: draft-terminal
            phrase: "the provider sends its completion event"
            targets: [stream-ending]
            linger: 0.25
      - say: >-
          Replay the same four pieces. Put the two buffers side by side. Every character matches,
          including the final period. This time the connection ends right there. Can the client mark
          the second stream complete?
        hold: 2.2
        visual_cues:
          - id: draft-repeat
            phrase: "Replay the same four pieces"
            targets: [draft-bytes]
            linger: 0.25
          - id: draft-eof
            phrase: "the connection ends right there"
            targets: [stream-ending]
            linger: 0.25
      - say: >-
          Mark the second stream failed. The first received a successful terminal event. The second
          received only end of file. Now try a dropped connection after just two pieces. The client
          keeps the nineteen characters it actually saw and records a failed draft. Neither failed
          draft supplies a rotation decision.
        hold: 1
        visual_cues:
          - id: draft-failed
            phrase: "Mark the second stream failed"
            targets: [stream-ending]
            linger: 0.25
            caption_boundary: true
          - id: draft-dropped
            phrase: "a dropped connection after just two pieces"
            targets: [draft-bytes]
            linger: 0.25
      - say: >-
          This fixture starts after the SDK has parsed and normalized the events. On a real stream,
          identify the output item, bound its buffer, and inspect refusal, incomplete and failure
          signals. Show a provisional draft only when the product can safely show it. Validate the
          complete typed result before returning an eligibility decision.
        hold: 0.8
        visual_cues:
          - id: draft-validate
            phrase: "Validate the complete typed result"
            targets: [stream-ending]
            linger: 0.25
