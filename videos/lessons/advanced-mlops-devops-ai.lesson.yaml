            targets:
              - atomic-publication-construction
            color: blue
            linger: 0.3
          - id: atomic-publication-s0-2
            phrase: The pending row now carries generation five.
            targets:
              - atomic-publication-construction
            color: blue
            linger: 0.3
          - id: atomic-publication-s0-3
            phrase: If that condition matches zero rows, the helper raises a stale-token error and the transaction
              rolls back.
            targets:
              - atomic-publication-construction
            color: blue
            linger: 0.3
        hold: 0.7
      - say: Follow two copies of that pending update. Both attempt to insert an audit row with the old release,
          new release, generation and reason. On the left, the insert succeeds and the transaction commits
          both writes. On the right, the insert raises an error. The same transaction restores R at
          generation four and adds no audit row. Putting the audit in a second transaction would allow the
          routing change to survive alone.
        visual_cues:
          - id: atomic-publication-b2
            phrase: Follow two copies of that pending update. Both attempt to insert an audit row with the old
              release, new release, generation and reason.
            targets:
              - atomic-publication-construction
            color: blue
