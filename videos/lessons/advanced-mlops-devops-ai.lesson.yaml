  - id: registry-cache
    title: Separate immutable text from mutable configuration
    visual: Change configuration and an alias while keeping already loaded objects visibly fixed. Template
      identity, configuration, registry resolution and loaded runtime are separate owners.
    beats:
      - say: Consider prompt template six in the version of MLflow described in the article. Its text is
          immutable. Watch the temperature rise from point two to point seven without changing the template.
          Save the generation settings you actually evaluated. If you use semantic versions, document what
          changes your compatibility policy permits.
        visual_cues:
          - id: registry-cache-b1
            phrase: Consider prompt template six in the version of MLflow described in the article. Its text is
              immutable.
            targets:
              - registry-cache-construction
            color: blue
            linger: 0.5
          - id: registry-cache-s0-0
            phrase: Consider prompt template six in the version of MLflow described in the article. Its text is
              immutable.
            targets:
