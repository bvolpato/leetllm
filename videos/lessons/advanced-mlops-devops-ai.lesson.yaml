  - id: vectors
    title: Reproduce the downstream effect of preprocessing
    visual: Document vectors [3, 4] and [2, 0] move toward unit length. Their current coordinates drive scores for
      query [1, 0], reversing the winner during the spoken normalization.
    beats:
      - say: A configuration fingerprint tells us that inputs differ. To establish the consequence, reproduce the
          computation. Here a query scores two document vectors with a dot product. Multiply matching query
          and document coordinates, then sum the products. The first vector has a larger component along the
          query, so it wins before normalization. Its length contributes to that score.
        visual_cues:
          - id: raw-vectors
            phrase: query scores two document vectors
            targets:
              - document-vectors
            color: blue
          - id: raw-winner
            phrase: first vector has a larger component along the query
            targets:
              - vectors-readout-4
            color: green
          - id: vectors-s0-0
            phrase: A configuration fingerprint tells us that inputs differ.
            targets:
              - vectors-construction
            color: blue
            linger: 0.3
          - id: vectors-s0-1
            phrase: To establish the consequence, reproduce the computation.
            targets:
              - vectors-construction
            color: blue
            linger: 0.3
          - id: vectors-s0-2
            phrase: Here a query scores two document vectors with a dot product.
            targets:
