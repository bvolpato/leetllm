            phrase: Record the tool and policy versions that constrain possible actions.
            targets:
              - exact-candidate-construction
            color: blue
            linger: 0.3
          - id: exact-candidate-s1-2
            phrase: Measure token categories, latency and actual charges on comparable inputs.
            targets:
              - exact-candidate-construction
            color: blue
            linger: 0.3
          - id: exact-candidate-s1-3
            phrase: Estimate how much the scores vary and check the cases that matter most to users.
            targets:
              - exact-candidate-construction
            color: blue
            linger: 0.3
          - id: exact-candidate-s1-4
            phrase: Repeatedly rescoring a selected tiny sample until it passes changes the experiment.
            targets:
              - exact-candidate-construction
            color: blue
            linger: 0.3
        hold: 0.7
      - say: For a hosted model, retain the strongest available version identifier, request IDs and observed
