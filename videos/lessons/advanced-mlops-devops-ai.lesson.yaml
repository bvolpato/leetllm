  - id: exact-candidate
    title: Evaluate the bytes that will be served
    visual: Pass inexpensive schema and parity gates before generated evaluation, then carry the same identity
      into approval. Cached outputs and mutable external services limit what the test establishes.
    beats:
      - say: "First run checks without model calls: parse templates and schemas, verify artifact digests,
          compare computed feature fixtures and estimate input size. Feed yesterday’s answer to the parser. To
          test today’s prompt, generate a fresh answer. Use the candidate and feature snapshot you plan to ship.
          Pin the golden set, generation settings and judge for that run."
        visual_cues:
          - id: exact-candidate-b1
            phrase: "First run checks without model calls: parse templates and schemas, verify artifact digests, compare
              computed feature fixtures and estimate input size."
            targets:
              - exact-candidate-construction
            color: blue
            linger: 0.5
          - id: exact-candidate-s0-0
            phrase: "First run checks without model calls: parse templates and schemas, verify artifact digests, compare
              computed feature fixtures and estimate input size."
            targets:
              - exact-candidate-construction
            color: blue
            linger: 0.3
          - id: exact-candidate-s0-1
            phrase: Feed yesterday’s answer to the parser. To test today’s prompt, generate a fresh answer.
            targets:
              - exact-candidate-construction
            color: blue
            linger: 0.3
          - id: exact-candidate-s0-2
            phrase: Use the candidate and feature snapshot you plan to ship. Pin the golden set, generation
              settings and judge for that run.
            targets:
              - exact-candidate-construction
            color: blue
            linger: 0.3
        hold: 0.7
      - say: Keep helpfulness, grounding, safety and task-specific categories visible separately. Record the
          tool and policy versions that constrain possible actions. Measure token categories, latency and actual
          charges on comparable inputs. Estimate how much the scores vary and check the cases that matter most
          to users. Repeatedly rescoring a selected tiny sample until it passes changes the experiment.
        visual_cues:
          - id: exact-candidate-b2
            phrase: Keep helpfulness, grounding, safety and task-specific categories visible separately.
            targets:
              - exact-candidate-construction
            color: blue
            linger: 0.5
          - id: exact-candidate-s1-0
            phrase: Keep helpfulness, grounding, safety and task-specific categories visible separately.
