            color: blue
            linger: 0.3
          - id: registry-cache-s0-3
            phrase: If you use semantic versions, document what changes your compatibility policy permits.
            targets:
              - registry-cache-construction
            color: blue
            linger: 0.3
        hold: 0.7
      - say: Worker W loaded model twelve through the production alias. Move the alias to thirteen. W still holds
