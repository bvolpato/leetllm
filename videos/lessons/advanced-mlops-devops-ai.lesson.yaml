  - id: atomic-publication
    title: Compare and publish inside one transaction
    visual: Condition UPDATE on release and generation, then insert the audit in the same transaction. An
      unmatched token or exception cannot leave a half-committed local transition.
    beats:
      - say: In the local database, the target must be in the simulated ready set. The update looks for exactly
          one production row with release R at generation four, then writes S. The pending row now carries
          generation five. If that condition matches zero rows, the helper raises a stale-token error and
          the transaction rolls back.
        visual_cues:
          - id: atomic-publication-b1
            phrase: In the local database, the target must be in the simulated ready set.
            targets:
              - atomic-publication-construction
            color: blue
            linger: 0.5
