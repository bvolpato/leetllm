              release, new release, generation and reason.
            targets:
              - atomic-publication-construction
            color: blue
            linger: 0.3
          - id: atomic-publication-s1-1
            phrase: On the left, the insert succeeds and the transaction commits both writes.
            targets:
              - atomic-publication-construction
            color: blue
            linger: 0.3
          - id: atomic-publication-s1-2
            phrase: On the right, the insert raises an error. The same transaction restores R at generation four and
              adds no audit row.
            targets:
              - atomic-publication-construction
            color: blue
            linger: 0.3
          - id: atomic-publication-s1-3
            phrase: Putting the audit in a second transaction would allow the routing change to survive alone.
