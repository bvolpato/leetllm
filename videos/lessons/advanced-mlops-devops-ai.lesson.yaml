scenes:
  - id: intro
    title: Why was the release estimate a day off?
    visual: Compare the predicted and actual finish on adjacent calendar pages. Open the request trace,
      then replay its feature through the batch and serving paths with the same scorer and scale.
    beats:
      - say: DeployBuddy predicted Tuesday at noon. The release finished Wednesday at noon. Open that us-west
          request. The prompt, base model and adapter match the release we tested. What input changed?
        hold: 0.6
        visual_cues:
          - id: finish-gap
            phrase: The release finished Wednesday at noon
            targets: [finish-gap]
            color: pink
            caption_boundary: true
          - id: open-trace
            phrase: Open that us-west request
            targets:
              - request-trace
            color: blue
            caption_boundary: true
          - id: match-model
            phrase: prompt, base model and adapter match
            targets:
              - fixed-model
            color: blue
            caption_boundary: true
      - say: Follow one feature. Both paths start with three, four. The batch job divides each
          coordinate by the vector’s length, five. The serving path takes the raw coordinates. Our test
          scorer averages the two coordinates. What score will each path produce?
        hold: 2.2
        visual_cues:
          - id: load-vector
            phrase: three, four
            targets:
              - raw-feature
            color: blue
            caption_boundary: true
          - id: batch-transform
            phrase: divides each coordinate
            targets:
              - batch-lane
            color: blue
            caption_boundary: true
          - id: serving-transform
            phrase: takes the raw coordinates
            targets:
              - serving-lane
            color: blue
            caption_boundary: true
          - id: scoring-rule
            phrase: averages the two coordinates
            targets:
              - score-rule
            color: blue
            caption_boundary: true
          - id: predict-scores
            phrase: What score will each path produce
            targets:
              - batch-lane
              - serving-lane
              - score-rule
            color: yellow
            caption_boundary: true
      - say: Start with the batch job. Three fifths and four fifths give point six and point eight. Average
          those two values. Point seven. Now average the raw three and four. Three and a half.
        caption_starts: [Start with the batch job, Average those two values, Now average the raw three and four]
        hold: 0.85
        visual_cues:
          - id: unit-input
            phrase: Three fifths and four fifths give point six and point eight
            targets:
              - batch-lane
            color: green
            caption_boundary: true
          - id: batch-score
            phrase: Point seven
            targets:
              - batch-lane
            color: green
            caption_boundary: true
          - id: raw-score
            phrase: three and a half
            targets:
              - serving-lane
            color: pink
            caption_boundary: true
      - say: Now replay the assistant on the recorded request. Change only the transform and compare the
          finish times it predicts.
        hold: 0.9
        visual_cues:
          - id: model-replay
            phrase: Change only the transform
            targets:
              - batch-lane
              - serving-lane
            color: yellow
            caption_boundary: true
  - id: release-boundary
    title: What else went into the answer?
    visual: Keep the request and model fixed. Swap a release-calendar snapshot and expose the changed hour in
      the retrieved text. Distinguish a versioned manifest from the feature values attached to a single
      trace.
    beats:
      - say: There’s another way to change what this assistant sees. Take a separate example from the release
          calendar. The retrieved entry says the window opens at nine. Keep the request and model fixed, and
          load tomorrow’s calendar snapshot. The entry now says one in the afternoon. The assistant has
          different evidence before it generates a single word.
        hold: 0.9
        visual_cues:
          - id: calendar-request
            phrase: release calendar
            targets:
              - calendar-record
            color: blue
            caption_boundary: true
          - id: calendar-nine
            phrase: opens at nine
            targets:
              - calendar-record
            color: blue
            caption_boundary: true
          - id: calendar-swap
            phrase: tomorrow’s calendar snapshot
            targets:
              - calendar-record
            color: blue
            caption_boundary: true
          - id: calendar-one
            phrase: one in the afternoon
            targets:
              - calendar-record
            color: yellow
            caption_boundary: true
      - say: To reproduce that input, keep the corpus snapshot and its search index with the prompt, base weights,
          adapter and serving image. Pin the feature computation too. The individual request trace links to
          its timestamped feature values. The release also identifies the tool schema, guardrails and
          generation settings. Together these references form the release tuple.
        hold: 0.7
        visual_cues:
          - id: pin-retrieval
            phrase: corpus snapshot and its search index
            targets:
              - manifest-record
            color: blue
            caption_boundary: true
          - id: pin-feature
            phrase: feature computation too
            targets:
              - manifest-record
            color: blue
            caption_boundary: true
          - id: trace-values
            phrase: timestamped feature values
            targets:
              - request-record
            color: blue
            caption_boundary: true
          - id: pin-policy
            phrase: tool schema, guardrails and generation settings
            targets:
              - manifest-record
            color: blue
            caption_boundary: true
      - say: The release record also pins the golden set and the judge. A parser can check an exact field, such as
          the scheduled hour. Several wordings can express that hour correctly. For the whole answer, score
          groundedness and usefulness against reviewed examples. Pick the rubric and critical cases before
          editing the prompt.
        hold: 0.75
        visual_cues:
          - id: parser-field
            phrase: exact field
            targets:
              - calendar-field
            color: blue
            caption_boundary: true
          - id: rubric
            phrase: groundedness and usefulness
            targets:
              - calendar-rubric
            color: blue
            caption_boundary: true
  - id: gitops-contract
    title: Make desired state an observed control loop
    visual: Pull an immutable desired manifest, compare it with runtime, and enact the configured reconciliation.
      An emergency pointer and durable desired state can disagree.
    beats:
      - say: GitOps adds four properties to that tuple. Express desired state declaratively. Retain versioned,
          immutable history. Let an agent pull those declarations. Continuously observe runtime and attempt to
          reconcile it with the declaration. A worker can still be serving the old release while the new one
          loads.
        visual_cues:
          - id: gitops-contract-b1
            phrase: GitOps adds four properties to that tuple.
            targets:
              - gitops-contract-construction
            color: blue
            linger: 0.5
          - id: gitops-contract-s0-0
            phrase: GitOps adds four properties to that tuple.
            targets:
              - gitops-contract-construction
            color: blue
            linger: 0.3
          - id: gitops-contract-s0-1
            phrase: Express desired state declaratively.
            targets:
              - gitops-contract-construction
            color: blue
            linger: 0.3
          - id: gitops-contract-s0-2
            phrase: Retain versioned, immutable history.
            targets:
              - gitops-contract-construction
            color: blue
            linger: 0.3
          - id: gitops-contract-s0-3
            phrase: Let an agent pull those declarations.
            targets:
              - gitops-contract-construction
            color: blue
            linger: 0.3
          - id: gitops-contract-s0-4
            phrase: Continuously observe runtime and attempt to reconcile it with the declaration.
            targets:
              - gitops-contract-construction
            color: blue
            linger: 0.3
          - id: gitops-contract-s0-5
            phrase: A worker can still be serving the old release while the new one loads.
            targets:
              - gitops-contract-construction
            color: blue
            linger: 0.3
        hold: 0.7
      - say: Keep large model bytes and private data in suitable immutable storage. Put verified digests and
          references in the manifest. A reviewed change can evaluate the candidate and then change desired
          state. Registration may happen before evaluation so the test can load those bytes. Approval comes
          after the gates. Rebuilding different bytes afterward breaks the tested identity.
        visual_cues:
          - id: gitops-contract-b2
            phrase: Keep large model bytes and private data in suitable immutable storage.
            targets:
              - gitops-contract-construction
            color: blue
            linger: 0.5
          - id: gitops-contract-s1-0
            phrase: Keep large model bytes and private data in suitable immutable storage.
            targets:
              - gitops-contract-construction
            color: blue
            linger: 0.3
          - id: gitops-contract-s1-1
            phrase: Put verified digests and references in the manifest.
            targets:
              - gitops-contract-construction
            color: blue
            linger: 0.3
          - id: gitops-contract-s1-2
            phrase: A reviewed change can evaluate the candidate and then change desired state.
            targets:
              - gitops-contract-construction
            color: blue
            linger: 0.3
          - id: gitops-contract-s1-3
            phrase: Registration may happen before evaluation so the test can load those bytes.
            targets:
              - gitops-contract-construction
            color: blue
            linger: 0.3
          - id: gitops-contract-s1-4
            phrase: Approval comes after the gates.
            targets:
              - gitops-contract-construction
            color: blue
            linger: 0.3
          - id: gitops-contract-s1-5
            phrase: Rebuilding different bytes afterward breaks the tested identity.
            targets:
              - gitops-contract-construction
            color: blue
            linger: 0.3
        hold: 0.7
      - say: An emergency may first move traffic to a healthy baseline. Record the authorized action, then coordinate
          the durable desired-state repair. Argo CD’s self-heal setting controls automatic correction of live
          drift; other source changes can also trigger synchronization. Its rollback command is unavailable
          with automated sync enabled. Ordinary rollback therefore uses a reviewed desired-state change, with
          any emergency suspension designed separately.
        visual_cues:
          - id: gitops-contract-b3
            phrase: An emergency may first move traffic to a healthy baseline.
            targets:
              - gitops-contract-construction
            color: blue
            linger: 0.5
          - id: gitops-contract-s2-0
            phrase: An emergency may first move traffic to a healthy baseline.
            targets:
              - gitops-contract-construction
            color: blue
            linger: 0.3
          - id: gitops-contract-s2-1
            phrase: Record the authorized action, then coordinate the durable desired-state repair.
            targets:
              - gitops-contract-construction
            color: blue
            linger: 0.3
          - id: gitops-contract-s2-2
            phrase: Argo CD’s self-heal setting controls automatic correction of live drift; other source changes can also
              trigger synchronization.
            targets:
              - gitops-contract-construction
            color: blue
            linger: 0.3
          - id: gitops-contract-s2-3
            phrase: Its rollback command is unavailable with automated sync enabled.
            targets:
              - gitops-contract-construction
            color: blue
            linger: 0.3
          - id: gitops-contract-s2-4
            phrase: Ordinary rollback therefore uses a reviewed desired-state change, with any emergency suspension
              designed separately.
            targets:
              - gitops-contract-construction
            color: blue
            linger: 0.3
        hold: 0.7
  - id: release-fingerprint
    title: Hash the actual composed payload
    visual: Serialize sorted keys, hash the exact bytes and compare full digests. Changing only feature_view
      changes release identity; alternate serializations belong to distinct digest domains.
    beats:
      - say: Here are two release records for DeployBuddy. Each holds the prompt, base, adapter, serving image and
          feature view. The only edit moves the feature view from version four to five. Sort the keys,
          serialize each record with Python’s usual JSON spacing, and hash the bytes with SHA two fifty-six.
        visual_cues:
          - id: release-fingerprint-b1
            phrase: Here are two release records for DeployBuddy. Each holds the prompt, base, adapter, serving image
              and feature view.
            targets:
              - release-fingerprint-construction
            color: blue
            linger: 0.5
          - id: release-fingerprint-s0-0
            phrase: Here are two release records for DeployBuddy. Each holds the prompt, base, adapter, serving image
              and feature view.
            targets:
              - release-fingerprint-construction
            color: blue
            linger: 0.3
          - id: release-fingerprint-s0-1
            phrase: The only edit moves the feature view from version four to five.
            targets:
              - release-fingerprint-construction
            color: blue
            linger: 0.3
          - id: release-fingerprint-s0-2
            phrase: Sort the keys, serialize each record with Python’s usual JSON spacing, and hash the bytes with SHA
              two fifty-six.
            targets:
              - release-fingerprint-construction
            color: blue
            linger: 0.3
        hold: 0.7
      - say: Look at the start of the baseline digest. The candidate already differs in its first few characters.
          Each full digest has sixty-four hexadecimal characters. The printed label shows ten. Keep the full
          value when you bind a test or a trace to a release. A digest identifies the bytes you supplied.
          You still have to test what they do.
        visual_cues:
          - id: release-fingerprint-b2
            phrase: Look at the start of the baseline digest.
            targets:
              - release-fingerprint-construction
            color: blue
            linger: 0.5
          - id: release-fingerprint-s1-0
            phrase: Look at the start of the baseline digest.
            targets:
              - release-fingerprint-construction
            color: blue
            linger: 0.3
          - id: release-fingerprint-s1-1
            phrase: The candidate already differs in its first few characters.
            targets:
              - release-fingerprint-construction
            color: blue
            linger: 0.3
          - id: release-fingerprint-s1-2
            phrase: Each full digest has sixty-four hexadecimal characters.
            targets:
              - release-fingerprint-construction
            color: blue
            linger: 0.3
          - id: release-fingerprint-s1-3
            phrase: The printed label shows ten. Keep the full value when you bind a test or a trace to a release.
            targets:
              - release-fingerprint-construction
            color: blue
            linger: 0.3
          - id: release-fingerprint-s1-4
            phrase: A digest identifies the bytes you supplied. You still have to test what they do.
            targets:
              - release-fingerprint-construction
            color: blue
            linger: 0.3
        hold: 0.7
      - say: The dictionary here uses Python’s ordinary JSON separators. The SQLite lab uses compact separators
          and a different set of fields, so it hashes different bytes. A feature fingerprint covers a
          smaller record again. Keep each digest beside its payload and serialization rule. Compare two
          digests when they identify the same kind of record.
        visual_cues:
