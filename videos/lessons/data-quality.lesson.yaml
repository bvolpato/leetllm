          - id: similarity-beat-1-focus-1
            phrase: giving Jaccard similarity three quarters
            targets:
              - similarity-simulation-55
            color: blue
            linger: 0.6
          - id: similarity-beat-1-focus-2
            phrase: Exact matching misses edited copies
            targets:
              - similarity-object-part-57
            color: blue
