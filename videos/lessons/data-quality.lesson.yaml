            color: blue
            linger: 0.2
            caption_boundary: true
  - id: intake
    title: Give every row a clear contract
    visual: Rows with typed identifiers and reviewed labels pass; one missing label diverts to a quarantine lane
      as the intake count updates.
    beats:
      - say: Start with a small support-ticket table. Each row needs a unique identifier, a conversation key, text,
          and a reviewed label from the declared vocabulary. Those fields make the later decisions traceable.
        hold: 0.55
        visual_cues:
          - id: intake-beat-1-focus-1
            phrase: Start with a small support-ticket table
            targets:
              - intake-object-ticket-16
            color: blue
            linger: 0.6
      - say: Ticket one hundred four has a message and no label. A structural check can see the missing value; a
          domain check can reject a label outside the approved set. Both decisions belong at the intake
          boundary.
        hold: 0.6
        visual_cues:
          - id: intake-beat-2-focus-1
            phrase: Ticket one hundred four has a message and no label
            targets:
              - intake-object-ticket-16
            color: blue
            linger: 0.6
      - say: Batch checks ask a broader question. A sudden rise in missing labels or a changed class mix may point to
          a source or annotation change, even when each surviving row passes its local checks.
        hold: 0.65
        visual_cues:
          - id: intake-beat-3-focus-1
            phrase: Batch checks ask a broader question
            targets:
              - intake-object-ticket-16
            color: blue
            linger: 0.6
