  - id: corpus-selection
    title: A prose filter can remove useful technical data
    visual: A concrete command log and repeated navigation extract cross the same rule; actual domain counts
      reveal the changed retained mix before controlled ablation.
    beats:
      - say: Web-scale selection applies the same gates to many more records. A length rule, symbol ratio, common-word
          count or repeated-line rule can remove broken extraction. Apply a prose symbol rule to an otherwise
          useful command log and it can reject the very technical evidence the target model needs. A repeated
          error line may be either scraper noise or the structure of an incident. The threshold alone cannot
          tell those explanations apart.
        hold: 0.65
        visual_cues:
          - id: corpus-selection-b1
            phrase: Web-scale selection applies the same gates to many more records.
            targets:
              - corpus-selection-construction
            color: blue
            linger: 0.5
          - id: corpus-selection-voice-1
            phrase: Web-scale selection applies the same gates to many more records. A length rule, symbol ratio,
              common-word count or repeated-line rule can remove broken extraction. Apply a prose symbol rule
              to an otherwise useful command log and it can reject the very technical evidence the target
              model needs. A repeated error line may be either scraper noise or the structure of an incident.
              The threshold alone cannot tell those explanations apart.
            targets:
              - corpus-selection-construction
            color: blue
            linger: 0.5
      - say: Keep a reviewed sample and count removals by source, language and domain. In our supplied selection
          worksheet, a filter removes eight of ten logs but only one of ten prose pages. The retained mix
