  - id: normalization
    title: Define which text differences matter
    visual: Two whitespace and case variants flow through a visible normalization transform to one exact
      fingerprint; a sentence containing negation stays separate.
    beats:
      - say: The strings “Build is still failing” and “  BUILD is still failing  ” represent the same message under a
          rule that folds case and collapses whitespace. Follow each text field through the transformation.
          Its ticket, conversation, and reviewed label stay attached, while the raw version remains available
          for inspection.
        hold: 0.55
        visual_cues:
          - id: normalization-beat-1-focus-1
            phrase: Follow each text field through the transformation
            targets:
              - normalization-simulation-22
            color: blue
            linger: 0.6
          - id: normalization-beat-1-focus-2
            phrase: a rule that folds case and collapses whitespace
            targets:
              - normalization-simulation-22
            color: blue
            linger: 0.6
      - say: Unicode compatibility normalization can combine forms such as the ligature in “ﬁ” with the letters “fi”.
          That can be useful for matching. It can also alter code or identifiers, so test the rule against the
          task.
        hold: 0.6
        visual_cues:
          - id: normalization-beat-2-focus-1
            phrase: Unicode compatibility normalization can combine forms such as
            targets:
              - normalization-simulation-22
            color: blue
            linger: 0.6
      - say: The two records now share one normalized string and one SHA-256 lookup key. “Build is not failing”
          remains different text. To find messages with similar meaning, compare text features or embeddings
          after exact matching.
        hold: 0.65
        visual_cues:
          - id: normalization-beat-3-focus-1
            phrase: The two records now share one normalized string
            targets:
              - normalization-simulation-22
            color: blue
            linger: 0.6
  - id: unicode-recipe
    title: Construct the exact comparison key
    visual: Pinned raw text undergoes NFKC, full casefold and whitespace collapse; transformed case-sensitive
      identifiers expose a real collision.
    beats:
      - say: The reference Python recipe first applies Unicode NFKC, then full case folding, then whitespace collapse.
          Compatibility decomposition and composition turn the fi ligature into two letters, superscript two
          into two, and a full-width A into A. Case folding maps the German sharp s to two s letters. This is
          more than simply converting capital letters to lowercase.
