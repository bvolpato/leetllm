scenes:
  - id: intro
    title: Which label will the router give the second ticket?
    visual: Two turns from one support thread slide into training and evaluation. Their words line up. With the
      training copy removed, ticket 102 changes predictions and the other evaluation tickets keep theirs.
    beats:
      - say: “Build is still failing.” One copy lands in training, the other in evaluation. Both came from the
          same conversation. Fold case and trim the spaces. Now the words match. On a match, the router copies
          the training label. Otherwise it predicts standard. What will it call the second ticket?
        caption_starts:
          - "One copy lands"
          - "On a match"
          - "What will it call the second ticket?"
        hold: 2.7
        visual_cues:
          - id: lookup-normalize
            phrase: Fold case and trim the spaces
            targets:
              - lookup-messages
            color: blue
            linger: 0.2
            caption_boundary: true
      - say: Escalate. The router copied the label from ticket one oh one. Across all three evaluation tickets,
          that gives it two correct predictions.
        caption_starts:
          - "Across all three evaluation tickets"
        hold: 1
        visual_cues:
          - id: lookup-score
            phrase: Escalate
            targets:
              - lookup-answers
            color: blue
            linger: 0.2
            caption_boundary: true
          - id: lookup-tally
            phrase: two correct predictions
            targets:
              - lookup-answers
            color: blue
            linger: 0.2
            caption_boundary: true
      - say: Slide the training copy out. The other training ticket is about the deploy policy. The three
          evaluation tickets stay put. What will the router predict for the build message now?
        caption_starts:
          - "What will the router predict"
        hold: 2.8
        motion_check:
          region:
            - 120
            - 285
            - 1700
            - 650
          minimumChangedFraction: 0.002
        visual_cues:
          - id: lookup-remove
            phrase: Slide the training copy out
            targets:
              - lookup-messages
            color: blue
            linger: 0.2
            caption_boundary: true
      - say: Standard. The matching entry is gone. Only one of the three predictions is now correct. That extra
          point came from splitting a conversation. To test on new conversations, keep all the tickets from
          each one in the same split.
        caption_starts:
          - "That extra point came from splitting a conversation"
        hold: 1.4
        visual_cues:
          - id: lookup-default
            phrase: Standard
            targets:
              - lookup-answers
            color: blue
            linger: 0.2
            caption_boundary: true
          - id: lookup-rescore
            phrase: Only one of the three predictions is now correct
            targets:
