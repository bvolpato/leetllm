  - id: references
    title: A handle connects ownership to stored bytes
    visual: The owner row connects Driver metadata to ObjectRef A. Separate Node A and Node B rows label producer
      and consumer workers beside their local object stores. The constructed trace adds a 64-byte Node B copy
      and calculates total stored-copy bytes.
    beats:
      - say: >
          An object reference is a handle to a result, with ownership and lifetime rules. The process that
          submits a task generally owns its result reference. A different worker computes the bytes. Keeping
          the owner and the physical storage separate makes several failure cases easier to understand.
        hold: 0.6
        visual_cues:
          - id: references-beat-1-focus-1
            phrase: The process that submits a task generally owns its result reference
            targets:
              - references-owner-metadata
            color: cyan
            linger: 0.65
          - id: references-beat-1-focus-2
            phrase: A different worker computes the bytes
            targets:
              - references-producer-result
              - references-node-a-copy
            color: yellow
            linger: 0.65
      - say: >
          A consumer on another node needs access to the value. Our constructed trace adds a second stored
          copy while preserving the original owner. Eligible arrays can use shared-memory views locally.
          Remote transfer, retained storage and reference bookkeeping still consume resources even when the
          driver avoids materializing the payload.
        hold: 0.6
        visual_cues:
          - id: references-beat-2-focus-1
            phrase: Our constructed trace adds a second stored copy while preserving the original owner
            targets:
              - references-owner-metadata
              - references-node-a-copy
              - references-copy-transfer
              - references-node-b-copy
              - references-copy-total
            color: cyan
            linger: 0.65
          - id: references-beat-2-focus-2
            phrase: A consumer on another node needs access to the value
            targets:
              - references-consumer-node-b
              - references-node-b-copy
              - references-copy-transfer
            color: yellow
            linger: 0.65
      - say: >
          Losing one copy can be repaired from another. Reconstructing all lost copies of a task result
          requires live ownership information, usable lineage and available dependencies. A value placed
          directly into storage has no generating task to replay. Surviving bytes alone also cannot restore a
          lost owner's metadata contract.
        hold: 0.6
        visual_cues:
          - id: references-beat-3-focus-1
            phrase: Surviving bytes alone also cannot restore a lost owner's metadata contract
            targets:
              - references-owner-metadata
              - references-node-a-copy
              - references-node-b-copy
            color: cyan
            linger: 0.65
          - id: references-beat-3-focus-2
            phrase: Reconstructing all lost copies of a task result requires live ownership information
            targets:
              - references-owner-metadata
              - references-node-a-copy
              - references-node-b-copy
            color: yellow
            linger: 0.65
  - id: lost-result
    title: Which part of the result did we lose?
    visual: ObjectRefA remains owned by live driverD while copies exist on nodeA and nodeB. Remove copyA and
      fetch B; separately remove every copy and replay task lineage; finally lose ownerD while bytesB remain.
      Stored bytes, replayable generation and live ownership are independent recovery requirements.
    beats:
      - say: Start with the driver alive and a copy on each of two nodes. Remove the copy on A. Ray can fetch the
          surviving copy on B, even if the task has no retries left. Now remove every copy of the task result.
          Can Ray make another one? Here the owner still has the task's lineage, its inputs can be recovered,
          and a retry is available. Replay the generating task. A deterministic calculation gives us the same
          value. Any external write needs its own protection.
        hold: 0.65
        caption_starts:
          - Here the owner still has the task's lineage
