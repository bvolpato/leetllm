scenes:
  - id: intro
    title: When can the ledger count all three?
    visual: Fly cache and router onto two worker lanes. Keep trace waiting until router finishes. Compare
      the two schedules on one ruler, then keep the three results visible while the ledger restarts.
    beats:
      - say: Ray sends cache to one worker and router to the other. Trace is waiting. Cache needs four ticks.
          Router needs two. Watch router finish. Worker two picks up trace. Three more ticks and all three
          results are ready at five. With one worker they'd finish at nine. The ledger counts three.
          The driver holds a handle for each result. Now the process that kept count exits. Its replacement
          starts with the constructor shown here. What count will it report?
        hold: 2.4
        caption_starts:
          - Worker two picks up trace
          - With one worker
        visual_cues:
          - id: intro-first-finish
            phrase: Cache needs four ticks. Router needs two. Watch router finish
            targets: [intro-cache-task, intro-router-task]
            color: cyan
            linger: 0.3
          - id: intro-worker
            phrase: Worker two picks up trace
            targets: [intro-trace-task]
            color: yellow
            linger: 0.3
          - id: intro-finish
            phrase: Three more ticks and all three results are ready at five
            targets: [intro-ledger-count]
            color: green
            linger: 0.3
          - id: intro-schedule
            phrase: With one worker they'd finish at nine
            targets:
              - intro-schedule-payoff
              - intro-ledger-count
            color: cyan
            linger: 0.3
          - id: intro-lab
            phrase: The ledger counts three
            targets:
              - word-rows
            color: cyan
            linger: 0.3
          - id: intro-words
            phrase: The driver holds a handle for each result
            targets:
              - word-rows
            color: cyan
            linger: 0.3
          - id: intro-exit
            phrase: the process that kept count exits
            targets:
              - process-number
            color: pink
            linger: 0.3
          - id: intro-question
            phrase: What count will it report
            targets:
              - process-number
            color: yellow
            linger: 0.3
      - say: Zero. The old process kept the count in memory. Look at router. A worker already computed that pair of
          numbers. The driver owns the handle for the result, and the driver is still alive.
        hold: 0.8
        visual_cues:
          - id: intro-zero
            phrase: Zero
            targets:
              - process-number
            color: yellow
            linger: 0.3
          - id: intro-router
            phrase: Look at router
            targets:
              - router-row
            color: green
            linger: 0.3
      - say: Give the new ledger those same three handles in one call. Ray delivers the three values to it. The
          ledger counts them and we're back at three. That ledger is a Ray actor. Each call goes to an
          instance that can remember what the last call did.
        hold: 1
        visual_cues:
          - id: intro-send
            phrase: Ray delivers the three values to it
            targets:
              - record-path
            color: cyan
            linger: 0.3
          - id: intro-record
            phrase: we're back at three
            targets:
              - process-number
            color: green
            linger: 0.3
  - id: primitive-contract
    title: What is inside a feature result?
    visual: Add the five character codes of cache, reduce the sum modulo 101 and pair the remainder with the
      length. Keep the handle for each word distinct from the completed tuple and the ledger's mutable state.
    beats:
      - say: Where did those pairs come from? Take the word cache. It has five letters. Add their character codes and
          you get five hundred. Four lots of one hundred and one fit into that sum. The remainder is ninety-six.
          The first number is the length, and the second is that remainder. Router and trace use exactly the same
          calculation.
        hold: 1.1
        visual_cues:
          - id: ray-primitive-contract-op-0
            phrase: Add their character codes and you get five hundred
            targets:
              - primitive-codes
            color: cyan
            linger: 0.3
          - id: primitive-cache-remainder
            phrase: The remainder is ninety-six
            targets:
              - primitive-cache
            color: green
            linger: 0.3
          - id: ray-feature-values
            phrase: Router and trace use exactly the same calculation
            targets:
              - primitive-other-rows
            color: green
            linger: 0.3
      - say: Each word takes one remote function call. That's a task. Submission gives the driver a handle that Ray
          calls an object reference. A worker can still be computing the tuple when that handle arrives. Once
          complete, the tuple keeps its value. These tiny calculations make the results easy to check by hand.
          Real jobs need enough work per task to pay for scheduling it.
        hold: 0.75
        visual_cues:
          - id: ray-primitive-contract-op-1
            phrase: a handle that Ray calls an object reference
            targets:
              - primitive-handles
            color: cyan
            linger: 0.3
          - id: ray-tuple-immutable
            phrase: Once complete
            targets:
              - primitive-values
            color: green
            linger: 0.3
      - say: The ledger has a different job. It keeps a running count between calls. Our ordinary synchronous actor
          takes one method call at a time. If a second caller joins in, the callers can't assume a shared
          order. Async and threaded actors can also run methods concurrently. A single ledger makes the state
          easy to locate, but calls can pile up here.
        hold: 0.85
        visual_cues:
          - id: ray-primitive-contract-op-2
            phrase: takes one method call at a time
            targets:
              - primitive-queue
            color: cyan
            linger: 0.3
  - id: dependencies
    title: Two workers, three feature calls
    visual: Grow task intervals along one fixed ruler. Immediate get postpones submission. Allowing the same
      calls to overlap shortens elapsed time while keeping total worker time fixed.
    beats:
      - say: Give our three calls two available worker slots. We'll use simple durations and leave out scheduling
          overhead. Cache takes four time units. Router takes two and trace takes three. Watch a driver that
          fetches each answer immediately. The second worker sits idle because the next call hasn't been
          submitted. When does the last answer arrive?
        hold: 1.6
        visual_cues:
          - id: schedule-serial
            phrase: fetches each answer immediately
            targets:
              - schedule-trace
            color: cyan
            linger: 0.3
      - say: At nine time units. Now submit the three calls before waiting. Cache and router can start together.
          Router finishes at two, so that worker takes trace. Before the clock moves again, work out when both
          workers will be free.
        hold: 2
        visual_cues:
          - id: schedule-pair
            phrase: Cache and router can start together
            targets:
              - schedule-trace
            color: cyan
            linger: 0.3
          - id: schedule-handoff
            phrase: Router finishes at two
            targets:
              - schedule-trace
            color: yellow
            linger: 0.3
          - id: schedule-nine
            phrase: At nine time units
            targets:
              - schedule-comparison
            color: green
            linger: 0.3
      - say: At five. Trace used three more units after router's two. Cache finished at four. Put the two runs on
          the same ruler. We still spent nine worker units on the three words. Overlap shortened the wait for
          the last result. Passing handles on to the ledger lets the driver leave those values with their
          consumers.
        hold: 1
        visual_cues:
          - id: schedule-finish
            phrase: At five
            targets:
              - schedule-trace
            color: green
            linger: 0.3
          - id: schedule-compare
            phrase: Put the two runs on the same ruler
            targets:
              - schedule-comparison
            color: cyan
            linger: 0.3
  - id: argument-inspection
    title: What reaches the actor method?
    visual: Pin the three handles and their values to the same rows. Separate arguments arrive as tuples. Change
      only the outer brackets and compare the contents in the method on the right.
    beats:
      - say: Look at the call to record. The star in front of refs supplies three separate arguments. The driver can
          submit this call while the workers are still busy. Ray resolves all three handles before the method
          starts. The ledger sees one tuple per document and increments its count by three. The driver fetches
          that one small count.
        hold: 0.9
        visual_cues:
          - id: argument-splat
            phrase: three separate arguments
            targets:
              - argument-call
            color: cyan
            linger: 0.3
          - id: argument-resolved
            phrase: Ray resolves all three handles
            targets:
              - argument-result
            color: green
            linger: 0.3
          - id: argument-count
            phrase: increments its count by three
            targets:
              - argument-reply
            color: green
            linger: 0.3
      - say: Send the same handles to the inspection method, this time inside a single list. All three tasks have
          finished. When the actor opens that list, does it find tuples or handles?
        hold: 2
        visual_cues:
          - id: argument-list
            phrase: inside a single list
            targets:
              - argument-call
            color: yellow
            linger: 0.3
      - say: Handles. The actor can choose when to fetch any of them. Finishing a task changes whether its value is
          ready. The brackets change what arrives as a method argument. The lab checks both the count and the
          types in this list. The driver can avoid gathering the feature values and still pay for references
          and the data they keep alive.
        hold: 0.9
        visual_cues:
          - id: argument-nested
            phrase: Handles
            targets:
              - argument-result
            color: green
            linger: 0.3
          - id: argument-checked
            phrase: both the count and the types in this list
            targets:
              - argument-reply
            color: cyan
            linger: 0.3
