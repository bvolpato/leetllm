            color: yellow
            linger: 0.45
      - say: A task that requests one CPU takes one logical slot. The operating system still schedules its threads
          on physical cores. Ray uses the explicit CPU request to set the OpenMP thread count unless you
          override it. Other libraries may have their own thread pools. A GPU request tells a worker which
          device to use. Set memory limits and isolation separately.
        hold: 0.65
        visual_cues:
          - id: ray-scheduler-owners-op-2
            phrase: A task that requests one CPU takes one logical slot. The operating system still schedules its
              threads on physical cores. Ray uses the explicit CPU request to set the OpenMP thread count unless
              you override it. Other libraries may have their own thread pools. A GPU request tells a worker
              which device to use. Set memory limits and isolation separately.
            targets:
              - ray-scheduler-owners-mechanism
            color: cyan
            linger: 0.45
  - id: actor-resource
    title: Count resources held by a waiting actor
    visual: Two explicit one-CPU actors occupy both slots of a two-CPU illustrative node. Submit a one-CPU child
      while an actor waits; retain both lifetime reservations, then free one actor’s resource in a separate
      repair. The child cannot fit until a slot exists; waiting does not release an explicitly reserved actor
      CPU.
    beats:
      - say: Give each actor one logical CPU for as long as it lives. Our machine has two. Start actor L and one slot
          is left. Start actor M and both slots are taken. L asks for a one-CPU child task and waits. Look at L's
          slot. The waiting actor still holds it, so the child stays queued.
        hold: 0.65
        visual_cues:
          - id: ray-actor-resource-op-0
            phrase: Give each actor one logical CPU for as long as it lives. Our machine has two. Start actor L and one
              slot is left. Start actor M and both slots are taken. L asks for a one-CPU child task and waits. Look
