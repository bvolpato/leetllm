  - id: scheduler-owners
    title: Move work through its execution owner
    visual: A driver submits taskA while an existing actorL stays on nodeB. Route the task request through
      CoreWorker to node-local raylet scheduling; send a large argument to actorL rather than relocating L;
      keep GCS cluster records separate. Resource/data locality and actor process identity produce different
      paths.
    beats:
      - say: The driver builds dependencies through the Python API and CoreWorker. A raylet on each node manages
          local workers and resources and helps decide where a task runs. The worker executes the Python
          function. The Global Control Service tracks the cluster's nodes, actors and placement groups.
        hold: 0.65
        visual_cues:
          - id: ray-scheduler-owners-op-0
            phrase: The driver builds dependencies through the Python API and CoreWorker. A raylet on each node
              manages local workers and resources and helps decide where a task runs. The worker executes the
              Python function. The Global Control Service tracks the cluster's nodes, actors and placement
              groups.
            targets:
              - ray-scheduler-owners-mechanism
            color: cyan
            linger: 0.45
      - say: Ray can place an ordinary task close to its data if the resources it needs are free there. Look at
          actor L on node B. Its process keeps the ledger there between calls. When a large argument starts on
          node A, the bytes travel to L on B.
        hold: 0.65
        visual_cues:
          - id: ray-scheduler-owners-op-1
            phrase: Ray can place an ordinary task close to its data if the resources it needs are free there. Look at
              actor L on node B. Its process keeps the ledger there between calls. When a large argument starts
              on node A, the bytes travel to L on B.
            targets:
              - ray-scheduler-owners-mechanism
            color: cyan
            linger: 0.45
          - id: ray-actor-fixed
