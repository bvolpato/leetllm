            linger: 0.35
      - say: "Count the trainable version with one bias per affine block: six input weights, four recurrent weights and two hidden biases make twelve. The head adds six weights and three biases, making twenty-one total. Three, thirty and three hundred events all reuse those twenty-one parameters. They still require different amounts of execution and, during full BPTT, saved intermediate activation memory."
        hold: 0.8
