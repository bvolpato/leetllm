  - id: action-head
    title: Read the two-coordinate incident summary
    visual: The same final vector enters an explicit three-row action projection and stable softmax before parameter tiles are counted.
    beats:
      - say: Read the displayed rounded final state, point three nine zero and point six five five, through a three-by-two action matrix. Its rows are point seven, minus point three; minus point four, point eight; and point one, point two. These correspond to ignore, rollback and escalate. The first row yields point zero seven six five, the second point three six eight, the third point one seven zero. Which action has the largest logit?
        hold: 1
        visual_cues:
          - id: action-head-0
            phrase: Read the displayed rounded final state
            targets:
              - action-head-operation
            linger: 0.5
          - id: head-row-0
            phrase: The first row yields point zero seven six five
            targets:
              - action-head-operation
            linger: 0.35
          - id: head-row-1
            phrase: the second point three six eight
            targets:
              - action-head-operation
            linger: 0.35
          - id: head-row-2
            phrase: the third point one seven zero
            targets:
              - action-head-operation
            linger: 0.35
      - say: Rollback has the largest logit before any exponential. Subtract the maximum, exponentiate and normalize to obtain approximately point two nine one, point three eight nine and point three two zero. This supplied trace gives rollback thirty-eight point nine percent probability. It supplies no held-out accuracy evidence. The classifier can only read information retained in the final state, although that vector can encode information about the prefix and its length.
        hold: 0.8
        visual_cues:
          - id: action-head-1
            phrase: Rollback has the largest logit
            targets:
              - action-head-operation
            linger: 0.5
