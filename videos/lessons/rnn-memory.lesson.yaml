scenes:
  - id: intro
    title: Who chased whom?
    visual: Two ordinary sentences reverse their actors. One carried clue explains the changed answer.
    beats:
      - say: "In “The dog chased the cat,” the dog acted. Swap the animal names and the cat acted. Those few words make a real sequence problem: the clue arrives before the ending. What has to stay in memory until the model can answer?"
        hold: 0.65
        visual_cues:
          - id: reversed-sentence
            phrase: Swap the animal names
            targets:
              - reversed-sentence
            color: pink
            linger: 0.6
          - id: actor-role-reverses
            phrase: the cat acted
            targets:
              - reversed-roles
            color: pink
            linger: 0.6
      - say: An RNN reads one word at a time. After each word, it updates a hidden state, a vector of clues from the sequence so far. The next update reuses the previous state, letting earlier words shape what the model can answer later.
        hold: 0.6
        visual_cues:
          - id: hidden-state
            phrase: updates a hidden state
            targets:
              - recurrent-memory
            color: yellow
            linger: 0.6
          - id: previous-state
            phrase: reuses the previous state
            targets:
              - recurrent-memory
            color: cyan
            linger: 0.6
      - say: First we’ll build this memory by hand. Then we’ll follow its learning signal and see why LSTMs and GRUs add gates that control retention.
        hold: 0.8
        visual_cues:
          - id: build-memory
            phrase: build this memory by hand
            targets:
              - actor-question
            color: yellow
            linger: 0.6
          - id: control-retention
            phrase: control retention
            targets:
              - recurrent-memory
            color: yellow
            linger: 0.6
  - id: recurrence
    title: Carry the actor clue to the end
    visual: A hand-coded actor feature enters once, then the same recurrent update carries it across the remaining sentence.
    beats:
      - say: "Let’s isolate one coordinate of the hidden vector: the actor clue. For this small example, we hand-code the input feature: dog is plus 0.8 and cat is minus 0.8 when it fills the actor role. The other words send zero on this coordinate. A trained model learns richer features from examples."
        hold: 0.6
        visual_cues:
          - id: actor-feature
            phrase: hand-code the input feature
            targets:
              - actor-feature
            color: blue
            linger: 0.6
          - id: dog-input
            phrase: dog is plus 0.8
            targets:
              - actor-input
            color: blue
            linger: 0.6
          - id: neutral-words
            phrase: other words send zero
            targets:
              - neutral-input
            color: cyan
            linger: 0.6
      - say: Start with “The dog chased the cat.” The actor feature enters at “dog.” The cell adds the current input to 0.9 times the previous state, then applies tanh. After dog, the state becomes about 0.664. This visible toy value lets us track what survives.
        hold: 0.6
        visual_cues:
          - id: actor-word
            phrase: enters at “dog”
            targets:
              - sentence-actor-dog
            color: blue
            linger: 0.6
          - id: previous-memory
            phrase: previous state
            targets:
              - recurrence-old-state
            color: pink
            linger: 0.6
          - id: apply-tanh
            phrase: applies tanh
            targets:
              - recurrence-equation
              - recurrence-new-state
            color: yellow
            linger: 0.6
      - say: For the next words, this coordinate gets zero input. The same update carries its value through “chased,” “the,” and “cat,” shrinking it along the way. The final state remains positive, so this simple readout keeps dog as the actor.
        hold: 0.8
        motion_check:
          region:
