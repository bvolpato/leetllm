            linger: 0.35
  - id: vector-build
    title: Construct each coordinate from the same matrices
    visual: Keep named one-hot events, input matrix and recurrent matrix visible while columns and dot products build a two-coordinate state.
    beats:
      - say: "Give each incident event its own one-hot input: error is one, zero, zero; reproduction zero, one, zero; rollback zero, zero, one. These encode the current event, not cumulative flags. Input width is three and hidden width two. The input matrix has rows point eight, point two, point one; and point one, point seven, point four. The recurrent matrix has rows point five, point one; and zero, point six. Biases are zero. Each row builds one hidden coordinate."
        hold: 1
        visual_cues:
          - id: vector-build-0
            phrase: Give each incident event its own one-hot input
            targets:
              - vector-build-operation
            linger: 0.5
          - id: vector-columns
            phrase: Each row builds one hidden coordinate
            targets:
              - vector-build-operation
            linger: 0.35
      - say: "At the error event, one-hot multiplication selects the first input column, point eight and point one. The old state is zero, so the recurrent product contributes zero. Element-wise tanh gives point six six four and point one zero zero. At reproduction, select the second column, point two and point seven. Multiply the same recurrent matrix by the old state to obtain about point three four two and point zero six zero. Add and apply tanh: the next state is about point four nine four and point six four one."
        hold: 0.8
        visual_cues:
          - id: vector-build-1
            phrase: At the error event
            targets:
              - vector-build-operation
            linger: 0.5
          - id: vector-second-reveal
            phrase: point four nine four and point six four one
