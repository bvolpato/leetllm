  - id: actual-credit
    title: Differentiate the incident that we actually ran
    visual: Carry an end-state gradient backward through saved scalar states; local derivative factors and shared-weight contributions are computed from that same trace.
    beats:
      - say: Differentiate the scalar incident trace, not the two-coordinate vector model. For h equals tanh of point eight x plus point five old h, its state-to-state derivative is point five times one minus the new state squared. At the three saved states, these factors are point two seven nine five two eight, point three three five eight two zero and point two zero seven nine one zero. Start a unit sensitivity at the final state and multiply the last factor first, working backward.
        hold: 1
        visual_cues:
          - id: actual-credit-0
            phrase: Differentiate the scalar incident trace
            targets:
              - actual-credit-operation
            linger: 0.5
          - id: credit-factors
            phrase: these factors are point two seven nine five two eight
            targets:
              - actual-credit-operation
            linger: 0.35
      - say: After the third factor the sensitivity is about point two zero seven nine one zero; after the second it is point zero six nine eight two zero; after all three it is point zero one nine five one seven. A final loss multiplies this temporal derivative by its own derivative with respect to the final state. For a vector RNN the Jacobian is diagonal one minus h squared, times the recurrent matrix. A gradient column travels through transposed Jacobians in backward chronological order. Directions and multiplication order matter.
        hold: 0.8
        visual_cues:
          - id: actual-credit-1
            phrase: After the third factor
            targets:
              - actual-credit-operation
            linger: 0.5
          - id: credit-last
            phrase: point two zero seven nine one zero
            targets:
              - actual-credit-operation
            linger: 0.35
          - id: credit-second
            phrase: point zero six nine eight two zero
            targets:
              - actual-credit-operation
            linger: 0.35
          - id: credit-all
            phrase: point zero one nine five one seven
            targets:
              - actual-credit-operation
            linger: 0.35
      - say: The recurrent weight is shared, so its parameter gradient adds contributions from each local use, not just the final copy. With the final scalar state itself as the objective, the derivative with respect to the weight is about point three three one zero zero three. If there are losses at intermediate steps, add their backward contributions too. A small temporal path can coexist with a strong parameter gradient from recent steps. The next constant-factor curve isolates this repeated multiplication.
        hold: 0.8
        visual_cues:
          - id: actual-credit-2
            phrase: The recurrent weight is shared
            targets:
              - actual-credit-operation
            linger: 0.5
          - id: credit-weight-sum
            phrase: adds contributions from each local use
            targets:
              - actual-credit-operation
            linger: 0.35
          - id: credit-weight-total
            phrase: point three three one zero zero three
            targets:
              - actual-credit-operation
            linger: 0.35
  - id: gradients
    title: Learning signals travel backward through the chain
    visual: A backward probe loses magnitude across twelve recurrent links while a growing path is clipped without changing direction.
    beats:
      - say: Training asks which earlier choices caused an error at the end. The chain rule sends a learning signal backward through every intervening update. Each link multiplies that signal by a local derivative. Repeated factors smaller than one can make the early contribution extremely small.
        hold: 0.6
        motion_check:
          region:
            - 250
            - 400
            - 860
            - 330
          minimumChangedFraction: 0.002
        visual_cues:
          - id: gradient-chain-rule-b1-1
            phrase: Each link multiplies
            targets:
              - gradient-chain-rule
            color: pink
            linger: 0.6
      - say: Watch a path whose local factor stays at six tenths. After twelve links, only a small fraction survives. A real recurrent network uses matrices and changing activations, so direction matters as well as magnitude. This scalar path isolates the multiplication responsible for fading credit.
        hold: 0.7
        visual_cues:
          - id: fading-gradient-b2-1
            phrase: twelve links
            targets:
              - gradient-chain-rule
            color: pink
            linger: 0.6
      - say: Other paths grow and destabilize updates. Gradient norm clipping rescales an oversized vector while preserving its direction. It helps control explosions. A faded learning signal needs a different remedy, such as a better memory path. That leads us to the separate cell state inside an LSTM.
        hold: 0.7
        visual_cues:
          - id: clipped-recurrent-gradient-b3-1
            phrase: rescales an oversized vector
            targets:
              - clipped-recurrent-gradient
            color: yellow
            linger: 0.6
  - id: matrix-bound
    title: Distinguish a sufficient bound from the actual path
    visual: Build the product-norm bound, then apply the same non-normal two-by-two matrix repeatedly to a visible vector.
    beats:
      - say: Use the induced Euclidean norm. Each temporal Jacobian has norm at most gamma times the largest singular value of the recurrent matrix, where gamma bounds the diagonal tanh derivatives and is at most one. If one uniform bound stays below one across the whole span, its product contracts exponentially. That is a sufficient condition for a vanishing temporal path; it does not prove every full parameter gradient is small.
        hold: 1
        visual_cues:
          - id: matrix-bound-0
            phrase: Use the induced Euclidean norm
            targets:
              - matrix-bound-operation
            linger: 0.5
          - id: bound-product
            phrase: its product contracts exponentially
            targets:
              - matrix-bound-operation
            linger: 0.35
      - say: A bound above one allows growth but does not prove it. In a linear counterexample, use matrix rows point five, one; and zero, point five. Its largest singular value is about one point two zero seven. Apply it repeatedly to the unit vector zero, one. The first vector is one, point five and initially grows in norm. The nth power has diagonal point five to n and upper-right n times point five to n minus one. Both terms eventually decay to zero.
        hold: 0.8
        visual_cues:
          - id: matrix-bound-1
            phrase: A bound above one allows growth but does not prove it
            targets:
              - matrix-bound-operation
            linger: 0.5
          - id: matrix-powers
            phrase: Apply it repeatedly to the unit vector zero, one
            targets:
              - matrix-bound-operation
            linger: 0.35
      - say: Distinguish finite precision from mathematical decay. Point six to the fiftieth is about eight point zero eight times ten to the minus twelve, still representable in float32. A gradient can have little optimization effect before underflow, and update rounding also depends on learning rate and parameter scale. Inspect actual early gradients, norms and directions independently from a stable-looking forward loss.
        hold: 0.8
        visual_cues:
          - id: matrix-bound-2
            phrase: Distinguish finite precision from mathematical decay
            targets:
              - matrix-bound-operation
            linger: 0.5
          - id: finite-decay
            phrase: Point six to the fiftieth
            targets:
              - matrix-bound-operation
            linger: 0.35
  - id: truncation
    title: Preserve forward memory while cutting training credit
    visual: A detach boundary crosses the same scalar trace; forward values stay fixed as backward routes stop, then a true norm-clipping vector is constructed.
    beats:
      - say: Predict what changes if we detach state after the second event, keeping weights fixed and taking no optimizer step between chunks. Detachment carries the same numerical state forward but cuts its earlier computational history. The final state stays point seven six four three one six. For an LSTM, detach both hidden and cell states. Resetting to an initial state is a different operation that changes the forward history.
        hold: 1
        visual_cues:
          - id: truncation-0
            phrase: Predict what changes if we detach state after the second event
            targets:
              - truncation-operation
            linger: 0.5
          - id: detach-cut
            phrase: Detachment carries the same numerical state forward
            targets:
              - truncation-operation
            linger: 0.35
          - id: detach-forward
            phrase: The final state stays point seven six four three one six
            targets:
              - truncation-operation
            linger: 0.35
      - say: Without the cut, derivatives of the final state with respect to the three inputs are about point zero three one two two seven, point one one one seven one three and point three three two six five seven. With the cut, the first two become zero and the last stays the same. The shared weight derivative changes from point three three one zero zero three to point two three eight two seven seven. The last local weight use still learns; the earlier uses receive no credit from this objective. A training update between chunks can also leave a carried state computed under older weights.
        hold: 0.8
        visual_cues:
          - id: truncation-1
            phrase: Without the cut
            targets:
              - truncation-operation
            linger: 0.5
          - id: detach-weight
            phrase: The shared weight derivative changes
            targets:
              - truncation-operation
            linger: 0.35
      - say: "Clipping changes another object. Use the finite gradient vector with first component one point four to the twelfth and second component minus point eight times the first. Its norm is about seventy-two point six zero four. Rescale both components by five divided by that norm: the clipped vector is about three point nine zero four, minus three point one two three, with norm five and the same direction. Leave a zero gradient unchanged; diagnose nonfinite values first. For plain SGD without momentum or weight decay, step norm is at most learning rate times five. Momentum and adaptive optimizers change that relationship."
        hold: 0.8
        visual_cues:
          - id: truncation-2
            phrase: Clipping changes another object
            targets:
              - truncation-operation
            linger: 0.5
          - id: clip-rescale
            phrase: Rescale both components by five divided by that norm
            targets:
              - truncation-operation
            linger: 0.35
          - id: clip-result
            phrase: the clipped vector is about three point nine zero four
            targets:
              - truncation-operation
            linger: 0.35
  - id: lstm
    title: Keep, write, and expose are separate choices
    visual: Retained old memory and a gated candidate combine into cell state, then the output gate controls exposed state.
    beats:
      - say: LSTM means long short-term memory. It carries a cell state for storage and a hidden state for exposure. A forget gate scales the old cell value. An input gate scales a proposed new value. Add the two contributions and we have the next stored cell state.
        hold: 0.6
        visual_cues:
          - id: forget-gate-b1-1
            phrase: forget gate scales
            targets:
              - forget-gate
            color: blue
            linger: 0.6
          - id: input-gate-b1-2
            phrase: input gate scales
            targets:
              - input-gate
            color: pink
            linger: 0.6
      - say: Our stored coordinate already holds useful evidence. The new observation contributes very little, so the chosen gates retain almost all the old value and write only a small candidate. Watch the two amounts join. This additive route lets memory pass forward without another tanh on the stored cell itself.
        hold: 0.65
        motion_check:
          region:
            - 600
            - 430
