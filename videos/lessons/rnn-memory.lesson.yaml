            color: yellow
            linger: 0.5
          - id: actor-readout
            phrase: final state remains positive
            targets:
              - dog-actor-readout
            color: yellow
            linger: 0.6
      - say: Now reverse the actors and reset the state. Cat writes the negative clue, and the same recurrent cell carries it to the end. A sign-based readout returns cat as the actor. We have isolated one memory feature; a trained RNN learns the representation its task needs.
        hold: 0.8
        visual_cues:
