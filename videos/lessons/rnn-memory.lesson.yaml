            - 200
          minimumChangedFraction: 0.002
        visual_cues:
          - id: zero-input
            phrase: gets zero input
            targets:
              - neutral-input
            color: cyan
            linger: 0.6
          - id: carried-state
            phrase: same update carries its value through
            targets:
              - sentence-memory-path
              - sentence-current-state
            color: yellow
            linger: 0.6
          - id: step-chased
            phrase: “chased”
            targets:
              - sentence-state-3
            color: cyan
            linger: 0.5
          - id: step-cat
            phrase: “cat,”
            targets:
