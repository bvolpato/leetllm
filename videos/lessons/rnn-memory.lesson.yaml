            phrase: Reverse the same events
            targets:
              - event-order-operation
            linger: 0.35
          - id: reverse-1
            phrase: point nine four
            targets:
              - event-order-operation
            linger: 0.35
          - id: reverse-2
            phrase: then one point five six four
            targets:
              - event-order-operation
            linger: 0.35
          - id: order-sum
            phrase: A sum gives two point three
            targets:
              - event-order-operation
            linger: 0.35
      - say: "Return to the original event order and change to the article scalar RNN: tanh of point eight times the event plus point five times the previous state, starting at zero. The three states are about point six six four, point five seven three and point seven six four. Tanh acts element by element in a vector, stays between minus one and one, and is odd around zero. It does not guarantee a zero batch mean. We will reuse this exact scalar trace when differentiating."
        hold: 0.8
