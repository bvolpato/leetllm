      - say: At rollback, the third input column is point one and point four. The recurrent contribution is about point three one one and point three eight five. Tanh of the sum gives about point three nine zero and point six five five. Keep full precision between steps; displayed rounding is for inspection. The two-by-three and two-by-two matrices, and the two-coordinate bias and state, stay the same sizes at every step. More events add applications, not learned matrix copies.
        hold: 0.8
