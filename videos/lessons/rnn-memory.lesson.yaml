  - id: shared
    title: One learned rule, reused at every word
    visual: A vector state grows through an unrolled sentence while each time step reuses the same parameter set.
    beats:
      - say: "Our toy example tracked one clue. A real hidden state is a vector: each coordinate can carry a different feature. The input matrix maps a word representation into hidden space; the recurrent matrix maps the previous state back into that space."
        hold: 0.6
        visual_cues:
          - id: vector-state
            phrase: hidden state is a vector
            targets:
              - recurrent-weight-shapes
            color: yellow
            linger: 0.6
          - id: input-matrix
            phrase: input matrix maps
            targets:
              - input-weight-map
            color: blue
            linger: 0.6
          - id: recurrent-matrix
            phrase: recurrent matrix maps
            targets:
              - recurrent-weight-map
            color: cyan
            linger: 0.6
      - say: "To inspect the computation across time, unroll the cell: draw one copy per word. Every copy uses the same matrices. The weights are learned once and reused at each position, while the state changes with the input."
        hold: 0.6
        visual_cues:
          - id: unroll-cell
            phrase: draw one copy per word
            targets:
              - unrolled-cell-0
              - unrolled-cell-4
            color: cyan
            linger: 0.6
          - id: shared-parameters
            phrase: same matrices
            targets:
              - shared-parameter-set
              - unrolled-cell-0
              - unrolled-cell-4
            color: yellow
            linger: 0.6
      - say: "Longer inputs add time steps, and each state keeps the same width. That makes recurrence useful for streaming: after every word, a compact state summarizes the prefix so far. The chosen features determine which details survive that compression."
        hold: 0.7
        visual_cues:
          - id: fixed-width-state
            phrase: same width
            targets:
              - state-width
            color: yellow
            linger: 0.6
          - id: compressed-prefix
            phrase: summarizes the prefix so far
            targets:
              - prefix-summary
            color: yellow
            linger: 0.6
  - id: event-order
    title: Carry one incident through an ordered update
    visual: Named error, reproduction and rollback events retain identities across a discounted accumulator and a scalar tanh RNN.
    beats:
      - say: Our sentence isolated a hand-coded actor feature. Now keep one incident as the numerical case for matrix arithmetic, learning and batching. Error logged, reproduction confirmed and rollback requested carry scalar signals one, point four and point nine. In the first arithmetic fixture, update state as point six times old state plus the incoming signal. These supplied coefficients are a demonstration, not a trained incident policy.
        hold: 1
        visual_cues:
          - id: event-order-0
            phrase: Now keep one incident as the numerical case
            targets:
              - event-order-operation
            linger: 0.5
          - id: discount-construction
            phrase: update state as point six times old state plus the incoming signal
            targets:
              - event-order-operation
            linger: 0.35
      - say: "Predict whether reversing those three events changes the final state. In the original order the states are one, one, then one point five. Reverse the same events: point nine, point nine four, then one point five six four. A sum gives two point three in either order. Recurrence can distinguish order because early signals pass through more discounts; compression can still produce collisions or learn to ignore irrelevant order."
        hold: 0.8
        visual_cues:
          - id: event-order-1
            phrase: Predict whether reversing those three events changes the final state
            targets:
              - event-order-operation
            linger: 0.5
          - id: event-order-reveal
            phrase: one point five six four
            targets:
              - event-order-operation
            color: yellow
