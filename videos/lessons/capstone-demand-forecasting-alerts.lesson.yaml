  - id: monitoring-contract
    title: Diagnose missing data before fitting it
    visual: An apparent zero is traced to an unavailable count and kept outside the fitting set.
    beats:
      - say: Append verified counts as they mature, preserving both event day and availability time. Track
          missing-label fraction and arrival delay separately from forecast residuals. An apparent volume
          collapse can come from an ordering outage or broken tracking pipeline. Training on unverified zeros
          teaches the outage to the model. A large residual can also come from a changed plan, missing
          predictor or unusual outcome; the residual alone does not identify drift.
