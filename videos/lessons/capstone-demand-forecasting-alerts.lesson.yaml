version: 1
id: capstone-demand-forecasting-alerts
title: Forecast Tomorrow and Judge It Later
source: foundations/capstone-demand-forecasting-alerts/content.md
voice: en-US-AndrewNeural
rate: +0%
sources:
  - title: "Forecasting Principles and Practice: evaluation, intervals and quantile scores"
    url: https://otexts.com/fpp3/toolbox.html
  - title: "Forecasting regression: scenario and calendar predictors"
    url: https://otexts.com/fpp3/regression.html
  - title: NumPy2.2 least squares
    url: https://numpy.org/doc/2.2/reference/generated/numpy.linalg.lstsq.html
  - title: MIT single-period newsvendor
    url: https://ocw.mit.edu/courses/15-772j-d-lab-supply-chains-fall-2014/6952be57b43aa185119c6f114908bcc5_MIT15_772JF14_Newsboy.pdf
  - title: BenTaieb and Hyndman recursive/direct forecasting
    url: https://proceedings.mlr.press/v32/taieb14.pdf
scenes:
  - id: intro
    title: A forecast creates time to act
    visual: A Friday point forecast appears above capacity on Sunday; the later Friday actual arrives separately.
    beats:
      - say: On Sunday, a planner needs to decide whether Friday will need extra capacity. The forecast is already
          above the planned limit. That information can support a staffing review today. Friday’s actual count
          arrives later and reveals how far the prediction missed.
        hold: 0.75
        visual_cues:
          - id: intro-b1-1
            phrase: forecast is already above
            targets:
              - forecast-capacity
            linger: 0.45
          - id: intro-b1-2
            phrase: Friday’s actual count arrives later
            targets:
              - forecast-capacity
            linger: 0.45
      - say: We will follow one forecast from issue time to evaluation. Along the way, we will define the target,
          reconstruct available history, compare a seasonal baseline, and see why a better average can still
          leave a useful warning system outside its acceptance requirements.
        hold: 0.85
        visual_cues:
          - id: intro-b2-1
            phrase: one forecast from issue time
            targets:
              - forecast-capacity
            linger: 0.45
          - id: intro-b2-2
            phrase: better average
            targets:
              - forecast-capacity
            linger: 0.45
  - id: target
    title: Choose demand and a decision loss
    visual: A small demand distribution feeds expected absolute error and asymmetric capacity-cost curves.
    beats:
      - say: First decide what quantity to predict. Completed shipments can be limited by capacity, while the planner
          needs requested volume. Even request logs may miss people who left before ordering. Define the
          measurement and the decision it serves before fitting a model.
        hold: 0.75
        visual_cues:
          - id: target-b1-1
            phrase: Completed shipments can be limited by capacity
            targets:
              - completed-volume
            linger: 0.45
          - id: target-b1-2
            phrase: planner needs requested volume
            targets:
              - requested-volume
            linger: 0.45
      - say: Mistakes can carry different costs. In this separate supplied distribution, under-capacity costs three
          times as much per parcel as excess capacity. Calculating expected loss moves the preferred capacity
          above the median. That choice follows the assumed costs and distribution rather than an ordinary
          error average.
        hold: 0.85
        visual_cues:
          - id: target-b2-1
            phrase: under-capacity costs three times
            targets:
              - cost-assumptions
            linger: 0.45
          - id: target-b2-2
            phrase: moves the preferred capacity
            targets:
              - capacity-choice
              - loss-curve
            linger: 0.45
          - id: target-b2-3
            phrase: assumed costs and distribution
            targets:
              - cost-quantile
            linger: 0.45
  - id: forecast-contract
    title: Define the day and the forecast path
    visual: One UTC calendar and three horizon-dependency constructions.
    beats:
      - say: Our forecast contract names one center, one service tier and requested parcels per UTC calendar day.
          Issue at eight on each of two Sundays and predict the next seven days, numbered one through seven.
          Wednesday capacity is one hundred forty; other days use one hundred fifty. These are supplied
          fixture rules. A real center needs its own business timezone, daylight-saving behavior and decision
          lead time.
        hold: 0.85
        visual_cues:
          - id: forecast-contract-0
            phrase: Our forecast contract names one center, one service tier and requested parcels per UTC calendar day.
            targets:
              - forecast-contract-operation
            color: cyan
            linger: 0.5
          - id: forecast-horizon
            phrase: predict the next seven days
            targets:
              - forecast-contract-operation
            linger: 0.5
            color: cyan
      - say: A recursive target-lag model feeds its first prediction into the next prediction. A wrong earlier value
          can therefore change a later input, even without intervening actuals. Separate direct models predict
          each horizon without this feedback. A joint model predicts a horizon vector. These designs have
          different estimation tradeoffs; direct forecasting does not guarantee a lower error.
        hold: 0.85
        visual_cues:
          - id: forecast-contract-1
            phrase: A recursive target-lag model feeds its first prediction into the next prediction.
            targets:
              - forecast-contract-operation
            color: cyan
            linger: 0.5
          - id: forecast-recursive
            phrase: feeds its first prediction into the next prediction
            targets:
              - forecast-contract-operation
            linger: 0.5
            color: cyan
          - id: forecast-direct
            phrase: Separate direct models
            targets:
              - forecast-contract-operation
            linger: 0.5
            color: cyan
          - id: forecast-joint
            phrase: A joint model predicts a horizon vector
            targets:
              - forecast-contract-operation
            linger: 0.5
            color: cyan
      - say: "This lab uses a different simple construction: fit one calendar regression and evaluate seven future
          feature rows. It has no target lags or separate horizon coefficients. Its generator has a weekday
          pattern, upward trend, known campaigns, noise and two surges. It supplies no monthly seasonality or
          weather evidence. Predicting recorded requests also cannot recover customers who never placed an
          order."
        hold: 0.85
        visual_cues:
          - id: forecast-contract-2
            phrase: "This lab uses a different simple construction: fit one calendar regression and evaluate seven future
              feature rows."
            targets:
              - forecast-contract-operation
            color: cyan
            linger: 0.5
  - id: cost-quantile
    title: Construct the cost-sensitive action
    visual: The same three-point demand distribution moves a capacity threshold through shortage and spare units.
    beats:
      - say: Write the one-day decision loss as underage cost times the positive part of demand minus capacity, plus
          overage cost times the positive part of capacity minus demand. Here each cost is a positive constant
          per parcel. There is no shared capacity constraint, fixed booking charge or multi-day coupling.
          Dividing by the sum of the two costs gives pinball loss, with quantile level equal to underage cost
          divided by total cost.
        hold: 0.85
        visual_cues:
          - id: cost-quantile-0
            phrase: Write the one-day decision loss
            targets:
              - cost-quantile-operation
            color: cyan
            linger: 0.5
          - id: forecast-cost-rule
            phrase: Dividing by the sum of the two costs
            targets:
              - cost-quantile-operation
            linger: 0.5
            color: cyan
      - say: In our separate supplied distribution, counts one hundred, one hundred sixty and two hundred forty have
          probabilities point five five, point two five and point two. Costs three and one give quantile level
          three quarters. The cumulative probability first reaches that level at one hundred sixty. The median
          is one hundred. Build each expected cost from its probability-weighted shortage and spare
          contributions.
        hold: 0.85
        visual_cues:
          - id: cost-quantile-1
            phrase: In our separate supplied distribution, counts one hundred, one hundred sixty and two hundred forty
              have probabilities point five five, point two five and point two.
            targets:
              - cost-quantile-operation
            color: cyan
            linger: 0.5
          - id: forecast-cost-cdf
            phrase: The cumulative probability first reaches that level at one hundred sixty
            targets:
              - cost-quantile-operation
            linger: 0.5
            color: cyan
          - id: forecast-cost-level
            phrase: Costs three and one give quantile level three quarters
            targets:
              - cost-quantile-operation
            linger: 0.5
            color: cyan
          - id: forecast-cost-median
            phrase: The median is one hundred
            targets:
              - cost-quantile-operation
            linger: 0.5
            color: cyan
      - say: Capacity one hundred has expected absolute error forty-three and decision cost one hundred twenty-nine.
          At one hundred sixty those become forty-nine and eighty-one. At two hundred forty they are
          ninety-seven and ninety-seven. Worse absolute error can accompany better decision cost. The later
          regression fits squared error; it does not optimize this quantile action or the separate selective
          peak diagnostic. These assumed cost units are not measured freight savings.
        hold: 0.85
        visual_cues:
          - id: cost-quantile-2
            phrase: Capacity one hundred has expected absolute error forty-three and decision cost one hundred
              twenty-nine.
            targets:
              - cost-quantile-operation
            color: cyan
            linger: 0.5
          - id: forecast-cost100
            phrase: Capacity one hundred has expected absolute error forty-three and decision cost one hundred twenty-nine
            targets:
              - cost-quantile-operation
            linger: 0.5
            color: cyan
          - id: forecast-cost160
            phrase: At one hundred sixty those become forty-nine and eighty-one
            targets:
              - cost-quantile-operation
            linger: 0.5
            color: cyan
          - id: forecast-cost240
            phrase: At two hundred forty they are ninety-seven and ninety-seven
            targets:
              - cost-quantile-operation
            linger: 0.5
            color: cyan
  - id: origins
    title: Advance the information boundary
    visual: Two issue-time windows retain separate training cutoffs and seven future target dates.
    beats:
      - say: A realistic backtest issues predictions from a sequence of past origins. Fit on observations available at
          the first Sunday, then forecast its next week. Advance to the following Sunday and rebuild the
          training history using only counts that have become final and readable.
        hold: 0.75
        visual_cues:
          - id: origins-b1-1
            phrase: first Sunday
            targets:
              - origin-one
              - issue-boundary
            linger: 0.45
          - id: origins-b1-2
            phrase: following Sunday
            targets:
              - issue-boundary
              - origin-two
            linger: 0.45
      - say: Our second origin can reuse mature outcomes from the first week. It still excludes Saturday because that
          count is delayed. Each fitted version belongs to its own origin. Randomly mixing these rows would
          answer a different question about information available to the historical planner.
        hold: 0.85
        visual_cues:
          - id: origins-b2-1
            phrase: mature outcomes from the first week
            targets:
              - origin-two
            linger: 0.45
          - id: origins-b2-2
            phrase: excludes Saturday
            targets:
              - delayed-count
            linger: 0.45
  - id: baseline
    title: Find the latest available matching weekday
    visual: A Sunday target searches backward past the unfinished current Sunday to the latest mature Sunday.
    beats:
      - say: A seasonal naive forecast copies the latest available observation from the matching weekday. For next
          Sunday, it is tempting to copy today. But this Sunday has only begun when the forecast issues. Its
          eventual final count would introduce future information.
        hold: 0.75
        visual_cues:
          - id: baseline-b1-1
            phrase: matching weekday
            targets:
              - source-dates
            linger: 0.45
          - id: baseline-b1-2
            phrase: Sunday has only begun
            targets:
              - unfinished-day
            linger: 0.45
      - say: Search backward to the previous mature Sunday instead. The same rule can skip a more recent Saturday
          whose count is delayed. Keep the selected source date in the forecast record so a reviewer can
          explain the baseline without guessing what the program looked up.
        hold: 0.85
        visual_cues:
          - id: baseline-b2-1
            phrase: Search backward to the previous mature Sunday instead.
            targets:
              - baseline-search
            linger: 0.45
          - id: baseline-b2-2
            phrase: selected source date
            targets:
              - baseline-lookup
            linger: 0.45
  - id: fit-construction
    title: Build Friday from the learned feature row
    visual: Actual mature design rows fit nine weights; their Friday products accumulate into the issued point.
    beats:
      - say: "At the first origin, stack sixty-two mature rows into a matrix with nine columns: seven weekday
          indicators, elapsed weeks and a known-campaign flag. The seven weekday columns already span a
          constant, so this design adds no separate intercept. Fit weights by minimizing the sum of squared
          residuals. The actual least-squares solve has rank nine; this lab refuses a rank-deficient or
          nonfinite fit."
        hold: 0.85
        visual_cues:
          - id: fit-construction-0
            phrase: "At the first origin, stack sixty-two mature rows into a matrix with nine columns: seven weekday
              indicators, elapsed weeks and a known-campaign flag."
            targets:
              - fit-construction-operation
            color: cyan
            linger: 0.5
          - id: forecast-fit-columns
            phrase: nine columns
            targets:
              - fit-construction-operation
            linger: 0.5
            color: cyan
          - id: forecast-fit-weights
            phrase: Fit weights by minimizing the sum of squared residuals
            targets:
              - fit-construction-operation
            linger: 0.5
            color: cyan
          - id: forecast-fit-rank
            phrase: The actual least-squares solve has rank nine
            targets:
              - fit-construction-operation
            linger: 0.5
            color: cyan
      - say: For Friday February sixth, only the Friday indicator is one among the seven weekday entries. Elapsed time
          is sixty-seven divided by seven weeks; the known campaign flag is one. The actual fitted
          contributions are about one hundred thirty-one point three one two from Friday, eleven point zero
          seven one from trend, and twenty point nine from campaign. Their full-precision sum is one hundred
          sixty-three point two eight four. Clip a negative raw forecast to zero; this is still a point
          regression rather than a probabilistic count model.
        hold: 0.85
        visual_cues:
          - id: fit-construction-1
            phrase: For Friday February sixth, only the Friday indicator is one among the seven weekday entries.
            targets:
              - fit-construction-operation
            color: cyan
            linger: 0.5
          - id: forecast-fit-products
            phrase: The actual fitted contributions are about one hundred thirty-one point three one two from Friday,
              eleven point zero seven one from trend, and twenty point nine from campaign
            targets:
              - fit-construction-operation
            linger: 0.5
            color: cyan
          - id: forecast-fit-result
            phrase: Their full-precision sum is one hundred sixty-three point two eight four
            targets:
              - fit-construction-operation
            linger: 0.5
            color: cyan
          - id: forecast-fit-clip
            phrase: Clip a negative raw forecast to zero
            targets:
              - fit-construction-operation
            linger: 0.5
            color: cyan
          - id: forecast-fit-friday-result
            phrase: about one hundred thirty-one point three one two from Friday
            targets:
              - fit-construction-operation
            linger: 0.5
            color: cyan
          - id: forecast-fit-trend-result
            phrase: eleven point zero seven one from trend
            targets:
              - fit-construction-operation
            linger: 0.5
            color: cyan
          - id: forecast-fit-campaign-result
            phrase: and twenty point nine from campaign
            targets:
              - fit-construction-operation
            linger: 0.5
            color: cyan
      - say: Future campaign flags include only announcements known by issue time. For a historical training day, the
          fixture uses the earlier of the fit cutoff and that day beginning. That simplified rule does not
          reconstruct every earlier seven-day issue and lead time. The plan file stores announcements, not
          cancellation revisions or proof of execution. A later cancellation can explain an error, but cannot
          change the already issued feature row.
        hold: 0.85
        visual_cues:
          - id: fit-construction-2
            phrase: Future campaign flags include only announcements known by issue time.
            targets:
              - fit-construction-operation
            color: cyan
            linger: 0.5
          - id: forecast-fit-plans
            phrase: A later cancellation can explain an error
            targets:
              - fit-construction-operation
            linger: 0.5
            color: cyan
  - id: issued
    title: Freeze the forecast before seeing the outcome
    visual: The first seven candidate points and declared capacities form an issue ledger before actuals appear.
    beats:
      - say: The article’s candidate is a small calendar regression. Weekday indicators, a time trend and known
          campaign plans generate a prediction for each future day. Plans must use the version known at issue
          time. A later canceled campaign cannot silently revise the original forecast.
        hold: 0.75
        visual_cues:
          - id: issued-b1-1
            phrase: calendar regression
            targets:
              - issued-forecast
            linger: 0.45
          - id: issued-b1-2
            phrase: version known at issue time
            targets:
              - issued-capacity
            linger: 0.45
      - say: Store the issued point, capacity, origin, target, horizon and fitted weights together. Our point forecast
          stays fixed while the actual appears. A revised forecast may be useful, but it needs a new timestamp
          and identity so the evidence of the original decision survives.
        hold: 0.85
        visual_cues:
          - id: issued-b2-1
            phrase: Store the issued point
            targets:
              - issued-forecast
            linger: 0.45
          - id: issued-b2-2
            phrase: actual appears
            targets:
              - issued-forecast
              - issued-actuals
            linger: 0.45
  - id: ledger-contract
    title: Preserve the issued evidence and its trust boundary
    visual: One original forecast row is copied into a versioned ledger; an edit changes its digest.
    beats:
      - say: Each forecast identity binds center, service tier, canonical UTC issue time, target date and code
          version. The record checks that integer horizon one through seven agrees with the target date. It
          also checks matching-weekday history before the origin, sufficient training rows, the declared
          capacity, Boolean flags and finite nonnegative numerical fields. Counts in this lab stay within the
          exact integer range used by float sixty-four conversion. These checks establish a consistent schema,
          not an authorized producer.
        hold: 0.85
        visual_cues:
          - id: ledger-contract-0
            phrase: Each forecast identity binds center, service tier, canonical UTC issue time, target date and code
              version.
            targets:
              - ledger-contract-operation
            color: cyan
            linger: 0.5
          - id: forecast-ledger-id
            phrase: Each forecast identity binds
            targets:
              - ledger-contract-operation
            linger: 0.5
            color: cyan
      - say: An observation belongs to its entity and target day, while several origins may forecast that day. Join
          each original prediction to the appropriate observation without collapsing forecast identity or
          horizon. This fixture has one entity and joins by date. A multi-center or multi-tier service must
          include those entity keys. Preserve both origins fitted weights, feature order, input and code
          hashes and observed runtime versions.
        hold: 0.85
        visual_cues:
          - id: ledger-contract-1
            phrase: An observation belongs to its entity and target day, while several origins may forecast that day.
            targets:
              - ledger-contract-operation
            color: cyan
            linger: 0.5
          - id: forecast-ledger-join
            phrase: Join each original prediction
            targets:
              - ledger-contract-operation
            linger: 0.5
            color: cyan
      - say: Exclusive file creation rejects a second write through the freeze function. Frozen Python records reject
          ordinary field reassignment. Neither makes the disk immutable. Editing a prediction changes its
          bytes; comparing its digest with an independently trusted expected digest detects that change. If an
          editor can also replace the expected digest, that reference no longer authenticates the original.
          Protected records, snapshots and receipts require actual storage and access controls, plus separate
          identities for revisions.
        hold: 0.85
        visual_cues:
          - id: ledger-contract-2
            phrase: Exclusive file creation rejects a second write through the freeze function.
            targets:
              - ledger-contract-operation
            color: cyan
            linger: 0.5
          - id: forecast-ledger-edit
            phrase: Editing a prediction changes its bytes
            targets:
              - ledger-contract-operation
            linger: 0.5
            color: cyan
          - id: forecast-ledger-reference
            phrase: If an editor can also replace the expected digest
            targets:
              - ledger-contract-operation
            linger: 0.5
            color: cyan
  - id: metrics
    title: Score only mature observations
    visual: Mature cases reveal their residuals while MAE and tolerance coverage use the same visible denominator.
    beats:
      - say: Once final counts become available, join them to their issued predictions. Mean absolute error averages
          the absolute residual in parcels. Compare the candidate with its seasonal baseline on identical
          mature rows, retaining pending targets outside the denominator until their outcomes become
          available.
        hold: 0.75
        motion_check:
          region:
            - 230
            - 380
            - 1450
            - 550
          minimumChangedFraction: 0.002
        visual_cues:
          - id: metrics-b1-1
            phrase: join them to their issued predictions
            targets:
              - original-forecast
              - mature-actuals
            linger: 0.45
          - id: metrics-b1-2
            phrase: Mean absolute error
            targets:
              - paired-residuals
              - mae
              - seasonal-mae
              - paired-mae-calculation
            color: cyan
            linger: 0.45
          - id: metrics-shared-baseline
            phrase: Compare the candidate with its seasonal baseline on identical mature rows
            targets:
              - original-forecast
              - seasonal-forecast
              - mature-actuals
              - mature-count
              - mae
              - seasonal-mae
              - paired-mae-calculation
            color: blue
            linger: 0.65
          - id: metrics-b1-3
            phrase: outside the denominator
            targets:
              - mature-count
            linger: 0.45
      - say: The candidate improves average error on this fixture, yet three observations fall outside the fixed
          tolerance. The canceled promotion and surprise surges explain which rows to inspect. That tolerance
          is a diagnostic requirement. Calibrated prediction intervals need an uncertainty method and later
          evaluation of their coverage.
        hold: 0.85
        visual_cues:
          - id: metrics-b2-1
            phrase: three observations fall outside
            targets:
              - tolerance-count
            linger: 0.45
          - id: metrics-b2-2
            phrase: canceled promotion and surprise surges
            targets:
              - mature-actuals
            linger: 0.45
  - id: evaluation-contract
    title: Keep the loss and the uncertainty claim separate
    visual: The same matured records feed distinct MAE, selective peak cost, tolerance and horizon slices.
    beats:
      - say: With no final available labels, error, peak cost and interval fraction are undefined rather than zero.
          Precision is undefined when no signals have mature outcomes; recall is undefined when there are no
          mature overload cases. With labels, compare candidate and baseline on the identical rows. Preserve
          each pending row and require the complete declared origin-horizon grid before a complete comparison
          can pass.
        hold: 0.85
        visual_cues:
          - id: evaluation-contract-0
            phrase: With no final available labels, error, peak cost and interval fraction are undefined rather than zero.
            targets:
              - evaluation-contract-operation
            color: cyan
            linger: 0.5
          - id: forecast-eval-none
            phrase: With no final available labels
            targets:
              - evaluation-contract-operation
            linger: 0.5
            color: cyan
          - id: forecast-eval-mature
            phrase: With labels, compare candidate and baseline on the identical rows
            targets:
              - evaluation-contract-operation
            linger: 0.5
            color: cyan
      - say: The peak diagnostic charges three times the positive part of the quantity actual minus forecast only on
          days whose actual count is at least one hundred fifty. It ignores all overforecasts and lower-volume
          days. A Wednesday actual of one hundred forty-five can exceed capacity one hundred forty while
          contributing zero to this peak diagnostic. Underforecasting alone does not establish a capacity
          shortage, and this diagnostic is not total operating cost.
        hold: 0.85
        visual_cues:
          - id: evaluation-contract-1
            phrase: The peak diagnostic charges three times the positive part of the quantity actual minus forecast
            targets:
              - evaluation-contract-operation
            color: cyan
            linger: 0.5
          - id: forecast-eval-peak
            phrase: The peak diagnostic charges three times
            targets:
              - evaluation-contract-operation
            linger: 0.5
            color: cyan
          - id: forecast-eval-wed
            phrase: A Wednesday actual of one hundred forty-five can exceed capacity one hundred forty while contributing
              zero to this peak diagnostic
            targets:
              - evaluation-contract-operation
            linger: 0.5
            color: cyan
      - say: The six-parcel band has no claimed probability level. A calibrated prediction interval needs an
          uncertainty method and later coverage-and-width evaluation. Interval width need not increase at
          every horizon; some simple models have constant or seasonal plateaus. A campaign-conditional
          interval also excludes uncertainty about whether the campaign happens. In this fixture each horizon
          has only two observations, so the worst observed horizon is a diagnostic slice rather than a stable
          estimate of future performance.
        hold: 0.85
        visual_cues:
          - id: evaluation-contract-2
            phrase: The six-parcel band has no claimed probability level.
            targets:
              - evaluation-contract-operation
            color: cyan
            linger: 0.5
          - id: forecast-eval-interval
            phrase: A calibrated prediction interval needs
            targets:
              - evaluation-contract-operation
            linger: 0.5
            color: cyan
  - id: signals
    title: Separate capacity warnings from residual alarms
    visual: A two-by-two signal table is calculated from forecast-capacity comparisons and later actual-capacity
      comparisons.
    beats:
      - say: Capacity signals ask whether the issued forecast exceeds the declared schedule. Later, compare actual
          requested volume with that same schedule to inspect the signals. Friday can be a correct capacity
          warning even while its forecast misses the eventual count by a substantial amount.
        hold: 0.75
        visual_cues:
          - id: signals-b1-1
            phrase: forecast exceeds the declared schedule
            targets:
              - day-comparison
            linger: 0.45
          - id: signals-b1-2
            phrase: compare actual requested volume
            targets:
              - case-outcome
            linger: 0.45
      - say: Count correct signals, false signals and missed overload days separately. Precision describes the signals
          sent; recall describes the overload days recovered. Precision is true positives divided by the sum
          of true and false positives. Recall is true positives divided by the sum of true positives and false
          negatives. Planner interventions need their own records because changing capacity after a warning
          changes the operational outcome without changing the original forecast error.
        hold: 0.85
        visual_cues:
          - id: signals-b2-1
            phrase: correct signals, false signals and missed overload
            targets:
              - signal-table
            linger: 0.45
          - id: signals-b2-2
            phrase: Precision describes the signals sent
            targets:
              - signal-metrics
            linger: 0.45
  - id: synthesis
    title: Let separate requirements make the decision
    visual: The MAE improvement and failing tolerance fraction stay visible beside a held comparison.
    beats:
      - say: Our fixture improves average error and the declared peak diagnostic. It still fails its tolerance
          requirement, so the local comparison holds. Keep that result while investigating the missed
          conditions. Changing the requirement after inspecting these outcomes turns them into development
          evidence for a later test.
        hold: 0.75
        visual_cues:
          - id: synthesis-b1-1
            phrase: improves average error
            targets:
              - error-comparison
            linger: 0.45
          - id: synthesis-peak-diagnostic
            phrase: the declared peak diagnostic
            targets:
              - peak-rule
              - peak-rows
              - peak-seasonal-terms
              - peak-candidate-terms
              - peak-totals
            color: yellow
            linger: 0.65
          - id: synthesis-b1-2
            phrase: fails its tolerance requirement
            targets:
              - tolerance-gate
            linger: 0.45
