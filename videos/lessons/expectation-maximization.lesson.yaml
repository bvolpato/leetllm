version: 1
id: expectation-maximization
title: How Much Does One Request Count?
source: foundations/probabilistic-generative-models-em/content.md
sources:
  - title: "Dempster, Laird, and Rubin: Maximum Likelihood from Incomplete Data via the EM Algorithm"
    url: https://doi.org/10.1111/j.2517-6161.1977.tb01600.x
  - title: "scikit-learn: Gaussian Mixture Models"
    url: https://scikit-learn.org/stable/modules/mixture.html
  - title: "Kingma and Welling: Auto-Encoding Variational Bayes"
    url: https://arxiv.org/abs/1312.6114
  - title: "Stanford CS229: The EM algorithm"
    url: https://cs229.stanford.edu/notes_archive/cs229-notes8.pdf
  - title: Dempster, Laird, and Rubin paper hosted by MIT
    url: https://web.mit.edu/6.435/www/Dempster77.pdf
  - title: "Stan: Posterior predictive checks"
    url: https://mc-stan.org/docs/stan-users-guide/posterior-predictive-checks.html
scenes:
  - id: intro
    title: "How much credit does each source get?"
    visual: "A striped marble rolls between pictures of two jars before the draw. The four matching marbles collect into a three-to-one split. The same idea carries over to two peaks in request times."
    beats:
      - say: "Which jar gets more credit for this striped marble? A fair coin picked the jar. We drew one of its four marbles at random. Count the stripes in each jar."
        hold: 2.3
        caption_starts:
          - "A fair coin picked the jar"
        visual_cues:
          - id: intro-jars
            phrase: "Count the stripes in each jar"
            targets: [jar-contents, marble-draw]
            color: cyan
            linger: 0.25
      - say: "Follow the striped marbles. Three of the four matches are in jar A. Count this draw as three quarters for A and one quarter for B. Those fractions are called responsibilities."
        hold: 0.8
        caption_starts:
          - "Three of the four matches"
          - "Count this draw as three quarters"
        visual_cues:
          - id: intro-matches
            phrase: "Follow the striped marbles"
            targets: [jar-contents, marble-draw]
            color: yellow
            linger: 0.25
          - id: intro-shares
            phrase: "three quarters for A and one quarter for B"
            targets: [marble-draw, jar-contents]
            color: blue
            linger: 0.25
      - say: "Now look at six request times. Three cluster near thirty milliseconds and three near ninety. Their average is sixty. Look at the band from fifty to seventy. How many requests landed there?"
        hold: 1.8
        caption_starts:
          - "Their average is sixty"
          - "How many requests landed there"
        visual_cues:
          - id: intro-mean-result
            phrase: "Their average is sixty"
            targets: [latency-sample]
            color: yellow
            linger: 0.25
          - id: intro-window
            phrase: "Look at the band from fifty to seventy"
            targets: [latency-sample, latency-question]
            color: yellow
            linger: 0.25
      - say: "Zero. All six requests sit outside the band. Fit one bell curve and its peak lands right in the gap. Fit a mixture and the two peaks land over the two groups. To fit those curves, expectation-maximization, or EM, uses each request’s share in each group."
        hold: 0.8
        caption_starts:
          - "Fit a mixture"
        visual_cues:
          - id: intro-count
            phrase: "Zero"
            targets: [latency-sample, latency-question]
            color: yellow
            linger: 0.3
          - id: intro-pooled
            phrase: "Fit one bell curve"
            targets: [latency-sample, latency-question]
            color: cyan
            linger: 0.25
          - id: intro-mixture
            phrase: "Fit a mixture and the two peaks land over the two groups"
            targets: [latency-sample, latency-question]
            color: green
            linger: 0.25
  - id: generative-boundary
    title: "What does a cache-hit score tell us?"
    visual: "Two collections of 100 labeled requests have different counts for input x. Keeping the hit fraction inside each count fixed changes the joint frequency."
    beats:
      - say: "Now open a log that records cache hits. Among requests with input x, sixty percent are hits in each of two populations. A classifier can give x the same score in both. Look at two populations of a hundred requests. In the first, twenty-five have that input. In the second, seventy-five do. Apply the same sixty percent within each group. That makes fifteen hits with input x in the first hundred and forty-five in the second. The classifier score alone leaves the frequency of that input open."
        hold: 0.7
        visual_cues:
          - id: generative-boundary-0
            phrase: "two populations of a hundred requests"
            targets: [generative-boundary-operation]
            color: cyan
            linger: 0.25
          - id: joint-populations
            phrase: "Apply the same sixty percent within each group"
            targets: [generative-boundary-operation]
            color: green
            linger: 0.25
      - say: "We just built a joint probability from the input frequency and the chance of a hit given the input. A generative classifier can build that same joint in the other direction. Start with the frequency of hits and model the inputs among hits. Do the same for misses. Bayes’ rule recovers the class probability for a given input. For our unlabeled latencies, the sampling story has a hidden choice. Select a component, then draw a latency from its distribution."
        hold: 0.75
        visual_cues:
          - id: generative-boundary-1
            phrase: "We just built a joint probability"
            targets: [generative-boundary-operation]
            color: cyan
            linger: 0.25
          - id: joint-reverse
            phrase: "Start with the frequency of hits"
            targets: [generative-boundary-operation]
            color: cyan
            linger: 0.25
          - id: joint-sample
            phrase: "Select a component, then draw a latency"
            targets: [generative-boundary-operation]
            color: cyan
            linger: 0.25
      - say: "A Gaussian describes continuous latency with a density. This narrow curve has a peak close to two per millisecond. Shade an interval around thirty milliseconds. Its area gives the probability of a latency in that interval. For the mixture fit we treat the requests as independent draws from the same distribution. Bursts from one tenant or queue can violate that assumption. And a model conditioned on an input can still generate samples. A language model does that when it generates text from a prompt."
        hold: 0.75
        visual_cues:
          - id: generative-boundary-2
            phrase: "This narrow curve has a peak"
            targets: [generative-boundary-operation]
            color: cyan
            linger: 0.25
          - id: density-interval
            phrase: "Shade an interval around thirty milliseconds"
            targets: [generative-boundary-operation]
            color: green
            linger: 0.25
  - id: mixture
    title: Describe each observation as a mixture
    visual: Two weighted Gaussian component curves sum to a density with peaks near the two observed latency groups.
    beats:
      - say: Imagine first choosing one of two Gaussian components, then drawing a latency from that component. The component weights say how frequently the model selects each one. Each Gaussian has a mean and a variance that describe its location and spread.
        hold: 0.55
        visual_cues:
          - id: mixture-beat-1-focus-1
            phrase: Imagine first choosing one of two Gaussian components
            targets:
              - mixture-components
            color: yellow
            linger: 0.6
      - say: Because each request’s component is hidden, its density is the sum of the weighted component densities. Across independent observations, the log likelihood adds the log of each summed density. The logarithm sits outside the sum, coupling the component parameters.
        hold: 0.6
        visual_cues:
          - id: mixture-beat-2-focus-1
            phrase: Because each request’s component is hidden
            targets:
              - mixture-components
            color: yellow
            linger: 0.6
          - id: mixture-sum-density
            phrase: its density is the sum of the weighted component densities
            targets:
              - mixture-components
              - mixture-summed-density
            color: yellow
            linger: 0.6
      - say: With fixed weights, means, and spreads, we can evaluate that sum exactly. Maximum likelihood fitting means looking for parameters that make the six observations score as highly as possible. Change a mean and every request can get a different split. EM alternates between computing those splits and refitting the curves.
        hold: 0.75
        visual_cues:
          - id: mixture-beat-3-focus-1
            phrase: With fixed weights
            targets:
              - mixture-components
              - mixture-summed-density
            color: yellow
            linger: 0.6
  - id: responsibility
    title: "How much does the 50 ms request count?"
    visual: "A vertical slice through two fixed Gaussian densities becomes a pair of relative contribution strips. Extra copies of the slow strip change the membership of the same request."
    beats:
      - say: "Keep the request pinned at fifty milliseconds. These are the two component curves before weighting, with means of thirty and ninety and the same twenty-millisecond standard deviation. Read both heights at the pin. Take one slow height as a unit. The fast height stretches across about four and a half of those units. For now the model draws each component equally often, so we get one strip of each. How much of this one request goes to the fast component?"
        hold: 2
        visual_cues:
          - id: membership-slice
            phrase: "Read both heights at the pin"
            targets: [request-slice, weighted-strips]
            color: cyan
            linger: 0.25
          - id: membership-fast-strip
            phrase: "The fast height stretches across about four and a half of those units"
            targets: [request-slice, weighted-strips]
            color: blue
            linger: 0.25
          - id: membership-slow-strip
            phrase: "so we get one strip of each"
            targets: [request-slice, weighted-strips]
            color: pink
            linger: 0.25
      - say: "Divide the blue length by the lengths of both strips added together. The fast component gets about eighty-two percent. The slow component gets the rest. Each fraction is a responsibility, the probability of that hidden component given the latency and this model. You get the same fractions by dividing each prior-weighted density by their sum."
        hold: 0.9
        visual_cues:
          - id: membership-equal-result
            phrase: "The fast component gets about eighty-two percent"
            targets: [request-slice, weighted-strips, request-share]
            color: blue
            linger: 0.25
            caption_boundary: true
      - say: "Leave the pin and both curves where they are. Change the prior so we expect one fast draw for every nine slow draws. At fifty milliseconds the fast density is still four and a half times the slow density. Which component gets more of this request now?"
        hold: 2.2
        visual_cues:
          - id: membership-prior
            phrase: "one fast draw for every nine slow draws"
            targets: [request-slice, weighted-strips, request-share]
            color: pink
            linger: 0.25
      - say: "Count nine copies of the slow strip alongside the one fast strip. Their combined length takes the slow share to about sixty-seven percent. The fast share has fallen from about eighty-two percent to thirty-three. The timing of the request never changed. What changed was how often the model selects each component before seeing a latency."
        hold: 0.85
        visual_cues:
          - id: membership-copies
            phrase: "Count nine copies of the slow strip alongside the one fast strip"
            targets: [request-slice, weighted-strips, request-share]
            color: pink
            linger: 0.25
          - id: membership-rare-result
            phrase: "Their combined length takes the slow share to about sixty-seven percent"
            targets: [request-slice, weighted-strips, request-share]
            color: pink
            linger: 0.25
            caption_boundary: true
  - id: nearest-limit
    title: "What happens when the curves narrow?"
    visual: "Narrowing both components together concentrates the share at a uniquely closer mean. At the midpoint the two densities stay equal at every shared variance."
    beats:
      - say: "Reset the priors to one half each and keep the request at fifty. Bring both spreads down together, leaving both means still. The blue center has a twenty-millisecond lead in distance. As the shared variance approaches zero, that advantage sends its membership toward one. This also works for any fixed positive priors when one center is uniquely closest. With shared spherical variance and nonempty clusters, the weighted mean update then approaches the K-means update."
        hold: 0.75
        visual_cues:
          - id: nearest-limit-0
            phrase: "Reset the priors to one half each"
            targets: [nearest-limit-operation]
            color: cyan
            linger: 0.25
          - id: nearest-shrink
            phrase: "Bring both spreads down together"
            targets: [nearest-limit-operation]
            color: cyan
            linger: 0.25
      - say: "Try a tie. Put the request halfway between the centers, at sixty, and give the fast component one quarter of the prior weight. Shrink both spreads again. The likelihood factors are equal at the midpoint for every positive shared variance. The bar stays one quarter blue and three quarters pink. Independently shrinking a fitted component onto a point is a different operation. We will see what that does to likelihood."
        hold: 0.75
        visual_cues:
          - id: nearest-limit-1
            phrase: "Put the request halfway between the centers"
            targets: [nearest-limit-operation]
            color: cyan
            linger: 0.25
          - id: nearest-tie-shrink
            phrase: "Shrink both spreads again"
            targets: [nearest-limit-operation]
            color: cyan
            linger: 0.25
  - id: e-step
    title: "Split each request, then collect the shares"
    visual: "Each of the six original requests splits into two pieces. The pieces travel from that request to its two effective counts."
    beats:
      - say: "Return to the six requests. This time we are fitting a model. Start the two means at twenty-five and ninety-five milliseconds, with equal weights and standard deviations of thirty. Split each request using the same prior times density calculation. Look at the first request, at twenty-eight milliseconds. Even here the slow component gets a small piece."
        hold: 0.7
        visual_cues:
          - id: e-step-beat-1-focus-1
            phrase: "Start the two means at twenty-five and ninety-five milliseconds"
            targets: [e-step-operation]
            color: cyan
            linger: 0.25
          - id: em-each-row
            phrase: "Split each request using the same prior times density calculation"
            targets: [e-step-operation]
            color: cyan
            linger: 0.25
      - say: "Each pair adds up to one request. Gather the blue pieces in one row and the pink pieces in the other. The blue pieces come to just over three requests. That total is called the fast component’s effective count. A request can contribute to both counts because we are adding fractions."
        hold: 0.75
        visual_cues:
          - id: e-step-beat-2-focus-1
            phrase: "Each pair adds up to one request"
            targets: [e-step-operation]
            color: cyan
            linger: 0.25
          - id: em-effective-count
            phrase: "Gather the blue pieces in one row and the pink pieces in the other"
            targets: [e-step-operation]
            color: cyan
            linger: 0.25
      - say: "This was the expectation step, or E-step. We held the model parameters still and found the exact posterior shares under that model. Keep the pieces you just collected. They tell us how much each latency should count when we update the means."
        hold: 0.75
        visual_cues:
          - id: e-step-beat-3-focus-1
            phrase: "We held the model parameters still"
            targets: [e-step-operation]
            color: cyan
            linger: 0.25
  - id: m-step
    title: "Fit the curves with those same pieces"
    visual: "Each fractional request adds to two latency sums and effective counts. Their quotients become the new means, and the same shares determine the component weights and variances."
    beats:
      - say: "Hold those memberships fixed. Take the twenty-eight millisecond request first. Multiply twenty-eight by its blue share, then by its pink share. It contributes about twenty-six milliseconds to the fast sum and two to the slow sum. Do the same for the remaining five requests and add each color separately. Now divide each sum by its own effective count. The new means are about thirty-five and eighty-five milliseconds."
        hold: 0.8
        visual_cues:
          - id: m-step-beat-1-focus-1
            phrase: "Hold those memberships fixed"
            targets: [m-step-simulation-23]
            color: blue
            linger: 0.25
          - id: m-step-first-request
            phrase: "Multiply twenty-eight by its blue share, then by its pink share"
            targets: [m-step-simulation-23, m-step-products]
            color: blue
            linger: 0.25
          - id: m-step-rest
            phrase: "Do the same for the remaining five requests and add each color separately"
            targets: [m-step-products]
            color: blue
            linger: 0.25
      - say: "Those two quotients give the locations. Use each effective count divided by six as the new component weight. To get the variance, measure squared distances from the new mean and average them with the same frozen shares. Move both curves to their updated parameters. If almost no membership reaches a component, dividing by its count can fail. We will check that count before updating."
        hold: 0.8
        visual_cues:
          - id: m-step-beat-2-focus-1
            phrase: "Use each effective count divided by six"
            targets: [m-step-simulation-42]
            color: blue
            linger: 0.25
          - id: m-step-refit
            phrase: "Move both curves to their updated parameters"
            targets: [m-step-simulation-42]
            color: blue
            linger: 0.25
      - say: "That was the maximization step. The six original latencies are still here. With the new curves in place, the next E-step can divide each request differently. We can now ask what keeps this repeated refitting from making the data less likely."
        hold: 0.7
        visual_cues:
          - id: m-step-beat-3-focus-1
            phrase: "The six original latencies are still here"
            targets: [m-step-node-shares]
            color: blue
            linger: 0.25
          - id: m-step-beat-3-focus-2
            phrase: "With the new curves in place"
            targets: [m-step-node-weighted]
            color: blue
            linger: 0.25
  - id: jensen-construction
    title: "Two ways to average the same evidence"
    visual: "Each joint density divided by its trial share sets one endpoint of the chord. At the same horizontal position, a gold point marks the bound and a green point marks the log evidence. Their vertical separation vanishes when the trial shares reach the posterior."
    beats:
      - say: "Bring back the fifty-millisecond request and restore equal priors. Each colored number is a component’s contribution to its density. Try giving each component half the credit. Call that trial split q. Divide each contribution by its trial share. If you average the two results using those same shares, the divisions cancel. You get back the original total density. Give every possible component a positive trial share so none of its contribution disappears."
        hold: 0.7
        visual_cues:
          - id: jensen-construction-0
            phrase: "restore equal priors"
            targets: [jensen-construction-operation]
            color: cyan
            linger: 0.25
          - id: jensen-divide
            phrase: "Divide each contribution by its trial share"
            targets: [jensen-construction-operation]
            color: cyan
            linger: 0.25
          - id: jensen-cancel
            phrase: "the divisions cancel"
            targets: [jensen-construction-operation]
            color: cyan
            linger: 0.25
      - say: "Now try taking logs in two different orders. Take the log of each endpoint first. Their weighted average lies on the straight line between them. That lower point is the evidence lower bound, or ELBO. Here it is about minus five point one six five. Now average those same two ratios first and take the log afterward. You land on the curve at about minus four point nine zero six. The curve bows above its chord because the logarithm is concave. This is Jensen’s inequality. The vertical gap is about point two five eight nats."
        hold: 0.85
        visual_cues:
          - id: jensen-construction-1
            phrase: "taking logs in two different orders"
            targets: [jensen-construction-operation]
            color: cyan
            linger: 0.25
          - id: em-jensen-bound-result
            phrase: "Here it is about minus five point one six five"
            targets: [jensen-construction-operation]
            color: yellow
            linger: 0.25
            caption_boundary: true
          - id: em-jensen-evidence-result
            phrase: "You land on the curve at about minus four point nine zero six"
            targets: [jensen-construction-operation]
            color: green
            linger: 0.25
            caption_boundary: true
          - id: jensen-gap
            phrase: "The vertical gap is about point two five eight nats"
            targets: [jensen-construction-operation]
            color: cyan
            linger: 0.25
            caption_boundary: true
      - say: "Slide the trial split toward the posterior for this request. The two endpoints draw together. At the exact posterior each contribution divided by its share equals the same total density. The two orders now give the same answer. In general the gap equals the KL divergence from the trial distribution to the true posterior. It is nonnegative, and it vanishes at the posterior. Independence lets us do this calculation for each request separately and add the bounds."
        hold: 0.85
        visual_cues:
          - id: jensen-construction-2
            phrase: "for this request"
            targets: [jensen-construction-operation]
            color: cyan
            linger: 0.25
          - id: jensen-posterior
            phrase: "The two endpoints draw together. At the exact posterior each contribution divided by its share equals the same total density"
            targets: [jensen-construction-operation]
            color: yellow
            linger: 0.25
  - id: touching-bound
    title: "One mean and six sets of memberships"
    visual: "The first mean moves along a bound with six frozen membership bars. At the new mean the next E-step moves the bars and the bound together while likelihood stays pinned."
    beats:
      - say: "Give the fit just one knob to turn. Start the first mean at seventy milliseconds. Keep the second at ninety, the variances at four hundred milliseconds squared, and the two weights equal. At seventy, the six bars show the exact memberships. Here the gold bound touches the green likelihood. Freeze the bars. The blue pieces add up to just under four requests. Weight each latency by its blue share and the sum is about a hundred and eighty-five milliseconds."
        hold: 0.8
        visual_cues:
          - id: bound-freeze
            phrase: "Freeze the bars"
            targets: [bound-memberships]
            color: blue
            linger: 0.25
      - say: "Divide that weighted sum by the effective count. Slide the mean along the gold curve to forty-seven point three three milliseconds. Watch the bars while the mean moves. We used the same six shares throughout this M-step. At the new pin, the bound has climbed to about minus twenty-nine point five two. The likelihood sits just over one nat above it."
        hold: 0.8
        visual_cues:
          - id: bound-move
            phrase: "Slide the mean along the gold curve to forty-seven point three three milliseconds"
            targets: [bound-plot, bound-memberships]
            color: yellow
            linger: 0.25
          - id: bound-compare
            phrase: "The likelihood sits just over one nat above it"
            targets: [bound-plot, bound-memberships]
            color: green
            linger: 0.25
      - say: "Leave the pin at that mean. An exact E-step comes next. Which can move here, the green likelihood or the gold bound?"
        hold: 2.4
        visual_cues:
          - id: bound-predict
            phrase: "Which can move here, the green likelihood or the gold bound"
            targets: [bound-plot, bound-memberships, bound-question]
            color: yellow
            linger: 0.25
      - say: "Only the bound can move here. Recompute the six bars for the mean at the pin. Look at the eighty-six millisecond request. Its blue share drops from about forty-three percent to fourteen. The bound catches the likelihood at minus twenty-eight point four six five. The gap closes at this mean. Elsewhere, the old and new bounds can cross."
        hold: 0.85
        visual_cues:
          - id: bound-tighten
            phrase: "Recompute the six bars for the mean at the pin"
            targets: [bound-plot, bound-memberships]
            color: blue
            linger: 0.25
      - say: "Read the three scores from left to right. We started in contact. The M-step raised that frozen bound, and the new likelihood is at least as high as the bound. This also explains generalized EM. After an exact E-step, any parameter update that preserves or raises the expected complete-data log likelihood suffices. If likelihood is bounded above, its values converge. Convergence of the parameters needs more assumptions, and a different start can still fit better."
        hold: 0.9
        visual_cues:
          - id: bound-chain
            phrase: "Read the three scores from left to right"
            targets: [bound-plot]
            color: green
            linger: 0.25
  - id: likelihood
    title: What happens to likelihood as EM repeats?
    visual: An eight-update Gaussian mixture fit shows a non-decreasing log-likelihood trace from minus 29.620 to minus 17.694.
    beats:
      - say: Start the fit with means at twenty-five and ninety-five milliseconds, equal weights, and variances of nine hundred. The log likelihood begins near minus twenty-nine point six two. One E-step and M-step raise it to about minus twenty-seven point zero six.
        hold: 0.55
        caption_starts:
          - "One E-step and M-step"
        visual_cues:
          - id: likelihood-beat-1-focus-1
            phrase: The log likelihood begins near minus twenty-nine point six two
            targets:
              - likelihood-simulation-51
            color: blue
            linger: 0.6
          - id: likelihood-beat-1-focus-2
            phrase: Start the fit with means at twenty-five and ninety-five milliseconds
            targets:
              - likelihood-object-q-x-q-y-8-c-yellow-52
            color: blue
            linger: 0.6
          - id: likelihood-first-update
            phrase: One E-step and M-step raise it
            targets:
              - likelihood-simulation-51
            color: green
            linger: 0.5
          - id: likelihood-first-update-value
            phrase: about minus twenty-seven point zero six
            targets:
              - likelihood-simulation-51
            color: green
            linger: 0.5
      - say: With exact responsibilities and a true maximizing M-step over the allowed parameter space, each iteration leaves the observed-data likelihood at least as high as before. The lower bound touches likelihood after the E-step, then parameter updates raise or preserve that bound.
        hold: 0.6
        visual_cues:
          - id: likelihood-beat-2-focus-1
            phrase: each iteration leaves the observed-data likelihood at least as high as before
            targets:
              - likelihood-simulation-51
            color: blue
            linger: 0.6
          - id: likelihood-beat-2-focus-2
            phrase: With exact responsibilities and a true maximizing M-step
            targets:
              - likelihood-object-q-x-q-y-8-c-yellow-52
            color: blue
            linger: 0.6
      - say: Follow the dots across eight updates. The first few climb. By the last dot, the means have settled at thirty and ninety milliseconds. The last few scores round to the same value, minus seventeen point six nine four. On this flat stretch, another exact update leaves likelihood unchanged.
        caption_starts:
          - "By the last dot"
          - "minus seventeen point six nine four"
        motion_check:
          region:
            - 240
            - 365
            - 1010
            - 440
          minimumChangedFraction: 0.002
        hold: 0.75
        visual_cues:
          - id: likelihood-endpoint
            phrase: minus seventeen point six nine four
            targets: [likelihood-simulation-51]
            color: green
            linger: 0.25
          - id: likelihood-eight-updates
            phrase: Follow the dots across eight updates. The first few climb.
            targets:
              - likelihood-simulation-51
            color: green
            linger: 0.5
  - id: stable-responsibilities
    title: "What survived the underflow?"
    visual: "A two-unit gap between log scores survives a change of origin. The shifted exponentials have a usable sum. An invalid row and a small but real variance contribution show when to stop and when to keep a share."
    beats:
      - say: "Suppose one request falls far out in both tails. Add log prior weight to log Gaussian density for each component. Our two log scores are minus one thousand and minus one thousand two. They are two units apart on this ruler. Exponentiate them directly in double precision. Both results round to zero. Can we divide the first weight by their sum?"
        hold: 1.85
        visual_cues:
          - id: stable-underflow
            phrase: "Both results round to zero"
            targets: [score-ruler, score-weights, stable-share]
            color: pink
            linger: 0.25
            caption_boundary: true
      - say: "That ratio is undefined. Go back to the finite scores. Put zero at the larger score by subtracting it from both. The marks stay two units apart. Now exponentiate zero and minus two. One weight is one, and the other is about point one three five. Moving the origin multiplied both exact weights by the same factor, so it preserved their ratio."
        hold: 0.85
        visual_cues:
          - id: stable-undefined
            phrase: "That ratio is undefined"
            targets: [score-ruler, score-weights]
            color: yellow
            caption_boundary: true
          - id: stable-shift
            phrase: "Put zero at the larger score by subtracting it from both"
            targets: [score-ruler, score-weights]
            color: yellow
            linger: 0.25
          - id: stable-exponentials
            phrase: "Now exponentiate zero and minus two"
            targets: [score-ruler, score-weights]
            color: blue
            linger: 0.25
      - say: "Divide each weight by their sum. The first component gets about eighty-eight percent of the request and the second gets twelve percent. To recover the log of the original total density, take the log of this shifted sum and add the maximum back. That is log-sum-exp. For finite scores the largest shifted weight is one, even if a much smaller one still rounds to zero."
        hold: 0.8
        visual_cues:
          - id: stable-normalize
            phrase: "The first component gets about eighty-eight percent of the request and the second gets twelve percent"
            targets: [score-weights, stable-share]
            color: blue
            linger: 0.25
            caption_boundary: true
      - say: "What if both log scores are minus infinity? There is no finite maximum to subtract. Stop and inspect the input and the model. A nonfinite latency or a nonpositive variance also needs correction. There is a second check after adding memberships across requests. If a component has almost no total membership, another initialization gives it a fresh start. The example stops before dividing by that count."
        hold: 0.8
        caption_starts:
          - "There is no finite maximum to subtract"
        visual_cues:
          - id: stable-invalid
            phrase: "There is no finite maximum to subtract"
            targets: [stable-check]
            color: yellow
            linger: 0.25
          - id: stable-empty
            phrase: "If a component has almost no total membership"
            targets: [stable-check]
            color: yellow
            linger: 0.25
      - say: "A small share on a single request is worth keeping. Look at the ninety-four millisecond request in our first full M-step. The fast component gets less than seven percent of it. Yet it lies far from the new fast mean, so even that small share adds appreciably to the weighted squared distance. Add the six contributions and divide by the fast effective count for its maximum-likelihood variance. Each request contributed one unit across the components, so their new mixture weights also sum to one."
        hold: 0.85
        visual_cues:
          - id: stable-distance
            phrase: "Look at the ninety-four millisecond request"
            targets: [weighted-deviations]
            color: yellow
            linger: 0.25
  - id: variance-constraint
    title: Keep the variance safeguard inside the objective
    visual: A variance-dependent Q curve meets a fixed positive lower boundary. Clamping and adding a ridge give different variances.
    beats:
      - say: Without constraints, a positive-weight mixture component can sit on one observed point while its variance approaches zero. Its peak density diverges. Another component can keep finite density on the remaining observations, so training likelihood has no finite maximum. A single Gaussian fitted to all six times would lose density on the other five as it narrowed. Here the broad component keeps those five covered.
        hold: 0.8
        visual_cues:
          - id: variance-constraint-0
            phrase: Without constraints, a positive-weight mixture component can sit on one observed point while its variance approaches zero
            targets:
              - variance-constraint-operation
            linger: 0.4
          - id: variance-collapse
            phrase: while its variance approaches zero
            targets:
              - variance-constraint-operation
            color: cyan
            linger: 0.4
      - say: Freeze the responsibilities and new mean. If effective count is N and weighted squared deviation is S, the variance part of Q is negative one half times N times log variance, minus S divided by twice the variance. Its unconstrained optimum is S divided by N. Under a fixed positive minimum variance, the exact constrained optimum is the larger of that ratio and the floor. For a separate ratio of point two five and floor one, clamping yields one; adding a ridge of one yields one point two five. Those are different updates.
        hold: 0.8
        visual_cues:
          - id: variance-constraint-1
            phrase: Freeze the responsibilities and new mean
            targets:
              - variance-constraint-operation
            linger: 0.4
          - id: variance-optimum
            phrase: Its unconstrained optimum is S divided by N
            targets:
              - variance-constraint-operation
            color: cyan
            linger: 0.4
          - id: variance-floor
            phrase: For a separate ratio of point two five and floor one, clamping yields one
            targets:
              - variance-constraint-operation
            color: cyan
            linger: 0.4
          - id: variance-ridge
            phrase: adding a ridge of one yields one point two five
            targets:
              - variance-constraint-operation
            color: cyan
            linger: 0.4
      - say: Start both variances at or above one and keep that floor at every update. Even with a mean placed exactly on a request, the ceiling on density is about point four per millisecond. That ceiling bounds the training likelihood. Clamping maximizes the same constrained objective at every M-step. Adding a ridge gives a different update.
        hold: 0.8
        visual_cues:
          - id: variance-constraint-2
            phrase: Start both variances at or above one
            targets:
              - variance-constraint-operation
            linger: 0.4
          - id: variance-feasible
            phrase: keep that floor at every update
            targets:
              - variance-constraint-operation
            color: cyan
            linger: 0.4
  - id: initialization
    title: Initialization can choose the basin of attraction
    visual: Separated starting means reach a better likelihood than identical means, which preserve a symmetric pooled fit.
    beats:
      - say: Now initialize both components identically at sixty milliseconds. Every observation receives equal membership in each component. The weighted updates keep their means and variances identical, so the algorithm has no asymmetry to separate the peaks.
        hold: 0.55
        visual_cues:
          - id: initialization-beat-1-focus-1
            phrase: Now initialize both components identically at sixty milliseconds
            targets:
              - initialization-simulation-62
            color: blue
            linger: 0.6
          - id: initialization-beat-1-focus-2
            phrase: The weighted updates keep their means and variances identical
            targets:
              - initialization-simulation-62
            color: blue
            linger: 0.6
          - id: em-symmetry-answer
            phrase: Every observation receives equal membership in each component
            targets:
              - initialization-simulation-62
            color: cyan
            linger: 0.4
      - say: This symmetric fit ends at a lower log likelihood than the separated initialization. The likelihood surface can contain local optima, and exact EM follows the local improvement path produced by its start.
        hold: 0.6
        visual_cues:
          - id: initialization-beat-2-focus-1
            phrase: This symmetric fit ends at a lower log
            targets:
              - initialization-simulation-62
            color: blue
            linger: 0.6
      - say: "Watch the two curves over the same request. The pink peak keeps rising as its spread shrinks. The green peak stops at the spread allowed by our variance floor. That keeps this one request from driving the training score arbitrarily high."
        hold: 0.75
        visual_cues:
          - id: initialization-beat-3-focus-1
            phrase: "Watch the two curves over the same request"
            targets:
              - initialization-collapse
            color: blue
            linger: 0.6
  - id: model-checks
    title: Which fit better predicts fresh requests?
    visual: Separated and symmetric models score the same four held-out requests. Swapping component names leaves the density fixed, and Gaussian tails extend below zero.
    beats:
      - say: Put four fresh request times on the axis. The first two sit near the narrow peak at thirty. The other two sit near ninety, where the training times spread twice as far from the mean. That gives the second component four times the variance. Look straight up from each gold mark. Which curve gives these four times higher density?
        hold: 2.0
        caption_starts:
          - "Look straight up from each gold mark"
        visual_cues:
          - id: model-checks-0
            phrase: Put four fresh request times on the axis
            targets:
              - model-checks-operation
            linger: 0.4
          - id: model-checks-spread
            phrase: That gives the second component four times the variance
            targets: [model-checks-operation]
            color: cyan
            linger: 0.25
          - id: model-checks-heights
            phrase: Look straight up from each gold mark
            targets: [model-checks-operation]
            color: yellow
            linger: 0.25
      - say: The green curve is higher at all four marks. Average the four log densities to score each fit. The separated fit scores about minus two point six four per request. The symmetric fit scores about minus four point eight two. On these requests, the separated fit wins.
        hold: 0.8
        caption_starts:
          - "The separated fit scores"
          - "The symmetric fit scores"
        visual_cues:
          - id: em-validation-separated
            phrase: The separated fit scores about minus two point six four per request
            targets:
              - model-checks-operation
            color: cyan
            linger: 0
          - id: em-validation-symmetric
            phrase: The symmetric fit scores about minus four point eight two
            targets:
              - model-checks-operation
            color: cyan
            linger: 0
      - say: Keep the variance floor fixed and give the narrow peak a twin. Split its weight between the two copies. Their heights still add up to the same curve. So a three-component model can match any two-component fit. EM can still settle on a worse fit from a particular start. Try several asymmetric starts for each size and keep its best training score. To choose the size, compare held-out scores or use AIC or BIC to account for the extra parameters.
        hold: 0.8
        visual_cues:
          - id: model-checks-1
            phrase: Keep the variance floor fixed
            targets:
              - model-checks-operation
            linger: 0.4
          - id: model-nesting
            phrase: Split its weight between the two copies
            targets:
              - model-checks-operation
            color: cyan
            linger: 0.4
      - say: Swap the names of the components. The blue and pink curves trade places. Their green sum stays put. To simulate a latency, pick a component by its weight and draw from its Gaussian. Compare those draws with fresh traffic, including the tails. If the model draws negative times, a distribution on positive values can enforce the physical limit. Here we held the fitted parameters fixed. A Bayesian posterior predictive check also draws parameters from their posterior.
        hold: 0.8
        visual_cues:
          - id: model-checks-2
            phrase: To simulate a latency
            targets:
              - model-checks-operation
            linger: 0.4
          - id: model-label-swap
            phrase: Swap the names of the components
            targets:
              - model-checks-operation
            color: cyan
            linger: 0.4
  - id: vae
    title: A VAE replaces exact responsibilities with an encoder
    visual: The mixture computes an exact component posterior before a weighted fit, while a VAE encoder approximates a continuous latent posterior for gradient training.
    beats:
      - say: A Gaussian mixture has a small discrete hidden variable, so its posterior responsibilities can be calculated exactly. The E-step then feeds a weighted maximum-likelihood update in the M-step.
        hold: 0.55
        visual_cues:
          - id: vae-beat-1-focus-1
            phrase: A Gaussian mixture has a small discrete hidden variable
            targets:
              - vae-operation
            color: cyan
