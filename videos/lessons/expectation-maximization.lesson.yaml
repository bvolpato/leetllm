            targets:
              - vae-operation
            color: pink
            linger: 0.6
      - say: Both methods use lower-bound reasoning, while their inference updates differ. Standard VAE training uses an approximate encoder and gradient optimization; EM computes exact responsibilities and can use a closed-form M-step for this mixture.
