          - id: vae-weighted-m-step
            phrase: The E-step then feeds a weighted maximum-likelihood update in the M-step
            targets:
              - vae-operation
            color: blue
            linger: 0.6
      - say: A variational autoencoder uses a neural encoder to approximate a posterior over continuous latent values. The encoder and decoder usually train together with stochastic gradients that optimize a lower bound on log likelihood.
        hold: 0.6
        visual_cues:
          - id: vae-beat-2-focus-1
            phrase: A variational autoencoder uses a neural encoder to
            targets:
