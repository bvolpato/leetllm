  - id: reparameterized-encoder
    title: "Follow one draw through the encoder"
    visual: "The VAE bound loses a prior KL penalty and sits below evidence by a posterior KL gap. One fixed-noise draw connects reconstruction to the encoder and decoder. A separate score comparison tests monotonicity."
    beats:
      - say: "Run three different inputs through the same encoder. Each gets its own distribution for z, but the parameters that produced them are shared. This is amortized inference. With a continuous latent vector and a nonlinear decoder, the evidence integral and the posterior are usually unavailable in closed form. Linear Gaussian models can still be integrated exactly. A restricted encoder family can leave a gap to the true posterior."
        hold: 0.8
        visual_cues:
          - id: reparameterized-encoder-0
            phrase: "three different inputs through the same encoder"
            targets: [reparameterized-encoder-operation]
            color: cyan
            linger: 0.25
      - say: "Two KL terms play different roles. Suppose the expected decoder log likelihood for one observation is minus five point two. Subtract a prior penalty of point eight to get a bound of minus six. That penalty compares the encoder with the prior. If the gap to the true posterior is one point five, add that gap to the bound. The log evidence is minus four point five. The prior penalty shapes training. The posterior gap tells us how tight the bound is."
        hold: 0.8
        visual_cues:
          - id: reparameterized-encoder-1
            phrase: "Two KL terms play different roles"
            targets: [reparameterized-encoder-operation]
            color: cyan
            linger: 0.25
          - id: encoder-prior-cost
            phrase: "Subtract a prior penalty of point eight to get a bound of minus six"
            targets: [reparameterized-encoder-operation]
            color: yellow
            linger: 0.25
          - id: encoder-evidence-gap
            phrase: "add that gap to the bound"
            targets: [reparameterized-encoder-operation]
            color: green
            linger: 0.25
          - id: encoder-evidence-value
            phrase: "The log evidence is minus four point five"
            targets: [reparameterized-encoder-operation]
            color: green
      - say: "Take one draw from a Gaussian encoder. Start with standard normal noise, multiply it by the encoder standard deviation, and add the encoder mean. With mean one, standard deviation two, and noise one half, the sample is two. Pass it through a Gaussian decoder with mean w times z and variance one. Set w to one. The prediction is two and the observation is three, so half the squared error is one half. This is the reconstruction loss up to a constant. At this draw the loss gradient is minus one for the encoder mean, minus one half for its standard deviation, and minus two for the decoder weight. Watch how the gradients get back to the encoder. Hold the noise fixed and nudge the mean. The sample moves by the full nudge. Reset the mean and nudge the standard deviation. This time the sample moves half as far. Reparameterizing the draw gives reconstruction a path to train both encoder outputs, as well as the decoder. The prior penalty also trains the encoder."
        hold: 0.8
        visual_cues:
          - id: reparameterized-encoder-2
            phrase: "Take one draw from a Gaussian encoder"
            targets: [reparameterized-encoder-operation]
            color: cyan
            linger: 0.25
          - id: em-encoder-sample-result
            phrase: "the sample is two"
            targets: [reparameterized-encoder-operation]
            color: cyan
            linger: 0.25
          - id: encoder-decoder-contract
            phrase: "Pass it through a Gaussian decoder"
            targets: [reparameterized-encoder-operation]
            color: cyan
            linger: 0.25
          - id: encoder-reconstruction-loss
            phrase: "half the squared error is one half"
            targets: [reparameterized-encoder-operation]
            color: cyan
            linger: 0.25
          - id: encoder-reconstruction-gradients
            phrase: "minus one for the encoder mean"
            targets: [reparameterized-encoder-operation]
            color: cyan
            linger: 0.25
          - id: em-encoder-deviation-gradient
            phrase: "minus one half for its standard deviation"
            targets: [reparameterized-encoder-operation]
            color: cyan
            linger: 0.25
          - id: em-encoder-weight-gradient
            phrase: "minus two for the decoder weight"
            targets: [reparameterized-encoder-operation]
            color: cyan
            linger: 0.25
          - id: encoder-mean-nudge
            phrase: "Hold the noise fixed and nudge the mean"
            targets: [reparameterized-encoder-operation]
            color: cyan
            linger: 0.25
          - id: encoder-sd-nudge
            phrase: "Reset the mean and nudge the standard deviation"
            targets: [reparameterized-encoder-operation]
            color: cyan
            linger: 0.25
      - say: "Start at minus ten. Follow the gap three units to the right. The log evidence is minus seven. Now raise the bound by one and shrink the gap from three to one. Where will the green arrow end?"
        hold: 2.0
        caption_starts:
          - "Now raise the bound by one"
        visual_cues:
          - id: reparameterized-encoder-3
            phrase: "Follow the gap three units to the right"
            targets: [reparameterized-encoder-operation]
            color: cyan
            linger: 0.25
          - id: encoder-change-gap
            phrase: "raise the bound by one and shrink the gap from three to one"
            targets: [reparameterized-encoder-operation]
            color: cyan
            linger: 0.25
      - say: "At minus eight. The bound gained one unit, but the gap lost two. The evidence fell by one. Even an increase in the full VAE bound can go with lower likelihood. A minibatch estimates that bound from a sample."
        hold: 0.9
        visual_cues:
          - id: encoder-evidence-result
            phrase: "At minus eight"
            targets: [reparameterized-encoder-operation]
            color: green
            linger: 0.25
  - id: takeaway
    title: What would the fit put in the empty band?
    visual: The opening interval stays fixed while the pooled Gaussian and the fitted mixture put different probability mass inside it.
    beats:
