version: 1
id: hybrid-search
title: "Hybrid Search: From Terms and Vectors to Retained Evidence"
source: retrieval/hybrid-search-dense-sparse-retrieval/content.md
voice: en-US-AndrewNeural
rate: +0%
sources:
  - title: Reciprocal Rank Fusion
    url: https://cormack.uwaterloo.ca/cormacksigir09-rrf.pdf
  - title: Dense Passage Retrieval
    url: https://arxiv.org/abs/2004.04906
  - title: BM25Similarity documentation
    url: https://lucene.apache.org/core/10_3_1/core/org/apache/lucene/search/similarities/BM25Similarity.html
  - title: SPLADE original
    url: https://arxiv.org/abs/2107.05720
  - title: SPLADE v2
    url: https://arxiv.org/abs/2109.10086
  - title: HNSW
    url: https://arxiv.org/abs/1603.09320
  - title: pgvector index contracts
    url: https://github.com/pgvector/pgvector
  - title: Faiss index families
    url: https://github.com/facebookresearch/faiss/wiki/Faiss-indexes
scenes:
  - id: subject-intro
    title: Two ways to ask for the same thing
    visual: An exact book code and a familiar paraphrase follow separate routes toward the same gardening guide.
    beats:
      - say: You remember a book about growing tomatoes, but the library catalog calls it a guide to vegetable
          gardening. Another visitor knows its exact catalog code. A useful search system should give both
          visitors a good way to find the same book. That gap between remembered language and stored wording
          appears in everyday searches.
        hold: 0.55
        visual_cues:
          - id: find-book
            phrase: guide to vegetable gardening
            targets:
              - stored-title
              - book-identity
            color: green
            linger: 0.5
          - id: intro-exact-code
            phrase: Another visitor knows its exact catalog code.
            targets:
              - book-identity
              - stored-title
            color: yellow
            linger: 0.5
      - say: Words supply one kind of evidence. A learned representation of meaning supplies another. Hybrid search
          keeps both signals available, so a precise identifier and an ordinary paraphrase can each contribute
          candidates to the result.
        hold: 0.75
        visual_cues:
          - id: complementary-signals
            phrase: precise identifier and an ordinary paraphrase
            targets:
              - book-identity
              - query-paraphrase
            color: cyan
            linger: 0.5
          - id: intro-dense-evidence
            phrase: A learned representation of meaning supplies another.
            targets:
              - book-identity
              - query-paraphrase
            color: pink
            linger: 0.5
          - id: intro-both-candidates
            phrase: each contribute candidates to the result.
            targets:
              - book-identity
              - query-paraphrase
            color: green
            linger: 0.5
      - say: We will follow a small constructed library through those two routes, combine its rankings, and examine a
          case where combining them actually hides a useful book. The moving cards will let us see exactly
          where that happens.
        hold: 0.55
        visual_cues:
          - id: track-book
            phrase: moving cards will let us see exactly where that happens
            targets:
              - book-identity
              - stored-title
            color: blue
            linger: 0.5
  - id: eligible-corpus
    title: Decide which records may enter
    visual: Five records encounter an access and freshness gate; three permitted current records enter both lanes.
    beats:
      - say: A search result begins with a collection of records. Each has an identifier and text, and often a version
          or access rule. Here our current gardening books are available to the reader. An archived edition
          and a restricted record stay outside the searchable set.
        hold: 0.55
        visual_cues:
          - id: admit-records
            phrase: current gardening books are available to the reader
            targets:
              - source-records
              - access-gate
            color: green
            linger: 0.5
      - say: The gate runs before these two application ranking lanes. Both receive the same eligible records. This
          makes their candidate budgets meaningful for the reader and keeps restricted content out of the
          lists, logs, and contexts that this demonstration exposes.
        hold: 0.75
        visual_cues:
          - id: shared-corpus
            phrase: same eligible records
            targets:
              - eligible-records
            color: green
            linger: 0.5
      - say: A database may traverse other internal structures inside its trusted boundary. The serving requirement is
          that unauthorized content never escapes that boundary. Recheck access when fetching a selected
          passage, since permissions can change between search and use.
        hold: 0.55
        visual_cues:
          - id: recheck-access
            phrase: Recheck access when fetching a selected passage
            targets:
              - access-gate
            color: yellow
            linger: 0.5
  - id: lexical-lane
    title: Let exact words cast a vote
    visual: Query words activate document-term links and a rare catalog identifier selects one record.
    beats:
      - say: Lexical search connects a query to terms in the indexed text. An inverted index maps a term to the
          records containing it. Searching for tomato activates its posting list, avoiding a fresh reading of
          every book in the collection.
        hold: 0.55
        visual_cues:
          - id: posting-list
            phrase: inverted index maps a term to the records containing it
            targets:
              - indexed-term
              - matched-book
            color: blue
            linger: 0.5
          - id: tomato-postings
            phrase: Searching for tomato activates its posting list
            targets:
              - lexical-query
              - indexed-term
              - matched-book
              - passage-tokens
            color: yellow
            linger: 0.5
      - say: BM25 adjusts these matches using term rarity, repeated occurrences, and document length. Repeating a word
          has diminishing returns. A rare catalog code can be especially useful, provided the query and
          document analyzer preserve that code in compatible forms.
        hold: 0.75
        visual_cues:
          - id: rarity-frequency
            phrase: term rarity, repeated occurrences, and document length
            targets:
              - bm25-mechanism
              - passage-tokens
            color: cyan
            linger: 0.5
          - id: rare-code-postings
            phrase: A rare catalog code can be especially useful
            targets:
              - lexical-query
              - indexed-term
              - matched-book
              - passage-tokens
            color: yellow
            linger: 0.5
      - say: Now ask for growing tomatoes while a passage says raising tomato plants. Stemming or learned sparse
          expansion may help. For this deliberately simple word matcher, the phrase changes remove useful
          overlap. That leaves an opening for the semantic lane.
        hold: 0.55
        visual_cues:
          - id: paraphrase-miss
            phrase: growing tomatoes while a passage says raising tomato plants
            targets:
              - lexical-query
              - passage-tokens
            color: pink
            linger: 0.5
  - id: dense-lane
    title: Compare learned representations
    visual: Two-dimensional supplied vectors expose cosine alignment while the paraphrase moves toward the
      gardening book.
    beats:
      - say: A dense encoder turns the query and each passage into a vector, a list of coordinates learned from
          training examples. Passage vectors can be prepared in advance. At query time, the system encodes the
          question and searches for compatible passage vectors.
        hold: 0.55
        visual_cues:
          - id: encode-vectors
            phrase: turns the query and each passage into a vector
            targets:
              - query-passage-vectors
            color: cyan
            linger: 0.5
      - say: For our picture we supply two coordinates ourselves. Normalize the arrows, then compare their dot
          products. Similar directions receive larger cosine scores. The hand-placed gardening passage lies
          near the paraphrase, while an unrelated cooking passage points elsewhere.
        hold: 0.75
        visual_cues:
          - id: normalize-vectors
            phrase: Normalize the arrows, then compare their dot products
            targets:
              - query-passage-vectors
              - cosine-rule
            color: yellow
            linger: 0.5
          - id: cosine-match
            phrase: Similar directions receive larger cosine scores
            targets:
              - cosine-score
            color: green
            linger: 0.5
      - say: A learned embedding has many coordinates without these tidy labels. Its training and preprocessing
          determine whether this geometry captures useful relevance. An unfamiliar catalog identifier may
          still get an embedding, while receiving a poor ranking. Test both ordinary wording and identifiers.
        hold: 0.55
        visual_cues:
          - id: embedding-limit
            phrase: training and preprocessing determine whether this geometry captures useful relevance
            targets:
              - query-passage-vectors
            color: cyan
            linger: 0.5
  - id: rank-fusion
    title: Turn ranks into comparable contributions
    visual: Two ranked columns deliver reciprocal-rank contributions; matching book identities merge into a third
      column.
    beats:
      - say: The two lanes return different score scales. A lexical score and a cosine value express different
          calculations. Reciprocal rank fusion uses positions in each list so that both lanes can contribute
          without directly adding those incompatible raw values.
        hold: 0.55
        visual_cues:
          - id: rank-scales
            phrase: positions in each list
            targets:
              - ranked-lanes
            color: blue
            linger: 0.5
      - say: Each returned record receives one over a smoothing constant plus its rank. Here the constant is sixty.
          Add a contribution for every list containing that record. A missing record contributes zero, and
          repeated appearances inside one lane count only once.
        hold: 0.75
        visual_cues:
          - id: rank-reciprocal
            phrase: one over a smoothing constant plus its rank
            targets:
              - fusion-rule
            color: yellow
            linger: 0.5
          - id: add-rank-terms
            phrase: Add a contribution for every list containing that record
            targets:
              - document-scores
            color: cyan
            linger: 0.5
      - say: Watch the shared gardening guide accumulate two small contributions. Another book appears in only one
          lane and receives one. The fused score orders the union of candidates. Its magnitude serves ranking;
          interpreting it as a relevance probability would require a separate calibration.
        hold: 0.55
        visual_cues:
          - id: shared-document
            phrase: shared gardening guide accumulate two small contributions
            targets:
              - document-scores
            color: green
            linger: 0.5
          - id: union-ranking
            phrase: fused score orders the union of candidates
            targets:
              - document-scores
            color: yellow
            linger: 0.5
        motion_check:
          region:
            - 1120
            - 335
            - 610
            - 470
          minimumChangedFraction: 0.002
  - id: consensus-trap
    title: Agreement can promote a distractor
    visual: A two-lane distractor rises above a correct one-lane hit; the final context cutoff visibly drops the
      target.
    beats:
      - say: Try predicting this arrangement. The correct book leads the lexical list and is absent from the dense
          list. A distractor sits second in both. Which receives the larger fused score? Give the two visible
          reciprocal terms a moment to settle.
        hold: 0.55
        visual_cues:
          - id: predict-agreement
            phrase: correct book leads the lexical list and is absent from the dense list
            targets:
              - trap-lanes
            color: green
            linger: 0.5
          - id: settle-terms
            phrase: Give the two visible reciprocal terms a moment to settle
            targets:
              - trap-scores
            color: yellow
            linger: 0.5
      - say: The distractor wins because its two contributions together outweigh the correct book's single
          contribution. Agreement between retrieval methods can be useful, but agreement can also reinforce
          the same mistake. The correct candidate now falls below a small final cutoff.
        hold: 0.75
        visual_cues:
          - id: reinforced-error
            phrase: two contributions together outweigh the correct book's single contribution
            targets:
              - trap-scores
              - trap-terms
            color: pink
            linger: 0.5
          - id: final-cutoff
            phrase: falls below a small final cutoff
            targets:
              - trap-context
            color: yellow
            linger: 0.5
      - say: A broader fused pool would preserve it for a later reranker in this example. Increasing an already
          complete input list changes nothing. Keep lane depth, fused candidate budget, and final context size
          separate so a useful passage has a chance to survive each stage.
        hold: 0.55
        visual_cues:
          - id: preserve-candidate
            phrase: broader fused pool would preserve it for a later reranker
            targets:
              - trap-context
              - trap-lanes
            color: green
            linger: 0.5
  - id: new-query
    title: Measure what survives the cutoff
    visual: A second natural-language query tests exact, paraphrase, and distractor cases while a candidate-recall
      ledger updates.
    beats:
      - say: Now the reader asks for a book about bread that rises overnight. The same machinery runs again, but the
          useful signal may shift toward a paraphrase about slow fermentation. Predict which lane is likely to
          help before looking at its returned cards.
        hold: 0.55
        visual_cues:
          - id: predict-lane
            phrase: Predict which lane is likely to help
            targets:
              - prediction
              - reader-query
            color: yellow
            linger: 0.5
      - say: Our supplied rankings illustrate complementary evidence, rather than measure an encoder. For a real
          evaluation, label the passages needed for representative questions. Check how often each lane
          recovers them, and then repeat that measurement after fusion and context selection.
        hold: 0.75
        visual_cues:
          - id: returned-ranks
            phrase: Our supplied rankings illustrate complementary evidence
            targets:
              - returned-candidates
            color: cyan
            linger: 0.5
          - id: measure-fusion
            phrase: repeat that measurement after fusion and context selection
            targets:
              - fused-candidates
              - context-recall
            color: green
            linger: 0.5
      - say: Increase the final context budget to two. Slow Bread now survives, restoring the required source. The
          book was already retrieved; the cutoff decided whether the answer could use it. Measure coverage,
          latency, and cost together.
        hold: 0.75
        visual_cues:
          - id: expand-final-cutoff
            phrase: final context budget to two
            targets:
              - fused-candidates
              - context-recall
            color: yellow
            linger: 0.5
          - id: recovered-needed-source
            phrase: Slow Bread now survives, restoring the required source
            targets:
              - fused-candidates
              - context-recall
            color: green
            linger: 0.6
  - id: bm25-open
    title: Open the posting list and its score
    visual: A preserved rare identifier enters its posting list, then the same term changes frequency and document
      length one at a time.
    beats:
      - say: Open the lexical lane before changing its model. The article’s policy example gives Luna the exact code
          KROT fourteen and the paraphrase refresh expired machine credential. Keep the current permitted key
          rule, session rule and audit note; block the old revision and admin rule. Lowercase the code
          consistently into one krot-fourteen token. A query analyzer that keeps the code whole cannot match
          an index that split or discarded its digits. Inspect the actual analyzed tokens and rebuild the
          affected field after an analyzer change.
        hold: 1
        visual_cues:
          - id: analyze-code
            phrase: Lowercase the code consistently
            targets:
              - bm25-open-mechanism
            color: yellow
          - id: code-posting
            phrase: one krot-fourteen token
            targets:
              - bm25-open-mechanism
            color: yellow
          - id: analyzer-mismatch
            phrase: cannot match an index that split or discarded its digits
            targets:
              - bm25-open-mechanism
            color: yellow
      - say: For one term, multiply inverse document frequency by its saturating frequency factor. Use three
          equal-length documents, one containing the code, k one equal one point two and b equal point seven
          five. The positive IDF is natural log of one plus two point five over one point five, about point
          nine eight one. At one occurrence and average length, the frequency factor is one. At two
          occurrences it is one point three seven five; at four it is about one point six nine two. Repetition
          helps less each time, approaching the factor two point two when length is held fixed.
        hold: 1
        visual_cues:
          - id: term-idf
            phrase: about point nine eight one
            targets:
              - bm25-open-mechanism
            color: yellow
          - id: frequency-one
            phrase: frequency factor is one
            targets:
              - bm25-open-mechanism
            color: yellow
          - id: frequency-two
            phrase: it is one point three seven five
            targets:
              - bm25-open-mechanism
            color: yellow
          - id: frequency-four
            phrase: it is about one point six nine two
            targets:
              - bm25-open-mechanism
            color: yellow
      - say: Now hold frequency at one and change only document length. For the numerator, multiply term frequency by
          the quantity k one plus one. The denominator is frequency plus k one times one minus b plus b times
          document length over average length. Half-average length gives a factor about one point two five
          seven; double-average length gives about point seven one zero. Setting b to zero removes this length
          effect. These are term contributions, not a guarantee that the shorter passage answers the question.
          This toy recomputes statistics on the permitted corpus; a filtered production index may still use
          wider collection statistics.
        hold: 1
        visual_cues:
          - id: half-length
            phrase: Half-average length gives a factor about one point two five seven
            targets:
              - bm25-open-mechanism
            color: yellow
          - id: double-length
            phrase: double-average length gives about point seven one zero
            targets:
              - bm25-open-mechanism
            color: yellow
          - id: length-off
            phrase: Setting b to zero removes this length effect
            targets:
              - bm25-open-mechanism
            color: yellow
  - id: sparse-expansion
    title: Sparse can also learn vocabulary overlap
    visual: Two supplied token-position activations become nonnegative vocabulary weights, then sum or max pool
      into one posting coordinate.
    beats:
      - say: SPLADE uses a transformer’s masked-language-model head to assign vocabulary weights. A vocabulary item
          can receive weight even when its word is absent from the input, creating overlap across a lexical
          gap. For each position and vocabulary item, apply ReLU then natural log of one plus that positive
          activation. Original SPLADE sums these transformed activations over positions; SPLADE two instead
          takes their maximum. Sparsity regularization controls how many weighted terms remain useful for
          retrieval.
        hold: 1
        visual_cues:
          - id: sparse-rule
            phrase: apply ReLU then natural log of one plus that positive activation
            targets:
              - sparse-expansion-mechanism
            color: yellow
      - say: In a supplied two-position example for credential, logits minus two and three become zero and natural log
          four, about one point three eight six. Sum and max agree here. If both logits are three, sum becomes
          twice natural log four, while max stays natural log four. These are authored activations, not a run
          of a SPLADE checkpoint. Weighted sparse dot products need an index and scoring path that accept
          those weights; a BM25-only endpoint does not supply that contract. Evaluate query work, index size,
          recall and permissions.
        hold: 1
        visual_cues:
          - id: sparse-pool
            phrase: become zero and natural log four
            targets:
              - sparse-expansion-mechanism
            color: yellow
          - id: sparse-second
            phrase: If both logits are three
            targets:
              - sparse-expansion-mechanism
            color: yellow
          - id: weighted-index
            phrase: a BM25-only endpoint does not supply that contract
            targets:
              - sparse-expansion-mechanism
            color: yellow
  - id: embedding-contract
    title: The learned space has a version and an input limit
    visual: The fixed query and stored vectors lose compatibility when a checkpoint or truncated deciding clause
      changes.
    beats:
      - say: Dense Passage Retrieval originally used separate BERT-base query and passage encoders, each producing a
          seven-hundred-sixty-eight-coordinate CLS representation and scoring by inner product. Other
          embedding models pool tokens differently. Passage encoding happens offline; query encoding happens
          at request time. On unit vectors inner product equals cosine. Without normalization, dot product
          also rewards vector length. Follow the checkpoint’s trained score and preprocessing rather than
          choosing a metric from its name.
        hold: 1
        visual_cues:
          - id: dense-metric
            phrase: Without normalization, dot product also rewards vector length
            targets:
              - embedding-contract-mechanism
            color: yellow
      - say: The article’s MiniLM example uses three hundred eighty-four coordinates and a
          two-hundred-fifty-six-wordpiece input limit. Its reported small-corpus paraphrase ranking changes
          when related certificate and key policies are added. Its bare-code query prefers KROT thirteen over
          the target KROT fourteen in that fixture. These observations diagnose that checkpoint on those
          supplied sentences, not every encoder. Inspect the actual tokenized identifier, returned passages
          and query family on a frozen evaluation set.
        hold: 1
      - say: "Reject zero and nonfinite vectors before cosine, and check dimensions and normalization. A deciding
          clause beyond the configured token limit cannot affect an embedding computed from the retained
          prefix. Re-embed passages with a changed encoder and keep the matching query encoder, tokenizer,
          truncation, pooling and index generation together. Equal vector widths do not establish compatible
          spaces. Use a separate supplied unit-vector worksheet: target one zero, distractor zero one, query
          one zero. Rotate only the query counterclockwise by a quarter turn; the distractor wins one to zero.
          Rotate both passages by that same quarter turn; the target wins one to zero again. Keep the
          permitted set and model generation in the trace."
        hold: 1
        visual_cues:
          - id: paired-generation
            phrase: A deciding clause beyond the configured token limit
            targets:
              - embedding-contract-mechanism
            color: yellow
          - id: reembed-generation
            phrase: Re-embed passages with a changed encoder
            targets:
              - embedding-contract-mechanism
            color: yellow
          - id: version-worksheet
            phrase: "Use a separate supplied unit-vector worksheet: target one zero, distractor zero one, query one zero."
            targets:
              - embedding-contract-mechanism
            color: yellow
            linger: 0.5
          - id: version-query-rotate
            phrase: Rotate only the query counterclockwise by a quarter turn;
            targets:
              - embedding-contract-mechanism
            color: yellow
            linger: 0.5
          - id: version-wrong-rank
            phrase: the distractor wins one to zero.
            targets:
              - embedding-contract-mechanism
            color: yellow
            linger: 0.5
          - id: version-passages-rotate
            phrase: Rotate both passages by that same quarter turn;
            targets:
              - embedding-contract-mechanism
            color: yellow
            linger: 0.5
          - id: version-fixed-rank
            phrase: the target wins one to zero again.
            targets:
              - embedding-contract-mechanism
            color: yellow
            linger: 0.5
  - id: ivf-border
    title: A nearby center can hide the nearest record
    visual: An explicit one-dimensional Euclidean border example changes probes on the same centers, query and
      records.
    beats:
      - say: An exact search is the reference for approximate-neighbor recall. One million vectors with three hundred
          eighty-four float32 coordinates use one point five three six decimal gigabytes for raw values alone.
          An exact scan compares the query with every vector. An inverted-file index trains cluster centers,
          assigns each vector to a center’s list, then scans selected lists at query time. Index metadata, IDs
          and other storage add memory beyond the raw values.
        hold: 1
      - say: Use a separate one-dimensional Euclidean toy with centers zero and ten, a query at four point nine, and
          records at four and five point one. The nearest center is zero, so one probe searches the left list
          and finds record four at distance point nine. But the true nearest record, five point one at
          distance point two, belongs to the right center. Predict which knob can recover it without moving
          any vector. Search both lists. More probes expose the missing record in this fixture.
        hold: 1
        visual_cues:
          - id: ivf-one
            phrase: finds record four at distance point nine
            targets:
              - ivf-border-mechanism
            color: yellow
          - id: ivf-both
            phrase: Search both lists
            targets:
              - ivf-border-mechanism
            color: yellow
      - say: "For a planning example with one million vectors, one thousand centers and roughly one thousand vectors
          per list, ten probes score about one thousand centers plus ten thousand records: eleven thousand
          comparisons. Twenty probes cost about twenty-one thousand. That is arithmetic work, not a latency
          benchmark or a promised recall improvement. Changing the number of lists requires rebuilding;
          changing query probes searches more of the existing index. Compare the returned top k with exact top
          k under the same metric, permissions and tie policy."
        hold: 1
        visual_cues:
          - id: ivf-work
            phrase: Twenty probes cost about twenty-one thousand
            targets:
              - ivf-border-mechanism
            color: yellow
  - id: hnsw-walk
    title: Keep a route out of the local neighborhood
    visual: A layered graph descends toward the query and expands a wider lower-level candidate frontier to reach
      a bridge.
    beats:
      - say: HNSW builds a hierarchy of proximity graphs. Sparse upper layers supply longer jumps, and lower layers
          refine the neighborhood; the bottom layer contains every indexed vector. A greedy upper-layer walk
          descends when it cannot improve there. At the lower search layer, maintain candidate and best-found
          sets rather than treating every local dead end as proof of the global nearest neighbor.
        hold: 1
      - say: Use a separate one-dimensional Euclidean lower-layer toy. The query is ten. Points S, A, B, D and C sit
          at zero, seven, eight, three and ten. Undirected edges connect S to A, S to D, A to B, and D to C.
          Enter at S, expand the nearest pending point, and retain the best ef discovered points. Stop when
          the nearest pending distance exceeds the worst retained distance. With ef one, S leads through A to
          B, discarding the worse bridge D; B remains distance two from the query. With ef three, D stays
          available and exposes C at distance zero. This illustrates a bounded lower-layer exploration
          contract, not every detail of an HNSW implementation. In pgvector, ef search controls the dynamic
          search candidate list, while m and ef construction shape the built graph. IVF probes controls lists.
          These query knobs affect different mechanisms.
        hold: 1
        visual_cues:
          - id: hnsw-narrow
            phrase: With ef one, S leads through A to B, discarding the worse bridge D
            targets:
              - hnsw-walk-mechanism
            color: yellow
          - id: hnsw-wide
            phrase: With ef three, D stays available and exposes C at distance zero
            targets:
              - hnsw-walk-mechanism
            color: yellow
      - say: HNSW generally trades additional graph memory and slower construction for a useful speed-recall curve;
          IVF needs trained centers and uses list-based search. Measure build time, insert behavior, memory
          and representative query work on your corpus. Product quantization can trade vector fidelity for
          shorter codes, and disk-based indexes make another storage choice. Keep an exact baseline. Report
          approximate-neighbor recall separately from human relevance recall, and measure after filtering. A
          fast search over the wrong model space is still wrong.
        hold: 1
  - id: weighted-fusion
    title: A coefficient does not fix unrelated units
    visual: Two lane-score rulers are rescaled before the same convex mixture, with a zero-spread and
      missing-score counterexample.
    beats:
      - say: Weighted score fusion is another hypothesis to test. With normalized dense score point eight and lexical
          score point two, a dense weight point seven gives point six two. Raw cosine and BM25 live on
          different scales. A coefficient of point seven does not mean the dense lane decides seventy percent
          of pairwise orderings; those depend on weighted score differences.
        hold: 1
        visual_cues:
          - id: weighted-terms
            phrase: a dense weight point seven
            targets:
              - weighted-fusion-mechanism
            color: yellow
          - id: weighted-answer
            phrase: gives point six two
            targets:
              - weighted-fusion-mechanism
            color: yellow
      - say: Min-max normalization subtracts the observed minimum and divides by the observed range. An extreme
          maximum can squeeze the other differences. A deeper candidate pool can change either endpoint. Equal
          scores produce a zero denominator and need an explicit policy; assigning zeros to a constant lane is
          one convention. A sigmoid bounds scores while a z score need not. None of these transformations
          alone creates calibrated relevance probabilities.
        hold: 1
        visual_cues:
          - id: minmax-outlier
            phrase: An extreme maximum can squeeze the other differences
            targets:
              - weighted-fusion-mechanism
            color: yellow
          - id: constant-lane
            phrase: Equal scores produce a zero denominator
            targets:
              - weighted-fusion-mechanism
            color: yellow
      - say: A candidate absent from a truncated lane has an unknown score there, not necessarily zero. Rescore the
          union or evaluate your missing-score convention. Fit normalization and weights on development data,
          then compare the frozen rule with RRF on held-out query families. The tuned convex-combination paper
          reports gains in its experiments; it does not select our production rule. RRF itself still needs
          tested depths, smoothing and final selection.
        hold: 1
        visual_cues:
          - id: rescore-union
            phrase: Rescore the union or evaluate your missing-score convention
            targets:
              - weighted-fusion-mechanism
            color: yellow
  - id: mmr-choice
    title: Removing repetition can add irrelevant evidence
    visual: A selected source stays fixed while relevance and redundancy terms compete for the second context slot.
    beats:
      - say: Maximal marginal relevance selects one candidate at a time. For each remaining candidate, take lambda
          times query similarity minus one minus lambda times its maximum similarity to an already selected
          passage. With an empty selected set this implementation uses zero redundancy. Lambda one removes the
          diversity penalty. Lambda zero starts with an identifier tie-break under that empty-set convention.
        hold: 1
      - say: Consider a supplied selected key rule. A near-copy has query similarity point eight nine and similarity
          point nine seven to that selected rule. An unrelated session rule has query similarity point six
          five and redundancy point two. At lambda one half, the near-copy scores minus point zero four, while
          the session rule scores point two two five. The session rule fills the second slot. It is less
          redundant and still does not answer this narrow key question.
        hold: 1
        visual_cues:
          - id: mmr-terms
            phrase: At lambda one half
            targets:
              - mmr-choice-mechanism
            color: yellow
          - id: mmr-answer
            phrase: the near-copy scores minus point zero four, while the session rule scores point two two five
            targets:
              - mmr-choice-mechanism
            color: yellow
      - say: The article’s vector example even selects an unofficial near-copy first because it is slightly closer to
          the query than the governing source. Novelty does not establish authority or completeness. For a
          narrow question, deduplicate by trusted source or verified equal content and leave an unused slot
          when appropriate. For a multi-policy question, test whether every required condition survives. MMR
          only selects from its supplied pool; it cannot recover a missing passage or grant access.
        hold: 1
  - id: latency-contract
    title: The request owns one deadline
    visual: Authorization, parallel lanes and fusion accumulate along a shared clock; a lane timeout differs from
      a valid empty list.
    beats:
      - say: Give lane depth, retained fused candidate count, reranker input size and final context count separate
          names. More input candidates cannot rescue a target already discarded from a complete union unless
          the later retention or ordering changes. An empty lexical list is valid for a vocabulary gap. A
          lexical timeout is a degraded retrieval mode. Record which lane completed and evaluate the fallback
          instead of reporting an outage as an ordinary empty answer.
        hold: 1
        visual_cues:
          - id: lane-timeout
            phrase: A lexical timeout is a degraded retrieval mode
            targets:
              - latency-contract-mechanism
            color: yellow
      - say: Use one wall clock. Authorization takes ten milliseconds, parallel lanes take twelve and forty, and
          fusion takes eight. The critical path is ten plus forty plus eight, or fifty-eight milliseconds,
          before extra overhead. It misses a fifty-millisecond request budget even if every stage meets its
          local limit. Per-stage p ninety-five values do not add into the request’s p ninety-five. A telemetry
          checker observes supplied timings after the fact; a live endpoint needs actual deadlines and
          cancellation.
        hold: 1
        visual_cues:
          - id: request-clock
            phrase: Authorization takes ten milliseconds, parallel lanes take twelve and forty, and fusion takes eight
            targets:
              - latency-contract-mechanism
            color: yellow
          - id: deadline-result
            phrase: fifty-eight milliseconds
            targets:
              - latency-contract-mechanism
            color: yellow
      - say: Keep IDs, ranks, lane and index versions, effective date, grant revision, budgets and timing in an
          access-controlled trace. IDs themselves can be sensitive. Recheck permission at passage fetch and on
          cached results after revocation. Compare exact codes, paraphrases, near-matches, no-answer cases and
          denied requests on the same frozen corpus and caller grants. With one relevant passage, hit rate and
          recall agree; with several, one hit need not recover all required evidence. Retrieval recall does
          not establish answer faithfulness.
        hold: 1
  - id: policy-transfer
    title: Repair the stage that lost the required evidence
    visual: A fresh exact-code query survives retrieval but drops at fusion; the same target crosses a deeper
      candidate cutoff before reranking.
    beats:
      - say: Try a fresh stress case with smoothing constant ten. The required policy ranks first in one lane and is
          absent from the other; a distractor is third in both. Predict which fused score wins. The required
          policy gets one eleventh, about point zero nine one. The distractor gets two thirteenths, about
          point one five four, and wins. Consensus can still bury the required policy after changing the
          constant.
        hold: 1
        visual_cues:
          - id: transfer-fusion
            phrase: The required policy gets one eleventh, about point zero nine one. The distractor gets two thirteenths,
              about point one five four, and wins
            targets:
              - policy-transfer-mechanism
            color: yellow
      - say: If the target is absent from both lanes, inspect analysis, encoder inputs, indexing or lane depth. If it
          reaches the union but falls below the fused cutoff, retain a broader pool or improve the ordering.
          If it is already retained beside irrelevant passages, evaluate reranking or rejection. Hold the
          corpus, grants and other settings fixed while changing one cause. Passing a small regression fixture
          establishes those cases; a release claim needs representative held-out relevance, exclusion,
          abstention and latency evidence.
        hold: 1
        visual_cues:
          - id: transfer-retain
            phrase: retain a broader pool or improve the ordering
            targets:
              - policy-transfer-mechanism
            color: yellow
          - id: transfer-order
            phrase: If it reaches the union but falls below the fused cutoff
            targets:
              - policy-transfer-mechanism
            color: yellow
