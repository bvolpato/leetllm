    beats:
      - say: >-
          Follow these three entries back to memory. All three point to one number, twice x.
          Expanding a size-one dimension gives the view a stride of zero. Moving to the next entry moves
          zero slots in memory. PyTorch rejects an in-place addition across the view because it would
          write to the same slot three times.
        hold: 0.65
        visual_cues:
          - id: expanded-storage-b1
            phrase: Follow these three entries back to memory
            targets:
              - expanded-storage-mechanism
            color: cyan
            linger: 0.6
      - say: >-
          Clone the view. Now each entry has its own writable slot. Sum the three copies of twice x.
          Each sends two back to x, so its gradient is six. With k copies, the gradient is twice k.
        hold: 0.8
        caption_starts: [Each sends two back to x]
        visual_cues:
          - id: expanded-storage-b2
            phrase: Clone the view
            targets:
              - expanded-storage-mechanism
            color: cyan
            linger: 0.6
          - id: cloned-gradient
            phrase: its gradient is six
            targets: [storage-contract]
            color: pink
  - id: nonlinear-forward
    title: "Carry one request through a hidden unit"
    visual: >-
      Retain each hidden value as the request moves forward. On the return trip expose one local signal at
      a time, with the output and input weight products beside the relevant branches.
    beats:
      - say: >-
          Double the input, then halve the result. Trace the output against the input. Stacking only linear
          maps still gives one linear map. Multiplying by W one and then W two is multiplying by their product.
          Add a bias of one half. The whole line shifts. Clip its negative part at zero. Now the output stays
          flat up to minus a half. That bend is a ReLU. Add a second unit that turns on at plus a half. Past
          that point both units are climbing, so their sum climbs twice as fast.
        hold: 0.9
        visual_cues:
          - id: nonlinear-forward-b1
            phrase: "Stacking only linear maps still gives one linear map: multiplying by W one and then W two is
              multiplying by their product."
            targets:
              - nonlinear-forward-mechanism
            color: cyan
            linger: 0.6
          - id: hidden-affine-shift
            phrase: "Add a bias of one half"
            targets: [nonlinear-forward-mechanism]
            color: cyan
          - id: hidden-first-hinge
            phrase: "Clip its negative part at zero"
            targets: [nonlinear-forward-mechanism]
            color: cyan
          - id: hidden-second-hinge
            phrase: "Add a second unit that turns on at plus a half"
            targets: [nonlinear-forward-mechanism]
            color: cyan
      - say: Follow a two-block request through one hidden unit. Input two passes through first weight one point five and bias
          minus one, giving h two. ReLU passes two. Output weight two and bias one half give prediction four
          point five against target five, so squared loss is one quarter.
        hold: 0.65
        visual_cues:
          - id: nonlinear-forward-b2
            phrase: Follow a two-block request through one hidden unit
            targets:
              - nonlinear-forward-mechanism
            color: cyan
            linger: 0.6
          - id: hidden-h
            phrase: Input two passes through first weight one point five and bias minus one, giving h two.
            targets:
              - hidden-values
            color: yellow
            linger: 0.45
          - id: hidden-z
            phrase: ReLU passes two.
            targets:
              - hidden-values
            color: yellow
            linger: 0.45
          - id: hidden-prediction
            phrase: Output weight two and bias one half give prediction four point five
            targets:
              - hidden-values
            color: yellow
            linger: 0.45
          - id: hidden-loss
            phrase: squared loss is one quarter.
            targets:
              - hidden-values
            color: yellow
            linger: 0.45
      - say: >-
          Backward begins with prediction sensitivity minus one. Start at the output end. Its weight
          multiplies the saved activation, two. Its bias just adds. The output weight receives minus two and
          its bias minus one. Carry the signal through the output weight and then through the open gate. The
          hidden signal is minus two. Its input weight receives minus four and hidden bias minus two. That
          first weight picks up a second factor of two from the input. All four entries came from one backward
          pass, the method popularized for neural networks in nineteen eighty-six.
        hold: 0.95
        visual_cues:
          - id: nonlinear-forward-b3
            phrase: Backward begins with prediction sensitivity minus one.
            targets:
              - nonlinear-forward-mechanism
            color: cyan
            linger: 0.6
          - id: hidden-output-pair
            phrase: "The output weight receives minus two"
            targets:
              - hidden-gradients
            color: pink
            linger: 0.35
            caption_boundary: true
          - id: hidden-gate-return
            phrase: "through the open gate"
            targets:
              - hidden-gradients
            color: pink
            linger: 0.35
            caption_boundary: true
          - id: hidden-reverse-values
            phrase: Its input weight receives minus four and hidden bias minus two.
            targets:
              - hidden-gradients
            color: yellow
            linger: 0.45
  - id: nonlinear-update
    title: "Where will the four weights take this request?"
    visual: >-
      Keep the original prediction and the target on a fixed seconds ruler. Replay each forward
      calculation from the same snapshot. Park the first landing while the second runs beneath it. Show
      each squared error after its gap can be inspected.
    beats:
      - say: >-
          Predict a step on those four knobs in the order first weight, hidden bias, output weight, output
          bias. All four gradients are negative. Subtracting them will raise all four settings. We’re half a
          second early. At a rate of point zero five, where do you expect the prediction to land?
        hold: 2.2
        visual_cues:
          - id: nonlinear-update-b1
            phrase: Predict a step on those four knobs in the order first weight, hidden bias, output weight, output bias.
            targets:
              - nonlinear-update-mechanism
            color: cyan
            linger: 0.6
      - say: >-
          New knobs are one point seven, minus point nine, two point one and point five five. Recompute every
          stage. Watch the dot leave four and a half. The hidden unit passes two and a half now. Look at the
          distance back to five. Would you keep this step?
        hold: 2
        visual_cues:
          - id: hidden-update-knobs
            phrase: New knobs are one point seven, minus point nine, two point one and point five five.
            targets:
              - hidden-weights
            color: yellow
            linger: 0.45
          - id: nonlinear-update-b2
            phrase: Recompute every stage.
            targets:
              - hidden-values
            color: cyan
            linger: 0.6
      - say: >-
          We went from half a second early to eight tenths late. Squaring that miss, loss becomes point six
          four. The negative gradient initially moved the prediction toward five seconds. This step carried it
          past the target and increased the loss.
        hold: 1
        visual_cues:
          - id: hidden-overshoot-result
            phrase: loss becomes point six four
            caption_boundary: true
            targets:
              - hidden-values
            color: yellow
            linger: 0.45
      - say: >-
          Restore the original snapshot and halve only the rate to point zero two five. New knobs are one
          point six, minus point nine five, two point zero five and point five two five. Follow the second dot
          from the same starting mark. The hidden value is two and a quarter. Which landing is closer?
        hold: 2
        visual_cues:
          - id: nonlinear-update-b3
            phrase: Restore the original snapshot and halve only the rate to point zero two five.
            targets:
              - nonlinear-update-mechanism
            color: cyan
            linger: 0.6
          - id: hidden-repair-knobs
            phrase: New knobs are one point six, minus point nine five, two point zero five and point five two five.
            targets:
              - hidden-weights
            color: yellow
            linger: 0.45
          - id: hidden-replay-half
            phrase: "Follow the second dot from the same starting mark"
            targets:
              - hidden-values
            color: blue
            linger: 0.35
            caption_boundary: true
      - say: >-
          Both dots crossed five. The lower one stopped nearer the target than it started. Its prediction is
          five point one three seven five, with squared loss point zero one eight nine zero six two five. I’d
          keep the shorter step for this request.
        hold: 1.1
        visual_cues:
          - id: hidden-repair-result
            phrase: squared loss point zero one eight nine zero six two five.
            caption_boundary: true
            targets:
              - hidden-values
            color: yellow
            linger: 0.45
  - id: deep-products
    title: A missing signal can have several causes
    visual: Change only the hidden bias to−4 in the reader network, then build explicit scalar derivative chains
      and a residual bypass.
    beats:
      - say: >-
          Now change only the original hidden bias to minus four. The input to the ReLU is minus one. Its output
          is zero, so the output bias alone sets the prediction at half a second. The loss is twenty point two
          five. Trace the returning signal. The output bias receives minus nine. At the gate, multiplying by
          zero cuts off the signal to the first weight and the hidden bias.
        hold: 0.65
        visual_cues:
          - id: deep-products-b1
            phrase: Now change only the original hidden bias to minus four.
            targets:
              - deep-products-mechanism
            color: cyan
            linger: 0.6
          - id: inactive-backward
            phrase: "Trace the returning signal"
            targets: [deep-products-mechanism]
            color: pink
      - say: >-
          If the input to a ReLU stays negative on every training example, that path contributes zero gradient
          to the parameters before the ReLU. A signal can also fade through a chain of nonzero derivatives.
          Multiply by one half ten times. A unit signal shrinks to one over one thousand twenty-four. On the
          other path each factor is two. Ten factors grow the signal to one thousand twenty-four. In a matrix
          network the effect also depends on direction.
        hold: 0.65
        visual_cues:
          - id: deep-products-b2
            phrase: "If the input to a ReLU stays negative on every training example"
            targets:
              - deep-products-mechanism
            color: cyan
            linger: 0.6
          - id: deep-chain
            phrase: "A signal can also fade through a chain of nonzero derivatives"
            targets: [deep-products-mechanism]
            color: cyan
          - id: deep-products-ten
            phrase: "Multiply by one half ten times"
            targets:
              - deep-products-mechanism
            color: yellow
            linger: 0.45
          - id: deep-double-ten
            phrase: "On the other path each factor is two. Ten factors grow the signal"
            targets: [deep-products-mechanism]
            color: pink
      - say: >-
          A residual addition gives the signal a direct path with slope one. At the input, that signal
          adds to the one returning through the branch. Normalization adjusts the scale of the activations.
          Low-precision arithmetic can round a small gradient to zero. Backward reuses forward values
          such as the hidden activation. Saving them costs memory. Recomputing them costs time.
        hold: 0.8
        visual_cues:
          - id: deep-products-b3
            phrase: A residual addition gives the signal a direct path
            targets:
              - deep-products-mechanism
            color: cyan
            linger: 0.6
