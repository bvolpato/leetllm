            targets:
              - vector-seed-mechanism
            color: cyan
            linger: 0.6
      - say: >-
          The queue terms cancel. The two extra blocks account for the whole gap, two point six seconds.
          To send that difference backward, start the first prediction at minus one and the second at
          plus one. These starting signals are the backward seed. Three blocks minus one gives the
          prompt-weight sensitivity, two. Half a second minus half a second gives the queue-weight sensitivity, zero.
