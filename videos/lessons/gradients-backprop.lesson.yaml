scenes:
  - id: subject-intro
    title: "Two blocks, one weight"
    visual: >-
      Cut into the second predicted block as it approaches the observed five-second finish. Color the
      part that runs past the stop, then label the miss when the block ends. Keep the observed finish
      fixed as one turn shortens both blocks. Reset to three and try a smaller turn.
    beats:
      - say: >-
          This request took five seconds. The model predicted six. It gave the first hundred tokens three
          seconds and the next hundred another three. One weight sets the width of both blocks. Which way
          would you turn it?
        hold: 2.2
        caption_starts: [The model predicted six, It gave the first hundred tokens, One weight sets the width]
        visual_cues:
          - id: intro-question
            phrase: Which way would you turn it
            targets:
              - intro-dial
              - wrong-prediction
              - prediction-gap
            color: pink
            linger: 0.35
          - id: intro-first-block
            phrase: "the first hundred tokens three seconds"
            targets: [first-prompt-block]
            color: cyan
          - id: intro-second-block
            phrase: "the next hundred another three"
            targets: [second-prompt-block]
            color: cyan
      - say: >-
          Turn it down a tenth. Both blocks get shorter. The join moves a tenth of a second. The end moves
          twice as far, two tenths. Put the weight back at three. If we take off one hundredth per block,
          how far will the end move?
        hold: 2
        caption_starts: [The end moves twice as far, Put the weight back at three]
        visual_cues:
          - id: intro-turn
            phrase: "Turn it down a tenth"
            targets:
              - intro-dial
              - prompt-strip
            color: yellow
            linger: 0.35
            caption_boundary: true
          - id: intro-direction
            phrase: Both blocks get shorter
            targets:
              - intro-direction
            color: green
            linger: 0.35
          - id: intro-linkage
            phrase: twice as far
            targets:
              - intro-linkage
              - prompt-strip
            color: yellow
            linger: 0.35
          - id: intro-reset
            phrase: Put the weight back at three
            targets: [intro-dial, prompt-strip]
            color: yellow
      - say: >-
          Each block loses one hundredth of a second. Two hundredths altogether. The prediction
          is now five point nine eight. The next question is how to score that miss.
        hold: 0.65
        caption_starts: [Two hundredths altogether, The prediction is now five point nine eight]
        visual_cues:
          - id: intro-small-turn
            phrase: Each block loses one hundredth of a second
            targets: [intro-dial, prompt-strip]
            color: yellow
          - id: intro-small-result
            phrase: Two hundredths altogether
            targets: [latency-prediction, intro-linkage]
            color: cyan
            caption_boundary: true
          - id: intro-fine-prediction
            phrase: The prediction is now five point nine eight
            targets: [latency-prediction]
            color: cyan
          - id: intro-score
            phrase: how to score that miss
            targets:
              - loss-question
            color: yellow
            linger: 0.35
  - id: why-train
    title: "What does the miss cost?"
    visual: >-
      Reuse the two prompt strips on the same time ruler. Copy the length of the error into both sides of
      a square and compare the areas for a one-second miss, a two-second miss and the trial step.
    beats:
      - say: >-
          Roll back that last nudge. Let's score the miss we started with. Two blocks times three puts the
          prediction at six. The observed five stays fixed. We can measure the error as the distance between
          the two marks.
        hold: 0.6
        visual_cues:
          - id: rollback-small-nudge
            phrase: Roll back that last nudge
            targets: [adjustable-weight, latency-prediction]
            color: yellow
          - id: request-input-b1-1
            phrase: Two blocks times three puts the prediction at six
            targets:
              - request-input
              - prompt-strip
              - latency-prediction
            color: blue
            linger: 0.35
          - id: target-fixed
            phrase: observed five stays fixed
            targets:
              - latency-target
            color: green
            linger: 0.35
      - say: >-
          Square that gap. A miss of one second makes one square second of loss. A two-second miss doubles
          both sides of the square. Four of the old squares fit inside. A miss on the early side costs just as
          much as a late miss of the same size.
        hold: 0.8
        visual_cues:
          - id: squared-loss-b2-2
            phrase: Square that gap
            targets:
              - squared-loss
            color: yellow
            linger: 0.35
          - id: double-miss
            phrase: A two-second miss
            targets:
              - squared-loss
            color: blue
      - say: >-
          Back at three seconds per block, turn the weight down to two point nine again. This time watch the
          area. Each side measures eight tenths of a second, so the loss square shrinks to sixty-four
          hundredths. Now we can compare possible moves.
        hold: 0.8
        visual_cues:
          - id: trial-weight
            phrase: down to two point nine
            targets:
              - adjustable-weight
            color: yellow
            linger: 0.35
          - id: trial-gap
            phrase: loss square shrinks
            targets:
              - squared-loss
            color: green
            linger: 0.35
  - id: parameters-shape-loss
    title: One dial draws a loss curve
    visual: >-
      Measure the squared miss at individual weights, then sweep the same calculation over the interval. On
      the two-weight surface, follow two different weight pairs along its zero-loss floor.
    beats:
      - say: Hold this request fixed and sweep the weight dial. At two, the prediction is four and loss is one. At two
          point five, loss is zero. At three, it is one again.
        hold: 0.25
        visual_cues:
          - id: sample-curve
            phrase: sweep the weight dial
            targets:
              - curve-parameter
            color: yellow
            linger: 0.35
          - id: sample-mid
            phrase: At two point five
            targets:
              - curve-parameter
            color: green
            linger: 0.3
          - id: sample-three
            phrase: At three
            targets:
              - curve-parameter
            color: pink
            linger: 0.3
      - say: >-
          What happens between two and two and a half? Try two and a quarter. The model predicts four and a half
          seconds. Half a second early gives a loss of one quarter. Evaluate the same squared loss at the other
          weights. Plotting those losses traces the parabola.
        hold: 0.25
        caption_starts: [Try two and a quarter, four and a half seconds, Half a second early, one quarter, Evaluate the same squared loss]
        visual_cues:
          - id: loss-curve-b2-1
            phrase: "Evaluate the same squared loss at the other weights"
            targets:
              - loss-curve
            color: cyan
            linger: 0.35
          - id: quarter-sample
            phrase: "Try two and a quarter"
            targets: [curve-parameter]
            color: yellow
          - id: quarter-prediction
            phrase: "The model predicts four and a half seconds"
            targets: [quarter-score]
            color: cyan
          - id: quarter-loss
            phrase: "Half a second early gives a loss of one quarter"
            targets: [quarter-score]
            color: cyan
      - say: >-
          Two adjustable weights need two horizontal coordinates. For this request, two prompt blocks and one
          second queued, both marked settings predict five. Move between them. The bottom is a valley. Extra
          rows with the same feature ratio still measure only that same combination. To tell the weights apart,
          we need a different ratio.
        hold: 0.25
        visual_cues:
          - id: loss-surface-b2-2
            phrase: Two adjustable weights
            targets:
              - loss-surface
            color: blue
            linger: 0.35
          - id: valley-bottom
            phrase: bottom is a valley
            targets:
              - surface-parameter
            color: green
            linger: 0.35
  - id: probe-neighbor
    title: At weight 3.001, will loss rise or fall?
    visual: Keep the starting loss and the proposed weight visible. Trace the loss only as the weight moves,
      then use the horizontal and vertical changes to form the difference quotient.
    beats:
      - say: Back at weight three, predict what an upward nudge will do. We already predict too much time. Increasing
          the weight should therefore raise the loss. Now move it to three point zero zero one.
        hold: 0.55
        caption_starts: [raise the loss, Now move it]
        visual_cues:
          - id: probe-start
            phrase: Back at weight three
            targets: [original-weight]
            color: pink
          - id: nudged-weight-b1-1
            phrase: move it to three point zero zero one
            targets:
              - nudged-weight
            color: yellow
            linger: 0.35
      - say: The original loss is one. The new loss is a little above one, so the nudge moved uphill. The exact values
          are shown below the points; magnification lets us inspect that tiny change.
        hold: 0.8
        visual_cues:
          - id: original-weight-b2-1
            phrase: original loss is one
            targets:
              - original-weight
            color: pink
            linger: 0.35
          - id: nudge-receipt
            phrase: new loss
            targets:
              - nudged-weight
            color: yellow
            linger: 0.35
      - say: Divide the loss increase by the weight increase. The ratio is just above four. That positive slope tells
          us how rapidly loss rises when we turn the dial up.
        hold: 1
        caption_starts: [just above four]
        visual_cues:
          - id: finite-ratio-b3-1
            phrase: Divide the loss increase by the weight increase
            targets:
              - finite-ratio
            color: green
            linger: 0.35
          - id: finite-answer
            phrase: ratio is just above four
            targets:
              - finite-ratio
            color: green
            linger: 0.35
  - id: derivative-limit
    title: What survives as the nudge shrinks?
    visual: Keep the original point fixed while nonzero h contracts. Tie the secant excess to4h, show the inset
      window width, and withhold the tangent value until the final limit.
    beats:
      - say: That two-point slope is a finite difference. Bring the second point closer. The yellow secant turns
          toward a stable direction. What number do you think the slope is approaching?
        hold: 0.7
        visual_cues:
          - id: nearby-point-b1-1
            phrase: second point closer
            targets:
              - nearby-point
            color: yellow
            linger: 0.35
      - say: "Call the nudge h. The new error is one plus two h. Expand its square, subtract the old loss, and divide
          by h. The slope is four plus four h: a fixed part and a shrinking correction."
        hold: 0.25
        visual_cues:
          - id: finite-expression-b2-1
            phrase: four plus four h
            targets:
              - finite-expression
            color: yellow
            linger: 0.35
          - id: nudge-size-b2-2
            phrase: shrinking correction
            targets:
              - nudge-size
            color: yellow
            linger: 0.35
      - say: As h approaches zero, four h disappears. The secant approaches the tangent, whose slope is four. This
          limit is the derivative; every nudge we divide by remains nonzero.
        hold: 0.25
        visual_cues:
          - id: secant-line-b3-1
            phrase: secant approaches the tangent
            targets:
              - secant-line
            color: green
            linger: 0.35
          - id: limiting-slope-b3-2
            phrase: slope is four
            targets:
              - limiting-slope
            color: green
            linger: 0.35
  - id: gradient-vector
    title: Two dials, two separate questions
    visual: First probe the prompt weight with queue weight held fixed, then probe queue with prompt held fixed.
      Convert the two measured sensitivities into vector components only after both probes.
    beats:
      - say: Now split the prediction into prompt work and queue delay, with weights two and two. Turn only the prompt
          dial. A nudge of one hundredth raises loss by about four hundredths. Its local sensitivity is four.
        hold: 0.25
        motion_check:
          region:
            - 500
            - 520
            - 900
            - 60
          minimumChangedFraction: 0.002
        visual_cues:
          - id: prompt-probe
            phrase: Turn only the prompt dial
            targets:
              - coordinate-probe
            color: blue
            linger: 0.35
          - id: partial-sensitivity
            phrase: sensitivity is four
            targets:
              - prompt-partial
            color: blue
            linger: 0.35
      - say: "Reset the prompt dial and turn only the queue dial. The same nudge raises loss by about two hundredths.
          Its sensitivity is two. These are partial derivatives: each question freezes the other weight."
        hold: 0.25
        visual_cues:
          - id: queue-probe
            phrase: turn only the queue dial
            targets:
              - coordinate-probe
            color: cyan
            linger: 0.35
          - id: queue-partial-cue
            phrase: sensitivity is two
            targets:
              - queue-partial
            color: cyan
            linger: 0.35
      - say: Collect the slopes in parameter order. Four along the prompt coordinate, two along the queue coordinate.
          Their combined arrow is the gradient, four comma two. These components record sensitivity. The
          learning rate will scale their update.
        hold: 0.25
        visual_cues:
          - id: prompt-slope
            phrase: Four along the prompt coordinate
            targets:
              - prompt-partial
              - prompt-component
            color: blue
            linger: 0.35
          - id: queue-slope
            phrase: two along the queue coordinate
            targets:
              - queue-partial
              - queue-component
            color: cyan
            linger: 0.35
          - id: combine-gradient
            phrase: combined arrow is the gradient
            targets:
              - combined-gradient
            color: yellow
            linger: 0.35
  - id: gradient-geometry
    title: Read a contour like a map
    visual: Trace exact equal-loss lines, identify the zero-loss valley and initial loss1 contour, grow the normal
      gradient, then retain the initial point while reversing a scaled copy downhill.
    beats:
      - say: Look down on that valley as if it were a contour map. Every point on one line has the same loss. Our
          current weights, two and two, lie on the line with loss one.
        hold: 0.25
        visual_cues:
          - id: equal-loss
            phrase: same loss
            targets:
              - loss-contours
            color: cyan
            linger: 0.35
          - id: coordinate-sensitivity
            phrase: weights, two and two
            targets:
              - parameter-axes
            color: blue
            linger: 0.35
      - say: The gradient combines both uphill sensitivities. In these ordinary coordinates, it points toward the
          steepest local increase and crosses the contour at a right angle.
        hold: 0.25
        visual_cues:
          - id: assemble-direction
            phrase: combines both uphill sensitivities
            targets:
              - uphill-gradient
            color: yellow
            linger: 0.35
          - id: normal-direction
            phrase: a right angle
            targets:
              - contour-normal
            color: cyan
            linger: 0.35
      - say: "Reverse a scaled copy and travel downhill. Here a step of zero point zero eight moves the weights to one
          point six eight and one point eight four. Recompute the loss: zero point zero four."
        hold: 0.25
        visual_cues:
          - id: reverse-gradient
            phrase: travel downhill
            targets:
              - downhill-update
            color: green
            linger: 0.35
          - id: prompt-moves-more
            phrase: Recompute the loss
            targets:
              - updated-loss
            color: green
            linger: 0.35
  - id: update-step
    title: Choose the distance yourself
    visual: >-
      Hold the starting point on the curve while the viewer predicts the update. Move to 2.6, then show the
      prediction of 5.2 seconds and the loss of 0.04. Keep that result visible while the viewer tries a
      rate of one from the original weight.
    beats:
      - say: Return to the single weight at three. Its gradient is positive four. With learning rate one tenth, what
          number should we subtract? Work it out before the point moves.
        hold: 0.9
        visual_cues:
          - id: descent-equation-b1-1
            phrase: what number should we subtract
            targets:
              - descent-equation
            color: green
            linger: 0.35
      - say: "One tenth times four is zero point four. Subtract it: three becomes two point six. The minus sign
          reverses the uphill gradient; the learning rate chooses the distance."
        hold: 0.25
        motion_check:
          region:
            - 550
            - 630
            - 390
            - 150
          minimumChangedFraction: 0.002
        visual_cues:
          - id: updated-weight-b2-1
            phrase: three becomes two point six
            targets:
              - updated-weight
            color: green
            linger: 0.35
      - say: Run the model again. Two point six times two predicts five point two seconds. Squaring the remaining zero
          point two gap gives loss zero point zero four. The measured improvement is our receipt for this
          step.
        hold: 0.25
        visual_cues:
          - id: downhill-path-b3-1
            phrase: Run the model again
            targets:
              - downhill-path
            color: green
            linger: 0.35
          - id: descent-calculation-b3-2
            phrase: loss zero point zero four
            targets:
              - update-receipt
            color: green
            linger: 0.35
      - say: >-
          One tenth worked. Start back at three with the same gradient, but try a learning rate of one.
          Will its new loss be smaller than one?
        hold: 2.4
        visual_cues:
          - id: step-choice-0-b1-1
            phrase: One tenth
            targets:
              - update-receipt
            color: yellow
            linger: 0.35
          - id: rate-one-question
            phrase: a learning rate of one
            targets: [next-rate]
            color: yellow
  - id: step-size-limits
    title: "Where will the longer step land?"
    visual: >-
      Keep the small step on the curve. Start the longer step at the original weight, compare both
      landings, then add the exact fit to the same curve and its close-up.
    beats:
      - say: >-
          Subtract four from three. The weight lands at minus one. Follow the curve up from that weight. We
          started by heading downhill and ended with loss forty-nine. The step carried us past the target and
          farther away than we started. Look inside the close-up. The bottom is half a weight unit from
          our starting weight. What rate times four would take us just that far?
        hold: 2.25
        visual_cues:
          - id: step-choice-2-b1-2
            phrase: lands at minus one
            targets:
              - step-choice-2
            color: red
            linger: 0.35
            caption_boundary: true
          - id: step-overshoot-loss
            phrase: ended with loss forty-nine
            targets: [overshoot-loss]
            color: red
          - id: exact-rate-question
            phrase: What rate times four
            targets: [exact-rate]
            color: yellow
      - say: >-
          One eighth lands exactly at the bottom. One eighth times four is one half. Subtract that from
          three and the weight is two and a half. Two blocks at that weight take five seconds, exactly
          what we observed.
        hold: 0.8
        visual_cues:
          - id: step-choice-1-b2-1
            phrase: lands exactly at the bottom
            targets:
              - step-choice-1
            color: green
            linger: 0.35
      - say: >-
          Watch the tangent change along the route. We measured the slope at three. Once we leave three, the
          curve can turn. Run the prediction again to find out what a finite step bought us.
        hold: 0.65
        visual_cues:
          - id: changing-tangent-b3-1
            phrase: tangent change
            targets:
              - changing-tangent
            color: blue
            linger: 0.35
  - id: stable-scale
    title: "What happens on the next step?"
    visual: >-
      Trace six updates at each fixed rate. Use one vertical scale for signed displacement so crossing
      zero and growing in magnitude can be judged separately. Then change from blocks to raw tokens.
    beats:
      - say: >-
          Measure the offset from the optimum, two point five. Right counts positive and left counts
          negative. Each update multiplies that offset by one minus eight times the learning rate.
          At one tenth, distance shrinks by a factor of one fifth and loss by
          one twenty-fifth. At one quarter, the weight changes sides and comes back just as far away. Try
          point two six. Now the peaks grow. Convergence from this start requires a positive rate strictly
          below one quarter.
        hold: 0.8
        visual_cues:
          - id: stable-scale-b1
            phrase: Each update multiplies that offset
            targets:
              - stable-scale-mechanism
            color: cyan
            linger: 0.6
          - id: stable-iterate
            phrase: At one tenth, distance shrinks by a factor of one fifth and loss by one twenty-fifth.
            targets:
              - stable-scale-mechanism
            color: yellow
            linger: 0.45
          - id: stable-boundary
            phrase: "At one quarter"
            targets:
              - stable-scale-mechanism
            color: yellow
            linger: 0.35
            caption_boundary: true
          - id: stable-outside
            phrase: "Try point two six"
            targets:
              - stable-scale-mechanism
            color: pink
            linger: 0.35
            caption_boundary: true
      - say: >-
          With one fixed, nonzero input x and squared error, each update multiplies the signed offset by
          one minus two times x squared times the learning rate. For the distance to shrink, that multiplier
          must lie strictly between minus one and one. In exact arithmetic, that gives a learning rate above
          zero and below one divided by x squared.
        hold: 0.65
        visual_cues:
          - id: stable-scale-b2
            phrase: each update multiplies the signed offset
            targets:
              - stable-scale-mechanism
            color: cyan
            linger: 0.6
      - say: >-
          Now count raw tokens. It is still the same two-hundred-token request. Two hundred times three
          hundredths predicts the same six seconds. Its gradient becomes four hundred. The stable upper bound
          becomes zero point zero zero zero zero two five, ten thousand times smaller. Changing units changed
          the gradient without changing what the feature tells us. When training diverges, check the rate and
          verify that the inputs and loss are finite.
        hold: 0.85
        visual_cues:
          - id: stable-scale-b3
            phrase: Now count raw tokens.
            targets:
              - stable-scale-mechanism
            color: cyan
            linger: 0.6
          - id: units-gradient
            phrase: Its gradient becomes four hundred.
            targets:
              - units-gradients
            color: yellow
            linger: 0.45
          - id: units-bound
            phrase: The stable upper bound becomes zero point zero zero zero zero two five
            targets:
              - units-gradients
            color: yellow
            linger: 0.45
  - id: forward-graph
    title: Break the calculation into small jobs
    visual: Construct product4 and product2, prediction6, fixed target5, error1, loss1 in dependency order. Keep
      forward receipts for the backward rules.
    beats:
      - say: Instead of nudging each weight, break our predictor into small operations. Record each operation's
          inputs for the backward pass.
        hold: 0.25
        visual_cues:
          - id: graph-node-6-b1-1
            phrase: small operations
            targets:
              - graph-node-6
            color: green
            linger: 0.35
      - say: The prompt branch produces four, and the queue branch produces two. Add them to get six. Subtract the
          fixed target, five, to get error one. Square it to get loss one.
        hold: 0.25
        visual_cues:
          - id: graph-node-4-b2-1
            phrase: prompt branch produces four
            targets:
              - graph-node-4
            color: blue
            linger: 0.35
          - id: graph-node-6-b2-2
            phrase: get six
            targets:
              - graph-node-6
            color: green
            linger: 0.35
          - id: graph-target-cue
            phrase: fixed target, five
            targets:
              - graph-target
            color: yellow
            linger: 0.35
          - id: graph-node-8-b2-3
            phrase: loss one
            targets:
              - graph-node-8
            color: pink
            linger: 0.35
          - id: graph-queue-cue
            phrase: queue branch produces two
            targets:
              - graph-node-5
            color: cyan
            linger: 0.35
          - id: graph-error-cue
            phrase: get error one
            targets:
              - graph-node-7
            color: yellow
            linger: 0.35
      - say: That is the forward pass. Keep its error and feature values. Those same numbers will supply each weight's
          sensitivity on the backward pass.
        hold: 0.25
        visual_cues:
          - id: graph-node-4-b3-1
            phrase: Keep its error and feature values
            targets:
              - graph-node-7
              - graph-node-1
              - graph-node-3
            color: yellow
            linger: 0.35
  - id: chain-rule
    title: Pass the sensitivity backward
    visual: Retain the complete forward graph. Carry sensitivity1 through square×2, subtraction×1 and both product
      factors, with each factor adjacent to its active path; end at gradients4and2.
    beats:
      - say: Start with sensitivity one at the loss. The square has local slope twice the error, so one becomes two.
          Subtracting a fixed target has slope one, so two passes through unchanged.
        hold: 0.25
        visual_cues:
          - id: graph-node-8-b1-1
            phrase: sensitivity one
            targets:
              - graph-node-8
            color: pink
            linger: 0.35
          - id: graph-node-7-b1-2
            phrase: twice the error
            targets:
              - graph-node-7
            color: yellow
            linger: 0.35
          - id: backward-subtraction
