            color: cyan
            linger: 0.35
            caption_boundary: true
      - say: >-
          Lower the queue weight. Half a second in the queue times a quarter takes off one eighth of a
          second. Request three is still late. The other three predictions cross zero and land slightly early.
          What if we turn the queue weight up instead?
