            color: cyan
            linger: 0.6
      - say: >-
          The last request pulls hardest on the prompt weight. Its error is minus ten seconds.
          Double that for the square, then multiply by its four prompt blocks. That gives minus eighty.
          Average the prompt column and you get minus
          thirty-six. Average the queue column and you get minus fourteen point seven five. In matrix form,
          multiply X transpose by the errors, then scale by two divided by four. Check that both gradients
          are finite. Apply a rate of point zero
          three to get our first pair of weights.
