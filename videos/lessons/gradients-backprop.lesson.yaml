    title: Choose the output combination before differentiating
    visual: Compare two predicted durations with the same queue contribution and different prompt lengths.
      Trace the difference and the sum of their sensitivity vectors.
    beats:
      - say: >-
          Both requests waited half a second in the queue. One prompt has a hundred tokens. The other
          has three hundred. How much extra time does the model predict for the longer prompt? Subtract
          the first prediction from the second. What happens to the queue term in that difference?
        hold: 1.8
