            phrase: "Average the prompt column and you get minus thirty-six"
            targets: [batch-gradient-result]
            color: pink
          - id: batch-queue-average
            phrase: "Average the queue column and you get minus fourteen point seven five"
            targets: [batch-gradient-result]
            color: pink
          - id: batch-first-step
            phrase: "Apply a rate of point zero three"
            targets:
              - batch-gradient-result
            color: yellow
            linger: 0.35
            caption_boundary: true
      - say: >-
          Run the same update on these four requests. After ten updates, mean squared loss has dropped
          below four thousandths. After one hundred updates, it's still above seven ten-thousandths.
          Notice how slowly the line falls now. The loop makes one last update. The weights are close to
          two and one. We can test them on fresh requests.
        hold: 0.7
        visual_cues:
          - id: batch-conditioning-b3
            phrase: "Run the same update on these four requests"
            targets:
              - batch-conditioning-mechanism
            color: cyan
            linger: 0.6
          - id: batch-history
            phrase: "Notice how slowly the line falls now"
            targets:
              - batch-conditioning-mechanism
            color: yellow
            linger: 0.45
          - id: batch-first-ten
            phrase: "After ten updates"
            targets: [batch-conditioning-mechanism]
            color: cyan
          - id: batch-next-ninety
            phrase: "After one hundred updates"
            targets: [batch-conditioning-mechanism]
            color: cyan
          - id: batch-last-update
            phrase: "one last update"
            targets: [batch-conditioning-mechanism]
            color: cyan
      - say: >-
          Why does progress slow? Start where all four predictions fit. Raise the prompt weight by a tenth.
          Look at request three. Three prompt blocks add three tenths of a second to its prediction. It
          spent half a second in the queue. If we turn the queue weight down a quarter, can that erase the miss?
        hold: 2.1
        caption_starts: [Look at request three, If we turn the queue weight down]
