          A scalar loss starts backward with a seed of one. With several outputs, choose a seed for each
          or combine them into a scalar first. The Jacobian has one row of slopes per output and one column
          per parameter. Backward combines those rows. With column vectors, it's J transpose times the seed.
          Backprop computes this vector-Jacobian product directly along the graph. Give both outputs a plus
          one and you differentiate their sum. Now the sensitivities are four and one.
