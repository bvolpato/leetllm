            color: cyan
            linger: 0.6
      - say: For positive h, ReLU has local derivative one. The arriving prediction signal two passes through the
          bend, then feature two gives prompt-weight gradient four. For negative h, the local derivative is
          zero, so that path contributes zero even when the loss is large.
