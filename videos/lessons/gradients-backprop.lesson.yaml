  - id: relu-gate
    title: A forward sign controls the returning derivative
    visual: Insert ReLU into the same prompt branch, retain pre-activation and upstream loss signal, then change
      only the prompt weight from2 to−.5.
    beats:
      - say: Insert a bend in the existing prompt branch. Multiply prompt weight by feature two to get h; ReLU returns
          the larger of zero and h, called z. Add the queue contribution two, then compare with target five.
          With prompt weight two, h and z are four, prediction is six, and loss is one.
