  - id: delta
    title: A weight update with a missing acknowledgment
    visual: The third byte of a four-byte host checkpoint changes from 3 to 8. A raw repeat toggles it back. A
      separate retry compares two hosts against one patch using both their version receipts and their bytes.
    beats:
      - say: The next transfer changes a single byte in this tiny checkpoint. The third byte is three in version
          eleven and eight in version twelve. XOR marks the bits that differ. Here its patch byte is eleven.
          Apply it once to three and the host gets eight. At model scale the compressed size depends on how
          many bytes change and how well the patch compresses.
        hold: 0.8
        visual_cues:
          - id: write-patch
            phrase: Apply it once to three and the host gets eight
            targets:
              - disk-hosts
            color: cyan
            linger: 0.22
      - say: Suppose the write succeeded and its acknowledgment got lost. Watch that same byte on an unguarded
          retry. Eight XOR eleven gives three again. The host has just undone a successful update.
        hold: 1
        visual_cues:
          - id: toggle-back
            phrase: Eight XOR eleven gives three again
            targets:
              - disk-hosts
            color: cyan
            linger: 0.22
      - say: Go back to the moment before the retry. Host A records version twelve and holds the target bytes. Host
          B holds bytes that look like the old weights, but its record says version ten. The patch declares
          eleven as its base. Which host should write this patch on retry?
        hold: 2.5
        visual_cues:
          - id: host-receipts
            phrase: Host B holds bytes that look like the old weights
            targets:
              - disk-hosts
            color: cyan
            linger: 0.22
      - say: Leave A alone. Its destination version and bytes agree. Hold B for repair. Its recorded base is wrong.
          Restore known complete weights before letting B serve. Persist the bytes and their version together,
          check each tensor, then verify which version each admitted engine loaded.
