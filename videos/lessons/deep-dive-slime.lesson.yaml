    title: A fresh tool call
    visual: A three-ID prompt stays outside a new response. Each event appends its token IDs, provenance, mask
      bits and log probabilities in one column. The viewer computes the negative mean before the answer
      appears.
    beats:
      - say: Try a fresh tool call with three prompt IDs. The model sends token twenty-one. The tool returns sixty
          and sixty-one. The model finishes with twenty-two and twenty-three. Each column records who supplied
          the token. You have five response positions. Using the log probabilities under them, what negative
          mean do the model’s targets give?
        hold: 2.4
        visual_cues:
          - id: append-call
            phrase: The model sends token twenty-one
            targets:
              - append-receipt
            color: cyan
            linger: 0.22
          - id: append-observation
            phrase: The tool returns sixty and sixty-one
            targets:
              - append-receipt
            color: cyan
            linger: 0.22
          - id: append-answer
            phrase: The model finishes with twenty-two and twenty-three
            targets:
              - append-receipt
            color: cyan
            linger: 0.22
      - say: Use the three model positions. Their negative log probabilities are point one, point four and point
          seven. That’s one point two divided by three, or point four. The two tool positions stay available
          as input to the answer.
        hold: 0.8
        caption_starts: ["or point four."]
        visual_cues:
          - id: append-mean
            phrase: That’s one point two divided by three, or point four
            targets:
              - append-receipt
            color: cyan
            linger: 0.22
            caption_boundary: true
      - say: In the pinned Sample helper, append the IDs and update the response length together. Supply one sampled
          log probability per generated ID. For a tool event, the helper writes zero mask bits and zero
          placeholders. It rejects missing or mismatched sampled probabilities and rejects purported model
          probabilities on tool input. Keep the original events with the completion status and serving
          version.
        hold: 0.8
        visual_cues:
          - id: append-check
            phrase: Supply one sampled log probability per generated ID
            targets:
              - append-receipt
            color: cyan
            linger: 0.22
