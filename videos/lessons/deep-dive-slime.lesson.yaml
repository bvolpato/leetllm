scenes:
  - id: intro
    title: Which tokens should train on a passing patch?
    visual: Two IDs travel from a failing test into the response. The agent's patch adds two more.
      The clean grader awards one point. The IDs stay in place while the viewer inspects the loss mask.
    beats:
      - say: These two tokens came from the test tool. It got three where it expected seven. The agent changes
          the index to minus one. Its patch adds two more tokens. In a clean copy, the same test passes.
          The grader awards one point.
        hold: 0.7
        caption_starts: ["The agent changes the index", "In a clean copy", "The grader awards one point."]
        visual_cues:
          - id: tool-output
            phrase: These two tokens came from the test tool
            targets:
              - rollout-receipt
            color: cyan
            linger: 0.22
          - id: edit-index
            phrase: changes the index to minus one
            targets:
              - rollout-receipt
            color: cyan
            linger: 0.22
          - id: agent-patch
            phrase: Its patch adds two more tokens
            targets:
              - rollout-receipt
            color: cyan
            linger: 0.22
          - id: grade-patch
            phrase: the same test passes
            targets:
              - rollout-receipt
            color: cyan
            linger: 0.22
          - id: grade-score
            phrase: The grader awards one point
            targets:
              - rollout-receipt
            color: cyan
            linger: 0.22
      - say: Slime keeps the whole exchange. In these example IDs, blue marks what the model wrote.
          Yellow marks what the tool returned. Each one in the loss mask selects a target for training.
          Which ID has a one it should lose?
        hold: 2.5
        visual_cues:
          - id: inspect-mask
            phrase: Each one in the loss mask
            targets:
              - rollout-receipt
            color: cyan
            linger: 0.22
      - say: Fifty came from the tool. Set its mask to zero. That leaves four model targets. Both tool IDs stay in
          the sequence, and the patch still earns its point. If pass rate falls after training, this is one
          handoff you can check before changing the reward.
        hold: 1.1
        caption_starts: ["That leaves four model targets."]
        visual_cues:
          - id: locate-id
            phrase: Fifty came from the tool
            targets:
              - rollout-receipt
            color: cyan
            linger: 0.22
          - id: fix-mask
            phrase: Set its mask to zero
            targets:
              - rollout-receipt
            color: cyan
            linger: 0.22
            caption_boundary: true
  - id: incident-receipt
    title: What ID 13 could see
    visual: A bracket under the prefix reaches through both tool IDs and turns up toward ID 13. The same sampled
      response then travels from SGLang v11 to a Megatron actor on v12.
    beats:
      - say: Put your finger on thirteen, the first token of the patch. Look back along its input, all the way
          through fifty-one. Both tool tokens helped condition that prediction. Zeroing their target weights
          leaves that information available to the model.
        hold: 0.8
        visual_cues:
          - id: read-prefix
            phrase: Look back along its input, all the way through fifty-one
            targets:
              - rollout-receipt
            color: cyan
            linger: 0.22
      - say: SGLang sampled this response with version eleven. The sample waits in slime’s Data Buffer while the
          Megatron actor advances to twelve. Record eleven on the sample. That’s the policy whose choices
          you’re about to score. Ray places the two engines, and the application runs the tool and grader.
        hold: 0.9
        visual_cues:
          - id: actor-version
            phrase: the Megatron actor advances to twelve
            targets:
              - rollout-receipt
            color: cyan
            linger: 0.22
  - id: ledger
    title: The divisor on rollout 7
    visual: The same eight IDs stay fixed. Each response log probability appears under its mask bit. The
      selected entries feed the mean. A shortened mask leaves two visible holes.
    beats:
      - say: The two prompt IDs sit to the left of the response. Under each of the six response IDs, line up its
          mask and log probability. Those two zeros in the tool columns are placeholders. To average the
          model’s surprise, which positions supply the divisor?
        hold: 2.2
        visual_cues:
          - id: inspect-terms
            phrase: line up its mask and log probability
            targets:
              - rollout-receipt
            color: cyan
            linger: 0.22
      - say: Use the four selected positions. Their log probabilities sum to minus one point four. Negate the sum
          and divide by four. The negative mean is point three five. Keep the IDs SGLang actually sampled.
          Decoding text and tokenizing it again can change the sequence.
        hold: 0.8
        visual_cues:
          - id: loss-mean
            phrase: The negative mean is point three five
            targets:
              - rollout-receipt
            color: cyan
            linger: 0.22
            caption_boundary: true
      - say: Now the adapter drops the last two mask entries. The response still has six positions. Those holes
          leave the patch tokens without target weights. Hold this sample and recover the aligned mask before
          it reaches Megatron.
        hold: 0.9
        visual_cues:
          - id: short-mask
            phrase: the adapter drops the last two mask entries
            targets:
              - rollout-receipt
            color: cyan
            linger: 0.22
  - id: sample-checks
    title: Two adapters return a completed Sample
    visual: Two adapters return the same completed rollout with identical log probabilities and reward. The bit
      under tool ID 50 changes in B. The article’s structural check returns four and five. Their apparent
      negative means differ. Checking the producer picks the usable sample.
    beats:
      - say: Two adapters submit rollout seven. Both include a prompt, a six-position response, a finite reward and
          six aligned log probabilities. They differ by one bit. Run the article’s completed-only check on
          each sample. It returns four for A and five for B. It accepts both masks as binary and nonempty.
        hold: 0.9
        visual_cues:
          - id: run-count
            phrase: It returns four for A and five for B
            targets:
              - adapter-comparison
            color: cyan
            linger: 0.22
      - say: The selected log probabilities in each row still add up to minus one point four. Each adapter divides
          by its own selected count. A gives point three five. B gives point two eight. Which adapter would
          you trust with this update?
        hold: 2.3
        visual_cues:
          - id: compare-means
            phrase: B gives point two eight
            targets:
              - adapter-comparison
            color: cyan
            linger: 0.22
      - say: Use A. Compare the mask to the tool event that supplied fifty. B counted a zero placeholder as if the
          policy had sampled it. Its average fell without the model predicting any token better. A short
          array, a positive log probability, a nonzero masked placeholder or an aborted trajectory fails the
          article’s local check. The article tests nine such mutations. In a real workload, decide separately
          which truncations and recoverable failures to accept.
        hold: 1
        visual_cues:
          - id: test-producer
            phrase: B counted a zero placeholder as if the policy had sampled it
            targets:
              - adapter-comparison
            color: cyan
            linger: 0.22
            caption_boundary: true
          - id: mutations
            phrase: The article tests nine such mutations
            targets:
              - adapter-comparison
            color: cyan
            linger: 0.22
