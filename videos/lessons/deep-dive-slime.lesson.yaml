  - id: recovery
    title: Where the trainer restarts
    visual: Checkpoint 10 stays at a fixed notch. The trainer cursor crosses both retained batches, returns to
      the committed notch on failure, then crosses batches 11 and 12 again. The weight and velocity update at
      each arrival.
    beats:
      - say: At step ten, Megatron saves a checkpoint. Its weight is one and its velocity is zero. Batch eleven
          finishes with a gradient of point two. Batch twelve finishes with minus point five. The trainer
          crashes before it saves again. Both batches are on disk. Which batch should you feed the restarted
          trainer first?
        hold: 2.3
        visual_cues:
          - id: finish-eleven
            phrase: Batch eleven finishes with a gradient of point two
            targets:
              - checkpoint-track
            color: cyan
            linger: 0.22
          - id: finish-twelve
            phrase: Batch twelve finishes with minus point five
            targets:
              - checkpoint-track
            color: cyan
            linger: 0.22
          - id: trainer-fails
            phrase: The trainer crashes before it saves again
            targets:
              - checkpoint-track
            color: cyan
            linger: 0.22
      - say: Eleven. Restore the saved weight and velocity. In this example, each batch multiplies the previous
          velocity by point nine and adds its gradient. Subtract a tenth of the new velocity from the weight.
          Replay eleven to get weight point nine eight. Now twelve inherits that first velocity. Replay twelve
          to reach weight one point zero one two. Both steps are back in the model.
        hold: 0.9
        visual_cues:
