  - id: placement
    title: Colocation changes which memory lifetimes can overlap
    visual: Supplied train and inference allocations exceed a shared device when simultaneous. Colocated phases
      alternate; two independent 16-GiB device bars show 12-GiB training and 10-GiB inference in the decoupled
      topology. A shared illustrative interval shows actual simultaneous progress without claiming measured
      timing.
    beats:
      - say: >
          Ray placement determines where training and rollout may execute. In our supplied memory example, the
          two resident working sets exceed one device when combined. Colocation can reuse the same allocation
          only when the lifecycle makes enough space before the other side becomes active.
        hold: 0.6
        visual_cues:
          - id: placement-beat-1-focus-1
            phrase: Ray placement determines where training and rollout may execute
            targets:
              - placement-s-train-s-inference-s-live-s-capacity-train-inference-together-capac
            color: cyan
            linger: 0.65
      - say: >
          The colocated trace alternates training and inference residency. Offload and release events belong
          to that memory contract. Reserving the same GPU for two actors does not make their live tensors fit
          simultaneously. Track the actual resident bytes at each phase.
        hold: 0.6
        visual_cues:
          - id: placement-beat-2-focus-1
            phrase: The colocated trace alternates training and inference residency
            targets:
              - placement-id-resident-label-b-2-active-train-device-active-s-active-tolowercas
            color: cyan
            linger: 0.65
      - say: >
          Decouple the workers onto distinct device ranges. Their local memory gates now pass independently,
          and generation can overlap training. That introduces an explicit weight-transport boundary. Choose
          the topology together with its sync path, rather than assuming every transport works under every
          placement.
        hold: 0.6
        visual_cues:
          - id: placement-beat-3-focus-1
            phrase: Their local memory gates now pass independently, and generation can overlap training
            targets:
              - placement-train-device
              - placement-inference-device
            color: cyan
            linger: 0.65
          - id: placement-overlap
            phrase: generation can overlap training
            targets:
              - placement-concurrent-execution
            color: yellow
            linger: 0.65
  - id: bundle-map
    title: Follow allocated slots into actor and rollout ranges
    visual: Actual pinned placement arithmetic computes actor2nodes×2GPUs=4 and rollout6. Colocation shares six
      slots at offset0; decoupling creates10 with rollout offset4; external mode reserves only the actor
      range.
    beats:
      - say: Ray bundles in the pinned placement helper request one GPU and one CPU slot. The implementation discovers
          node and physical GPU identities, then reorders bundle indices consistently. The logical rank map
          and actual bundle indices must stay distinct in the run record; a launch file alone records intent.
        hold: 0.7
        visual_cues:
          - id: sl-bundle-map-b0-operation
            phrase: Ray bundles in the pinned placement helper request one GPU and one CPU slot. The implementation
              discovers node and physical GPU identities, then reorders bundle indices consistently. The
              logical rank map and actual bundle indices must stay distinct in the run record; a launch file
              alone records intent.
            targets:
              - sl-bundle-map-mechanism
