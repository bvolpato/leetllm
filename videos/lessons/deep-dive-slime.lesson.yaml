  - id: segments
    title: Where rollout 7 splits
    visual: Four fixed loss terms sit under the IDs that produced them. A divider moves from a two-and-two split
      to a one-and-three split. The shared count stays at four until a deliberately wrong reduction
      substitutes local counts.
    beats:
      - say: Come back to rollout seven. Keep just the four tokens the model wrote. Give them fixed loss terms of
          one, three, five and seven. The adapter puts two tokens in each segment. We want the mean for this
          one execution, so both segments divide by four. They contribute one and three. If segment A keeps
          only the first token, how much will A contribute?
        hold: 2.4
        visual_cues:
          - id: even-shares
            phrase: They contribute one and three
            targets:
              - segment-terms
            color: cyan
            linger: 0.22
          - id: predict-share
            phrase: If segment A keeps only the first token
            targets:
              - segment-terms
            color: cyan
            linger: 0.22
      - say: Move the divider left by one token. The first segment now holds a loss of one. The other holds fifteen.
          Each still divides by the four selected tokens in rollout seven. Segment A contributes one quarter.
          Segment B contributes three and three quarters. They still add to four, even if Megatron puts the
          segments in different microbatches.
        hold: 0.9
        caption_starts: ["Segment A contributes one quarter."]
        visual_cues:
          - id: segments-move-boundary
            phrase: Move the divider left by one token
            targets:
              - segment-terms
            color: cyan
            linger: 0.22
          - id: uneven-shares
            phrase: Segment B contributes three and three quarters
            targets:
              - segment-terms
            color: cyan
            linger: 0.22
            caption_boundary: true
      - say: Try dividing by each segment’s own count. One divided by one gives one. Fifteen divided by three gives
          five. Those local means add to six. The divider alone has changed the weight of the training
          example. Going back to the shared count fixes it. Halving its advantages again would cut the correct
          contribution to two.
        hold: 1
        visual_cues:
          - id: local-means
            phrase: Try dividing by each segment’s own count
            targets: &a1
              - segment-terms
            color: cyan
            linger: 0.22
          - id: restore-shared
            phrase: Going back to the shared count fixes it
            targets:
              - segment-terms
            color: blue
            linger: 0.22
          - id: extra-scale
            phrase: Halving its advantages again would cut the correct contribution to two
            targets:
              - segment-terms
            color: cyan
            linger: 0.22
          - id: local-a
            phrase: One divided by one gives one
            targets: *a1
            color: cyan
            linger: 0.22
          - id: local-b
            phrase: Fifteen divided by three gives five
            targets: *a1
            color: cyan
            linger: 0.22
          - id: local-total
            phrase: Those local means add to six
            targets: *a1
            color: cyan
            linger: 0.22
            caption_boundary: true
