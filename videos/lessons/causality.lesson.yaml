            linger: 0.35
      - say: The exact fixed-model argument evaluates models independently of the outcome sample. With estimated
          nuisances, correct specification and consistent fitting can give consistency under suitable
          regularity conditions, rather than automatic exact finite-sample unbiasedness. Split data or
          cross-fit, and evaluate a learned target policy on held-out data.
