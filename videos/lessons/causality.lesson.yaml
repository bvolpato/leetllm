              sample size. Take the square root for the standard error.
            targets:
              - cau-standardize-uncertainty-mechanism
            color: cyan
            linger: 0.35
          - id: cau-counts-restore
            phrase: Return to the original counts.
            targets:
              - cau-standardize-uncertainty-mechanism
            color: cyan
            linger: 0.35
      - say: The actual calculation gives about eight point seven seven percentage points of standard error. The
          ten-point estimate plus or minus one point nine six standard errors gives a rough interval from
          minus seven point two to twenty-seven point two points. Sparse cells can make this normal
