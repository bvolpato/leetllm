        visual_cues:
          - id: standardize-beat-3-focus-1
            phrase: The smallest cells contain only ten tickets
            targets:
              - standardize-object-distribution-standardize-20
            color: blue
            linger: 0.6
  - id: standardize-uncertainty
    title: Change one small cell and propagate the uncertainty
    visual: Ten actual low-risk assistant outcome tiles retain their positions while one success becomes failure
      in a labeled sensitivity case. Recompute the 70/30 result, restore the original counts, then show the
      four calculated binomial variance contributions and separately held standard error and interval.
    beats:
      - say: "The low-risk assistant cell contains nine successes among ten tickets. Change one success to failure in
          a separately labeled sensitivity case: its rate becomes eighty percent. The seventy-percent target
          weight multiplies that ten-point drop by point seven, reducing the standardized difference from ten
          points to three. This is sensitivity arithmetic, not a confidence interval."
        hold: 0.65
        visual_cues:
          - id: cau-standardize-uncertainty-0
            phrase: "The low-risk assistant cell contains nine successes among ten tickets. Change one success to failure
              in a separately labeled sensitivity case: its rate becomes eighty percent. The seventy-percent
              target weight multiplies that ten-point drop by point seven, reducing the standardized
              difference from ten points to three. This is sensitivity arithmetic, not a confidence interval."
            targets:
              - cau-standardize-uncertainty-mechanism
            color: cyan
            linger: 0.35
          - id: cau-cell-change
            phrase: Change one success to failure
            targets:
              - cau-standardize-uncertainty-mechanism
            color: cyan
            linger: 0.35
          - id: cau-sensitivity-three
            phrase: reducing the standardized difference from ten points to three.
            targets:
              - cau-standardize-uncertainty-mechanism
            color: cyan
            linger: 0.35
      - say: Return to the original counts. Under independent tickets, fixed target weights and conditional binomial
          sampling, estimate variance by summing squared stratum weights times the two cell variances. Each
          cell contributes its success rate times one minus that rate, divided by its sample size. Take the
          square root for the standard error.
        hold: 0.65
        visual_cues:
          - id: cau-standardize-uncertainty-1
            phrase: Return to the original counts. Under independent tickets, fixed target weights and conditional
              binomial sampling, estimate variance by summing squared stratum weights times the two cell
