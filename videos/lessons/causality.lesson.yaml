scenes:
  - id: intro
    title: How can both groups improve and the total fall?
    visual: Assistant and control success bars initially show 54% versus 76%; their hidden risk compositions unfold.
    beats:
      - say: An assistant resolves fewer tickets overall than the old workflow. The release report looks discouraging.
          Then we separate easy and difficult cases, and the assistant’s observed resolution rate is higher in
          both groups. How can the aggregate comparison point in the opposite direction?
        hold: 0.6
        visual_cues:
          - id: intro-beat-1-focus-1
            phrase: Then we separate easy and difficult cases
            targets:
              - intro-object-distribution-intro-1
            color: blue
            linger: 0.6
      - say: The groups received different mixes of work. Comparing their totals combines workflow performance with
          the assignment process that chose their cases. Causal inference asks what would happen if a
          specified population received one workflow or the other, and what evidence can identify that
          comparison.
        hold: 0.6
        visual_cues:
          - id: intro-beat-2-focus-1
            phrase: The groups received different mixes of work
            targets:
              - intro-object-distribution-intro-1
            color: blue
            linger: 0.6
      - say: We will reconstruct the reversal, draw the assumed assignment mechanism, and separate observing an action
          from intervening to set it. Then we will see what standardization repairs, why missing alternatives
          remain hidden, and how overlap determines which comparisons the logged data can support.
        hold: 0.75
        visual_cues:
          - id: intro-beat-3-focus-1
            phrase: We will reconstruct the reversal
            targets:
              - intro-object-distribution-intro-1
            color: blue
            linger: 0.6
  - id: policy-definition
    title: Define the unit, action and outcome
    visual: A persistent ticket links pre-routing risk, its versioned assistant workflow and the 24-hour outcome.
      A prompt change updates the action version. The shared-staff branch connects this routing choice to
      another ticket’s queue.
    beats:
      - say: Our two hundred tickets are synthetic. A unit is one ticket at its routing decision; treatment is a
          specified assistant workflow, and control is the existing human workflow. Resolution means success
          within twenty-four hours in both arms. Risk is recorded before routing. Keep that outcome definition
          and time horizon attached to every rate.
        hold: 0.65
        visual_cues:
          - id: cau-policy-definition-0
            phrase: Our two hundred tickets are synthetic. A unit is one ticket at its routing decision; treatment is a
              specified assistant workflow, and control is the existing human workflow. Resolution means
              success within twenty-four hours in both arms. Risk is recorded before routing. Keep that
              outcome definition and time horizon attached to every rate.
            targets:
              - cau-policy-definition-mechanism
            color: cyan
            linger: 0.35
          - id: cau-risk-recorded
            phrase: Risk is recorded before routing.
            targets:
              - cau-policy-definition-mechanism
            color: cyan
            linger: 0.35
      - say: Consistency says the observed outcome equals the potential outcome under the workflow actually received.
          Record model, prompt, tool and control versions. A defined stochastic assistant policy can produce
          different text on different runs without automatically violating consistency. A changed prompt that
          changes the workflow is a different action version for causal evaluation.
        hold: 0.65
        visual_cues:
          - id: cau-policy-definition-1
            phrase: Consistency says the observed outcome equals the potential outcome under the workflow actually
              received. Record model, prompt, tool and control versions. A defined stochastic assistant policy
              can produce different text on different runs without automatically violating consistency. A
              changed prompt that changes the workflow is a different action version for causal evaluation.
            targets:
              - cau-policy-definition-mechanism
            color: cyan
            linger: 0.35
          - id: cau-new-action-version
            phrase: A changed prompt that changes the workflow is a different action version for causal evaluation.
            targets:
              - cau-policy-definition-mechanism
            color: cyan
            linger: 0.35
      - say: If routing one ticket changes staff availability for others, its effect travels through the shared queue.
          Define whether the question concerns an individual assignment or a queue-level deployment policy.
          Randomizing an offer to use a feature and forcing its use are also different actions. The observed
          comparison cannot choose that intervention definition for us.
        hold: 0.65
        visual_cues:
          - id: cau-policy-definition-2
            phrase: If routing one ticket changes staff availability for others, its effect travels through the shared
              queue. Define whether the question concerns an individual assignment or a queue-level deployment
              policy. Randomizing an offer to use a feature and forcing its use are also different actions.
              The observed comparison cannot choose that intervention definition for us.
            targets:
              - cau-policy-definition-mechanism
            color: cyan
            linger: 0.35
          - id: cau-queue-effect
            phrase: its effect travels through the shared queue.
            targets:
              - cau-policy-definition-mechanism
            color: cyan
            linger: 0.35
  - id: simpson
    title: Follow the composition into the total
    visual: Within-risk success bars reveal a ten-point assistant advantage while group-size blocks weight the
      aggregate in opposite directions.
    beats:
      - say: Our synthetic log contains one hundred assistant tickets and one hundred control tickets. The assistant
          receives mostly difficult cases; control receives mostly easy ones. Within the easy group, the
          assistant resolves ninety percent and control eighty. Within the difficult group, their rates are
          fifty and forty percent.
        hold: 0.6
        visual_cues:
          - id: simpson-beat-1-focus-1
            phrase: Our synthetic log contains one hundred assistant tickets
            targets:
              - simpson-cohort-inputs
            color: blue
            linger: 0.6
          - id: simpson-easy-rates
            phrase: the assistant resolves ninety percent and control eighty
            targets:
              - simpson-object-distribution-simpson-10
            color: cyan
            linger: 0.6
          - id: simpson-difficult-rates
            phrase: their rates are fifty and forty percent
            targets:
              - simpson-difficult-rates
            color: pink
            linger: 0.6
      - say: Weight those rates by the different case mixes actually assigned. The assistant’s total becomes
          fifty-four percent, while control reaches seventy-six. The reversal comes from comparing different
          populations. Each arm’s aggregate is a weighted average, and the weights move the apparent
          comparison.
        hold: 0.6
        visual_cues:
          - id: simpson-beat-2-focus-1
            phrase: Weight those rates by the different case mixes actually assigned
            targets:
              - simpson-object-distribution-simpson-10
              - simpson-difficult-rates
            color: blue
            linger: 0.6
          - id: simpson-beat-2-focus-2
            phrase: The assistant’s total becomes fifty-four percent
            targets:
              - simpson-weighted-totals
            color: blue
            linger: 0.6
      - say: Pause and imagine giving both workflows the same mix. The within-group difference is ten percentage
          points in each group, so any shared mixture will preserve that difference here. This is Simpson’s
          paradox in the observed table. A causal interpretation still requires assumptions about how
          assignment occurred.
        hold: 0.75
        visual_cues:
          - id: simpson-beat-3-focus-1
            phrase: This is Simpson’s paradox in the observed table
            targets:
              - simpson-object-distribution-simpson-10
            color: blue
            linger: 0.6
          - id: simpson-beat-3-focus-2
            phrase: The within-group difference is ten percentage points in each group
            targets:
              - simpson-object-distribution-simpson-10
              - simpson-difficult-rates
            color: blue
            linger: 0.6
  - id: graph
    title: Draw the assignment mechanism you assume
    visual: A causal graph places pre-routing risk above assignment and outcome, exposing the backdoor path.
    beats:
      - say: Suppose pre-routing risk influences both workflow assignment and resolution. Draw an arrow from risk to
          each of those variables. Also draw the possible effect of assignment on resolution. Risk is a common
          cause, creating a backdoor path between the action and the outcome.
        hold: 0.6
        visual_cues:
          - id: graph-beat-1-focus-1
            phrase: Suppose pre-routing risk influences both workflow assignment and resolution
            targets:
              - graph-node-risk
            color: cyan
            linger: 0.6
      - say: The graph records causal assumptions about how the system works. Its arrows do not emerge automatically
          from correlations in the table. Under the stated model, conditioning on risk blocks this particular
          noncausal path. We must also consider whether another common cause remains unmeasured.
        hold: 0.6
        visual_cues:
          - id: graph-beat-2-focus-1
            phrase: conditioning on risk blocks this particular noncausal path
            targets:
              - graph-node-risk
            color: cyan
            linger: 0.6
          - id: graph-beat-2-focus-2
            phrase: The graph records causal assumptions about how the system works
            targets:
              - graph-node-action
            color: cyan
            linger: 0.6
      - say: A variable’s role matters. Adjusting for a common cause differs from adjusting for a consequence of
          treatment, and conditioning on a common effect can introduce selection bias. Choose an adjustment
          set from the causal question and the assumed graph, then inspect the information needed to justify
          it.
        hold: 0.75
        visual_cues:
          - id: graph-beat-3-focus-1
            phrase: A variable’s role matters
            targets:
              - graph-node-risk
            color: cyan
            linger: 0.6
  - id: graph-junctions
    title: Trace an open path before adjusting
    visual: Build a chain, fork and collider with named assignment and outcome nodes. Conditioning frames change
      whether the displayed path is open. A separately labeled symbolic cancellation illustrates why an open
      path need not yield nonzero association.
    beats:
      - say: Path blocking has three basic junctions. In a chain, assignment changes a diagnostic summary, which
          affects resolution. Conditioning on that mediator blocks this directed route. A total effect
          includes that route, so adjusting it away changes the comparison. Such conditioning does not
          automatically identify a direct causal effect.
        hold: 0.65
        visual_cues:
          - id: cau-graph-junctions-0
            phrase: Path blocking has three basic junctions. In a chain, assignment changes a diagnostic summary, which
              affects resolution. Conditioning on that mediator blocks this directed route. A total effect
              includes that route, so adjusting it away changes the comparison. Such conditioning does not
              automatically identify a direct causal effect.
            targets:
              - cau-graph-junctions-mechanism
            color: cyan
            linger: 0.35
          - id: cau-condition-mediator
            phrase: Conditioning on that mediator blocks this directed route.
            targets:
              - cau-graph-junctions-mechanism
            color: cyan
            linger: 0.35
      - say: In a fork, a pre-treatment common cause influences assignment and outcome. Conditioning on that cause
          blocks this particular backdoor path. In a collider, two arrows meet at a common effect. The path is
          blocked until we condition on that effect or one of its descendants; other non-colliders can still
          block a longer path.
        hold: 0.65
        visual_cues:
          - id: cau-graph-junctions-1
            phrase: In a fork, a pre-treatment common cause influences assignment and outcome. Conditioning on that cause
              blocks this particular backdoor path. In a collider, two arrows meet at a common effect. The
              path is blocked until we condition on that effect or one of its descendants; other non-colliders
              can still block a longer path.
            targets:
              - cau-graph-junctions-mechanism
            color: cyan
            linger: 0.35
          - id: cau-condition-fork
            phrase: Conditioning on that cause blocks this particular backdoor path.
            targets:
              - cau-graph-junctions-mechanism
            color: cyan
            linger: 0.35
          - id: cau-condition-collider
            phrase: The path is blocked until we condition on that effect or one of its descendants
            targets:
              - cau-graph-junctions-mechanism
            color: cyan
            linger: 0.35
          - id: cau-collider-shape
            phrase: In a collider, two arrows meet at a common effect.
            targets:
              - cau-graph-junctions-mechanism
            color: cyan
            linger: 0.35
      - say: Check every path to establish d-separation. Under the causal Markov assumption, d-separation implies
          conditional independence. An open path permits dependence but need not produce a nonzero
          association, because contributions can cancel. Reading causal structure backward from observed
          independence needs an additional faithfulness assumption. A graph’s arrows remain assumptions about
          the data-generating mechanism.
        hold: 0.65
        visual_cues:
          - id: cau-graph-junctions-2
            phrase: Check every path to establish d-separation. Under the causal Markov assumption, d-separation implies
              conditional independence. An open path permits dependence but need not produce a nonzero
              association, because contributions can cancel. Reading causal structure backward from observed
              independence needs an additional faithfulness assumption. A graph’s arrows remain assumptions
              about the data-generating mechanism.
            targets:
              - cau-graph-junctions-mechanism
            color: cyan
            linger: 0.35
          - id: cau-cancel-paths
            phrase: because contributions can cancel.
            targets:
              - cau-graph-junctions-mechanism
            color: cyan
            linger: 0.35
  - id: backdoor-set
    title: Block the paths that enter assignment
    visual: Keep the measured-risk fork and workflow effect. The adjustment chapter applies the same symbolic
      target shares to the actual four subgroup rates. Adding a hidden customer-tier fork exposes the path
      that measured-risk adjustment leaves open.
    beats:
      - say: "The backdoor criterion is a sufficient graphical condition: the adjustment set contains no descendant of
          treatment and blocks every path from assignment to outcome that starts with an arrow into
          assignment. It is not a rule to control every available variable. A treatment-affected summary or
          selected audit can remove a real route or open a noncausal one."
        hold: 0.65
        visual_cues:
          - id: cau-backdoor-set-0
            phrase: "The backdoor criterion is a sufficient graphical condition: the adjustment set contains no descendant
              of treatment and blocks every path from assignment to outcome that starts with an arrow into
              assignment. It is not a rule to control every available variable. A treatment-affected summary
              or selected audit can remove a real route or open a noncausal one."
            targets:
              - cau-backdoor-set-mechanism
            color: cyan
            linger: 0.35
      - say: With the relevant causal assumptions, positivity and consistency, adjustment averages each
          treatment-specific outcome rate within an adjustment stratum using one population distribution. For
          discrete strata, multiply the outcome rate by that stratum’s target probability and sum. Both arms
          must use the same chosen target rather than their different observed assignment mixes.
        hold: 0.65
        visual_cues:
          - id: cau-backdoor-set-1
            phrase: With the relevant causal assumptions, positivity and consistency, adjustment averages each
              treatment-specific outcome rate within an adjustment stratum using one population distribution.
              For discrete strata, multiply the outcome rate by that stratum’s target probability and sum.
              Both arms must use the same chosen target rather than their different observed assignment mixes.
            targets:
              - cau-backdoor-set-mechanism
            color: cyan
            linger: 0.35
          - id: cau-adjust-common-target
            phrase: Both arms must use the same chosen target rather than their different observed assignment mixes.
            targets:
              - cau-backdoor-set-mechanism
            color: cyan
            linger: 0.35
      - say: Risk-only adjustment is insufficient if a hidden customer tier still changes routing and outcome through
          an unblocked path. Measuring more rows does not close that path. Conversely, an unrecorded variable
          need not confound this comparison if the recorded set already blocks its relevant paths. Recording a
          baseline attribute later does not alone make it treatment-affected.
        hold: 0.65
        visual_cues:
          - id: cau-backdoor-set-2
            phrase: Risk-only adjustment is insufficient if a hidden customer tier still changes routing and outcome
              through an unblocked path. Measuring more rows does not close that path. Conversely, an
              unrecorded variable need not confound this comparison if the recorded set already blocks its
              relevant paths. Recording a baseline attribute later does not alone make it treatment-affected.
            targets:
