            color: cyan
            linger: 0.35
  - id: intervene
    title: Set the action and remove its incoming arrow
    visual: The do-operation severs risk-to-assignment while retaining risk-to-outcome and assignment-to-outcome
      mechanisms.
    beats:
      - say: An observational question asks what happened among tickets that received the assistant. An intervention
          asks what would happen if we assigned a specified population to it. In a structural model, the
          intervention replaces the assignment mechanism with a fixed action and removes its incoming arrows.
        hold: 0.6
        visual_cues:
          - id: intervene-beat-1-focus-1
            phrase: the intervention replaces the assignment mechanism with a
            targets:
              - graph-node-action
            color: cyan
            linger: 0.6
          - id: intervene-beat-1-focus-2
            phrase: An observational question asks what happened among tickets that received the assistant
            targets:
              - graph-node-risk
            color: cyan
            linger: 0.6
      - say: The other mechanisms remain in place. Risk still influences resolution, while it stops choosing the
          assigned workflow. This difference explains why conditioning on assistant use can yield a different
          number from intervening to route everyone to the assistant. The target population must be specified
          in both questions.
        hold: 0.6
        visual_cues:
          - id: intervene-beat-2-focus-1
            phrase: Risk still influences resolution
            targets:
              - graph-node-risk
            color: cyan
            linger: 0.6
          - id: intervene-beat-2-focus-2
            phrase: while it stops choosing the assigned workflow
            targets:
              - graph-node-action
            color: cyan
            linger: 0.6
      - say: The do notation names the comparison; the graph and evidence determine whether we can identify its value.
          If routing all tickets changes a shared queue, that interference belongs in the intervention model.
          A ticket-level estimate and a whole-queue policy effect can therefore answer different questions.
        hold: 0.75
        visual_cues:
          - id: intervene-beat-3-focus-1
            phrase: If routing all tickets changes a shared queue
            targets:
              - graph-node-risk
            color: cyan
            linger: 0.6
          - id: intervene-beat-3-focus-2
            phrase: The do notation names the comparison
            targets:
              - graph-node-action
            color: cyan
            linger: 0.6
  - id: standardize
    title: Compare both workflows at one target mix
    visual: A target mixture slider sets both arms to 70% easy and 30% difficult, producing adjusted 78% and 68%
      rates.
    beats:
      - say: Choose a deployment population with seventy percent easy cases and thirty percent difficult cases. Apply
          those same weights to each workflow’s group-specific success rates. The standardized assistant rate
          is seventy-eight percent, and control is sixty-eight. The visible case-mix imbalance has been
          removed from this comparison.
        hold: 0.6
        motion_check:
          region:
            - 220
            - 330
            - 1500
            - 610
          minimumChangedFraction: 0.002
        visual_cues:
          - id: standardize-beat-1-focus-1
            phrase: Apply those same weights to each workflow’s group-specific success rates
            targets:
              - standardize-object-distribution-standardize-20
            color: blue
            linger: 0.6
          - id: standardize-beat-1-focus-2
            phrase: The visible case-mix imbalance has been removed from this comparison
            targets:
              - standardize-object-250-850-mix-900-13-c-yellow-25
            color: blue
            linger: 0.6
      - say: To interpret that difference causally, assume comparable potential outcomes within the measured groups,
          positive assignment probabilities for both workflows, well-defined treatment versions, consistent
          outcomes, and an appropriate interference model. Transfer to deployment also requires the
          group-specific behavior and target weights to apply there.
        hold: 0.6
        visual_cues:
          - id: standardize-beat-2-focus-1
            phrase: well-defined treatment versions
            targets:
              - standardize-object-exchangeability-overlap-well-defined-outcomes-27
            color: blue
            linger: 0.6
          - id: standardize-beat-2-focus-2
            phrase: To interpret that difference causally
            targets:
              - standardize-object-distribution-standardize-20
            color: blue
            linger: 0.6
      - say: The smallest cells contain only ten tickets. One changed outcome can move the adjusted result
