  - id: dr-assumptions
    title: Locate the two error factors before claiming robustness
    visual: A symbolic product rectangle shrinks to zero as one nuisance-error factor vanishes. Separate model
      fitting from held-out evaluation, while retaining explicit support and hidden-confounding limits.
    beats:
      - say: "The conditional bias for fixed nuisance models contains a product: one minus true logging probability
          divided by its estimate, multiplied by reward-prediction error, then summed with target-policy
          probabilities. If either factor is exactly zero on supported actions, that bias vanishes. Two
          approximate models do not guarantee zero error or minimum variance."
