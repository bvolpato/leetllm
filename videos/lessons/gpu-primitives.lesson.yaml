            targets: [lookback-board]
            linger: 0.35
            caption_boundary: true
      - say: |
          What if a reader arrives early? X means the payload is still unavailable. The writer puts the value in memory, then publishes its status with release ordering. Once the reader observes that status with acquire ordering, it can use the value. While a reader waits, the scheduler must give the tile it depends on a chance to run.
