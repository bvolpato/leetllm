  - id: normalizer-output
    title: What still has to be read?
    visual: Keep the final scale and denominator on screen. Visit each retained logit to fill its own probability slot and count the extra reads.
    beats:
      - say: |
          The first pass is over. We have a maximum of four and a denominator of about one point two zero three. The four original logits are still in memory. If all you kept in registers was that pair of numbers, what must you read to fill these four probability slots?
        hold: 2.3
        visual_cues:
          - id: prob-state
            phrase: a maximum of four and a denominator
            targets: [probability-board]
            linger: 0.35
          - id: prob-question
            phrase: what must you read
            targets: [probability-board]
            linger: 0.35
      - say: |
          Read each logit again. For the first slot, read two. Subtract the final maximum, exponentiate and divide by the denominator. That gives about eleven percent. Repeat for the other three logits. Four reads found the normalizer, and four more gave us the probabilities. A separate maximum pass and denominator pass would have made three passes in all. On the article's eight-logit row, the online method takes sixteen logical reads. Caching or keeping logits on chip changes where those reads are served.
        hold: 0.9
        visual_cues:
          - id: prob-first
            phrase: For the first slot, read two
            targets: [probability-board]
            linger: 0.35
          - id: prob-value
            phrase: That gives about eleven percent
            targets: [probability-board]
            linger: 0.35
            caption_boundary: true
          - id: prob-rest
            phrase: Repeat for the other three logits
            targets: [probability-board]
            linger: 0.35
          - id: prob-eight
            phrase: sixteen logical reads
            targets: [probability-board]
            linger: 0.35
      - say: |
          Subtracting the largest finite logit keeps each exponential at most one. A tiny exponential can underflow to zero. A masked logit contributes zero mass. The model uses None to mark a mask and rejects other nonfinite inputs. A fully masked row has no probability distribution, so the model rejects it. An empty partial state, though, can merge with a valid neighbor. Give the empty state zero mass and handle it separately before subtracting maxima. That avoids subtracting minus infinity from itself. To produce every probability later, keep the logits or use an input you can read again unchanged.
