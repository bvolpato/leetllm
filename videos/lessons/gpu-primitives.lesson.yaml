          With decoupled look-back, a tile can apply its offset as it writes its own outputs. That saves a separate pass over the output array. The lab's types give four useful input bytes and eight output bytes per item. Metadata, setup and repeated look-back reads add work. CUB's scan defaults can differ from its reduction defaults. If floating-point sums have to repeat, check whether the installed scan supports requesting run-to-run determinism.
