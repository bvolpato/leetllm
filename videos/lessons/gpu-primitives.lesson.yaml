  - id: hazard-proof
    title: Checking a GPU scan
    visual: A missing block offset and a missing shared-memory handoff produce distinguishable numerical and ordering failures.
    beats:
      - say: |
          Think of two threads using the same shared slot. If a consumer reads before its producer finishes writing, the missing order creates a read-after-write hazard. Overwrite a slot while a neighbor still needs to read it and the hazard is write-after-read. Two unordered writes give write-after-write. Two unordered reads alone can coexist. If another warp needs the slot, arrange a handoff that covers both warps.
