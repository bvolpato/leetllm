scenes:
  - id: subject-intro
    title: Which score goes with the penalty?
    visual: A replay stops on seven points with two plays in view. Follow the cursor across the five-point gain and the penalty, then pull back to all eight plays.
    beats:
      - say: |
          Add five to the seven on the board. Freeze just before the nine-point penalty. What's the score?
        hold: 2.6
        visual_cues:
          - id: intro-add-five
            phrase: Add five to the seven on the board
            targets: [replay-board]
            linger: 0.35
          - id: intro-freeze
            phrase: Freeze just before the nine-point penalty
            targets: [replay-board]
            linger: 0.35
      - say: |
          Twelve points. Now let the penalty count. Twelve minus nine leaves three. Each GPU lane holds one play. An exclusive scan gives each lane the score before its play. An inclusive scan gives it the score after.
        hold: 0.9
        visual_cues:
          - id: intro-before
            phrase: Twelve points
            targets: [replay-board]
            linger: 0.35
            caption_boundary: true
          - id: intro-penalty
            phrase: Now let the penalty count
            targets: [replay-board]
            linger: 0.35
          - id: intro-through
            phrase: Twelve minus nine leaves three
            targets: [replay-board]
            linger: 0.35
            caption_boundary: true
          - id: intro-exclusive
            phrase: An exclusive scan
            targets: [replay-board]
            linger: 0.35
          - id: intro-inclusive
            phrase: An inclusive scan
            targets: [replay-board]
            linger: 0.35
      - say: |
          Here's the whole replay. Two more plays add two points and then six. The final score is eleven. If the scoreboard needs only that number, the lanes can combine their plays in pairs. That operation is a reduction.
        hold: 0.85
        visual_cues:
          - id: intro-finish
            phrase: Two more plays add two points and then six
            targets: [replay-board]
            linger: 0.35
          - id: intro-total
            phrase: The final score is eleven
            targets: [replay-board]
            linger: 0.35
            caption_boundary: true
  - id: pairwise-reduction
    title: How far can one sum reach?
    visual: Each branch covers a contiguous interval of plays. Four pairs merge to two halves and then one final score.
    beats:
      - say: |
          Give each pair of neighbors one addition. Three and minus one make two. At the other end, two and six make eight. All four pairs can work at once. Each new number stands for the two plays directly above it.
        hold: 0.7
        visual_cues:
          - id: reduction-neighbor-pairs
            phrase: Three and minus one make two
            targets: [reduction-level-0, reduction-level-1]
            linger: 0.35
          - id: reduction-parallel-partials
            phrase: All four pairs can work at once
            targets: [reduction-level-1]
            linger: 0.35
      - say: |
          Combine neighboring partials again. The left half contributes seven points. The right half contributes four. One final addition gives eleven. Follow any leaf down the tree and it reaches the root exactly once.
        hold: 0.8
        motion_check:
          region: [150, 470, 1600, 450]
          minimumChangedFraction: 0.002
        visual_cues:
          - id: reduction-partial-pairs
            phrase: The left half contributes seven points. The right half contributes four
            targets: [reduction-level-1, reduction-level-2]
            linger: 0.35
          - id: reduction-final-add
            phrase: One final addition gives eleven
            targets: [reduction-level-2, reduction-level-3]
            linger: 0.35
            caption_boundary: true
      - say: |
          Count the joins. Four, then two, then one makes seven additions, just as in a serial sum. Follow one path instead and you cross three stages. A parent can run as soon as both of its children are ready.
        hold: 0.65
        visual_cues:
          - id: reduction-tree-depth
            phrase: you cross three stages
            targets: [reduction-level-0, reduction-level-3]
            linger: 0.35
          - id: reduction-work
            phrase: seven additions
            targets: [reduction-level-1, reduction-level-2]
            linger: 0.35
  - id: warp-communication
    title: Where does a lane get its neighbor’s sum?
    visual: Lane zero exchanges register values in an eight-lane XOR teaching tile. Remove lane seven from a fresh exchange to expose an absent source.
    beats:
      - say: |
          Watch lane zero in this eight-lane tile inside a warp. It starts with three. Lane one sends minus one from its register. Lane zero now holds two. Next it takes the sum from lane two, then the sum from lane four. Here each lane picks a partner by flipping one bit of its lane index. That's an exclusive-or shuffle. It exchanges registers directly, so this step uses no shared-memory banks.
        hold: 0.65
        visual_cues:
          - id: warp-neighbor
            phrase: Lane one sends minus one from its register
            targets: [warp-registers]
            linger: 0.35
          - id: warp-next
            phrase: Next it takes the sum from lane two
            targets: [warp-registers]
            linger: 0.35
          - id: warp-last
            phrase: then the sum from lane four
            targets: [warp-registers]
            linger: 0.35
      - say: |
          Replay the first exchange at the other end of the tile. Lane six wants lane seven's six points. Let lane seven exit first. What result does the shuffle give lane six now?
        hold: 2.1
        visual_cues:
          - id: warp-replay
            phrase: Lane six wants lane seven's six points
            targets: [warp-registers]
            linger: 0.35
          - id: warp-exit
            phrase: Let lane seven exit first
            targets: [warp-registers]
            linger: 0.35
      - say: |
          That source is missing. The read is undefined. A shuffle mask names the lanes taking part. Every named lane that hasn't exited must execute the matching shuffle with the same mask. Moving a register value this way leaves shared-memory writes to be ordered separately.
        hold: 0.75
        visual_cues:
          - id: warp-undefined
            phrase: The read is undefined
            targets: [warp-registers]
            linger: 0.35
            caption_boundary: true
  - id: full-warp-contract
    title: Does lane twenty have a value to send?
    visual: Follow a down-shuffle from lane four to lane twenty. Change a live zero to an exited source, then trace the separate upper-bound case.
    beats:
      - say: |
          Scale up from the eight-lane tile to a hardware warp of thirty-two threads. The lab uses a down-shuffle. The first reach is sixteen lanes, then eight, four, two and one. Lane zero ends up with the full sum. Each lane carries a signed sixty-four-bit partial. Every intermediate sum must fit. The shuffle's instruction cost depends on the type and the hardware.
        hold: 0.7
        visual_cues:
          - id: full-warp-contract-step-1
            phrase: a hardware warp of thirty-two threads
            targets: [warp32-lanes]
            linger: 0.35
      - say: |
          This row has twenty ones. The remaining twelve lanes stay alive and carry zero. At the first step, lane four reads lane twenty and gets zero. Now let lane twenty exit. Its register is no longer available, so the read is undefined. At the upper boundary, lane twenty-four would reach lane forty. A down-shuffle past the warp returns the caller's own value. The guard skips that addition.
        hold: 0.85
        visual_cues:
          - id: full-warp-contract-step-2
            phrase: lane four reads lane twenty and gets zero
            targets: [warp32-source]
            linger: 0.35
          - id: warp32-exit
            phrase: let lane twenty exit
            targets: [warp32-source]
            linger: 0.35
          - id: warp32-upper
            phrase: At the upper boundary
            targets: [warp32-upper-bound]
            linger: 0.35
      - say: |
          Keep the shuffle outside the guard so every named, non-exited lane reaches it with the same mask. Independent thread scheduling makes it unsafe to assume neighbors run in lockstep. When all eight warp leaders write their totals to shared memory, the whole block meets at a barrier. Then warp zero can load those eight totals, fill its remaining twenty-four registers with zeros and reduce again.
        hold: 0.7
        visual_cues:
          - id: full-warp-contract-step-3
            phrase: Keep the shuffle outside the guard
            targets: [warp32-barrier]
            linger: 0.35
          - id: warp32-leaders
            phrase: all eight warp leaders write their totals
            targets: [warp32-barrier]
            linger: 0.35
  - id: block-barrier
    title: When can the reader add the partials?
    visual: Two warp leaders publish seven and four to separate shared slots. A reader waits for the block handoff before combining them.
    beats:
      - say: |
          Zoom in on two warp leaders from the same block. Give one the first four plays and the other the last four. Their sums are seven and four. The first leader writes seven into shared memory. The other leader still holds four in a register. Can the reader use both slots yet?
        hold: 2
        visual_cues:
          - id: handoff-seven
            phrase: The first leader writes seven into shared memory
            targets: [handoff-board]
            linger: 0.35
          - id: handoff-wait
            phrase: Can the reader use both slots yet
            targets: [handoff-board]
            linger: 0.35
      - say: |
          The second leader still has to write four. All threads in this block then reach the barrier. Once it releases, the reader can use both shared values. Seven plus four gives eleven. Put the barrier outside the branch that only the leaders take.
        hold: 0.75
        visual_cues:
          - id: handoff-four
            phrase: write four
            targets: [handoff-board]
            linger: 0.35
          - id: handoff-arrive
            phrase: All threads in this block then reach the barrier
            targets: [handoff-board]
            linger: 0.35
          - id: handoff-read
            phrase: the reader can use both shared values
            targets: [handoff-board]
            linger: 0.35
          - id: handoff-total
            phrase: Seven plus four gives eleven
            targets: [handoff-board]
            linger: 0.35
            caption_boundary: true
      - say: |
          Now imagine these partials belong to different blocks. Each block has its own shared memory. Give each partial a slot in global memory and launch a later combine in the same stream. That handoff reaches across blocks.
        hold: 0.8
        visual_cues:
          - id: handoff-grid
            phrase: Give each partial a slot in global memory
            targets: [handoff-board]
            linger: 0.35
          - id: handoff-combine
            phrase: launch a later combine in the same stream
            targets: [handoff-board]
            linger: 0.35
  - id: grid-reduction
    title: How many partials survive each pass?
    visual: The lab's bounded loads create a shrinking sequence of wider partials. A separate scheduling diagram distinguishes a legal handoff from a grid-wide wait.
    beats:
      - say: |
          Zoom out to the lab's grid. Each block has two hundred fifty-six threads. A thread can load two inputs spaced two hundred fifty-six positions apart. It checks each index before reading. A full block covers five hundred twelve inputs. Start with just over four million inputs, as shown. The first pass leaves eight thousand one hundred ninety-two partials. The next leaves sixteen. The last leaves one. The inputs are thirty-two-bit integers. All the partials are sixty-four-bit.
        hold: 0.65
        visual_cues:
          - id: grid-first-pass
            phrase: leaves eight thousand one hundred ninety-two partials
            targets: [grid-passes]
            linger: 0.35
          - id: grid-second-pass
            phrase: The next leaves sixteen
            targets: [grid-passes]
            linger: 0.35
          - id: grid-reduction-step-1
            phrase: The last leaves one
            targets: [grid-passes]
            linger: 0.35
      - say: |
          Why use another launch? Imagine four resident slots and eight blocks. If the four running blocks wait for all eight to arrive, they can keep the queued four from ever starting. A block barrier reaches only its block. The lab uses same-stream kernel ordering between passes. A cooperative grid barrier needs a supported launch with room for all its blocks to be resident together.
        hold: 0.8
        caption_starts:
          - Imagine four resident slots and eight blocks
          - If the four running blocks wait for all eight to arrive
        visual_cues:
          - id: grid-resident
            phrase: four resident slots
            targets: [grid-deadlock]
            linger: 0.35
          - id: grid-reduction-step-2
            phrase: keep the queued four from ever starting
            targets: [grid-deadlock]
            linger: 0.35
      - say: |
          Another choice is to atomically add each block total to an initialized output. Now all those updates contend for one address. Even a histogram with many bins can have one hot bin. Check the type as well. The legacy sixty-four-bit integer atomic add takes an unsigned value. A signed sum needs a compatible operation and an overflow policy. Measure the full algorithms on your workload, including the extra launches in one and the contention in the other.
        hold: 0.65
        visual_cues:
          - id: grid-atomic-write
            phrase: atomically add each block total
            targets: [grid-atomics]
            linger: 0.35
          - id: grid-reduction-step-3
            phrase: updates contend for one address
            targets: [grid-atomics]
            linger: 0.35
  - id: floating-point-order
    title: Addition order can change a rounded result
    visual: Two computed FP32 reduction trees group large and small values differently and finish at distinct rounded sums.
    beats:
      - say: |
          Real-number addition is associative, but floating-point addition rounds each intermediate value. Compare a large positive value, its large negative partner, and a small residual of three point one four.
        hold: 0.55
        visual_cues:
          - id: floating-point-order-beat-1-focus-1
            phrase: Real-number addition is associative, but floating-point addition rounds each intermediate value
            targets:
              - floating-point-order-math-10-20-10-20-3-14
            color: cyan
            linger: 0.65
      - say: |
          Pair the large values first and they cancel, leaving three point one four. Add the small residual to the large negative value first and it rounds away at this scale. The next addition then yields zero.
        hold: 0.7
        visual_cues:
          - id: floating-point-order-beat-2-focus-1
            phrase: Pair the large values first and they cancel, leaving three point one four
            targets:
              - floating-point-order-math-fl-32-fl-32-a-b-r
              - floating-point-order-math-0-3-14-3-14
            color: cyan
            linger: 0.65
          - id: floating-residual-rounds-away
            phrase: Add the small residual to the large negative value first and it rounds away at this scale
            targets:
              - floating-point-order-math-fl-32-a-fl-32-b-r
              - floating-point-order-math-10-20-10-20-0
            color: pink
            linger: 0.3
          - id: floating-next-addition-zero
            phrase: The next addition then yields zero
            targets:
              - floating-point-order-math-10-20-10-20-0
            color: pink
            linger: 0.65
      - say: |
          Changing addition order can produce different low-order bits even when both trees are race-free. Validate against suitable tolerances and check error growth when changing tile size or reduction layout.
        hold: 0.55
        visual_cues:
          - id: floating-point-order-beat-3-focus-1
            phrase: Changing addition order can produce different low-order bits even when both trees are race-free
            targets:
              - floating-point-order-math-0-3-14-3-14
              - floating-point-order-math-10-20-10-20-0
            color: cyan
            linger: 0.65
  - id: partial-range
    title: A valid final total cannot repair an invalid partial
    visual: An overflowing int64 pair fails before a later negative cancels it; separate repeated bits from numerical accuracy.
    beats:
      - say: |
          Take the largest signed sixty-four-bit integer. Call it maximum. The other three inputs are one, minus one and zero. The exact final sum is maximum. Follow the first pair, though. The model rejects maximum plus one right there. The later minus one arrives too late. The lab bounds each input between minus nine and nine, so nine times the length bounds every partial it can produce.
        hold: 0.55
        visual_cues:
          - id: partial-range-step-1
            phrase: maximum plus one
            targets:
              - range-overflow
            linger: 0.55
          - id: range-final
            phrase: The exact final sum is maximum
            targets:
              - range-overflow
            linger: 0.3
      - say: |
          Now switch to floating point. At one hundred million, neighboring Float32 numbers are eight apart. Adding one rounds back to one hundred million. Subtracting one hundred million then gives zero. Group the two large numbers first, and the result is one. Both trees can run without a race. A fixed tree can even keep its order when its blocks finish at different times.
        hold: 0.7
        visual_cues:
          - id: partial-range-step-2
            phrase: result is one
            targets:
              - range-rounding
            linger: 0.55
          - id: range-zero
            phrase: then gives zero
            targets:
              - range-rounding
            linger: 0.3
      - say: |
          Run the left tree three times. The zeros have identical bits on all three runs. Accuracy asks how far those zeros are from the reference, which is one. A fixed tree can repeat an inaccurate answer. Atomic updates can also change the addition order and the rounding. If exact repeatability matters, check the installed CUB release, GPU and build. Test the bits across runs and the error against the reference. The CUB release described in the lab defaults to repeatable reductions for the same GPU, build and configuration. Scan has its own default.
        hold: 0.55
        visual_cues:
          - id: partial-range-step-3
            phrase: A fixed tree can repeat an inaccurate answer
            targets:
              - range-contracts
            linger: 0.55
          - id: range-reference
            phrase: Accuracy asks how far
            targets:
              - range-contracts
            linger: 0.3
  - id: inclusive-scan
    title: Which plays has this register counted?
    visual: Each register tracks four source positions. Two rounds combine disjoint ranges from the previous row until every lane holds its inclusive prefix.
    beats:
      - say: |
          Take the first four plays again. This time each lane must report the score through its own play. The little marks under a register show which plays it has counted. Lane three starts with just the last play, worth one point.
        hold: 0.75
        visual_cues:
          - id: scan-input
            phrase: The little marks under a register
            targets: [scan-registers]
            linger: 0.35
      - say: |
          Each lane with a left neighbor reads that neighbor's old register and adds it to its own. That's the first round of a Hillis-Steele scan. Look at lane three now. Its five covers the last two plays. Which register in this row holds the missing first two?
        hold: 2.3
        visual_cues:
          - id: scan-first-stride
            phrase: reads that neighbor's old register and adds it to its own
            targets: [scan-registers]
            linger: 0.35
          - id: scan-ask
            phrase: Which register in this row holds the missing first two
            targets: [scan-registers]
            linger: 0.35
      - say: |
          Lane one holds two. Reach back two lanes in this round. Those two points join the five in lane three to make seven. Lane two also reaches back two places and gets six. Each lane now has the score through its own play. Three additions in the first round and two in the second bought us every prefix in two rounds.
        hold: 0.9
        visual_cues:
          - id: scan-peer
            phrase: Lane one holds two
            targets: [scan-registers]
            linger: 0.35
            caption_boundary: true
          - id: scan-second-stride
            phrase: Reach back two lanes in this round
            targets: [scan-registers]
            linger: 0.35
          - id: scan-last-answer
            phrase: to make seven
            targets: [scan-registers]
            linger: 0.35
            caption_boundary: true
          - id: scan-third-answer
            phrase: gets six
            targets: [scan-registers]
            linger: 0.35
            caption_boundary: true
  - id: prefix-contract
    title: Which edge belongs to the replay?
    visual: Align each play with its score before and after. At the negative play, the two selected scores mark opposite edges of the same change.
    beats:
      - say: |
          Bring back all eight plays. Put the score before each play on one row and the score after it on the next. Before the very first play the score is zero. After the first play it's three. That three is also the starting score for the next play.
        hold: 0.7
        visual_cues:
          - id: prefix-inputs
            phrase: Bring back all eight plays
            targets: [prefix-boundaries]
            linger: 0.35
          - id: prefix-contract-step-1
            phrase: Before the very first play the score is zero
            targets: [prefix-boundaries]
            linger: 0.35
          - id: prefix-inclusive
            phrase: After the first play it's three
            targets: [prefix-boundaries]
            linger: 0.35
      - say: |
          Look down the penalty column. The exclusive score is twelve. Count the current play as well and the inclusive score falls to three. The next column starts at three. The lane positions stay in order even where the score goes down. Some operations let you regroup the inputs but change the answer if you swap them. A scan keeps their order.
        hold: 0.75
        visual_cues:
          - id: prefix-contract-step-2
            phrase: The exclusive score is twelve
            targets: [prefix-alignment]
            linger: 0.35
          - id: prefix-full
            phrase: The next column starts at three
            targets: [prefix-alignment]
            linger: 0.35
      - say: |
          Zero is the identity for addition. A tile can fill unused slots with zero and still get the same sum. That padding can cost extra additions. An empty segment also sums to zero. An empty search for a winning index needs a separate policy because there's no index to return.
        hold: 0.65
        visual_cues:
          - id: prefix-contract-step-3
            phrase: That padding can cost extra additions
            targets: [prefix-identity]
            linger: 0.35
  - id: blelloch
    title: Take the sums up the tree, bring the starting scores down
    visual: The same tree first stores sums, then starting scores. Save the root total and track the old left sum into each right child's starting score.
    beats:
      - say: |
          Use the first four plays to build a Blelloch scan. On the way up, each pair saves its sum. The left pair scores two, the right pair five. Together they score seven. Save that seven for the next block. Now put zero at the root. That's the starting score for the whole block. What starting score should the right pair get?
        hold: 2.2
        visual_cues:
          - id: sweep-pairs
            phrase: The left pair scores two, the right pair five
            targets: [sweep-tree]
            linger: 0.35
          - id: sweep-sum
            phrase: Together they score seven
            targets: [sweep-tree]
            linger: 0.35
          - id: sweep-save
            phrase: Save that seven for the next block
            targets: [sweep-tree]
            linger: 0.35
          - id: sweep-zero
            phrase: put zero at the root
            targets: [sweep-tree]
            linger: 0.35
      - say: |
          The left pair inherits the starting zero. For the right pair, take the parent's starting score and add the old sum of its left child. Zero plus two gives two. Do that once more for the leaves. The last play starts at two plus four, which is six. Read the leaves left to right and you have the four exclusive prefixes.
        hold: 1.1
        visual_cues:
          - id: sweep-halves
            phrase: Zero plus two gives two
            targets: [sweep-tree]
            linger: 0.35
            caption_boundary: true
          - id: sweep-leaves
            phrase: two plus four, which is six
            targets: [sweep-tree]
            linger: 0.35
            caption_boundary: true
      - say: |
          Look at the four shared slots. Each used to hold an input or a partial sum. Now each holds the score before its play. Save the old left value before overwriting that slot. Adding the original play gives its inclusive score. A block barrier between shared-memory phases lets all threads read the completed stage. The CPU trace assumes that handoff.
        hold: 0.85
        visual_cues:
          - id: sweep-storage
            phrase: Look at the four shared slots
            targets: [sweep-tree]
            linger: 0.35
          - id: sweep-inclusive
            phrase: Adding the original play gives its inclusive score
            targets: [sweep-tree]
            linger: 0.35
  - id: scan-work
    title: How many lanes add in each round?
    visual: Each column counts one round of additions. Hillis-Steele loses lanes as its stride doubles. Blelloch narrows to one join and widens again on the way down.
    beats:
      - say: |
          Start with thirty-two lanes. At stride one, thirty-one can reach a left neighbor. Reach two places left and thirty lanes can add. Keep doubling the stride. Even at stride sixteen, half the lanes still add. Hillis-Steele uses one hundred twenty-nine additions in five rounds. Follow Blelloch up the tree. Sixteen pairs add, then eight, then four, down to one. Reverse those counts on the way back down the tree. That's sixty-two additions in ten rounds.
        hold: 0.8
        visual_cues:
          - id: work-second-stride
            phrase: Reach two places left
            targets: [work-counters]
          - id: work-final-strides
            phrase: Even at stride sixteen
            targets: [work-counters]
          - id: scan-work-step-1
            phrase: Hillis-Steele uses one hundred twenty-nine additions in five rounds
            targets: [work-counters]
            linger: 0.35
          - id: work-up
            phrase: Sixteen pairs add, then eight, then four, down to one
            targets: [work-counters]
          - id: work-down
            phrase: Reverse those counts on the way back down the tree
            targets: [work-counters]
          - id: work-blelloch
            phrase: sixty-two additions in ten rounds
            targets: [work-counters]
            linger: 0.35
      - say: |
          Grow the tile to five hundred twelve values. Hillis-Steele does about four times as many additions as Blelloch. Blelloch still takes twice as many rounds. How long a round takes depends on shared-memory access and the wait at a barrier. Time both kernels on the same GPU to see which finishes first.
        hold: 0.75
        visual_cues:
          - id: work-512
            phrase: Grow the tile to five hundred twelve values
            targets: [work-versus-time]
            linger: 0.35
          - id: work-larger-counts
            phrase: Hillis-Steele does about four times as many additions as Blelloch
            targets: [work-versus-time]
            caption_boundary: true
          - id: scan-work-step-2
            phrase: Blelloch still takes twice as many rounds
            targets: [work-versus-time]
            linger: 0.35
  - id: block-offsets
    title: Where do the two score traces meet?
    visual: Two four-play traces start at zero. Move the entire second trace by the preceding total so its start meets the end of the first.
    beats:
      - say: |
