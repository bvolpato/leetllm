  - id: lookback
    title: How far back does tile three have to read?
    visual: Tile three follows published aggregates backwards until a completed prefix covers everything earlier. Its offset and its inclusive total stay distinct.
    beats:
      - say: |
          Another way to bring an offset into a tile is to look back at its neighbors. Start with tile three's own two points. Each tile publishes a record. An A record holds the sum of one tile. A P record holds the whole prefix through that tile. The letters tell the reader how far each number reaches.
