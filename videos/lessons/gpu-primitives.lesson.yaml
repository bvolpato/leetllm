            targets: [lookback-board]
            linger: 0.35
      - say: |
          One tile back, the three brings our running sum to five. One more tile back, four brings it to nine. The next record is a completed prefix of seven. Include it and stop. Sixteen is the inclusive total through tile three. Take out tile three's own two and its starting offset is fourteen. If order matters to the operator, combine each older range on the left.
