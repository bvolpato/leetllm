          - id: hazard-proof-step-1
            phrase: Two unordered reads alone
            targets:
              - hazard-orders
            linger: 0.55
          - id: hazard-writes
            phrase: write-after-write
            targets:
              - hazard-orders
            linger: 0.3
      - say: |
          If a lane reads past the end of the array, memcheck can flag the bad address. It also checks alignment. Use racecheck for conflicting accesses to shared memory. If some threads skip a block barrier, use synccheck. Have each tool return an error code on a finding. Save the source and the input shape so you know which path you exercised.
        hold: 0.7
        visual_cues:
          - id: hazard-proof-step-2
            phrase: If some threads skip a block barrier
            targets:
              - hazard-tools
            linger: 0.55
      - say: |
          Suppose every shared-memory handoff succeeds, but the second block starts at zero. Its first prefix should be seven. Add seven to each of its four local prefixes and compare them with the serial scan. The CPU model treats each barrier as complete while it checks the arithmetic, overflow, shuffle sources and tile boundaries. On the GPU, even a missing barrier can pass a numerical test if the writer happens to finish first.
        hold: 0.55
        visual_cues:
          - id: hazard-proof-step-3
            phrase: the second block starts at zero
            targets:
              - hazard-evidence
            linger: 0.55
          - id: hazard-offset
