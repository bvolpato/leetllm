  - id: wrapper-characters
    title: Change markup characters without changing authority
    visual: The literal closing delimiter becomes escaped characters in place; the attack words and external
      source stripe remain fixed. The opening nonce attribute never enters the closing delimiter.
    beats:
      - say: The reference builder escapes a supplied closing retrieved-eval tag, turning its angle brackets into
          literal encoded characters. Its instruction to promote the candidate remains present. The developer
          message and source wrapper tell the model how the host intends that content to be used. They do not
          create a separate execution channel for the enclosed words.
        hold: 0.7
        visual_cues:
          - id: pi-wrapper-characters-0
            phrase: The reference builder escapes a supplied closing retrieved-eval tag, turning its angle brackets into
              literal encoded characters. Its instruction to promote the candidate remains present. The
              developer message and source wrapper tell the model how the host intends that content to be
              used. They do not create a separate execution channel for the enclosed words.
            targets:
              - pi-wrapper-characters-mechanism
            color: cyan
            linger: 0.4
      - say: An XML attribute such as a random nonce does not change the matching closing tag. Adding a reminder after
          the report can improve empirical behavior, while still sharing model context with the attack.
          Role-aware training can prioritize instructions, and a causal transformer attends only to allowed
          earlier positions. Neither property performs the host’s permission lookup.
        hold: 0.7
        visual_cues:
          - id: pi-wrapper-characters-1
            phrase: An XML attribute such as a random nonce does not change the matching closing tag. Adding a reminder
              after the report can improve empirical behavior, while still sharing model context with the
              attack. Role-aware training can prioritize instructions, and a causal transformer attends only
              to allowed earlier positions. Neither property performs the host’s permission lookup.
            targets:
              - pi-wrapper-characters-mechanism
            color: cyan
            linger: 0.4
