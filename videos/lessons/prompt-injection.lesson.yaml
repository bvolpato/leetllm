  - id: reader-quarantine
    title: "What can the reader hand over?"
    visual: "Raw report text stays on the reader’s side. A bounded suite ID crosses to application code. In a separate extraction check the seven-digit input yields no suite ID, while the caller-supplied source stays fixed."
    beats:
      - say: "Give the raw report to a reader that has no tools, release credential, or unrestricted network access. It can inspect the recommendation without being able to act on it. Ordinary application code checks what comes back. A separate executor gets approved arguments and a narrow credential. This is one way to quarantine a reader. The published dual-model design also describes a privileged model working with restricted references to the reader’s results."
        hold: 0.8
        visual_cues:
          - id: reader-text
            phrase: "Give the raw report to a reader"
            targets: [reader-page]
            color: blue
            linger: 0.25
          - id: reader-executor
            phrase: "A separate executor gets approved arguments and a narrow credential"
            targets: [reader-rule, reader-host]
            color: cyan
            linger: 0.25
      - say: "Suppose the reader hands a planner a paragraph. That paragraph can carry the recommendation into a component with more power. Send a bounded field when the task allows it. A suite ID can cross here. Numbers, booleans, and a choice from a fixed list also give the host something it can check. Those fields can still be wrong, and this narrower interface gives up some open-ended planning."
        hold: 0.9
        visual_cues:
          - id: reader-fields
            phrase: "A suite ID can cross here"
            targets: [reader-crossing, reader-host]
            color: blue
            linger: 0.25
      - say: "The extractor looks for the words eval suite, then R followed by one to six digits. It finds R forty-two. The caller attaches the source identity separately. Now change the report to the seven-digit ID on the left. Could the reader keep just the first six digits?"
        hold: 1.8
        caption_starts:
          - "Now change the report"
          - "Could the reader keep just the first six digits"
        visual_cues:
          - id: reader-id
            phrase: "The extractor looks for the words eval suite"
            targets: [reader-host, reader-rule]
            color: cyan
            linger: 0.25
          - id: reader-source
            phrase: "The caller attaches the source identity separately"
            targets: [reader-host]
            color: blue
            linger: 0.25
          - id: reader-long
            phrase: "change the report to the seven-digit ID on the left"
            targets: [reader-page, reader-rule]
            color: yellow
            linger: 0.25
      - say: "That seventh digit belongs to the same ID. The extractor returns no suite ID. A letter, underscore, or hyphen right after the six digits would also rule out a partial match. The caller still knows which report this was."
        hold: 1
        visual_cues:
          - id: reader-no-id
            phrase: "the extractor returns no suite ID"
            targets: [reader-page, reader-host]
            color: cyan
            linger: 0.25
            caption_boundary: true
  - id: typed-evidence
