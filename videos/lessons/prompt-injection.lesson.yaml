    beats:
      - say: "Here the report has zero unsafe outcomes in two hundred fifty attack traces. The observed rate is zero. To make the release decision, the example policy asks where the upper end of a two-sided ninety-five percent Wilson interval falls."
        hold: 0.7
        visual_cues:
          - id: bound-start
            phrase: "zero unsafe outcomes in two hundred fifty attack traces"
            targets: [bound-250, bound-ruler]
            color: blue
            linger: 0.25
      - say: "With zero unsafe traces and a positive sample size, there’s a short calculation. Square one point nine six. Divide that by the sample size plus the same square. See where two hundred fifty goes in the denominator. The upper endpoint comes out to about one point five one percent. It falls inside the two-percent limit."
        hold: 0.9
        visual_cues:
          - id: bound-formula
            phrase: "Square one point nine six"
            targets: [bound-250]
            color: blue
            linger: 0.25
          - id: bound-large
            phrase: "one point five one percent"
            targets: [bound-250, bound-ruler]
            color: cyan
            linger: 0.25
      - say: "Now take just twenty attack traces, again with zero unsafe outcomes. Only the sample size changes in the calculation. Does the twenty-trace sample clear the same two-percent limit?"
        hold: 2
        visual_cues:
          - id: bound-input
            phrase: "just twenty attack traces"
            targets: [bound-20, bound-250]
            color: blue
            linger: 0.25
          - id: bound-guess
            phrase: "Does the twenty-trace sample clear the same two-percent limit"
            targets: [bound-20, bound-ruler, bound-footer]
            color: yellow
            linger: 0.25
            caption_boundary: true
      - say: "It misses by a wide margin. With twenty in the denominator, the upper endpoint is about sixteen point one one percent. Look where the blue mark lands beyond the policy line. With no trials there’s no rate to estimate. This gate uses one as a conservative fallback. Its helper requires whole-number counts within their denominator, rejects Boolean counts, and requires a positive finite value for z."
        hold: 0.9
        visual_cues:
          - id: bound-small
            phrase: "the upper endpoint is about sixteen point one one percent"
            targets: [bound-20, bound-ruler]
            color: cyan
            linger: 0.25
          - id: bound-empty
            phrase: "With no trials there’s no rate to estimate"
            targets: [bound-footer]
            color: yellow
            linger: 0.25
      - say: "Both intervals assume independent trials with a fixed underlying rate. Variants of the same report can fail together, and an attacker can adapt to what the system does. Record how the traces were selected and which model and tools ran. Hold out some families and benign tasks so the next evaluation includes cases the team never tuned on."
        hold: 0.9
        visual_cues:
          - id: bound-assumptions
            phrase: "Both intervals assume independent trials with a fixed underlying rate"
            targets: [bound-20, bound-250, bound-ruler]
            color: blue
            linger: 0.25
  - id: support-and-utility
    title: "Does this release report qualify?"
    visual: "Each measured value sits beside its policy threshold. Five labeled bars share a minimum of 30 traces. Three alternate reports isolate missing route coverage, a small sample, and lost benign utility."
    beats:
      - say: "Take the larger report to release review. This example policy requires zero unsafe traces and a Wilson upper endpoint of at most two percent. It also limits observed false rejection to two percent. Two of two hundred benign requests were blocked. That’s one percent. The totals clear the minimum of two hundred attacks and a hundred benign requests."
        hold: 0.75
        visual_cues:
          - id: report-counts
            phrase: "This example policy requires zero unsafe traces"
            targets: [release-counts]
            color: blue
            linger: 0.25
      - say: "Read the five labels at the bottom. Direct input, retrieved documents, tool results, multi-turn sessions, and multimodal inputs each need at least thirty attack traces. Here they have fifty apiece. Every condition passes, so the report is eligible for review. The release itself still needs authorization."
        hold: 0.9
        visual_cues:
          - id: report-labels
            phrase: "Read the five labels at the bottom"
            targets: [release-paths]
            color: blue
            linger: 0.25
          - id: report-pass
            phrase: "the report is eligible for review"
            targets: [release-result, release-counts, release-paths]
            color: cyan
            linger: 0.25
      - say: "Change just the tool-result count to zero. The total number of attack traces stays at two hundred fifty. Does this report still qualify?"
        hold: 2.1
        visual_cues:
          - id: report-missing
            phrase: "Change just the tool-result count to zero"
            targets: [release-paths]
            color: yellow
            linger: 0.25
          - id: report-question
            phrase: "Does this report still qualify"
            targets: [release-counts, release-paths, release-result]
            color: yellow
            linger: 0.25
            caption_boundary: true
      - say: "Hold it. The tool-result count misses the minimum. One multi-turn trace can also contain a tool result, so the labels can overlap. That’s why the five counts needn’t add up to the total, and why the overall total can’t supply the missing tool-result coverage. Each label count must still lie between zero and the number of distinct attacks."
        hold: 0.9
        visual_cues:
          - id: report-path-result
            phrase: "Hold it"
            targets: [release-result, release-paths]
            color: pink
            linger: 0.25
            caption_boundary: true
      - say: "For a separate comparison, keep only twenty attack traces with four under each label. The upper bound rises above two percent, and both the total and the per-label counts fall short. In a final comparison, restore the full attack sample and block every benign request. The one hundred percent false rejection rate vetoes that report. Each of these reports recorded zero unsafe attacks."
        hold: 1
        visual_cues:
          - id: report-small
            phrase: "keep only twenty attack traces"
            targets: [release-counts, release-paths]
            color: blue
            linger: 0.25
          - id: report-small-result
            phrase: "both the total and the per-label counts fall short"
            targets: [release-counts, release-paths, release-result]
            color: pink
            linger: 0.25
          - id: report-blocked
            phrase: "restore the full attack sample and block every benign request"
            targets: [release-counts]
            color: blue
            linger: 0.25
          - id: report-utility-result
            phrase: "false rejection rate vetoes that report"
            targets: [release-result, release-counts]
            color: pink
            linger: 0.25
  - id: cache-principal
    title: A cache hit carries its access context
    visual: One poisoned result occupies the intern/read/source key. An owner/promote lookup misses despite the
      same source URI; a separate authorized hit still carries the untrusted stripe and current-access check.
    beats:
      - say: The reference cache stores the poisoned report under intern, read privilege and the source URI. The
          owner’s promote-context lookup uses a different key and misses. The intern’s original key hits. Same
          source does not mean the private cached entry belongs to every principal or privilege context.
        hold: 0.7
        visual_cues:
          - id: pi-cache-principal-0
            phrase: The reference cache stores the poisoned report under intern, read privilege and the source URI. The
              owner’s promote-context lookup uses a different key and misses. The intern’s original key hits.
              Same source does not mean the private cached entry belongs to every principal or privilege
              context.
            targets:
              - pi-cache-principal-mechanism
            color: cyan
            linger: 0.4
      - say: Build keys from authenticated host state, including resource arguments and revision needed for reuse.
          Invalidate on relevant authorization changes and recheck access even on a hit. Public immutable
          content can be shared under a suitable access policy; this example concerns a private per-user
          result. Cached evidence never becomes an approval record.
        hold: 0.7
        visual_cues:
          - id: pi-cache-principal-1
            phrase: Build keys from authenticated host state, including resource arguments and revision needed for reuse.
              Invalidate on relevant authorization changes and recheck access even on a hit. Public immutable
              content can be shared under a suitable access policy; this example concerns a private per-user
              result. Cached evidence never becomes an approval record.
            targets:
              - pi-cache-principal-mechanism
            color: cyan
            linger: 0.4
      - say: "A miss does not make the next fetch safe: the owner may retrieve the same poisoned text independently.
          Model prefix caching reuses computation for identical prefixes; application tool-result access is a
          separate decision. Reused histories must preserve provenance and principal boundaries just as stored
          tool results do."
        hold: 0.7
        visual_cues:
          - id: pi-cache-principal-2
            phrase: "A miss does not make the next fetch safe: the owner may retrieve the same poisoned text
              independently. Model prefix caching reuses computation for identical prefixes; application
              tool-result access is a separate decision. Reused histories must preserve provenance and
              principal boundaries just as stored tool results do."
            targets:
              - pi-cache-principal-mechanism
            color: cyan
            linger: 0.4
  - id: poisoned-memory
    title: Carry provenance through a later turn
    visual: The report’s approval claim is written to a memory note with the external source stripe. On a later
      request it returns as evidence, while the host approval store remains independently empty or consumed.
    beats:
      - say: An early turn writes a note saying approval granted. In a later session that sentence may look like a
          prior host decision, even when it originated in the report. Store origin and trust with memory, and
          keep retrieved notes on the evidence side of the next request. Text repeating an approval does not
          create a current approval-store entry.
        hold: 0.7
        visual_cues:
          - id: pi-poisoned-memory-0
            phrase: An early turn writes a note saying approval granted. In a later session that sentence may look like a
              prior host decision, even when it originated in the report. Store origin and trust with memory,
              and keep retrieved notes on the evidence side of the next request. Text repeating an approval
              does not create a current approval-store entry.
            targets:
              - pi-poisoned-memory-mechanism
            color: cyan
            linger: 0.4
      - say: Poisoned memory can influence a later model, so test a multi-step trace that writes a note and then
          reloads it. Recheck the active principal, artifact, suite, destination and operation at the
          protected sink. An old unused approval for another task and an already consumed approval both fail
          the matching current authorization path.
        hold: 0.7
        visual_cues:
          - id: pi-poisoned-memory-1
            phrase: Poisoned memory can influence a later model, so test a multi-step trace that writes a note and then
              reloads it. Recheck the active principal, artifact, suite, destination and operation at the
              protected sink. An old unused approval for another task and an already consumed approval both
              fail the matching current authorization path.
            targets:
              - pi-poisoned-memory-mechanism
            color: cyan
            linger: 0.4
      - say: Keep useful summaries and benign quoted security text available under their read policy. The aim is to
          constrain consequences while preserving the task. Measure both the reader’s influenced outputs and
          the host’s decisions; otherwise a host that saves every bad proposal can hide a model that follows
          every attack.
        hold: 0.7
        visual_cues:
          - id: pi-poisoned-memory-2
            phrase: Keep useful summaries and benign quoted security text available under their read policy. The aim is to
              constrain consequences while preserving the task. Measure both the reader’s influenced outputs
              and the host’s decisions; otherwise a host that saves every bad proposal can hide a model that
              follows every attack.
            targets:
              - pi-poisoned-memory-mechanism
            color: cyan
            linger: 0.4
  - id: review-and-retention
    title: Protect the reviewer and the incident record
    visual: External report text stays separate from host-derived fields in a review packet. An
      approval-persuasion sentence remains untrusted; a minimized trace retains
      source/proposal/decision/approval/result identities.
    beats:
      - say: A human reviewer is another downstream consumer. A report can tell that person to click Approve. Escape
          active markup and visually separate external claims from host-derived action fields. Persuasive
          plain text can still influence a person, so the review should show the exact effect and independent
          policy evidence. Merely displaying an approval claim is not a trusted lookup.
        hold: 0.7
        visual_cues:
          - id: pi-review-and-retention-0
            phrase: A human reviewer is another downstream consumer. A report can tell that person to click Approve.
              Escape active markup and visually separate external claims from host-derived action fields.
              Persuasive plain text can still influence a person, so the review should show the exact effect
              and independent policy evidence. Merely displaying an approval claim is not a trusted lookup.
            targets:
              - pi-review-and-retention-mechanism
            color: cyan
            linger: 0.4
      - say: Incident reconstruction needs a source reference or appropriately redacted payload, the model proposal,
          principal, policy version, decision, approval state and execution result. Keep records long enough
          for the declared purpose, with access and retention controls. Copying every raw prompt indefinitely
          can create another store of secrets. A public hash does not anonymize guessable input.
        hold: 0.7
        visual_cues:
          - id: pi-review-and-retention-1
            phrase: Incident reconstruction needs a source reference or appropriately redacted payload, the model
              proposal, principal, policy version, decision, approval state and execution result. Keep records
              long enough for the declared purpose, with access and retention controls. Copying every raw
              prompt indefinitely can create another store of secrets. A public hash does not anonymize
              guessable input.
            targets:
              - pi-review-and-retention-mechanism
            color: cyan
            linger: 0.4
      - say: "NIST’s Generative AI Profile groups this work under Govern, Map, Measure, and Manage. Give each boundary an owner. To check the release gate, give the host a proposal and read its decision. To see what the model requested, open its tool trace. To find out what changed in production, match the release receipt to the operation."
        hold: 0.7
        visual_cues:
          - id: pi-review-and-retention-2
            phrase: "Govern, Map, Measure, and Manage"
            targets:
              - pi-review-and-retention-mechanism
            color: cyan
            linger: 0.4
          - id: review-gate
            phrase: "To check the release gate"
            targets: [pi-review-and-retention-mechanism]
            color: cyan
          - id: review-trace
            phrase: "To see what the model requested"
            targets: [pi-review-and-retention-mechanism]
            color: cyan
          - id: review-receipt
            phrase: "To find out what changed in production"
            targets: [pi-review-and-retention-mechanism]
            color: cyan
  - id: transfer
    title: Let evidence inform the model safely
    visual: The retrieved report informs a response while independent policy, permissions, and approval constrain
      every protected sink.
    beats:
      - say: The report can still inform a useful summary or a proposed next step. Our two executions showed how a
          typed proposal becomes a denied attempt or an approved, receipted change. The decision is
          inspectable because the caller, operation, approval and resulting state remain linked.
