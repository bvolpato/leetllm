  - id: schema-falsehood
    title: A valid shape can describe the wrong evidence
    visual: The same schema-valid record changes passed to failed or switches suite identity while the host source
      remains fixed. A clipped quotation visibly loses its condition before the host requests the full
      passage.
    beats:
      - say: "Give the reader a schema-valid lie: the source says failed, while its gate field says passed. The
          exact-source comparison rejects it even though every field has the expected type. A genuine source
          ID from another suite also fails the expected candidate, suite and version binding. An instruction
          detector need not flag either discrepancy."
        hold: 0.7
        visual_cues:
          - id: pi-schema-falsehood-0
            phrase: "Give the reader a schema-valid lie: the source says failed, while its gate field says passed. The
              exact-source comparison rejects it even though every field has the expected type. A genuine
              source ID from another suite also fails the expected candidate, suite and version binding. An
              instruction detector need not flag either discrepancy."
            targets:
              - pi-schema-falsehood-mechanism
            color: cyan
            linger: 0.4
          - id: pi-false-reject
            phrase: The exact-source comparison rejects it even though every field has the expected type.
            targets:
              - pi-schema-falsehood-mechanism
            color: cyan
            linger: 0.4
      - say: A quotation can be accurate yet misleading when it omits a condition. Preserve the supporting passage and
          distinguish a necessary approval from sufficient release permission. A report for an earlier
          artifact can be factually correct and operationally stale. Immutable artifact and evaluation
          revisions identify what was checked; a mutable latest label cannot do that alone.
        hold: 0.7
        visual_cues:
          - id: pi-schema-falsehood-1
            phrase: A quotation can be accurate yet misleading when it omits a condition. Preserve the supporting passage
              and distinguish a necessary approval from sufficient release permission. A report for an earlier
              artifact can be factually correct and operationally stale. Immutable artifact and evaluation
              revisions identify what was checked; a mutable latest label cannot do that alone.
            targets:
              - pi-schema-falsehood-mechanism
            color: cyan
            linger: 0.4
      - say: When support is unresolved, return the known metrics and unresolved eligibility. At execution, recheck
          the current facts that policy requires. Schema validation, factual evidence verification and
          authorization are three separate operations. The same visible record must pass each relevant
          boundary before it can inform a protected effect.
        hold: 0.7
        visual_cues:
          - id: pi-schema-falsehood-2
            phrase: When support is unresolved, return the known metrics and unresolved eligibility. At execution, recheck
              the current facts that policy requires. Schema validation, factual evidence verification and
              authorization are three separate operations. The same visible record must pass each relevant
              boundary before it can inform a protected effect.
            targets:
              - pi-schema-falsehood-mechanism
            color: cyan
            linger: 0.4
  - id: selector-feedback
    title: A later result must not rewrite a committed action
    visual: A summary-only action is selected before the report arrives. The return path ends at evidence output;
      an alternate recurrent-selector path lets hostile text select an allowlisted promotion and is visibly
      blocked by policy.
    beats:
      - say: The action-selector pattern translates the initial request into predefined actions without feeding later
          tool-result text back into action selection. A report then cannot choose a different next action
          through that feedback route. A summary-only request stays a summary task. Arguments and disclosures
          still need the authorized task’s own checks.
        hold: 0.7
        visual_cues:
          - id: pi-selector-feedback-0
            phrase: The action-selector pattern translates the initial request into predefined actions without feeding
              later tool-result text back into action selection. A report then cannot choose a different next
              action through that feedback route. A summary-only request stays a summary task. Arguments and
              disclosures still need the authorized task’s own checks.
            targets:
              - pi-selector-feedback-mechanism
            color: cyan
            linger: 0.4
      - say: "A plain tool-name allowlist is weaker. If the model selects again after reading hostile results, it can
          choose a harmful allowed action. Even a fixed send-email tool can leak through an attacker-chosen
          recipient. The selector’s restriction costs flexibility: document-dependent action choices must be
          encoded into the controlled workflow or handled by another checked design."
        hold: 0.7
        visual_cues:
          - id: pi-selector-feedback-1
            phrase: "A plain tool-name allowlist is weaker. If the model selects again after reading hostile results, it
              can choose a harmful allowed action. Even a fixed send-email tool can leak through an
              attacker-chosen recipient. The selector’s restriction costs flexibility: document-dependent
              action choices must be encoded into the controlled workflow or handled by another checked
              design."
            targets:
              - pi-selector-feedback-mechanism
            color: cyan
            linger: 0.4
  - id: strict-proposal
    title: Validate decoded fields before checking permission
    visual: The actual three-key proposal parser admits a complete record, then separately rejects extra keys,
      duplicated action, Boolean suite and oversized IDs. A UTF-8 byte ribbon grows differently from the
      character counter.
    beats:
      - say: The reference action parser accepts exactly action, candidate ID and eval suite, all strings. Actions are
          answer-eval or request-promotion. Candidate and suite identifiers have their own bounded patterns.
          Duplicate JSON keys are rejected while decoding, before a parser can silently overwrite one action
          with another. Extra fields and a Boolean suite are rejected too.
        hold: 0.7
        visual_cues:
          - id: pi-strict-proposal-0
            phrase: The reference action parser accepts exactly action, candidate ID and eval suite, all strings. Actions
              are answer-eval or request-promotion. Candidate and suite identifiers have their own bounded
              patterns. Duplicate JSON keys are rejected while decoding, before a parser can silently
              overwrite one action with another. Extra fields and a Boolean suite are rejected too.
            targets:
              - pi-strict-proposal-mechanism
            color: cyan
            linger: 0.4
      - say: The fixture limits input to five hundred twelve characters. Three hundred copies of an accented character
          occupy three hundred Python characters but six hundred UTF-eight bytes. A real receiver needs a byte
          limit before decoding as well. The character limit does not establish the same transport bound.
        hold: 0.7
        visual_cues:
          - id: pi-strict-proposal-1
            phrase: The fixture limits input to five hundred twelve characters. Three hundred copies of an accented
              character occupy three hundred Python characters but six hundred UTF-eight bytes. A real
              receiver needs a byte limit before decoding as well. The character limit does not establish the
              same transport bound.
            targets:
              - pi-strict-proposal-mechanism
            color: cyan
            linger: 0.4
      - say: OpenAI Structured Outputs constrains a complete non-refusal response to its supported schema subset;
          ordinary JSON mode provides valid JSON without the same shape contract. Handle refusal and
          incomplete response paths before dispatch. A schema-valid promotion can still request the wrong
          candidate, target or operation. Keep parsing separate from permission.
        hold: 0.7
        visual_cues:
          - id: pi-strict-proposal-2
            phrase: OpenAI Structured Outputs constrains a complete non-refusal response to its supported schema subset;
              ordinary JSON mode provides valid JSON without the same shape contract. Handle refusal and
              incomplete response paths before dispatch. A schema-valid promotion can still request the wrong
              candidate, target or operation. Keep parsing separate from permission.
            targets:
              - pi-strict-proposal-mechanism
            color: cyan
