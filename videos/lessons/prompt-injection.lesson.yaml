            color: blue
            linger: 0.6
          - id: trust-labels-beat-2-focus-2
            phrase: A source label and clear delimiters help the
            targets:
              - trust-labels-object-report-source-7
            color: blue
            linger: 0.6
      - say: >
          Keep the full text available for factual review and preserve its source label. External content
          remains evidence even when a detector raises no alert.
        hold: 0.55
        visual_cues:
          - id: trust-labels-beat-3-focus-1
            phrase: available for factual review and preserve its source
            targets:
