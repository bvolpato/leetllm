scenes:
  - id: subject-intro
    title: "Will C17 get live traffic?"
    visual: "A yellow slip asking for 25% of live traffic slides out from an evaluation report. The author’s recommendation stays on the page. The release service shows C17’s current traffic and looks for approval before deciding."
    beats:
      - say: "The assistant is asking for a quarter of live traffic. You asked for a summary. Follow the slip back to the report. C seventeen passed its tests. The author recommends release. The assistant took that recommendation as an instruction."
        hold: 0.6
        caption_starts:
          - "You asked for a summary"
          - "Follow the slip back to the report"
          - "The assistant took that recommendation as an instruction"
        visual_cues:
          - id: intro-source
            phrase: "You asked for a summary"
            targets: [intro-report]
            color: blue
            linger: 0.25
          - id: intro-result
            phrase: "C seventeen passed its tests"
            targets: [intro-report]
            color: blue
            linger: 0.25
          - id: intro-request
            phrase: "The author recommends release"
            targets: [intro-report]
            color: yellow
            linger: 0.25
          - id: intro-proposal-moves
            phrase: "The assistant is asking for a quarter of live traffic"
            targets: [intro-proposal, intro-report]
            color: yellow
            linger: 0.25
      - say: "C seventeen currently gets zero live traffic. To change that, the release service needs a matching approval. Its lookup comes back empty. Should the service apply the proposed twenty-five percent?"
        hold: 2.1
        visual_cues:
          - id: intro-lookup
            phrase: "Its lookup comes back empty"
            targets: [intro-release]
            color: cyan
            linger: 0.25
          - id: intro-question
            phrase: "Should the service apply the proposed twenty-five percent"
            targets: [intro-proposal, intro-release, intro-decision]
            color: yellow
            linger: 0.25
            caption_boundary: true
      - say: "C seventeen stays at zero. The service denies the release. The assistant can still summarize the test result. A sentence in a report steered the assistant away from your task. That’s prompt injection. Text in a user message or a tool result can do the same thing."
        hold: 0.8
        caption_starts:
          - "The assistant can still summarize the test result"
          - "That’s prompt injection"
        visual_cues:
          - id: intro-answer
            phrase: "C seventeen stays at zero"
            targets: [intro-release, intro-decision]
            color: cyan
            linger: 0.25
            caption_boundary: true
          - id: intro-summary
            phrase: "The assistant can still summarize the test result"
            targets: [intro-decision, intro-report]
            color: blue
            linger: 0.25
  - id: entry-and-objective
    title: "How did the recommendation get here?"
    visual: "Two copies of the same external excerpt enter through different inputs. Each route retains its source. Both lead to the same requested change and the same authenticated read task."
    beats:
      - say: "Keep the report author and the sentence fixed. In the first case a colleague pastes the excerpt into chat. The words came in through the user’s message. That’s direct prompt injection. In the second case the assistant fetches the report. That’s indirect injection. An ordinary request for a summary can bring in the very same text."
        hold: 0.85
        visual_cues:
          - id: entry-source
            phrase: "Keep the report author and the sentence fixed"
            targets: [entry-origin]
            color: blue
            linger: 0.25
          - id: entry-paste
            phrase: "a colleague pastes the excerpt into chat"
            targets: [entry-paste]
            color: blue
            linger: 0.25
          - id: entry-fetch
            phrase: "the assistant fetches the report"
            targets: [entry-fetch]
            color: blue
            linger: 0.25
      - say: "Both passages try to turn the summary into a release. That targets the application’s policy. A jailbreak targets the model’s own safety training. An attempt can do both. Translation, a suffix, or a conversation spread across turns can change how a passage reaches the model. An image or recording can carry it too. Keep the original source label on any text you extract or transcribe."
        hold: 0.8
        visual_cues:
          - id: entry-objective
            phrase: "Both passages try to turn the summary into a release"
            targets: [entry-effect, entry-paste, entry-fetch]
            color: cyan
            linger: 0.25
          - id: entry-media
            phrase: "An image or recording can carry it too"
            targets: [entry-effect, entry-origin]
            color: blue
            linger: 0.25
      - say: "The host gets the user’s identity from the signed-in session. Here that user may summarize an accessible evaluation. Reading it gives the user no release permission. Even an authenticated connector can deliver someone else’s words. Its tool descriptions enter the model’s context before a call, and its results enter afterward. Check the source of both."
        hold: 0.9
        visual_cues:
          - id: entry-session
            phrase: "the user’s identity from the signed-in session"
            targets: [entry-effect]
            color: cyan
            linger: 0.25
  - id: separate-harms
    title: Close each path to a protected effect
    visual: A private-note payload and a promotion proposal share the influenced model. Remove the private input
      to close disclosure while leaving the independent write route visibly connected.
    beats:
      - say: "Simon Willison’s lethal trifecta describes an exfiltration path: private data, untrusted content and a
          way to communicate externally. Our report can redirect an influenced model toward sending private
          notes. Removing the notes from that reader closes this direct route to those notes. Enforce
          destination and disclosure policy on remaining outputs too."
        hold: 0.7
        visual_cues:
          - id: pi-separate-harms-0
            phrase: "Simon Willison’s lethal trifecta describes an exfiltration path: private data, untrusted content and
              a way to communicate externally. Our report can redirect an influenced model toward sending
              private notes. Removing the notes from that reader closes this direct route to those notes.
              Enforce destination and disclosure policy on remaining outputs too."
            targets:
              - pi-separate-harms-mechanism
            color: cyan
            linger: 0.4
      - say: The production-write route survives that removal. It needs no secret to request a bad deployment. A
          protected sink is any endpoint where generated output can disclose information or change state.
          Final answers, URLs, attachments, tool arguments, memory and logs can all carry consequences. A
          read-named HTTP tool still transmits its path, headers and body.
        hold: 0.7
        visual_cues:
          - id: pi-separate-harms-1
            phrase: The production-write route survives that removal. It needs no secret to request a bad deployment. A
              protected sink is any endpoint where generated output can disclose information or change state.
              Final answers, URLs, attachments, tool arguments, memory and logs can all carry consequences. A
              read-named HTTP tool still transmits its path, headers and body.
            targets:
              - pi-separate-harms-mechanism
            color: cyan
            linger: 0.4
      - say: "Give the reader the report and leave every tool that can change state out of its reach. Only the executor gets the release credential, scoped to the approved endpoint. For a browser or code runner, the host also limits which files it can open and where it can connect. Check those permissions on the running process."
        hold: 0.7
        visual_cues:
          - id: pi-separate-harms-2
            phrase: "Give the reader the report and leave every tool that can change state out of its reach. Only the executor gets the release credential, scoped to the approved endpoint. For a browser or code runner, the host also limits which files it can open and where it can connect. Check those permissions on the running process."
            targets:
              - pi-separate-harms-mechanism
            color: cyan
            linger: 0.4
  - id: trust-labels
    title: Mark where evidence came from
    visual: The report keeps its source label as its factual and hostile sentences enter the context as untrusted
      data.
    beats:
      - say: >
          The host fetched this report from an evaluation service. That fetch tells us where the text came
          from, but the report may contain material written by another person or produced by an external
          system.
        hold: 0.55
        motion_check:
          region:
            - 150
            - 350
            - 1620
            - 500
          minimumChangedFraction: 0.002
        visual_cues:
          - id: trust-labels-beat-1-focus-1
            phrase: The host fetched this report from an evaluation service
            targets:
              - trust-labels-object-report-source-7
            color: blue
            linger: 0.6
      - say: >
          A source label and clear delimiters help the model and reviewer distinguish application instructions
          from retrieved evidence. Escaping a closing tag protects the wrapper's structure. The words inside
          the wrapper can still influence the model.
        hold: 0.7
        motion_check:
          region:
            - 150
            - 350
            - 1620
            - 500
          minimumChangedFraction: 0.002
        visual_cues:
