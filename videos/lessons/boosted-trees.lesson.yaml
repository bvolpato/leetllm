            linger: 0.4
          - id: goss-weight
            phrase: each retained small row receives inverse-probability weight two
            targets:
              - sampling-categorical-model
            color: yellow
            linger: 0.35
      - say: Exclusive feature bundling packs sparse columns with little overlap into disjoint bin ranges. If A and B never activate on the same row, zero can represent neither, one can represent A, and two can represent B in a binary toy. A row with both active breaks that collision-free encoding. When both features can be active, record how the bundle encodes that conflict.
        hold: 0.6
        visual_cues:
          - id: sampling-categorical-step-2
            phrase: Exclusive feature bundling packs sparse columns with little overlap into disjoint bin ranges
            targets:
