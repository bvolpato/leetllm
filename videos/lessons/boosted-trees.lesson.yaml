scenes:
  - id: opening
    title: "How far should we move the prediction?"
    visual: "A training job's clock runs past the six-hour prediction and stops at twenty hours late. The job travels to its own leaf. On the same ruler, the error divides into quarters and the next prediction moves one quarter."
    beats:
      - say: "We predicted a six-hour delay. The job kept running. It finished twenty hours late. Follow it down the large-input branch. It's the only job in this leaf, so the leaf learns this job's whole error. Fourteen hours."
        hold: 1.1
        caption_starts: ["The job kept running", "It finished twenty hours late", "Follow it down", "Fourteen hours"]
        visual_cues:
          - id: opening-finish
            phrase: "It finished twenty hours"
            targets: [job-clock]
            color: cyan
            linger: 0
          - id: opening-leaf
            phrase: "down the large-input branch"
            targets: [job-leaf]
            color: cyan
            linger: 0.2
          - id: opening-gap
            phrase: "Fourteen hours"
            targets: [delay-gap]
            color: yellow
            linger: 0.35
      - say: "The learning rate is one quarter. Start at six hours and take one of those four equal steps. Where will the prediction land?"
        hold: 3
        caption_starts: ["Where will the prediction land"]
        visual_cues:
          - id: opening-quarters
            phrase: "The learning rate is one quarter"
            targets: [delay-gap]
            color: cyan
            linger: 0.2
      - say: "Nine and a half hours. This tree added three and a half hours to the old prediction. The next tree learns from the errors that remain. That's gradient boosting. Let's use it to flag training jobs at risk of missing a deadline."
        hold: 1.2
        caption_starts: ["Nine and a half hours", "This tree added", "The next tree"]
        visual_cues:
          - id: opening-step
            phrase: "Nine and a half hours"
            targets: [delay-prediction]
            color: yellow
            linger: 0.35
  - id: clock
    title: Which jobs can the trees learn from?
    visual: Job rows move from January through March into fitting, April into model and policy selection, and May into a single frozen evaluation.
    beats:
      - say: Start with the jobs from January through March. Their errors tell the trees where to split and how far to move each prediction.
        hold: 0.55
        visual_cues:
          - id: clock-beat-1-focus-1
            phrase: Their errors tell the trees where to split
            targets:
              - clock-object-rows-missed-deadlines-6
            color: blue
            linger: 0.6
          - id: clock-beat-1-focus-2
            phrase: Start with the jobs from January through March
            targets:
              - clock-object--5
            color: blue
            linger: 0.6
      - say: On April jobs, choose how many trees to keep. Then use that model's April scores to choose the alert cutoff.
        hold: 0.6
        visual_cues:
          - id: clock-beat-2-focus-1
            phrase: On April jobs
            targets:
              - clock-object--5
            color: blue
            linger: 0.6
      - say: Freeze those two choices. May shows how the same trees and cutoff handle the next month's jobs.
        hold: 0.7
        visual_cues:
          - id: clock-beat-3-focus-1
            phrase: May shows how the same trees and cutoff handle the next month's jobs
            targets:
              - clock-object--5
            color: blue
            linger: 0.6
  - id: eligible-signals
    title: Make every input and label available in time
    visual: A heartbeat arrives before the decision. A diagnostic and a final label arrive too late for their respective cutoffs. A missing heartbeat then follows the histogram classifier's fallback branch.
    beats:
      - say: Boosted trees did well on tables of around ten thousand rows in a twenty twenty-two benchmark. A later Tab P F N study found a competitive neural model on small tables. Our test is about scheduling. Can the trees catch late jobs more cheaply than a simple alert rule? In these simulated jobs, the large-model flag turns on when input size reaches nine hundred gigabytes.
        hold: 0.6
        visual_cues:
          - id: eligible-signals-step-1
            phrase: Boosted trees did well on tables of around ten thousand rows
            targets:
              - eligible-signals-model
            color: blue
            linger: 0.4
      - say: The heartbeat arrived before the scheduler had to act. The diagnostic arrived afterward, so leave it out. Now look at the training cutoff. A March job still running on April first has no final label yet. It has to wait for a later training run. Our simulated rows assume those checks have passed. With real logs, join features and outcomes by their arrival times and keep rows from the same incident on one side of the split, or remove the overlap.
        hold: 0.6
        visual_cues:
          - id: eligible-signals-step-2
            phrase: The heartbeat arrived before the scheduler had to act
            targets:
              - eligible-signals-model
            color: blue
            linger: 0.4
          - id: eligibility-cutoff
            phrase: The diagnostic arrived afterward
            targets:
              - eligible-signals-model
            color: yellow
            linger: 0.35
      - say: What happens if the heartbeat is missing? The classic classifier used here rejects a missing value, or NaN. The scikit-learn histogram gradient boosting classifier learns which way to send missing values. If it saw none for that feature during training, it uses the child with more training rows. Twelve training rows on the left and five on the right therefore send a new NaN left. Check the resulting scores on jobs with missing telemetry. If you fill in missing values, fit that imputer on the training rows. Test unseen categories separately.
        hold: 0.8
        caption_starts: ["The classic classifier", "The scikit-learn histogram", "Twelve training rows"]
        visual_cues:
          - id: eligible-signals-step-3
            phrase: What happens if the heartbeat is missing
            targets:
              - eligible-signals-model
            color: green
            linger: 0.4
          - id: eligibility-nan
            phrase: Twelve training rows on the left and five on the right therefore send a new NaN left
            targets:
              - eligible-signals-model
            color: yellow
            linger: 0.35
  - id: residual
    title: A tree fits the remaining error
    visual: Three actual delays connect to an initial prediction of six hours. Signed residuals split into a shared two-row leaf and a separate large-model leaf, then a quarter-sized correction moves the predictions.
    beats:
      - say: For a transparent first step, predict delay hours for three jobs with a starting value of six. Their actual delays are two, eight, and twenty hours. Subtract the prediction from each outcome to reveal what the current model leaves behind.
        hold: 0.55
        visual_cues:
          - id: residual-beat-1-focus-1
            phrase: For a transparent first step
            targets:
              - residual-simulation-7
            color: blue
            linger: 0.6
          - id: residual-beat-1-focus-2
            phrase: predict delay hours for three jobs with a starting value of six
            targets:
              - residual-object-start-top-8
            color: blue
            linger: 0.6
      - say: The residuals are minus four, plus two, and plus fourteen. Suppose a shallow tree groups the first two jobs and gives the large-model job its own leaf. The average correction is minus one for the shared leaf and plus fourteen for the other.
        hold: 0.65
        visual_cues:
          - id: residual-beat-2-focus-1
            phrase: The residuals are minus four, plus two, and plus fourteen.
            targets:
              - residual-simulation-7
            color: blue
            linger: 0.6
          - id: residual-beat-2-focus-2
            phrase: the first two jobs and gives the large-model
            targets:
              - residual-object-large-model-row-14
            color: blue
            linger: 0.6
          - id: gbt-residual-leaf-means
            phrase: The average correction is minus one for the shared leaf and plus fourteen for the other.
            targets:
              - residual-object-snapshot-corrections-mean-residual-snapshot-correc-15
            color: cyan
            linger: 0
      - say: With a learning rate of one quarter, each leaf contributes only a quarter of its proposed move. The new predictions become five point seven five, five point seven five, and nine point five. Mean squared error falls from seventy-two to about forty-three point one three hours squared. The second job gets worse because it shares a leaf with the first; average improvement does not improve every row.
        hold: 0.75
        motion_check:
          region:
            - 235
            - 320
            - 1480
            - 650
          minimumChangedFraction: 0.002
        visual_cues:
          - id: residual-beat-3-focus-1
            phrase: With a learning rate of one quarter
            targets:
              - residual-simulation-7
            color: blue
            linger: 0.6
          - id: residual-beat-3-focus-2
            phrase: Mean squared error falls from seventy-two to about
            targets:
              - residual-simulation-7
              - residual-current-mse
            color: blue
            linger: 0.6
          - id: residual-new-predictions
            phrase: With a learning rate of one quarter, each leaf contributes only a quarter of its proposed move
            targets:
              - residual-simulation-7
            color: green
            linger: 0.3
  - id: classification
    title: Classification trees move a log-odds score
    visual: Three rows start at probability one half. Their binary labels set opposite loss-gradient directions; a sigmoid maps the changing additive logit back into probability.
    beats:
      - say: The scheduler predicts a label, so the classifier works with a different quantity from delay hours. Its trees add to a raw score called the logit. A sigmoid converts that score to a probability between zero and one. Compute the sigmoid as one divided by the quantity one plus the exponential of the negative logit.
        hold: 0.55
        visual_cues:
          - id: classification-beat-1-focus-1
            phrase: The scheduler predicts a label
            targets:
              - classification-origin
            color: blue
            linger: 0.6
          - id: classification-beat-1-focus-2
            phrase: Its trees add to a raw score called the logit
            targets:
              - classification-object-trees-add-to-z-sigmoid-reads-p-26
            color: blue
            linger: 0.6
      - say: At a logit of zero, the probability is one half. For binary log loss, the derivative with respect to the logit is probability minus the observed label. A missed job pushes the score upward; a job that finishes on time pushes it downward.
        hold: 0.65
        visual_cues:
          - id: classification-beat-2-focus-1
            phrase: At a logit of zero
            targets:
              - classification-simulation-22
            color: blue
            linger: 0.6
      - say: The signs describe a local correction direction. A fitted classification tree also chooses partitions and loss-aware leaf values, then adds a shrunken update to the ensemble. The regression residual example gives the intuition; this gradient supplies the classification-specific signal.
        hold: 0.7
        visual_cues:
          - id: classification-beat-3-focus-1
            phrase: A fitted classification tree also chooses partitions and loss-aware leaf values
            targets:
              - classification-fitted-tree
            color: blue
            linger: 0.6
          - id: classification-beat-3-focus-2
            phrase: The signs describe a local correction direction
            targets:
              - classification-simulation-22
            color: blue
            linger: 0.6
          - id: classification-tree-update
            phrase: then adds a shrunken update to the ensemble
            targets:
              - classification-fitted-tree
              - classification-shrunken-update
              - classification-simulation-22
            color: green
            linger: 0.4
  - id: curvature-split
    title: "How much is another leaf worth?"
    visual: "The slope and curvature of the loss set a leaf's best weight. A worked fork replaces one parent saving with two child savings and pays for one extra leaf. An isolated confident error shows the effect of lambda."
    beats:
      - say: "For a job that missed, log loss uses the negative log of the probability of a miss. For an on-time job it uses the negative log of the probability of finishing on time. Differentiate with respect to the logit. The first derivative is probability minus label. For the second, multiply the probability of a miss by the probability of finishing on time. Those are the gradient and the curvature. One half makes the signs easy to see. The scheduler's fitted classifier actually starts at the training miss rate, a hundred and nineteen out of three hundred and sixty."
        hold: 0.8
        visual_cues:
          - id: curvature-split-step-1
            phrase: "Differentiate with respect to the logit"
            targets: [curvature-split-model]
            color: cyan
            linger: 0.2
      - say: "Suppose the tree sends several jobs to the same leaf. They all get the same move. Add their gradients to get capital G, and their curvatures to get capital H. The curve shows how X G Boost approximates their change in loss as we vary that move. Lambda adds a penalty for large weights. At the bottom the slope is zero. Add lambda to H, then divide negative G by that sum to get the weight. That's the best move for these jobs under the quadratic approximation."
        hold: 1.1
        visual_cues:
          - id: curvature-split-step-2
            phrase: "The curve shows how X G Boost approximates their change in loss"
            targets: [curvature-split-model]
            color: cyan
            linger: 0.2
          - id: leaf-optimum
            phrase: "Add lambda to H, then divide negative G by that sum to get the weight"
            targets: [curvature-split-model]
            color: yellow
            linger: 0.35
            caption_boundary: true
      - say: "Now let one leaf become two. In this example the parent gradients cancel, so its best move saves nothing. Split the jobs. The left gradients sum to minus one and the right gradients sum to plus one. Each side has curvature one. With lambda one, divide each child's squared gradient by the sum of its curvature and one. Half of that is the saving. Each child saves a quarter. Together they save half a unit. One leaf became two, so charge gamma once. At a quarter per extra leaf, the net gain is a quarter. A positive gain earns the split in this example. A minimum child size or curvature can still block it, and the learning rate scales the move we actually apply."
        hold: 1.15
        visual_cues:
          - id: curvature-split-step-3
            phrase: "Now let one leaf become two"
            targets: [curvature-split-model]
            color: cyan
            linger: 0.2
          - id: gain-fork
            phrase: "Split the jobs"
            targets: [curvature-split-model]
            color: cyan
            linger: 0.2
          - id: gain-children
            phrase: "Each child saves a quarter"
            targets: [curvature-split-model]
            color: yellow
            linger: 0.35
            caption_boundary: true
          - id: gain-charge
            phrase: "charge gamma once"
            targets: [curvature-split-model]
            color: cyan
            linger: 0.2
          - id: gain-paid
            phrase: "the net gain is a quarter"
            targets: [curvature-split-model]
            color: yellow
            linger: 0.35
            caption_boundary: true
      - say: "Look at the bottom row. The job missed, but the model gave it just a one percent chance. Its gradient is minus point nine nine and its curvature is about one hundredth. Divide by that tiny curvature alone and the proposed weight is a hundred. Add one to the denominator and the weight falls to about point nine eight. The top row has the same small curvature. Its prediction was nearly right, so its gradient is tiny too. You need both numbers to understand the move. Some configurations also cap the step."
        hold: 1.15
        visual_cues:
          - id: curvature-split-step-4
            phrase: "Look at the bottom row"
            targets: [curvature-split-model]
            color: cyan
            linger: 0.2
          - id: gbt-curvature-hundred
            phrase: "the proposed weight is a hundred"
            targets: [curvature-split-model]
            color: yellow
            linger: 0.35
            caption_boundary: true
          - id: curvature-regularize
            phrase: "the weight falls to about point nine eight"
            targets: [curvature-split-model]
            color: yellow
            linger: 0.35
            caption_boundary: true
  - id: histogram-scan
    title: "Where should this tree split?"
    visual: "One cut passes between four ordered bins. Each bin joins the left sum as the cursor passes it. The three gains remain under the tape so the winning boundary can be revisited."
    beats:
      - say: "Here are four training jobs, ordered by one feature and placed in separate bins. The first two missed their deadlines. The others finished on time. In this four-job example the model gave every job a probability of one half. Subtract each label from that probability. A miss contributes minus one half, an on-time job plus one half. Each contributes a quarter of curvature. In the parent the gradients cancel, and the curvatures add to one. We'll use lambda one and charge nothing for an extra leaf."
        hold: 1.1
        visual_cues:
          - id: histogram-scan-step-1
            phrase: "four training jobs"
            targets: [histogram-scan-model]
            color: cyan
            linger: 0.2
          - id: histogram-deposit
            phrase: "a miss contributes minus one half, an on-time job plus one half"
            targets: [histogram-scan-model]
            color: cyan
            linger: 0.2
          - id: hist-parent-sum
            phrase: "the gradients cancel, and the curvatures add to one"
            targets: [histogram-scan-model]
            color: cyan
            linger: 0.2
      - say: "Slide the cut just past bin one. That puts a single miss on the left. Its gradient is minus one half and its curvature is a quarter. Subtract that pair from the parent to get the right side. For each side, add one to its curvature. Divide its squared gradient by that number. Add the two results and halve the sum. The parent term is zero here. The gain is six thirty-fifths, about point one seven one. The proposed leaf weights are point four on the left and negative two sevenths on the right."
        hold: 1.2
        visual_cues:
          - id: histogram-cut-one
            phrase: "Slide the cut just past bin one"
            targets: [histogram-scan-model]
            color: cyan
            linger: 0.2
          - id: histogram-gain-one
            phrase: "The gain is six thirty-fifths, about point one seven one"
            targets: [histogram-scan-model]
            color: yellow
            linger: 0.35
            caption_boundary: true
          - id: gbt-histogram-one-weights
            phrase: "point four on the left and negative two sevenths on the right"
            targets: [histogram-scan-model]
            color: yellow
            linger: 0.35
            caption_boundary: true
      - say: "Move one more bin to the left of the cut. Both misses now pull their leaf up. Both on-time jobs pull the other leaf down. Each side has half a unit of curvature, and its gradients add to minus one or plus one. The gain is two thirds. The leaf weights are plus and minus two thirds. Try the cut after bin three. An on-time job cancels one miss on the left, and the gain drops back to six thirty-fifths. The center cut wins. Multiply its weights by the learning rate before adding them to the logits."
        hold: 1.3
        visual_cues:
          - id: histogram-cut-two
            phrase: "Move one more bin to the left of the cut"
            targets: [histogram-scan-model]
            color: cyan
            linger: 0.2
          - id: histogram-gain-two
            phrase: "The gain is two thirds"
            targets: [histogram-scan-model]
            color: yellow
            linger: 0.35
            caption_boundary: true
          - id: gbt-histogram-two-weights
            phrase: "The leaf weights are plus and minus two thirds"
            targets: [histogram-scan-model]
            color: yellow
            linger: 0.35
            caption_boundary: true
          - id: histogram-cut-three
            phrase: "Try the cut after bin three"
            targets: [histogram-scan-model]
            color: cyan
            linger: 0.2
          - id: histogram-gain-three
            phrase: "the gain drops back to six thirty-fifths"
            targets: [histogram-scan-model]
            color: yellow
            linger: 0.35
            caption_boundary: true
          - id: gbt-histogram-winner
            phrase: "The center cut wins"
            targets: [histogram-scan-model]
            color: yellow
            linger: 0.35
            caption_boundary: true
      - say: "Building a histogram visits the rows for each feature. Once you have totals in the bins, you can scan the boundaries without reading every row again. There's another saving when the tree grows. Keep the parent's histogram and build the left child's. Subtract it bin by bin. What's left is the right child's gradient and curvature in every bin. With dense data, building costs roughly rows times features. Scanning costs roughly bins times features. Values inside a bin still share one position in the search."
        hold: 1.2
        visual_cues:
          - id: histogram-scan-step-4
            phrase: "Building a histogram visits the rows for each feature"
            targets: [histogram-scan-model]
            color: cyan
            linger: 0.2
          - id: histogram-subtract
            phrase: "Subtract it bin by bin"
            targets: [histogram-scan-model]
            color: cyan
            linger: 0.2
  - id: earned-split-transfer
    title: "A different set of four bins"
    visual: "Alternating labels change the three possible gains. The extra-leaf charge determines whether the parent splits. A shared leaf then sends a missed job down the same side of an alert cutoff as two on-time jobs."
    beats:
      - say: "Keep the bins and start again from even odds. This time jobs one and three missed. The labels alternate. Lambda is still one, but now each extra leaf costs a fifth of a unit of gain. The middle cut puts one miss on each side. The two end cuts each isolate a single job. Does any cut earn enough to pay for that leaf?"
        hold: 3
        visual_cues:
          - id: earned-split-transfer-step-1
            phrase: "This time jobs one and three missed"
            targets: [earned-split-transfer-model]
            color: cyan
            linger: 0.2
      - say: "Look at the gains before the charge. The middle cut earns zero because the gradients cancel in both children. Each end cut earns six thirty-fifths, just over seventeen hundredths. Subtract a fifth from each candidate. All three lose against the unsplit tree. Keep the parent."
        hold: 1.4
        visual_cues:
          - id: fresh-unpenalized
            phrase: "Each end cut earns six thirty-fifths"
            targets: [earned-split-transfer-model]
            color: yellow
            linger: 0.35
            caption_boundary: true
