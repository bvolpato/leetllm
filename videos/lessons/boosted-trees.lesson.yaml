            targets: [earned-split-transfer-model]
            color: yellow
            linger: 0.35
            caption_boundary: true
          - id: fresh-cut
            phrase: "Split after job one"
            targets: [earned-split-transfer-model]
            color: yellow
            linger: 0.35
            caption_boundary: true
          - id: gbt-fresh-weights
            phrase: "The left leaf proposes point four and the right leaf proposes negative two sevenths"
            targets: [earned-split-transfer-model]
            color: yellow
            linger: 0.35
            caption_boundary: true
          - id: fresh-logits
            phrase: "point one on the left and negative one fourteenth on the right"
            targets: [earned-split-transfer-model]
            color: yellow
            linger: 0.35
            caption_boundary: true
      - say: "Convert those logits back to probabilities. The left branch gets about point five two five. The three jobs on the right get about point four eight two. Put the alert line at point five two. Of the two jobs that actually missed, which one will the operator hear about?"
        hold: 2.8
        visual_cues:
          - id: fresh-probabilities
            phrase: "The left branch gets about point five two five. The three jobs on the right get about point four eight two"
            targets: [earned-split-transfer-model]
            color: yellow
            linger: 0.35
            caption_boundary: true
          - id: fresh-threshold
            phrase: "Put the alert line at point five two"
            targets: [earned-split-transfer-model]
