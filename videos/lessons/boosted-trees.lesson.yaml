    title: Sampling rows and encoding categories
    visual: Gradient-ranked rows retain their identities through sampling weights; mutually exclusive sparse columns occupy disjoint bundle bins, then one categorical row is hidden from its own target statistic.
    beats:
      - say: Gradient-based one-side sampling is an optional Light G B M strategy. Keep the large-gradient group, then sample the small-gradient group with a declared inclusion probability. In a toy with four small-gradient rows sampled independently with probability one half, each retained small row receives inverse-probability weight two. Individual samples give different totals. Across repeated draws, those weights recover the full sum on average.
