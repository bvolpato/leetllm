  - id: attribution-game
    title: Construct local credit in its stated output units
    visual: Two feature tokens enter both coalition orders; their marginal increments are averaged and recombined with the base, then the same raw-logit sum passes through a sigmoid.
    beats:
      - say: Global gain, split count and impurity decrease summarize different properties and can favor features with many split candidates or redistribute credit among correlated inputs. They do not give the signed contribution to this particular job. Define a local explanation game with a background population, a missing-feature convention and a chosen model output before computing Shapley credit.
        hold: 0.6
        visual_cues:
          - id: attribution-game-step-1
            phrase: Global gain, split count and impurity decrease summarize different properties and can favor features with many split candidates or redistribute credit among correlated inputs
            targets:
              - attribution-game-model
            color: blue
            linger: 0.4
      - say: In a separate two-feature game, the empty value is zero, A alone is two, B alone is one, and both give five. In order A then B, the marginal increments are two and three. In order B then A, they are one and four. Average A's two and four to get three; average B's one and three to get two. Base zero plus those credits reconstructs output five. With more features, Shapley averages across subset orders under the specified game.
        hold: 0.6
        visual_cues:
          - id: attribution-game-step-2
            phrase: In a separate two-feature game, the empty value is zero, A alone is two, B alone is one, and both give five
            targets:
              - attribution-game-model
            color: blue
            linger: 0.4
          - id: shap-first-order
            phrase: In order A then B
            targets:
              - attribution-game-model
            color: yellow
            linger: 0.35
          - id: shap-second-order
            phrase: In order B then A
            targets:
              - attribution-game-model
            color: yellow
            linger: 0.35
          - id: shap-average
            phrase: Average A's two and four to get three
            targets:
              - attribution-game-model
            color: yellow
            linger: 0.35
          - id: gbt-shap-b
            phrase: average B's one and three to get two.
            targets:
              - attribution-game-model
            color: cyan
            linger: 0
      - say: Tree S H A P avoids explicit enumeration of all coalitions by propagating path information through each tree. Its path extension and unwinding steps track contributions and coalition-size weights, using branch-cover information for the tree-path-dependent game. The original bound is order trees times maximum leaves times maximum depth squared. Interventional handling with a background defines a different game; record that choice rather than treating all correlated-feature explanations as identical.
        hold: 0.6
        visual_cues:
          - id: attribution-game-step-3
            phrase: Tree S H A P avoids explicit enumeration of all coalitions by propagating path information through each tree
            targets:
              - attribution-game-model
            color: blue
            linger: 0.4
      - say: Also record the output units. In a hypothetical raw-logit explanation, base minus one plus point four two and point two six gives minus point three two; sigmoid gives probability about point four two one. The bars add in log odds. The sigmoid turns their total into a probability. If an escalation flag gets a large share of the credit, check when it was recorded and how fresh it was when the scheduler acted. To find out whether escalating helps, test its effect on job outcomes in a controlled comparison.
