            phrase: "Subtract a fifth from each candidate"
            targets: [earned-split-transfer-model]
            color: cyan
            linger: 0.2
          - id: fresh-block
            phrase: "Keep the parent"
            targets: [earned-split-transfer-model]
            color: yellow
            linger: 0.35
            caption_boundary: true
      - say: "Lower only the leaf charge to one tenth. Now both end cuts clear it by about seven hundredths. Break equal gains in favor of the earliest cut. Split after job one. Follow the right branch. The third job still has to share its correction with two on-time jobs. The left leaf proposes point four and the right leaf proposes negative two sevenths. Take a quarter step from logit zero. That gives point one on the left and negative one fourteenth on the right."
        hold: 1.3
        visual_cues:
