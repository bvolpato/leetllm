            color: yellow
            linger: 0.35
      - say: "In Ordered boosting, look at row three. A model fitted on rows one and two makes its prediction for row three. Suppose it gives the job even odds. Now uncover row three's label. It missed. One minus a half gives a residual of plus one half. Row three's label first enters the calculation here, after its prediction. Plain boosting can also use the ordered category statistic from the previous example. To see how either model handles future jobs, test it on a later month."
