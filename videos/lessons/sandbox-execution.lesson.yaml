            linger: 0.45
          - id: evaluate-two-axes-ratio-result
            phrase: pass-at-two is seventy percent for this pool
            targets:
              - evaluate-two-axes-mechanism
            color: cyan
            linger: 0.45
      - say: That arithmetic says nothing about secret isolation or network policy. Keep the tested artifact and
          environment fixed, then report correctness, containment, timeouts, and cleanup evidence separately.
        hold: 0.55
        visual_cues:
          - id: evaluate-two-axes-b3-1
            phrase: correctness, containment
            targets:
              - evaluate-two-axes-mechanism
            linger: 0.45
      - say: For n observed candidate indices with c passes, selecting k indices uniformly without replacement has
          pass-at-k equal to one minus choose n-minus-c comma k, divided by choose n comma k. In the
          five-candidate example, drawing indices with replacement instead gives one minus three-fifths
          squared, or sixty-four percent, a different experiment. The combinatorial estimator is unbiased for
          fresh sampling under its independent, identically distributed assumptions; plugging the observed
          pass fraction into the replacement formula generally is not. Identical code may occupy two different
          sampled indices. Successive repairs depend on feedback, so evaluate independent whole trajectories
          rather than calling their dependent patches independent samples. Freeze tasks, environment, tool
          budgets and grading, and separate infrastructure failures and incomplete evaluations.
        hold: 0.8
        visual_cues:
          - id: evaluate-two-axes-extension-4
            phrase: For n observed candidate indices with c passes, selecting k indices uniformly without replacement has
              pass-at-k equal to one minus choose n-minus-c comma k, divided by choose n comma k
            targets:
              - evaluate-two-axes-mechanism
            linger: 0.8
          - id: evaluate-two-axes-replacement-input
            phrase: drawing indices with replacement
            targets:
              - evaluate-two-axes-mechanism
            color: cyan
            linger: 0.45
          - id: evaluate-two-axes-replacement-result
            phrase: drawing indices with replacement instead gives one minus three-fifths squared, or sixty-four percent, a different experiment
            targets:
              - evaluate-two-axes-mechanism
            color: cyan
            linger: 0.45
