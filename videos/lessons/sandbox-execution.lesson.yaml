  - id: evaluate-two-axes
    title: Passing tests and containment answer separate questions
    visual: A two-axis evaluation plots functional success against containment evidence; a pass-at-two calculation
      summarizes candidate selection while leaving runtime probes separate.
    beats:
      - say: Functional tests ask whether a patch matches expected behavior. Containment probes ask whether the
          runtime enforces its access and resource boundaries.
        hold: 0.55
        visual_cues:
          - id: evaluate-two-axes-b1-1
            phrase: Functional tests
            targets:
              - evaluate-two-axes-mechanism
            linger: 0.45
          - id: evaluate-two-axes-b1-2
            phrase: Containment probes
            targets:
              - evaluate-two-axes-mechanism
            linger: 0.45
      - say: In a fixed pool of five candidates, two pass. Choosing two without replacement has seven successful pairs
          among ten possible pairs, so pass-at-two is seventy percent for this pool.
        hold: 0.75
        visual_cues:
          - id: evaluate-two-axes-b2-1
            phrase: five candidates
            targets:
              - evaluate-two-axes-mechanism
            linger: 0.45
          - id: evaluate-two-axes-b2-2
            phrase: seven successful pairs
            targets:
