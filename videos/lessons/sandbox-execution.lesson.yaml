  - id: wasm-failure-matrix
    title: Give each guest failure its actual result
    visual: Persistent parser artifact, exact boundary state and computed results build with the spoken operation;
      predictions hold before their outcomes.
    beats:
      - say: The bounded lab runs an infinite loop and checks an out-of-fuel trap. A start-function loop traps during
          instantiation under the same fuel bound. With one sixty-four-kibibyte memory page already allocated
          and no space for another, memory-dot-grow returns minus one to the guest. It does not raise an
          out-of-bounds trap. An i-thirty-two load needs four bytes starting at its address; every byte must
          remain inside the allocated memory. Loading beyond the allocated memory does trap; initial memory
          larger than the configured store limit fails instantiation.
