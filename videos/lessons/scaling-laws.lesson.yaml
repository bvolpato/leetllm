            targets:
              - sl-width-transfer-construction
            linger: 0.25
      - say: Start each output weight at one over the square root of the width. Give both layers a learning
          rate of one. Take a step at width sixteen. Seventeen is the new prediction. Try the same step
          at width sixty-four. Sixty-five this time. Each prediction is the width plus one.
