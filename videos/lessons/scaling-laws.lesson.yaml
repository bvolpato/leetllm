    title: Can four runs share the same text?
    visual: Keep source positions visible as four runs process them. Compare their union with a disjoint-data
      case, then examine the assumptions of a dated supply forecast.
    beats:
      - say: Put the same fifteen trillion token positions through four separate training runs. Watch the source
          labels repeat. Each run adds fifteen trillion presentations, but every one points back to the
          same corpus. Together the models saw sixty trillion presentations drawn from fifteen trillion
          unique positions. With four disjoint corpora of the same size, the four runs would use sixty
          trillion unique positions.
