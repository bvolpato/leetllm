      - say: Fit the blue curve with exponent point one and the lighter curve with point two. Both pass through
          both dots. Now follow them out to a million units of compute. One predicts just under two nats,
          the other about two point two two. The choice of exponent changed the floor as well as the
          forecast.
        hold: 0.65
        visual_cues:
          - id: sl-floor-ambiguity-1
            phrase: follow them out to a million units of compute
            targets:
              - sl-floor-ambiguity-construction
            linger: 0.3
      - say: The fits agree exactly where you measured and differ by almost a quarter of a nat at the proposed
          budget. That gap shows how much two assumptions matter. To estimate uncertainty from training
