          eight-billion weight count in dense operations. Count one draft, then four, then sixteen. Each
          time you quadruple the drafts, the generation bill quadruples. Prompt processing, attention and
          scoring the drafts all add work outside that total. Measure task success to see what those
          extra drafts bought.
