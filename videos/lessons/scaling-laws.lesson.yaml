    url: https://raw.githubusercontent.com/meta-llama/llama3/main/MODEL_CARD.md
scenes:
  - id: intro
    title: If the model doubles, how many token rows fit?
    visual: Slide the last five-square token row into a hundred-square sheet. Repack those same squares
      into wider rows after the viewer predicts how many will fit.
    beats:
      - say: That last row of tokens costs five squares. Each column stands for a unit of learned weights,
          the model’s parameters. Twenty rows use all hundred squares we have for training.
        hold: 0.5
        visual_cues:
          - id: intro-count
            phrase: a unit of learned weights
            targets:
              - budget-sheet
            linger: 0.25
      - say: Double the number of weights. A row now costs ten squares. How many rows fit in the same
          hundred-square budget?
        hold: 2.7
        visual_cues:
          - id: intro-width
            phrase: double the number of weights
            targets:
              - budget-account
            linger: 0.25
      - say: Ten rows. Slide the top half to the right and lower it beside the bottom half. Both shapes use
          every square. We can fit a scaling law to smaller runs to forecast which shape will predict
          the next token better on new text.
        hold: 1.1
        visual_cues:
          - id: intro-answer
            phrase: Ten rows
            targets:
              - budget-account
            linger: 0.25
          - id: intro-slide
            phrase: Slide the top half to the right and lower it beside the bottom half
            targets:
              - budget-sheet
            linger: 0.25
            caption_boundary: true
        motion_check:
          region:
            - 380
            - 210
            - 350
            - 650
          minimumChangedFraction: 0.002
  - id: budget
    title: What does one square pay for?
    visual: Count the three dense contractions, then double N while D falls under a fixed product.
    beats:
      - say: A dense layer multiplies the token inputs by a matrix of weights. In the forward pass, count a
          multiply and an addition for each weight and token. Backward needs two similar multiplications.
          One sends gradients back to the inputs. The other finds a gradient for each weight.
        hold: 0.65
        visual_cues:
          - id: budget-forward
            phrase: count a multiply and an addition for each weight and token
            targets:
              - matmul-terms
            linger: 0.3
          - id: budget-input
            phrase: One sends gradients back to the inputs
            targets:
              - matmul-terms
            linger: 0.3
          - id: budget-weight
            phrase: The other finds a gradient for each weight
            targets:
              - matmul-terms
            linger: 0.3
      - say: Each strip costs about twice the parameter count per token. Add the three strips and multiply by the
          number of token presentations. That gives six N D floating-point operations for the large dense
          projections. The estimate leaves out work such as attention and recomputation. Hardware
          utilization and memory traffic also affect elapsed time.
        hold: 0.75
        visual_cues:
          - id: budget-total
            phrase: six N D floating-point operations
            targets:
              - training-cost
            linger: 0.3
      - say: Divide out the common factor of six to get back to the budget sheet. Start with ten parameter units
          and ten token units. Double the width and follow the height. A model twenty units wide gets
          just five units of tokens. All three shapes still cover the same hundred squares.
        hold: 0.85
        visual_cues:
          - id: budget-grid
            phrase: budget sheet
            targets:
              - allocation-n
            linger: 0.3
          - id: budget-resize
            phrase: Double the width and follow the height
            targets:
              - allocation-d
            linger: 0.3
        motion_check:
          region:
            - 390
            - 392
            - 510
            - 290
          minimumChangedFraction: 0.002
  - id: counting-contract
    title: What gets counted twice?
    visual: Track two token rows through one stored weight matrix. Count repeated presentations separately
      from stored positions. Add one forward pass for full activation recomputation.
    beats:
      - say: Look at the middle matrix. It has six stored weights. The two rows on the left both use those
          weights. If a position comes back in another training batch it counts again toward D, the
          number of presentations. Four positions seen twice give eight presentations. For N, check which
          weights a study counts. Tied input and output weights share storage, yet projecting onto the
          vocabulary still takes arithmetic.
        hold: 0.65
        visual_cues:
          - id: sl-counting-contract-0
            phrase: Four positions seen twice give eight presentations
            targets:
              - sl-counting-contract-construction
            linger: 0.3
      - say: The first multiply uses the inputs and the weights. To send gradients back to the inputs, multiply
          the output gradients by the transposed weights. To update the weights, multiply the transposed
          inputs by the output gradients. Count all three contractions across the batch. Each contributes
          about two N D operations. This gives six N D for the dense projections. Attention products,
          normalization and optimizer steps add work outside that count.
        hold: 0.65
        visual_cues:
          - id: sl-counting-contract-1
            phrase: The first multiply uses the inputs and the weights. To send gradients back to the inputs,
              multiply the output gradients by the transposed weights. To update the weights, multiply
              the transposed inputs by the output gradients.
            targets:
              - sl-counting-contract-construction
            linger: 0.3
      - say: Suppose you discarded the activations to save memory and replay one full forward pass. Add its two N
          D to the three contractions. That gives eight N D. Replaying fewer layers adds less. At
          inference you need the forward pass, about two N per processed token. For scale, ordinary
          training with a billion parameters and twenty billion presentations costs about one point two
          times ten to the twentieth FLOPs. Double both counts and the work quadruples.
        hold: 0.65
        visual_cues:
          - id: sl-counting-contract-2
            phrase: add its two N D to the three contractions
            targets:
              - sl-counting-contract-construction
            linger: 0.3
  - id: controlled-runs
    title: Where should a second unit of compute go?
    visual: Compare the article’s four invented runs on fixed evaluation data. Inspect two equal-cost runs,
      then trace a power-law example with a fitted floor.
    beats:
      - say: Here are four invented runs on the same held-out text with the same tokenizer and context length.
          Start with one billion parameters and ten billion tokens. Give the next run twice as many
          weights. Give its neighbor twice as many tokens instead. Each spends twice the original
          compute. The last run doubles both and costs four times as much.
        hold: 0.65
        visual_cues:
          - id: sl-controlled-runs-0
            phrase: Start with one billion parameters and ten billion tokens. Give the next run twice as many
              weights. Give its neighbor twice as many tokens instead. Each spends twice the original
              compute. The last run doubles both
            targets:
              - sl-controlled-runs-construction
            linger: 0.3
          - id: runs-double-n
            phrase: Give the next run twice as many weights
            targets:
              - sl-controlled-runs-construction
            linger: 0.2
          - id: runs-double-d
            phrase: Give its neighbor twice as many tokens instead
            targets:
              - sl-controlled-runs-construction
            linger: 0.2
          - id: runs-double-both
            phrase: The last run doubles both
            targets:
              - sl-controlled-runs-construction
            linger: 0.2
      - say: Read the losses under the two middle runs. Spending the increment on tokens gives two point five
          five nats per token. Spending it on weights gives two point six zero. Lower loss means the
          model assigned more probability, on average in log space, to the tokens that occurred. Five
          hundredths of a nat favors more data here. Repeat the runs to see whether that difference
          survives run-to-run variation. If the tokenizer changes, the unit of loss changes too.
        hold: 0.65
        visual_cues:
          - id: sl-controlled-runs-1
            phrase: Read the losses under the two middle runs
            targets:
              - sl-controlled-runs-construction
            linger: 0.3
      - say: Now look beyond those four runs. Each equal step to the right multiplies compute by ten. Under this
          toy law the loss falls toward two and each step buys a smaller absolute improvement. For a pure
          power law, plotting log loss against log compute gives a straight line. Here you must subtract
          the floor of two before taking the log. A different assumed floor can give a different
          forecast.
        hold: 0.65
        visual_cues:
          - id: sl-controlled-runs-2
            phrase: Each equal step to the right multiplies compute by ten. Under this toy law the loss falls toward
              two
            targets:
              - sl-controlled-runs-construction
            linger: 0.3
  - id: historical-frontiers
    title: How does a bigger budget change the split?
    visual: Read Kaplan’s three separate fitted slopes, then compare two equal-area allocations under the
      same increase in compute.
    beats:
      - say: Kaplan and colleagues fitted three curves in twenty twenty. On the left they varied non-embedding
          parameters with plenty of data. In the middle they studied the data-limited regime. On the
          right they fitted the best loss at each adjusted compute budget. The slopes describe three
          different experiments. For instance, the parameter-only slope gives about eighty-four percent
          of the fitted loss for ten times the weights. That fit has no added floor.
        hold: 0.65
        visual_cues:
          - id: sl-historical-frontiers-0
            phrase: On the left they varied non-embedding parameters with plenty of data. In the middle they studied
              the data-limited regime. On the right they fitted the best loss at each adjusted compute
              budget.
            targets:
              - sl-historical-frontiers-construction
            linger: 0.3
      - say: The joint allocation came from the compute-efficient frontier. Give it a hundred times as much
          compute. Kaplan’s fit assigns the power point seven three to parameters and point two seven to
          tokens. The rectangle ends up nearly twenty-nine times wider, but only about three and a half
          times taller. Multiply those two growth factors and you recover the budget increase.
        hold: 0.65
        visual_cues:
          - id: sl-historical-frontiers-1
            phrase: Give it a hundred times as much compute
            targets:
              - sl-historical-frontiers-construction
            linger: 0.3
      - say: Compare that with equal growth. The same hundredfold increase makes the rectangle ten times wider
          and ten times taller. Those are changes from the starting run. A model that started with twenty
          tokens per parameter would still have twenty per parameter after both doubled. The square on
          this chart describes growth multipliers.
        hold: 0.65
        visual_cues:
          - id: sl-historical-frontiers-2
            phrase: The same hundredfold increase makes the rectangle ten times wider and ten times taller
            targets:
              - sl-historical-frontiers-construction
            linger: 0.3
  - id: loss
    title: What does the height of a loss curve mean?
    visual: Build the two square-root penalties on separate axes. Track a point on each as a fixed budget
      shifts from data to model size.
    beats:
      - say: Return to the hundred-square budget. Which shape will predict new text better? Use the same
          tokenizer and held-out text for both runs. Cross-entropy measures the average surprise of the
          observed tokens. Giving those tokens higher probability on average in log space brings the loss
          down.
        hold: 0.7
        visual_cues:
          - id: sl-loss-0
            phrase: the same tokenizer and held-out text
            targets:
              - loss-model
            linger: 0.3
      - say: For the next comparison, use an invented loss formula. Start with a floor of one. Add two over the
          square root of model size. Then add two over the square root of training tokens. Each curve
          shows how a single shortage contributes to loss when the other term is held fixed.
        hold: 0.65
        visual_cues:
          - id: sl-loss-1
            phrase: Start with a floor of one. Add two over the square root of model size. Then add two over the
              square root of training tokens
            targets:
              - resource-penalties
            linger: 0.3
          - id: loss-capacity
            phrase: Add two over the square root of model size
            targets:
              - resource-penalties
            linger: 0.2
          - id: loss-data
            phrase: Then add two over the square root of training tokens
            targets:
              - resource-penalties
            linger: 0.2
      - say: Move some budget from tokens to weights. The model grows, so its point slides down the parameter
          curve. To keep the budget fixed, the token count falls. Its point climbs the data curve.
          Whether the exchange pays off depends on which penalty changes more.
        hold: 0.8
        visual_cues:
          - id: sl-loss-2
            phrase: The model grows, so its point slides down the parameter curve. To keep the budget fixed, the
              token count falls
            targets:
              - resource-penalties
            linger: 0.3
  - id: tradeoff
    title: Two shapes on one budget
    visual: Follow the active corner from five by twenty to ten by ten on the fixed-budget curve. Stack the
      parameter and data penalties for each shape on one scale.
    beats:
      - say: Here are the two shapes from the beginning. Start with five units of parameters and twenty of data.
          The blue part of the bar is the cost in loss from limited model size. The lighter part is the
          cost from limited data. The floor of one is the same for both shapes.
        hold: 0.7
        visual_cues:
          - id: tradeoff-tall
            phrase: five units of parameters and twenty of data
            targets:
              - allocation-map
            linger: 0.25
      - say: Widen the rectangle and follow its corner down to ten rows. Every point on the blue curve still
          spends one hundred units. Read the two bars. The square buys a smaller parameter penalty, but
          it pays a larger data penalty. Which shape has the lower fitted loss?
        hold: 3.1
        visual_cues:
          - id: tradeoff-widen
            phrase: Widen the rectangle and follow its corner down to ten rows
            targets:
              - allocation-map
            linger: 0.25
          - id: tradeoff-square-terms
            phrase: Read the two bars
            targets:
              - loss-terms
            linger: 0.25
  - id: optimum
    title: What would make you change plans?
    visual: Compare the two penalty sums. Change only the data coefficient while the allocation stays still.
      Compare again before moving the corner to the new minimum.
    beats:
      - say: The square wins. Its loss rounds to two point two six five. The wider model saves about a quarter of
          a nat in the parameter term and gives back less than a fifth in the data term. If you went
          twice as wide again, the two original penalties would swap places and you’d return to the tall
          plan’s loss.
        hold: 0.8
        visual_cues:
          - id: optimum-square
            phrase: The square wins
            targets:
              - loss-terms
            linger: 0.25
            caption_boundary: true
      - say: Leave both shapes where they are. Suppose the new fit puts twice as much weight on the data penalty.
          Change its coefficient from two to four. The data segment grows in each bar. With that change,
          which shape would you train?
        hold: 3
        visual_cues:
          - id: optimum-coefficient
            phrase: Change its coefficient from two to four
            targets:
              - loss-terms
            linger: 0.25
        motion_check:
          region:
            - 970
            - 480
            - 725
            - 320
          minimumChangedFraction: 0.002
      - say: The tall plan wins. Move the corner back to five by twenty. Its two penalties now match. Because
          they have the same square-root exponent, each gives the same saving for a small percentage
          increase in its resource. That balance gives the bottom of the loss curve. Changing one fitted
          coefficient reversed the choice at exactly the same budget.
        hold: 1.1
        visual_cues:
          - id: optimum-tall
            phrase: The tall plan wins
            targets:
              - loss-terms
            linger: 0.25
            caption_boundary: true
          - id: optimum-shift
            phrase: Move the corner back to five by twenty
            targets:
              - allocation-map
            linger: 0.25
  - id: general-allocation
    title: When do the two gains balance?
    visual: Start with a one-percent exchange on the 100-unit budget. Solve the balance for positive powers,
      then change the coefficients on a larger budget. Size a real-scale proposal with an explicit 20:1
      assumption.
    beats:
      - say: Return to the square under the original fit, with both coefficients set to two. Now widen it by one
          percent and keep its area fixed. The height has to fall. In the general formula the parameter
          penalty falls as N to the power minus alpha. The data penalty rises because D equals the
          compute budget divided by six N.
        hold: 0.65
        visual_cues:
          - id: sl-general-allocation-0
            phrase: widen it by one percent and keep its area fixed
            targets:
              - sl-general-allocation-construction
            linger: 0.3
      - say: Look at the two penalties before and after that small exchange. Near the square, one falls almost
          exactly as much as the other rises. At the minimum, the first-order changes cancel.
          Differentiating with respect to log model size gives the balance on screen. Multiply each
          penalty by its own exponent before you compare them. Here both products are about point three
          one six two. The one-percent step still adds about sixteen millionths of a nat. The
          cancellation holds for an infinitesimal exchange.
        hold: 0.65
        visual_cues:
          - id: sl-general-allocation-1
            phrase: before and after that small exchange
            targets:
              - sl-general-allocation-construction
            linger: 0.3
      - say: Solving that balance tells you how the best split grows. The parameter count grows with compute
          raised to beta divided by alpha plus beta. The token count takes the other exponent, alpha
          divided by the same sum. They add to one, so their product grows with the budget. The
          coefficients determine where each curve starts. With rounded exponents of point three four and
          point two eight, tokens grow a little faster than parameters.
        hold: 0.65
        visual_cues:
          - id: sl-general-allocation-2
            phrase: The parameter count grows with compute raised to beta divided by alpha plus beta. The token count
              takes the other exponent, alpha divided by the same sum.
            targets:
              - sl-general-allocation-construction
            linger: 0.3
      - say: Try equal square-root exponents again, now with a million units to allocate. Equal coefficients give
          a thousand by a thousand. Raise the data coefficient from two to eight. To balance the
          penalties, D over N must be the square of eight over two. That’s sixteen. Two hundred fifty
          parameter units by four thousand token units gives the same million. Equal growth as the budget
          increases can start from a very tall rectangle.
        hold: 0.65
        visual_cues:
          - id: sl-general-allocation-3
            phrase: Raise the data coefficient from two to eight
            targets:
              - sl-general-allocation-construction
            linger: 0.3
      - say: For a different starting assumption, suppose you choose twenty training tokens per parameter.
          Substitute twenty N for D. The training bill becomes a hundred twenty times N squared. At ten
          to the twenty-fourth FLOPs, take the square root to get about ninety-one billion parameters,
          then multiply by twenty for about one point eight three trillion training tokens. This is a
          proposal you can test with your own runs.
        hold: 0.65
        visual_cues:
          - id: sl-general-allocation-4
            phrase: take the square root to get about ninety-one billion parameters
            targets:
              - sl-general-allocation-construction
            linger: 0.3
  - id: growth
    title: What if you had four times the compute?
    visual: Follow the minimum of the symmetric fit as the product grows from 100 to 400. Compare the
      original and new loss curves.
    beats:
      - say: Return to the ten-by-ten square with both coefficients set to two. This time you can spend four
          times as much compute. Double both sides of the square. Follow the gold dots. The new minimum
          is at twenty by twenty, and both shortages have eased. That’s why the bottom of the loss curve
          moves down.
        hold: 1
        visual_cues:
          - id: growth-expand
            phrase: Double both sides of the square
            targets:
              - allocation-curve
            linger: 0.3
        motion_check:
          region:
            - 220
            - 360
            - 620
            - 420
          minimumChangedFraction: 0.002
      - say: Look at the old and new minima. In this fit, budgets of a hundred and four hundred both favor equal
          proportions. Hoffmann’s Chinchilla experiments found approximately balanced growth too, on
          particular data and with particular training recipes. The measured ratio of tokens to weights
          belongs to those fits.
        hold: 0.7
        visual_cues:
          - id: growth-old-new
            phrase: old and new minima
            targets:
              - loss-valley
            linger: 0.3
      - say: In that move from ten to twenty, each square-root penalty shrinks by the same factor. The original
          floor stays put. As you approach it, each doubling buys a smaller absolute drop in loss. That
          makes even a small error in the estimated floor matter when you forecast much larger runs.
        hold: 0.75
        visual_cues:
          - id: growth-floor
            phrase: each square-root penalty shrinks by the same factor
            targets:
              - loss-valley
            linger: 0.3
  - id: study-discrepancy
    title: What makes a fair comparison between runs?
    visual: Read the paired growth exponents beside each of Hoffmann’s three methods. Check whether a lower
      loss curve actually shifts the minimum.
    beats:
      - say: Hoffmann’s team trained more than four hundred models, from seventy million to sixteen billion
          parameters. They tried three ways to read the runs. Trace the lowest losses, find the minimum
          at each fixed compute budget, or fit one surface through the measurements. Each method put
          roughly half the growth into parameters and half into tokens. The paired numbers show where the
          methods differed.
        hold: 0.65
        visual_cues:
          - id: sl-study-discrepancy-0
            phrase: Trace the lowest losses, find the minimum at each fixed compute budget, or fit one surface
              through the measurements
            targets:
              - sl-study-discrepancy-construction
            linger: 0.3
      - say: Imagine stopping a long cosine learning-rate schedule early. That checkpoint still has a high
          learning rate compared with a run scheduled to finish there. Hoffmann suggested that missing
          the cooldown could make short runs look worse. Compare finished runs at matched horizons.
          Porian’s later reproduction also found that counting the output head, shortening warmup and
          tuning learning rate, batch size and Adam’s second-moment setting across sizes affected the
          split.
        hold: 0.65
        visual_cues:
          - id: sl-study-discrepancy-1
            phrase: Compare finished runs at matched horizons
            targets:
              - sl-study-discrepancy-construction
            linger: 0.3
      - say: Now lower a whole loss curve by the same amount. Its lowest point stays over the same model size.
          Porian found that matching cosine decay helped loss but had limited effect on the allocation
          exponent in those experiments. Tuned runs with a constant learning rate could also give
          near-balanced growth. A schedule can improve the runs without changing which allocation wins.
        hold: 0.65
        visual_cues:
          - id: sl-study-discrepancy-2
            phrase: lower a whole loss curve by the same amount
            targets:
              - sl-study-discrepancy-construction
            linger: 0.3
  - id: frontier-evidence
    title: What did the larger experiment establish?
    visual: Compare nominal Gopher and Chinchilla counts and their dense proxies. Separate the measured task
      results from later Llama configuration ratios.
    beats:
      - say: Gopher used two hundred eighty billion parameters and three hundred billion training tokens.
          Chinchilla used a quarter as many weights and trained on one point four trillion tokens. The
          researchers compared them at a reported training budget of five point seven six times ten to
          the twenty-third FLOPs. Put the rounded counts into six N D and you get two different
          estimates. The paper’s more detailed appendix revised its estimate to six point three in those
          units. Keep the counting convention with the number.
        hold: 0.65
        visual_cues:
          - id: sl-frontier-evidence-0
            phrase: Put the rounded counts into six N D
            targets:
              - sl-frontier-evidence-construction
            linger: 0.3
      - say: Chinchilla improved average MMLU, BIG-bench and LAMBADA results. Look at the four marked MMLU tasks
          where Gopher did better. The tokenizer, optimizer and mixture also changed, so the comparison
          includes more than allocation. The study estimated a best-size range of forty to seventy
          billion parameters. The researchers chose its larger end partly for data and compute
          efficiency.
        hold: 0.65
        visual_cues:
          - id: sl-frontier-evidence-1
            phrase: four marked MMLU tasks
            targets:
              - sl-frontier-evidence-construction
            linger: 0.3
      - say: The Llama runs give another view. Each bar counts training-token presentations per nominal
          parameter. The original eight-billion Llama three saw at least fifteen trillion tokens. That’s
          at least eighteen hundred seventy-five per parameter. The later four-hundred-five-billion paper
          reports fifteen point six trillion tokens for initial pre-training of that larger model. Those
          two token counts belong to different releases. Historical configurations can suggest
          candidates. A lifetime optimum takes a quality comparison and a demand forecast.
        hold: 0.65
        visual_cues:
          - id: sl-frontier-evidence-2
            phrase: Each bar counts training-token presentations per nominal parameter
            targets:
              - sl-frontier-evidence-construction
            linger: 0.3
  - id: fitting
    title: Where would you run the next experiment?
    visual: Place comparable proxy runs on one loss profile. Compare a larger-budget forecast with an
      independent illustrative observation and read its residual.
    beats:
      - say: Train several affordable proxy models around the proposed minimum. Vary model size and token budget,
          match each learning-rate schedule to its finishing point, and write down the recipe. The dots
          here are illustrative losses at one fixed budget. A run that ended before its cooldown could
          make its allocation look worse than it is.
        hold: 0.7
        visual_cues:
          - id: fitting-b1-1
            phrase: Train several affordable proxy models around the proposed minimum
            targets:
              - proxy-loss-curves
            linger: 0.3
      - say: Fit the curve through the small runs. Look at the gaps between the dots and the curve. If they are
          mostly on one side near the minimum, investigate the fit. Changing the tokenizer, context
          length, data mix or architecture changes what you’re measuring. If you repeat text, measure how
          that affects learning too.
        hold: 0.7
        visual_cues:
          - id: fitting-b2-1
            phrase: Fit the curve
            targets:
              - proxy-loss-curves
