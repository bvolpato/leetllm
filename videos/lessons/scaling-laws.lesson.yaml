        visual_cues:
          - id: sl-architecture-aware-0
            phrase: This token uses the shared layers and just the selected experts
            targets:
              - sl-architecture-aware-construction
            linger: 0.3
      - say: Each tile stands for two billion weights. At two bytes per weight, all eighty billion occupy a
          hundred sixty decimal gigabytes before other state. Count the active tiles for one token. Four
          billion shared weights plus six billion selected weights make ten billion active. For a hundred
          billion training tokens, six times that active count times the token count gives six times ten
          to the twenty-first proxy FLOPs.
        hold: 0.75
        visual_cues:
          - id: sl-architecture-aware-1
            phrase: Count the active tiles for one token
            targets:
              - sl-architecture-aware-construction
            linger: 0.3
      - say: Changing the architecture can also change the cost of a longer context. During full-sequence
          attention, pairs of positions interact. During cached decoding, each new query reads a growing
          history. A state-space model can update a fixed-size recurrent state instead. Measure
          throughput in the phase you care about and fit loss on the actual architecture before sizing
          the next run.
        hold: 0.75
        visual_cues:
          - id: sl-architecture-aware-2
            phrase: each new query reads a growing history
            targets:
              - sl-architecture-aware-construction
            linger: 0.3
