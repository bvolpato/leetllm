            linger: 0.3
          - id: disjoint-data
            phrase: With four disjoint corpora
            targets:
              - sl-data-inventory-construction
            linger: 0.2
      - say: In June twenty twenty-four, Villalobos and colleagues forecast when training demand might meet
          effective public human-text supply. Their range ran from twenty twenty-six to twenty
          thirty-two, with a median near twenty twenty-eight. The roughly four hundred trillion tokens at
          that intersection included adjustments for quality and useful repetition. Dividing a reported
          fifteen point six trillion presentations by that future stock gives three point nine percent.
          The corpus can still be used again.
        hold: 0.75
        visual_cues:
          - id: sl-data-inventory-1
            phrase: Their range ran from twenty twenty-six to twenty thirty-two
            targets:
              - sl-data-inventory-construction
            linger: 0.3
      - say: For your own run, count what remains after licensing, filtering and deduplication. Test repeated
          epochs or verified synthetic data on the task. Epoch’s twenty twenty-five assessment suggested
          synthetic data might ease a bottleneck. Its usefulness depends on the data you can make and
          verify. Sardana’s study of forty-seven models found that fits from ratios up to a hundred could
          overstate gains far beyond that range. Only the smallest model reached ten thousand tokens per
          parameter. The larger ones went up to a thousand.
        hold: 0.75
        visual_cues:
