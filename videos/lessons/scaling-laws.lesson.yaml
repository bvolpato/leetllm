  - id: architecture-aware
    title: Which weights does this token use?
    visual: Separate stored expert and shared weights from the active subset, then compare growing attention
      history with a fixed-size recurrent state.
    beats:
      - say: All forty tiles occupy memory. This token uses the shared layers and just the selected experts.
          Another token in the batch may visit different experts. For a mixture of experts, record both
          the total stored weights and the active weights per token. Routing, placement, attention and
          communication also affect what the hardware must do.
