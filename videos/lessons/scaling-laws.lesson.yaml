  - title: Sardana et al., Beyond Chinchilla-Optimal
    url: https://arxiv.org/abs/2401.00448
  - title: Porian et al., reproduction of allocation studies
    url: https://arxiv.org/html/2406.19146v1
  - title: Hoffmann et al., Appendix F
    url: https://arxiv.org/html/2203.15556v1
  - title: Kaplan et al., compute accounting
    url: https://arxiv.org/html/2001.08361v1
  - title: Sardana et al., inference-aware scaling
    url: https://arxiv.org/html/2401.00448v3
  - title: Villalobos et al., June 2024 forecast
    url: https://arxiv.org/html/2211.04325v2
  - title: Epoch AI, September 2025 assessment
    url: https://epoch.ai/publications/what-will-ai-look-like-in-2030
