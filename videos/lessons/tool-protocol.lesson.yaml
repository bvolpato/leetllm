          - id: t-fresh-tool-repair
            phrase: "The two release IDs match"
            targets: [receipt-decision]
            linger: 0.25
            caption_boundary: true
          - id: t-fresh-tool-hold
            phrase: "hold the traffic shift"
            targets: [write-status]
            linger: 0.25
            caption_boundary: true
      - say: >-
          Before grading a run, check what the record can establish. In a separate test an approved
          write left the host and its reply went missing. How many traffic changes occurred? That
          count is unknown. Check the backend, or use its supported retry with the original
          idempotency key. Across these tests, measure completion, appropriate refusals, grounding,
          latency and token use. Vary the catalog, the caller, the returned release and schema, and
          the time and output limits of the local server.
        hold: 0.8
        visual_cues:
          - id: fresh-lost
            phrase: "its reply went missing"
            targets: [counterexample]
            linger: 0.25
            caption_boundary: true
          - id: fresh-unknown
            phrase: "That count is unknown"
            targets: [counterexample]
            linger: 0.25
            caption_boundary: true
          - id: fresh-reconcile
            phrase: "Check the backend"
            targets: [counterexample]
            linger: 0.25
            caption_boundary: true
          - id: fresh-metrics
            phrase: "measure completion, appropriate refusals, grounding, latency and token use"
            targets: [eval-metrics]
            linger: 0.25
            caption_boundary: true
          - id: fresh-cases
            phrase: "Vary the catalog"
            targets: [eval-cases]
            linger: 0.25
            caption_boundary: true
      - say: >-
          Return to version eighteen and the missing policy receipt. Compare two test traces with
          that same reviewed catalog and accepted read. Follow the proposed write in run A. The host
          holds it before dispatch. In run B the host sends it and the server denies it. Each operator
          gets an accurate explanation. Both see traffic unchanged.
        hold: 0.9
        visual_cues:
          - id: fresh-common
            phrase: "the missing policy receipt"
            targets: [trace-policy]
            linger: 0.25
            caption_boundary: true
          - id: fresh-held
            phrase: "The host holds it before dispatch"
            targets: [trace-a]
            linger: 0.25
            caption_boundary: true
          - id: fresh-sent
            phrase: "the host sends it"
            targets: [trace-b]
            linger: 0.25
            caption_boundary: true
          - id: fresh-denied
            phrase: "the server denies it"
            targets: [trace-b]
            linger: 0.25
            caption_boundary: true
          - id: fresh-reports
            phrase: "Each operator gets an accurate explanation"
            targets: [trace-reports]
            linger: 0.25
            caption_boundary: true
      - say: >-
          The test fails any forbidden attempt to shift traffic, even if the server denies it. Which
          run passes?
        hold: 2.8
        visual_cues:
          - id: fresh-ask
            phrase: "Which run passes"
            targets: [trace-rule]
            linger: 0.25
            caption_boundary: true
      - say: >-
          Run A passes. It stopped before dispatch and explained the missing policy. Run B fails.
          Count the write requests that left the host. There was one forbidden attempt in B, even
          though the server made zero changes.
        hold: 1.4
        visual_cues:
          - id: fresh-pass
            phrase: "Run A passes"
            targets: [trace-a]
            linger: 0.25
            caption_boundary: true
          - id: t-fresh-tool-attempt
            phrase: "Run B fails"
            targets: [trace-b]
            linger: 0.25
            caption_boundary: true
      - say: >-
          Deployments saw a clean canary on version eighteen at two twelve. Carry that reading into
          the next model call with its source and time. The policy check timed out, so the traffic
          shift stays on hold. Choosing which evidence the model gets next is context engineering.
        hold: 1.25
        visual_cues:
          - id: fresh-context
            phrase: "Deployments saw a clean canary on version eighteen at two twelve"
            targets: [handoff-read]
            linger: 0.25
            caption_boundary: true
          - id: fresh-policy
            phrase: "The policy check timed out"
            targets: [handoff-policy]
            linger: 0.25
            caption_boundary: true
