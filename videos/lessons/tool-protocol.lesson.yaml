            targets:
              - era-fallback-mechanism
            color: cyan
            linger: 0.4
          - id: t-era-fallback-correct-modern
            phrase: A recognized modern version, capability or header error needs correction within the modern era
            targets:
              - era-fallback-mechanism
            color: cyan
            linger: 0.4
          - id: t-era-fallback-empty
            phrase: An unrecognized or empty response can take the supported legacy route
            targets:
              - era-fallback-mechanism
            color: cyan
            linger: 0.4
          - id: t-era-fallback-deprecation
            phrase: their earliest removal is a revision on or after July twenty-eighth twenty-twenty-seven
            targets:
              - era-fallback-mechanism
            color: cyan
            linger: 0.4
  - id: http-binding
    title: Bind gateway headers to the executed body
    visual: A tool name and a resource URI each appear in a request body and a decoded HTTP
      header. The body stays fixed as the second copy receives a different routing value.
    beats:
      - say: Streamable HTTP uses a configured endpoint and a separate POST for each JSON-RPC message. The
          client advertises both application JSON and text-event-stream response types. The server
          may return one JSON object or a request-scoped server-sent-event stream with related
          notifications and the final reply. A subscriptions-listen request opens a separate longer
          stream for selected change notifications. This revision has no protocol GET stream,
          session-ID header or last-event-ID resumption, although application state can still exist.
        hold: 0.65
        visual_cues:
          - id: http-binding-beat-0
            phrase: Streamable HTTP uses a configured endpoint and a separate POST for each JSON-RPC message
            targets:
              - http-binding-mechanism
            color: cyan
            linger: 0.6
          - id: t-http-binding-post
            phrase: a separate POST for each JSON-RPC message
            targets:
              - http-binding-mechanism
            color: cyan
            linger: 0.4
          - id: t-http-binding-stream
            phrase: the final reply
            targets:
              - http-binding-mechanism
            color: cyan
            linger: 0.4
      - say: Gateways route using mirrored headers while the body remains the source of truth. Protocol
          version mirrors the namespaced version; MCP method mirrors the method; MCP name mirrors
          the tool or prompt name, or resource URI, for the corresponding methods. A body-processing
          server rejects missing required headers or mismatches with HTTP four hundred and
          header-mismatch error minus thirty-two thousand twenty. Header names are case-insensitive;
          method and name values are case-sensitive.
