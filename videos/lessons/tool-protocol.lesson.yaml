            phrase: "a reply travels on standard output"
            targets: [stdio-reply]
            linger: 0.25
      - say: >-
          Request twenty declares support for forms. The server asks why the canary should roll back.
          That question comes back inside the reply to twenty. The operator supplies the reason. The
          client prepares request twenty-one with the same operation, the answer and the exact state
          the server sent. How many traffic changes have happened so far?
        hold: 2.1
        visual_cues:
          - id: pause-input
            phrase: "The server asks why the canary should roll back"
            targets: [pause-response]
            linger: 0.25
          - id: pause-resume
            phrase: "The client prepares request twenty-one"
            targets: [retry-packet]
            linger: 0.25
      - say: >-
          Zero. The reason is filled in. For this run the operator has approved this rollback. The
          host checks the target and that approval before sending the retry. The server verifies the
          returned state, rechecks current permission and applies the rollback once.
        hold: 1.1
        visual_cues:
          - id: t-transport-and-pause-host
            phrase: "The host checks the target and that approval"
