            color: cyan
            linger: 0.4
          - id: t-http-binding-reject-changed
            phrase: reject before dispatch instead of choosing one interpretation
            targets:
              - http-binding-mechanism
            color: cyan
            linger: 0.4
      - say: >-
          Now the application reads a resource. Both copies of the request ask for version
          seventeen in the body. Compare each decoded name header with that URI. In the second
          copy the header names version eighteen. Authentication succeeded for both. Which
          request can go on to the release access check?
        hold: 2.1
        visual_cues:
          - id: mirror-resource-change
            phrase: "the header names version eighteen"
            targets: [resource-header-b]
      - say: >-
          The first one can go on. Its header names the same resource as its body. Reject
