scenes:
  - id: subject-intro
    title: "Can we report this status at 02:00?"
    visual: "A clock sweeps to 02:00 beside a release status stamped 01:42. The five-minute window and the saved mark stay on the dial as the host requests a fresh reading."
    beats:
      - say: >-
          At one forty-two, version seventeen was still processing. By two o’clock we need a reading
          from the last five minutes. Does this one qualify?
        hold: 2.4
        caption_starts: ["By two o’clock", "Does this one qualify?"]
        visual_cues:
          - id: intro-saved
            phrase: "version seventeen was still processing"
            targets: [saved-reading]
            linger: 0.25
          - id: intro-window
            phrase: "from the last five minutes"
            targets: [read-window]
            linger: 0.25
      - say: >-
          It’s eighteen minutes old. To find out how the release is doing now, the assistant checks
          the engineer’s read permission and sends a status request. The deployments server checks
          her access and reads the release record. At two o’clock the canary is clean.
        hold: 1.1
        caption_starts: ["To find out", "The deployments server checks", "At two o’clock"]
        visual_cues:
          - id: intro-age
            phrase: "eighteen minutes old"
            targets: [saved-reading]
            linger: 0.25
          - id: intro-read
            phrase: "sends a status request"
            targets: [current-reading]
            linger: 0.25
          - id: intro-current
            phrase: "At two o’clock the canary is clean"
            targets: [current-reading]
            linger: 0.25
            caption_boundary: true
      - say: >-
          That exchange uses the Model Context Protocol, or MCP. The incident assistant is a host.
          Its client discovers and calls the status tool on the deployments server. The operations
          console and the IDE can use that same status tool. Each host owns its conversation and
          decides which calls it will send.
        hold: 0.8
        visual_cues:
          - id: intro-hosts
            phrase: "The operations console and the IDE"
            targets: [client-paths]
            linger: 0.25
          - id: intro-tool
            phrase: "that same status tool"
            targets: [server-tool]
            linger: 0.25
          - id: intro-policy
            phrase: "decides which calls it will send"
            targets: [client-paths]
            linger: 0.25
  - id: reuse-arithmetic
    title: "How much integration code do three hosts need?"
    visual: "Twelve host-service pairs share three host integrations and four servers. A permission change leaves the integration and connection counts fixed."
    beats:
      - say: >-
          Keep the three applications. Give each of them four services: status, policy, telemetry and
          traffic. Count one custom adapter for each pair. Three rows of four make twelve adapters.
          Now give each host a shared client integration and each service one server. Three plus four
          gives seven implementations. Look back at the connections. Each of the twelve pairs still exists.
        hold: 0.8
        caption_starts:
          - "Count one custom adapter"
          - "twelve adapters"
          - "Now give each host"
          - "seven implementations"
          - "Look back at the connections"
        visual_cues:
          - id: t-reuse-arithmetic-count
            phrase: "Count one custom adapter for each pair"
            targets: [reuse-arithmetic-mechanism]
            linger: 0.25
          - id: t-reuse-arithmetic-pairs
            phrase: "Three rows of four make twelve adapters"
            targets: [reuse-arithmetic-mechanism]
            linger: 0.25
          - id: t-reuse-arithmetic-roles
            phrase: "Three plus four gives seven implementations"
            targets: [reuse-arithmetic-mechanism]
            linger: 0.25
          - id: t-reuse-arithmetic-links
            phrase: "Each of the twelve pairs still exists"
            targets: [reuse-arithmetic-mechanism]
            linger: 0.25
      - say: >-
          Take the IDE’s permission to shift traffic away. Its integration still exists. So does the
          traffic server. The possible connections and the amount of integration code stay the same.
          What changed is whether that caller may use that operation. One server can offer several
          tools. One client library can serve many connections, with one client instance for each
          server it talks to.
        hold: 0.8
        visual_cues:
          - id: reuse-revoke
            phrase: "Take the IDE’s permission to shift traffic away"
            targets: [pair-permission]
            linger: 0.25
  - id: host-client-server
    title: "What can leave the host?"
    visual: "The assistant has independent clients for deployments, policy, and rollouts. An authorized read crosses the send boundary. A missing policy receipt keeps the proposed write on the host side."
    beats:
      - say: >-
          Stay with the incident assistant. It runs the model and chooses the tools the model sees.
          Look at the three clients it owns. Each connects to one server. Deployments can read status,
          policy supplies clearance, and rollouts can change traffic.
        hold: 0.65
        visual_cues:
          - id: host-clients
            phrase: "the three clients it owns"
            targets: [client-names]
            linger: 0.25
      - say: >-
          Two proposals are on the host. The engineer has permission to read version seventeen.
          Shifting traffic also requires a current policy receipt. The policy lookup times out. Both
          the deployments server and the rollouts server are reachable. Which proposal can the host
          send?
        hold: 2.5
        visual_cues:
          - id: host-read-grant
            phrase: "permission to read version seventeen"
            targets: [read-request]
            linger: 0.25
          - id: host-needs-policy
            phrase: "requires a current policy receipt"
            targets: [write-request]
            linger: 0.25
          - id: host-timeout
            phrase: "The policy lookup times out"
            targets: [policy-receipt]
            linger: 0.25
      - say: >-
          Send the status read. Deployments checks the caller and returns the clean canary reading.
          Hold the traffic shift here at the host. The rollouts connection is open, but its client has
          nothing to send until the required policy evidence arrives.
        hold: 1
        visual_cues:
          - id: host-send
            phrase: "Send the status read"
            targets: [read-request]
            linger: 0.25
          - id: host-return
            phrase: "returns the clean canary reading"
            targets: [read-reply]
            linger: 0.25
          - id: host-hold
            phrase: "Hold the traffic shift here at the host"
            targets: [write-request]
            linger: 0.25
  - id: request-correlation
    title: Request IDs pair messages across a busy connection
    visual: Three JSON-RPC requests leave a client and return in a different order; the client matches
      each result by its ID rather than by arrival position.
    beats:
      - say: A JSON-RPC request names a method and carries an ID. The matching response echoes that ID,
          which lets a client pair replies with outstanding work.
        hold: 0.55
        visual_cues:
          - id: request-correlation-beat-1-focus-1
            phrase: A JSON-RPC request names a method and carries an ID
            targets:
              - request-correlation-mechanism
            color: blue
            linger: 0.6
          - id: t-request-correlation-request
            phrase: A JSON-RPC request names a method and carries an ID
            targets:
              - request-correlation-mechanism
            color: cyan
            linger: 0.4
      - say: Suppose discovery uses ID one, the tool list uses ID two, and a status call uses ID three. The
          server may finish the status call first.
        hold: 0.75
        visual_cues:
          - id: correlation-status-first
            phrase: The server may finish the status call first
            targets:
              - request-correlation-mechanism
            color: green
            linger: 0.6
          - id: request-correlation-beat-2-focus-1
            phrase: Suppose discovery uses ID one
            targets:
              - request-correlation-mechanism
            color: blue
            linger: 0.6
          - id: t-request-correlation-first
            phrase: The server may finish the status call first
            targets:
              - request-correlation-mechanism
            color: cyan
            linger: 0.4
      - say: Store each pending request by ID and consume a response once. A notification has no ID and
          receives no response, so it follows a different path.
        hold: 0.55
        motion_check:
          region:
            - 140
            - 330
            - 1700
            - 580
          minimumChangedFraction: 0.002
        visual_cues:
          - id: request-correlation-beat-3-focus-1
            phrase: Store each pending request by ID and consume a response once
            targets:
              - request-correlation-mechanism
            color: blue
            linger: 0.6
          - id: t-request-correlation-consume
            phrase: Store each pending request by ID and consume a response once
            targets:
              - request-correlation-mechanism
            color: cyan
            linger: 0.4
          - id: t-request-correlation-notify
            phrase: A notification has no ID and receives no response
            targets:
              - request-correlation-mechanism
            color: cyan
            linger: 0.4
  - id: discover-and-negotiate
    title: Which call can ask the operator a question?
    visual: A discovery reply reveals available methods, while a call lacking the advertised input
      capability returns a typed protocol error before the operation starts.
    beats:
      - say: >-
          The client asks the server what it supports. The discovery reply lists a protocol version
          and the ability to serve tools. The host can compare those with the features its adapter supports.
        hold: 0.55
        visual_cues:
          - id: discover-and-negotiate-beat-1-focus-1
            phrase: The client asks the server what it supports
            targets:
              - discover-and-negotiate-mechanism
            color: blue
            linger: 0.6
          - id: t-discover-and-negotiate-discover
            phrase: The discovery reply lists a protocol version and the ability to serve tools
            targets:
              - discover-and-negotiate-mechanism
            color: cyan
            linger: 0.4
      - say: >-
          In the July twenty-eighth, twenty twenty-six revision, each request carries its own version
          and client capabilities. Request forty-one says the client can show a form. Request
          forty-two leaves the capability list empty. Which call lets the server ask for a rollback reason?
        hold: 2
        caption_starts: ["Request forty-one", "Request forty-two", "Which call"]
        visual_cues:
          - id: discover-and-negotiate-beat-2-focus-1
            phrase: each request carries its own version and client capabilities
            targets:
              - discover-and-negotiate-mechanism
            color: blue
            linger: 0.6
          - id: t-discover-and-negotiate-requests
            phrase: each request carries its own version and client capabilities
            targets:
              - discover-and-negotiate-mechanism
            color: cyan
            linger: 0.4
      - say: >-
          Forty-one does. It declares form elicitation. When forty-two needs a form, the server
          reports the missing capability in the reply to forty-two. The client name helps with
          diagnostics. The server authenticates the caller separately.
        hold: 0.55
        caption_starts: ["When forty-two needs a form", "the server reports the missing capability", "The client name"]
        visual_cues:
          - id: discovery-allowed
            phrase: "Forty-one does"
            targets: [discover-and-negotiate-mechanism]
            linger: 0.25
          - id: discover-and-negotiate-beat-3-focus-1
            phrase: It declares form elicitation
            targets:
              - discover-and-negotiate-mechanism
            color: blue
            linger: 0.6
          - id: discovery-missing-result
            phrase: the server reports the missing capability
            targets:
              - discover-and-negotiate-mechanism
            color: pink
            linger: 0.6
          - id: t-discover-and-negotiate-compare
            phrase: It declares form elicitation
            targets:
              - discover-and-negotiate-mechanism
            color: cyan
            linger: 0.4
          - id: t-discover-and-negotiate-missing
            phrase: the server reports the missing capability
            targets:
              - discover-and-negotiate-mechanism
            color: cyan
            linger: 0.4
  - id: tools-resources-prompts
    title: Tools, resources, and prompts serve different roles
