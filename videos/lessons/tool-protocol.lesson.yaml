  - id: bounded-stdio
    title: Bound the process and its output
    visual: A five-second clock bounds the parent’s wait for its child. The backend has its own outcome.
      A separate replay reverses the replies and matches each typed ID to its pending request.
    beats:
      - say: >-
          The parent sends one line of JSON per message to a local Python server, then closes its
          input. This server reads a public release record from memory. Replies go to standard output.
          Logs go to standard error so the client can parse each reply. Limit the message size and
          the total bytes you capture. A child can fill a buffer while the parent is still waiting.
          Isolated mode and an empty environment limit inherited settings. File and network access
          need separate controls.
        hold: 0.65
        visual_cues:
          - id: bounded-stdio-beat-0
            phrase: This server reads a public release record from memory
            targets:
              - bounded-stdio-mechanism
            color: cyan
            linger: 0.6
          - id: t-bounded-stdio-send
            phrase: sends one line of JSON per message
            targets:
              - bounded-stdio-mechanism
            color: cyan
            linger: 0.4
          - id: t-bounded-stdio-limits
            phrase: Limit the message size and the total bytes you capture
            targets:
              - bounded-stdio-mechanism
            color: cyan
            linger: 0.4
      - say: >-
          Give the child five seconds to reply. If the deadline passes, the parent kills the child
          and waits for it to exit. Python’s subprocess run then raises TimeoutExpired. A helper
          process can outlive that child. If the child sent a job to another service, check that
          service for the outcome before retrying.
        hold: 0.65
        visual_cues:
          - id: bounded-stdio-beat-1
            phrase: Give the child five seconds to reply
            targets:
              - bounded-stdio-mechanism
            color: cyan
            linger: 0.6
          - id: t-bounded-stdio-timeout
            phrase: If the deadline passes, the parent kills the child and waits for it to exit
            targets:
              - bounded-stdio-mechanism
            color: cyan
            linger: 0.4
          - id: t-bounded-stdio-uncertain
            phrase: If the child sent a job to another service
            targets:
              - bounded-stdio-mechanism
            color: cyan
            linger: 0.4
      - say: >-
          The local server answers in order. Reverse its replies for this test. Three arrives first,
          then the string one, then the integer one. Each closes the request with the same ID and
          type. A duplicate finds its slot already closed. Give each outstanding request a distinct
          string or integer ID. A malformed request can return an error with a null ID when the
          server can’t identify the request. Keep that error separate. A notification has no ID
          and gets no reply.
        hold: 0.8
        caption_starts: ["Three arrives first", "then the string one", "then the integer one", "Each closes"]
        visual_cues:
          - id: bounded-stdio-beat-2
            phrase: Reverse its replies for this test
            targets:
              - bounded-stdio-mechanism
            color: cyan
            linger: 0.6
          - id: t-bounded-stdio-reverse
            phrase: Three arrives first
            targets:
              - bounded-stdio-mechanism
            color: cyan
            linger: 0.4
          - id: t-bounded-stdio-string
            phrase: then the string one
            targets: [bounded-stdio-mechanism]
            color: cyan
            linger: 0.25
          - id: t-bounded-stdio-typed
            phrase: then the integer one
            targets:
              - bounded-stdio-mechanism
            color: cyan
            linger: 0.4
  - id: validate-results
    title: A response can fail at more than one layer
    visual: A malformed call stops at the JSON-RPC envelope; a valid call with an unknown release
      returns a completed tool error; a mismatched release is rejected by host validation.
    beats:
      - say: First check whether the message is a valid request envelope and whether its ID matches. An
          invalid method or malformed parameter shape produces a protocol-level error.
        hold: 0.55
        visual_cues:
          - id: validate-results-beat-1-focus-1
            phrase: First check whether the message is a valid
            targets:
              - validate-results-mechanism
            color: blue
            linger: 0.6
          - id: validation-envelope-id
            phrase: whether its ID matches
            targets:
              - validate-results-mechanism
            color: cyan
            linger: 0.6
          - id: validation-envelope-error
            phrase: malformed parameter shape produces a protocol-level error
            targets:
              - validate-results-mechanism
            color: pink
            linger: 0.6
          - id: t-validate-results-error
            phrase: malformed parameter shape produces a protocol-level error
            targets:
              - validate-results-mechanism
            color: cyan
            linger: 0.4
      - say: A well-shaped status call can reach the tool and still fail because the requested release does
          not exist. That completed tool result carries its own error signal.
        hold: 0.75
        visual_cues:
