            color: cyan
            linger: 0.4
  - id: result-contract
    title: "Where did the status call stop?"
    visual: "The same brackets appear first outside the arguments object and then inside its release field. The first fails at dispatch and the second at the recognized tool. Two replies differ only in the release they describe."
    beats:
      - say: >-
          Look at the brackets in the first call. The dispatcher needs an arguments object and
          receives an array. It returns a protocol error. Move those brackets inside the object, into
          the release field. The dispatcher can now deliver the call to the tool. The tool needs a
          release name there, so it returns a completed result with its error flag set. A real string
          naming a missing release also returns a tool error. In the fixture, bad JSON, an unsupported
          version, an unknown method or an unknown tool stop the request at dispatch.
        hold: 0.8
        visual_cues:
          - id: contract-array
            phrase: "It returns a protocol error"
            targets: [result-contract-mechanism]
            linger: 0.25
          - id: t-result-contract-domain
            phrase: "it returns a completed result with its error flag set"
            targets: [result-contract-mechanism]
            linger: 0.25
          - id: t-result-contract-unknown
            phrase: "a missing release also returns a tool error"
            targets: [result-contract-mechanism]
            linger: 0.25
      - say: >-
          When a reply arrives, match its ID to the outstanding request, including the ID’s type.
          Require exactly one of result or error. Handle a protocol error there. Inside a result, an
          omitted result type means complete for legacy compatibility. Input required means there’s
          more of the workflow to do. Reject an unknown result type this client cannot handle. Next
          check the error flag. A true flag means tool failure even when the data looks right. This
          contract treats an omitted flag as false. The string false is an invalid flag.
        hold: 0.8
        visual_cues:
          - id: t-result-contract-legacy
            phrase: "an omitted result type means complete"
            targets: [result-contract-mechanism]
            linger: 0.25
          - id: t-result-contract-continue
            phrase: "Input required means there’s more of the workflow to do"
            targets: [result-contract-mechanism]
            linger: 0.25
          - id: t-result-contract-error
            phrase: "A true flag means tool failure"
            targets: [result-contract-mechanism]
            linger: 0.25
          - id: t-result-contract-false-string
            phrase: "The string false is an invalid flag"
            targets: [result-contract-mechanism]
            linger: 0.25
      - say: >-
          Check the three fields returned by this tool. Release and health must be strings. Status
          must be one of the allowed strings. The object must have exactly these fields. The schema
          passes. Now compare the release in the payload with the requested release. Sixteen cannot
          answer for seventeen. If the current, authorized source instead returns seventeen, the same
          schema and target checks both pass. Structured content can be any JSON value in this
          revision. This particular tool declares an object. Use the declared schema dialect, which
          defaults to draft twenty twenty dash twelve. Secure the resolver before loading remote
          references. Verify source and observation time before reporting the reading.
        hold: 0.9
        caption_starts:
          - "The schema passes"
          - "Now compare the release"
          - "Sixteen cannot answer for seventeen"
          - "If the current, authorized source"
          - "the same schema and target checks both pass"
        visual_cues:
          - id: contract-shape
            phrase: "The schema passes"
            targets: [result-contract-mechanism]
            linger: 0.25
          - id: t-result-contract-target
            phrase: "Sixteen cannot answer for seventeen"
            targets: [result-contract-mechanism]
            linger: 0.25
          - id: contract-right-input
            phrase: "instead returns seventeen"
            targets: [result-contract-mechanism]
            linger: 0.25
          - id: contract-right-result
