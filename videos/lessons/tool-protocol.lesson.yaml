            targets: [effect-count]
            linger: 0.25
            caption_boundary: true
  - id: mrtr-state
    title: "Which release was the pause for?"
    visual: "A server record and a retry sit side by side. The echoed state stays S7. Replaying the same unused record with a different release isolates the target check, then a separate replay changes only current permission."
    beats:
      - say: >-
          Go back to the reply to request twenty. The server embedded a question and gave it the key
          rollback reason. The host shows who is asking. The operator can decline or cancel. If she
          accepts, her explanation goes in the reason field under that same key. The client copies the
          opaque state, S seven, into the retry exactly as it arrived. That is a multi round-trip
          request.
        hold: 0.8
        visual_cues:
          - id: mrtr-question
            phrase: "gave it the key rollback reason"
            targets: [form-entry]
            linger: 0.25
          - id: mrtr-answer
            phrase: "her explanation goes in the reason field"
            targets: [form-entry]
            linger: 0.25
          - id: mrtr-echo
            phrase: "copies the opaque state, S seven"
            targets: [echo-entry]
            linger: 0.25
      - say: >-
          Look at the record the server kept when it issued S seven. It binds this caller, this
          rollback and version seventeen. In this example the record is still unused and has two
          minutes left. For this comparison the operator approved rollbacks of versions seventeen
          and eighteen, and the server permits both. The server verifies the record’s integrity and
          compares the retry with those bindings.
          Both sides say version seventeen. With current host approval and server permission, this
          retry passes.
        hold: 1
        visual_cues:
          - id: mrtr-saved
            phrase: "the record the server kept"
            targets: [saved-state]
            linger: 0.25
          - id: mrtr-bind
            phrase: "compares the retry with those bindings"
            targets: [retry-state]
            linger: 0.25
          - id: mrtr-match
            phrase: "With current host approval and server permission, this retry passes"
            targets: [binding-decision]
            linger: 0.25
            caption_boundary: true
      - say: >-
          Try the same unused record again. Keep the caller, reason and permissions. Change just
          the target to version eighteen. Can this retry use the pause for version seventeen?
        hold: 2.5
        caption_starts: ["Change just the target", "Can this retry use the pause"]
        visual_cues:
          - id: mrtr-rewind
            phrase: "the same unused record"
            targets: [saved-state]
            linger: 0.25
          - id: mrtr-retarget
            phrase: "the target to version eighteen"
            targets: [retry-target]
            linger: 0.25
          - id: mrtr-question-target
            phrase: "Can this retry use the pause for version seventeen"
            targets: [saved-target]
            linger: 0.25
      - say: >-
          Reject this retry. The server record still says seventeen. The retry names eighteen.
          Its new message ID pairs it with a reply. The saved state binds the rollback to the original release.
        hold: 1.1
        visual_cues:
          - id: mrtr-reject
            phrase: "Reject this retry"
            targets: [binding-decision]
            linger: 0.25
            caption_boundary: true
          - id: mrtr-compare
            phrase: "The server record still says seventeen"
            targets: [saved-target]
            linger: 0.25
      - say: >-
          Put version seventeen back in the retry. The target matches, and the pause record has two
          minutes left. While the form was open, the caller’s rollback permission expired.
          The server holds the write. For a one-time continuation, the server records when the
          state is used. If the reply to an approved write goes missing, check the backend.
          If the service supports idempotent retries, reuse the original key.
        hold: 1
        caption_starts: ["While the form was open", "The server holds the write", "If the reply"]
        visual_cues:
          - id: mrtr-restore
            phrase: "Put version seventeen back in the retry"
            targets: [retry-target]
            linger: 0.25
          - id: mrtr-revoked
            phrase: "the caller’s rollback permission expired"
            targets: [current-permission]
            linger: 0.25
          - id: mrtr-deny
            phrase: "The server holds the write"
            targets: [binding-decision]
            linger: 0.25
            caption_boundary: true
          - id: mrtr-single
            phrase: "records when the state is used"
            targets: [saved-state]
            linger: 0.25
      - say: >-
          Use the form for an ordinary reason like the one on this receipt. Keep secrets and
          credentials out of form answers. A sensitive interaction uses URL mode. The client shows the
          destination and asks before navigating. The host keeps anything that comes back as tool data
          and checks each later proposal against its own policy.
        hold: 0.7
        visual_cues:
          - id: mrtr-reason
            phrase: "an ordinary reason"
            targets: [form-entry]
            linger: 0.25
          - id: mrtr-url
            phrase: "shows the destination and asks before navigating"
            targets: [url-destination]
            linger: 0.25
  - id: era-fallback
    title: Choose a protocol era from actual evidence
    visual: Each HTTP 400 response sits beside its handling rule. A recognized
      modern error and an empty response body take different paths.
    beats:
      - say: Modern requests repeat protocol version and client capabilities under the namespaced metadata;
          optional client information is diagnostic, not authentication. Server discovery is
          mandatory to implement but optional for a modern client to call first. An
          unsupported-version response identifies a modern server and lists supported versions.
          Missing required client support returns the dedicated capability error and
          required-capabilities data. Neither error justifies silently inheriting earlier settings.
        hold: 0.65
        visual_cues:
          - id: era-fallback-beat-0
            phrase: Modern requests repeat protocol version and client capabilities under the namespaced
              metadata; optional client information is diagnostic, not authentication
            targets:
              - era-fallback-mechanism
            color: cyan
            linger: 0.6
          - id: t-era-fallback-version
            phrase: An unsupported-version response identifies a modern server and lists supported versions
            targets:
              - era-fallback-mechanism
            color: cyan
            linger: 0.4
          - id: t-era-fallback-capability
            phrase: Missing required client support returns the dedicated capability error and required-capabilities data
            targets:
              - era-fallback-mechanism
            color: cyan
            linger: 0.4
      - say: A dual-era stdio client probes discovery. A completed discovery result or recognized modern
          error keeps it in the modern era. Another error or bounded silence follows legacy fallback
          only if that client supports and permits it. Do not depend on one particular legacy error
          number. A crashed child still needs transport recovery. Earlier revisions use initialize,
          the server response, then the initialized notification before operational calls.
        hold: 0.65
        visual_cues:
          - id: era-fallback-beat-1
            phrase: A dual-era stdio client probes discovery
            targets:
              - era-fallback-mechanism
            color: cyan
            linger: 0.6
          - id: t-era-fallback-modern
            phrase: A completed discovery result or recognized modern error keeps it in the modern era
            targets:
              - era-fallback-mechanism
            color: cyan
            linger: 0.4
          - id: t-era-fallback-legacy
            phrase: Another error or bounded silence follows legacy fallback only if that client supports and
              permits it
            targets:
              - era-fallback-mechanism
            color: cyan
            linger: 0.4
      - say: "HTTP has its own fallback test: inspect the body of a four-hundred response. A recognized
          modern version, capability or header error needs correction within the modern era. An
          unrecognized or empty response can take the supported legacy route. Record which era ran
          and preserve permission checks. Roots, sampling and protocol logging are deprecated in
          this pinned revision but remain specified; their earliest removal is a revision on or
          after July twenty-eighth twenty-twenty-seven. Plan migration without treating deprecation
          as immediate removal."
        hold: 0.8
        visual_cues:
          - id: era-fallback-beat-2
            phrase: "HTTP has its own fallback test: inspect the body of a four-hundred response"
            targets:
              - era-fallback-mechanism
            color: cyan
            linger: 0.6
