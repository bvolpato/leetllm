  - id: http-identity
    title: "Which check stopped this HTTP request?"
    visual: "A local endpoint records the Origin and a valid resource token for the same read. It rejects an invalid browser origin before tool dispatch, then compares issuers within an individual OAuth flow."
    beats:
      - say: >-
          Here is a read addressed to the deployments service on loopback. The caller has a token
          issued for this resource. The request also carries an Origin outside the service’s allowed
          set. Compare the browser origin with the allowed one. A present invalid Origin requires HTTP
          four-oh-three. The tool never runs. DNS rebinding can bring browser requests to a loopback
          service. Bind locally, check the browser origin and authenticate the caller. A permitted
          origin still leaves per-release authorization to do.
        hold: 0.65
        visual_cues:
          - id: http-origin-fields
            phrase: "an Origin outside the service’s allowed set"
            targets: [origin-fields]
            linger: 0.25
          - id: t-http-identity-origin
            phrase: "A present invalid Origin requires HTTP four-oh-three"
            targets: [origin-result]
            linger: 0.25
            caption_boundary: true
      - say: >-
          For protected deployments adopting MCP’s OAuth profile, discover authorization servers
          through protected-resource metadata. Include the target resource in both authorization and
          token requests. The deployments server checks that the token was issued for this resource.
          Authorization-code clients use PKCE and verify advertised support before starting. Save the
          issuer from validated metadata with this individual flow before redirecting.
        hold: 0.65
        visual_cues:
          - id: t-http-identity-resource
            phrase: "Include the target resource in both authorization and token requests"
            targets: [http-identity-mechanism]
            linger: 0.25
          - id: t-http-identity-issuer
            phrase: "Save the issuer from validated metadata with this individual flow before redirecting"
            targets: [http-identity-mechanism]
            linger: 0.25
      - say: >-
          Before exchanging a code, compare the returned issuer exactly with the saved issuer. Even
          the change in case on the second line fails that check. If issuer support was advertised but
          the value is absent, reject the response. When support was not advertised and the value is
          absent, this check permits proceeding. Check error responses too. For an upstream API,
          obtain a separately authorized credential. The incoming MCP token is for the deployments
          server. Check the caller’s permission for the actual release there.
        hold: 0.7
        visual_cues:
          - id: t-http-identity-exact
            phrase: "Even the change in case on the second line fails that check"
            targets: [http-identity-mechanism]
            linger: 0.25
          - id: t-http-identity-missing
            phrase: "If issuer support was advertised but the value is absent, reject the response"
