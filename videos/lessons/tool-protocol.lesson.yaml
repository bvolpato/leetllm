  - id: transport-and-pause
    title: "One rollback, two request IDs"
    visual: "Two lifelines follow a local client and its server. Request 20 returns a question. The host prepares request 21, then sends it only after checking the operator’s approval."
    beats:
      - say: >-
          A status read can finish in one exchange. Suppose a canary now exceeds its error budget and
          an operator requests a rollback of version seventeen. Follow this call to a local server.
          The host starts a child process. A request travels on standard input and a reply travels on
          standard output, each as one line of JSON. The child writes diagnostics to standard error.
