            color: yellow
            linger: 0.2
      - say: "Run that same inner loop over the remaining notes. Four candidates times
          three coordinates gives twelve products. Now the inputs have two
          sizes: n candidates and d coordinates. Exact dense scoring has theta
          of n times d work. Doubling either input doubles the products;
          doubling both creates four times the work."
        hold: 0.6
