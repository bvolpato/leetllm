  - id: queue-measurement
    title: A work bound leaves waiting time to measure
    visual: RequestR1waitsforbatchfill;
      timeoutopensbatchwithoutforcingeightarrivals, then busyexecutionkeepsa
      second request queued. Separate preprocessing/execution intervals retain
      requestIDs.
    beats:
      - say: Operation counts do not measure elapsed latency. A request can wait even
          when its arithmetic fits. In this invented batch trace, request R one
          arrives at time zero and the next request arrives forty milliseconds
          later. A rule that waits for eight arrivals still has no full batch.
          Predict what a ten-millisecond batch-formation timeout changes.
        hold: 1.2
        visual_cues:
          - id: batch-wait
            phrase: still has no full batch
            targets:
              - batch-wait
            color: yellow
      - say: It releases the partial batch ten milliseconds after the first arrival.
          That bounds this formation wait under the shown scheduling
          assumptions. If the executor is already busy, admission and execution
          queues can add more delay. A batch timeout does not bound total
          request latency.
        hold: 0.8
        visual_cues:
          - id: batch-timeout
            phrase: It releases the partial batch ten milliseconds after the first arrival
            targets:
              - batch-formation
            color: yellow
          - id: batch-busy
            phrase: If the executor is already busy
            targets:
              - batch-execution-queue
            color: yellow
      - say: Time preprocessing, queueing and accelerator execution separately on the
          intended workload. A worker pool can overlap preparation with
          execution but adds scheduling, memory and transfer costs. Long-running
          pauses can also come from allocation or cyclic garbage collection.
          Measure before changing collection policy; disabling automatic cyclic
          collection leaves reference counting active and can accumulate
          unreachable cycles.
        hold: 0.8
        visual_cues:
          - id: batch-measure
            phrase: Time preprocessing, queueing and accelerator execution separately
            targets:
              - batch-execution-queue
            color: yellow
