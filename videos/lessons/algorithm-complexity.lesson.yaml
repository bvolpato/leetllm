      width extends the counted work grid.
    beats:
      - say: Return to finding a useful passage when we don't know its name. Here are
          supplied three-coordinate representations of the same four notes.
          Multiply matching coordinates and add them to score the first note.
          The zero query coordinates still take multiplication steps in this
          dense loop. Count the work even when a contribution is zero.
