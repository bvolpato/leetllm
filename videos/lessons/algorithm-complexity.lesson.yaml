  - id: radix-prefix
    title: Follow a shared exact prefix
    visual: Four familiar English words share the prefix pla. The scan repeats those
      first three character comparisons for each word. A radix tree stores the
      shared non-branching run once, follows that edge, then branches to the
      four word completions.
    beats:
      - say: "Take four familiar words: play, place, planet, and plaza. They share the
          prefix pla. A scan checks the first three letters in every word.
          Follow those repeated comparisons."
        hold: 0.5
        visual_cues:
          - id: prefix-query
            phrase: They share the prefix pla
            targets:
              - prefix-query
            color: cyan
            linger: 0.1
          - id: prefix-scan
            phrase: Follow those repeated comparisons
            targets:
              - prefix-words
              - prefix-scan
            color: yellow
            linger: 0.2
      - say: A radix tree stores the shared run pla once in a compressed edge. Follow
          that edge to the branch, then take y, ce, net, or za to the matching
          word. This lookup compares three characters, then returns four
          completions. It answers an exact-prefix question. Vector scoring
          answers which meanings are nearby. Returning completions has its own
          output cost. With expected constant-time child lookup, finding a
          matched prefix of length p takes order p plus one work, including
          detection of an immediate miss. Shared tokens alone do not establish
          compatible model state or cache scope.
        hold: 0.6
        visual_cues:
