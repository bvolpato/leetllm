  - id: amortized-append
    title: Who pays when the array fills?
    visual: An array receives stable note references. A full capacity-two array
      allocates a larger block and copies both references before accepting the
      next. Further real append and doubling events accumulate write costs until
      the array stores eight references.
    beats:
      - say: Now keep arriving note references in a growable array. Two slots are full.
          To append another reference, allocate a larger block, copy the old
          references, then write the new one. This single append did extra work
          because it triggered a resize.
        hold: 0.5
        motion_check:
          region:
            - 230
            - 390
            - 1430
            - 360
          minimumChangedFraction: 0.002
        visual_cues:
          - id: append-resize
            phrase: allocate a larger block, copy the old references, then write the new one
            targets:
              - append-work
            color: yellow
            linger: 0.2
      - say: Continue the same doubling rule until the array holds eight references.
          Most arrivals need one write; occasional arrivals copy the existing
          block as well. Add every write to the running total. Across the
          sequence, copies form a geometric sum, so total work grows linearly
          with the number of arriving references. That gives constant amortized
          cost per append, while an individual resize can cost linear work.
          Amortized analysis accounts for the operation history; it does not
          assume random arrivals. An expected hash bound instead depends on the
          stated hashing assumptions.
        hold: 0.6
        visual_cues:
          - id: append-sequence
            phrase: Continue the same doubling rule until the array holds eight references
            targets:
              - append-work
            color: cyan
            linger: 0.2
          - id: append-total
            phrase: Add every write to the running total
            targets:
              - append-total
            color: yellow
            linger: 0.2
          - id: append-bound
            phrase: constant amortized cost per append
            targets:
              - append-total
            color: green
            linger: 0.3
