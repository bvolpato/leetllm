      entry.
    beats:
      - say: A hash table offers another exact-name lookup. A hash function turns the
          key into a bucket address. Follow issuer-check to its bucket, then
          compare the stored key for equality. This small table uses the
          displayed deterministic hash, so you can check where every key went.
        hold: 0.5
        visual_cues:
