  - id: top-k
    title: Keep only the winners we need
    visual: The same four computed scores enter a capacity-two min-heap. The
      issuer-claim note replaces the weaker clock-drift note, and the release
      checklist is rejected while the heap stays fixed. A taller example exposes
      one logarithmic repair path.
    beats:
      - say: We need two notes for closer review. A full sort would order every score. A
          bounded min-heap keeps only the strongest scores seen so far, with the
          weakest retained score at its root. Let the first two arrive. The
          runner-clock note is the cutoff the next candidate must beat.
        hold: 0.5
        visual_cues:
          - id: heap-first
            phrase: Let the first two arrive
            targets:
              - heap-work
            color: cyan
            linger: 0.2
      - say: The issuer-claim note scores above that cutoff. It reaches the root and
          replaces the runner-clock note. The release checklist scores below the
          new cutoff and is rejected; the heap stays unchanged. A full ranking
          confirms the same two note identities.
        hold: 0.6
        motion_check:
          region:
            - 750
            - 350
            - 1050
            - 600
          minimumChangedFraction: 0.002
        visual_cues:
