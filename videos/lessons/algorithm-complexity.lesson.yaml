  - id: opening
    title: Can the first result explain the failed login test?
    visual: An engineer asks why a login test failed after an identity-provider
      update. The first authorized note says the login fixture expired, a
      plausible clue. The viewer predicts whether to stop at that note or
      inspect the remaining notes before the cause is revealed.
    beats:
      - say: An engineer asks why a login test failed after an identity-provider update.
          The first note says the login fixture expired. That's plausible. Would
          you stop here or read the remaining notes?
        hold: 1.2
        visual_cues:
          - id: opening-open
            phrase: first note says the login fixture expired
            targets:
              - passage-work
            color: cyan
            linger: 0.2
      - say: Compare login, test, and fail with the first note. Two terms match, so it
          looks plausible. Read the remaining notes; another may explain the
          provider update. Inspect all four. An algorithm is the recipe we
          follow. Complexity asks how its work grows with input size.
        hold: 0.6
        visual_cues:
          - id: opening-terms
            phrase: login, test, and fail
            targets:
              - passage-work
            color: yellow
            linger: 0.2
          - id: opening-rest
            phrase: Read the remaining notes
            targets:
              - scan-work
            color: cyan
            linger: 0.2
          - id: opening-result
            phrase: Inspect all four
            targets:
              - scan-work
            color: cyan
            linger: 0.3
  - id: scan
    title: Give the same recipe twice the input
    visual: Four visited candidate tiles are retained. Four new neutral tiles extend
      the input, then acquire one inspection mark each. A separate fixed-width
      inner loop demonstrates why two nested loops can still have linear work.
    beats:
      - say: Keep the four old notes and add four more. Predict the inspection count.
          Let the second scan visit the rows one at a time. Each extra note adds
          one visit, so twice the input produces twice this work.
        hold: 0.5
        motion_check:
          region:
            - 200
            - 360
            - 1500
            - 300
          minimumChangedFraction: 0.002
        visual_cues:
          - id: scan-double
            phrase: add four more
            targets:
              - scan-work
            color: cyan
            linger: 0.1
          - id: scan-visits
            phrase: Let the second scan visit the rows one at a time
            targets:
              - scan-work
            color: yellow
            linger: 0.2
          - id: scan-linear
            phrase: twice the input produces twice this work
            targets:
              - scan-bound
            color: green
            linger: 0.2
      - say: Write the input size as n. A complete scan makes n visits. Theta of n names
          that tight growth shape. Big O names an upper bound, so O of n also
          applies. With passage length bounded, the work inside each visit stays
          bounded too. Even a fixed inner loop adds the same strip of work to
          every row. If r notes match, sorting those results adds order r log r
          work. The full function can reach order n log n when every note
          matches. The candidate scan and result ordering have separate costs.
        hold: 0.6
        visual_cues:
          - id: scan-notation
            phrase: Theta of n names that tight growth shape
            targets:
              - scan-bound
            color: yellow
            linger: 0.2
          - id: scan-inner
            phrase: a fixed inner loop adds the same strip of work to every row
            targets:
              - scan-inner-work
            color: cyan
            linger: 0.3
  - id: ordered-search
    title: What does sorted order buy us?
    visual: The same note identities appear in a maintained sorted catalog with four
      additional keys. A query for the verifier's issuer-check note visits real
      midpoints and discards impossible halves. A new identity-provider guide
      then shifts later references into a spare array slot.
    beats:
      - say: Suppose we already know the note's name. Find issuer-check in this sorted
          catalog. Inspect the middle key. Its alphabetical position rules out
          half the remaining range. Repeat on the smaller range, then check the
          surviving key.
        hold: 0.5
        visual_cues:
          - id: binary-first
            phrase: Inspect the middle key
            targets:
              - binary-work
            color: yellow
            linger: 0.1
          - id: binary-rest
            phrase: Repeat on the smaller range, then check the surviving key
            targets:
              - binary-work
            color: cyan
            linger: 0.3
      - say: Every comparison roughly halves the possibilities. That repeated halving
          gives logarithmic lookup work. Sorted order makes this possible. Now
          an identity-provider guide arrives in the middle. Later references
          must move to make room, so insertion into an array costs linear
          movement.
        hold: 0.6
        visual_cues:
          - id: binary-bound
            phrase: logarithmic lookup work
            targets:
              - binary-bound
            color: green
            linger: 0.2
          - id: binary-insert
            phrase: later references must move to make room
            targets:
              - binary-work
            color: yellow
            linger: 0.3
