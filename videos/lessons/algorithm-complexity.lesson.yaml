            color: pink
            linger: 0.2
      - say: With more retained values, repairing a heap follows one parent-child path.
          Its height grows logarithmically with k. For at least two retained
          values, selection is O of n log k with O of k retained storage. The
          coordinate counter remains unchanged. Every exact score was computed
