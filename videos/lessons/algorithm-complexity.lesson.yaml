  - id: cache-volume
    title: Count stored state separately from attention work
    visual: Keys and values occupy fixed layer/head/coordinate axes; the same token
      slab replicates across16streams and grows with context while the
      score-cell square stays separate.
    beats:
      - say: Cached keys and values save recomputing past states. They still occupy
          memory. Consider an example architecture with thirty-two layers, eight
          key-value heads, one hundred twenty-eight coordinates per head, and
          two bytes per stored value. There are separate keys and values, so
          multiply by two again. One stored token uses one hundred thirty-one
          thousand seventy-two bytes, or one hundred twenty-eight kibibytes.
        hold: 1.2
        visual_cues:
          - id: cache-token
            phrase: multiply by two again
            targets:
              - cache-token-slabs
              - cache-token-bytes
            color: yellow
          - id: cache-token-kibi
            phrase: or one hundred twenty-eight kibibytes
            targets:
              - cache-token-bytes
            color: green
            linger: 0.2
      - say: Thirty-two query heads can share those eight key-value heads in groups of
          four. Cache storage uses the key-value head count. Each query head
          still scores its own attention row. Keep the storage count separate
          from query-head arithmetic.
        hold: 0.8
        visual_cues:
