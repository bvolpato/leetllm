            color: yellow
            linger: 0.2
      - say: Expected constant lookup assumes a useful hash spread and a controlled
          table load. Force every key into one bucket, then look up
          missing-login-note. The chain has no match, so the search checks each
          stored key. In the worst case, this work grows linearly with n. The
