  - id: quantization-operation
    title: Where does the rounding error go?
    visual: >-
      Integer reconstruction leads into a fixed output ruler. The exact dot product stays marked
      as two ways of rounding the same operation land on opposite sides of it.
    beats:
      - say: >-
          First give the weights a storage grid. For this symmetric eight-bit example, the largest
          absolute weight gets code one hundred twenty-seven. Divide that weight magnitude by one
          hundred twenty-seven to get the step size. An all-zero tensor can use any nonzero step.
          Round each weight to the nearest grid point. Multiply its code by the step to read the
          weight back. The largest difference here is about point zero zero two nine. Serving needs
          those codes in a packed tensor.
        hold: 0.9
        visual_cues:
          - id: quant-round
            phrase: "Round each weight to the nearest grid point"
            targets: [quantization-operation-mechanism]
          - id: quant-read
            phrase: "Multiply its code by the step"
            targets: [quantization-operation-mechanism]
          - id: quant-max
            phrase: "about point zero zero two nine"
            targets: [quantization-operation-mechanism]
            caption_boundary: true
      - say: >-
          Which rounding error matters to the output? Look at these two channels. The first weight is
          off by just one hundredth, but the input multiplies that by ten. Its contribution is a
          tenth. The second weight is off by four hundredths, and its input is one. Its contribution
          is four hundredths. This is why activation-aware quantization, or A W Q, uses calibration
          inputs to choose channel scales. The method can keep weights at low precision throughout.
        hold: 1
        visual_cues:
          - id: quant-error-one
            phrase: "Its contribution is a tenth"
            targets: [quantization-operation-mechanism]
            caption_boundary: true
          - id: quant-error-two
            phrase: "Its contribution is four hundredths"
            targets: [quantization-operation-mechanism]
            caption_boundary: true
      - say: >-
          Try scaling one channel on this simpler grid, with a step of one tenth. The first weight is
          point two four and its input is ten. Add the second channel and the exact output is two
          point eight four. Leave a mark there. Rounding the weights directly gives two point four.
          That's where the first attempt lands.
        hold: 0.9
        visual_cues:
          - id: quant-exact
            phrase: "the exact output is two point eight four"
            targets: [quantization-operation-mechanism]
            caption_boundary: true
          - id: quant-plain
            phrase: "Rounding the weights directly gives two point four"
            targets: [quantization-operation-mechanism]
            caption_boundary: true
      - say: >-
          Now double the first weight and halve its input. Before rounding, that product is
          unchanged. On the same grid, point four eight rounds to point five. Multiply by five and
          add the rounded second channel. Where does this attempt land relative to the mark?
        hold: 2.6
        visual_cues:
          - id: quant-rescale
            phrase: "double the first weight and halve its input"
            targets: [quantization-operation-mechanism]
          - id: quant-round-scaled
            phrase: "point four eight rounds to point five"
            targets: [quantization-operation-mechanism]
          - id: quant-predict
            phrase: "Where does this attempt land relative to the mark"
            targets: [quantization-operation-mechanism]
      - say: >-
          Two point nine. Just six hundredths above the exact output, compared with forty-four
          hundredths below it on the first attempt. Reciprocal scaling preserved the exact operation
          and changed the error after rounding. This little decimal grid illustrates the idea. A W Q
          searches for scales on calibration data.
        hold: 1.1
        visual_cues:
          - id: quant-scaled
            phrase: "Two point nine"
            targets: [quantization-operation-mechanism]
            caption_boundary: true
          - id: quant-distance
            phrase: "forty-four hundredths below it on the first attempt"
            targets: [quantization-operation-mechanism]
      - say: >-
          G P T Q also starts from calibration inputs. It compensates for a rounded weight by
          adjusting weights that remain. Suppose the first input is two. Rounding its weight down by
          point zero five loses a tenth at the output. The second input is one. Raise its weight by a
          tenth and the sum recovers before that weight is rounded. G P T Q chooses corrections using
          damped inverse-Hessian information from the layer's squared reconstruction error. For a
          linear layer its Hessian is twice X times X transpose. Calibration and the final grid
          determine the error that remains. Other compression methods train a smaller student, prune
          structure, or simulate quantization during training.
        hold: 1
        visual_cues:
          - id: quant-deficit
            phrase: "loses a tenth at the output"
            targets: [quantization-operation-mechanism]
            caption_boundary: true
          - id: quant-compensate
            phrase: "the sum recovers before that weight is rounded"
            targets: [quantization-operation-mechanism]
            caption_boundary: true
  - id: serving
    title: Iteration-level scheduling reuses a freed slot
    visual: Two requests share a static batch. A short request ends at iteration 15
      while the second continues to 600. A 45-iteration zoom shows labeled
      replacement request C entering the same freed slot. A separate close-up
      replays request B's positions 15 through 20 as its fifth logical cache
      block maps to physical slot 7.
    beats:
      - say: >
          Suppose one request needs fifteen decode iterations and another needs
          six hundred. In a static batch, the short request finishes early and
          its slot waits while the long request continues.
        hold: 0.8
        visual_cues:
          - id: static-request-slot-b1-1
            phrase: short request finishes early
            targets:
              - static-request-slot
            color: blue
            linger: 0.6
      - say: >
          The gap is five hundred eighty-five iterations. Iteration-level
          scheduling can admit another request into that capacity as soon as
          cache space, prefill work, and policy allow.
        hold: 0.8
        visual_cues:
          - id: reused-request-slot-b2-1
            phrase: admit another request
            targets:
              - reused-request-slot
            color: green
            linger: 0.6
      - say: >
          Each replacement request also needs KV-cache capacity, so the
          scheduler must account for the memory budget we just computed. In the
          lower strip, four-token logical blocks map to noncontiguous physical
          slots as request B grows. PagedAttention uses block allocation to
          reduce over-reservation and fragmentation, while the token states
          still consume memory.
        hold: 0.9
        motion_check:
          region:
            - 370
            - 850
            - 1410
            - 80
          minimumChangedFraction: 0.002
        visual_cues:
          - id: physical-cache-slot-0-b3-1
            phrase: noncontiguous physical slots
            targets:
              - physical-cache-slot-0
            color: green
            linger: 0.6
  - id: serving-measurements
    title: What does one request cost to serve?
    visual: Token timestamps split the waiting time into three intervals. Two four-slot cache
      blocks show the storage occupied by six live tokens.
    beats:
      - say: Start the clock when the model server receives the request. Mark the first token
          at two hundred milliseconds. That's time to first token. It includes queueing, prefill
          and the first generation step. A client can also wait for retrieval and the network.
          Use the server's token timestamps for the gaps between outputs. One network chunk can
          carry several tokens.
        hold: 0.8
        visual_cues:
          - id: serving-measurements-b1
            phrase: Mark the first token at two hundred milliseconds
            targets:
              - serving-measurements-mechanism
            linger: 0.8
      - say: The next two tokens appear at two hundred forty and three hundred milliseconds.
          Read the gaps. Forty milliseconds between tokens one and two. Sixty between two and
          three. For throughput, count output tokens from every active stream and divide by
          elapsed time. Under the same load, measure the memory for weights, K V states,
          activations and workspace separately.
        caption_starts:
          - "Forty milliseconds between tokens"
          - "Sixty between two and three"
        hold: 0.8
        visual_cues:
          - id: serving-measurements-b2
            phrase: The next two tokens appear at two hundred forty and three hundred milliseconds
            targets:
              - serving-measurements-mechanism
            linger: 0.8
          - id: gap-forty
            phrase: Forty milliseconds between tokens one and two
            targets: [serving-measurements-mechanism]
          - id: gap-sixty
            phrase: Sixty between two and three
            targets: [serving-measurements-mechanism]
      - say: Give this request six live tokens. Its cache grows four slots at a time. The first
          four tokens fill one block. The next two need a second block, leaving two slots free.
          PagedAttention can place those blocks in separate parts of memory and allocate them
          as the request grows. Requests with a common prefix can share its blocks. Reference
          counts track the readers, and copy-on-write gives a writer its own block.
        hold: 0.8
        visual_cues:
          - id: serving-measurements-b3
            phrase: The next two need a second block
            targets:
              - serving-measurements-mechanism
            linger: 0.8
  - id: speculative-prefix
    title: Only the accepted draft prefix becomes target output
    visual: Retained policy request and named artifacts construct a specific
      prediction, operation and consequence; separate supplied teaching fixtures
      expose the underlying arithmetic.
    beats:
      - say: A proposal mechanism drafts five tokens while the target verifies them in a
          parallel pass. Suppose the first four pass and the fifth fails. Emit
          those four and a correction sampled by the target algorithm; a later
          apparently good proposal cannot skip past the first rejection. If all
