scenes:
  - id: opening
    title: Does this key still qualify for rotation?
    visual: >-
      A service key marks 42 days on an age scale. The cutoff sweeps from the old minimum to the
      new one as the shot opens. Both endpoints stay marked.
      The policy verdict and the app reply appear separately.
    beats:
      - say: >-
          The cutoff for rotating a stale key moves from thirty days to sixty.
        hold: 0.9
        visual_cues:
          - id: open-move
            phrase: "The cutoff for rotating a stale key moves from thirty days to sixty"
            targets: [opening-mechanism]
      - say: >-
          This key is forty-two days old. It qualified under the old rule. Does it still qualify?
        caption_starts:
          - "Does it still qualify"
        hold: 2.7
        visual_cues:
          - id: open-predict
            phrase: "Does it still qualify"
            targets: [opening-mechanism]
      - say: >-
          It falls short. The app still says eligible. Where did that answer come from?
        hold: 1.1
        visual_cues:
          - id: open-expected
            phrase: "It falls short"
            targets: [opening-mechanism]
            caption_boundary: true
          - id: open-observed
            phrase: "the app still says eligible"
            targets: [opening-mechanism]
            caption_boundary: true
      - say: >-
          Training produces a checkpoint, a saved set of model weights. The app can use the same
          checkpoint under either rule. For this request, the app supplies the age of the key and
          the current policy passage. Let's follow the weights back to the text the model learned from.
        caption_starts:
          - "For this request"
        hold: 1
        visual_cues:
          - id: open-build
            phrase: "a saved set of model weights"
            targets: [opening-mechanism]
          - id: open-serve
            phrase: "For this request"
            targets: [opening-mechanism]
  - id: curated-data
    title: Which text reaches training?
    visual: Ten copies collapse onto a single retained paragraph. Two published filters then
      show how the choice of language and repetition rules changes the training text.
    beats:
      - say: Ten pages contain the same paragraph. Keep them all and the model gets ten chances
          to practice the same words. C C Net normalizes each paragraph and hashes it with a
          truncated S H A one digest. These ten hashes match. Keep one copy. The model can still
          memorize it, but that paragraph now occurs just once.
        hold: 0.8
        visual_cues:
          - id: curated-data-b1
            phrase: Keep one copy
            targets:
              - curated-data-mechanism
            linger: 0.8
      - say: Which writing survives the filters? C C Net uses fastText to identify languages
          and a Wikipedia-trained language model to score text by perplexity. Original C four
          selects English text and removes repeated three-sentence spans. For near-duplicates,
          MinHash can find similar passages. Sample the discarded text to see which languages and
          topics lost examples. The words that survive are the ones the tokenizer will count.
        hold: 0.8
        visual_cues:
          - id: curated-data-b2
            phrase: Original C four selects English text
            targets:
              - curated-data-mechanism
            linger: 0.8
  - id: pretraining
    title: Which pieces become a token?
    visual: >-
      Each word carries its frequency. Count the same adjacent pair in two rows, merge the
      winning pair in place, then follow one observed token into training loss.
    beats:
      - say: >-
          A base model learns from text. First we need pieces it can predict. In this little corpus
          the word key occurs four times, stale three times, and rotation twice. We'll skip
          preprocessing and start with letters inside each word. A pair in a word we saw three
          times gets counted three times.
        hold: 0.8
      - say: >-
          Look at the letters t and a. Here they are in stale. Here they are again in rotation.
          Compare their combined count with the k and e at the start of key. Which of these two pairs
          occurs more often?
        hold: 2.1
        visual_cues:
          - id: bpe-stale
            phrase: "Here they are in stale"
            targets: [pretraining-mechanism]
          - id: bpe-rotation
            phrase: "Here they are again in rotation"
            targets: [pretraining-mechanism]
          - id: bpe-key
            phrase: "the k and e at the start of key"
            targets: [pretraining-mechanism]
      - say: >-
          T followed by a occurs five times. Three plus two beats four. Join those letters wherever
          they sit together. The two rows now share one token. Recount the neighbors of that new
          piece before choosing another merge. That's one step of byte-pair encoding.
        hold: 0.9
        visual_cues:
          - id: bpe-winner
            phrase: "T followed by a occurs five times"
            targets: [pretraining-mechanism]
            caption_boundary: true
          - id: bpe-join
            phrase: "Join those letters wherever they sit together"
            targets: [pretraining-mechanism]
      - say: >-
          Read the merged rotation row. After r and o, the observed next token is the piece we just
          made. Suppose the model gave it probability point two. The training loss is minus the
          natural log of that probability, about one point six one nats. On the same target, raise
          the probability to point eight. The loss drops to about point two two nats. Training
          adjusts weights to reduce losses like these across examples. That teaches the model to
          predict text. The current rotation rule still comes from the policy.
        hold: 1
        visual_cues:
          - id: bpe-target
            phrase: "the observed next token is the piece we just made"
            targets: [pretraining-mechanism]
          - id: bpe-low
            phrase: "about one point six one nats"
            targets: [pretraining-mechanism]
            caption_boundary: true
          - id: bpe-high
            phrase: "raise the probability to point eight"
            targets: [pretraining-mechanism]
          - id: bpe-high-loss
            phrase: "about point two two nats"
            targets: [pretraining-mechanism]
            caption_boundary: true
  - id: compute-budget
    title: Training allocation depends on the compute objective
    visual: Reported dense-model parameter and token counts produce approximate
      six-N-D training FLOP estimates. Each row appears with its own computed
      quantity.
    beats:
      - say: >
          A useful first estimate for dense-model training is six times
          parameter count times token count. Gopher’s reported two hundred
          eighty billion parameters and three hundred billion tokens give about
          five point zero four times ten to the twenty-third FLOPs.
        hold: 0.8
        visual_cues:
          - id: dense-run-flops-0-b1-1
            phrase: five point zero four
            targets:
              - dense-run-flops-0
            color: cyan
            linger: 0.6
      - say: >
          Chinchilla’s seventy-billion-parameter run used one point four
          trillion tokens. The same approximation gives five point eight eight
          times ten to the twenty-third FLOPs, near the Gopher estimate with a
          different allocation.
        hold: 0.8
        visual_cues:
          - id: dense-run-flops-1-b2-1
            phrase: five point eight eight
            targets:
              - dense-run-flops-1
            color: cyan
            linger: 0.6
      - say: >
          Llama 3’s eight-billion-parameter model trained on about fifteen
          trillion tokens reflects a different goal: useful capability from a
          smaller model with recurring inference costs in view. Training and
          serving optimize different budgets.
        hold: 0.85
        visual_cues:
          - id: compute-allocation-2-b3-1
            phrase: recurring inference costs
            targets:
              - compute-allocation-2
            color: yellow
            linger: 0.6
      - say: Under the fitted Chinchilla rule, parameters and tokens each grow with the square
          root of the training budget. Give training four times the compute. The square doubles
          in width and height. That's roughly twice as many parameters and twice as many tokens.
          Six N D estimates dense training arithmetic. Hardware utilization and the extra cost of
          long-sequence attention also matter when you plan the run.
        hold: 0.8
        visual_cues:
          - id: compute-budget-extension-4
            phrase: Give training four times the compute
            targets:
              - compute-budget-mechanism
            linger: 0.8
      - say: Both models meet our quality target. The smaller one costs half a unit more to
          train, but saves three tenths on each request. After one request it's still more
          expensive overall. Send a second request. Now the smaller model costs one point four
          units in total, against one point five. Run them out to twenty requests. The total
          cost is five units for the smaller model and ten point five for the other.
        caption_starts:
          - "Now the smaller model costs"
          - "The total cost is five units"
        hold: 0.8
        visual_cues:
          - id: compute-budget-extension-5
            phrase: Send a second request
            targets:
              - compute-budget-mechanism
            linger: 0.8
          - id: compute-twenty
            phrase: Run them out to twenty requests
            targets:
              - compute-budget-mechanism
            linger: 0.8
  - id: post-training
    title: Two ways to report the same decision
    visual: >-
      An assistant demonstration becomes a preference pair. A field-only verifier grades a
      correct JSON record, a changed Boolean, and correct fields paired with a false sentence.
    beats:
      - say: >-
          Give the model an example of the answer we want. The system asks for a structured decision.
          The user supplies the stale key, its age and the thirty-day rule. The assistant's example
          answer says eligible and cites the policy. Training on demonstrations like this is
          supervised fine-tuning.
        hold: 0.9
        visual_cues:
          - id: post-demo
            phrase: "The assistant's example answer"
            targets: [post-training-mechanism]
      - say: >-
          Give two candidates the same key facts and ask each to report the decision. Each calls
          the key eligible. Only one says a rotation finished. There was no job.
          We'd choose the answer that reports what happened
          and reject the invented claim. A preference pair records that choice.
        hold: 0.8
        visual_cues:
          - id: post-pair
            phrase: "Only one says a rotation finished"
            targets: [post-training-mechanism]
          - id: post-choice
            phrase: "reject the invented claim"
            targets: [post-training-mechanism]
            caption_boundary: true
      - say: >-
          Try a checker on the output. It reads three fields. The eligible verdict, P-seven and a
          false action flag match the fixture, so the score is one. Flip the action flag to true. The
          score drops to zero. Now restore the fields and add one sentence beneath them. It says the
          rotation finished. What score will this checker give?
        hold: 2.4
        visual_cues:
          - id: post-good
            phrase: "the score is one"
            targets: [post-training-mechanism]
            caption_boundary: true
          - id: post-flag
            phrase: "Flip the action flag to true"
            targets: [post-training-mechanism]
          - id: post-zero
            phrase: "The score drops to zero"
            targets: [post-training-mechanism]
            caption_boundary: true
          - id: post-prose
            phrase: "Now restore the fields and add one sentence beneath them"
            targets: [post-training-mechanism]
      - say: >-
          One again. The three fields match, and the checker never reads that sentence. A user would
          see a claim the checker missed. Build the displayed job status from verified execution
          records, or check every channel that can make the claim.
        hold: 1.2
        visual_cues:
          - id: post-blind
            phrase: "One again"
            targets: [post-training-mechanism]
            caption_boundary: true
  - id: assistant-loss-contract
    title: Which parts of a chat supply targets?
    visual: >-
      System, user and assistant spans stay in the input. An independent target track keeps the
      reply supervised. An arrow connects the age and rule to the reply they help predict.
    beats:
      - say: >-
          Put the demonstration through the checkpoint's chat template. It arranges the system
          instruction, user request and assistant reply in one sequence. To train on the reply, keep
          the whole prompt in view. In this assistant-only recipe, mask the prompt targets. Only the
          assistant span contributes direct next-token loss.
        hold: 1
        visual_cues:
          - id: mask-prompt
            phrase: "mask the prompt targets"
            targets: [assistant-loss-contract-mechanism]
          - id: mask-reply
            phrase: "Only the assistant span contributes direct next-token loss"
            targets: [assistant-loss-contract-mechanism]
      - say: >-
          Take the value true in the reply. To predict it, the model can use the age and the rule
          earlier in the conversation. An error on that prediction can send a gradient back through those prompt
          computations. Seeing a gradient there is consistent with masking their direct targets.
        hold: 1
        visual_cues:
          - id: mask-condition
            phrase: "the age and the rule earlier in the conversation"
            targets: [assistant-loss-contract-mechanism]
      - say: >-
          The template must identify the assistant span and the recipe must select it. Another recipe
          can train on the full sequence. Before training, inspect the answer itself. Remove the
          policy ID and the example still parses as JSON, but it teaches the model to omit a required
          field. Check types, extra fields, the evidence and the verdict too.
        hold: 0.9
        visual_cues:
          - id: mask-audit
            phrase: "Remove the policy ID"
            targets: [assistant-loss-contract-mechanism]
  - id: preference-and-reward
    title: Different objectives change weights through different evidence
    visual: Retained policy request and named artifacts construct a specific
      prediction, operation and consequence; separate supplied teaching fixtures
      expose the underlying arithmetic.
    beats:
      - say: Start with the same two answers. We prefer the one that reports the job record
          accurately. Instruct G P T used rankings like these to train a reward model. It then
          scored new responses with that model and updated the policy using P P O. D P O takes
          the pair straight into training. It compares the probabilities of the chosen and
          rejected answers relative to a reference policy. The gradient of that preference loss
          updates the weights.
        hold: 0.8
        visual_cues:
          - id: preference-and-reward-b1
            phrase: Start with the same two answers
            targets:
              - preference-and-reward-mechanism
            linger: 0.8
      - say: Verifiable-reward training uses checkable outcomes such as an answer or
          executed tests to shape parameter updates. DeepSeek R one Zero used
          reinforcement learning without preliminary supervised fine-tuning; R
          one combined supervised data and reinforcement learning. Look at the bottom row.
          Its fields earned full credit even though its sentence contradicts the job record.
          A training run that used this score would reward that answer. Build the status the
          user sees from the execution receipt.
        hold: 0.8
        visual_cues:
          - id: preference-and-reward-b2
            phrase: Verifiable-reward training uses checkable outcomes such as an answer or
              executed tests to shape parameter updates
            targets:
              - preference-and-reward-mechanism
            linger: 0.8
      - say: At request time, the same checkpoint can generate several candidates and score
          them, or spend more tokens reasoning through one answer. That's test-time compute.
          Try it on the same cases. How much quality did the extra time and cost buy?
        hold: 0.8
        visual_cues:
          - id: preference-and-reward-b3
            phrase: That's test-time compute
            targets:
              - preference-and-reward-mechanism
            linger: 0.8
  - id: benchmark-evidence
    title: Did this question appear in training?
    visual: Public benchmarks and application cases test different skills. A sample search
      records the number of documents inspected, the match type and the result.
    beats:
      - say: M M L U samples fifty-seven academic subjects, while G S M eight K tests
          grade-school multistep mathematics. For the key assistant, we also need cases that
          exercise the live rotation rule. A public math problem can turn up in a web crawl,
          answer and all. Remembering it would raise the model's score.
        hold: 0.8
        visual_cues:
          - id: benchmark-evidence-b1
            phrase: M M L U samples fifty-seven academic subjects, while G S M eight K tests
              grade-school multistep mathematics
            targets:
              - benchmark-evidence-mechanism
            linger: 0.8
      - say: Search fifty thousand training documents for the exact question. Zero matches.
          Record all three facts together. Another document could use different wording, or sit
          outside the sample. If you find a match, read it. A common phrase carries less evidence
          than a copied problem and its answer. Try new names or numbers, and check whether the
          problem got harder. Fresh cases written after a known training cutoff give you another
          comparison. A published canary string gives you one more thing to search for.
        caption_starts:
          - "Zero matches"
        hold: 0.8
        visual_cues:
          - id: benchmark-evidence-b2
            phrase: Zero matches
            targets:
              - benchmark-evidence-mechanism
            linger: 0.8
  - id: judge-calibration
    title: Two ballots for one answer pair
    visual: >-
      The same two answer slips trade positions. Both ballots are kept and lined up by answer
      identity so the viewer can see the disagreement.
    beats:
      - say: >-
          These two answers are for the same request. Answer A says that the key qualifies and no job
          ran. Answer B claims a rotation finished. In the first trial the judge picks A. Keep the
          ballot. Now swap the positions and leave every word alone. The second ballot comes back for
          B. What stayed the same about the judge's choices?
        hold: 2.6
        visual_cues:
          - id: judge-first
            phrase: "the judge picks A"
            targets: [judge-calibration-mechanism]
            caption_boundary: true
          - id: judge-swap
            phrase: "swap the positions"
            targets: [judge-calibration-mechanism]
          - id: judge-second
            phrase: "The second ballot comes back for B"
            targets: [judge-calibration-mechanism]
            caption_boundary: true
          - id: judge-question
            phrase: "What stayed the same about the judge's choices"
            targets: [judge-calibration-mechanism]
      - say: >-
          It picked the first position twice. The two ballots disagree on which answer is better.
          Count both. Throwing out pairs like this changes the denominator. For this request, the job
          record can settle the factual claim regardless of how the judge voted.
        hold: 1
        visual_cues:
          - id: judge-position
            phrase: "It picked the first position twice"
            targets: [judge-calibration-mechanism]
            caption_boundary: true
      - say: >-
          To check whether length influences the judge, vary length while holding the answer's
          substance fixed. To investigate a possible preference for its own model family, blind the
          names and control for differences in quality and style. The M T Bench study looked at these
          effects. Chatbot Arena collects human preferences. Calibrate your scoring rubric against
          blinded human judgments and the records for your task.
        hold: 0.9
  - id: evaluation
    title: Grade five answers under the 30-day rule
    visual: >-
      Five saved replies share a grading sheet. The 50-day case opens beside its execution record
      for the viewer to grade. The sheet then shows which field failed in each rejected reply.
    beats:
      - say: >-
          We're back under the thirty-day rule. We saved five answers about stale keys and the job
          records for each one. A passing answer gets three things right. Does the key qualify?
          Which policy applies? Did a job actually start? We can grade each new version of the
          app against the same cases.
        hold: 0.75
      - say: >-
          Read the first two rows. At forty-two days the answer says eligible. At fifteen it says
          ineligible. Both pass. Now look at the fifty-day key. Compare the assistant's answer
          with the job record. Would you pass it?
        caption_starts:
          - "Now look at the fifty-day key"
          - "Would you pass it"
        hold: 2.5
        visual_cues:
          - id: grade-first-two
            phrase: "Both pass"
            targets: [evaluation-mechanism]
            caption_boundary: true
          - id: grade-detail
            phrase: "Now look at the fifty-day key"
            targets: [evaluation-mechanism]
          - id: grade-question
            phrase: "Would you pass it"
            targets: [evaluation-mechanism]
      - say: >-
          It says a job started. The execution record shows none. That claim costs it a pass.
          The next key is ten days old, yet the answer calls it eligible. The last one cites P-nine.
          Two of the five answers pass.
        caption_starts:
          - "That claim costs it a pass"
          - "The next key is ten days old"
        hold: 1.1
        visual_cues:
          - id: grade-action
            phrase: "It says a job started"
            targets: [evaluation-mechanism]
            caption_boundary: true
          - id: grade-record
            phrase: "The execution record shows none"
            targets: [evaluation-mechanism]
            caption_boundary: true
          - id: grade-return
            phrase: "The next key is ten days old"
            targets: [evaluation-mechanism]
          - id: grade-age
            phrase: "yet the answer calls it eligible"
            targets: [evaluation-mechanism]
            caption_boundary: true
          - id: grade-policy
            phrase: "The last one cites P-nine"
            targets: [evaluation-mechanism]
            caption_boundary: true
          - id: grade-total
            phrase: "Two of the five answers pass"
            targets: [evaluation-mechanism]
            caption_boundary: true
      - say: >-
          Could we promote this candidate on that evidence? The fixture has one false action claim,
          and we haven't measured the time to deliver a checked decision. The release stays blocked.
          Let's look at why someone running these very same rows might see a five out of five.
        caption_starts:
          - "The fixture has one false action claim"
        hold: 0.8
        visual_cues:
          - id: grade-block
            phrase: "The release stays blocked"
            targets: [evaluation-mechanism]
            caption_boundary: true
  - id: release-report-binding
    title: What did the evaluator test?
    visual: >-
      Five computed grades line up with their expected labels. In a separate report, double-counting
      one pass blocks release. The original 20-pass report is then compared with two manifests.
    beats:
      - say: >-
          Keep those five grades. Before running the scorer, the author marked which answers ought to
          pass. Compare the two columns, row by row. On the fifty-day key the scorer rejected the
          false claim, exactly as the author expected. Even that rejection counts as agreement. The
          scorer matched all five labels. Only two candidate answers passed. We tested the scorer on
          supplied answers without calling a model.
        hold: 1
        visual_cues:
          - id: report-compare
            phrase: "Compare the two columns, row by row"
            targets: [release-report-binding-mechanism]
          - id: report-agreed
            phrase: "The scorer matched all five labels"
            targets: [release-report-binding-mechanism]
            caption_boundary: true
      - say: >-
          Take a fresh report. All twenty cases passed. Zero answers claimed an action without a
          receipt. The ninety-fifth percentile time to a checked decision was seven hundred eighty
          milliseconds, inside our one-second budget. Those numbers clear the metric gate. Now
          count one pass twice. Twenty-one passes from twenty cases. The gate blocks the release
          until we can account for every pass.
        caption_starts:
          - "Now count one pass twice"
          - "The gate blocks the release"
        hold: 1
        visual_cues:
          - id: report-numbers
            phrase: "All twenty cases passed"
            targets: [release-report-binding-mechanism]
          - id: report-gate
            phrase: "Those numbers clear the metric gate"
            targets: [release-report-binding-mechanism]
            caption_boundary: true
          - id: report-double
            phrase: "Now count one pass twice"
            targets: [release-report-binding-mechanism]
          - id: report-block
            phrase: "The gate blocks the release"
            targets: [release-report-binding-mechanism]
      - say: >-
          Go back to the valid twenty-pass report. Compare its bundle with what we'd serve. Every
          revision matches, so the report applies to this bundle. Now switch only the chat template
          from four to five. The weights are the same. The timing on the old report still reads seven
          hundred eighty milliseconds. Can we use it to approve this change?
        hold: 2.8
        visual_cues:
          - id: bundle-match
            phrase: "the report applies to this bundle"
            targets: [release-report-binding-mechanism]
            caption_boundary: true
          - id: bundle-change
            phrase: "switch only the chat template from four to five"
            targets: [release-report-binding-mechanism]
          - id: bundle-predict
            phrase: "Can we use it to approve this change"
            targets: [release-report-binding-mechanism]
      - say: >-
          Run the evaluation again. The report is pinned to template four. Template five can turn the
          same conversation into different input tokens. Keep the two runs tied to their own
          revisions. Replacing the weights with a compressed copy also changes the bundle. Measure
          that copy on the workload you plan to serve.
        hold: 1.3
        visual_cues:
          - id: bundle-repeat
            phrase: "Run the evaluation again"
            targets: [release-report-binding-mechanism]
            caption_boundary: true
  - id: compression
    title: Weight savings share memory with the KV cache
    visual: A 70-billion-parameter model’s ideal weight footprint shrinks across
      BF16, INT8, and INT4 while a calculated KV cache consumes serving
      capacity.
    beats:
      - say: >
          Seventy billion parameters at two bytes each require about one hundred
          thirty point four GiB for BF16 weights alone. Ideal INT4 storage uses
          one quarter as many bytes, about thirty-two point six GiB before
          scales and runtime overhead.
        hold: 0.8
        visual_cues:
          - id: weight-storage-2-b1-1
            phrase: one quarter as many bytes
            targets:
              - weight-storage-2
            color: green
            linger: 0.6
      - say: >
          Serving also stores keys and values for active tokens. With the stated
          layers, heads, dimensions, context, and two-byte cache elements, one
          request needs ten GiB, so two requests plus INT4 weights total
          fifty-two point six GiB.
        hold: 0.85
        visual_cues:
          - id: weights-plus-cache-b2-1
            phrase: fifty-two point six
            targets:
              - weights-plus-cache
            color: yellow
            linger: 0.6
      - say: >
          That subtotal already exceeds a forty-eight-GiB device by four point
          six GiB. A sixty-GiB teaching budget leaves seven point four GiB after
          those parts. AWQ uses activation-aware scales; GPTQ compensates
          layer-output error. Evaluate each resulting artifact on the target
          workload.
        hold: 0.9
        visual_cues:
          - id: weights-plus-cache-b3-1
            phrase: exceeds a forty-eight-GiB device
            targets:
              - weights-plus-cache
            color: pink
            linger: 0.6
      - say: >-
          Follow one token into the cache. Each of eighty layers saves a key and a value for each
          of its eight K V heads. Each vector has one hundred twenty-eight elements. Multiply by
          the number of cached tokens and two bytes per element. Divide the byte count by two to
          the thirtieth for ten gibibytes per request. Packing the weights leaves the cache size
          alone. Now suppose every layer uses a sliding window that keeps just the newest half of
          those tokens. The cache drops to five gibibytes. Sharing a prefix across requests,
          compressing the cache or moving entries off the GPU can save GPU memory. Weight scales,
          higher-precision weights and runtime buffers also need space.
        caption_starts:
          - "Divide the byte count"
          - "ten gibibytes per request"
          - "Packing the weights leaves the cache size alone"
          - "Now suppose every layer uses a sliding window"
          - "The cache drops to five gibibytes"
