            phrase: Emit those four and a correction
            targets:
              - speculative-prefix-mechanism
            linger: 0.8
          - id: speculative-all
            phrase: If all five pass
            targets:
              - speculative-prefix-mechanism
            linger: 0.8
      - say: With exact acceptance and correction sampling, the output follows the target
          model's sampling distribution. If you approximate that step or change the sampling
          settings, measure quality again. For speed, time the draft and verification pass
          together. How many tokens did that work buy? Frequent rejections mean more discarded
          work. Retrieval and prefill happen earlier in the request.
        hold: 0.8
        visual_cues:
          - id: speculative-prefix-b2
            phrase: With exact acceptance and correction sampling
            targets:
              - speculative-prefix-mechanism
            linger: 0.8
