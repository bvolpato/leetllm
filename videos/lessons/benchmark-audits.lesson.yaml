  - id: paired-diagnosis
    title: Retain the cases that improved and the ones that broke
    visual: Construct the actual paired2×2 outcome table. Remove concordant cells from the McNemar
      calculation while keeping their identities available; enumerate fair-coin allocations of the
      discordant cases and highlight both tails.
    beats:
      - say: "Compare replacements on the same cases. Build four cells: both pass, both fail, baseline-only
          pass and candidate-only pass. The latter two identify regressions and fixes. McNemar’s
          equal-marginal null uses only those discordant counts. Conditional on their total and
          independent cases under this null, either direction has probability one half. Shared easy
          and hard cases remain paired instead of becoming unrelated samples."
        hold: 0.7
        visual_cues:
          - id: paired-diagnosis-phase-0
            phrase: Compare replacements on the same cases
            targets:
              - paired-diagnosis-mechanism
            color: cyan
            linger: 0.55
          - id: ba-paired-diagnosis-cells
            phrase: Build four cells
            targets:
              - ba-paired-diagnosis-cells
            color: cyan
            linger: 0.4
          - id: ba-paired-diagnosis-discordant
            phrase: only those discordant counts
            targets:
              - ba-paired-diagnosis-discordant
            color: cyan
            linger: 0.4
          - id: ba-paired-diagnosis-coins
            phrase: probability one half
            targets:
              - ba-paired-diagnosis-coins
            color: cyan
            linger: 0.4
      - say: For the exact two-sided calculation, sum binomial coefficients from zero through the smaller
          discordant count, divide by two raised to the total discordant count, double that
          lower-tail probability, and cap the result at one. The executed nine-fix, one-break
          example gives about point zero two one five. Three fixes and one break gives point six two
          five; five fixes and no breaks still gives point zero six two five.
        hold: 0.7
        visual_cues:
          - id: paired-diagnosis-phase-1
            phrase: For the exact two-sided calculation, sum binomial coefficients from zero through the smaller
              discordant count, divide by two raised to the total discordant count, double that
              lower-tail probability, and cap the result at one
            targets:
              - paired-diagnosis-mechanism
            color: cyan
            linger: 0.55
