            phrase: point zero two one five
            targets:
              - paired-diagnosis-mechanism
            color: yellow
            linger: 0.45
          - id: paired-three-one
            phrase: point six two five
            targets:
              - paired-diagnosis-mechanism
            color: yellow
            linger: 0.45
          - id: paired-five-zero
            phrase: point zero six two five
            targets:
              - paired-diagnosis-mechanism
            color: yellow
            linger: 0.45
          - id: ba-paired-diagnosis-exact
            phrase: double that lower-tail probability
            targets:
              - ba-paired-diagnosis-exact
            color: cyan
            linger: 0.4
          - id: ba-paired-diagnosis-nine
            phrase: point zero two one five
            targets:
              - ba-paired-diagnosis-nine
            color: cyan
            linger: 0.4
          - id: ba-paired-diagnosis-three
            phrase: point six two five
            targets:
              - ba-paired-diagnosis-three
            color: cyan
            linger: 0.4
          - id: ba-paired-diagnosis-five
            phrase: point zero six two five
            targets:
              - ba-paired-diagnosis-five
            color: cyan
            linger: 0.4
      - say: A small p-value is evidence against the specified equal-marginal null under its assumptions,
          not the probability that a useful improvement is real. Read broken cases and check
          critical gates separately. Near-duplicate cases undermine independence. For variable
          hosted outputs, predeclare how repeats become each case’s pass or fail, and preserve those
          repeated runs rather than choosing their best answer.
        hold: 0.7
        visual_cues:
