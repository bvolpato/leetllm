            color: cyan
            linger: 0.4
          - id: ba-finite-report-domain
            phrase: negative latency or cost
            targets:
              - ba-finite-report-domain
            color: cyan
            linger: 0.4
      - say: Ordered comparisons such as NaN less than a quality floor and NaN greater than a latency
          ceiling are both false. A naive reject-if-bad rule can therefore admit a report with
          neither measurement. The executed mutation fixture rejects that invalid record. The
          simpler reader-edition finite-value helper demonstrates this NaN trap; it is not the full
          strict typed reference validator.
        hold: 0.7
        visual_cues:
