scenes:
  - id: intro
    title: Open the score and inspect its questions
    visual: Two equal ninety-percent scores unfold into identified case grids. Each grid carries the
      same questions but a different pattern of failures.
    beats:
      - say: Two assistants pass ninety percent of the same test. Would you expect them to make the same
          mistakes? Open the score into its individual questions. One assistant struggles with a
          small, important group that the other usually handles. The average has compressed away the
          difference we need to see.
        hold: 0.65
        visual_cues:
          - id: intro-beat-1-focus-1
            phrase: Two assistants pass ninety percent of the same test
            targets:
              - benchmark-score-a
              - benchmark-score-b
            color: blue
            linger: 0.6
      - say: A benchmark combines tasks with a scoring procedure. Its result describes performance on those
          tasks under that procedure. We will build a small evaluation, test the checker, inspect
          hidden failure patterns, and follow the evidence needed to compare systems fairly.
        hold: 0.7
        visual_cues:
          - id: intro-beat-2-focus-1
            phrase: A benchmark combines tasks with a scoring procedure
            targets:
              - benchmark-case-results
            color: blue
            linger: 0.6
      - say: All the examples here are small teaching fixtures. Keep the question identities in view as
          their scores are grouped, sampled, and moved between datasets. That lets us see exactly
          what each reported number measures.
        hold: 0.6
        visual_cues:
          - id: intro-beat-3-focus-1
            phrase: All the examples here are small teaching fixtures
            targets:
              - benchmark-case-results
            color: blue
            linger: 0.6
  - id: contract
    title: Keep the comparison contract visible
    visual: Two aligned harness rows preserve dataset, input path, prompt, budget, and scorer. A changed
      retrieval depth moves the comparison from model replacement to a whole-system experiment.
    beats:
      - say: Imagine changing the model inside a library assistant. Both candidates should receive the same
          questions, available evidence, response requirements, and scoring rules. Record the
          prompt, tools, sampling settings, and attempt budget as well. Each model still needs its
          own correct chat formatting.
        hold: 0.6
        visual_cues:
          - id: contract-beat-1-focus-1
            phrase: Imagine changing the model inside a library assistant
            targets:
              - contract-simulation-6
            color: blue
            linger: 0.6
      - say: Now give the second system five retrieved passages where the first received three. Its answers
          may improve, and that is useful to measure. The experiment now compares two complete
          systems. Retrieval changed along with the model, so the report must describe both changes.
        hold: 0.7
        visual_cues:
          - id: contract-beat-2-focus-1
            phrase: Now give the second system five retrieved passages
            targets:
              - contract-simulation-6
            color: blue
            linger: 0.6
          - id: ba-contract-passages
            phrase: five retrieved passages
            targets:
              - ba-contract-passages
            color: cyan
            linger: 0.4
          - id: ba-contract-consequence
            phrase: Its answers may improve
            targets:
              - ba-contract-consequence
            color: cyan
            linger: 0.4
      - say: Public benchmarks also have distinct contracts. Multiple-choice knowledge, executable programs,
          and human preferences score different units. Use those results to choose promising
          candidates, then compare them on the task your application actually needs.
        hold: 0.65
        visual_cues:
          - id: contract-beat-3-focus-1
            phrase: Public benchmarks also have distinct contracts
            targets:
              - contract-simulation-6
            color: blue
            linger: 0.6
  - id: gold-contract
    title: Validate the questions before grading the answers
    visual: Construct three actual CodeAssist gold records. Keep their IDs and policy source beside
      required clauses, duplicate one identity, then repair an unsupported requirement before
      admitting any model output.
    beats:
      - say: "Before trusting those library scores, inspect what each test asks. The article’s executable
          companion uses three fictional platform policies: freeze deployment needs commander
          approval, a threshold breach calls the rollback runbook, and exposed tokens need
          revocation within fifteen minutes. Preserve the question, authoritative evidence, required
          facts and forbidden claims together. These are supplied teaching policies, not general
          deployment instructions."
        hold: 0.7
        visual_cues:
          - id: gold-contract-phase-0
            phrase: Before trusting those library scores, inspect what each test asks
            targets:
              - gold-contract-mechanism
            color: cyan
            linger: 0.55
          - id: ba-gold-contract-approval
            phrase: commander approval
            targets:
              - ba-gold-contract-approval
            color: cyan
            linger: 0.4
      - say: Give each row a unique identity. Duplicating an identity can overwrite or ambiguously join the
          result. Then compare each gold requirement with its cited evidence before scoring an
          answer. A required claim absent from that source can punish a grounded answer or reward
          invented permission. The actual validator checks unique IDs and literal required phrases;
          it does not establish the source’s authority or semantic truth.
        hold: 0.7
        visual_cues:
          - id: gold-contract-phase-1
            phrase: Give each row a unique identity
            targets:
              - gold-contract-mechanism
            color: cyan
            linger: 0.55
          - id: ba-gold-contract-unique
            phrase: Duplicating an identity
            targets:
              - ba-gold-contract-unique
            color: cyan
            linger: 0.4
          - id: ba-gold-contract-gold
            phrase: compare each gold requirement
            targets:
              - ba-gold-contract-gold
            color: cyan
            linger: 0.4
      - say: Now deliberately require keep deploying from the rollback source. That requirement has no
          support, so repair the gold row first. Preserve a reviewed expected answer and label the
          failure severity. A useful golden set mirrors the service’s requests, including critical
          slices and valid abstentions. Testing the model against an impossible answer key would
          measure the key’s defect.
        hold: 0.7
        visual_cues:
          - id: gold-contract-phase-2
            phrase: Now deliberately require keep deploying from the rollback source
            targets:
              - gold-contract-mechanism
            color: cyan
            linger: 0.55
          - id: ba-gold-contract-unsupported
            phrase: require keep deploying
            targets:
              - ba-gold-contract-unsupported
            color: pink
            linger: 0.4
          - id: ba-gold-contract-repair
            phrase: repair the gold row first
            targets:
              - ba-gold-contract-repair
            color: cyan
            linger: 0.4
  - id: checker
    title: Test the checker with controlled answers
    visual: One library rule stays fixed while three answer probes enter a literal phrase checker and a
      separately supplied semantic review label. Both judgments remain attached to the answer
      identity.
    beats:
      - say: Our library rule says that borrowed books are due on Friday. A cheap checker looks for the
          words books and Friday. The first answer repeats the rule correctly. Both the phrase check
          and our reviewed semantic label agree that it preserves the deadline.
        hold: 0.6
        visual_cues:
          - id: checker-beat-1-focus-1
            phrase: Our library rule says that borrowed books are due on Friday
            targets:
              - checker-object-rule-borrowed-books-are-due-on-friday-12
            color: blue
            linger: 0.6
          - id: checker-beat-1-focus-2
            phrase: A cheap checker looks for the words books and Friday
            targets:
              - checker-object-phrase-checker-14
            color: blue
            linger: 0.6
          - id: ba-checker-on
            phrase: due on Friday
            targets:
              - ba-checker-on
            color: cyan
            linger: 0.4
      - say: Replace the answer with books are due after Friday. The same two words remain, so the literal
          checker still passes it. Our reviewed label rejects the changed deadline. This probe
          exposes a specific false positive in the checker.
        hold: 0.7
        visual_cues:
          - id: checker-beat-2-focus-1
            phrase: Replace the answer with books are due after Friday
            targets:
              - checker-candidate-answer
              - checker-object-phrase-checker-14
              - checker-object-reviewed-meaning-15
            color: blue
            linger: 0.6
          - id: ba-checker-after
            phrase: due after Friday
            targets:
              - ba-checker-after
            color: pink
            linger: 0.4
      - say: A familiar abbreviation can fail in the other direction. Return the books by Friday preserves
          this rule. The displayed answer shortens the weekday to Fri, so our exact word check
          misses it. Keep exact checks for exact fields, and validate meaning with reviewed examples
          that include these harder cases.
        hold: 0.7
        visual_cues:
          - id: checker-beat-3-focus-1
            phrase: Return the books by Friday preserves this rule
            targets:
              - checker-object-rule-borrowed-books-are-due-on-friday-12
            color: blue
            linger: 0.6
          - id: checker-beat-3-focus-2
            phrase: and validate meaning with reviewed examples that include these harder cases
            targets:
              - checker-object-reviewed-meaning-15
            color: blue
            linger: 0.6
          - id: ba-checker-abbrev
            phrase: shortens the weekday to Fri
            targets:
              - ba-checker-abbrev
            color: cyan
            linger: 0.4
  - id: rag-stage
    title: Locate the first missing policy fact
    visual: Carry one source clause through retrieved context and generated answer. Remove it before
      assembly, restore it, then omit it only from the response; retain each actual first-failure
      label.
    beats:
      - say: Follow the commander-approval fact through the actual request. First inspect the final context
          sent to the model, after permissions, ranking and token-budget selection. If that clause
          is absent there, the response never received the required evidence. A relevant document
          retrieved earlier but dropped during assembly does not count as evidence the model saw.
        hold: 0.7
        visual_cues:
          - id: rag-stage-phase-0
            phrase: Follow the commander-approval fact through the actual request
            targets:
              - rag-stage-mechanism
            color: cyan
            linger: 0.55
          - id: ba-rag-stage-drop
            phrase: clause is absent there
            targets:
              - ba-rag-stage-drop
            color: cyan
            linger: 0.4
      - say: "Keep the context complete and change only the answer: it mentions the freeze but substitutes
          an on-call engineer for commander approval. Now the first observed failure is generation
          or instruction following. The article’s literal classifier reports bad retrieval, bad
          generation or pass by checking required phrases in that order. It inherits the same
          negation and paraphrase limits as its checker."
        hold: 0.7
        visual_cues:
          - id: rag-stage-phase-1
            phrase: "Keep the context complete and change only the answer: it mentions the freeze but
              substitutes an on-call engineer for commander approval"
            targets:
              - rag-stage-mechanism
            color: cyan
            linger: 0.55
          - id: ba-rag-stage-complete
            phrase: Keep the context complete
            targets:
              - ba-rag-stage-complete
            color: cyan
            linger: 0.4
          - id: ba-rag-stage-engineer
            phrase: substitutes an on-call engineer
            targets:
              - ba-rag-stage-engineer
            color: cyan
            linger: 0.4
      - say: An exact citation can identify a source while an attached claim contradicts it. Exercise
          correct answer with correct page, correct answer with wrong page, and a negated answer
          with correct page. Source identity and semantic entailment are separate checks. Preserve
          context, answer and source versions so a repair targets the observed boundary and then
          repeats the complete regression path.
        hold: 0.7
        visual_cues:
          - id: rag-stage-phase-2
            phrase: An exact citation can identify a source while an attached claim contradicts it
            targets:
              - rag-stage-mechanism
            color: cyan
            linger: 0.55
          - id: ba-rag-stage-citation
            phrase: Source identity and semantic entailment
            targets:
              - ba-rag-stage-citation
            color: cyan
            linger: 0.4
  - id: rag-metrics
    title: Measure what arrived and what was said
    visual: Build ranked relevance flags, reference-fact coverage and generated-claim support from one
      retained policy packet. Construct their different denominators and leave an omitted answer
      fact visible.
    beats:
      - say: Retrieval precision and recall answer different questions. In a supplied ranked list with
          relevance flags one, zero, one, precision at the first relevant rank is one, and at the
          third is two thirds. Averaging those precisions gives five sixths, about point eight three
          three. This rank-weighted precision rewards useful context appearing early; it cannot
          discover a required fact missing from every returned chunk.
        hold: 0.7
        visual_cues:
          - id: rag-metrics-phase-0
            phrase: Retrieval precision and recall answer different questions
            targets:
              - rag-metrics-mechanism
            color: cyan
            linger: 0.55
          - id: precision-first
            phrase: precision at the first relevant rank is one
            targets:
              - rag-metrics-mechanism
            color: yellow
            linger: 0.45
          - id: precision-third
            phrase: at the third is two thirds
            targets:
              - rag-metrics-mechanism
            color: yellow
            linger: 0.45
          - id: precision-average
            phrase: five sixths, about point eight three three
            targets:
              - rag-metrics-mechanism
            color: yellow
            linger: 0.45
          - id: ba-rag-metrics-rank1
            phrase: precision at the first relevant rank is one
            targets:
              - ba-rag-metrics-rank1
            color: cyan
            linger: 0.4
          - id: ba-rag-metrics-rank3
            phrase: at the third is two thirds
            targets:
              - ba-rag-metrics-rank3
            color: cyan
            linger: 0.4
          - id: ba-rag-metrics-average
            phrase: five sixths
            targets:
              - ba-rag-metrics-average
            color: cyan
            linger: 0.4
      - say: For reference-based context recall, divide covered reference facts by required reference facts.
          Suppose the context contains two of three required facts. Recall is two thirds. If the
          response states only those two supported facts, its faithfulness is two supported claims
          divided by two claims, or one. The response is still incomplete. A supported claim can
          also repeat an outdated source.
        hold: 0.7
        visual_cues:
          - id: rag-metrics-phase-1
            phrase: For reference-based context recall, divide covered reference facts by required reference
              facts
            targets:
              - rag-metrics-mechanism
            color: cyan
            linger: 0.55
          - id: context-recall
            phrase: Recall is two thirds
            targets:
              - rag-metrics-mechanism
            color: yellow
            linger: 0.45
          - id: faithfulness-one
            phrase: or one
            targets:
              - rag-metrics-mechanism
            color: yellow
            linger: 0.45
          - id: ba-rag-metrics-recall
            phrase: Recall is two thirds
            targets:
              - ba-rag-metrics-recall
            color: cyan
            linger: 0.4
          - id: ba-rag-metrics-faithful
            phrase: or one
            targets:
              - ba-rag-metrics-faithful
            color: cyan
            linger: 0.4
      - say: Current Ragas response relevancy generates questions from the response and compares their
          embeddings with the original question, averaging cosine similarities. It measures topical
          alignment, not truth. Keep retrieval coverage, supported claims, completeness and
          relevance separate, and check model-based scoring against reviewed labels. No Ragas model
          or embedding service was executed in this deterministic lab.
        hold: 0.7
        visual_cues:
          - id: rag-metrics-phase-2
            phrase: Current Ragas response relevancy generates questions from the response and compares their
              embeddings with the original question, averaging cosine similarities
            targets:
              - rag-metrics-mechanism
            color: cyan
            linger: 0.55
          - id: ba-rag-metrics-relevance
            phrase: averaging cosine similarities
            targets:
              - ba-rag-metrics-relevance
            color: cyan
            linger: 0.4
  - id: knowledge-contract
    title: Keep the task and parser attached to the score
    visual: The same candidate choices pass through choice-probability and generated-letter scoring
      contracts. Construct four versus ten uniform-guess branches, then retain GPQA subset ancestry
      and a private HELM scenario.
    beats:
      - say: Public benchmarks help shortlist capabilities. MMLU covers fifty-seven subjects with four
          choices per question. Uniform guessing has expected accuracy one fourth, not a minimum any
          finite run must achieve. Common evaluations use five demonstrations and choice-token
          probabilities; generated-answer parsing is another protocol. Changing that path changes
          what a score measures, even when both results are percentages.
        hold: 0.7
        visual_cues:
          - id: knowledge-contract-phase-0
            phrase: Public benchmarks help shortlist capabilities
            targets:
              - knowledge-contract-mechanism
            color: cyan
            linger: 0.55
          - id: mmlu-guess
            phrase: one fourth
            targets:
              - knowledge-contract-mechanism
            color: yellow
            linger: 0.45
          - id: ba-knowledge-contract-four
            phrase: four choices per question
            targets:
              - ba-knowledge-contract-four
            color: cyan
            linger: 0.4
          - id: ba-knowledge-contract-quarter
            phrase: one fourth
            targets:
              - ba-knowledge-contract-quarter
            color: cyan
            linger: 0.4
      - say: "MMLU-Pro adds reviewed, reasoning-focused questions with up to ten choices. Exactly ten
          choices give a one-tenth guessing expectation. Its reported chain-of-thought advantage
          belongs to the tested models and protocol. GPQA instead uses expert biology, physics and
          chemistry: Extended has five hundred forty-six questions, main four hundred forty-eight,
          and Diamond one hundred ninety-eight. Validator-based filtering changes the subsets, so
          name the actual split."
        hold: 0.7
        visual_cues:
          - id: knowledge-contract-phase-1
            phrase: MMLU-Pro adds reviewed, reasoning-focused questions with up to ten choices
            targets:
              - knowledge-contract-mechanism
            color: cyan
            linger: 0.55
          - id: pro-guess
            phrase: a one-tenth guessing expectation
            targets:
              - knowledge-contract-mechanism
            color: yellow
            linger: 0.45
          - id: ba-knowledge-contract-ten
            phrase: up to ten choices
            targets:
              - ba-knowledge-contract-ten
            color: cyan
            linger: 0.4
          - id: ba-knowledge-contract-gpqa
            phrase: Extended has five hundred forty-six questions
            targets:
              - ba-knowledge-contract-gpqa
            color: cyan
            linger: 0.4
      - say: The original GPQA study’s non-expert validators scored about thirty-four percent on Extended
          despite internet access; that historical result is not a universal human ceiling. HELM
          evaluates several dimensions, including accuracy, calibration, robustness, fairness and
          bias. Its public scenarios do not measure private policy compliance, but its modular
          framework accepts custom scenarios. Run the relevant private evaluation instead of
          treating an unrelated leaderboard as release authority.
        hold: 0.7
        visual_cues:
          - id: knowledge-contract-phase-2
            phrase: The original GPQA study’s non-expert validators scored about thirty-four percent on Extended
              despite internet access; that historical result is not a universal human ceiling
            targets:
              - knowledge-contract-mechanism
            color: cyan
            linger: 0.55
          - id: ba-knowledge-contract-human
            phrase: thirty-four percent
            targets:
              - ba-knowledge-contract-human
            color: cyan
            linger: 0.4
          - id: ba-knowledge-contract-custom
            phrase: accepts custom scenarios
            targets:
              - ba-knowledge-contract-custom
            color: cyan
            linger: 0.4
  - id: math-frontier
    title: An answer parser and a dataset version change the experiment
    visual: Extract a numeric answer under two declared parsers, preserve a symbolic derivation
      separately, then construct a visible version transition and a small authored colored-grid
      rule.
    beats:
      - say: GSM8K contains about eight and a half thousand grade-school word problems, typically two to
          eight arithmetic steps. Its reference solutions mark the final number after four hash
          characters; a particular harness decides whether model outputs need that delimiter. MATH
          has twelve thousand five hundred competition problems with worked solutions. Extracted
          final-answer correctness and a valid derivation are different contracts; record parser and
          tool access.
        hold: 0.7
        visual_cues:
          - id: math-frontier-phase-0
            phrase: GSM8K contains about eight and a half thousand grade-school word problems, typically two to
              eight arithmetic steps
            targets:
              - math-frontier-mechanism
            color: cyan
            linger: 0.55
          - id: ba-math-frontier-parser
            phrase: a particular harness decides
            targets:
              - ba-math-frontier-parser
            color: cyan
            linger: 0.4
          - id: ba-math-frontier-proof
            phrase: correctness and a valid derivation
            targets:
              - ba-math-frontier-proof
            color: cyan
            linger: 0.4
      - say: Harder suites also need exact versions. Humanity’s Last Exam finalized its original
          twenty-five-hundred-question public set in April twenty-twenty-five and retains a private
          holdout. Its site lists Rolling in October twenty-twenty-five and Diamond in September
          twenty-twenty-six. FrontierMath spans advanced-undergraduate through research-level tiers.
          Its Tiers One through Four page reports a June twelfth twenty-twenty-six version-two
          release addressing errors in forty-two percent of problems. Older scores do not transfer
          automatically.
        hold: 0.7
        visual_cues:
          - id: math-frontier-phase-1
            phrase: Harder suites also need exact versions
            targets:
              - math-frontier-mechanism
            color: cyan
            linger: 0.55
          - id: ba-math-frontier-hle
            phrase: April twenty-twenty-five
            targets:
              - ba-math-frontier-hle
            color: cyan
            linger: 0.4
          - id: ba-math-frontier-versions
            phrase: forty-two percent
            targets:
              - ba-math-frontier-versions
            color: cyan
            linger: 0.4
      - say: ARC-AGI-two asks a system to infer a rule from example input and output grids, then apply it to
          a new grid. Symbolic interpretation, composition and context-dependent rules go beyond
          geometric rotation. Public, semi-private and private sets have different exposure
          histories. A supplied toy grid can demonstrate rule application, but it is not a scored
          ARC task or evidence that a platform assistant preserves deployment permissions.
        hold: 0.7
        visual_cues:
          - id: math-frontier-phase-2
            phrase: ARC-AGI-two asks a system to infer a rule from example input and output grids, then apply it
              to a new grid
            targets:
              - math-frontier-mechanism
            color: cyan
            linger: 0.55
          - id: ba-math-frontier-arc
            phrase: apply it to a new grid
            targets:
              - ba-math-frontier-arc
            color: cyan
            linger: 0.4
  - id: code-contract
    title: Follow the patch into the actual selected tests
    visual: Retain a function docstring, a repository issue, the patch and selected repair/regression
      assertions. A deliberately unselected failing behavior stays visible after the selected tests
      pass.
    beats:
      - say: HumanEval measures function synthesis with one hundred sixty-four handwritten Python problems
          and unit tests. SWE-bench’s original collection has two thousand two hundred ninety-four
          issue-based tasks across twelve Python repositories. The system must inspect a repository,
          edit code and submit a patch. Those are different task contracts, and neither percentage
          directly measures our library or policy answers.
        hold: 0.7
        visual_cues:
          - id: code-contract-phase-0
            phrase: HumanEval measures function synthesis with one hundred sixty-four handwritten Python
              problems and unit tests
            targets:
              - code-contract-mechanism
            color: cyan
            linger: 0.55
          - id: ba-code-contract-function
            phrase: one hundred sixty-four
            targets:
              - ba-code-contract-function
            color: cyan
            linger: 0.4
          - id: ba-code-contract-repo
            phrase: two thousand two hundred ninety-four
            targets:
              - ba-code-contract-repo
            color: cyan
            linger: 0.4
      - say: The SWE-bench Docker harness applies the patch and grades named Fail-to-Pass repair tests and
          Pass-to-Pass regression tests under its parser rules. Inspect which assertions those
          selected tests exercise. A patch can pass selected checks while an omitted behavior
          remains wrong. A resolved label describes that harness result; it is not proof that every
          repository test or intended behavior was preserved.
        hold: 0.7
        visual_cues:
          - id: code-contract-phase-1
            phrase: The SWE-bench Docker harness applies the patch and grades named Fail-to-Pass repair tests
              and Pass-to-Pass regression tests under its parser rules
            targets:
              - code-contract-mechanism
            color: cyan
            linger: 0.55
          - id: ba-code-contract-selected
            phrase: named Fail-to-Pass
            targets:
              - ba-code-contract-selected
            color: cyan
            linger: 0.4
          - id: ba-code-contract-omitted
            phrase: omitted behavior remains wrong
            targets:
              - ba-code-contract-omitted
            color: pink
            linger: 0.4
      - say: The measured coding system includes model, prompt loop, tools, repository environment and
          attempt budget. Ten agent attempts can contain many model and tool calls. Preserve
          failures, timeouts, selected tests and the returned patch, then compare at a common budget
          or report the tradeoff. Changing the agent scaffold can change the result while model
          weights stay fixed.
        hold: 0.7
        visual_cues:
          - id: code-contract-phase-2
            phrase: The measured coding system includes model, prompt loop, tools, repository environment and
              attempt budget
            targets:
              - code-contract-mechanism
