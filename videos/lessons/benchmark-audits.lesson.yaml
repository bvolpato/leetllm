      - say: The quadratic has coefficient one plus z squared over n on p squared. Subtract the quantity two
          times the observed fraction plus z squared over n, multiplied by p; then add the observed
          fraction squared. Its two roots bound the accepted rates. For direct calculation, call one
          plus z squared over n the denominator. The center is observed fraction plus z squared over
          two n, divided by that denominator. The radius is z divided by the denominator, times the
          square root of observed fraction times one minus that fraction divided by n, plus z
          squared divided by four n squared.
