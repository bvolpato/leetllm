scenes:
  - id: intro
    title: The offline fault reader
    visual: A probe stamped A plugs into a handheld that reads E2. Its offline manual is open to two
      entries for E2. The matching entry supplies the definition and page number for the log.
    beats:
      - say: The handheld reads E two. Both pages in its offline manual list that code. Which page matches
          the letter on the sensor?
        hold: 2.8
        visual_cues:
          - id: sensor-stamp
            phrase: Which page matches the letter on the sensor
            targets:
              - sensor-tag
            linger: 0
            caption_boundary: true
          - id: manual-pages
            phrase: Both pages in its offline manual
            targets:
              - book-index
            linger: 0
            caption_boundary: true
      - say: Page seven belongs to sensor A. Its entry says battery low. Copy those words and the page
          number into the log. A lookup does the whole job.
        hold: 1.1
        visual_cues:
          - id: matched-page
            phrase: Page seven belongs to sensor A
            targets:
              - book-index
            linger: 0
            caption_boundary: true
          - id: copied-meaning
            phrase: Its entry says battery low
            targets:
              - book-index
            linger: 0
            caption_boundary: true
          - id: copy-to-log
            phrase: Copy those words and the page number
            targets:
              - ticket-answer
            linger: 0
            caption_boundary: true
      - say: What if the technician needs a sentence? Try quoting the entry first. If the job calls for a
          generated explanation, train a small model to cite the matching page and ask for review when a
          page is missing. A classifier can route the ticket. Teaching a model this particular job is
          specialization. Its weight count can stay the same.
        hold: 0.9
        caption_starts:
          - Try quoting the entry first.
          - Teaching a model this particular job is specialization.
        visual_cues:
          - id: log-request
            phrase: What if the technician needs a sentence
            targets:
              - ticket-id
            linger: 0
            caption_boundary: true
          - id: local-explanation
            phrase: train a small model to cite the matching page
            targets:
              - ticket-answer
            linger: 0
            caption_boundary: true
  - id: grounding
    title: Would you put this sentence in the log?
    visual: The technician's A/E2 ticket sits beside a proposed line and the two handbook entries. The cited row
      moves from M8 to M7. A new E9 ticket then has no matching row.
    beats:
      - say: Here is the draft. The lens is covered. It cites page eight. That page exists, and its entry does say
          the lens is covered. Check the draft against the technician's ticket. Would you save this line?
        hold: 2.5
        visual_cues:
          - id: check-quote
            phrase: its entry does say the lens is covered
            targets:
              - ground-record
            linger: 0
            caption_boundary: true
      - say: Page eight belongs to sensor B. Our technician has sensor A. Keep the ticket still and try page seven.
          The sensor and code now match, and the page supports the words battery low. Save that line with its
          citation. Train on the correction and label the draft from page eight as a rejected answer. A
          citation checker that checks only the quoted value would accept both drafts.
        hold: 1
        visual_cues:
          - id: wrong-sensor
            phrase: Page eight belongs to sensor B
            targets:
              - ground-ticket
            linger: 0
            caption_boundary: true
          - id: try-seven
            phrase: try page seven
            targets:
              - ground-record
            linger: 0
            caption_boundary: true
          - id: save-line
            phrase: Save that line with its citation
            targets:
              - ground-result
            linger: 0
            caption_boundary: true
      - say: The next ticket is still from sensor A. This time it reads E nine. Trace that pair down the same index.
          Neither page has that code. Leave the definition open and send the ticket to local review. Keep a
          missing entry like this one in the held-out evaluation. A confident sentence still needs a matching
          source.
        hold: 1.2
        visual_cues:
          - id: new-code
            phrase: This time it reads E nine
            targets:
              - ground-ticket
            linger: 0
            caption_boundary: true
          - id: no-record
