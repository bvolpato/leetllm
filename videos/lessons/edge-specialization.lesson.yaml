            targets:
              - shift-limit
            linger: 0
            caption_boundary: true
      - say: Suppose the whole device draws nine tenths of a watt while idle. Every request and every second stays
          put. Which part shrinks? Will the battery last?
        hold: 2.5
        caption_starts:
