  - id: thermal
    title: What does the ten-minute sample tell us?
    visual: A supplied synthetic throughput trace is progressively inspected through ten minutes. Its current rate
      and minimum observed sample drive a sustained-rate gate, then a second supplied trace is compared under
      the same requirement.
    beats:
      - say: >
          The first few seconds can look excellent while later operation misses the product target. This
          synthetic trace begins above the required rate. Advance the inspection clock and keep the lowest
          observed sample beside the current position, rather than reporting the opening burst as the
          sustained result.
        visual_cues:
          - id: sustained-trace
            phrase: Advance the inspection clock
            targets:
              - thermal-rate-curve
            color: cyan
          - id: lowest-sample
            phrase: lowest observed sample
            targets:
              - thermal-readout-3
            color: yellow
        hold: 0.65
      - say: >
          At the end of ten minutes, one supplied sample falls below the requirement. The trace fails this
          sample-based check. A declining rate alone does not diagnose thermal throttling. Correlate real
          measurements with device temperature, power, placement, clock behavior, ambient conditions, and
          competing work.
        visual_cues:
          - id: sample-failure
            phrase: falls below the requirement
            targets:
              - thermal-rate-curve
              - thermal-readout
              - thermal-readout-2
              - thermal-readout-3
              - thermal-readout-4
            color: pink
          - id: trace-fails
            phrase: fails this sample-based check
            targets:
              - thermal-readout-4
            color: pink
        hold: 0.7
      - say: >
          A second candidate's samples remain above the same line. That makes it a candidate for further
          testing. Measure between samples, run a representative duty cycle, and recheck answer quality.
          Lowering generation work or changing precision can improve device behavior while also changing what
          the user receives.
        visual_cues:
          - id: second-candidate
            phrase: second candidate's samples remain above
            targets:
              - thermal-rate-curve
            color: green
          - id: same-rate-target
            phrase: same line
            targets:
              - thermal-rate-target
            color: pink
        hold: 0.65
