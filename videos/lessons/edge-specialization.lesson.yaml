            color: yellow
            linger: 0.4
            caption_boundary: true
  - id: bandwidth
    title: Can the bus feed eighteen steps in one second?
    visual: Each block is one packed read of the same active weights. Eighteen blocks run against a fixed 50 GB
      line. Packing two weights to a byte shortens each block while preserving the work count.
    beats:
      - say: Suppose one token takes one pass through three point eight billion active matrix weights. We have one
          request, the weights are too large for cache, and each weight comes from memory once per step. At
          eight bits each, one pass reads three point eight gigabytes. Lay out the eighteen reads we need in a
          second. The bus can deliver fifty gigabytes in that second. Where do we run out?
        hold: 2.3
        visual_cues:
          - id: eight-read
            phrase: one pass reads three point eight gigabytes
            targets:
              - bus-eight
            linger: 0
            caption_boundary: true
          - id: lay-reads
            phrase: Lay out the eighteen reads we need in a second
            targets:
              - bus-eight
            linger: 0
            caption_boundary: true
      - say: The fourteenth read crosses the line. Divide fifty by the size of one read and you get a ceiling of
          about thirteen point two steps a second. Now pack the same weights at four bits. Two weights fit in
          each byte, so one read takes one point nine gigabytes. All eighteen take thirty-four point two. The
          new ceiling is about twenty-six point three steps a second. Keep four-bit on the shortlist and test
          its speed and answers on the device.
        hold: 1
        visual_cues:
          - id: spill-read
            phrase: The fourteenth read crosses the line
            targets:
              - bus-eight
            linger: 0
            caption_boundary: true
          - id: eight-rate
            phrase: thirteen point two steps a second
            targets:
              - bus-eight
            linger: 0
            caption_boundary: true
          - id: pack-four
            phrase: pack the same weights at four bits
            targets:
              - bus-four
            linger: 0
            caption_boundary: true
          - id: four-read
            phrase: one read takes one point nine gigabytes
            targets:
              - bus-four
            linger: 0
            caption_boundary: true
          - id: four-work
            phrase: All eighteen take thirty-four point two
            targets:
              - bus-four
            linger: 0
            caption_boundary: true
          - id: four-rate
            phrase: twenty-six point three steps a second
            targets:
              - bus-four
            linger: 0
            caption_boundary: true
      - say: The matrix still does one multiply and one add per weight. Divide those two operations by the bytes per
          weight. That gives sixteen divided by the bit width, in floating-point operations per byte. Four-bit
          packing gives four FLOPs per byte. Fifty gigabytes a second could therefore feed two hundred
          gigaFLOPs a second of this matrix work. Integer or sparse TOPS count different work. Scales,
          unpacking, attention and scheduling cost more. A lookup, an inactive expert or a cached block can
          also change how many weights you actually read.
        hold: 1
        visual_cues:
          - id: matrix-work
            phrase: one multiply and one add per weight
            targets:
              - bus-work
            linger: 0
            caption_boundary: true
          - id: intensity
            phrase: four FLOPs per byte
            targets:
              - bus-work
            linger: 0
            caption_boundary: true
          - id: work-rate
            phrase: two hundred gigaFLOPs a second
            targets:
              - bus-work
            linger: 0
            caption_boundary: true
  - id: resident-memory
    title: Keep storage, traffic and residency separate
    visual: Retain artifact in flash while placing weights, KV, activations and runtime pools into a separate
      physical RAM outline; make a later allocation exceed it without changing downloaded size.
    beats:
      - say: A downloaded model occupies storage. Serving also needs resident weight tensors, key-value or recurrent
          state, activation buffers and runtime overhead. Tokenizer, retrieval data, modality encoders,
          temporary workspaces and other applications need their own accounting. A file can fit in flash while
          a serving allocation exceeds available memory.
        hold: 0.7
        visual_cues:
          - id: edge-resident-memory-op-0
            phrase: A downloaded model occupies storage. Serving also needs resident weight tensors, key-value or
              recurrent state, activation buffers and runtime overhead. Tokenizer, retrieval data, modality encoders,
              temporary workspaces and other applications need their own accounting. A file can fit in flash while a
              serving allocation exceeds available memory.
            targets:
              - edge-resident-memory-mechanism
            color: cyan
            linger: 0.35
      - say: In a separate illustrative two-gibibyte process budget, weights take one thousand two hundred eighty
          mebibytes, KV takes sixteen, workspace takes three hundred eighty-four, and runtime overhead takes
          one hundred ninety-two. Their sum is one thousand eight hundred seventy-two mebibytes. Two thousand
          forty-eight minus that sum leaves one hundred seventy-six mebibytes of headroom.
        hold: 0.7
        visual_cues:
          - id: edge-resident-memory-op-1
            phrase: In a separate illustrative two-gibibyte process budget, weights take one thousand two hundred eighty
              mebibytes, KV takes sixteen, workspace takes three hundred eighty-four, and runtime overhead takes one
              hundred ninety-two. Their sum is one thousand eight hundred seventy-two mebibytes. Two thousand
              forty-eight minus that sum leaves one hundred seventy-six mebibytes of headroom.
            targets:
              - edge-resident-memory-mechanism
            color: cyan
            linger: 0.35
          - id: edge-resident-memory-weights
            phrase: weights take one thousand two hundred eighty mebibytes
            targets:
              - edge-resident-memory-mechanism
            color: yellow
            linger: 0.4
          - id: edge-resident-memory-kv
            phrase: KV takes sixteen
            targets:
              - edge-resident-memory-mechanism
            color: yellow
            linger: 0.4
          - id: edge-resident-memory-workspace
            phrase: workspace takes three hundred eighty-four
            targets:
              - edge-resident-memory-mechanism
            color: yellow
            linger: 0.4
          - id: edge-resident-memory-runtime
            phrase: runtime overhead takes one hundred ninety-two
            targets:
              - edge-resident-memory-mechanism
            color: yellow
            linger: 0.4
          - id: edge-resident-memory-sum
            phrase: Their sum is one thousand eight hundred seventy-two mebibytes
            targets:
              - edge-resident-memory-mechanism
            color: yellow
            linger: 0.4
          - id: edge-resident-memory-margin
            phrase: leaves one hundred seventy-six mebibytes of headroom
            targets:
              - edge-resident-memory-mechanism
            color: yellow
            linger: 0.4
      - say: A later two-hundred-fifty-six-mebibyte allocation crosses that process budget even though the download
          did not change. Peak overlap matters. An individual allocation limit, an operating-system low-memory
          termination and a leak are different failure mechanisms. Record peak allocations, retained sessions
          and system termination evidence before choosing a repair.
        hold: 0.7
        visual_cues:
          - id: edge-resident-memory-op-2
            phrase: A later two-hundred-fifty-six-mebibyte allocation crosses that process budget even though the download
              did not change. Peak overlap matters. An individual allocation limit, an operating-system low-memory
              termination and a leak are different failure mechanisms. Record peak allocations, retained sessions and
              system termination evidence before choosing a repair.
            targets:
              - edge-resident-memory-mechanism
            color: cyan
            linger: 0.35
          - id: edge-resident-memory-overflow
            phrase: A later two-hundred-fifty-six-mebibyte allocation crosses that process budget
            targets:
              - edge-resident-memory-mechanism
            color: yellow
            linger: 0.4
  - id: alignment-data
    title: Align the supervised event before comparing distributions
    visual: Keep exact token strings/prefixes beside vocabulary IDs; reject same-ID/different-event pairing, then
      retokenize an approved teacher answer into the student vocabulary. Split document families before
      variants.
    beats:
      - say: Direct token-level distillation compares probabilities for the same token events under the same prefix.
          Equal vocabulary indices do not establish equal meanings. If teacher and student tokenize
          differently, use a justified alignment method or supervise on complete teacher text retokenized by
          the student. A sampled answer or a few returned log probabilities do not supply a full-vocabulary
          target.
        hold: 0.7
        visual_cues:
          - id: edge-alignment-data-op-0
            phrase: Direct token-level distillation compares probabilities for the same token events under the same
              prefix. Equal vocabulary indices do not establish equal meanings. If teacher and student tokenize
              differently, use a justified alignment method or supervise on complete teacher text retokenized by the
              student. A sampled answer or a few returned log probabilities do not supply a full-vocabulary target.
            targets:
              - edge-alignment-data-mechanism
            color: cyan
            linger: 0.35
          - id: edge-alignment-data-same-id
            phrase: Equal vocabulary indices do not establish equal meanings
            targets:
              - edge-alignment-data-mechanism
            color: yellow
            linger: 0.4
          - id: edge-alignment-data-retokenize
            phrase: complete teacher text retokenized by the student
            targets:
              - edge-alignment-data-mechanism
            color: yellow
            linger: 0.4
      - say: Build examples from approved documents, human demonstrations, unanswerable cases and verified synthetic
          outputs. Phi-three combined filtered public material with synthetic examples. Split by source
          document, equipment family or site before generating related variants. Otherwise a near-duplicate
          training explanation can leak the held-out answer across the split.
        hold: 0.7
        visual_cues:
          - id: edge-alignment-data-op-1
            phrase: Build examples from approved documents, human demonstrations, unanswerable cases and verified
              synthetic outputs. Phi-three combined filtered public material with synthetic examples. Split by source
              document, equipment family or site before generating related variants. Otherwise a near-duplicate
              training explanation can leak the held-out answer across the split.
            targets:
              - edge-alignment-data-mechanism
            color: cyan
            linger: 0.35
          - id: edge-alignment-data-split
            phrase: Split by source document, equipment family or site before generating related variants
            targets:
              - edge-alignment-data-mechanism
            color: yellow
            linger: 0.4
      - say: Keep verifier scope explicit. A schema validates its defined fields; bounded execution tests cover their
          assertions. Our source-applicability check compares equipment as well as citation and value.
          Ambiguous support still needs review. Teacher-generated examples can transfer mistakes, and a
          smaller training loss cannot replace held-out correctness, support and abstention measurements.
        hold: 0.7
        visual_cues:
          - id: edge-alignment-data-op-2
            phrase: Keep verifier scope explicit. A schema validates its defined fields; bounded execution tests cover
              their assertions. Our source-applicability check compares equipment as well as citation and value.
              Ambiguous support still needs review. Teacher-generated examples can transfer mistakes, and a smaller
              training loss cannot replace held-out correctness, support and abstention measurements.
            targets:
              - edge-alignment-data-mechanism
            color: cyan
            linger: 0.35
          - id: edge-alignment-data-verifier
            phrase: Our source-applicability check compares equipment as well as citation and value
            targets:
              - edge-alignment-data-mechanism
            color: yellow
            linger: 0.4
  - id: training
    title: A teacher supplies preferences among alternatives
    visual: Aligned three-way teacher and student distributions are computed from logits. Temperature reveals
      alternatives, then actual gradient updates move the student's probabilities toward the fixed teacher
      while KL loss decreases.
    beats:
      - say: Suppose a teacher sees the technician's ticket and has three choices. Look it up, explain it, or
          request review. Lookup wins. A hard label tells the student just that. The blue bars also tell it
          which runner-up the teacher preferred. The green student starts by giving each choice an equal
          share.
        visual_cues:
          - id: teacher-distribution
            phrase: The blue bars
            targets:
              - teacher-probabilities
            color: blue
            caption_boundary: true
          - id: outcome-preferences
            phrase: each choice an equal share
            targets:
              - student-probabilities
            color: yellow
            caption_boundary: true
        hold: 0.65
      - say: Raise the temperature for both models. Follow the blue bar for review. Its share rises from about four
          percent to nearly twenty, even though lookup still wins. To teach from token probabilities this way,
          compare the same possible tokens after the same prefix. If the tokenizers differ, align their events
          or train on the teacher's complete text in the student's tokens.
        visual_cues:
          - id: temperature-shares
            phrase: Raise the temperature for both models. Follow the blue bar for review. Its share rises from about
              four percent to nearly twenty
            targets:
              - teacher-probabilities
            color: yellow
            caption_boundary: true
          - id: shared-events
            phrase: the same possible tokens after the same prefix
            targets:
              - training-readout
            color: blue
            caption_boundary: true
        hold: 0.65
      - say: Hold the teacher still and update the student's logits. As the two sets of bars draw together, their K
          L divergence falls. That number measures how closely the student matches this teacher here. Test the
          student on held-out tickets, including ones with no matching page, to see whether it answers or asks
          for review when it should.
        visual_cues:
          - id: gradient-updates
            phrase: update the student's logits. As the two sets of bars draw together, their K L divergence falls
            targets:
              - student-probabilities
            color: green
            caption_boundary: true
          - id: current-divergence
            phrase: their K L divergence falls
            targets:
              - training-readout-4
            color: yellow
            caption_boundary: true
        hold: 0.75
        motion_check:
          region:
            - 200
            - 350
            - 1550
            - 650
          minimumChangedFraction: 0.002
  - id: distill-objective
    title: What goes into this student’s loss?
    visual: Build the three actual article loss terms from aligned logits and hidden rows; maintain teacher
      freeze/padding/mean boundaries and add weighted contributions into one total.
    beats:
      - say: Take a separate snapshot of three aligned token scores. The first token is the correct answer. At
          temperature one, the student gives it about sixty-four percent. The hard-label loss is minus the
          natural log of that share. Now soften both distributions at temperature two. For each token, take
          the log of teacher probability divided by student probability. Weight it by the teacher's share and
          add the three contributions. That is forward K L.
        hold: 0.7
        visual_cues:
          - id: edge-distill-objective-op-0
            phrase: Take a separate snapshot of three aligned token scores. The first token is the correct answer. At
              temperature one, the student gives it about sixty-four percent. The hard-label loss is minus the
              natural log of that share. Now soften both distributions at temperature two. For each token,
              take the log of teacher probability divided by student probability. Weight it by the teacher's
              share and add the three contributions. That is forward K L.
            targets:
              - edge-distill-objective-mechanism
            color: cyan
            linger: 0.35
          - id: edge-distill-objective-hard
            phrase: minus the natural log of that share
            targets:
              - edge-distill-objective-mechanism
            color: yellow
            linger: 0.4
            caption_boundary: true
          - id: edge-distill-objective-kl
            phrase: Now soften both distributions at temperature two
            targets:
              - edge-distill-objective-mechanism
            color: yellow
            linger: 0.4
            caption_boundary: true
      - say: The hard loss gets weight one minus alpha. The soft loss gets alpha, after multiplying K L by
          temperature squared. You can also match hidden states. Line up corresponding coordinates, square
          their differences, take the mean and multiply by beta. Use compatible layers or learn a projection.
          Freeze the teacher, align the prefixes and exclude padding from the loss. State which coordinates or
          tokens enter each mean.
        hold: 0.7
        visual_cues:
          - id: edge-distill-objective-op-1
            phrase: The hard loss gets weight one minus alpha. The soft loss gets alpha, after multiplying K L by
              temperature squared. You can also match hidden states. Line up corresponding coordinates, square
              their differences, take the mean and multiply by beta. Use compatible layers or learn a
              projection. Freeze the teacher, align the prefixes and exclude padding from the loss. State
              which coordinates or tokens enter each mean.
            targets:
              - edge-distill-objective-mechanism
            color: cyan
            linger: 0.35
          - id: edge-distill-objective-weights
            phrase: after multiplying K L by temperature squared
            targets:
              - edge-distill-objective-mechanism
            color: yellow
            linger: 0.4
            caption_boundary: true
          - id: edge-distill-objective-hidden
            phrase: square their differences, take the mean
            targets:
              - edge-distill-objective-mechanism
            color: yellow
            linger: 0.4
            caption_boundary: true
      - say: Here are the three losses before weighting. The middle one already includes temperature squared. With
          alpha at point eight, twenty percent of the hard loss goes into the stack. Add eighty percent of the
          scaled soft loss. Beta adds twenty percent of the hidden-state error. The thin yellow strip is its
          whole contribution. Using the unrounded values, the total is about point two one zero nine.
        hold: 0.7
        visual_cues:
          - id: edge-distill-objective-op-2
            phrase: Here are the three losses before weighting. The middle one already includes temperature squared.
              With alpha at point eight, twenty percent of the hard loss goes into the stack. Add eighty
