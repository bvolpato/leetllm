            linger: 0
            caption_boundary: true
  - id: job-admission
    title: When can the technician stop waiting?
    visual: Carry the handheld sensorA/E2 question through dispatch, retrieval, template, tokenizer,
      hidden-generation and first-visible-answer clocks. Select actual fixture rows using their individual
      quality/latency predicates.
    beats:
      - say: What counts as an answer depends on what the technician asked for. A code lookup ends with two words. A
          routing classifier ends with a workflow label. A policy explanation needs a source the technician
          can check. A photo question may need a vision classifier. Choose the output you need before choosing
          the model's size.
        hold: 0.7
        visual_cues:
          - id: edge-job-admission-op-0
            phrase: What counts as an answer depends on what the technician asked for. A code lookup ends with two
              words. A routing classifier ends with a workflow label. A policy explanation needs a source the
              technician can check. A photo question may need a vision classifier. Choose the output you need
              before choosing the model's size.
            targets:
              - edge-job-admission-mechanism
            color: cyan
            linger: 0.35
      - say: Start the clock when the app receives the question. It has to find the page, build the prompt, tokenize
          it and process it. Some models then generate hidden tokens. The technician is still waiting. Stop
          this clock at the first visible answer token. A classifier's clock stops when it returns the
          complete label.
        hold: 0.7
        visual_cues:
          - id: edge-job-admission-op-1
            phrase: Start the clock when the app receives the question. It has to find the page, build the prompt,
              tokenize it and process it. Some models then generate hidden tokens. The technician is still
              waiting. Stop this clock at the first visible answer token. A classifier's clock stops when it
              returns the complete label.
            targets:
              - edge-job-admission-mechanism
            color: cyan
            linger: 0.35
          - id: edge-job-admission-visible-clock
            phrase: Stop this clock at the first visible answer token
            targets:
              - edge-job-admission-mechanism
            color: yellow
            linger: 0.4
            caption_boundary: true
      - say: Each row already has a local privacy approval. Compare its ninety-fifth percentile latency with its own
          strict limit and its task score with its own floor. Intent passes at forty-two milliseconds. Policy
          questions pass at two hundred twenty-eight. Look at the photo row. Four hundred seventy milliseconds
          exceeds its four hundred millisecond limit, and its score is below the floor. Hold the photo
          candidate. The other two can go on to hardware testing.
        hold: 0.7
        visual_cues:
          - id: edge-job-admission-op-2
            phrase: Each row already has a local privacy approval. Compare its ninety-fifth percentile latency with its
              own strict limit and its task score with its own floor. Intent passes at forty-two milliseconds.
              Policy questions pass at two hundred twenty-eight. Look at the photo row. Four hundred seventy
              milliseconds exceeds its four hundred millisecond limit, and its score is below the floor. Hold
              the photo candidate. The other two can go on to hardware testing.
            targets:
              - edge-job-admission-mechanism
            color: cyan
            linger: 0.35
          - id: edge-job-admission-intent
            phrase: Intent passes at forty-two milliseconds
            targets:
              - edge-job-admission-mechanism
            color: yellow
            linger: 0.4
            caption_boundary: true
          - id: edge-job-admission-policy
            phrase: Policy questions pass at two hundred twenty-eight
            targets:
              - edge-job-admission-mechanism
            color: yellow
            linger: 0.4
            caption_boundary: true
