  - id: fresh-device
    title: Six hours with the inspection crew
    visual: A six-hour trial sheet keeps the memory limit, work order and usable battery in view. The viewer
      fills the idle interval, then repeats the identical shift at lower idle power on the same energy scale.
    beats:
      - say: A different crew works six hours underground. The cited log entry still has to stay on their handheld.
          This candidate streams two point four billion four-bit weights on a bus rated at thirty-six
          gigabytes a second. The separate memory ledger has a two-gibibyte limit. Check both before looking
          at the battery.
        hold: 0.7
        visual_cues:
          - id: six-input
            phrase: a two-gibibyte limit
            targets:
              - fresh-memory
            linger: 0
            caption_boundary: true
      - say: One complete read takes one point two gigabytes. That puts the ceiling at thirty steps a second. Add
          the four resident allocations. They come to eighteen seventy-two mebibytes, leaving one hundred
          seventy-six free. Now follow the work order. Ten thousand tokens at twenty a second, four watts
          during decode. Retrieval and prefill take three hundred seconds at four watts. Idle draws one watt.
          The crew has six and a half watt-hours. Will that last the shift?
        hold: 3.1
        caption_starts:
          - Will that last the shift?
        visual_cues:
          - id: edge-fresh-device-payload
            phrase: One complete read takes one point two gigabytes
            targets:
              - fresh-bus
            linger: 0
            caption_boundary: true
          - id: edge-fresh-device-ceiling
            phrase: the ceiling at thirty steps a second
            targets:
              - fresh-bus
            linger: 0
            caption_boundary: true
          - id: edge-fresh-device-memory
            phrase: eighteen seventy-two mebibytes
            targets:
              - fresh-memory
            linger: 0
            caption_boundary: true
          - id: edge-fresh-device-margin
            phrase: one hundred seventy-six free
            targets:
              - fresh-memory
            linger: 0
            caption_boundary: true
          - id: six-order
            phrase: Now follow the work order
            targets:
              - fresh-order
            linger: 0
            caption_boundary: true
      - say: Decode takes five hundred seconds. Subtract those and the three hundred for retrieval from twenty-one
          thousand six hundred. That leaves twenty thousand eight hundred seconds at idle. Multiply each
          interval by its power, add, and divide by thirty-six hundred. The bill is six point six seven
          watt-hours. That's over budget. Most of the charge goes into the long wait between requests.
        hold: 1.4
        visual_cues:
          - id: edge-fresh-device-decode
            phrase: Decode takes five hundred seconds
            targets:
              - shift-decode
            linger: 0
            caption_boundary: true
          - id: edge-fresh-device-idle
            phrase: twenty thousand eight hundred seconds at idle
            targets:
              - shift-idle
            linger: 0
            caption_boundary: true
