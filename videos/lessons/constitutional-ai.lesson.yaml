  - id: judge-audit
    title: Follow a judge’s flag back to the case
    visual: Each score stays beside its independent human label. Thresholds split the score axis into three
      decisions. Two mistaken decisions and one abstention have different effects on the totals.
    beats:
      - say: A preference judge picks between answers. A violation judge looks for a particular failure. Here,
          the model proposed a private read, the application blocked it, and the final reply gave the
          portal address. Tell the judge which of those events to label. Give it the permission receipt,
          transcript and tool effects. Well-formed JSON can carry a wrong verdict. Pick thresholds on
          validation data, then test them on separate cases that people have adjudicated. Sample passes as
          well as flags.
        hold: 0.8
        visual_cues:
          - id: judge-audit-1
            phrase: model proposed a private read
            targets:
              - judge-context
      - say: These six test cases already have human labels. Now place each judge score beside its human
          verdict. Flag scores of point eight or higher. Clear scores of point two or lower. Send the
          middle to review. Look at case two. Its score of point nine makes it a flag, but the human found
          no violation. Case five is the opposite miss. The judge cleared a violation. Case six lands in
          review even though its human label is already known.
        hold: 0.9
        visual_cues:
          - id: judge-scores
            phrase: place each judge score
            targets:
              - judge-confusion
          - id: judge-route
            phrase: Flag scores of point eight or higher
            targets:
              - judge-confusion
          - id: judge-fp
            phrase: Look at case two
            targets:
              - judge-fp-row
          - id: judge-fn
            phrase: Case five is the opposite miss
            targets:
              - judge-fn-row
          - id: judge-review
            phrase: Case six lands in review
            targets:
              - judge-review-row
      - say: Count the decisions. Two flags are correct, one flag is wrong, one violation was cleared, and one
          clear decision is correct. One case went to review. The judge classified five of six. Two of
          three flags are correct. Among the classified violations it caught two of three. Include the
          reviewed violation, and it caught only two of four. For a probability check, square the distance
          from each score to its zero or one label and average all six squares. The Brier score is about
          point three two five.
        hold: 1
        visual_cues:
          - id: judge-counts
            phrase: One case went to review
            targets:
              - judge-confusion
          - id: judge-audit-2
            phrase: it caught only two of four
            targets:
              - judge-summary
          - id: judge-brier
            phrase: Brier score is about point three two five
            targets:
              - judge-calibration
  - id: attack-budget
    title: An attempt budget changes the question
    visual: The same toy ten-percent attempt success probability feeds two explicit dependence models.
      Ten independent trials contrast with ten identical deterministic outcomes.
    beats:
      - say: Suppose each independent attempt has a ten percent chance of revealing a failure. A single
          attempt passes with probability point nine. For ten passes in a row, multiply point nine by itself ten times.
          Subtract that from one to get the chance of seeing at least one failure. One attempt gives ten
          percent. Two give nineteen percent. Ten give about sixty-five point one percent.
        hold: 0.8
        caption_starts:
          - One attempt gives ten percent
          - Two give nineteen percent
          - Ten give about
        visual_cues:
          - id: attack-budget-1
            phrase: ten give about sixty-five point one percent
            targets:
              - independent-budget
          - id: budget-one
            phrase: One attempt gives ten percent
            targets:
              - independent-budget
          - id: budget-two
            phrase: two give nineteen percent
            targets:
              - independent-budget
      - say: Now suppose the same ten percent of tasks fail every time. Repeating each test ten times
          finds exactly the same failures. Ten percent of tasks still fail. If a later test depends
          on an earlier reply, measure the whole run. Compare models with the same task and turn
          budgets, and record how many attempts each used before stopping.
        hold: 0.8
        visual_cues:
          - id: attack-budget-2
            phrase: Ten percent of tasks still fail
            targets:
              - dependent-budget
