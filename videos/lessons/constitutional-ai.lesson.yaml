  - id: defense-effects
    title: Where did the private read stop?
    visual: A record read stops at authorization. A separate output-buffer fixture holds two text chunks for
      a check. The incident receipt then distinguishes the model proposal, executed reads and delivered
      disclosure.
    beats:
      - say: Follow the read for this incident. A signed-in caller asks the application to open the record.
          Check the incident, action and destination before retrieval. A person may be allowed to read a
          timeline in the incident workspace and still lack permission to send it elsewhere. Text in a
          retrieved document supplies no authority. A classifier such as Llama Guard can recognize a
          hazard in a message. The application still needs its own record permissions and restricted logs.
        hold: 0.75
        visual_cues:
          - id: effect-check
            phrase: Check the incident, action
            targets:
              - effect-boundary
          - id: effect-destination
            phrase: destination before retrieval
            targets:
              - effect-boundary
      - say: Consider a separate output check. In this fixture the restricted label spans two chunks. The
          first ends with a dash after the word case. The second holds the number seventeen. Hold the chunks
          together for the check, before either goes to the recipient. A
          detector that fires after delivery can't take those bytes back. Anthropic's January twenty
          twenty-six classifier report describes a cheaper activation probe that passes suspicious
          conversations to a stronger classifier. That safeguard runs while the model is serving requests.
        hold: 0.8
        visual_cues:
          - id: output-buffer
            phrase: restricted label spans two chunks
            targets:
              - buffer
          - id: output-check
            phrase: Hold the chunks together for the check
            targets:
              - buffer
      - say: Back at the incident, the assistant proposed the read. The application denied it. The delivered
          answer gave the portal address. Record the prohibited proposal against the model, zero executed
          private reads against the application, and zero disclosures in the reply. If you kept only the
          reply, you would miss the model error.
        hold: 1
        visual_cues:
          - id: effect-proposal
            phrase: assistant proposed the read
            targets:
              - model-proposal
          - id: effect-denied
            phrase: application denied it
            targets:
              - executed-read
          - id: defense-effects-2
            phrase: delivered answer gave the portal address
            targets:
              - delivered-answer
