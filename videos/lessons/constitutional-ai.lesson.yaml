scenes:
  - id: intro
    title: Which part can the assistant answer?
    visual: A moving selection picks out “either” in a draft refusal. The engineer's two questions stay
      above it as the public runbook and incident grant guide a two-line revision.
    beats:
      - say: “I can’t help with either.” One word refuses both requests. The public runbook allows doc
          edits. The incident timeline needs a grant this engineer doesn’t have. Which part can the
          assistant answer?
        hold: 2.4
        caption_starts:
          - The public runbook
          - The incident timeline
          - Which part can the assistant answer
        visual_cues:
          - id: intro-private
            phrase: The incident timeline
            targets:
              - private-request
          - id: intro-runbook
            phrase: The public runbook allows doc edits
            targets:
              - public-source
          - id: intro-scope
            phrase: needs a grant this engineer doesn’t have
            targets:
              - permission-gate
          - id: intro-question
            phrase: Which part can the assistant answer
            targets:
              - reply-question
              - public-source
              - permission-gate
            linger: 0.1
      - say: Yes, you can edit the docs. For the timeline, the application stops the private read.
          Give the engineer the link to request access.
        hold: 0.9
        caption_starts:
          - For the timeline
          - Give the engineer
        visual_cues:
          - id: intro-public
            phrase: Yes, you can edit the docs
            targets:
              - public-answer
          - id: intro-stop
            phrase: stops the private read
            targets:
              - private-read
          - id: intro-portal
            phrase: the link to request access
            targets:
              - private-reply
      - say: Save that revision. In Constitutional AI, a written principle guides the model as it
          critiques and rewrites a draft. The revised answer becomes a training target. Later, a judge
          compares fresh answers under the principle. Those preferences help train a reward model.
          Training changes the weights. A rule in a serving prompt guides the current reply.
        hold: 0.7
        caption_starts:
          - The revised answer becomes
          - Later, a judge
          - Training changes the weights
        visual_cues:
          - id: intro-teach
            phrase: The revised answer becomes a training target
            targets:
              - revised-example
          - id: intro-judge
            phrase: a judge compares fresh answers
            targets:
              - training-artifacts
  - id: principle
    title: What would change this reply?
    visual: The public answer stays put. A claim of rank leaves the incident check unchanged. A grant from
      the application opens the same read for the same approved destination.
    beats:
      - say: Keep the engineer in the same private workspace. Our rule says to answer from the public runbook
          and to check permission for this particular incident. Suppose the engineer says they manage the
          incident. Watch the permission receipt. The message changed. The grant is still missing.
        hold: 1
        visual_cues:
          - id: principle-rule
            phrase: answer from the public runbook
            targets:
              - public-source
          - id: principle-claim
            phrase: says they manage the incident
            targets:
              - permission-gate
      - say: Now the incident owner grants this engineer read access. The application records the grant for this
          incident, and this workspace is approved to receive it. The same read can now go through. The
          docs answer stays exactly where it was.
        hold: 0.9
        visual_cues:
          - id: principle-grant
            phrase: records the grant for this incident
            targets:
              - permission-gate
          - id: principle-read
            phrase: same read can now go through
            targets:
              - private-read
      - say: Save version three of the rule with the examples it produced. If reviewers disagree, you can trace
          the label back to the wording and to whose judgment shaped it. Collective Constitutional AI used
          input from a sample of U.S. adults. That tells you who participated. Testing the resulting model
          tells you how well it follows the rule.
        hold: 0.7
        visual_cues:
          - id: principle-version
            phrase: version three
            targets:
              - reply-question
  - id: critique
    title: Which words belong in the training row?
    visual: A draft promises a private timeline despite a missing grant. A margin note identifies the error.
      The revision fills the answer field while the critique stays pinned to the draft.
    beats:
      - say: Take just the incident question from the opening, before the grant. Case seventeen has a signed-in
          engineer and no incident access. A drafting model writes, “I'll get the timeline for you.” Which
          part of that draft conflicts with our rule?
        hold: 1.8
        visual_cues:
          - id: critique-draft
            phrase: I'll get the timeline for you
            targets:
              - flawed-draft
      - say: The promise to get the timeline assumes permission. Ask the model to critique its draft under
          version three. Its note points to the missing grant. Keep that note with the draft so a reviewer
          can see why the wording changed.
        hold: 0.65
        visual_cues:
          - id: critique-note
            phrase: missing grant
            targets:
              - principle-critique
      - say: Now ask for a revision. “Please request access through the support portal.” Pair the original
          request with those revised words. That's the answer we want the model to produce. The critique
          has done its job when it helps generate that answer.
        hold: 0.9
        visual_cues:
          - id: critique-revise
            phrase: Please request access through the support portal
            targets:
              - revised-answer
          - id: critique-pair
            phrase: Pair the original request with those revised words
            targets:
              - training-row
  - id: sft
    title: Which answer should the model learn?
    visual: The selected revision stays on the page. One fixed target points to a before-and-after
      probability ruler and loss. A public training row then tests where the portal answer belongs.
    beats:
      - say: Take the answer we just saved. At the third word, the model gets the request and the first two
          answer tokens, “Please request.” In this word-level example the next target is “access.” We
          supply the earlier words from the revision at each position. That's teacher forcing.
        hold: 0.65
        visual_cues:
          - id: sft-prefix
            phrase: Please request
            targets:
              - answer-tokens
          - id: sft-target
            phrase: next target is access
            targets:
              - selected-word
      - say: For this one position, imagine just three possible next words. The model gives “access” about
          twenty-one percent. What happens to the loss on this word if we give it more probability?
        hold: 2
        visual_cues:
          - id: sft-before
            phrase: about twenty-one percent
            targets:
              - next-token-distribution
          - id: sft-wager
            phrase: What happens to the loss
            targets:
              - target-loss
              - next-token-distribution
            linger: 0.1
      - say: The loss falls. It's the negative natural log of the probability on “access.” Take one gradient
          step on these three logits. The old mark stays at twenty-one percent while the new one moves to
          about fifty-five. The loss drops from about one point five five to point six zero nats. In
          training, gradients from the revised answer tokens update the model weights.
        hold: 1
        caption_starts:
          - Take one gradient step
          - The old mark stays
          - The loss drops from
        visual_cues:
          - id: sft-step
            phrase: new one moves to about fifty-five
            targets:
              - next-token-distribution
          - id: sft-loss
            phrase: loss drops from about one point five five to point six zero nats
            targets:
              - target-loss
      - say: Now give that portal answer to someone who asks only about editing docs. They still need the freeze
          rule. Include public questions with direct answers, and mixed questions with both parts handled.
          In the original study, an assistant trained on human preferences for helpfulness wrote the drafts. The team then fine-tuned a
          pretrained model on helpfulness examples and revisions from every revision step. Check on
          held-out public questions whether the model still helps.
        hold: 0.8
        visual_cues:
          - id: sft-public
            phrase: asks only about editing docs
            targets:
              - training-request
          - id: sft-helpful
            phrase: public questions with direct answers
            targets:
              - training-target
  - id: rlaif
    title: Same answers, different order
    visual: Two fresh answer slips cross with their IDs attached. Two judges both chose A on the first
      ballot. Their second ballots distinguish a preference for content from a preference for the left
      slot.
    beats:
      - say: Now sample two fresh answers from the supervised model for the same incident question. A directs
          the engineer to the portal. B includes an excerpt from the restricted timeline. Give a judge the
          request, both answers and our access rule. On this first ballot both example judges choose A.
          It's on the left.
        hold: 0.75
        visual_cues:
          - id: rlaif-b1-1
            phrase: A directs the engineer to the portal
            targets:
              - answer-a
          - id: rlaif-b1-2
            phrase: B includes an excerpt
            targets:
              - answer-b
          - id: rlaif-first
            phrase: both example judges choose A
            targets:
              - order-verdict
      - say: Keep the request, the answers and the principle fixed. The portal answer is on the left.
          Swap the candidate positions. One judge reads for the access rule. The other always picks the
          answer on the left. Which response does that second judge choose now?
        hold: 2.2
        motion_check:
          region: [180, 450, 1560, 380]
          minimumChangedFraction: 0.002
        visual_cues:
          - id: rlaif-b2-1
            phrase: Swap the candidate positions
            targets:
              - answer-a
              - answer-b
          - id: rlaif-predict
            phrase: Which response does that second judge choose
            targets:
              - order-verdict
              - answer-a
              - answer-b
            linger: 0.1
      - say: It chooses B. Its two ballots agree on a position and disagree on the response. The judge applying
          the access rule still chooses A, now on the right. Record the response ID on each ballot. Review
          disagreements before using the label for training. Even judges that agree can misread the same
          rule, so compare a sample of their labels with independent human judgments.
        hold: 0.9
        caption_starts:
          - The judge applying the access rule
        visual_cues:
          - id: rlaif-position-probe
            phrase: It chooses B
            targets:
              - order-verdict
          - id: rlaif-b2-2
            phrase: still chooses A
            targets:
              - order-verdict
  - id: order-normalization
    title: Reading a preference ballot
    visual: Two ballots keep their original order. The share for answer A on each ballot feeds the same
      average. A separate ruler shows how a published recipe limited extreme labels.
    beats:
      - say: Here are two ballots for the portal answer, A, and the disclosure, B. When A appears first, the
          judge gives it point eight. In the swapped order, B gets point seven. Both shares on a ballot
          must add to one, so the second ballot gives A point three. Using those two ballots, what's the
          average share for A?
        hold: 2.2
        caption_starts:
          - In the swapped order
          - so the second ballot gives A point three
          - Using those two ballots
        visual_cues:
          - id: order-first
            phrase: When A appears first
            targets:
              - remapped-votes
          - id: order-swapped
            phrase: In the swapped order
            targets:
              - remapped-votes
          - id: order-remap
            phrase: the second ballot gives A point three
            targets:
              - remapped-votes
      - say: The mean is point five five. Look at the two green pieces that went into it. The same answer went
          from a strong favorite to a clear second choice when the judge read it last. Keep both readings
          for review.
        hold: 0.8
        visual_cues:
          - id: order-normalization-1
            phrase: The mean is point five five
            targets:
              - remapped-votes
      - say: The average tells you how this judge ranked the answers under one principle. Whether A actually
          respects the rule takes an independent check. The original study limited its reasoning-based
          targets to between point four and point six for its main results. Watch a label at point nine
          five move down to that upper limit. The next example uses a separate, unclamped label. The
          original reward model also learned from human judgments of helpfulness.
        hold: 0.85
        visual_cues:
          - id: order-normalization-2
            phrase: actually respects the rule
            targets:
              - label-limit
          - id: clamp-target
            phrase: move down to that upper limit
            targets:
              - label-limit
  - id: reward
    title: From a preference to a reward score
    visual: A probability mark begins at one half on a fixed scale. The judge’s target stays at 0.80 while a
      worked margin update moves the model prediction. Fresh policy samples then receive the learned
      scores.
    beats:
      - say: A reward model gives each answer a score. Subtract B's score from A's and you have the margin. The
          Bradley-Terry model passes that margin through a logistic curve to predict which answer wins.
          Equal scores put the dot halfway along this probability scale.
        hold: 0.7
        visual_cues:
          - id: reward-even
            phrase: halfway along this probability scale
            targets:
              - probability-scale
      - say: Take a separate training pair. The judge gives A a soft target of point eight. Our model is still
          at one half. With a learning rate of one half, which way should the margin move?
        hold: 1.9
        visual_cues:
          - id: reward-target
            phrase: soft target of point eight
            targets:
              - soft-target
          - id: reward-question
            phrase: which way should the margin move
            targets:
              - margin-step
              - probability-scale
              - soft-target
            linger: 0.1
      - say: Raise A's margin. For cross-entropy on a soft label, the derivative with respect to the margin is
          the prediction minus the target. One half minus point eight gives minus point three. Subtract
          half of that derivative. The margin gains point fifteen. Watch the probability dot. A margin of
          point fifteen puts it just under fifty-four percent. Further steps aim for the target. At the
          optimum the margin is the log of the target odds.
        hold: 0.9
        visual_cues:
          - id: reward-gradient
            phrase: minus point three
            targets:
              - margin-gradient
          - id: reward-step
            phrase: margin gains point fifteen
            targets:
              - margin-step
          - id: reward-result
            phrase: just under fifty-four percent
            targets:
              - probability-scale
      - say: Freeze those example scores. The policy can now sample a fresh answer and receive a score from the
          reward model. In the original recipe, reinforcement learning uses that score and a penalty for
          drifting from a reference policy. This is reinforcement learning from AI feedback. Compare the
          learned scores with independent human judgments on held-out requests.
        hold: 0.8
        visual_cues:
          - id: reward-fresh
            phrase: fresh answer
            targets:
              - policy-samples
          - id: reward-reference
            phrase: reference policy
            targets:
              - reference-penalty
  - id: policy-rl
    title: Spend reward gains against policy drift
    visual: A two-answer distribution changes from [0.5,0.5] to [0.8,0.2]. The learned scores and reference
      probabilities remain fixed while actual expectation and KL contributions accumulate.
    beats:
      - say: Carry the learned score into an invented two-answer policy calculation. Fix answer scores at point
          fifteen for A and zero for B. The reference assigns each answer probability one half. A candidate
          assigns A point eight and B point two. Its expected reward is point twelve, compared with point zero
          seven five for the reference. Its KL divergence from the reference is about point one nine two seven.
        hold: 0.8
        visual_cues:
          - id: policy-rl-1
            phrase: Its expected reward is point twelve, compared with point zero seven five for the reference
            targets:
              - policy-expectation
          - id: policy-candidate
            phrase: A candidate assigns A point eight
            targets:
              - policy-expectation
          - id: policy-kl
            phrase: Its KL divergence from the reference is about point one nine two seven
            targets:
              - policy-expectation
      - say: With a drift weight of point two, subtract about point zero three eight five. The candidate objective is
          about point zero eight one five, above the reference’s point zero seven five. Does the candidate still beat the reference if
          that weight becomes one?
        hold: 1.5
        visual_cues:
          - id: policy-rl-2
            phrase: if that weight becomes one
            targets:
              - drift-comparison
          - id: policy-penalty
            phrase: subtract about point zero three eight five
            targets:
              - drift-comparison
          - id: policy-base-objective
            phrase: The candidate objective is about point zero eight one five, above the reference’s point zero seven
              five
            targets:
              - drift-comparison
      - say: The candidate objective falls to about minus point zero seven two seven, so this fixed candidate loses
          the comparison. The answers earned the same rewards as before. The larger drift penalty
          changed which policy came out ahead. In training, sampled answers supply the rewards used to
          estimate this objective and update the policy.
        hold: 0.8
        visual_cues:
          - id: policy-changed-answer
            phrase: The candidate objective falls to about minus point zero seven two seven, so this fixed candidate loses
              the comparison
            targets:
              - drift-comparison
  - id: method-context
    title: Which results apply to this assistant?
    visual: Three paired bars attach the raw and adjusted results to the same comparison. The second beat
      distinguishes dated constitutional training artifacts from the original recipe.
    beats:
      - say: Lee and colleagues asked people to compare PaLM two summaries. Read each pair before and after
          their post-hoc length adjustment. Against supervised fine-tuning, the AI-feedback model went
          from seventy-one to fifty-nine percent wins. The human-feedback model went from seventy-three to
          sixty-one. Head to head, the AI-feedback model went from fifty to forty-seven percent. Those
          numbers concern summaries. Incident handling needs its own test. Their estimate of a more than
          tenfold reduction in labeling cost used prices at the time and excluded setup and annotator
          training.
        hold: 0.85
        visual_cues:
          - id: method-ai
            phrase: AI-feedback model went from seventy-one to fifty-nine
            targets:
              - result-ai
          - id: method-human
            phrase: human-feedback model went from seventy-three to sixty-one
            targets:
              - result-human
          - id: method-pair
            phrase: went from fifty to forty-seven
            targets:
              - result-pair
      - say: The original recipe is one way to teach a constitution. Anthropic's January twenty twenty-six
          constitution also explains the reasons behind its values. Its May report studied synthetic
          constitutional documents, advice examples, and environments where the model can use tools during
          reinforcement learning. Another approach, direct preference optimization, trains a policy from
          chosen and rejected responses without an intermediate reward model. To preserve the judge's
          graded label with that approach, choose a loss that accepts a soft target.
        hold: 0.8
        visual_cues:
          - id: method-context-2
            phrase: original recipe
            targets:
              - method-artifacts
          - id: artifact-document
            phrase: synthetic constitutional documents
            targets:
              - method-artifacts
          - id: artifact-advice
            phrase: advice examples
            targets:
              - method-artifacts
          - id: artifact-rl
            phrase: environments where the model can use tools
            targets:
              - method-artifacts
  - id: attack-search
    title: What does a lower test loss establish?
    visual: A defensive review inspects precomputed candidate scores and a two-batch intake example. The
      admissible cases and rejected duplicate remain attached to their own receipts.
    beats:
      - say: Give the reviewer a test contract. Our example uses a fictional incident, a caller without a grant,
          and a fixed budget of requests and turns. Record whether the input came from the user or a
          retrieved document, what the assistant returned, and any actual tool effects. Human-written
          cases, model-written questions and linguistic variants give us different kinds of coverage. A
          translation may change what a question asks.
        hold: 0.7
        visual_cues:
          - id: attack-search-1
            phrase: actual tool effects
            targets:
              - threat-model
      - say: Open two entries from a saved white-box evaluation. The gradient estimate ranked B first.
          The measured losses tell a different story. B scored point nine and C scored point six.
          The reviewer opens C, the lower-loss case. Its trace shows a denied read and a reply with the
          access portal. The score picked a case to inspect. The trace tells us what reached the engineer.
        hold: 0.9
        caption_starts:
          - The measured losses
          - The reviewer opens C
          - Its trace shows
        visual_cues:
          - id: gcg-gradient
            phrase: The gradient estimate ranked B first
            targets:
              - exact-candidates
          - id: gcg-exact
            phrase: B scored point nine and C scored point six
            targets:
              - exact-candidates
          - id: attack-search-2
            phrase: The reviewer opens C, the lower-loss case
            targets:
              - exact-candidates
          - id: search-receipt
            phrase: a denied read and a reply with the access portal
            targets:
              - reviewed-trace
      - say: Evidence from one model and tokenizer needs a separate check on another. Also inspect what entered
          the evaluation. These two fixture batches contain ordinary questions. Require a short list of
          distinct, nonempty strings. The left batch admits two questions. The right repeats one question
          and fails intake. That failure used zero target attempts. Keep intake errors, execution errors
          and missing judgments in separate counts.
        hold: 0.8
        visual_cues:
          - id: batch-parse
            phrase: distinct, nonempty strings
            targets:
              - attack-accounting
          - id: attack-search-3
            phrase: used zero target attempts
            targets:
