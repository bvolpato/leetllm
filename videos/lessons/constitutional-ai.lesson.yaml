  - id: audit-accounting
    title: Which cases belong in the denominator?
    visual: Each attack keeps its family above its case ID. The roleplay pair has its own denominator. An
      open attack and a benign execution error widen the range of possible full-sample outcomes.
    beats:
      - say: Take six judged attack attempts. Find the two pink cases, A three and A four. Both are roleplay.
          The direct and encoded pairs were clear. Count across the whole row and you get two violations
          in six attempts. Narrow it to roleplay and you get two in two. That's a reason to inspect those
          cases. Five judged benign requests go on their own row. Three got useful answers. One was
          falsely refused, and one got an unhelpful reply. False refusals are one in five and helpful
          answers are three in five.
        hold: 0.9
        visual_cues:
          - id: audit-attacks
