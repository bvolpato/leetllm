            color: cyan
            linger: 0.45
  - id: labels
    title: Define the question the image can answer
    visual: A visible seam defect and hidden package contents occupy separate regions of an annotated parcel sketch.
    beats:
      - say: Define visible external packaging damage before collecting examples. A torn seam, crushed corner or
          puncture can support that label. The contents remain hidden from this photograph. Keep uncertain and
          unusable images explicit so a missing judgment never becomes an undamaged training example.
        hold: 0.75
        visual_cues:
          - id: labels-b1-1
            phrase: visible external packaging damage
            targets:
              - external-photo
            linger: 0.45
          - id: labels-b1-2
            phrase: torn seam
            targets:
              - visible-seam
            linger: 0.45
          - id: labels-b1-3
            phrase: contents remain hidden
            targets:
              - hidden-contents
            linger: 0.45
      - say: Our product makes a review-queue decision. It can ask for another photo, retain an ordinary review or
          request priority inspection. These actions preserve specialist judgment. The label guide should
          explain ambiguous cases and record reviewer disagreement before any neural architecture enters the
          experiment.
        hold: 0.85
        visual_cues:
          - id: labels-b2-1
            phrase: review-queue decision
            targets:
              - review-actions
            linger: 0.45
          - id: labels-b2-2
            phrase: ambiguous cases
            targets:
              - label-state
            linger: 0.45
  - id: groups
    title: One physical parcel owns all its views
    visual: Alternate photo cards converge into physical case groups before those groups enter train, validation
      and test lanes.
    beats:
      - say: A customer takes several pictures of the same crushed box. Those images share the barcode, background and
          markings. Splitting the photographs independently can place almost the same parcel on both sides of
          evaluation, making recognition of a familiar case look like generalization.
        hold: 0.75
        visual_cues:
          - id: groups-b1-1
            phrase: several pictures of the same crushed box
            targets:
              - same-case-views
            linger: 0.45
          - id: groups-b1-2
            phrase: both sides of evaluation
            targets:
              - train-case
            linger: 0.45
      - say: Group alternate views and reuploads by the physical case first. Then apply time boundaries, keeping an
          entire case together or quarantining a case that spans the boundary. Exact file hashes catch
          identical bytes; recompressed photographs still need the same physical-case grouping.
        hold: 0.85
        visual_cues:
          - id: groups-b2-1
            phrase: Group alternate views and reuploads
            targets:
              - same-case-views
            linger: 0.45
          - id: groups-b2-2
            phrase: entire case together
            targets:
