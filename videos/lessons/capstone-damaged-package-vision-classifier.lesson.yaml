  - id: focus-stencil
    title: Construct the signed focus response before its variance
    visual: Move the four-neighbor Laplacian stencil over the actual5×5edge; retain interior9responses
      [1,-1,0]×3,mean0,variance2/3.
    beats:
      - say: Now compute a real local image statistic on the article’s hand-built five-by-five intensity grid. The
          discrete Laplacian adds the north, south, east and west neighbors and subtracts four times the
          center. Use signed or floating-point arithmetic so a negative response survives.
        hold: 0.7
        visual_cues:
          - id: dv-focus-stencil-0
            phrase: Now compute a real local image statistic on the article’s hand-built five-by-five intensity grid
            targets:
              - dv-focus-stencil-mechanism
            color: cyan
            linger: 0.4
          - id: dv-focus-stencil-operation-0
            phrase: Now compute a real local image statistic on the article’s hand-built five-by-five intensity grid. The
              discrete Laplacian adds the north, south, east and west neighbors and subtracts four times the
              center. Use signed or floating-point arithmetic so a negative response survives.
            targets:
              - dv-focus-stencil-mechanism
            color: cyan
            linger: 0.45
          - id: dv-stencil-operation
            phrase: The discrete Laplacian adds the north, south, east and west neighbors and subtracts four times the
              center
            targets:
              - dv-focus-stencil-mechanism
            color: yellow
            linger: 0.45
      - say: This implementation drops the outer pixels, leaving nine interior responses. Each of the three rows
          contains one, minus one and zero, so the mean is zero. Subtract the mean from each response, square
          the difference, sum those squares and divide by all nine retained pixels. The population variance is
          two thirds.
