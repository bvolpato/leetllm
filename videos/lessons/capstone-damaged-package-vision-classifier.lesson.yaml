scenes:
  - id: intro
    title: Which photo deserves the next review slot?
    visual: Three schematic photo frames show a dark package, a clear torn parcel and an empty frame with their
      supplied scores.
    beats:
      - say: A specialist has time to inspect one photo next. A very dark image carries the largest damage score,
          while a clear torn parcel has a slightly lower score. Which one supplies evidence the specialist can
          actually use? The answer depends on input quality before ranking scores.
        hold: 0.75
        visual_cues:
          - id: intro-b1-1
            phrase: very dark image
            targets:
              - dark-photo
            linger: 0.45
          - id: intro-b1-2
            phrase: clear torn parcel
            targets:
              - clear-photo
            linger: 0.45
          - id: intro-b1-3
            phrase: input quality before ranking
            targets:
              - damage-scores
            linger: 0.45
      - say: We will build a photo-review policy, keep related images together when evaluating it, and join specialist
          outcomes afterward. The scores and sketches here are supplied teaching fixtures. A trained
          classifier needs real permitted photographs, labels and measured results under the same contract.
        hold: 0.85
        visual_cues:
          - id: intro-b2-1
            phrase: photo-review policy
            targets:
              - case-routes
            linger: 0.45
          - id: intro-b2-2
            phrase: supplied teaching fixtures
            targets:
              - photo-cases
            linger: 0.45
  - id: evidence-contract
    title: Separate a review route from a damage or refund claim
    visual: Retain one dark0.94 photo and explicitly separate route, external label and order-authorized claim
      before showing the absent real training artifacts.
    beats:
      - say: The three actions answer which evidence enters which review queue. A request for a new photo asks for
          useful light, focus or parcel coverage. Normal review does not establish undamaged contents.
          Priority review does not authorize a refund, replacement or restocking decision; those need their
          separate order policy and specialist workflow.
        hold: 0.7
        visual_cues:
          - id: dv-evidence-contract-0
            phrase: The three actions answer which evidence enters which review queue
            targets:
              - dv-evidence-contract-mechanism
            color: cyan
            linger: 0.4
          - id: dv-evidence-contract-operation-0
            phrase: The three actions answer which evidence enters which review queue. A request for a new photo asks for
              useful light, focus or parcel coverage. Normal review does not establish undamaged contents.
              Priority review does not authorize a refund, replacement or restocking decision; those need
              their separate order policy and specialist workflow.
            targets:
              - dv-evidence-contract-mechanism
            color: cyan
            linger: 0.45
      - say: This article supplies invented metadata, scores and specialist labels. It supplies no photographs,
          trained weights or measured model results. The tiny training split contains two positive photos of
          one parcel and no negative case; validation contains no usable positive. These records can test a
          contract but cannot establish damage discrimination.
        hold: 0.7
        visual_cues:
          - id: dv-evidence-contract-1
            phrase: This article supplies invented metadata, scores and specialist labels
            targets:
              - dv-evidence-contract-mechanism
            color: yellow
            linger: 0.4
          - id: dv-evidence-contract-operation-1
            phrase: This article supplies invented metadata, scores and specialist labels. It supplies no photographs,
              trained weights or measured model results. The tiny training split contains two positive photos
              of one parcel and no negative case; validation contains no usable positive. These records can
              test a contract but cannot establish damage discrimination.
            targets:
              - dv-evidence-contract-mechanism
            color: cyan
            linger: 0.45
          - id: dv-training-evidence
            phrase: The tiny training split contains two positive photos of one parcel and no negative case
            targets:
              - dv-evidence-contract-mechanism
            color: yellow
            linger: 0.45
      - say: For a real classifier, obtain permission for varied photographs and retain the allowed-use record.
          Restrict access and remove personal shipping details from a public portfolio. A model card should
          name intended use, excluded uses, evaluated slices, thresholds and limitations. None of those
          documents alone establishes that a model works.
        hold: 0.7
        visual_cues:
          - id: dv-evidence-contract-2
            phrase: For a real classifier, obtain permission for varied photographs and retain the allowed-use record
            targets:
