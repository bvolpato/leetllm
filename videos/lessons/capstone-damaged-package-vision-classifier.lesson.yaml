  - id: exposure-detail
    title: Measure the parcel region and retain its small cue
    visual: Contrast a bright shipping label with a darkparcel region,then shrink an explicit4pixel defect
      under1024→224resizing without claiming inference.
    beats:
      - say: Mean pixel brightness can hide a dark parcel next to a bright shipping label. A parcel-region histogram
          and clipped-pixel fraction can expose that distribution. Pixel intensity is not illumination in lux;
          a physical illumination estimate needs sensor calibration.
        hold: 0.7
        visual_cues:
          - id: dv-exposure-detail-0
            phrase: Mean pixel brightness can hide a dark parcel next to a bright shipping label
            targets:
              - dv-exposure-detail-mechanism
            color: cyan
            linger: 0.4
          - id: dv-exposure-detail-operation-0
            phrase: Mean pixel brightness can hide a dark parcel next to a bright shipping label. A parcel-region
              histogram and clipped-pixel fraction can expose that distribution. Pixel intensity is not
              illumination in lux; a physical illumination estimate needs sensor calibration.
            targets:
              - dv-exposure-detail-mechanism
            color: cyan
            linger: 0.45
          - id: dv-region-exposure
            phrase: A parcel-region histogram and clipped-pixel fraction can expose that distribution
            targets:
              - dv-exposure-detail-mechanism
            color: yellow
            linger: 0.45
      - say: Resizing a one-thousand-twenty-four-pixel-wide frame to two hundred twenty-four multiplies widths by two
          hundred twenty-four divided by one thousand twenty-four. A four-pixel feature then spans point eight
          seven five output pixels. That geometric result does not prove how a learned classifier will
          respond.
