  - id: quality
    title: Check whether the pixels support inspection
    visual: Brightness and blur positions enter a quality plane while a separate package-visible flag vetoes an
      otherwise acceptable point.
    beats:
      - say: The quality policy checks package visibility, brightness and blur before consulting the damage threshold.
          In this fixture, larger blur values mean more blur. The dark photo fails brightness despite its high
          damage score, so the proposed route requests a better image.
        hold: 0.75
        visual_cues:
