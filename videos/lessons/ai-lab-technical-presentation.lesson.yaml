scenes:
  - id: opening
    title: Give the architecture a problem to solve
    visual: A fictional connector platform frames a measured onboarding delay, a latency target, and one decision
      the audience can inspect.
    beats:
      - say: "You have fifteen minutes to explain an engineering project. You could begin with its class hierarchy, or
          with the question that made the project matter: why did adding one partner's runbooks take twenty
          days? A concrete problem gives every later diagram a job."
        hold: 0.8
        visual_cues:
          - id: opening-beat-1-focus-1
            phrase: "or with the question that made the project matter: why did adding one partner's runbooks take twenty
              days"
            targets:
              - opening-source-onboarding-days
            color: cyan
            linger: 0.65
      - say: We will use a fictional connector platform throughout. Its source onboarding changed from twenty days to
          six in a synthetic comparison, while lookup p95 moved from 720 to 680 milliseconds against an 800
          millisecond target. Treat those values as teaching fixtures and inspect the claim behind each one.
        hold: 0.8
        visual_cues:
          - id: opening-beat-2-focus-1
            phrase: Its source onboarding changed from twenty days to six in a synthetic comparison
            targets:
              - opening-source-onboarding-days
              - opening-after
            color: cyan
            linger: 0.65
          - id: opening-beat-2-focus-2
            phrase: while lookup p95 moved from 720 to 680 milliseconds against an 800 millisecond target
            targets:
              - opening-latency
            color: yellow
            linger: 0.65
  - id: format-contract
    title: Choose the claim the actual prompt permits
    visual: A role-specific request admits a public negative research result while a confidential deployment
      artifact stays closed. The fictional fifteen-minute rehearsal remains separate from employer
      requirements.
    beats:
      - say: Begin with the actual role-specific request. Ask who will listen, how long the presentation lasts,
          whether questions share that slot, which projects are permitted and what materials or tools you may
          use. Our fifteen-minute plan is a rehearsal fixture. The current published OpenAI guide says
          assessments and tool permissions vary by format; DeepMind supplies role-specific preparation and
          asks candidates to explain reasoning with data.
        hold: 0.75
      - say: A research-method talk can defend a hypothesis, matched baseline, experiment and negative result without
          an invented production launch. An infrastructure talk can instead defend an operational boundary and
          migration. Choose the project whose evidence answers the requested question and whose contribution
          you can explain. Neither a successful deployment nor a positive benchmark is a universal requirement
          inferred from these guides.
        hold: 0.75
        visual_cues:
          - id: format-negative
            phrase: negative result
            targets:
              - format-negative-state
            color: cyan
            linger: 0.55
      - say: Confidentiality constrains what can be shown. Use approved aggregates and sanitized diagrams, remove
          customer identifiers and secrets, and name any rounding or withheld values. If those changes destroy
          the explanation, select another project. A rehearsal service accepting files does not authorize
          uploading private artifacts. DeepMind permits AI preparation but defaults against AI during live
          interviews and tasks unless told otherwise; follow the actual format’s permission.
        hold: 0.75
        visual_cues:
          - id: format-private
            phrase: remove customer identifiers and secrets
            targets:
              - format-private-state
            color: cyan
            linger: 0.55
  - id: argument
    title: Write the argument before choosing the slides
    visual: Six short claims connect a repeated integration problem to one constraint, a design choice, an
      alternative, evidence, and a limit.
    beats:
      - say: "Begin with six sentences: the problem, constraint, decision, alternative, evidence, and limit. Here,
          eight source integrations repeat credential and pagination logic. The constraint is a tenant-safe
          lookup below the stated latency target. The decision is one connector contract with source-specific
          adapters."
        hold: 0.8
        visual_cues:
          - id: argument-claims-0
            phrase: "Begin with six sentences: the problem, constraint, decision, alternative, evidence, and limit"
            targets:
              - argument-problem
              - argument-constraint
              - argument-decision
              - argument-alternative
              - argument-evidence
              - argument-limit
            color: cyan
            linger: 0.65
          - id: argument-problem-detail
            phrase: Here, eight source integrations repeat credential and pagination logic
            targets:
              - argument-problem
            color: pink
            linger: 0.6
          - id: argument-constraint-detail
            phrase: The constraint is a tenant-safe lookup below the stated latency target
            targets:
              - argument-constraint
            color: yellow
            linger: 0.6
          - id: argument-decision-detail
            phrase: The decision is one connector contract with source-specific adapters
            targets:
              - argument-decision
            color: cyan
            linger: 0.6
      - say: A service split could improve independent deployment and resource isolation, while adding remote calls
          and another operational boundary. Before drawing slides, ask which detail lets an engineer challenge
          the decision. A repeated cursor is useful; a list of helper classes usually gives the audience less
          to inspect.
        hold: 0.8
        visual_cues:
          - id: argument-claims-1
            phrase: A service split could improve independent deployment and resource isolation
            targets:
              - argument-alternative
            color: blue
            linger: 0.6
          - id: argument-alternative-downside
            phrase: while adding remote calls and another operational boundary
            targets:
              - argument-limit
            color: yellow
            linger: 0.65
          - id: argument-evidence-detail
            phrase: A repeated cursor is useful
            targets:
              - argument-evidence
            color: green
            linger: 0.6
  - id: evidence-inventory
    title: Give every argument sentence an inspectable artifact
    visual: The six existing argument slots acquire a concrete owned contract, source record, comparison and
      limitation. The tenant store remains assigned to the other team.
    beats:
      - say: Populate the argument with artifacts rather than a package list. The repeated integration work belongs
          beside the problem. A tenant-scoped request and its failure response belong beside correctness.
          Onboarding records, contract tests and request traces support different claims. The six sentences
          organize the explanation; they are not a mandatory slide count or a published hiring rubric.
        hold: 0.75
        visual_cues:
          - id: inventory-evidence
            phrase: Onboarding records, contract tests and request traces
            targets:
              - inventory-evidence-state
            color: cyan
            linger: 0.55
      - say: Name personal contribution precisely. In this fictional project, the presenter owns the connector
          contract, adapter implementation, gateway changes, tests and instrumentation. Another team owns the
          tenant store. A shared successful migration does not transfer that team’s code or decisions into
          your individual work. Conversely, owning an interface lets you explain its observed behavior without
          claiming to know every dependency’s internals.
        hold: 0.75
        visual_cues:
          - id: inventory-owners
            phrase: Another team owns the tenant store
            targets:
              - inventory-owners-state
            color: cyan
            linger: 0.55
      - say: For each number retain its unit, numerator and denominator where relevant, population, measurement window
          and source. Source-onboarding duration also needs its start and finish definition, source count and
          complexity. A twenty-to-six-day before-and-after comparison establishes fourteen fewer days in those
          compared groups. Concurrent staffing, source difficulty or process changes can still prevent
          attribution to the contract.
        hold: 0.75
        visual_cues:
          - id: inventory-difference
            phrase: fourteen fewer days
            targets:
              - inventory-difference-state
            color: cyan
            linger: 0.55
  - id: path
    title: Trace one request and one failure
    visual: A support lookup crosses tenant authorization and an in-process adapter. A repeated pagination cursor
      becomes an explicit incomplete-result error with a regression test.
    beats:
      - say: "Draw the request path the audience needs: support UI, gateway, tenant authorization, adapter contract,
          and the tenant store owned by another team. A request ID follows the lookup. Keep credential access
          inside the authorized boundary, where the audience can see who owns each decision."
        hold: 0.8
        visual_cues:
          - id: path-beat-1-focus-1
            phrase: "Draw the request path the audience needs: support UI, gateway, tenant authorization, adapter
              contract, and the tenant store owned by another team"
            targets:
              - path-node-store
            color: cyan
            linger: 0.65
          - id: path-beat-1-focus-2
            phrase: "Draw the request path the audience needs: support UI"
            targets:
              - path-node-support-ui
            color: yellow
            linger: 0.65
      - say: Now show the repeated-cursor failure. The adapter detects that the source returned the same cursor twice
          and reports an incomplete result. A regression test preserves the case, and a trace records the
          source and request ID while credentials stay inside the authorized boundary. Name your code and the
          other team's boundary accurately.
        hold: 0.8
        motion_check:
          region:
            - 200
            - 650
            - 1520
            - 250
          minimumChangedFraction: 0.002
        visual_cues:
          - id: pagination-repeat
            phrase: The adapter detects that the source returned the same cursor twice and reports an incomplete result
            targets:
              - pagination-receipts
              - pagination-stop
            color: yellow
            linger: 0.65
          - id: pagination-identity
            phrase: a trace records the source and request ID while credentials stay inside the authorized boundary
            targets:
              - pagination-identity
            color: cyan
            linger: 0.65
  - id: failure-invariant
    title: Retain the cursor identity that makes completion impossible
    visual: The same request keeps a seen-cursor set and explicit completion flag. A returned cursor moves into
      the set; a later repeat stops the same paging trace without marking it complete.
    beats:
      - say: The pagination invariant gives the diagram an executable question. Begin with an empty seen set and
          request the first page. A terminal null cursor means completion. For each nonterminal returned
          cursor, test whether it has already appeared. An earlier repeated cursor can form a cycle even when
          it is not the immediately preceding value. Stop with an explicit incomplete result instead of
          claiming the runbooks are complete.
        hold: 0.75
        visual_cues:
          - id: cursor-empty
            phrase: empty seen set
            targets:
              - cursor-empty-state
            color: cyan
            linger: 0.55
      - say: For the retained two-page example, page one returns C seventeen. Add it to the seen set and use it for
          page two’s request. Page two returns C seventeen again. The set already owns that identity, so the
          adapter reports incomplete and requests no third page. Preserve the request ID, source ID and tenant
          authorization while leaving credentials inside the approved boundary.
        hold: 0.75
        visual_cues:
          - id: cursor-first
            phrase: page one returns C seventeen
            targets:
              - cursor-first-state
            color: cyan
            linger: 0.55
          - id: cursor-repeat
            phrase: Page two returns C seventeen again
            targets:
              - cursor-repeat-state
            color: cyan
            linger: 0.55
          - id: cursor-stop
            phrase: requests no third page
            targets:
              - cursor-stop-state
            color: cyan
            linger: 0.55
      - say: A regression fixture preserves that specific failure and its expected response. It does not establish
          that every source is correct or that runtime authorization can be replaced by tests. A captured
          sanitized trace is useful when a live demo dependency fails. Explain what a listener should watch
          before starting the demo; one successful execution is distinct from workload reliability evidence.
        hold: 0.75
  - id: tradeoff
    title: Defend a choice with a reversal signal
    visual: In-process and separate-service designs are compared by deployment control, isolation, network
      boundaries, and the condition that would justify a split.
    beats:
      - say: "Keeping the adapter in-process makes the first migration simpler and avoids an extra network hop. The
          cost is shared process risk: one adapter can consume resources or affect its neighbors. A service
          split gives independent deployment and resource isolation, and adds network behavior and operational
          work."
        hold: 0.8
        visual_cues:
          - id: tradeoff-beat-1-focus-1
            phrase: A service split gives independent deployment and resource isolation
            targets:
              - tradeoff-separate-adapter-service
            color: cyan
            linger: 0.65
          - id: tradeoff-beat-1-focus-2
            phrase: Keeping the adapter in-process makes the first migration simpler and avoids an extra network hop
            targets:
              - tradeoff-in-process-contract
            color: yellow
            linger: 0.65
      - say: A useful defense names the constraint you prioritized, the alternative, the downside you accepted, and
          the evidence that would reverse your choice. Locate the wait before proposing a split. When a source
          is rate limiting requests, another service leaves that external limit in place.
        hold: 0.8
        visual_cues:
          - id: tradeoff-beat-2-focus-1
            phrase: another service leaves that external limit in place
            targets:
              - tradeoff-separate-adapter-service
            color: cyan
            linger: 0.65
  - id: source-wait
    title: Change one boundary while retaining the external wait
    visual: The same rate-limited request keeps its source delay in both topologies. A separate process adds one
      explicit remote hop while the upstream quota remains unchanged.
    beats:
      - say: "Locate the wait before recommending a service split. Supply a controlled serial example: the source
          imposes one thousand milliseconds of waiting and all other current work totals two hundred. The
          request takes twelve hundred milliseconds. If a separate service adds a twenty-millisecond remote
          boundary while those two quantities stay fixed, the new total is twelve hundred twenty. These are
          invented explanatory times, not a measured benchmark."
        hold: 0.75
        visual_cues:
          - id: wait-other
            phrase: all other current work totals two hundred
            targets:
              - wait-other-state
            color: cyan
            linger: 0.55
          - id: wait-before
            phrase: request takes twelve hundred milliseconds
            targets:
              - wait-before-state
            color: cyan
            linger: 0.55
          - id: wait-hop
            phrase: twenty-millisecond remote boundary
            targets:
              - wait-hop-state
            color: cyan
            linger: 0.55
          - id: wait-after
            phrase: new total is twelve hundred twenty
            targets:
              - wait-after-state
            color: cyan
            linger: 0.55
      - say: The added boundary did not remove the upstream wait. Investigate the source quota, bounded concurrency
          and backoff before claiming topology repairs that cause. More simultaneous callers can consume a
          shared quota faster. An isolated service may still be valuable for independent deployment or a
          separate resource budget, but that is a different reason supported by different measurements.
        hold: 0.75
      - say: If an adapter instead saturates the shared process, compare per-adapter budgets, concurrency limits and
          process isolation against that observed bottleneck. State the accepted downside and the signal that
          would reverse the decision. Compatibility, migration effort and new network failure behavior belong
          in that reversal plan. Neither topology wins every workload.
        hold: 0.75
  - id: paired-evidence
    title: Open the average and count what changed
    visual: A paired result matrix preserves both improvements and regressions across the same 200 query IDs.
    beats:
      - say: The retrieval fixture has two hundred frozen queries with one labeled relevant runbook each. The baseline
          finds it in the top five for 148 queries; the candidate does so for 162. That moves hit-at-five from
          74 to 81 percent, a seven percentage point increase.
        hold: 0.8
        visual_cues:
          - id: paired-population
            phrase: The retrieval fixture has two hundred frozen queries with one labeled relevant runbook each
            targets:
              - paired-matrix
            color: cyan
            linger: 0.65
          - id: paired-totals
            phrase: The baseline finds it in the top five for 148 queries; the candidate does so for 162
            targets:
              - paired-totals
            color: yellow
            linger: 0.65
          - id: paired-rates
            phrase: hit-at-five from 74 to 81 percent, a seven percentage point increase
            targets:
              - paired-rates
            color: yellow
            linger: 0.65
      - say: "The paired matrix shows the mechanism behind the average: 22 queries improve, eight regress, and 140
          stay successful in both systems. Thirty remain unsuccessful in both. Read the regressions before
          claiming a useful general change. A small high-risk slice can matter more than the aggregate."
        hold: 0.8
        visual_cues:
          - id: paired-improved
            phrase: 22 queries improve
            targets:
              - paired-improved
            color: cyan
            linger: 0.65
          - id: paired-regressed
            phrase: eight regress
            targets:
              - paired-regressed
            color: pink
            linger: 0.65
          - id: paired-both
            phrase: 140 stay successful in both systems
            targets:
              - paired-both
            color: cyan
            linger: 0.65
          - id: paired-neither
            phrase: Thirty remain unsuccessful in both
            targets:
              - paired-neither
            color: yellow
            linger: 0.65
  - id: paired-contract
    title: Define the retrieval outcome before interpreting the gain
    visual: Each retained query keeps its text, tenant, permission context and single relevant runbook as its
      before/after success enters the paired table. Multiple-relevant-item recall is shown as a distinct
      fraction.
    beats:
      - say: For this fixture, a query succeeds when its one labeled relevant runbook appears in the top five. Hit at
          five asks whether at least one relevant item was returned. Recall at five divides the number of
          relevant items retrieved by the total relevant items for that query. With exactly one relevant item
          these agree; with several relevant items, one hit does not imply complete recall.
        hold: 0.75
        visual_cues:
          - id: retrieval-recall
            phrase: Recall at five divides
            targets:
              - retrieval-recall-state
            color: cyan
            linger: 0.55
      - say: Keep the same query text, labels, corpus revision and tenant permissions before comparing paths. Matching
          IDs alone cannot preserve those inputs. Record code, configuration, retriever or model revision and
          each index build. Changing an embedding model may require a different index over the same corpus. If
          several components change together, report a combined system comparison instead of assigning the
          gain to the connector alone.
        hold: 0.75
        visual_cues:
          - id: paired-inputs
            phrase: same query text, labels, corpus revision and tenant permissions
            targets:
              - paired-inputs-state
            color: cyan
            linger: 0.55
      - say: The original matrix has one hundred forty successes in both systems, eight baseline-only successes,
          twenty-two candidate-only successes and thirty shared failures. Baseline successes add the shared
          and baseline-only cells; candidate successes add the shared and candidate-only cells. Their net
          difference is improvements minus regressions. Keep the eight failed identities available for a slice
          review rather than erasing them inside the average.
        hold: 0.75
        visual_cues:
          - id: paired-regressions
            phrase: Keep the eight failed identities
            targets:
              - paired-regressions-state
            color: cyan
            linger: 0.55
  - id: typed-comparison
    title: Match actual query identities before computing the paired counts
    visual: The actual article function accepts reversed dictionary order but rejects empty, unequal-ID and
      numeric-Boolean fixtures. Each rejected input stops before a rate is shown.
    beats:
      - say: The actual article program requires the same nonempty query-ID set and literal Boolean hit values for
          both systems. It joins candidate outcomes by each baseline ID, rather than pairing arbitrary
          dictionary iteration positions. Reversing the candidate dictionary therefore preserves every paired
          result. Equal dictionary lengths alone cannot establish matching queries.
        hold: 0.75
        visual_cues:
          - id: typed-order
            phrase: Reversing the candidate dictionary
            targets:
              - typed-order-state
            color: cyan
            linger: 0.55
      - say: "Empty comparisons, different ID sets and a numeric one standing in for true all reject in this program.
          Each accepted query enters exactly one of four cells, so their sum equals the owned population.
          Incident counts use a separate strict contract: a nonnegative integer count and a positive integer
          request exposure, with Boolean or fractional exposures rejected."
        hold: 0.75
        visual_cues:
          - id: typed-reject
            phrase: numeric one standing in for true
            targets:
              - typed-reject-state
            color: cyan
            linger: 0.55
          - id: typed-conservation
            phrase: their sum equals the owned population
            targets:
              - typed-conservation-state
            color: cyan
            linger: 0.55
      - say: We actually ran that standard-library fixture and its displayed outputs. It verifies arithmetic and these
          input contracts. It does not verify the labels, authenticate where the scores came from, estimate
          statistical significance or establish a real project outcome. A retained executable example and a
          supported empirical claim are different artifacts.
        hold: 0.75
  - id: time-budget
    title: Spend the fifteen minutes on the question
    visual: A fifteen-minute allocation gives the architecture and decision room while protecting time for
      evidence, limits, and interruption.
    beats:
      - say: A fifteen-minute rehearsal can give two minutes to context, four to the request path, three to a hard
          decision, three to evidence, one to limits, and two to questions or interruption. The allocation
          totals fifteen. If questions have their own reserved block, adjust the plan to the instructions you
          receive.
        hold: 0.8
        visual_cues:
          - id: talk-context
            phrase: two minutes to context
            targets:
              - talk-context
            color: cyan
            linger: 0.6
          - id: talk-request-path
            phrase: four to the request path
            targets:
              - talk-path
            color: yellow
            linger: 0.6
          - id: talk-decision
            phrase: three to a hard decision
            targets:
              - talk-decision
            color: yellow
            linger: 0.6
          - id: talk-evidence
            phrase: three to evidence
            targets:
              - talk-evidence
            color: yellow
            linger: 0.6
          - id: talk-limits
            phrase: one to limits
            targets:
              - talk-limits
            color: yellow
            linger: 0.6
          - id: talk-questions
            phrase: two to questions or interruption
            targets:
              - talk-questions
            color: yellow
            linger: 0.6
      - say: Prepare a ninety-second version with the same problem, hardest decision, your contribution, and strongest
          supported result. That lets you resume after an interruption and return to the next useful point. A
          small time buffer is part of the talk design, just like a failure margin in a service.
        hold: 0.8
        visual_cues:
          - id: talk-short-version
            phrase: the same problem, hardest decision, your contribution, and strongest supported result
            targets:
              - talk-context
              - talk-decision
              - talk-evidence
            color: cyan
            linger: 0.6
          - id: talk-buffer
            phrase: A small time buffer is part of the talk design
            targets:
              - talk-questions
            color: yellow
            linger: 0.6
  - id: interrupted-rehearsal
    title: Spend the remaining time after a real interruption
    visual: A question consumes the original buffer. The same claim objects survive as the continuation drops
      optional detail and retains the decision, contribution, evidence and limit.
    beats:
      - say: Use the clock during rehearsal. In the original fifteen-minute plan, context takes two minutes and the
          path four, reaching minute six. If questions then consume three minutes, six remain. The original
          decision, evidence and limits blocks require seven, so continuing at the original pace cannot fit.
          Do not solve the conflict by speaking every slide faster.
        hold: 0.75
        visual_cues:
          - id: talk-question
            phrase: questions then consume three minutes
            targets:
              - talk-question-state
            color: cyan
            linger: 0.55
          - id: talk-remaining
            phrase: six remain
            targets:
              - talk-remaining-state
            color: cyan
            linger: 0.55
          - id: talk-overflow
            phrase: blocks require seven
            targets:
              - talk-overflow-state
            color: cyan
            linger: 0.55
      - say: Answer the current question, then choose the strongest remaining chain. For a supplied six-minute
          continuation, spend two on the hard decision and your owned change, three on its evidence and one on
          its limit. That totals six. This is a rehearsal choice, not an employer’s required allocation.
          Follow the interviewer if they want to stay on one technical mechanism.
        hold: 0.75
        visual_cues:
          - id: talk-repair
            phrase: That totals six
            targets:
              - talk-repair-state
            color: cyan
            linger: 0.55
      - say: The ninety-second version keeps the same problem, decision, contribution and strongest supported result.
          An appendix supplies one requested schema, failure trace or comparison when useful. It should not
          force every answer through an unrelated tour. A listener can test whether the argument survives
          interruption; a minute counter can only verify the arithmetic.
        hold: 0.75
  - id: measurement-limits
    title: Keep operational metrics inside their scope
    visual: Incident rates reverse direction when the request denominator changes. The successful-request p95
      passes while the 99-percent success gate fails.
    beats:
      - say: Counts need exposure. Five incidents in five million requests is one per million. One incident in half a
          million is two per million. The incident count fell while the per-request rate doubled. Present the
          numerator and denominator together, and describe the window used for each.
        hold: 0.8
        visual_cues:
          - id: incident-prior
            phrase: Five incidents in five million requests is one per million
            targets:
              - incident-prior
            color: cyan
            linger: 0.65
          - id: incident-later
            phrase: One incident in half a million is two per million
            targets:
              - incident-later
            color: yellow
            linger: 0.65
          - id: incident-rate-change
            phrase: The incident count fell while the per-request rate doubled
            targets:
              - incident-counts
              - incident-rates
            color: yellow
            linger: 0.65
      - say: In another synthetic check, successful-request p95 is 680 milliseconds against an 800 millisecond limit,
          while 20 of 200 attempts time out. Success is 90 percent, below a 99 percent gate. The latency check
          passes and the combined service gate fails, so the rollout stays held.
        hold: 0.8
        visual_cues:
          - id: service-latency
            phrase: successful-request p95 is 680 milliseconds against an 800 millisecond limit
            targets:
              - service-latency
            color: cyan
            linger: 0.65
          - id: service-success
            phrase: while 20 of 200 attempts time out
            targets:
              - service-success
            color: pink
            linger: 0.65
          - id: service-ratio
            phrase: Success is 90 percent, below a 99 percent gate
            targets:
              - service-success
            color: yellow
            linger: 0.65
          - id: service-gate
            phrase: The latency check passes and the combined service gate fails, so the rollout stays held
            targets:
              - service-latency
              - service-success
              - service-gate
            color: yellow
            linger: 0.65
  - id: metric-claims
    title: Separate a lower count, a relative change and a capacity claim
    visual: The same result sheet reveals percentage-point and relative differences separately, then pairs each
      incident numerator with its own request exposure. The p95 margin is kept outside a capacity prediction.
    beats:
      - say: Compute the two retrieval changes with their actual denominators. Fourteen additional successes divided
          by two hundred queries is seven percentage points. Dividing the same fourteen by the original one
          hundred forty-eight successes gives about nine point five percent relative improvement. Neither
          calculation means every query improved. The paired table still contains eight regressions.
        hold: 0.75
        visual_cues:
          - id: metric-points
            phrase: seven percentage points
            targets:
              - metric-points-state
            color: cyan
            linger: 0.55
          - id: metric-relative
            phrase: nine point five percent relative improvement
            targets:
              - metric-relative-state
            color: cyan
            linger: 0.55
      - say: The incident count reduction from five to one is eighty percent. With the article’s different request
          exposures, the observed per-request rate instead rises from one to two per million. The rate
          reversal does not prove the migration caused incidents or establish a stable underlying rate from
          two windows. Keep severity, incident definition, reporting changes and exposure beside that
          comparison.
        hold: 0.75
        visual_cues:
          - id: metric-count
            phrase: eighty percent
            targets:
              - metric-count-state
            color: cyan
            linger: 0.55
          - id: metric-rate
            phrase: rises from one to two per million
            targets:
              - metric-rate-state
            color: cyan
            linger: 0.55
      - say: Lookup p95 falls by forty milliseconds, about five point six percent of the seven-hundred-twenty
          baseline. Both reported percentiles pass eight hundred, but the remaining gap is not available
          server capacity. Load, traffic mix, sample sizes, observation windows and failed-attempt behavior
          still matter. Repeated runs on the same frozen queries measure run variation rather than adding
          independent tenants.
        hold: 0.75
        visual_cues:
          - id: metric-latency
            phrase: five point six percent
            targets:
              - metric-latency-state
            color: cyan
            linger: 0.55
  - id: migration-stages
    title: Keep replay, shadow and candidate-served traffic distinct
    visual: The same lookup is first replayed on a labeled fixture, then copied under bounded read-only shadow,
      then assigned to a small canary only after its explicit gate. The user-response owner stays visible.
    beats:
      - say: Explain migration in three stages with different evidence. First replay a sanitized labeled fixture
          through both paths. Check authorization, pagination, errors and retrieval outcomes. This is
          controlled offline evidence, with no claim that a real user received the candidate response. Keep
          the fixture and its expected outcomes with the comparison.
        hold: 0.75
        visual_cues:
          - id: migration-replay
            phrase: First replay a sanitized labeled fixture
            targets:
              - migration-replay-state
            color: cyan
            linger: 0.55
      - say: Second, shadow a permitted bounded sample of read-only traffic while the old path still serves users.
          Candidate outputs can be compared, but copied traffic does not create relevance labels. Shadow
          execution can consume upstream quota, emit audit records and change caches. Bound that load and stop
          it if it harms the serving path; read-only business behavior does not imply zero operational
          effects.
        hold: 0.75
        visual_cues:
          - id: migration-shadow
            phrase: while the old path still serves users
            targets:
              - migration-shadow-state
            color: cyan
            linger: 0.55
          - id: migration-effects
            phrase: emit audit records
            targets:
              - migration-effects-state
            color: cyan
            linger: 0.55
      - say: Third, after the earlier checks, a canary serves a small real share through the candidate. Specify the
          observation window, latency and error limits, quality checks and decision owner before promotion.
          Google Cloud’s guidance similarly separates offline validation from online canary or A/B validation.
          Its model-serving guidance does not certify this fictional connector migration.
        hold: 0.75
        visual_cues:
          - id: migration-canary
            phrase: a canary serves a small real share
            targets:
              - migration-canary-state
            color: cyan
            linger: 0.55
  - id: recovery-boundary
    title: A route rollback does not erase completed effects
    visual: A failed joint gate keeps the candidate share at zero. A separately supplied audit entry remains after
      shadow stops, while only future routing returns to the old path.
    beats:
      - say: The service policy in our fixture requires both successful-request p95 below eight hundred milliseconds
          and success fraction at least point nine nine. Compute success as successful attempts divided by all
          attempts. A healthy percentile of successful requests cannot compensate for the failed attempts
          removed from that latency population. Preserve failed durations and counts too.
        hold: 0.75
        visual_cues:
          - id: recovery-both
            phrase: requires both
            targets:
              - recovery-both-state
            color: cyan
            linger: 0.55
      - say: If either declared gate fails, hold promotion and retain the failed evidence even when another metric
          improves. Define and test the route back to the old path before exposure. A routing change controls
          which implementation handles later requests; it does not undo an audit entry, external write or
          other effect already completed.
        hold: 0.75
        visual_cues:
          - id: recovery-route
            phrase: A routing change controls
            targets:
              - recovery-route-state
            color: cyan
            linger: 0.55
          - id: recovery-effect
            phrase: does not undo an audit entry
            targets:
              - recovery-effect-state
            color: cyan
            linger: 0.55
      - say: A schema migration or consequential action therefore needs its own compatibility and recovery plan.
          Stopping a shadow or rolling back a route cannot by itself prove that its previous effects
          disappeared. Keep serving ownership, completed effects, observation windows and promotion authority
          distinct when describing what the migration actually demonstrated.
        hold: 0.75
  - id: qa-claim-repair
    title: Answer from an observed trace before naming a cause
    visual: One retained request has a measured wait at the store boundary, an unknown query plan and an
      explicitly pending index hypothesis. A corrected slide changes only the unsupported statement.
    beats:
      - say: When asked about a slow store query, identify what the trace actually measured and which boundary you
          owned. A wait inside the store call can include server work, network behavior or waiting. Without
          the query plan and an appropriate comparison, a missing index remains a hypothesis. Ask for the
          evidence that would distinguish those explanations before recommending the repair.
        hold: 0.75
        visual_cues:
          - id: qa-measured
            phrase: what the trace actually measured
            targets:
              - qa-measured-state
            color: cyan
            linger: 0.55
          - id: qa-hypothesis
            phrase: a missing index remains a hypothesis
            targets:
              - qa-hypothesis-state
            color: cyan
            linger: 0.55
      - say: "DeepMind’s public guide values explaining reasoning and acknowledging uncertainty. That permits a
          concrete answer: I owned the adapter tests; this request waited in the store call; I would inspect
          its query plan and compare another request. Neither inventing store ownership nor refusing to
          discuss the interface answers the evidence question well."
        hold: 0.75
      - say: If a slide contains an error, correct it directly and explain whether the conclusion changes. Replacing
          seven percent with seven percentage points repairs the unit; discovering a required tenant
          regression can change the rollout decision. Distinguish observation, hypothesis and proposed
          experiment throughout the answer, including when a fluent explanation would be easier.
        hold: 0.75
        visual_cues:
          - id: qa-unit
            phrase: seven percentage points
            targets:
              - qa-unit-state
            color: cyan
            linger: 0.55
  - id: role-bridge
    title: Connect the real boundary to the target AI task
    visual: The same tenant-authorization boundary remains outside a newly proposed model-selected tool call.
      Tests produce evidence beside the boundary rather than replacing enforcement.
    beats:
      - say: For an agent-platform role, connect the actual tenant-scoped connector boundary to model-selected tool
          calls. The model may propose a request, but the connector or service must enforce authorization
          before data access. Evaluation of unauthorized requests can expose defects; successful evaluations
          do not become runtime permission checks.
        hold: 0.75
        visual_cues:
          - id: role-proposal
            phrase: model may propose a request
            targets:
              - role-proposal-state
            color: cyan
            linger: 0.55
          - id: role-authorization
            phrase: must enforce authorization before data access
            targets:
              - role-authorization-state
            color: cyan
            linger: 0.55
      - say: For a retrieval role, discuss label quality, query-level regressions and tenant coverage. For a research
          role, identify a hypothesis and the controlled comparison needed to test it. Select the connection
          relevant to the role instead of renaming every infrastructure component an agent. Keep the original
          personal contribution and outcome scope intact.
        hold: 0.75
      - say: Apply the actual tool policy during preparation and delivery. Permission for a different employer or an
          earlier interview format does not transfer. Ask about a silent format before assessment. Sanitizing
          a private artifact addresses disclosure content but does not itself grant permission to upload it or
          use an AI assistant during a restricted task.
        hold: 0.75
  - id: rehearsal-diagnosis
    title: Repair the missing evidence instead of adding slide polish
    visual: "Three interrupted claims reveal distinct missing fields: a package diagram has no request, a
      percentage has no denominator, and a before/after result has no isolated comparison. Each receives its
      corresponding artifact."
    beats:
      - say: Use rehearsal to diagnose the argument. A package diagram without a request needs an input, decision and
          failure path. A precise percentage without exposure needs its sample, unit, window and population.
          Team outcomes stated as individual work need the actual owned decision and artifact. Adding another
          decorative slide does not supply any of those missing facts.
        hold: 0.75
        visual_cues:
          - id: diagnosis-request
            phrase: needs an input, decision and failure path
            targets:
              - diagnosis-request-state
            color: cyan
            linger: 0.55
      - say: A before-and-after chart treated as causal proof needs concurrent changes named and a comparison that
          isolates the proposed cause. A prototype presented as deployed behavior needs its simulation,
          replay, shadow or live scope stated accurately. Answer a question first, then open the one
          supporting appendix item. This is a teaching rubric for the evidence, not a prediction of an
          employer’s private score.
        hold: 0.75
        visual_cues:
          - id: diagnosis-scope
            phrase: simulation, replay, shadow or live scope
            targets:
              - diagnosis-scope-state
            color: cyan
            linger: 0.55
      - say: Ask a listener to summarize the problem, decision and credible alternative without internal acronyms.
          Have them challenge an assumption, identify an unsupported claim and ask what result would reverse
          your choice. Retain one failure or negative result and the boundary you did not own. A checker can
          verify minutes and arithmetic; a listener must judge whether the explanation is understandable.
        hold: 0.75
        visual_cues:
          - id: diagnosis-reversal
            phrase: what result would reverse your choice
            targets:
              - diagnosis-reversal-state
            color: cyan
            linger: 0.55
  - id: next-experiment
    title: Show what evidence would support the next claim
    visual: A proposed one-variable ablation holds queries, corpus, labels, and tenant context fixed. Its result
      is marked pending measurement.
    beats:
      - say: A before-and-after result mixes causes when code, index, or workload also changed. To test whether the
          connector path caused this retrieval shift, keep query IDs, corpus revision, labels, and permission
          context fixed, then vary the connector path alone.
        hold: 0.8
        visual_cues:
          - id: next-experiment-beat-1-focus-1
            phrase: To test whether the connector path caused this retrieval shift, keep query IDs, corpus revision,
              labels, and permission context fixed, then vary the connector path alone
            targets:
              - next-experiment-node-change
            color: cyan
            linger: 0.65
          - id: next-experiment-beat-1-focus-2
            phrase: To test whether the connector path caused this retrieval shift
            targets:
              - next-experiment-node-pairs
            color: yellow
            linger: 0.65
      - say: Recompute the paired table and inspect every regression. The ablation result is pending measurement, so
          it belongs on the slide as a proposed test. In questions, separate what the trace observed, what you
          hypothesize, and which experiment would distinguish the two.
        hold: 0.8
        visual_cues:
          - id: next-experiment-beat-2-focus-1
            phrase: Recompute the paired table and inspect every regression
            targets:
              - next-experiment-node-pairs
            color: cyan
            linger: 0.65
          - id: next-experiment-beat-2-focus-2
            phrase: The ablation result is pending measurement
            targets:
              - next-experiment-s-ablation-result
            color: yellow
            linger: 0.65
  - id: fresh-evidence
    title: Predict the paired repair and release decision
    visual: Forty new query IDs enter a fresh paired table. Two identified baseline-only failures move to shared
      success after one supplied repair, while a separate one-timeout availability check keeps the rollout
      held.
    beats:
      - say: Try a new explicitly synthetic comparison of forty frozen queries. Eighteen succeed in both paths, three
          only in the baseline, six only in the candidate and thirteen in neither. A controlled repair changes
          two of those three candidate regressions into shared successes, leaving every other query and input
          fixed. Separately, successful-request p95 is seven hundred eighty milliseconds, but one of forty
          attempts times out. Predict the candidate’s successes, net percentage-point gain and release
          decision. Pause.
        hold: 1.5
        visual_cues:
          - id: fresh-population
            phrase: forty frozen queries
            targets:
              - fresh-population-state
            color: yellow
            linger: 0.55
      - say: Baseline successes remain twenty-one. Moving those two identities gives twenty shared successes and one
          remaining baseline-only success, so the candidate now succeeds on twenty-six of forty. Its net gain
          is five over forty, or twelve point five percentage points. The one remaining regression still needs
          inspection. This is an executed synthetic arithmetic experiment, not a measured generalization
          result.
        hold: 0.75
        visual_cues:
          - id: fresh-repair
            phrase: Moving those two identities
            targets:
              - fresh-repair-state
            color: yellow
            linger: 0.55
          - id: fresh-candidate
            phrase: twenty-six of forty
            targets:
              - fresh-candidate-state
            color: yellow
            linger: 0.55
          - id: fresh-points
            phrase: twelve point five percentage points
            targets:
              - fresh-points-state
            color: yellow
            linger: 0.55
      - say: The latency passes the eight-hundred-millisecond limit, but thirty-nine successes over forty attempts is
          ninety-seven point five percent, below the ninety-nine-percent success gate. Hold the rollout. A
          stronger retrieval comparison did not remove the independent availability failure. You can now
          defend the changed mechanism, the owned boundary and each result’s limits. Carry that same habit
          into inspecting a serving engine’s scheduling and memory management.
        hold: 0.75
        visual_cues:
          - id: fresh-service
            phrase: ninety-seven point five percent
            targets:
              - fresh-service-state
            color: yellow
            linger: 0.55
          - id: fresh-hold
            phrase: Hold the rollout
            targets:
              - fresh-hold-state
            color: yellow
            linger: 0.55
