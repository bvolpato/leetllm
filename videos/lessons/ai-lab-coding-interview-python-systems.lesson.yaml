            color: yellow
            linger: 0.65
      - say: The winner fetches outside the lock, so unrelated URLs can progress while the network waits.
          The second worker sees the claim and skips. The lock protects duplicate prevention. A
          separate semaphore can bound active fetches, and an event can carry cooperative
          cancellation.
