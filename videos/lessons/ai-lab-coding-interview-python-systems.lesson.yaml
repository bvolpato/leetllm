  - id: frontier
    title: The queue preserves breadth-first order
    visual: A real crawl trace pops /start, queues /guide before /api, skips a fragment duplicate and an
      off-origin link, then adds /faq while preserving the pending order.
    beats:
      - say: "Begin with https://repo.example/start. Its links arrive in this order: /guide, /api with a
          fragment, then a page on another origin. We resolve the relative links and remove
          fragments. After the start page, the FIFO queue reads /guide, /api, while the claimed set
          already contains all three in-scope pages."
        hold: 0.8
        visual_cues:
          - id: frontier-beat-1-focus-1
            phrase: the FIFO queue reads /guide
            targets:
              - frontier-array-from-length-4-i-s-queue-i-new-url-s-queue-i-pathname-empty
            color: cyan
