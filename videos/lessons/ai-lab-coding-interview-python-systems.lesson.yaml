  - id: state-objects
    title: Give each question a matching state owner
    visual: Physically retain URL queue,claimset,deadline record,priorityheap,counter andrecencylist.
      SameURLmoves throughqueuewhileclaimsetmembershipstaysquiet. A second state diagram explicitly
      usesa condition waiter and event stopbit ratherthanoverloading thelock.
    beats:
      - say: A deque owns first-in-first-out work. A heap owns priority, a Counter owns counts and an
          OrderedDict can own recency. An injected monotonic clock owns time decisions. A Lock
          protects a shared transition, a Condition can wake waiting workers when a predicate
          changes, and an Event carries a cooperative stop signal. Choose the object from the
          operation you need.
        hold: 0.6
        visual_cues:
          - id: ci-state-objects-0-build
            phrase: A deque owns first-in-first-out work. A heap owns priority, a Counter owns counts and an
              OrderedDict can own recency. An injected monotonic clock owns time decisions. A Lock
              protects a shared transition, a Condition can wake waiting workers when a predicate
              changes, and an Event carries a cooperative stop signal. Choose the object from the
              operation you need.
            targets:
              - ci-state-objects-trace
            color: cyan
            linger: 0.3
      - say: For a finite crawl graph, expected set and queue work is order V plus E, with order V retained
          state, excluding URL-string processing and callback costs. A priority scheduler also pays
          heap costs. If each of V tasks makes at most A attempts, heap work is order A V log V,
          plus graph work order V plus E. State the scope of each cost instead of treating a network
          call as constant-time local computation.
        hold: 0.6
        visual_cues:
          - id: ci-state-objects-1-build
