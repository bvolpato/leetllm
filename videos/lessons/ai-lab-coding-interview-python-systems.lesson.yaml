  - id: url-policy
    title: Normalize the identity before claiming it
    visual: Separate scheme/host/effectiveport/path/query/fragment fields fromactualURL.
      Lowercasehost/remove443andfragment,retainquery;feed
      resultingidentityintoexistingpersistentqueue.
      Rejectuserinfo/invalidport/backslashandschememismatchbeforeclaim;network/DNS/redirectboxremainsoutsidethislocalvalidator.
    beats:
      - say: This crawler chooses same origin, not merely the same host name. Scheme, lowercase host and
          effective port must agree. Remove fragments and default ports, map an empty path to slash,
          and retain query strings and nonempty paths. Relative links resolve against the current
          page. Two fragments of the same page share one claim; a changed query can name a different
          fetch.
