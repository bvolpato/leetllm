  - id: claim
    title: Claim shared work before the slow fetch
    visual: Two workers reach one URL. A short locked membership-and-insert transition gives one claim
      and one skip; the winner fetches after releasing the lock.
    beats:
      - say: A set works for one worker because membership and insertion happen in sequence. With two
          workers, both can observe a missing URL before either fetch completes. Put the check and
          insertion inside one short lock. That small transition assigns one owner to this URL.
        hold: 0.7
        visual_cues:
          - id: claim-beat-1-focus-1
            phrase: A set works for one worker because membership and insertion happen in sequence
            targets:
