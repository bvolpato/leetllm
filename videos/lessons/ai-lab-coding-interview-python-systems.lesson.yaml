            color: yellow
            linger: 0.65
      - say: Now /guide points to /api again and then /faq. The first candidate is already claimed, so it
          adds no second queue entry. We visit /api next, then /faq. The final fetch order is start,
          guide, api, faq, exactly the order the queue produced.
        hold: 0.8
        visual_cues:
