  - id: contract-loop
    title: Extend the contract while preserving its invariant
    visual: Keep one /ci work item on a clock with queue owner,claim owner,deadline,retryattempt
      andeffectkey. Each follow-up adds only its required field. Trace expected-versus-actual
      duplicate2→1 through the actual claim transition, with no generic checklist replacing the
      execution.
    beats:
      - say: Start by stating inputs, outputs, malformed-input behavior, ordering and failure policy. Build
          the smallest state model that meets that contract. When a follow-up arrives, name its new
          state and the invariant that must survive. An assertion should isolate the transition, not
          merely report a large final result.
        hold: 0.6
        visual_cues:
