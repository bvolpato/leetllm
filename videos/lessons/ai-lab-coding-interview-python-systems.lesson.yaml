      Separateunreadexpiredstoragefromreadablevaluesandprocessrelativeclockfromdurablewalltimestamp.
    beats:
      - say: A TTL entry stores a string value and either an expiration deadline or no deadline. Get, scan
          and an eventual compare-and-set must agree that equality with the deadline is expired.
