scenes:
  - id: opening
    title: One crawler, four new requirements
    visual: A one-worker test retains one fetch. Two workers then both read the same page as unclaimed
      before either writes ownership, producing two fetch receipts. A protected replay admits one
      claim and skips the second worker before the deadline, attempt and request-key state is
      introduced.
    beats:
      - say: A crawler can pass its first test and still fetch the same page twice when a second worker
          arrives. That duplicate can waste a request, break a quota, or produce confusing logs. We
          will follow one documentation crawl from its first queue entry through duplicate claims,
          an expiring cache value, and a retrying task.
        hold: 0.7
        visual_cues:
          - id: opening-first-test
            phrase: A crawler can pass its first test
            targets:
              - opening-first-queue
              - opening-baseline
            color: green
            linger: 0.6
          - id: opening-beat-1-focus-1
            phrase: still fetch the same page twice when a second worker arrives
            targets:
              - opening-worker-race
            color: cyan
            linger: 0.65
          - id: opening-beat-1-focus-2
            phrase: We will follow one documentation crawl from its first queue entry through duplicate claims
            targets:
              - opening-first-queue
            color: yellow
            linger: 0.65
      - say: "The example starts with a small contract: visit same-origin links once and return them in
          breadth-first order. Then each follow-up adds one piece of state. By the end, you can
          point to the queue, deadline, attempt count, and request key that owns each decision."
        hold: 0.7
        visual_cues:
