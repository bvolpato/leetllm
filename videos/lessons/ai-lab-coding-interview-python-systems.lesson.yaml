  - id: scheduler
    title: Dependencies decide when work enters the heap
    visual: A priority heap runs docs, retries test once, and only then releases deploy. A second branch
      exhausts test and leaves deploy blocked.
    beats:
      - say: Put docs and test in the ready heap. Docs has higher priority, so it finishes first. Test fails
          once, keeps its attempt count, and returns to the heap. When its retry succeeds, its
          completion releases deploy. The dependency count reaches zero before deploy becomes
          eligible.
