  - id: accountant-calculation
    title: What do two measurements cost together?
    visual: A four-order RDP worksheet adds a second customer-level Gaussian release. The scores then feed a
      checkpoint choice without opening the private data again.
    beats:
      - say: Let's put numbers on a smaller release plan. Both statistics use the same customers. Each has add or
          remove sensitivity C, uses the whole dataset, and adds Gaussian noise with standard deviation
          four C. Each row tracks how much the releases can distinguish neighboring datasets, at a different
          order called alpha. This is Rényi differential privacy. For this Gaussian mechanism, each charge
          is alpha divided by twice the squared noise multiplier.
          Follow order sixteen. One measurement costs a half at that order.
        hold: 0.8
        visual_cues:
          - id: charge-order
            phrase: Follow order sixteen
            targets:
              - order-table
            linger: 0.25
      - say: Add a second measurement with the same guarantee, valid even given the first. At order sixteen the
          two halves add to one. Now convert each row to an epsilon bound at the same target delta, one in
          a hundred thousand. Add the natural log of one over delta, divided by the order minus one. You
          pay that conversion once for the pair.
        hold: 0.9
        visual_cues:
          - id: second-release
            phrase: Add a second measurement
            targets:
              - order-table
            linger: 0.25
          - id: convert-orders
            phrase: Now convert each row to an epsilon bound
            targets:
              - order-table
            linger: 0.25
      - say: Read the smallest bound in the last column. Among these four orders, sixteen gives about one point
          seven seven. Our cap is two, so the pair fits. This worksheet used unsampled Gaussian releases. A
          sampled training run needs its own matching accountant.
        hold: 1
        visual_cues:
          - id: read-minimum
            phrase: Read the smallest bound in the last column
            targets:
              - order-table
            linger: 0.25
      - say: Suppose we choose a checkpoint using only these two saved noisy scores. Both are already covered
          together. Comparing them is post-processing. Public validation can also guide that choice.
          A fresh lookup of raw private scores needs its own privacy analysis even if we publish only the
          choice. The same post-processing rule applies to checkpoints derived
          entirely from a jointly accounted training transcript. Separate runs on overlapping customers
          generally compose. For fixed disjoint customer groups, with no customer in both, parallel
          composition can take the largest group bound.
        hold: 1
        visual_cues:
          - id: reuse-scores
            phrase: these two saved noisy scores
            targets:
              - transcript
            linger: 0.25
  - id: earned-transfer
    title: Which private score can we afford?
    visual: The two saved releases start both candidate bars at the same position. The proposed third
      measurement uses either four or eight C. Its order-specific charge moves each endpoint against the
      same epsilon cap.
    beats:
      - say: Now the checkpoint decision needs one fresh score from the same customers. Keep the two saved
          measurements. Keep Alice’s whole history clipped as a unit, the add or remove rule, and the same
          target delta. Both proposals measure the same statistic of sensitivity C on the full dataset,
          with fresh, independent Gaussian noise. Only its scale changes.
        hold: 0.8
        visual_cues:
          - id: new-score
            phrase: one fresh score from the same customers
            targets:
              - selection-budget
            linger: 0.25
      - say: The top plan gives the new score a standard deviation of four C. The lower plan uses eight C. The
          two saved measurements already put us at about one point seven seven. Use the charge at order
          sixteen. Which new score can we approve under the cap of two?
        hold: 3.3
        visual_cues:
          - id: choose-scale
            phrase: The lower plan uses eight C
            targets:
              - selection-budget
            linger: 0.25
      - say: Charge the four C score first. Another half takes the bound past two, even at the best of our four
          orders. Charge the eight C score instead. Doubling the standard deviation quarters this new
          charge, to one eighth. The bound now comes in just under one point nine. We can approve the eight
          C plan on this accounting and measure whether its noisier score still makes a useful choice.
        hold: 1.2
        caption_starts: [Charge the eight C score instead, The bound now comes in]
        visual_cues:
          - id: charge-four
            phrase: Charge the four C score first
            targets:
              - selection-budget
            linger: 0.25
          - id: charge-eight
            phrase: Charge the eight C score instead
            targets:
              - selection-budget
            linger: 0.25
          - id: choose-plan
            phrase: We can approve the eight C plan
            targets:
              - selection-budget
            linger: 0.25
      - say: Choose the checkpoint using the three protected scores. Their privacy cost stays the same.
          Once training and selection are both accounted for, answering a public prompt with that model
          alone is post-processing. Now the copilot
          requests Alice’s original ticket. Before it can read that ticket, check its permission. Protect
          new prompts and logs separately. When you collect labels from those tickets, the reviewers need
          permission to read them too.
        hold: 1.4
        caption_starts: [Once training and selection, Now the copilot requests, When you collect labels]
        visual_cues:
          - id: open-retrieval
            phrase: Now the copilot requests Alice’s original ticket
            targets:
              - serving-path
            linger: 0.25
          - id: reviewer-read
            phrase: When you collect labels from those tickets
            targets:
              - serving-path
            linger: 0.25
