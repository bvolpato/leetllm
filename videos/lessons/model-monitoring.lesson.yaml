    beats:
      - say: Here are all six requests. First check the queue count and heartbeat age. Both must be
          finite, nonnegative numbers. A queue count must also be a whole number. A value of true
          in that field would stop the request. Next, read the timestamp with its time zone.
          Accept snapshots from the last sixty minutes, including the boundary. A timestamp in
          the future also stops the request.
        hold: 0.55
        visual_cues:
