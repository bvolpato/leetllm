  - id: psi-derive
    title: Accumulate the mismatch, bucket by bucket
    visual: Persistent job identities, clocks, source measurements and computed evidence visibly
      construct this chapter.
    beats:
      - say: Open the four fixed heartbeat-age bins. Let e be a reference share and a the current share. For
          each bin, multiply the quantity a minus e by the natural logarithm of a divided by e, then
          sum. In the youngest bin, point three minus point five is minus point two; log of point
          six is about minus point five one one. Their product is positive point one zero two.
          Decreasing mass can contribute positively, just like increasing mass.
        hold: 0.65
        visual_cues:
          - id: psi-derive-beat-0
            phrase: Open the four fixed heartbeat-age bins
            targets:
              - psi-derive-mechanism
            color: cyan
            linger: 0.6
          - id: m-psi-derive-subtract
            phrase: point three minus point five is minus point two
            targets:
              - psi-derive-mechanism
            color: cyan
            linger: 0.35
          - id: m-psi-derive-log
            phrase: log of point six is about minus point five one one
            targets:
              - psi-derive-mechanism
            color: cyan
            linger: 0.35
          - id: m-psi-derive-product
            phrase: Their product is positive point one zero two
            targets:
              - psi-derive-mechanism
            color: cyan
            linger: 0.35
      - say: "The next terms are about point zero zero nine, point zero five one and point two zero eight.
          Stack those same four contributions: their total is about point three seven zero. The
          twenty-four-hour-plus bin grows from point zero five to point two, four times its
          reference share. Its point two zero eight contribution supplies over fifty-six percent of
          the total. For positive shares each term is nonnegative; equal shares contribute zero."
        hold: 0.65
        visual_cues:
          - id: psi-derive-beat-1
            phrase: The next terms are about point zero zero nine, point zero five one and point two zero eight
            targets:
              - psi-derive-mechanism
            color: cyan
            linger: 0.6
          - id: m-psi-derive-terms
            phrase: The next terms are about point zero zero nine, point zero five one and point two zero eight
            targets:
              - psi-derive-mechanism
            color: cyan
            linger: 0.35
          - id: m-psi-derive-total
            phrase: their total is about point three seven zero
            targets:
              - psi-derive-mechanism
            color: cyan
            linger: 0.35
          - id: m-psi-derive-share
            phrase: Its point two zero eight contribution supplies over fifty-six percent of the total
            targets:
              - psi-derive-mechanism
            color: cyan
            linger: 0.35
      - say: Add the Kullback-Leibler divergences in both directions and you get Jeffreys
          divergence. Swapping the windows gives the same answer. Straight from A to C, PSI is
          point two seven. Through B, the two legs add to just point one three five. The larger
          direct value violates the triangle inequality for a distance metric. Historical cutoffs
          of point one and point two five are rules of thumb. We investigate at point two.
        hold: 0.65
        visual_cues:
          - id: psi-derive-beat-2
            phrase: Add the Kullback-Leibler divergences in both directions
            targets:
              - psi-derive-mechanism
            color: cyan
            linger: 0.6
          - id: m-psi-derive-triangle
            phrase: violates the triangle inequality
            targets:
              - psi-derive-mechanism
            color: cyan
            linger: 0.35
      - say: A bucket empty in both windows contributes zero under our contract. Positive mass opposite zero
          gives infinite divergence. An optional equal pseudocount is added to every bucket before
          renormalizing; this changes the diagnostic. A window with no observed rows is invalid even
          with smoothing. Fixed bins miss within-bin changes and cross-feature relationships.
          Repeated checks across features and windows also need an alert-volume and false-alarm
          policy.
        hold: 0.8
        visual_cues:
          - id: psi-derive-beat-3
            phrase: A bucket empty in both windows contributes zero under our contract
            targets:
              - psi-derive-mechanism
            color: cyan
            linger: 0.6
          - id: m-psi-derive-empty
            phrase: A bucket empty in both windows contributes zero under our contract
            targets:
              - psi-derive-mechanism
            color: cyan
            linger: 0.35
          - id: m-psi-derive-infinity
            phrase: Positive mass opposite zero gives infinite divergence
            targets:
              - psi-derive-mechanism
            color: cyan
            linger: 0.35
          - id: m-psi-derive-smooth
            phrase: An optional equal pseudocount is added to every bucket before renormalizing
            targets:
              - psi-derive-mechanism
            color: cyan
            linger: 0.35
  - id: drift-continuous
    title: Keep shape and distance separate
    visual: Two samples have the same mean heartbeat age. A vertical segment measures the maximum gap
      between their cumulative curves, and the two source masses travel to the common destination at
      two hours.
    beats:
      - say: One sample has heartbeat ages of zero and four hours. The other has two jobs at two hours.
          For each curve, count the fraction of jobs at or below each age. Look at one hour. Half
          the first sample is already included. None of the second is. The largest vertical gap is
          one half. This is the two-sample Kolmogorov-Smirnov statistic. It ranges from zero to one
          and needs no bins. A standard test p-value assumes independent draws from continuous
          distributions. Ties, repeated jobs and dependence over time can change that p-value.
        hold: 0.65
        visual_cues:
          - id: drift-continuous-beat-0
            phrase: One sample has heartbeat ages of zero and four hours
            targets:
              - drift-continuous-mechanism
            color: cyan
            linger: 0.6
          - id: m-drift-continuous-cdf
            phrase: count the fraction of jobs at or below each age
            targets:
              - drift-continuous-mechanism
            color: cyan
            linger: 0.35
          - id: m-drift-continuous-at-one
            phrase: Look at one hour
            targets: [drift-continuous-mechanism]
            color: yellow
          - id: m-drift-continuous-gap
            phrase: The largest vertical gap is one half
            targets:
              - drift-continuous-mechanism
            color: cyan
            linger: 0.35
      - say: How far apart are the samples in hours? Send the observation at zero to two, and the one at
          four back to two. Each carries half the mass. Moving each half-mass two hours costs two
          hours in total. Both samples have a mean of two hours, but it still takes work to match
          their distributions. That minimum average distance is Wasserstein-one. In one dimension it
          equals the area between the cumulative curves. For distributions with finite first moments
          it keeps the feature units. We paired observations across samples to measure distance.
        caption_starts:
          - Send the observation at zero to two
          - costs two hours in total
        hold: 0.65
        visual_cues:
          - id: drift-continuous-beat-1
            phrase: How far apart are the samples in hours
            targets:
              - drift-continuous-mechanism
            color: cyan
            linger: 0.6
          - id: m-drift-continuous-from-zero
            phrase: Send the observation at zero to two
            targets: [drift-continuous-mechanism]
          - id: m-drift-continuous-from-four
            phrase: and the one at four back to two
            targets: [drift-continuous-mechanism]
          - id: m-drift-continuous-move
            phrase: moving each half-mass two hours costs two hours in total
            targets:
              - drift-continuous-mechanism
            color: cyan
            linger: 0.35
      - say: A large sample can give a small p-value even for a shift that barely affects the queue.
          Check the sampling assumptions and the size of the change. PSI compares bucket shares.
          KS measures the largest vertical gap. Wasserstein measures how far the observations
          have to move. To find out whether the shift cost us more missed deadlines, join the outcomes.
        hold: 0.8
        visual_cues:
          - id: drift-continuous-beat-2
            phrase: A large sample can give a small p-value
            targets:
              - drift-continuous-mechanism
            color: cyan
            linger: 0.6
          - id: m-drift-continuous-limits
            phrase: join the outcomes
            targets:
              - drift-continuous-mechanism
            color: cyan
            linger: 0.35
  - id: drift-taxonomy
    title: Locate the term that changed
    visual: Read the joint distribution by input and then by outcome. Two runner pools keep
      fixed miss rates while the mix of arriving jobs shifts toward the lower-risk pool.
    beats:
      - say: Start with the inputs. How often do we see a long queue? Then look at outcomes for
          jobs with the same inputs. How often do those jobs miss? If long queues become more
          common while the miss rate for each input stays the same, that’s covariate shift.
          If the miss rate changes for jobs with the same inputs, that’s concept drift.
        hold: 0.65
        visual_cues:
          - id: drift-taxonomy-beat-0
            phrase: Start with the inputs
            targets:
              - drift-taxonomy-mechanism
            color: cyan
            linger: 0.6
          - id: m-drift-taxonomy-conditional
            phrase: the miss rate changes for jobs with the same inputs
            targets:
              - drift-taxonomy-mechanism
            color: cyan
            linger: 0.35
      - say: Now start with the outcome. Make one group for jobs that missed and another for jobs
          that finished on time. In pure label shift, the relative sizes of those groups change.
          Within each group, the input distribution stays the same. In practice, the mix and the
          relationships can change together. A broken queue counter could
          also change the readings. Check the source before attributing the shift to the jobs.
        hold: 0.65
        visual_cues:
          - id: drift-taxonomy-beat-1
            phrase: Now start with the outcome
            targets:
              - drift-taxonomy-mechanism
            color: cyan
            linger: 0.6
          - id: m-drift-taxonomy-label
            phrase: In pure label shift
            targets:
              - drift-taxonomy-mechanism
            color: cyan
            linger: 0.35
      - say: "Keep two runner pools with miss rates point one and point four. Their equal traffic mix
          produces point two five overall. Shift only the mix to eighty percent and twenty percent:
          point eight times point one plus point two times point four equals point one six. The
          aggregate rate fell while both within-pool rates stayed unchanged. Compare matched
          populations before blaming weights."
        hold: 0.65
        visual_cues:
          - id: drift-taxonomy-beat-2
            phrase: Keep two runner pools with miss rates point one and point four
            targets:
              - drift-taxonomy-mechanism
            color: cyan
            linger: 0.6
          - id: m-drift-taxonomy-mix
            phrase: Shift only the mix to eighty percent and twenty percent
            targets:
              - drift-taxonomy-mechanism
            color: cyan
            linger: 0.35
          - id: m-drift-taxonomy-result
            phrase: equals point one six
            targets:
              - drift-taxonomy-mechanism
            color: cyan
            linger: 0.35
      - say: If raw scores move while monitored feature marginals stay quiet, inspect the deployed model,
          transforms, serving configuration and unmonitored joint relationships. Changing the
          decision threshold changes who enters review, while holding raw model scores fixed.
          Distribution, score, decision and outcome changes need separate records.
        hold: 0.8
        visual_cues:
          - id: drift-taxonomy-beat-3
            phrase: If raw scores move while monitored feature marginals stay quiet, inspect the deployed model,
              transforms, serving configuration and unmonitored joint relationships
            targets:
              - drift-taxonomy-mechanism
            color: cyan
            linger: 0.6
          - id: m-drift-taxonomy-threshold
            phrase: Changing the decision threshold changes who enters review, while holding raw model scores
              fixed
            targets:
              - drift-taxonomy-mechanism
            color: cyan
            linger: 0.35
  - id: parity-probe
    title: One queue, two feature values
    visual: Two transforms read the same queue. The served ratio stays pinned at 0.20 as capacities of
      50, 100 and 200 change the training ratio. The repaired serving path reads the staffed
      capacity from the row.
    beats:
      - say: Try a more direct check on the input. Take one runner pool with twenty jobs in its queue and
          fifty staffed slots. Send that same row through both transforms. Training divides backlog
          by staffed capacity. Serving divides backlog by a fixed hundred.
        hold: 0.6
        visual_cues:
          - id: m-parity-probe-paths
            phrase: Send that same row through both transforms
            targets:
              - parity-probe-mechanism
            color: cyan
            linger: 0.25
      - say: The training feature is point four. Online it’s point two. The weights never entered this
          calculation. This difference on the same input is training-serving skew.
        hold: 0.65
        visual_cues:
          - id: m-parity-probe-rates
            phrase: The training feature is point four. Online it’s point two
            targets:
              - parity-probe-mechanism
            color: cyan
            linger: 0.25
      - say: Try a pool with a hundred staffed slots and the same queue. Both give point two. A test using
          only this pool would pass. Now try two hundred staffed slots. Training gives point one.
          Serving stays at point two. Which divisor must serving read from the source row?
        hold: 2.4
        motion_check:
          region:
            - 90
            - 320
            - 1740
            - 500
          minimumChangedFraction: 0.002
        visual_cues:
          - id: m-parity-probe-match
            phrase: a hundred staffed slots
            targets:
              - parity-probe-mechanism
            color: cyan
            linger: 0.25
          - id: m-parity-probe-larger
            phrase: two hundred staffed slots
            targets:
              - parity-probe-mechanism
            color: cyan
            linger: 0.25
          - id: m-parity-probe-ask
            phrase: Which divisor must serving read from the source row
            targets:
              - parity-probe-mechanism
            color: cyan
            linger: 0.25
      - say: Use the actual staffed capacity in both paths. On this row, both features are now point one.
          Check that capacity is positive, then rerun all three rows. Compare unrounded values and
          save the input revision and transform versions. One matching row at a hundred had hidden
          the bug.
        hold: 0.75
        visual_cues:
          - id: m-parity-probe-repair
            phrase: Use the actual staffed capacity in both paths
            targets:
              - parity-probe-mechanism
            color: cyan
            linger: 0.25
  - id: delayed-labels
    title: Six deadlines at the noon cutoff
    visual: Six archived prediction IDs sit on separate lanes against the same noon line. Rings locate
      closing times. Label marks join by ID and expose outcomes in the five closed windows.
