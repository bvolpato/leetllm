              - evidence-triage-mechanism
            color: cyan
            linger: 0.35
  - id: rollback-conditions
    title: Read the release decision in order
    visual: A failed fast gate, a missing label, a missing cost and the exact limit give different
      simulator receipts. A later complete cohort fills two equally wide error-cost strips, then
      places its normalized cost against the 50-unit limit.
    beats:
      - say: First try stopping the release before promotion. The canary has six hundred requests, few
          errors and a fast response. Its review queue is at eighty-five percent of capacity. The
          budget is eighty. One failed gate leaves version three active. An offline failure would
          stop promotion here too.
        hold: 0.65
        visual_cues:
          - id: m-rollback-conditions-failed
            phrase: One failed gate leaves version three active
            targets:
              - rollback-conditions-mechanism
            color: cyan
            linger: 0.25
      - say: Now suppose both promotion checks passed. Five hundred jobs are mature. Only four hundred
          ninety-nine labels have joined. Check the counts first. They must be nonnegative integers,
          with at most one joined label per mature prediction. Our rule needs at least five hundred
          mature predictions and all their labels. It returns insufficient evidence. Version four
          stays active under this rule. Set a timeout for missing labels and a separate response for
          operational emergencies.
        hold: 0.75
        visual_cues:
          - id: m-rollback-conditions-late
            phrase: Now suppose both promotion checks passed
            targets:
              - rollback-conditions-mechanism
            color: cyan
            linger: 0.25
          - id: m-rollback-conditions-hold
            phrase: It returns insufficient evidence
            targets:
              - rollback-conditions-mechanism
            color: cyan
            linger: 0.25
      - say: Let the last label arrive. If the cost measurement is missing, negative or nonfinite, the
          simulator returns an invalid metric. Give it a valid cost of exactly fifty per thousand
          instead. The rule acts only above fifty, so it keeps the candidate.
        hold: 0.7
        visual_cues:
          - id: m-rollback-conditions-empty
            phrase: Let the last label arrive
            targets:
              - rollback-conditions-mechanism
            color: cyan
            linger: 0.25
          - id: m-rollback-conditions-invalid
            phrase: returns an invalid metric
            targets:
              - rollback-conditions-mechanism
            color: cyan
            linger: 0.25
          - id: m-rollback-conditions-boundary
            phrase: exactly fifty per thousand
            targets:
              - rollback-conditions-mechanism
            color: cyan
            linger: 0.25
          - id: m-rollback-conditions-strict
            phrase: so it keeps the candidate
            targets:
              - rollback-conditions-mechanism
            color: cyan
            linger: 0.25
      - say: Take the five hundred fully labeled jobs from our release example. Ten false alerts at two
          units each make twenty. Two unflagged misses at ten each add another twenty. The two
          strips have the same width. Forty units across five hundred jobs is eighty per thousand.
          That crosses the local limit. The simulator proposes rollback to version three.
        hold: 0.8
        visual_cues:
          - id: m-rollback-conditions-window
            phrase: the five hundred fully labeled jobs
            targets:
              - rollback-conditions-mechanism
            color: cyan
            linger: 0.25
          - id: m-rollback-conditions-alerts
            phrase: Ten false alerts at two units each make twenty
            targets: [rollback-conditions-mechanism]
            color: pink
          - id: m-rollback-conditions-weights
            phrase: Two unflagged misses at ten each add another twenty
            targets:
              - rollback-conditions-mechanism
            color: cyan
            linger: 0.25
          - id: m-rollback-conditions-eighty
            phrase: Forty units across five hundred jobs is eighty per thousand
            targets:
              - rollback-conditions-mechanism
            color: cyan
            linger: 0.25
          - id: m-rollback-conditions-return-result
            phrase: The simulator proposes rollback to version three
            targets:
              - rollback-conditions-mechanism
            color: cyan
            linger: 0.25
      - say: That return value sends no traffic. A controller has to resolve the saved artifact, check
          compatibility, and switch only if the expected candidate is still active. Verify which
          version actually serves new requests. Version three cost sixty per thousand on the earlier
          offline data. Its cost on this later population is still unknown. Measure the restored
          version on current outcomes. If both versions exceed the budget, the review workflow
          itself may need to stop or change.
        hold: 0.85
        visual_cues:
          - id: m-rollback-conditions-verify
            phrase: A controller has to resolve the saved artifact
            targets:
              - rollback-conditions-mechanism
            color: cyan
            linger: 0.25
          - id: m-rollback-conditions-old
            phrase: Version three cost sixty per thousand
            targets:
              - rollback-conditions-mechanism
            color: cyan
            linger: 0.25
  - id: wrap
    title: Two jobs got the same score
    visual: The live s-105 receipt and the archived p-005 receipt both show 0.91. Only the archived ID
      owns the late miss label.
    beats:
      - say: Remember the live job with the thirty-hour heartbeat? Its five-minute-old snapshot passed, it
          scored point nine one, and the policy sent it to review. The archive also has a job at
          point nine one. Can its label tell us whether the live job missed?
        hold: 2.5
        visual_cues:
          - id: m-wrap-archive
