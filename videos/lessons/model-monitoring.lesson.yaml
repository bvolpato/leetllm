            phrase: Can its label tell us whether the live job missed
            targets:
              - wrap-mechanism
            color: cyan
            linger: 0.25
      - say: Check the identities. The live request still needs its own outcome. In the late archive, the
          fifth job’s window closed at eleven, but its label arrived at one. Only the archived
          prediction owns that miss. Carry the prediction ID, model, source trace, policy and cutoff
          into the release report.
        hold: 0.8
        visual_cues:
          - id: m-wrap-identity
            phrase: Check the identities
            targets:
              - wrap-mechanism
            color: cyan
            linger: 0.25
          - id: m-wrap-late
