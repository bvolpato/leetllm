scenes:
  - id: intro
    title: When the queues were measured
    visual: Two clock faces keep their snapshot times as blue arcs sweep from each reading to noon.
      The 09:00 count is three hours old. The 11:55 count is five minutes old and records thirty
      hours since the last heartbeat.
    beats:
      - say: It’s noon. The left snapshot counted twenty-two jobs at nine. The right counted forty
          at eleven fifty-five. Follow the blue arcs from each reading to noon.
        hold: 0.45
        visual_cues:
          - id: m-intro-left
            phrase: The left snapshot
            targets:
              - intro-mechanism
            color: cyan
            linger: 0.25
          - id: m-intro-right
            phrase: The right counted forty
            targets:
              - intro-mechanism
            color: cyan
            linger: 0.25
      - say: Our model flags jobs at risk of missing a deadline. It accepts a queue snapshot up to
          an hour old. Which count can it use at noon?
        hold: 2.8
        visual_cues:
          - id: m-intro-rule
            phrase: It accepts a queue snapshot up to an hour old
            targets:
              - intro-mechanism
            color: cyan
            linger: 0.25
      - say: Block the nine o’clock snapshot. The service answered in forty milliseconds with a queue
          count from three hours ago. Score the eleven fifty-five snapshot. It’s five minutes old.
          At the moment it was taken, the scheduler had been silent for thirty hours.
        caption_starts:
          - Score the eleven fifty-five snapshot
          - At the moment it was taken
        hold: 0.65
        visual_cues:
