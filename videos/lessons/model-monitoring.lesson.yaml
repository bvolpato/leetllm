            color: cyan
            linger: 0.25
  - id: fresh-monitoring
    title: Should this release stay on v4?
    visual: First, twenty missing labels and a cohort below 500 prevent a cost ruling. Two fully
      labeled windows then share the same weighted errors and the same 50-unit ruler. The
      denominator puts their marks on opposite sides of the limit.
    beats:
      - say: You’re on call for version four. Its offline and fast canary checks passed. The feature mix
          is quiet and the parity probe passes. Four hundred prediction windows have closed. Each
          square holds twenty jobs. Only three hundred eighty labels have joined. The policy
          requires at least five hundred mature predictions and complete labels. Can you use this
          window for a release decision?
        hold: 2.8
        visual_cues:
          - id: m-fresh-monitoring-arrived
            phrase: Only three hundred eighty labels have joined
            targets:
              - fresh-monitoring-mechanism
            color: cyan
            linger: 0.25
          - id: m-fresh-monitoring-ask
            phrase: Can you use this window for a release decision
            targets:
              - fresh-monitoring-mechanism
            color: cyan
            linger: 0.25
      - say: Coverage is three hundred eighty out of four hundred, or ninety-five percent. Twenty mature
          outcomes are missing. Even if they all arrived now, we would still be a hundred jobs
          short. The simulator returns insufficient evidence. Check the ingestion delay and follow
          the timeout policy if the labels never arrive.
        caption_starts:
          - or ninety-five percent
          - Twenty mature outcomes are missing
          - The simulator returns insufficient evidence
        hold: 0.6
        visual_cues:
          - id: m-fresh-monitoring-coverage
            phrase: ninety-five percent
            targets:
              - fresh-monitoring-mechanism
            color: cyan
            linger: 0.25
          - id: m-fresh-monitoring-missing-result
            phrase: Twenty mature outcomes are missing
            targets:
              - fresh-monitoring-mechanism
            color: cyan
            linger: 0.25
          - id: m-fresh-monitoring-hold
            phrase: The simulator returns insufficient evidence
            targets:
              - fresh-monitoring-mechanism
            color: cyan
            linger: 0.25
      - say: Take a separate window with eight hundred mature predictions and all eight hundred labels.
          Eight false alerts cost two units each. Two unflagged misses cost ten each. Our rollback
          limit is fifty units per thousand predictions. What is the cost per thousand predictions?
        hold: 2.8
        visual_cues:
          - id: m-fresh-monitoring-window
            phrase: a separate window with eight hundred mature predictions
            targets:
              - fresh-monitoring-mechanism
            color: cyan
            linger: 0.25
          - id: m-fresh-monitoring-alerts
            phrase: Eight false alerts cost two units each
            targets: [fresh-monitoring-mechanism]
            color: pink
          - id: m-fresh-monitoring-errors
            phrase: Two unflagged misses cost ten each
            targets:
              - fresh-monitoring-mechanism
            color: cyan
            linger: 0.25
          - id: m-fresh-monitoring-place
            phrase: What is the cost per thousand predictions
            targets:
              - fresh-monitoring-mechanism
            color: cyan
            linger: 0.25
      - say: Sixteen units from false alerts plus twenty from misses gives thirty-six. Scale that to a
          thousand predictions. Thirty-six times a thousand divided by eight hundred is forty-five.
          That’s below fifty. The simulator keeps version four.
        caption_starts:
          - Scale that to a thousand predictions
          - is forty-five
          - The simulator keeps version four
        hold: 0.85
        visual_cues:
          - id: m-fresh-monitoring-cost
            phrase: gives thirty-six
            targets:
              - fresh-monitoring-mechanism
            color: cyan
            linger: 0.25
          - id: m-fresh-monitoring-normalized
            phrase: Thirty-six times a thousand divided by eight hundred is forty-five
            targets:
              - fresh-monitoring-mechanism
            color: cyan
            linger: 0.25
          - id: m-fresh-monitoring-keep
            phrase: The simulator keeps version four
            targets:
              - fresh-monitoring-mechanism
            color: cyan
            linger: 0.25
      - say: One more window. This one has six hundred mature predictions and all six hundred labels. It
          has exactly the same eight false alerts and two unflagged misses. Both promotion gates
          passed again. Keep version four, or propose a return to version three?
        hold: 3.4
        visual_cues:
          - id: m-fresh-monitoring-smaller
            phrase: This one has six hundred mature predictions
            targets:
              - fresh-monitoring-mechanism
            color: cyan
            linger: 0.25
          - id: m-fresh-monitoring-predict
            phrase: Keep version four, or propose a return to version three
            targets:
              - fresh-monitoring-mechanism
            color: cyan
            linger: 0.25
      - say: The same thirty-six units now fall on six hundred jobs. That’s sixty per thousand. The mark
          crosses fifty. Propose a return to version three. Before switching, check that the saved
          version is compatible and that version four is still active.
        caption_starts:
          - That’s sixty per thousand
          - Propose a return to version three
        hold: 0.65
        visual_cues:
          - id: m-fresh-monitoring-sixty
            phrase: That’s sixty per thousand
            targets:
              - fresh-monitoring-mechanism
            color: cyan
            linger: 0.25
          - id: m-fresh-monitoring-return
            phrase: Propose a return to version three
            targets:
              - fresh-monitoring-mechanism
            color: cyan
            linger: 0.25
      - say: Check which version serves the next requests. Then join their outcomes once their deadlines
          have passed and measure cost again. That next cohort can tell you whether the rollback
          helped.
        hold: 1
        visual_cues:
