            color: cyan
            linger: 0.25
          - id: m-intro-latency
            phrase: in forty milliseconds
            targets: [intro-mechanism]
            color: cyan
            linger: 0.25
          - id: m-intro-score
            phrase: Score the eleven fifty-five snapshot
            targets:
              - intro-mechanism
            color: cyan
            linger: 0.25
          - id: m-intro-heartbeat
            phrase: the scheduler had been silent for thirty hours
            targets:
              - intro-mechanism
            color: cyan
            linger: 0.25
      - say: That job scores point nine one and goes to review. Did it actually miss its deadline?
          We checked its inputs when the request arrived. To find out which misses we caught,
