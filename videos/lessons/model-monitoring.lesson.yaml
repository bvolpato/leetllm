  - id: drift-diagnostic
    title: Read distribution shift as a clue
    visual: The same heartbeat-age buckets compare two independent samples of 100 accepted requests.
      The oldest bucket grows from five requests to twenty. Its contribution is compared with the
      full PSI.
    beats:
      - say: Set the six live requests aside. These are two separate windows of a hundred accepted
          requests each. Keep the same four heartbeat-age buckets in both. In the reference window,
          fifty of the hundred had a heartbeat age under four hours. The current window has thirty
          percent in that range.
        hold: 0.55
        visual_cues:
          - id: drift-diagnostic-beat-1-focus-1
            phrase: two separate windows of a hundred accepted requests each
            targets:
              - drift-diagnostic-mechanism
            color: blue
            linger: 0.6
          - id: m-drift-diagnostic-current
            phrase: The current window has thirty percent in that range
            targets:
              - drift-diagnostic-mechanism
            color: cyan
            linger: 0.35
      - say: Compare the shares using fixed bucket boundaries. The four contributions sum to a population
          stability index of zero point three seven. Its largest term comes from the
          twenty-four-hour-and-older bucket.
        hold: 0.65
        visual_cues:
          - id: drift-diagnostic-beat-2-focus-1
            phrase: Compare the shares using fixed bucket boundaries
            targets:
              - drift-diagnostic-mechanism
            color: blue
            linger: 0.6
