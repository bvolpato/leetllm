  - id: two-clocks
    title: Which clock measured those two hours?
    visual: On s-100’s clock, the long interval ends at snapshot creation. The short interval begins
      there and ends at scoring. Its score and still-pending outcome join the versioned trace.
    beats:
      - say: Follow one more job. The scheduler sent a heartbeat at nine fifty. The feature
          service took a snapshot at eleven fifty. It recorded eighteen jobs in the queue and two
          hours since the last heartbeat. Those two hours are an input to the model.
        hold: 0.6
        visual_cues:
          - id: m-two-clocks-event
            phrase: two hours since the last heartbeat
            targets:
              - two-clocks-mechanism
            color: cyan
            linger: 0.25
      - say: The request arrived at noon. From the snapshot to the request is just ten minutes. That is
          the age we check before scoring. A fresh snapshot can tell us a worker has been silent for
          a long time.
        hold: 0.65
        visual_cues:
          - id: m-two-clocks-snapshot
            phrase: From the snapshot to the request is just ten minutes
            targets:
              - two-clocks-mechanism
            color: cyan
            linger: 0.25
      - say: Keep that trace with the prediction. Version three scored the job at point one eight, below
          its review threshold of point five. Save the input revisions, model and transform
          versions, prediction time and deadline. When the verified label arrives, record its
          arrival time too. Someone replaying the decision can then recover what was known at noon.
        hold: 0.7
        visual_cues:
          - id: m-two-clocks-receipt
            phrase: Version three scored the job at point one eight
            targets:
              - two-clocks-mechanism
            color: cyan
            linger: 0.25
