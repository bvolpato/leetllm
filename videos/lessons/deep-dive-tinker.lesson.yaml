  - id: group-credit
    title: How much credit did each clamp answer earn?
    visual: Four known clamp bodies face the same five local fixtures. The above-range case accepts the reversed
      nesting. A below-range case exposes it. Each completion earns one reward only if all five results match.
      The existing shared-parameter plot shows how one centered group can move four probabilities.
    beats:
      - say: Use the same five fixtures for each of four known clamp functions. A completion earns one only if it
          passes all five. Try three again. Even the reversed nesting returns two on that input. Now try minus
          one with the same bounds. The reversed nesting still returns two. The expected answer is zero. Finish
          the five checks. Two completions pass them all. Returning x gets the inside case right and still earns
          zero for the completion.
        hold: 0.9
        motion_check:
          region:
            - 160
            - 365
            - 1550
            - 485
          minimumChangedFraction: 0.002
        visual_cues:
          - id: tk-group-credit-0-0
            phrase: Use the same five fixtures for each of four known clamp functions. A completion earns one only if it
              passes all five.
            targets:
              - group-checks
            color: cyan
            linger: 0.2
          - id: tk-group-credit-0-1
            phrase: Try three again. Even the reversed nesting returns two on that input.
            targets:
              - group-above
            color: cyan
            linger: 0.2
          - id: tk-group-credit-0-2
            phrase: Now try minus one with the same bounds. The reversed nesting still returns two. The expected answer is
              zero.
            targets:
              - group-below
            color: cyan
            linger: 0.2
            caption_boundary: true
          - id: tk-group-credit-0-3
            phrase: Finish the five checks. Two completions pass them all. Returning x gets the inside case right and
              still earns zero for the completion.
            targets:
              - group-checks
            color: cyan
            linger: 0.2
            caption_boundary: true
      - say: Keep the four rewards for this prompt together. Two ones and two zeros make the group mean one half.
          Subtract half from each reward. Each passing completion gets plus a half. Each failing one gets minus
          a half. That's its advantage within this group.
        hold: 0.9
        visual_cues:
          - id: tk-group-credit-1-0
            phrase: Keep the four rewards for this prompt together.
            targets:
              - group-rewards
            color: cyan
