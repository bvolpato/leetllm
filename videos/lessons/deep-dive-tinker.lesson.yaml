    title: Would you train on this sample?
    visual: Sample A retains its captured policy step six while the trainer is at nine. A shift pairs the last
      prompt token with the first action. A step ruler checks the inclusive lag budget. Selecting path nine
      creates a new sample B with a separate receipt while A stays withheld.
    beats:
      - say: One more clamp run. Here is A's full sequence. Its three prompt tokens are blue, and its three sampled
          answer tokens are gold. The trainer is at step nine. Sample A came from step six. This run accepts a
          gap of at most one step. If you used A for supervised training, which target would get the first
          nonzero weight? For reinforcement learning, would you admit A under this lag rule?
        hold: 2.5
        visual_cues:
          - id: tk-fresh-run-0-0
