scenes:
  - id: opening
    title: Which version wrote this clamp function?
    visual: Two sliders follow the same input. The expected output stops at two while the sampled function
      carries on to three. The optimizer and sampler records name the two adapter versions.
    beats:
      - say: Slide the input to three. Clamp stops at its upper limit of two. The sampled code just returns x,
          so it slides right past the stop.
        hold: 0.8
        caption_starts:
          - Clamp stops at its upper limit of two.
          - The sampled code just returns x
        visual_cues:
          - id: tk-opening-0-0
            phrase: Slide the input to three. Clamp stops at its upper limit of two.
            targets:
              - opening-ruler
            color: cyan
            linger: 0.2
          - id: tk-opening-0-1
            phrase: The sampled code just returns x, so it slides right past the stop.
            targets:
              - opening-output
            color: cyan
            linger: 0.2
      - say: Training loss fell. Tinker's optimizer just finished version two of the adapter, the weights
          we're training. Did we just test version two? Which record would tell us?
        hold: 2.2
        caption_starts:
          - Did we just test version two?
        visual_cues:
          - id: tk-opening-1-0
            phrase: Training loss fell. Tinker's optimizer just finished version two of the adapter, the
              weights we're training.
            targets:
              - opening-trainer
            color: cyan
            linger: 0.2
          - id: tk-opening-1-1
            phrase: Did we just test version two? Which record would tell us?
            targets:
              - opening-receipts
            color: cyan
            linger: 0.2
      - say: Read the path on the sample. It says version one. The sampler kept the snapshot it loaded. To
          test the update, save version two for sampling and draw a new answer from that path.
        hold: 1.1
        caption_starts:
          - It says version one.
          - To test the update
        visual_cues:
          - id: tk-opening-2-0
            phrase: Read the path on the sample.
            targets:
              - opening-sample
            color: cyan
            linger: 0.2
          - id: tk-opening-2-1
            phrase: It says version one.
            targets:
              - opening-sample
            color: cyan
            linger: 0.2
          - id: tk-opening-2-2
            phrase: The sampler kept the snapshot it loaded.
            targets:
              - opening-sample
            color: cyan
            linger: 0.2
          - id: tk-opening-2-3
            phrase: To test the update, save version two for sampling and draw a new answer from that path.
            targets:
              - opening-receipts
            color: cyan
            linger: 0.2
  - id: capability-receipt
    title: Can this model run your loss?
    visual: Three surfaces keep separate immutable SDK/Cookbook pins and a fresh account capability response. A
      supplied training-listed model fails its separate chosen-loss gate while model and account identity stay
      fixed.
    beats:
      - say: The clamp grader runs on your machine. Thinking Machines Lab runs the workers that generate the answers
          and train the model. You can inspect the Python SDK that makes the calls, and the Cookbook recipe that
          chooses what to send next. A pinned checkout identifies those two pieces of code. The worker revision
          and GPU pool belong to the hosted service.
        hold: 0.6
        visual_cues:
          - id: tk-capability-receipt-0-0
            phrase: The clamp grader runs on your machine. Thinking Machines Lab runs the workers that generate the
              answers and train the model.
            targets:
              - tk-capability-receipt-trace
            color: blue
            linger: 0.3
          - id: tk-capability-receipt-0-1
            phrase: You can inspect the Python SDK that makes the calls, and the Cookbook recipe that chooses what to send
              next.
            targets:
              - tk-capability-receipt-trace
            color: blue
            linger: 0.3
          - id: tk-capability-receipt-0-2
            phrase: A pinned checkout identifies those two pieces of code. The worker revision and GPU pool belong to the
              hosted service.
            targets:
              - tk-capability-receipt-trace
            color: blue
            linger: 0.3
      - say: Suppose your account lists a model for training. You want to use a particular reinforcement learning loss
          with it. Read the loss entry beside the training entry. This model lacks the loss you need. Hold this run.
          Choose a training model that supports the loss. Save the account's capability response at run start.
          Check the model documentation for loss, modality and export support. A public checkpoint name can differ
          from the hosted training ID.
        hold: 0.6
        caption_starts:
