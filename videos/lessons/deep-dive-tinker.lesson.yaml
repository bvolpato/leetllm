      change byte limit below one datum and show that indivisible datum remains oversized.
    beats:
      - say: How many network requests does one batch make? The pinned client defaults to limits of one thousand
          twenty-four datums and five million estimated protobuf bytes per chunk, before compression. The server
          can supply different limits. An individual datum stays whole even when it exceeds the byte target.
        hold: 0.6
        caption_starts:
          - The pinned client defaults
        visual_cues:
          - id: tk-chunk-order-0-0
            phrase: How many network requests does one batch make? The pinned client defaults to limits of one thousand
