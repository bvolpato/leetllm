  - id: primitive-receipts
    title: Name the state transition behind each result
    visual: A single datum receipt feeds a gradient accumulation object, an ordered optimizer receipt updates
      adapter/moments, a sample reads a named snapshot, and save_state creates a distinct resume artifact.
    beats:
      - say: Follow batch B zero. The hosted worker computes the chosen loss and accumulates the gradient for this
          training client's adapter. That's the forward-backward call. The optimizer consumes the accumulated
          gradient and advances the adapter and its optimizer state to version two. Ask the existing sampler for
          another answer. It still reads its selected snapshot at version one. Save the training state and you
          get a named point from which to resume. We've updated, sampled and saved. Each result records one of
          those operations.
        hold: 0.6
        visual_cues:
          - id: tk-primitive-receipts-0-0
            phrase: Follow batch B zero. The hosted worker computes the chosen loss and accumulates the gradient for this
              training client's adapter. That's the forward-backward call.
            targets:
              - tk-primitive-receipts-trace
            color: blue
            linger: 0.3
          - id: tk-primitive-receipts-0-1
            phrase: The optimizer consumes the accumulated gradient and advances the adapter and its optimizer state to
              version two.
            targets:
              - tk-primitive-receipts-trace
            color: blue
            linger: 0.3
          - id: tk-primitive-receipts-0-2
            phrase: Ask the existing sampler for another answer. It still reads its selected snapshot at version one.
            targets:
              - tk-primitive-receipts-trace
            color: blue
            linger: 0.3
          - id: tk-primitive-receipts-0-3
            phrase: Save the training state and you get a named point from which to resume.
            targets:
              - tk-primitive-receipts-trace
            color: blue
            linger: 0.3
          - id: tk-primitive-receipts-0-4
            phrase: We've updated, sampled and saved. Each result records one of those operations.
            targets:
              - tk-primitive-receipts-trace
            color: blue
            linger: 0.3
      - say: The pinned SDK describes an AdamW-equivalent update. Weight decay defaults to zero here. Record the value
          that your run used. Give one part of the loop ownership of this training client and log its ordered
          request IDs. If two loops contribute gradients between the batch and its optimizer step, the receipt
          alone can't tell you that the intended batch drove the update.
        hold: 0.6
        visual_cues:
          - id: tk-primitive-receipts-1-0
            phrase: The pinned SDK describes an AdamW-equivalent update.
            targets:
              - tk-primitive-receipts-trace
            color: blue
            linger: 0.3
          - id: tk-primitive-receipts-1-1
            phrase: Weight decay defaults to zero here. Record the value that your run used.
            targets:
              - tk-primitive-receipts-trace
            color: blue
            linger: 0.3
          - id: tk-primitive-receipts-1-2
            phrase: Give one part of the loop ownership of this training client and log its ordered request IDs.
            targets:
              - tk-primitive-receipts-trace
            color: blue
            linger: 0.3
          - id: tk-primitive-receipts-1-3
            phrase: If two loops contribute gradients between the batch and its optimizer step, the receipt alone can't
              tell you that the intended batch drove the update.
            targets:
              - tk-primitive-receipts-trace
            color: blue
            linger: 0.3
