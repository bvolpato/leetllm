      inputs. Weight follows the target role. The last prompt input and first answer target share a column.
    beats:
      - say: Start with a known answer to the clamp prompt. We'll train the model to predict that answer one token at
          a time. Ten and eleven stand for the prompt. Twenty and twenty-one stand for the answer. These are toy
          token IDs. Make a second strip for the targets. Each input predicts the token one place to its right
          in the original sequence.
        hold: 0.55
        visual_cues:
          - id: tk-sft-0-0
            phrase: Start with a known answer to the clamp prompt. We'll train the model to predict that answer one token
              at a time.
            targets:
              - sft-inputs
            color: cyan
            linger: 0.2
          - id: tk-sft-0-1
