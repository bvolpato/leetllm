  - id: clock
    title: Submit the ordered pair before waiting
    visual: Two timelines compare a sequential forward-backward, wait, optimizer schedule with a pipelined
      schedule that submits both ordered operations before awaiting their results.
    beats:
      - say: A correct batch can lose a whole worker cycle while your Python loop waits for a reply. One training
          client gives the forward-backward request and its optimizer request consecutive turns. If you wait for
          the first result before submitting the optimizer, the result can arrive too late for the next
          admission boundary.
