  - id: queue-recovery
    title: A timeout leaves an outstanding request to reconcile
    visual: Three in-flight groups retain sampler versions and request IDs. Deadline expiry stops replacement
      admission, leaves existing handle identifiable, and reconciles external tool effect through downstream
      idempotency.
    beats:
      - say: The worker admits requests on a clock. Overlap between GPU kernels happens inside the worker. Our loop
          has room for three groups. Each carries the step of the policy that sampled it. The trainer is at
          twelve. The first group came from nine, so its policy lag is three steps. The next two groups are
          younger. Queuing even more of them can hide latency while their policies grow older. Choose both a
          limit on outstanding work and the largest policy lag you'll accept.
        hold: 0.6
        visual_cues:
