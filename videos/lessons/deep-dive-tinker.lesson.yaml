  - id: boundary
    title: Your loop steers work across a hosted boundary
    visual: Local prompt rendering, grading, and datum construction connect to hosted model execution, adapter
      state, sampling, and storage. Requests and compact results cross the boundary while weights remain on
      hosted workers.
    beats:
      - say: Your Python loop renders the clamp prompt and packs the training example on the left. One training
          example with its targets and loss inputs is called a datum. Your loop sends the batch to the worker.
          When a sample comes back, the same loop grades it and assigns the reward. Those decisions are the
          local control plane.
        hold: 0.6
        visual_cues:
          - id: boundary-beat-1-focus-1
            phrase: Your Python loop renders the clamp prompt and packs the training example on the left. One training
              example with its targets and loss inputs is called a datum. Your loop sends the batch to the
              worker.
            targets:
              - boundary-render-prompt
            color: cyan
            linger: 0.65
          - id: boundary-beat-1-focus-2
            phrase: When a sample comes back, the same loop grades it and assigns the reward. Those decisions are the
              local control plane.
            targets:
              - boundary-grade-completion
            color: yellow
            linger: 0.65
          - id: tk-boundary-0-0
            phrase: Your Python loop renders the clamp prompt and packs the training example on the left. One training
              example with its targets and loss inputs is called a datum. Your loop sends the batch to the
              worker.
            targets:
              - tk-boundary-trace
            color: blue
            linger: 0.3
          - id: tk-boundary-0-1
            phrase: When a sample comes back, the same loop grades it and assigns the reward. Those decisions are the
              local control plane.
            targets:
              - tk-boundary-trace
            color: blue
            linger: 0.3
      - say: The worker on the right runs the model and keeps the adapter and optimizer state. That's the hosted data
          plane. Your loop gets a handle to the work, then a sample or training metrics when it finishes. A
          pending future gives you a way to wait for the result. The service keeps its parameter gradients and
          chooses the worker placement.
        hold: 0.6
        visual_cues:
          - id: boundary-beat-2-focus-1
            phrase: The worker on the right runs the model and keeps the adapter and optimizer state. That's the hosted
              data plane.
            targets:
