scenes:
  - id: intro
    title: What holds up the next token?
    visual: Two stopwatches time one decode projection. Memory is still running when arithmetic stops.
      Double the arithmetic rate and compare the two finish times again.
    beats:
      - say: The math takes three point six microseconds. Watch the memory clock keep going.
          Eight requests each need a new token. This projection multiplies their eight rows by the same weights.
        hold: 0.8
        visual_cues:
          - id: ag-intro-rows
            phrase: their eight rows
            targets:
              - decode-clock
            color: cyan
            linger: 0.35
          - id: ag-intro-clocks
            phrase: by the same weights
            targets:
              - decode-clock
            color: cyan
            linger: 0.35
      - say: About ninety microseconds to move the bytes. If both jobs overlap perfectly, the longer
          clock sets the earliest finish. Double the arithmetic rate and keep memory bandwidth the
          same. Where will the projection finish now?
        hold: 2.4
        caption_starts:
          - Double the arithmetic rate
        visual_cues:
          - id: ag-intro-wait
            phrase: Double the arithmetic rate
            targets:
              - decode-clock
            color: cyan
            linger: 0.35
      - say: Watch the blue clock. One point eight microseconds for the math. Memory still takes about ninety. Those
          eight rows share a whole matrix of weights. Let's count the bytes.
        hold: 0.9
        caption_starts:
          - One point eight microseconds for the math
          - Memory still takes about ninety
        visual_cues:
          - id: ag-intro-upgrade
            phrase: Watch the blue clock
            targets:
              - decode-clock
            color: cyan
            linger: 0.35
          - id: ag-intro-finish
            phrase: Memory still takes about ninety
            targets:
              - decode-clock
            color: cyan
            linger: 0.35
  - id: projection-contract
    title: Where do the 86 MiB go?
    visual: Keep one BF16 weight matrix. Highlight the row and weight column that make one output and
      account for its input reads and output write.
    beats:
      - say: Here's what those eight rows need. Each has four thousand ninety-six features. The weight matrix
          gives us eleven thousand and eight output features. At two bytes per weight, it takes
          eighty-six mebibytes. During prefill, all eight prompts can contribute their full four
          thousand ninety-six positions. That's thirty-two thousand seven hundred sixty-eight rows if
          they're scheduled together. During decode, the same matrix serves just eight rows.
        hold: 0.7
        visual_cues:
          - id: ag-projection-contract-weights
            phrase: eighty-six mebibytes
            targets:
              - projection-contract-mechanism
            color: cyan
            linger: 0.35
          - id: ag-projection-contract-prefill
            phrase: thirty-two thousand seven hundred sixty-eight rows
            targets:
              - projection-contract-mechanism
            color: cyan
            linger: 0.35
          - id: ag-projection-contract-decode
            phrase: just eight rows
            targets:
              - projection-contract-mechanism
            color: cyan
            linger: 0.35
      - say: Pick one output. Follow its input row across the weight column. There are K pairs to multiply and
          add. Across M rows and N columns, that's two M K N operations. Now count the bytes. Read the
          input and weights once, then write the output once. Each element in all three matrices takes
          two bytes.
        hold: 0.7
        visual_cues:
          - id: ag-projection-contract-pair
            phrase: Follow its input row across the weight column
            targets:
              - projection-contract-mechanism
            color: cyan
            linger: 0.35
          - id: ag-projection-contract-work
            phrase: two M K N operations
            targets:
              - projection-contract-mechanism
            color: cyan
            linger: 0.35
          - id: ag-projection-contract-bytes
            phrase: Read the input and weights once, then write the output once
            targets:
              - projection-contract-mechanism
            color: cyan
            linger: 0.35
      - say: Divide the work by those bytes. Decode gets about eight operations per byte. The full prefill gets
          about twenty-seven hundred. That's arithmetic intensity. Chunking the prompt changes the row
          count. A cache hit, an extra tile load or a fused output can change the traffic you'd measure.
        hold: 0.7
        visual_cues:
          - id: ag-projection-contract-intensity
            phrase: Decode gets about eight operations per byte
            targets:
              - projection-contract-mechanism
            color: cyan
            linger: 0.35
  - id: reuse
    title: One weight tile, two batch shapes
    visual: Follow a highlighted row through a resident weight tile while the number of token rows increases.
    beats:
      - say: Follow the highlighted row. It supplies the input for the matching row on the right. The little
          block between them holds part of the weights. All eight decode rows can use that same tile.
        hold: 0.65
        visual_cues:
          - id: reuse-beat-1-focus-1
            phrase: Follow the highlighted row
            color: cyan
            linger: 0.35
            targets:
              - reuse-grid-reuse
          - id: reuse-beat-1-focus-2
            phrase: part of the weights
            color: cyan
            linger: 0.35
            targets:
              - reuse-same-86-mib-weights-w
      - say: Now let the scheduler admit more prompt rows. The blue row count climbs. That weight tile keeps its
          shape. Each new row buys another use of the weights, and costs another input read and output
          write. That's why the operations per byte rise more slowly as you add rows.
        hold: 0.7
        visual_cues:
          - id: reuse-beat-2-focus-1
            phrase: admit more prompt rows
            color: cyan
            linger: 0.35
            targets:
              - reuse-grid-reuse
          - id: reuse-beat-2-focus-2
            phrase: That weight tile keeps its shape
            color: cyan
            linger: 0.35
            targets:
              - reuse-same-86-mib-weights-w
      - say: On a real kernel, ask how often this tile reaches device memory. It might stay in cache, or it
          might need several loads. Quantization changes the bytes per weight. Fusion can remove an
          output write. Measure the bytes at your actual batch shape before applying the calculation.
        hold: 0.7
        visual_cues:
          - id: reuse-beat-3-focus-1
            phrase: this tile reaches device memory
            color: cyan
            linger: 0.35
            targets:
              - reuse-resident-w-tile
          - id: reuse-beat-3-focus-2
            phrase: Quantization changes the bytes per weight
            color: cyan
            linger: 0.35
            targets:
              - reuse-same-86-mib-weights-w
  - id: roofline-numbers
    title: Which finish moves during prefill?
    visual: Give the two phases separately labeled linear axes and keep bandwidth fixed while the compute
      rate doubles.
    beats:
      - say: Return to the clocks. The upper ruler spans sixteen milliseconds for prefill. The lower one
          magnifies a tenth of a millisecond for decode. At two hundred trillion operations per second
          and one trillion bytes per second, the balance point is two hundred operations per byte.
          Divide work by the compute rate and bytes by bandwidth. The longer time sets the floor if the
          two overlap perfectly.
        hold: 0.6
        visual_cues:
          - id: ag-roofline-numbers-rates
            phrase: two hundred trillion operations per second and one trillion bytes per second
            targets:
              - roofline-numbers-mechanism
            color: cyan
            linger: 0.35
          - id: ag-roofline-numbers-divide
            phrase: Divide work by the compute rate and bytes by bandwidth
            targets:
              - roofline-numbers-mechanism
            color: cyan
            linger: 0.35
      - say: With all the prompt rows together, prefill needs nearly fifteen milliseconds of arithmetic and just
          over one millisecond of memory traffic. In decode, the pink memory bar extends well past the
          blue compute bar. Double just the compute rate. Prefill's floor falls to about seven point
          four milliseconds. Decode still waits ninety microseconds for its bytes.
        hold: 1.1
        visual_cues:
          - id: ag-roofline-numbers-prefill
            phrase: nearly fifteen milliseconds of arithmetic
            targets:
              - roofline-numbers-mechanism
            color: cyan
            linger: 0.35
          - id: ag-roofline-numbers-decode
            phrase: the pink memory bar extends well past the blue compute bar
            targets:
              - roofline-numbers-mechanism
            color: cyan
            linger: 0.35
          - id: ag-roofline-numbers-double
            phrase: Double just the compute rate
            targets:
              - roofline-numbers-mechanism
            color: cyan
            linger: 0.35
          - id: ag-roofline-numbers-result
            phrase: Decode still waits ninety microseconds for its bytes
            targets:
              - roofline-numbers-mechanism
            color: cyan
            linger: 0.35
      - say: For prefill, try a dense matrix kernel. For these eight decode rows, measure the weight traffic and
          try a small-row kernel or more rows per weight load. Hold the arrival pattern fixed. Other
          layers, queueing, cache history, and communication can all change the time a person waits.
        hold: 0.7
        visual_cues:
          - id: ag-roofline-numbers-scales
            phrase: measure the weight traffic
            targets:
              - roofline-numbers-mechanism
            color: cyan
            linger: 0.35
  - id: memory-owners
    title: Whose memory must fit this tile?
    visual: Track a weight tile from device memory toward one block. Compare capacity at the level that owns
      each allocation.
    beats:
      - say: To measure a load, first name the boundary it crosses. A weight tile can pass through the GPU's
          shared cache into storage local to a block. A thread can then load its operands into
          registers. Some accesses skip a tier. If a block needs a bigger tile, unused storage on a
          different streaming multiprocessor won't help it fit.
        hold: 0.6
        visual_cues:
          - id: ag-memory-owners-owners
            phrase: pass through the GPU's shared cache into storage local to a block
            targets:
              - memory-owners-mechanism
            color: cyan
            linger: 0.35
          - id: ag-memory-owners-thread
            phrase: A thread can then load its operands into registers
            targets:
              - memory-owners-mechanism
            color: cyan
            linger: 0.35
      - say: Take an H one hundred streaming multiprocessor. Its register file holds two hundred fifty-six
          kibibytes. Blocks on that multiprocessor share a two hundred twenty-eight kilobyte
          shared-memory budget. One block can use at most two hundred twenty-seven kilobytes, with
          explicit opt-in for large allocations. The fifty megabytes of L two cache belong to the whole
          GPU. Keep the owner beside the number when you compare devices.
        hold: 0.7
        visual_cues:
          - id: ag-memory-owners-registers
            phrase: two hundred fifty-six kibibytes
            targets:
              - memory-owners-mechanism
            color: cyan
            linger: 0.35
          - id: ag-memory-owners-shared
            phrase: at most two hundred twenty-seven kilobytes
            targets:
              - memory-owners-mechanism
            color: cyan
            linger: 0.35
          - id: ag-memory-owners-l2
            phrase: fifty megabytes of L two cache
            targets:
              - memory-owners-mechanism
            color: cyan
            linger: 0.35
      - say: The assistant's whole model brings us to a bigger boundary. Suppose its sixteen gigabytes of
          weights fit only if some live on the host. The device and host paths have very different
          bandwidths. On an actual machine, the host memory, PCI Express route, NUMA placement and copy
          engine all affect the achieved rate.
        hold: 0.65
        visual_cues:
          - id: ag-memory-owners-paths
            phrase: device and host paths have very different bandwidths
            targets:
              - memory-owners-mechanism
            color: cyan
            linger: 0.35
  - id: offload
    title: How much time does one percent of the weights cost?
    visual: Keep the 16 GB byte strip fixed in length. Change the host fraction and divide each portion by
      its bandwidth on a second ruler for sequential time.
    beats:
      - say: One decode batch reads sixteen gigabytes of weights. Read them from the device at the
          bandwidth shown here and it takes about four point eight milliseconds. Now split the weights
          between device and host. We'll time the two reads one after the other.
        hold: 0.7
        visual_cues:
          - id: ag-offload-local
            phrase: Read them from the device
            targets:
              - weight-routes
            color: cyan
            linger: 0.35
      - say: Move one percent of the weights to host memory. See the pink sliver at the right? Those bytes now
          travel at sixty-four gigabytes per second. What share of the time will that one percent take?
        hold: 2.2
        visual_cues:
          - id: ag-offload-one
            phrase: Move one percent of the weights to host memory
            targets:
              - weight-routes
            color: cyan
            linger: 0.35
      - say: Divide each portion by its own bandwidth. The host read takes two and a half milliseconds.
          The device read takes about four point seven. Together they take about seven point two.
          That pink sliver costs about a third of the read time for one percent of the bytes.
        hold: 0.8
        caption_starts:
          - The host read takes
          - That pink sliver costs
        visual_cues:
          - id: ag-offload-time
            phrase: Divide each portion by its own bandwidth
            targets:
              - weight-routes
            color: cyan
            linger: 0.35
          - id: ag-offload-share
            phrase: about a third of the read time
            targets:
              - weight-routes
            color: pink
            linger: 0.35
      - say: Try ten percent on the host path. Those reads alone now take twenty-five milliseconds. Add the
          resident reads and divide by the original four point eight milliseconds, using the unrounded
          times. This stream takes just over six times as long. Offload may let a model fit. Measure the
          repeated transfers under load to see how much prefetch or compression buys back.
        hold: 0.8
        visual_cues:
          - id: ag-offload-ten
            phrase: Try ten percent on the host path
            targets:
              - weight-routes
            color: cyan
            linger: 0.35
  - id: systolic-dataflow
    title: Follow one activation and its partial sum
    visual: Step a staggered two-by-two multiply. Blue activations advance across fixed weights, and cyan
      partial sums cross to the cell below.
    beats:
      - say: Each little square is a thread. A scheduler issues one instruction for an NVIDIA warp. Its
          active lanes apply that instruction to their own operands. A branch or predicate can change which lanes participate. That's
          single instruction, multiple threads. A Hopper warp-group matrix instruction brings four warps
          together. Its one hundred twenty-eight threads still need registers for the accumulators, even
          when operands come from shared memory.
        hold: 0.7
        visual_cues:
          - id: ag-systolic-dataflow-group
            phrase: brings four warps together
            targets:
              - systolic-dataflow-mechanism
            color: cyan
            linger: 0.35
      - say: Now look inside a conceptual matrix array. The four weights stay put. Send the blue one into the
          cell holding five. Its running sum is five. On the next step, the one moves right to the six.
          Follow the five down to the cell holding seven. The next activation there is two. That cell
          adds two times seven to five and emits nineteen.
        hold: 1
        visual_cues:
          - id: ag-systolic-dataflow-start
            phrase: Send the blue one into the cell holding five
            targets:
              - systolic-dataflow-mechanism
            color: cyan
            linger: 0.35
          - id: ag-systolic-dataflow-advance
            phrase: the one moves right to the six. Follow the five down
            targets:
              - systolic-dataflow-mechanism
            color: cyan
            linger: 0.35
          - id: ag-systolic-dataflow-first
            phrase: and emits nineteen
            targets:
              - systolic-dataflow-mechanism
            color: cyan
            linger: 0.35
        caption_starts:
          - That cell adds
      - say: Keep feeding the array. One more step produces twenty-two at the bottom right and forty-three at
          the bottom left. On the last step, add four times eight to eighteen. The bottom right cell
          emits fifty. Each weight served both input rows. Passing activations and partial sums between
          neighbors is systolic dataflow. A real array spends time filling and draining, and a skinny
          input can leave many slots padded. TPU and Trainium also have vector and scalar engines for
          other operations.
        hold: 0.7
        visual_cues:
          - id: ag-systolic-dataflow-next
            phrase: One more step produces twenty-two at the bottom right and forty-three at the bottom left
            targets:
              - systolic-dataflow-mechanism
            color: cyan
            linger: 0.35
          - id: ag-systolic-dataflow-others
            phrase: On the last step, add four times eight to eighteen. The bottom right cell emits fifty
            targets:
              - systolic-dataflow-mechanism
            color: cyan
            linger: 0.35
  - id: tile-density
    title: Eight rows in a tile built for 128
    visual: Mask 120 padded slots and contrast useful rows in this one tile with work on a separate engine.
    beats:
      - say: Give that skinny decode projection eight real rows in a tile with a hundred twenty-eight slots.
          Only the blue rows carry a request. Eight divided by a hundred twenty-eight is six and a
          quarter percent. Mask the padded rows so they can't change an answer.
        hold: 0.7
        visual_cues:
          - id: ag-tile-density-real
            phrase: eight real rows
            targets:
              - tile-density-mechanism
            color: cyan
            linger: 0.35
          - id: ag-tile-density-ratio
            phrase: six and a quarter percent
            targets:
              - tile-density-mechanism
            color: cyan
            linger: 0.35
          - id: ag-tile-density-mask
            phrase: Mask the padded rows
            targets:
              - tile-density-mechanism
            color: cyan
            linger: 0.35
      - say: Keep that picture still. Another engine can be busy at the same time. Your fraction still reads six
          and a quarter percent. It measures the useful rows in this particular tile. To estimate chip
          utilization, inspect scheduling, concurrent engines and idle-cycle counters. To compare
          arithmetic throughput, measure achieved operations per second against peak.
        hold: 0.7
        visual_cues:
          - id: ag-tile-density-other
            phrase: Another engine can be busy at the same time
            targets:
              - tile-density-mechanism
            color: cyan
            linger: 0.35
      - say: For decode, try a legal tile with fewer rows, or batch more requests if the latency budget permits.
          A verified lower-precision weight format could save traffic too. Keep outputs and arrivals
          fixed. The long prefill gives dense matrix tiles more rows to work with.
        hold: 0.7
        visual_cues:
          - id: ag-tile-density-decode
            phrase: try a legal tile with fewer rows
            targets:
              - tile-density-mechanism
            color: cyan
            linger: 0.35
  - id: cuda-compatibility
    title: Can the new GPU run this tile?
    visual: Try the Hopper artifact on Blackwell, then pack blocks into one fixed shared-memory budget.
    beats:
      - say: Hopper's Tensor Memory Accelerator can copy a multidimensional tile into shared memory while
          threads do independent work. A cluster lets participating blocks access distributed shared
          memory. For the eight decode rows, check how often they reuse the staged weights. An
          additional copy costs traffic even if it buys little reuse.
        hold: 0.6
        visual_cues:
          - id: ag-cuda-compatibility-copy
            phrase: copy a multidimensional tile into shared memory
            targets:
              - cuda-compatibility-mechanism
            color: cyan
            linger: 0.35
          - id: ag-cuda-compatibility-cluster
            phrase: participating blocks access distributed shared memory
            targets:
              - cuda-compatibility-mechanism
            color: cyan
            linger: 0.35
      - say: Carry that kernel over to Blackwell. Both devices run CUDA, but this artifact contains Hopper's
          architecture-specific compute ninety A code. Blackwell can't use that path. Supply native code
          for the target or compatible PTX. A successful launch gets you to a separate question. How
          many blocks can keep the machine busy?
        hold: 0.7
        visual_cues:
          - id: ag-cuda-compatibility-reject
            phrase: Blackwell can't use that path
            targets:
              - cuda-compatibility-mechanism
            color: cyan
            linger: 0.35
          - id: ag-cuda-compatibility-compatible
            phrase: Supply native code for the target or compatible PTX
            targets:
              - cuda-compatibility-mechanism
            color: cyan
            linger: 0.35
      - say: Give one multiprocessor a hypothetical shared-memory budget of one hundred ninety-two kibibytes. At
          sixty-four per block, three blocks fit. Grow the allocation to ninety-six per block. Now two
          fit. Divide usable capacity by the per-block allocation and round down. Registers or threads
          may lower that bound further. A larger tile can reduce memory traffic and leave fewer warps
          ready to run. Measure both effects, then time a smaller tile with the same output checks.
        hold: 0.75
        visual_cues:
          - id: ag-cuda-compatibility-floor
            phrase: three blocks fit
            targets:
              - cuda-compatibility-mechanism
            color: cyan
            linger: 0.35
          - id: ag-cuda-compatibility-footprint
            phrase: Grow the allocation to ninety-six per block
            targets:
              - cuda-compatibility-mechanism
            color: cyan
            linger: 0.35
  - id: lanes
    title: Where does input 65 go?
    visual: Keep two physical waves apart. Publish the lower half of the first wave, give input 65 to the
      second wave, then route both half-wave sums into the result.
    beats:
      - say: Here's a correctness test for a port. Assign values one through sixty-four to the lanes of one
          physical wave. These CDNA targets execute sixty-four lanes together. The four rows on the left
          all belong to that wave. Its reference sum is two thousand eighty. A helper written for a
          thirty-two-thread NVIDIA warp will publish one number per physical wave. Let's see what it
          actually reads.
        hold: 0.65
        visual_cues:
          - id: ag-lanes-wave
            phrase: one physical wave
            targets:
              - wave-reduction
            color: cyan
            linger: 0.35
      - say: Read the first thirty-two lanes and publish their sum. That's five hundred twenty-eight. Look at
          the bottom half. The wave owns those values too, but none reached the sum. Changing the launch
          syntax left this assumption in place.
        hold: 1.25
        visual_cues:
          - id: ag-lanes-low
            phrase: Read the first thirty-two lanes and publish their sum
            targets:
              - wave-reduction
            color: cyan
            linger: 0.35
      - say: Append sixty-five. The first wave is full, so that value belongs to lane zero of a second wave.
          Apply the same helper to both waves. What total will they publish together?
        hold: 2.5
        visual_cues:
          - id: ag-lanes-next
            phrase: Append sixty-five
            targets:
              - wave-reduction
            color: cyan
            linger: 0.35
      - say: The second wave contributes sixty-five. Add that to the first wave's five hundred twenty-eight.
          Together they publish five hundred ninety-three. Values thirty-three through sixty-four are still sitting in the first
          wave. The reference for all sixty-five inputs is two thousand one hundred forty-five.
        hold: 1
        caption_starts:
          - Together they publish five hundred ninety-three
        visual_cues:
          - id: ag-lanes-second-partial
            phrase: The second wave contributes sixty-five
            targets:
              - wave-reduction
            color: cyan
            linger: 0.35
          - id: ag-lanes-total
            phrase: five hundred ninety-three
            targets:
              - wave-reduction
            color: cyan
            linger: 0.35
      - say: Keep the two halves if you like. Sum values thirty-three through sixty-four. That adds one thousand five
          hundred fifty-two. Combine both partials from the first wave, then add sixty-five from the
          second. Now every owned value reaches the answer once. A wave-aware library reduction can do
          this for you. Check the participation mask, shuffle width and which lane publishes. Run the
          same test just below, at, and just above the wave boundary.
        hold: 1.1
        visual_cues:
          - id: ag-lanes-upper
            phrase: Sum values thirty-three through sixty-four
            targets:
              - wave-reduction
            color: cyan
            linger: 0.35
          - id: ag-lanes-join
            phrase: Combine both partials from the first wave, then add sixty-five from the second
            targets:
              - wave-reduction
            color: cyan
            linger: 0.35
  - id: target-build
    title: Which target and which four ranks?
    visual: Connect a checked wave width to its ROCm build target and inspect the physical links of the
      chosen rank subset.
    beats:
      - say: The repaired sum gives us a check to run when we build for CDNA. Here a wave has sixty-four lanes.
          HIP keeps the familiar thread and block names. Its Local Data Share belongs to a work-group,
          and its vector registers belong to the executing work. Check each target's wave primitive
          before you trust a translated mask.
        hold: 0.6
        visual_cues:
          - id: ag-target-build-wave
            phrase: a wave has sixty-four lanes
            targets:
              - target-build-mechanism
            color: cyan
            linger: 0.35
          - id: ag-target-build-contract
            phrase: check each target's wave primitive
            targets:
              - target-build-mechanism
            color: cyan
            linger: 0.35
      - say: In ROCm seven point fourteen, each of these chip families has its own build target. The MI
          three hundred series uses G F X nine forty-two. The MI three hundred fifty series uses G F X
          nine fifty. Save the exact target, compiler, runtime and library versions with your boundary
          test and timings.
        hold: 0.7
        visual_cues:
          - id: ag-target-build-targets
            phrase: G F X nine fifty
            targets:
              - target-build-mechanism
            color: cyan
            linger: 0.35
      - say: Put eight MI three hundred X GPUs on the diagram, one rank per GPU. Each pair has a dedicated
          Infinity Fabric route on this machine. Choose ranks zero, two, four and six for an RCCL
          collective. The six bright links join pairs in that group. Save the four GPU IDs with your
