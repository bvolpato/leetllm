      - say: "A new batch returns evaluation revision three, health revision four and policy revision three. All three report success. Predict the owner of the repair. The join rejects the mixed release revision; refresh the mismatched branch and revalidate freshness before creating a packet. If health instead returns twice under one identity, reject the duplicate rather than counting it as more evidence. The final writer remains unchanged until a valid current packet and its required review exist. The production-agent capstone next makes that separation executable: draft from policy evidence, persist one exact review packet and test a separate writer’s recovery and replay behavior."
