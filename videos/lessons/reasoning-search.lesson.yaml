scenes:
  - id: policy-decision-record
    title: Merge requires three passing checks
    visual: Slide the model's merge slip alongside the release service's slip. Align their checks, mark the
      scan on the spoken answer, then change its value and rescore the record.
    beats:
      - say: Both slips say merge. The release service requires all three checks to pass. Which check did the model copy wrong?
        caption_starts: [Which check did the model copy wrong]
        hold: 2.2
        visual_cues:
          - id: record-compare
            phrase: Both slips say merge
            targets:
              - policy-decision-record-mechanism
            caption_boundary: true
            linger: 0.3
      - say: The scan. The service says true. The model wrote false and still chose the right action.
          Change just that field to true. Now the values agree as well.
        caption_starts: [The model wrote false]
        hold: 1
        visual_cues:
          - id: record-locate
            phrase: The scan
            targets:
              - policy-decision-record-mechanism
            caption_boundary: true
            linger: 0.3
          - id: record-flip
            phrase: Change just that field to true
            targets:
              - policy-decision-record-mechanism
            caption_boundary: true
            linger: 0.3
          - id: record-matches
            phrase: Now the values agree as well
            targets:
              - policy-decision-record-mechanism
            caption_boundary: true
            linger: 0.3
      - say: Try the shorter record. It lists only the tests and asks for manual review. That's one of three
          required fields, and its action disagrees with the rule. We wrote these mistakes into the examples.
          The same scorer can compare prompts. It checks which fields arrived, whether their booleans match
          the service, and whether the proposed action matches the rule.
        hold: 0.9
        visual_cues:
          - id: record-partial
            phrase: Try the shorter record
            targets:
              - policy-decision-record-mechanism
            caption_boundary: true
            linger: 0.3
          - id: record-grade-partial
            phrase: one of three required fields, and its action disagrees with the rule
            targets:
              - policy-decision-record-mechanism
            caption_boundary: true
            linger: 0.3
  - id: scratchpad-compute
    title: Where does the next step get its two?
    visual: Pass a prefix through a stack, append the proposed digit to the same prefix, and read the longer
      prefix on the next pass. Distinguish generated values and cached inputs from an arithmetic check.
    beats:
      - say: Where does a written step help? Give a decoder the beginning of a subtraction, six minus four
          equals. It runs its layers and proposes the digit two. Append that two to the prefix. The next
          prediction can read a subtotal that didn't exist on the first pass. That growing sequence is a
          scratchpad.
        hold: 0.9
        visual_cues:
          - id: scratch-pass
            phrase: It runs its layers
            targets:
              - scratchpad-compute-mechanism
            caption_boundary: true
            linger: 0.3
          - id: scratch-token
            phrase: proposes the digit two
            targets:
              - scratchpad-compute-mechanism
            caption_boundary: true
            linger: 0.3
          - id: scratch-append
            phrase: Append that two to the prefix
            targets:
              - scratchpad-compute-mechanism
            caption_boundary: true
            linger: 0.3
          - id: scratch-read
            phrase: The next prediction can read a subtotal
            targets:
              - scratchpad-compute-mechanism
            caption_boundary: true
            linger: 0.3
      - say: The subtotal came from the model. A wrong subtotal can carry forward, and a later step can correct
          it. A key and value cache reuses earlier projections. Each additional token still goes through
          the layers and attends to the retained context. A native reasoning model can do that work behind
          a very short answer. Two replies of the same visible length can cost different amounts.
        hold: 0.7
        visual_cues:
          - id: scratch-cache
            phrase: reuses earlier projections
            targets:
              - scratchpad-compute-mechanism
            caption_boundary: true
            linger: 0.3
      - say: Merrill and Sabharwal studied what intermediate steps make possible in a specified transformer.
          Under their precision and normalization assumptions, polynomially many steps can express
          polynomial-time computation. Some separations rely on unproved complexity assumptions. Whether
          training actually found a useful procedure is something we can test on held-out problems.
        hold: 0.7
        visual_cues:
          - id: scratch-capacity
            phrase: polynomially many steps can express polynomial-time computation
            targets:
              - scratchpad-compute-mechanism
            caption_boundary: true
            linger: 0.3
  - id: prompt-comparison
    title: What does a worked example teach?
    visual: Hold the target release fixed and compare a field template with a worked check. Keep results from
      historical prompting experiments next to their model and task.
    beats:
      - say: One prompt shows the fields we need. Another works through a separate release where the scan failed
          and explains why the answer is manual review. That second example teaches a step someone could
          repeat on a new case. Supplying solved examples like this is few-shot chain-of-thought prompting.
          Asking for steps without any examples is zero-shot. To find out what the demonstration buys us,
          keep the target facts, policy and output fields fixed.
        hold: 0.7
        visual_cues:
          - id: prompt-comparison-b1
            phrase: works through a separate release where the scan failed
            targets:
              - prompt-comparison-mechanism
            caption_boundary: true
            linger: 0.3
      - say: Wei and colleagues tried eight worked examples on grade-school math problems. With their PaLM model,
          accuracy rose from about eighteen percent to nearly fifty-seven. Kojima and colleagues showed
          that even a zero-shot request to think step by step could elicit intermediate steps. These
          experiments give us prompt variants to try on the release task.
        hold: 0.8
        visual_cues:
          - id: prompt-comparison-b2
            phrase: eight worked examples on grade-school math problems
            targets:
              - prompt-comparison-mechanism
            caption_boundary: true
            linger: 0.3
      - say: The task matters. A June twenty twenty-five study on G P Q A found modest average gains for
          non-reasoning models. Reasoning models gained little and spent more time. A different study on
          nine pattern-based datasets found that asking for steps hurt performance across sixteen models.
          On the same held-out releases, measure parse failures and missing checks separately. A template
          can fix the first while leaving the second untouched. Compare final actions, tokens and latency
          as well.
        hold: 0.75
        visual_cues:
          - id: prompt-comparison-b3
            phrase: The task matters
            targets:
              - prompt-comparison-mechanism
            caption_boundary: true
            linger: 0.3
  - id: reasoning-artifacts
    title: What can an operator inspect?
    visual: Separate the proposed record from generated text, internal usage and a summary. Count internal
      tokens against a fixed output budget while the required public record stays empty.
    beats:
      - say: What could you inspect to find that wrong scan? The decision record gives you a field to compare
          with the source. Asking a model for intermediate steps gives you generated text. A native
          reasoning model can spend internal tokens processing the request. A provider may also return a
          summary describing that work. Each of those answers a different question. Neither a summary nor a
          written explanation establishes which internal steps caused the answer.
        hold: 0.75
        visual_cues:
          - id: reasoning-artifacts-b1
            phrase: a field to compare with the source
            targets:
              - reasoning-artifacts-mechanism
            caption_boundary: true
            linger: 0.3
      - say: Imagine a response with an eight-hundred-token output budget. Watch the internal reasoning tokens
          consume that allowance. The counter reaches eight hundred and the record is still empty. Treat
          this as an incomplete response. OpenAI documents internal usage and optional summaries on
          supported models. Raw reasoning tokens stay private. Providers differ in their controls and
          disclosures, so check the contract for the endpoint you use.
        hold: 0.8
        visual_cues:
          - id: reasoning-artifacts-b2
            phrase: eight-hundred-token output budget
            targets:
              - reasoning-artifacts-mechanism
            caption_boundary: true
            linger: 0.3
          - id: reasoning-limit
            phrase: Watch the internal reasoning tokens consume that allowance
            targets:
              - reasoning-artifacts-mechanism
            caption_boundary: true
            linger: 0.3
          - id: artifact-incomplete
            phrase: The counter reaches eight hundred and the record is still empty
            targets:
              - reasoning-artifacts-mechanism
            caption_boundary: true
            linger: 0.3
      - say: Turpin and colleagues changed features such as the order of the answer options. A model's prompted
          explanation could justify a choice without mentioning the feature that influenced it. That
          experiment studied prompted text. For a release audit, keep the inputs, validated fields, tool
          observations and actual outcome. Limit who can access sensitive intermediate text and how long
          you keep it.
        hold: 0.75
        visual_cues:
          - id: reasoning-artifacts-b3
            phrase: changed features such as the order of the answer options
            targets:
              - reasoning-artifacts-mechanism
            caption_boundary: true
            linger: 0.3
  - id: canonical-answer-vote
    title: Five replies to one release request
    visual: Keep each final-action string in its own numbered row. Fill five equal slots from the allowed
      aliases, then move the threshold from three slots to four while every vote stays in place.
    beats:
      - say: Here are five sampled replies to the same request. Read just the final action from each one. The
          first three use different words for merge. The fourth asks for manual review. The last asks to
          force a merge. Our list of allowed actions has no entry for that.
        hold: 0.8
        visual_cues:
          - id: vote-three
            phrase: The first three use different words for merge
            targets:
              - canonical-answer-vote-mechanism
            caption_boundary: true
            linger: 0.3
          - id: vote-review
            phrase: The fourth asks for manual review
            targets:
              - canonical-answer-vote-mechanism
            caption_boundary: true
            linger: 0.3
          - id: vote-invalid
            phrase: Our list of allowed actions has no entry for that
            targets:
              - canonical-answer-vote-mechanism
            caption_boundary: true
            linger: 0.3
      - say: We sampled five paths, so each reply gets one seat, even the rejected one. Suppose a recommendation
          needs sixty percent support. Does merge qualify?
        hold: 2.1
        visual_cues:
          - id: vote-floor
            phrase: sixty percent support
            targets:
              - canonical-answer-vote-mechanism
            caption_boundary: true
            linger: 0.3
      - say: Yes. Three of five is sixty percent, exactly on the line. Now raise the requirement to eighty
          percent. The same replies fall one vote short, so the controller abstains. Manual review is a
          policy answer. An abstention means the vote didn't choose one.
        caption_starts: [The same replies fall one vote short, Manual review is a policy answer]
        hold: 1
        visual_cues:
          - id: vote-accept
            phrase: Three of five is sixty percent, exactly on the line
            targets:
              - canonical-answer-vote-mechanism
            caption_boundary: true
            linger: 0.3
          - id: vote-raise
            phrase: Now raise the requirement to eighty percent
            targets:
              - canonical-answer-vote-mechanism
            caption_boundary: true
            linger: 0.3
          - id: vote-abstain
            phrase: so the controller abstains
            targets:
              - canonical-answer-vote-mechanism
            caption_boundary: true
            linger: 0.3
      - say: Sampling paths and counting their final answers is called self-consistency. The most frequent answer
          can win a plurality with less than half the votes. Our stricter rule needs a unique winner and a
          finite numeric threshold above one half and at most one. A boolean isn't a threshold. Empty
          batches, ties and batches with no valid votes all abstain. Check the response schema and match
          only an allowed final action. A rationale might say never merge and still contain the word merge.
        hold: 0.8
        visual_cues:
          - id: vote-rule
            phrase: a unique winner
            targets:
              - canonical-answer-vote-mechanism
            caption_boundary: true
            linger: 0.3
      - say: Temperature and truncation affect which paths you sample. Copying one reply five times adds no
          independent evidence. Even separate draws can share a mistake. The vote selects a candidate for
          the same policy check we used on the release record.
        hold: 0.6
        visual_cues:
          - id: vote-policy
            phrase: selects a candidate
            targets:
              - canonical-answer-vote-mechanism
            caption_boundary: true
            linger: 0.3
  - id: sampling-cost-ledger
    title: What changes when each case gets five samples?
    visual: Keep five authored requests in rows. Compare each first action with its five-answer vote,
      including the unanimously wrong recommendation and the abstention. Count requested outputs separately
      from correct decisions.
    beats:
      - say: These five releases have handwritten sample replies. Look at the row where all five say merge. The
          expected action is manual review. Five votes repeat the same mistake. A failed scan would still
          block that release. In the last row the first answer was right, but the vote abstains. Across all
          five cases the first reply is correct twice and the vote is correct three times. That's forty
          percent versus sixty percent, for five samples versus twenty-five if we collected them.
        hold: 0.8
        visual_cues:
          - id: sampling-cost-ledger-b1
            phrase: the row where all five say merge
            targets:
              - sampling-cost-ledger-mechanism
            caption_boundary: true
            linger: 0.3
          - id: reason-result-sample-summary
            phrase: forty percent versus sixty percent, for five samples versus twenty-five
            targets:
              - sampling-cost-ledger-mechanism
            caption_boundary: true
            linger: 0.3
      - say: In a separate math experiment, Wang and colleagues sampled forty outputs per run. Their PaLM model
          went from fifty-six point five percent with greedy reasoning to seventy-four point four with
          self-consistency. The baseline belongs to this experiment. Agreement can correlate with accuracy,
          but three votes out of five isn't a calibrated probability that an answer is correct.
        hold: 0.8
        visual_cues:
          - id: sampling-cost-ledger-b2
            phrase: sampled forty outputs per run
            targets:
              - sampling-cost-ledger-mechanism
            caption_boundary: true
            linger: 0.3
      - say: For a service, collect both strategies on the same held-out requests. Count abstentions and invalid
          replies, repeat stochastic trials and measure unsafe approvals separately. Five correct examples
          still leave uncertainty about the true rate. You might run all five calls at once to save wall
          time. You still pay to generate five replies, and longer replies can cost more even when the call
          count stays fixed.
        hold: 0.65
        visual_cues:
          - id: sampling-cost-ledger-b3
            phrase: collect both strategies on the same held-out requests
            targets:
              - sampling-cost-ledger-mechanism
            caption_boundary: true
            linger: 0.3
  - id: dependency-and-graph
    title: Which answer does the next check need?
    visual: Pass the changed-component list into a second release question. Then combine independent security
      and performance findings in a record that can be revised and checked.
    beats:
      - say: This release changes authentication and logging. We need that list before we can name the checks to
          run. First identify the components. Pass the verified list into a second question about required
          checks. If the first answer drops logging, the next answer can miss the log-schema check. Solving
          dependent questions in order is called least-to-most prompting.
        hold: 0.8
        visual_cues:
          - id: dependency-and-graph-b1
            phrase: First identify the components
            targets:
              - dependency-and-graph-mechanism
            caption_boundary: true
            linger: 0.3
      - say: Suppose the security and performance reviewers can work separately. The combined release record now
          has two parents. A reviewer can send feedback and ask for a revision. Those joins and revisions
          are what a graph-of-thoughts controller adds. Retain both versions and score them. Feedback can
          make a previously correct answer worse.
        hold: 0.8
        visual_cues:
          - id: dependency-and-graph-b2
            phrase: two parents
            targets:
              - dependency-and-graph-mechanism
            caption_boundary: true
            linger: 0.3
      - say: While those reviewers work in parallel, both branches need their own active histories. A shared
          prefix cache can reuse the common prompt on a system that supports it. Each changed history still
          takes work. When the next question depends on the previous answer, that wait is on the critical
          path. Measure the latency before deciding to put the workflow in an interactive service.
        hold: 0.75
        visual_cues:
          - id: dependency-and-graph-b3
            phrase: both branches need their own active histories
            targets:
              - dependency-and-graph-mechanism
            caption_boundary: true
            linger: 0.3
  - id: subject-intro
    title: Four numbers leave room for different plans
    visual: The numbers four, five, six, and seven enter a puzzle. One path reaches twenty-four early while
      leaving unused values; another keeps a smaller subtotal alive.
    beats:
      - say: Take four numbers, four, five, six, and seven. Use each exactly once with ordinary arithmetic to
          make twenty-four. The goal sounds simple because the answer is one number.
        hold: 0.55
        visual_cues:
          - id: subject-intro-beat-1-focus-1
            phrase: Take four numbers
            targets:
              - subject-intro-simulation-2
            color: blue
            linger: 0.6
          - id: subject-intro-beat-1-focus-2
            phrase: Use each exactly once with ordinary arithmetic to make twenty-four
            targets:
              - subject-intro-object-use-each-input-exactly-once-target-24-1
            color: blue
            linger: 0.6
      - say: Choose six and four. Multiply six by four and you get twenty-four. Look back at the tray. Five and
          seven are still there. The target number appeared before we finished the puzzle.
        hold: 0.75
        motion_check:
          region:
            - 150
            - 340
            - 1620
            - 560
          minimumChangedFraction: 0.002
        visual_cues:
          - id: subject-intro-beat-2-focus-1
            phrase: Choose six and four
            targets:
              - subject-intro-simulation-2
            color: blue
            linger: 0.6
          - id: subject-pair-motion
            phrase: Multiply six by four
            targets:
              - subject-intro-simulation-2
            caption_boundary: true
            linger: 0.3
          - id: subject-product
            phrase: and you get twenty-four
            targets:
              - subject-intro-mechanism
            caption_boundary: true
            linger: 0.3
      - say: To solve this well, a system needs to keep useful alternatives alive, check each move, and know when
          its search budget has run out. Let’s build that controller from the puzzle itself.
        hold: 0.55
        visual_cues:
          - id: subject-intro-beat-3-focus-1
            phrase: To solve this well
            targets:
              - subject-intro-simulation-2
            color: blue
            linger: 0.6
          - id: subject-intro-beat-3-focus-2
            phrase: check each move
            targets:
              - subject-intro-object-current-check-result-5
            color: blue
            linger: 0.6
  - id: linear-state
    title: A written step gives the next step something to use
    visual: A valid solution changes a state after each arithmetic move; consumed operands disappear and the
      new subtotal becomes available to the next decision.
    beats:
      - say: A state records the values still available and the operation that produced them. One valid first
          move is six minus four, which leaves two, five, and seven.
        hold: 0.55
        visual_cues:
          - id: linear-first-subtraction
            phrase: One valid first move is six minus four
            targets:
              - linear-after-subtraction
            color: yellow
            linger: 0.6
          - id: linear-state-beat-1-focus-1
            phrase: A state records the values still available and
            targets:
              - linear-state-object-start-4-5-6-7-8
            color: blue
            linger: 0.6
          - id: reason-result-linear-subtract
            phrase: One valid first move is six minus four, which leaves two, five, and seven
            targets:
              - linear-after-subtraction
            color: cyan
            linger: 0.4
      - say: Combine five and seven into twelve. The state now contains two and twelve. The two came from six and
          four. The twelve came from five and seven. We can use both subtotals in the next move.
        hold: 0.75
        visual_cues:
          - id: linear-state-beat-2-focus-1
            phrase: Combine five and seven into twelve
            targets:
              - linear-after-addition
            color: blue
            linger: 0.6
          - id: reason-result-linear-add
            phrase: Combine five and seven into twelve. The state now contains two and twelve
            targets:
              - linear-after-addition
            color: cyan
            linger: 0.4
      - say: "Multiply two by twelve and the final state contains twenty-four. This is a linear path: one
          continuation at each step. A generated explanation can guide the next token, while the host still
          checks the arithmetic."
        hold: 0.55
        visual_cues:
          - id: linear-state-beat-3-focus-1
            phrase: Multiply two by twelve and the final state contains twenty-four
            targets:
              - linear-final-product
            color: blue
            linger: 0.6
          - id: reason-result-linear-final
            phrase: Multiply two by twelve and the final state contains twenty-four
            targets:
              - linear-final-product
            color: cyan
            linger: 0.4
  - id: branch-state
    title: What survives the first move?
    visual: Start both trays with the same four numbered tiles. Trace each pair to the subtotal it makes. The
      two unused tiles continue straight down into the child state.
    beats:
      - say: Make two copies of the starting tray. On the left, choose six and four. On the right, leave those
          two alone and choose five and seven. Both trays started with the same four inputs.
        hold: 0.65
        visual_cues:
          - id: branch-select-a
            phrase: choose six and four
            targets:
              - branch-state-mechanism
            caption_boundary: true
            linger: 0.3
          - id: branch-select-b
            phrase: choose five and seven
            targets:
              - branch-state-mechanism
            caption_boundary: true
            linger: 0.3
      - say: On the left, multiply. Six times four gives twenty-four. The five and the seven come straight down
          with it. On the right, add. Five plus seven gives twelve. Slide six and four down beside it.
          Which two originals are inside that twelve?
        hold: 1.9
        visual_cues:
          - id: branch-a-move
            phrase: On the left, multiply
            targets:
              - branch-state-mechanism
            caption_boundary: true
            linger: 0.3
          - id: branch-a-result
            phrase: Six times four gives twenty-four
            targets:
              - branch-state-mechanism
            caption_boundary: true
            linger: 0.3
          - id: branch-b-move
            phrase: On the right, add
            targets:
              - branch-state-mechanism
            caption_boundary: true
            linger: 0.3
          - id: branch-b-result
            phrase: Five plus seven gives twelve
            targets:
              - branch-state-mechanism
            caption_boundary: true
            linger: 0.3
          - id: branch-a-carry
            phrase: The five and the seven come straight down
            targets:
              - branch-state-mechanism
            caption_boundary: true
            linger: 0.3
          - id: branch-b-carry
            phrase: Slide six and four down beside it
            targets:
              - branch-state-mechanism
            caption_boundary: true
            linger: 0.3
      - say: Follow the two lines back to five and seven. Each branch stores its remaining values, its parent and
          the move it made. A controller can replay that move before it spends time searching below it.
        hold: 0.8
        visual_cues:
          - id: branch-trace
            phrase: Follow the two lines back to five and seven
            targets:
              - branch-state-mechanism
            caption_boundary: true
            linger: 0.3
  - id: arithmetic-controller-contract
    title: Which next state belongs in the search?
    visual: Align the two proposed remaining lists with the three values the host computes. Admit the
      conserved transition, then fold two orders of independent additions into one search key.
    beats:
      - say: A proposal arrives with a multiplication and a list of what's left. The host starts with its own
          four numbers, takes out six and four, and puts their product back. Which of these two lists
          should the host admit for scoring?
        hold: 2.1
        visual_cues:
          - id: contract-replay
            phrase: takes out six and four, and puts their product back
            targets:
              - arithmetic-controller-contract-mechanism
            caption_boundary: true
            linger: 0.3
      - say: Admit the list with twenty-four, five and seven. Both proposals got the product right. Only the
          longer list accounts for the two untouched numbers. This check uses two available occurrences, an
          allowed operator and exact fractions. It rules out a dropped input or division by zero. A legal
          first move can still lead to a dead end.
        hold: 0.9
        visual_cues:
          - id: contract-verdict
            phrase: Admit the list with twenty-four, five and seven
            targets:
              - arithmetic-controller-contract-mechanism
