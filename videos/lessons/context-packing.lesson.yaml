version: 1
id: context-packing
title: Choosing What Fits in a Context Window
source: fundamentals/long-context-window-management/content.md
voice: en-US-AndrewNeural
rate: +0%
sources:
  - title: Lost in the Middle
    url: https://arxiv.org/abs/2307.03172
  - title: RULER, What is the real context size of your long-context language models
    url: https://arxiv.org/abs/2404.06654
  - title: RoFormer
    url: https://arxiv.org/abs/2104.09864
  - title: Position Interpolation
    url: https://arxiv.org/abs/2306.15595
  - title: YaRN
    url: https://arxiv.org/abs/2309.00071
  - title: StreamingLLM
    url: https://arxiv.org/abs/2309.17453
  - title: Ring Attention
    url: https://arxiv.org/abs/2310.01889
  - title: Grouped-query attention
    url: https://arxiv.org/abs/2305.13245
  - title: FlashAttention
    url: https://arxiv.org/abs/2205.14135
  - title: PagedAttention
    url: https://arxiv.org/abs/2309.06180
scenes:
  - id: intro
    title: Make room for the fact the answer needs
    visual: A rollback question, its source-labeled approval note and competing history packets approach a bounded
      context. The answer reserve stays visibly protected.
    beats:
      - say: >
          Somewhere in an earlier conversation, an incident lead approved a rollback. Now someone asks whether
          it was approved. We could keep adding the entire history, but the answer needs a particular fact and
          enough room to explain it. Choosing that working set is a concrete engineering decision.
        visual_cues:
          - id: source-approval
            phrase: incident lead approved a rollback
            targets:
              - intro-fact
            color: yellow
          - id: current-task
            phrase: asks whether it was approved
            targets:
              - intro-task
            color: cyan
        hold: 0.65
      - say: >
          A context window bounds the tokens a model can use in one request. Instructions, history, evidence,
          the current question, and generation all compete for that capacity. Our miniature example assigns
          token units to complete packets so we can inspect every decision without depending on a particular
          tokenizer.
        visual_cues:
          - id: context-capacity
            phrase: Instructions, history, evidence, the current question, and generation
            targets:
              - context-accounting
            color: blue
          - id: complete-packets
            phrase: complete packets
            targets:
              - protected-instructions
              - current-question
            color: yellow
        hold: 0.65
      - say: >-
          We will reserve the answer first, pack complete exchanges, and recover a needed older fact through
          checked compaction. Then we will test evidence placement and a question that requires complete
          counting. A request that fits is only the beginning of a useful answer.
           In the same film, we will derive long-context cost, extend position coordinates, inspect cache execution and judge a release across context depths.
        visual_cues:
          - id: answer-reserve
            phrase: reserve the answer first
            targets:
              - output-reserve
            color: pink
          - id: older-fact
            phrase: needed older fact
            targets:
              - intro-fact
            color: yellow
        hold: 0.65
  - id: budget
    title: Reserve mandatory input and the answer
    visual: A thirty-two-unit strip allocates eight output units, four instruction units and four question units,
      leaving sixteen for optional context. All counts come from one packet snapshot.
    beats:
      - say: >
          Start with thirty-two units of total capacity. Reserve eight for generation. This space remains
          unavailable to additional input even while it is empty. Otherwise the prompt could consume the
          entire window before the model has room to finish the response we requested.
        visual_cues:
          - id: context-limit
            phrase: thirty-two units of total capacity
            targets:
              - budget-field-grid
            color: blue
          - id: output-reservation
            phrase: Reserve eight for generation
            targets:
              - budget-8-reserved-output-units
            color: pink
        hold: 0.65
      - say: >
          Protect the instructions and latest question next. Each costs four units in this example. Their
          identities stay fixed as we add the allocations. The remaining sixteen units form the optional
          history budget. Production counting must include the actual chat template, tools, separators, and
          other input framing.
        visual_cues:
          - id: required-packets
            phrase: instructions and latest question
            targets:
              - protected-instructions
              - current-question
            color: blue
          - id: optional-history
            phrase: remaining sixteen units
            targets:
              - budget-16-units-remain-for-optional-input
            color: green
        hold: 0.65
      - say: >
          Keeping a reusable prefix can reduce computation while its tokens still occupy context. Storage and
          execution optimizations do different jobs from packing. Recount the finalized serialized request
          against its configured input and output limits before sending it to the model.
        visual_cues:
          - id: prefix-context
            phrase: tokens still occupy context
            targets:
              - protected-instructions
              - current-question
            color: blue
          - id: final-budget
            phrase: input and output limits
            targets:
              - budget-equation
            color: yellow
        hold: 0.65
  - id: complete-turns
    title: Pack complete exchanges from the recent end
    visual: Identified six-, eight- and twelve-unit exchanges move into a capacity strip newest first. The first
      two fit as whole units while the oldest remains outside, with the live used total updated after each
      decision.
    beats:
      - say: >
          Our newest completed exchange costs six units. Admit it as one piece, including both the question
          and its answer. The used budget updates from the selected packet itself. Keeping the pair together
          preserves what the answer refers to when the next model call reads it.
        visual_cues:
          - id: newest-exchange
            phrase: newest completed exchange costs six units
            targets:
              - recent-exchange-0
            color: green
          - id: admit-newest
            phrase: Admit it as one piece
            targets:
              - recent-exchange-0
              - context-accounting
              - complete-turns-readout-4
            color: yellow
        hold: 0.65
      - say: >
          The next exchange also fits, leaving a small unused remainder. A contiguous suffix of recent
          exchanges gives a simple, predictable policy. Tool conversations need richer atomic groups,
          including call identifiers and their results, so the packed transcript remains valid for the
          provider's message rules.
        visual_cues:
          - id: middle-exchange
            phrase: next exchange also fits
            targets:
              - recent-exchange-1
              - context-accounting
              - complete-turns-readout-4
            color: green
          - id: contiguous-history
            phrase: contiguous suffix of recent exchanges
            targets:
              - recent-exchanges
            color: blue
        hold: 0.65
      - say: >
          The oldest exchange would cross the limit, so leave that complete packet outside. Our policy stops
          at this boundary. Dropping a random message from the pair could preserve a misleading answer while
          losing its question. The token total closes, but we must still ask which useful facts were omitted.
        visual_cues:
          - id: oldest-excluded
            phrase: oldest exchange would cross the limit
            targets:
              - recent-exchange-2
              - context-accounting
              - complete-turns-readout-4
            color: pink
          - id: whole-packet
            phrase: leave that complete packet outside
            targets:
              - recent-exchange-2
              - complete-turns-readout-4
            color: pink
        hold: 0.7
  - id: overflow
    title: Required material can exceed the window
    visual: A larger mandatory instruction-and-question packet fails an actual input-plus-output check. The
      requested pair remains intact outside the context instead of being silently shortened.
    beats:
      - say: >
          Suppose the required instructions and current question are themselves too large. Keep the same
          answer reservation and calculate the total again. The mandatory material already crosses the window
          limit. Optional history has no role in repairing this particular request because none has been
          admitted yet.
        visual_cues:
          - id: mandatory-input
            phrase: required instructions and current question
            targets:
              - overflow-required-instructions-14-units
              - overflow-current-question-12-units
            color: blue
          - id: overflow-total
            phrase: mandatory material already crosses
            targets:
              - overflow-equation
            color: pink
        hold: 0.7
      - say: >
          The packer rejects the request explicitly. Both required packet identities remain visible, showing
          what failed to fit. The caller can revise the request, choose an appropriate larger tested budget,
          or split the task. Silent truncation would hide the decision from the person who needed that
          information preserved.
        visual_cues:
          - id: explicit-rejection
            phrase: packer rejects the request explicitly
            targets:
              - overflow-readout
            color: pink
          - id: preserved-required
            phrase: Both required packet identities remain visible
            targets:
              - overflow-required-instructions-14-units
              - overflow-current-question-12-units
            color: blue
        hold: 0.65
      - say: >
          Input acceptance and useful evidence handling need their own checks. A configured server cap may be
          smaller than the model's supported window, and separate output limits can also apply. Validate the
          limits of the actual execution path rather than assuming a model-card maximum settles every
          boundary.
        visual_cues:
          - id: configured-cap
            phrase: configured server cap
            targets:
              - overflow-equation
            color: yellow
          - id: execution-limits
            phrase: limits of the actual execution path
            targets:
              - overflow-readout
            color: pink
        hold: 0.65
  - id: compaction
    title: Preserve needed facts with their sources
    visual: The omitted old exchange contains source D1's approval. A draft note missing a required fact fails a
      computed coverage check; a corrected source-bound note passes and replaces optional history in the
      packed allocation.
    beats:
      - say: >
          The old exchange contains the approval we need. Instead of treating every old token as equally
          valuable, extract a smaller state note with the decision and its source. Our first draft leaves out
          the approving actor. Compare its fields with the facts the current question requires.
        visual_cues:
          - id: source-note
            phrase: decision and its source
            targets:
              - compaction-original-source-d1-approved-true-actor-incident-lead
            color: yellow
          - id: missing-actor
            phrase: first draft leaves out the approving actor
            targets:
              - note-actor
            color: pink
        hold: 0.7
      - say: >
          The missing field fails the coverage check. A corrected note retains approval, actor, and source
          identity, and the verifier compares those values with the original record. This deterministic
          fixture checks explicit fields. A real language summary also needs review for meaning, omissions,
          contradictions, and unsupported additions.
        visual_cues:
          - id: coverage-check
            phrase: missing field fails the coverage check
            targets:
              - compaction-readout-3
            color: pink
          - id: correct-note
            phrase: corrected note retains approval, actor, and source identity
            targets:
              - note-actor
              - note-source
            color: green
        hold: 0.7
      - say: >
          Give the needed note priority over an optional middle exchange. The new packing keeps the latest
          exchange and the checked older fact within the same budget. Preserve the original archive outside
          the prompt. A compact note can be useful while still requiring the source when a later question
          needs more detail.
        visual_cues:
          - id: needed-note
            phrase: needed note priority
            targets:
              - source-note
            color: yellow
          - id: retained-exchange
            phrase: latest exchange and the checked older fact
            targets:
              - recent-exchanges
              - source-note
            color: green
        hold: 0.7
  - id: cost-length
    title: Count the pairwise work before predicting latency
    visual: The same D1 token row unfolds into a causal pair grid; increasing length grows both grid axes while a
      separate cache column grows linearly.
    beats:
      - say: "Our approval note can fit while becoming expensive to read. During prefill, a full-attention layer
          compares each query position with the keys it may read. In a ten-token causal example, row one has
          one allowed pair and row ten has ten. Add the rows: fifty-five valid pairs, including each token
          with itself. These are pair counts, not measured milliseconds."
        hold: 0.8
        visual_cues:
          - id: cost-length-0
            phrase: During prefill
            targets:
              - cost-length-model
            color: cyan
      - say: Double a long sequence and both grid axes grow, giving roughly four times the full-attention score work.
          Moving from four thousand ninety-six to one hundred thirty-one thousand seventy-two tokens
          multiplies length by thirty-two and the leading quadratic term by one thousand twenty-four. The
          exact causal counts use n times n plus one, divided by two; their ratio is close to that
          leading-term estimate.
        hold: 0.8
        visual_cues:
          - id: cost-length-1
            phrase: both grid axes grow
            targets:
              - cost-length-model
            color: yellow
      - say: FlashAttention tiles the same attention calculation and reduces movement between GPU memory levels. It
          does not remove the full-attention pair pattern. During decode, one new query reads the retained
          prefix rather than rebuilding every old query row. Keep prefill work, decode traffic and cache
          residency as separate measurements.
        hold: 1
        visual_cues:
          - id: cost-length-2
            phrase: During decode
            targets:
              - cost-length-model
            color: green
  - id: cache-shape
    title: Build the cache from its independent axes
    visual: Two K/V slabs grow by token, KV head and layer; their exact byte volume becomes one request and then
      four identified requests.
    beats:
      - say: Build a hypothetical full-attention cache with eighty layers, eight key-value heads per layer, width one
          hundred twenty-eight, and two bytes per element. Every retained position needs both a key and a
          value. At one hundred thirty-one thousand seventy-two positions, multiply those independent axes to
          obtain forty gibibytes for one active sequence.
        hold: 0.8
        visual_cues:
          - id: cache-shape-0
            phrase: Every retained position needs both
            targets:
              - cache-shape-model
            color: cyan
      - say: Four independent sequences need one hundred sixty gibibytes of that logical payload. For comparison,
          seventy billion two-byte weights occupy about one hundred thirty gibibytes. These are binary cache
          units and an approximate weight reference. We have not allocated buffers or measured a particular
          GPU. Generated positions add to the cache, and metadata, workspace and headroom add to admission
          cost. During a dense decode step, every new query needs its retained keys and values. A logical
          read-volume estimate therefore resembles the residency formula. One long request reads forty
          gibibytes of logical KV, while four independent requests need one hundred sixty against an ideal
          shared weight read of about one hundred thirty. This can shift the bottleneck from weight traffic
          toward KV traffic. Actual HBM loads depend on on-chip reuse, repeated loads, kernel layout and
          sharding.
        hold: 0.8
        visual_cues:
          - id: cache-shape-1
            phrase: Four independent sequences
            targets:
              - cache-shape-model
            color: yellow
      - say: Keep sixty-four query heads but replace eight KV heads with sixty-four. The cache grows eightfold to
          three hundred twenty gibibytes per sequence. Sharing eight KV heads across query groups is
          grouped-query attention. Sharing one KV set is multi-query attention. These are trained architecture
          choices or evaluated conversions, and the memory ratio alone predicts neither quality nor speed.
        hold: 1
        visual_cues:
          - id: cache-shape-2
            phrase: The cache grows eightfold
            targets:
              - cache-shape-model
            color: green
  - id: mixed-layers
    title: Add each layer’s retained state
    visual: Forty local layer strips stop growing at a marked window while eight full layer strips continue; K and
      V stay separate.
    beats:
      - say: "One uniform formula cannot describe every checkpoint. Use a supplied mixed-layer fixture: forty local
          layers retain at most one thousand twenty-four positions, with eight KV heads of width two hundred
          fifty-six. Eight full layers retain the entire one hundred thirty-one thousand seventy-two
          positions, with one KV head of width five hundred twelve. Assume separate two-byte key and value
          arrays and actual eviction in the local layers."
        hold: 0.8
        visual_cues:
          - id: mixed-layers-0
            phrase: Use a supplied mixed-layer fixture
            targets:
              - mixed-layers-model
            color: cyan
      - say: The local term is point three one two five gibibytes; the full term is two gibibytes. Add them to get two
          point three one two five gibibytes. Applying the local head shape and full context to every layer
          would instead report forty-eight gibibytes. A visibility mask alone does not prove eviction. Inspect
          the backend’s real retained buffers before counting the smaller storage term.
        hold: 0.8
        visual_cues:
          - id: mixed-layers-1
            phrase: Add them to get
            targets:
              - mixed-layers-model
            color: yellow
      - say: A shared projection does not automatically make key and value buffers identical. Different
          transformations may produce separate states. Multi-head latent attention uses a compressed latent
          and positional-key state, requiring its own trained architecture and accounting. Recurrent layers
          need their recurrent state added separately. Sum the actual retained representation for each layer
          before distributing it across devices.
        hold: 1
        visual_cues:
          - id: mixed-layers-2
            phrase: Sum the actual retained representation
            targets:
              - mixed-layers-model
            color: green
  - id: local-visibility
    title: Watch the distant fact lose its direct edge
    visual: The ten-position grid becomes a width-four band; Q9-to-D1 closes, and preserved sink positions are
      shown as stability anchors rather than recovered evidence.
    beats:
      - say: "A sliding window changes which pairs exist. Keep the same ten positions but allow at most four keys per
          query, including the query itself. The row counts are one, two, three and then four for each later
          row: thirty-four pairs. The last query can no longer read our early approval directly in this
          layer."
        hold: 0.8
        visual_cues:
          - id: local-visibility-0
            phrase: A sliding window changes
            targets:
              - local-visibility-model
            color: cyan
      - say: At long lengths, a fixed window changes the leading attention work toward length times window width.
          Stacked local layers can propagate information farther, while occasional global layers provide
          direct long-range paths. That does not guarantee recovery of every old detail. Local continuation
          can fit this trade; forensic questions requiring a particular distant record need a tested global or
          retrieval path.
        hold: 0.8
        visual_cues:
          - id: local-visibility-1
            phrase: Stacked local layers
            targets:
              - local-visibility-model
            color: yellow
      - say: In the StreamingLLM experiments, initial attention-sink tokens attracted attention even without useful
          semantic content. Keeping a few initial KV entries alongside recent tokens improved streaming
          stability for the evaluated models. The sink entries do not restore every evicted fact. Keep
          stability and distant-record retrieval as different tests.
        hold: 1
        visual_cues:
          - id: local-visibility-2
            phrase: The sink entries do not restore
            targets:
              - local-visibility-model
            color: green
  - id: position-dials
    title: Extend the position coordinate carefully
    visual: Paired query/key dimensions become rotating dials; uniform interpolation compresses every angular step
      before a frequency-by-parts profile preserves fast bands.
    beats:
      - say: Rotary position embeddings rotate pairs of query and key head dimensions. Each pair has its own angular
          frequency. At position m, its angle is m times that frequency. Comparing the rotated query and key
          exposes their relative offset. These periodic dials are not unique position identifiers, and they do
          not rotate the whole residual token embedding.
        hold: 0.8
        visual_cues:
          - id: position-dials-0
            phrase: rotate pairs of query and key head dimensions
            targets:
              - position-dials-model
            color: cyan
      - say: Uniform position interpolation maps an extended coordinate to position times training length divided by
          target length. With a supplied training length of four thousand ninety-six and target length
          thirty-two thousand seven hundred sixty-eight, position sixteen thousand three hundred eighty-four
          maps to two thousand forty-eight. Every frequency band gets the same one-eighth angular step,
          reducing local resolution as well as extending the coordinate range.
        hold: 0.8
        visual_cues:
          - id: position-dials-1
            phrase: maps to two thousand forty-eight
            targets:
              - position-dials-model
            color: yellow
      - say: "NTK-aware scaling changes the frequency compromise rather than uniformly shrinking every band. YaRN uses
          a frequency-by-parts treatment: preserve high-frequency steps, interpolate low frequencies fully,
          and ramp between them. It also applies attention-logit scaling, which is separate from the output
          sampler’s temperature. A compatible configuration still needs training or evaluation and does not
          itself raise server limits or establish long-context quality."
        hold: 1
        visual_cues:
          - id: position-dials-2
            phrase: preserve high-frequency steps
            targets:
              - position-dials-model
            color: green
  - id: basis-consistency
    title: Repair the cached key in the same coordinate frame
    visual: The same query and cached key rotate on one unit circle; a stale basis makes an erroneous perfect
      alignment, and rerotation restores the intended score.
    beats:
      - say: A changing frequency basis can make old cached keys inconsistent with new queries. Use two unit vectors
          in a toy two-dimensional pair. The key is at position one and was cached with frequency one, so its
          angle is one radian. The new query is at position two with frequency one half, also giving one
          radian. Their stale-basis dot product is one.
        hold: 0.8
        visual_cues:
          - id: basis-consistency-0
            phrase: A changing frequency basis
            targets:
              - basis-consistency-model
            color: cyan
      - say: If the intended current basis uses one half for both positions, the key belongs at one half radian.
          Re-rotate that same key while leaving the query fixed. Their angular difference becomes one half
          radian and the dot product becomes cosine of one half, about point eight seven eight. This is an
          arithmetic counterexample, not a claim that a named library has this defect.
        hold: 0.8
        visual_cues:
          - id: basis-consistency-1
            phrase: Re-rotate that same key
            targets:
              - basis-consistency-model
            color: yellow
      - say: Implementations may freeze a basis, retain unrotated keys, or manage transitions another way. Compare
          cached and equivalent uncached execution across length boundaries. Invalidate incompatible execution
          state when changing position configuration. A test that only accepts the longer prompt cannot detect
          this disagreement.
        hold: 1
        visual_cues:
          - id: basis-consistency-2
            phrase: Compare cached and equivalent uncached execution
            targets:
              - basis-consistency-model
            color: green
  - id: cache-execution
    title: Separate smaller state from less wasted work
    visual: Four request volumes fill a cache budget; precision shrinks payload, pages fill holes, and exact
      shared prefix blocks remain while suffixes append.
    beats:
      - say: Return to the forty-gibibyte full-attention payload. A supported one-byte cache representation halves
          that raw term to twenty gibibytes. In a hypothetical sixty-four-gibibyte cache budget, one
          forty-gibibyte request fits, while three twenty-gibibyte requests fit. Those divisions are payload
          upper bounds. Quantization scales, rounding to pages, future output and runtime headroom reduce
          usable capacity, and long-depth quality must be tested.
        hold: 0.8
        visual_cues:
          - id: cache-execution-0
            phrase: halves that raw term to twenty gibibytes
            targets:
              - cache-execution-model
            color: cyan
      - say: PagedAttention allocates noncontiguous blocks as requests grow and finish. Filling reusable blocks
          reduces reservation and fragmentation waste; it does not change the model’s intrinsic bytes per
          retained position. Prefix reuse addresses repeated prefill. Three sequential requests sharing
          exactly forty-eight thousand prefix tokens and suffixes eight hundred, twelve hundred and six
          hundred process one hundred forty-six thousand six hundred prompt tokens without reuse, versus fifty
          thousand six hundred newly prefilling tokens with the retained prefix.
        hold: 0.8
        visual_cues:
          - id: cache-execution-1
            phrase: Prefix reuse addresses repeated prefill
            targets:
              - cache-execution-model
            color: yellow
          - id: cp-prefix-before-count
            phrase: one hundred forty-six thousand six hundred prompt tokens without reuse
            targets:
              - cache-execution-model
            color: yellow
            linger: 0.4
          - id: cp-prefix-reused-count
            phrase: versus fifty thousand six hundred newly prefilling tokens with the retained prefix
            targets:
              - cache-execution-model
            color: cyan
            linger: 0.5
      - say: All three requests still attend to their prefix during decode. Matching tokens and relevant cache
          identity, isolation and adapter state must agree; an early token change invalidates downstream
          matches, and eviction can remove the hit. Keep durable conversation records separately. Chunked
          prefill interleaves long ingestion with ongoing decode work; it changes scheduling and first-token
          delay rather than deleting evidence or increasing the supported window.
        hold: 1
        visual_cues:
          - id: cache-execution-2
            phrase: All three requests still attend
            targets:
              - cache-execution-model
            color: green
          - id: cp-prefix-invalidate
            phrase: an early token change invalidates downstream matches
            targets:
              - cache-execution-model
            color: pink
            linger: 0.4
  - id: distributed-context
    title: Let each query receive the remote keys it needs
    visual: Four ranks retain distinct token blocks; keys circulate around stationary query owners, then logical
      block rounding is constructed from physical groups.
    beats:
      - say: When one sequence spans devices, local queries may still need remote keys and values for global
          attention. Ring Attention partitions blockwise work and overlaps KV-block communication with
          computation in its evaluated distributed-training setting. Watch each query owner receive the remote
          blocks it needs. Communication remains a cost, and the paper does not establish a drop-in serving
          switch or linear speedup with device count.
        hold: 0.8
        visual_cues:
          - id: distributed-context-0
            phrase: one sequence spans devices
            targets:
              - distributed-context-model
            color: cyan
      - say: A compatible decode context-parallel backend may shard token history within existing tensor-parallel
          ranks, using a different communication scheme from training. Supported architectures, head
          replication, phase and backend determine per-device residency. Measure prefill and decode separately
          rather than assuming every token sends the entire cache around a ring.
        hold: 0.8
        visual_cues:
          - id: distributed-context-1
            phrase: shard token history
            targets:
              - distributed-context-model
            color: yellow
      - say: Physical page size and a distributed logical attention grid can differ. In a supplied four-way example,
          four physical groups of sixteen positions form one sixty-four-position logical block. A
          one-thousand-twenty-five-token history therefore needs seventeen logical blocks covering one
          thousand eighty-eight positions. Rounding only by sixteen gives one thousand forty positions on the
          wrong grid. Use the backend’s reported actual grid and leave unavailable metadata unknown.
        hold: 1
        visual_cues:
          - id: distributed-context-2
            phrase: seventeen logical blocks
            targets:
              - distributed-context-model
            color: green
  - id: placement
    title: Test where evidence remains reachable
    visual: A known two-token needle moves from the head to middle to tail of a fixed-size document. A real
      limited reader scans only the first and last four positions, and its pass/fail derives from containment.
    beats:
      - say: >
          Presence in the prompt does not establish reliable use. To test an evaluation harness, place a known
          fact at the beginning of a bounded document. Our deliberately limited reader scans only four
          positions at each edge. It finds this first placement because the fact lies within its visible
          slice.
        visual_cues:
          - id: initial-fact
            phrase: fact at the beginning
            targets:
              - placement-99-98
            color: yellow
          - id: limited-reader
            phrase: four positions at each edge
            targets:
              - placement-field-grid
            color: blue
        hold: 0.65
      - say: >
          Move the same fact to the middle while preserving length and answer headroom. The full scan still
          finds it, while the limited reader misses. That result comes from executing the reader on the packed
          sequence. It illustrates the test mechanism rather than assigning a quality score to a language
          model.
        visual_cues:
          - id: move-fact
            phrase: Move the same fact to the middle
            targets:
              - placement-99-98
            color: yellow
          - id: edge-miss
            phrase: limited reader misses
            targets:
              - placement-readout-3
            color: pink
        hold: 0.7
      - say: >
          The tail placement becomes reachable again. Real evaluations should vary lengths, positions,
          distractors, and required combinations of facts, with absent-fact controls. Some models and tasks
          show position sensitivity. Test your own model before adopting an edge-focused layout or assuming
          every accepted position is equally effective.
        visual_cues:
          - id: tail-position
            phrase: tail placement becomes reachable again
            targets:
              - placement-99-98
            color: yellow
          - id: test-reader
            phrase: positions, distractors, and required combinations of facts
            targets:
              - placement-readout-2
              - placement-readout-3
            color: blue
        hold: 0.65
  - id: exact-counts
    title: Some questions need the complete qualifying set
    visual: Actual timestamped records are filtered for March timeouts. Top-two ranking gives A two events, then
      complete aggregation reveals B's three events and changes the winner with row IDs retained.
    beats:
      - say: >
          Now ask which service had the most timeout events in March. The two highest-ranked matching rows
          both name service A. Counting only those retrieved rows makes A look like the winner. A relevance
          ranking decides which evidence looks promising, while this question requires all qualifying events.
        visual_cues:
          - id: ranked-rows
            phrase: two highest-ranked matching rows
            targets:
              - counted-records
            color: blue
          - id: partial-winner
            phrase: makes A look like the winner
            targets:
              - exact-counts-readout-4
            color: yellow
        hold: 0.7
      - say: >
          Filter the complete miniature dataset by month and event type, then aggregate in code. Three
          additional qualifying rows belong to B, which changes the result. The excluded month and success row
          remain visible so we can inspect the population that the count actually represents.
        visual_cues:
          - id: complete-filter
            phrase: Filter the complete miniature dataset by month and event type
            targets:
              - counted-records
            color: blue
          - id: exact-result
            phrase: Three additional qualifying rows belong to B
            targets:
              - exact-counts-readout-3
            color: green
        hold: 0.7
        motion_check:
          region:
            - 140
            - 340
            - 1660
            - 650
          minimumChangedFraction: 0.002
      - say: >
          Send the model the checked aggregate and its provenance to explain. At scale, define event identity,
          deduplication, time boundaries, and a data watermark before counting. Increasing a top-k value
          cannot establish completeness unless every qualifying record is included in the counted set.
        visual_cues:
          - id: checked-aggregate
            phrase: checked aggregate and its provenance
            targets:
              - exact-counts-readout-3
            color: green
          - id: counted-population
            phrase: every qualifying record
            targets:
              - counted-records
            color: blue
        hold: 0.65
  - id: evidence-route
    title: Choose the evidence path for the question
    visual: The persistent D1 approval retains its source anchor across a full packet, retrieved snippets and
      chunk aggregation; omitted evidence never reaches generation.
    beats:
      - say: A bounded stable document is a useful full-context baseline when the question needs relationships across
          the packet. A targeted lookup over a large changing archive can retrieve a smaller candidate set
          first. Retrieval adds work and may omit the required source; full context pays for a larger prefill
          and may miss evidence already present. Neither path supplies freshness or citations automatically.
          Preserve source IDs and versions.
        hold: 0.8
        visual_cues:
          - id: evidence-route-0
            phrase: A bounded stable document
            targets:
              - evidence-route-model
            color: cyan
      - say: Place a must-keep source excerpt near the evidence head or near the question only when paired tests
          support that layout. Duplication consumes tokens and can amplify stale contradictions. Keep
          retrieved and summarized text as evidence, not privileged instructions. Chunked document processing
          needs an aggregation step that preserves the facts required by the final question; inspect coverage
          before accepting the combined answer.
        hold: 0.8
        visual_cues:
          - id: evidence-route-1
            phrase: Keep retrieved and summarized text as evidence
            targets:
              - evidence-route-model
            color: yellow
      - say: For an exact count, use the complete qualifying population, as our March timeout example did. For
          semantic synthesis, retrieved or chunked evidence can work when the needed facts and their
          relationships survive. Decide which evidence must be complete before choosing a context strategy. A
          larger top-k is a larger candidate buffer, not proof of complete data.
        hold: 1
        visual_cues:
          - id: evidence-route-2
            phrase: Decide which evidence must be complete
            targets:
              - evidence-route-model
            color: green
  - id: release-slices
    title: Hold every important depth to its own gate
    visual: Measured-case slots remain separate from an explicitly synthetic three-depth receipt; equal averages
      conceal a failed middle column until the binding gate is applied.
    beats:
      - say: Needle-in-a-haystack tests place a known fact at controlled depths and ask for it. Sweep actual packed
          lengths, depths and distractor seeds while reserving answer space. Record source identity, expected
          answer, generated answer and scorer result. Include absent-fact controls. Our edge reader is a
          deterministic harness example, not a measured language model.
        hold: 0.8
        visual_cues:
          - id: release-slices-0
            phrase: Sweep actual packed lengths
            targets:
              - release-slices-model
            color: cyan
      - say: One fact does not test every long-context capability. Add multiple needles, multi-hop tracing and
          aggregation as RULER does. Check next-token loss by sequence length for a discontinuity beyond the
          training range. Length sensitivity and a weak middle position are separate effects; a model may show
          either. Measure first-token delay, decode latency, peak state and concurrency on the actual
          execution path.
        hold: 0.8
        visual_cues:
          - id: release-slices-1
            phrase: Add multiple needles
            targets:
              - release-slices-model
            color: yellow
      - say: An average can hide the failure. In a supplied receipt with one hundred cases at each of three depths,
          baseline scores are ninety, ninety and ninety percent. Candidate scores are one hundred, seventy and
          one hundred. Both average ninety percent, but the candidate fails a declared eighty-five-percent
          middle-depth floor. These synthetic counts are not model results or confidence intervals. Keep
          paired outcomes, sample sizes and uncertainty when making the real decision.
        hold: 1
        visual_cues:
          - id: release-slices-2
            phrase: Both average ninety percent
            targets:
              - release-slices-model
            color: green
  - id: synthesis
    title: Evaluate fit, coverage and use separately
    visual: The final thirty-two-unit allocation shows mandatory input, the checked note, the latest exchange and
      answer reserve. Computed totals and required-source coverage remain visible beside it.
    beats:
      - say: >
          Our final request fits and retains the approval with its source. That result required more than
          dropping the oldest text. We protected the current task, reserved generation, preserved transcript
          units, and gave a needed older fact priority over optional recent material.
        visual_cues:
          - id: retained-fact
            phrase: retains the approval with its source
            targets:
              - synthesis-d1-approved-by-incident-lead
            color: yellow
          - id: protected-generation
            phrase: reserved generation
            targets:
              - output-reserve
            color: pink
        hold: 0.65
      - say: >
          Test the resulting policy on the questions it must answer. Check required facts and sources, measure
          behavior across context positions, and include synthesis tasks. A smaller prompt can remove
          distractions while also removing evidence, so compare paired cases before accepting the change.
        visual_cues:
          - id: required-evidence
            phrase: required facts and sources
            targets:
              - source-note
            color: yellow
          - id: paired-policy
            phrase: compare paired cases
            targets:
              - recent-exchanges
            color: blue
        hold: 0.65
      - say: >
          The useful question is what information this next decision needs and how it will reach the model.
          Sometimes that means complete recent exchanges, sometimes a source-bound note, and sometimes an
          exact aggregate. Context packing turns those choices into a request whose contents and limits you
          can inspect.
        visual_cues:
          - id: source-bound-note
            phrase: source-bound note
            targets:
              - source-note
            color: yellow
          - id: inspectable-request
            phrase: contents and limits
            targets:
              - context-accounting
            color: green
        hold: 0.8
  - id: your-turn
    title: Use the budget and protect the approval
    visual: A fresh forty-unit capacity admits a source-bound approval note and current exchange, then a changed
      actor question requires opening the same archive source.
    beats:
      - say: Try a fresh request with forty units total, twelve reserved for generation, six for instructions and two
          for the current question. How much optional input remains? Twenty units. A six-unit checked approval
          note and an eight-unit recent exchange use fourteen of those units. The complete request uses
          thirty-four and leaves six spare. Predict whether another nine-unit exchange fits before it
          approaches the window.
        hold: 1.5
        visual_cues:
          - id: your-turn-0
            phrase: How much optional input remains
            targets:
              - your-turn-model
            color: cyan
      - say: It would raise the total to forty-three, so reject that complete exchange. Now the question asks why the
          rollback was approved. The note preserves approval, actor and source but not the cause. Spare
          capacity cannot manufacture that missing fact. Follow D1 back to the archive, retrieve the relevant
          source span, verify its version and recount before generation.
        hold: 0.8
        visual_cues:
          - id: your-turn-1
            phrase: It would raise the total to forty-three
            targets:
              - your-turn-model
            color: yellow
      - say: You can now distinguish a fitting prompt from usable evidence and affordable execution. Preserve source
          meaning through packing, match position and cache state to the architecture, and test the depths and
          joint tasks users need. The next lesson changes feed-forward work through expert routing, while
          these attention and cache budgets still apply.
        hold: 1
        visual_cues:
          - id: your-turn-2
            phrase: You can now distinguish
            targets:
              - your-turn-model
            color: green
