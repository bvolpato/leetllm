      - say: A reference implementation may repeat compact K and V along the head dimension before calling attention. Materializing eight KV heads as thirty-two query-head copies creates a larger temporary working set even if persistent cache stays compact. Native grouped kernels can accept distinct query and KV counts. Check the dispatched FlashAttention or FlashInfer backend, peak allocations and traffic; the API signature alone does not prove that a particular call avoids materialization.
