    title: Repair the latest query visibility on the same cache
    visual: Hold zero scores and values1,2,9 fixed, compare upper-left one-row visibility with the correct complete prefix, then construct two chunk boundaries.
    beats:
      - say: Hold all scores at zero and cached values one, two and nine. The latest query is at absolute position two, so all three values are valid. PyTorch SDPA uses upper-left alignment when is-causal is true on a non-square matrix. One query row then exposes only key zero and returns one. This is a mask error, not a failure of shared K and V.
