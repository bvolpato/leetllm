    title: Keep position dependence out of the reusable content query
    visual: Apply two different historical rotations to the same key up-projection; show scores5 and−2 and the two required absorbed queries before decoupling.
    beats:
      - say: Rotary position encoding is linear at a fixed position. Matrix multiplication remains associative. The difficulty is that a rotation applied to each expanded historical key depends on that cached position. Absorbing it gives up-projection transpose times key-rotation transpose times the rotated current query. That absorbed query now changes for every historical position, so it cannot be reused once across the history.
