            linger: 0.5
      - say: "Keep the previous two-dimensional projection, latent and query. With identity rotation at cached position zero, the score is five and the absorbed query is one, two. Rotate the expanded key by ninety degrees at a different cached position: five, two becomes minus two, five, and the score becomes minus two. The corresponding absorbed query is zero, minus one. Regrouping is correct at both positions, but a single shared content query cannot produce both scores."
