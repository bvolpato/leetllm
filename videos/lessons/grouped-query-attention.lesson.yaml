  - id: kernel-route
    title: Read compact storage without repeating every head
    visual: Map every query to floor(index/group-size), compute its own score, and contrast compact persistent cache with temporary reference expansion.
    beats:
      - say: A native grouped computation can map query index i to floor of i divided by queries per group. With eight queries and two KV groups, indices zero through three read KV-zero and four through seven KV-one. In a supplied one-position dot-product fixture, queries one through eight on the first coordinate meet group keys one and ten. Their raw scores are one, two, three, four, fifty, sixty, seventy and eighty. Shared storage has not merged the query results.
