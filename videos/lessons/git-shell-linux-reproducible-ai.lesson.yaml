  - id: environment-contract
    title: A setup return value controls the dependent run
    visual: A selected Python executable flows into a new venv, then a complete dependency contract. A
      failing interpreter probe returns through the sourced script and prevents repro.sh; a later
      success reconstructs the environment.
    beats:
      - say: Follow the selected interpreter into a new virtual environment. Dot python version suggests a
          release to version managers; it does not install or enforce that release itself. This lab
          checks Python three point twelve or newer and exports the environment’s interpreter for
          the scorer. Virtual environments can embed absolute interpreter paths, so rebuild them at
          the destination instead of copying a laptop directory.
        hold: 0.9
        visual_cues:
          - id: interpreter-contract
            phrase: exports the environment’s interpreter
            targets:
              - selected-interpreter
            color: cyan
            linger: 0.5
          - id: venv-rebuild
            phrase: rebuild them at the destination
            targets:
              - selected-interpreter
            color: cyan
            linger: 0.4
      - say: For packages, choose a complete dependency contract. A uv project carries its project
          declaration and lockfile; sync locked refuses an out-of-date lock instead of rewriting it.
          With pip’s require hashes mode, pin and hash all direct and transitive requirements and
          accept the intended artifacts. Package constraints still leave the operating system,
          driver and system libraries as host inputs.
        hold: 0.9
        visual_cues:
          - id: locked-dependencies
            phrase: all direct and transitive requirements
            targets:
              - dependency-closure
            color: cyan
            linger: 0.5
          - id: uv-locked
            phrase: refuses an out-of-date lock
            targets:
              - dependency-closure
            color: cyan
            linger: 0.4
      - say: Our activation file is sourced into the caller. Its helper checks each important step; the
          outer conditional preserves a failure through cleanup and returns it. In the executed
          missing-interpreter trial, source returns one, so the following and-and evaluation never
          starts. Loading a dot env file as shell source would execute its contents. This setup
          leaves real secrets local and loads none for the scorer.
        hold: 0.9
        visual_cues:
          - id: activation-failure
            phrase: the following and-and evaluation never starts
            targets:
              - activation-dependent-run
            color: cyan
            linger: 0.5
  - id: device-contract
    title: A GPU visibility mask changes application numbering
    visual: A declared three-device host maps physical devices through a CUDA_VISIBLE_DEVICES list into
      application-local indices. Empty versus unset masks produce distinct visible sets; driver and
      framework checks remain separate.
    beats:
      - say: A GPU diagnosis needs more than one observation. NVIDIA’s process and device listing describes
          its driver view; the framework reports what that application can use. In a supplied host
          with devices zero, one and two, set the CUDA visibility list to two comma zero.
          Application device zero now names physical device two, and application device one names
          physical device zero.
        hold: 0.9
        visual_cues:
          - id: mask-device-map
            phrase: Application device zero now names physical device two
            targets:
              - device-enumeration
            color: cyan
            linger: 0.5
          - id: mask-second-device
            phrase: application device one names physical device zero
            targets:
              - device-enumeration
            color: cyan
            linger: 0.4
      - say: Set the mask to an empty string and no CUDA devices are visible to that application. Unset
          normally leaves available devices unmasked. Neither choice installs a driver, exposes a
          device missing from a container, or repairs incompatible framework binaries. Record the
          mask, driver view, interpreter and framework probe together. Diagnose an unavailable
          device separately from a missing Python package.
        hold: 0.9
        visual_cues:
          - id: empty-device-mask
            phrase: no CUDA devices are visible
            targets:
              - device-empty-mask
            color: cyan
            linger: 0.5
          - id: device-probe-boundary
            phrase: framework probe together
            targets:
              - device-evidence
            color: cyan
            linger: 0.5
          - id: unset-device-mask
            phrase: Unset normally leaves available devices unmasked
            targets:
              - device-empty-mask
            color: cyan
            linger: 0.4
  - id: lfs-contract
    title: A pointer and its required object are separate inputs
    visual: A computed small binary fixture has a real SHA-256 and byte size. A Git LFS pointer occupies
      the commit lane while the separate payload occupies object storage; missing payload prevents
      model input admission.
    beats:
      - say: For a large artifact that genuinely belongs in version control, Git L F S records a pointer
          while object storage carries the payload. The pointer identifies its object by digest and
          size. A checkout can leave pointer text when the L F S tool or object is missing, or
          smudging was skipped. Fetch the required object and check it arrived before claiming the
          model input is available. Our actual article run found no L F S tool and safely committed
          no weights.
        hold: 0.9
        visual_cues:
          - id: lfs-pointer-object
            phrase: digest and size
            targets:
              - lfs-object-binding
            color: cyan
            linger: 0.5
          - id: lfs-missing-object
            phrase: pointer text
            targets:
              - lfs-object-state
            color: cyan
            linger: 0.5
          - id: lfs-no-tool
            phrase: safely committed no weights
            targets:
              - lfs-object-state
            color: cyan
            linger: 0.4
      - say: Keep the tracking attributes committed and selected artifact patterns out of ignore rules. A
          model path hidden by an ignore pattern will not enter an ordinary add merely because an L
          F S pattern names it. Generated checkpoints can stay local; large changing datasets can
          use an external versioned manifest. Choose storage deliberately, then include every
          required nonsecret input in the clone’s setup contract.
        hold: 0.9
        visual_cues:
          - id: lfs-ignore-conflict
            phrase: will not enter an ordinary add
            targets:
              - lfs-selection
            color: cyan
            linger: 0.5
          - id: lfs-artifact-selection
            phrase: include every required nonsecret input
            targets:
              - lfs-selection
            color: cyan
            linger: 0.4
