            color: green
            linger: 0.5
      - say: >
          Send TERM to your identified evaluation job. Our loop handles that request, writes a final
          log line, and exits during the bounded wait. Wait then collects its exit status. The
          request and the completed shutdown are separate events; allow the program time to finish
          its cleanup.
        hold: 0.9
        visual_cues:
          - id: send-term
            phrase: Send TERM
            targets:
              - shutdown-action
            color: yellow
            linger: 0.4
