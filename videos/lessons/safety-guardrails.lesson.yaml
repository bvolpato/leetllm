              - blocked-precision
            linger: 0.3
            caption_boundary: true
  - id: prevalence-shift
    title: The blocked pool depends on how common harm is
    visual: The same false-positive and true-positive rates act on a changed labeled population; equal-unit
      blocked bars expose the precision consequence.
    beats:
      - say: Keep the detector’s error rates fixed and change the traffic. In one hundred thousand requests,
          suppose just a hundred are harmful. One percent of the safe requests and ninety percent of the
          harmful ones get blocked. That puts nine hundred ninety-nine safe and ninety harmful requests in
          the review queue. Divide safe blocks by harmful blocks. That’s eleven point one false alarms for
          each harmful request we catch.
        hold: 0.75
        visual_cues:
          - id: prevalence-shift-population
            phrase: one hundred thousand requests
            targets:
              - prevalence-population
            linger: 0.45
          - id: prevalence-shift-counts
            phrase: nine hundred ninety-nine safe and ninety harmful
            targets:
              - prevalence-blocked
            linger: 0.45
          - id: prevalence-shift-ratio
            phrase: eleven point one
            targets:
              - prevalence-ratio
            linger: 0.45
      - say: If you review this queue, most of your time goes to safe requests. To measure precision, count
          how many blocked requests are harmful. Divide by the total number of requests in the queue. For the
          false-positive rate, start with all labeled safe requests. For the false-negative rate, start with all labeled
          harmful requests. Appeals can flag mistakes. Estimate those rates from a representative sample of
          both blocked and allowed traffic, and track the cost and latency of each check.
        hold: 0.75
        visual_cues:
          - id: prevalence-shift-denominators
            phrase: start with all labeled safe requests
            targets:
              - prevalence-metrics
            linger: 0.45
  - id: decision-records
    title: Two receipts for the same draft
    visual: Two read-only requests generate the same draft. One reaches chat after review. The other times
      out and sends a fallback. Its receipt records the boundary decision.
    beats:
      - say: In this example, two engineers ask whether the tests passed. Each request generates the same
          private draft. For the first request, the required output check passes in eighteen
          milliseconds. The reviewed reply reaches chat.
        hold: 0.8
        visual_cues:
          - id: record-first
            phrase: passes in eighteen milliseconds
            targets:
              - trace-pass
            linger: 0.3
            caption_boundary: true
          - id: record-deliver
            phrase: reviewed reply reaches chat
            targets:
              - trace-pass
            linger: 0.3
            caption_boundary: true
      - say: Run the second request with the same draft. This time the required check times out at fifty
          milliseconds. Look at the empty chat on that row. What should the host send?
        hold: 2.05
        visual_cues:
          - id: record-timeout
            phrase: times out at fifty milliseconds
            targets:
              - trace-timeout
            linger: 0.3
            caption_boundary: true
          - id: record-ask
            phrase: What should the host send
            targets:
              - trace-timeout
              - decision-event
            linger: 0.3
            caption_boundary: true
      - say: Send the reviewed fallback. “Review unavailable. Try again.” The draft stays private. A missing
          score or detector error also leaves a required check unfinished. A required authorization
          failure before dispatch keeps the tool idle.
        hold: 0.8
        visual_cues:
          - id: record-fallback
            phrase: Review unavailable. Try again
            targets:
              - trace-timeout
            linger: 0.3
            caption_boundary: true
      - say: Save the second receipt. Its trace ID, policy revision, detector version, outcome, timing and
          delivery decision explain what happened. Both engineers asked the same question. A prompt hash
          would link their records. Store the fields needed for this investigation under its access and
          retention rules.
        hold: 0.8
        visual_cues:
          - id: record-save
            phrase: Save the second receipt
            targets:
              - decision-event
            linger: 0.3
            caption_boundary: true
  - id: fallback-policy
    title: Return a scoped alternative without leaking a private draft
    visual: A required-check failure retains the draft locally while a reviewed fallback offers an admitted
      read-only action.
    beats:
      - say: Graceful degradation follows the declared consequence policy. A benign request can receive a bounded
          explanation that a required check is unavailable, or an admitted read-only alternative. Do not
          reveal the private draft, exact evasion thresholds or credentials while explaining a refusal. A
          deployment remains held until its required authorization succeeds.
        hold: 0.75
        visual_cues:
          - id: fallback-policy-fallback
            phrase: admitted read-only alternative
            targets:
              - fallback-text
            linger: 0.45
          - id: fallback-policy-held
            phrase: deployment remains held
            targets:
              - fallback-effect
            linger: 0.45
      - say: Test missing scores, timeouts, bad schemas, stale approvals, injected observations, quoted attacks,
          unsupported facts and formatting variants. Include both unsafe requests that slip through and safe
          requests that are overblocked. Preserve the real failure evidence and repair the relevant boundary
          instead of silently disabling its required check to improve a latency or block-rate number.
        hold: 0.75
        visual_cues:
          - id: fallback-policy-cases
            phrase: both unsafe requests
            targets:
              - fallback-tests
            linger: 0.45
          - id: fallback-policy-repair
            phrase: repair the relevant boundary
            targets:
              - fallback-repair
            linger: 0.45
  - id: governance-logs
    title: An audit record has a purpose and a retention boundary
    visual: The incident note produces a three-field event. Two sample request IDs give the same hash for
      the same test question. The retention rule is scoped to the article’s dated high-risk example.
    beats:
      - say: Return to the incident note. The article’s log stores the host’s trace ID, the decision to allow
          the redacted note, and the policy version. An investigator can add detector versions and
          needed stage timings under the access rules for that purpose. Now consider our two engineers.
          Hash their identical question and you get the same digest twice. Someone who can guess the
          question can also check the guess. Limit access and set retention for those records too.
        hold: 0.8
        visual_cues:
          - id: governance-logs-record
            phrase: the decision to allow the redacted note, and the policy version
            targets:
              - governance-event
            linger: 0.3
            caption_boundary: true
          - id: governance-logs-hash
            phrase: Hash their identical question and you get the same digest twice
            targets:
              - governance-hash
            linger: 0.3
            caption_boundary: true
      - say: How long should a service keep such records? The article gives one dated example. For relevant
          high-risk systems, the EU AI Act addresses provider and deployer logs under their control. It
          specifies purpose-appropriate retention of at least six months unless applicable law provides
          otherwise. The article’s October twenty twenty-six source check places the specified Annex
          Three rules in December twenty twenty-seven and the Annex One product rules in August twenty
          twenty-eight. Other duties have their own dates. The NIST risk framework is voluntary
          guidance. Choose the records for the system and duty that actually apply.
        hold: 0.8
        visual_cues:
          - id: governance-logs-scope
            phrase: logs under their control
            targets:
              - governance-scope
            linger: 0.3
            caption_boundary: true
          - id: governance-logs-retention
            phrase: at least six months
            targets:
              - governance-retention
            linger: 0.3
            caption_boundary: true
          - id: governance-logs-dates
            phrase: October twenty twenty-six source check
            targets:
              - governance-timeline
            linger: 0.3
            caption_boundary: true
  - id: fresh-boundary
    title: The rollback request
    visual: One permitted runbook supports part of a private draft. A required review times out and a
      different artifact reaches the action check. Resolve the chat and deployment outcomes separately.
    beats:
      - say: One last request. The team wants a rollback. Their runbook says it requires manager approval and
          gives a forty-five-minute window. The draft repeats the window and adds that approval alone is
          enough. The proposed artifact is C. The stored approval covers A. The required output review
          times out after generation. Which message reaches the caller, and how many deployments run?
        hold: 2.3
        visual_cues:
          - id: fresh-boundary-premises
            phrase: requires manager approval and gives a forty-five-minute window
            targets:
              - fresh-premises
            linger: 0.3
            caption_boundary: true
          - id: fresh-claims
            phrase: draft repeats the window and adds that approval alone is enough
            targets:
              - fresh-support
            linger: 0.3
            caption_boundary: true
          - id: fresh-artifacts
            phrase: proposed artifact is C. The stored approval covers A
            targets:
              - fresh-effect
            linger: 0.3
            caption_boundary: true
          - id: fresh-timeout
            phrase: required output review times out
            targets:
              - fresh-text
            linger: 0.3
            caption_boundary: true
          - id: fresh-boundary-predict
            phrase: Which message reaches the caller, and how many deployments run
            targets:
              - fresh-question
              - fresh-effect
              - fresh-fallback
              - fresh-text
              - fresh-support
              - fresh-premises
            linger: 0.3
            caption_boundary: true
      - say: The forty-five-minute claim has support. The runbook requires approval. It never says that
          approval alone is enough, so the second claim is unsupported. On the tool side, A and C have
          different action hashes. Zero deployments run. On the text side, the reviewer missed its
          deadline. The draft stays private.
        hold: 0.65
        visual_cues:
          - id: fresh-boundary-support
            phrase: forty-five-minute claim has support
            targets:
              - fresh-premises
              - fresh-support
            linger: 0.3
            caption_boundary: true
          - id: fresh-boundary-sufficiency
            phrase: second claim is unsupported
            targets:
              - fresh-support
            linger: 0.3
            caption_boundary: true
          - id: fresh-boundary-effects
            phrase: Zero deployments run
            targets:
              - fresh-effect
            linger: 0.3
            caption_boundary: true
          - id: fresh-boundary-draft
            phrase: draft stays private
            targets:
              - fresh-text
            linger: 0.3
            caption_boundary: true
      - say: The caller gets the reviewed fallback. It reads, “Review unavailable. Try again.” The receipt
          names the policy, the timeout and the changed action. It explains both decisions without
          keeping the private conversation. In the next lesson the proposal is runnable code. You’ll
          decide what a sandbox lets that code touch.
        hold: 1.05
        visual_cues:
          - id: fresh-boundary-fallback
            phrase: The caller gets the reviewed fallback
            targets:
              - fresh-fallback
            linger: 0.3
            caption_boundary: true
          - id: fresh-delivery
            phrase: It reads, “Review unavailable. Try again.”
            targets:
              - fresh-fallback
            linger: 0.3
            caption_boundary: true
