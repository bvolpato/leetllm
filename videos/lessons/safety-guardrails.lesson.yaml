scenes:
  - id: subject-intro
    title: Where does the request stop?
    visual: A deployment proposal moves up to an empty approval gate. Production stays idle while a reviewed reply travels to chat and a key request stops at input.
    beats:
      - say: The assistant proposes deploying payment-service. Look at the approval record. It’s empty.
          Can the host start this deployment?
        hold: 2.1
        visual_cues:
          - id: intro-proposal
            phrase: The assistant proposes deploying payment-service
            targets: [deploy-route]
            linger: 0.3
          - id: intro-record
            phrase: Look at the approval record. It’s empty
            targets: [deploy-route, approval-record]
            linger: 0.3
          - id: intro-question
            phrase: Can the host start this deployment
            targets: [approval-record, deploy-result, deploy-question]
            linger: 0.3
            caption_boundary: true
      - say: The host holds the proposal at the gate. Zero deployments run. The engineer can still get a
          reviewed message explaining which approval is missing.
        hold: 0.8
        visual_cues:
          - id: intro-held
            phrase: The host holds the proposal at the gate
            targets: [deploy-route, approval-record]
            linger: 0.3
            caption_boundary: true
          - id: intro-stop
            phrase: Zero deployments run
            targets: [deploy-route, deploy-result]
            linger: 0.3
            caption_boundary: true
      - say: Now the engineer asks how to run the tests. A reply is enough. The host reviews the answer
          and sends it to chat.
        hold: 0.7
        visual_cues:
          - id: intro-test
            phrase: asks how to run the tests
            targets: [test-route]
            linger: 0.3
          - id: intro-answer
            phrase: reviews the answer and sends it to chat
            targets: [test-route]
            linger: 0.3
            caption_boundary: true
      - say: A request for a production key stops at the input filter, before it reaches the model.
          The host also denies this assistant permission to export secrets. Each guardrail checks
          what can cross its own boundary.
        hold: 0.9
        visual_cues:
          - id: intro-key
            phrase: stops at the input filter
            targets: [secret-route]
            linger: 0.3
            caption_boundary: true
          - id: intro-vault
            phrase: denies this assistant permission to export secrets
            targets: [vault-policy]
            linger: 0.3
            caption_boundary: true
  - id: checks-by-boundary
    title: Follow the deployment request
    visual: A single input reaches the model, then branches into a sentence for chat and a tool proposal
      for production. The host inspects different evidence on the two branches.
    beats:
      - say: Go back to the deployment request. The host can inspect the incoming text and minimize sensitive
          fields before generation. This request passes that first check and reaches the model.
        hold: 0.5
        visual_cues:
          - id: fork-input
            phrase: passes that first check and reaches the model
            targets:
              - input-track
            linger: 0.3
            caption_boundary: true
      - say: The model produces two things. The reply says, “I can prepare the change.” The tool proposal
          names payment-service. The host checks the reply’s content and any claims that need evidence.
          Here the reviewed sentence can go to chat.
        hold: 0.75
        visual_cues:
          - id: fork-output
            phrase: The reply says, “I can prepare the change.” The tool proposal names payment-service
            targets:
              - draft-track
              - proposal-track
            linger: 0.3
            caption_boundary: true
          - id: fork-review
            phrase: reviewed sentence can go to chat
            targets:
              - draft-track
            linger: 0.3
            caption_boundary: true
      - say: Follow the lower branch. The host checks the tool arguments and target, takes the engineer’s
          identity from the session, and looks for a matching approval. The record is missing, so the
          executor stays idle. These branches can finish differently on the very same request.
        hold: 0.8
        visual_cues:
          - id: fork-tool
            phrase: record is missing, so the executor stays idle
            targets:
              - proposal-track
            linger: 0.3
            caption_boundary: true
  - id: input-fixtures
    title: A classifier result has both a label and a score
    visual: Three requests keep their A, B and C labels. Identical scores appear next to different
      classifications, followed by each input decision.
    beats:
      - say: Look at the three supplied requests. A asks about tests. B asks for a deploy. C asks for
          restricted keys. The local stub gives C the injection label. It returns point nine one for all
          three, even when its label says safe. A score only makes sense alongside its label.
        hold: 0.75
        visual_cues:
          - id: input-fixtures-rows
            phrase: three supplied requests
            targets:
              - input-rows
            linger: 0.45
          - id: input-fixtures-score
            phrase: even when its label says safe
            targets:
              - input-scores
            linger: 0.45
          - id: sg-input-score
            phrase: point nine one
            targets:
              - input-scores
            linger: 0.45
      - say: The rule fires when the label matches and the score reaches point eight. A and B therefore pass
          this fixture’s input checks. C blocks before the model runs. The topic check accepted all
          three because each mentions a service. The personal-data stub always returns false. B still
          needs deployment approval. To measure detector quality, we need independently labeled
          examples.
        hold: 0.75
        visual_cues:
          - id: input-fixtures-threshold
            phrase: label matches and the score reaches
            targets:
              - input-comparison
            linger: 0.45
          - id: input-fixtures-result
            phrase: A and B therefore pass
            targets:
              - input-outcomes
            linger: 0.45
          - id: sg-input-a
            phrase: A and B therefore pass this fixture’s input checks
            targets:
              - input-outcomes
            linger: 0.45
          - id: sg-input-b
            phrase: B therefore pass this fixture’s input checks
            targets:
              - input-outcomes
            linger: 0.45
          - id: sg-input-c
            phrase: C blocks before the model
            targets:
              - input-outcomes
            linger: 0.45
  - id: detector-contract
    title: Reject a malformed required result before interpreting risk
    visual: Label, score type, finite domain and threshold enter independent checks; a Boolean cannot borrow
      numeric-zero semantics.
    beats:
      - say: Validate the detector’s interface before comparing its score. Require a recognized label and a finite
          numeric score between zero and one. Reject Boolean values, missing scores, NaN, infinity and
          out-of-range numbers. Python treats Boolean as a kind of integer in many contexts, so this interface
          explicitly excludes it.
        hold: 0.75
        visual_cues:
          - id: detector-contract-type
            phrase: Reject Boolean values
            targets:
              - detector-type
            linger: 0.45
          - id: detector-contract-domain
            phrase: between zero and one
            targets:
              - detector-domain
            linger: 0.45
      - say: A valid score tells the host how to apply this detector’s threshold. The signed-in session
          identifies the caller, the tool policy controls access, and the source passage supports a claim.
          If this required detector fails or returns an invalid score, the host holds the request. Evaluate
          its results on reviewed examples, including quotations, multiple languages and long inputs.
        hold: 0.75
        visual_cues:
          - id: detector-contract-hold
            phrase: holds the request
            targets:
              - detector-outcome
            linger: 0.45
          - id: detector-contract-scope
            phrase: signed-in session identifies the caller
            targets:
              - detector-authority
            linger: 0.45
  - id: text-and-action-paths
    title: Whose approval is this?
    visual: The chat reply passes. The host places the validated action beside the approval it found and
      compares the engineer named in each.
    beats:
      - say: The reply has passed text review. Now suppose the deploy proposal carries approval forty-two. Its
          schema and production target are valid. The host uses that ID to look up a trusted record. The
          service, environment and action hash all match.
        hold: 0.7
        visual_cues:
          - id: binding-reply
            phrase: has passed text review
            targets:
              - reviewed-reply
            linger: 0.3
            caption_boundary: true
          - id: binding-lookup
            phrase: look up a trusted record
            targets:
              - action-pair
            linger: 0.3
            caption_boundary: true
      - say: Read the engineer on each side. The left value comes from the signed-in session. The right value
          names the person covered by the approval. Does this approval belong to the caller?
        hold: 2.15
        visual_cues:
          - id: binding-actor
            phrase: signed-in session
            targets:
              - actor-pair
            linger: 0.3
            caption_boundary: true
          - id: binding-compare
            phrase: Does this approval belong to the caller
            targets:
              - actor-pair
              - binding-verdict
            linger: 0.3
            caption_boundary: true
      - say: Engineer seven is signed in. The grant names engineer nine. The host denies the attempt. Zero
          deployments run. Supplying an ID lets the host find the record. Permission depends on what the
          record says. If the lookup times out before dispatch, the host must hold this attempt too.
        hold: 0.8
        visual_cues:
          - id: binding-result
            phrase: The host denies the attempt. Zero deployments run
            targets:
              - binding-verdict
              - actor-pair
            linger: 0.3
            caption_boundary: true
  - id: output-fixture
    title: A text predicate sees only the text it inspects
    visual: A local text checker reviews a proposed release and a glossary entry that quotes the trigger
      phrase. Both samples stay separate from the tool channel.
    beats:
      - say: Read the reply addressed to Alice. The local checker replaces a detected email with a label
          before release. Its toxicity stub always returns point zero two. The text policy flags the
          literal phrase deploy payment-service. When those words appear in a proposal, it returns
          approval required. That string tells us which text rule fired.
        hold: 0.75
        visual_cues:
          - id: output-fixture-redact
            phrase: replaces a detected email
            targets:
              - output-redaction
            linger: 0.45
          - id: output-fixture-literal
            phrase: literal phrase deploy payment-service
            targets:
              - output-literal
            linger: 0.45
      - say: Compare a draft release plan with a glossary entry. We want the text rule to catch the proposal
          and allow the definition. The paraphrase passes. The glossary entry quotes the exact trigger
          and gets held. One miss and one false alarm come from the same phrase test. Tool arguments
          have their own untrusted channel. The host checks each proposal before execution.
        hold: 0.75
        visual_cues:
          - id: output-fixture-paraphrase
            phrase: The paraphrase passes
            targets:
              - output-counterexamples
            linger: 0.45
          - id: output-fixture-separate
            phrase: own untrusted channel
            targets:
              - output-channels
            linger: 0.45
  - id: argument-contract
    title: Bind approval to the action’s exact identity
    visual: The actual article deployment tuple is canonicalized into bytes and a digest; host session and
      operation ID remain outside model arguments.
    beats:
      - say: Now use the article’s separate deployment fixture. The proposed service is payment-service, environment
          prod, and artifact is the supplied SHA-256 value made from sixty-four a characters. The
          authenticated host actor is engineer seven. The host also fixes operation identifier deploy op
          forty-two. Neither identity comes from a model-written actor field.
        hold: 0.75
        visual_cues:
          - id: argument-contract-tuple
            phrase: separate deployment fixture
            targets:
              - argument-tuple
            linger: 0.45
          - id: argument-contract-host
            phrase: Neither identity comes from
            targets:
              - argument-host
            linger: 0.45
      - say: The host accepts only the declared action fields and supported targets, then hashes sorted compact JSON
          describing action, service, environment and artifact. Approval forty-two names that same action
          digest, actor and expiry, with approved status and a distinct authorized approver, release manager
          three. The actor cannot approve its own request. Changing a target or artifact changes the operation
          being approved, even if every resulting JSON field still has the correct type. The model’s approval
          ID is only a lookup key into the trusted store.
        hold: 0.75
        visual_cues:
          - id: argument-contract-digest
            phrase: hashes sorted compact JSON
            targets:
              - argument-digest
            linger: 0.45
          - id: argument-contract-change
            phrase: Changing a target or artifact
            targets:
              - argument-change
            linger: 0.45
      - say: The tool name must also be in the host’s capability allowlist. Check semantic targets after parsing. File
          tools need resolution and confinement at the access boundary; URL tools need an admitted destination
          through DNS and redirects. An approved internal tool may legitimately use a private address. A
          generic string rule is not a substitute for enforcing that particular resource boundary.
        hold: 0.75
        visual_cues:
          - id: argument-contract-capability
            phrase: host’s capability allowlist
            targets:
              - argument-capability
            linger: 0.45
          - id: argument-contract-resource
            phrase: resolution and confinement at the access boundary
            targets:
              - argument-resource
            linger: 0.45
  - id: approval-replay
    title: Count the deployments
    visual: An attempt and a trusted approval sit next to the local deployment list. The proposed artifact
      changes on a retry while the earlier list entry stays in place.
    beats:
      - say: Watch the list on the right. Each entry means the local executor recorded one deployment. The
          first proposal has no approval ID. The host asks for approval, and the list stays empty.
        hold: 0.75
        visual_cues:
          - id: replay-missing
            phrase: asks for approval, and the list stays empty
            targets:
              - replay-verdict
              - deploy-list
            linger: 0.3
            caption_boundary: true
      - say: Now engineer seven has a matching approval for artifact A. Both action hashes match. The host
          runs operation forty-two and appends one deployment. It ties the used approval to that
          operation.
        hold: 0.8
        visual_cues:
          - id: replay-first
            phrase: appends one deployment
            targets:
              - deploy-list
              - replay-verdict
            linger: 0.3
            caption_boundary: true
      - say: The caller retries the exact request while the grant is still valid. The host verifies it again
          and finds the completed operation. It returns “already executed.” There is still one entry for
          payment-service.
        hold: 0.75
        visual_cues:
          - id: replay-same
            phrase: returns “already executed”
            targets:
              - replay-verdict
              - deploy-list
            linger: 0.3
            caption_boundary: true
      - say: Keep the approval, the engineer and operation forty-two. Change only the proposed artifact to B.
          Look at the two action hashes. What will the host return this time?
        hold: 2.2
        visual_cues:
          - id: replay-change
            phrase: Change only the proposed artifact to B
            targets:
              - replay-fields
            linger: 0.3
            caption_boundary: true
          - id: replay-predict
            phrase: What will the host return this time
            targets:
              - replay-verdict
              - replay-fields
            linger: 0.3
            caption_boundary: true
      - say: It denies the changed action. The approval binds the action hash for A. The host compares that
          hash with the one for B before it looks up the completed operation. The original deployment
          stays in the list.
        hold: 0.9
        visual_cues:
          - id: replay-changed
            phrase: denies the changed action
            targets:
              - replay-verdict
              - deploy-list
            linger: 0.3
            caption_boundary: true
      - say: Put A back and try operation forty-three. The hashes match again, but the approval was consumed
          by forty-two. The host denies reuse for a different operation.
        hold: 0.65
        visual_cues:
          - id: replay-used
            phrase: denies reuse for a different operation
            targets:
              - replay-fields
              - replay-verdict
            linger: 0.3
            caption_boundary: true
      - say: Return to the exact original operation and advance the clock to the grant’s expiry. The replay is
          denied because the approval has expired. A completed operation still needs current
          authorization under this replay policy.
        hold: 0.7
        visual_cues:
          - id: replay-expired
            phrase: replay is denied because the approval has expired
            targets:
              - replay-fields
              - replay-verdict
            linger: 0.3
            caption_boundary: true
      - say: This list lives in one process. It can disappear in a crash. To make a remote retry safe, we need
          a record that survives the caller and a way to learn what the executor did.
        hold: 0.85
        visual_cues:
          - id: replay-limit
            phrase: record that survives the caller
            targets:
              - deploy-list
              - replay-verdict
            linger: 0.3
            caption_boundary: true
  - id: approval-atomic
    title: How can the host retry a deployment safely?
    visual: Two workers contend for one durable operation reservation; a lost response produces an unknown outcome
      instead of an invented failure.
    beats:
      - say: Two workers read the same approval. Both see that it’s unused. Give just one worker the right to
          start by making a single atomic reservation. Store it durably with the scoped operation ID and
          approved payload, and enforce uniqueness. If the deployment and its record share a transactional
          system, commit them together. What if a separate service runs the deployment?
        hold: 0.75
        visual_cues:
          - id: approval-atomic-race
            phrase: Both see that it’s unused
            targets:
              - atomic-race
            linger: 0.45
          - id: approval-atomic-reserve
            phrase: atomic reservation
            targets:
              - atomic-reservation
            linger: 0.45
      - say: When the executor supports idempotency keys, send the same key and payload on each retry.
          Suppose the deployment starts and its reply gets lost. The caller times out. Record the outcome as
          unknown. Ask the executor what happened before deciding whether its retry contract lets you send
          the request again.
        hold: 0.75
        visual_cues:
          - id: approval-atomic-timeout
            phrase: outcome as unknown
            targets:
              - atomic-unknown
            linger: 0.45
          - id: approval-atomic-reconcile
            phrase: Ask the executor what happened
            targets:
              - atomic-reconcile
            linger: 0.45
  - id: schema-mask
    title: Structural legality and authority answer different questions
    visual: A next-token choice set loses schema-illegal branches while a valid unauthorized deployment remains in
      the surviving set.
    beats:
      - say: "Constrained decoding can mask tokens that cannot continue a supported output grammar or schema. Trace
          the next-token set: an illegal field or value structure loses its branch before sampling. A
          completed object still needs parsing and validation under the supported schema contract; refusals,
          incomplete outputs and unsupported schema features need explicit handling."
        hold: 0.75
        visual_cues:
          - id: schema-mask-mask
            phrase: loses its branch before sampling
            targets:
              - schema-choices
            linger: 0.45
          - id: schema-mask-parse
            phrase: still needs parsing and validation
            targets:
              - schema-parse
            linger: 0.45
      - say: A schema-valid object can request a forbidden target, contain an unsupported claim or carry a fabricated
          approval ID. Shape checks narrow possible representations. Trusted authorization decides whether the
          particular actor may perform the particular effect. Required citation fields likewise do not
          demonstrate that their cited passages support the answer.
        hold: 0.75
        visual_cues:
          - id: schema-mask-valid
            phrase: A schema-valid object
            targets:
              - schema-valid
            linger: 0.45
          - id: schema-mask-authority
            phrase: Trusted authorization decides
            targets:
              - schema-authority
            linger: 0.45
  - id: untrusted-observations
    title: What did the connector authenticate?
    visual: A retrieved runbook supplies a rollback fact. A margin note asking to publish a draft stays on
      the document side of the host’s permission check.
    beats:
      - say: The connector signed in to the runbook repository. What came back remains evidence data. One line
          says rollback requires manager approval. A margin note asks to publish a draft. Keep the
          rollback condition as evidence. A document author cannot give the assistant a publishing
          permission by writing a note.
        hold: 0.75
        visual_cues:
          - id: untrusted-observations-evidence
            phrase: remains evidence data
            targets:
              - observation-source
            linger: 0.45
          - id: untrusted-observations-attack
            phrase: publish a draft
            targets:
              - observation-command
            linger: 0.45
      - say: Escaping a closing tag keeps the document inside its field. It does not create an
          instruction-proof parser in the model. The host decides which tools the session may call. A
          read-only session leaves the draft unpublished. Secret export has its own rule here. The host
          denies it even with approval when policy forbids it.
        hold: 0.75
        visual_cues:
          - id: untrusted-observations-escape
            phrase: does not create an instruction-proof parser
            targets:
              - observation-escape
            linger: 0.45
          - id: untrusted-observations-deny
            phrase: policy forbids it
            targets:
              - observation-denied
            linger: 0.45
  - id: canary-stream
    title: How much of a stream should the matcher remember?
    visual: A private buffer accumulates the letters of BLUE. The final letter completes the match and the suffix LUE carries forward.
    beats:
      - say: Plant the word BLUE in a test draft. We want the reviewer to catch it before the draft reaches
          chat. The letters arrive one at a time. Watch the buffer keep B, then L, then U. What happens
          when E arrives?
        hold: 1.65
        visual_cues:
          - id: canary-stream-marker
            phrase: the word BLUE
            targets: [canary-bytes]
            linger: 0.3
          - id: canary-stream-b
            phrase: keep B
            targets: [canary-chunks]
            linger: 0.3
          - id: canary-stream-l
            phrase: then L
            targets: [canary-chunks]
            linger: 0.3
          - id: canary-stream-u
            phrase: then U
            targets: [canary-chunks]
            linger: 0.3
      - say: The E completes the match. To recognize a four-letter marker across chunks, carry the last
          three letters into the next check. For an eighteen-character marker, keep seventeen. The next
          character could finish a match that began seventeen characters back.
        hold: 0.75
        visual_cues:
          - id: canary-stream-join
            phrase: The E completes the match
            targets: [canary-chunks, canary-results]
            linger: 0.3
            caption_boundary: true
          - id: canary-stream-overlap
            phrase: carry the last three letters
            targets: [canary-overlap]
            linger: 0.3
      - say: Finding BLUE tells us the test marker reached this private buffer. Keep the draft private through
          the required review. If a real credential reached a user, restrict access to the evidence, revoke
          or rotate that credential, and repair the path that exposed it.
        hold: 0.75
        visual_cues:
          - id: canary-stream-incident
            phrase: If a real credential reached a user
            targets: [canary-scope]
            linger: 0.3
  - id: minimize-data
    title: What does the remote reviewer receive?
    visual: The host keeps the original incident note. A working copy replaces the email and phone, then
      crosses into the remote classifier inbox with its incident context intact.
    beats:
      - say: Incident twenty forty-eight needs follow-up. The local team can use the contact details. The
          remote classifier is allowed to review the incident text, including its number. It has no use
          for Alice’s address or phone. Which fields belong in the copy we send?
        hold: 1.7
        visual_cues:
          - id: minimize-record
            phrase: use the contact details
            targets:
              - local-message
            linger: 0.3
            caption_boundary: true
          - id: minimize-question
            phrase: Which fields belong in the copy we send
            targets:
              - privacy-question
              - outgoing-message
            linger: 0.3
            caption_boundary: true
      - say: Keep the incident number and the request for follow-up. On the outgoing copy, replace the email
          with an email label. Replace the phone number with a phone label. The original stays with the
          team allowed to contact Alice.
        hold: 0.9
        visual_cues:
          - id: minimize-email
            phrase: replace the email with an email label
            targets:
              - outgoing-message
            linger: 0.3
            caption_boundary: true
          - id: minimize-phone
            phrase: Replace the phone number with a phone label
            targets:
              - outgoing-message
            linger: 0.3
            caption_boundary: true
        motion_check:
          region:
            - 980
            - 293
            - 835
            - 270
          minimumChangedFraction: 0.002
      - say: Now send the minimized note across the boundary. The classifier can still tell which incident
          needs attention. These two replacements cover the formats in this example. Check names,
          addresses, credentials and other phone formats separately, and restrict how long the host
          keeps the original.
        hold: 0.8
        visual_cues:
          - id: minimize-send
            phrase: send the minimized note across the boundary
