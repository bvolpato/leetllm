          already has one. If the replacement is invalid, missing or unreadable, the loader keeps the last
          validated policy. Each request gets a deep copy of its rules. Later reloads leave that copy
          intact. The copy itself is editable. Concurrent workers also need a coordinated switch to the new
          revision.
