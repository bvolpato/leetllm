    visual: Two policy fragments have the same threshold and different text hashes. The loader retains the active revision when a replacement fails validation.
    beats:
      - say: Look at the two threshold settings. Both say point eight. The loader accepts up to sixty-five
          thousand five hundred thirty-six decoded characters, rejects duplicate object keys, and validates
