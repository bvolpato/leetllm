version: 1
id: estimation
title: What Can One Sample Tell Us?
source: foundations/statistics-estimation-uncertainty/content.md
voice: af_heart
rate: +12%
sources:
  - title: "Wilson: Probable Inference, the Law of Succession, and Statistical Inference"
    url: https://doi.org/10.1080/01621459.1927.10502953
  - title: "SciPy: Bootstrap confidence intervals"
    url: https://docs.scipy.org/doc/scipy/reference/generated/scipy.stats.bootstrap.html
  - title: "NIST: Confidence intervals for proportions"
    url: https://www.itl.nist.gov/div898/handbook/prc/section2/prc241.htm
scenes:
  - id: intro
    title: Would you book the extra shift?
    visual: The first five reviewed messages become one point on the staffing ruler. The same five take their places in a tray of a hundred. Its new tally moves the point. Four stacks show the audit plan fixed before review.
    beats:
      - say: "Turn over the first five messages. One needed a specialist. Put that share on the ruler. Twenty percent, right on the regular team's staffing line. Where will the dot land when we count the first hundred?"
        hold: 1.5
        visual_cues:
          - { id: five-count, phrase: Turn over the first five messages, targets: [first-five], color: pink }
          - { id: shift-capacity, phrase: Put that share on the ruler, targets: [capacity-ruler], color: yellow }
      - say: "Lay out the first hundred messages. Those five keep their labels. Review the rest independently. Count the pink ones. Sixteen need a specialist. Out of a hundred, that's sixteen percent. The dot moves below the staffing line."
        hold: 1
        motion_check:
          region: [160, 305, 740, 430]
          minimumChangedFraction: 0.002
        visual_cues:
          - { id: sample-draw, phrase: Lay out the first hundred messages, targets: [selected-messages], color: blue }
          - { id: sample-label, phrase: Review the rest independently, targets: [selected-messages], color: pink }
          - { id: sample-tally, phrase: Sixteen need a specialist, targets: [reviewed-labels], color: pink, caption_boundary: true }
          - { id: sample-fraction, phrase: sixteen percent, targets: [reviewed-labels], color: yellow, caption_boundary: true }
          - { id: move-point, phrase: The dot moves below the staffing line, targets: [capacity-ruler], color: yellow }
      - say: "Before opening any messages, we drew four hundred distinct IDs at random from this week's hundred thousand. This tray is the first of those four stacks. We also fixed the staffing rule in advance. We'll decide after all four hundred reviews. If the whole interval for the week's rate falls below twenty percent, keep the regular shift. Otherwise, book the extra shift. Let's see how far a sample estimate can move."
        hold: 0.5
        visual_cues:
          - { id: lock-plan, phrase: four hundred distinct IDs at random, targets: [sealed-plan], color: blue }
          - { id: lock-rule, phrase: after all four hundred reviews, targets: [sealed-plan], color: yellow }
          - { id: rule-limit, phrase: falls below twenty percent, targets: [capacity-ruler], color: pink }
  - id: sampling
    title: Watch a counted batch become one point
    visual: One simulated binary batch is counted and its identified tally becomes a scatter point. Further
      complete batches populate a distribution; a second cloud uses four times the labels on identical
      rate axes.
    beats:
      - say: "For this simulation, set the underlying rate to sixteen percent. Count one random batch of a
          hundred. Its fraction becomes this point. Repeat with fresh labels: each point is one complete
          sample, while the rate stays fixed."
        hold: 0.45
        visual_cues:
          - id: batch-count
            phrase: Count one random batch of a hundred
            targets:
              - batch-labels
            color: pink
            linger: 0.35
          - id: batch-point
            phrase: Its fraction becomes this point
            targets:
              - batch-to-point
            color: yellow
            linger: 0.35
          - id: batch-repeat
            phrase: Repeat with fresh labels
            targets:
              - sample-cloud
            color: blue
            linger: 0.35
      - say: "Pick the furthest point from the middle. Its hundred messages came from the same sixteen-percent world as every other point. Change which messages you draw, and the estimate moves. That spread is sampling variation."
        hold: 0.4
      - say: Give each sample four hundred labels. Watch the second cloud form on the same scale. Four times the
          independent labels roughly halves the standard error, the typical movement of the estimate.
          Extra labels buy precision gradually.
        hold: 0.45
        visual_cues:
          - id: larger-cloud
            phrase: Watch the second cloud form on the same scale
            targets:
              - large-cloud
            color: cyan
            linger: 0.35
  - id: score-interval
    title: Keep the candidate rates that pass
    visual: The sample supplies the scale for the Wald range. The Wilson sweep stops at a candidate rate of 20%, where the observed count is one standard deviation below its expectation. The two crossings at 1.96 project onto the rate axis and define the inclusive endpoints.
    beats:
      - say: "Our tray still has sixteen specialist cases. Its estimated standard error is just under four percentage points. Imagine drawing a whisker from sixteen percent: the quick Wald interval adds nearly twice that scale on each side. Its width comes from the labels in this tray."
        hold: 0.4
        visual_cues:
          - id: wald-range
            phrase: adds nearly twice that scale on each side
            targets:
              - wald-interval
            color: blue
            linger: 0.35
      - say: "Slide a candidate population rate across the axis. At twenty percent we'd expect twenty cases, with a standard deviation of four. We saw sixteen. That's one standard deviation away. For a two-sided ninety-five percent Wilson interval, keep the candidates that put our count within one point nine six standard deviations of the expected count. Include both endpoints. Each candidate supplies its own scale."
        hold: 0.5
        motion_check:
          region:
            - 220
            - 340
            - 1000
            - 500
          minimumChangedFraction: 0.002
        visual_cues:
          - id: candidate-sweep
            phrase: Slide a candidate population rate across the axis
            targets:
              - candidate-score
            color: yellow
            linger: 0.35
          - { id: threshold-example, phrase: That's one standard deviation away, targets: [candidate-score], color: yellow }
          - { id: finish-sweep, phrase: keep the candidates that put our count within one point nine six standard deviations of the expected count, targets: [candidate-score], color: cyan }
      - say: Project the two crossings down. The accepted rates run from about ten to twenty-four percent. That is
          the Wilson interval. It crosses our twenty-percent staffing threshold, so this sample supports
          rates on either side. We still have three hundred planned reviews to finish.
        hold: 0.55
        visual_cues:
          - id: score-project
            phrase: Project the two crossings down
            targets:
              - score-projection
            color: green
            linger: 0.35
          - id: score-endpoints
            phrase: ten to twenty-four percent
            targets:
              - wilson-interval
            color: green
            linger: 0.35
          - id: threshold-cross
            phrase: crosses our twenty-percent staffing threshold
            targets:
              - staffing-threshold
            color: pink
            linger: 0.35
  - id: accumulating-evidence
    title: What changes when more labels arrive?
    visual: Sixteen visibly bracketed groups each contain four specialist outcomes in twenty-five labels.
      Groups arrive intact and their counts change the denominator and actual Wilson range; the first
      interval remains fixed for comparison.
    beats:
      - say: "Set the weekly audit aside. Build a tray on purpose with four pink marks among twenty-five labels. The yellow dot marks our sample estimate. Imagine adding another tray with exactly the same mix. What will happen to the dot? What will happen to the ends of the interval?"
        hold: 2
      - say: "Slide in the second tray. Eight pink marks out of fifty put the dot right back where it was. Bring in the remaining trays. Watch the caps draw closer with every group of twenty-five. The gray whisker shows where they started."
        hold: 0.45
        visual_cues:
          - { id: second-tray, phrase: Slide in the second tray, targets: [label-groups], color: cyan }
          - id: add-groups
            phrase: Bring in the remaining trays. Watch the caps draw closer with every group of twenty-five
            targets:
              - label-groups
              - contracting-interval
            color: cyan
            linger: 0.35
      - say: "At four hundred labels the sample estimate is still sixteen percent. Look halfway between the caps on each whisker. The Wilson midpoint moved closer to the yellow dot. We gave every tray the same mix to isolate the effect of sample size. In a real draw, the sample estimate can move too."
        hold: 0.45
        visual_cues:
          - { id: interval-midpoints, phrase: Look halfway between the caps on each whisker, targets: [wilson-midpoints], color: cyan }
  - id: boundary
    title: Which population rates fit the labels?
    visual: Ten clean labels leave a Wilson upper cap on a fixed ruler. A second row of ten changes the denominator. The viewer works out where the cap moves before the new interval appears. A ten-positive example mirrors the first interval. Repeated samples of one hundred then test coverage.
    beats:
      - say: "Open ten messages. All ten stayed with the regular team. Which population rates could plausibly have given us that tray?"
        hold: 2
        visual_cues:
          - { id: open-ten, phrase: All ten stayed with the regular team, targets: [boundary-labels], color: blue }
      - say: "Wald uses a zero estimated standard error and collapses there. Wilson still accepts rates above zero. With zero positives, the upper end of a two-sided ninety-five percent Wilson interval has a shortcut. One point nine six squared is about three point eight four. Divide that by the number of independent labels plus three point eight four. Put ten in the denominator. Three point eight four over thirteen point eight four gives about twenty-seven point eight percent."
        hold: 0.7
        visual_cues:
          - id: zero-wald
            phrase: Wald uses a zero estimated standard error and collapses there
            targets:
              - collapsed-wald
            color: red
            linger: 0.35
          - id: zero-wilson
            phrase: Wilson still accepts rates above zero
            targets:
              - zero-score-range
            color: green
            linger: 0.35
          - { id: zero-formula, phrase: One point nine six squared, targets: [zero-bound] }
          - { id: plug-ten, phrase: Put ten in the denominator, targets: [zero-bound] }
          - { id: zero-ten, phrase: twenty-seven point eight percent, targets: [zero-bound], caption_boundary: true }
      - say: "Open ten more independent messages. These are all routine too. You have twenty reviewed, zero positives. Keep the numerator. What goes in the denominator now, and how high can the interval reach?"
        hold: 4
        visual_cues:
          - { id: add-clean, phrase: Open ten more independent messages, targets: [boundary-labels], color: blue }
      - say: "Put twenty where ten used to be. Divide three point eight four by twenty-three point eight four. The upper end comes down to sixteen point one percent. A population rate anywhere from zero up to about that value is still compatible with twenty clean labels under this model."
        hold: 1
        visual_cues:
          - { id: plug-twenty, phrase: Put twenty where ten used to be, targets: [zero-bound] }
          - { id: narrow-cap, phrase: The upper end comes down, targets: [zero-score-range], color: green }
          - { id: zero-twenty, phrase: sixteen point one percent, targets: [zero-bound], caption_boundary: true }
      - say: "Go back to ten. Now suppose all ten messages need a specialist. Flip the interval across the scale. Rates from about seventy-two percent to one hundred percent fit these ten labels."
        hold: 0.4
        visual_cues:
          - id: all-wilson
            phrase: all ten messages need a specialist
            targets:
              - boundary-labels
            color: cyan
            linger: 0.35
          - { id: mirror-range, phrase: Flip the interval across the scale, targets: [all-score-range], color: cyan }
          - { id: mirror-ends, phrase: seventy-two percent to one hundred percent, targets: [all-score-range], caption_boundary: true }
      - say: "The last interval used ten messages. Each simulated interval uses a fresh sample of one hundred. Fix the population rate at sixteen percent. Draw twenty-four independent samples and give each its own Wilson interval. Watch for a whisker that misses the fixed line. Two miss in this run. Ninety-five percent describes the method's approximate coverage across repeated samples. Actual coverage depends on the rate and sample size. To predict the fraction in a future sample, you'd also have to account for the variation in those new labels."
        hold: 0.8
        visual_cues:
          - { id: switch-size, phrase: a fresh sample of one hundred, targets: [sim-design] }
          - { id: fix-rate, phrase: Fix the population rate at sixteen percent, targets: [sim-design], color: yellow }
          - id: coverage-build
            phrase: Draw twenty-four independent samples and give each its own Wilson interval
            targets:
              - coverage-intervals
            color: yellow
            linger: 0.35
          - { id: count-misses, phrase: Two miss in this run, targets: [miss-count], caption_boundary: true }
  - id: sample-design
    title: Which messages did the sample leave out?
    visual: A separately labeled toy queue has three disjoint message categories. A routine-only selection
      excludes two categories while its uncertainty narrows around the wrong target; the known mix then
      constructs 84,50,42 expected specialist cases per thousand and their weighted total.
    beats:
      - say: "This separate queue has a thousand messages. Seven hundred are routine. The rest concern billing or account access. Select only routine questions, drawing at random without replacement. More routine labels tighten the estimate around the routine rate. The blue whisker uses a binomial approximation. Here we've drawn four hundred of just seven hundred eligible cases. A finite-population correction would reduce the standard error. Even reviewing every routine case would tell us nothing about the other two lanes' rates."
        hold: 0.45
        visual_cues:
          - id: biased-selection
            phrase: Select only routine questions
            targets:
              - routine-selection
            color: blue
            linger: 0.35
          - id: biased-precision
            phrase: More routine labels tighten the estimate
            targets:
              - routine-interval
            color: blue
            linger: 0.35
      - say: "Suppose we also know the specialist rate in each lane. Twelve percent of seven hundred routine questions contribute eighty-four expected specialist cases. At twenty-five percent of two hundred, billing adds fifty. At forty-two percent of a hundred, account access adds forty-two. Join those contributions and divide by all thousand messages. The whole queue's rate is seventeen point six percent."
        hold: 0.45
        visual_cues:
          - id: weight-routine
            phrase: routine questions contribute eighty-four
            targets:
              - weighted-routine
            color: blue
            linger: 0.25
          - id: weight-billing
            phrase: Billing adds fifty
            targets:
              - weighted-billing
            color: cyan
            linger: 0.25
          - id: weight-account
            phrase: account access adds forty-two
            targets:
              - weighted-account
            color: pink
            linger: 0.25
          - id: weighted-total
            phrase: seventeen point six percent
            caption_boundary: true
            targets:
              - weighted-total
            color: yellow
            linger: 0.35
      - say: "In a real queue those lane rates need evidence. Sample across the target queue to give every message a chance to reach the tray. Or draw a random sample within each lane. Weight each lane's estimated rate by its share of the target traffic. Carry uncertainty from each sample into the weighted result."
        hold: 0.4
        visual_cues:
          - id: design-repair
            phrase: Sample across the target queue
            targets:
              - repaired-selection
            color: green
            linger: 0.35
  - id: resampling
    title: Reuse the labels, retain their identities
    visual: The original weekly sample keeps its exact IDs and labels. One positive ID is drawn twice with
      replacement, a complete hundred-draw resample becomes one histogram contribution, and subsequent
      completed resamples build the distribution from prefixes rather than a finished reveal.
    beats:
      - say: Back to our original hundred reviewed messages. Bootstrap draws reuse those IDs with replacement.
          Watch the same pink message arrive twice. Its source label stays put. After a hundred draws,
          count the selected outcomes and compute one new fraction.
        hold: 0.45
        visual_cues:
          - id: bootstrap-duplicate
            phrase: Watch the same pink message arrive twice
            targets:
              - bootstrap-draws
            color: pink
            linger: 0.35
          - id: bootstrap-complete
            phrase: After a hundred draws
            targets:
              - resample-fraction
            color: yellow
            linger: 0.35
      - say: Add that fraction to the histogram. Repeat the whole draw, count, and deposit. Each completed
          resample adds one entry. Their spread approximates sampling movement using our observed labels
          as the stand-in population. Extra repetitions refine the calculation while the original evidence
          stays at a hundred labels.
        hold: 0.45
        motion_check:
          region:
            - 1000
            - 400
            - 750
            - 420
          minimumChangedFraction: 0.002
        visual_cues:
          - id: bootstrap-histogram
            phrase: Add that fraction to the histogram. Repeat the whole draw, count, and deposit. Each completed
              resample adds one entry
            targets:
              - bootstrap-histogram
            color: cyan
            linger: 0.35
      - say: "Suppose the tray contains ten zeros. Reach into it a thousand times: every resample is all zeros. The percentile interval collapses. Where would a positive have come from? There is another trap when several rows arrived together. Keep that group together when the sampling design depends on it."
        hold: 0.4
        visual_cues:
          - id: bootstrap-zero
            phrase: every resample is all zeros
            targets:
              - zero-bootstrap
            color: blue
            linger: 0.35
  - id: prior-and-calibration
    title: What do the labels tell us about the rate?
    visual: The first five labels and the full hundred each have a row on the same rate scale. The distance from the sample fraction to the posterior mode shows the pull of a fixed prior. A separate held-out audit compares its outcome interval with a forecast.
    beats:
      - say: "Here are those first five messages again. One specialist case in five gives us twenty percent. Under the binomial model, that's the rate that makes this count most likely. It's our maximum-likelihood estimate. Now suppose we start with a Beta two-two prior. It gives rates near one half more weight before we see any labels. To find the peak after seeing these five, add one success term and one failure term. The peak moves to two sevenths, about twenty-nine percent. We call that posterior peak the maximum a posteriori estimate, or MAP."
        hold: 0.6
        visual_cues:
          - { id: prior-shape, phrase: a Beta two-two prior, targets: [prior-contribution], color: yellow }
          - { id: prior-terms, phrase: add one success term and one failure term, targets: [prior-contribution], color: yellow }
          - { id: small-peak, phrase: The peak moves to two sevenths, targets: [five-shift], color: yellow }
      - say: "Bring back the full hundred labels. Sixteen needed a specialist, so the blue mark goes at sixteen percent. Keep the same two prior terms. The posterior peaks at seventeen over a hundred and two, about sixteen point seven percent. Compare the two rows. With five labels the prior moved the estimate almost nine percentage points. With a hundred it moves the estimate less than one point."
        hold: 0.9
        visual_cues:
          - { id: prior-data, phrase: Bring back the full hundred labels, targets: [prior-data], color: blue }
          - { id: large-peak, phrase: The posterior peaks at seventeen over a hundred and two, targets: [hundred-shift], color: yellow }
      - say: "Now compare a held-out forecast. This is a separate audit of messages kept out of training. Choose one score bucket before looking at outcomes. Every message in it got a twenty-percent chance of needing a specialist. Draw one hundred held-out messages at random from that bucket. Suppose sixteen need a specialist. Is that four-point gap enough to call the forecast wrong?"
        hold: 2
        visual_cues:
          - { id: bucket-forecast, phrase: a twenty-percent chance of needing a specialist, targets: [forecast-marker], color: yellow }
          - { id: bucket-sample, phrase: Draw one hundred held-out messages at random, targets: [bucket-count], color: blue }
          - { id: bucket-outcomes, phrase: Suppose sixteen need a specialist, targets: [bucket-count], color: pink, caption_boundary: true }
      - say: "Place the Wilson interval for the bucket's outcome rate across the forecast line. Twenty percent still fits. The observed gap could come from sampling variation. A larger random audit of this bucket could resolve a smaller gap. We'd need held-out labels from the other score buckets to assess those forecasts too."
        hold: 0.6
        visual_cues:
          - id: calibration-forecast
            phrase: Place the Wilson interval for the bucket's outcome rate across the forecast line
            targets:
              - calibration-comparison
            color: yellow
            linger: 0.35
          - { id: forecast-fits, phrase: Twenty percent still fits, targets: [calibration-comparison], caption_boundary: true }
  - id: target-and-missing
    title: Keep the denominator attached to the target
    visual: A bracket encloses eighty opened cases, then widens to all one hundred. Twenty envelopes stay sealed through both extreme assignments. Two reviewers independently label the same ambiguous message. Three of four pairs of original labels match before the disputed case goes to adjudication.
    beats:
      - say: "Point to the whole queue. That is our population. Its unknown specialist share is the estimand. To estimate it, draw messages at random and review every one you drew. Divide the specialist count by the number reviewed. That rule is our estimator. Today's sixteen percent is one estimate. In the article’s flagged-signup example, only flags reach the tray. The fraction of those flags that are abusive measures review precision. Recall needs all abusive signups in the denominator. The false-positive rate needs all clean signups."
        hold: 1
        visual_cues:
          - id: target-flagged-comparison
            phrase: In the article’s flagged-signup example
            targets:
              - target-denominator-comparison
            linger: 0.5
      - say: "A different audit drew a hundred messages. Sixteen pink cases went to a specialist. Sixty-four blue ones stayed with the team. Twenty envelopes are still sealed. If you want the rate among the cases we've actually resolved, where would you close the bracket?"
        hold: 2
      - say: "Count the eighty open cases. Sixteen out of eighty is twenty percent. That answers the question about the cases the reviewers have finished. Widen the bracket to the whole tray. Suppose none of the sealed cases needs a specialist. Sixteen out of a hundred is sixteen percent. Suppose all twenty need one. Thirty-six out of a hundred is thirty-six percent. Those bounds describe this tray. To estimate the rate in the queue, we also have to allow for which hundred messages our random draw picked."
        hold: 0.8
        visual_cues:
          - { id: bracket-resolved, phrase: Count the eighty open cases, targets: [audit-tray] }
          - { id: resolved-share, phrase: twenty percent, targets: [audit-tray, audit-count], caption_boundary: true }
          - { id: include-unopened, phrase: Widen the bracket to the whole tray, targets: [audit-tray] }
          - { id: missing-none, phrase: Suppose none of the sealed cases needs a specialist, targets: [audit-count] }
          - { id: missing-low, phrase: sixteen percent, targets: [audit-tray, audit-count], caption_boundary: true }
          - { id: missing-all, phrase: Suppose all twenty need one, targets: [audit-count] }
          - { id: missing-high, phrase: thirty-six percent, targets: [audit-tray, audit-count], caption_boundary: true }
      - say: "If difficult cases take longer to resolve, dropping them can systematically shift our answer. Report how many we selected, how many we resolved and how many are still waiting. Look at this one. The customer got back in, then the account locked again. Does that need a specialist? Freeze the labeling rule and hide the model score. Give two reviewers the same case. Each records a label in private."
        hold: 0.6
        visual_cues:
          - { id: review-case, phrase: Look at this one, targets: [case-file] }
          - { id: blind-review, phrase: Give two reviewers the same case, targets: [review-pair] }
          - { id: lock-labels, phrase: Each records a label in private, targets: [review-pair] }
      - say: "Now compare their labels. One chose routine. The other chose specialist. Record that disagreement. Put their answers beside three more cases they both reviewed in private. Read across each row. On how many cases did they agree?"
        hold: 2.5
        visual_cues:
          - { id: compare-labels, phrase: Now compare their labels, targets: [review-pair] }
          - { id: record-disagreement, phrase: Record that disagreement, targets: [agreement], color: yellow }
          - { id: paired-cases, phrase: beside three more cases they both reviewed in private, targets: [review-pair] }
      - say: "Three pairs match. Divide by all four double-reviewed cases. That's seventy-five percent observed agreement in this little set. Save both original labels. Now send the disputed case for adjudication. The final label can go into the audit, and we'll still know how often the reviewers agreed on their own."
        hold: 0.9
        visual_cues:
          - { id: matching-pairs, phrase: Three pairs match, targets: [review-pair], color: green }
          - { id: agreement-rate, phrase: seventy-five percent observed agreement, targets: [agreement], caption_boundary: true }
          - { id: adjudicate, phrase: send the disputed case for adjudication, targets: [agreement], color: yellow }
  - id: cluster-evidence
    title: What travels with a signup?
    visual: Two signups leave the same campaign for inspection. A redraw keeps whole campaigns together. Two percentile ranges share an axis. Swapping one campaign changes ten outcomes together. Two unequal campaigns then show how many signups each contributes.
    beats:
      - say: "This audit selected whole campaigns at random, then reviewed every signup inside them. Pull one signup from the pink campaign. Now pull its neighbor. They came in on the same draw. In this example all the signups in a campaign have the same outcome. Count the groups on the left. How many independent draws gave us these hundred labels?"
        hold: 2
        visual_cues:
          - { id: pull-signup, phrase: Pull one signup from the pink campaign, targets: [linked-signups], color: pink }
          - { id: pull-neighbor, phrase: Now pull its neighbor, targets: [linked-signups], color: pink }
      - say: "Ten campaigns. Two were positive and eight were negative. Try drawing whole campaigns again, with replacement. Here's the same campaign twice. Each copy brings all ten of its signups. We could instead put the hundred rows in a bowl and draw them one at a time. Which method will give a wider spread of sample fractions?"
        hold: 2
        visual_cues:
          - { id: redraw-campaigns, phrase: drawing whole campaigns again, targets: [campaign-copies] }
          - { id: repeat-campaign, phrase: the same campaign twice, targets: [campaign-copies] }
          - { id: finish-redraw, phrase: Each copy brings all ten of its signups, targets: [campaign-copies] }
      - say: "Draw rows one at a time. The middle of that distribution runs from twelve to twenty-eight percent. Now draw whole campaigns. Its range reaches from zero to fifty percent. Each pink draw moves ten labels together. The variance is the success rate times the failure rate, divided by the number of independent draws. Using a hundred in place of ten makes that variance ten times too small."
        hold: 1
        visual_cues:
          - { id: row-spread, phrase: Draw rows one at a time, targets: [row-range] }
          - { id: row-ends, phrase: twelve to twenty-eight percent, targets: [row-range], caption_boundary: true }
          - { id: campaign-spread, phrase: Now draw whole campaigns, targets: [campaign-range], color: pink }
          - { id: campaign-ends, phrase: zero to fifty percent, targets: [campaign-range], caption_boundary: true }
          - { id: compare-variance, phrase: ten times too small, targets: [cluster-variance], caption_boundary: true }
      - say: "Swap one negative campaign for a positive one in a redraw. All ten of its signups change together. The fraction jumps a whole ten percentage points. With only ten independent campaigns, the coarse steps limit how closely a percentile interval can track its target coverage. If campaigns differ in size, keep each signup count with its campaign when you redraw. A campaign of twenty brings twice as many labels as a campaign of ten."
        hold: 0.6
        visual_cues:
          - { id: campaign-step, phrase: Swap one negative campaign for a positive one in a redraw, targets: [redraw-step], color: pink }
          - { id: unequal-campaigns, phrase: If campaigns differ in size, targets: [campaign-size], color: blue }
  - id: bias-and-prior
    title: Where does the gap come from?
    visual: The band for independent routine draws shrinks around the expected estimate of 12%. A bracket measures its persistent gap from the population rate of 17.6%. A posterior curve distinguishes its mean from its mode. A held-out bucket leaves other buckets unmeasured.
    beats:
      - say: "Go back to our three lanes. Imagine a population with the same mix and rates. Make ten thousand independent draws from the routine lane. If we repeat that audit, individual estimates vary. Their average stays at twelve percent. Follow the gap to the whole population's rate. Billing and access never had a chance to get into any tray. That's why the average estimate stays five point six percentage points low even as the scatter shrinks. That persistent gap is the estimator's bias. Mean squared error adds its square to the sampling variance."
        hold: 0.9
        visual_cues:
          - { id: more-routine, phrase: Make ten thousand independent draws from the routine lane, targets: [routine-spread], color: blue }
          - { id: bias-gap, phrase: Follow the gap to the whole population's rate, targets: [bias-distance], color: yellow }
      - say: "A prior moves the estimate for a different reason. With a Beta two-two prior, one success in five gives a Beta three-six posterior. Its mode, the peak of the green curve, is two sevenths. Its mean lies a little farther right, at three ninths. Both use the same five observed labels. Say which summary you used and name the prior. Wilson's adjusted midpoint comes from a score test."
        hold: 0.8
      - say: "For calibration, we set aside outcomes from one score bucket. The interval around its observed rate includes the forecast. The other buckets are still empty. Choose your bins before inspecting outcomes. If you search many bins for a gap, account for those multiple comparisons. Sampling variation, ambiguous labels and unfamiliar traffic each need their own check. You may hear ambiguity called aleatoric uncertainty and lack of knowledge called epistemic uncertainty."
        hold: 0.8
  - id: missing-label-transfer
    title: Which denominator goes with each claim?
    visual: Sixty cases stay on the tray. The bracket closes around forty-five reviewed cases, then expands to include fifteen sealed envelopes. Each extreme assignment has its own calculation.
    beats:
      - say: "Here is another tray. Nine pink, thirty-six blue, fifteen still sealed. What fraction of the resolved cases went to a specialist? Among all sixty, what's the lowest fraction that could need one? What's the highest?"
        hold: 3
      - say: "Close the bracket around the reviewed cases. Nine out of forty-five is twenty percent. We can make that claim while the last row is still sealed. Now include all sixty. Suppose the fifteen envelopes are all routine. Nine out of sixty is fifteen percent. Suppose every sealed case needs a specialist. Twenty-four out of sixty is forty percent. Those are the limits of what could already be in our tray. A confidence interval for the queue answers a different question."
        hold: 1
        visual_cues:
          - { id: transfer-resolved, phrase: Close the bracket around the reviewed cases, targets: [transfer-tray] }
          - { id: transfer-share, phrase: twenty percent, targets: [transfer-tray, transfer-count], caption_boundary: true }
          - { id: transfer-scope, phrase: Now include all sixty, targets: [transfer-tray] }
          - { id: transfer-none, phrase: Suppose the fifteen envelopes are all routine, targets: [transfer-count] }
          - { id: transfer-low, phrase: fifteen percent, targets: [transfer-tray, transfer-count], caption_boundary: true }
          - { id: transfer-all, phrase: Suppose every sealed case needs a specialist, targets: [transfer-count] }
          - { id: transfer-high, phrase: forty percent, targets: [transfer-tray, transfer-count], caption_boundary: true }
  - id: report
    title: Make the decision, then uncover the week
    visual: The first hundred IDs are part of the fixed sample of four hundred. The magnified upper endpoint settles just below the staffing marker. The decision precedes the census. A bracket measures the remaining capacity.
    beats:
      - say: "The first hundred reviews gave us the gray interval. It crosses the staffing line. The three unopened stacks belong to the same random draw. Review the remaining three hundred IDs. That completes our planned sample. Four hundred out of a hundred thousand is small enough for the binomial approximation here. Across all four hundred, sixty-four need a specialist. The dot is still at sixteen percent. Follow the right-hand cap into the magnified scale. The pink mark is the regular team's limit. Which shift does our rule call for?"
        hold: 2.5
        visual_cues:
          - { id: planned-audit, phrase: Review the remaining three hundred IDs, targets: [planned-audit], color: blue }
          - { id: final-interval, phrase: sixty-four need a specialist, targets: [final-interval], color: green, caption_boundary: true }
          - { id: inspect-cap, phrase: Follow the right-hand cap into the magnified scale, targets: [upper-zoom], color: green }
      - say: "The cap stops just short of twenty percent. The regular team can cover even the upper end of the interval. Under the rule we set before review, we choose regular staffing. Save the count and its interval with the schedule. Include how the team drew the messages and reviewed them independently. How much of that capacity did the team actually use?"
        hold: 2
        visual_cues:
          - { id: read-cap, phrase: The cap stops just short of twenty percent, targets: [upper-zoom], color: green, caption_boundary: true }
          - { id: staffing-choice, phrase: choose regular staffing, targets: [staffing-choice], color: green, caption_boundary: true }
      - say: "Eighteen thousand of its hundred thousand messages went to a specialist. Fill the regular team's capacity with those cases. Two thousand places stayed open. In sampling and simulation, we'll choose a model for the incoming messages and draw whole weeks from it. How often would the team need that extra shift?"
        hold: 1.2
        visual_cues:
          - { id: week-outcome, phrase: Eighteen thousand of its hundred thousand messages went to a specialist, targets: [week-outcome], color: yellow, caption_boundary: true }
          - { id: fill-capacity, phrase: Fill the regular team's capacity with those cases, targets: [capacity-payoff], color: yellow }
          - { id: capacity-payoff, phrase: Two thousand places stayed open, targets: [capacity-payoff], color: green, caption_boundary: true }
          - { id: handoff, phrase: In sampling and simulation, targets: [next-lesson], color: blue }
